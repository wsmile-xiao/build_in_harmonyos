# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "0.10.4"
software: "srpc"
status: built
build_date: "2026-10-01"

# 上游信息
upstream:
  homepage: "https://github.com/sogou/srpc"
  url: "https://github.com/sogou/srpc/archive/refs/tags/v0.10.4.tar.gz"
  sha256: "7fb90d40263b5fbabf616a963096ee70c8768722a534d55862dd4f50675a0024"
  license: "Apache-2.0"
  lang: "cpp"

# 构建系统
build_system: cmake
compiler: clang 15.0.4 (aarch64-linux-ohos, musl, libc++)
build_type: Release

# 依赖（W0 实测已发布到制品仓）
dependencies:
  - name: workflow
    version: "1.1.0"
    scope: required   # C++ 异步网络引擎；公共头 include <workflow/WFTask.h>（transitive_headers）
  - name: protobuf
    version: "3.17.3"
    scope: required   # RPC 消息序列化 + protoc 插件宿主（transitive_headers）
  - name: openssl
    version: "3.5.6"
    scope: required   # https/TLS（transitive_headers）
  - name: snappy
    version: "1.2.2"
    scope: required   # RPCCompressSnappy；公共头 include "snappy.h"
  - name: lz4
    version: "1.10.0"
    scope: required   # RPCCompressLz4；公共头 include "lz4.h"
  - name: zlib
    version: "1.3.1"
    scope: required   # RPCCompressGzip / RPCCompressZlib；公共头 include <zlib.h>
  - name: gtest
    version: "1.17.0"
    scope: test       # 上游 test/ 单测（build_requirements）

# 上游构建产物
artifacts:
  - lib/libsrpc.a
  - lib/libsrpc.so.0.10.4（SONAME libsrpc.so.0）
  - bin/srpc_generator（protoc 插件，上游自带）
  - include/srpc/*.h

# 补丁
patches: []

# 测试结果
test:
  upstream:
    framework: gtest
    suites: 2
    total: 8
    passed: 8
    failed: 0
    detail: >
      test/unittest.cc 6 项（SRPC、SRPCHttp、BRPC、Thrift、ThriftHttp、
      SRPC_COMPRESS，含 127.0.0.1 回环 RPC 与四种压缩算法）、
      test/var_unittest.cc 2 项（GaugeVar、TimedGaugeVar）；
      由 conanfile.py build() 内 _run_upstream_tests 实际构建并运行，
      结果 HMBS_UPSTREAM_TEST_RESULT={"status":"passed","discovered":8,
      "executed":8,"passed":8,"failed":0,"skipped":0}
  test_package:
    result: passed
    detail: >
      消费者视角：protoc + srpc_generator 由 echo.proto 生成桩代码，用
      SRPCServer/SRPCClient 跑 127.0.0.1 同步 + 异步 RPC 往返（断言响应
      内容），并用 RPCCompressor 做 gzip/snappy/lz4 压缩往返校验，输出
      CONSUMER_TEST_OK
