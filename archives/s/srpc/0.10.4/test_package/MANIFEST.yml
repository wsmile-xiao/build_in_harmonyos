# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: srpc/0.10.4
homepage: "https://github.com/sogou/srpc"

# 上游测试命令（test/ 为独立 CMake project，ctest 注册 2 个 gtest 套件）
upstream_check_command: "cd test && cmake -B build.cmake -S . && cmake --build build.cmake --target unittest var_unittest && ctest"

# conanfile.py build() 中已集成上游测试（_run_upstream_tests）
upstream_test_in_build: true
upstream_test_command: "cmake --build upstream-tests --target unittest var_unittest && ./unittest && ./var_unittest"

# 上游实际运行的测试程序（2 个 gtest 二进制，TEST() 总数 8）
upstream_tests:
  - file: test/unittest.cc
    source: test/unittest.cc
    description: "SRPC 协议 127.0.0.1 回环 RPC + thrift/brpc/trpc 编解码 + 四种压缩器（6 项：SRPC / SRPCHttp / BRPC / Thrift / ThriftHttp / SRPC_COMPRESS）"
    command: "./unittest"
  - file: test/var_unittest.cc
    source: test/var_unittest.cc
    description: "RPCVar 统计变量（GaugeVar / TimedGaugeVar，2 项）"
    command: "./var_unittest"

# test_package 中自带的测试（消费者视角：protoc + srpc_generator 生成桩代码后跑真实 RPC 往返）
test_package_tests:
  - file: src/echo_server.cc
    description: "SRPCServer(127.0.0.1:14120) 提供 Example/Example 服务端实现"
    command: "./echo_server 14120"
  - file: src/echo_client.cc
    description: "SRPCClient 同步 + 异步 RPC 往返（断言响应内容），并用 RPCCompressor 校验 gzip/snappy/lz4 压缩往返"
    command: "./echo_client 14120"

# 测试断言总数（上游 gtest TEST() 数）
assertion_count: 8
