software: sinntp
display: "sinntp (tiny NNTP client)"
description: "tiny non-interactive NNTP client: pull/push/get/list newsgroups via NNTP with plugin pipeline"
category: network
homepage: "https://jwilk.net/software/sinntp"
license: GPL-2.0-only
build_system: script

ohos_adaptation:
  key_points:
    - "纯 Python 脚本包，仅依赖标准库，无编译与第三方运行时依赖；bin/ 下脚本需 python3 解释执行"
    - "上游测试为 tests.py 单文件 unittest（14 个方法），配方 build() 内真实执行并上报 HMBS_UPSTREAM_TEST_RESULT"
    - "产物为 sinntp 及 nntp-* 入口脚本，package_type=application，提供软件级 commands.json"
  common_dependencies: []

versions:
  "1.6":
    status: built
    build_date: "2026-10-13"
    conan_ref: "sinntp/1.6"
