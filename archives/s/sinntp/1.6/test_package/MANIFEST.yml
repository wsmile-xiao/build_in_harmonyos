# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sinntp/1.6
homepage: "https://jwilk.net/software/sinntp"

# ── Upstream test inventory ──────────────────────────────────────────
# sinntp 1.6 上游测试为单文件 tests.py（unittest，14 个 test_* 方法）：
# test_split_host 7 个（domain/domain+port/ipv4/ipv4+port/ipv6/brackets/ipv6+port）、
# test_xdg 4 个（XDG_DATA_HOME unset/empty/relative/absolute）、
# test_join_lines 3 个（empty/trailing_lf/no_trailing_lf）。
# 计数口径 python_def：统计 tests.py 内 test_ 方法定义数（14）。
upstream_tests_exist: true
upstream_test_total: 14
upstream_test_count_method: python_def
upstream_test_in_build: true
upstream_test_command: "python3 tests.py -v"
upstream_check_command: "python3 tests.py -v"

upstream_tests:
  - file: tests.py
    source: sinntp-1.6/tests.py (class test_split_host)
    description: "服务端地址解析：domain/domain+port/IPv4/IPv4+port/IPv6/中括号 IPv6/IPv6+port 共 7 个 test 方法"
    command: "python3 tests.py -v"
  - file: tests.py
    source: sinntp-1.6/tests.py (class test_xdg)
    description: "XDG 数据目录回退：XDG_DATA_HOME unset/empty/relative/absolute 共 4 个 test 方法"
    command: "python3 tests.py -v"
  - file: tests.py
    source: sinntp-1.6/tests.py (class test_join_lines)
    description: "mbox 行拼接：empty/trailing_lf/no_trailing_lf 共 3 个 test 方法"
    command: "python3 tests.py -v"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sinntp.py
    description: "消费者验证安装后载荷：split_host 4 项 + join_lines 2 项 + mimify/strip_headers 2 项 + sinntp --version/--help 2 项，共 10 项检查"
    command: "python3 test_sinntp.py"

# 测试断言总数 (消费者 10 项检查)
assertion_count: 10
