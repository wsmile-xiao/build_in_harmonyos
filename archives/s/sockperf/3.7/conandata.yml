# conandata.yml — sockperf 3.7
# Upstream: mellanox/sockperf, tag 3.7 (GitHub archive)

sources:
  url: "https://github.com/mellanox/sockperf/archive/refs/tags/3.7.tar.gz"
  sha256: "fe4ee6a163024da08852aa48a2b5a9d00e372d34f0d05c3dac852df3a965eee0"

patches:
  - patch_file: "patches/0001-Makefile.am.patch"
    patch_description: "Drop 'version' from dist_doc_DATA: the shipped root-level version file shadows libcxx's <version> header (-I. precedes the SDK include path), breaking every C++ TU"
    patch_type: "portability"
  - patch_file: "patches/0002-src-defs.h.patch"
    patch_description: "Replace TR1 <tr1/unordered_map> with <unordered_map> plus a std::tr1 compatibility alias for unordered_map/hash (libcxx-ohos ships no TR1 headers); hash specializations stay in namespace std; -std=c++14 keeps the remaining legacy constructs valid"
    patch_type: "portability"
  - patch_file: "patches/0003-src-os_abstract.cpp.patch"
    patch_description: "OHOS musl declares no pthread_setaffinity_np; use the equivalent sched_setaffinity(0, ...) which targets the calling thread"
    patch_type: "portability"
  - patch_file: "patches/0004-src-ticks.h.patch"
    patch_description: "Include <sys/time.h> unconditionally: musl <time.h> does not define struct timeval (upstream guarded it to FreeBSD only)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-vma-redirect.cpp.patch"
    patch_description: "Include <stdio.h> directly: sscanf/sprintf are not declared by the transitive includes under musl"
    patch_type: "portability"
