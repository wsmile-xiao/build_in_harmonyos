# 版本级 manifest
# 文件位置: archives/s/sockperf/3.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "3.7"
software: "sockperf"

# built = 构建验证完成（制品上传确认后才升 published）
status: built

build_date: "2026-09-20"
build_system: "autotools"

source:
  url: "https://github.com/mellanox/sockperf/archive/refs/tags/3.7.tar.gz"
  sha256: "fe4ee6a163024da08852aa48a2b5a9d00e372d34f0d05c3dac852df3a965eee0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--prefix=<conan package_folder>"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.am.patch"
  - "0002-src-defs.h.patch"
  - "0003-src-os_abstract.cpp.patch"
  - "0004-src-ticks.h.patch"
  - "0005-src-vma-redirect.cpp.patch"

upstream_tests:
  command: "无（上游无自动化测试：tests/Makefile.am 仅 test_SCRIPTS 安装声明，无 TESTS/check_PROGRAMS 注册，make check 为 no-op）"
  test_count: 0
  notes: "N_static=0 按注册口径；tests/ 下 6 个人工基准脚本需独立服务器 IP 对端环境且绑定 Mellanox VMA 私有栈变量，交叉单机不可整体复现"

test_package:
  assertion_count: 4
  description: "以库使用者身份运行打包产物：TCP 回环启动 sockperf server，ping-pong -i 127.0.0.1 --time 2 实测往返延迟；断言 server 存活、客户端退出码 0、Summary 汇总存在、Total observations > 0"

knowledge_gained:
  - "tag 归档缺 build/current-version：configure.ac esyscmd 读它定版本，构建期补写版本串后再 autoreconf"
  - "自举包用 tool_requires automake/1.18+libtool/2.5.4 + 构建期 autoreconf -fi（abiword/argp 合入模式）"
  - "backtrace() 由 OHOS musl libc 原生提供，AC_SEARCH_LIBS([backtrace],[execinfo]) 直接命中 libc，无需 libexecinfo"
  - "E114 umask 077 与 E386 profile SHELL 钉死 hnp bash 的构建期修复同 toppred/trf（§12.70①/§12.73③）"
