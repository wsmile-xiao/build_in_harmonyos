# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sockperf/3.7
homepage: "https://github.com/mellanox/sockperf"

# 上游测试命令
upstream_check_command: "（上游无 make check 注册测试；tests/ 为人工对端基准脚本）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无任何 automake TESTS/check_PROGRAMS 注册（tests/Makefile.am 仅把脚本
# 作为 test_SCRIPTS 安装）。tests/ 下 6 个测试资产（avner-test.sh、
# avner-master-test.sh、vma_multiplexers_test.sh、vma_perf_envelope.sh、
# avner-analyze.awk、avner-test-orig）均为需要独立服务器 IP 的人工对端
# 基准脚本（avner-master-test.sh 用法即 `$0 <Server-IP>`），且绑定
# Mellanox VMA 私有栈变量，交叉单机环境不可整体复现——按实测口径申报为
# 上游测试资产而非已注册用例；行为覆盖由消费者回环测试补位（R34）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：启动打包后的 sockperf server（TCP 回环随机高位端口），以 sockperf ping-pong 对 127.0.0.1 实测 2 秒往返延迟，断言客户端退出码 0、Summary 汇总存在、实测调用数大于 0，共 4 处断言"
    command: "bash test.sh (conanrun env)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
