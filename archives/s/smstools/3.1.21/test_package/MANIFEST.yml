# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 要求存在；口径见 docs/TEST_QUALITY_SPEC.md）

package: smstools/3.1.21
homepage: "https://smstools3.kekekasvi.com/"

# 上游是否带自动化测试：否
# 清点证据（smstools3-3.1.21 源码包）：
#   - 顶层 Makefile 目标: compile / install / uninstall / clean / package（无 check/test）
#   - src/Makefile 目标: all / smsd / clean（无 check/test）
#   - src/ 共 14 个 .c，全部为产品代码，无测试框架、无测试注册入口
#   - 唯一的 *test* 文件是 scripts/smstest.php：需要运行中的 smsd + 实体 GSM modem
#     才能发短信的 PHP 演示脚本，不是可自动执行的测试用例
upstream_has_tests: false
upstream_test_framework: ""
upstream_test_files: []
upstream_test_command: ""
upstream_check_command: "make -n check  # *** No rule to make target 'check'"
upstream_test_in_build: false

test_adaptation_notes: >
  smstools3 上游不带自动化测试套件（Makefile 无 check 目标，src/ 无测试注册入口），
  故本 PR 的上游用例数为 0，由 test_package 的消费者测试补位（R34/R51）。
  smsd 的守护功能依赖实体 GSM modem，测试断言选取不依赖 modem 的确定性行为：
  帮助输出、GSM 7bit packed 编解码（-E/-D，直接覆盖上游 pdu.c 的编码表）、
  以及配置文件缺失时的错误路径。测试脚本以使用者身份运行打包产物 bin/smsd，
  用退出码与断言结果决定成败，不是只打印字符串的空壳。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_smstools.sh
    description: "运行 bin/smsd 断言帮助输出、GSM 7bit 编解码往返与配置文件错误路径"
    command: "sh test_smstools.sh <package_folder>/bin/smsd <build_folder>"

# 断言总数（1 个消费者测试程序，8 条断言）
assertion_count: 8
