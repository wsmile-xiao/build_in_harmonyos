# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.1.21/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.1.21"

# 软件名
software: "smstools"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://smstools3.kekekasvi.com/packages/smstools3-3.1.21.tar.gz"

  # 源码校验和
  sha256: "a26ba4c02b16f6cf13177bffca6c9230dc5fefaeba8e3030cd4e4905f6a92084"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "老代码 tentative definition 全局变量在 clang>=10 默认 -fno-common 下被 lld 判 duplicate symbol，用 tc.extra_cflags.append('-fcommon') 修复，无源码补丁（alex4/arpalert 同族）"
  - "上游 Makefile 用普通赋值写 CFLAGS，命令行传参会整体覆盖它，必须把 NUMBER_OF_MODEMS/NOSTATS/_FILE_OFFSET_BITS 一并传入；缺 NOSTATS 时链接规则会执行 mm-config（CI/设备上都没有）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
