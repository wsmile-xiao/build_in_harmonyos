# test_package/MANIFEST.yml — stats/3.4.0
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md.

package: stats/3.4.0
homepage: "https://github.com/kthohr/stats"

# Upstream has no build system at the repo root. Tests are 84 standalone
# .cpp programs under tests/{dens,prob,quant,rand}: `tests/setup` copies
# test_setup/configure.in + Makefile.in into each suite, then each suite is
# built with `./configure && make` and every resulting *.test executable is
# run. The recipe reproduces this in build() via a generated CMake driver.
upstream_check_command: "cd tests && ./setup，随后逐套件 (cd dens && bash ./configure -s && make)，运行全部 *.test"
upstream_test_in_build: true
upstream_test_command: "generated CMake driver compiles all 84 tests/{dens,prob,quant,rand}/*.cpp and runs each executable (STATS_ENABLE_STDVEC_WRAPPERS, gcem/1.18.0 headers)"
upstream_test_count: 84
upstream_test_cases_skipped: 0
upstream_test_cases_skip_reason: "无整程序跳过。条件编译说明：矩阵包装器分支（arma/blaze/eigen）在上游默认配置（configure 不带 -l）下本来就不编译，本次与其保持一致；rand 套件为统计抽样打印（均值/方差应接近理论值），上游无硬断言，以退出码为准。"

