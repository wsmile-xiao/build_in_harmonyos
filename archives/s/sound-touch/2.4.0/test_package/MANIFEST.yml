# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sound-touch/2.4.0
homepage: "https://www.surina.net/soundtouch/"

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# SoundTouch 源码包无自动化测试套件 (make check 无实际测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: main.cpp
    description: "创建 SoundTouch 对象, 调用 setSampleRate/setTempoChange/getVersionString 验证库链接和 API 可用性"
    command: "./test_sound_touch"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
