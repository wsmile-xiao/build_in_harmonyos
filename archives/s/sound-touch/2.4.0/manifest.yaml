software: sound-touch
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型 (G4 门禁要求)
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-14"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方源)
  url: "https://www.surina.net/soundtouch/soundtouch-2.4.0.tar.gz"

  # 源码校验和
  sha256: "3dda3c9ab1e287f15028c010a66ab7145fa855dfa62763538f341e70b4d10abd"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # CMake 选项
  configure_options:
    - "-DNEON=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 链接器标志
  ldflags:
    - "-lclang_rt.builtins"

# ============================================================
# 补丁信息
# ============================================================

# CMake 构建不需要补丁，平台适配通过 CMake 选项和链接器标志处理
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS aarch64 需要 -lclang_rt.builtins 解决 __powidf2 符号 (ref: E098)"
  - "NEON 优化在 OHOS aarch64 上需要禁用 (-DNEON=OFF) (ref: E099)"
  - "切换到 CMake 构建避免 CI worker 缺少 automake/aclocal"
  - "HMDFS 文件系统下 autoreconf 生成的 configure 包含 umask 077 (仅 autotools 构建，CMake 不受影响) (ref: E100)"
