# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: simulavr/1.0.0-git20160221.e53413b
homepage: "https://www.nongnu.org/simulavr/"

# 上游测试入口 — regress/ 回归套件，由 `make check` 驱动
# (regress/Makefile.am: regression 目标执行 `$(PYTHON) ./regress.py`)。
# regress.py 启动刚构建出的 src/simulavr（-g -G gdb-server 模式），
# 通过 localhost gdb remote 协议驱动其执行 AVR 指令。
upstream_check_command: "make check"

# conanfile.py build() 中已集成上游测试（autotools.make(target=\"check\")）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试清点（W1，本机逐一 import 验证）：
# - regress/test_opcodes/：78 个 test_*.py 模块，每个模块用模板在 import 期
#   生成大量 test_* 类；Python 3 下实测共展开 14706 个测试用例，0 个导入错误。
# - regress/{avrtest,gtest,timertest,extinttest,modtest}/：需要 avr-gcc/avr-libc
#   交叉工具链（生成 AVR 目标固件）或 iverilog/tcl 等，上游 configure 在缺少
#   avr-gcc 时不启用（USE_AVR_CROSS=false），本环境不可运行。
# - 上游套件为 Python 2；patch 0004 将 regress/ 移植到 Python 3 后 make check
#   才能在 Python 3 环境解析并运行（原树 120 个文件中 85 个无法被 Python 3
#   字节编译；移植后 118/120，剩余 2 个属 modtest/ 且需 avr-gcc，本就不被采集）。
#
# 实际运行结果（本机前缀验证已做，真机 make check 待 shadow CI）：
# - 本机（OHOS clang 15 交叉编译 + libsim.a 归档 + 消费者链接）已验证编译链可用；
# - make check 的真实通过数需在真机 / shadow CI 上执行后回填（R51），
#   当前如实标注为"未运行"，不以收集数冒充通过数。
upstream_tests: []
