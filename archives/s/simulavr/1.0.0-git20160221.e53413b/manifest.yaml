version: "1.0.0-git20160221.e53413b"
software: simulavr
status: built  # 真机 shadow CI 全绿（L0/L1/L2/L5 pass，上游套件 0 失败）
build_date: "2026-09-27"
build_system: autotools
conan_ref: "simulavr/1.0.0-git20160221.e53413b"

source:
  # 上游 savannah 未为该提交发布 release tarball；使用 Debian pool 的 pristine
  # orig 归档（内容与上游 e53413b 逐字节一致，不含 Debian 打包改动）。
  # 详见 conandata.yml 顶部说明与 notes.md 的"源码来源"小节。
  url: "https://deb.debian.org/debian/pool/main/s/simulavr/simulavr_1.0.0+git20160221.e53413b.orig.tar.xz"
  sha256: "6459b370613374d3326ad7314d4b01b58f46a7451be068f326942cf8e408a38d"
  tar_format: tar.xz
  # 归档顶层是平铺的上游源码树（无单一根目录）
  strip_root: false
  upstream_commit: "e53413b230637b75e1cfa5c316e988480f5cea14"
  upstream_commit_date: "2016-02-21"

build:
  system: autotools
  bootstrap: "preconf/ (autoreconf -fi generated, committed)"
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-tcl"
    - "--disable-python"
    - "--disable-verilog"
    - "MAKEINFO=true"
  dependencies: []
  build_tool_dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-avrfactory-add-map-include.patch"
  - "0002-avrmalloc-add-stddef-include.patch"
  - "0003-gdbserver-qualify-bind.patch"
  - "0004-regress-python3-port.patch"

knowledge_gained:
  - "原始 savannah 源码树不含 configure/config.guess/config.sub/ltmain.sh，autotools 项目需 autoreconf -fi 引导"
  - "libc++ 不做传递包含：声明 std::map 成员的公开头必须自己 #include <map>；用 size_t 的头必须 #include <stddef.h>"
  - "using namespace std 下裸调 POSIX bind() 会被 C++ std::bind 模板抢走重载解析，须写作 ::bind"
  - "上游 regress/ 回归套件为 Python 2，需移植到 Python 3 才能 make check；其中整除需显式 //"
  - "configure.ac 缺 makeinfo 时 AC_MSG_ERROR 硬失败，CI 无 texinfo 时注入 MAKEINFO=true 跳过文档生成"
  - "AVR 设备经 AVR_REGISTER 静态构造器自注册；静态链接 libsim 必须 -Wl,--whole-archive（固化在 preconf/src/Makefile.in），否则设备注册对象被丢弃"
  - "OHOS musl 忽略 DT_RUNPATH 且 CI L2 不设 LD_LIBRARY_PATH，故 simulavr CLI 必须静态自包含"
