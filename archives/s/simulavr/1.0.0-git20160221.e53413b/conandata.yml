# conandata.yml — simulavr 1.0.0-git20160221.e53413b
#
# 源码 = 上游 savannah git 提交 e53413b230637b75e1cfa5c316e988480f5cea14
# （2016-02-21，"Bugfix: init value for stackpointer to RAMEND ..."），
# 也就是 Debian 版本号 1.0.0+git20160221.e53413b 所对应的快照。
#
# 上游 savannah 没有为这个提交发布 release tarball（savannah 下载区最新的
# simulavr-1.0.0.tar.gz 是 2012 年的 tag release-1.0.0，不含 2016 的修复；
# cgit 快照端点 2026-09 实测返回 400/502，不可用）。因此本包使用 Debian
# pool 的 pristine orig 源码归档（下游托管，内容与上游 e53413b 逐字节一致，
# 不含 Debian 打包改动），做法与 nicovideo-dl / cppnumericalsolvers 先例一致。
#
# 归档解压后为平铺的上游源码树（顶层直接是 configure.ac / src / regress ...，
# 没有单一根目录），故 conanfile.py 的 get() 使用 strip_root=False。
#
# 本文件只允许出现这一处 URL：CI 预下载阶段会按 conandata.yml 里出现的每个
# URL 做 str.replace 改写为 file:// 缓存路径，注释里的额外 URL 会被误当作
# 下载源（见知识库 DRAFT-8543-conandata-comment-url-predl-rewrite）。
sources:
  url: "https://deb.debian.org/debian/pool/main/s/simulavr/simulavr_1.0.0+git20160221.e53413b.orig.tar.xz"
  sha256: "6459b370613374d3326ad7314d4b01b58f46a7451be068f326942cf8e408a38d"

patches:
  - patch_file: "patches/0001-avrfactory-add-map-include.patch"
    patch_description: "avrfactory.h: add missing <map> include (libc++ does not transitively include it; the class declares a std::map member)"
    patch_type: "portability"
  - patch_file: "patches/0002-avrmalloc-add-stddef-include.patch"
    patch_description: "avrmalloc.h: add missing <stddef.h> include (header uses size_t in its prototypes without including the defining header)"
    patch_type: "portability"
  - patch_file: "patches/0003-gdbserver-qualify-bind.patch"
    patch_description: "cmd/gdbserver.cpp: qualify the POSIX socket bind() call as ::bind to avoid the C++ std::bind overload winning name lookup under using namespace std"
    patch_type: "portability"
  - patch_file: "patches/0004-regress-python3-port.patch"
    patch_description: "regress/: port the upstream Python-2 test harness and test_opcodes suite to Python 3 so make check can run it (print function form, configparser, except-as, bytes/memview handling; integer division in test_RET/test_RETI made explicit as //). Adapted from the Debian packaging patch series for this snapshot"
    patch_type: "portability"
