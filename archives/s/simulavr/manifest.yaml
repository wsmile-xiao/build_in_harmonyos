software: simulavr
display: "SimulAVR"
description: "AVR 单片机模拟器（libsim 仿真库 + simulavr gdb-server 命令行）"
category: simulator
license: GPL-2.0-or-later
homepage: https://www.nongnu.org/simulavr/
repository: https://git.savannah.nongnu.org/cgit/simulavr.git
keywords:
  - avr
  - simulator
  - emulator
  - gdb
  - embedded

ohos_adaptation:
  key_points:
    - "源码树不含预生成 configure：随配方提供 preconf/（autoreconf -fi 产物），build 时覆盖到源码树（设备无 automake 且 HMDFS 拒绝执行脚本）"
    - "avrfactory.h / avrmalloc.h 在 libc++ 下缺自洽头文件包含（<map> / <stddef.h>）"
    - "cmd/gdbserver.cpp 在 using namespace std 下裸用 bind() 命中 std::bind，需限定 ::bind"
    - "上游 regress/ 回归套件为 Python 2，需移植到 Python 3 才能 make check"
    - "configure.ac 缺 makeinfo 时硬失败，CI 无 texinfo，注入 MAKEINFO=true 跳过文档"
    - "AVR 设备静态自注册：静态链接 libsim 必须 -Wl,--whole-archive（固化在 preconf/src/Makefile.in）"
  common_dependencies: []

versions:
  "1.0.0-git20160221.e53413b":
    status: built
    build_date: "2026-09-27"
    patches: 4
    build_system: autotools
