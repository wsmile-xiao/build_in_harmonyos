package: shmdata/1.3.74
homepage: "https://gitlab.com/nicobou/shmdata"
upstream_check_command: "ctest --output-on-failure -j1"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1; 16 registered core tests"
upstream_tests:
  - "tests/CMakeLists.txt: 14 C++ IPC, socket, parser and stress cases"
  - "tests/CMakeLists.txt: two shell-driven sdflow/sdcrash cases"
test_package_tests:
  - file: test.cpp
    description: "Installed library type parser returns the expected media type and properties"
    command: "./test_shmdata"
assertion_count: 3
