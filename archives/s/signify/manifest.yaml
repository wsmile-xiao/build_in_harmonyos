software: signify
display: "Signify"
description: "Random signature generator for mail/news - generates semi-random signatures from rules"
category: utility
homepage: "http://signify.sf.net"
license: public-domain
build_system: makefile
ohos_adaptation:
  key_points:
    - "Perl script only, no compilation; Makefile perlcheck uses which perl and sed shebang rewrite"
    - "OHOS adaptation: use system perl at /data/service/hnp/bin/perl (avoids conan perl 5.42.2 ABI mismatch with XS modules like IO.so: Perl_croak_nocontext symbol not found, see apertium notes); install via copy not Makefile umask logic"
    - "No upstream test suite (only examples); declared as no_tests with structured audit, upstream_check_command is empty"
    - "Test_package unsets PERL5LIB to avoid conan perl pollution when using system perl; re-emits HMBS no_tests marker for cache-hit case"
  common_dependencies:
    - perl (system perl at /data/service/hnp/bin/perl on OHOS, not conan package)
versions:
  "1.14":
    status: built
    build_date: 2026-09-20
    notes: "Initial HarmonyOS adaptation 1.14, Perl script install, 2 test_package checks + no upstream tests"
