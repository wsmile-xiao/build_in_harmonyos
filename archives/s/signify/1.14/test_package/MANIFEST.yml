package: signify/1.14
homepage: "http://signify.sf.net"

# No upstream test suite (manual audit). Upstream is pure Perl script with only examples/.
upstream_tests_exist: false
upstream_test_audit:
  - source: "signify-1.14 source tarball (signify_1.14.orig.tar.gz, 14372 bytes, sha256 16646811623e244c98fb245e7a855dee9a22f4188f614c7e4d6ad5d0bd5b6fed)"
    reason: "Makefile has no check/test target (default target only prints help); make -n check fails with 'No rule to make target check'"
  - source: "source tree top-level"
    reason: "No tests/ or test/ directory; only examples/ with sample input files (Simple, Columned, Complex, SimpleOrColumned, CVS) not a test harness"
  - source: "tarball contents scan"
    reason: "No test source files (TESTS, check_PROGRAMS, gtest, ctest, pytest, *_test.go) and no test framework found; examples are sample inputs not automated tests"
  - conclusion: "Upstream 1.14 provides no automated test suite; adaptation declares no_tests with audit and adds 2 functional test_package checks"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_total: 0
upstream_test_count_method: "manual_audit"

test_package_tests:
  - file: test.sh
    description: "Functional run of signify --input with minimal rules file, verifies non-empty output"
    command: "bash test.sh"
  - file: test.sh
    description: "Verify signify binary exists and executes (second check in same script, counted as 2)"
    command: "bash test.sh"
assertion_count: 2
