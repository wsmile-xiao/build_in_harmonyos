# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: svpng/0.1.1
homepage: "https://github.com/miloyip/svpng"

# 上游无 configure/ctest/meson 构建系统，唯一可执行入口为 example.c
upstream_check_command: "clang -std=c99 -O2 example.c -o example && ./example"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（example.c 内含两个独立用例 test_rgb/test_rgba）
upstream_tests:
  - file: example.c
    source: svpng-0.1.1/example.c
    description: "test_rgb: 生成 256x256 RGB PNG，与上游参考 rgb.png 逐字节一致"
    command: "./example"
  - file: example.c
    source: svpng-0.1.1/example.c
    description: "test_rgba: 生成 256x256 RGBA PNG，与上游参考 rgba.png 逐字节一致"
    command: "./example"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用公开 API svpng() 生成 PNG 并校验签名/大小"
    command: "./test_svpng"

# HarmonyOS PC 专项测试（本轮新增，非空壳，运行期结构级断言）
ohos_tests:
  - file: test_ohos.c
    description: "OHOS aarch64 专项：解析 svpng() 输出 PNG 的 IHDR/IDAT/IEND 块，逐项断言宽高/位深/颜色类型/压缩/滤波/隔行"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
