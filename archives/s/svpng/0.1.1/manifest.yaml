# 版本级 manifest — svpng 0.1.1

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.1"

# 软件名
software: "svpng"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag 归档）
  url: "https://github.com/miloyip/svpng/archive/refs/tags/v0.1.1.tar.gz"

  # 源码校验和
  sha256: "e81010fbd82c30bac21d3fa7fd08f576522086cac65aa35503413d9bf3842689"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  # svpng 为单头文件库（svpng.inc），上游无构建系统，header-only 直接打包
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "单头文件 C 库（.inc 头文件，无构建系统）适配：conanfile.py 用 header-library 类型直接打包头文件，build() 中以 OHOS 工具链编译上游 example.c 作为适配编译断言"
  - "conan-verify G1 硬性要求 conanfile.py 含 build()/export_sources()/apply_conandata_patches 三个方法签名，header-only 配方也需显式声明（空补丁场景 apply_conandata_patches 可安全调用）"
  - "GitHub 直连在本环境不可达（timeout），官方 codeload.github.com 与 ghfast.top 镜像可下载；conandata.yml 提交官方 URL，本地用镜像拉包，conan-verify 的 E017 会自动临时注入 ghfast.top 并还原"
  - "svpng() 输出为未压缩 PNG（Deflate 存储），IHDR 位深固定 8、颜色类型 RGB=2/RGBA=6；上游 example.c 输出与官方仓库参考 PNG 逐字节一致，可作为确定性校验"
