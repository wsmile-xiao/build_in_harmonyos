software: subfinder
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/homebrew/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "homebrew"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/projectdiscovery/subfinder/archive/refs/tags/v2.14.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # Go 编译配置
  build_system: go
  go_entrypoint: ./cmd/subfinder/
  go_ldflags: "-s -w -X github.com/projectdiscovery/subfinder/v2/pkg/runner.version=v2.14.0"

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go项目使用 custom 构建系统: system=custom, build_system=go, go_entrypoint 指定入口路径"
  - "Go版本注入通过 ldflags -X 实现: -X github.com/projectdiscovery/subfinder/v2/pkg/runner.version=v2.14.0"
  - "ProjectDiscovery系列Go工具版本常量在 pkg/runner/banners.go 中定义"
  - "GOPROXY=https://goproxy.cn,direct 解决中国区Go依赖下载问题"
  - "GitHub源码下载受限时使用 gh-proxy.com 镜像"
