knowledge_gained:
  - "musl/OHOS does not implement pthread_cancel, pthread_setcancelstate, pthread_testcancel — requires stub shim"
  - "Autotools build requires regenerated config.guess/config.sub with OHOS host support"
  - "shairport-sync uses AirPlay 1 (classic) protocol by default; AirPlay 2 requires additional dependencies"
  - "Trailing whitespace in Makefile.am causes patch generation noise"

patch_generation:
