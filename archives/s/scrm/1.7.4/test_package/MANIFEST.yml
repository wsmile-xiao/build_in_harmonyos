package: scrm/1.7.4
homepage: https://scrm.github.io
upstream_check_command: make check
upstream_test_in_build: true
upstream_test_command: ctest --verbose --output-on-failure
upstream_tests:
  - file: tests/unittests/test_*.cc
    source: scrm-src.tar.gz/tests/unittests
    description: All 114 registered CppUnit unit tests; unchanged upstream sources
    command: ./unit_tests
  - file: tests/algorithmtest/test_algorithm.cc
    source: scrm-src.tar.gz/tests/algorithmtest/test_algorithm.cc
    description: All 8 registered algorithm tests with unchanged seeds and sample sizes
    command: ./algorithm_tests
upstream_test_count: 122
test_package_tests:
  - file: test.py
    description: Installed CLI version, help, two loci, trees, mutations, reproducibility and invalid input
    command: python3 test.py <installed-scrm>
assertion_count: 7
