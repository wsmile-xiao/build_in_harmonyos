version: "14.9.25"
software: "s-nail"
status: built
build_date: "2026-09-22"
build_system: makefile

source:
  url: "https://ftp.sdaoden.eu/s-nail-14.9.25.tar.xz"
  sha256: "20ff055be9829b69d46ebc400dfe516a40d287d7ce810c74355d6bdc1a28d8a9"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - 'make CC=$(clang) OPT_DOTLOCK=no config（s-nail 自有 make 体系，非交互特性探测；OPT_DOTLOCK=no 关闭需要 root 权限的 setuid dotlock 辅助程序）'
    - 'make CC=$(clang) OPT_DOTLOCK=no -j1'
    - 'make CC=$(clang) OPT_DOTLOCK=no testnj（上游测试套件 mx-test.sh --check）'
  dependencies: []
  cc: clang
  cxx: ""

patches_applied:
  - file: "patches/0002-src-mx-main.c.patch"
    purpose: "OHOS 应用域 UID 无 passwd(5) 条目，getpwuid 失败即 panic；改为 LOGNAME/USER/HOME 综合身份回退"
  - file: "patches/0003-src-mx-path.c.patch"
    purpose: "HMDFS 目录属主共享映射 + umask 0077 使新建 0700 目录对自身不可访问；n_path_mkdir 创建目录时临时放宽 umask"
  - file: "patches/0001-src-mx-maildir.c.patch"
    purpose: "HMDFS 无硬链接：Maildir 投递(tmp→new)与状态迁移(new→cur)在 link() 失败时回退 rename()（同文件系统原子等价）"

knowledge_gained:
  - "s-nail 使用自有 make 体系（非 autotools）：`make config` 为全非交互特性探测，HarmonyOS 被上游 mk/make-config.sh os_setup 直接识别，无需 config.in 裁剪补丁"  # knowledge_ref: DRAFT-E665
  - "HMDFS 上进程默认 umask 0077 时 mkdir 的 0700 目录落盘为 2700（组位被剥），叠加目录属主共享映射后对创建进程自身 EACCES；修法=mkdir 调用点作用域化放宽 umask（目录内文件仍受原 umask 约束）"  # knowledge_ref: DRAFT-E665
  - "HMDFS 完全不支持硬链接（link() 恒失败）：代码级修法=link()+unlink() 语义处回退 rename()（同文件系统原子等价）；Maildir 投递与状态迁移均属此模式"  # knowledge_ref: DRAFT-E665
  - "HMDFS 不保留属主独占权限位（chmod 0600 实际落盘 0660）：依赖 owner-only 权限检查的软件特性（如 s-nail .netrc 加载）在 OHOS 上必然被安全检查拒绝，属环境限制应申报而非改弱检查"  # knowledge_ref: DRAFT-E665
  - "OHOS 应用域 UID（如 20020085）无 /etc/passwd 条目：getpwuid() 返回 NULL 在 Berkeley mail 家族是启动 panic，移植需做身份回退（LOGNAME/USER/HOME）"  # knowledge_ref: DRAFT-E665

