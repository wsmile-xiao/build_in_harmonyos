sources:
  url: "https://ftp.sdaoden.eu/s-nail-14.9.25.tar.xz"
  sha256: "20ff055be9829b69d46ebc400dfe516a40d287d7ce810c74355d6bdc1a28d8a9"

patches:
  - patch_file: "patches/0002-src-mx-main.c.patch"
    patch_description: "OHOS 应用域 UID 无 passwd(5) 条目时 getpwuid 失败导致启动即 panic（Cannot associate a name with uid）；改为从 $LOGNAME/$USER/$HOME 综合出身份回退，不再中断启动"
    patch_type: "portability"
  - patch_file: "patches/0003-src-mx-path.c.patch"
    patch_description: "HMDFS 目录属主映射为共享身份：默认 umask 0077 下 mkdir 出的 0700 目录对创建进程自身 EACCES（实测落盘 2700），Maildir 层级无法创建；n_path_mkdir 创建目录时临时放宽 umask 保证组/其他可搜索，目录内文件仍受进程 umask 约束"
    patch_type: "portability"
  - patch_file: "patches/0001-src-mx-maildir.c.patch"
    patch_description: "HMDFS 不支持硬链接（link() 恒失败）：Maildir 投递（tmp→new）与状态迁移（new→cur，link+unlink）在 link(2) 失败时回退到同文件系统等价原子语义的 rename(2)"
    patch_type: "portability"
