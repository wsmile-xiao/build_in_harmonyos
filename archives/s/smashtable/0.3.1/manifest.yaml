source:
  url: "https://github.com/ashvardanian/SmashTable/archive/refs/tags/v0.3.1.tar.gz"
  sha256: "71de1419c2cc01b0007f7118555c83f98b35d0ab9649caac51301bca8e8bc147"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DSMASHTABLE_BUILD_TESTS=ON"
    - "-DSMASHTABLE_BUILD_CUDA=OFF"
    - "-DSMASHTABLE_INSTALL=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-shared-atomic-ref-fallback.patch"
  - "0002-avl-tree-allocator-typename.patch"
  - "0003-test-format-fallback.patch"

test_results:
  type: official
  total: 9
  passed: 9
  failed: 0
  note: "上游 CMake 注册 9 个 CTest 套件（add_test；可选 CUDA 套件仅在 nvcc 存在时注册，设备与 CI 均无 nvcc，SMASHTABLE_BUILD_CUDA=OFF）。鸿蒙 PC 真机 ctest 9/9 通过、0 失败 0 跳过（2.49 s）。9 个套件内部运行时用例合计 548 个：std_set 59、avl_tree 74、wb_tree 70、partitioned 78、hash_table 28、monotonic_hash 59、snapshot_store 156、shared 18、vector 6。test_package 另做消费侧 32 项 CHECK。"

library:
  header: "include/smashtable/"
  type: "header"

knowledge_ref:
  - "DRAFT-libcxx15-missing-cpp20-atomic-ref（知识库扩展 Issue #2702）"
knowledge_gained:
  - "OHOS clang 15 的 libc++ 缺少 C++20 std::atomic_ref（libc++ 16 才实现），且 <format> 头存在但为空壳（vformat/make_format_args 全缺）。用 __cpp_lib_atomic_ref / __cpp_lib_format 特性宏守卫、以 __atomic 内建与 ostringstream 提供 fallback，可让 C++20 无锁库在 OHOS 上编译。"
