sources:
  url:
    - "https://github.com/ashvardanian/SmashTable/archive/refs/tags/v0.3.1.tar.gz"
  sha256: "71de1419c2cc01b0007f7118555c83f98b35d0ab9649caac51301bca8e8bc147"
patches:
  - patch_file: "patches/0001-shared-atomic-ref-fallback.patch"
    patch_description: "std::atomic_ref fallback over __atomic builtins when the standard library predates C++20 atomic_ref (OHOS clang 15 libc++); adds store/wait/notify_all for the lock-free vocabulary in shared.hpp"
    patch_type: "portability"
  - patch_file: "patches/0002-avl-tree-allocator-typename.patch"
    patch_description: "Explicit typename before allocator_traits<A>::template rebind_alloc<node_t>; the C++20 P0634 omission is only accepted by clang 16+, an explicit typename compiles everywhere"
    patch_type: "portability"
  - patch_file: "patches/0003-test-format-fallback.patch"
    patch_description: "print_line falls back to an ostringstream-based formatter when <format> is unimplemented (OHOS libc++ ships an empty <format> header); std::format stays in use whenever __cpp_lib_format is defined"
    patch_type: "portability"
