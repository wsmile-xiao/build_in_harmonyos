# test_package/MANIFEST.yml — smashtable/0.3.1
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md

package: smashtable/0.3.1
homepage: "https://github.com/ashvardanian/SmashTable"

# Upstream ships a CTest-registered suite of 9 test executables
# (SMASHTABLE_BUILD_CUDA=OFF, so the optional CUDA suite is not registered).
# The recipe build() compiles the full upstream CMake test matrix and runs
# ctest on-device.
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: test_std_set.cpp
    source: SmashTable-0.3.1/scripts/test_std_set.cpp
    description: "std::set reference store, ordered-container suites"
    command: "ctest -R test_std_set"
  - file: test_avl_tree.cpp
    source: SmashTable-0.3.1/scripts/test_avl_tree.cpp
    description: "AVL tree family, basic/consistency/fuzz suites"
    command: "ctest -R test_avl_tree"
  - file: test_wb_tree.cpp
    source: SmashTable-0.3.1/scripts/test_wb_tree.cpp
    description: "Weight-balanced tree family"
    command: "ctest -R test_wb_tree"
  - file: test_partitioned.cpp
    source: SmashTable-0.3.1/scripts/test_partitioned.cpp
    description: "Partitioned/locked thread-safety wrappers over every core"
    command: "ctest -R test_partitioned"
  - file: test_hash_table.cpp
    source: SmashTable-0.3.1/scripts/test_hash_table.cpp
    description: "Open-addressed hash table incl. threaded suites"
    command: "ctest -R test_hash_table"
  - file: test_monotonic_hash.cpp
    source: SmashTable-0.3.1/scripts/test_monotonic_hash.cpp
    description: "Transactional store over the open-addressed table"
    command: "ctest -R test_monotonic_hash"
  - file: test_snapshot_store.cpp
    source: SmashTable-0.3.1/scripts/test_snapshot_store.cpp
    description: "Snapshot isolation store"
    command: "ctest -R test_snapshot_store"
  - file: test_shared.cpp
    source: SmashTable-0.3.1/scripts/test_shared.cpp
    description: "Shared vocabulary: status, expected, mapping, hashing"
    command: "ctest -R test_shared"
  - file: test_vector.cpp
    source: SmashTable-0.3.1/scripts/test_vector.cpp
    description: "Basic vector container"
    command: "ctest -R test_vector"

test_package_tests:
  - file: main.cpp
    description: "Consumer instantiates reference/partitioned/locked/monotonic families through installed headers; asserts upsert/overwrite, size, contains, copy-out lookup, miss callback, commit/rollback transactions, erase_range and clear"
    command: "./test_smashtable"

upstream_test_count: 9
test_package_test_count: 1
assertion_count: 32
