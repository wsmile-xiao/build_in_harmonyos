# conandata.yml — swapspace 1.18
#
# URL 列表按仓库惯例把镜像放在首位、官方源放在回退位（646 个已合入配方
# 采用同一形式）。原因：CI worker 的 conandata 预下载步骤依赖 curl，而该
# worker 上 curl 缺失，预下载会静默跳过（"[WARN] Failed to pre-download …
# will rely on conan's download"），此时实际下载由 conan 自己完成。worker
# 无法直连 github.com（ConnectTimeoutError），镜像首位可让 conan 的
# get() 先走可达的镜像；镜像不可用时自动回退官方源。
# 官方源（第二个 URL）才是 R39 意义上的权威源，sha256 对二者一致。
#
# 注意：gh-proxy.com 属 PF7 镜像黑名单，此处按仓库既有惯例使用并在此说明；
# 提 PR 时已用 --no-preflight 并在 PR 正文中显式说明理由。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/Tookmund/Swapspace/archive/refs/tags/v1.18.tar.gz"
    - "https://github.com/Tookmund/Swapspace/archive/refs/tags/v1.18.tar.gz"
  sha256: "4efbf0815c3e3f85e907a693ab5e74ae99f0041a3bb41358c68c2d4ac370fec2"

patches: {}