# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: swapspace/1.18
homepage: "https://github.com/Tookmund/Swapspace"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# swapspace 1.18 无 automake 测试目标：Makefile.am 与 src/Makefile.am 均未声明
# TESTS / check_PROGRAMS / check-local，发布 tarball 内无 tests/ 目录、
# 无 .github/.gitlab CI 配置，故 `make check` 无任何用例可跑。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# R51 清点证据：
#   - find . -type d -name 'test*'  → 无结果（无 tests/ 目录）
#   - grep -rn 'TESTS|check_PROGRAMS|check-local' Makefile.am src/Makefile.am → 无结果
#   - tarball 内无 *.sh / *.py 测试脚本，无 CI 配置目录
# 上游确无自动化测试；其测试方式为手工运行 daemon 驱动系统内存压力。
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_swapspace.sh
    description: "真实运行 swapspace：--version/--help 输出、inspect 模式探测真实 swap 目录、配置文件解析（两个不同 swapdir 配置）、编译期默认路径字面量校验 /var/lib/swapspace、相对路径拒绝、未知选项拒绝、数值范围校验（freetarget/max_swapsize 越界）"
    command: "sh test_swapspace.sh <swapspace-bin> <swappath> <confdir>"

# 测试断言总数（test_swapspace.sh 中的 assert_* 调用；20 个断言对应 20 个
# 互不相同的参数列表，无重复断言）
assertion_count: 20
