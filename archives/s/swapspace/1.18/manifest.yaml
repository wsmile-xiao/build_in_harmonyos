# 版本级 manifest
# 文件位置: archives/{letter}/{name}/{version}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.18"

software: "swapspace"

# published | built | failed | archived
status: built

build_date: "2026-10-01"
# 上游是 autotools 项目，但发布 tarball 只含 configure.ac（无生成的
# configure），recipe 因此改走直编路径（见下方 build.system）。
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/Tookmund/Swapspace/archive/refs/tags/v1.18.tar.gz"
  sha256: "4efbf0815c3e3f85e907a693ab5e74ae99f0041a3bb41358c68c2d4ac370fec2"
  tar_format: tar.gz
  upstream_root: "Swapspace-1.18"

# ============================================================
# 构建配置
# ============================================================

build:
  # 上游为 autotools，但发布 tarball 只含 configure.ac（无生成的
  # configure），故 recipe 不用 autotools：build() 按上游自带的手写
  # src/Makefile.static 的 target/source 映射逐个调用 clang，避免引入
  # autoreconf 的 tool_requires 链（autoconf/automake/m4/perl）。
  system: makefile
  configure_options: ""
  cflags: "--std=gnu99 -O2 -Wall -DSUPPORT_LARGE_FILES -DVERSION=\"1.18\" -DDATE=\"...\" -DVARPREFIX=\"/var\" -DETCPREFIX=\"/etc\" -DPACKAGE_NAME/PACKAGE_VERSION/PACKAGE_STRING"
  # VARPREFIX/ETCPREFIX 必须是父目录：swaps.c 拼接 VARPREFIX"/lib/swapspace"，
  # opts.c 拼接 ETCPREFIX"/swapspace.conf"。传 /var 得 /var/lib/swapspace
  # （对齐 Makefile.am 的 $(localstatedir)/lib/swapspace）。
  config_h: "src/config.h.static → src/config.h（PACKAGE_* 由 -D 补齐，等价 AC_INIT）"
  dependencies: []
  cc: clang
  cxx: null

# ============================================================
# 产物
# ============================================================

artifacts:
  - "bin/swapspace"
  - "share/man/man8/swapspace.8"
  # ETCPREFIX"/swapspace.conf" 是二进制实际读取的路径，故安装到 etc/ 根下
  - "etc/swapspace.conf"
  - "licenses/COPYING"

# 上游 noinst_PROGRAMS 的 hog 内存消耗辅助程序：按 Makefile.static 编译
# 链接以保持构建忠实，但不随包安装（上游 install 目标亦不安装它）。
built_not_packaged:
  - "hog"

elf_properties:
  arch: aarch64
  type: "DYN (PIE)"
  nx: true          # GNU_STACK RW
  needed: ["libc.so"]

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试
# ============================================================

tests:
  upstream_tests: 0          # R51 清点：无 tests/、无 TESTS/check_PROGRAMS，make check 无用例
  consumer_assertions: 20
  consumer_result: "20/20 passed"
  runtime_exercised: true    # WSL binfmt_misc 注册 qemu-aarch64，aarch64 OHOS ELF 实际执行

# ============================================================
# 运行时范围
# ============================================================

runtime_scope:
  fully_functional:
    - "版本 / 帮助输出"
    - "选项表解析"
    - "配置文件解析（swappath/阈值/冷却）"
    - "数值范围校验"
    - "swap 目录文件系统探测"
  requires_linux_swap_subsystem:
    - "swap 实际创建/回收需 root + CONFIG_SWAP 内核 + 可写 swap 目录"
    - "HarmonyOS PC 未提供受支持的 swap 管理，daemon 稳态循环实用价值有限"
    - "为避免改动全局系统状态，测试不创建真实 swapfile"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "发布 tarball 只含 configure.ac 与手写 config.h.static（无 configure、无 config.h）：可直接复用 config.h.static 并用 -D 补齐 autoheader 生成的 PACKAGE_NAME/PACKAGE_VERSION/PACKAGE_STRING"
  - "VARPREFIX/ETCPREFIX 类宏必须传父目录而非最终目录：源码拼接 VARPREFIX\"/lib/swapspace\"，传 /var/lib 会编译出双重路径 /var/lib/lib/swapspace；W4 审计发现后，改为断言错误输出中的字面量 /var/lib/swapspace（仅断言返回码无法区分两个不存在的路径）"
  - "self.run() 拼接的 -D 宏若值内含空格，必须加 shell 单引号，否则被拆成多个 argv 导致 clang: no such file or directory"
  - "上游 noinst_PROGRAMS（hog，自带 main）必须独立链接，与 daemon 对象一起链接会 duplicate symbol: main"
  - "DevEco SDK sysroot 的 libc.so 是 72KB 链接期桩库（全部符号别名到同一地址），用它 nm 检查 swapon/swapoff 等会得到误导结论；须用 /opt/ohos-guest/lib 下的运行时 libc 判断符号是否为真实实现"
  - "依赖 swap 子系统的工具可在 HarmonyOS 完整编译运行，但需在 notes.md 明确 runtime scope，避免声称未验证的能力"
