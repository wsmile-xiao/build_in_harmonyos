sources:
  url: "https://github.com/andmarti1424/sc-im/archive/refs/tags/v0.8.5.tar.gz"
  sha256: "49adb76fc55bc3e6ea8ee414f41428db4aef947e247718d9210be8d14a6524bd"

patches:
  - patch_file: "patches/0001-src-main-c-headless-no-tty-portability.patch"
    patch_description: "无控制终端（headless/CI/纯管道）时 read_stdin() 的 freopen(\"/dev/tty\") 失败不再 perror+exit(-1)：非交互运行 --version/--help/管道命令从 rc=255 + stderr 杂散行改为正常退出；main() 的 nocurses 分支同步处理 f==NULL（置 quit_afterload，避免 fgetws 对 NULL 解引用），消息降为 sc_debug 以保持非交互输出契约干净"
    patch_type: "portability"
    patch_source: "本地移植（上游假定总有控制终端；Linux+pty 行为不变，仅无 tty 路径改变）"
  - patch_file: "patches/0002-src-scopen-shebang-env-no-S.patch"
    patch_description: "src/scopen shebang `#!/usr/bin/env -S bash -a` → `#!/usr/bin/env bash`：设备 /usr/bin/env 是 toybox，无 -S（实测 rc=125 Unknown option 'S'），安装后的 bin/scopen 直接无法执行；-a（allexport）对本脚本无作用"
    patch_type: "portability"
    patch_source: "本地移植（device-facts §一.16/26 同族：OHOS 上 bash shebang 需显式且不依赖 env -S）"
  - patch_file: "patches/0003-tests-ohos-valgrind-optional-env-no-S.patch"
    patch_description: "上游测试驱动适配：valgrind 缺席时跳过 memcheck 断言并打 SKIP 行（功能断言语义未改）、vallog 删除加存在性守卫（否则 set -e 提前退出、套件连 assert_end 摘要都打不出）、run_all_tests.sh 去掉 toybox env 不支持的 -S"
    patch_type: "test-adaptation"
    patch_source: "本地适配（设备无 valgrind：`conan list valgrind* -r=ohpcd` 0 条；tests/ 的功能断言语义未改动）"
  - patch_file: "patches/0004-tests-ohos-memcheck-substitute.patch"
    patch_description: "memcheck 断言替代验证（条件编译分支）：valgrind 在本设备不可运行（信号投递内核层失效，三形态复现），新增 tests/ohos-memcheck-subst 执行器 + tests/ohos-leaktrack.c（LD_PRELOAD 分配器记账 + 保守可达性分类）使泄漏 3 族/越界 3 族的 60 条上游断言行**逐字原样**执行（只换日志来源：泄漏=leaktrack 同款 memcheck 行、越界=AddressSanitizer 报告行式翻译）；未初始化 2 族（20 条）OHOS 无等价手段（无 MSan 运行时、LSan 不支持）如实打 SKIP 行；每脚本断言行总数仍为 8 条（计数口径不变）"
    patch_type: "test-adaptation"
    patch_source: "本地适配（外部审查 191644925 要求「解决依赖后真实执行上游用例」；替代工具与负向对照证据见 notes.md「memcheck 断言替代验证」）"
