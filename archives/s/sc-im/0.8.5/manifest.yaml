# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - patches/0001-src-main-c-headless-no-tty-portability.patch
  - patches/0002-src-scopen-shebang-env-no-S.patch
  - patches/0003-tests-ohos-valgrind-optional-env-no-S.patch
  - patches/0004-tests-ohos-memcheck-substitute.patch

patch_generation:
  method: manual（diff -u --label a/… b/… 对上游净源生成，可对 49adb76f 源包重复套用；
          四份补丁（0001–0004）在新解包树上 patch -p1 干跑与实跑均 rc=0）
  patches_count: 4
  why_manual: >-
    未走 refresh-patch --auto：本任务 .work 中途被 init-build 的嵌套源码误判毁过一次
    （notes.md 问题表 #1，重建后 .work 保持净源），而 refresh-patch 的规则式扫描会把 make
    生成物（gram.c / experres.h / statres.h / y.tab.h / *.o）按「.c/.h 即源码」误判为源码
    改动并逐文件重编号补丁（uncertain 文件还会触发 AI 判定交互）。手工生成 + 对净源干跑
    rc=0 可重复，且与 notes.md、conandata.yml 注释三处同源。

# ============================================================
# 知识沉淀（路径 B：DRAFT-E682 / DRAFT-E683）
# ============================================================

knowledge_gained:
  - "终端类程序无控制终端时 read_stdin() 的 freopen(\"/dev/tty\") 失败即 exit(-1)：非交互运行 --version/--help/管道命令全部 rc=255 且 stderr 多一行 Bad file descriptor，先打死 conan-verify/CI 的 L2 冒烟闸（双失败 tested=0），再让上游 assert.sh 精确比对整片失配；处置次序=改失败路径为降级 → 补 shell 兼容（env -S）→ 不可得工具可选化并显式计 SKIP，非交互驱动优先、pty 降为交叉核对"  # knowledge_ref: knowledge/drafts/DRAFT-E682-sc-im-0.8.5-headless-tty-test-drive.md
  - "valgrind 不在设备也不在档时，上游 memcheck 断言必须移出执行面：条件化 + SKIP[<suite>] 行由驱动计数；assert_iffound_notcond 对不存在的 vallog 恰好静默通过，直接置空 VALGRIND_CMD 会让 8 条未执行断言被计成 PASS（假绿面），rm *_vallog 还会在 set -e 下让套件连 assert_end 摘要都打不出"  # knowledge_ref: knowledge/drafts/DRAFT-E682-sc-im-0.8.5-headless-tty-test-drive.md
  - "可选功能靠 pkg-config --exists 探测的包：依赖不在制品仓时用 PKG_CONFIG_PATH + PKG_CONFIG_LIBDIR 双钉到 PkgConfigDeps 生成目录（LIBDIR 才排除系统默认 pc 路径），保证设备与 worker 功能面一致；禁用不能只写在注释里，要用产物自报的编译开关做 test_package 回归断言（sc-im --version 打印全部宏，-DXLSX/-DODS/-DXLSX_EXPORT 缺席即锚点）"  # knowledge_ref: knowledge/drafts/DRAFT-E683-sc-im-0.8.5-pkgconfig-libdir-optional-feature-off.md
  - "init-build 的嵌套源码提升在「根目录无构建文件」的工程上会把子目录 Makefile 当源码根（sc-im 案例：doc/grammar_yacc_tools 被提升覆盖 .orig/.work，只剩 5 个文件），与 rtklib 同族；用 OHC_INIT_BUILD_TARBALL 种子 + --strip-components=1 重建，并把 manifest.build.system 显式钉 makefile"  # knowledge_ref: knowledge/drafts/DRAFT-E628-rtklib-handwritten-makefile-multi-app-adaptation.md
  - "toybox install 只在 /system/bin，而设备 dsh 会话与 conan 继承 PATH 都不含它 ⇒ make install 报 install: No such file or directory；package() 里显式前置 /system/bin 即幂等（worker 本含该目录）"  # knowledge_ref: knowledge/drafts/DRAFT-E682-sc-im-0.8.5-headless-tty-test-drive.md

