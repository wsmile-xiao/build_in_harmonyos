# test_package MANIFEST — sc-im 0.8.5
package: sc-im/0.8.5
homepage: "https://github.com/andmarti1424/sc-im"
software: sc-im
version: "0.8.5"
test_type: cli_functional

# ── 上游官方测试 ─────────────────────────────────────────────
# 上游入口：tests/run_all_tests.sh（glob `test*.sh` 逐个执行，assert.sh 断言框架）。
# sc-im 的 src/Makefile **没有** check/test 目标（L1c 的 "no upstream make check"
# 属预期形态），上游测试只能在构建树内由驱动脚本执行，故：
#   upstream_test_in_build: false（不写进 build()，证据见 reports/upstream-tests.md）
# 计数口径：assert.sh 断言调用数（assert / assert_raises / assert_iffound_notcond），
# 11 个脚本逐文件 grep 相加 = 100（可运行 10 个 = 91，上游自禁用 test7 = 9）。
upstream_check_command: "bash run_all_tests.sh（tests/ 内，经 pty 或纯管道驱动，见 reports/upstream-tests.md）"
upstream_test_in_build: false
upstream_test_command: ""
upstream_check_count: 100

upstream_tests:
  - file: run_all_tests.sh
    source: sc-im-0.8.5/tests/run_all_tests.sh
    description: "上游唯一测试入口：glob test*.sh 逐个以 bash 执行（补丁 0003 把 /usr/bin/env -S 改为 /usr/bin/env）"
    command: "bash run_all_tests.sh"
  - file: "test1.sh..test6.sh, test8.sh, test9.sh, test-replace.sh, test-getent-range.sh"
    source: sc-im-0.8.5/tests/
    description: "10 个可运行断言套件（每脚本 1-2 条功能断言 + 8 条 valgrind memcheck 断言）"
    command: "bash <test>.sh keep-vallog"
  - file: test7.sh-temp-disable
    source: sc-im-0.8.5/tests/test7.sh-temp-disable
    description: "上游改后缀停用（tests_to_add 记载：undo/redo 恢复公式失败），glob 不再匹配 —— 计入 NOT_RUN=9"
    command: "（上游不执行）"

# ── test_package 消费者测试（7 项断言，与 test.sh 的 ok - 行一一对应）──
# 4 项上游功能/依赖复验 + 3 项鸿蒙特有（rule12 的「鸿蒙特有测试」行取本文件
# assertion_count，H10 以 test_package/ 实物回核）。
test_package_tests:
  - "--version rc=0 且输出 sc-im - version 0.8.5（headless 退出码契约，补丁 0001）"
  - "--version 自报 -DNCURSES（ncursesw 宽字符依赖接通）"
  - "--version 自报 -DXLS（libxls 依赖接通，xls 导入可用）"
  - "鸿蒙特有①: -DXLSX/-DODS/-DXLSX_EXPORT 均缺席（xlsx 族不在档 → 缺省禁用回归锚点）"
  - "鸿蒙特有②: 无 TTY 纯管道 GETNUM C2 == 81 且 rc=0（输出无杂散行）"
  - "安装树完整：bin×2 + sc-im_help + plot_* + man1 + licenses + themes"
  - "鸿蒙特有③: scopen 可执行且 rc=0（env -S shebang 在 toybox env 下不可用的回归，补丁 0002）"
assertion_count: 7

# ── 夹具 ─────────────────────────────────────────────────────
fixture_count: 1
fixture_origin: "test.sc = 上游 tests/test1.sc 的逐字节副本（sha256 ab1461e8c6b774fa3da8c9cc648cd6eb3c9c4ee2801734d458c3ae92393516b3，与上游一致；跨表公式期望 GETNUM C2 == 81）；运行期在可写工作目录生成 fixture.sc / version.out 等"
