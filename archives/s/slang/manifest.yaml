# ============================================================
# 软件基本信息
# ============================================================

# 软件名称（必须）
name: slang

# 软件描述（必须）
description: |
  S-Lang 是一个强大的解释型脚本语言库，由 John E. Davis 开发。
  提供丰富的内置函数和数据类型，支持数组、关联数组、结构体等高级数据结构，
  以及正则表达式、字符串处理、数学运算等功能。

# 软件分类（必须）
category: library

# 官方网站
website: https://www.jedsoft.org/slang/

# 许可证
license: GPL-2.0-only

# ============================================================
# 版本索引（必须）
# ============================================================

