# conandata.yml - sarg 2.4.0
# Official upstream release archive (SourceForge project "sarg").
# sha256 measured on device:
#   sha256sum ~/tmp/uc2/zhuli-5-sarg-2.4.0/dl/sarg-2.4.0.tar.gz
sources:
  url: "https://downloads.sourceforge.net/project/sarg/sarg/sarg-2.4.0/sarg-2.4.0.tar.gz"
  sha256: "b4ca0f41f6467673b4c65c6798b44a8886f08180c055eb11c37a96dfc28cb5c3"

patches:
  - patch_file: "patches/0001-cfgaux-config.guess.patch"
    patch_description: "config.guess (2015-03-04) learns the HarmonyOS triple: echo ${UNAME_MACHINE}-unknown-linux-ohos on HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0002-cfgaux-config.sub.patch"
    patch_description: "config.sub (2015-03-04) accepts the linux-ohos kernel/OS pair and the -linux-ohos OS wildcard, and stops folding -linux-ohos* into -linux-gnu*"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "preventive same-family patch only: configure builds its conftest scratch dir under (umask 077 && mktemp -d), which aide/0.19.3 and a52dec/0.7.4 needed flipped to 022 on HMDFS; not reproduced for sarg - on HMDFS the resulting dir mode is forced by the filesystem (umask 077 and 022 both yield 2771) and the follow-up cp succeeds; kept only for consistency with the repo precedent"
    patch_type: "portability"
  - patch_file: "patches/0004-util.c.patch"
    patch_description: "my_mkdir() tests existing path prefixes with access(F_OK); OHOS mounts /storage 0711 so R_OK reports EACCES on a directory that does exist and mkdir() then fails with EEXIST, which upstream treats as fatal"
    patch_type: "portability"
