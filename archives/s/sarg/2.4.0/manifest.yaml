# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 SourceForge 发布位（R39，无镜像/无 file:// 改写）
  url: "https://downloads.sourceforge.net/project/sarg/sarg/sarg-2.4.0/sarg-2.4.0.tar.gz"

  # 设备侧实测: sha256sum ~/tmp/uc2/zhuli-5-sarg-2.4.0/dl/sarg-2.4.0.tar.gz
  # 交叉核对: sha256sum ~/builds/sarg-2.4.0.tar.gz（init-build 独立下载的第二份副本，同值）
  sha256: "b4ca0f41f6467673b4c65c6798b44a8886f08180c055eb11c37a96dfc28cb5c3"

  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # AutotoolsToolchain 注入 --prefix=/ 与 prefix 变量形态的
  # --bindir/--sbindir/--libdir/--includedir/--oldincludedir；配方在 build() 里
  # 追加第二个 --prefix=<package_folder>（sarg 用 -D 把 FONTDIR/IMAGEDIR/SYSCONFDIR
  # 烧进二进制，前缀必须是包内真实落点）与 --disable-sargphp。
  # 完整命令行见 notes.md「编译步骤」。
  configure_options:
    - "--prefix=<conan package_folder> (追加在 toolchain 的 --prefix=/ 之后)"
    - "--disable-sargphp"
    - "--disable-nls"
    - "--without-gd"
    - "--without-ldap"
    - "--without-iconv"
    - "--without-pcre"
    - "--without-zlib"
    - "--without-bzlib"
    - "--without-liblzma"

  # 无 Conan 主机依赖：上游可选特性全部关闭，不链接任何系统同名库（R26/R36）。
  # bash/5.3 是 tool_requires（构建上下文 shell，E386 路由），
  # 不进入 host package_id，也不参与链接。
  dependencies:
    - "bash/5.3 (tool_requires, build context only)"

  cc: clang
  cxx: clang++

  # 必须的编译期开关（不属于 configure 参数，但缺了就链不出来）
  required_cflags:
    - "-fcommon"

  # 安装命令口径：sarg 的 Makefile 用 cp 而非 install(1)，且 $(bindir) 等
  # 已是绝对路径，所以 DESTDIR 必须显式置空，否则产物落进 <pkg><pkg>/...
  install_command: "make install DESTDIR="

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-cfgaux-config.guess.patch"  # config.guess(2015-03-04) 识别 HarmonyOS 三元组
  - "0002-cfgaux-config.sub.patch"    # config.sub(2015-03-04) 接受 linux-ohos / -linux-ohos*
  - "0003-configure.patch"            # conftest 临时目录 umask 077 -> 022（**预防性**：同族先例 aide/0.19.3、a52dec/0.7.4；本包未复现，机理实测不成立）
  - "0004-util.c.patch"               # my_mkdir() 前缀探测 access(R_OK) -> access(F_OK)

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "手写 Makefile.in（非 automake 生成、无 VPATH/$(srcdir)）的包在 Conan basic_layout 的 source/build 分目录布局下必然失败：configure 通过但 make 报 No rule to make target '<x>.c', needed by '<x>.o'；配方侧正解是让 build 目录指回源码目录做 in-tree 构建，而不是给上游 Makefile 加 VPATH"
  - "上游用 -D 把数据目录（FONTDIR/IMAGEDIR/SYSCONFDIR）烧进二进制的 CLI 应用，Conan AutotoolsToolchain 的默认 --prefix=/ 会把烧进去的路径变成 //share/... 这类包外绝对路径，运行时素材全部找不到；必须把 --prefix 覆盖为 package_folder，并让 make install 用 DESTDIR= 精确落在同一路径（包因此不可迁移，需在 notes 申报）"
  - "sarg 的 include/conf.h 用暂定定义在头里定义全局变量，clang>=10 默认 -fno-common 会在链接期炸出 ld.lld duplicate symbol（超过 error limit），必须 -fcommon"
  - "上游手写 Makefile.in 的编译规则不依赖 Makefile 自身：改了 CFLAGS 后增量 make 一个文件都不重编，仍旧拿旧 -fno-common 的 .o 去链接，症状是『加了 -fcommon 还是同样报错』"
  - "sarg 的 configure 是真 autoconf 产物（有 ac_test_CFLAGS 处理），环境变量 CFLAGS 会被正常读入 —— 与 M12（自研 configure 只认命令行 var=value）不是同一机制，不要误判"
  - "make install 的 $(bindir) 已被展开成绝对路径时，Conan 默认追加的 DESTDIR=<package_folder> 会造成路径二次拼接；需 autotools.install(args=[\"DESTDIR=\"])"
  - "OHOS 上 /storage 挂载为 0711：access(path, R_OK) 对确实存在的目录前缀返回 EACCES，任何用 R_OK 做『存在性』探测的代码在本平台都会误判（应使用 F_OK）"
  - "scripts/patch-autotools-ohos.pl 对 2015 版 config.guess 无效：它插入 GUESS=... 赋值，而该版 config.guess 全文无 GUESS 消费者（主 case 一律 echo; exit）"
  - "上游 sarg 发布树内 0 个测试程序：make check 无目标、Makefile.in 目标全集无 check/test、CMakeLists.txt 无 enable_testing()/add_test()、find -iname '*test*' 只命中 BETA-TESTERS（人名清单）"

