# test_package/MANIFEST.yml
# Upstream test declaration file (sarg 2.4.0)
# CI script (build_and_test.sh L0e) requires this file to exist.

package: sarg/2.4.0
homepage: "http://sarg.sourceforge.net/"

# What upstream offers as the canonical test entry point.
upstream_check_command: "make check"

# Nothing is wired into build(), because upstream has no tests to wire.
upstream_test_in_build: false
upstream_test_command: ""

# ---------------------------------------------------------------------------
# Upstream test inventory (R51), taken from the release tarball sarg-2.4.0.tar.gz
# (sha256 b4ca0f41f6467673b4c65c6798b44a8886f08180c055eb11c37a96dfc28cb5c3):
#
#   1. `make check` on a configured tree aborts immediately:
#        make: *** No rule to make target 'check'.  Stop.
#   2. `grep -n '^[a-zA-Z-]*:' Makefile.in` lists exactly these targets:
#        all sarg doc install uninstall TAGS clean mostlyclean distclean
#        realclean install-po uninstall-po clean-po update-po po-from-tp
#      -> there is no check/test/instcheck target.
#   3. `find . -iname '*test*' -o -iname '*spec*'` in the tarball returns a
#      single hit, BETA-TESTERS, which is a prose list of volunteer testers,
#      not a test program.
#   4. CMakeLists.txt (the alternate upstream build system) contains only
#      CHECK_INCLUDE_FILE / CHECK_C_COMPILER_FLAG style feature probes; there
#      is no enable_testing() and no add_test() anywhere in the tree.
#
# Counted upstream test programs: 0.  Counted runnable upstream test programs
# on HarmonyOS: 0.  Nothing was skipped for lack of environment.
# Therefore no upstream test executable exists to call from conanfile.py
# build(); writing `make check` there would only produce a red build.
# ---------------------------------------------------------------------------
upstream_tests: []

# Consumer-side substitute for the missing upstream suite (R34: the test has
# to actually drive the packaged binary, which it does - sarg is invoked on a
# real squid access log and the emitted HTML report is asserted on).
test_package_tests:
  - file: test_sarg.sh
    description: >-
      Feeds the packaged sarg binary a 3-record squid access log (2 users, 2
      sites, one 404) and asserts on the generated HTML report: exit code,
      parse count, success marker, --version string, top level index.html,
      date index, topsites content for both sites, per user report content,
      per user isolation (user1 must not see user2's site), siteuser reverse
      mapping, and three assertions on the compile-time baked IMAGEDIR/FONTDIR:
      no "Cannot open directory" warning, all four upstream pngs really copied
      into <output_dir>/images/ of the report, and the fonts/images shipped
      inside the package under the same absolute prefix.
    command: "sh test_sarg.sh <package>/bin/sarg <package> <workdir (temp dir, outside the archive)>"

assertion_count: 14
