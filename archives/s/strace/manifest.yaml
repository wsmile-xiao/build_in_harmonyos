software: strace
display: "strace"
description: "System call tracer for monitoring process-kernel interaction"
category: system
homepage: "https://strace.io/"
license: LGPL-2.1
build_system: autotools

ohos_adaptation:
  key_points:
    - "编译需要 --disable-mpers 禁用多架构支持"
    - "需要 config.guess（6处修改）和 config.sub（12处修改）补丁"
    - "sigreturn.c 需要 __attribute__((unused)) 修复 clang -Werror 错误"
    - "ptrace 被 SELinux adhoc_bin 域完全禁止，核心功能不可用"
  common_dependencies: []

versions:
  "6.19":
    status: built
    build_date: "2026-03-23"
