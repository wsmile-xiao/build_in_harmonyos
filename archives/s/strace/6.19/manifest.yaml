software: strace
version: 6.19
status: partial
build_system: autotools
compile_date: 2026-03-23

dependencies:
  required: []
  optional: []

build_config:
  host: aarch64-unknown-linux-ohos
  options:
    - --prefix=/storage/Users/currentUser/usr/local
    - --disable-mpers

patches_applied:
  - file: 0001-adapt-config.guess-for-harmonyos.patch
    purpose: 添加 HarmonyOS 系统识别，输出 aarch64-unknown-linux-ohos 三元组
  - file: 0002-adapt-config.sub-for-harmonyos.patch
    purpose: 添加 linux-ohos 三元组支持到 config.sub

compatibility:
  level: partial
  issues:
    - "PTRACE_TRACEME 被 SELinux 拒绝，strace 无法实际追踪进程"
  notes: "二进制编译正确，运行时受内核 SELinux 策略限制无法使用 ptrace"

test_results:
  type: manual
  passed: 1
  failed: 1
  note: "strace --version 正常；ptrace 追踪被 SELinux 拒绝 (Permission denied)"

knowledge_gained:
  - "strace 需要 --disable-mpers 禁用 m32 personality 支持（鸿蒙无 32 位程序）"
  - "ptrace 系统调用被 HarmonyOS SELinux 策略限制，strace 无法在用户空间运行"
  - "config.sub 需要在两处添加 linux-ohos 支持：basic_os 列表和 kernel-os 验证"
  - "clang 在 HarmonyOS 上对 static inline 未使用函数也报 -Wunused-function，与 gcc 行为不同，需用 __attribute__((unused)) 抑制"

references:
  - https://strace.io/
  - https://github.com/strace/strace/releases/tag/v6.19
trace/releases/tag/v6.19
