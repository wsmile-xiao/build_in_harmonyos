software: strace
version: 6.19
status: partial
build_system: autotools
compile_date: 2026-03-23

dependencies:
  required: []
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - --prefix=$HOME/usr/local
    - --disable-mpers

patches_applied:
  - file: 0001-add-harmonyos-support-to-config.sub.patch
    purpose: 在 config.sub 中添加 ohos-linux 三元组支持和 linux-ohos 内核-OS 组合验证
    lines_changed: 12
  - file: 0002-fix-unused-function-warning-in-sigreturn.patch
    purpose: 修复 sigreturn.c 中 print_sigmask_addr_size 未使用函数的编译错误（clang -Werror）
    lines_changed: 7
    note: "这不是 HarmonyOS 特有问题，而是 clang 在 aarch64/arm/x86_64 等架构上都存在。arch_sigreturn.c 在这些架构上不使用 tprintsigmask_addr 宏"
  - file: 0003-add-harmonyos-support-to-config.guess.patch
    purpose: 在 config.guess 中添加 HarmonyOS 系统识别（case 匹配、LIBC=ohos 检测、GUESS 三元组输出）
    lines_changed: 6
    note: "strace 6.19 的 config.guess 未内置 HarmonyOS 识别，需要三处修改：1) case $UNAME_SYSTEM 添加 |HarmonyOS 2) 添加 __OHOS__ 宏检测 LIBC=ohos 3) 添加 *:HarmonyOS:*:* 输出三元组"

compatibility:
  level: low
  issues:
    - "ptrace 系统调用被 SELinux 策略禁止（adhoc_bin 域），strace 无法执行实际追踪"
  notes: "编译产物正确，但 SELinux 限制了 ptrace 权限，核心功能不可用"

test_results:
  type: manual
  passed: 1
  failed: 1
  note: |
    --version: PASS ✅
    strace echo hello: FAIL ❌ (Permission denied - SELinux 限制 ptrace)
    ptrace -p: FAIL ❌ (Permission denied - SELinux 限制 ptrace)
    编译产物验证: PASS ✅ (ELF 64-bit ARM aarch64, 动态链接 musl libc)

knowledge_gained:
  - "strace 6.19 的 config.guess 未内置 HarmonyOS 识别，需三处修改：case 匹配添加 HarmonyOS、LIBC 检测添加 __OHOS__、GUESS 输出三元组"
  - "config.sub 需额外修改两处：1) ohos-linux 三元组 2) linux-ohos* 内核-OS 组合验证"
  - "aarch64 架构的 sigreturn.c 中 print_sigmask_addr_size 函数在 HarmonyOS 上未被引用，clang -Werror 报错"
  - "ptrace 被 SELinux adhoc_bin 域完全禁止，strace 无法在当前鸿蒙环境下执行系统调用追踪"
  - "sudo 无法绕过 ptrace 限制：strace 在 sudo 下触发 kill EACCES（内核安全模块主动终止进程）"
  - "setenforce 0 即使通过 sudo 也无法执行（Permission denied），/sys/fs/selinux/ 完全不可访问"
  - "LSM 安全模块路径 /sys/kernel/security/ 同样不可读，系统级安全策略无法从用户空间修改"
  - "strace 编译需要 --disable-mpers 禁用多架构 personality 支持"
  - "sigreturn.c 的 print_sigmask_addr_size 在 aarch64/arm/x86_64 等架构上未被引用，clang -Werror 会报错"

references:
  - https://strace.io/
  - https://github.com/strace/strace
