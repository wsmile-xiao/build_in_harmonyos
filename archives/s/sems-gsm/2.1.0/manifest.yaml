# 版本级 manifest — sems 2.1.0（sems-gsm，遵循 ARCHIVE-SPEC v3.0）

version: "2.1.0"
software: "sems-gsm"
status: built
build_date: "2026-09-30"
build_system: "cmake"

source:
  url: "https://github.com/sems-server/sems/archive/refs/tags/2.1.0.tar.gz"
  sha256: "f16c28917f1b92e9ec963ca28abd4612282f610276a67fa4e6346d07cffb8756"

ohos_adaptation:
  key_points:
    - "musl 无 libresolv：core/CMakeLists.txt 去掉无条件 -lresolv（res_search 在 libc）"
    - "musl 无 pthread_cancel：AmThread::cancel() 平台守卫改为协作式停止"
    - "libevent2 头文件路径未进 include path：补 include_directories(${LIBEVENT2_INCLUDE_DIR})"
    - "xmlrpc2di 捆绑 xmlrpc++ 无条件包含 openssl 头且上游守卫不完整 → EXCLUDE_APP_MODULES=xmlrpc2di（gsm 插件不需要）"
    - "SEMS_DOC_PREFIX/SEMS_RUNDIR_PREFIX 重定向到包内（默认 /usr/share /var 写不进）"
    - "SEMS_USE_PYTHON/SPANDSP/OPUS/MP3/ILBC/MONITORING=OFF（最小化 gsm 插件构建面）"

patches_applied:
  - "0001-ohos-cmake-adaptation.patch"

dependencies:
  - "libgsm/1.0.18（已发布 ohpcd，GSM 06.10 编解码，sems-gsm 插件链接）"
  - "libevent/2.1.13（已发布 ohpcd，core REQUIRED）"

knowledge_gained:
  - "musl 无 pthread_cancel（E 候选：glibc 专用线程 API 编译期守卫模式）"
  - "CMake 项目 FindXXX 找到库后未 include_directories 是上游常见缺陷"
  - "application 类型包的依赖不通过 cpp_info 传播，test_package 需显式 requires"

upstream_tests:
  registered: "core/tests 11 个 FCT 套件，FCT_TEST_BGN 共 205 处（含 sems_tests.cpp 1 处注释样例 → 有效 204）；core/CMakeLists.txt:84 ctest 注册 1 项 Tests"
  run_result: "PASSED (204/204 tests in 0.011179s)（OHOS aarch64 沙箱内直接运行 sems_tests）；CTest 聚合口径 1/1 Passed"
  evidence: "sems_tests 输出 'PASSED (204/204 tests in 0.011179s)'；ctest --output-on-failure: 100% tests passed, 0 tests failed out of 1"
