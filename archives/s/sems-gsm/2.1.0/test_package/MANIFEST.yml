# MANIFEST.yml — sems 2.1.0 (sems-gsm) test package
tested_reference: "sems-gsm/2.1.0"
test_binary: "test_sems_consumer"
test_source: "test_sems_plugin.c"
assertions:
  consumer: 14
  cli_smoke: 1
description: >
  R34 实质消费者用例：验证被测包自身产物，而非其中的依赖。
  test_sems_plugin.c 以 dlopen(gsm.so, RTLD_NOW|RTLD_GLOBAL) 加载包内
  lib/sems/plug-in/gsm.so（测试二进制自带 SEMS 核心符号 log_level/
  log_level2str/log_stderr/run_log_hooks，与 sbin/sems 运行时同机制），
  再 dlsym 插件 ABI 入口 amci_exports 与插件内 gsm_* 编解码符号，跑真实
  GSM 06.10 编码/解码往返（160 样本↔33 字节帧，容许 13-bit 量化误差）；
  conanfile.test() 另做 CLI 冒烟：运行包内 sbin/sems -v 并断言版本串。
  包内缺插件/符号改名/链接不完整都会在此失败。
covered_artefacts:
  - "lib/sems/plug-in/gsm.so（本任务目标插件：dlopen + amci_exports + 编解码往返）"
  - "lib/sems/plug-in/*.so（数量 ≥3 布局检查）"
  - "sbin/sems（存在性 + -v 版本输出）"
upstream_tests:
  registered: "sems_tests (core/tests, ctest 注册于 core/CMakeLists.txt add_test)"
  note: >
    上游单元测试随主构建在 conanfile.build() 的 _run_upstream_tests()
    中以 ctest 运行；test_package 侧再以消费者用例验证包内插件与 CLI。
