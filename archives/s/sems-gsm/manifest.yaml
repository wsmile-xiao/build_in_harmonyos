# 软件级 manifest — sems-gsm（ARCHIVE-SPEC v3.0）

software: sems-gsm
display: "SEMS (SIP Express Media Server) + GSM codec plug-in"
description: "SIP Express Media Server，含 GSM 06.10 编解码插件（core/plug-in/gsm）与 sbin 工具集"
category: telephony
homepage: "https://github.com/sems-server/sems"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "musl 无 libresolv：core 去掉无条件 -lresolv（res_search 在 libc 内）"
    - "musl 无 pthread_cancel：AmThread::cancel() 改协作式停止"
    - "libevent2 头文件路径未进 include path：补 include_directories(${LIBEVENT2_INCLUDE_DIR})"
    - "xmlrpc2di 捆绑 xmlrpc++ 无条件包含 OpenSSL 头（上游守卫不完整）→ EXCLUDE_APP_MODULES=xmlrpc2di"
    - "SEMS_DOC_PREFIX/SEMS_RUNDIR_PREFIX 重定向到包内（默认写 /usr/share、/var 不可写）"
    - "R47 语言预检首跑误判 rust（apps/monitoring/tools 下的可选 Cargo.toml，非顶层 manifest），人工复核按 cpp 适配"

versions:
  "2.1.0":
    status: built
    build_date: "2026-10-01"
    packaging: conan
    notes: "conan recipe（os=OHOS arch=armv8），依赖 libgsm/1.0.18 + libevent/2.1.13；cmake 构建；产物 sbin/ 24 个工具 + lib/sems/plug-in/39 个插件（含目标插件 gsm.so）"
    dependencies:
      - libgsm/1.0.18
      - libevent/2.1.13
