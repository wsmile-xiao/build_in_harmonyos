software: swi-prolog
version: "9.2.9"
status: built
build_date: "2026-06-02"
build_system: cmake

source:
  url: "https://github.com/SWI-Prolog/swipl-devel/archive/refs/tags/V9.2.9.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DINSTALL_DOCUMENTATION=OFF"
    - "-DSWIPL_PACKS=OFF"
    - "-DSWIPL_SHARED_LIB=OFF"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
    - "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=bfd -B/data/service/hnp/bin/"
    - "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=bfd -B/data/service/hnp/bin/ -L$HOME/usr/local/lib"
  dependencies:
    - "gmp"
    - "zlib"
    - "gettext"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-pl-cstack-add-stdio-include.patch"

knowledge_gained:
  - "HMDFS需要签名ELF后才能执行mkvmi等构建辅助工具"
  - "libgmp.a非PIC导致SWIPL_SHARED_LIB=ON失败，需用OFF"
  - "GLIBC backtrace section缺少stdio.h导致popen未声明"
