knowledge_gained:
  - "solid 6.26.0 requires C++20 (std::map::contains in src/solid/devices/frontend/device.cpp:226); the Conan toolchain pre-sets CMAKE_CXX_STANDARD=17 before project(), which defeats ECM KDECompilerSettings auto-detection, so the recipe must override compiler.cppstd to 20. (knowledge_ref: DRAFT-solid-6.26.0-conan-toolchain-cppstd17-blocks-ecm-cpp20)"
  - "On HarmonyOS CMAKE_SYSTEM_NAME is HarmonyOS, so upstream Solid falls into the 'BSDs and other Unix like systems' branch which adds the fstab backend; fstabwatcher.h unconditionally includes <libmount.h>. Upstream's own BUILD_DEVICE_BACKEND_fstab=OFF option disables it without a source patch. (knowledge_ref: E267)"
  - "HarmonyOS has no CMake platform module, so CMAKE_SHARED_LIBRARY_SONAME_*_FLAG stays empty: libKF6Solid.so ends up without DT_SONAME and bin/solid-hardware6 records the link path as DT_NEEDED. CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE plus both SONAME flags in the Conan toolchain fixes both. (knowledge_ref: E383)"
  - "Without DT_SONAME a KF6 dependency recorded in a consumer's DT_NEEDED is not relocatable, and an ELF rewrite is not usable on HMDFS, so the SONAME must be stamped at link time by the producing package. (knowledge_ref: E537)"
