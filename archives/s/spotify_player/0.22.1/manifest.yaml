software: spotify_player
version: "0.22.1"
status: published
method: precompiled_binary_gcompat
source_url: https://github.com/aome510/spotify-player/releases/download/v0.22.1/spotify_player-aarch64-unknown-linux-gnu.tar.gz
build_date: 2026-06-03
configure_options: ""
patches_applied: 0
dependencies:
  - libgcompat.so.0
  - libglibc-shim.so
  - libasound.so.2
  - libdbus-1.so.3
