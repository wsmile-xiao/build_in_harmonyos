# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: scope_guard/0.9.4
homepage: "https://github.com/Neargye/scope_guard"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -S . -B build -DSCOPE_GUARD_OPT_BUILD_TESTS=ON && cmake --build build && ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cpp
    source: scope_guard-0.9.4/test/test.cpp
    description: "上游 doctest 测试源（13 个独立 TEST_CASE，按 C++11/14/17/20 四标准构建运行，71 断言全部通过）"
    command: "./scope_guard-cpp17.t"
  - file: test/config_no_throw_action.cpp
    source: scope_guard-0.9.4/test/config_no_throw_action.cpp
    description: "SCOPE_GUARD_NO_THROW_ACTION 配置测试（1 个独立 TEST_CASE）"
    command: "./scope_guard-no-throw-action.t"
  - file: test/config_suppress_throw_action.cpp
    source: scope_guard-0.9.4/test/config_suppress_throw_action.cpp
    description: "SCOPE_GUARD_SUPPRESS_THROW_ACTION 配置测试（1 个独立 TEST_CASE）"
    command: "./scope_guard-suppress-throw-action.t"
  - file: test/compile_fail/*.cpp
    source: scope_guard-0.9.4/test/compile_fail/
    description: "6 个负向编译用例（WILL_FAIL，编译失败为预期通过）"
    command: "cmake --build <build> --target scope_guard-compile-fail-*.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_scope_guard_ohos.cpp
    description: "鸿蒙专项消费者测试：SCOPE_EXIT/make_scope_exit/fail/success 与 dismiss/move/异常路径语义，12 项运行时断言 + 编译期 static_assert（OHOS aarch64 工具链实测 12/12 通过，0 失败）"
    command: "./test_scope_guard_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 76
