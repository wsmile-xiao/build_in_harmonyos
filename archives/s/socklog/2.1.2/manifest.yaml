knowledge_gained:
  - "socklog 无 configure 脚本：src/print-cc.sh 与 src/print-ld.sh 取 conf-cc/conf-ld 的第一行作为整条命令，因此配方只需覆写这两个文件的第一行即可注入 profile 编译器与 flags。；knowledge_ref: knowledge/drafts/DRAFT-cdb-20251021-djbware-cross-safe-adaptation.md:36（conf-* 首行注入＝同一层次同一解法，本条才是真正的对齐对象）、knowledge/drafts/DRAFT-7324-bglibs-djb-two-stage-cross-build.md:21 与 :31（同族不同层次：本包 host==target 本机编译，交叉两阶段那层未触发）、动作行 notes.md:62 与 notes.md:66（print-cc.sh/print-ld.sh 以 head -n1 取整条命令的实拍 + 一等注入点结论）、notes.md:76（build() 内 save() 覆写 conf-cc/conf-ld 第一行，不改上游源码）、机制判定登记 notes.md:219"
  - "socklog 2.1.2 的 tarball 根是 admin/socklog-2.1.2/，可构建树在其 src/ 子目录，配方 source() 需把 src/* 提升到构建目录。；knowledge_ref: 动作行 notes.md:67（一手目录形 admin/socklog-2.1.2/{src,doc,man,package}，可构建树在 src/）、notes.md:99（v1 实际死因＝strip_root 半剥把 man/ doc/ package/ 留在下一层）、notes.md:267（source() 须连 man/doc/package 一起压平，照抄 runit 会错）、notes.md:235（L3 版本笔记①三层嵌套）；knowledge/graph/ 对该检索式实算 0 文件命中（计数见 notes.md:214）"
  - "socklog 自带 5 个命令（package/commands）与 5 组黄金输出自检脚本（src/*.check + src/*.dist，由 make check -> check-local 驱动），上游测试数为 5 而不是 0。；knowledge_ref: 动作行 notes.md:108（src/Makefile 的 check: default check-socklog-unix check-socklog-inet 原文）、notes.md:109（check-local 逐个跑 $i.check 并用 check-diff 与随包 .dist 逐行比对）、notes.md:110（静态分母 5＝src/*.check 5 + src/*.dist 5 对应 5 个发布命令）、notes.md:115（五维账本可执行数 5）；执行读数的一手件 archives/s/socklog/2.1.2/reports/conan-create.log:92 至 :117（该件随 PR，可直接按行号读）"
  - "socklog 有 unix/inet/ucspi 三个接收后端（非 Solaris 下无 sun_stream），/dev/log 面被限制时 inet/ucspi 仍可用，不构成能力墙。；knowledge_ref: 动作行 notes.md:180（src/socklog.c:39 的 USAGE 四后端原文）、notes.md:181（sun_stream 仅 __sun__ && __sparc__ && __unix__ && __svr4__ 分支，本机 usage 已无该项）、notes.md:183 与 notes.md:184 与 notes.md:185（unix=/dev/log、inet 127.0.0.1:12614 实收 foo、ucspi 实收 U: foo/bar/baz 的三路实测）、notes.md:187（存在可用替代后端 ⇒ 不构成唯一输出面被拦）、notes.md:154（hmdfs EPERM(1) 与 hmfs 沙箱 base 可 bind+往返的一行结论）；机制 2 判定与逐落点表抄录于 notes.md:239 与 notes.md:243（池件原件在仓外 ⇒ 本 PR 以该表为唯一判据载体）"
