package: socklog/2.1.2
homepage: https://smarden.org/socklog/

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - file: src/socklog.check
    source: socklog-2.1.2.tar.gz/src/socklog.check
    description: "socklog 接收面黄金输出自检：unix /dev/log 数据报、inet UDP、ucspi 三路"
    command: "make check"
  - file: src/socklog-check.check
    source: socklog-2.1.2.tar.gz/src/socklog-check.check
    description: "socklog-check 连通性与守护进程存活探测黄金输出自检"
    command: "make check"
  - file: src/socklog-conf.check
    source: socklog-2.1.2.tar.gz/src/socklog-conf.check
    description: "socklog-conf 生成 unix/inet/klog/ucspi 服务目录黄金输出自检"
    command: "make check"
  - file: src/tryto.check
    source: socklog-2.1.2.tar.gz/src/tryto.check
    description: "tryto 重试/超时/TERM-KILL 语义黄金输出自检"
    command: "make check"
  - file: src/uncat.check
    source: socklog-2.1.2.tar.gz/src/uncat.check
    description: "uncat 超时与最大尺寸切分语义黄金输出自检"
    command: "make check"

test_package_tests:
  - file: test_socklog.sh
    description: "验证 5 个命令由包产出、按 cpp_info.bindirs[0] 的绝对路径断言产物存在且可执行（-f/-x），并在版本/用法面（-V：rc=1 + $Id: + usage:）正确应答（10 条断言）"
    command: "sh test_socklog.sh"

assertion_count: 10
