software: SDL2_image
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.8.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.8.0"

# 编译状态
# published | built | failed | archived
status: published
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-19"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/.opendesk/apps/skills/resources/openharmony-compile-agent/downloads/SDL2_image-2.8.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-ohos-linux"
  # 注意: SDL2 >= 2.0.9 是必需依赖
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - SDL2/2.8.0  # 核心依赖，必需
  # 可选依赖:
  # - libpng/1.6.x
  # - libjpeg-turbo/2.x
  # - libtiff/4.x
  # - libwebp/1.x

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "SDL2_image 必须依赖 SDL2 >= 2.0.9，无法绕过"
    - "config.guess 在 HMDFS 上可能因 TMPDIR 问题失败，可用 --build= 绕过"
    - "CMake 构建 SDL2_image 支持 SDL2IMAGE_BACKEND_STB=ON，可用内置 stb_image 替代外部图像库"
    - "建议: SDL2 应添加到 dependencies.md 编译顺序表中"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/SDL2_image-2.8.0.orig
  source_work_dir: /storage/Users/currentUser/builds/SDL2_image-2.8.0.work
  source_orig_hash: 90782cfad9a0715c
  source_work_hash: 12ba5b47a48e928b
  generated_at: '2026-05-19T20:30:50'
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
