# test_package/MANIFEST.yml
# 上游官方测试声明文件（L0e 强制要求存在）

package: stc/5.0
homepage: "https://github.com/stclib/STC"

# 上游测试入口: make all 构建出 tests/test_all 后运行
upstream_check_command: "make all && ./bld_HarmonyOS/clang/tests/test_all"

# conanfile.py build() 未内嵌上游测试（上游测试在本地门禁中独立运行）
upstream_test_in_build: false
upstream_test_command: "./bld_HarmonyOS/clang/tests/test_all"

# 上游实际运行的测试程序（8 个 *_test.c 全部编入单一 test_all，共 33 用例）
upstream_tests:
  - file: tests/algorithm_test.c
    source: stc-5.0/tests/algorithm_test.c
    description: "algorithm 容器测试"
    command: "./bld_HarmonyOS/clang/tests/test_all"
  - file: tests/cregex_test.c
    source: stc-5.0/tests/cregex_test.c
    description: "正则 cregex 测试"
    command: "./bld_HarmonyOS/clang/tests/test_all"
  - file: tests/cspan_test.c
    source: stc-5.0/tests/cspan_test.c
    description: "cspan 多维数组测试"
    command: "./bld_HarmonyOS/clang/tests/test_all"
  - file: tests/deque_test.c
    source: stc-5.0/tests/deque_test.c
    description: "deque 双端队列测试"
    command: "./bld_HarmonyOS/clang/tests/test_all"
  - file: tests/hmap_test.c
    source: stc-5.0/tests/hmap_test.c
    description: "hmap 哈希表测试"
    command: "./bld_HarmonyOS/clang/tests/test_all"
  - file: tests/list_test.c
    source: stc-5.0/tests/list_test.c
    description: "list 链表测试"
    command: "./bld_HarmonyOS/clang/tests/test_all"
  - file: tests/smap_test.c
    source: stc-5.0/tests/smap_test.c
    description: "smap 排序映射测试"
    command: "./bld_HarmonyOS/clang/tests/test_all"
  - file: tests/vec_test.c
    source: stc-5.0/tests/vec_test.c
    description: "vec 动态数组测试"
    command: "./bld_HarmonyOS/clang/tests/test_all"

# test_package 自带的消费者视角测试
test_package_tests:
  - file: test.c
    description: "消费者测试（cstr + vec 实际调用 STC API 并链接 libstc.a）"
    command: "./test_stc"

# 测试断言总数（test_all 33 用例 + test_stc 2 组断言）
assertion_count: 35
