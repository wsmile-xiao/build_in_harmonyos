# test_package/MANIFEST.yml
# sophus 1.22.10 上游官方测试声明 (ctest, 13 项全部通过, 见 Adapt 阶段实测)

package: sophus/1.22.10
homepage: "https://github.com/strasdat/Sophus"

# 上游测试命令 (cmake 构建后 ctest)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (13/13 Passed, 实测于 Adapt 阶段)
upstream_tests:
  - file: test/core/test_common.cpp
    source: sophus-1.22.10/test/core/test_common.cpp
    description: "common 类型工具测试"
    command: "./test_common"
  - file: test/core/test_cartesian2.cpp
    source: sophus-1.22.10/test/core/test_cartesian2.cpp
    description: "Cartesian2 测试"
    command: "./test_cartesian2"
  - file: test/core/test_cartesian3.cpp
    source: sophus-1.22.10/test/core/test_cartesian3.cpp
    description: "Cartesian3 测试"
    command: "./test_cartesian3"
  - file: test/core/test_so2.cpp
    source: sophus-1.22.10/test/core/test_so2.cpp
    description: "SO(2) 李群测试"
    command: "./test_so2"
  - file: test/core/test_se2.cpp
    source: sophus-1.22.10/test/core/test_se2.cpp
    description: "SE(2) 李群测试"
    command: "./test_se2"
  - file: test/core/test_rxso2.cpp
    source: sophus-1.22.10/test/core/test_rxso2.cpp
    description: "RxSO(2) 李群测试"
    command: "./test_rxso2"
  - file: test/core/test_sim2.cpp
    source: sophus-1.22.10/test/core/test_sim2.cpp
    description: "Sim(2) 李群测试"
    command: "./test_sim2"
  - file: test/core/test_so3.cpp
    source: sophus-1.22.10/test/core/test_so3.cpp
    description: "SO(3) 李群测试"
    command: "./test_so3"
  - file: test/core/test_se3.cpp
    source: sophus-1.22.10/test/core/test_se3.cpp
    description: "SE(3) 李群测试"
    command: "./test_se3"
  - file: test/core/test_rxso3.cpp
    source: sophus-1.22.10/test/core/test_rxso3.cpp
    description: "RxSO(3) 李群测试"
    command: "./test_rxso3"
  - file: test/core/test_sim3.cpp
    source: sophus-1.22.10/test/core/test_sim3.cpp
    description: "Sim(3) 李群测试"
    command: "./test_sim3"
  - file: test/core/test_velocities.cpp
    source: sophus-1.22.10/test/core/test_velocities.cpp
    description: "速度/雅可比测试"
    command: "./test_velocities"
  - file: test/core/test_geometry.cpp
    source: sophus-1.22.10/test/core/test_geometry.cpp
    description: "几何类型测试"
    command: "./test_geometry"

# test_package 中自带的测试 (消费者视角验证, 实质调用 SO3/SE3 API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: SO3/SE3 exp-log roundtrip"
    command: "./test_sophus"

# 测试断言总数 (近似值, 上游 ctest 13 项 + 消费者 3 项断言)
assertion_count: 16