# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）
#
# 上游测试清点（R51 三步法 · 实机取证见 reports/ 与 notes.md）：
#   - 上游没有自动化测试套件：Test/Makefile.am 只声明 4 个 bin_PROGRAMS，
#     没有 TESTS= 注册；主构建目录 `make check` 输出 "Nothing to be done for 'check'."。
#   - Test/ 下 4 个程序为交互式演示（无断言、无退出码语义），
#     TestImageFilter 为批量字节数组演示（自动退出）：
#     设备上实际构建 4/4 并运行（SDL_VIDEODRIVER=dummy；3 个交互程序由
#     timeout 终止，无崩溃）。

package: sdl_gfx/2.0.7
homepage: "https://www.ferzkopp.net/Software/SDL_gfx-2.0/"

# 上游测试命令（无 TESTS= 注册，make check 为空操作）
upstream_check_command: "make check"

# conanfile.py build() 未集成上游测试（上游测试是独立子目录的手动演示程序）
upstream_test_in_build: false
upstream_test_command: "cd Test && ../configure && make && ./TestImageFilter"

# 上游实际存在的测试/演示程序
upstream_tests:
  - file: TestImageFilter.c
    source: SDL_gfx-2.0.7/Test/TestImageFilter.c
    description: "图像过滤器演示：15 字节数组逐函数对比 MMX/C 路径，自动退出（exit 0）"
    command: "./TestImageFilter"
  - file: TestGfxPrimitives.c
    source: SDL_gfx-2.0.7/Test/TestGfxPrimitives.c
    description: "图形原语交互演示（随机绘制 + 帧率统计），需显示/键盘，无断言"
    command: "./TestGfxPrimitives"
  - file: TestRotozoom.c
    source: SDL_gfx-2.0.7/Test/TestRotozoom.c
    description: "rotozoom/zoom 交互演示（加载 sample8.bmp/sample24.bmp），需显示/键盘，无断言"
    command: "./TestRotozoom"
  - file: TestFramerate.c
    source: SDL_gfx-2.0.7/Test/TestFramerate.c
    description: "帧率管理器交互演示，需显示/键盘，无断言"
    command: "./TestFramerate"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_sdl_gfx.c
    description: "消费者断言测试：filledCircleColor/lineColor 像素校验、zoomSurface/rotozoomSurface、framerate、SDL_imageFilterShiftLeft"
    command: "./test_sdl_gfx"

# 上游断言总数：0（上游演示程序不含断言；断言集中在 test_package，共 20 条 check()）
assertion_count: 0
test_package_assertion_count: 20
