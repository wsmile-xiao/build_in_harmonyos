# conandata.yml — sdl_gfx 2.0.7
# 单源真相文件: 源码 URL + SHA256 + 补丁声明（conanfile.py 通过
# self.conan_data["sources"] 与 apply_conandata_patches() 消费）
#
# 上游为 www.ferzkopp.net（A. Schiffler）。2.0.7 是官方站点仍提供的最早可用版本
# （2.0.0/2.0.1/2.0.4/2.0.5/2.0.6 无任何分发物，上游 ChangeLog 中
# "Ver 2.0.5 - n/a"），因此本配方以 2.0.7 承接原定 2.0.5 的适配目标。
# SHA256 由官方 tarball 两次独立下载比对得出。
#
# 补丁为 ohc refresh-patch --auto 生成的 Git 风格 diff（a/… b/… 前缀），
# 因此显式声明 strip: 1（apply_conandata_patches 会把条目 kwargs 透传给
# apply_patch，默认 strip=0 无法剥离前缀 — 知识条目 E515）。

sources:
  url: "https://www.ferzkopp.net/Software/SDL_gfx-2.0/SDL_gfx-2.0.7.tar.gz"
  sha256: "e2c1a74d9e22f5d84fbfe09ddf01c02cddbebcc9667bb77455b0b4d9e44b92e1"

patches:
  - patch_file: "patches/0003-config.guess.patch"
    strip: 1
    patch_description: "Teach the bundled 2001-vintage config.guess to recognize HarmonyOS (uname -s = HarmonyOS -> aarch64-unknown-linux-ohos); without it configure aborts with 'config.guess: unable to guess system type'"
    patch_type: "portability"
    patch_source: "https://www.gnu.org/software/config/"
  - patch_file: "patches/0004-config.sub.patch"
    strip: 1
    patch_description: "Accept the aarch64 CPU and the linux-ohos kernel-OS pair in config.sub (the 2001 vintage rejects both: 'machine `aarch64-unknown' not recognized')"
    patch_type: "portability"
    patch_source: "https://www.gnu.org/software/config/"
  - patch_file: "patches/0001-Test-config.guess.patch"
    strip: 1
    patch_description: "Same config.guess HarmonyOS fix for the bundled copy under Test/ (needed by Test/configure when building the upstream test programs)"
    patch_type: "portability"
    patch_source: "https://www.gnu.org/software/config/"
  - patch_file: "patches/0002-Test-config.sub.patch"
    strip: 1
    patch_description: "Same config.sub aarch64/linux-ohos fix for the bundled copy under Test/"
    patch_type: "portability"
    patch_source: "https://www.gnu.org/software/config/"
