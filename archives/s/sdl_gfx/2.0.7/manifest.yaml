# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "SDL_gfx 2.0.x 的 config.guess/config.sub 是 2001-01-17/2001-01-12 版：configure 直接 abort（config.guess: unable to guess system type），config.sub 还要额外补 aarch64-* 通配（只在裸 CPU 列表加 aarch64 不够，aarch64-unknown 仍被拒）"
  - "AM_PATH_SDL 只能通过 sdl-config 脚本取 cflags/libs（不认 SDL_CFLAGS/SDL_LIBS 环境变量），而 Conan sdl/1.2.15 包只装头文件+库：配方须生成 sdl-config shim 并让 configure 可见（AutotoolsToolchain 在本版本 environment 是方法而非属性，用 Environment().vars(self, scope='build').save_script() 聚合进 conanbuild）"
  - "Conan 2.15+ 的 chmod() 签名是 read/write/execute 布尔参数而非 mode：chmod(self, path, 0o755) 只会置读位，可执行脚本仍 0660，configure 报 can't execute: Permission denied"
  - "www.ferzkopp.net（Apache AddEncoding x-gzip）对 .tar.gz 响应 Content-Encoding: x-gzip：conan 下载器（requests/urllib3）透明解压后对解压后的 tar 流做 sha256（ba81689d…=sha256(gunzip(文件))），与 conandata 的文件面哈希必然不符；source() 需 urllib 原始字节回退（先例 blepvco 0.1.0 / irpas 0.10）"
  - "静态库包的下游 traits 会置 require.headers=False：仅把 sdl 作为普通 requires 时，消费方 CMakeDeps 生成的 SDL include 目录为空（'SDL/SDL.h' file not found）；SDL_gfx 公开头文件含 #include <SDL/SDL.h>，必须 requires(..., transitive_headers=True)（先例 at-spi2-core 2.60.5）"
  - "Autotools 助手在本布局是 VPATH/out-of-source 构建：2001 年 libtool 产出的静态库落在 build_folder/.libs（而非 source_folder/.libs），package() 取库路径要按 build_folder 优先"
  - "SDL_gfx 2.0.7 的 ___Color 系列颜色约定是 0xRRGGBBAA（alpha 为低字节，SDL_gfxPrimitives.h:44 明示）：alpha=0x00 时函数返回 0 但静默不绘制，按 ARGB 传参会得到“无绘制但成功”的假象"
  - "打包的 2001 年 libtool（ltconfig）动态链接器特性表无 OHOS 条目（checking dynamic linker characteristics... no）→ 只能静态构建 libSDL_gfx.a；本库不是 OHOS 系统同名库（无 libSDL_gfx 系统库），静态产物与 R26 口径不冲突"
  - "finish 的 Step 1 refresh-patch --auto 会按原文件名重建补丁并把旧补丁移入 patches/.patch-backup-<ts>/：conandata.yml 的 patch_file 必须使用 refresh-patch 生成的规范名（0001-Test-config.guess.patch …），否则 G2 conan create 报 'Patch file does not exist'；且生成的 diff 是 a/…b/… 前缀，条目需显式 strip: 1（E515）"

