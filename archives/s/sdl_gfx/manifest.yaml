software: sdl_gfx
display: "SDL_gfx"
description: "SDL 1.2 graphics drawing primitives and other support functions (lines, boxes, circles, ellipses, polygons, bezier, rotozoom, framerate control, image filters)"
category: graphics
homepage: "https://www.ferzkopp.net/Software/SDL_gfx-2.0/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游为 SDL 1.2 系列（2.0.x）：强制依赖 sdl/1.2.15（AM_PATH_SDL 需 SDL >= 1.2.0）"
    - "config.guess/config.sub 为 2001 年版，需补 HarmonyOS/aarch64/linux-ohos（4 个平台补丁）"
    - "AM_PATH_SDL 只能从 sdl-config 脚本取 cflags/libs；conan 的 sdl 包不含该脚本，配方 generate() 内置 sdl-config shim"
    - "configure 默认 --enable-mmx 会注入 x86 MMX 内联汇编，aarch64 需 --disable-mmx（上游 README 指引）"
    - "打包的 2001 年 libtool（ltconfig）无 OHOS 动态链接器条目 → 只能产出静态库 libSDL_gfx.a"
    - "上游服务器对 .tar.gz 回 Content-Encoding: x-gzip，conan get() 会解压后校验哈希，source() 需 urllib 原始字节回退"
    - "本库 ___Color API 约定 0xRRGGBBAA（alpha 为低字节），alpha=00 时静默不绘制"
  common_dependencies:
    - sdl

versions:
  "2.0.7":
    status: built
    build_date: "2026-10-08"
    note: "原定目标 2.0.5 上游无发布物（ChangeLog: Ver 2.0.5 - n/a），改用官方现存最早版本 2.0.7"
