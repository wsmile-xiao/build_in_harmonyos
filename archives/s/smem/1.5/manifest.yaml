# 版本级 manifest — smem 1.5（ARCHIVE-SPEC v2.0）
version: "1.5"
software: "smem"
status: built
build_date: "2026-10-03"
build_system: "single-translation-unit-direct-clang"

source:
  # 上游 1.5 没有 release tarball，tag 只存在于 Matt Mackall 的 Mercurial 仓库；
  # 98273ce331bb 即被打上 1.5 标签的 changeset（.hgtags 里最后是 1.4 =
  # e143c8fdb6f5，该 changeset 在其后补上 1.5）。
  # 同一 changeset + 同一 sha256 也被 OpenEmbedded meta-oe
  # recipes-support/smem/smem_1.5.bb 的 SRC_URI[sha256sum] 采用，属交叉验证。
  url: "https://selenic.com/repo/smem/archive/98273ce331bb.tar.bz2"
  sha256: "161131c686a6d9962a0e96912526dd46308e022d62e3f8acaed5a56fda8e08ce"
  tar_format: tar.bz2
  contents: "COPYING, smem（Python 3 脚本）, smem.8, smemcap.c（+ .hg_archival.txt/.hgtags）"
  has_build_system: false

build:
  # 1.5 tag 不带 Makefile/CMake/configure，smemcap.c 必须直接编译
  system: none
  compile_command: "<conan conf C compiler> -O2 smemcap.c -o smemcap"
  configure_options: []
  dependencies: []
  cc: clang 15 (aarch64-linux-ohos)
  cxx: null
  script_part_installed: "bin/smem（原样安装 + python3 shebang，补丁 0001）"

patches_applied:
  - "0001-smem-python3-portability.patch"

knowledge_gained:
  - "上游 1.5 的 Python 3 移植只做了一半：tardata 直接返回 tarfile 的 bytes，memory()/pidmaps()/pidcmd() 在 py3 下全部 TypeError；showbar() 还留 xrange()；shebang 指向 python。Debian 1.5-1、Gentoo、OE 都只做了 sed 换 shebang + 一条 --source 补丁，本仓补丁一次补齐三处（草稿 DRAFT-SMEM-15-HALF-FINISHED-PYTHON3-PORT）"
  - "smemcap 只往采集归档写数字 uid/gid，从不写 uname/gname，所以 smem --source 的用户视图只能出数字 uid（与 /proc 直读时走 pwd.getpwuid 的行为不同）；这条差异必须靠实采归档确认，不能照直觉写期望"
  - "脚本型 CLI（无库 API、无构建系统、只有一个 C 助手）的可测配方模式：合成一份与助手同字节布局的采集归档，用手算 PSS/USS/RSS 去驱动脚本；目标架构正确性改用 ELF 头 + PT_INTERP 纯文件断言，使测试在 x86 本地与 aarch64 CI 上同样执行（草稿 DRAFT-SCRIPT-CLI-TAR-ARCHIVE-TEST-WITHOUT-TARGET-EXEC）"

patch_generation:
  method: per-file-difflib
  generated_at: '2026-10-03T14:05:00'
  patches_count: 1

patch_classification:
  - file: 0001-smem-python3-portability.patch
    type: portability
    platform_only: false
    guard: 'none（纯 Python 3 语义修正，不含任何平台宏；tarfile 解码 + xrange→range + shebang）'