# test_package/MANIFEST.yml — upstream test declaration (R51)
# CI script (build_and_test.sh L0e) requires this file to exist.

package: smem/1.5
homepage: "https://www.selenic.com/smem/"

# Upstream test inventory (R51 step 1 — clean count, see notes.md)
#   tag 98273ce331bb contents     : .hg_archival.txt, .hgtags, COPYING,
#                                  smem, smem.8, smemcap.c  (6 files)
#   test/ tests/ directories       : absent
#   Makefile / make check          : absent — the 1.5 tag ships no build
#                                  system at all; OpenEmbedded, Gentoo and
#                                  nixpkgs all compile smemcap.c by hand
#   ctest/pytest/automake TESTS    : 0 (no CMake / automake / python project)
# => upstream ships no automated test suite (N = 0, N缺 = 0).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package consumer tests. test_smem.py is the whole functional contract:
# it inspects the packaged artifacts, then drives the packaged `smem` against a
# capture archive it synthesises byte for byte in smemcap's own tar layout, and
# compares every reported figure with an independently computed expectation.
# Section counts: A = artifact/OHOS-target checks, B = synthetic capture
# battery, C = live capture on an AArch64 OHOS build machine.
test_package_tests:
  - file: test_smem.py
    section: "A"
    description: "bin/smem and bin/smemcap exist and carry the exec bit; smem shebang is /usr/bin/env python3; the packaged script compiles as Python 3; upstream man page and GPL-2 COPYING are installed; smem --help exits 0 and documents the reporting options"
    command: "smem --help"
  - file: test_smem.py
    section: "A"
    description: "smemcap is ELF64 with e_machine=183 (EM_AARCH64) and an AArch64 dynamic loader in PT_INTERP — the artifact targets OHOS PC arm64, not the build host"
    command: "read ELF header/program headers of bin/smemcap"
  - file: test_smem.py
    section: "B"
    description: "synthetic capture archive is a valid tar whose member set matches smemcap's emission order (meminfo, version, then <pid>/ + smaps + cmdline + stat per pid) and whose smaps payload survives the 512-byte header layout"
    command: "python3 -c 'tarfile.open(synthetic.tar).getmembers()'"
  - file: test_smem.py
    section: "B"
    description: "per-process table: name/user/command/maps/swap/uss/pss/rss/vss for two fixture processes match hand-computed PSS/USS/RSS/VSS/Maps values (pid 1000: 4 maps, swap 7, USS 17, PSS 18, RSS 23, VSS 16; pid 1001: 2 maps, USS 6, PSS 8, RSS 8, VSS 16)"
    command: "smem -S synthetic.tar -c 'pid name user maps swap uss pss rss vss'"
  - file: test_smem.py
    section: "B"
    description: "command column keeps embedded spaces (/usr/bin/thing --serve) and process names come from <pid>/stat"
    command: "smem -S synthetic.tar -c 'pid command'"
  - file: test_smem.py
    section: "B"
    description: "-t totals row: process count 2, swap 7, USS 23, PSS 26, RSS 31"
    command: "smem -S synthetic.tar -c 'pid swap uss pss rss' -t"
  - file: test_smem.py
    section: "B"
    description: "-k abbreviates to kB with one decimal (23.0K / 8.0K)"
    command: "smem -S synthetic.tar -c 'pid rss' -k"
  - file: test_smem.py
    section: "B"
    description: "-p with -R 34kB renders exact percentages (50.00% / 52.94% / 67.65%)"
    command: "smem -S synthetic.tar -c 'pid uss pss rss' -p -R 34kB"
  - file: test_smem.py
    section: "B"
    description: "-P filters on process name/command regex; -s uss -r reverses the sort order; -H suppresses the header row"
    command: "smem -S synthetic.tar -P serve / -s uss -r / -H"
  - file: test_smem.py
    section: "B"
    description: "-m mapping table: 4 distinct mappings, <anonymous> merged across both pids (count 3, PIDs 2, AVGPSS 5, PSS 11, RSS 13, swap 7), plus /lib/thing, [heap] and [anon:other]"
    command: "smem -S synthetic.tar -m -c 'map count pids avgpss pss rss swap uss'"
  - file: test_smem.py
    section: "B"
    description: "-M filters mappings by regex (lib)"
    command: "smem -S synthetic.tar -m -M lib"
  - file: test_smem.py
    section: "B"
    description: "-u user table: smemcap writes no uname/gname, so capture archives resolve owners numerically (uid 1000: count 1, swap 7, USS 17, PSS 18, RSS 23; uid 0: count 1, USS 6, PSS 8, RSS 8)"
    command: "smem -S synthetic.tar -u"
  - file: test_smem.py
    section: "B"
    description: "-w system breakdown: userspace memory = AnonPages+Mapped = 6815744 kB, kernel dynamic memory = MemTotal-MemFree-userspace = 7394824 kB, free memory 2097152 kB"
    command: "smem -S synthetic.tar -w"
  - file: test_smem.py
    section: "B"
    description: "error handling: unknown -c column, unknown -s sort field and a unit-less -R value are all rejected with a non-zero exit and a diagnostic"
    command: "smem -S synthetic.tar -c nosuchcolumn / -s nosuchfield / -R 123"

# HarmonyOS PC specific checks (counted as 鸿蒙特有测试 in the PR):
#   #1 and #2 are pure file inspections and therefore execute on every build
#   machine; #3 runs the delivered AArch64 binary on the OHOS worker itself.
harmony_specific_tests:
  - file: test_smem.py
    description: "delivered smemcap is an AArch64 (e_machine=183) dynamically linked ELF whose PT_INTERP is the AArch64 platform loader — proves the artifact is an OHOS PC arm64 build rather than a host build"
    command: "test_smem.py (section A, ELF checks)"
  - file: test_smem.py
    description: "delivered smem declares #!/usr/bin/env python3 and compiles under Python 3, i.e. it runs on the platform's Python 3 and never resolves to a python2 interpreter"
    command: "test_smem.py (section A, shebang + compile checks)"
  - file: test_smem.py
    description: "delivered smemcap executes natively on the AArch64 OHOS worker, captures the live /proc tree into a tar archive that an independent reader validates (meminfo present, per-pid smaps present, MemTotal parses), and the packaged smem reads that capture back through --source"
    command: "smemcap > live.tar && smem -S live.tar -c 'pid pss'"

# Assertion count = number of individual check() calls in test_smem.py.
# 104 always run; the 6 section-C checks run when the build machine is
# AArch64 (the OHOS CI worker), so a full CI run executes 110.
assertion_count: 110