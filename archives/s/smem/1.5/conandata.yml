# conandata.yml — smem 1.5
# Upstream ships no release tarball; the 1.5 tag lives in Matt Mackall's
# Mercurial repository at https://www.selenic.com/smem/ (the project's official
# home page).  `hg archive <changeset>` is therefore the authoritative source
# for 1.5, and the same changeset is what OpenEmbedded
# (meta-oe recipes-support/smem/smem_1.5.bb, SRC_URI[sha256sum]) pins, so the
# checksum below is cross-verified against a second distribution.
#
# 98273ce331bb is the changeset tagged 1.5 (tag added in that changeset, after
# the 1.4 tag e143c8fdb6f5 recorded in .hgtags).
sources:
  "1.5":
    url:
      - "https://selenic.com/repo/smem/archive/98273ce331bb.tar.bz2"
    sha256: "161131c686a6d9962a0e96912526dd46308e022d62e3f8acaed5a56fda8e08ce"

patches:
  "1.5":
    - patch_file: "patches/0001-smem-python3-portability.patch"
      patch_description: "smem: finish the Python 3 port that 1.5 only half-finished — python3 tarfile returns bytes, so all three consumers of tardata raise TypeError on the --source path: memory() surfaces it as a traceback (cannot use a string pattern on a bytes-like object), pidmaps() and pidcmd() are swallowed by their bare except (empty process table / process names degrade to '?'); also replace the python2-only xrange() in showbar() and point the shebang at python3 (1.5 supports python3 only — Debian 1.5-1 and Gentoo dev-util/smem-1.5 both switch to python3)"
      patch_type: "portability"
