software: s6-dns
version: "2.4.1.0"
status: published
build_date: "2026-08-22"
build_system: "skarnet"

source:
  url: "https://github.com/skarnet/s6-dns/archive/refs/tags/v2.4.1.0.tar.gz"
  sha256: "998e933ea300baceb70147e11ab7c2c9c06db8eeb202872b1810b762f85afd91"
  tar_format: tar.gz

build:
  configure_options:
    - "--disable-shared"
    - "--with-sysdeps=stage/lib/skalibs/sysdeps"
    - "--with-include=stage/include"
    - "--with-lib=stage/lib"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "s6-dns uses skarnet's own configure + make system, not standard autotools"
  - "skalibs dependency not published in conan registry, built from source in conanfile.py"
  - "Package produces both static libraries (libs6dns.a, libskadns.a) and CLI tools"
  - "Upstream has no test binaries (TEST_BINS empty), smoke test via binary --help"
