software: sqlite3pp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.8"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/iwongu/sqlite3pp/archive/refs/tags/v1.0.8.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: header-only

  # 配置选项列表
  configure_options: []
  # Header-only library, no configuration needed

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sqlite3/3.49.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# Header-only library, no patches needed

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "sqlite3pp is a header-only C++ wrapper for SQLite3 API"
  - "Only headeronly_src directory is maintained, other directories deprecated"
  - "No traditional build system (configure/make) needed"
  - "Installation: copy headers to $PREFIX/include/sqlite3pp/"
  - "Usage: -I$PREFIX/include + link with -lsqlite3"
