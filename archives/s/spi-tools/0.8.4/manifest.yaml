version: "0.8.4"
software: "spi-tools"

# published | built | failed | archived
# built = conan create（W3/G2）真机通过但未 upload（AGENTS §8.1：不得标 published）
status: built

build_date: "2026-09-25"
build_system: autotools

source:
  url: "https://github.com/cpb-/spi-tools/archive/refs/tags/0.8.4.tar.gz"
  sha256: "201ffcb53e64f28a05aa0a8de5686f7ac644268da1305c0d5f70a3d96b4a22ce"
  tar_format: tar.gz

build:
  system: autotools
  # 官方 tag 归档件无 autotools 生成物，先 autoreconf -fi 自举（tool_requires automake/1.18
  # 补 aclocal/automake，autoconf/m4/perl 用 HNP 系统件），再由配方显式把
  # CONFIG_SHELL/SHELL 路由到 /bin/sh 执行 configure（E386，详见 conanfile.py 注释）。
  bootstrap: "autoreconf -fi"
  configure_options:
    - "--prefix=/ （连同 bindir/sbindir/libdir/includedir/oldincludedir 由 AutotoolsToolchain 注入）"
    - "--build/--host 均未传：configure.ac 无 AC_CANONICAL_HOST，三元组校验不发生（免 E122/E072/E007 族）"
  dependencies: []
  tool_dependencies:
    - "automake/1.18"
  make_options:
    - "-j1"
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  # 上游无可执行测试套件（全树 3 个 Makefile.am 无 TESTS/check_PROGRAMS/dist_check_SCRIPTS，
  # 判据见 test_package/MANIFEST.yml 的 upstream_test_absence_evidence）；
  # total=0 是**清点结果**而非"跳过"。真机日志里 `make check` 出现 0 次，与此一致。
  # 消费者测试（test_package/test.sh）另计：1 个测试程序 / 35 条断言全部通过，
  # 另有 1 组（4 条）SPI_IOC 数据面断言因本机无 /dev/spidev* 节点如实记 SKIP。
  # 真机 memcap 实测峰值 124MB（预算 2048MB，conan create 全程 44s），见 notes.md。
  type: none_upstream
  total: 0
  passed: 0
  failed: 0
  skip: 0
  consumer_total: 35
  consumer_passed: 35
  consumer_failed: 0
  consumer_conditional_skip_groups: 1

knowledge_gained:
  - "E386（命中，真机单因子实证）：框架共享 profile ci/conan/profiles/ohos-aarch64 的 [buildenv] 把 SHELL/CONFIG_SHELL 钉成 /data/service/hnp/bin/bash，而 autoconf 的 configure 序言用 `exec $CONFIG_SHELL $as_opts \"$as_myself\"` 自重执行；实测**同一 VPATH 目录**里 hnp bash 连 `pwd` 都失败（rc=1 + shell-init: error retrieving current directory: getcwd），/bin/sh 同目录 rc=0 ⇒ 只换这两个变量即可让 configure 从 'working directory cannot be determined' 变为正常产出 Makefile/config.h。修法见 conanfile.py 的 _configure_with_binsh()：用 load_toolchain_args() 取回 AutotoolsToolchain 的 configure_args 后以 env 前缀路由 shell（因 Autotools 助手不提供 env 钩子）"
  - "E011/E114（不适用，实测为 0 命中）：autoconf 2.72 生成的 configure 已不含 `umask 077`（改写后实测 umask077=0/umask022=2，其中 2 处来自 autoconf 自身的 022 写法），故配方侧的定向改写对本包是空操作、不产生补丁。ac_pwd=`pwd` 失败回退 $PWD 的第二道防线**确实落上**（生成件 line 1232 实测），但受控复现证明它挡不住 hnp bash 的 getcwd 失败（C1 用的就是已改写的 configure 仍报 working directory cannot be determined）⇒ 真解法只有路由 shell 这一条，ac_pwd 回退仅按 §12.38 保留为兜底"
  - "§12.21 静态打包家族（命中，形态不同）：本包是可执行体而非库，无需 .a/.so；因真机 HMDFS 上带 -c 的 install 报 Error 64（E182/E188 家族，aribb24 为此写 install shim），本包直接实体拷贝 bin/*.1/LICENSE，全程不跑 make install"
  - "工具件分工（命中既有先例）：HNP 镜像有 autoconf 2.72/perl/m4/make 但**没有 automake/aclocal** ⇒ 只 tool_requires automake/1.18；不 tool_requires autoconf（conan 版 autoconf 拖来的 perl 在 HMDFS 上 Cwd.so 无执行权限，comptty/1.0.3 实证）。另实测 ohpcd 制品仓只有 automake/1.18 有制品，1.17 与 1.16.5 均 not resolved"
  - "平台能力边界（真机取证）：本机 /dev 下**不存在任何 spidev* 字符设备节点**（ls /dev | grep -c spidev = 0，且 /dev/spidev* 通配为空），故 SPI_IOC_RD_*/WR_* 数据面语义无法在本机取证；已在 test.sh 里如实打 SKIP 并写进 MANIFEST 的 conditional_skip，不并入通过率"
