# test_package/MANIFEST.yml
# Upstream test declaration file.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: spi-tools/0.8.4
homepage: "https://github.com/cpb-/spi-tools"

# 上游无自动化测试入口（清点证据见下 upstream_test_absence_evidence），
# 因此不存在可声明的 check 命令。
upstream_check_command: null

# 上游没有测试套件可集成进 build()——不是"跳过"，是"无入口"。
upstream_test_in_build: false
upstream_test_command: null

# 上游测试程序清单：空。
upstream_tests: []

# 清点证据（SKILL R51 / AGENTS §10：'上游确无测试'须附清点证据）
upstream_test_absence_evidence: >
  spi-tools 0.8.4 官方 GitHub tag 归档件全树 11 个文件，其中构建输入只有 3 个
  Makefile.am：根 Makefile.am 仅 SUBDIRS=src man；src/Makefile.am 仅
  bin_PROGRAMS = spi-config spi-pipe 与各自的 *_SOURCES/*_LDADD（LDADD 为空）；
  man/Makefile.am 仅 dist_man_MANS = spi-config.1 spi-pipe.1。全树
  TESTS / check_PROGRAMS / dist_check_SCRIPTS / TESTS_ENVIRONMENT /
  AM_TESTS_ENVIRONMENT 命中数为 0，configure.ac 亦不含 AM_INIT_AUTOMAKE 的
  parallel/serial test 相关声明，README 的 Installation 段只给
  autoreconf -fim / ./configure / make / make install 四步、无 make check。
  N_static = 0（清点结论，非跳过）。真机 conan create 日志中 `make check`
  出现次数与之一致。

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "使用者测试程序：以真实用户身份运行打包后的两个 ELF（spi-config / spi-pipe），断言由退出码 + stderr/stdout 子串共同决定。覆盖面：交付物存在且可执行 2 条；-v 版本宏回显（证明 autoreconf+configure 把 AC_INIT 的 0.8.4 真注入目标码）4 条；-h usage 文本 4 条；参数校验负例（-m 9 越界、-b 3 <7、-s 5 <10、-l 7 非 0/1、-Z 未知选项、spi-pipe -b 0、-s 5、-n -2）各 rc=1 且给专有错误，共 16 条；未指定设备分支 4 条；对不存在的 /dev/hw9-spidev-does-not-exist 走真实 open() 失败路径并由 perror 回显节点名，4 条。合计 35 条断言（存在 /dev/spidev* 字符设备节点时另加 4 条 SPI_IOC_RD_* 查询往返断言 = 39 条）。"
    command: "conan test"

# 断言总数（消费者侧 35；上游侧 0，因无测试入口）
# 口径：assertion_count 只统计 test.sh 里 ok()/bad() 的判定点，不含上游。
assertion_count: 35

# 条件未满足项（如实声明，不改判通过）：无 /dev/spidev* 节点时 SPI_IOC 数据面
# 那 4 条打印 SKIP 并说明原因（本机无 SPI 从设备，属平台能力缺失而非配方缺陷）。
conditional_skip: >
  SPI_IOC_RD_MODE/RD_BITS_PER_WORD/RD_MAX_SPEED_HZ 查询往返用例依赖真实
  spidev 字符设备节点；构建机 /dev 下是否有 spidev* 以 test.sh 第 7 段探测为准。

# 内存预算（AGENTS §14.1④：test_package/smoke 必须记 max_rss_mb）
# 两个程序都是几十 KB 的 CLI，无 GB 级输入；预算取宽松值，实测峰值记入 notes.md。
max_rss_mb: 256
