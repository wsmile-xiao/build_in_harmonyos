software: spi-tools
display: "spi-tools"
description: "Command line tools to configure and drive Linux spidev character devices"
category: utils
homepage: "https://github.com/cpb-/spi-tools"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "官方 GitHub tag 归档件（tag 名 0.8.4，无 v 前缀）不含任何 autotools 生成物，build() 用 autoreconf -fi 自举"
    - "HNP 镜像有 autoconf 2.72/perl/m4 但没有 automake/aclocal ⇒ 只 tool_requires automake/1.18（不 tool_requires autoconf：其 perl 依赖的 Cwd.so 在 HMDFS 无执行权限，comptty/1.0.3 先例）"
    - "E386：共享 profile 的 [buildenv] 把 CONFIG_SHELL/SHELL 钉成 hnp bash，而 hnp bash 在 conan 缓存目录里 getcwd 必挂 ⇒ configure 报 working directory cannot be determined；配方用 load_toolchain_args() 保参 + env 前缀把 shell 路由回 /bin/sh"
    - "configure.ac 无 AC_CANONICAL_HOST ⇒ 不传 --build/--host 即无三元组校验，免 config.guess/config.sub 一族补丁"
    - "不跑 make install（真机 HMDFS 上 install -c 报 Error 64，E182/E188 家族）：package() 实体拷贝两个二进制 + man 页 + LICENSE"
    - "本机 /dev 下无任何 spidev* 字符设备节点 ⇒ SPI_IOC_* 数据面用例物理不可执行，test.sh 如实记 SKIP 不并入通过率；消费者测试 35 条断言覆盖版本宏/usage/参数校验/open() 失败路径"
  common_dependencies: []

versions:
  "0.8.4":
    status: built
    build_date: "2026-09-25"
