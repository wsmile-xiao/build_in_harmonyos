# test_package/MANIFEST.yml — scooter 0.9.1
package: scooter/0.9.1
homepage: "https://github.com/thomasschafer/scooter"

# 上游测试为 Rust cargo test（workspace 单元 + 集成测试），由 conanfile.py
# build() 内的 `cargo test --release --workspace --tests` 原生执行
# （OHOS worker host==target，无需 qemu/真机）。
upstream_check_command: "cargo test --workspace"
upstream_test_in_build: true
upstream_test_command: "cargo test --release --workspace --tests --no-fail-fast"

# 上游测试程序（cargo test 实测，本地 rustc 1.98.1 x86_64 Linux 全过：
#   120 scooter lib 单元 + 138 scooter bin 单元 + 129 app_runner 集成
# + 137 headless 集成 + 384 scooter-core lib 单元 + 47 scooter-core tests/app
# 集成 + 1 xtask 单元 = 956 单元/集成，0 失败；另 4 个 scooter_core doctest）
upstream_tests:
  - file: scooter/src
    source: scooter-0.9.1/scooter/src
    description: "scooter 库单元测试（实测 120 通过）"
    command: "cargo test --release -p scooter --tests"
  - file: scooter/tests
    source: scooter-0.9.1/scooter/tests
    description: "scooter 集成测试 app_runner + headless（实测 129+137 通过）"
    command: "cargo test --release -p scooter --tests"
  - file: scooter-core/src
    source: scooter-0.9.1/scooter-core/src
    description: "scooter-core 库单元测试（实测 384 通过）"
    command: "cargo test --release -p scooter-core --tests"
  - file: scooter-core/tests
    source: scooter-0.9.1/scooter-core/tests
    description: "scooter-core 集成测试（实测 47 通过）"
    command: "cargo test --release -p scooter-core --tests"

# Doc-tests 说明：scooter_core 含 4 个 doctest；harmonybrew rust 1.97.1
# 工具链未随附 rustdoc（Cellar/rust/1.97.1/bin 无 rustdoc），cargo test 以
# --tests 跳过 doctest（与 aiken 1.1.23 配方同因，见其 notes.md）。
doc_tests_skipped_reason: "harmonybrew rust 1.97.1 未安装 rustdoc，cargo test 以 --tests 跳过 doctest（4 个）"

# test_package 自带的消费者测试（4 条断言，实质调用 bin/scooter）
test_package_tests:
  - file: test.sh
    description: "冒烟测试: --version 版本断言 + --help + stdin find-and-replace + 文件 find-and-replace"
    command: "bash test.sh <bin/scooter>"

# 测试断言总数（上游 956 单元/集成 + 4 doctest 跳过 + 4 消费者冒烟）
assertion_count: 960
