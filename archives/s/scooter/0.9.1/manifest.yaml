software: scooter
version: "0.9.1"
status: built
build_date: "2026-09-03"
build_system: cargo

source:
  url: "https://github.com/thomasschafer/scooter/archive/refs/tags/v0.9.1.tar.gz"
  sha256: "0763a96361c4d0c7b6548b0c48b0e3c89b26f2136ba73cf85d570db78496917b"
  tar_format: tar.gz

build:
  system: cargo
  configure_options:
    - "cargo build --release --locked"
    - "OHOS target: aarch64-unknown-linux-ohos"
    - "OHOS fallback: Harmonybrew Rust 1.97.1, OpenSSL, zlib, CA bottles"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "scooter 0.9.1 is a Rust (cargo workspace) interactive find-and-replace TUI tool, edition 2024, rustc >= 1.91."
  - "Removed rust-toolchain.toml pin (channel 1.91) so probe toolchain is used directly without rustup download."
  - "Uses two-face (syntect-default-onig) which pulls onig_sys (C); only native C dep is onig_sys + libc, no openssl/zlib needed for the build."
  - "cargo test --workspace natively runs upstream 956 unit/integration tests (all pass locally); 4 doctests skipped on worker (harmonybrew rust has no rustdoc, same as aiken)."
  - "Recipe pattern derived from bottom 0.12.3 / cargo-bloat 0.12.1 / aiken 1.1.23."