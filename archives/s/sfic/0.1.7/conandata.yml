patches:
  - patch_file: "patches/0001-config.sub-ohos-triplet.patch"
    patch_description: "config.sub: accept aarch64-linux-ohos triplets (linux-ohos os, aarch64 machine)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-tmpdir.patch"
    patch_description: "configure: drop hard umask 077 around mktemp/mkdir for TMPDIR (OHOS HMDFS normalizes modes, setgid tmpdir is unwritable under umask 077)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-Makefile-install-strip-tab.patch"
    patch_description: "src/Makefile.in + src/Makefile.am: install-strip recipe line indented with 8 spaces instead of TAB — make errors on recipe continuation; restore TAB"
    patch_type: "portability"
  - patch_file: "patches/0004-src-sfic.c-ohos-portability.patch"
    patch_description: "src/sfic.c: include <limits.h> (musl PATH_MAX), add --version/-V option (CLI smoke gate needs a version probe; L2 runs --version first)"
    patch_type: "portability"
