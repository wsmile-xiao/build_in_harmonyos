# test_package/MANIFEST.yml — sfic 0.1.7
# CI L0e requires this file to exist.

package: sfic/0.1.7
homepage: "https://sfic.sourceforge.net/"

# sfic 0.1.7 (2006, autotools) defines a `make check` target but ships zero
# upstream test programs (no TESTS/TESTS_SCRIPTS in src/Makefile.am) — the
# target exits with "Nothing to be done for 'check'". It is still invoked in
# build() for log evidence; all functional coverage is the consumer suite.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests: []

# Dependency coverage note: the hard runtime dependency tdb/1.4.15 (already
# published to the ohpcd registry) runs its own full upstream suite in its
# recipe build — `make test`, 37 test programs, all passing on armv8/OHOS.
test_package_tests:
  - file: test.sh
    description: >-
      Consumer CLI workflow: --version, -h, recursive tdb database creation
      (-a -R), listing (-l), identical-database compare (-n/-o, expect clean),
      change detection after file modification (expect report + non-zero exit),
      and on-disk db file sanity.
    command: "bash test.sh"

assertion_count: 7
