# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "sfic 0.1.7 为 2006 年 autotools 单 C 文件项目（src/sfic.c，约 1858 行）+ 自带 sha256 实现，无第三方构建依赖，唯一硬运行时依赖是 tdb（tdb.h + tdb_store）。"
  - "sfic 0.1.7 上游无任何测试用例：src/Makefile.am 定义了 make check 目标但没有 TESTS/TESTS_SCRIPTS，执行结果为 Nothing to be done for 'check'（rc=0）。"
  - "configure.ac 的 --with-tdb-headers 是半死参数：[TDB_HDR_DIR=\"$withval\"]/[CPPFLAGS=\"$CPPFLAGS -I$withval\"] 结构导致默认分支（未指定时）把 -I 后接空值写入 CPPFLAGS；指定时正常追加 -I<dir>。--with-tdb-lib 则只追加 -L<dir>，库名由 AC_CHECK_LIB(tdb, tdb_store) 解析。"
  - "OHOS /tmp 为只读文件系统（HMDFS），而 configure 的临时目录创建带硬编码 umask 077（setgid 临时目录下不可写），必须：1) 补丁去掉 umask 077 加固；2) TMPDIR 指向构建工作区内可写目录。"
  - "src/Makefile.in 的 install-strip recipe 续行用 8 空格缩进（非 TAB），make 报 'warning: overriding recipe for target install-strip' 并跳过该 recipe（autotools 默认路径走 install 不受影响，但需修复以防触发 install-strip 的场景）。"
  - "sfic 0.1.7 无 --version 选项（-h 帮助文本里含 version 0.1.7 字样），为通过 CI L2 冒烟门禁（timeout 15 bin --version）补丁新增 --version/-V 选项。"
  - "tdb 1.4.15 已发布到 ohpcd 制品仓（armv8/OHOS 共享库，SONAME libtdb.so.1），故用 requires 共享动态链接而非 vendored tdb 源码内联构建（CI JC3 门禁会拦截非 prebuilt 命名的 .tar.gz 入 archives/）。tdb/1.4.15 自身 recipe 构建时运行完整上游测试套件（make test，37 个测试程序全部通过）。"
  - "sfic 链接共享 libtdb 后，CI L2 冒烟门禁在无 LD_LIBRARY_PATH 的情况下直接执行 bin/sfic --version，必须在构建期注入 -Wl,-rpath,<tdb lib dir>（musl 支持 RPATH，已验证 RPATH HONORED）。"
  - "tdb 既有 quirk：同一 db 文件在同一进程内双开会异常，test_package 比对场景必须使用两个独立 db 文件。"

homepage: "https://sfic.sourceforge.net/"
license: "GPL-2.0"

