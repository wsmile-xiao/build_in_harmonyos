# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.7.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.7.0"

# 软件名
software: sparse-map

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Tessil/sparse-map/archive/refs/tags/v0.7.0.tar.gz"

  # 源码校验和
  sha256: "b603a24f596f95a06ec1d437f4cb928c2647cf9bc73b751ac6fb82deb7863d98"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  test_dependencies:
    - boost-source/1.86.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 CMake 测试依赖 Boost::unit_test_framework；OHOS 无兼容 Conan 二进制，因此用 Boost 1.86.0 源码头文件切换到 header-only Boost.Test。"
  - "源码包为 C++17 header-only 库，安装 include/tsl 与 share/cmake/tsl-sparse-map，无运行时链接依赖。"
  - "OHOS CMake 配置将 CMAKE_SYSTEM_NAME 映射为 Linux，并将 CMAKE_SYSTEM_PROCESSOR 设置为 aarch64。"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
