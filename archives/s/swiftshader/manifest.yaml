software: swiftshader
display: SwiftShader
description: "SwiftShader - CPU-based implementation of the Vulkan 1.3 graphics API (software Vulkan ICD, includes a JIT (LLVM/Subzero) and a SPIR-V compiler)"
category: graphics
license: Apache-2.0
homepage: "https://github.com/google/swiftshader"

build_system: cmake

ohos_adaptation:
  key_points:
    - "HarmonyOS/OpenHarmony 是 headless 平台：需禁用 XCB/Wayland WSI（SWIFTSHADER_BUILD_WSI_* = OFF）"
    - "CMake 平台探测需接受 HarmonyOS/OHOS（等价 Linux）；conan 里设 CMAKE_SYSTEM_NAME=OHOS + CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "上游为 git 快照（无 release）；第三方多为 vendored 目录，仅 googletest/glslang 两个 submodule 需单独获取"
    - "Reactor 默认后端 LLVM，使用 vendored third_party/llvm-10.0（无需拉取 llvm-project submodule）"
  common_dependencies:
    - vulkan-headers

versions:
  - version: "0_git20260921"
    status: built
    build_date: "2026-09-29"
    build_system: cmake
    upstream_commit: "1e80438d2b93ef36a7c05f8d2b81233bac0e3d16"
    artifacts:
      - swiftshader-0_git20260921-ohos-aarch64.tar.gz
