# test_package/MANIFEST.yml
# Upstream test declaration for swiftshader 0_git20260921.
package: swiftshader/0_git20260921
homepage: "https://github.com/google/swiftshader"

# ── Upstream test inventory (gtest, built by CMake SWIFTSHADER_BUILD_TESTS=ON) ──
#   * vk-unittests     (tests/VulkanUnitTests)  : 139 tests (2 BasicTest +
#                        136 ComputeParams/SwiftShaderVulkan* + 1 DrawTest)
#   * ReactorUnitTests (tests/ReactorUnitTests) : 156 tests (Reactor JIT)
#   * math-unittests   (tests/MathUnitTests)    : 11 tests
#   * system-unittests (tests/SystemUnitTests)  : 25 tests
# (tests/*Benchmarks exist but SWIFTSHADER_BUILD_BENCHMARKS=OFF.)
#
# build() runs these executables after cmake.build(); the gtest traces stay in
# the conan build log. Two upstream tests are excluded from the CI run for
# platform / runtime reasons (full attribution in notes.md / reports/):
#   * DrawTest.VertexShaderNoPositionOutput - requires a window system
#     (DrawTester builds a Window + Swapchain); HarmonyOS PC is headless.
#   * MathTest.SharedExponentExhaustive - sweeps all 2^32 float bit patterns
#     (~48 min on an OHOS worker); it was executed separately (see reports/).
upstream_check_command: "vk-unittests --gtest_filter=-DrawTest.*  (plus ReactorUnitTests, math-unittests, system-unittests)"

upstream_test_in_build: true
upstream_test_command: "ReactorUnitTests; math-unittests --gtest_filter=-MathTest.SharedExponentExhaustive; system-unittests; vk-unittests --gtest_filter=-DrawTest.*"

upstream_tests:
  - file: tests/VulkanUnitTests
    description: >-
      vk-unittests: 138/139 runnable tests pass in build() (2 BasicTest + 136
      ComputeParams, the latter driving a full Vulkan compute workload through
      the Reactor JIT). DrawTest needs a window system, unavailable headless.
    command: "./vk-unittests --gtest_filter=-DrawTest.*"
  - file: tests/ReactorUnitTests
    description: >-
      ReactorUnitTests: 155/156 pass. The single failure (RoundInt) is an
      aarch64 float->int saturation expectation baked into the test.
    command: "./ReactorUnitTests"
  - file: tests/MathUnitTests
    description: >-
      math-unittests: 6/11 pass (6/10 in the CI subset). The failures are
      under-specified float semantics (denormal log2, RGB9E5 NaN handling) that
      only match x86.
    command: "./math-unittests"
  - file: tests/SystemUnitTests
    description: "system-unittests: 25/25 pass."
    command: "./system-unittests"

# ── Consumer test (test_package) ────────────────────────────────────────────
# Links against the installed libvk_swiftshader.so and drives a full Vulkan
# compute workload through the ICD (instance -> physical device -> logical
# device -> SPIR-V compute pipeline -> dispatch -> read-back + verify), which
# exercises the SwiftShader Reactor JIT end to end. It also parses the ICD ELF
# to assert HarmonyOS/PC platform traits.
test_package_tests:
  - file: test_swiftshader.c
    description: >-
      C group (30): creates a Vulkan instance/device on the SwiftShader ICD,
      uploads a 4-element uint buffer, runs a SPIR-V compute shader
      (data[i] = data[i]*2+1) via the JIT and verifies the results.
      H group (3, HarmonyOS-specific): __OHOS__ compile guard; the ICD is a
      64-bit AArch64 ET_DYN object; the ICD links libc.so and has no separate
      libpthread/libdl/librt (musl folds them into libc).
      P group (2, PC-specific): the ICD carries SONAME libvk_swiftshader.so and
      its dependency closure is exactly libc++_shared.so + libc.so.
    command: "./test_swiftshader"

# upstream: 331 tests (156 + 11 + 25 + 139) -> 324 passed (97.9%)
# consumer: C=30 usage + H=3 HarmonyOS-specific + P=2 PC-specific (+1 driver entry)
assertion_count: 35
