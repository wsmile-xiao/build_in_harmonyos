knowledge_gained:
  - "E-ohos-memfd-exec: OHOS 禁止 memfd 映射 PROT_EXEC（mmap 返回 EACCES），但匿名 mmap(PROT_READ|WRITE|EXEC) 可执行 —— JIT（LLVM/Subzero/任何运行期生成代码）的代码缓存必须用匿名映射，不能用 memfd。最小探针：memfd_create→mmap(PROT_EXEC) 失败；mmap(MAP_ANONYMOUS) 成功。"
  - "E-ohos-musl-affinity: musl 不提供 glibc 专属 pthread_{get,set}affinity_np；`#if defined(__linux__) && !defined(__ANDROID__)` 这类守卫在 OHOS 上会误命中 glibc 分支。改用 sched_{get,set}affinity。"
  - "E-ohos-musl-dlinfo: glibc 的 dlinfo(RTLD_DI_ORIGIN) 在 musl 缺失，需以 #if defined(RTLD_DI_ORIGIN) 守卫。"
  - "E-cmake-ohos-systemname: conan 对 os=OHOS 会设 CMAKE_SYSTEM_NAME=HarmonyOS（cmake 无该平台文件→警告且 PROCESSOR=unknown）；显式设 CMAKE_SYSTEM_NAME=OHOS（cmake 自带 Platform/OHOS.cmake → Platform/Linux）+ CMAKE_SYSTEM_PROCESSOR=aarch64 可同时消除警告与架构误判。"
  - "E-swiftshader-submodules: 上游 tarball 不含 submodule 内容；默认构建仅需 googletest + glslang 两个 submodule（Reactor 默认后端用 vendored third_party/llvm-10.0，无需 llvm-project）。"
  - "E-conan-get-ext: codeload.github.com 的 .../tar.gz/<sha> URL 无扩展名，conan tools.files.get 会按 zip 解压而失败（BadZipFile）；改用 github.com/<owner>/<repo>/archive/<sha>.tar.gz（字节一致，sha256 相同）。"
