sources:
  url: "https://github.com/google/swiftshader/archive/1e80438d2b93ef36a7c05f8d2b81233bac0e3d16.tar.gz"
  sha256: "1c3a1afc397c7aa4d3275790bc9b451e80b144a1db665135d5519838bacf44a8"

# Submodules required by the default build (REACTOR_BACKEND=LLVM, vendored
# third_party/llvm-10.0). The GitHub source tarball does not contain submodule
# contents, so they are fetched separately and unpacked into third_party/.
submodule_sources:
  googletest:
    url: "https://github.com/google/googletest/archive/e2239ee6043f73722e7aa812a459f54a28552929.tar.gz"
    sha256: "2765fbfaa978e90d1c8477bc2f2b9705be65b1b562bb215dbfaa76567d508fe1"
  glslang:
    url: "https://github.com/KhronosGroup/glslang/archive/2b2523fb951f63f072cfba514c26f2feea5f4329.tar.gz"
    sha256: "9af407397e004d1040712ac95a6fa26cd853dad60544a2aa5eb40b578033f508"

patches:
  - patch_file: "patches/0001-cmake-harmonyos-platform-support.patch"
    patch_description: "Accept HarmonyOS/OHOS as a headless Linux-like platform; skip git submodule fetch for recipe-populated submodule directories"
    patch_type: "portability"
  - patch_file: "patches/0002-marl-musl-thread-affinity.patch"
    patch_description: "marl: use sched_{get,set}affinity() on musl (pthread_*affinity_np are glibc-only)"
    patch_type: "portability"
  - patch_file: "patches/0003-vulkanwrapper-guard-glibc-dlinfo.patch"
    patch_description: "tests/VulkanWrapper: guard the glibc-only dlinfo(RTLD_DI_ORIGIN) fallback"
    patch_type: "portability"
  - patch_file: "patches/0004-reactor-jit-anonymous-executable-memory.patch"
    patch_description: "Reactor: allocate the JIT code cache from anonymous memory (OHOS refuses PROT_EXEC on memfd mappings)"
    patch_type: "portability"
