# 软件级 manifest
# 文件位置: archives/s/sersniff/manifest.yaml
# 版本级细节见 0.0.5/manifest.yaml

software: sersniff
display: "sersniff"
description: "串口嗅探/隧道工具：在两个串口(或 TCP)端口间转发数据并显示内容"
category: tool
homepage: "http://www.earth.li/projectpurple/progs/sersniff.html"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建（无 configure、无 install target），Makefile 硬编码 CC=gcc 且 LINK=gcc（最终链接用 $(LINK)），OHOS 需用 Conan clang 在 make 命令行同时覆盖 CC 与 LINK（R33）"
    - "package() 手动拷贝二进制到 bin/、man8 页到 share/man/man8/、LICENSE 到 licenses/（无 install 目标）"
    - "usage() 的 -h/非法参数分支 exit(1)，测试以输出内容而非退出码为准"
    - "上游无任何测试框架（仅 all/clean），已声明 upstream_tests_exist: false"
    - "运行依赖仅 libc + POSIX sockets/termios，无三方依赖，可无硬件以 -h/-b 做 CLI 冒烟测试"
  common_dependencies: []

versions:
  "0.0.5":
    status: built
    build_date: "2026-09-30"
