# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sersniff/0.0.5
homepage: "http://www.earth.li/projectpurple/progs/sersniff.html"

upstream_check_command: ""
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: "autotools_tests"
upstream_test_audit:
  - source: "sersniff-0.0.5.tar.gz (upstream release archive, 13 files)"
    finding: "src tarball listing verified via 'tar tzf': exactly 13 entries (Makefile, README, HISTORY, TODO, LICENSE, sersniff.c, tcp.c/h, disp_basic.c/h, disp_ncurses.c/h, sersniff.8). No tests/, test/, or t/ directory of any kind."
  - source: "Makefile"
    finding: "Makefile defines only 'all' and 'clean' targets, plus a few compile helpers; no 'check', 'test', 'check-TESTS' or 'TESTS' target, no $(TESTS) variable, no $(MAKE) check invocation."
  - source: "test framework bindings"
    finding: "No ctest/CMake-generated test harness, no gtest/gmock/pytest/criterion autotools (tests/Makefile.am / m4/AT_*) or Makefile test integration. README describes only manual serial-port operation."
  - source: "disp_ncurses.c"
    finding: "disp_ncurses.c is an optional alternate display module (built only when ncurses is present), not a test harness and not built by default."
  - conclusion: "sersniff 0.0.5 ships NO upstream test framework or test cases of any kind. upstream_test_total=0, upstream_test_count_method='autotools_tests'. No upstream tests can be executed; verified test_package smoke tests (assertion_count=3) cover the built binary."
reason: "sersniff 0.0.5 ships no upstream test framework: Makefile has only all/clean targets, no check/test target, no tests/ directory, no gtest/pytest bindings."

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "离线验证 sersniff 二进制真实运行：-h 打印版本横幅 'sersniff v0.0.5'，-h 打印 Usage 用法帮助，-b 999 拒绝不支持的波特率（选项解析）。无需串口/网络硬件，仅调用真实二进制。"
    command: "sh test.sh"

assertion_count: 3
