# test_package/MANIFEST.yml
# 上游官方测试声明文件
#
# 上游测试清点证据（shellex 0.3, tag 0.3）：
#   - 顶层 Makefile 目标仅 all/install/clean/distclean（+ format 开发者工具），
#     无 check/test 目标；
#   - 源码树无 tests/ 目录、无任何测试框架注册入口；
#   - 唯一 C 源文件 preload/main.c 为 LD_PRELOAD 库本体，非测试代码。
# 故 N_static=0 属上游事实，按规则以消费者测试补位。

package: shellex/0.3
homepage: "https://github.com/Merovius/shellex"

upstream_check_command: "make check（上游 Makefile 无 check 目标，N_static=0）"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.c
    description: "消费者测试：以 LD_PRELOAD 将包内 shellex_preload.so 真实载入运行中的 /bin/sh 并断言命令正常执行、库真实加载（无 loader 报错）；另对生成的 shellex 启动脚本做 sh -n 语法校验"
    command: "./test_shellex <package>/lib/shellex/shellex_preload.so <package>/bin/shellex"

assertion_count: 4
