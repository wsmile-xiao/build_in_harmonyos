# 版本级 manifest — shellex 0.3
# 遵循 ARCHIVE-SPEC v2.0

version: "0.3"
software: "shellex"

status: built
build_date: "2026-09-19"
build_system: "makefile"

source:
  url: "https://github.com/Merovius/shellex/archive/refs/tags/0.3.tar.gz"
  sha256: "5f06dbf81c0c325acfa0344c1708e84469ad9ce4dc431c31544c0d568980583e"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=<conan tools.build:compiler_executables c>"
    - "SED=sed"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 Makefile 依赖 make 内建默认 CC=cc（OHOS 工具链无 cc），必须显式传 make CC=<conan conf 的 clang>"
  - "上游 install 目标会以绝对 PREFIX 在 SYSCONFDIR 建 ln -s 符号链接，包内打包应改为按上游布局平铺拷贝（跳过系统目录符号链接）"
  - "shellex 包装脚本的 urxvt/zsh 运行时依赖非 OHOS 平台组件；核心产物是 shellex_preload.so，消费者测试以 LD_PRELOAD 注入真实 /bin/sh 验证"
