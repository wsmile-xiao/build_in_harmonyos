# test_package/MANIFEST.yml — slugify 1.0.1
package: slugify/1.0.1
homepage: "https://github.com/JabberLabs/slugify"

# R51 step 1 — upstream test inventory
# The v1.0.1 tag archive holds exactly README.md, slugify, slugify.1 and
# slugify.1.ronn; upstream master only adds LICENSE. No tests/ directory, no
# build system (so no make check / ctest / pytest registrations), no CI config.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_inventory:
  release_files: 4
  test_directories: 0
  registered_test_cases: 0
  evidence: "tar tzvf slugify-1.0.1.tar.gz -> README.md, slugify, slugify.1, slugify.1.ronn; GitHub tree of master -> LICENSE, README.md, slugify, slugify.1, slugify.1.ronn"

# R51 step 3 — upstream ships no tests, test_package supplies them.
# Both drivers run under bash/5.3 (the OHOS bash) in the conanrun environment
# and rename real files in a scratch directory below the test build folder.
test_package_tests:
  - file: test_slugify.sh
    count: 18
    description: >-
      One case per usage example of the upstream README (19 examples; the
      escaped and the quoted spelling of the same filename share a case):
      usage help, spaces, globs, several arguments, directories, -c, -d, -dc,
      -i, -n (dry run, missing file), -a / -ac around dashes, -ud, -t. Each
      case checks the printed report, the resulting entries and the moved
      file contents. Two README lines differ from the 1.0.1 code (dry run
      without -v prints no "ignore:" line; -vac echoes the source verbatim);
      the cases follow the code.
    command: "bash test_slugify.sh <package>/bin/slugify"
  - file: test_slugify_ohos.sh
    count: 5
    harmonyos_specific: true
    description: >-
      HarmonyOS PC consumer cases. slugify is located on the conanrun PATH
      without relying on the exec bit and run through bash/5.3 explicitly.
      HC-1 case-only renames of files, HC-2 of a directory given with a
      trailing slash, HC-3 dry-run preview of a case-only rename, HC-4 real
      conflicts still refused (plus the patch's restore branch for a hard
      link / symlink under the target name on case-sensitive filesystems),
      HC-5 a web publishing pipeline that builds an index from the stored
      names and resolves every link by exact name. On case-insensitive storage
      (HMDFS; verified locally on a vfat mount) HC-1/2/3/5 run the patched
      alias path, on a case-sensitive filesystem the plain rename path with
      the same expected end state; the driver prints which one ran
      ("# filesystem :" line).
    command: "bash test_slugify_ohos.sh <package>/bin/slugify"

test_case_count: 23
