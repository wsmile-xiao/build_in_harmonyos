# StormLib 软件级 manifest
# 文件位置: archives/s/stormlib/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: stormlib

# 软件描述
description: "StormLib - 开源MPQ档案库，用于读取和操作暴雪游戏（魔兽争霸III、星际争霸II等）的MPQ档案格式"

# 软件分类
category: library

# 官方网站
website: https://github.com/ladislav-zezula/StormLib

# 许可证
license: MIT

# 最新编译版本索引
versions:
  - version: "9.25"
    status: built
    build_date: "2026-06-17"
    archive_path: "9.25"

# 功能特性
features:
  - "读取MPQ档案文件"
  - "创建和修改MPQ档案"
  - "支持多种压缩算法：zlib、bzip2、LZMA、PKWARE"
  - "支持强数字签名验证"
  - "跨平台支持"

# 依赖关系
dependencies:
  runtime: []
  build:
    - "cmake/4.1.2"

# 编译器支持
compilers:
  - clang
  - gcc

# 构建系统
build_system: cmake

# 注意事项
notes:
  - "默认编译为静态库（libstorm.a）"
  - "内嵌zlib、bzip2、libtomcrypt、libtommath，无外部依赖冲突"
  - "无命令行工具，纯库文件"