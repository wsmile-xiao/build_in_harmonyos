# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: stormlib/9.40
homepage: "https://github.com/ladislav-zezula/StormLib"

# 上游测试命令：CTest 驱动 test/StormLib_test（STORM_BUILD_TESTS=ON 时）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
# 否：上游 test/CMakeLists.txt 硬依赖 ALSA（find_package(ALSA REQUIRED)）与
# OS 相关的硬编码 work 路径（STORMTEST_USE_OLD_PATHS 默认 ON），在沙箱/OHOS
# 上不可运行。改用 test_package 做真实功能往返验证（见下）。
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure (STORM_BUILD_TESTS)"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/StormTest.cpp
    source: StormLib-9.40/test/StormTest.cpp
    description: "上游 StormLib 自测程序（MPQ 增删改查全流程），但构建门槛含 ALSA 硬依赖"
    command: "ctest --output-on-failure"

# 豁免声明 (TEST_QUALITY_SPEC.md 3.3 / 平台限制)
exemptions:
  - rule: "upstream_ctest_not_runnable"
    reason: "上游 test 目标 find_package(ALSA REQUIRED) 且使用 OS 硬编码路径，OHOS 沙箱无 ALSA 音频栈与对应路径；功能覆盖改由 test_package 的真实 MPQ 往返测试提供（创建→写入→压缩→关闭→重开→读回→逐字节比对）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.c
    description: "链接打包的 libstorm + StormLib.h，完整 MPQ 生命周期：SFileCreateArchive → SFileCreateFile(COMPRESS|ENCRYPTED) → SFileWriteFile(ZLIB) → SFileFinishFile → SFileCloseArchive → SFileOpenArchive → SFileOpenFileEx → SFileGetFileSize → SFileReadFile → memcmp 逐字节断言，共 11 项断言"
    command: "./stormlib_consumer_test <tmpdir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11
