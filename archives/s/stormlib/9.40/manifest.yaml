# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/9.40/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.40"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: "{BUILD_SYSTEM}"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ladislav-zezula/StormLib/archive/refs/tags/v9.40.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "StormLib 用 CMake find_package(ZLIB)/find_package(BZip2) 选择系统库或内置副本：配 CMakeDeps 依赖 zlib/1.3.1.1 + bzip2/1.0.8.2 并保持 STORM_USE_BUNDLED_LIBRARIES=OFF 即自动定义 __SYS_ZLIB/__SYS_BZLIB 走系统库"
  - "上游 test/CMakeLists.txt 硬依赖 find_package(ALSA REQUIRED) 且用 OS 硬编码路径——STORM_BUILD_TESTS=OFF，功能覆盖移到 test_package 的真实 MPQ 往返"
  - "StormLib 的 SFileReadFile 缓冲区大于文件长度时返回 FALSE + SErrGetLastError()=1002 (ERROR_HANDLE_EOF)，即使数据已全部读出；须先用 SFileGetFileSize 取精确长度再读"
  - "StormPort.h 定义 StormLib 专属 GetLastError/SetLastError，诊断错误码用 SErrGetLastError()（不要 include windows.h）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
