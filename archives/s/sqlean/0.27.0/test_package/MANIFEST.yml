# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sqlean/0.27.0
homepage: "https://github.com/nalgeon/sqlean"

# 上游测试命令: 无统一 check 目标；上游 Makefile 提供 test 目标，
# 形式为 `sqlite3 < test/$(suite).sql`，并用 `! grep -Ex "[0-9_]+.[^1]"`
# 校验每行查询结果均以 1 结尾（14 个套件）
upstream_check_command: "make test SUITE=<suite> (等价: sqlite3 < test/<suite>.sql)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "逐套执行 sqlite3 < test/<suite>.sql 并按上游 grep -Ex 校验全部结果为 1"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/crypto.sql
    source: sqlean-0.27.0/test/crypto.sql
    description: "crypto 扩展套件：sha1/sha256/md5/base64 等函数断言"
    command: "sqlite3 < test/crypto.sql"
  - file: test/define.sql
    source: sqlean-0.27.0/test/define.sql
    description: "define 扩展套件：自定义 SQL 函数断言"
    command: "sqlite3 < test/define.sql"
  - file: test/fileio.sql
    source: sqlean-0.27.0/test/fileio.sql
    description: "fileio 扩展套件：readfile/writefile 文件读写断言"
    command: "sqlite3 < test/fileio.sql"
  - file: test/fuzzy.sql
    source: sqlean-0.27.0/test/fuzzy.sql
    description: "fuzzy 扩展套件：字符串相似度断言"
    command: "sqlite3 < test/fuzzy.sql"
  - file: test/ipaddr.sql
    source: sqlean-0.27.0/test/ipaddr.sql
    description: "ipaddr 扩展套件：IP 地址解析断言"
    command: "sqlite3 < test/ipaddr.sql"
  - file: test/math.sql
    source: sqlean-0.27.0/test/math.sql
    description: "math 扩展套件：数学函数断言"
    command: "sqlite3 < test/math.sql"
  - file: test/regexp.sql
    source: sqlean-0.27.0/test/regexp.sql
    description: "regexp 扩展套件：正则匹配断言"
    command: "sqlite3 < test/regexp.sql"
  - file: test/sqlean.sql
    source: sqlean-0.27.0/test/sqlean.sql
    description: "sqlean 合并扩展套件：全扩展联合断言"
    command: "sqlite3 < test/sqlean.sql"
  - file: test/stats.sql
    source: sqlean-0.27.0/test/stats.sql
    description: "stats 扩展套件：统计函数断言"
    command: "sqlite3 < test/stats.sql"
  - file: test/text.sql
    source: sqlean-0.27.0/test/text.sql
    description: "text 扩展套件：字符串函数断言"
    command: "sqlite3 < test/text.sql"
  - file: test/time.sql
    source: sqlean-0.27.0/test/time.sql
    description: "time 扩展套件：日期时间函数断言"
    command: "sqlite3 < test/time.sql"
  - file: test/unicode.sql
    source: sqlean-0.27.0/test/unicode.sql
    description: "unicode 扩展套件：Unicode 函数断言"
    command: "sqlite3 < test/unicode.sql"
  - file: test/uuid.sql
    source: sqlean-0.27.0/test/uuid.sql
    description: "uuid 扩展套件：UUID 生成断言"
    command: "sqlite3 < test/uuid.sql"
  - file: test/vsv.sql
    source: sqlean-0.27.0/test/vsv.sql
    description: "vsv 扩展套件：CSV 虚表断言"
    command: "sqlite3 < test/vsv.sql"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sqlean.c
    description: "消费者测试：sqlite3_load_extension 加载 math/crypto 扩展并断言 5 项查询结果"
    command: "./test_sqlean <扩展目录>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
