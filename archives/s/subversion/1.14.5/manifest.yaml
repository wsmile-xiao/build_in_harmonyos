software: subversion
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.14.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.14.5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/subversion-1.14.5.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: autotools

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-apr=/storage/Users/currentUser/usr/local"
    - "--with-apr-util=/storage/Users/currentUser/usr/local"
    - "--with-lz4=internal"
    - "--with-utf8proc=internal"
    - "--with-sqlite=sqlite-amalgamation"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "apr/1.7.6"
    - "apr-util/1.6.3"
    - "expat/2.7.1"
    - "zlib/1.3.1"
    - "openssl/1.1.1w"

  # 编译器
  cc: clang
  cxx: clang++

  # 预配置步骤（G0 验证需执行）
  pre_configure_steps:
    - "下载 SQLite amalgamation 并解压到 sqlite-amalgamation 目录"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"
  - "0002-build-config.guess.patch"
  - "0003-build-config.sub.patch"
  - "0004-gen-make.opts.patch"

# R23 备注：build/config.guess 和 build/config.sub 是源文件（非生成文件）
# 通过补丁更新为 2023 版本以支持 HarmonyOS 平台识别
# hints 目录保留用于文档记录，但不由 clean_verify.py 自动应用

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007 变体: 旧版 config.guess (2015-01-01) 必须使用 echo+exit 语法"
  - "E072: config.sub 需要在 maybe_os KERNEL-OS 列表中添加 linux-ohos*"
  - "E011 变体: HMDFS 临时目录创建失败，需使用 TMPDIR 环境变量"
  - "HMDFS umask 077 导致权限问题，需改为 umask 000"
  - "zsh/bash 差异: config.status 的 ECHO 变量使用 'print -r --' (zsh)，需改为 'echo'"
  - "SQLite amalgamation 内嵌编译需单独下载并解压到源码目录"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/subversion-1.14.5.orig
  source_work_dir: /storage/Users/currentUser/builds/subversion-1.14.5.work
  source_orig_hash: 5de84fcd0760a009
  source_work_hash: 8091ae488f83e6b0
  generated_at: '2026-05-26T10:05:00'
  patches_count: 4

patch_classification:
  - file: 0001-configure.patch
    type: source
    description: "TMPDIR 支持：使用 TMPDIR 环境变量替代固定路径"
    guard: 'pending'
  - file: 0002-build-config.guess.patch
    type: source
    description: "更新 config.guess 至 2023 版本支持 HarmonyOS 平台识别"
    guard: 'pending'
  - file: 0003-build-config.sub.patch
    type: source
    description: "更新 config.sub 至 2023 版本接受 HarmonyOS 平台三元组"
    guard: 'pending'
  - file: 0004-gen-make.opts.patch
    type: source
    description: "删除 --release 选项"
    guard: 'pending'