software: subversion
display: "Subversion (SVN)"
description: "开源版本控制系统，支持目录版本控制、原子提交、版本化元数据、高效分支和标签"
category: development
homepage: "https://subversion.apache.org"
license: Apache-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "基于 autotools 构建系统"
    - "需要 APR 和 APR-util 依赖"
    - "SQLite amalgamation 需单独下载"
    - "HMDFS 需使用 TMPDIR 环境变量"
  common_dependencies:
    - "apr/1.7.6"
    - "apr-util/1.6.3"
    - "expat/2.7.1"

versions:
  "1.14.5":
    status: published
    build_date: "2026-05-25"
    source_url: "https://dlcdn.apache.org/subversion/subversion-1.14.5.tar.gz"