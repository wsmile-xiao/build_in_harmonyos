software: shfm
display: shfm
description: "File manager written in POSIX shell (single script, no compilation)"
category: tool
homepage: "https://github.com/dylanaraps/shfm"
license: MIT
build_system: custom
ohos_adaptation:
  key_points:
    - "Pure POSIX sh script: packaged as-is into bin/shfm, nothing is compiled; shebang stays #!/bin/sh"
    - "One 3-line patch makes the documented cd-on-exit contract (`cd \"$(shfm)\"`) work in mksh (OHOS /bin/sh), bash and zsh: the path is written to a saved copy of the caller's stdout (fd 3) instead of '>&1', which is still /dev/tty inside the EXIT trap in those shells"
    - "Runtime needs a controlling terminal (main is run with >/dev/tty) plus POSIX [, printf, dd and stty; no Conan dependency"
  common_dependencies: []
versions:
  "0.4.2":
    status: built
    build_date: "2026-10-04"
sources:
  url: "https://github.com/dylanaraps/shfm/archive/refs/tags/0.4.2.tar.gz"
  sha256: "3861d1130cefbeef4306da686997143c95386c6b5a229472b11053a2da0ddfe4"
