# test_package/MANIFEST.yml — shfm 0.4.2
# CI L0e requires this file to exist.

package: shfm/0.4.2
homepage: "https://github.com/dylanaraps/shfm"

# Upstream test inventory (R51), taken from the official 0.4.2 tag archive
# (3861d113...): LICENSE, README, shfm, .github/workflows/main.yml.
# tests/ directories: 0; ctest/pytest registrations: 0.  The only upstream
# automated check is the GitHub workflow `shellcheck shfm` (a lint, not a test);
# it was run locally on the original and on the patched script, both clean.
upstream_check_command: "shellcheck shfm"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package tests (consumer perspective, executed by `conan create`)
test_package_tests:
  - file: drive_shfm.py
    description: "OHOS-specific consumer flow 1/2: runs the packaged bin/shfm on a pty (shfm needs /dev/tty, stty and dd) once under `bash` and once through its #!/bin/sh shebang; navigates with j/l, opens a file through SHFM_OPENER (argument and closed fd 3 checked) and quits with q; asserts the cd-on-exit path arrives on stdout, which the unpatched script fails under bash, mksh and zsh"
    command: "conan create . -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"
  - file: consumer.c
    description: "OHOS-specific consumer flow 2/2: the directory printed by shfm supplies consumer.c, which is cross-compiled for OHOS aarch64 (static, Clang) and run with qemu-aarch64 (direct on aarch64) inside that directory; checks cwd == shfm output and the directory listing"
    command: "conan create . -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"

# Approximate assertion count: drive_shfm.py makes 12 checks per launcher (4 status-line waits,
# 5 listing names, opener record, exit status, stdout) x 2 launchers + executable bit +
# launcher agreement = 26; consumer.c adds 4 (argument/cwd, cwd == shfm output, opendir, contents).
assertion_count: 30
