patches:
  "0.4.2":
    - patch_file: "patches/0001-shfm.patch"
      patch_description: "cd-on-exit: save the caller's stdout as fd 3 before `main >/dev/tty` and print the final $PWD there. `>&1` inside the EXIT trap is still /dev/tty in mksh (the OHOS /bin/sh), bash and zsh, so `cd \"$(shfm)\"` received an empty string; only dash restores stdout before the trap. Children started by cmd_run get fd 3 closed so they cannot hold the capture pipe open."
      patch_type: "portability"
