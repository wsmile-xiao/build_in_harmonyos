software: sshguard
version: "2.5.1"
status: published
build_date: "2026-06-12"

source:
  url: "https://downloads.sourceforge.net/project/sshguard/sshguard/2.5.1/sshguard-2.5.1.tar.gz"
  sha256: "997a1e0ec2b2165b4757c42f8948162eb534183946af52efc406885d97cb89fc"
  tar_format: tar.gz

build:
  build_system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0002-configure.patch"
  - "0003-src-blocker-blocklist.c.patch"

patch_classification:
  - file: 0002-configure.patch
    type: platform_patch
    platform_only: true
    guard: null
    description: "E011 HMDFS umask 077 导致 config.status Permission denied，改为 umask 022"
  - file: 0003-src-blocker-blocklist.c.patch
    type: platform_patch
    platform_only: true
    guard: __OHOS__
    description: "musl 不支持 pthread cancellation，添加 #ifdef __OHOS__ 宏守卫将 pthread_testcancel/pthread_setcancelstate 替换为 no-op"

knowledge_gained:
  - "E011 HMDFS umask 077 导致 configure Permission denied，需 sed 替换为 umask 022"
  - "musl 不支持 pthread_testcancel/pthread_setcancelstate，需用 __OHOS__ 宏守卫替换为 no-op"
  - "lld linker 依赖 libxml2.so.16，需将 OHOS SDK lib 目录加入 LD_LIBRARY_PATH 或创建符号链接到 ~/usr/local/lib"