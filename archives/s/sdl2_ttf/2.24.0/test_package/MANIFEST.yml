# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sdl2_ttf/2.24.0
homepage: "https://github.com/libsdl-org/SDL_ttf"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build build --target test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "cd build && cmake --build . --target test"

# 上游实际运行的测试程序
# SDL_ttf 2.24.0 上游包含 CMake package 测试和版本测试脚本
upstream_tests:
  - file: cmake/test/main.c
    source: SDL2_ttf-2.24.0/cmake/test/main.c
    description: "CMake package 测试：验证 SDL2_ttf 的 CMake config 可用性，调用 TTF_Init()+TTF_Quit() 生命周期"
    command: "./main_static"
  - file: build-scripts/test-versioning.sh
    source: SDL2_ttf-2.24.0/build-scripts/test-versioning.sh
    description: "版本号一致性测试：检查 SDL_ttf.h 中版本宏与 CMake/autotools 配置一致"
    command: "sh build-scripts/test-versioning.sh"

# test_package 中自带的测试 (消费者视角验证)
# 基于上游 cmake/test/main.c 和 test-versioning.sh 扩展
test_package_tests:
  - file: test.c
    description: "TTF API 生命周期功能测试（headless，7 项断言）"
    command: "./test_sdl2_ttf"
  - file: test_version.c
    description: "版本一致性测试（基于上游 test-versioning.sh，5 项断言）"
    command: "./test_version"
  - file: test_ohos.c
    description: "OpenHarmony 鸿蒙特有测试：验证 TTF 在无显示服务器(headless)环境下正常工作（5 项断言）"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
# test.c: 7 项 + test_version.c: 5 项 + test_ohos.c: 5 项 = 17 项
assertion_count: 17
