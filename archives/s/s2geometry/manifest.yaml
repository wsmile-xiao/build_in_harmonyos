# s2geometry 软件元数据
# 文件位置: archives/s/s2geometry/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件基本信息
# ============================================================

# 软件名称（必须）
name: s2geometry

# 软件描述（必须）
description: |
  S2 Geometry Library 是 Google 开发的球面几何计算库，用于处理球面坐标系上的几何运算。
  提供点、线、多边形等几何形状的精确计算，支持空间索引、区域覆盖、距离计算等功能。

# 软件分类（必须）
category: math

# 官方网站
website: https://github.com/google/s2geometry

# 许可证
license: Apache-2.0

# ============================================================
# 版本索引（必须）
# ============================================================

# 已编译版本列表
versions:
  "0.10.0":
    status: built
    build_date: "2026-06-17"
    notes: "C++17 兼容 abseil-cpp 20240722.0"

# ============================================================
# 维护信息
# ============================================================

# 维护者
maintainer: openharmony-compile-agent

# 最后更新日期
last_updated: "2026-06-17"

# ============================================================
# 依赖信息
# ============================================================

# 核心依赖
dependencies:
  required:
    - "abseil-cpp >= 20240722.0"
    - "openssl >= 1.1.1w"

# 编译依赖
build_dependencies:
  - cmake >= 3.12
  - clang >= 15.0
  - abseil-cpp/20240722.0

# ============================================================
# 编译特性
# ============================================================

# 构建系统
build_system: cmake

# 支持的构建类型
build_types:
  - Release
  - Debug

# 编译器要求
compiler_requirements:
  cxx_standard: "17"
  minimum_clang_version: "15.0"

# ============================================================
# 特殊说明
# ============================================================

# 编译注意事项
compilation_notes:
  - "CMakeLists.txt 默认 C++11，必须修改为 C++17 以兼容 abseil-cpp"
  - "命令行 CMAKE_CXX_STANDARD 参数会被 CMakeLists.txt 内的 set() 覆盖"
  - "需要修改源码第 22 行: set(CMAKE_CXX_STANDARD 17)"
  - "不提供 CMake config 文件，用户需手动配置路径"

# 已知问题
known_issues:
  - "无 CMake config 文件"
  - "默认不编译动态库"
  - "单元测试需配置 GTEST_ROOT"