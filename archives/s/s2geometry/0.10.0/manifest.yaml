software: s2geometry
# 版本级 manifest 模板
# 文件位置: archives/s/s2geometry/0.10.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/google/s2geometry/archive/refs/tags/v0.10.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型（必须字段）
# cmake | autotools | makefile | meson | custom
build_system: cmake

build:

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DWITH_GFLAGS=OFF"
    - "-DOPENSSL_ROOT_DIR=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "abseil-cpp/20240722.0"
    - "openssl/1.1.1w"

  # 编译器
  cc: clang
  cxx: clang++

  # C++ 标准（重要）
  cxx_standard: "17"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMakeLists.txt 默认使用 C++11，需修改为 C++17 以兼容 abseil-cpp 20240722.0"
  - "命令行 CMAKE_CXX_STANDARD=17 参数会被 CMakeLists.txt 内的 set(CMAKE_CXX_STANDARD 11) 覆盖"
  - "必须修改 CMakeLists.txt 第 22 行：set(CMAKE_CXX_STANDARD 17)"
  - "s2geometry 不提供 CMake config 文件，用户需手动指定 include 和 lib 路径"
  - "静态库 libs2.a 约 3.5MB，包含完整的几何计算功能"
  - "头文件约 121 个，分布在 s2/, s2/base/, s2/util/ 子目录"

# ============================================================
# 产物信息
# ============================================================

artifacts:
  # 库文件
  libraries:
    - "lib/libs2.a"

  # 头文件目录
  headers:
    - "include/s2/"
    - "include/s2/base/"
    - "include/s2/util/bits/"
    - "include/s2/util/coding/"
    - "include/s2/util/endian/"
    - "include/s2/util/gtl/"
    - "include/s2/util/hash/"
    - "include/s2/util/math/"
    - "include/s2/util/units/"