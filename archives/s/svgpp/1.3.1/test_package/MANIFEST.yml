# test_package/MANIFEST.yml —— CI L0e 六件套声明
# 数字与 archives/s/svgpp/1.3.1/notes.md 的「测试五维账本」、PR 正文同源。
# 骨架由 conan-init 生成；本文件把它填成可证伪的真数，并按 SKILL 口径
# 区分「静态声明 / 构建系统注册 / 真机执行 / 未执行分类 / 消费者」。
package: "svgpp/1.3.1"
homepage: "https://github.com/svgpp/svgpp"

# 上游既无 make check 也无 ctest 注册：官方 CI（azure-pipelines.yml）直接构建并运行单二进制
# ParserGTest。本配方在 conan create 的 build() 内以同口径真实执行（层 1 已集成）。
upstream_check_command: "conan create 内 build() 编译并运行 ParserGTest（standalone 配置 src/test + -DCMAKE_PROJECT_INCLUDE 注入，零上游源码修改）"

upstream_test_in_build: true
upstream_test_command: "./ParserGTest --gtest_color=no --gtest_output=xml:parser_gtest.xml"

upstream_tests:
  - file: "src/test/（23 个纳入 ParserGTest 目标的测试 TU + 内嵌 gtest/gmock 3 个 TU）"
    source: "svgpp-1.3.1/src/test/CMakeLists.txt"
    description: >
      GoogleTest 单二进制，已在配方 build() 内真机执行（conan create 内，
      证据 archives/s/svgpp/1.3.1/reports/w3-local-ci.log 行 215-241（`cmake --build … --target ParserGTest` 与 26 个 `Building CXX object`）、245（`Running main() from gmock_main.cc`）、739-740（`200 tests from 30 test cases ran.` / `[  PASSED  ] 200 tests.`）；消费者断言在同文件 825 行）。
      静态宏声明 52（TEST 29 + TEST_F 4 + TEST_P 19）；纳入 ParserGTest 目标 50
      ——path_adapter_test.cpp 与 supported_value_parsers_test.cpp 各 1 个 TEST
      被上游自己从源列表注释掉、不入目标。实跑 200 例 =（非参数化 35 = 注册宏 31
      + transform_strict_grammar_test.cpp 以 #define SVGPP_STRICT_TRANSFORM_SEPARATOR
      再次 #include transform_grammar_test.cpp 产生的同名套件 4 例）+（参数化实例 165
      = 19 个 TEST_P 经 19 处 INSTANTIATE 按参数展开）。逐项结果：200 通过 / 0 失败 /
      0 跳过 / 0 disabled，gtest 汇总行「[  PASSED  ] 200 tests.」与 XML
      tests=200 failures=0 disabled=0 errors=0 双向一致。50 个注册宏全部被执行覆盖，
      无「注册未执行」项。
    command: "./ParserGTest --gtest_color=no --gtest_output=xml:parser_gtest.xml（conan create 的 build() 内执行）"
  - file: "src/test/check_headers/（CheckHeadersAutonomy 目标）"
    source: "svgpp-1.3.1/src/test/CMakeLists.txt"
    description: "编译期头文件自治检查：每个公开头文件生成一个只做 include 的 TU，编过即通过，不产出运行期用例；上游刻意排除 policy/xml/*，与本配方打包范围口径一致。未纳入配方 build()（约 150+ 个纯 include TU，构建成本全在编译期、无运行期用例可入账），其覆盖面由 ParserGTest 的全部 200 例对同一批头文件的实际使用提供主证据；如实声明，不当作失败"
    command: "编译即检查（无运行期用例）"
  - file: "src/test/full_parse_main.cpp + full_parse_test.cpp + full_parse_test2.cpp（FullParseTest 目标）"
    source: "svgpp-1.3.1/src/test/CMakeLists.txt"
    description: "自带 main()、需从命令行读入 SVG 文档的整篇解析基准工具，属工具而非测试套件"
    command: "./FullParseTest <svg-file>"

# 消费者视角（层 2）：conan create 自动编译、链接并运行，退出码决定 G2
test_package_tests:
  - file: "test_svgpp.cpp"
    description: "以库使用者身份 include svgpp/parser/grammar/path_data.hpp 与 transform.hpp，链接 svgpp::svgpp，解析 5 组 path/transform 串并逐项核对几何事件（坐标、绝对/相对标志、弧标志）。静态断言点 24、真机执行 24、失败 0"
    command: "./test_svgpp"

# 消费者程序自证的断言数（运行时打印 checks=<n> failures=<m>），与上条同源
assertion_count: 24
