knowledge_gained:
  - "svgpp 是 header-only，但 79 个公开头 #include <boost/...>（Spirit/Qi、MPL、Phoenix、Range、Fusion），所以 Boost 是公开依赖而非测试依赖：requires(boost/1.90.0, transitive_headers=True) + cpp_info.requires=['boost::boost']。"
  - "打包集合必须是 include/svgpp/** 加 include/exboost/**，且扩展名不止 .hpp（实测 173 hpp + 18 inc），只 copy *.hpp 会漏装 .inc。"
  - "上游 tag 包根目录没有构建 marker，init-build 的嵌套源码提升会把 doc/sphinx 当源码根并删除真实源码；header-only 包要手工 tar --strip-components=1 重建 .orig/.work。"
  - "上游 src/test/CMakeLists.txt 不 find_package(Boost)（Boost include 由父级 src/CMakeLists.txt 提供，而父级会额外编 agg 且在 CMake 4.x 下不可用），独立配置 src/test 时用 -DCMAKE_PROJECT_INCLUDE 注入 include_directories 与 -pthread，可零修改上游。"
  - "上游 CMakeLists 的 cmake_minimum_required(VERSION 2.8) 在 CMake 4.1.2 下被拒，需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5。"
  - "svgpp 的 XML 后端是策略头（include/svgpp/policy/xml/*），配方不 require 任何 XML 库；上游自己的头文件自治检查同样排除 policy/xml。"
  - "静态宏数≠执行数在本包有三个叠加机制：19 个 TEST_P 经 INSTANTIATE 参数展开成 165 实例；transform_strict_grammar_test.cpp 用 #define SVGPP_STRICT_TRANSFORM_SEPARATOR 再次 #include transform_grammar_test.cpp，把 4 个 TEST 以同名套件再执行一遍（严格分隔符模式）；2 个 TU 被上游注释出目标。注册宏 50 个全部被执行覆盖，实跑 200 例。"
  - "header-only 包把上游测试跑进 build() 的可行通道（burst/3.1.1 同形）：generate() 里 CMakeToolchain + cache_variables 注入 CMAKE_PROJECT_INCLUDE/CMAKE_POLICY_VERSION_MINIMUM，OHOS 下用 CMAKE_SYSTEM_NAME=Linux 走 CMake 平台模型（保留 OHOS clang），build() 里 cmake.configure(build_script_folder=src/test) + 只构建 ParserGTest 目标 + self.run(env=conanrun) 执行；26 个 TU -j4 实测 140s，远低于 conan-verify G2 的 3600s 硬超时。"

