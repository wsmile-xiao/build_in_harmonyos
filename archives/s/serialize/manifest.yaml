# 软件级 manifest — serialize
software: serialize
display: "serialize"
description: "单头文件 C++ 位打包序列化库（bitpacking serializer）"
category: library
homepage: "https://github.com/mas-bandwidth/serialize"
license: BSD-3-Clause

build_system: cmake

ohos_adaptation:
  key_points:
    - "单头文件库（serialize.h），上游为 CMake INTERFACE target `serialize`（别名 serialize::serialize），安装 include/serialize.h 与 lib/cmake/serialize/*.cmake"
    - "上游自带测试套件 test.cpp（17 个 SERIALIZE_RUN_TEST 函数，CTest 注册 1 项）；配方 build() 打开 SERIALIZE_BUILD_TESTS 并执行 cmake.test()，保持上游测试入口"
    - "字节序检测依赖编译器 __BYTE_ORDER__：OHOS aarch64 clang 15 已定义，serialize.h 直接解析为 LITTLE_ENDIAN；wire format 固定小端（host_to_network 在 OHOS 上为恒等映射）"
    - "OHOS/musl 的 wchar_t 为 4 字节，wstring 非 BMP 码点（如 U+1F600）可完整往返；线上格式固定 32 bit/字符，跨平台兼容"
    - "header-only 无需链接：serialize::serialize 为 INTERFACE target，消费者只继承 include 路径，无警告/浮点标志泄漏"
  common_dependencies: []

versions:
  "1.4.4":
    status: built
    build_date: "2026-09-22"
    conan_ref: "serialize/1.4.4"
