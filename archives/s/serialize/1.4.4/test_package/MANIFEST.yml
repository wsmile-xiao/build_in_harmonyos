# test_package/MANIFEST.yml — serialize 1.4.4
# 上游官方测试声明文件 (L0e)
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 计数口径（全仓统一，见 notes.md「测试计数口径」）：
#   上游测试 = 上游测试函数数（SERIALIZE_RUN_TEST 注册项），共 17 项。
#   CTest 侧只注册 1 个 case（add_test(NAME test ...)），该 case 顺序执行
#   serialize.h 内 17 个 test_* 函数；两项口径并存，本文件以「测试函数」为准。

package: serialize/1.4.4
homepage: "https://github.com/mas-bandwidth/serialize"

# 上游测试命令（CMake + CTest）
upstream_check_command: "ctest --test-dir build --output-on-failure"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test()  →  ctest --test-dir <build> --output-on-failure"

# 上游实际运行的测试（serialize.h 内 SERIALIZE_ENABLE_TESTS 块，17 个测试函数）
upstream_tests:
  - file: serialize.h
    source: serialize-1.4.4/serialize.h (#if SERIALIZE_ENABLE_TESTS 块)
    description: "test_endian — 字节序探测（8 项 serialize_check）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_bitpacker — BitWriter/BitReader 混合位宽往返（19 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_bits_required — bits_required 边界（12 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_bits_required64 — bits_required64 边界（9 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_zigzag — zigzag 有符号/无符号互转（15 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_serialize — 结构体全类型字段序列化（30 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_read_write — 读写流统一 Serialize 模板（1 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_serialize_integer_validation — 整数越界校验（1 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_serialize_integer_full_range — int 全范围（6 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_serialize_int64_full_range — int64 全范围（10 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_serialize_int64_validation — int64 越界校验（2 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_serialize_bytes_validation — 字节数组越界校验（2 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_int_relative_validation — 相对整数编码与越界（10 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_compressed_float_validation — 压缩浮点越界（7 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_golden_wire_format — 黄金字节流格式（写侧 72 B 逐字节 + 读侧 23 项断言）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_unaligned_writer — 非 4 字节对齐缓冲区写路径（8 项）"
    command: "./bin/test"
  - file: serialize.h
    source: serialize-1.4.4/serialize.h
    description: "test_large_buffer — >2^31 bit（320 MB）大缓冲跨 256 MB 边界往返（11 项）"
    command: "./bin/test"

# test_package 中自带的测试（消费者视角验证，真实调用被测包 API）
test_package_tests:
  - file: test_serialize.cpp
    description: "消费者测试：BitWriter/BitReader 混合位宽往返 + 结构体 Serialize 往返 + 整数范围编码 + bits_required/zigzag 辅助函数"
    command: "./test_serialize"
  - file: ohos_serialize_test.cpp
    description: "鸿蒙专项测试：字节序探测与实机内存布局一致 + 小端 wire format（host_to_network 恒等）+ OHOS 4 字节 wchar_t 非 BMP 码点往返"
    command: "./test_serialize_ohos"

# 鸿蒙特有测试（OHOS aarch64 musl 运行时实跑，命令与日志见 notes.md）
ohos_specific_tests:
  - file: test_package/ohos_serialize_test.cpp
    description: "OHOS 专项测试：3 组平台断言（字节序/LITTLE_ENDIAN 一致性、小端 wire format 恒等映射、sizeof(wchar_t)==4 非 BMP 往返）"
    command: "clang++ --target=aarch64-linux-ohos -std=c++11 -O2 -DNDEBUG -I<src> test_package/ohos_serialize_test.cpp -o test_serialize_ohos && ./test_serialize_ohos"

# 断言总数（近似值，用于质量评估）
# 上游 serialize_check 断言 175 项（serialize.h 内 grep -c 'serialize_check(' ）
# + 消费者测试 25 项 CHECK + 鸿蒙专项测试 22 项 CHECK（均为实际调用点计数）
assertion_count: 222
