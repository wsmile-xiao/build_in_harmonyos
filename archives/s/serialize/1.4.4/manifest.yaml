# 版本级 manifest — serialize 1.4.4
# 遵循 ARCHIVE-SPEC v3.0

version: "1.4.4"
software: serialize
status: built
build_date: "2026-09-22"
build_system: header-only
conan_ref: "serialize/1.4.4"

source:
  url: "https://github.com/mas-bandwidth/serialize/archive/refs/tags/v1.4.4.tar.gz"
  sha256: "635c7d0b04bdee3256ca7ac5fc91ae5dea14f08368496dd6cc28f7bd49905e70"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "SERIALIZE_BUILD_TESTS=True"
    - "SERIALIZE_INSTALL=True"
    - "SERIALIZE_FUZZ=False"
    - "CMAKE_SYSTEM_NAME=Linux (settings.os in Linux|OHOS, R32)"
    - "CMAKE_SYSTEM_PROCESSOR=aarch64 (settings.os in Linux|OHOS, R32)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "serialize.h 的字节序检测首选编译器内建 __BYTE_ORDER__；OHOS aarch64 clang 15 定义了该宏（=1234），头文件无需 -DSERIALIZE_LITTLE_ENDIAN 即可正确解析为 LITTLE_ENDIAN"
  - "该头文件的架构宏回退链不含 __aarch64__/__arm__（仅 _M_ARM64 覆盖 Windows ARM64 的 MSVC 路径）；若编译器不提供 __BYTE_ORDER__（如 -undef），aarch64 会落入 #error 分支，需用户显式定义 SERIALIZE_LITTLE_ENDIAN"
  - "上游 wire format 固定小端（库内称 network byte order 为 little endian），OHOS aarch64 上 host_to_network() 为恒等映射"
  - "OHOS/musl 的 wchar_t 为 4 字节：serialize_wstring_internal 走 4 字节分支，非 BMP 码点（U+1F600）可完整往返；2 字节平台读取超出 BMP 的码点会返回 false 而非截断"
  - "上游 CMake 的 serialize::serialize 为 INTERFACE target，只传递 include 路径，测试/示例/基准目标仅在顶层工程构建时不泄漏标志"
