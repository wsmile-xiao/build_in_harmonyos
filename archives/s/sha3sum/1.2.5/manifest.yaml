software: sha3sum
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-07"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/maandree/sha3sum/tar.gz/refs/tags/1.2.5"

  # 源码校验和
