# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sha3sum/1.2.5
homepage: "https://github.com/maandree/sha3sum"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/Makefile
    source: sha3sum-1.2.5/test/Makefile
    description: "上游 make check 测试套件"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者 smoke test: 验证 sha3sum 对空输入产生正确的 SHA-3-224 哈希"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
