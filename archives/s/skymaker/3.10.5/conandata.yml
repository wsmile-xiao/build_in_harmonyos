sources:
  skymaker:
    url: "https://github.com/astromatic/skymaker/archive/refs/tags/3.10.5.tar.gz"
    sha256: "0521bcf3fad4b362870ef06ca39b96fd85b6a1e5235192db551a4406df8a46c2"

patches:
  - patch_file: "patches/0001-src-Makefile.in.patch"
    patch_description: "src/Makefile.in: sky_LDADD/DEPENDENCIES 的 fits/wcs 子库路径从 $(srcdir) 改 $(builddir)（out-of-source 构建下 .a 生成在构建目录——No rule to make target 实测；sdist 含预生成 Makefile.in——configure 直接用，需 patch Makefile.in 而非 .am，同 stiff）"
    patch_type: "portability"
  - patch_file: "patches/0002-Makefile.in.patch"
    patch_description: "Makefile.in: dist_pkgdata_DATA 的 config/* glob 加 $(srcdir) 前缀（out-of-source 构建下 glob 不匹配——No rule to make target 'config/*' 实测，同 scamp/sextractor）"
    patch_type: "portability"
  - patch_file: "patches/0003-fitscat.h.patch"
    patch_description: "fitscat.h: bswapflag 从定义改 extern 声明（duplicate symbol 实测，同 missfits/weightwatcher/stiff）"
    patch_type: "portability"
  - patch_file: "patches/0004-fitscat.c.patch"
    patch_description: "fitscat.c: 补 bswapflag 实际定义（extern 声明需单一 .c 提供定义）"
    patch_type: "portability"
  - patch_file: "patches/0005-globals.h.patch"
    patch_description: "globals.h: gstr 从定义改 extern 声明（duplicate symbol 实测，同 missfits/weightwatcher/stiff）"
    patch_type: "portability"
  - patch_file: "patches/0006-fitscat_defs.h.patch"
    patch_description: "fitscat_defs.h: gstr 从定义改 extern 声明（fits 库多 .c include 后各自定义——duplicate symbol 实测；main.c 保留唯一定义，同 stiff）"
    patch_type: "portability"
  - patch_file: "patches/0008-prefs.h.patch"
    patch_description: "prefs.h: prefs 从定义改 extern 声明（duplicate symbol 实测，同 missfits/weightwatcher/stiff）"
    patch_type: "portability"
  - patch_file: "patches/0009-main.c.patch"
    patch_description: "main.c: 补 gstr + prefs 实际定义（extern 声明需单一 .c 提供定义——prefs.h include 之后）"
    patch_type: "portability"
