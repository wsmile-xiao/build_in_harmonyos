# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: spacefm/1.0.6
homepage: "https://github.com/IgnorantGuru/spacefm"

# 上游测试命令：空串。spacefm 1.0.6 tarball 无自动化测试套件（无 test/
# 目录，Makefile.am 无 TESTS/check_PROGRAMS）——GUI 桌面应用无测试骨架，
# 与 zsa-wally/aiac 等 no_tests 先例对齐。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# 否：上游无测试套件可集成。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# ── 上游测试审计（upstream_tests_exist=false 的显式证据）──
upstream_tests_exist: false
upstream_test_audit:
  method: "tarball 全量目录扫描（无 test/tests 目录）+ Makefile.am 全文 grep（无 TESTS/check_PROGRAMS/dist_check）+ 上游仓库 release-only 工作流确认"
  result: "0 个测试文件；上游是 GTK2 桌面应用，无自动化测试骨架"
  evidence: "tarball sha256 fedea9fc... 本地实测；Makefile.am 仅 bin_PROGRAMS + dist 槽位"

# test_package 中自带的测试 (消费者视角验证, rule4 逐项定性)
# GUI 运行时行为（窗口渲染/文件面板交互/桌面集成）无法在无显示环境验证
# （环境限制），消费者侧逻辑断言覆盖以下可无显示验证的路径：
test_package_tests:
  - file: test.sh
    description: "冒烟测试 3 断言: ①--version 输出版本信息或到达 GTK init 报 Cannot open display（无头环境 gtk_init 无显示=环境限制 rule4；两种结果均证明共享库全解析+打包完整）②--help 输出用法 rc=0 ③AArch64 ELF 架构核验（od 读 e_machine 字节）——窗口渲染与文件面板交互需 X11/Wayland 显示=环境限制，rule4 定性"
    command: "bash test.sh <bin/spacefm>"

# 测试断言总数 (近似值, 用于质量评估)
# 3 个消费者侧断言（2 CLI 逻辑 + 1 打包完整性）
assertion_count: 3
