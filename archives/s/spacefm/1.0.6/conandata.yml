# conandata.yml — spacefm 1.0.6
# 源码身份（W0 实测）：
#   任务卡 #10827 "spacefm 1.0.6"。上游 github.com/IgnorantGuru/spacefm，
#   tag 1.0.6（commit cc634c2a）。
#   sha256 本地实测。

sources:
  url:
    - "https://github.com/IgnorantGuru/spacefm/archive/refs/tags/1.0.6.tar.gz"
  sha256: "fedea9fcad776e0af4b8d90c5a1c86684a9c96ef1cdd4e959530ce93bdebe7c9"

patches:
  # 三元组补丁：config.guess HarmonyOS 分支 + config.sub linux-ohos*
  # （vlc 3.0.23 同款范式；生成后本地自测 sh ./config.guess →
  # aarch64-unknown-linux-ohos）
  - patch_file: "patches/spacefm-0001-ohos-triplet.patch"
  # udev 版本号方案对齐：spacefm 按 systemd-udev 版本号系要求 >=143，
  # eudev（API 全兼容独立分支）版本号系为 3.2.x——放宽下限为无版本要求
  - patch_file: "patches/spacefm-0002-udev-version-scheme.patch"
  # musl libc 差异：glibc 隐式声明 major/minor，musl（OHOS）需显式
  # #include <sys/sysmacros.h>——对全部使用 major()/minor() 的源文件补头
  - patch_file: "patches/spacefm-0003-musl-sysmacros.patch"
  # nls stub：glib libintl.h 宏改名 ngettext→g_libintl_ngettext，gailutil 无此
  # 变体——main.c 定义复数选择 fallback（--disable-nls 下按 n 选形）
  - patch_file: "patches/spacefm-0004-nls-ngettext-stub.patch"
