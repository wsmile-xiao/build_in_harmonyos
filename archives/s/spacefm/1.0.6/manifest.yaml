# 版本级 manifest — spacefm 1.0.6
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.6"

software: "spacefm"

# 编译状态: built (conan create 通过)
status: built

build_date: "2026-10-08"

# 构建系统 (必填顶层字段)
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/IgnorantGuru/spacefm/archive/refs/tags/1.0.6.tar.gz"
  sha256: "fedea9fcad776e0af4b8d90c5a1c86684a9c96ef1cdd4e959530ce93bdebe7c9"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  toolchain: "clang 15 (aarch64-unknown-linux-ohos) + -fcommon（legacy tentative definitions 合并语义，clang 15 默认 -fno-common 致 vfs-file-info.c/vfs-dir.c 的 xsets/evt_* 重复符号链接错误）"
  configure_options:
    - "--disable-nls（po 翻译层裁剪；intltool shim 应答探测）"
    - "--disable-video-thumbnails（libffmpegthumbnailer 不在制品仓）"
    - "--disable-startup-notification（OHOS 无桌面启动通知栈）"
  host: "aarch64-linux-ohos（三元组补丁 0001）"
  dependencies:
    - "gtk2/2.24.33（ohpcd 制品仓）"
    - "eudev/3.2.14（ohpcd 制品仓；configure.ac HAL 关闭时无条件 PKG_CHECK_MODULES(libudev>=143)，版本下限补丁 0002 放宽）"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "patches/spacefm-0001-ohos-triplet.patch"
    description: "config.guess 加 *:HarmonyOS:*:* 分支（aarch64→aarch64-unknown-linux-ohos）+ config.sub 两处认 linux-ohos*（vlc 3.0.23 同款范式；生成后本地自测 sh ./config.guess 输出 aarch64-unknown-linux-ohos）"
  - file: "patches/spacefm-0002-udev-version-scheme.patch"
    description: "udev 版本号方案对齐：configure.ac+configure 双处把 libudev >= 143 放宽为 libudev（spacefm 按 systemd-udev 版本号系，eudev API 全兼容但独立 3.2.x 号系）"
  - file: "patches/spacefm-0003-musl-sysmacros.patch"
    description: "src/main.c 补 #include <sys/sysmacros.h>（glibc 隐式声明 major/minor，musl/OHOS 需显式）"
  - file: "patches/spacefm-0004-nls-ngettext-stub.patch"
    description: "src/main.c 定义 g_libintl_ngettext 复数选择 fallback（glib 包 libintl.h 宏改名 ngettext→g_libintl_*，制品仓 gtk2 链 gailutil 仅带部分 stub 无 ngettext 变体；--disable-nls 下按 n 选形）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "桌面件 udev 依赖处置：spacefm configure.ac 的 HAL 分支关闭后无条件 PKG_CHECK_MODULES(libudev)（无 --disable-udev 开关），用 eudev 制品仓包满足（区别于 colord 先例的 --disable-udev 路线——colord 有开关，spacefm 没有）"
  - "intltool shim 先例复用（activity-log 0.9.7）：AC_PROG_INTLTOOL 探测 + data/Makefile.am 的 @INTLTOOL_DESKTOP_RULE@，shim 脚本应答 --version、其余 no-op，配合 --disable-nls"
  - "config.guess/config.sub 三元组补丁的保真生成法：改源后对 pristine tarball diff（/tmp 只读，pristine 解压放 ~/huawei/tmp）——纯手写 diff 曾因 sed 锚点转义失败产生错位"
  - "HMDFS umask 陷阱复用（vlc 3.0.23 先例）：configure 内嵌 umask 077 的临时目录在 HMDFS 不可写（E011），构建前 replace umask 022"
  - "GUI 桌面件验证口径：无显示环境（X11/Wayland 均不可用）下 --version/--help CLI 面 + AArch64 ELF 完整性断言；窗口渲染属环境限制（rule4）"
