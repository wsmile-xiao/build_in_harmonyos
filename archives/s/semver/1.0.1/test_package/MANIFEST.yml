# test_package/MANIFEST.yml
package: semver/1.0.1
homepage: "https://github.com/Neargye/semver"

upstream_check_command: "clang++ -std=c++17 -Iinclude -Itest/3rdparty test/test.cpp -o test_semver && ./test_semver"
upstream_test_in_build: true
upstream_test_command: "compile and run all test/*.cpp files in build()"

upstream_tests:
  - file: test.cpp
    source: semver-1.0.1/test/test.cpp
    description: >-
      Main upstream doctest suite. Covers parsing, comparison, operators,
      ranges, edge cases, config, API surface, etc. Compiled and executed
      inside build().
    command: "./test"
  - file: test_advanced_ranges.cpp
    source: semver-1.0.1/test/test_advanced_ranges.cpp
    description: "Advanced range matching tests."
    command: "./test_advanced_ranges"
  - file: test_api.cpp
    source: semver-1.0.1/test/test_api.cpp
    description: "API surface tests."
    command: "./test_api"
  - file: test_config.cpp
    source: semver-1.0.1/test/test_config.cpp
    description: "Config/header version consistency tests."
    command: "./test_config"
  - file: test_edge_cases.cpp
    source: semver-1.0.1/test/test_edge_cases.cpp
    description: "Edge case handling tests."
    command: "./test_edge_cases"
  - file: test_operators.cpp
    source: semver-1.0.1/test/test_operators.cpp
    description: "Operator overloading tests."
    command: "./test_operators"
  - file: test_parse.cpp
    source: semver-1.0.1/test/test_parse.cpp
    description: "Version string parsing tests."
    command: "./test_parse"

test_package_tests:
  - file: test.cpp
    description: >-
      Consumer-side API validation: parse("1.2.3"), compare versions,
      to_string round-trip, pre-release parsing. 9 assertions.
    command: "./test_semver"

assertion_count: 9
