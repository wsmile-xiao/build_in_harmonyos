# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: semver/0.3.0
homepage: "https://github.com/Neargye/semver"

# 上游测试命令 (CMake/Catch2 驱动)
upstream_check_command: "cd test && cmake -B build -DSEMVER_BUILD_TESTS=ON && cmake --build build && ctest --test-dir build"

# semver 上游测试为 CMake/Catch2 驱动（test/test.cpp 单文件，Catch2 单头 included）。
# header-only 库无构建步骤；上游测试在 conan-verify 阶段单独编译执行。
upstream_test_in_build: false
upstream_test_in_test_package: false

# 上游实际运行的测试程序（test/test.cpp 由 CMake 生成 test_semver）
upstream_tests:
  - file: test/test.cpp
    source: semver-0.3.0/test/
    description: "All upstream semver unit tests (Catch2 assertions)"
    command: "ctest --test-dir build"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_package.cpp
    description: "Downstream consumer test — parse / compare / satisfy checks against semver:: API"
    command: "./test_semver"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
