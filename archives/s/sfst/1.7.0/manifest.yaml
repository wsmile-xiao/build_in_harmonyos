version: "1.7.0"
software: sfst
status: built
build_date: "2026-09-27"
build_system: cmake

source:
  url: "https://github.com/santhoshtr/sfst/archive/refs/tags/1.7.0.tar.gz"
  sha256: "e158fb22637e051d2e395057ece30602d751fa59ee320263b63ef185bcefa44f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies:
    - readline/8.3
    - ncurses/6.6
  cc: clang
  cxx: clang++

patches_applied: []
source_guard: "replace_in_file EXISTS-guard for pybind11/python in source() (no patch file)"

knowledge_gained:
  - "Release tarball ships an empty pybind11/ submodule dir; guard add_subdirectory(pybind11/python) to keep C++ build self-contained"
  - "src/ registers zero CTest tests (no add_test); python/tests/test.py targets pybind11 bindings only and is out of scope"
  - "Upstream install(TARGETS libsfst RUNTIME ...) does not cover ELF shared lib; recipe adds fallback copy for lib/headers/bin"
