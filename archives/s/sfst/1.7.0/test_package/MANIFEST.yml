package: sfst/1.7.0
homepage: "https://github.com/santhoshtr/sfst"

upstream_tests_exist: false
upstream_test_audit:
  - source: "sfst-1.7.0/src/CMakeLists.txt and sfst-1.7.0/python/CMakeLists.txt"
    reason: "Neither file defines add_test(); grep add_test across the 1.7.0 tree returns zero hits."
  - source: "sfst-1.7.0 top-level CMakeLists.txt (cmake_minimum_required 3.20, add_subdirectory src/pybind11/python)"
    reason: "No enable_testing()/include(CTest) at top level or in src/; only python/ calls include(CTest)+enable_testing() with zero registered tests, so `ctest -N` reports Total Tests: 0."
  - source: "sfst-1.7.0 source tree (data/, doc/, src/, python/)"
    reason: "No tests/ directory, no `make check` target (CMake-only project), no ctest/pytest registration for the C++ library or CLI tools."
  - source: "sfst-1.7.0/python/tests/test.py + python/tests/easy.a"
    reason: "The only test file exercises the pybind11 extension (sfst.analyse/generate over easy.a); it requires the pybind11 submodule (empty in the release tarball, guarded off in source() via replace_in_file) plus a built python extension, so it is out of scope for this C++ conan package and cannot run here."
  - conclusion: "Upstream 1.7.0 provides no runnable automated tests for the packaged C++ library/CLI artifacts; the adaptation adds installed-artifact consumer coverage without presenting it as upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

upstream_test_total: 0
upstream_test_count_method: ctest_entries

test_package_tests:
  - file: test_sfst.cpp
    description: "Link libsfst and exercise real API: Alphabet add_symbol/symbol2code/code2symbol round-trip plus Label epsilon semantics (2 assertions, always run)."
    command: "./test_sfst"
  - file: conanfile.py
    description: "Run installed fst-infl -v and require the version banner when the package shipped fst-* tools (upstream builds tools only when native FLEX+BISON are both found; library-only build declares an environment gap instead of failing)."
    command: "fst-infl -v"

test_scenario_count: 2
assertion_count: 3
assertion_count_basis:
  cpp_consumer_api: 2
  cli_version_smoke: 1
cli_version_smoke_conditional: "1 when native FLEX/BISON present (tools built), 0 with an explicit environment gaps entry when upstream-supported library-only build"
