software: sfst
display: "SFST Stuttgart Finite State Transducer"
description: "Stuttgart Finite State Transducer system for computational morphology"
category: nlp
homepage: "https://github.com/santhoshtr/sfst"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake C++17 library plus fst-* CLI tools; python bindings guarded off when pybind11 submodule is absent"
    - "Build-time codegen via flex/bison; runtime line editing via readline"
    - "Upstream defines no CTest suite for the C++ artifacts; consumer coverage validates the installed lib and tools"
  common_dependencies:
    - readline
  common_build_tools:
    - flex
    - bison
    - m4

versions:
  "1.7.0":
    status: built
    build_date: "2026-09-27"
    notes: "Initial HarmonyOS PC adaptation (C++ library plus CLI tools; python bindings out of scope)."
