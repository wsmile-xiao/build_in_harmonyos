software: simbody
version: "3.7"
status: built
build_date: "2026-09-21"

source:
  url: "https://github.com/simbody/simbody/archive/refs/tags/Simbody-3.7.tar.gz"
  sha256: "d371a92d440991400cb8e8e2473277a75307abb916e5aabc14194bea841b804a"
  tar_format: tar.gz

build:
  system: cmake
  cc: clang
  cxx: clang++
  cmake_variables:
    - "BUILD_VISUALIZER=OFF"
    - "INSTALL_DOCS=OFF"
    - "BUILD_EXAMPLES=OFF"
    - "BUILD_TESTING=ON"
    - "BUILD_DYNAMIC_LIBRARIES=ON"
    - "BUILD_STATIC_LIBRARIES=OFF"
    - "BLAS_LIBRARIES=<openblas>/lib/libopenblas.so"
    - "LAPACK_LIBRARIES=<openblas>/lib/libopenblas.so"
    - "BUILD_USING_OTHER_LAPACK=<openblas>/lib/libopenblas.so"
  dependencies:
    - openblas/0.3.34

patches_applied: []

knowledge_gained:
  - "Simbody 3.7 为纯 CMake 项目，BUILD_VISUALIZER 默认 ON 需显式 OFF 以避免对 OpenGL/freeglut/libXi/libXmu 的依赖（OHOS 无 X11）"
  - "CMAKE_SYSTEM_NAME 错名补丁：OHOS 时设为 OHOS 而非 HarmonyOS，否则缺 DT_SONAME（spdlog/openCascade 同类教训）"
  - "默认将 BUILD_STATIC_LIBRARIES 关闭、仅构建共享库，OHOS 共享构建在真机上实测 ctest 发现 108 项（ctest -N），105 通过、3 失败；若 static/dynamic 双份计数会翻倍，需以 ctest -N 实测为准"
  - "上游测试通过 ctest 驱动，需在 conanfile build() 中以 cmake.test() 触发并解析 Testing/Temporary/LastTest.log 的 '100% tests passed, 0 tests failed out of N' 行获取真实 passed/failed，避免对 stdout 字符串数数的算术陷阱"
  - "BLAS/LAPACK 硬依赖 openblas/0.3.34：上游 CMake 通过 FindBLAS/FindLAPACK 探测，OHOS 系统无 blas/lapack 时 LAPACK_BEING_USED 为空，MatrixHelper.cpp 的 sgetrf_/dgetrf_ 等 LAPACK 符号无法解析；通过 BLAS_LIBRARIES/LAPACK_LIBRARIES=libopenblas.so + BUILD_USING_OTHER_LAPACK 覆盖 + LD_LIBRARY_PATH 保障 ctest 运行期加载，复用 openfast/suitesparse 先例"
  - "OHOS aarch64 真机已知 3 项回归在容差/类型名上与上游预期偏差：TestNiceTypeNameStatic（libc++ demangle 差异）与 GazeboReactionForceWithAppliedForceCompliant/RigidStatic（OpenBLAS/tol=0.5 数值漂移，M1 同类 issue #802），已在配方中以 gaps 归为 ohos_feature 并保留日志证据，build() 捕获 ctest 异常后继续打包"
