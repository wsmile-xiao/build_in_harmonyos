# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: simbody/3.8
homepage: "https://github.com/simbody/simbody"

# 上游测试命令 (ctest -N 枚举：113 项)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（113 项完整台账见 reports/upstream-test-ledger.md）
upstream_tests:
  - file: SimTKcommon/tests/TestArray.cpp
    source: simbody-3.8/SimTKcommon/tests/TestArray.cpp
    description: "Simbody 数组/类型规范化基础回归"
    command: "./TestArray"
  - file: SimTKmath/tests/EigenTest.cpp
    source: simbody-3.8/SimTKmath/tests/EigenTest.cpp
    description: "特征值求解回归（依赖 BLAS/LAPACK）"
    command: "./EigenTest"
  - file: Simbody/tests/TestCableSpan.cpp
    source: simbody-3.8/Simbody/tests/TestCableSpan.cpp
    description: "绳索跨度动力学回归"
    command: "./TestCableSpan"
  - file: SimTKmath/Integrators/src/CPodes/sundials/tests/pend.c
    source: simbody-3.8/SimTKmath/Integrators/src/CPodes/sundials/tests/pend.c
    description: "CPODES 单摆积分示例（捆绑 sundials 上游测试）"
    command: "./pend"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：公开 API 构造单摆并验证周期"
    command: "./test_simbody"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 113