# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 上 CMake 未知平台：UNIX 变量不生效，若库用 if(UNIX) 分支需补 CMAKE_SYSTEM_NAME MATCHES 'OHOS|HarmonyOS'"
  - "OHOS clang15/libc++ 的 ABI 命名空间为 __n1（typeid 解出 std::__n1::vector），类型名规范化需剥离"
  - "OHOS 平台 CMake 不自动设置 -soname，共享库需显式 CMAKE_SHARED_LIBRARY_SONAME_*_FLAG=-Wl,-soname,，否则 DT_NEEDED 用相对路径导致加载失败"
  - "lapack/3.12.1 制品包含 liblapack.a/libblas.a/libFortranRuntime.a/libFortranDecimal.a，下游需一并链接（flang 编译的 Fortran 符号）"
