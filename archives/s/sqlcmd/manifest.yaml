software: sqlcmd
# 软件级 manifest
# 文件位置: archives/s/sqlcmd/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

description: "Microsoft sqlcmd is a command-line tool for SQL Server that allows users to connect and execute queries"
category: db

homepage: "https://learn.microsoft.com/en-us/sql/tools/sqlcmd/sqlcmd-utility"
license: MIT

build_system: prebuilt/go

ohos_adaptation:
  key_points:
    - "HarmonyOS HMDFS 不支持 fallocate，Go linker mmap 失败"
    - "使用官方预编译 linux-arm64 二进制 + sign-elf 签名"
  common_dependencies:
    - goenv

versions:
  "1.10.0":
    status: built
    build_date: "2026-06-09"
    notes: "使用官方预编译二进制，Go linker 无法在 HarmonyOS 上工作"
