software: sqlcmd
# 版本级 manifest
# 文件位置: archives/s/sqlcmd/1.10.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.10.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/microsoft/go-sqlcmd/archive/refs/tags/v1.10.0.tar.gz"

  # 预编译二进制 URL
  prebuilt_url: "https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-arm64.tar.bz2"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: prebuilt/go

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GOTOOLCHAIN=local"
    - "GOPROXY=https://goproxy.cn,direct"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "goenv/3.1.1"

  # 编译器
  cc: clang
  cxx: clang++

  # Go linker 在 HarmonyOS 上因 fallocate 不支持导致 mmap 失败
  # 使用官方预编译二进制适配方案

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HarmonyOS hmdfs/tmpfs 不支持 fallocate，导致 Go linker mmap(PROT_WRITE) 失败 (errno=13 EACCES) (ref: E008)"
  - "Go 项目在 HarmonyOS 上需使用官方预编译二进制适配方案 (ref: E077)"
  - "sqlcmd 是 Microsoft Go sqlcmd CLI，入口为 cmd/modern (ref: E077)"