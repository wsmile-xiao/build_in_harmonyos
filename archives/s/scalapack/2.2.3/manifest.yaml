knowledge_gained:
  - "ScaLAPACK 2.2.3 builds BLACS in-tree"
  - "The upstream library links MPI C while its tests require MPI Fortran"
  - "One MPI provider must supply a consistent C and Fortran ABI"
  - "The exact flang-ohos package participates in the ScaLAPACK Conan package ID"
  - >-
    CMake configuration must prove LAPACK_FOUND and bind BLAS_LIBRARIES plus
    LAPACK_LIBRARIES to the exact OpenBLAS package before any build can start;
    upstream's network fallback is not an accepted dependency source
  - >-
    OpenBLAS exports package-level cpp_info without components; Conan 2.29.1
    explicitly treats openblas::openblas as the root cpp_info target, which
    must remain explicit when the MPI component is also listed
  - >-
    ScaLAPACK is optional for serial eigensolver computation but is the
    no-source-patch fallback for NWChem 7.3.1's unconditional external-GA gate
  - >-
    BLACS test executables must run from their original build directory so the
    $ORIGIN RUNPATH remains valid, and the intentional MPI_Abort path must
    flush the rank-zero completion marker before aborting
  - >-
    CMake list(APPEND) calls must quote an argument that may expand to empty;
    otherwise the generated upstream BLACS runner has invalid argument arity
  - >-
    ScaLAPACK installs no public headers, so Conan package metadata must set
    cpp_info.includedirs to an empty list instead of exporting a nonexistent
    include directory through CMakeDeps
