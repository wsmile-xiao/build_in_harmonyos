software: "scalapack"
display: "ScaLAPACK"
description: "Distributed-memory dense linear algebra library"
category: "math"
homepage: "https://www.netlib.org/scalapack/"
license: "BSD-3-Clause"
build_system: "cmake"

ohos_adaptation:
  key_points:
    - "Requires one shared C and Fortran MPI ABI"
    - "Uses OpenBLAS LP64 and ScaLAPACK INTEGER=4"
    - "Builds BLACS from the upstream source tree"
  common_dependencies:
    - "openblas"
    - "flang-ohos"
    - "mpich"

versions:
  "2.2.3":
    status: "built"
    build_date: "2026-08-19"
    conan_ref: "scalapack/2.2.3"
