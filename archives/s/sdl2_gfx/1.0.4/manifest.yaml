# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ferzkopp/SDL2_gfx/archive/refs/tags/1.0.4.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型 — autotools，但因HMDFS权限问题实际手动编译
  system: autotools

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "sdl2/2.30.10"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "SDL2_gfx依赖SDL2，需先编译SDL2静态库(SDL_SHARED=OFF因musl libc缺少pthread_setcanceltype)"
  - "config.guess/config.sub需要OHOS平台检测补丁(E007)"
  - "autotools在HMDFS文件系统上config.status有权限问题(0700)，需手动编译替代"
  - "手动编译方式：clang -fPIC -O2 编译源文件，然后ar/ld生成静态库和共享库"

patch_generation:
  method: per-file-difflib
