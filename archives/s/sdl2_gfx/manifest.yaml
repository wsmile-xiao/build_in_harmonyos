software: sdl2_gfx
display: "SDL2_gfx"
description: "SDL2 graphics drawing primitives and other support functions"
category: graphics
homepage: "https://github.com/ferzkopp/SDL2_gfx"
license: zlib
build_system: autotools

ohos_adaptation:
  key_points:
    - "需先编译SDL2(静态库)，SDL2_gfx依赖SDL2"
    - "config.guess/config.sub需要OHOS平台检测补丁"
    - "autotools在HMDFS上有config.status权限问题，手动编译替代"
    - "musl libc缺少pthread_setcanceltype，SDL2只能编译静态库(SDL_SHARED=OFF)"
  common_dependencies:
    - sdl2

versions:
  "1.0.4":
    status: built
    build_date: "2026-05-25"