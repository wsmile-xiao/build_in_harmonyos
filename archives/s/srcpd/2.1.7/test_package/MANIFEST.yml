# test_package/MANIFEST.yml
# 上游官方测试声明文件 — srcpd 2.1.7
# CI (build_and_test.sh L0e) 强制要求此文件存在

package: srcpd/2.1.7
homepage: "https://srcpd.sourceforge.net/"

# 上游测试命令：srcpd 无 make check / ctest / meson test 目标
upstream_check_command: ""

# 经审计，srcpd 2.1.7 上游源码不含任何测试框架
upstream_tests_exist: false
upstream_test_audit: "Audited srcpd-2.1.7 release archive (srcpd-2.1.7.tar.gz, 124 files, SHA256 ba78b81a...): Autotools tree (configure.ac + src/Makefile.am + man/Makefile.am), SUBDIRS = src man, src/ holds the srcpd daemon plus 12 device modules (clientservice/config-srcpd/dcc-address/io/toolbox/netservice/portio/srcp-*/syslogmessage/ttycygwin + ddl/ddl-s88/i2c-dev/ib/hsi-88/li100/loconet/loopback/m605x/selectrix/zimo/dccar). No test/ or tests/ directory, no TESTS/check-TESTS target in any Makefile.am, no gtest/pytest/criterion bindings in Makefiles or sources. Upstream validation is done by running the daemon against real model-railroad hardware."
reason: "srcpd 2.1.7 ships no upstream test framework: no test directory, no make check target, no gtest/pytest bindings."

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "srcpd 守护进程冒烟：二进制可运行、-h 用法、-v 版本横幅（2.1.7）、-f 配置项文档、man 页与默认配置安装检查"
    command: "/bin/sh test.sh"

upstream_test_total: 0
upstream_test_count_method: "autotools_tests"

assertion_count: 6
