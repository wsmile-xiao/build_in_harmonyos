# 版本级 manifest
# 文件位置: archives/s/srcpd/2.1.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.1.7"
software: "srcpd"
status: "built"
build_date: "2026-10-12"
build_system: "autotools"

source:
  url: "https://downloads.sourceforge.net/project/srcpd/srcpd/2.1.7/srcpd-2.1.7.tar.gz"
  sha256: "ba78b81a6a13f4aca911cfbbed725b2e882af7d332351f4436d57960cd1d13b0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux-gnu"
    - "--host=aarch64-linux-ohos"
    - "--disable-ddls88"
  dependencies:
    - "libxml2/2.15.3.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-config.sub-ohos.patch"

upstream_tests_exist: false
upstream_test_audit: "Audited srcpd-2.1.7 release archive (srcpd-2.1.7.tar.gz, 124 files): Autotools tree (configure.ac + src/Makefile.am + man/Makefile.am), src/ holds the daemon and 12 device modules, no test/ or tests/ directory, no TESTS/check-TESTS target in any Makefile.am, no gtest/pytest/criterion bindings, man/ holds only documentation. Upstream validation is done by running the daemon against real model-railroad hardware."
reason: "srcpd 2.1.7 ships no upstream test framework: no test directory, no make check target, no gtest/pytest bindings."

knowledge_gained:
  - "srcpd 是纯 C Autotools 工程（sbin 单一守护进程 + man 页），硬依赖 libxml2（AM_PATH_XML2），线程用 pthread"
  - "ddl-s88 模块含 <sys/io.h>/ioperm（x86 端口 I/O），OHOS aarch64 下不存在，故 --disable-ddls88；其余模块保持上游默认"
  - "configure 的 host-case 不认识 aarch64-linux-ohos，只告警并跳过 Linux 专有头文件探测，对 OHOS 无害"
  - "AM_PATH_XML2 依赖 xml2-config；generate() 同时显式导出 XML_CPPFLAGS/XML_LIBS（取自 libxml2 依赖的 cpp_info）兜底"
  - "上游无测试框架（upstream_tests_exist=false），功能验证在 test_package/test.sh 做 6 项真实断言（-h/-v/版本字串/安装文件）"
