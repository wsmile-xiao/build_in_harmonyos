# 软件级 manifest
# 文件位置: archives/s/srcpd/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: srcpd
display: "srcpd (SRCP daemon)"
description: "SRCP 模型铁路服务端守护进程：数字模型铁路硬件与 SRCP 客户端之间的网关"
category: misc
homepage: "https://srcpd.sourceforge.net/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 C Autotools 工程（sbin 单一守护进程 + 英/德 man 页），硬依赖 libxml2/2.15.3.1，线程用 pthread"
    - "ddl-s88 模块需 x86 <sys/io.h>/ioperm，OHOS aarch64 下禁用（--disable-ddls88）；其余 11 模块保持上游默认"
    - "AM_PATH_XML2 依赖 xml2-config；generate() 从 libxml2 依赖显式导出 XML_CPPFLAGS/XML_LIBS 兜底"
    - "上游无测试框架，test_package/test.sh 做 6 项真实冒烟断言（-h/-v/版本横幅/安装文件）"
  common_dependencies:
    - libxml2

versions:
  "2.1.7":
    status: built
    build_date: "2026-10-12"
