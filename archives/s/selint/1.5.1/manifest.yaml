# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.1"

# 软件名
software: "selint"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-09"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/SELinuxProject/selint/releases/download/v1.5.1/selint-1.5.1.tar.gz"

  # 源码校验和
  sha256: "f41c069f394e578580c6d3f592d993588a5b02dbc1e973f13eb4064eaddfefd4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - confuse/3.4
    - uthash/2.3.0
    - musl-fts/1.2.7
    - check/0.15.2
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011/E052 HMDFS umask/mktemp 权限绕行（configure 动态改写）"
  - "E543 CONFIG_SHELL/SHELL=/bin/sh 内联前缀避开 hnp bash getcwd"
  - "check 框架 open_tmp_file 优先读 TEMP（musl P_tmpdir=/tmp 只读，TMPDIR 永远到不了）——make check 需设 TEMP 指向可写目录"
  - "AutotoolsDeps 把 test 依赖 -lcheck 拼进全局 LIBS 污染主二进制——测试框架须用 test_requires（teseq 先例）"
  - "musl 无 fts.h/libfts，selint 递归扫描需 musl-fts；CLI 包静态链 musl-fts 才能裸跑（L2 冒烟）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
