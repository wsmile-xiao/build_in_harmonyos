# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: selint/1.5.1
homepage: "https://github.com/SELinuxProject/selint"

# 上游测试命令 — selint 自带 Check 单元测试套件 (tests/) + functional bats 端到端测试
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (tests/Makefile.am 的 TESTS 列表, 18 个 Check 程序,
# 每程序用例数取自设备 make check 日志 "Checks: N" 求和 = 130)
upstream_test_programs_count: 18
upstream_unit_cases_count: 130
upstream_tests:
  - check_tree          # 9
  - check_parse_functions # 16
  - check_maps          # 8
  - check_parsing       # 16
  - check_parse_fc      # 10
  - check_template      # 8
  - check_file_list     # 3
  - check_fc_checks     # 8
  - check_check_hooks   # 5
  - check_selint_config # 5
  - check_if_checks     # 4
  - check_string_list   # 8
  - check_runner        # 1
  - check_startup       # 4
  - check_te_checks     # 6
  - check_ordering      # 11
  - check_perm_macro    # 2
  - check_name_list     # 6

# 上游功能测试 (bats): 上游 CI main.yml 的 "functional tests" 步骤
# (cd tests/functional && BATS_TIME_EXPENSIVE=1 bats end-to-end.bats)
# make check 不含此套件 (FUNCTIONAL_TEST_FILES 仅在 EXTRA_DIST)；
# 本配方在设备上按上游同口径实际补跑。
upstream_functional_suite: "tests/functional/end-to-end.bats"
upstream_functional_cases_count: 56

# 上游用例总数 (rule4/R51 口径: 130 单元 + 56 功能)
upstream_total_cases: 186

# 设备实测结果 (2026-10-09, ohos-aarch64)
run_results:
  unit_make_check:
    ran: 130
    passed: 130
    failed: 0
  functional_bats:
    ran: 56
    passed: 50
    skipped: 2   # valgrind not found (test "valgrind", test "Broken config")
    failed: 4    # 见 run_results_notes
  run_results_notes:
    - "usage: 功能等价(退出码64+Usage 正确)，仅 libc 报错文案差异：glibc \"invalid option -- 'Z'\" vs OHOS musl \"unrecognized option: Z\"，测试 grep 的是 glibc 字面量"
    - "parse_error_printing / report format: 报告内容逐字正确，仅多一行 kernel classes Warning —— OHOS 暴露 /sys/fs/selinux/class 但拒绝读取(LSM)，selint 走 SELINT_PARSE_ERROR 分支打 Warning；上游测试只处理\"不存在(Note, 被过滤)\"与\"可读\"两种状态"
    - "parse_error_printing_valgrind: 设备无 valgrind(command not found, exit 127)；上游 CI 经 apt 安装 valgrind"

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的二进制
test_package_tests:
  - file: test_selint.sh
    description: "端到端功能测试: --version 报 1.5.1 + --help 退出 0 + 对 allow 规则权限未按字典序的策略源跑 selint 断言 C-005 命中 + -F(fail_on_finding) 时退出码非 0"
    command: "bash test_selint.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
