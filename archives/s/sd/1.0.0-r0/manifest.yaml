software: sd
version: "1.0.0-r0"
status: published
build_date: "2026-06-02"

source:
  url: "https://github.com/chmln/sd/archive/refs/tags/v1.0.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  build_system: cargo
  configure_options:
    - "precompiled_binary_from_alpine_musl"
  dependencies:
    - "libc.musl-aarch64.so.1/system"
    - "libgcc_s.so.1/precompiled"
  cc: clang
  cxx: clang++
  build_method: "pre-compiled-musl-binary"
  build_notes: "Rust项目，GitHub v1.0.0预编译aarch64-linux-musl静态二进制在HarmonyOS上SIGSEGV。rustc本身在HarmonyOS上也崩溃(SIGSEGV)无法从源码编译。使用Alpine Linux sd 1.1.0-r0 aarch64 musl动态链接二进制作为替代部署方案。二进制报告版本为1.1.0而非1.0.0。"

patches_applied: []

knowledge_gained:
  - "Rust static musl binary (GitHub aarch64-unknown-linux-musl) crashes with SIGSEGV on HarmonyOS"
  - "rustc crashes with SIGSEGV on HarmonyOS - cannot compile Rust from source"
  - "Alpine Linux musl dynamic binary works on HarmonyOS - needs libc.musl-aarch64.so.1 and libgcc_s.so.1"
  - "Chimera Linux APK v3 format packages cannot be downloaded from repo (404 errors)"
  - "sd available in Alpine edge/community repo as sd-1.1.0-r0"
