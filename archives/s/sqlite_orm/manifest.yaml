# 软件级 manifest.yaml
# 文件位置: archives/s/sqlite_orm/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: sqlite_orm
description: Light header-only ORM wrapper around SQLite3 C API
license: AGPL-3.0
category: database

# 版本索引（自动更新）
versions:
  - version: "1.9.1"
    status: published
    build_date: "2026-09-03"
    tarball: sqlite_orm-1.9.1-ohos-aarch64.tar.gz

# 软件元数据
metadata:
  homepage: https://github.com/fnc12/sqlite_orm
  source_url: https://github.com/fnc12/sqlite_orm/archive/refs/tags/v1.9.1.tar.gz
  documentation: https://github.com/fnc12/sqlite_orm

# 构建特性
build_features:
  build_system: cmake
  header_only: true                # INTERFACE target，单头文件 include/sqlite_orm/sqlite_orm.h
  special_handling: header_only_package

# 依赖关系
dependencies:
  runtime:
    - sqlite3/3.49.1

# 相关工具
related_tools:
  - sqlite3

# 标签
tags:
  - database
  - orm
  - sqlite
  - header-only
  - cpp17