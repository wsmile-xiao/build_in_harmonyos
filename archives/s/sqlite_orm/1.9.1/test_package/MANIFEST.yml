# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sqlite_orm/1.9.1
homepage: "https://github.com/fnc12/sqlite_orm"

# 上游测试命令: CMake + CTest，单测入口为 unit_tests (Catch2)
upstream_check_command: "cmake -S . -B build && cmake --build build -j1 && cd build && ctest -R All_in_one_unit_test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试说明: 27 个 .cpp 测试源编译为 unit_tests（Catch2 框架），
# 通过 ctest 注册 All_in_one_unit_test。头文件库本身零编译，
# 上游测试验证在本任务门禁中作为独立步骤执行（test_package 为 Conan L1 smoke test）。