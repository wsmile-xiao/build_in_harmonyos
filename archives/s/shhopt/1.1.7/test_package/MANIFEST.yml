package: shhopt/1.1.7
homepage: "https://shh.thathost.com/pub-unix/"

# R51 inventory: the release archive has no tests/test directory, test
# source, test framework, or check/test target. README identifies example.c
# only as a sample program; it contains no assertions or test framework.
upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_shhopt.c
    description: "General consumer test: 16 assertions cover every option type, callbacks including custom fatal handling, combined and long options, argv cleanup, and scan termination"
    command: "test_shhopt"
  - file: test_shhopt_ohos.c
    description: "HarmonyOS-specific test: 5 assertions require __OHOS__/aarch64 and verify LP64 integer boundaries plus negative positional arguments"
    command: "test_shhopt_ohos"

assertion_count: 21
