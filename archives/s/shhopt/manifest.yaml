software: shhopt
display: "shhopt"
description: "支持短选项、GNU 长选项、类型转换与回调的轻量级 C 命令行解析库"
category: library
homepage: "https://shh.thathost.com/pub-unix/"
license: Artistic-1.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 C 库且仅依赖 libc，使用 HarmonyOS 原生 Clang 15 与上游 Makefile 构建，无需源码补丁"
    - "通过 Conan 显式传递编译器和编译参数，避免上游 Makefile 默认 gcc 与剥离参数影响 HarmonyOS 构建"
    - "上游无正式自动化测试；新增真实 API 消费者测试和 OHOS aarch64/LP64 特有测试"
  common_dependencies: []

versions:
  "1.1.7":
    status: built
    build_date: "2026-09-18"
    conan_ref: "shhopt/1.1.7"
