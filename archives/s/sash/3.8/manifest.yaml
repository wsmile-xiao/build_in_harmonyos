# 版本级 manifest（sash 3.8）
# 文件位置: archives/s/sash/3.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0 §2.2 / §4.2；CI 不读取本文件（交叉校验用）

version: "3.8"
software: "sash"

# pending_ci = 本地 W3 尚未跑绿的中间态（§3 四态均要求 verify PASS 才落）。
# finish 会以实测判决改写本字段（close_archive 重写 status:）。
status: built

build_date: "2026-09-26"
build_system: "makefile"
conan_ref: "sash/3.8"

source:
  # 上游作者官方发布位；URL 路径中的 ~ 必须百分号编码为 %7E（实测 200 /
  # Content-Length 53049）。Debian 池址属 PF7 拉黑域，只用于哈希核验。
  url: "https://members.tip.net.au/%7Edbell/programs/sash-3.8.tar.gz"
  sha256: "13c4f9a911526949096bf543c21a41149e6b037061193b15ba6b707eea7b6579"
  tar_format: tar.gz

build:
  system: makefile
  # 全部适配点走 make 命令行变量覆盖，不改上游源文件、无补丁
  configure_options:
    - "HAVE_LINUX_ATTR=0"
    - "MOUNT_TYPE='\\\"ext3\\\"'"
    - "LDFLAGS（覆盖上游 -static，改为动态链基础运行时）"
    - "CPPFLAGS（注入 conan 依赖图给出的 zlib 头搜索路径）"
  dependencies:
    - zlib/1.3.1
  cc: clang

patches_applied: []

knowledge_gained:
  - "裸 Makefile 用 `CFLAGS = ...` 硬赋值携带特性宏（-DHAVE_*=…）时，不要覆盖 CFLAGS：GNU make 隐式规则 $(CC) $(CFLAGS) $(CPPFLAGS) -c 允许把交叉/依赖头路径全部经 CPPFLAGS 注入，上游 CFLAGS 一字不动地保住（免补丁）（ref: E392 = knowledge/graph/E392.kv 的 raw-makefile 配方范式——本包 conanfile.py:102 以 check_type=dict 取 compiler_executables、conanfile.py:117 以 make -C 进 source_folder；「不覆盖 CFLAGS」这半条属本包独有观察，证据锚 notes.md:13 小节「编译步骤」的关键判断句 notes.md:30，机器锚 grep -n '不覆盖上游' notes.md，条目定形另见 notes.md:363）"
  - "上游把字符串宏写成 `VAR = '\"lit\"'` 再在 CFLAGS 里 -DVARIABLE=$(VAR)：make 展开后双引号会被 shell 引号剥离吃掉，宏值退化成裸标识符并触发 undeclared identifier；改传 VAR='\\\"lit\\\"' 让字面反斜杠躲过 shell 即可修复（ref: 本包独有观察，三态探针实测 RC=1/0/0 见 notes.md:93 小节「最小复现 A」、配方采用形态 notes.md:100，机器锚 grep -n '最小复现 A' notes.md，条目定形另见 notes.md:368）"
  - "上游用 #if FEATURE 整包住一个 .c 的全部文件体且该 .c 仍在 OBJS 里时，把 FEATURE 置 0 会留下空翻译单元与未引用的 extern 声明，二者都不报错；可借此把需要缺失系统头的功能面整体裁掉而不碰 OBJS/源码（ref: 本包独有观察——sysroot 实测无 ext2fs/ext2_fs.h 后的最小裁剪，证据 notes.md:121 小节「已试过的失败方案」第 4 条、空翻译单元实测句 notes.md:141，机器锚 grep -n '空翻译单元' notes.md，条目定形另见 notes.md:371）"
  - "Makefile 里链接后紧跟裸 `strip $@` 时，交叉环境无须补丁：profile [buildenv] 的 PATH 已含 /data/service/hnp/bin，其中 strip/make/ar 齐备；OHOS SDK clang（/data/service/hnp/bin/clang）默认三元组即 aarch64-unknown-linux-ohos，故无需再注入 -target/--sysroot（ref: E077 = knowledge/graph/E077.kv 的四步 post-install 重签顺序——同一条裸 strip 使 OHOS ELF 的 .codesign 失效、exec 报 rc=126，本包单变量对照见 notes.md:106 小节「最小复现 B」、strip 后 rc=126 行 notes.md:111，机器锚 grep -n '最小复现 B' notes.md，条目定形另见 notes.md:374）"
  - "上游 `install` 规则把 BINDIR/MANDIR 写死为 /bin 与 /usr/man（非 /usr/share/man）且用裸 cp 时，直接不调用 make install、在 package() 按 Conan 布局 copy 更省事也免掉前缀覆盖（ref: 本包独有观察，证据 notes.md:149 小节「最终方案」第 5 条、落地句 notes.md:158，机器锚 grep -n '不调用' notes.md，条目定形另见 notes.md:379）"
