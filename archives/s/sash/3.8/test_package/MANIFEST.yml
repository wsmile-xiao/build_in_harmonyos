# test_package/MANIFEST.yml
# test_package 消费者侧测试声明（CI 脚本 build_and_test.sh 的 L0e 要求此文件）

package: sash/3.8
homepage: "https://members.tip.net.au/~dbell/"

# Upstream test command —— 上游 Makefile 只有 sash / clean / install 三个
# 目标，没有 check / test 目标，也没有可跑的测试入口。
upstream_check_command: "none"

# Upstream test suite（R51 / 规则 4 如实申报，附清点证据）：
# 上游 sash-3.8.tar.gz 共 18 个文件，逐个列举如下（实测 tar 清单）：
#   CHANGES Makefile README sash.c sash.h sash.1 utils.c cmds.c
#   cmd_ar.c cmd_chattr.c cmd_dd.c cmd_ed.c cmd_file.c cmd_find.c
#   cmd_grep.c cmd_gzip.c cmd_ls.c cmd_tar.c
# 清点结论：无 tests/ 目录、无 Makefile check/test 目标、仓库内无
# TESTS / add_test / ctest / *.t / test_* 任何形式的用例登记。
# ⇒ 上游测试总数 = 0（不是"有测试但跑不了"，而是根本没有）。
# 依 R51，此处申报 N=0 并给出上面的清点数证据；本包的执行级验证全部
# 由 test_package 消费者测试承担（下方 8 条真执行断言）。
upstream_tests_total: 0
upstream_tests_passed: 0
upstream_tests_skipped_reason: "上游 sash 3.8 不含任何测试套件（tar 内 18 个文件全为源码/文档/Makefile，Makefile 无 check/test 目标，树内无 TESTS/add_test/ctest 登记）⇒ 静态可执行总数为 0，不存在'可跑而未跑'的项"

# Upstream tests not run in build（上游无测试，故消费者测试是唯一执行级验证）
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_sash.sh
    description: "真跑 sash 二进制：先验可被内核加载执行（.codesign 有效性冒烟门），再验版本串/参数解析、-echo 内建分派、-gzip/-gunzip 的 zlib deflate+inflate 逐字节往返、-ls 目录列举，以及 -chattr/-lsattr 裁剪面的可观测断言"

# Test assertion count（test_sash.sh 内实测的独立断言条数，全部为真执行）
# A1a 存在与执行位 / A1b 内核允许加载执行（EPERM 冒烟门，未过则后续断言全部
# 作废，杜绝 rc=126 冒充"命令不存在"造成假性通过）/ A2a 版本串 / A2b 退出码 /
# A3 -echo 分派 / A4 -gzip 产出 / A5 压缩确实变小 / A6 往返逐字节一致 /
# A7 -lsattr 裁剪形态 / A8 -ls 目录列举 = 10 条
assertion_count: 10
