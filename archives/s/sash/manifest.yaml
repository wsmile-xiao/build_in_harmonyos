# 软件级 manifest（sash）
# 文件位置: archives/s/sash/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0 §2.1 / §4.1；CI 不读取本文件（人读索引 + 交叉校验）

software: sash
display: "sash (Stand-alone shell)"
description: "Stand-alone shell for system recovery with built-in versions of many standard commands"
category: system
homepage: "https://members.tip.net.au/~dbell/"
license: "LicenseRef-sash-custom"
build_system: makefile

# 上游授权说明：tarball 不含 LICENSE/COPYING 文件，授权声明逐字写在每个
# 源文件头部（"Permission is granted to use, distribute, or modify this
# source, provided that this copyright notice remains intact."），是不含
# 免责声明句的宽松授权，故不套标准 SPDX 标识而用 LicenseRef-* 表达。

ohos_adaptation:
  key_points:
    - "裸 GNU Makefile：无 configure/CMake/meson；配方不覆盖上游 CFLAGS（其中携带全部 -DHAVE_* 特性宏与告警选项），只用 make 命令行覆盖 LDFLAGS 并注入 CPPFLAGS"
    - "HAVE_LINUX_ATTR=0 关闭 -chattr/-lsattr：上游 cmd_chattr.c 全文件由该宏包住并 include <ext2fs/ext2_fs.h>，OHOS native SDK sysroot 无该头 → 走上游自带开关做功能面裁剪"
    - "上游 LDFLAGS=-static 覆盖为动态链基础运行时；zlib 侧因制品仓 OHOS 包只出 libz.a（R26）仍为静态吃入，不新增运行时 .so 依赖"
    - "MOUNT_TYPE 需以字面转义形态传参：上游写法经 shell 引号剥离后字符串引号丢失，令 cmds.c 的 type = MOUNT_TYPE 编译失败"
    - "不调用 make install：上游 BINDIR 写死 /bin、MANDIR 写死 /usr/man（非 /usr/share/man）且用裸 cp，改在 package() 按 Conan 布局落文件"
    - "运行级限制：-mount/-umount/-chroot/-pivot_root/-losetup/-mknod 等特权内建命令在 OHOS PC 非 root 沙箱必然受限（编译面正常），上游测试总数为 0 故不减损可执行测试分母"
  common_dependencies:
    - zlib

versions:
  "3.8":
    status: built
    conan_ref: "sash/3.8"
