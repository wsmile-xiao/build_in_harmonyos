# conandata.yml — swtpm 0.10.1.1
# 上游为 git archive 快照（无预生成的 configure），构建期在源码目录执行
# `autoreconf --install --force` 生成 configure / config.guess / config.sub。
#
# 版本说明：conan 引用版本 0.10.1.1 表示「基于上游 0.10.1 的再次适配」
# （本仓惯例，如 gnupg 2.4.9.1）。**源码 URL 仍指向上游 0.10.1 tarball**，
# 交付产物自报版本亦为 0.10.1（上游版本号不因适配轮次改变）。

sources:
  url: "https://github.com/stefanberger/swtpm/archive/refs/tags/v0.10.1.tar.gz"
  sha256: "f8da11cadfed27e26d26c5f58a7b8f2d14d684e691927348906b5891f525c684"

patches:
  # 上游 configure.ac:545 在 CFLAGS 末尾追加 -Werror；而 Conan 工具链的 -Wno-error
  # 位于 CFLAGS 前部 → -Werror 后置生效。OHOS 的 clang 对上游客源有告警，-Werror
  # 会使构建中断，故从该行移除 -Werror（保留其余告警级别）。
  - patch_file: "patches/0001-remove-Werror-for-clang-compat.patch"
    patch_description: "Remove -Werror appended to CFLAGS for clang compatibility on OHOS"
    patch_type: "portability"
