# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: swtpm/0.10.1.1
homepage: "https://github.com/stefanberger/swtpm"

# 本包在依赖链中的位置：tpm2-tss → swtpm（本包）→ gnupg tests/tpm2dtests
topology: "tpm2-tss (提供 libtss2-esys) → swtpm (本包，运行时 TPM 模拟器) → gnupg (tests/tpm2dtests 消费者)"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试 → 否
# 原因：上游 tests/ 需要 expect 与 socat，而构建时 OHOS 侧无 socat（configure 会直接报错），
# 故配方以 --disable-tests 关闭。这是平台能力缺失而非掩盖，已如实申报。
# 注：socat 已由 PR #11402 适配交付；该版本合入并发布后，本包可改传 --enable-tests。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试（已声明但本包未运行，含原因）
upstream_tests:
  - name: swtpm-test-suite
    source: "tests/Makefile.am 的 TESTS（--enable-tests 生效时共 68 条）"
    command: "make check"
    expected: "not-run"
    run_2026_09_20:
      total: 68
      executed: 0
      skipped: 68
      counting_method: >-
        口径以 `--enable-tests` 生效时测试树内实际生成的 tests/Makefile 的 TESTS 为准
        = 68 条（已由两处独立证据共同证实：生成的 tests/Makefile，以及 make check
        的 68 条 PASS/FAIL/SKIP 判定）。
        更正说明：本文件旧版写 78，那是 tests/Makefile.am 中全部 `TESTS` 赋值行的
        无条件并集，混入了被 `if WITH_GNUTLS` / `if HAVE_TCSD` 门控的条目以及
        `.log` / `.test` 辅助名；不是 --enable-tests 实际会跑的条目数。
      reason: >-
        configure 的 --enable-tests 分支（configure.ac:396-440）强制要求
        expect / gawk / socat / base64 / cp 全部存在，缺一即 AC_MSG_ERROR。
        OHOS 无 socat（ohpcd 亦未发布），故配方传 --disable-tests。
        如实申报 68 项未执行，未以 skip/xfail 掩盖，亦未计入通过率分母。

# test_package 中自带的测试（消费者视角验证，R34 反空壳）
test_package_tests:
  - file: test_swtpm.sh
    description: >-
      实际执行交付产物并断言运行时行为：swtpm/swtpm_setup/swtpm_ioctl
      的 --version 输出、swtpm socket --help（gnupg 消费的确切子命令）、
      以 gnupg 相同方式在 TCP 上拉起模拟器（--server/--ctrl type=tcp）
      并确认控制通道端口可连接、可正常停止
    command: "bash test_swtpm.sh"

# 测试断言总数
# 1 (swtpm --version) + 1 (swtpm_setup --version) + 1 (swtpm_ioctl --version)
# + 1 (socket --help) + 1 (daemon 拉起) + 1 (控制通道可连接) + 1 (正常停止) = 7
assertion_count: 7

# 断言理由：gnupg tests/tpm2dtests/start_sw_tpm.sh 以
#   ${SWTPM} socket --tpm2 --daemon --pid file=swtpm.pid \
#            --server type=tcp,port=2321 --ctrl type=tcp,port=2322 ...
# 消费本包；cfg 侧以 AM_CONDITIONAL(TEST_LIBTSS, [test -n "$SWTPM" ...])
# 判定是否让 tpm2dtests 进入 SUBDIRS。因此必须断言「可执行 + socket 子命令
# 可用 + TCP 服务可用」，而非仅检查文件存在。
