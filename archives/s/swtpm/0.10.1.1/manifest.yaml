# 版本级 manifest — swtpm 0.10.1.1
# 文件位置: archives/s/swtpm/0.10.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# 版本说明：0.10.1.1 = 基于上游 0.10.1 的 OHOS 适配轮次（本仓惯例，如 gnupg 2.4.9.1）；
#           源码 URL 与产物自报版本均为上游 0.10.1。

# ============================================================
# 必须字段
# ============================================================

version: "0.10.1.1"

software: "swtpm"

# 编译状态
# published | built | failed | archived
status: built

build_date: "2026-09-20"
build_system: "autotools"

conan_ref: "swtpm/0.10.1.1"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/stefanberger/swtpm/archive/refs/tags/v0.10.1.tar.gz"
  sha256: "f8da11cadfed27e26d26c5f58a7b8f2d14d684e691927348906b5891f525c684"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  configure_options:
  - "--enable-static"
  - "--disable-shared"
  - "--without-gnutls"
  - "--without-seccomp"
  - "--without-cuse"
  - "--without-selinux"
  - "--disable-tests"
  - "--disable-hardening"

  dependencies:
  - "libtpms/0.10.2"
  - "glib/2.84.0"
  - "json-glib/1.6.6"
  - "libtasn1/4.21.0"
  - "openssl/3.5.6"
  - "gmp/6.3.0"

  build_requirements:
  - "automake/1.18"
  - "libtool/2.5.4"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
- "0001-remove-Werror-for-clang-compat.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "autoreconf 会把 automake 自带的 config.guess 复制进源码树；automake/1.18 的该文件不认 HarmonyOS（grep -c ohos = 0），uname -s=HarmonyOS 时报 unable to guess system type → configure 报 cannot guess build type。此文件构建期才生成，conandata 补丁打不到，须在 build() 内 autoreconf 之后再补。"
- "config.sub 无需处理：automake/1.18 自带的 config.sub 已接受 aarch64-unknown-linux-ohos（实测原样输出、rc=0），与老版 autotools 需补 linux-ohos* 白名单不同。"
- "禁止 --build/--host 传三元组（R1）；CI 上传 --build=<gnu triplet> 会触发 C compiler cannot create executables（psfex/weightwatcher/skmaker 同报），应改由 config.guess 识别。"
- "上游 configure.ac 把 -Werror 追加在 CFLAGS 末尾，位置后于工具链的 -Wno-error，故 -Wno-error 无效，须补丁移除该行。"
- "运行期可走 TCP（--server type=tcp,port=2321 --ctrl type=tcp,port=2322），规避 OHOS 对 AF_UNIX 路径名 socket 的限制。"
