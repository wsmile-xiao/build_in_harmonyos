software: swtpm
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.10.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/stefanberger/swtpm/archive/refs/tags/v0.10.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--without-gnutls"
  - "--without-seccomp"
  - "--without-cuse"
  - "--disable-tests"
  - "--disable-hardening"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - libtpms/0.10.0
  - glib/2.88.0
  - json-glib/1.6.6
  - libtasn1/4.21.0
  - openssl/3.5.6
  - gmp/6.3.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "swtpm需要libtpms作为核心依赖，cmd-pkgs中不含libtpms需手动编译"
  - "libtpms使用bootstrap.sh生成configure脚本，需要autoreconf环境"
  - "pkg.m4不在swtpm源码m4目录中，需从pkg-config安装路径手动复制"
  - "libintl.so使用_libintl_前缀而非g_libintl_前缀，链接时需用libintl.a静态库"
  - "glib-2.0在OHOS上为libglib-2.0.a静态库，链接时需特殊处理"
  - "swtpm需--without-seccomp和--without-gnutls（OHOS不支持seccomp和gnutls）"
  - "需--disable-tests因缺少expect/socat等测试工具依赖"
