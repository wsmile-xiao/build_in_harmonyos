software: swtpm
display: "swtpm"
description: "软件 TPM（可信平台模块）模拟器，为测试与虚拟化提供 TPM 2.0/1.2 运行时"
category: system
homepage: "https://github.com/stefanberger/swtpm"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游为 git archive 快照，不含预生成的 configure，构建期需 autoreconf --install --force"
    - "autoreconf 复制的 automake/1.18 config.guess 不认 HarmonyOS（uname -s=HarmonyOS），报 cannot guess build type；须在 autoreconf 之后补 config.guess（conandata 补丁打不到该文件，因它构建期才生成）"
    - "config.sub 无需处理：automake/1.18 自带的 config.sub 已接受 aarch64-unknown-linux-ohos"
    - "禁止用 --build/--host 传三元组（R1）；CI 上传 --build=<gnu triplet> 会触发 C compiler cannot create executables"
    - "configure.ac 在 CFLAGS 末尾追加 -Werror，后置于工具链的 -Wno-error，需补丁移除"
    - "OHOS 不支持 seccomp / cuse / gnutls，configure 以 --without-* 关闭"
    - "install 阶段在 HMDFS 上会留下截断的 bin/ 产物并丢失 .codesign 段（exec 报 EPERM），须在 package() 内从构建树回填"
    - "运行期可走 TCP（--server type=tcp,port=2321 --ctrl type=tcp,port=2322），规避 OHOS 对 AF_UNIX 的限制"
  common_dependencies:
    - libtpms
    - glib
    - json-glib
    - libtasn1
    - openssl
    - gmp

versions:
  "0.10.1.1":
    status: built
    build_date: "2026-09-20"
    conan_ref: "swtpm/0.10.1.1"
    note: "基于上游 0.10.1 的 OHOS 适配轮次（本仓 .1 惯例，如 gnupg 2.4.9.1）；源码 URL 与产物自报版本均为 0.10.1"
  "0.10.1":
    status: failed
    build_date: "2026-06-17"
    conan_ref: "swtpm/0.10.1"
    note: "不完整：conandata.yml 引用的 patches/0001-remove-Werror-for-clang-compat.patch 从未提交，conan export 直接失败；manifest.yaml 曾误声明 status=published 而 ohpcd 零发布"
