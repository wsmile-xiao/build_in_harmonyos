software: swe
version: "2.10.3"
status: built
build_date: "2026-09-25"
build_system: makefile

source:
  url: "https://github.com/aloistr/swisseph/archive/refs/tags/v2.10.3final.tar.gz"
  sha256: "032a71d18cff92c9bf960020abda28d44c8f0c678072dcbab561e9aeb0399fbc"
  tar_format: tar.gz
  tag: "v2.10.3final"
  root: "swisseph-2.10.3final"

build:
  system: makefile
  targets:
    - "libswe.a"
    - "libswe.so"
    - "swetest"
    - "swemini"
  configure_options:
    - "CC from tools.build:compiler_executables (R33)"
    - "CFLAGS=-O2 -fPIC -Wall"
    - "make -j1"

products:
  libs:
    - libswe.a
  tools: []

knowledge_gained:
  - "swe 2.10.3 is Swiss Ephemeris C99 (Astrodienst), upstream tag v2.10.3final, dual AGPL-3.0/Professional"
  - "Plain Makefile build, no configure; portable targets libswe.a/libswe.so/swetest/swemini"
  - "Upstream setest harness (10 suites) needs libcrypto+m4+perl; build runs swetest Moshier smoke instead"
