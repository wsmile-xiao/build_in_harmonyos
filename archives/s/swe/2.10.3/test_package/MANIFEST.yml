# test_package/MANIFEST.yml — swe 2.10.3
package: swe/2.10.3
homepage: "https://www.astro.com/swisseph/"

# Upstream tests: setest C harness (setest/suite_01..suite_10, 10 suites).
# Single custom framework, suites parseable via suite_*.c listing -> auto.
# Full setest needs libcrypto + m4 + perl build tools and JPL-scale ephemeris
# data at build time; build() runs upstream swetest (Moshier mode, offline)
# 3-case smoke instead and records the 7 uncovered suites as gaps.
upstream_check_command: "make test (setest harness)"
upstream_test_in_build: true
upstream_test_command: "./swetest -b1.1.2000 -p0 -emos -head (+2 cases)"

upstream_test_total: 10
upstream_test_count_method: auto
upstream_tests_exist: true

upstream_tests:
  - file: setest/suite_01_calc.c
    source: swisseph-2.10.3final/setest/suite_01_calc.c
    description: "swe_calc/swe_calc_ut/topo/planetocentric cases (covered by swetest smoke)"
    command: "./swetest -b1.1.2000 -p0 -emos -head"
  - file: setest/suite_02_fixstar.c
    source: swisseph-2.10.3final/setest/suite_02_fixstar.c
    description: "fixstar cases (gap: needs setest harness + ephemeris data)"
    command: "cd setest && ./setest t"
  - file: setest/suite_03_misc.c
    source: swisseph-2.10.3final/setest/suite_03_misc.c
    description: "misc cases (gap: needs setest harness + ephemeris data)"
    command: "cd setest && ./setest t"
  - file: setest/suite_04_ayanamsa.c
    source: swisseph-2.10.3final/setest/suite_04_ayanamsa.c
    description: "ayanamsa cases (gap: needs setest harness + ephemeris data)"
    command: "cd setest && ./setest t"
  - file: setest/suite_05_date_time.c
    source: swisseph-2.10.3final/setest/suite_05_date_time.c
    description: "date/time cases (covered by julday path in swetest smoke)"
    command: "./swetest -b1.1.2000 -p1 -emos -head"
  - file: setest/suite_06_houses.c
    source: swisseph-2.10.3final/setest/suite_06_houses.c
    description: "houses cases (gap: needs setest harness + ephemeris data)"
    command: "cd setest && ./setest t"
  - file: setest/suite_07_apsides.c
    source: swisseph-2.10.3final/setest/suite_07_apsides.c
    description: "apsides cases (gap: needs setest harness + ephemeris data)"
    command: "cd setest && ./setest t"
  - file: setest/suite_08_eclipses.c
    source: swisseph-2.10.3final/setest/suite_08_eclipses.c
    description: "eclipse cases (gap: needs setest harness + ephemeris data)"
    command: "cd setest && ./setest t"
  - file: setest/suite_09_rise.c
    source: swisseph-2.10.3final/setest/suite_09_rise.c
    description: "rise/set cases (gap: needs setest harness + ephemeris data)"
    command: "cd setest && ./setest t"
  - file: setest/suite_10_solcross.c
    source: swisseph-2.10.3final/setest/suite_10_solcross.c
    description: "solcross cases (gap: needs setest harness + ephemeris data)"
    command: "cd setest && ./setest t"

test_package_tests:
  - file: test_swe.c
    description: "julday exact + version prefix + Sun/Moon Moshier positions + planet name + sidtime + houses + ayanamsa — real swe API"
    command: "./test_swe"

assertion_count: 10
