# conandata.yml — sfizz 1.2.3
# 源码来自官方 GitHub tag 1.2.3 tarball（codeload 官方源）
# git submodule（external/abseil-cpp、filesystem、simde、st_audiofile/thirdparty/*）
# 在 conanfile.py source() 中按锁定 commit 单独获取

sources:
  url: "https://codeload.github.com/sfztools/sfizz/tar.gz/refs/tags/1.2.3"
  filename: "sfizz-1.2.3.tar.gz"
  sha256: "fc1d7864516546e237e7c6115dc76d187924af32ec8eafb97b03a7efec9aa49d"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Force vendored third-party sub-libs (abseil/wavpack/aiff) static: CMakeToolchain injects BUILD_SHARED_LIBS=ON when shared is enabled, which turns them into shared libs sfizz does not install"
    patch_type: "portability"
  - patch_file: "patches/0002-clients-sfizz_render.cpp.patch"
    patch_description: "C++20: fs::path::u8string() returns std::u8string, convert to .string() for fmidi_smf_file_read(const char*)"
    patch_type: "portability"
  - patch_file: "patches/0003-external-threadpool-ThreadPool.h.patch"
    patch_description: "C++20: std::result_of removed, use std::invoke_result_t"
    patch_type: "portability"
  - patch_file: "patches/0004-src-sfizz-Opcode.cpp.patch"
    patch_description: "C++20: u8\"\" literals are const char8_t[] and cannot construct std::string_view, drop u8 prefix (UTF-8 source)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-sfizz-Synth.cpp.patch"
    patch_description: "C++20: fs::path::u8string() returns std::u8string, use .string() for std::string rootPath_"
    patch_type: "portability"
  - patch_file: "patches/0006-src-sfizz-import-foreign_instruments-AudioFile.cpp.patch"
    patch_description: "C++20: fs::path::u8string() returns std::u8string, use .string() for std::string and ostream"
    patch_type: "portability"
  - patch_file: "patches/0007-src-sfizz-import-foreign_instruments-DecentSampler.cpp.patch"
    patch_description: "C++20: fs::path::u8string() returns std::u8string, use .string() for std::string"
    patch_type: "portability"
  - patch_file: "patches/0008-tests-FilesT.cpp.patch"
    patch_description: "Case sentitiveness test: probe case sensitivity at runtime (OHOS HMDFS is case-insensitive) instead of assuming true on non-Win/mac"
    patch_type: "portability"
  - patch_file: "patches/0009-tests-OpcodeT.cpp.patch"
    patch_description: "C++20: u8\"\" literals are const char8_t[] and cannot construct std::string_view, drop u8 prefix in tests"
    patch_type: "portability"
