# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "C++20 下 u8\"\" 字面量是 const char8_t[] 无法构造 std::string_view，需去掉 u8 前缀（源文件 UTF-8 编码）"
  - "C++20 移除了 std::result_of，需改用 std::invoke_result_t"
  - "fs::path::u8string() 在 C++20 返回 std::u8string，赋给 std::string 需改用 .string()"
  - "Conan CMakeToolchain 的 SharedLibBock 会在 options.shared 启用时强制注入 BUILD_SHARED_LIBS=ON（CACHE 变量，tc.variables 无法覆盖），须在顶层 CMakeLists 用普通 set(BUILD_SHARED_LIBS OFF) 遮蔽（且必须在 include(SfizzDeps) 之前）防止 vendored 子库变共享"
  - "codeload.github.com 的 tar.gz URL 不以 .tar.gz 结尾，conan get() 无法推断压缩格式报 BadZipFile，须在 conandata.yml 显式 filename 字段"
  - "OHOS HMDFS 大小写不敏感，上游测试若硬编码 caseSensitiveFs=true 会失败，应改为运行时探测（fs::exists 大小写变体）"
  - "GitHub 源码 tarball 不含 git submodule，须在 conanfile source() 按锁定 commit 单独下载"

