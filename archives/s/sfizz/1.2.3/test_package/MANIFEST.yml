# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sfizz/1.2.3
homepage: "https://github.com/sfztools/sfizz"

# 上游测试命令 (ctest -N 注册 566 个用例，全部来自单个 sfizz_tests 二进制)
upstream_check_command: "ctest"

# conanfile.py build() 方法中未集成上游测试（本地 W3 已全量执行）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本地实测：ctest 566/566 通过）
# 说明：566 为 tests/ 目录全部测试源文件编译成的 sfizz_tests 二进制在 ctest -N 的全量注册数；
# 本地运行 ./library/bin/sfizz_tests（或 ctest）566/566 全部通过。
# 下列仅列出被本 PR 补丁修改过的测试源文件（补丁 0008/0009 涉及的子集），并非全部测试源。
upstream_tests:
  - file: tests/OpcodeT.cpp
    source: sfizz-1.2.3/tests/OpcodeT.cpp
    description: "Opcode parsing tests (part of sfizz_tests; 补丁 0009 修改 C++20 u8 字面量)"
    command: "./library/bin/sfizz_tests"
  - file: tests/FilesT.cpp
    source: sfizz-1.2.3/tests/FilesT.cpp
    description: "File loading / case sensitivity tests (part of sfizz_tests; 补丁 0008 修改 HMDFS 大小写探测)"
    command: "./library/bin/sfizz_tests"

# test_package 中自带的测试 (消费者视角验证，实质调用 sfizz C API)
test_package_tests:
  - file: test.c
