# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: sexpp/0.9.1
homepage: "https://github.com/rnpgp/sexpp"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（独立 TEST_CASE 枚举，见任务台账）
upstream_tests:
  - file: tests/src/baseline-tests.cpp
    source: sexpp-0.9.1/tests/src/baseline-tests.cpp
    description: "Baseline scan/parse/printer tests (3 TEST_F)"
    command: "./bin/sexpp-tests --gtest_filter=BaselineTests.*"
  - file: tests/src/exception-tests.cpp
    source: sexpp-0.9.1/tests/src/exception-tests.cpp
    description: "Parser exception tests (24 TEST_F; SexpWarning uses GTest CaptureStdout, blocked on OHOS /tmp ro)"
    command: "./bin/sexpp-tests --gtest_filter=ExceptionTests.*"
  - file: tests/src/primitives-tests.cpp
    source: sexpp-0.9.1/tests/src/primitives-tests.cpp
    description: "Primitive type tests (26 TEST_F)"
    command: "./bin/sexpp-tests --gtest_filter=PrimitivesTests.*"
  - file: tests/src/g10-compat-tests.cpp
    source: sexpp-0.9.1/tests/src/g10-compat-tests.cpp
    description: "G10 compatibility tests (1 TEST_F)"
    command: "./bin/sexpp-tests --gtest_filter=G10CompatTests.*"
  - file: tests/src/g23-compat-tests.cpp
    source: sexpp-0.9.1/tests/src/g23-compat-tests.cpp
    description: "G23 compatibility tests (9 TEST_F)"
    command: "./bin/sexpp-tests --gtest_filter=G23CompatTests.*"
  - file: tests/src/g23-exception-tests.cpp
    source: sexpp-0.9.1/tests/src/g23-exception-tests.cpp
    description: "G23 exception tests (7 TEST_F; G23Warning uses GTest CaptureStdout, blocked on OHOS /tmp ro)"
    command: "./bin/sexpp-tests --gtest_filter=G23ExceptionTests.*"
  - file: tests/src/traits-tests.cpp
    source: sexpp-0.9.1/tests/src/traits-tests.cpp
    description: "Octet traits tests (12 TEST; upstream CMake omits file, minimal patch added for full enumeration)"
    command: "./bin/sexpp-tests --gtest_filter=OctetTraitsTest.*"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 经公开 API 解析并回打 S-表达式"
    command: "./test_sexpp"

# 测试断言总数
assertion_count: 82
