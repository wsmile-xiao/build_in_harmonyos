# conandata.yml — sexpp 0.8.7
# codeload.github.com is GitHub's official tag-tarball endpoint (same byte
# stream as the /archive/ URL); github.com itself is frequently unreachable
# from the OHOS device, so the codeload endpoint is used directly.
# NOTE: the codeload URL has no ".tar.gz" suffix, so source() pins
# filename="sexpp-0.8.7.tar.gz" to stop Conan from treating it as a ZIP.

sources:
  url: "https://codeload.github.com/rnpgp/sexpp/tar.gz/refs/tags/v0.8.7"
  sha256: "d877a2a39f38d3e0d84f74cb5e4bb3c180b8ee68086ccc43117e09364d66ba2b"

patches:
  - patch_file: "patches/0001-CMakeLists-gtest-imported-targets.patch"
    patch_description: "接受 GoogleTest 自带 CMake config 导出的目标名（GTest::gtest / GTest::gtest_main）；DOWNLOAD_GTEST=OFF 时 find_package(GTest) 走 config 模式，只有模块模式才提供 GTest::GTest / GTest::Main，上游写死了后者会 configure 失败"
    patch_type: "portability"
