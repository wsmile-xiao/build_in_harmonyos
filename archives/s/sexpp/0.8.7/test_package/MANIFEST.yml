# test_package/MANIFEST.yml — sexpp 0.8.7 上游测试声明
package: sexpp/0.8.7
homepage: "https://github.com/rnpgp/sexpp"

# 上游测试驱动方式：CMake include(CTest) + gtest_discover_tests(sexpp-tests)
upstream_check_command: "ctest --test-dir <build> --output-on-failure"

# conanfile.py 的 build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test() → ctest --output-on-failure（build() 内，TMPDIR 指向可写目录）"

# 上游实际运行的测试程序（TEST/TEST_F 枚举）
upstream_tests:
  - file: tests/src/baseline-tests.cpp
    source: sexpp-0.8.7/tests/src/baseline-tests.cpp
    description: "Baseline scan → canonical/base64/advanced round-trip (3 TEST_F)"
    command: "ctest -R BaselineTests"
  - file: tests/src/exception-tests.cpp
    source: sexpp-0.8.7/tests/src/exception-tests.cpp
    description: "Parser exception tests (22 TEST_F; SexpWarning 依赖 GTest CaptureStdout)"
    command: "ctest -R ExceptionTests"
  - file: tests/src/primitives-tests.cpp
    source: sexpp-0.8.7/tests/src/primitives-tests.cpp
    description: "Primitive string/list accessor tests (26 TEST_F)"
    command: "ctest -R PrimitivesTests"
  - file: tests/src/g10-compat-tests.cpp
    source: sexpp-0.8.7/tests/src/g10-compat-tests.cpp
    description: "G10 compatibility tests (1 TEST_F)"
    command: "ctest -R G10CompatTests"
  - file: tests/src/g23-compat-tests.cpp
    source: sexpp-0.8.7/tests/src/g23-compat-tests.cpp
    description: "G23 compatibility tests (9 TEST_F)"
    command: "ctest -R G23CompatTests"
  - file: tests/src/g23-exception-tests.cpp
    source: sexpp-0.8.7/tests/src/g23-exception-tests.cpp
    description: "G23 exception tests (7 TEST_F; G23Warning 依赖 GTest CaptureStdout)"
    command: "ctest -R G23ExceptionTests"
  - file: tests/src/compare-files.cpp
    source: sexpp-0.8.7/tests/src/compare-files.cpp
    description: "比较辅助（无 TEST 宏，为其他用例提供 compare_binary_files）"
    command: "-"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接 libsexpp，扫描 S-表达式并断言 canonical 字节串、默认扫描模式、空输入与公开比较运算符"
    command: "./test_sexpp"

# 测试断言总数（消费者用例）
assertion_count: 10
