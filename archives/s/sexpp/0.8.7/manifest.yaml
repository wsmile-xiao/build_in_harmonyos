# 版本级 manifest — sexpp 0.8.7
# 文件位置: archives/s/sexpp/0.8.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.7"

# 软件名
software: "sexpp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方 tag tarball 端点 codeload，与 /archive/ 同字节流）
  url: "https://codeload.github.com/rnpgp/sexpp/tar.gz/refs/tags/v0.8.7"

  # 源码校验和
  sha256: "d877a2a39f38d3e0d84f74cb5e4bb3c180b8ee68086ccc43117e09364d66ba2b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS={shared}"
  - "-DWITH_SEXP_TESTS=ON"
  - "-DWITH_SEXP_CLI=ON"
  - "-DDOWNLOAD_GTEST=OFF"
  - "-DGTest_DIR=<gtest/1.17.0 package>/lib/cmake/GTest"

  # 编译依赖列表（格式: name/version）
  # gtest 仅为上游单元测试所需，以 test_requires 声明，不进消费方依赖闭包
  dependencies: []
  test_dependencies:
  - gtest/1.17.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-CMakeLists-gtest-imported-targets.patch（portability：兼容 config 模式 googletest 的 GTest::gtest/GTest::gtest_main 目标名）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "codeload.github.com 的 URL 末段没有 .tar.gz 后缀，get() 必须显式传 filename=，否则被误判为 ZIP 报 BadZipFile"
- "上游用 CMake FetchContent 从 github.com 拉 googletest 时，OHOS 真机不可达；改用 DOWNLOAD_GTEST=OFF + find_package(GTest REQUIRED)，googletest 由 conan 的 gtest 包提供（test_requires）"
- "GoogleTest 的 CaptureStdout() 临时目录在 OHOS 上只看 TMPDIR：制品仓 gtest/1.17.0 的 0001-tmpdir-ohos-sandbox.patch 把 #else 分支的硬编码 /tmp/ 改成 getenv(\"TMPDIR\") ?: /data/local/tmp/，TMP/TEMP/TEST_TMPDIR 实测均无效；/tmp 与 /data/local/tmp 在本机都不可写，必须在 build() 里导出 TMPDIR 再跑 ctest"
