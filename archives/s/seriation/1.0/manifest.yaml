software: seriation
display: "cfm_seriation"
description: "Simulated-annealing seriation of protein-protein interaction networks stored as Comparative Frequency Matrix (CFM) files"
category: science
homepage: "https://sources.debian.org/src/seriation/1.0/"
license: GPL-3.0-or-later
build_system: custom  # Debian 原包无 Makefile/configure/CMakeLists，只有单个 cfm-seriation.c；conanfile 直驱 CMakeToolchain

ohos_adaptation:
  key_points:
    - "单源文件 cfm-seriation.c（942 行 / 29KB），零外部依赖，零构建脚本"
    - "仅 libc：math、stdio、stdlib、string、time 五个头文件，全部由 OHOS sysroot 自带"
    - "★ 零 patch：一次 clang-ohos 交叉编译通过，无符号冲突、无缺失 API、无需平台分支"
    - "产物 ELF64 / AArch64，NEEDED 仅 libc.so；可执行文件约 38.5KB"
    - "★ 命令行语法无横杠：参数解析器取 argv[x][0] 作选项字符、argv[x][2:] 作值，形如 `f=net.dat s=42`；且 `h` 打印帮助后以退出码 1 结束（上游 print_help(); exit(1);）"
    - "★ 定种子完全可重复：`s=42` 连跑三次 INITIAL/FINAL Energy 逐次一致，模拟退火在 aarch64 上确定"
    - "产物目录名带时间戳 `<基名>_<YYYY-MM-DD_HHhMmMmSs>/`，内含 energy.dat / initial_order.dat / final_order.dat / result.txt"
    - "不打包原包 6 个物种的演示数据集（合计约 35MB），也不安装 -P 所需的 /usr/share/cfm-seriation/etc/matrix.gnu —— 绘图后端由调用方决定，核心排序逻辑不依赖 gnuplot"
  common_dependencies:
    - libc (math, stdio, stdlib, string, time)

patches: []

versions:
  "1.0":
    status: built
    build_date: "2026-10-04"
    source_url: "https://deb.debian.org/debian/pool/main/s/seriation/seriation_1.0.orig.tar.gz"
    source_sha256: "e25414d5849a31e75bbe1a87d1ecb74b12a2009174484e24b5b758404ede625f"
    test_assertions: 24
