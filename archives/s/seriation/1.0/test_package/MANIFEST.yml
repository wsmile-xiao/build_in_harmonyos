# test_package/MANIFEST.yml — seriation 1.0
package: seriation/1.0
homepage: "https://sources.debian.org/src/seriation/1.0/"

# 上游无独立测试套件：Debian 原包只有 cfm-seriation.c（942 行）、LICENSE、
# README.md 与 6 个演示数据集（Arabidopsis_thaliana / Drosophila_melanogaster /
# Escherichia_coli / Homo_sapiens / Mus_musculus / Saccharomyces_cerevisiae，
# 合计约 35MB）。连 Makefile 都没有，更无 check/target；上游也没有随包的
# 自动化测试——原包里的 final.png / initial.png 是作者手工跑出的结果截图，
# 不是可复跑的测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_seriation.c
    description: >-
      消费者测试 24 条断言。cfm_seriation 是可执行程序、没有可链接的库 API，
      因此用例按"该程序的真实调用方式"验证：把包内 bin/cfm_seriation 以子进程
      拉起，喂入自造的 4 节点 CFM 边表（6 行边），对其诊断输出、退出码、
      能量收敛值与产物目录做确定性断言。五组用例全部零网络、零 gnuplot、
      零设备依赖（-P 才会调 gnuplot，-v 才会生成视频帧，均不启用）：
      (A) 无参数 → 退出码 1，打印 Usage 横幅与参数表，报 `ERROR! Invalid file
          name.`，且用法文本里含 `f=[NETWORK FILE].dat`；
      (B) `h` → 打印完整帮助后**以退出码 1 结束**（上游 print_help(); exit(1);），
          帮助文本自称 `Usage: ./cfm_seriation`，含 s= 种子项与 P 画图项；
      (C) `f=nope.dat` → 退出码 1，诊断把出错路径原样带出
          （`ERROR! Invalid file path "nope.dat".`）；
      (D) **定种子可重复性**：`f=mini.dat s=42 i=2 m=2` 连跑三次，
          INITIAL Energy 与 FINAL Energy 必须逐次一致，且都是 12。
          这条直接验证模拟退火在 aarch64 上确定可重复，而不只是"能跑通"；
      (E) 诊断与产物：stdout 含 `Reading file...` / `Proteins: 4` /
          `Interactions: 3` / `Done!`；并按正则形状
          `<基名>_<YYYY-MM-DD_HHhMmMmSs>` 找到产物目录（名字带时间戳，
          所以断言的是形状不是固定名），目录内 energy.dat /
          initial_order.dat / final_order.dat / result.txt 四件产物齐全。
      全部期望值取自 qemu-aarch64 + OHOS sysroot 下的**实测输出**。
    command: "test_seriation <package_root>"

# 测试断言总数
assertion_count: 24
