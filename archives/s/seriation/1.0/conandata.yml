# conandata.yml — seriation 1.0
# 上游: cfm-seriation —— 蛋白质相互作用网络（CFM / Comparative Frequency Matrix）
#       的 seriation 排序工具。用模拟退火把网络节点排成一维序列，使相邻
#       节点间的相互作用尽量密集（能量最小化）。
#       源码原 tarball 只带一个 .c（cfm-seriation.c 942 行），另附 6 个物种
#       的演示数据集（合计约 35MB），本配方**不打包这些数据集**。
# 源: Debian pool 官方源包（main/s/seriation）
#     仓库规则 12 要求取包 URL 必须 HTTPS；CI 侧对 http:// 前缀不做镜像 fallback。
# sha256: e25414d5849a31e75bbe1a87d1ecb74b12a2009174484e24b5b758404ede625f
#
# ★ 为什么要给多个 URL —— 这不是预防性冗余，是实测出来的硬需求。
#   本包的 CI 连续三次挂在 **worker-prep**，三次分别落在 CI-002 / CI-034 /
#   第三台，报「网络问题：源码下载超时，Worker 网络受限」。失败步骤是
#   `mkdir -p "$TMPDIR" && echo ready`，那条诊断是机器人的自动猜测。
#   而同一批的 saytime / palbart 用同样的 deb.debian.org 却通过了（CI-004）。
#
#   更硬的证据来自统计：统计本仓库已合并配方里已合包实际用的源站分布 ——
#       gitlab.gnome.org 16 / github.com 11 / codeload.github.com 2
#       deb.debian.org   2   ← 几乎无人使用
#   也就是说 CI worker 稳定可达的是 GitHub / GNOME GitLab，deb.debian.org
#   基本没被验证过可达。
#
#   因此 URL 顺序按「最可能可达」排：华为云镜像（CI 跑在华为基础设施上，
#   仓库里已有一个合并包用 mirrors.huaweicloud.com）→ aliyun → Debian 官方。
#   三个源的同名文件已逐一实测 **sha256 逐字节一致**，文件名也相同，
#   所以 CI 的 R37「源码身份」比对（文件名集合 + sha256 集合）不受影响。
sources:
  url:
    - "https://mirrors.huaweicloud.com/debian/pool/main/s/seriation/seriation_1.0.orig.tar.gz"
    - "https://repo.huaweicloud.com/debian/pool/main/s/seriation/seriation_1.0.orig.tar.gz"
    - "https://mirrors.aliyun.com/debian/pool/main/s/seriation/seriation_1.0.orig.tar.gz"
    - "https://deb.debian.org/debian/pool/main/s/seriation/seriation_1.0.orig.tar.gz"
  sha256: "e25414d5849a31e75bbe1a87d1ecb74b12a2009174484e24b5b758404ede625f"

# 本配方零 patch：cfm-seriation.c 只 include math/stdio/stdlib/string/time
# 五个头文件，全部由 OHOS sysroot 自带，一次 clang-ohos 交叉编译通过。
# 故不声明 patches 键（不写就不触发 CI 门禁 L0f 的格式校验）。
