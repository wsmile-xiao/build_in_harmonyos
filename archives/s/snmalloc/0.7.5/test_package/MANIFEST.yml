# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: snmalloc/0.7.5
homepage: "https://github.com/microsoft/snmalloc"

# 上游测试命令
upstream_check_command: "cd build && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本地验证 70/80 通过，10 个失败为 libc 覆盖/多线程交互类
# 平台差异，见 notes.md；非库本体 API 缺陷）
upstream_tests:
  - file: src/test/func/malloc/malloc.cc
    source: snmalloc-0.7.5/src/test/func/malloc/malloc.cc
    description: "func/malloc: libc malloc/calloc/free 行为测试"
    command: "./func-malloc-fast && ./func-malloc-check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_snmalloc.cpp