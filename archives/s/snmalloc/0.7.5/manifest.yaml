  # （HarmonyOS mmap 单次虚拟预留上限约 256GB，random_pagemap 需 ~1.25TB 会 ENOMEM）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS mmap 单次虚拟地址空间预留上限约 256GB（384GB 即 ENOMEM）；大虚拟预留的分配器库在 check/检测变体启用 random_pagemap 类 mitigation 时会启动失败，应在 mitigations 层禁用该随机化项"
  - "snmalloc 顶层 CMake 目标为 INTERFACE（header-heavy），实际安装库为 libsnmallocshim-static.a，conan package_info 需引用实际库名并导出 SNMALLOC_USE_WAIT_ON_ADDRESS 消费者宏"

