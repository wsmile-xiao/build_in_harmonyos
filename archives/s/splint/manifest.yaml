software: splint
display: "splint"
description: "Static analysis tool for C programs, driven by source annotations"
category: development
homepage: "https://splint.org/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Builds the upstream release with its generated Autotools files; no autoreconf step."
    - "No Conan package dependencies: the tarball ships the generated parser and defines yywrap locally."
    - "Packages the splint executable plus the .lcd model library under share/splint/lib."
    - "Publishes LARCH_PATH via runenv_info so consumers find the model library."
    - "Runs the upstream test suite inside build(): 133 checks, 131 pass (rc/utypes are environment-dependent)."
    - "Runs installed-package consumers for clean, warning and include-preprocessing paths."
  common_dependencies: []

versions:
  "3.1.2":
    status: published
    build_date: "2026-09-26"
