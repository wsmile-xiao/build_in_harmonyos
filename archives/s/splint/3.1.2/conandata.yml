# conandata.yml — splint 3.1.2
# Official upstream source (R39); sha256 verified against the downloaded tarball
# (2284033 bytes).

sources:
  url: "https://splint.org/downloads/splint-3.1.2.src.tgz"
  sha256: "c78db643df663313e3fa9d565118391825dd937617819c6efc7966cdf444fb0a"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: "HMDFS: configure's private tmpdir must not be created with umask 077 (setgid dir + UID remap, E011)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-Makefile.in.patch"
    patch_description: "bison >= 3 emits signature.tab.h; rewrite the include to signature_gen.h (upstream fix)"
    patch_type: "bugfix"
  - patch_file: "patches/0003-src-context.c.patch"
    patch_description: "POSIX: let the TMPDIR environment variable override the compiled-in temp dir (/tmp is read-only on OHOS, E002)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-globals.c.patch"
    patch_description: "define yywrap() unconditionally so linking works without flex's libfl (@LEXLIB@ empty)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-osd.c.patch"
    patch_description: "OHOS libc has no __pid_t; spell the local variable as int (osd_getPid already returns int)"
    patch_type: "portability"
