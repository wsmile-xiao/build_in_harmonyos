# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（G0 干净构建读此字段后独立运行 ./configure；本机 config.guess
  # 无法识别 HarmonyOS，必须显式给出 build triplet，见 notes.md 踩坑 #2）。
  # 必须写成 YAML 列表形式：clean_verify.py 用 lstrip('-') 剥列表标记，
  # 写成字符串会连选项自身的 "--" 一起剥掉（--build= -> build=）导致 G0 必失败。
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

