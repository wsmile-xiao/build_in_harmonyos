# test_package/MANIFEST.yml
# 上游官方测试声明文件
# splint 3.1.2 上游测试：独立的 test/ 目录（GNU make 驱动，`make check` == `fulltest`），
# 对 SPLINTTESTS 列表中的 133 个检查逐个运行 src/splint，再与 test/<name>.expect 逐字比对；
# 上游无 ctest/pytest 注册，测试数据为 test/*.c、test/*.splintrc、test/*.expect。

package: splint/3.1.2
homepage: "https://splint.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C test check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "TMPDIR=<writable> make -C test check -j1"

# 上游实际运行的检查数 (test/Makefile SPLINTTESTS，实测 133 个 "Checking <name>...")
upstream_check_count: 133

# 依赖宿主文件系统布局、在本平台必然失败的两个检查 (build() 仅在输出含下述实证症状时容忍)
upstream_environment_dependent_checks:
  - name: rc
    symptom: "Temporary file for pre-processor output already exists."
    reason: "test/rc3.splintrc 硬编码 '-tmpdir /tmp'，OHOS /tmp 为只读 erofs 挂载 (E002)"
  - name: utypes
    symptom: "Cannot find include file sys/types.h on search path:"
    reason: "该检查需要 splint 默认系统搜索路径下的 <sys/types.h>（/usr/include），OHOS 镜像无 /usr/include"

upstream_tests:
  - file: "test/Makefile"
    source: "splint-3.1.2/test/Makefile"
    description: "fulltest 目标：逐个运行 src/splint 并与 <name>.expect 比对，共 133 个检查"
    command: "make -C test check"
  - file: "src/Makefile.in"
    source: "splint-3.1.2/src/Makefile.in"
    description: "src/ 的 test: 目标转发到 test/ 目录（cd ../test; ${MAKE}）"
    command: "make -C src test"

test_package_tests:
  - file: "test.sh"
    description: "消费者测试 — 调用已安装的 splint：-help/版本、LARCH_PATH 模型库、clean.c 无告警、warn.c 两条诊断、含 #include 经 TMPDIR 预处理"
    command: "bash test.sh"

# 断言总数：test_package/test.sh 中的独立断言数
assertion_count: 5
