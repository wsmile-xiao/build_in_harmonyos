# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.12"

# 软件名
software: "sdl-mixer"
status: built
build_date: "2026-09-14"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz"

  # 源码校验和
  sha256: "1644308279a975799049e4826af2cfc787cad2abb11aa14562e402521f86992a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-music-mod"
    - "--disable-music-ogg"
    - "--disable-music-flac"
    - "--disable-music-mp3"
    - "--disable-music-midi"
    - "--disable-music-cmd"
  dependencies:
    - "sdl12-compat/1.2.68"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-hmdfs-configure-umask.patch"
knowledge_gained:
  - "HMDFS rejects the 0700 temporary directories created by old Autotools configure scripts; using umask 022 allows config.status to generate files (ref: notes.md)."
  - "SDL_mixer 1.2.12 has no formal upstream automated tests; two Conan consumer tests provide API and headless HarmonyOS runtime coverage (ref: reports/test-report.md)."
