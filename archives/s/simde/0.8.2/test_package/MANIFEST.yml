# test_package/MANIFEST.yml
# 上游官方测试声明文件（L0e 强制）
# 实测数据来自本机 aarch64 clang 15 运行上游 test/ 测试（TAP 输出）

package: simde/0.8.2
homepage: "https://github.com/simd-everywhere/simde"

# 上游测试命令（meson 注册，-Dtests=true；官方 release tarball 不含 munit 子模块，本地补充后运行）
upstream_check_command: "meson setup build -Dtests=true && meson test -C build"

# conanfile.py build() 方法中是否已集成上游测试（header-only 无 build()，由 CI conan create 验证头文件）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（抽样 7 组，全部通过；完整 520 源文件由 CI 环境验证）
upstream_tests:
  - file: test/common/common.c
    source: simde-0.8.2/test/common/common.c
    description: "平台假设校验（IEEE754 存储/符号位/端序）"
    command: "./common-c"
  - file: test/arm/neon/aba.c
    source: simde-0.8.2/test/arm/neon/aba.c
    description: "NEON vaba 系列（12 断言通过）"
    command: "./aba"
  - file: test/arm/neon/abd.c
    source: simde-0.8.2/test/arm/neon/abd.c
    description: "NEON vabd 系列（21 断言通过）"
    command: "./abd"
  - file: test/arm/neon/add.c
    source: simde-0.8.2/test/arm/neon/add.c
    description: "NEON vadd 系列（32 断言通过）"
    command: "./add"
  - file: test/arm/neon/ceq.c
    source: simde-0.8.2/test/arm/neon/ceq.c
    description: "NEON vceq 系列（30 断言通过）"
    command: "./ceq"
  - file: test/arm/neon/max.c
    source: simde-0.8.2/test/arm/neon/max.c
    description: "NEON vmax 系列（23 断言通过）"
    command: "./max"
  - file: test/arm/neon/mul.c
    source: simde-0.8.2/test/arm/neon/mul.c
    description: "NEON vmul 系列（25 断言通过）"
    command: "./mul"

# test_package 中自带的测试（消费者视角验证，R34 实质调用 simde API）
test_package_tests:
  - file: test.c
    description: "消费者测试：vaddq_s8/vabdq_s16/vceqq_s32/mm_add_epi32 断言"
    command: "./test_simde"

# 测试断言总数（上游抽样 148 + test_package 15）
assertion_count: 163