knowledge_gained:
  - "官方 release tarball 的 test/munit 子模块为空目录 但 simde 的 meson 注册入口全部带 -DSIMDE_TEST_BARE 不引用 munit（仅 test/run-tests.c 与 CMake 非 bare 路径需要）因此上游全量 meson 测试无需补子模块即可运行"  # reference: E150
