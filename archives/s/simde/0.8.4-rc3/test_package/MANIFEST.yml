# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制）
# 实测数据来自设备 aarch64（HarmonyOS PC）clang 15.0.4 全量运行上游 meson 测试套件

package: simde/0.8.4-rc3
homepage: "https://github.com/simd-everywhere/simde"

# ── 上游测试取数口径 ────────────────────────────────────────────────
# 注册入口（case）计数命令（统计单位 = meson test 注册入口）:
#   meson setup build -Dtests=true && meson test -C build --list | wc -l
#   -> 2014
# 断言（assertion）计数：meson 以 protocol:'tap' 运行，统计 testlog.txt 的 `ok <N>` 行
#   -> 32710 条 ok / 0 条 not ok
# 上游注册规则：测试源文件 × 语言(c/cpp) × 实现路径(emul/native)；
#   common 族为 1 个源文件 × c/cpp 两种语言 = 2；arm/neon 族列表 287 项，
#   排除 ld3/ld4/st1/ld1 后 283 族 × 4 = 1132；
#   arm/sve 族列表 14 项，排除 cnt/ld1/st1/ptest/ptrue/whilelt/reinterpret
#   （native-only 族）后 7 族 × 4 = 28。
upstream_check_command: "meson setup build -Dtests=true && ninja -C build && meson test -C build --print-errorlogs"
upstream_test_case_count: 2014
upstream_test_assertion_count: 32710

# conanfile.py build() 方法中是否已集成上游测试（header-only 无编译阶段，
# 由设备侧独立运行上游 meson 套件取证；conan create 内只跑消费者 test_package）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（按族列出注册入口数与实测结果；2014 个入口全部 PASS）
upstream_tests:
  - file: test/common/common.c
    source: simde-0.8.4-rc3/test/common/common.c
    description: "平台假设校验（IEEE754 存储/符号位/端序）；2 个注册入口（c/cpp），TAP 10 断言全过"
    command: "meson test -C build common/"
  - file: test/arm/neon/*.c
    source: simde-0.8.4-rc3/test/arm/neon/
    description: "ARM NEON 族全量；1132 个注册入口（287 族 - 4 排除项 = 283 族）× c/cpp × emul/native，TAP 16536 断言，含 crc32/native 两项，全部 PASS"
    command: "meson test -C build arm/neon/"
  - file: test/arm/sve/*.c
    source: simde-0.8.4-rc3/test/arm/sve/
    description: "ARM SVE 族；28 个注册入口（14 族 - 7 native-only = 7 族）× c/cpp × emul/native，TAP 688 断言，全部 PASS"
    command: "meson test -C build arm/sve/"
  - file: test/x86/*.c
    source: simde-0.8.4-rc3/test/x86/
    description: "x86 族（mmx/sse/sse2/sse3/ssse3/sse4.1/sse4.2/avx/avx2/fma/f16c/gfni/clmul/svml/xop/bmi/aes）；68 个注册入口（17 族 × 4），aarch64 上走便携实现，TAP 6572 断言，全部 PASS"
    command: "meson test -C build x86/"
  - file: test/x86/avx512/*.c
    source: simde-0.8.4-rc3/test/x86/avx512/
    description: "AVX-512 族全量；472 个注册入口（118 族 × c/cpp × emul/native），TAP 7624 断言，全部 PASS"
    command: "meson test -C build x86/avx512/"
  - file: test/wasm/simd128/*.c
    source: simde-0.8.4-rc3/test/wasm/simd128/
    description: "WebAssembly SIMD128 族；240 个注册入口（60 族 × c/cpp × emul/native），TAP 1052 断言，全部 PASS"
    command: "meson test -C build wasm_simd128/"
  - file: test/wasm/relaxed-simd/*.c
    source: simde-0.8.4-rc3/test/wasm/relaxed-simd/
    description: "WebAssembly relaxed-SIMD 族；28 个注册入口（7 族 × c/cpp × emul/native），TAP 68 断言，全部 PASS"
    command: "meson test -C build wasm_relaxed_simd/"
  - file: test/mips/msa/*.c
    source: simde-0.8.4-rc3/test/mips/msa/
    description: "MIPS MSA 族；44 个注册入口（11 族 × c/cpp × emul/native，因上游 SIMDE_MIPS_MSA_NATIVE 检查恒为假而 emul/native 同源），TAP 160 断言，全部 PASS"
    command: "meson test -C build mips_msa_simd/"

# test_package 中自带的测试（消费者视角验证，R34 实质调用 simde 公开 API）
test_package_tests:
  - file: test.c
    description: "C 消费者：NEON 便携接口 + SSE2/wasm/MSA 跨 ISA 回退路径 + 版本与类型尺寸，45 断言"
    command: "./test_simde"
  - file: test_cpp.cpp
    description: "C++ 消费者：同类 API 的 C++ 语言面（对应上游 c/cpp 双语言注册），16 断言"
    command: "./test_simde_cpp"
  - file: test_native.c
    description: "原生别名层：SIMDE_ENABLE_NATIVE_ALIASES 短名与 simde_ 前缀结果一致 + 原生 A64 NEON 探测，15 断言"
    command: "./test_native"

# 测试断言总数（上游 32710 条 TAP 断言 + test_package 76 项运行期断言 = 32786）
assertion_count: 32786
