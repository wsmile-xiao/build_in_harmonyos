# 软件级 manifest — simde

software: simde
display: "SIMDe"
description: "SIMDe：跨架构可移植 SIMD 指令集头文件库（header-only），提供 ARM NEON / x86 SSE 等可移植实现"
category: library
homepage: "https://github.com/simd-everywhere/simde"
license: MIT

build_system: meson

ohos_adaptation:
  key_points:
    - "header-only 库，无编译产物；直接打包 simde/ 头文件目录"
    - "上游 release tarball 的 test/munit 子模块为空目录，但 meson 注册入口全部带 -DSIMDE_TEST_BARE 不引用 munit，全量上游测试无需补子模块（E150 等价命中）"
    - "OHOS aarch64 上探测到原生 NEON（SIMDE_ARM_NEON_A64V8_NATIVE），原生别名层与 simde_ 前缀接口结果一致"
  common_dependencies: []

versions:
  "0.8.2":
    status: built
    build_date: 2026-09-08
  "0.8.4-rc3":
    status: built
    build_date: 2026-09-10
