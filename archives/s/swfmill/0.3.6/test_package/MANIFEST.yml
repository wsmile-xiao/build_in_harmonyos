# test_package/MANIFEST.yml
# 上游官方测试声明文件
# swfmill 0.3.6 上游测试：两个 shell 驱动的测试套件（test/ 下，无 make check 目标），
# 通过 SWFMILL 环境变量指向被测二进制后逐用例运行 run-test.sh。

package: swfmill/0.3.6
homepage: "https://github.com/djcsdy/swfmill"

# 上游测试命令 (上游无 automake TESTS 集成，make check 无有效测试目标)
upstream_check_command: "cd test/xml-swf-round-trip && for xml in *.xml; do SWFMILL=<bin> ./run-test.sh $xml; done"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试套件 (本地实跑证据: reports/ 与 notes.md)
upstream_tests:
  - file: run-test.sh
    source: test/xml-swf-round-trip/run-test.sh
    description: "XML→SWF→XML 往返一致性测试，53 个 XML 用例逐一转换并比对"
    command: "SWFMILL=<bin> ./run-test.sh <case>.xml"
    result: "53/53 通过"
  - file: run-test.sh
    source: test/transform-and-verify/run-test.sh
    description: "XSLT 转换 + 渲染验证套件，5 个用例（import-ttf.xsl 依赖宿主字体渲染，平台性差异）"
    command: "SWFMILL=<bin> ./run-test.sh <case>"
    result: "4/5 通过（import-ttf.xsl 为字体渲染平台差异，非功能缺陷）"
  - file: run-test.sh
    source: test/compile-and-verify/run-test.sh
    description: "编译验证套件"
    command: "SWFMILL=<bin> ./run-test.sh"
    result: "随源码树提供，本地以 round-trip + transform 两套件为准"

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试 1/2 — xml2swf 最小 XML 生成 SWF 冒烟测试（断言产物非空）"
    command: "swfmill xml2swf minimal.xml minimal.swf"
  - file: conanfile.py
    description: "消费者测试 2/2 — swf2xml 往返转换测试（断言产物非空）"
    command: "swfmill swf2xml minimal.swf minimal.swf.xml"
  - file: conanfile.py
    description: "鸿蒙特有测试（rule12, 非断言）— OHOS 上通过 XSLT 引擎（libxslt/libexslt 链接）渲染 movie，仅打印观测结果不触发断言"
    command: "swfmill xslt empty.xsl empty.xsl.swf"

# 上游测试断言总数 (round-trip 53 个用例各含 1 次输出比对; transform 5 个)
assertion_count: 58
