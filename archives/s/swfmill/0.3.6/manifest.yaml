# 版本级 manifest — swfmill 0.3.6
# 遵循 ARCHIVE-SPEC v2.0

version: "0.3.6"
software: "swfmill"
status: published
build_date: "2026-10-06"
build_system: autotools

source:
  url: "https://www.swfmill.org/releases/swfmill-0.3.6.tar.gz"
  sha256: "db24f63963957faec02bb14b8b61cdaf7096774f8cfdeb9d3573e2e19231548e"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--host=aarch64-linux-ohos"
  dependencies:
    - libxml2/2.15.3
    - libxslt/1.1.45.1
    - freetype/2.14.3
    - libpng/1.6.58
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-configure-umask-002.patch：configure 创建临时目录的两处 `umask 077` 放宽为 `umask 002`——HMDFS(setgid) 下 077 落盘 `drwx--S---`(2700) 组位为空，非属主构建用户无法进入，configure 报 subs1.awk Permission denied / could not setup config files machinery；取 002 而非 022 的依据是 HMDFS 目录权限归一化实测（077→2700、022→2751 组无写位、002→2771 与 conan 构建目录同权限）ref: E129"

knowledge_gained:
  - "swfmill 0.3.6 上游 config.guess/config.sub（2005 版）不识别 aarch64-linux-ohos triplet；以 autoconf 2.72 build-aux 版本为基底补 OHOS 识别后随配方 patches/ 下发，build() 内 copy 覆盖 ref: E072 同型（该两文件是整文件替换、非 diff 补丁、未登记 conandata 的 patches 段，故 patches_applied 只列 0001 编号补丁）"
  - "HMDFS 会剥掉 autotools 辅助脚本可执行位，configure 阶段报 Permission denied；build() 内对 configure/config.guess/config.sub/install-sh/missing 补 chmod +x ref: E490"
  - "swfmill.org 对 .tar.gz 无条件回 Content-Encoding: gzip，requests/urllib3 透明解码使 conan 的 sha256 校验拿到解码面字节必然失败；source() 先 get()、捕 ConanException 后 urllib 原始字节回退（blepvco 0.1.0 同款），文件面 sha256 保持权威锚定 ref: E690 同型（定性：curl=db24f639… 文件面，conan/requests=fbcfe1a3… 解码面，gunzip -c 复算与 Computed 一致）"
  - "上游无 automake TESTS 集成（make check 无有效测试目标）；测试入口为 test/ 下 shell 驱动的逐用例套件，需以 SWFMILL 环境变量指向被测二进制单独运行；xml-swf-round-trip 53/53 通过，transform-and-verify 4/5（import-ttf.xsl 为宿主字体渲染平台差异，非功能缺陷）"
  - "swfmill 为 CLI 应用（package_type=application），按 R38 需 commands.json 声明 xml2swf/swf2xml/xslt 子命令；消费者验证以 test_package 调用已安装二进制完成，鸿蒙特有测试为非断言观测（rule12）"
  - "swfmill 的 CLI 测试源须落在 test_package/ 下（.sh/.py 等，CI L0c 硬性要求，conanfile.py 本身不计入）；上游 xslt 子命令签名为 `xslt <stylesheet.xsl> <input.xml> [<output.swf>]`（src/swfmill.cpp:279 argv[0]=xslfile/argv[1]=infile/argv[2]=outfile 默认 stdout），漏传输入 XML 会被当成 'input document could not be read' 而 rc=255"
  - "HMDFS 上 configure 建临时目录的 `umask 077 && mktemp -d ./confXXXXXX` 会落盘 `drwx--S---`(2700)：组权限位为空，非属主构建用户（CI worker）无法进入，写 subs1.awk 即 EACCES，报 could not setup config files machinery；本地以属主身份构建走 owner 位不触发，故本地全绿而 CI 必红。HMDFS 目录权限归一化实测（同一 setgid 目录两轮复现）：umask 077→2700、umask 022→2751（组仅 r-x，无写位）、umask 002→2771 `drwxrws--x`（与 conan 构建目录同权限，为已验证可写档位）。修法：把 configure 中两处 umask 077 放宽为 002；该文本同为 config.status 的 verbatim 模板，改 configure 即同时覆盖两处 ref: E129（仓内已发布先例 abook/0.6.1 用等效的『删除 umask 077』写法，继承环境 umask 0002 → 2771）"
  - "本机沙箱 safe-delete 垫片在 CODEBUDDY_NODE_BIN 指向不可执行 node 时使 conan 于 export 阶段猝死（SAFE_DELETE_BULK_GUARD_ERROR）；前置 export CODEBUDDY_NODE_BIN=/data/service/hnp/bin/node、PYTHONPATH 剔除 electron shim、unset BASH_ENV CODEBUDDY_SAFE_DELETE_BIN_DIR，并以 HAP 内置解释器派发后消失 ref: libkysdk-base notes #13/#14"
