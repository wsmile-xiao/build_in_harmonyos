# conandata.yml — swfmill 0.3.6
# SHA256 verified from upstream source

sources:
  url: "https://www.swfmill.org/releases/swfmill-0.3.6.tar.gz"
  sha256: "db24f63963957faec02bb14b8b61cdaf7096774f8cfdeb9d3573e2e19231548e"

patches:
  - patch_file: "patches/0001-configure-umask-002.patch"
    patch_description: >
      HMDFS 语义（E129）：configure 建临时目录用
      `umask 077 && mktemp -d "./confXXXXXX"`，在 setgid hmdfs 挂载上落盘为
      `drwx--S---`(2700)——组权限位为空，非属主的构建用户（CI worker）无法进入，
      写 `subs1.awk` 即 EACCES，报
      `./confXXXXXX/subs1.awk: Permission denied` 与
      `config.status error: could not setup config files machinery`
      （本地以属主身份构建走 owner 位不触发，故本地全绿）。发布 tarball 只提供
      预生成 configure（CI worker 无 automake，不能 autoreconf 重生成），故就地
      放宽 umask。
      取 `002` 而非 `022` 的依据是 HMDFS 目录权限归一化实测（同一 setgid 目录下
      两轮复现）：umask 077 → 2700（组无权限）；umask 022 → 2751（组仅 r-x，
      无写位）；umask 002 → 2771 `drwxrws--x`，与 conan 构建目录同权限（该目录
      构建期可写，为已验证的可用档位）。仓内已发布先例 abook/0.6.1 采用同效果
      写法（直接删除 `umask 077`，继承环境 umask 0002 → 2771），本补丁以显式
      `002` 复现该档位，不依赖环境 umask。
      该文本同时是 config.status 的 verbatim 模板，改 configure 即同时覆盖
      config.status 内的同一段。
    patch_type: "portability"
