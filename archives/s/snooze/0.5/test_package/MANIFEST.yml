# test_package/MANIFEST.yml — snooze 0.5
package: snooze/0.5
homepage: "https://github.com/chneukirchen/snooze"

# 上游无独立测试套件：snooze 0.5 是单 .c 工具（snooze.c ~8.6KB）
# 上游 Makefile 只有 all / clean / install 三个目标，**没有 check 或 test 目标**；
# 源码 tarball 内含 sv/（runit 监督脚本），但那不是测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_snooze.c
    description: >-
      消费者测试 180 条断言，**全部使用 -n 干跑模式，零次真实睡眠**。
      四条时间无关不变量：P1 干跑恰好 5 行；P2 行形状
      `YYYY-MM-DDTHH:MM:SS[+-]ZZZZ Ddd …`（时区偏移通配，UTC/+0800 均可）；
      P3 5 个时刻严格递增（days_from_civil 折算绝对秒）；
      P4 打印星期与日期自洽（测试内独立实现 days_from_civil，不依赖对照表）。
      另含 8 组时间模式的字段约束（-H/-M/-d/-w/-D，含范围与列表语法）、
      7 个越界选项的精确范围文案、-J 抖动后缀正/负向对照、无模式默认值。
    command: "test_snooze <bin/snooze>"

# 测试断言总数
assertion_count: 180
