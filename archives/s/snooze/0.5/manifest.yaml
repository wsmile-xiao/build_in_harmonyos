software: snooze
display: "snooze"
description: "Run a command at a particular time: mnemonic time patterns, ISO week / day-of-year filters, supervision-friendly cron replacement"
category: system
homepage: "https://github.com/chneukirchen/snooze"
license: MIT
build_system: custom  # 单 .c + 上游 Makefile 只做 build/install，conanfile 直驱 clang

ohos_adaptation:
  key_points:
    - "单 .c 文件（snooze.c ~8.6KB），零外部依赖"
    - "仅 libc：sys/stat、sys/types、ctype、errno、signal、stdio、stdlib、string、time、unistd、sys/auxv"
    - "musl 全支持，无 patch"
    - "上游 Makefile 只做 all/clean/install，install 依赖 mkdir+install（交叉编译环境不需要），build() 直驱 clang"
    - "编译产出单可执行文件 bin/snooze（约 25KB）"
    - "★ 干跑模式 -n 只打印接下来 5 次运行时刻并退出，不进入等待 → CI 可做完全时间无关的验证"
  common_dependencies:
    - libc (sys/stat, sys/types, ctype, errno, signal, stdio, stdlib, string, time, unistd, sys/auxv)

versions:
  "0.5":
    status: built
    build_date: "2026-09-17"
    source_url: "https://deb.debian.org/debian/pool/main/s/snooze/snooze_0.5.orig.tar.gz"
    source_sha256: "3931f561c8ea7a3208ffd84ddd2817ac0e797a86989133ab0a244f0f683a4be5"
    test_assertions: 180
