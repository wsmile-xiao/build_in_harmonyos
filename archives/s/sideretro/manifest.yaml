# 软件级 manifest — sideretro
# 遵循 ARCHIVE-SPEC v2.0

software: sideretro
display: "sideretro"
description: "sideRETRO — 检测体细胞 de novo retrocopy 插入的 C 流程工具（sider CLI：process-sample / merge-call / make-vcf）"
category: tool
homepage: "https://github.com/galantelab/sideRETRO"
license: GPL-3.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建 + PkgConfigDeps 依赖注入（zlib/sqlite3/htslib/check 均从 conan 制品仓发布）"
    - "OHOS ninja 为 C++ 动态链接 ELF，运行时需 libc++_shared.so：conanfile _build_environment() 注入 SDK llvm c++ lib 目录到 LD_LIBRARY_PATH（否则 meson 报 Could not detect Ninja）"
    - "OHOS libc 未声明 glibc 专有 secure_getenv()，补丁改用 getenv()（非 setuid，语义等价）"
    - "OHOS /tmp 只读（errno=30），上游 check 测试硬编码 /tmp/ponga* 临时路径，补丁相对化为 ./ponga*"
    - "package() 不得用 Meson.install()（重写 RUNPATH 破坏 .codesign 签名 → 运行时 EPERM），应直接复制 build 产物 sider 保留签名"
  common_dependencies:
    - zlib
    - sqlite3
    - htslib
    - check

versions:
  "1.1.6":
    status: built
    build_date: "2026-09-21"
    upstream_identity: valid
    supersession_eligible: false
    note: "上游 galantelab/sideRETRO tag 1.1.6；meson 构建；上游测试 185/185 全绿；20 个 portability 补丁（secure_getenv→getenv、/tmp 相对化、test_read_fatal1/2 确定性化）"
