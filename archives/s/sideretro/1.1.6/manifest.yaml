# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- OHOS 上 meson install 重写 RUNPATH 会破坏 .codesign 签名导致 CLI 运行时 EPERM，应直接复制 build 产物
- OHOS /tmp 只读，上游测试硬编码 /tmp 路径需相对化
- OHOS libc 未声明 glibc 专有 secure_getenv，需替换为 getenv
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

