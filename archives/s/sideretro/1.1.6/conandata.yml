# conandata.yml — sideretro 1.1.6
# 官方 GitHub archive URL（codeload 实测 sha256）

sources:
  url: "https://github.com/galantelab/sideRETRO/archive/1.1.6.tar.gz"
  sha256: "378b49030bef1627494c81bbd285d85f3b78843f691f68963bd6e703ae7bac20"

# 补丁集（共 3 类，全部为 portability 非平台宏修复）：
# 1) 0001: OHOS libc 未声明 glibc 专有 secure_getenv(3) → getenv()
#    （sideRETRO 非 setuid，语义等价；不引入 __OHOS__ 平台宏）
# 2) 0002-0020 中除 0015/0018 外：上游 check 测试硬编码 "/tmp/" 绝对路径，
#    而 OHOS /tmp 为只读（errno=30 Read-only file system）→ 相对化 "./"
#    （meson test CWD=构建目录可写，不依赖任意绝对路径）
# 3) 0015/0018: check_sider_main.c 的 secure_getenv 与 utils.c 的 which()
#    同 0001 的 libc 兼容修复（若与 2 同文件则合并进该文件补丁）
patches:
  - patch_file: "patches/0001-src-utils.c.patch"
    patch_type: "portability"
    patch_description: "Replace glibc-only secure_getenv() with getenv() in utils.c which() (OHOS libc does not declare secure_getenv; non-setuid tool, semantics equivalent)"
    patch_source: "https://github.com/galantelab/sideRETRO"
  - patch_file: "patches/0002-tests-check_sider_abnormal.c.patch"
    patch_type: "portability"
    patch_description: "Tests: OHOS /tmp read-only (errno=30) - relative-ize hardcoded /tmp/ponga.* temp paths to ./ponga.* (meson test CWD writable)"
    patch_source: "https://github.com/galantelab/sideRETRO"
