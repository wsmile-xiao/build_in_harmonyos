# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 如实申报）

package: sideretro/1.1.6
homepage: "https://github.com/galantelab/sideRETRO"

# 上游测试命令：meson test（tests/meson.build 注册 test('all', check_sider)）
upstream_check_command: "meson test"

# 上游测试框架：libcheck（check 单元测试框架）
# 测试源文件：tests/check_sider_*.c 共 30 个模块（abnormal/array/bed/bitree/
# blacklist/chr/cluster/correlation/db/db_merge/dbscan/dedup/exon/fasta/
# genotype/gff/gz/hash/ibitree/io/list/process_sample/retrocopy/sam/set/
# str/utils/vcf/wrapper/main），由 tests/check_sider_main.c 汇总为单一
# check_sider 可执行文件，通过 meson test('all', e) 注册运行。
# 计数口径：meson test 注册 1 个入口（test('all', check_sider)）；
# check_sider 内部含 185 个 check 用例断言（Checks: 185）。
upstream_tests_total: 1
upstream_tests_passed: 1

# conanfile.py build() 中已集成上游测试（meson.test() 执行 check_sider）
upstream_test_in_build: true
upstream_test_command: "meson test"

# test_package 中自带的测试（消费者视角验证）
# 鸿蒙特有测试 = 完整消费者用例：构造最小 SAM+GTF 输入，真实跑通
# sider 的 process-sample → merge-call → make-vcf 全流程（端到端），
# 验证 SQLite 数据库与 VCF 产物生成；另含 --version/--cite/usage 骨架断言。
test_package_tests:
  - file: test.sh
    description: "端到端消费者用例：process-sample→merge-call→make-vcf 真实跑通并验证产物；+ --version/--cite/usage 断言"
    command: "sh test.sh <bin_dir>"

# 测试断言总数（check 框架 tcase 统计）
assertion_count: 451
