notes: >-
  N_static=35 (sum of TAP plan lines across 9 .t scripts); N_registered=9
  (automake TESTS); N_executed=9 (8 PASS + 1 upstream-conditioned SKIP);
  N_consumer=1. Test corpus is the upstream test-data git submodule pinned
  by the sombok-2.4.0 tag (fetched from the submodule commit, see
  conandata.yml).
