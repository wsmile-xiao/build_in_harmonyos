# 版本级 manifest
# 文件位置: archives/s/sombok/2.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4.0"

# 软件名
software: "sombok"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/hatukanezumi/sombok/archive/refs/tags/sombok-2.4.0.tar.gz"

  # 源码校验和
  sha256: "14d9dcd3621bf9d591a7158aeac99b4d4a60296558173be51d57b54b8f9d70a2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--disable-libthai"
    - "--prefix=/"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.am-declare-.t-test-extension.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "tarball 无 configure：tool_requires automake/1.18+libtool/2.5.4 后 autoreconf -fi 引导；设备 aclocal 缺失由 tool_requires 覆盖"
  - "profile CONFIG_SHELL(hnp bash) 在 HMDFS 构建目录 getcwd 挂：env -u CONFIG_SHELL SHELL=/bin/sh 路由 configure/make（§12.38①/direvent 先例）"
  - "automake>=1.16 对 legacy 项目需 TEST_EXTENSIONS=.t 才生成 .t.log 规则；glob 形式 TESTS=tests/*.t 首轮展开退化（bases 变 tests/* 把 lb.sh 裹入），须改显式文件列表"
  - "OHOS musl 忽略 DT_RUNPATH：test_package 运行需以命令行前缀 LD_LIBRARY_PATH=<依赖绝对 libdir>；conan self.run(env=[...]) 收 env 脚本文件名而非 KEY=VALUE"
  - "上游 test-data 为 git 子模块：按 tag 钉住的 commit 作为第二 source 下发（github archive 不含子模块）"

# ============================================================
# 测试信息
# ============================================================

# 上游测试统计
tests:
  # 上游源码静态声明的测试用例总数
  static_total: 35
  # 实际执行的测试用例数
  executed: 9
  # 通过的测试用例数（含子测试）
  passed: 34
  # 跳过的测试用例数
  skipped: 1
  # 失败的测试用例数
  failed: 0
  # 新增消费者测试数
  consumer: 1
