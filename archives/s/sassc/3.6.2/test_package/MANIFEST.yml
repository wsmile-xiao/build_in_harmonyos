# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sassc/3.6.2
homepage: "https://github.com/sass/sassc"

# 上游测试命令：sassc 是 libsass 的 CLI 封装，自身无独立测试套件
# （Makefile 的 test: 目标仅调用 libsass 的 version，非测试）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试程序；R34 由 test_package 真实执行 sassc 编译 SCSS 校验
upstream_tests:
  - file: test_sassc.sh
    source: test_package
    description: "消费者冒烟：真实执行 sassc 编译 SCSS（变量插值）并校验 CSS 输出"
    command: "sassc <input.scss> <output.css>"
