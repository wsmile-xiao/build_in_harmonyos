source:
  url: "https://github.com/sass/sassc/archive/refs/tags/3.6.2.tar.gz"
  sha256: "608dc9002b45a91d11ed59e352469ecc05e4f58fc1259fc9a9f5b8f0f8348a03"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - libsass/3.6.5
  tool_requires: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-makefile-ohos.patch"

knowledge_gained:
  - "sassc 是 libsass（Sass 编译器 C++ 库）的官方 CLI 封装：单源 sassc.c + Makefile，静态链接 libsass.a；依赖链 sassc → libsass/3.6.5（main/ohpcd 已发布，零外部依赖）→ 无"
  - "sassc Makefile 的 SASS_LIBSASS_PATH 默认指向父目录（上游并排 clone 两个仓库），且 $(SASSC_EXE) 依赖 libsass 会 make -C 源码树重编 libsass——对接 conan libsass 包时需 patch 去掉该依赖（libsass 由包提供，静态链接 libsass.a）"
  - "sassc Makefile 的 LDFLAGS 含 macOS 专用 -Wl,-undefined,error——lld（OHOS ELF）报 unknown argument，必须去掉"
  - "OHOS 系统无 libstdc++（用 libc++）：sassc Makefile 默认 LDLIBS 带 -lstdc++，需命令行长覆盖为 -lc++"
  - "CLI 工具（package_type=application）需软件级 commands.json（R38/L0k，type=tool）——参考 archives/s/strace/commands.json"
  - "sassc 官方上游测试 = sass-spec 套件（外部仓库 github.com/sass/sass-spec，docs/testing/ 文档的 make test/make test_spec，官方运行器 sass-spec.rb 为 Ruby——OHOS 无 Ruby）；libsass-3.6.3 时代 tag 共 4604 个 input.scss 用例，.hrx 归档需按 <hrx名>/ 子目录解包"

test_results:
  type: manual
  total: 4604
  passed: 3094
  failed: 1050
  note: "上游 sass-spec 套件（libsass-3.6.3 时代 tag）4604 个 input.scss 用例；OHOS 实测（bash 最小运行器替代 Ruby 官方 sass-spec.rb，按官方口径：sassc -t expanded --precision 10、期望输出优先 output-libsass.css、折叠连续换行归一化）：3094 通过（2405 普通 + 689 error 类）/ 1050 失败（含 216 个 error 类 spec 期望失败但 sassc 意外通过；其余多为 rc=65 EX_DATAERR——libsass 3.6.5 对部分 hsl/color 边界用例真实编译报错，含少量输出差异）/ 296 上游 options.yml :todo: 已知失败跳过 / 164 无期望输出文件未比对；可比对通过率 3094/(3094+1050)=74.7%，全量口径 3094/4604=67.2%；test_package R34 真实执行 sassc 编译 SCSS 校验输出 1/1 通过；适配后合计=上游 4604 + 新增 1 = 4605"
