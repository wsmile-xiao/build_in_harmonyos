# conandata.yml — sassc (libsass 官方命令行编译器)
sources:
  url: "https://github.com/sass/sassc/archive/refs/tags/3.6.2.tar.gz"
  sha256: "608dc9002b45a91d11ed59e352469ecc05e4f58fc1259fc9a9f5b8f0f8348a03"

patches:
  - patch_file: "patches/0001-makefile-ohos.patch"
    strip: 1
    patch_description: "Makefile OHOS 适配：①去掉 macOS 专用 -Wl,-undefined,error（lld 报 unknown argument）；②去掉 $(SASSC_EXE) 对 libsass 源码树的 make -C 依赖（libsass 由 conan 包 libsass/3.6.5 提供，静态链接 libsass.a）；③install 目标去掉 libsass-install（不去 libsass 目录 make install）"
    patch_type: "portability"
