# test_package/MANIFEST.yml — sluice 0.03.01
# CI L0e requires this file to exist.

package: sluice/0.03.01
homepage: "https://github.com/ColinIanKing/sluice"

# Upstream test suite: NONE.
# Inventory evidence (R51 申报表):
#   - Top-level Makefile (0.03.01 tarball) contains no test/check target
#     (`grep -n "test\|check" Makefile` -> no matches, exit 1).
#   - Upstream CI (.travis.yml) script is `make -j2 PEDANTIC=$PEDANTIC` —
#     a compile gate only, no functional test runner.
#   - No tests/ directory, no ctest/pytest registration in the tarball
#     (tarball file list: Makefile sluice.c sluice.1 COPYING README.md
#     .travis.yml bash-completion/ debian/).
# Per R51, "upstream has no automated tests" is declared with the above
# inventory evidence; the compile gate was reproduced locally on OHOS
# (make PEDANTIC=1, zero warnings, see notes.md).

upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package tests (consumer perspective, OHOS)
test_package_tests:
  - file: test.sh
    description: "OHOS consumer end-to-end case: version banner, -n passthrough byte integrity (1048576 bytes), rate-limited piping at 2000000 B/s over 8000000 bytes with runtime pacing assertion (F_SETPIPE_SZ/delay feasibility on OHOS musl)"
    command: "bash test.sh"

assertion_count: 4
