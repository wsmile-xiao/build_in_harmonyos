# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.03.01/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.03.01"

# 软件名
software: "sluice"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ColinIanKing/sluice/archive/refs/tags/V0.03.01.tar.gz"

  # 源码校验和
  sha256: "26743616e7e6cc3254c3e8866b617a9d1d5fcd753901e1a7b24351820f0212ac"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "GNU make 命令行变量会覆盖 Makefile 的 CFLAGS += 追加（-DVERSION 丢失导致 'undeclared identifier VERSION'）；raw Makefile 项目配方只注入 CC，不要传 CFLAGS"
  - "conanfile 中读取 tools.build:compiler_executables 应整体 get 成 dict 后取 'c'/'cpp' 键；对嵌套子键做 conf.get('tools.build:compiler_executables:c') 会报 does not exist in configuration list"
  - "GitHub tarball 在 Python urllib 下超时可用 curl 从 codeload.github.com（官方下载域）预下载到 $TMPDIR/builds/，init-build 检测已存在自动跳过"
  - "sluice EOF 尾部截断为上游既有行为（-n 模式 floor(N/4096)×4096，限速模式 floor(N/io_size)×io_size），与 master 逐字节一致；消费者测试用对齐大小规避"
