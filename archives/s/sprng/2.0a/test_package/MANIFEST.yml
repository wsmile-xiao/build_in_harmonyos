# test_package/MANIFEST.yml — sprng 2.0a
# CI L0e 要求该文件存在且非空。

package: sprng/2.0a
homepage: "http://sprng.cs.fsu.edu/"

# 上游没有 `make check`（顶层 Makefile 只有 all/src/examples/tests/clean/realclean）；
# 质量测试由 `make -C TESTS` 构建 TESTLIST 的 13 个 <name>.sprng 可执行。
upstream_check_command: "make -C TESTS && ./TESTS/<name>.sprng <args>"
upstream_test_in_build: false
upstream_test_command: "固定种子离线跑 13 项，判据=输出断言（详见 reports/test-report.md）"

# 框架注册口径：TESTS/Makefile 的 TESTLIST（四口径之一，实测 13）
upstream_tests:
  - file: TESTS/Makefile
    description: "TESTLIST 注册 13 个统计质量测试（fft 不在注册表且需 SGI 专有库）"
    command: "make -j1 PLAT=GENERIC CC=<clang> -C TESTS"
    registered: 13
    names: "maxt collisions equidist serial gap perm runs coupon poker sum random_walk wolff metropolis"

# 消费者测试（test_package/test.c，9 条断言）
test_package_tests:
  - file: test.c
    description: "初始化/数值区间/确定性/独立性/整数接口/pack-unpack 往返/多生成器（含 PMLCG→gmp 链路）"
    command: "conan test 或 conan create 触发；可执行 test_sprng，退出码=失败条数"
    assertions: 9

# 近似断言合计 = 上游注册 13 + 消费者 9
assertion_count: 22
