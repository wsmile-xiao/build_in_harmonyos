# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（**实测**：无 configure/cmake，顶层 Makefile
  # `include make.CHOICES` + `include $(SRCDIR)/make.$(PLAT)` ⇒ custom）
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表（make.$(PLAT) 体系无 configure 步；平台选择走 PLAT=GENERIC）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "gmp/6.3.0"

  # 编译器
  cc: clang
  cxx: clang++

# 枛建平台（任务卡明令；make.CHOICES 默认 PLAT=INTEL 硬写 MPI 路径）
plat: "GENERIC"

