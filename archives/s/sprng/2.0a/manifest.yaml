  - "0001-sprng-2.0a-ohos-build-portability.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "sprng 的 make.$(PLAT) 体系默认 PLAT=INTEL，make.INTEL 硬写 -I/usr/local/mpi/include 与 -lmpich；OHOS 无 MPI ⇒ 必须显式 PLAT=GENERIC 才能排 MPI（flags 落点实测为 SRC/make.GENERIC 的 CFLAGS/CLDFLAGS 变量）"  # knowledge_ref: E716
  - "1999 年捆绑的 SRC/pmlcg/gmp.h 与 gmp6 符号不兼容（实测 undefined __mpn_add_n/__mpn_sub_n/mpz_init…），必须按 Debian 同款切系统 <gmp.h>"  # knowledge_ref: E716
  - "primes_32.c 与 primes_64.c 同名全局 primes[] 在现代工具链默认 -fno-common 下 multiple definition，必须 static 化（原版源码链接不过）"  # knowledge_ref: E716
  - "上游 _mymalloc 对 size==0 显式返回 NULL，而 pmlcg 的 spawn key 在 gennum==0 时是 0（mpz _mp_alloc=0）⇒ pmlcg_unpack_rng 恒返回 NULL：上游固有缺陷、平台无关（checksprng Simple 接口 17/18 中唯一 FAILED 的根因）"  # knowledge_ref: E716
  - "上游 8 个测试用 void main、6 个用 K&R main，返回值未定义 ⇒ rc 不可作 PASS 判据，须以输出断言（结果行 + 统计值落接受域）判读，rc 原样留档"  # knowledge_ref: E716
  - "RNG 质量测试的确定性来自命令行 seed（init_tests argv[4]，不读 time()），固定 seed=1234567 + n=10/ncombine=1/nsubseq=10 ⇒ NTESTS=100，结果可复算"  # knowledge_ref: E716

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/sprng-2.0a/w0/patch/orig2
  source_work_dir: /storage/Users/currentUser/tmp/sprng-2.0a/w0/patch/work2
  generated_at: '2026-09-24T14:55:08+08:00'
  patches_count: 1

patch_classification:
