# 软件级 manifest
# 文件位置: archives/s/saint/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: saint
display: "saint (SAINT)"
description: "SAINT（Significance Analysis of INTeractome）：分析 AP-MS 蛋白互作数据的命令行工具集"
category: data
homepage: "http://saint-apms.sourceforge.net/Main.html"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile C 工程，无 configure；5 个命令行工具（saint-reformat/spc-noctrl/spc-noctrl-matrix/spc-ctrl/int-ctrl）"
    - "硬依赖 gsl/2.8：CC 从 tools.build:compiler_executables:c 取、-I/-L 从 gsl cpp_info 取，经 make 命令行变量覆盖默认"
    - "不走 make all（clean 的 rm *.gch 会失败），逐 target 构建；zip 剔除 __MACOSX/ 与预编译 bin/"
    - "tools 动态链接 libgsl.so，test 以 conanrun 环境运行、VirtualRunEnv 注入 gsl libdir 到 LD_LIBRARY_PATH"
  common_dependencies:
    - gsl

versions:
  "2.5.0":
    status: built
    build_date: "2026-09-18"
