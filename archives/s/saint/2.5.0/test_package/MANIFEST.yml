# test_package/MANIFEST.yml
# 上游官方测试声明文件 — saint 2.5.0
# CI (build_and_test.sh L0e) 强制要求此文件存在

package: saint/2.5.0
homepage: "http://saint-apms.sourceforge.net/Main.html"

# 上游测试命令：saint 无 make check / ctest / meson test 目标
upstream_check_command: ""

# 经审计，saint 2.5.0 上游源码不含任何测试框架
upstream_tests_exist: false
upstream_test_audit: "Audited saint-2.5.0 source archive (SAINT_v2.5.0.zip, 106 files): top-level Makefile, src/SAINTreformat, src/SAINTspc-noctrl, src/SAINTspc-noctrl-matrix, src/SAINTspc-ctrl, src/SAINTint-ctrl (each: saint.c + math/mcmc .c + .h + compile script). No test/ or tests/ directory, no TESTS/check-TESTS target, no make check target, no gtest/pytest/criterion bindings in Makefile or any source file. The 5 tools are AP-MS command-line analysis executables with no embedded self-test; upstream validation is done by running them on real datasets."
reason: "saint 2.5.0 ships no upstream test framework: no test directory, no make check target, no gtest/pytest bindings."

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "5 个可执行安装/可执行、saint-reformat -v 版本、saint-reformat 最小 AP-MS 数据真实重排（校验 interaction.new）、4 个 MCMC 工具 usage 冒烟（GSL 拉起）"
    command: "/bin/sh test.sh"

assertion_count: 11
