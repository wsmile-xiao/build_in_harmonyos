version: "2.5.0"
software: "saint"
status: "built"
build_date: "2026-09-18"
build_system: "makefile"

source:
  url: "https://sourceforge.net/projects/saint-apms/files/SAINT_v2.5.0.zip/download"
  sha256: "fc9de49685ed92df49e1167d54719f8aec988342374a86909dc16960de638b51"
  tar_format: zip

build:
  system: makefile
  configure_options: []
  dependencies:
    - "gsl/2.8"
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests_exist: false
upstream_test_audit: "Audited saint-2.5.0 source archive (SAINT_v2.5.0.zip, 106 files): top-level Makefile, src/SAINTreformat, src/SAINTspc-noctrl, src/SAINTspc-noctrl-matrix, src/SAINTspc-ctrl, src/SAINTint-ctrl. No test/ or tests/ directory, no TESTS/check-TESTS target, no make check target, no gtest/pytest/criterion bindings. The 5 tools are AP-MS command-line analysis executables with no embedded self-test."
reason: "saint 2.5.0 ships no upstream test framework: no test directory, no make check target, no gtest/pytest bindings."

knowledge_gained:
  - "saint 是纯 C Makefile 工程（5 个命令行工具），无 configure；硬依赖 GSL（gsl_rng MCMC），Makefile 固定 -lm -lgsl -lgslcblas"
  - "Makefile 编译用 `-c $(SRC)/<subdir>/*.c *.h` 多文件单次编译（.o 落在 cwd 后 mv 到 build/，逐步链接并清理），-I 到 gsl 头文件必须经 CFLAGS 注入"
  - "R33：CC 从 tools.build:compiler_executables:c 取；-I/-L 从 gsl 依赖 cpp_info 取，经 make 命令行变量覆盖默认"
  - "不要跑 `make all`：其末尾 clean 的 `rm src/*/*.gch` 在无 .gch 产物时 glob 不匹配会导致 make 失败；改逐目标 make"
  - "zip 内含 __MACOSX/ 垃圾目录与预编译 bin/，source() 一律剔除确保全量源码构建"
  - "tools 动态链接 libgsl.so：test 以 conanrun 环境运行，VirtualRunEnv 注入 gsl libdir 到 LD_LIBRARY_PATH"
