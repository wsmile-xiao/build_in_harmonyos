software: seqan
# 版本级 manifest — seqan 2.3.2
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"

# 构建系统类型
build_system: header-only

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub release 发行资产）
  url: "https://github.com/seqan/seqan/releases/download/seqan-v2.3.2/seqan-library-2.3.2.tar.xz"

  # 源码校验和
  sha256: "c4dc0657a9e125f27512798b709f1589f7d9a6d67ff9bbbe9aec0cff44d83d01"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: header-only

  # 配置选项列表（无 configure/make；consumer 需注意 C++14 + SEQAN_ASYNC_IO=0）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "SeqAn 2.3.2 是 header-only 库，官方 release 提供 seqan-library-*.tar.xz 发行资产（include/ + lib/cmake + lib/pkgconfig），conan 包直接打包即可"
  - "OHOS libc 未实现 POSIX AIO（aio_read/aio_write/aio_suspend 只有 struct 声明无函数实现），必须定义 SEQAN_ASYNC_IO=0 排除 seqan/system/file_async.h"
  - "seqan 2.3.2 官方要求 C++14；profile cppstd=17 时 libc++ 的 std::empty 与 seqan::empty ADL 二义性，消费者需强制 CXX_STANDARD 14"
  - "header-only conan 配方不可用 no_copy_source（source_folder 与 package_folder 分离导致 package() 复制到错误位置），直接在 package() 中从 self.source_folder 复制到 os.path.join(self.package_folder, ...)"
  - "test_package 必须含 self.run 调用（CI L0d 判定 stub_test_method），并用 SET(CMAKE_CXX_STANDARD 14) + target_compile_definitions(SEQAN_ASYNC_IO=0)"