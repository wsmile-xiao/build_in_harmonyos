# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: seqan/2.3.2
homepage: "https://www.seqan.de"

# 上游测试命令（SeqAn 2.3.2 源码仓库 tests/ 目录用 CMake add_executable 组织测试可执行目标）
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件（seqan/seqan @ seqan-v2.3.2，tests/ 目录 82 个 add_executable 测试目标）。
# OHOS aarch64 真机实测（2026-09-28，clang 15.0.4，-std=c++14 -DSEQAN_ASYNC_IO=0
# -DSEQAN_ENABLE_TESTING=1）：67 个目标全部子测试通过（合计 3478 子测试 OK），
# 13 个目标存在失败子测试（105 FAILED，集中于文件输出/流 Tell/写入类用例，
# OHOS musl libc 行为差异，详见 notes.md），2 个目标（bam_io/tabix_io）因 OHOS
# 系统无 zlib 开发库无法编译（消费者需自链 zlib，与官方一致）。
