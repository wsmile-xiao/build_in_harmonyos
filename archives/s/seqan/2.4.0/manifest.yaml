patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "SeqAn 2.x 是 header-only 库，官方 seqan-library-<ver>.tar.xz 资产已含 include/、share/cmake/seqan/seqan-config.cmake 与 share/pkgconfig/seqan-2.pc，无需编译"
  - "上游 CMake 是变量式 find-module（SEQAN_INCLUDE_DIRS/SEQAN_LIBRARIES/SEQAN_DEFINITIONS），不是 imported target；Conan 侧用 cmake_file_name/cmake_target_name 生成 seqan::seqan"
  - "upstream 全量测试套件在 SEQAN_BUILD_SYSTEM=DEVELOP 下开启（51 个测试模块），不随 release library 发布，需用完整源码树单独跑"
  - "OHOS/musl 有 <aio.h> 头与 aiocb 类型，但 libc.so 不导出任何 aio_* 实现（nm -D 实测缺失）；上游无条件调用导致头文件级编译失败，需提供 ENOSYS 桩"
  - "pthread_setaffinity_np 是 glibc 专有符号，OHOS musl 无实现；上游用 #if defined(__linux__) 守卫会编译失败，应改为同时要求 __GLIBC__"
  - "本地 qemu 运行根（Alpine musl）缺 pthread_cond_clockwait/backtrace/libomp，与真机 libc 能力不同，判定测试失败前需先用 nm -D 比对 SDK sysroot 的 libc.so"
