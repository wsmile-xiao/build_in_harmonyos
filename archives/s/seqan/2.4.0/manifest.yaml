  # 官方 library-only 发行包（GitHub Release 资产）
  url: "https://github.com/seqan/seqan/releases/download/seqan-v2.4.0/seqan-library-2.4.0.tar.xz"

  # 官方资产实测 sha256（2026-09-24）
