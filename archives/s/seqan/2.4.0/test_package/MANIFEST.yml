package: seqan/2.4.0
homepage: "https://github.com/seqan/seqan"

upstream_check_command: "cmake -DSEQAN_BUILD_SYSTEM=DEVELOP -DSEQAN_NO_DOX=ON .. && make && ctest"
upstream_test_in_build: false
upstream_test_command: "SeqAn 2.4.0 tests/ suite (51 test modules, ctest targets)"
upstream_tests:
  - file: tests/basic/
    description: "Core alphabet, string, allocator, metaprogramming and tuple tests"
  - file: tests/align/
    description: "Pairwise and multiple alignment (Gotoh, Myers, LAGAN) tests"
  - file: tests/index/
    description: "Index, finder, FM-index and q-gram index tests"
  - file: tests/sequence/
    description: "Sequence container and iterator tests"
  - file: tests/modifier/
    description: "Modified-string adaptors (reverse complement, translate, ...)"
  - file: tests/bam_io/
    description: "BAM/SAM I/O tests"
  - file: tests/find/
    description: "Pattern finding algorithms"
  - file: tests/map/
    description: "Fragment store / mapping tests"
  - file: tests/misc/
    description: "Misc utilities (interval tree, accumulators, ...)"
  - file: tests/parallel/
    description: "Parallel algorithms"
  - file: tests/graph_align/
    description: "Graph alignment tests"
  - file: tests/journaled_set/
    description: "Journaled string set / tree tests"

test_package_tests:
  - file: seqan_consumer_case.cpp
    description: "End-to-end read preparation, alignment, indexing/search, and reverse-complement consumer workflow"
    command: "./test_seqan_consumer"

assertion_count: 7
