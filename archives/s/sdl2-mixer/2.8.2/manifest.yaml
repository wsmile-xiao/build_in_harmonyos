# 版本级 manifest — sdl2-mixer 2.8.2
# 文件位置: archives/s/sdl2-mixer/2.8.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "2.8.2"

# 软件名
software: "sdl2-mixer"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub archive，R39）
  url: "https://github.com/libsdl-org/SDL_mixer/archive/refs/tags/release-2.8.2.tar.gz"

  # 源码校验和（本地实测 archive tarball）
  sha256: "bcd36dc5df23f2a8a89ea518a323dcdde0e296bdcd9b3427d933c21165ca42ce"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（裁剪非必要音频格式，仅留 WAV + MP3/minimp3）
  configure_options:
  - "-DSDL2MIXER_OPUS=OFF"
  - "-DSDL2MIXER_VORBIS=OFF"
  - "-DSDL2MIXER_FLAC=OFF"
  - "-DSDL2MIXER_MOD=OFF"
  - "-DSDL2MIXER_MIDI=OFF"
  - "-DSDL2MIXER_WAVPACK=OFF"
  - "-DSDL2MIXER_GME=OFF"
  - "-DSDL2MIXER_CMD=OFF"
  - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - sdl2/2.30.10

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无源码修改（conandata.yml patches: {}，不注册补丁）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained: []
# - "E092: CMake 不识别 HarmonyOS 平台，用 CMAKE_SYSTEM_NAME=Linux 兼容"
# - "SDL2_mixer 用自带 FindPrivateSDL2.cmake 查 SDL2，需显式注入 include/lib 路径"
