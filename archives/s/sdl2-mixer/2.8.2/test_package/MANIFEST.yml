# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sdl2-mixer/2.8.2
homepage: "https://github.com/libsdl-org/SDL_mixer"

# ── 上游测试审计（upstream_tests_exist=false 的显式证据：条目列表）──
upstream_tests_exist: false
upstream_test_audit:
  - source: "SDL_mixer release-2.8.2 source tree (CMakeLists.txt)"
    reason: "全树无 enable_testing/add_test，无 tests 目录，无 gtest/pytest；仅 playwave/playmus 示例程序（非测试，SDL2MIXER_SAMPLES=OFF）。"
  - source: "CMakeLists.txt BUILD_TESTING option"
    reason: "BUILD_TESTING 默认 OFF，ctest 无任何测试目标：无自动化上游测试可执行。"
  - conclusion: "上游 release-2.8.2 不提供任何自动化测试；test_package 提供链接 libSDL2_mixer.a 的消费者测试（Mix_Init/Mix_Quit）替代，不冒充上游覆盖。"

# 上游测试命令：空串。SDL_mixer 上游无任何 CTest/make check 测试套件
# （CMakeLists.txt 未 enable_testing；仅有 playwave/playmus 示例程序，非测试），
# upstream_check_command / upstream_test_command 留空以声明「上游未绑定测试入口」，
# 与已通过门禁的 aiac / aribb24 / augustus / xidle 配方对齐（这些配方同样把这两项
# 置空、upstream_tests_exist: false、test_package 用裸 print() 输出 no_tests 证据）。
# build() 里跑 ctest 仅为源码树审计留痕（conan create log 可查），不声称上游覆盖。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# SDL_mixer 上游无测试，build() 里的 ctest 仅作源码审计留痕；证据标记
# 按 aiac/aribb24/augustus/xidle 先例移至 test_package 阶段用裸 print() 输出，
# 以通过 HMBS evidence 门禁（门禁从 test_package stdout 抓取，不走 conan 前缀包装）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
# 编译链接 libSDL2_mixer.a，调用 Mix_Init/Mix_Quit 验证头文件与库可用
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libSDL2_mixer.a 并调用 SDL_mixer API（Mix_Init/Mix_Quit）"
    command: "./test_sdl2_mixer"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
