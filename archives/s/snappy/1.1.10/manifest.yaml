# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.1.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.10"

# 软件名
software: "snappy"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-04"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（release asset URL 404：上游 1.1.10 tag 的 release 无附件，
  # 改用 GitHub 官方 tag 归档，与 1.2.2 归档同模式）
  url: "https://github.com/google/snappy/archive/refs/tags/1.1.10.tar.gz"

  # 源码校验和
  sha256: "49d831bffcc5f3d01482340fe5af59852ca2fe76c3e05df0e67203ebbe0f1d90"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DSNAPPY_BUILD_TESTS=OFF"
    - "-DSNAPPY_BUILD_BENCHMARKS=OFF"
    - "-DSNAPPY_INSTALL=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 (E103/E187: CMake 4.x 兼容老项目)"
    - "-Wno-error=sign-compare (clang 15 × snappy.cc:1293 上游已知问题)"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零源码补丁，全部工具链参数注入）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 对 cmake_minimum_required(<3.5) 项目需注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（ref: E103/E187 复用验证）"
  - "上游 -Werror × clang 15 sign-compare：精准降级 -Wno-error=sign-compare，不全局禁用（ref: E293 模式）"
  - "GitHub release tarball 不含 submodule 内容，third_party/googletest 需手动补齐才能跑上游测试（ref: E294 关联）"
  - "本机 shell LD_LIBRARY_PATH 存在空格污染条目会导致 C++ 测试二进制加载 libc++_shared.so 失败；env -i 或干净 LD_LIBRARY_PATH=/system/lib64 可绕过（ref: E078 关联，平台环境问题，非配方问题）"

knowledge_ref:
  - E103
  - E187
  - E293
  - E294
  - E447
