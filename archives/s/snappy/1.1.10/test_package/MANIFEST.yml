# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: snappy/1.1.10
homepage: "https://github.com/google/snappy"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中未集成上游测试
# (SNAPPY_BUILD_TESTS=OFF: 上游测试需 googletest/benchmark 子模块,
#  官方 release tarball 中 third_party/ 为空目录, 无法构建 snappy_unittest)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: snappy_unittest.cc
    source: snappy-1.1.10/snappy_unittest.cc
    description: "Snappy unit tests (needs googletest submodule, absent in release tarball)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_snappy.cpp
    description: "消费者冒烟测试: C++ API (snappy::Compress/Uncompress/GetUncompressedLength/MaxCompressedLength) + C API (snappy_compress/snappy_uncompress) 压缩解压往返一致性验证"
    command: "./test_snappy"

# 上游测试用例总数 (SNAPPY_BUILD_TESTS=OFF 时实际编译运行的 ctest 数)
assertion_count: 5
