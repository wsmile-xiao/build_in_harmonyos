# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: simdutf/6.0.3
homepage: "https://github.com/simdutf/simdutf"

# 上游测试命令 (ctest)
upstream_check_command: "ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (simdutf 6.0.3 CMake/CTest, 78 tests 全过)
upstream_tests:
  - file: tests/CMakeLists.txt
    source: simdutf-6.0.3/tests/CMakeLists.txt
    description: "CTest 注册的 78 个上游测试 (UTF-8/16/32 转换、校验、base64、span、detect_encodings 等)"
    command: "ctest --test-dir build --output-on-failure"
    result: "78/78 passed (0 failed)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "HarmonyOS 消费者测试：validate_utf8 + utf16_length_from_utf8 + convert_utf8_to_utf16le_with_errors 实际调用并断言"
    command: "./test_simdutf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
