package: scanlogd/2.2.8
homepage: "https://www.openwall.com/scanlogd/"

# Upstream has no tests directory and no test/check target.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

upstream_test_statistics:
  total: 0
  passed: 0
  failed: 0
  evidence: "Makefile defines only default, linux, libnids, libpcap, clean; release has no tests directory"

# The portability patch provides standard non-interactive CLI discovery so the
# generic version/help probe does not enter the privileged daemon path.
generic_l2_version_help: supported

test_package_tests:
  - file: test.sh
    description: "Installed scanlogd binary exists and is executable"
    command: "test -x $SCANLOGD_BIN"
  - file: test.sh
    description: "Installed scanlogd.8 manual page exists and is non-empty"
    command: "test -s $SCANLOGD_PREFIX/share/man/man8/scanlogd.8"
  - file: test.sh
    description: "Upstream scanlogd.init service template is packaged"
    command: "test -s $SCANLOGD_PREFIX/etc/scanlogd.init"
  - file: test.sh
    description: "--help exits 0 and prints usage"
    command: "scanlogd --help"
  - file: test.sh
    description: "--version exits 0 and reports 2.2.8"
    command: "scanlogd --version"
  - file: test.sh
    description: "Unknown option exits 2 with an argument error"
    command: "scanlogd --definitely-invalid-option"
  - file: test.sh
    description: "Unprivileged no-argument daemon path fails with a raw-socket permission error"
    command: "scanlogd"

assertion_count: 7
