software: scanlogd
display: "scanlogd"
description: "TCP port scan detection daemon"
category: network
homepage: "https://www.openwall.com/scanlogd/"
license: LicenseRef-Openwall-BSD-cut-down
build_system: makefile

ohos_adaptation:
  key_points:
    - "Use the upstream linux raw-socket target; no libpcap or libnids dependency"
    - "Build explicitly because the upstream default target only prints backend choices"
    - "Install the daemon under bin/ with its upstream man page and init template"
    - "ELF signing is required on OHOS before the packaged binary can execute"
    - "Raw-socket capture requires privilege; ordinary CI can only verify the expected permission failure"
  common_dependencies: []

versions:
  "2.2.8":
    status: prepared
    verification: unverified
    build_date: "2026-09-30"
