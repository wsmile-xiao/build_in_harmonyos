# 版本级 manifest
# 文件位置: archives/s/sdl2-image/2.8.12/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.8.12"

# 软件名
software: sdl2-image

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz"

  # 源码校验和
  sha256: "393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DSDL2IMAGE_INSTALL=ON"
    - "-DSDL2IMAGE_DEPS_SHARED=OFF"
    - "-DSDL2IMAGE_VENDORED=OFF"
    - "-DSDL2IMAGE_TESTS=ON"
    - "-DSDL2IMAGE_AVIF=OFF"
    - "-DSDL2IMAGE_JXL=OFF"
    - "-DSDL2IMAGE_BACKEND_STB=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sdl2/2.30.10
    - libtiff/4.7.2
    - libwebp/1.6.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "SDL2_image 使用 CMake 构建，SDK 需 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64（E092），CMake 4.x 需 CMAKE_POLICY_VERSION_MINIMUM"
  - "SDL2 查找需注入 SDL2_INCLUDE_DIR/SDL2_LIBRARY（FindPrivateSDL2 模块模式）"
  - "libtiff 配方暴露 TIFF::tiff，上游链接 TIFF::TIFF，需 CMakeDeps 覆盖 cmake_target_name"
  - "libwebp 用上游 cmake/Findwebp.cmake 模块模式，webp_INCLUDE_PATH 需指向含 webp/ 子目录的 include 根"
  - "libtiff/libwebp 仅共享 binary，直接链接 .so，链接期 -L/-rpath-link 解析传递 NEEDED"
  - "上游测试 ctest testimage（单测试），SDL_VIDEODRIVER=dummy，测试 ELF 需签名"
