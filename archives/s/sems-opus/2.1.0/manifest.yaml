# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.0"

# 软件名
software: "sems-opus"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sems-server/sems/archive/refs/tags/2.1.0.tar.gz"

  # 源码校验和
  sha256: "f16c28917f1b92e9ec963ca28abd4612282f610276a67fa4e6346d07cffb8756"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DSEMS_USE_OPUS=ON"
    - "-DSEMS_USE_ILBC=OFF"
    - "-DSEMS_USE_MONITORING=OFF"
    - "-DSEMS_USE_PYTHON=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "opus/1.5.2"
    - "libevent/2.1.12"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-inject-conan-dep-include-dirs.patch"
  - "0002-pthread-cancel-capability-probe.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 tarball 含 CodeQL 自引用软链，需剔除后使用"
  - "SEMS 插件引用宿主 -rdynamic 导出的日志符号（run_log_hooks 等），dlopen 消费方需提供"
  - "pthread_cancel 并非所有 libc 都提供（OHOS musl 缺失），应用 CMake check_symbol_exists 编译期能力探测 + on_stop() 协作式停止兜底，而不是平台条件宏"
  - "依赖注入：上游 FindOpus/FindLibevent2 用变量探测，conanfile generate() 注入 OPUS_*/LIBEVENT2_* 变量"
