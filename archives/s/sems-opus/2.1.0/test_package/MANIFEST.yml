# ── test_package 自带测试（消费者视角，赛规 N≥1：完整消费者用例） ──
test_package_tests:
  - file: test.c
    description: "鸿蒙 dlopen 消费者完整用例：按 SEMS 插件加载模型加载 lib/sems/plug-in/opus.so、dlsym 取 amci_exports（真实 amci.h ABI）校验模块名/payload/codec 条目，再以 init()+encode()+decode() 真实跑通 opus 编解码（帧长取自 init() 返回的 fmt 描述）"
    command: "ctest --output-on-failure（用例 test_sems-opus；SEMS_OPUS_PLUGIN 由 configure 阶段写入 ctest 环境属性）"
    assertions: 12
  - file: conanfile.py
    description: "test() 两步：①真实运行包内 bin/sems_tests（上游 11 suite / 204 断言）②ctest 运行 test_sems-opus（鸿蒙消费者用例）"
    command: "<pkg>/bin/sems_tests && ctest"
    assertions: 204

