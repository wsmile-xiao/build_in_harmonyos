package: sandbird/0.1.3
homepage: "https://github.com/rxi/sandbird"

upstream_check_command: "compile example/hello.c and example/input.c"
upstream_test_in_build: false
upstream_test_command: "no upstream automated test target; official examples compile"

upstream_tests:
  - file: example/hello.c
    source: sandbird-0.1.3/example/hello.c
    description: "Official HTTP server example compiled against the C89 library API; not launched because it is intentionally long-lived."
    command: "clang -std=c89 example/hello.c"
    test_functions: 0
    assertion_failure_macros: 0
  - file: example/input.c
    source: sandbird-0.1.3/example/input.c
    description: "Official query-input server example compiled against the C89 library API; not launched because it is intentionally long-lived."
    command: "clang -std=c89 example/input.c"
    test_functions: 0
    assertion_failure_macros: 0

test_package_tests:
  - file: test.c
    description: "Consumer initializes a server on an ephemeral port, performs a non-blocking poll, closes it, and checks the public error string."
    command: "./test_sandbird"

assertion_count: 3
