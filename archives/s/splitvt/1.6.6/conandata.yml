# splitvt 1.6.6 upstream release archive.
#
# R39: exactly one official URL, written as a single scalar value.  CI's
# "Mirror fallback" step (ci/conan/build_and_test.sh) injects mirrors itself
# at build time; a hand-written multi-URL list would disable that injection.
#
# Provenance note: the archive on the author's own project site is
# byte-identical (same size, same SHA-256) to the pristine .orig tarball that
# the Linux-distribution package pipeline carries for the same release, which
# is what makes this hash a trustworthy upstream identity.  Only the upstream
# URL is recorded here: distro pool URLs are rejected by the PF7 source gate,
# and this is the original upstream artifact, not a repackaged one.
sources:
  url: "https://slouken.libsdl.org/projects/splitvt/splitvt-1.6.6.tar.gz"
  sha256: "70a03afe3a43c7458c5fe0152c386f62669107e045b973aecc667259b1820937"

patches:
  # Plain unified diffs with a/ b/ prefixes (no 'diff --git' line), so one
  # path component has to be stripped by the patcher.
  - patch_file: "patches/0001-misc-setpgrp-setpgid.patch"
    strip: 1
    patch_description: "Replace the BSD two-argument setpgrp(0, 0) with POSIX setpgid(0, 0); musl only declares setpgrp(void), so dropctty() cannot compile once <unistd.h> is visible"
    patch_type: "portability"
  - patch_file: "patches/0002-misc-posix-termios-substitution.patch"
    strip: 1
    patch_description: "misc.c: alias the System V termio branch onto POSIX termios (struct termio -> termios, TCGETA -> TCGETS, TCSETAW -> TCSETS) when the libc ships neither <termio.h> nor <sgtty.h>, instead of falling into the undeclared BSD sgtty path"
    patch_type: "portability"
  - patch_file: "patches/0003-vttest-posix-termios-substitution.patch"
    strip: 1
    patch_description: "vttest.c: same termios substitution for the terminal self-probe, which additionally selects the VMIN/VTIME character-timer path over the SIGALRM/setjmp fallback"
    patch_type: "portability"
  - patch_file: "patches/0004-cut-paste-vt_getsel-return-value.patch"
    strip: 1
    patch_description: "cut-paste.c: vt_getsel() is char*-returning but the loop-exhaustion path returned no value; clang 15 treats -Wreturn-type as an error, so return NULL like the cancel path does"
    patch_type: "portability"
  - patch_file: "patches/0005-misc-dropctty-setsid-for-tioccsctty.patch"
    strip: 1
    patch_description: "misc.c: dropctty() must take the POSIX setsid() route wherever TIOCSCTTY exists, else the child never owns its pty (TIOCSCTTY needs a session leader) and an interactive program started in a window sees itself as a background job and never runs the typed line"
    patch_type: "portability"
