# 版本级 manifest — splitvt 1.6.6
software: splitvt
version: "1.6.6"
status: built
build_date: "2026-09-25"
build_system: makefile

# Counts come from the run logs, not from expectations.  30 executed entries =
# 29 consumer assertions in test_package (18 pty scenarios + 11 OHOS
# checkpoints, see the RESULT: lines in reports/w3-local-ci.log at lines
# reports/w3-local-ci.log 1504 (18 assertions) and 1519 (11 assertions), + 1 upstream build-time self-report (./splitvt -v,
# asserted inside build()).  Upstream declares no test suite at all, so the
# upstream side of the ledger is 0/0/0 -- the 清点 evidence lives in
# test_package/MANIFEST.yml and in notes.md section 5.
test_passed: 30
test_failed: 0

source:
  url: "https://slouken.libsdl.org/projects/splitvt/splitvt-1.6.6.tar.gz"
  sha256: "70a03afe3a43c7458c5fe0152c386f62669107e045b973aecc667259b1820937"
  tar_format: tar.gz
  source_identity: "upstream release archive on the author's own project site"

build:
  system: makefile
  # config.c *prints* the Makefile; upstream accepts only -q/-d/-m and we pass
  # no argument on purpose, so config.c echoes what each probe decided -- that
  # output is the evidence for "the probes all answer no".  Everything the 1993
  # probe could not decide is re-supplied through CPPFLAGS by the recipe.
  configure_options:
    - 'sh ./configure   (CC=<profile clang>, deliberately no arguments)'
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-misc-setpgrp-setpgid.patch"
  - "patches/0002-misc-posix-termios-substitution.patch"
  - "patches/0003-vttest-posix-termios-substitution.patch"
  - "patches/0004-cut-paste-vt_getsel-return-value.patch"
  - "patches/0005-misc-dropctty-setsid-for-tioccsctty.patch"

knowledge_gained:
  - "ref: notes.md §1/§3 -- 手写 configure 用 stat(\"/usr/include/...\") 探测特性时，在非 FHS 的 OHOS clang sysroot 上全体静默判否，而编译器预定义 linux 又让代码分支选了另一套答案；能力宏必须由配方回填"
  - "ref: notes.md §2/§3.1 -- 回填走 make 的 CPPFLAGS（上游生成的 Makefile 从不赋值它、内置 .c 规则会追加它），不覆盖 CFLAGS：覆盖会连带吃掉 -DSHELL=\\\"/bin/sh\\\" 的两级引号转义（与 DRAFT-E575 同一机制的第二种表现）"
  - "ref: notes.md §3.1 -- 老代码靠隐式声明过编译时，补回原型（-include unistd.h）是正确性修复：aarch64 上无原型的 ttyname() 返回值被截成 int，同时把 BSD 双参 setpgrp(0,0) 从静默 no-op 暴露成硬错误"
  - "ref: DRAFT-E567 / DRAFT-E565 -- sysroot 既无 <termio.h> 也无 <sgtty.h> 时 legacy 终端两条分支全死，用 __has_include 能力守卫把 System V 支改接 POSIX termios（struct termio→termios、TCGETA→TCGETS、TCSETAW→TCSETS）"
  - "ref: notes.md §4 -- fork 后用 ioctl(TIOCSCTTY) 认领 pty 从节点的程序必须先 setsid()（该 ioctl 只允许会话首进程）；否则窗口里的 shell 只回显不执行，属功能级缺陷而非编译缺陷"
  - "ref: notes.md §6 -- OHOS pty 能力面矩阵 #5 实测读数：openpty/ptmx/grantpt/unlockpt/ptsname 与 /dev/pts 0600 归调用者均可用；TIOCPKT 报 EACCES（本包不用，故只回填探针清单，不作本 PR 的 B 交付）"

upstream_tests:
  exists: false
  test_count: 0
  command: "N/A -- 生成的 Makefile 只有 splitvt/clean/distclean/install/install-man 五个目标，无 check/test"
  notes: >-
    发行包 46 条目全清单里没有 test/spec/check 命名的文件，全树没有 check:/test: 规则，
    也没有 t/、tests/、test/、spec/ 目录；字面串检索到的 "TESTS"(2) 与 "ck_"(15)
    命中经逐条核对分别是 escapes/vt100.codes 里的散文（"CONFIDENCE TESTS"）和
    check_attr()/lock_state 这类标识符的子串，均非测试声明。
    取证脚本与输出：~/tmp/uc2/z41-splitvt/z41-s-audit.sh 与 logs/upstream-test-audit.log。
    注：仓内自动化入口 ci/tools/extract_upstream_tests.sh 因硬编码 /tmp（设备 /tmp 只读）
    在本机不可用，故按同口径手工扫描，未引用其日志。

test_package:
  consumer_program_count: 2
  assertion_count: 29
  assertion_count_basis:
    test_splitvt_pty.py: 18
    test_ohos_specific.py: 11
  description: >-
    两个消费者程序都在真伪终端下起安装包里的 bin/splitvt 并断言它渲染出来的字节流
    （pty 场景 6 组 18 断言 + 鸿蒙特有 6 检查点 11 断言），不做文件存在性检查；
    全部等待带硬超时，超时即 SIGKILL + 回收，不可能挂住构建。
    构建期另在 build() 中真实执行并断言上游唯一的自述入口 splitvt -v（1 项）。

