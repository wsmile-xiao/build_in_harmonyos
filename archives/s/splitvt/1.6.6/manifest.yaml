  W2_structure: "conanfile.py + conandata.yml + patches/ + test_package/（含测试源与 MANIFEST.yml）齐备；PR 只含 archives/s/splitvt 一个软件归档"
  W3_conan_create: "判决行见 reports/ 与 w3 日志；不以 rc=0 当证据"
  R36_dependencies: "无依赖，故无待发布前置"
  R38_commands_json: "archives/s/splitvt/commands.json 声明 splitvt/1.6.6；bin/ 下唯一可执行命令即 splitvt"
  R51_upstream_tests: "上游 0 声明（见 upstream_tests.notes 取证）；未声称跑过不存在的 make check"

blockers: []
