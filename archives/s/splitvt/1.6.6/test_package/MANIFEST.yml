package: splitvt/1.6.6
homepage: "https://www.libsdl.org/projects/splitvt/"

# ---------------------------------------------------------------------------
# Upstream test audit (five-dimension ledger, dimension 1 and 2)
# ---------------------------------------------------------------------------
upstream_tests_exist: false
upstream_test_audit:
  - source: "release archive member list (46 entries, full listing captured)"
    reason: "no member is named like a test/spec/check file and there is no t/, tests/, test/ or spec/ directory anywhere in the tree."
  - source: "generated Makefile (produced by upstream config.c on this machine)"
    reason: "exactly five targets are registered -- splitvt, clean, distclean, install, install-man.  There is no check, test, installcheck or distcheck target, so 'make check' does not exist and is not claimed anywhere."
  - source: "grep for test frameworks across the tree"
    reason: "0 hits for add_test, assert(, fail(, TAP, unit-test, 'make check', prove.  The literal strings TESTS (2 hits) and ck_ (15 hits) that a naive scan counts are prose inside escapes/vt100.codes ('CONFIDENCE TESTS') and identifier substrings (check_attr(), lock_state); both were read line by line and rejected."
  - source: "utils/ and examples/ directories"
    reason: "helper programs (title.c, treset.c, which.c, unman.c) and shell wrappers shipped as user tooling, not as a test suite; they are not built by the Makefile at all."
  - conclusion: "upstream 1.6.6 declares zero automated test cases (N_static = 0) and registers zero runnable test targets (N_registered = 0), so there is no upstream suite that could be executed in build(); no upstream case is skipped, hidden or re-labelled."

upstream_check_command: "N/A -- no check target exists upstream"
upstream_test_in_build: false
upstream_test_command: "N/A"
upstream_tests: []

upstream_static_count: 0
upstream_registered_count: 0
upstream_executed_count: 0
upstream_skipped_count: 0
upstream_skipped_reason: "nothing to skip: the 0/0 above means no case is declared.  The single self-report upstream does offer to a build -- the 'splitvt -v' version banner -- is executed for real inside build() and asserted (it must contain 'Splitvt 1.6.6'), and is counted separately below."
build_time_upstream_self_report_count: 1

# ---------------------------------------------------------------------------
# Adaptation-side tests (dimensions 4 and 5): consumer programs
# ---------------------------------------------------------------------------
# Counting rule used here: one test *program* == one executed test case; the
# assertions inside it are reported alongside, never as separate cases.
consumer_program_count: 2
assertion_count: 29
assertion_count_basis:
  test_splitvt_pty.py: 18
  test_ohos_specific.py: 11

test_package_tests:
  - file: test_splitvt_pty.py
    name: consumer-pty-functional
    description: >-
      Single consumer entry point (18 assertions).  Starts the installed
      bin/splitvt under a real pseudo terminal and asserts on the bytes it
      renders through the outer master: version banner and usage semantics;
      that the programs configured with -upper/-lower each reach the screen;
      that splitvt tears its scrolling regions down and exits 0 by itself once
      both windows end; that a line typed into the upper window is actually
      executed by the child shell (which only holds if the child owns its pty,
      i.e. if dropctty()/setsid() and TIOCSCTTY work); that TERM=xterm takes the
      X_SUPPORT branch including the title escape; and that a non-vt100 terminal
      is refused with the documented message and exit status 3 without starting
      any child.
    command: "python3 test_splitvt_pty.py <package>/bin/splitvt"

  - file: test_ohos_specific.py
    name: ohos-specific
    description: >-
      Single OHOS-specific entry point (11 assertions), independent of the
      suite above and fail-closed (an unanswerable checkpoint is a failure, not
      a skip).  Parses the delivered ELF by hand: ELFCLASS64/little-endian/
      EM_AARCH64; PT_INTERP == /lib/ld-musl-aarch64.so.1; DT_NEEDED == libc.so
      only, which is the machine-checked form of "no termcap/ncurses is really
      needed here"; no DT_RPATH/DT_RUNPATH and no build-machine path embedded.
      Then it runs the package with SHELL removed from the environment and
      asserts the compiled-in default shell really starts interactively in both
      windows -- the behaviour that silently breaks if the generated Makefile's
      CFLAGS is overridden and -DSHELL loses its quoting.  Finally it records
      this platform's pty ownership model (/dev/pts slave arrives 0600 owned by
      the invoking uid).
    command: "python3 test_ohos_specific.py <package>/bin/splitvt"

ohos_specific_test_count: 1
ohos_checkpoint_count: 11

# Every wait in both suites is bounded (select() with an explicit deadline plus
# a SIGALRM budget); a session that overruns is SIGKILLed and reaped, so no
# case can hang the build.  No case is skipped on this machine.
hardware_playback_required: false
hardware_playback_note: >
  splitvt is a terminal multiplexer over pseudo terminals, not an audio/video
  or graphics client.  Both suites run on the HarmonyOS PC itself against a
  real pty allocated by the kernel (no device node beyond /dev/ptmx and
  /dev/pts is required), so no test here depends on hardware playback.
machine_readable_summary: "RESULT: passed=N failed=M skipped=K  (emitted by both suites; parse it, do not infer)"
