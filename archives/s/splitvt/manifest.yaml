# 软件级 manifest — splitvt
software: splitvt
display: "splitvt"
description: "把 vt100 兼容终端切成上下两个窗口，各跑一个独立程序（伪终端复用器）"
category: terminal
homepage: "https://www.libsdl.org/projects/splitvt/"
license: GPL-2.0-only

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 configure 是作者手写的 sh 脚本：编译并运行 config.c，由它 printf 出整份 Makefile；特性探测全是对 /usr/include 的 stat，而本机 /usr/include 不存在 ⇒ 能力宏全体静默判否，须由配方回填"
    - "本机 clang 同时预定义 linux/__linux__/__OHOS__，故代码层仍选中 SVR4 /dev/ptmx pty 路径：探测层与分支层结论互相矛盾，是本包所有症状的共同根因"
    - "能力宏走 CPPFLAGS 注入（上游生成的 Makefile 从不赋值它），绝不覆盖 CFLAGS——覆盖会连带吃掉 -DSHELL=\\\"/bin/sh\\\" 的两级引号转义，宏退化成 / bin / sh 三个 token（E575 机制）"
    - "-include unistd.h 修的是正确性：utmp.c 里 ttyname() 无原型 ⇒ aarch64 上返回指针被截断；原型可见后又暴露 BSD 双参 setpgrp(0,0) 与 musl 单参 setpgrp(void) 的硬冲突"
    - "sysroot 既无 <termio.h> 也无 <sgtty.h> ⇒ misc.c/vttest.c 两条 legacy 终端支都不可编译，改接 POSIX termios（struct termio→termios、TCGETA→TCGETS、TCSETAW→TCSETS，命中 DRAFT-E567/E565 家族）"
    - "dropctty() 必须走 setsid()：ioctl(TIOCSCTTY) 只允许会话首进程调用，否则子窗口永远不拥有自己的 pty，里面的 shell 只回显不执行（补丁 0005，功能级缺陷）"
    - "无任何第三方依赖：termcap 在 #ifdef TERMCAP 之后且 /usr/lib/libtermcap.a 不存在，非 termcap 支硬编码 VT100 转义；产物 DT_NEEDED 仅 libc.so（测试里钉成断言）"
    - "上游 install 用 mv 搬进 /usr/local/bin（无 PREFIX/DESTDIR）⇒ 不调用它，package() 显式安装 bin/man/res/licenses"
    - "上游无任何测试套件（Makefile 只有 splitvt/clean/distclean/install/install-man 五个目标）；test_package 在真 pty 下驱动安装包，新增 2 个消费者程序 / 29 条断言"
  common_dependencies: []

versions:
  "1.6.6":
    status: built
    build_date: "2026-09-25"
    conan_ref: "splitvt/1.6.6"
