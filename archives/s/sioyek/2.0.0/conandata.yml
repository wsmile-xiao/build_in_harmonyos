# conandata.yml — sioyek 2.0.0（ahrm/sioyek，Qt5 + mupdf PDF 阅读器）
# 上游: ahrm/sioyek tag v2.0.0（2022-06-26 发布）
# R39: 仅官方源 URL，镜像 fallback 由 CI 自动添加

sources:
  url: "https://github.com/ahrm/sioyek/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "92398b6da5e297c59f22cd3c6b562194846f28bc17bb4ae9432869aafeb5df17"

# R40 适配补丁：qmake 工程的 OHOS 平台分支
# 1) Qt 模块裁剪：3dinput/openglextensions 源码零引用且 qt5-qtbase/5.15.2.2
#    包未构建对应模块（Qt3DInput 在无显示服务环境链接探测崩溃）
# 2) LIBS 重写：mupdf 静态库（.a bundle）经 $$MUPDF_LIBS 注入包内绝对路径，
#    剔除 LINUX_STANDARD_PATHS（资源走 NON_PORTABLE 便携布局）
patches:
  "2.0.0":
    - patch_file: "patches/0001-ohos-qmake-config.patch"
    - patch_file: "patches/0002-qt5-qkeyevent-header.patch"
      # 上游 2.0.0 按 Qt6 头布局写 include（Qt6 拆出 qkeyevent.h），
      # Qt5 中 QKeyEvent 声明于 qevent.h，改写为 Qt5 真实头。
    - patch_file: "patches/0003-qtbase-nosharedmemory-runguard.patch"
      # 本仓 qt5-qtbase/5.15.2.2 构建未启用 sharedmemory/systemsemaphore
      # 特性（qtcore-config.h 定义 QT_NO_SHAREDMEMORY）。RunGuard 的
      # 共享内存单实例判定按宏降级：总是主实例，QLocalServer IPC 保留。
    - patch_file: "patches/0004-gles-gl-clamp-to-edge.patch"
      # GL_CLAMP 是桌面 GL 1.x 枚举，OHOS GLES 头无定义；换为 GLES 与
      # 桌面 GL 均支持的等价枚举 GL_CLAMP_TO_EDGE（上游后续版本同写法）。
    - patch_file: "patches/0005-mupdf-1.25-parse-uri.patch"
      # mupdf 1.25 删除了 pdf 层 pdf_parse_link_uri()；parse_uri() 改用
      # fitz 层等价 API fz_resolve_link_dest(ctx, doc, uri)，签名随之
      # 增加 fz_document* 参数，4 个调用点传入 current_document->doc。
