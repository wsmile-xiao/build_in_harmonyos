# 版本级 manifest — sioyek 2.0.0
# 遵循 ARCHIVE-SPEC v2.0
# 状态: built（本地 conan create + verify 通过，制品未 upload 制品仓）

version: "2.0.0"
software: "sioyek"
status: built
build_date: "2026-09-18"
build_system: qmake

source:
  url: "https://github.com/ahrm/sioyek/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "92398b6da5e297c59f22cd3c6b562194846f28bc17bb4ae9432869aafeb5df17"
  tar_format: tar.gz

build:
  system: qmake
  configure_options:
    - "pdf_viewer_build_config.pro"
    - "-spec linux-clang"
    - "CONFIG+=non_portable"
    - "QMAKE_STRIP=\"\""
    - "MUPDF_LIBS=<mupdf 包内四个静态 .a 的绝对路径序列>"
  dependencies:
    required:
      - "qt5-qtbase/5.15.2.2 (published)"
      - "mupdf/1.25.1 (published)"
      - "zlib/1.3.1 (published)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-qmake-config.patch (QT 裁剪 3dinput/openglextensions、OHOS 分支 LIBS+=MUPDF_LIBS、ZLIB 注入)"
  - "0002-qt5-qkeyevent-header.patch (qkeyevent.h→qevent.h，上游按 Qt6 头布局书写的 include，5 个文件)"
  - "0003-qtbase-nosharedmemory-runguard.patch (QT_NO_SHAREDMEMORY 特性降级桩，#ifdef/#else 整体门控，保留 QLocalServer IPC)"
  - "0004-gles-gl-clamp-to-edge.patch (GL_CLAMP→GL_CLAMP_TO_EDGE，桌面 GL 1.x 枚举在 OHOS GLES 头缺失)"
  - "0005-mupdf-1.25-parse-uri.patch (pdf_parse_link_uri 已于 mupdf 1.25 删除，parse_uri 增加 fz_document* 参数改用 fz_resolve_link_dest)"

knowledge_gained:
  - "sioyek 2.0.0 = ahrm/sioyek，Qt5 + mupdf 的 PDF 阅读器（qmake TEMPLATE=app，非库）"
  - "上游仓库无 CMakeLists/configure.ac，构建系统为 qmake（pdf_viewer_build_config.pro）；conan 2.29 无 conan.tools.qmake，参照 baka 2.0.4 先例直调 qmake + make"
  - "qt5-qtbase/5.15.2 为 -no-widgets 构建，sioyek .pro 声明 QT += widgets → 必须依赖启用 Widgets 的 5.15.2.2"
  - "mupdf/1.25.1 为静态 .a bundle（libmupdf/libmupdf-third/libmupdf-pkcs7/libmupdf-threads），不走 -l 查找，经 qmake 命令行变量 MUPDF_LIBS 以绝对路径注入以控制链接顺序"
  - "synctex 直接 include <zlib.h> 且 mupdf 第三方 bundle 不导出 zlib 符号 → 显式依赖 zlib/1.3.1，-lz 经 LIBRARY_PATH 解析"
  - "CONFIG+=non_portable 启用便携布局：prefs/keys/shaders/tutorial 从可执行文件同级目录解析（main.cpp configure_paths() 的 parent_path 分支）→ package() 将配置文件拷入 bin/ 同级"
  - "QMAKE_STRIP=\"\" 防止 strip（OHOS 加载器拒绝 stripped ELF）"
  - "sioyek --version 在 main() 中 QApplication 构造之前处理（main.cpp:662）→ 无显示环境可真实运行 --version 冒烟"
  - "上游无 tests/ 目录与 CI 测试 job（唯一 workflow build_and_release.yml 只构建发布），test_package 补三层冒烟：arm64 ELF 断言 + conanrun 环境 ldd 依赖解析 + --version 实际运行"

failure_reason: null

patch_classification:
  - file: "0001-ohos-qmake-config.patch"
    type: auto
    platform_only: True
    guard: "pending"
  - file: "0002-qt5-qkeyevent-header.patch"
    type: auto
    platform_only: False
    guard: "pending"
  - file: "0003-qtbase-nosharedmemory-runguard.patch"
    type: manual
    platform_only: False
    guard: "#ifdef QT_NO_SHAREDMEMORY（依赖 qtbase 特性宏，非平台宏，PF5 合规）"
  - file: "0004-gles-gl-clamp-to-edge.patch"
    type: manual
    platform_only: False
    guard: "GLES 与桌面 GL 通用枚举，上游后续版本同款写法"
  - file: "0005-mupdf-1.25-parse-uri.patch"
    type: manual
    platform_only: False
    guard: "mupdf>=1.25 API 迁移，与上游 main 分支演进方向一致"

knowledge_ref: []
