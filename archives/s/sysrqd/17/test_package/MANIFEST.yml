# test_package/MANIFEST.yml
# 上游官方测试声明文件
# sysrqd 17 上游**无任何测试**：源码归档（jd-sysrqd-9510edc）中不存在 tests/
# 目录、Makefile 仅含 sysrqd/install/clean/release 目标、无 ctest/pytest/meson
# 测试注册。上游 README 只描述 telnet 使用流程，未提供验证步骤。故上游可运行
# 测试数 = 0，本 test_package 采用消费者视角的确定性断言验证已安装二进制。

package: sysrqd/17
homepage: "https://github.com/jd/sysrqd"

# 上游测试命令探测结果
upstream_check_command: "make check (无此目标；Makefile 仅含 sysrqd/install/clean/release)"

# conanfile.py build() 中未集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试源文件
upstream_tests: []

# test_package 自带测试（消费者视角，调用已安装二进制）
test_package_tests:
  - file: test.sh
    description: >-
      消费者测试 — 验证已安装 sysrqd 二进制：ELF magic、AArch64 e_machine、
      无参数启动拒绝（exit 1，daemonize 之前退出）、非 root 拒绝消息
      （root 环境该断言 SKIP）、未解析参数（--version）同样 exit 1。
      sysrqd 的完整守护行为需要 root + /etc/sysrqd.secret + 端口 4094 +
      /proc/sysrq-trigger，超出 test_package 边界（真机环境限制，见 notes.md）。
    command: "bash test.sh"

# test_package 断言总数（见 test.sh；A5 在 root 环境下 SKIP）
assertion_count: 6
