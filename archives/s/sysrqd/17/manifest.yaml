# 版本级 manifest
# 文件位置: archives/s/sysrqd/17/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "17"
software: sysrqd
status: built
build_date: "2026-09-29"
build_system: makefile
conan_ref: "sysrqd/17"
status_notes: >-
  真机 shadow CI（r3）一次通过：conan create 成功（零警告、-lcrypt 直链）、
  test_package 6/6 断言 PASS、L0/L1/L4/L5 pass、L1e 破坏性反向验证确认
  真依赖（bin/ 移走后测试 FAIL）、exit code 0。L2=skip(non-blocking)：
  sysrqd main(void) 不解析参数，--version/--help 走非 root 拒绝路径 exit 1，
  属上游 CLI 惯例缺失（同 rotix/E503 族），test_package A6 已实测该行为。
  r1 曾因 runner 环境 PATH 缺 bash 挂 KC（hnp bin 修复后通过），见 notes W5。

source:
  url: "https://deb.debian.org/debian/pool/main/s/sysrqd/sysrqd_17.orig.tar.gz"
  sha256: "5b4b7f1b550001b330069c309ea70b69bd3875d8392ba8ea207dc74ee417e462"
  tar_format: tar.gz

build:
  system: makefile
  # 上游 Makefile 无 configure；配方钉 CC 与 VERSION，不用 make install
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS musl libc 直接导出 crypt/daemon/mlockall/setpriority/syslog（llvm-nm -D 核验），sysroot 另有 libcrypt.a（无 libcrypt.so）；sysrqd 这类 libxcrypt 用户在 OHOS 上零补丁、-lcrypt 原样可链。"
  - "上游 Makefile 用 grep|head|cut|tr 管道提取 VERSION；make 命令行钉 VERSION 可绕开 toybox 工具依赖并保证确定性。"
  - "上游 install 目标调用 install 命令（OHOS 缺失，E098）；package() 直接复制二进制到 sbin/。"

validation:
  local_windows:
    ohos_cross_compile: passed
    method: >-
      DevEco OHOS SDK clang 15.0.4，-target aarch64-linux-ohos --sysroot=<sdk>/sysroot；
      上游全套警告 CFLAGS + -DSYSRQD_VERSION 编译 0 error 0 warning；
      链接 -lcrypt 成功，NEEDED 仅 libc.so，无 UND 残留符号。
    sha256_check: passed
    conan_create: not_run
    reason: "本机（Windows）未安装 Conan，也无 OHOS 运行时可执行目标二进制。"
  ohos:
    conan_create: passed
    method: >-
      真机 shadow CI（r3，2026-10-01）：隔离 job + 全局锁（wait_seconds=0），
      ci/conan/build_and_test.sh 全流程。源码从 deb.debian.org 直接下载成功、
      make CC=<hnp clang> VERSION=17 零警告、-lcrypt 链接成功，
      打包 AUTHORS/README.md/ChangeLog/bin/sysrqd。
    gates: "L0=pass L1=pass(incl L1e genuine) L2=skip(non-blocking) L4=pass L5=pass"
    test_package: "6/6 assertions PASS"
    exit_code: 0
