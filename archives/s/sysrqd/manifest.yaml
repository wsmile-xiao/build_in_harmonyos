# 软件级 manifest
# 文件位置: archives/s/sysrqd/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: sysrqd
display: "sysrqd"
description: "通过网络（TCP 4094，密码认证）触发 Linux Magic SysRq 的小型守护进程"
category: utility
homepage: "https://github.com/jd/sysrqd"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - >-
      零源码补丁：OHOS musl libc 直接导出 crypt/daemon/mlockall/setpriority/
      syslog 符号（llvm-nm -D 对 sysroot libc.so 核验），libcrypt.a 亦在
      sysroot 中，上游 LDFLAGS += -lcrypt 原样可用。
    - >-
      Makefile 用 grep|head|cut|tr 管道提取 VERSION；配方在 make 命令行钉
      VERSION=17，绕开对 toybox 工具链的依赖并保证确定性。
    - >-
      不用 make install：上游 install 目标调用 install 命令（OHOS 缺失，
      知识条目 E098），package() 直接复制二进制到 sbin/。
    - >-
      运行时前提（非构建阻塞）：完整守护行为需要 root、/etc/sysrqd.secret、
      TCP 4094 绑定与 /proc/sysrq-trigger 写权限；OHOS 上 /proc 访问受
      SELinux 限制（E031），真机功能验证以启动拒绝路径断言为主。
  common_dependencies: []

versions:
  "17":
    status: built
    build_date: "2026-09-29"
    path: archives/s/sysrqd/17
