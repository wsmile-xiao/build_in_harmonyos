# 版本级 manifest — sobjectizer 5.7.4
# 文件位置: archives/s/sobjectizer/5.7.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 为 CI 唯一输入，本文件为交叉校验元数据）

# ============================================================
# 必须字段
# ============================================================

version: "5.7.4"
software: "sobjectizer"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-02"
build_system: "cmake"
conan_ref: "sobjectizer/5.7.4"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://github.com/Stiffstream/sobjectizer/archive/v.5.7.4.tar.gz"
  # 源码校验和（与 conandata.yml 一致）
  sha256: "f032d071579d80fb423171d411ae0e33af0da46776ca0db7eb1d933c69fb0726"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  # 上游仓库根没有 CMakeLists.txt，全部 CMake 工程在 dev/ 子目录，
  # 故 -S 指向 <source>/dev。
  source_subdir: "dev"
  cmake_options:
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DSOBJECTIZER_BUILD_SHARED=ON"
    - "-DSOBJECTIZER_BUILD_STATIC=ON"
    - "-DSOBJECTIZER_INSTALL=ON"
    - "-DBUILD_TESTS=ON"
  dependencies: []
  cc: clang
  cxx_std: 17

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

patch_generation:
  method: none
  patches_count: 0

patch_classification: []

# ============================================================
# 测试信息
# ============================================================

tests:
  # 上游自带 ctest 套件，配方在 build() 内真实执行（未替换任何用例）
  upstream_suite: "ctest (dev/test/so_5)"
  upstream_registered: 319
  upstream_executed: 318
  upstream_passed: 318
  upstream_excluded: 1
  exclusion_reason: >-
    _unit.test.spinlocks.llvm_inspired_test 在 qemu【用户态】模拟器下活锁
    （8 线程 x 64K 次纯用户态 TATAS 自旋；qemu-user 无 guest 内核调度器，
    自旋线程饿死同 guest 其它线程，实测 8 秒墙钟烧 62 秒 CPU 仍不结束）。
    qemu-system 与真机不受影响。配方仅在检测到用户态模拟器时用 ctest -E 排除，
    真机/CI 上 319 个用例完整执行。
  test_package:
    - "test_sobjectizer（共享库消费者, CMakeDeps）"
    - "test_sobjectizer_static（静态库消费者, CMakeDeps）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "SObjectizer 上游仓库根无 CMakeLists.txt，CMake 工程在 dev/ 子目录，配方 -S 必须指向 <source>/dev"
  - "OHOS SDK llvm/bin 只有 llvm-ar 没有 llvm-ranlib，而 ohos.toolchain.cmake 仍设 CMAKE_RANLIB=llvm-ranlib；cmake 造静态库是 `<AR> qc <lib> && <RANLIB> <lib>`，因此 .o 全编得过、一造 .a 就 ENOENT，且报错不说是哪个程序找不到（'Error running link command: no such file or directory'）。须显式 -DCMAKE_RANLIB"
  - "上游测试框架 dev/test/3rd_party/various_helpers/time_limited_execution.hpp 用【墙钟】std::future::wait_for 做看门狗（全仓库 347 处调用点，秒数按原生 x86-64 标定）；在 qemu 模拟下并行执行会互相抢占 CPU 导致看门狗误判超时并 abort()，因此 ctest 必须 -j1"
  - "qemu-user 没有 guest 内核调度器，纯用户态自旋锁压力测试（TATAS + std::this_thread::yield）会活锁；判定依据是原生 x86-64 与真机均通过、仅 qemu-user 挂起，用 ctest -E 精确排除并在配方里注明"
  - "BUILD_TESTS=ON 会产出 319 个测试可执行文件 + 2 个库，裸 `cmake --build -j` 会把 11GB 构建机 OOM（gmake Error 137/143），须夹住并行度并尊重 tools.build:jobs"

# ============================================================
# 产物
# ============================================================

artifacts:
  shared: "lib/libso.5.7.4.so"
  static: "lib/libso_s.5.7.4.a"
  headers: "include/so_5/**"
  cmake_config: "lib/cmake/sobjectizer/sobjectizer-config.cmake"
