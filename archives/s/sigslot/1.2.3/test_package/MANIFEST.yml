# test_package/MANIFEST.yml — sigslot/1.2.3
# CI L0e requires this file to declare upstream and consumer test sources.

package: sigslot/1.2.3
homepage: "https://github.com/palacaze/sigslot"

upstream_check_command: "cmake --build . --target sigslot-tests --parallel 1"
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target sigslot-tests --parallel 1 && ctest --output-on-failure"

upstream_tests:
  - file: test/bench-slots.cpp
    count: 1
    source: sigslot-1.2.3/test/bench-slots.cpp
    description: "Benchmark slot behavior test target"
    command: "ctest -R sigslot-test-bench-slots --output-on-failure"
  - file: test/function-traits.cpp
    count: 1
    source: sigslot-1.2.3/test/function-traits.cpp
    description: "Function traits test target"
    command: "ctest -R sigslot-test-function-traits --output-on-failure"
  - file: test/observer.cpp
    count: 1
    source: sigslot-1.2.3/test/observer.cpp
    description: "Observer test target"
    command: "ctest -R sigslot-test-observer --output-on-failure"
  - file: test/pmf-disconnection.cpp
    count: 1
    source: sigslot-1.2.3/test/pmf-disconnection.cpp
    description: "Pointer-to-member disconnection test target"
    command: "ctest -R sigslot-test-pmf-disconnection --output-on-failure"
  - file: test/recursive.cpp
    count: 1
    source: sigslot-1.2.3/test/recursive.cpp
    description: "Recursive signal test target"
    command: "ctest -R sigslot-test-recursive --output-on-failure"
  - file: test/signal-extended.cpp
    count: 1
    source: sigslot-1.2.3/test/signal-extended.cpp
    description: "Extended signal test target"
    command: "ctest -R sigslot-test-signal-extended --output-on-failure"
  - file: test/signal-performance.cpp
    count: 1
    source: sigslot-1.2.3/test/signal-performance.cpp
    description: "Signal performance test target"
    command: "ctest -R sigslot-test-signal-performance --output-on-failure"
  - file: test/signal-pmf.cpp
    count: 1
    source: sigslot-1.2.3/test/signal-pmf.cpp
    description: "Signal pointer-to-member test target"
    command: "ctest -R sigslot-test-signal-pmf --output-on-failure"
  - file: test/signal-threaded.cpp
    count: 1
    source: sigslot-1.2.3/test/signal-threaded.cpp
    description: "Threaded signal test target"
    command: "ctest -R sigslot-test-signal-threaded --output-on-failure"
  - file: test/signal-tracking.cpp
    count: 1
    source: sigslot-1.2.3/test/signal-tracking.cpp
    description: "Signal tracking test target"
    command: "ctest -R sigslot-test-signal-tracking --output-on-failure"
  - file: test/signal.cpp
    count: 1
    source: sigslot-1.2.3/test/signal.cpp
    description: "Basic signal test target"
    command: "ctest -R sigslot-test-signal --output-on-failure"
  - file: test/slots-groups.cpp
    count: 1
    source: sigslot-1.2.3/test/slots-groups.cpp
    description: "Slot group ordering test target"
    command: "ctest -R sigslot-test-slots-groups --output-on-failure"

upstream_tests_skipped:
  - file: test/boost-tracking.cpp
    count: 1
    reason: "Boost::system was not found on the HarmonyOS device, so upstream CMake did not register this optional test."
  - file: test/qt-tracking.cpp
    count: 1
    reason: "Qt5::Core was not found on the HarmonyOS device, so upstream CMake did not register this optional test."

test_package_tests:
  - file: test_package/test_sigslot.cpp
    count: 1
    description: "Consumer signal, connection lifecycle, grouping, chaining and shared-owner tracking checks"
    command: "./sigslot_consumer"

upstream_test_count: 12
test_package_test_count: 1
assertion_count: 16
