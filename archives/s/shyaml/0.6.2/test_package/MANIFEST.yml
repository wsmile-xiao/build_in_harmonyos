software: shyaml
version: "0.6.2"
test_type: "hybrid"

upstream_test:
  source: "https://github.com/0k/shyaml/tree/0.6.2"
  type: "doctest_and_docshtest"
  test_type: "explicit"

upstream_check_command: "python -m doctest shyaml.py && python -m doctest README.rst"
upstream_test_in_build: true
upstream_test_count: 101
executed_upstream_test_count: 37
upstream_tests:
  - file: shyaml.py (Python doctest)
    passed: 33
    failed: 0
    skipped: 0
  - file: README.rst (Python doctest)
    passed: 4
    failed: 0
    skipped: 0
  - file: README.rst (docshtest shell examples; not run because upstream bin/test requires bash)
    passed: 0
    failed: 0
    skipped: 64

adapted_test_count: 42
test_list:
  - installed_cli_exists
  - version_output
  - nested_mapping_lookup
  - sequence_index_lookup
  - scalar_type_lookup

upstream_test_exemption: "The 64 README shell examples were not run: upstream bin/test requires bash arrays, but the OHOS worker has no bash (FileNotFoundError). Both Python doctest suites were run directly (37/37); the installed CLI is verified by test_package."

notes: |
  The official bin/test entry point uses Bash arrays and docshtest for the README shell examples.
  Since the OHOS worker has no bash, build() runs the 33 shyaml.py and 4 README.rst Python doctests
  directly, without invoking the shell test harness. The installed consumer test checks the
  relocatable launcher, exact version, nested mapping, sequence indexing, and YAML scalar type.

assertion_count: 5
