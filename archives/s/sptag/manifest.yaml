software: sptag
display: "SPTAG"
description: "Microsoft Space Partition Tree And Graph library for large-scale vector approximate nearest neighbor search"
category: library
homepage: "https://github.com/microsoft/SPTAG"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Clang 编译器按 GNU 分支处理，保留 Conan 工具链标志"
    - "x86 SIMD 核在 aarch64 上走标量等价实现，数值一致"
    - "Boost 取自 OHOS 适配的 boost1.84 组件包（静态）"
    - "Boost.Test 用 header-only 模式（OHOS 无 unit_test_framework 库）"
    - "ThirdParty/zstd 子模块在 source() 阶段补 vendor"
  common_dependencies:
    - boost1.84-thread
    - boost1.84-serialization
    - boost1.84-wserialization
    - libomp

versions:
  "0.0-git20230612.2ffaec6":
    status: built
    build_date: "2026-10-01"
