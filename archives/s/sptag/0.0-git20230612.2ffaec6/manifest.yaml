software: sptag
version: 0.0-git20230612.2ffaec6
status: built
build_system: cmake
created_at: 2026-10-01
knowledge_gained:
  - CMake 构建系统适配 HarmonyOS (Clang 15 原生构建)
  - 上游仅接受 GCC/MSVC：Clang 走 GNU 分支 (0001)
  - x86 SIMD 内联汇编/内建函数在 aarch64 上用标量等价实现兜底 (0002-0006)
  - Boost 用 OHOS 适配的 boost1.84 组件包静态注入，不走系统 find_package (0001/0007)
  - OHOS 无 unit_test_framework 编译库：上游 Boost.Test 切 header-only 单头模式 (0007)
  - ThirdParty/zstd 是 git submodule：source() 阶段补 vendor zstd 1.5.5
  - 上游无 ctest 注册：build() 直接运行 SPTAGTest 二进制 (sciplot 先例)
  - SSD 索引读路径用 O_DIRECT + Linux 内核 AIO：真机文件系统/内核不支持时
    build() 内 replace_in_file 做失败回退（普通 open + 同步 pread，快速路径优先）
patches_applied:
  - 0001-top-cmake-clang-conan-boost.patch
  - 0002-annservice-x86-only-simd-flags.patch
  - 0003-common-portable-alloc-prefetch.patch
  - 0004-instructionutils-arm-fallback.patch
  - 0005-simdutils-arm-fallback.patch
  - 0006-distanceutils-arm-fallback.patch
  - 0007-test-headeronly-boost.patch
# Thread affinity (musl/OHOS sched_setaffinity) and the AsyncFileIO
# O_DIRECT/AIO fallback are build()-time replace_in_file edits,
# not patch files (see conanfile.py).
configure_options:
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DGPU=OFF"
  - "-DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE"
  - "-DCMAKE_DISABLE_FIND_PACKAGE_Python2=TRUE"
  - "-DCMAKE_DISABLE_FIND_PACKAGE_JNI=TRUE"
  - "-DCMAKE_DISABLE_FIND_PACKAGE_MPI=TRUE"
  - "-DCMAKE_DISABLE_FIND_PACKAGE_CUDA=TRUE"
dependencies:
  - boost1.84/1.84.0
  - boost1.84-thread/1.84.0
  - boost1.84-serialization/1.84.0
  - boost1.84-wserialization/1.84.0
  - zlib/1.3.1.2 # override(boost1.84->zlib/1.3.1 conancenter CMake 不支持 HarmonyOS)
source_url: https://github.com/microsoft/SPTAG/archive/2ffaec67dd97dbb4f4bc5dda568a3f5ce6cab108.tar.gz
openmp_provider: OHOS-SDK-clang--fopenmp
