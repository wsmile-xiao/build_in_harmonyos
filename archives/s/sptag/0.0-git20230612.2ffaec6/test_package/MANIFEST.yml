# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sptag/0.0-git20230612.2ffaec6
homepage: "https://github.com/microsoft/SPTAG"

# 上游测试命令 (上游未注册 ctest，直接运行测试二进制；sciplot 先例)
upstream_check_command: "./Release/SPTAGTest --log_level=test_suite"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./Release/SPTAGTest --log_level=test_suite"

# 上游实际运行的测试程序 (Boost.Test，12 suites / 39 cases，自包含：
# 运行时生成合成数据，无需网络与外部数据集；WinRTTest 仅面向 Windows，
# 非 OHOS/Linux 构建部分)
upstream_tests:
  - file: Test/src/AlgoTest.cpp
    source: SPTAG-2ffaec6/Test/src/AlgoTest.cpp
    description: "KDT/BKT/SPANN 建索引/搜索/增删全流程 (3 cases)"
    command: "./Release/SPTAGTest --run_test=AlgoTest"
  - file: Test/src/DistanceTest.cpp
    source: SPTAG-2ffaec6/Test/src/DistanceTest.cpp
    description: "L2/Cosine 距离 SIMD 与标量一致性 (2 cases)"
    command: "./Release/SPTAGTest --run_test=DistanceTest"
  - file: Test/src/SIMDTest.cpp
    source: SPTAG-2ffaec6/Test/src/SIMDTest.cpp
    description: "SIMD 求和核正确性 (1 case)"
    command: "./Release/SPTAGTest --run_test=SIMDTest"
  - file: Test/src/SSDServingTest.cpp
    source: SPTAG-2ffaec6/Test/src/SSDServingTest.cpp
    description: "SSD 索引服务建索引/搜索 (121 cases: 8 vector-gen + 16 TestHead + 32 BuildHead + 32 BuildSSD + 32 SearchSSD + 1 RUN_FROM_MAP, macro-expanded)"
    command: "./Release/SPTAGTest --run_test=SSDServingTest"
  - file: Test/src/ConcurrentTest.cpp
    source: SPTAG-2ffaec6/Test/src/ConcurrentTest.cpp
    description: "并发读写正确性 (2 cases)"
    command: "./Release/SPTAGTest --run_test=ConcurrentTest"
  - file: Test/src/ReconstructIndexSimilarityTest.cpp
    source: SPTAG-2ffaec6/Test/src/ReconstructIndexSimilarityTest.cpp
    description: "索引重建相似度 (2 cases)"
    command: "./Release/SPTAGTest --run_test=ReconstructIndexSimilarityTest"
  - file: Test/src/PerfTest.cpp
    source: SPTAG-2ffaec6/Test/src/PerfTest.cpp
    description: "建索引/搜索性能冒烟 (2 cases)"
    command: "./Release/SPTAGTest --run_test=PerfTest"
  - file: Test/src/CommonHelperTest.cpp
    source: SPTAG-2ffaec6/Test/src/CommonHelperTest.cpp
    description: "公共工具函数 (5 cases)"
    command: "./Release/SPTAGTest --run_test=CommonHelperTest"
  - file: Test/src/Base64HelperTest.cpp
    source: SPTAG-2ffaec6/Test/src/Base64HelperTest.cpp
    description: "Base64 编解码 (1 case, suite名Base64Test)"
    command: "./Release/SPTAGTest --run_test=Base64Test"
  - file: Test/src/FilterTest.cpp
    source: SPTAG-2ffaec6/Test/src/FilterTest.cpp
    description: "带过滤搜索 (1 case)"
    command: "./Release/SPTAGTest --run_test=FilterTest"
  - file: Test/src/IniReaderTest.cpp
    source: SPTAG-2ffaec6/Test/src/IniReaderTest.cpp
    description: "INI 配置解析 (1 case)"
    command: "./Release/SPTAGTest --run_test=IniReaderTest"
  - file: Test/src/StringConvertTest.cpp
    source: SPTAG-2ffaec6/Test/src/StringConvertTest.cpp
    description: "字符串转换工具 (13 cases)"
    command: "./Release/SPTAGTest --run_test=StringConvertTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sptag.cpp
    description: "消费者冒烟测试: KDT/BKT 建索引/存取/搜索 top-1 自查共 12 个断言"
    command: "./test_sptag"

# 测试断言总数 (test_sptag.cpp 内 check() 调用数)
assertion_count: 12

# ---- HMBS 真机门禁扩展字段 ----
# 上游测试总数：在 commit 2ffaec6 的 Test/src/*.cpp 中逐文件清点
# BOOST_AUTO_TEST_CASE / BOOST_FIXTURE_TEST_CASE 宏 (main.cpp 为 runner，
# 无 case；make_gist_sptag.py 为数据生成脚本，非测试)
upstream_tests_exist: true
upstream_test_total: 154
upstream_test_count_method: "gtest_macros"
upstream_test_count_note: "Expanded count at commit 2ffaec67dd97dbb4f4bc5dda568a3f5ce6cab108 (12 suites): 33 plain BOOST_AUTO_TEST_CASE (Algo 3, Base64 1, Common 5, Concurrent 2, Distance 2, Filter 1, Ini 1, Perf 2, Reconstruct 2, SIMD 1, StringConvert 13) + 121 macro-generated SSDServingTest cases (GVQ 8, TestHead 16, BuildHead 32, BuildSSD 32, SearchSSD 32, RUN_FROM_MAP 1) = 154. Cross-checked against runtime header 'Running 154 test cases...'. Same macro-counting technique as gtest_macros; Boost.Test is the single upstream framework."
