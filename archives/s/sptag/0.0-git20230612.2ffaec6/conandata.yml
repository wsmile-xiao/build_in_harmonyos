patches:
  - patch_file: "patches/0001-top-cmake-clang-conan-boost.patch"
    patch_description: "Accept Clang like GNU, preserve Conan toolchain flags, take Boost from recipe"
    patch_type: "portability"
  - patch_file: "patches/0002-annservice-x86-only-simd-flags.patch"
    patch_description: "Restrict -mavx2/-mavx/-msse/-mavx512 flags to x86 targets"
    patch_type: "portability"
  - patch_file: "patches/0003-common-portable-alloc-prefetch.patch"
    patch_description: "Portable aligned allocation, prefetch and ACCESSPERMS fallback for non-x86"
    patch_type: "portability"
  - patch_file: "patches/0004-instructionutils-arm-fallback.patch"
    patch_description: "Stub x86 cpuid detection on non-x86 (all instruction sets report absent)"
    patch_type: "portability"
  - patch_file: "patches/0005-simdutils-arm-fallback.patch"
    patch_description: "Route SIMD sum kernels to the scalar implementation on non-x86"
    patch_type: "portability"
  - patch_file: "patches/0006-distanceutils-arm-fallback.patch"
    patch_description: "Route SIMD distance kernels to the scalar templates on non-x86"
    patch_type: "portability"
  - patch_file: "patches/0007-test-headeronly-boost.patch"
    patch_description: "Header-only Boost.Test on OHOS (drop unit_test_framework component)"
    patch_type: "portability"
