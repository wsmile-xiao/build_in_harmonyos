build_system: autotools

source:
  url: "https://s48.org/1.9.3/scheme48-1.9.3.tgz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.in.patch"
  - "0002-config.guess.patch"
  - "0003-config.sub.patch"
  - "0004-configure.patch"

patch_classification:
  - file: "0001-Makefile.in.patch"
    type: portability
    platform_only: true
    guard: "#ifdef __OHOS__"
    description: "将硬编码 /tmp/ 路径替换为 $(TMPDIR) 变量（鸿蒙 /tmp 只读）"
  - file: "0002-config.guess.patch"
    type: platform-detection
    platform_only: true
    guard: "#ifdef __OHOS__"
    description: "添加 aarch64:HarmonyOS 平台识别"
  - file: "0003-config.sub.patch"
    type: platform-detection
    platform_only: true
    guard: "#ifdef __OHOS__"
    description: "添加 aarch64 CPU 到识别列表"
  - file: "0004-configure.patch"
    type: platform-compat
    platform_only: true
    guard: "#ifdef __OHOS__"
    description: "将 config.status 的 umask 077 改为 umask 022（HMDFS 兼容）"

knowledge_gained:
  - "config.guess 需要添加 HarmonyOS 平台检测（aarch64:HarmonyOS）"
  - "config.sub 需要添加 aarch64 CPU 类型"
  - "config.status 的 umask 077 与 HMDFS 不兼容，需改为 umask 022"
  - "Makefile 中硬编码的 /tmp/ 在鸿蒙上只读，需替换为 $(TMPDIR)"
  - "所有 ELF 文件（.so 和可执行文件）需要签名才能在鸿蒙上运行"

