# 软件级 manifest — skint
# 文件位置: archives/s/skint/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: skint
display: "SKINT"
description: "可移植、零依赖的 R7RS-small Scheme 解释器：精确 GC、尾递归、call/cc、卫生宏、库系统，另带 100+ SRFI 外置库树"
category: utility
homepage: "https://github.com/false-schemers/skint"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "自包含可移植 C11（5 个 .c），零外部 Conan 依赖；交叉编译只需钉住 CFLAGS。"
    - "s.h 的平台分派在 OHOS clang 上命中 __GNUC__ && __linux 分支（OHOS clang 同时定义 __GNUC__/__linux/__OHOS__），无需源码补丁。"
    - "makefile 会用**构建机** uname 推导 -D NAN_BOXING，并按默认 PREFIX 编入 -DLIBDIR=/usr/local/...；配方在命令行整体覆盖 CFLAGS，避免这两处按构建机取值。"
    - "产物只依赖 musl libc（libm 已并入 libc.so），DT_NEEDED 恰为 [libc.so]。"
    - "外置 SRFI 库树装到 share/skint/lib，通过 runenv_info 注入 SKINT_LIBDIRS 保持可重定位。"
  common_dependencies: []

versions:
  "0.6.8":
    status: built
    build_date: "2026-10-01"
    build_system: makefile
    package_type: application
    path: archives/s/skint/0.6.8
