# test_package/MANIFEST.yml — skint 0.6.8
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。
# 详见 docs/TEST_QUALITY_SPEC.md
#
# 计数口径（唯一口径，贯穿 MANIFEST / notes.md / 本地测试日志 / PR 两张表）：
#   按上游各套件【原生报告】的可判定单元计数。
#   * R7RS 一致性套件 test/test.scm 以 test case 为单元 → 1194
#   * SRFI 外置库套件 test/srfi/*.scm 以 SRFI 模块为单元 → 111
#   （模块内部用例数另列：94 个模块脚本自带计数器合计 19696 个 test case，
#     其余 17 个模块使用自定义计数器，逐个确认退出码 0。两个数字都公开，
#     不存在少报。）

package: skint/0.6.8
homepage: "https://github.com/false-schemers/skint"

# ── 上游测试套件存在性（经审计官方 tar 包确认）──────────────────────
upstream_tests_exist: true
upstream_test_total: 1305
upstream_test_count_method: "suite_native_report_units (1194 R7RS test cases + 111 SRFI modules)"

upstream_test_audit:
  source_tarball: "skint-0.6.8.tar.gz (https://github.com/false-schemers/skint/archive/refs/tags/v0.6.8.tar.gz)"
  source_sha256: "a84416d515252e7fa9c727c94841c1b873c669589a9203360fea85a108513d56"
  upstream_tag: "v0.6.8（pre/t.scm 内 (define *skint-version* \"0.6.8\") 与 tag 逐字一致）"
  build_system: "手写 Makefile（all/test/libtest/install/libinstall）；仓库自带 configure 只写 prefix.mk"
  scanned_for:
    - "tests/ 或 test/ 目录"
    - "Makefile 中的 check / test / libtest / opttest 目标"
    - "第三方测试框架绑定（gtest / criterion / check / CUnit / SRFI-64 runner）"
    - "test_*.scm / *_test.scm 命名的测试源文件"
    - "*.sh / *.spec / corpus / fixture / 期望输出 等候选资产"
  scan_result: >-
    tarball 展开为 skint-0.6.8/。测试资产：test/test.scm（92 KB，R7RS-small
    一致性套件，自带 test/test-end 计数器，默认入口 `make test`）、
    test/srfi/（113 个 .scm：all.scm 官方汇总入口 + 111 个 SRFI 模块用例 +
    本地 harness 副本 test.scm）、test/test-unicode.scm（可选 UNICODE 扩展的
    用例）。Makefile 只把 test 与 libtest 两个目标接到官方入口，没有 check。
  exclusions:
    - file: "test/test-unicode.scm"
      reason: >-
        该套件覆盖可选的 Unicode 扩展（opt/n_unicode.c，需额外 -D UNICODE 编译），
        上游 Makefile 没有对应目标、README 明确声明默认构建
        "no support for Unicode; strings are 8-bit clean"。用默认构建直接执行
        test-unicode.scm 会在 #\λ 处报 invalid token 并以 rc=1 退出（本地未改动
        源码实测），因此不计入默认构建的上游测试计数，也不伪装成鸿蒙特有测试。
      evidence: "默认构建 ./skint test/test-unicode.scm -> rc=1, 'test-unicode.scm:68:9: invalid token'"

upstream_check_command: "./skint test/test.scm && ./skint test/srfi/all.scm"
upstream_test_in_build: true
upstream_test_command: "./skint test/test.scm ; ./skint test/srfi/all.scm"

upstream_tests:
  - file: test/test.scm
    source: skint-0.6.8/test/test.scm
    description: >-
      R7RS-small 一致性套件（`make test`）。自带 *tests-run*/*tests-passed*
      计数器；test-end 只打印 "N out of M passed" 且 **不设置退出码**，配方因此
      解析打印结果并按 passed == run 且 run >= 1194 判定，防静默跳过式假绿。
    command: "./skint test/test.scm"
    assertion_count: 1194
  - file: test/srfi/all.scm
    source: skint-0.6.8/test/srfi/all.scm
    description: >-
      SRFI 外置库套件官方汇总入口（`make libtest`）：用 %system 逐个执行
      test/srfi/<N>.scm，汇总 "SRFIs TESTED" / "CUMULATIVE FAILURES"，
      退出码 = 失败数。模块内部 94 个脚本自带计数器，合计 19696 个 test case。
    command: "./skint test/srfi/all.scm"
    assertion_count: 111

# ── test_package 自带的功能测试（消费者视角）─────────────────────────
test_package_tests:
  - file: functional_test.py
    description: >-
      功能 21 项（F1-F21），覆盖上游文档化的解释器表面：
      F1 -V 输出 SRFI-176 版本横幅且含 0.6.8；F2 -h 列出选项；
      F3 -e 求值算术；F4 -e 数据字面量（数/串/符号/浮点）；
      F5 -s 脚本模式；F6 -l 载入后继续求值；F7 R7RS 基础（loop/let/map）；
      F8 数值（quotient/remainder/floor/expt/number->string）；
      F9 字符串与字符；F10 向量与字节向量；F11 20 万次尾递归；
      F12 call/cc 逃逸；F13 values/call-with-values；F14 dynamic-wind 顺序；
      F15 文件端口往返（file-exists?/delete-file/write/read）；
      F16 (error ...) 报告并 rc!=0；F17 (exit 5) 传回退出码；
      F18 -p R7RS 程序模式（自行 import）；F19 stdin REPL；
      F20 (features) 含 r7rs；F21 define-record-type 记录类型。
    command: "python3 functional_test.py --binary <pkg>/bin/skint --libdir <pkg>/share/skint/lib"
    assertion_count: 21

# ── 鸿蒙特有测试（rule12: N >= 1，本包 N = 8）──────────────────────
harmonyos_specific_tests:
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A1: 产物为 ELF64 小端且 e_machine == EM_AARCH64(183)，
      即 HarmonyOS PC arm64 目标（aarch64-linux-ohos 交叉三元组生效）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/skint"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A2: .interp == /lib/ld-musl-aarch64.so.1，即鸿蒙 musl 动态
      加载器；glibc 产物会写成 /lib/ld-linux-aarch64.so.1，故该断言可区分
      工具链/sysroot 是否真的指向 OHOS。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/skint"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A3: DT_NEEDED 恰为 [libc.so]。skint 链接 -lm，而 OHOS musl
      sysroot 把 libm 并入 libc.so，所以产物只记录 libc.so；任何 aarch64
      glibc 构建都会多出 libm.so.6 —— 该断言把鸿蒙的 musl libc 布局固化。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/skint"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A4: .dynamic 中不存在 DT_RPATH/DT_RUNPATH。OHOS 包会被装到
      版本化前缀并从 conan 缓存搬移，构建期 RPATH 会让加载器去找只存在于
      构建机的目录；产物必须依赖 OHOS 系统搜索路径。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/skint"
    assertion_count: 1
  - file: functional_test.py
    description: >-
      鸿蒙特有 H1: 子进程创建路径。skint 的 %system 走 musl system() →
      fork + exec /bin/sh，本项在真机上执行
      `(exit (%system "echo skint-ohos-ok > <file>"))`，断言退出码为 0 且
      文件内容确实由 /bin/sh 写出 —— 证明鸿蒙上的 system()/bin/sh 链可用
      （这是 skint 的 SRFI 汇总入口 all.scm 逐个跑子进程所依赖的能力）。
    command: "python3 functional_test.py --binary <pkg>/bin/skint --libdir <pkg>/share/skint/lib"
    assertion_count: 1
  - file: functional_test.py
    description: >-
      鸿蒙特有 H2: 鸿蒙应用沙箱 / HMDFS 上的文件往返。断言 call-with-output-file
      写入、call-with-input-file + read-line 读回、delete-file 后
      file-exists? 变 #f 全部成立。
    command: "python3 functional_test.py --binary <pkg>/bin/skint --libdir <pkg>/share/skint/lib"
    assertion_count: 1
  - file: functional_test.py
    description: >-
      鸿蒙特有 H3: 真实安装产物的 argv。以 -s 脚本 alpha beta 运行，
      断言 (command-line) 返回真实脚本路径与实参（SRFI-22/R7RS 语义依赖
      argv 边界正确，这是鸿蒙安装前缀下的实际调用形态）。
    command: "python3 functional_test.py --binary <pkg>/bin/skint --libdir <pkg>/share/skint/lib"
    assertion_count: 1
  - file: functional_test.py
    description: >-
      鸿蒙特有 H4: 外置 SRFI 库树从**打包前缀**解析。在一个空目录里只设置
      SKINT_LIBDIRS=<pkg>/share/skint/lib，断言 (import (srfi 1)) 成功并能
      调用 fold/delete-duplicates —— 证明打包布局与鸿蒙上的路径解析正确，
      而不是靠构建目录里的 ./lib 偶然命中。
    command: "python3 functional_test.py --binary <pkg>/bin/skint --libdir <pkg>/share/skint/lib"
    assertion_count: 1

# 测试断言总数（独立检查项：功能 F1-F21 = 21 + 鸿蒙特有 A1-A4/H1-H4 = 8）
assertion_count: 29
test_package_test_count: 25
harmonyos_specific_test_count: 8
count_method: "independent_check_items"
