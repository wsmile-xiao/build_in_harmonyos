# conandata.yml — skint 0.6.8
#
# 上游：false-schemers/skint（R7RS Scheme 解释器，可移植 C11，零外部依赖）
#   https://github.com/false-schemers/skint/archive/refs/tags/v0.6.8.tar.gz
#   sha256 = a84416d515252e7fa9c727c94841c1b873c669589a9203360fea85a108513d56
#   本地真实 GET 下载校验：tarball 展开为 skint-0.6.8/，含 5 个 .c（s.c k.c i.c
#   n.c t.c）+ 5 个头文件、pre/ 的 Scheme 源与生成工具、lib/ 的 SRFI 外置库树、
#   test/ 两套测试套件、doc/skint.1.in、手写 Makefile 与一个 8 行的 configure。
#   v0.6.8 是上游官方 tag，pre/t.scm 内 (define *skint-version* "0.6.8") 与 tag
#   逐字一致，不是 Debian 等打包器的重发行产物（R39/PF7）。
#
# 注意（R39/PF7）：此处只写官方源，不手写镜像前缀。ci/conan/build_and_test.sh
#   会在运行时自动加镜像回退；写进版本库反而会被 create-pr 的 PF7 源URL闸判为违规。
#
# 补丁：无。skint 是自包含可移植 C11 程序，OHOS aarch64 交叉编译零报错：
#   s.h 的平台分派链在 OHOS clang 上命中 __GNUC__ && __linux 分支（OHOS clang
#   同时定义 __GNUC__、__linux、__OHOS__），不会落到 #error 兜底；产物只依赖
#   musl libc（libm 已并入 libc.so）。详见 notes.md 的适配结论。

