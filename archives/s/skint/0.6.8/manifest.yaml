# 版本级 manifest — skint 0.6.8
# 遵循 ARCHIVE-SPEC v3.0

version: "0.6.8"
software: "skint"
status: built
build_date: "2026-10-01"
build_system: makefile

source:
  url: "https://github.com/false-schemers/skint/archive/refs/tags/v0.6.8.tar.gz"
  sha256: "a84416d515252e7fa9c727c94841c1b873c669589a9203360fea85a108513d56"
  tar_format: tar.gz

build:
  system: makefile
  # 上游 makefile 用命令行变量注入；CFLAGS 整体覆盖，禁用构建机 uname 嗅探
  # （-D NAN_BOXING）与默认 PREFIX 产生的 -DLIBDIR=/usr/local/...。
  build_command: "make -C <src> -j1 CC=<conf cc> CFLAGS=\"-O2 -DNDEBUG\" ./skint"
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

package:
  type: application
  bindirs: ["bin"]
  contents:
    - "bin/skint"
    - "share/skint/lib/**"
    - "share/man/man1/skint.1"
    - "licenses/LICENSE"
  runenv:
    - "SKINT_LIBDIRS=<prefix>/share/skint/lib"

patches_applied: []

upstream_tests:
  total: 1305
  count_method: "suite_native_report_units (1194 R7RS test cases + 111 SRFI modules)"
  r7rs_conformance: "1194/1194（test/test.scm 原生报告）"
  srfi_external_libs: "111 模块 / CUMULATIVE FAILURES 0（test/srfi/all.scm 原生报告）"
  srfi_inner_cases: "19696（94 个模块脚本自带计数器合计，另 17 个模块用自定义计数器）"

knowledge_gained:
  - "OHOS clang（aarch64-linux-ohos）同时定义 __GNUC__、__linux、__OHOS__，因此 s.h 这类按 __GNUC__ && __linux 分派的平台链在鸿蒙上天然命中 Linux/Unix 分支，不需要源码补丁或平台宏（R33 相关：构建参数才是适配面）。 # ref: notes.md / manifest.yaml ohos_adaptation"
  - "手写 makefile 若用 $(shell uname -m) 推导架构 CFLAGS（如 -D NAN_BOXING），交叉编译时会把构建机的架构决策带进目标产物；同一 makefile 又用默认 PREFIX 把 /usr/local 绝对路径编成 -DLIBDIR 时，包还不可重定位。用 make 命令行整体覆盖 CFLAGS 可一次消除两类不可复现。 # knowledge_ref: knowledge/drafts/DRAFT-skint-0.6.8-raw-makefile-host-arch-cflags-pin.kv（.kv + .md 配对）"
  - "上游测试 harness 只把失败统计打印到 stdout、不在 test-end 设置退出码时（skint test/test.scm 实测：故意改错一处期望值后仍 rc=0，末行 1192 out of 1194 passed），门禁必须解析汇总行并要求 passed==run 且 run>=上游基线（防部分失败与静默少跑两类假绿）。 # knowledge_ref: knowledge/drafts/DRAFT-skint-0.6.8-summary-only-test-harness-false-green.kv（.kv + .md 配对）"
  - "OHOS musl sysroot 没有 libm.so（只有 88 字节空壳 libm.a），libm 符号由 libc.so 提供：链接 -lm 的产物 DT_NEEDED 恰为 [libc.so]。按 glibc 习惯断言 libm.so/libm.so.6 会假失败；反过来该结果可作为“确实用 OHOS musl sysroot 构建”的可执行判据。 # knowledge_ref: knowledge/drafts/DRAFT-skint-0.6.8-musl-libm-folded-into-libc.kv（.kv + .md 配对）"
