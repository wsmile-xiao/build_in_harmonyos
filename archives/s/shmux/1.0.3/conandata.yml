# conandata.yml — shmux 1.0.3

sources:
  url:
    - "https://gh-proxy.com/https://github.com/shmux/shmux/archive/refs/tags/v1.0.3.tar.gz"
    - "https://github.com/shmux/shmux/archive/refs/tags/v1.0.3.tar.gz"
  sha256: "c9f8863e2550e23e633cf5fc7a9c4c52d287059f424ef78aba6ecd98390fb9ab"

patches:
  - patch_file: "patches/0001-tests-timers-export-shmux-sh.patch"
    patch_description: "tests/timers.sh: export SHMUX_SH=/data/service/hnp/bin/bash so only this suite's timed targets run on a shell that dies on SIGALRM (OHOS /bin/sh=hishell swallows it and false-passes -C timeouts); scoped to timers.sh so the other suites keep the upstream default runner -- running lnregex/regex targets on hnp bash correlates with a flaky shmux SIGSEGV (0/13 suites on hishell vs ~6/14 on bash, same device); 6 lines added, no test case or assertion touched"
    patch_type: "portability"
    sha256: "fdbdf1ee6f5f4e34ed469ea8c0b3609da625158b9323282373896fcbab775eb0"
  - patch_file: "patches/0002-tests-run-analyzer-shebang-hnp-bash.patch"
    patch_description: "tests/run: point the analyzer script shebang at /data/service/hnp/bin/bash so the -A 2s analyzer timeout (child alarm before execvp) is not swallowed by hishell /bin/sh, which continues after SIGALRM and exits normally so 'Analyzer for N timed out' never fires; one line changed, no test case or assertion touched"
    patch_type: "portability"
    sha256: "ff4c4a56cd0b59d10b11f8fe9a1f1f8fbd2773a63b6fc54ccf55a82244992a9b"
  - patch_file: "patches/0003-analyzer-include-pcreposix.patch"
    patch_description: "analyzer.c: include pcreposix.h instead of the system regex.h so regcomp/regexec/regerror constants and compile-flag bit values match the linked libpcreposix (the conan pcre package injects -lpcreposix ahead of libc, so pcreposix provides the POSIX regex symbols): system regex.h has REG_NOMATCH=1/REG_EXTENDED=1/REG_NEWLINE=4/REG_NOSUB=8 while pcreposix uses REG_NOMATCH=17/REG_EXTENDED=0/REG_NEWLINE=0x0002/REG_NOSUB=0x0020, so every no-match was misread as a fatal error and every compile flag was reinterpreted; one line changed"
    patch_type: "portability"
    sha256: "3bf1e7d3f17101355dcc3ef4745030f642d22838cce0773f13b17a7dd363bcb7"
