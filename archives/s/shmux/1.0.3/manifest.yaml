# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.3"

# 软件名
software: "shmux"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/shmux/shmux/archive/refs/tags/v1.0.3.tar.gz"

  # 源码校验和
  sha256: "c9f8863e2550e23e633cf5fc7a9c4c52d287059f424ef78aba6ecd98390fb9ab"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "ncurses/6.4"
    - "pcre/8.45"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-tests-timers-export-shmux-sh.patch"
  - "0002-tests-run-analyzer-shebang-hnp-bash.patch"
  - "0003-analyzer-include-pcreposix.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "老版(≤2016) config.guess 分支用 echo+exit 习语，套新版 GUESS= 补丁块会命中不输出静默落 fallback（本 PR 承载的 B 草稿）"
  - "OHOS /bin/sh=hishell 吞 SIGALRM 致上游计时测试假通过；SHMUX_SH 指 hnp bash 修复，且须作用域到 timers.sh（analyzer 组 targets 跑 bash 会偶发 shmux SIGSEGV）"
  - "conan 注入 -lpcreposix 抢在 libc 前时，analyzer.c 必须 include pcreposix.h（系统 regex.h 的 REG_NOMATCH/标志位整套错配）"
