# test_package/MANIFEST.yml — shmux 1.0.3
#
# 上游测试清点证据（R51 上游测试三步法）：
#   - 上游手写 Makefile.in 注册 `test:` 目标：@(cd tests && ./runall)；
#   - tests/runall 按 `#- N` 序号收集本目录 *.sh，共 7 个 shell 测试组
#     （gccbug=1 / mixed=2 / exitcode=3 / timers=4 / lnregex=5 / regex=6 /
#     run=7）；runall 语义为「exit 77 = ok，否则 failed」，无 automake
#     check_PROGRAMS；组内按各 .sh 的 printf ok/N 逐项清点，
#     **原子断言 N_static = 17**（exitcode 3 + gccbug 1 + lnregex 3 + mixed 2 +
#     regex 6 + run 1 + timers 1；组数 N_registered = 7，全部可执行，
#     tag 源码逐项复核见 notes.md 五维账本）；
#   - 全部用例经 sh: 方法（本地 shell）驱动构建出的 src/shmux，无需网络；
#     exitcode/timers 含 sleep 与信号 trap，为时长敏感型功能测试；
#   - 设备实测（OHOS aarch64 原生，conan create 内 make test）：
#     原子断言 17/17 全 ok、runall 无 "Failed ... set(s)" 输出（详见 notes.md 与
#     conan-create.log）。

package: shmux/1.0.3
homepage: "https://github.com/shmux/shmux"

upstream_check_command: "make test"
upstream_check_command_note: "手写 Makefile.in test: 目标（cd tests && ./runall）；runall 以 exit 77=PASS 的反向语义汇报；配方注入 TERM=xterm 与 TERMINFO（ncurses 包自带数据库，term.c 运行时 tgetent 必需）"

upstream_test_in_build: true
upstream_test_command: "make test（配方 build() 内，TERM/TERMINFO 注入）"

upstream_tests:
  - file: tests/gccbug.sh
    source: "shmux-1.0.3/tests（#- 1）"
    description: "批量目标变量展开：向 1 个本地目标 echo $SHMUX_TARGET 并断言裸输出（历史 gcc3 优化 bug 回归）"
    command: "make test"
  - file: tests/mixed.sh
    source: "shmux-1.0.3/tests（#- 2）"
    description: "混合目标列表会话：多目标输出与错误分析器混合场景"
    command: "make test"
  - file: tests/exitcode.sh
    source: "shmux-1.0.3/tests（#- 3）"
    description: "退出码/输出/错误三通道 run 分析器：10 个子目标逐个与 tests/exitcode/{N.exit,N.stdout,N.stderr} 基线比对"
    command: "make test"
  - file: tests/timers.sh
    source: "shmux-1.0.3/tests（#- 4）"
    description: "超时机制：4 目标不同 sleep/信号 trap 组合，断言 timeout/error 分类汇总"
    command: "make test"
  - file: tests/lnregex.sh
    source: "shmux-1.0.3/tests（#- 5）"
    description: "lnregex 分析器（pcre 行正则）：输出匹配基线 lnregex.out/lnregex.err"
    command: "make test"
  - file: tests/regex.sh
    source: "shmux-1.0.3/tests（#- 6）"
    description: "regex 分析器（pcre 正则）：输出匹配基线 regex.out/regex.err"
    command: "make test"
  - file: tests/run.sh
    source: "shmux-1.0.3/tests（#- 7）"
    description: "run 分析器 + ./run 外部脚本：3 目标（正常/分析报错/超时）汇总断言"
    command: "make test"

test_package_tests:
  - file: test_shmux.sh
    description: "消费者测试：以工具使用者身份执行包内 shmux，断言 ①3 目标并行 echo 往返输出 ②Summary 计数（2 targets processed）③目标 exit 7 传播为 'exited with status 7' 报告"
    command: "sh test_shmux.sh <bindir> <ncurses-package-root> <tmpdir>"

assertion_count: 3
