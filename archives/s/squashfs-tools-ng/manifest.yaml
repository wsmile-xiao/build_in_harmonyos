software: squashfs-tools-ng
display: "squashfs-tools-ng"
description: "New generation SquashFS tools and libsquashfs library with multi-compressor support"
category: system
homepage: "https://github.com/AgentD/squashfs-tools-ng"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub archive tarball lacks pre-generated configure; autoreconf -fi required"
    - "ACLOCAL_PATH must include libtool's and pkg-config's m4 macros"
    - "PKG_CHECK_MODULES bypassed by pre-setting CFLAGS/LIBS env vars"
    - "HMFS umask 077 issue: mktemp wrapper + config.status tmpdir fix"
    - "All compressors enabled: gzip, xz, lz4, zstd, bzip2, lzo"
  common_dependencies:
    - zlib
    - xz
    - lz4
    - zstd
    - bzip2
    - lzo2
    - readline

versions:
  "1.3.2":
    status: built
    build_date: "2026-09-18"
