software: squashfs-tools-ng
version: "1.3.2"
status: built
build_date: "2026-06-05"

source:
  url: "https://github.com/AgentD/squashfs-tools-ng/archive/refs/tags/v1.3.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-maintainer-mode"
  dependencies:
    - zlib/1.3.1
    - lz4/1.10.0
    - xz/5.6.2
    - zstd/1.5.6
    - bzip2/1.0.8
    - lzo2/2.10
    - readline/8.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-umask-for-hmfs-compatibility.patch"

knowledge_gained:
  - "squashfs-tools-ng需要先运行autoreconf生成configure脚本（原始tarball不含configure）"
  - "autoreconf需要设置ACLOCAL_PATH包含pkg-config的pkg.m4路径"
  - "HMFS文件系统会继承父目录的owner UID，导致autoconf的umask 077创建的临时目录不可访问，需改为umask 007"
  - "需要使用--disable-maintainer-mode防止make重新运行autotools链（会覆盖configure的umask补丁）"