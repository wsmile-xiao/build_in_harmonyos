software: squashfs-tools-ng
version: "1.3.2"
status: built
build_date: "2026-09-18"
build_system: autotools

source:
  url: "https://github.com/AgentD/squashfs-tools-ng/archive/refs/tags/v1.3.2.tar.gz"
  sha256: "21f40dc82f69b721e92bfc539e47bfb8581753f8de492c877c59737ce2e3bf0f"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--disable-maintainer-mode"
    - "--disable-shared"
  dependencies:
    - zlib/1.3.1
    - lz4/1.10.0
    - xz/5.6.2
    - zstd/1.5.7.1
    - bzip2/1.0.8
    - lzo2/2.10
    - readline/8.3
    - ncurses/6.6
  tool_requires:
    - automake/1.18
    - libtool/2.5.4.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GitHub archive tarball lacks pre-generated configure; autoreconf -fi required"
  - "ACLOCAL_PATH must include libtool's share/aclocal and pkg-config's pkg.m4 (probe via pkg-config on PATH, fall back to hnp path)"
  - "PKG_CHECK_MODULES bypassed by pre-setting <DEP>_CFLAGS/<DEP>_LIBS env vars (conan deps don't ship .pc files)"
  - "HMFS umask 077 issue: mktemp wrapper forces mkdir fallback; config.status tmpdir replaced with writable path"
  - "All compressors enabled: gzip, xz, lz4, zstd, bzip2, lzo"
  - "Static linking (--disable-shared) required: conan deps built without -fPIC, shared lib linking fails"
  - "ncurses/6.6 required as direct dependency: readline links against ncursesw (terminfo: tgetstr, tgetflag)"
  - "gensquashfs uses -D for pack-dir and positional output file; rdsquashfs uses -u/-p for unpack"
  - "zstd must be linked statically (absolute path to libzstd.a from zstd/1.5.7.1): shipping tools with NEEDED libzstd.so.1 breaks direct execution outside conanrun (L2 smoke test exit 127); zstd/1.5.6 and 1.5.7 ship only shared libs"
