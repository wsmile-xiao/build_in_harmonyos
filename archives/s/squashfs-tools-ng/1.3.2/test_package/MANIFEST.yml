# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: squashfs-tools-ng/1.3.2
homepage: "https://github.com/AgentD/squashfs-tools-ng"

# 上游测试命令 (squashfs-tools-ng has make check with comprehensive tests)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - name: "squashfs-tools-ng test suite"
    description: "Comprehensive tests under tests/ directory (create/extract/compare)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: --version for all 5 tools + gensquashfs/rdsquashfs round-trip + tar2sqfs/sqfs2tar interop + sqfsdiff"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
