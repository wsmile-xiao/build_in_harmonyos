# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 说明: siril 上游单元测试位于 src/tests/，由 tests/upstream_tests.sh
#       在 conanfile.py 的 build() 中真实编译并运行（autotools 构建无法
#       直接跑 meson test，按上游 build.sh 方式手工驱动，见该脚本头部）。

package: siril/1.2.3
homepage: "https://gitlab.com/free-astro/siril"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# autotools 构建无 make check 目标；上游测试以 meson 方式声明，本配方
# 用 tests/upstream_tests.sh 复刻 build.sh 的编译+运行流程。
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "bash tests/upstream_tests.sh"

# 上游实际运行的测试程序（11 项全部真实编译并运行；结果写入
# $build_folder/upstream-tests/upstream_test_result.json 并以
# HMBS_UPSTREAM_TEST_RESULT 标记输出到构建日志）
upstream_tests:
  - file: compare_fits
    source: siril-1.2.3/src/tests/compare_fits.c
    description: "FITS 文件比较（本机生成两份最小 FITS 实参实跑）"
    command: "./compare_fits a.fit b.fit"
  - file: imoper_test
    source: siril-1.2.3/src/tests/imoper_test.c
    description: "图像算子单元测试（Criterion）"
    command: "./imoper_test"
  - file: measure_sorting
    source: siril-1.2.3/src/tests/measure_sorting.c
    description: "排序性能测量（非 Criterion，自带 main）"
    command: "./measure_sorting"
  - file: photometry_test
    source: siril-1.2.3/src/tests/photometry_test.c
    description: "测光单元测试（Criterion）"
    command: "./photometry_test"
  - file: rejection_test
    source: siril-1.2.3/src/tests/rejection_test.c
    description: "像素拒绝算法单元测试（Criterion）"
    command: "./rejection_test"
  - file: ser_test
    source: siril-1.2.3/src/tests/ser_test.c
    description: "SER 视频读写测试（临时文件路径重定向到可写目录）"
    command: "./ser_test"
  - file: siril_date_test
    source: siril-1.2.3/src/tests/siril_date_test.c
    description: "日期转换单元测试"
    command: "./siril_date_test"
  - file: siril_world_cs_test
    source: siril-1.2.3/src/tests/siril_world_cs_test.c
    description: "世界坐标系统单元测试"
    command: "./siril_world_cs_test"
  - file: soper_test
    source: siril-1.2.3/src/tests/soper_test.c
    description: "Sobel 算子单元测试（Criterion）"
    command: "./soper_test"
  - file: sorting
    source: siril-1.2.3/src/tests/sorting.c
    description: "排序算法单元测试（Criterion）"
    command: "./sorting"
  - file: stacking_blocks_test
    source: siril-1.2.3/src/tests/stacking_blocks_test.c
    description: "堆叠分块单元测试"
    command: "./stacking_blocks_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试（真实执行 siril-cli --version 并断言 rc=0 与输出含 'siril 1.2.3'，R34 非空壳）+ 上游测试结果标记重发"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 120
