knowledge_gained:
  - "librtprocess submodule is empty in release tarball; made optional via HAVE_LIBRTPROCESS"
  - "intltool not available on OHOS; replaced with direct msgfmt-based po handling"
  - "config.status umask 077 causes setgid permission issues on OHOS; patched to 022"
  - "OPENCV_LIBS was hardcoded; now uses pkg-config --libs opencv4"
  - "Added LIBHEIF/LIBRAW/EXIV2 CFLAGS to AM_CPPFLAGS (missing upstream)"
  - "Added -lintl for glib's proxy gettext functions"
  - "gio-unix-2.0.pc generated manually (conan glib doesn't provide it separately)"
  - "aclocal 1.17 broken on build host; aclocal-1.16 wrapper used"
  - "htmesh 内置 cmake 子构建在 autoconf cross 标签下被 AC_MSG_ERROR 拦截；补丁放开 cross 分支走内置 cmake（纯静态库，无运行时探测）"
  - "OHOS glib 上 GApplication 的 GOptionEntry ARG_CALLBACK 内 exit() 死锁；main-cli.c 提前手工处理 --version/--copyright/--format 规避"
  - "autotools configure 必须以 cross 语义运行（--build/--host 显式给定），跳过 conftest 执行（HMDFS 下依赖 .so 不在加载器路径）"

