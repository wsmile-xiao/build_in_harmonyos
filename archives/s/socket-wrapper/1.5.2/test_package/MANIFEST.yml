# test_package/MANIFEST.yml
# Test declaration for Conan L1 consumer smoke test.

package: socket-wrapper/1.5.2
homepage: "https://gitlab.com/cwrap/socket_wrapper"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_mode: "required by the default with_upstream_tests=True option"
upstream_test_command: "conan create archives/s/socket-wrapper/1.5.2"

upstream_tests:
  - file: "tests"
    source: "socket_wrapper-socket_wrapper-1.5.2/tests"
    description: "CTest/cmocka suite covering socket/bind/connect/listen/accept, TCP echo, UDP echo, msg variants, fcntl/dup/ioctl interception, threads, fork, syscalls, and the noop library"
    command: "ctest --output-on-failure --verbose -j1"
    cases: 32
    status: "passed (29/32; 3 failures are OHOS platform limits, see notes.md)"
    result: "29 passed, 3 failed out of 32 registered CTest entries; test_ioctl fails because the OHOS kernel returns EACCES for ioctl(SIOCGPGRP) on a plain socket, test_fcntl fails because OHOS allocates the first free fd above 107 so F_DUPFD(100) cannot return 100, test_python_concurrency_reproducer fails because OHOS has no /usr/bin/echo and a read-only /tmp"
    evidence: "local exploratory build with cmocka/2.0.2 from the ohpcd remote; logs quoted in notes.md"

test_package_tests:
  - file: test_socket_wrapper.c
    description: "Consumer test: LD_PRELOAD libsocket_wrapper, bind 127.0.0.1:21777, connect, send/recv, verify AF_UNIX socket file appears in SOCKET_WRAPPER_DIR and the accept peer is presented as AF_INET 127.0.0.1"
    command: "./test_socket_wrapper"

assertion_count: 9
