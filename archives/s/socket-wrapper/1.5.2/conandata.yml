sources:
  "1.5.2":
    url: "https://gitlab.com/cwrap/socket_wrapper/-/archive/socket_wrapper-1.5.2/socket_wrapper-socket_wrapper-1.5.2.tar.gz"
    sha256: "f03d8933457d13d69fa0aebc946685e904186bd81513b154a6de06d806f40387"
requirements:
  cmocka: "cmocka/2.0.2"
patches:
  - patch_file: "patches/0001-src-socket_wrapper.c.patch"
    patch_description: "Add musl/OHOS variants for recvmmsg/sendmmsg signatures and undef LFS64 macro aliases before interposed fopen64/open64/openat64 definitions"
    patch_type: "portability"
  - patch_file: "patches/0002-ConfigureChecks.cmake.patch"
    patch_description: "Detect musl/OHOS recvmmsg/sendmmsg prototypes with unsigned int flags via check_prototype_definition"
    patch_type: "portability"
  - patch_file: "patches/0003-config.h.cmake.patch"
    patch_description: "Declare the new HAVE_RECVMMSG_UNSIGNED_FLAGS and HAVE_SENDMMSG_UNSIGNED_FLAGS config knobs"
    patch_type: "portability"
  - patch_file: "patches/0004-tests-torture.c.patch"
    patch_description: "Honor TMPDIR for the socket wrapper test directory because OHOS mounts /tmp read-only"
    patch_type: "portability"
  - patch_file: "patches/0005-tests-test_ioctl.c.patch"
    patch_description: "Honor TMPDIR in the test_ioctl setup so mkdtemp works on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0006-tests-test_fcntl_lock.c.patch"
    patch_description: "Honor TMPDIR in the test_fcntl_lock setup so mkdtemp works on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0007-tests-test_echo_tcp_get_peer_sock_name.c.patch"
    patch_description: "Use _assert_uint_in_range when building against cmocka 2.x even if the check_library_exists probe missed the imported-target symbols"
    patch_type: "portability"
  - patch_file: "patches/0008-tests-CMakeLists.txt.patch"
    patch_description: "Do not register test_ioctl/test_fcntl/test_python_concurrency_reproducer on OHOS because of kernel ioctl(SIOCGPGRP) EACCES, fd allocation layout above 107, and the missing /usr/bin/echo with read-only /tmp"
    patch_type: "portability"
