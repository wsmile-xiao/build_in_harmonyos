software: socket-wrapper
version: "1.5.2"
status: built
build_system: cmake
build_date: "2026-09-02"

source:
  url: "https://gitlab.com/cwrap/socket_wrapper/-/archive/socket_wrapper-1.5.2/socket_wrapper-socket_wrapper-1.5.2.tar.gz"
  sha256: "f03d8933457d13d69fa0aebc946685e904186bd81513b154a6de06d806f40387"
  tar_format: tar.gz

build:
  system: cmake
  options:
    - "with_upstream_tests=True by default enables UNIT_TESTING=ON, test-requires cmocka/2.0.2 and runs ctest"
    - "with_upstream_tests=False disables the upstream suite for non-runnable cross-builds"

dependencies: []
test_dependencies:
  - "cmocka/2.0.2 as a Conan test requirement when with_upstream_tests=True"

patches:
  - "0001-src-socket_wrapper.c.patch"
  - "0002-ConfigureChecks.cmake.patch"
  - "0003-config.h.cmake.patch"
  - "0004-tests-torture.c.patch"
  - "0005-tests-test_ioctl.c.patch"
  - "0006-tests-test_fcntl_lock.c.patch"
  - "0007-tests-test_echo_tcp_get_peer_sock_name.c.patch"
  - "0008-tests-CMakeLists.txt.patch"

platform_requirements:
  - "POSIX dynamic loader with LD_PRELOAD support"
  - "A writable directory for SOCKET_WRAPPER_DIR; OHOS /tmp is read-only so the recipe points the suite at a build-tree runtime dir"
  - "OHOS ELF signing tools (llvm-objcopy, binary-sign-tool) to sign build-tree tests and packaged .so files"

knowledge_used:
  - "E002: /tmp is read-only on OHOS; tests honor TMPDIR"
  - "E077: re-sign target ELF files after removing stale .codesign sections"

knowledge_gained:
  - "musl/OHOS maps fopen64/open64/openat64 to plain fopen/open/openat via macros under _GNU_SOURCE; interposed definitions need #undef first"
  - "musl/OHOS declares recvmmsg/sendmmsg with unsigned int flags, which needs a dedicated prototype-detection branch next to the glibc/FreeBSD ones"
  - "AF_UNIX bind works on the OHOS el2/base/temp filesystem but is denied (EPERM) on the HMDFS /storage share, so SOCKET_WRAPPER_DIR must live on a native filesystem"
  - "upstream check_library_exists() probes cannot see symbols when CMOCKA_LIBRARY is an imported target (cmocka::cmocka from Conan CMakeDeps); the cmocka_version.h header must be consulted instead"
knowledge_drafts:
  - "knowledge/drafts/DRAFT-socket-wrapper-musl-lfs64-mmsg-ohos.kv"

verification:
  local:
    - "Downloaded official gitlab archive tarball and computed sha256"
    - "Exploratory cmake configure+build with the OHOS clang toolchain passed after the portability patches"
    - "Exploratory consumer run: LD_PRELOAD libsocket_wrapper.so, bind 127.0.0.1:21777, connect, send/recv payload verified, T-file created in SOCKET_WRAPPER_DIR"
    - "conan list and conan download confirmed cmocka/2.0.2 in the ohpcd remote; conan install resolved the OHOS binary"
  upstream_tests:
    result: "29 passed, 3 failed out of 32 registered CTest entries"
    command: "conan create archives/s/socket-wrapper/1.5.2"
    cmocka_dependency_status: "resolved: cmocka/2.0.2 from the ohpcd remote satisfies find_package(cmocka 1.1.0 REQUIRED)"
    failures:
      - "test_ioctl: OHOS kernel returns EACCES for ioctl(SIOCGPGRP) even on an un-interposed socket (verified with a plain C probe, errno=13)"
      - "test_fcntl: F_DUPFD(100) cannot return 100 because OHOS allocates the first free fd above 107 (fd table layout difference)"
      - "test_python_concurrency_reproducer: OHOS image has no /usr/bin/echo and /tmp is read-only"
  conan_create:
    result: pass
    profile: "ohos-aarch64"
    options: "with_upstream_tests=True (default)"

next_commands:
  real_device_or_shadow_ci:
    - "CI_PACKAGES=\"archives/s/socket-wrapper/1.5.2\" zsh ci/conan/build_and_test.sh"
    - "conan create archives/s/socket-wrapper/1.5.2"
