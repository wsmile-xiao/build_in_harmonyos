software: socket-wrapper
display: "socket-wrapper"
description: "A library passing all BSD sockets API calls through a Unix socket (cwrap LD_PRELOAD interposition for socket/bind/connect testing)"
category: system
homepage: "https://gitlab.com/cwrap/socket_wrapper"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "musl LFS64 macro aliases (fopen64/open64/openat64) must be undefined before the interposed definitions"
    - "musl recvmmsg/sendmmsg prototypes use unsigned int flags; detected via check_prototype_definition"
    - "Runtime behavior depends on LD_PRELOAD interposition; SOCKET_WRAPPER_DIR must live on a native filesystem (AF_UNIX bind is denied on HMDFS /storage)"
    - "OHOS /tmp is read-only; tests honor TMPDIR"
    - "socket-wrapper/1.4.1 consumes cmocka 2.x through its Conan CMake CONFIG target and supports a relocated test echo server"
    - "Packaged shared objects and target test executables are re-signed after stale .codesign sections are removed"
    - "socket-wrapper/1.5.2 test_package verifies LD_PRELOAD loopback redirection end to end"
    - "socket-wrapper/1.5.2 upstream CTest suite runs with cmocka/2.0.2 from the ohpcd remote; 29/32 pass, 3 failures are OHOS platform limits"
  common_dependencies: []

versions:
  "1.4.1":
    status: built
    build_date: "2026-09-04"
    conan_ref: "socket-wrapper/1.4.1"
  "1.5.2":
    status: published
    build_date: "2026-09-02"
