sources:
  "1.4.1":
    url: "https://ftp.samba.org/pub/cwrap/socket_wrapper-1.4.1.tar.gz"
    sha256: "390cc82a1b2103555cfd803bc1acbfeeed2b68cde081005b92cac78ec76554aa"

requirements:
  cmocka: "cmocka/2.0.2"

patches:
  - patch_file: "patches/0001-ConfigureChecks.cmake.patch"
    patch_description: "Detect musl/OHOS recvmmsg and sendmmsg prototypes whose flags parameter is unsigned int"
    patch_type: "portability"
  - patch_file: "patches/0002-config.h.cmake.patch"
    patch_description: "Declare config macros for the musl/OHOS recvmmsg and sendmmsg signatures"
    patch_type: "portability"
  - patch_file: "patches/0003-src-socket_wrapper.c.patch"
    patch_description: "Use musl/OHOS mmsg signatures and undefine LFS64 macro aliases before interposed definitions"
    patch_type: "portability"
  - patch_file: "patches/0004-tests-CMakeLists.txt.patch"
    patch_description: "Link the fake UID preload helper to the cmocka CONFIG target"
    patch_type: "portability"
  - patch_file: "patches/0005-tests-test_echo_tcp_get_peer_sock_name.c.patch"
    patch_description: "Use the cmocka 2.x unsigned range assertion when imported-target symbol probing is unavailable"
    patch_type: "portability"
  - patch_file: "patches/0006-tests-test_fcntl_lock.c.patch"
    patch_description: "Honor TMPDIR in the fcntl-lock test when HarmonyOS mounts /tmp read-only"
    patch_type: "portability"
  - patch_file: "patches/0007-tests-test_ioctl.c.patch"
    patch_description: "Honor TMPDIR in the ioctl test when HarmonyOS mounts /tmp read-only"
    patch_type: "portability"
  - patch_file: "patches/0008-tests-torture.c.patch"
    patch_description: "Honor TMPDIR and allow a relocated echo server in the shared upstream test helper"
    patch_type: "portability"
  - patch_file: "patches/0009-tests-CMakeLists-ohos-ioctl.patch"
    patch_description: "Do not register test_ioctl on OHOS because the kernel rejects SIOCGPGRP with EACCES even without socket_wrapper interposition"
    patch_type: "portability"
