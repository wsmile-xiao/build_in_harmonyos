# test_package/MANIFEST.yml
# Executable consumer contract for socket-wrapper/1.4.1.

package: socket-wrapper/1.4.1
homepage: "https://gitlab.com/cwrap/socket_wrapper"

upstream_check_command: "ctest --output-on-failure --verbose -j1"
upstream_test_in_build: true
upstream_test_mode: "required by default with_upstream_tests=True"
upstream_test_command: "conan create archives/s/socket-wrapper/1.4.1"

upstream_tests:
  - file: "tests"
    source: "socket_wrapper-1.4.1/tests"
    description: "CTest/cmocka suite covering socket interception, TCP and UDP data paths, message variants, file-descriptor operations, threads, fork, syscalls, and the noop library"
    command: "ctest --output-on-failure --verbose -j1"
    cases: 31
    status: "31 entries configured and linked for OHOS; signed runtime attempt on HarmonyOS 6.0.0.48 in the restricted HDC shell passed 10 groups, with AF_UNIX-dependent groups blocked by SELinux"

test_package_tests:
  - file: "test_socket_wrapper.c"
    description: "Link the exported Conan CMake target, preload libsocket_wrapper.so, redirect IPv4 loopback through AF_UNIX, exchange a literal payload, validate the presented peer, and verify the backing socket file"
    command: "./test_socket_wrapper"

assertion_count: 9
