software: sqlfmt
display: "sqlfmt"
description: "Go-based SQL formatter supporting PostgreSQL, SQLite, Oracle and other dialects"
category: utility
homepage: "https://github.com/gsiems/sqlfmt"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Go linker 使用 mmap() 创建输出 ELF 文件，OpenHarmony HMDFS 不支持此操作，导致编译失败 [E051]"
    - "sqlfmt 没有官方预编译 arm64 二进制文件，GitHub releases 仅提供源码 tarball/zip [P18]"
  common_dependencies:
    - go

versions:
  "2025.01.30":
    status: failed
    build_date: "2026-06-10"