software: s3fs-fuse
display: "s3fs-fuse"
description: "FUSE-based file system for mounting S3 buckets"
category: network
homepage: "https://github.com/s3fs-fuse/s3fs-fuse"
license: GPL-2.0
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "需要 autoreconf -iv 生成 configure 脚本"
    - "必须静态链接 libfuse.a 以避免 pthread_cancel 问题"
    - "需要创建 pthread_cancel stub 函数"
  common_dependencies:
    - fuse
    - libcurl
    - libxml2
    - openssl

# 版本索引
versions:
  "1.94":
    status: published
    build_date: "2026-05-28"
    published_as: s3fs-fuse