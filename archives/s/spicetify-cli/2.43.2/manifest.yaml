software: spicetify-cli
version: "2.43.2"
status: published
build_date: "2026-06-01"

source:
  url: "https://github.com/spicetify/cli/archive/refs/tags/v2.43.2.tar.gz"
  sha256: "3debce8af8e071ff9ec75b6a8a296bbd0bb5963151721b0ad2723660b64f65c5"
  tar_format: tar.gz

build_system: custom
build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOPROXY=https://goproxy.cn,direct go build -ldflags='-s -w -X main.version=2.43.2'"
  dependencies:
    - "go/1.26.3"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Go项目使用GOROOT=/storage/Users/currentUser/usr/local/go1263（go1.26.3），而非系统默认的go（其pkg/tool/linux_arm64/compile版本为go1.23.6与go1.24.2不匹配）"
  - "spicetify-cli是纯Go静态编译项目，CGO_ENABLED=0，无需configure/make步骤"
  - "版本号通过ldflags -X main.version注入"