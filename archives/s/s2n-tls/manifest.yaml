software: s2n-tls
display: "s2n-tls"
description: "AWS implementation of the TLS/SSL protocol, designed for simplicity and security"
category: crypto
homepage: "https://github.com/aws/s2n-tls"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "依赖 aws-lc 提供 libcrypto（find_package(crypto)）"
    - "CMAKE_SHARED_LINKER_FLAGS 需追加修复（set() 覆盖问题）"
    - "OHOS 不生成 SONAME，需显式设置 -Wl,-soname,libs2n.so"
    - "s2n_stacktrace_test 豁免（OHOS 不支持 execinfo/backtrace）"
  common_dependencies:
    - aws-lc

versions:
  "1.7.2":
    status: built
    build_date: "2026-04-24"
    conan_adapted: "2026-08-22"
    notes: "Conan adaptation with aws-lc/5.4.0, shared library, 278 upstream tests pass"
  "1.7.6":
    status: published
    build_date: "2026-07-28"
