# test_package/MANIFEST.yml
package: s2n-tls/1.7.2
homepage: "https://github.com/aws/s2n-tls"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest -E s2n_stacktrace_test"

upstream_tests:
  - file: tests/unit/s2n_self_talk_nonblocking_test.c
    source: s2n-tls-1.7.2/tests/unit/s2n_self_talk_nonblocking_test.c
    description: "s2n TLS self-talk non-blocking test"
    command: "./build/bin/s2n_self_talk_nonblocking_test"
  - file: tests/unit/s2n_init_test.c
    source: s2n-tls-1.7.2/tests/unit/s2n_init_test.c
    description: "s2n TLS init/shutdown test"
    command: "./build/bin/s2n_init_test"
  - file: tests/unit/s2n_cipher_suites_test.c
    source: s2n-tls-1.7.2/tests/unit/s2n_cipher_suites_test.c
    description: "s2n TLS cipher suites test"
    command: "./build/bin/s2n_cipher_suites_test"
  - file: tests/unit/s2n_handshake_test.c
    source: s2n-tls-1.7.2/tests/unit/s2n_handshake_test.c
    description: "s2n TLS handshake test"
    command: "./build/bin/s2n_handshake_test"
  - file: tests/unit/s2n_tls13_handshake_test.c
    source: s2n-tls-1.7.2/tests/unit/s2n_tls13_handshake_test.c
    description: "s2n TLS 1.3 handshake test"
    command: "./build/bin/s2n_tls13_handshake_test"
  - file: tests/unit/s2n_x509_validator_test.c
    source: s2n-tls-1.7.2/tests/unit/s2n_x509_validator_test.c
    description: "s2n X.509 certificate validator test"
    command: "./build/bin/s2n_x509_validator_test"

exempted_tests:
  - file: tests/unit/s2n_stacktrace_test.c
    source: s2n-tls-1.7.2/tests/unit/s2n_stacktrace_test.c
    description: "s2n stacktrace test"
    reason: "OHOS platform does not support execinfo.h / backtrace(). Platform capability limitation, not adaptation defect."

test_package_tests:
  - file: test.c
    description: "Consumer test: verify s2n_init and s2n_config_new API"
    command: "./test_s2n_tls"

assertion_count: 2792
