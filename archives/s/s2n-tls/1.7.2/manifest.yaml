software: s2n-tls
version: 1.7.2
status: built
build_system: cmake
build_date: "2026-04-24"
conan_adapted: "2026-08-22"
created_at: "2026-04-24"

dependencies:
  required:
    - aws-lc/5.4.0
  optional: []

build_config:
  target: ohos-aarch64
  options:
    - shared=True
  configure_params: []
  cmake_variables:
    BUILD_TESTING: "ON"
    SEARCH_LIBCRYPTO: "ON"
    UNSAFE_TREAT_WARNINGS_AS_ERRORS: "OFF"
    S2N_INTEG_TESTS: "OFF"
    CMAKE_SHARED_LINKER_FLAGS: "-Wl,-soname,libs2n.so"

patches_applied: []
patch_generation: []

source_modifications:
  - file: CMakeLists.txt
    description: "Fix CMAKE_SHARED_LINKER_FLAGS being overwritten by set() instead of appending"
    method: replace_in_file (conan recipe build())

build_cleanliness:
  standard_params_only: true
  extra_params: []

compatibility:
  level: built
  issues:
    - s2n_stacktrace_test exempted due to OHOS not supporting execinfo/backtrace
  notes: Full conan adaptation with aws-lc dependency, shared library build, upstream tests integrated

test_results:
  type: unit
  total: 278
  passed: 278
  failed: 0
  exempted: 1
  note: 278/278 upstream tests pass via ctest -E s2n_stacktrace_test in conanfile.py build()

knowledge_gained:
  - s2n-tls uses CMake build system
  - Depends on aws-lc for libcrypto (find_package(crypto))
  - CMAKE_SHARED_LINKER_FLAGS needs append fix (set() overwrites generate() flags)
  - OHOS doesn't generate SONAME, needs explicit -Wl,-soname,libs2n.so
  - s2n_stacktrace_test exempted (execinfo.h not available on OHOS)
  - LD_LIBRARY_PATH needed for ctest to find libs2n.so at runtime

