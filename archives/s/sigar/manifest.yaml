software: sigar
display: "SIGAR"
description: "System Information Gatherer And Reporter — cross-platform C library for OS/hardware-level metrics (CPU, memory, swap, disk, network, process, uptime)."
category: system
homepage: "https://github.com/hyperic/sigar"
license: Apache-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "1.6.4 发布包无构建系统与测试套件（构建脚手架与测试只在项目更晚 dev 分支）；用手写 Makefile 构建 Linux 实现，并从官方项目 vendor 13 个上游测试程序以 `make check` 在真机执行"
    - "编译需 -fgnu89-inline（上游 SIGAR_INLINE inline 符号语义）+ -D_GNU_SOURCE（major/minor）"
    - "RPC(#include <rpc/rpc.h>) 代码因 OHOS musl 无 rpc/libtirpc 编译排除（SIGAR_NO_RPC + 链接桩，补丁 0001）"
    - "linux_sigar.c 加 <sys/sysmacros.h>（补丁 0002）"
  common_dependencies: []

versions:
  "1.6.4":
    status: built
    build_date: "2026-09-19"
    conan_ref: "sigar/1.6.4"
