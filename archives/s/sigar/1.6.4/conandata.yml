sources:
  # github.com 直连在本环境不可达（connect timeout）。按仓库 ci/conan/build_and_test.sh
  # 维护的 GitHub 镜像映射，把可达的 gh-proxy.com 镜像放最前，官方原始 URL 保留在最后
  # 作为回退。镜像提供与官方完全相同的归档，sha256 保持不变。
  url:
    - "https://gh-proxy.com/https://github.com/hyperic/sigar/archive/refs/tags/sigar-1.6.4.tar.gz"
    - "https://github.com/hyperic/sigar/archive/refs/tags/sigar-1.6.4.tar.gz"
  sha256: "179b04c1eb7e10e50632e1f8c8d25c1bc4d35259f2976bc72686ecfa79a0052e"

patches:
  - patch_file: "patches/0001-sigar-util-no-rpc.patch"
    patch_description: "Guard the RPC (#include <rpc/rpc.h>) code behind SIGAR_NO_RPC and provide linkable stubs; HarmonyOS musl has no rpc headers / no libtirpc"
    patch_type: "portability"
    strip: 0
  - patch_file: "patches/0002-linux-sysmacros.patch"
    patch_description: "Include <sys/sysmacros.h> in the Linux implementation so major()/minor() are declared on modern glibc and musl"
    patch_type: "portability"
    strip: 0
  - patch_file: "patches/0003-sigar-getpass-musl.patch"
    patch_description: "Musl provides no libc getpass(), so on HarmonyOS define getpass as the existing char-based termios_getpass() implementation"
    patch_type: "portability"
    strip: 0
  - patch_file: "patches/0004-linux-strerror-r-musl.patch"
    patch_description: "Guard HAVE_STRERROR_R_GLIBC behind __GLIBC__: the GNU strerror_r variant (returns char *) exists only on glibc; musl's POSIX strerror_r returns int, so sigar_strerror_get must use the POSIX branch (patch 0004)"
    patch_type: "portability"
    strip: 0
  - patch_file: "patches/0005-linux-hz-fallback.patch"
    patch_description: "glibc <sys/param.h> defines HZ (100) via the kernel <linux/param.h>; musl (HarmonyOS) does not, so provide the standard asm-generic fallback value for sigar_disk_usage_get()"
    patch_type: "portability"
    strip: 0
  - patch_file: "patches/0006-sigar-util-rindex.patch"
    patch_description: "rindex() is a BSD legacy alias glibc exports from <string.h> but musl (HarmonyOS) does not; under SIGAR_NO_RINDEX map it to the standard strrchr() in sigar_util.c proc_module_get_self()"
    patch_type: "portability"
    strip: 0
