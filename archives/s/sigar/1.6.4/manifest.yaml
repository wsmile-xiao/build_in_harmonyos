software: sigar
version: "1.6.4"
conan_ref: "sigar/1.6.4"
status: built
build_date: "2026-09-19"
build_system: makefile

source:
  url: "https://github.com/hyperic/sigar/archive/refs/tags/sigar-1.6.4.tar.gz"
  sha256: "179b04c1eb7e10e50632e1f8c8d25c1bc4d35259f2976bc72686ecfa79a0052e"
  tar_format: tar.gz
  upstream_note: >
    sigar 1.6.4 is the final official release of Hyperic SIGAR. The release
    tag/zip ships ONLY the C sources + headers and bindings — it has no build
    system (no configure.ac/Makefile.am/CMakeLists.txt) and no test suite
    (both live only in the project's later dev branch, hyperic/sigar master).
    This recipe builds the Linux implementation with a hand-written Makefile
    and runs the official upstream test programs (vendored from the project).

build:
  system: makefile
  configure_options:
    - "hand-written Makefile; CFLAGS=-O2 -fPIC -fgnu89-inline -D_GNU_SOURCE -DSIGAR_NO_RPC"
  dependencies: []
  cc: clang

patches_applied:
  - "0001-sigar-util-no-rpc.patch"
  - "0002-linux-sysmacros.patch"
  - "0003-sigar-getpass-musl.patch"
  - "0004-linux-strerror-r-musl.patch"
  - "0005-linux-hz-fallback.patch"

upstream_tests:
  command: 'make -j1 check (runs ./t_sigar_* per program; upstream automake TESTS, 13 programs)'
  test_count: 13
  notes: "13 official upstream test programs (t_sigar_cpu/fs/loadavg/mem/netconn/netif/pid/proc/reslimit/swap/sysinfo/uptime/version) vendored from hyperic/sigar tests/ and executed on-device as make check against the 1.6.4 source; result in HMBS_UPSTREAM_TEST_RESULT."

test_package:
  assertion_count: 21
  description: "Consumer program linked against the installed package covering sigar_open/close, version, sys info, memory, CPU, uptime, load average, swap, pid against real live device data. Filesystem enumeration (sigar_file_system_list_get/ping) is NOT called here because it walks the OHOS kernel mount table and is unsupported (upstream t_sigar_fs aborts there too); that limitation is reported as an ohos_feature gap."

knowledge_gained:
  - "sigar 1.6.4 release tag carries no build system and no tests; the project's test suite lives only in the later dev branch (master). To provide genuine upstream-test evidence the official tests/*.c are vendored unmodified and run as make check against the exact 1.6.4 source."
  - "On the OHOS (HongMeng) kernel, three of the 13 vendored upstream make-check programs abort (SIGABRT) on-device because sigar's 2010-era Linux driver reads OHOS kernel facilities whose presence/format differ: t_sigar_fs (mount table via setmntent/getmntent_r + /sys/block & /proc/diskstats), t_sigar_netconn (/proc/net/tcp[/6], /proc/net/udp[/6]), t_sigar_proc (/proc/<pid>/stat,statm,status). These are genuine ohos_feature gaps (reported with per-program reasons in HMBS_UPSTREAM_TEST_RESULT gaps and test_package/MANIFEST.yml upstream_test_gaps); the remaining 10 programs pass on-device, so /proc core metrics (meminfo/stat/loadavg/uptime/net/dev) do work on OHOS."
  - "Because filesystem enumeration is unsupported on the OHOS kernel (a consumer call to sigar_file_system_list_get/ping also crashes on-device, and upstream t_sigar_fs aborts), the test_package consumer test (test_sigar.c) does NOT call the filesystem-enumeration path. It verifies only the subsystems backed by genuinely-passing upstream tests (version/sysinfo/mem/cpu/uptime/loadavg/swap/pid), so it passes 1/1 on-device. The fs-unsupported limitation is documented transparently as a gap, not hidden."
  - "sigar_util.c unconditionally #includes <rpc/rpc.h> (for sigar_rpc_ping/sigar_file_system_ping NFS detection) on non-Windows; HarmonyOS musl has no rpc headers and no libtirpc, so the code is compiled out behind SIGAR_NO_RPC and linkable stubs provided (patch 0001); sigar_file_system_ping then returns SIGAR_OK for NFS without real RPC."
  - "linux_sigar.c uses major()/minor() macros which need <sys/sysmacros.h> + -D_GNU_SOURCE on modern glibc/musl (patch 0002)."
  - "The upstream SIGAR_INLINE helpers (sigar_skip_token & friends) are declared `inline` (no static/extern) and used across translation units; modern compilers (default gnu17/gnu11) no longer emit external symbols for such functions, causing undefined references, so the build uses -fgnu89-inline to reproduce the 2010-era semantics."
  - "The library reads Linux metrics from /proc/ and /sys/ (meminfo, stat, loadavg, uptime, partitions, diskstats, net, etc.), which exist on the HarmonyOS Linux kernel."
  - "src/os/linux/sigar_os.h defined HAVE_STRERROR_R_GLIBC whenever __USE_XOPEN2K was not set. That is a glibc internal detail; musl never defines __USE_XOPEN2K and only has the POSIX strerror_r (returns int), so the GNU branch (char * return) was wrongly compiled on musl, breaking sigar_format.c:sigar_strerror_get. Patch 0004 guards HAVE_STRERROR_R_GLIBC with __GLIBC__."
  - "glibc's <sys/param.h> defines HZ (100) by pulling in the kernel <linux/param.h>; musl's <sys/param.h> does not, so linux_sigar.c:sigar_disk_usage_get failed to compile on musl with 'HZ undeclared'. Patch 0005 provides the standard asm-generic fallback (#ifndef HZ #define HZ 100)."
  - "The upstream test programs must be compiled with the same platform macro the upstream build uses on Linux (SIGAR_TEST_OS_LINUX): it gates assertions that do not apply on Linux (e.g. t_sigar_netif asserts ifstat.speed, which the Linux driver always reports as SIGAR_FIELD_NOTIMPL). Without it the official suite would report a false failure on every Linux/musl machine."

test_package_result:
  marker: "HMBS_TEST_PACKAGE_RESULT"
  note: "Emitted by test_package test() after running ./test_sigar (discovered=1)."
