# test_package/MANIFEST.yml — sigar 1.6.4 verification manifest
#
# Upstream test suite. The official hyperic/sigar project carries a C test
# suite for the sigar library: 13 assertion-based programs under tests/
# (t_sigar_cpu/fs/loadavg/mem/netconn/netif/pid/proc/reslimit/swap/sysinfo/
# uptime/version.c), registered by the project's autotools build as
# check_PROGRAMS + TESTS and launched via `make check`.
#
# The 1.6.4 *release tag* (this recipe's source) ships only the C sources +
# headers, without the build scaffolding or the tests (those live only in the
# project's later dev branch). To still exercise the genuine upstream suite
# against the exact 1.6.4 source, the official tests/*.c + sigar_tests.h are
# vendored (byte-identical from the hyperic/sigar repository) into this
# version's tests/ directory and are built + executed by the main recipe's
# build() as the upstream `make check`. The 13 programs compile and link
# against the 1.6.4 C API unchanged (verified; they call only sigar_open and
# the core sigar_*_get APIs present in 1.6.4). This mirrors how the official
# suite is run upstream (automake `make check`).
package: sigar/1.6.4
software: sigar
version: "1.6.4"
homepage: "https://github.com/hyperic/sigar"

upstream_tests_exist: true
upstream_test_audit: >
  The official release artifact for sigar 1.6.4 (both the GitHub
  sigar-1.6.4 tag tarball sha256 179b04c1eb7e10e50632e1f8c8d25c1bc4d35259f2976bc72686ecfa79a0052e
  and the SourceForge hyperic-sigar-1.6.4.zip) contains NO build system and NO
  test suite: top-level tree is only AUTHORS/ChangeLog/LICENSE/NOTICE/README,
  bindings/, examples/ (cpuinfo.c, sigar_ps.c), include/ (8 public headers)
  and src/ (9 platform-independent .c + os/<platform>/). There is no
  Makefile.am/CMakeLists.txt/configure.ac and no tests/ directory in the
  1.6.4 release. The C library test suite lives only in the same project's
  later dev branch (hyperic/sigar), where tests/ holds 13 programs
  (t_sigar_*.c + sigar_tests.h) registered as automake check_PROGRAMS/TESTS
  and run via `make check`. Because the upstream project does define these
  real tests for the sigar C library that this package builds, upstream_tests_exist
  is declared true and the OFFICIAL test programs are vendored (byte-identical,
  unmodified) into tests/ and executed on-device as `make check` against the
  1.6.4 source. The 13 programs only use sigar_open / sigar_close and the core
  sigar_*_get list APIs present in the 1.6.4 headers, so they build and run
  against the 1.6.4 library without modification (verified by local compile
  + link + run: 13/13 link; the test programs are compiled with the upstream
  Linux platform macro (SIGAR_TEST_OS_LINUX, set by the upstream build via
  configure.ac AC_DEFINE / tests/CMakeLists.txt ADD_DEFINITIONS) which gates
  assertions that do not apply on Linux, e.g. t_sigar_netif's `speed` field
  (the Linux driver reports SIGAR_FIELD_NOTIMPL there). Discovery source:
  hyperic/sigar tests/Makefile.am TESTS list = 13 programs.

upstream_check_command: "make check (recipe Makefile 'check' target runs the 13 vendored upstream test programs)"
upstream_test_in_build: true
upstream_test_command: "make -j1 check SHELL=/bin/sh (runs ./t_sigar_* per program; HMBS_UPSTREAM_TEST_RESULT emitted from real per-program exit status)"

upstream_tests:
  - name: t_sigar_cpu
    file: tests/t_sigar_cpu.c
    description: "cpu get / cpu list / cpu info list assertions"
    command: "./t_sigar_cpu"
  - name: t_sigar_fs
    file: tests/t_sigar_fs.c
    description: "file-system list, usage, disk usage, ping assertions"
    command: "./t_sigar_fs"
  - name: t_sigar_loadavg
    file: tests/t_sigar_loadavg.c
    description: "load-average assertions"
    command: "./t_sigar_loadavg"
  - name: t_sigar_mem
    file: tests/t_sigar_mem.c
    description: "memory total/used/free assertions"
    command: "./t_sigar_mem"
  - name: t_sigar_netconn
    file: tests/t_sigar_netconn.c
    description: "network connection list assertions"
    command: "./t_sigar_netconn"
  - name: t_sigar_netif
    file: tests/t_sigar_netif.c
    description: "network interface list/config/stat assertions"
    command: "./t_sigar_netif"
  - name: t_sigar_pid
    file: tests/t_sigar_pid.c
    description: "process id assertions"
    command: "./t_sigar_pid"
  - name: t_sigar_proc
    file: tests/t_sigar_proc.c
    description: "process list / proc stat / mem / time / state assertions"
    command: "./t_sigar_proc"
  - name: t_sigar_reslimit
    file: tests/t_sigar_reslimit.c
    description: "resource limit assertions"
    command: "./t_sigar_reslimit"
  - name: t_sigar_swap
    file: tests/t_sigar_swap.c
    description: "swap total/used/free assertions"
    command: "./t_sigar_swap"
  - name: t_sigar_sysinfo
    file: tests/t_sigar_sysinfo.c
    description: "system info assertions"
    command: "./t_sigar_sysinfo"
  - name: t_sigar_uptime
    file: tests/t_sigar_uptime.c
    description: "uptime assertions"
    command: "./t_sigar_uptime"
  - name: t_sigar_version
    file: tests/t_sigar_version.c
    description: "version get assertions"
    command: "./t_sigar_version"

upstream_discovered: 13
upstream_test_total: 13
upstream_test_count_method: autotools_tests
# autotools_tests: the 13 upstream test programs are the automake `make check`
# TESTS/check_PROGRAMS entries of the hyperic/sigar project's test suite
# (tests/Makefile.am), which this recipe runs 1:1 as `make check`.

test_type: installed-package
test_package_tests:
  - file: test_sigar.c
    name: test_sigar
    description: "Consumer contract against the packaged sigar headers + library: sigar_open/close, version (1.6), sys info, memory, cpu, uptime, load average, swap, pid — asserting real live values are sane on the device. Filesystem enumeration (sigar_file_system_list_get/ping) is intentionally NOT exercised here: it walks the kernel mount table and is unsupported on the OHOS kernel (upstream t_sigar_fs aborts there too); that limitation is reported as an ohos_feature gap (see gaps below / HMBS_UPSTREAM_TEST_RESULT)."
    command: "./test_sigar"

executables:
  - name: test_sigar
    purpose: "installed-package API verification (link and run against the packaged libsigar)"

# Upstream make-check failures on the OHOS (HongMeng) kernel — genuine platform
# (ohos_feature) gaps, not adaptation defects.  Each failing program's default
# assert(ret==SIGAR_OK)/non-null-assert branch fires because the sigar 2010-era
# Linux driver reads an OHOS kernel facility whose presence/format differs.
upstream_test_gaps:
  - count: 1
    program: t_sigar_fs
    category: ohos_feature
    detail: "filesystem enumeration: sigar_file_system_list_get walks the kernel mount table via setmntent(MOUNTED)/getmntent_r and per-block-device I/O stat (/sys/block + /proc/diskstats); the HongMeng OHOS mount/block-stat layout differs from the assumed Linux format, so a field/usage assertion fails and the program aborts on-device."
  - count: 1
    program: t_sigar_netconn
    category: ohos_feature
    detail: "network connection listing: sigar_net_connection_list_get parses /proc/net/tcp[/6] & /proc/net/udp[/6] (proc_net_read); the OHOS kernel does not expose those tables in the expected format, so the walker returns a status other than the single AIX-expected 40013 and the default assert(ret==SIGAR_OK) fires."
  - count: 1
    program: t_sigar_proc
    category: ohos_feature
    detail: "per-pid process metrics: scans all pids and reads /proc/<pid>/stat,statm,status (sigar_proc_mem/time/state_get); some OHOS kernel/system pids return an unexpected errno or malformed stat line, hitting the default assert(ret==SIGAR_OK) branch."

cases: 1
assertions: 21
upstream_cases: 13
