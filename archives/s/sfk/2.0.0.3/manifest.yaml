software: sfk
version: "2.0.0.3"
status: built
build_date: "2026-09-30"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/swissfileknife/1-swissfileknife/2.0.0.3/sfk-2.0.0.tar.gz"
  sha256: "b7e2e3848e3126dcee916056bff5f8340acae9158f3610049de2cde999ccca63"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-dependency-tracking"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-musl-posix-compat.patch"

knowledge_gained:
  - "sfk 2.0.0.3 is a single-binary autotools CLI tool (sfk.cpp/sfkext.cpp/sfkpack.cpp); the binary self-reports 'Release 2.0.0 Revision 3' (version 2.0.0, fixpack 3 = 2.0.0.3)."
  - "The upstream ships NO test suite: Makefile.am declares only bin_PROGRAMS=sfk, with no TESTS/check_PROGRAMS target and no test directory; the mtk/ subtree is an optional tracing library, not a test harness."
  - "test_package validates the packaged binary against real sfk commands (mkdir/calc/md5/list/time + banner) and adds a HarmonyOS aarch64 ELF + musl-loader ABI check."
  - "The SFK banner version line ('Release 2.0.0 Revision 3') is the authoritative, deterministic source for the 2.0.0.3 version string."
  - "sfk source depends on glibc internals that OHOS musl libc lacks: __dev_t, fpos_t.__pos/__off_t, and *_64 LFS entry points (fopen64/fseeko64/...). Ported via patches/0001 (dev_t + ftell/fseek) plus -D_GNU_SOURCE -D_LARGEFILE64_SOURCE in recipe cxxflags."
