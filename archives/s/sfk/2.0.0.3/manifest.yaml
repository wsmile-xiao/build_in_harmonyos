software: sfk
version: "2.0.0.3"
status: published
build_date: "2026-06-16"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/swissfileknife/1-swissfileknife/2.0.0.3/sfk-2.0.0.tar.gz"
  sha256: "b7e2e3848e3126dcee916056bff5f8340acae9158f3610049de2cde999ccca63"
  tar_format: tar.gz

build:
  system: autotools
  # 模式B手动编译，configure在HMDFS上Permission denied无法运行
  configure_options:
    - "手动创建config.h + clang++直接编译（模式B）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-sfkbase-ohos-compat.patch"
  - "0002-sfkcpp-fpos-compat.patch"
  - "0003-sfkext-solip-compat.patch"

knowledge_gained:
  - "fpos_t在OHOS/musl上是union _G_fpos64_t，成员为__lldata(long long)，非glibc的struct __pos"
  - "__dev_t和__off_t是glibc专有类型，musl未定义；需用#ifndef兜底定义为dev_t/off_t"
  - "Autoconf 2.65的config.status在HMDFS上因Permission denied无法写subs1.awk，需模式B手动编译"
  - "__OHOS__是clang在HarmonyOS上的预定义宏，可用于平台条件编译"
  - "SOL_IP在OHOS/musl上未定义，需#define SOL_IP IPPROTO_IP"
