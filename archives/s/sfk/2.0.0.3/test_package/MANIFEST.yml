# test_package/MANIFEST.yml — sfk 2.0.0.3
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。
# 详见 docs/TEST_QUALITY_SPEC.md
#
# 计数口径：test_package 按「独立检查项数量」计数（7 项，见 test_package_tests），
# 与 test.sh 的 passedCount 一一对应。鸿蒙特有 ABI 检查按独立断言计 2 项（A1-A2）。

package: sfk/2.0.0.3
homepage: "http://stahlworks.com/dev/swiss-file-knife.html"

# ── 上游测试套件存在性（经审计官方 SourceForge tar 包确认）──────────────────
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

upstream_test_audit:
  source_tarball: "sfk-2.0.0.tar.gz (https://downloads.sourceforge.net/project/swissfileknife/1-swissfileknife/2.0.0.3/sfk-2.0.0.tar.gz)"
  source_sha256: "b7e2e3848e3126dcee916056bff5f8340acae9158f3610049de2cde999ccca63"
  build_system: "Autotools（configure.ac + Makefile.am，bin_PROGRAMS=sfk，源码 sfk.cpp/sfkext.cpp/sfkpack.cpp）"
  scanned_for:
    - "tests/ 或 test/ 目录"
    - "Makefile.am / Makefile.in 中的 TESTS / check_PROGRAMS / check 目标"
    - "gtest / catch2 / criterion / CUnit 等 C/C++ 测试框架绑定"
    - "*_test.c / test_*.c / *_tests.cpp 命名的测试源文件"
  scan_result: "configure.ac 仅声明 AC_PROG_CXX/AM_INIT_AUTOMAKE 并输出 Makefile；Makefile.am 只有 bin_PROGRAMS=sfk 与 sfk_SOURCES，无 TESTS/check_PROGRAMS/check 目标；Makefile.in 中出现的 check 均为 Automake 通用样板（distcheck/uninstallcheck），非测试套件；源码树不含 tests/ 目录或 *_test 源文件；mtk/ 子目录是可选嵌入式跟踪库（Micro Tracing Kernel 文档），不是测试 harness。"
  reason: "sfk 2.0.0.3 上游无任何测试框架与测试目标（无 make check、无 TESTS、无测试目录），按 no_tests 处理；适配后由 test_package 补全 7 个独立功能断言，并附加 2 项鸿蒙特有 ABI 检查。"

# 上游测试命令（无测试套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 中未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ── test_package 自带的功能测试（上游无测试，适配后补全）────────────
# 执行位置: test_package/test.sh（can_run() 为真时在 HarmonyOS 上实跑）
test_package_tests:
  - file: test.sh
    description: >-
      功能冒烟 7 项：1) 无参 `sfk` 打印主帮助横幅，含 "Release 2.0.0"；
      2) 横幅含 "Revision 3"（对应 2.0.0.3 的 fixpack=3）；3) `sfk calc 2+3`
      输出 5；4) `sfk mkdir` 创建嵌套目录树；5) `sfk md5` 对已知内容文件输出
      标准 MD5（6f5902...3dc4，与 md5sum 一致）；6) `sfk list` 暴露所创建文件；
      7) `sfk time` 输出非空时间戳。全离线、确定性、逐一输出 PASS/FAIL。
    command: "sh test.sh <package-bin-dir>"
    assertion_count: 7

# ── 鸿蒙特有测试（rule12: N >= 1，本包 N = 2）────────────────────────
harmonyos_specific_tests:
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A1: 打包产物为 ELF64 小端且 e_machine == EM_AARCH64(183)，
      即 HarmonyOS PC arm64 目标（交叉编译三元组 aarch64-linux-ohos 生效）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/sfk"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A2: .interp == /lib/ld-musl-aarch64.so.1，即鸿蒙 musl 动态
      加载器；glibc 产物会是 /lib/ld-linux-aarch64.so.1，故该断言可区分
      工具链/sysroot 是否真的指向 OHOS。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/sfk"
    assertion_count: 1

# 测试断言总数（功能冒烟 7 + 鸿蒙特有 2）
assertion_count: 9
test_package_test_count: 7
harmonyos_specific_test_count: 2
count_method: "independent_check_items"
