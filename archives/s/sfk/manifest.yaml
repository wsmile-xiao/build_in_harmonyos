software: sfk
display: "Swiss File Knife"
description: "多功能命令行工具，整合文件搜索、文本处理、二进制操作、网络工具等众多常用Unix工具"
category: system
homepage: "http://stahlworks.com/dev/swiss-file-knife.html"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "fpos_t在OHOS/musl上是union _G_fpos64_t含__lldata成员，非glibc的struct __pos"
    - "__dev_t和__off_t是glibc专有类型，musl未定义，需#ifndef兜底定义为dev_t/off_t"
    - "Autoconf 2.65的config.status在HMDFS上Permission denied，需模式B手动编译"
    - "SOL_IP在OHOS/musl上未定义，需#define SOL_IP IPPROTO_IP"
    - "__OHOS__是clang在HarmonyOS上的预定义宏"
  common_dependencies: []

versions:
  "2.0.0.3":
    status: published
    build_date: "2026-06-16"
