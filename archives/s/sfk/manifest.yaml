# 软件级 manifest
# 文件位置: archives/s/sfk/manifest.yaml
# 版本级细节见 2.0.0.3/manifest.yaml

software: sfk
display: "sfk"
description: "Swiss File Knife：多功能命令行文件工具"
category: tool
homepage: "http://stahlworks.com/dev/swiss-file-knife.html"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 构建单一 sfk 可执行文件；Configure + make + make install 即得 bin/sfk。"
    - "上游无测试套件（无 TESTS/check 目标、无 tests/ 目录），按 no_tests 处理；test_package 补全功能冒烟测试。"
    - "test_package 用真实 sfk 命令（mkdir/calc/md5/list/time + 版本横幅）验证打包二进制可执行。"
    - "鸿蒙特有 ABI 检查：产物须为 aarch64 ELF 且加载器为 /lib/ld-musl-aarch64.so.1。"
  common_dependencies: []

versions:
  "2.0.0.3":
    status: built
    build_date: "2026-09-30"
