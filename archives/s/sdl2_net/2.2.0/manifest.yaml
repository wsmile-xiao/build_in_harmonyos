software: sdl2_net
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/libsdl-org/SDL_net/tarball/release-2.2.0"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - SDL2/2.30.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenHarmony 系统名 HarmonyOS 需要在 config.guess 中添加识别分支"
  - "config.sub 需要在 OS 白名单和 kernel-os 白名单中添加 ohos 支持"
  - "autotools configure 在 OpenHarmony 上可能遇到临时文件权限问题，建议优先使用 CMake"
  - "ustar 格式 tar 包在 OpenHarmony 上因 UID/GID 过大导致 header field 太小，建议使用 Python tarfile 或 GNU tar 格式"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/sdl2_net-2.2.0.orig
  source_work_dir: /storage/Users/currentUser/builds/sdl2_net-2.2.0.work
  source_orig_hash: a24082af92b00d81
  source_work_hash: 6d6e89a4db6954d8
  generated_at: '2026-05-26T20:44:03'
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
