software: sqlmap
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.10"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# 构建系统类型
# cmake | autotools | makefile | meson | custom | python
build_system: python

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sqlmapproject/sqlmap/archive/refs/tags/1.10.tar.gz"
  # 源码校验和
  sha256: ""
  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | python
  system: python
  # 配置选项列表（Python项目无需configure）
  configure_options: []
  # Python项目安装方式：直接复制源码+创建wrapper脚本
  install_method: "source_copy_with_wrapper"
  # 编译依赖列表（格式: name/version）
  dependencies:
    - python3/3.12
  # 编译器（Python项目无C编译器）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python项目无需传统configure/make流程，直接复制源码到share目录+创建wrapper脚本即可安装 (ref: E077)"
  - "sqlmap是纯Python项目，所有依赖内嵌在thirdparty目录中，无需额外pip安装 (ref: E050)"