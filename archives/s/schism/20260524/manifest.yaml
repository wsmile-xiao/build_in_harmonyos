# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 autotools 在 configure 中注入 -Werror（成对 0003/0004 补丁处理）：clang/OHOS 交叉编译把 gcc 下的告警升级为错误（slurp.c:832 [-Werror,-Wreturn-type]），且注入顺序在外部 CFLAGS 之后，-Wno-error 无法覆盖 → 必须补丁剔除；已沉淀为 knowledge/drafts/werror-autotools 四件套（检测脚本 + 补丁模板 + 复现脚本 + 样例库）"
  - "HMDFS 上 `mktemp -d` 创建的目录对 CI 构建用户不可写：config.status 写 subs1.awk 即 Permission denied → configure 中断。构建脚本内改用 ${TMPDIR:-$HOME/tmp} + mkdir -p 并去掉 umask 077（补丁 0005）"
  - "依赖包 .pc 记录的绝对路径在干净 CI 环境不存在：utf8proc 的 .pc 写的是打包机 staging 路径、sdl2 的 prefix=/，导致 configure 探测到的 -I/-L 全部落空（utf8proc.h not found / -lutf8proc not found）。解法：generate() 内把依赖 .pc 复制到构建目录并按本机包路径改写 prefix/libdir/includedir 等变量，再以 PKG_CONFIG_PATH 提供"
  - "上游 configure 未把 SDL_CFLAGS / UTF8PROC_CFLAGS 传给最终 Makefile，需以 CPATH 兜底头文件搜索（sdl2 的 include/SDL2 与 utf8proc 的 include）；同一变量多次 define 会互相覆盖，必须合并为单次 define"
  - "Schism Tracker 是 C 主体 + SDL2 的可执行程序（非库）：package_type=application，cpp_info 只暴露 bindirs=[bin]（includedirs/libdirs/libs 全空），消费者验证走真实执行 --version/--help 契约"
  - "SDL2 类依赖「制品仓只发静态库」时的运行时陷阱：上游默认运行时 dlopen(\"SDL2-2.0\")，而 sdl2/2.30.10 在 OHOS 档位只发静态 libSDL2.a（包内无 libSDL2-2.0.so.0），dlopen 必然失败 → 后端函数指针保持 NULL → 首次调用 timer_ticks() 即空指针崩溃（上游测试套件与 schismtracker 本体同因，批量 exec 退出码 139）。解法：configure 加 --enable-sdl2-linking 改配置期直链，并显式传入 SDL2_CFLAGS/SDL2_LIBS（路径取自依赖 cpp_info，R49）；仅靠 .pc 不可靠——sdl2.pc 记 prefix=/（打包机绝对路径不可迁移）"
