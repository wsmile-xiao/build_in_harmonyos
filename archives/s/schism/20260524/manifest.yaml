# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--without-x（构建机无 X11，走 SDL2 后端）"
    - "--without-alsa（上游开关为 AC_ARG_WITH([alsa])，无 --disable-alsa；构建机无 ALSA 环境，显式关闭）"
    - "--enable-sdl2-linking（制品仓 sdl2 只发静态 libSDL2.a，上游默认运行时 dlopen 必失败 → 改为配置期直链）"
    - "--enable-tests（构建上游测试套件 schismtrackertest，build() 内显式执行）"
  dependencies:
    - sdl2/2.30.10
    - utf8proc/2.11.3.2
  cc: clang
  cxx: clang++

