# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: spatialindex/1.9.3
homepage: "https://github.com/libspatialindex/libspatialindex"

# 上游测试真机实测（2026-09-23）：
#   - 15 个测试可执行文件（add_executable 口径：geometry 1 / rtree 6 /
#     mvrtree 4 / tprtree 4，SIDX_BUILD_TESTS=ON 随构建产出）。
#   - 上游 9 个回归场景（test/*/testN/run，链式调用测试程序做"随机数据
#     建树 vs 穷举搜索"结果比对）真机全量执行：8 过 / 1 败。
#     rtree test1-4、mvrtree test1-2、tprtree test1-2 全部 PASS；
#     geometry test1 失败，归因见下。
#   - 15 个程序中 13 个经场景链真实执行、断言全部通过；2 个程序
#     （test-geometry-Intersection、libsidxtest）动态加载失败：本平台
#     工具链对共享库默认 hidden visibility，libspatialindex.so 未导出
#     Region/Point/LineSegment 等内部 C++ 符号（符号表 grep 实测），
#     libgtest.so 的 testing::Test 符号同样不可解析；已尝试版本化软链、
#     CMAKE_*_VISIBILITY_PRESET、CXX_FLAGS 追加三种绕法未果，按止损
#     纪律如实申报（详见 PR 描述）。
upstream_check_command: "cmake -DSIDX_BUILD_TESTS=ON && make && 逐场景运行 test/*/testN/run"
upstream_test_in_build: true
upstream_test_command: "真机已执行：9 场景 8 过 1 败，13/15 程序断言全过（详见 PR 描述）"

upstream_tests:
  - file: "test/rtree/test1-4（run 场景）"
    description: "rtree 四场景（含 bulk-load/并行变体）真机执行，全部 PASS（建树/查询/穷举比对一致）"
  - file: "test/mvrtree/test1-2（run 场景）"
    description: "mvrtree 两场景真机执行，全部 PASS"
  - file: "test/tprtree/test1-2（run 场景）"
    description: "tprtree 两场景真机执行，全部 PASS"
  - file: "test/geometry/test1（run 场景）"
    description: "geometry 场景失败：test-geometry-Intersection 动态加载失败（libspatialindex.so 未导出内部 C++ 符号，平台工具链 hidden visibility，附符号表证据）"
  - file: "test/gtest/libsidxtest（gtest API 套件）"
    description: "动态加载失败（testing::Test 符号不可解析，同根因）；三种绕法尝试未果，按止损纪律申报"

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_sidx.cpp
    description: >-
      消费者测试（2 项断言）：内存 R*-tree 插入 100 个对角线点并做
      中段 range 查询——命中数恰为 51（1）；全程无 Tools::Exception
      异常（2）。失败即非零退出。
