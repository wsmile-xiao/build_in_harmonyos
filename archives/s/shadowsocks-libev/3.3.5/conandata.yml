# conandata.yml — shadowsocks-libev 3.3.5
#
# 官方发布归档（GitHub Releases 资产，由上游 release 流程用 make dist 生成）。
# 关键差异（R40）：GitHub *源码* 归档 .../archive/refs/tags/v3.3.5.tar.gz 里
# libcork/ libipset/ libbloom/ 三个子模块目录是**空**的（git archive 不含
# submodule 内容），且不含已生成的 configure/Makefile.in；用它必须联网克隆
# 三个子模块并自行 autoreconf，构建不可复现。官方 release 资产则**内嵌了全部
# 三个子模块**（191 个条目）并附带已生成的 configure，可离线复现。
# 因此本配方选用 release 资产，sha256 由本地下载计算并固定。
#
# 归档内容（shadowsocks-libev-3.3.5/，383 个归档条目）：
#   src/ ss-local, ss-server, ss-tunnel, ss-manager, ss-redir, libshadowsocks-libev
#   libcork/  libipset/  内嵌子模块源码 + 上游自带的 Makefile.am 包装（纯 automake，
#                        不调用两者各自的 CMakeLists.txt）
#   libbloom/ 内嵌子模块源码 + Makefile.am
#   debian/   （仅 debian/tests/control，不是可执行测试）
#
# ⚠ 重要事实更正：本 **release 资产里没有 tests/ 目录**。
#   上游的 tests/test.sh + tests/test.py + 8 个 JSON 配置**只存在于 GitHub 的
#   *tag 源码归档***（archive/refs/tags/v3.3.5.tar.gz，归档内顶层目录名为
#   shadowsocks-c-3.3.5）；上游 release 流程做 dist 时未把 tests/ 打进 tarball。
#   因此「真实执行上游测试」必须另行取 tag 归档里的 tests/ —— 见
#   upstream-tests/run_upstream_tests.sh（实测 8/8 通过）。
sources:
  url: "https://github.com/shadowsocks/shadowsocks-libev/releases/download/v3.3.5/shadowsocks-libev-3.3.5.tar.gz"
  sha256: "cfc8eded35360f4b67e18dc447b0c00cddb29cc57a3cec48b135e5fb87433488"

# ── 私有内嵌依赖（vendoring）─────────────────────────────────────────────
#
# 为什么内嵌 mbedtls 2.28.10 而不是写成 conan requires：
#   shadowsocks-libev 3.3.5 对 mbedtls 是**硬依赖且锁死在 v2/v3 API**：
#     * configure 的 ss_MBEDTLS 用 AC_CHECK_LIB(mbedcrypto, mbedtls_cipher_setup)
#       探测，失败即 AC_MSG_ERROR("mbed TLS libraries not found.")；
#     * src/crypto.h 无条件 #include <mbedtls/cipher.h> 与 <mbedtls/md.h>，
#       并用 mbedtls_cipher_info_t / mbedtls_cipher_context_t / mbedtls_md_info_t /
#       MBEDTLS_MD_MAX_SIZE；src/crypto.c 调 mbedtls_md_info_from_string("MD5")。
#   OHOS 制品仓（ohpcd 远端）**只发布了 mbedtls/4.1.0**，而 4.x 已改为
#   TF-PSA-Crypto：mbedtls/cipher.h 降级为 mbedtls/private/cipher.h（仅 PSA
#   内部可见），mbedtls/md5.h、ctr_drbg.h、entropy.h 直接移除。实测用 4.1.0
#   交叉编译：'mbedtls/cipher.h' file not found。
#   仓库内 archives/m/mbedtls/ 虽有 2.28.8/2.28.10/3.6.0/3.6.6 的 manifest 与
#   notes，但**没有可用配方**（只有 4.1.0 有 conanfile.py），远端也拉不到。
#
#   因此按仓库既有先例（bzrtp/5.3.105 内嵌 mbedtls 3.6.5、librist/2.0.18
#   内嵌 mbedtls/cJSON、lib60870/2.4.0 内嵌 mbedtls）**自带源码子构建**：
#   制品仓没有发布的版本就地 vendoring，不新增 conan requirement，
#   整个适配保持"一个库一个 PR、只改本目录"的约束。
#
#   选 2.28.10 而非 3.6.x：2.28 是 mbedtls 最后一条保留完整经典 cipher API 的
#   LTS 分支，且默认配置即开启 MBEDTLS_CIPHER_MODE_CFB / MBEDTLS_GCM_C /
#   MBEDTLS_ARC4_C / MBEDTLS_BLOWFISH_C / MBEDTLS_CAMELLIA_C —— 正好覆盖
#   ss_MBEDTLS 的全部编译期检查（CFB 缺失是 #error，不是 warning）。
vendor:
  mbedtls:
    url: "https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/mbedtls-2.28.10.tar.gz"
    sha256: "c785ddf2ad66976ab429c36dffd4a021491e40f04fe493cfc39d6ed9153bc246"
