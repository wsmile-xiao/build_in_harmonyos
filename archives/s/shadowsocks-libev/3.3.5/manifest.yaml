# 版本级 manifest — shadowsocks-libev 3.3.5
# 文件位置: archives/s/shadowsocks-libev/3.3.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 为 CI 唯一输入，本文件为交叉校验元数据）

# ============================================================
# 必须字段
# ============================================================

version: "3.3.5"
software: "shadowsocks-libev"

# 编译状态: published | built | failed | archived
# 本地 ohos-aarch64 交叉构建通过；qemu 下端到端回环 4/4 通过。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: "autotools"
conan_ref: "shadowsocks-libev/3.3.5"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 release 资产（GitHub Releases，make dist 生成，内嵌三个子模块）
  url: "https://github.com/shadowsocks/shadowsocks-libev/releases/download/v3.3.5/shadowsocks-libev-3.3.5.tar.gz"
  # 源码校验和（与 conandata.yml 一致）
  sha256: "cfc8eded35360f4b67e18dc447b0c00cddb29cc57a3cec48b135e5fb87433488"
  tar_format: tar.gz
  # 关键：不能用 .../archive/refs/tags/v3.3.5.tar.gz（tag 源码归档）。
  # 该归档里 libcork/ libipset/ libbloom/ 三个子模块目录为空且不含生成的
  # configure，必须联网克隆子模块并 autoreconf，构建不可复现。
  note: "release 资产内嵌 libcork/libipset/libbloom（191 个条目）并自带 configure，可离线复现"

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  # 上游提供 configure，但 Makefile.am 未把 tests 接入 automake
  # （无 TESTS / check_PROGRAMS / check-local），故无 make check 可跑。
  configure_options:
    - "--with-pcre=<conan pcre prefix>"
    - "--with-sodium=<conan libsodium prefix>"
    - "--with-cares=<conan c-ares prefix>"
    - "--with-ev=<conan libev prefix>"
    - "--with-mbedtls=<私有 vendoring mbedtls prefix>"
    - "--disable-documentation"
    - "--enable-static"
    - "--disable-shared"
  cc: clang
  dependencies:
    - "pcre/8.45"
    - "libev/4.33"
    - "libsodium/1.0.22"
    - "c-ares/1.34.6"
  # 非 conan requirement：制品仓没有兼容版本，就地 vendoring 子构建
  vendored:
    - name: "mbedtls"
      version: "2.28.10"
      reason: "OHOS 制品仓只发布 mbedtls/4.1.0（TF-PSA-Crypto，已移除 mbedtls/cipher.h 等经典头），而 shadowsocks-libev 3.3.5 硬依赖 mbedtls v2/v3 的 cipher/md API"
      url: "https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/mbedtls-2.28.10.tar.gz"
      sha256: "c785ddf2ad66976ab429c36dffd4a021491e40f04fe493cfc39d6ed9153bc246"
      installs_into_package: false

  # 产物
  artifacts:
    - "bin/ss-local"
    - "bin/ss-server"
    - "bin/ss-tunnel"
    - "bin/ss-manager"
    - "bin/ss-redir"
    - "lib/libshadowsocks-libev.a"
    - "include/shadowsocks.h"
    - "lib/pkgconfig/shadowsocks-libev.pc"

# ============================================================
# 补丁信息
# ============================================================

# 无静态补丁文件；E007 的三元组修复在 build() 内就地改写 config.sub（幂等）。
patches_applied: []

patch_generation:
  method: none
  patches_count: 0

patch_classification: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E007: shadowsocks-libev 3.3.5 内置 2020 年的 GNU config.sub 不认 ohos 三元组，实测 configure 报 \"Invalid configuration `aarch64-linux-ohos': system `ohos' not recognized\"；在 shebang 后插入与版本无关的 fast-path（含 ohos 一律规范化为 <machine>-unknown-linux-ohos）比改易碎的 kernel-OS 白名单表更稳，且幂等"
  - "R40: GitHub tag 源码归档不含 submodule 内容，shadowsocks-libev 的 libcork/libipset/libbloom 目录为空且无生成 configure，必须联网 clone + autoreconf；官方 release 资产内嵌三者并自带 configure，应优先选 release 资产"
  - "依赖探测形态: 上游 configure 用 --with-<dep>=DIR（TS_CHECK_PCRE/ss_MBEDTLS/ss_SODIUM/ss_CARES 只加 -I$DIR/include 与 -L$DIR/lib，不做 pkg-config 探测），Conan 依赖必须用 self.dependencies[name].package_folder 显式喂入；libev 只有 --with-ev=DIR 单一变体"
  - "mbedtls 4.x 是 TF-PSA-Crypto 重构：mbedtls/cipher.h 降为 mbedtls/private/cipher.h（仅 PSA 内部），md5.h/ctr_drbg.h/entropy.h 移除；需要经典 cipher API 的旧库（如 shadowsocks-libev 3.3.5、bctoolbox 5.3）必须锁 2.28.x LTS 或 3.6.x"
  - "制品仓缺版本时的合规做法（仓库先例 bzrtp/5.3.105、librist/2.0.18、lib60870/2.4.0）: 就地 vendoring 官方源码子构建，不新增 conan requirement，保持一库一 PR、只改本目录"
  - "shadowsocks-libev 上游 tests/test.py 硬依赖公网（curl http://www.google.com/ + dig 8.8.8.8:53），离线 CI/真机不可执行；应以等价的离线回环（ss-server + ss-local + SOCKS5 客户端 + 内建源站）复现同一被测链路"
  - "package_type=application 的库，test_package 应把打包出的真实可执行文件当黑盒驱动（本配方用自实现 SOCKS5 客户端 + 内建 HTTP 源站做全链路校验），而不是只链接库头文件"

# ============================================================
# 能力清单（供平台能力地图索引）
# ============================================================

capabilities:
  - "SOCKS5 代理（ss-local）"
  - "Shadowsocks 服务端（ss-server）"
  - "UDP 转发 / DNS 隧道（ss-tunnel）"
  - "透明代理重定向（ss-redir）"
  - "多用户管理（ss-manager）"
  - "AEAD 加密（aes-*-gcm、chacha20-ietf-poly1305）"
  - "流密码（aes-*-cfb/ctr、rc4-md5、salsa20、chacha20）"
