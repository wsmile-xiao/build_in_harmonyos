# 软件级 manifest — shadowsocks-libev
# 文件位置: archives/s/shadowsocks-libev/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: shadowsocks-libev
display: "shadowsocks-libev"
description: "Shadowsocks 协议的 C 实现（基于 libev）——提供 ss-local/ss-server/ss-tunnel/ss-redir/ss-manager 一整套轻量级加密 SOCKS5 代理工具与 libshadowsocks-libev 静态库"
category: network
homepage: "https://github.com/shadowsocks/shadowsocks-libev"
license: GPL-3.0-or-later
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "E007: 上游内置的 GNU config.sub / config.guess 均早于 OHOS。config.sub 不认 ohos 三元组（交叉构建时 'system `ohos' not recognized'）；config.guess 不认真机 uname -s=HarmonyOS（原生构建时 'cannot guess build type'）。需在 build() 内对两者就地插入幂等 fast-path，规范化为 <machine>-unknown-linux-ohos；这两个文件随上游锁定版本，新版本需重新确认"
    - "R40: 必须用官方 release 资产而非 GitHub tag 源码归档——tag 归档不含 submodule 内容，libcork/libipset/libbloom 目录为空且无生成的 configure"
    - "本库硬依赖 mbedtls v2/v3 的经典 cipher API（mbedtls/cipher.h、MBEDTLS_CIPHER_MODE_CFB、mbedtls_md_info_from_string）；制品仓只有 mbedtls/4.1.0（TF-PSA-Crypto，API 已移除），需就地 vendoring 2.28.x LTS"
    - "上游 --with-<dep>=DIR 系列宏只加 -I$DIR/include 与 -L$DIR/lib，不做 pkg-config 探测，Conan 依赖必须显式喂 package_folder（R33：编译器由 AutotoolsToolchain 的 conanbuild env 提供）"
    - "E007 有两个独立识别点：config.sub 不认 --host=aarch64-linux-ohos（交叉构建），config.guess 不认真机 uname -s=HarmonyOS（原生构建，报 cannot guess build type）；两者都要在 build() 内打幂等 fast-path"
    - "真机 SDK 的 <sys/socket.h> 无条件定义 sockaddr_storage，而 <linux/tcp.h> → <linux/socket.h> 也定义，导致 redefinition；需用 -include 预置 _UAPI_LINUX_SOCKET_H 守卫（本地 musl 风格 SDK 因 __MUSL__ 屏蔽而不暴露）"
    - "E011: 真机 HMDFS 上 autoconf 的 `(umask 077 && mktemp -d ./confXXXXXX)` 会得到 drwx--S--- 目录，config.status 写 subs1.awk 报 Permission denied；需在 build() 内把 configure 的 umask 077 改为 022"
    - "内嵌 mbedtls 2.28.10 子构建需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5：其 CMakeLists.txt 声明 cmake_minimum_required(VERSION 2.8.12)，CI/真机 CMake 4.x 已移除 <3.5 兼容（本地 WSL cmake 3.28 不暴露该问题）"
    - "R41: 官方 release 资产**不含 tests/ 目录**（上游 dist 未打包）；上游 tests/test.sh + test.py + 8 个 JSON 只在 GitHub tag 源码归档里（顶层目录 shadowsocks-c-3.3.5），要真实执行上游测试必须从 tag 归档取 tests/"
    - "上游 tests/test.py 默认打公网（google.com + 8.8.8.8），但其 url/dns 是命令行参数：不改上游一行代码，用 --url 指向本机 origin 即可离线真实执行（实测 8/8 通过）；test_package 另提供等价离线回环作为 CI 内的快速门禁，上游测试未接入 automake（无 make check）"
  common_dependencies:
    - "pcre"
    - "libev"
    - "libsodium"
    - "c-ares"
    - "mbedtls (2.x/3.x, vendored)"

verified_on:
  - device: "DAYU200-RK3568 (润和)"
    os: "OpenHarmony 6.0.0.47 (API20, aarch64, 64bit)"
    test: "test_package 端到端回环 4/4 通过"
    evidence: "3.3.5/device-evidence/"

versions:
  - version: "3.3.5"
    status: built
    path: archives/s/shadowsocks-libev/3.3.5
