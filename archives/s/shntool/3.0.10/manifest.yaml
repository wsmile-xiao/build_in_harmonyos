software: shntool
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.10"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/s/shntool/shntool_3.0.10.orig.tar.gz"

  # 源码校验和
  sha256: "74302eac477ca08fb2b42b9f154cc870593aec8beab308676e4373a5e4ca2102"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型（顶层字段）
# cmake | autotools | makefile | meson | custom
build_system: autotools

build:

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 不识别 HarmonyOS，需替换为 automake 最新版本识别 aarch64-unknown-linux-ohos"
  - "HMDFS 限制: config.status 在 HMDFS 上无法创建临时子目录（Permission denied），需手动生成 Makefile/config.h 或使用 autoreconf.hints"
  - "Savannah 源不可用: shntool 3.0.10 官方 Savannah URL 404/SSL失败，需使用 Debian pool orig tarball 替代"
  - "shntool 不支持 --version 参数，使用 -v 查看版本信息"

