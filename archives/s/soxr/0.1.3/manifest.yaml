version: "0.1.3"
software: "soxr"
status: published
build_date: "2026-08-22"
build_system: "cmake"
source:
  url: "https://sourceforge.net/projects/soxr/files/soxr-0.1.3-Source.tar.xz/download"
  sha256: "b111c15fdc8c029989330ff559184198c161100a59312f5dc19ddeb9b5a15889"
  tar_format: tar.xz
build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DWITH_OPENMP=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "soxr 0.1.3 uses cmake_minimum_required(VERSION 3.1) which is unsupported by CMake >= 4.0; use -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "soxr builds as shared library with BUILD_SHARED_LIBS=ON; not a system library so dynamic is fine (R26 exemption)"
  - "9/10 ctest tests pass; lsr-bindings test fails (LSR compatibility wrapper, non-critical)"
