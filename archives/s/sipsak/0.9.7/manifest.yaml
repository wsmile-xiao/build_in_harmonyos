software: sipsak
version: 0.9.7
build_date: 2026-06-04
status: published
build_system: autotools
source_url: https://github.com/nils-ohlmeier/sipsak/releases/download/0.9.7/sipsak-0.9.7.tar.gz
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local
  - CC=/data/service/hnp/bin/clang
  - CFLAGS=-D_GNU_SOURCE
dependencies:
  required: []
  optional:
    - name: openssl
      usage: MD5 implementation
      status: not_used
    - name: gnutls
      usage: MD5 implementation
      status: not_used
    - name: c-ares
      usage: DNS SRV lookup
      status: not_used
    - name: check
      usage: unit tests
      status: skipped
knowledge_gained:
  - E007_old_version_syntax: Old config.guess (2014) requires echo+exit syntax, not GUESS=
  - global_variables_extern: Header files should declare extern, source files define
issues_encountered:
  - E007: config.guess unable to guess HarmonyOS
  - E011: HMDFS umask 077 Permission denied
  - strcasestr_undeclared: Need _GNU_SOURCE for musl libc
  - duplicate_symbols: Global variables not declared as extern
patches_applied:
  - 0001-config.guess.patch (HarmonyOS support)
  - 0002-config.sub.patch (ohos triplet support)
  - 0003-configure.patch (umask 077 -> 022)
  - 0004-sipsak.h.patch (extern declarations)
  - 0005-shoot.h.patch (extern inv_trans)
  - 0006-sipsak.c.patch (global definitions)
build_success: true
package_created: sipsak-0.9.7-ohos-aarch64.tar.gz
package_size: 149KB