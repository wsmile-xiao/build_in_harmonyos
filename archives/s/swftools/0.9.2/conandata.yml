sources:
  url: "https://distfiles.macports.org/swftools/swftools-0.9.2.tar.gz"
  sha256: "bf6891bfc6bf535a1a99a485478f7896ebacbe3bbf545ba551298080a26f01f1"

patches:
  "0.9.2":
    - patch_file: "patches/0001-configure.patch"
      patch_description: "Create configure temporary files under TMPDIR on HMDFS"
      patch_type: "portability"
    - patch_file: "patches/0002-swfs-Makefile.in.patch"
      patch_description: "Fix SWF data installation and use relocatable symlinks"
      patch_type: "bugfix"
    - patch_file: "patches/0003-fix-common-symbol-definitions.patch"
      patch_description: "Give legacy global variables one definition for modern compilers"
      patch_type: "portability"
    - patch_file: "patches/0004-install-destdir.patch"
      patch_description: "Honor DESTDIR when installing programs, manuals, and SWF data"
      patch_type: "portability"
