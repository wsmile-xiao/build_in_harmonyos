package: swftools/0.9.2
homepage: "http://www.swftools.org/"

upstream_check_command: "make -C lib/python test && make -C lib/action test"
upstream_test_in_build: false
upstream_test_command: ""

# The top-level release Makefile has no check/test target. The source archive
# nevertheless declares seven isolated test targets: lib/python test1-test6
# and lib/action test. They are evidence of upstream test definitions, not
# runnable tests for this release: test_create.py, test_combine.py,
# test_simple.py, test_movie.py, test_image.py, test_sprite.py, and
# lib/action/test.c are absent from the 0.9.2 archive. The remaining action
# target also names undeclared legacy t1/JPEG/FreeType dependencies.
upstream_tests:
  - name: lib-python-test1
    file: lib/python/Makefile.in
    source: swftools-0.9.2/lib/python/Makefile.in
    description: "Declared test1 target invokes test_create.py; script is absent from the release archive"
    command: "make -C lib/python test1"
    expected: "not runnable: test_create.py is not shipped"
  - name: lib-python-test2
    file: lib/python/Makefile.in
    source: swftools-0.9.2/lib/python/Makefile.in
    description: "Declared test2 target invokes test_combine.py; script is absent from the release archive"
    command: "make -C lib/python test2"
    expected: "not runnable: test_combine.py is not shipped"
  - name: lib-python-test3
    file: lib/python/Makefile.in
    source: swftools-0.9.2/lib/python/Makefile.in
    description: "Declared test3 target invokes test_simple.py; script is absent from the release archive"
    command: "make -C lib/python test3"
    expected: "not runnable: test_simple.py is not shipped"
  - name: lib-python-test4
    file: lib/python/Makefile.in
    source: swftools-0.9.2/lib/python/Makefile.in
    description: "Declared test4 target invokes test_movie.py; script is absent from the release archive"
    command: "make -C lib/python test4"
    expected: "not runnable: test_movie.py is not shipped"
  - name: lib-python-test5
    file: lib/python/Makefile.in
    source: swftools-0.9.2/lib/python/Makefile.in
    description: "Declared test5 target invokes test_image.py; script is absent from the release archive"
    command: "make -C lib/python test5"
    expected: "not runnable: test_image.py is not shipped"
  - name: lib-python-test6
    file: lib/python/Makefile.in
    source: swftools-0.9.2/lib/python/Makefile.in
    description: "Declared test6 target invokes test_sprite.py; script is absent from the release archive"
    command: "make -C lib/python test6"
    expected: "not runnable: test_sprite.py is not shipped"
  - name: lib-action-test
    file: lib/action/Makefile.in
    source: swftools-0.9.2/lib/action/Makefile.in
    description: "Declared action self-link test requires test.c and legacy t1/JPEG/FreeType dependencies"
    command: "make -C lib/action test"
    expected: "not runnable: test.c is not shipped and dependencies are undeclared"

test_package_tests:
  - file: test_swftools.py
    description: "Checks all 13 packaged tools, compiles a minimal SWF with swfc, and parses it with swfdump"
    command: "python3 test_swftools.py <package>/bin smoke.sc"

assertion_count: 21
