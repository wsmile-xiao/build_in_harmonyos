software: swftools
version: "0.9.2"
status: built
build_date: "2026-06-08"
build_system: autotools

source:
  url: "https://distfiles.macports.org/swftools/swftools-0.9.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options: ["--build=aarch64-unknown-linux-gnu"]
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - 0001-configure.patch
  - 0002-swfs-Makefile.in.patch

knowledge_gained:
  - "swftools configure 使用硬编码 ./confXXXXXX 创建临时文件，需要修改为使用 TMPDIR 环境变量"
  - "swfs/Makefile.in 中的 rm 命令使用了错误的 -o -L 语法，需要修复为标准 rm 命令"
  - "缺少 jpeg/gif/freetype 会禁用部分工具但不影响核心功能"
  - "源码有多处全局变量重复定义 bug（已在之前修复）"

patch_classification:
  - file: 0001-configure.patch
    type: platform_adaptation
    description: "修改 configure 使用 TMPDIR 环境变量创建临时文件，避免权限问题"
    platform_only: true
    guard: null
  - file: 0002-swfs-Makefile.in.patch
    type: bug_fix
    description: "修复 Makefile.in 中错误的 rm 命令语法（-o -L 参数无效）"
    platform_only: false
    guard: null
