# test_package/MANIFEST.yml — spell 1.1
# CI L0e requires this file to exist.

package: spell/1.1
homepage: "https://www.gnu.org/software/spell/"

# spell 1.1 ships no upstream test suite: Makefile.am/in registers an empty
# `check:` target, there is no tests/ directory and no test framework in the
# tarball (verified against the 1.1 release).
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs spell --version (asserts 'GNU Spell 1.1'), --help (asserts 'Usage:'), and the invalid-option getopt error path (asserts non-zero exit)"
    command: "bash test.sh"

# version, help, invalid-option error path
assertion_count: 3
