sources:
  "2.3.2":
    url: "https://github.com/mortie/snow/archive/refs/tags/v2.3.2.tar.gz"
    sha256: "410694deef79fde5d1515e1722d0b2af68cc9d1eef816db4f4495e01ae1f9a6a"

patches:
  "2.3.2":
    - patch_file: "patches/0001-use-prototype-declarations.patch"
      patch_description: "Use void prototypes in generated test functions for modern Clang -Wstrict-prototypes"
      patch_type: "portability"
    - patch_file: "patches/0002-support-incomplete-pointer-types.patch"
      patch_description: "Avoid pointer arithmetic when generic assertions receive pointers to incomplete musl types"
      patch_type: "portability"
    - patch_file: "patches/0003-remove-unused-test-variable.patch"
      patch_description: "Remove a dead counter so the official test harness builds with -Werror"
      patch_type: "bugfix"
    - patch_file: "patches/0004-honor-tmpdir.patch"
      patch_description: "Honor TMPDIR for runtime and maintenance-script temporary files instead of hard-coding /tmp"
      patch_type: "portability"
