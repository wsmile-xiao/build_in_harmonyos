package: snow/2.3.2
homepage: "https://github.com/mortie/snow"

# The upstream Makefile's check target compiles the official test harness twice
# and runs it under Valgrind. The recipe preserves the same source-level suite,
# while running it directly because Valgrind is not available on HarmonyOS PC.
upstream_check_command: "compile test/cases/*.c and test/test.c; run test-snow -q"
upstream_test_in_build: true
upstream_test_command: "test-snow -q"

upstream_tests:
  - file: "test/test.c and test/cases/*.c"
    source: "snow-2.3.2/test/"
    description: "Official Snow regression suite covering assertions, command-line filtering, logging, and before_each/after_each behavior"
    command: "./test-snow -q"

test_package_tests:
  - file: test_snow.c
    description: "Consumer test using Snow integer, string, buffer, and incomplete-pointer assertion APIs"
    command: "./test_snow --no-color --no-timer --no-maybes"
  - file: test_tmpdir.c
    description: "Regression test proving --gdb honors TMPDIR instead of hard-coding /tmp"
    command: "TMPDIR=/data/local/tmp SNOW_EXPECTED_TMP_TEMPLATE=/data/local/tmp/snow.XXXXXX ./test_tmpdir --gdb"

assertion_count: 156
