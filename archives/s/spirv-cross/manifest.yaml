software: spirv-cross
display: "SPIRV-Cross"
description: "KhronosGroup 的 SPIR-V 着色器交叉编译器，支持 GLSL、HLSL、MSL、C++ 等后端输出"
category: graphics
homepage: "https://github.com/KhronosGroup/SPIRV-Cross"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "零适配软件：无需任何源码修改即可编译成功"
    - "CMake 显示 'System is unknown' 警告，不影响编译结果"
    - "所有产物为静态库(.a)和CLI工具，无动态库(.so)"
    - "官方测试套件需要 glslang/SPIRV-Tools，standalone 构建不包含测试"
    - "版本号双体系：vulkan-sdk tag(1.4.341.0) 和 pkg-config(0.68.0)"
    - "静态库链接顺序：c → core + glsl + util"
    - "平台 lld 缺 libxml2，手动链接 C API 静态库受限（不影响 CMake 构建）"
  common_dependencies: []

versions:
  "1.4.341.0":
    status: published
    build_date: "2026-06-02"
    configure_options:
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DCMAKE_C_COMPILER=clang"
      - "-DCMAKE_CXX_COMPILER=clang++"
    patches: []
    build_cleanliness: clean