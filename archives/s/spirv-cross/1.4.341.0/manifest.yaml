software: spirv-cross
# 版本级 manifest 模板
# 文件位置: archives/s/spirv-cross/1.4.341.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.341.0"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/KhronosGroup/SPIRV-Cross/archive/refs/tags/vulkan-sdk-1.4.341.0.tar.gz"

  # 源码校验和
  sha256: "b2665ac9ddb65ff75a7ca2f6d410e73da443692742a1e3a5b7728ca6069a400c"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 构建清洁度
  build_cleanliness: clean
  # clean = 无源码修改; patched = 需补丁; workaround = 有技术债务

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "SPIRV-Cross在HarmonyOS上无需任何源码修改即可直接编译成功（零适配软件）"
  - "CMake在HarmonyOS上显示'System is unknown'警告，但不影响编译器检测和构建结果"
  - "SPIRV-Cross的vulkan-sdk tag版本号(1.4.341.0)与pkg-config内部版本号(0.68.0)不同，两个版本体系"
  - "SPIRV-Cross静态库链接需按依赖顺序：c → core + glsl + util"
  - "HarmonyOS平台lld链接器缺失libxml2.so.16，影响C API静态库的手动链接测试"
  - "SPIRV-Cross官方测试套需glslang/SPIRV-Tools，standalone编译不包含测试"

# ============================================================
# 产物信息
# ============================================================

products:
  binaries:
    - name: spirv-cross
      path: bin/spirv-cross
      type: executable
      size: "4.0M"
  libraries:
    - name: libspirv-cross-core.a
      path: lib/libspirv-cross-core.a
      type: static
      size: "1.0M"
      description: "核心IR解析和CFG分析"
    - name: libspirv-cross-glsl.a
      path: lib/libspirv-cross-glsl.a
      type: static
      size: "2.4M"
      description: "GLSL/Vulkan GLSL后端"
    - name: libspirv-cross-hlsl.a
      path: lib/libspirv-cross-hlsl.a
      type: static
      size: "1.3M"
      description: "HLSL后端"
    - name: libspirv-cross-msl.a
      path: lib/libspirv-cross-msl.a
      type: static
      size: "3.4M"
      description: "Metal Shading Language后端"
    - name: libspirv-cross-cpp.a
      path: lib/libspirv-cross-cpp.a
      type: static
      size: "225K"
      description: "C++后端（已标记DEPRECATED）"
    - name: libspirv-cross-reflect.a
      path: lib/libspirv-cross-reflect.a
      type: static
      size: "158K"
      description: "JSON反射后端"
    - name: libspirv-cross-util.a
      path: lib/libspirv-cross-util.a
      type: static
      size: "21K"
      description: "工具辅助库"
    - name: libspirv-cross-c.a
      path: lib/libspirv-cross-c.a
      type: static
      size: "190K"
      description: "C API封装（pkg-config: spirv-cross-c）"