build_system: cmake
configure_command: "mkdir -p build && cd build && cmake -DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ .."
build_command: "cd build && make -j2"
install_command: "cd build && make install DESTDIR=__DESTDIR__"
