software: scc
build_system: custom
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.6.0-r5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.6.0-r5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/boyter/scc/archive/refs/tags/v3.6.0.tar.gz"

  # 源码校验和
  sha256: "15e09f446ee44f3ebdb59f55933128256588d0343988692f1064b9bfb4f96dd7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0 go build -o scc ."
    - "GOROOT=$HOME/usr/local/go"
    - "GOPROXY=https://goproxy.cn,direct"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.24.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /data/storage/el2/base/cache/builds/scc-3.6.0-r5.orig
  source_work_dir: /data/storage/el2/base/cache/builds/scc-3.6.0-r5.work
  source_orig_hash: 942c8f312fb45160
  source_work_hash: 9a71fa4c2ac0e3ba
  generated_at: '2026-06-04T11:35:11'
  patches_count: 1

patch_classification:
  - file: 0001-go.mod.patch
    type: auto
    platform_only: True
    guard: 'pending'
