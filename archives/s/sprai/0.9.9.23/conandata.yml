# conandata.yml — sprai 0.9.9.23
#
# 源：上游官方 dist 站（主机 zombie.cb.k.u-tokyo.ac.jp 下的 /sprai/dist/ 目录）**已下线**。
#   注：本注释刻意不写带协议前缀的 URL 串 —— CI 的 Pre-download 步骤用正则扫描全文，
#   会把注释里的串也当成下载目标（T124），平白多出必然失败的下载尝试。
#   2026-10-05 实测：该目录下的 sprai-0.9.9.23.tar.gz → HTTP 301 跳到
#   文档站 kasahara-lab.github.io/sprai_doc 的 dist 路径 → HTTP 404。
#   上游文档站 kasahara-lab.github.io/sprai_doc/ 本身 HTTP 200，但其
#   _sources/Download.rst.txt 把所有 dist 链接都写成 Sphinx 注释（`..`），
#   即上游自己已把下载入口下掉；kasahara-lab 仅有 notifier / sprai_doc 两个仓库，
#   没有源码仓库也没有 release 资产。web.archive.org / archive.ph 在本机网络不可达
#   （DNS 解析到 108.160.170.39，连接全部超时），故 Wayback 快照本轮取不到。
#   Debian 侧同一事实有官方记录：debian/README.source「The upstream website
#   vanished.」+ debian/watch 整段被注释掉并注明「Upstream site vanished」。
#
# 因此本配方取 **Debian 官方池的 upstream orig 包**（deb.debian.org 是 Debian 的
# 正式发行归档，不是第三方镜像；本仓库已有 497 个配方走同一来源）。它是上游
# 0.9.9.23 tarball 的 +dfsg1 重打包，删掉的只有 waf/waflib/wscript（上游 waf
# wrapper，本包用裸 makefile 构建，从不使用）与已构建好的 doc/_build/html
# （.html/.js/.inv/_static）——见 debian/copyright 的 Files-Excluded。
# 构建所需的 4 个 .c、col2fqcell.h、makefile、configure、17 个 .pl 全部在包内。
#
# 完整性证据（详见 notes.md §2）：
#   * sha256 与 GPG 签名 .dsc 的 Checksums-Sha256 逐字一致
#     （sprai_0.9.9.23+dfsg1-3.dsc，sha256 50b26cb58aa98a060b4eae9454587417332d03fbea78316743245c626fef651a）
#   * 用 git blob sha1 与独立第三方镜像 frikiluser/sprai（上游 0.9.9.23 源码的
#     逐字副本，已套用 Debian 补丁）逐文件比对：4 个 .c / col2fqcell.h / makefile /
#     configure / 13 个 .pl / ChangeLog.txt / LICENSE.txt 全部 SAME；仅 4 个文件 DIFF，
#     且恰好等于 Debian libexec.patch + example-specs.patch 所改的那 4 个
#     （ec.spec、ezez4makefile_v4.pl、ezez4qsub_vx1.pl、ezez_vx1.pl）——即本包是
#     未打补丁的上游原始内容，不含任何 Debian 改动。

sources:
  url: "https://deb.debian.org/debian/pool/main/s/sprai/sprai_0.9.9.23+dfsg1.orig.tar.xz"
  sha256: "b7190784e07c803e465a07b4b3a0ba086b8c82c93878c4e252e8c715d20d22c2"
  # xz 压缩；Conan 的 get() 按扩展名自动选解压器，不需要（也不能）在这里覆盖格式。

# 上游源码改动仅一处：让 makefile 的 4 条编译规则读 CPPFLAGS/CFLAGS/LDFLAGS，
# 好把 -fsigned-char 送进去。详见 patches/0001-makefile-honour-cflags.patch 的说明。
patches:
  - patch_file: "patches/0001-makefile-honour-cflags.patch"
    patch_description: "makefile: honour CPPFLAGS/CFLAGS/LDFLAGS in the four compile rules so the recipe can inject -fsigned-char (required: col2fqcell.h's `char base` is used with a -1 sentinel in myrealigner.c, and plain char is unsigned by default on aarch64 -> guaranteed SIGSEGV). Same change Debian made in debian/patches/flags.patch (Bug-Debian #956473)."
    patch_type: "portability"
    strip: 1
