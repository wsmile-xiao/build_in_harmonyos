  # 因此取 Debian 官方池的 upstream orig 包（+dfsg1 重打包）。
  url: "https://deb.debian.org/debian/pool/main/s/sprai/sprai_0.9.9.23+dfsg1.orig.tar.xz"
  sha256: "b7190784e07c803e465a07b4b3aba86b8c82c93878c4e252e8c715d20d22c2"
  tar_format: tar.xz
  content_length: 60428
  upstream_repository: "无（上游站 kasahara-lab 只有 notifier / sprai_doc 两个文档仓库，无源码仓库、无 release 资产）"
  upstream_release_page: "https://kasahara-lab.github.io/sprai_doc/Download.html"
  upstream_last_release: "v0.9.9.23 — 2017-02-12（上游 Changelogs）"
  provenance: >-
    sha256 与 GPG 签名 .dsc（sprai_0.9.9.23+dfsg1-3.dsc）的 Checksums-Sha256 逐字一致；
    并以 git blob sha1 与独立第三方镜像 frikiluser/sprai（上游 0.9.9.23 源码逐字副本）
