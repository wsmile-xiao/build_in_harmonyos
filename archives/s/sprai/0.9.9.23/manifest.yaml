# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile            # 上游裸 makefile（小写），只有 all / install 两个 target
  configure_options: []       # tarball 里的 configure 是 waf 包装脚本，本包不可用（见下）
  dependencies: []            # 4 个程序只用 libc，无外部库依赖
  build_tools: []
  cc: clang                   # 取自 self.conf["tools.build:compiler_executables"]["c"]
  cflags: "-O3 -fsigned-char" # -fsigned-char 是**必需项**，见 notes.md §4.1
  in_source_build: true       # 编译规则全是相对路径，无 srcdir/builddir 概念
  upstream_make_targets: ["all", "install"]
  unused_configure: >-
    tarball 里的 ./configure 只是 waf 的 wrapper（生成 Makefile 后调 waf），
    而 +dfsg 重打包按 debian/copyright 的 Files-Excluded 删掉了 waf/waflib/wscript，
    所以它在本包里根本跑不起来。Debian 自己也是用 --buildsystem=makefile 构建的。

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - patches/0001-makefile-honour-cflags.patch

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "sprai 可编译部分是 4 个纯 C 程序，彼此用管道串成四段流水线：bowtie -m5 → m52bfmt7 → blastn -outfmt 7 风格表格 → bfmt72s → sprai 私有 SAM（带 AS:i:/EV:Z:/PI:Z: 标签）→ nss2v_v3 → 纵向比对 .nss → myrealigner → 共识 FASTA/FASTQ。它的功能本质就是这四段之间的格式转换契约，所以消费者测试可以直接对手写最小输入逐字段断言每一级 stdout"
  - "【必需适配】aarch64 上 plain char 默认无符号，而 col2fqcell.h 的 `char base` 在 myrealigner.c 里被用 -1 当哨兵（628/745/977/1007 行）→ `base != -1` 恒真 → 片段链表 walk 出界 → myrealigner **每次调用都 SIGSEGV**。clang 编译期就报了 -Wtautological-constant-out-of-range-compare。必须 -fsigned-char（复现作者在 x86 上的假设）。Debian 的 flags.patch 是同一个问题，但只为了让 dpkg-buildflags 传得进去"
  - "上游 makefile 把 `$(CC) -Wall -O3 -g` 硬编码在 4 条规则里，命令行传 CFLAGS= 完全无效。patches/0001-makefile-honour-cflags.patch 把它们改成 $(CPPFLAGS) $(CFLAGS) $(LDFLAGS)（与 Debian flags.patch 同款）后，配方才能注入 -fsigned-char"
  - "conandata.yml 的 patches 必须写成 list-of-dict 且用 patch_file/strip 键；写成 dict-of-filename（键直接是补丁文件名）时 conan 2.29.1 的 apply_conandata_patches 会**静默什么都不做** —— 构建照样 rc=0，但补丁根本没上（本次踩过，靠编译命令里 `-O3 -fsigned-char` 缺席发现）"
  - "Conan 2 的 conf 键名会校验：`self.conf.get(\"tools.build:compiler_executables:c\", ...)` 在 2.29.1 上抛 ConanException（conan config list 里只登记了 tools.build:compiler_executables 这一个 dict conf）。仓库里 2093 处用的是取整个 dict 再 ['c']，30 处用 :c 子键的那批是坏的"
  - "conan.tools.files.copy() 传空格分隔的多模式（\"a b c\"）对顶层文件**不生效且不报错**；pattern 里带 '/' 时又会**保留**相对路径而不拍平。逐文件 copy 才可靠，文档要从 doc/_build/html/_sources/ 直接 src + '*.txt'"
  - "nss2v_v3 拒绝输出，除非输入里至少有一条 qname==rname 的 ref-ref 记录（nss2v_v3.c:914-926，靠它初始化投票列）。bfmt72s 的 -i 开关正是为此存在（把被比对的 query 当 reference 输出）。写端到端测试数据时这条是必需的第一条记录"
  - "nss2v_v3 的输入必须按「染色体名 → evalue → bitScore」排序（它靠相邻染色体切换来 flush 投票列），否则跨区段投票会错"
  - "上游 3 个程序在 getopt 的 case '?' 里 printf(\"humei\\n\")（bfmt72s.c:347 / m52bfmt7.c:48 / nss2v_v3.c:827），是作者留下的调试残留。任何非法选项都会往 stdout 打若干行 humei，别当成包损坏"
  - "上游 4 个工具都没有 --version / --help，全走 getopt 遇未知选项即 usage + 非零退出。所以 CI 的 L2 冒烟门禁（--version 否则 --help）必然走 [warn] 分支——非阻塞，属预期"
  - "m52bfmt7.c:143 会把 qname 最后一个 '/' 之后的内容截掉（PacBio read 名 `m54011_160228_421428_s1_p0/1` → `m54011_..._p0`）；-s（swap query/subject）选项在该版本里只置了个没人读的变量，是死开关"
  - "上游 bug（不在本轮修复范围，仅记录）：bfmt72s.c:707/711/839 用 abs() 处理 double 型 bitscore，clang 报 -Wabsolute-value。bitscore 为负时会得到无意义结果。默认路径上 bitscore 恒为正故无实际影响，但 -i 模式下要注意"
  - "上游把已构建好的 sphinx 产物（doc/_build/html/_sources/*.txt）打进 tarball，Debian 拿其中 6 个当文档/示例；本包原样保留，它们是上游唯一的用户文档"
  - "制品仓里既没有 OHOS aarch64 的 perl 也没有 blast（conan list \"perl/*@ohpcd/stable\" -r=ohpcd → 0 recipes），17 个 .pl 驱动脚本无法在 OHOS 上运行，故装到 share/sprai/ 作参考载荷而不是 bin/ 命令"

upstream_tests:
  exists: false
  test_count: 0
  command: "N/A: makefile（小写）只有 all / install 两个 target，make -n check 报 'No rule to make target'；tarball 里也没有 tests/ 目录或测试脚本"
  notes: "上游既无 make check 也无 test/ 目录；不得用 test_package 冒充上游测试。真实覆盖由 test_package 的消费者断言承担（93 静态 + 26 运行）。"

test_package:
  assertion_count: 119
  static_assertion_count: 93
  runtime_assertion_count: 26
  description: >-
    消费者测试两段。静态段 93 条，任何环境都跑：bin/ 恰好是 makefile COMPILED 的
    4 个目标（多一个少一个都判失败）、四个目标必须是四份互不相同的普通文件
    （symlink / 同一份内容改名都判失败）、每个 ELF 的 ELF64/LE/EM_AARCH64(0xB7) 头、
    PT_INTERP 为 OHOS aarch64 加载器（musl/glibc 两形态均接受）、DT_NEEDED 含 libc.so、share/sprai 下
    17 个 .pl 带 perl shebang、ec.spec/pbasm.spec/6 份上游文档/LICENSE.txt 为
    MIT 全文、以及「包内无外来架构 ELF 残留」。运行段 26 条，仅 can_run() 为真
    时执行：4 个工具的 usage 横幅 + myrealigner -l 0 拒绝路径，
    m52bfmt7 → bfmt72s -i → nss2v_v3 -v 3 → myrealigner 四段流水线每一级的
    stdout 逐字段精确比对、整条管道的 shell 管道端到端比对（myrealigner -f -c
    出 FASTQ），以及 4 条错误路径（m5 畸形行 / -u -U 互斥 / -v 0 / SAM 截断）。
    文件自带三条反假绿守卫：运行段真实 fork 的子进程数 >=15、静态段断言数 >=55、
    总断言数 >=80 —— 防止「删掉深层断言 / 让 run() 不执行」后仍报 pass。

quality_gates:
  W0_dependencies: "零依赖：4 个程序只 include stdio/stdlib/string/unistd/getopt/ctype/assert，无外部库。"
  W1_source: "C 项目 + 裸 makefile；公开命令 m52bfmt7 / bfmt72s / nss2v_v3 / myrealigner（管道串联）。"
  W4_local: >-
    通过。2026-10-05 本地 WSL aarch64/OHOS 交叉编译
    （-pr:h=ohos-aarch64-wsl-xbuild -pr:b=default --build=missing，
    CC=/opt/lpk-fixed/clang，target aarch64-unknown-linux-ohos）
    conan create EXIT_RC=0；package
    sprai/0.9.9.23#4970b7b49b9037e6dac13dfd53a23d31:6b129b068851896169fae42d399fa922d239ce8a。
    编译行确认补丁与必需 flag 都到位：/opt/lpk-fixed/clang -O3 -fsigned-char -o myrealigner myrealigner.c。
    test_package 静态段 93 passed / 0 failed，运行段（--runtime，qemu aarch64）119 passed / 0 failed。
    bin/bfmt72s 29960 字节
    sha256=b56d9e26a62b4f849c8b33981d1d241c6265c09840e3791f15128866029961f6，
    nss2v_v3 34736 / ca15fb31b42f3ebc00dd42a51ae6f073e012ee931ba9fdefae8272565a0e27c3，
    myrealigner 36544 / 3330c2235752ab676f7f6d605acb24dbbcfd9ae11bf591773fbce9c2f0ed2879，
    m52bfmt7 16712 / 5d74865cbdb34ae91984a8c8697cd63b603730b218a582f747c7a89261528b99。
    file(1) 四个均为 'ELF 64-bit LSB pie executable, ARM aarch64 … interpreter
    /lib/ld-linux-aarch64.so.1'（本机交叉 profile 形态；CI 真机 worker 为 musl 的
    /lib/ld-musl-aarch64.so.1，两者都是 OHOS aarch64 加载器）；DT_NEEDED 只有 libc.so。
  W5_shadow_ci: >-
    已跑。本地同源门禁（ci/conan/build_and_test.sh，zsh，JUNK_PR_DIFF 喂真实 PR diff）
    L0/L1/L2/L4/L5 全绿；真机 CI 由 PR !14783 的构建接手，结论见 PR 评论流。
  R26_static_system_lib: "不适用：包内无 .so，也无同名系统库风险；4 个 ELF 只动态依赖 OHOS libc.so。"
  R40_scope_note: >-
    纯文本/比对学工具，无 EGL/GLES/Vulkan/X11/Wayland 窗口系统与 GPU 依赖。
    运行期外部依赖（Perl / NCBI BLAST+ / Celera Assembler）在 OHOS 制品仓里
    都不存在，因此端到端跑整条 sprai 流水线需要自行准备这三者；本包只提供
    4 个 C 程序与其转换契约。
  R38_commands_json: "已补 archives/s/sprai/commands.json（type=tool，binary=true）。"
  L1_no_official_test: >-
    上游零测试目标，需要 L1 上游测试豁免。**本 PR 不改 ci/**（R21 把 ci/ 列为
    协作者越权目录），因此需要维护者在 ci/config/no_official_test.txt 侧统一加入
    sprai；此前 PR 里加过该行，已按评审意见 192538236 撤回。
  L2_smoke: >-
    预期 [warn]（非阻塞）：上游 4 个工具都没有 --version/--help，getopt 遇未知
    选项即打 usage 并非零退出。已在 notes.md §7 记录，不做粉饰。
  ELF_signing: >-
    本机没有 binary-sign-tool，package() 走 warning 分支跳过自签。真机 HMDFS
    拒绝执行未签名 ELF，若 CI 上报 PermissionError errno 13，优先查签名工具是否
    可用（user.ohos:sign_tool / OHOS_SIGN_TOOL / /data/service/hnp/bin/binary-sign-tool）。

