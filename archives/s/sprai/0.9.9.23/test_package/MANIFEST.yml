# test_package/MANIFEST.yml — sprai 0.9.9.23
package: sprai/0.9.9.23
homepage: "https://kasahara-lab.github.io/sprai_doc/"

# 上游测试命令：makefile（小写）只有 all / install 两个 target，没有 check/test
# 目标，tarball 里也没有 tests/ 目录或测试脚本。因此 L1 上游测试按
# 白名单豁免（需维护者在 ci/config/no_official_test.txt 侧加入 sprai，
# 本 PR 不改 ci/，见 manifest.yaml 的 L1_no_official_test）。
upstream_check_command: "make -n check  ->  'make: *** No rule to make target 'check''"

upstream_test_in_build: false
upstream_test_command: "N/A"

upstream_tests: []

test_package_tests:
  - file: test_sprai.py
    description: >-
      消费者测试。静态段（任何环境都跑，93 条）：bin/ 恰好 4 个上游 ELF 目标、
      四个目标互为 symlink 判失败、sha256 互不相同（挡住「一个桩改名 4 次」）、
      ELF64/LE/EM_AARCH64 头、PT_INTERP 为 OHOS aarch64 加载器（musl/glibc 两形态均接受）、
      DT_NEEDED 含 libc.so、share/sprai 下 17 个 perl 驱动脚本带 perl shebang、
      ec.spec/pbasm.spec/6 份上游文档/LICENSE.txt(MIT)、包内无外来架构 ELF 残留。
      运行段（仅 can_run，26 条）：4 个工具的 usage 横幅与 myrealigner -l 0 拒绝路径，
      以及 m52bfmt7 → bfmt72s -i → nss2v_v3 -v 3 → myrealigner 四段流水线的
      逐字段精确输出比对 + 整条管道的 shell 管道端到端比对 + 4 条错误路径。
      另有三条反假绿守卫：运行段必须真实 fork 出 >=15 次子进程、静态段断言数
      >=55、总断言数 >=80（挡住「把深层断言整段删掉仍然报 pass」）。
    command: "python3 test_sprai.py <package_folder> [--runtime]"

# 静态段 93 条恒跑；运行段 26 条仅在 can_run() 为真时执行 → 上限 119。
# 两个下界守卫（STATIC_MIN_ASSERTIONS / MIN_ASSERTIONS）刻意低于实测值。
assertion_count: 119
