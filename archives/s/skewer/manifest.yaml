# 软件级 manifest — skewer
software: skewer
display: "skewer"
description: "NGS reads 适配子修剪与质量过滤工具（bit-masked k-difference matching，单端/双端/LMP）"
category: bioinformatics
homepage: "https://github.com/relipmoc/skewer"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游只有一个裸 Makefile（无 configure/CMake/autotools），构建为 in-source；配方用 make 命令行注入 CXX（R33 从 conan conf 取 clang++ 路径）即可，零源码补丁"
    - "Makefile:3 的 CXXFLAGS?=-c 是编译规则的命脉，配方刻意不覆盖 CXXFLAGS（实测覆盖会把每条编译变成链接并死在 ld.lld undefined symbol）"
    - "上游 install 是 mv -f skewer /usr/local/bin：无 PREFIX/DESTDIR 且搬离构建树 ⇒ package() 自己 copy bin/skewer，产物内不留任何宿主绝对路径"
    - "零外部库依赖：4 个 .cpp + 4 个 .h 纯 C++/POSIX，只链 -pthread 与 -lrt（OHOS musl sysroot 提供），不含 libpng/jpeg/webp/sixel 等任何图像后端"
    - "上游无任何测试套件（10 文件清点 + make -n check 无目标 + 无测试源）；test_package 新增 9 条鸿蒙消费者断言（版本/用法/参数诊断/ELF 架构/解释器/NEEDED/OHOS 标记/无宿主路径/真实 FASTQ 剪切断定）"
  common_dependencies: []

versions:
  "0.2.2":
    status: built
    build_date: "2026-09-26"
    conan_ref: "skewer/0.2.2"
