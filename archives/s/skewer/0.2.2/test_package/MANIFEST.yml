# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e / PF3 强制要求；口径见 docs/TEST_QUALITY_SPEC.md）
#
# 三条清点证据（全部在 B 机 HarmonyOS PC 上对官方 tar 包实拉后实测，2026-09-26）：
#   证据 1 — 无测试目录：
#       $ ls -d tests test t
#       ls: tests: No such file or directory
#       ls: test:  No such file or directory
#       ls: t:     No such file or directory
#   证据 2 — 无 check 目标（GNU make 4.4.1 实测原文）：
#       $ make -n check
#       make: *** No rule to make target 'check'.  Stop.
#       （Makefile 的 .PHONY 只声明 all debug clean，全文无 check/test 目标）
#   证据 3 — 文件清单内无测试源（解包后共 10 个文件，逐文件枚举）：
#       LICENSE  Makefile  README.md
#       src/common.h  src/fastq.cpp  src/fastq.h  src/main.cpp
#       src/matrix.cpp  src/matrix.h  src/parameter.cpp  src/parameter.h
#       → 4 个 .cpp 全是实现（main/参数解析/评分矩阵/FASTQ 读写），
#         4 个 .h 全是接口；无 *_test.* / test_*.* / *_check.*，
#         无 gtest/pytest/criterion 等任何测试框架绑定，README 亦无测试章节。
# 结论：上游静态测试总数 = 0（如实申报，不以"平台限制/没环境"作理由）。

package: skewer/0.2.2
homepage: "https://github.com/relipmoc/skewer"

# 上游无测试套件 ⇒ check 命令不适用（对齐 osmctools/0.9、bwm/0.6.3 的
# upstream_tests_exist:false 口径：清单器凭此字段判"上游是否存在测试命令"）
upstream_check_command: ""

# conanfile.py build() 未集成上游测试：上游根本没有可集成的测试目标
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（清点结果：0 个，见顶部三条证据）
upstream_tests: []

upstream_tests_exist: false
upstream_test_audit:
  source_tarball: "skewer-0.2.2.tar.gz (relipmoc/skewer tag 0.2.2，无 v 前缀)"
  source_sha256: "bc37afccdf55de047502b87fe56d537cdf78674ccaec1a401b2d29552d6b2dfc"
  source_origin: "https://github.com/relipmoc/skewer/archive/refs/tags/0.2.2.tar.gz"
  file_count: 10
  top_level_files:
    - file: "Makefile"
      role: "唯一构建入口：.PHONY 仅 all debug clean；4 条编译规则 + 1 条链接规则 + install(mv 到 /usr/local/bin)"
      test_targets: "none（无 check/test 目标；make -n check 报 No rule to make target）"
      is_test: false
    - file: "README.md"
      role: "用法与安装说明（make / sudo make install），无测试章节"
      test_targets: "none"
      is_test: false
    - file: "LICENSE"
      role: "MIT 许可证文本"
      test_targets: "none"
      is_test: false
    - file: "src/main.cpp"
      role: "CLI 入口：参数解析分派 + 多线程调度 + 统计输出"
      test_targets: "none（无 TEST()/def test_ 等测试包裹）"
      is_test: false
    - file: "src/parameter.cpp + src/parameter.h"
      role: "参数/选项解析（getopt_long 表）、用法与版本打印"
      test_targets: "none"
      is_test: false
    - file: "src/matrix.cpp + src/matrix.h"
      role: "k-difference 位掩码匹配核心算法"
      test_targets: "none"
      is_test: false
    - file: "src/fastq.cpp + src/fastq.h"
      role: "FASTQ 读写与格式探测"
      test_targets: "none"
      is_test: false
    - file: "src/common.h"
      role: "公共宏/常量"
      test_targets: "none"
      is_test: false
  scanned_for:
    - "tests/ / test/ / t/ / spec/ 目录"
    - "make check / make test 目标（Makefile 全文 + .PHONY 列表）"
    - "*_test.c / *_test.cpp / test_*.py / *check*.c 测试源"
    - "gtest TEST( / TEST_F( / pytest def test_ / ctest add_test / meson test 注册"
  scan_result: "0 matches — 官方归档 10 个文件逐文件核对：无测试目录、无 check/test 目标、无测试源、无测试框架绑定"
  make_check_output: "make: *** No rule to make target 'check'.  Stop."
  reason: "skewer 0.2.2 上游（relipmoc/skewer，自 SourceForge 迁移）是纯 CLI 生信工具，发布包不含任何测试套件，上游静态测试总数为 0"

# ── test_package 自带的消费者测试（本包唯一的行为验证层）─────────────────
# 执行方式：test_package/conanfile.py 的 test() 用 /bin/sh 调 test_skewer.sh，
# 传入**已安装包**的 bin/skewer 绝对路径 + 可写 scratch 目录，逐条断言并打印
# 机器可读标记 HMBS_TEST_PACKAGE_RESULT（discovered/passed/failed/skipped）。
test_package_tests:
  - file: test_skewer.sh
    description: "A1 skewer --version 精确输出 'skewer version: 0.2.2' 与作者行且 rc=0（稳定字符串断言，非恒真 rc）"
    command: "skewer --version"
  - file: test_skewer.sh
    description: "A2 skewer --help 打印完整用法：标题行 + 'USAGE: skewer [options] <reads.fastq> [paired-reads.fastq]' + Adapter 选项段"
    command: "skewer --help"
  - file: test_skewer.sh
    description: "A3 无参数调用返回 rc=1 并给出参数解析层诊断（'skewer (0.2.2): No input file specified' + 'Usage: skewer [options] <file> [file2]'）"
    command: "skewer"
  - file: test_skewer.sh
    description: "A4 版本格式串确实内嵌在产物字节里（先 tr 去 NUL 再 grep，绕开 toybox grep 对二进制的静默失配；证明被测物即 0.2.2 构建）"
    command: "grep -a 'skewer version: ' bin/skewer"
  - file: test_skewer.sh
    description: "A5 平台断言·ELF 架构：ELF64 + Machine AArch64 + Type DYN(PIE)"
    command: "llvm-readelf -h bin/skewer"
  - file: test_skewer.sh
    description: "A6 平台断言·解释器：.interp 与 readelf -l 双向一致为 /lib/ld-musl-aarch64.so.1（musl 而非 glibc）"
    command: "llvm-readelf -p .interp bin/skewer"
  - file: test_skewer.sh
    description: "A7 平台断言·NEEDED 集合：仅 libc.so(musl) + libc++_shared.so(OHOS)，显式排除 libc.so.6/libpthread.so.0/librt.so.1/libm.so.6/libdl.so.2/libgcc_s.so.1"
    command: "llvm-readelf -d bin/skewer"
  - file: test_skewer.sh
    description: "A8 平台断言·OHOS 标记与路径：.codesign 恰 1 个 + .note.ohos.ident 存在 + 无 RPATH/RUNPATH；另附产物内无宿主绝对路径（/storage /home /data/service/hnp /tmp /build）的静态扫描证据行"
    command: "llvm-readelf -SW bin/skewer"
  - file: test_skewer.sh
    description: "A9 功能断言：8 条 100bp 读段的 FASTQ 经 skewer -t 1 -x AGATCGGAAGAGC -o t in.fastq 全管线处理，序列与质量行均恰为 42bp（适配子整段剪除）、stdout 报 '8 reads processed'、t-trimmed.log 点名 in.fastq 与 t-trimmed.fastq"
    command: "skewer -t 1 -x AGATCGGAAGAGC -o t in.fastq"
  - file: test_skewer.sh
    description: "A10 缺陷回归断言：奇数条（5 条）100bp 读段的 FASTQ 经 skewer -t 1 -x AGATCGGAAGAGC -o t5 in5.fastq 必须 5 进 5 出 —— stdout 报 '5 reads processed'、t5-trimmed.fastq 内 5 条且 @read5 仍在、序列与质量行长度均 42bp、且输出里 0 条 'Malformed fastq record'（EOF 被误读成解析错误的指纹）。钉死上游 cFQ::tag / readRecord 局部 c 用 plain char 承接 fgetc() 再比 EOF 的缺陷（知识库 DRAFT-8543；本包 patches/0001-fix-char-eof-sentinel.patch）；修复前实测 5 进 4 出"
    command: "skewer -t 1 -x AGATCGGAAGAGC -o t5 in5.fastq"

# 断言总数（与 test_skewer.sh 的 TOTAL=10、HMBS 标记 discovered=10 同源）
assertion_count: 10

