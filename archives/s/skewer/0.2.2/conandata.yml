# conandata.yml — skewer 0.2.2
# 官方源码：GitHub relipmoc/skewer 的 tag `0.2.2`（该 tag 无 `v` 前缀）。
# sha256 由本窗在 B 机（HarmonyOS PC）上 curl 实拉后 sha256sum 自算核对
# （2026-09-26，与 Debian .orig 逐字节相同，但 deb.debian.org 属 PF7 拉黑的
# Debian 下游重打包源，故 conandata 只写 GitHub 官方 tag 址，不加镜像、不改哈希）。

sources:
  url:
    - "https://github.com/relipmoc/skewer/archive/refs/tags/0.2.2.tar.gz"
  sha256: "bc37afccdf55de047502b87fe56d537cdf78674ccaec1a401b2d29552d6b2dfc"

# 两处**构建系统**缺陷（Makefile 烧死 g++、install 烧死 /usr/local/bin）用
# 「make 命令行变量覆盖」+「package() 自己 copy」解决，不动源码树。
# 第三处是**运行期可移植性**缺陷：上游用 plain char 承接 fgetc() 再与 EOF 比较，
# 而 OHOS 目标的 plain char 默认无符号 ⇒ EOF 不可表示 ⇒ 奇数条 FASTQ 丢最后一条。
# 这个只能改源码，故本配方带**一个**补丁：只把两个 EOF 哨兵的接收变量类型
# char → int（两行、无平台宏、不动算法），处方出处为知识库条目
# DRAFT-8543-plain-char-eof-sentinel-infinite-loop。机制详见 conanfile.py 模块文档
# 第 3 条与 notes.md §10。
# 注：sha256 是给人/工具核对补丁内容用的；conan 的 apply_conandata_patches 只把
# 未知键透传进 **kwargs 做日志，不会自己校验（写法照 archives/a/aa3d/1.0 先例）。
patches:
  - patch_file: "patches/0001-fix-char-eof-sentinel.patch"
    patch_description: "Widen the two fgetc() receivers used as EOF sentinels (cFQ::tag in src/fastq.h, the local c in cFQ::readRecord) from char to int so EOF stays representable on plain-char-unsigned targets; fixes dropping the last record of any FASTQ whose record count is odd"
    patch_type: "portability"
    sha256: "74803cdfd9739b3454049f0c76ff1c2fafddf3202825de286375c3cff9791fb2"
