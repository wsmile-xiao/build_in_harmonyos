# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.2"

# 软件名
software: "skewer"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/relipmoc/skewer/archive/refs/tags/0.2.2.tar.gz"

  # 源码校验和
  sha256: "bc37afccdf55de047502b87fe56d537cdf78674ccaec1a401b2d29552d6b2dfc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: ["0001-fix-char-eof-sentinel.patch"]
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: ["裸 Makefile 的 CXX=g++ 属变量赋值型，make CXX=<clang++ 绝对路径> 命令行覆写即可（E053 / DRAFT-cohomcalg-0.32-makefile-gxx-override 同型，非 jnoise 那种规则命令位字面量型）", "上游 install 段是 mv -f skewer /usr/local/bin 且完全忽略 DESTDIR ⇒ 不调用 make install，由 package() 自行 copy 落包", "上游 CXXFLAGS?=-c 里的 -c 是编译规则命脉，覆写 CXXFLAGS 会把每条编译变成链接（ld.lld: undefined symbol）⇒ 刻意不动 CXXFLAGS", "plain char 无符号（CHAR_MIN=0、__CHAR_UNSIGNED__）⇒ fgetc 的 EOF 存不进 char；readRecord 因此在 EOF 返回 -2，被 main.cpp 的 rc < -1 当错误分支整块丢弃 ⇒ 奇数条输入必然丢最后一条；补丁把两处接收变量 widen 成 int"]
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
