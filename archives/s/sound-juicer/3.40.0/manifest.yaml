software: sound-juicer
version: "3.40.0"
status: built
build_date: "2026-09-17"

source:
  url: "https://download.gnome.org/sources/sound-juicer/3.40/sound-juicer-3.40.0.tar.xz"
  sha256: "2ee882744391beb4c6d64a0f6825fb765510b706ec2b704bfb42e42afaae1de6"
  tar_format: tar.xz

build:
  system: meson
  configure_options: []
  dependencies:
    - glib/2.84.0.1
    - gstreamer/1.28.3
    - gtk/3.24.43
    - gsettings-desktop-schemas/49.1
    - iso-codes/4.20.1
    - zlib/1.3.1.1 (force=True, resolves the gtk/gstreamer zlib graph conflict)
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-libjuicer-meson.build.patch"
  - "0002-libjuicer-sj-metadata-musicbrainz5.c.patch"
  - "0003-libjuicer-sj-metadata-getter.c.patch"
  - "0004-meson.build.patch"
  - "0005-src-sj-extracting.c.patch"
  - "0006-libjuicer-stub-ohos.c.patch"
  - "0007-stubs-headers.patch"
  - "0008-data-meson-build.patch"

knowledge_gained:
  - "gtk/3.24.43 pins glib/2.84.0.1 (zlib/1.3.1.1) while gstreamer/1.28.3 pins glib2/2.88.0 (zlib/1.3.1): a consumer needing both must force one zlib version; PkgConfigDeps then gives the canonical glib-2.0.pc name to the glib package, so everything links one shared glib"
  - "conan's patch_ng cannot parse/apply the previous 'diff -ruN a/x b/x' new-file patches (no timestamps); patches must be git-style '--- /dev/null' or carry timestamps"
  - "meson gnome module resolves glib-compile-schemas/resources via the gio-2.0.pc variable; the conan-generated pc lacks it — append glib_compile_* variables pointing at signed tool copies"
  - "glib built with proxy-libintl maps gettext() to g_libintl_*; append -lintl to glib-2.0.pc Libs for consumers"
