# conandata.yml — sound-juicer 3.40.0
# Source: GNOME official download server (R39)

sources:
  url: "https://download.gnome.org/sources/sound-juicer/3.40/sound-juicer-3.40.0.tar.xz"
  sha256: "2ee882744391beb4c6d64a0f6825fb765510b706ec2b704bfb42e42afaae1de6"

patches:
  - patch_file: "patches/0001-libjuicer-meson.build.patch"
    patch_description: "Add stub-ohos.c to the libjuicer static library sources."
    patch_type: "portability"
  - patch_file: "patches/0002-libjuicer-sj-metadata-musicbrainz5.c.patch"
    patch_description: "Wrap the musicbrainz5 metadata backend in HAVE_STUB_DEPS and provide a minimal GObject stub implementation."
    patch_type: "portability"
  - patch_file: "patches/0003-libjuicer-sj-metadata-getter.c.patch"
    patch_description: "Use the bare gdesktop-enums.h include under HAVE_STUB_DEPS (the conan gsettings-desktop-schemas package points its pkg-config Cflags into include/gsettings-desktop-schemas/)."
    patch_type: "portability"
  - patch_file: "patches/0004-meson.build.patch"
    patch_description: "Root meson.build OHOS changes: stubs include dir, HAVE_STUB_DEPS flag, optional deps for unavailable libraries, gmodule-2.0 rename, drop gst-inspect runtime check, skip po/help/tests subdirs."
    patch_type: "portability"
  - patch_file: "patches/0005-src-sj-extracting.c.patch"
    patch_description: "Skip the X11 gdkx.h include under HAVE_STUB_DEPS (no X11 display server on OHOS)."
    patch_type: "portability"
  - patch_file: "patches/0006-libjuicer-stub-ohos.c.patch"
    patch_description: "Create libjuicer/stub-ohos.c with stub implementations for brasero, canberra-gtk, totem-disc, discid, musicbrainz5 and the gst-plugins-base pbutils encoding-profile API."
    patch_type: "portability"
  - patch_file: "patches/0007-stubs-headers.patch"
    patch_description: "Create stub headers (stubs/) for libraries not published in the OHOS conan registry: brasero, canberra-gtk, totem-disc, discid, mb5_c, gst/pbutils and gst/tag."
    patch_type: "portability"
  - patch_file: "patches/0008-data-meson-build.patch"
    patch_description: "Replace i18n.merge_file with install_data in data/meson.build (msgfmt is not available in the OHOS toolchain)."
    patch_type: "portability"
