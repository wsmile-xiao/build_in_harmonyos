# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sound-juicer/3.40.0
homepage: "https://wiki.gnome.org/Apps/SoundJuicer"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test-browse.c
    source: sound-juicer-3.40.0/tests/test-browse.c
    description: "Test browsing CD contents (requires CD drive and gstreamer plugins)"
    command: "meson test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Verify sound-juicer binary exists, is a valid ELF, and (after OHOS self-signing) runs --help and prints the GApplication usage text"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
