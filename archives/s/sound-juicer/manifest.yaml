software: sound-juicer
display: "Sound Juicer"
description: "CD ripper for GNOME Desktop — rip audio CDs to Ogg/Vorbis, FLAC, WAV or MP3"
category: multimedia
homepage: "https://wiki.gnome.org/Apps/SoundJuicer"
license: GPL-2.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Unavailable libraries (brasero, musicbrainz5, libdiscid, canberra-gtk, totem-disc, gst-plugins-base/pbutils) stubbed via HAVE_STUB_DEPS"
    - "Real dependencies: glib/2.84.0.1 (shared), gstreamer/1.28.3, gtk/3.24.43, gsettings-desktop-schemas/49.1, iso-codes/4.20.1"
    - "zlib force-aligned to 1.3.1.1 so the gtk (glib) and gstreamer (glib2) dependency graphs resolve in one build"
    - "Whole application links against a single shared glib (the canonical glib-2.0.pc name resolves to the glib package)"
    - "glib/gtk build tools re-signed with binary-sign-tool for OHOS execution (mirrors the gtk recipe)"
    - "Application runs: GApplication --help works before any UI init; CD ripping needs gst-plugins-base elements which are not published"
  common_dependencies:
    - glib
    - gstreamer
    - gtk
    - gsettings-desktop-schemas
    - iso-codes

versions:
  "3.40.0":
    status: built
    build_date: "2026-09-17"
