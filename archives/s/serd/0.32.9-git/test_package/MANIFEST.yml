# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: serd/0.32.9-git
homepage: "https://drobilla.net/software/serd"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序（meson test 自动发现，41 个单元测试全过）
upstream_tests:
  - file: test/test_reader.c
    description: "RDF 读取器单元测试（Turtle/N-Triples/N-Quads 解析）"
    command: "meson test"
  - file: test/test_writer.c
    description: "RDF 写入器单元测试（序列化）"
    command: "meson test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_serd.sh
    description: "运行 serdi 工具解析/序列化简单 Turtle 输入，验证 serd 库可运行（1 个断言）"
    command: "bash test_serd.sh <serdi> <libdir>"
  - file: conanfile.py
    description: "验证 serd.h 头文件与 serd-0.pc 存在（2 个断言）"
    command: "conan test"

# 测试断言总数：上游 meson test 41 个全过 + 24 个 Expected Fail（上游标注），
# test_package 3 个断言（serdi 运行 + 产物存在性）
assertion_count: 44
