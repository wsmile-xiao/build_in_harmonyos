# GTest v1.15.2 vendored for offline FetchContent (truth: upstream
# test/CMakeLists.txt does FetchContent_Declare(GTest GIT_REPOSITORY
# https://github.com/google/googletest GIT_TAG v1.15.2); preflight
# git clone to github.com times out, so source() pre-downloads the
# official tarball -- gh-proxy mirror first, official URL as fallback,
# same sha256 -- and generate() injects FETCHCONTENT_SOURCE_DIR_GTEST.
third_party:
  gtest:
    url:
      - "https://gh-proxy.com/https://github.com/google/googletest/archive/refs/tags/v1.15.2.tar.gz"
      - "https://github.com/google/googletest/archive/refs/tags/v1.15.2.tar.gz"
    sha256: "7b42b4d6ed48810c5362c265a17faebe90dc2373c885e5216439d37927f02926"

patches: {}
