version: "2.7.0"
software: "spglib"
status: built
build_date: "2026-09-15"
build_system: "cmake"

source:
  url: "https://github.com/spglib/spglib/archive/refs/tags/v2.7.0.tar.gz"
  sha256: "b22fc9abae9716c574fbc6d55cfc53ed654a714fccc5657a26ff5d18114bd8bd"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DSPGLIB_SHARED_LIBS=OFF"
    - "-DSPGLIB_WITH_Fortran=OFF"
    - "-DSPGLIB_WITH_Python=OFF"
    - "-DSPGLIB_USE_OMP=OFF"
    - "-DSPGLIB_WITH_TESTS=ON"
    - "-DSPGLIB_INSTALL=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  type: upstream-ctest
  framework: ctest
  command: "ctest --output-on-failure"
  # Exact discovered/executed/passed counts come from the HarmonyOS
  # preflight ctest run (HMBS_UPSTREAM_TEST_RESULT marker); see notes.md
  # for the suite layout (unit/integration/functional/package/example).

knowledge_gained:
  - "C 核心零外部运行时依赖；Fortran/Python/OpenMP 保持 OFF，只交付 Spglib::symspg"
  - "SPGLIB_WITH_TESTS=ON 注册全部 ctest 套件，build() 单次 ctest 运行同时产生日志与 HMBS_UPSTREAM_TEST_RESULT 标记"
  - "产物通过 SpglibConfig (Spglib::symspg) 与 spglib.pc 导出；package_info 声明 cmake_file_name=Spglib"
