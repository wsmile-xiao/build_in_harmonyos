software: spglib
version: "2.7.0"
status: published
build_date: "2026-06-12"
license: BSD-3-Clause

source:
  url: "https://github.com/spglib/spglib/archive/refs/tags/v2.7.0.tar.gz"
  sha256: "b22fc9abae9716c574fbc6d55cfc53ed654a714fccc5657a26ff5d18114bd8bd"
  tar_format: tar.gz

build:
  system: cmake
  build_system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DSPGLIB_WITH_TESTS=OFF"
    - "-DSPGLIB_SHARED_LIBS=OFF"
    - "-DCMAKE_SYSTEM_NAME=OHOS"
  dependencies: []
  cc: clang
  cxx: clang++
  build_cleanliness: minimal

patches_applied: []

knowledge_gained:
  - "cmake项目在鸿蒙上仅产生'System is unknown'警告，不影响编译（纯C库无需平台适配）"
  - "GTest RTTI不兼容: 本地预编译GTest(libgtest.a)编译时无RTTI，测试代码需-fno-rtti匹配ABI"
  - "cmake项目使用FETCHCONTENT_TRY_FIND_PACKAGE_MODE=ALWAYS避免FetchContent git clone下载失败"
  - "cmake项目clean-verify脚本只支持autotools(./configure)，需创建hints/build-hints.yaml指定构建系统"
  - "纯C库(无可执行二进制)的G2功能验证需通过自定义C程序完成，而非--version检查"