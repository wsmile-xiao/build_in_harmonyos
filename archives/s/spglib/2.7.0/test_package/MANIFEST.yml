# test_package/MANIFEST.yml — spglib/2.7.0 上游测试声明
#
# 上游测试框架: ctest (test/CMakeLists.txt 注册 unit/integration/
# functional/package/example 五类套件；SPGLIB_WITH_TESTS=ON)。
# conanfile.py build() 中已集成: ctest --output-on-failure 单次运行，
# 输出 HMBS_UPSTREAM_TEST_RESULT 机器标记并落盘复发。
# 精确用例数以真机预检日志标记为准，此处不预填猜测数字。

package: spglib/2.7.0
homepage: "https://github.com/spglib/spglib"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: test/unit
    source: spglib-2.7.0/test/unit
    description: "上游单元测试 (GTest, FetchContent googletest v1.15.2)"
    command: "ctest -R unit"
  - file: test/integration
    source: spglib-2.7.0/test/integration
    description: "上游集成测试 (ctest --build-and-test 子工程)"
    command: "ctest -R integration"
  - file: test/functional
    source: spglib-2.7.0/test/functional
    description: "上游功能测试 (对称性/标准化晶胞数据集)"
    command: "ctest -R functional"
  - file: test/package
    source: spglib-2.7.0/test/package
    description: "上游打包测试 (已安装 SpglibConfig 的 find_package 可用性)"
    command: "ctest -R package"
  - file: test/example
    source: spglib-2.7.0/test/example
    description: "上游示例测试 (example/ 最小链接示例)"
    command: "ctest -R example"

test_package_tests:
  - file: test_package/test.c
    description: "消费者测试：单原子简立方经 spg_get_dataset 断言 Pm-3m(221)、操作数、符号与版本，共 7 条 CHECK-OK 断言"
    command: "./test_spglib"

assertion_count: 7
