# Build hints for spglib 2.7.0
# Used by ohc-run.py clean-verify to know how to build this software

build_system: cmake

# CMake configure options (used by clean-verify instead of ./configure)
cmake_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
  - "-DSPGLIB_WITH_TESTS=OFF"
  - "-DSPGLIB_SHARED_LIBS=OFF"
  - "-DCMAKE_SYSTEM_NAME=OHOS"

# No patches needed for spglib
# spglib is a pure C library that compiles cleanly on HarmonyOS