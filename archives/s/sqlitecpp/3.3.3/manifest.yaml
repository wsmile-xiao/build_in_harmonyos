# 版本级 manifest — sqlitecpp 3.3.3
# 文件位置: archives/s/sqlitecpp/3.3.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.3.3"

# 软件名
software: "sqlitecpp"

# 编译状态
# published | built | failed | archived
status: "built"

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag，R39）
  url: "https://github.com/SRombauts/SQLiteCpp/archive/refs/tags/3.3.3.tar.gz"

  # 源码校验和（2026-09-03 实测下载值，与 conandata.yml 一致）
  sha256: "33bd4372d83bc43117928ee842be64d05e7807f511b5195f85d30015cad9cac6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DSQLITECPP_INTERNAL_SQLITE=ON"
  - "-DSQLITECPP_RUN_CPPLINT=OFF"
  - "-DSQLITECPP_RUN_DOXYGEN=OFF"
  - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "SQLiteCpp 内部自带 sqlite3 源码（SQLITECPP_INTERNAL_SQLITE=ON），无需外部依赖；conanfile package_info 必须同时声明 libs=['SQLiteCpp','sqlite3']，否则消费者链接静态库时缺 sqlite3_* 符号 ref: E221"
