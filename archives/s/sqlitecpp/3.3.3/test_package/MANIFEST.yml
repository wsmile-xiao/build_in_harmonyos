# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sqlitecpp/3.3.3
homepage: "https://github.com/SRombauts/SQLiteCpp"

# 上游测试命令 (googletest 驱动，CMake ctest 注册)
upstream_check_command: "ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (googletest 单测，9 个测试源文件 49 个用例)
upstream_tests:
  - file: tests/Backup_test.cpp
    source: sqlitecpp-3.3.3/tests/Backup_test.cpp
    description: "Backup API 4 用例 (initException/executeStepOne/executeStepAll/executeStepException)"
    command: "./bin/SQLiteCpp_tests --gtest_filter=Backup.*"
  - file: tests/Column_test.cpp
    source: sqlitecpp-3.3.3/tests/Column_test.cpp
    description: "Column API 5 用例 (basis/basis16/getName/stream/shared_ptr)"
    command: "./bin/SQLiteCpp_tests --gtest_filter=Column.*"
  - file: tests/Database_test.cpp
    source: sqlitecpp-3.3.3/tests/Database_test.cpp
    description: "Database API 16 用例 (SQLiteCpp.version + ctorExecCreateDropExist 等)"
    command: "./bin/SQLiteCpp_tests --gtest_filter=Database.*"
  - file: tests/Exception_test.cpp
    source: sqlitecpp-3.3.3/tests/Exception_test.cpp
    description: "异常类型 4 用例 (copy/assignment/throw_catch/constructor)"
    command: "./bin/SQLiteCpp_tests --gtest_filter=Exception.*"
  - file: tests/ExecuteMany_test.cpp
    source: sqlitecpp-3.3.3/tests/ExecuteMany_test.cpp
    description: "批量执行 1 用例 (invalid)"
    command: "./bin/SQLiteCpp_tests --gtest_filter=ExecuteMany.*"
  - file: tests/Savepoint_test.cpp
    source: sqlitecpp-3.3.3/tests/Savepoint_test.cpp
    description: "Savepoint 1 用例 (commitRollback)"
    command: "./bin/SQLiteCpp_tests --gtest_filter=Savepoint.*"
  - file: tests/Statement_test.cpp
    source: sqlitecpp-3.3.3/tests/Statement_test.cpp
    description: "Statement API 16 用例"
    command: "./bin/SQLiteCpp_tests --gtest_filter=Statement.*"
  - file: tests/Transaction_test.cpp
    source: sqlitecpp-3.3.3/tests/Transaction_test.cpp
    description: "Transaction 1 用例 (commitRollback)"
    command: "./bin/SQLiteCpp_tests --gtest_filter=Transaction.*"
  - file: tests/VariadicBind_test.cpp
    source: sqlitecpp-3.3.3/tests/VariadicBind_test.cpp
    description: "变参绑定 1 用例 (invalid)"
    command: "./bin/SQLiteCpp_tests --gtest_filter=VariadicBind.*"

# test_package 中自带的测试 (消费者视角验证，真实调用 SQLiteCpp API)
test_package_tests:
  - file: test_sqlitecpp.cpp
    description: "消费者测试：创建内存库-建表-绑定插入-查询并校验返回值"
    command: "./test_sqlitecpp"

# 测试断言总数 (googletest 已运行 PASSED 49/49，实际断言数按 gtest 输出统计)
assertion_count: 49