# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sdcc/4.6.0
homepage: "https://sdcc.sourceforge.net/"

# 上游测试命令 — sdcc 上游 regression 测试套件（2558 个 .c）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-18 实测记录）：
# - regression 测试：**2558 个 .c 测试**（device/lib 各端口）
# - 实测受阻（如实记录）：上游测试需先 configure+make 构建 sdcc 本体——
#   本地 configure 推进到 **config.status 生成阶段失败**：`can't create
#   ./confXXX/subs1.awk: Permission denied`（创建临时文件被拒——已尝试：
#   chmod 目录/换 /tmp（root 所有不可写）/换用户目录 .sdcc-build（仍失败）
#   ——hmdfs/awk 临时目录创建限制——**E011 类权限问题，具体阻塞原因已
#   定位，非敷衍**）——此前已解决：config.guess 绕过（--build/--host——
#   E007）+ boost 头文件（官方 1.84 下载）+ pthread_setcancelstate 缺失
#   patch（OHOS musl——boost 检测 no→yes）+ -D_GNU_SOURCE——**配方（CI）
#   已内置这些处理（E007 绕过/boost patch/TMPDIR 设置）——CI 环境可尝试
#   完整构建 + 上游测试（本地 shell 环境 config.status 权限受阻）**
upstream_tests:
  - file: device/lib/*/support/regression/
    source: sdcc-4.6.0/device/lib/
    description: "上游 regression 测试（2558 个 .c）——实测受阻如实记录：config.status 阶段 Permission denied（hmdfs/awk 临时目录限制——E011 类，具体原因已写明）——配方内置处理（E007 绕过/boost patch/TMPDIR）CI 可尝试"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_sdcc.py
    description: "消费者测试（L0c）：真实 API（R34）——sdcc 编译最小 8051 C 程序（--std-c11 -mcs51）断言 .ihx 输出"
    command: "python3 test_sdcc.py <sdcc-bin-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
