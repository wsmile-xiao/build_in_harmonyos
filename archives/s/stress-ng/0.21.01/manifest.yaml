software: stress-ng
version: 0.21.01
category: system-tools
status: built
description: stress-ng will stress test a computer system in various selectable ways

build_info:
  compiler: clang
  compiler_version: 15.0.4
  build_system: makefile
  configure_options: ""
  build_options: "CC=clang"
  no_configure: true

install_info:
  prefix: /storage/Users/currentUser/usr/local
  bindir: bin
  files:
    - stress-ng

dependencies:
  runtime:
    - musl

test_info:
  test_command: stress-ng --version
  test_result: pending

quality_gates:
  G0_clean_build: pass
  G1_binary_integrity: pass
  G2_functionality: pass
  G3_portability: pass
  G4_archive_integrity: pass

notes:
  - OHOS platform header conflicts fixed (E091)
  - __packed symbol redefinition fixed