package: sipp/3.7.7
homepage: https://github.com/SIPp/sipp

upstream_check_command: ctest -N
upstream_test_in_build: false
upstream_test_command: not run in cross-build recipe; upstream unit tests require host execution

upstream_tests:
  - file: src/sipp_unittest.cpp
    source: sipp-3.7.7/src/sipp_unittest.cpp
    description: Upstream C++ unit test entry for host builds.
    command: ctest

test_package_tests:
  - file: test_sipp.sh
    description: Consumer smoke test runs the packaged sipp binary version command.
    command: sipp -v

assertion_count: 1
