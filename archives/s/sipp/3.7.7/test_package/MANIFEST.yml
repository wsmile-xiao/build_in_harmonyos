package: sipp/3.7.7
homepage: https://github.com/SIPp/sipp

upstream_check_command: ctest -N
upstream_test_in_build: true
upstream_test_command: ctest -N

upstream_tests:
  - file: src/sipp_unittest.cpp
    source: sipp-3.7.7/src/sipp_unittest.cpp
    description: Upstream C++ unit test entry is present; release CMake does not register a runnable CTest test for cross builds, so build() records the CTest inventory with ctest -N.
    command: ctest -N

test_package_tests:
  - file: test_sipp.sh
    description: Consumer smoke test verifies the packaged sipp binary prints its upstream version banner and exits with SIPp's documented informational exit code 99 (EXIT_OTHER).
    command: bash test_sipp.sh

assertion_count: 3
