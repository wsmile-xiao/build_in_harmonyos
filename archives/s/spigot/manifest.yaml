software: spigot
display: "spigot"
description: "精确实数计算器 —— 输入数学表达式，按任意精度逐位算出结果（Simon Tatham 的 exact real calculator，不是 Minecraft Spigot）"
category: math
homepage: "http://www.chiark.greenend.org.uk/~sgtatham/spigot/"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure.ac 无 AC_CANONICAL_HOST，autoreconf 不生成 config.guess/config.sub，本包不需要 E007 OHOS 三元组补丁（与仓库内绝大多数 autotools 包相反）"
    - "ncurses/6.6 只有 libncursesw.a，上游 AC_SEARCH_LIBS(tigetstr, tinfo ncurses) 两个候选都落空导致链接缺符号；需 configure_vars['LIBS']='-lncursesw'"
    - "归档不带 configure 与生成好的 spigot.1/spigot.html，build() 必须 autoreconf -v -i -f 且 tool_requires halibut/1.3"
    - "autoconf/automake/m4/perl 用构建机自带的，不要 tool_requires perl/5.42.2 或 m4/1.4.19（这两者在 ohos-aarch64 无可用预编译二进制，源码构建失败）"
    - "上游自带 1133 个 testcase 的 bash 测试套件，可在 build() 阶段直接真跑；`spigot --version` 报 big integer provider: gmp 即证明 GMP 后端生效"
  common_dependencies:
    - gmp
    - ncurses

versions:
  "0.2017-01-15.gdad1bbc6":
    status: built
    build_date: "2026-10-04"
    build_system: autotools
    conan_ref: "spigot/0.2017-01-15.gdad1bbc6"
