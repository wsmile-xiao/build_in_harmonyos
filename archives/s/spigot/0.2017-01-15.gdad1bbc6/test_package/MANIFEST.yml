# test_package/MANIFEST.yml
# 上游测试声明文件 —— CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: spigot/0.2017-01-15.gdad1bbc6
homepage: "http://www.chiark.greenend.org.uk/~sgtatham/spigot/"

# 上游测试命令。spigot 的 Makefile.am 自定义了一个 `test` 目标（不是 automake
# 的 `check`）：`test: spigot test.sh` + `$(srcdir)/test.sh ./spigot`。
upstream_check_command: "make test"

# conanfile.py 的 build() 阶段已经完整跑了上游测试套件（不是声明，是真跑）
upstream_test_in_build: true
upstream_test_command: "bash test.sh ./spigot"

# 上游实际运行的测试程序
upstream_tests:
  - file: test.sh
    source: spigot-0.2017-01-15.gdad1bbc6/test.sh
    description: >-
      上游自带测试套件（Simon Tatham 手写，80094 字节 / 1133 个 testcase）。
      逐条把 spigot 的输出与字面期望值比对，覆盖：pi/e/欧拉常数等常量的
      70+ 位精确值、zeta/erf/erfc/Phi/LambertW 等特殊函数、代数数求解器
      algebraic()、对数族（log2/log10/任意底数含 dyadic 有理回退）、三角/
      反三角/度制版本、let 绑定、任意进制输出（2/7/16/36/60/B36）、printf
      的 %e/%f/%g/%a 及宽度/标志位组合、ieee: 输入、baseNfile:/cfracfile:/
      baseNfd:/cfracfd: 文件字面量、tentative output。脚本末尾打印
      "pass N / fail N / total N" 并以 fail 数非零时返回非零。
    command: "bash test.sh ./spigot"
    testcases: 1133

  - file: debian/tests/bigint-provider
    source: spigot-0.2017-01-15.gdad1bbc6/debian/tests/bigint-provider
    description: >-
      Debian 的 autopkgtest，断言 `spigot --version` 报告
      "big integer provider: gmp"，用来抓 GMP 静默回退到 spigot 自带的慢速
      内部大整数实现。本仓库把同一条断言放进 test_package/test.sh 第 1 节。
    command: "spigot --version | grep '^ *big integer provider: gmp$'"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: >-
      对已安装的 bin/spigot 做 40 项断言：版本与 GMP provider 能力上报、
      常量 70 位精确值、upstream 的 exactness 回归用例、algebraic() 代数数
      解（黄金比例 + 连分数 1;2,3）、特殊函数、对数族、有理数与 let 绑定、
      2/7/16/36/60 进制输出、printf 格式化、度制三角、分数次幂。
      期望值全部逐字取自上游 test.sh，非自造。
    command: "bash test.sh <packaged bin/spigot>"

# 测试断言总数 (test.sh 中的 assert 调用数)
assertion_count: 40
