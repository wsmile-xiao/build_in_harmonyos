# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  # spigot 的 configure.ac 没有 AC_ENABLE_SHARED / --enable-static 之类选项，
  # 产物只有一个静态可执行文件，因此这里只有非默认的 --with-gmp。
  configure_options:
    - "--with-gmp"
  dependencies:
    - gmp/6.3.0
    - ncurses/6.6
  tool_dependencies:
    - halibut/1.3
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁。configure.ac 没有 AC_CANONICAL_HOST，autoreconf -i 因此不会安装
# config.guess/config.sub，E007 的 OHOS 三元组补丁无处可挂（已实测确认）。
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - >-
    本仓库第一个不需要 config.guess/config.sub OHOS 补丁的 autotools 包：
    configure.ac 里没有 AC_CANONICAL_HOST 时，`autoreconf -i` 不会放置这两个
    脚本，configure 直接在构建机上原生探测，不会出现 "cannot guess build type"。
    选型判断依据：先看 configure.ac 有没有 AC_CANONICAL_HOST/AM_INIT_AUTOMAKE
    之外的 canonical 宏，再决定要不要走 patch-autotools-ohos.pl。
  - >-
    E114/E011 依然要处理：`autoreconf` 生成的 configure 里有 2 处
    `umask 077`，在 HMDFS 上会让 config.status 的临时目录不可写，
    build() 里用 replace_in_file 把 umask 077 换成 022（strict=False，
    因为 autoconf 版本不同出现次数会变）。
  - >-
    ncurses/6.6 只产出 libncursesw.a（没有 libtinfo.a / libncurses.a），
    而上游 configure.ac 写的是 `AC_SEARCH_LIBS(tigetstr, tinfo ncurses)`：
    该宏只在符号尚未声明时才去 -l 候选里找，此刻 ncurses.h 还没被 include，
    于是两个候选都找不到、什么也不加；但 main.cpp 仍然调用
    tigetstr/tparm/setupterm（AC_CHECK_HEADERS([ncurses.h]) 是成功的），
    最终链接炸 undefined symbol: tigetstr / tparm / setupterm。
    解法：AutotoolsToolchain.configure_vars["LIBS"] = "-lncursesw"，
    让探测报 "none required" 并链上宽字符 ncurses（nm 确认 libncursesw.a
    里 tigetstr/tparm/setupterm/tiparm 齐全）。这是 AC_SEARCH_LIBS 顺序
    依赖的典型坑，凡是用 ncurses 又只发宽字符库的包都要注意。
  - >-
    归档里没有生成好的 configure（只有 configure.ac + Makefile.am +
    autogen.sh），也没有生成好的 spigot.1 / spigot.html（只有 .but 源），
    所以 build() 必须 autoreconf -v -i -f，并且必须 tool_requires halibut：
    Makefile.am 的 man1_MANS/doc_DATA 指向 spigot.1/spigot.html，
    而生成这两者的规则被包在 `if HAVE_HALIBUT` 里，configure 又靠
    AC_CHECK_PROG([HALIBUT]) 决定 —— halibut 不在 PATH 上时 make install
    直接死在 man1_MANS。Debian 的 Build-Depends 同样列了 halibut。
    halibut 是 build 上下文工具（tool_requires 按 build profile 解析），
    实测能在 ohos-aarch64 构建里正常调用。
  - >-
    autoconf/automake/m4/perl 一律用构建机自带的，不写 tool_requires：
    本仓库 191 个调用 autoreconf 的配方里有 98 个是纯系统工具路线。
    反例：perl/5.42.2 与 m4/1.4.19 在 ohos-aarch64 没有可用的预编译二进制，
    会被拉起源码构建并失败（perl 卡在 pod/perl5422delta.pod，
    m4 卡在 make check），所以千万别顺手 tool_requires 它们。
  - >-
    version.h 里是 `#ifndef VER / #define VER "unidentified build"`，
    上游 commit dad1bbc6（本次适配的版本本身就是这个 commit）加的正是
    "允许在 make 命令行覆盖 VER"，所以用
    AutotoolsToolchain.extra_cxxflags 传 `-DVER='"0.2017-01-15.gdad1bbc6"'`，
    `spigot --version` 就能报出真实版本而不是 unidentified build。
  - >-
    上游自带 1133 个 testcase 的 bash 测试套件（test.sh，80094 字节），
    可以直接在 build() 阶段真跑：`bash test.sh ./spigot`，176 秒，
    pass 1133 / fail 0。它同时验证了 GMP provider 是否真的链上
    （`spigot --version` 报 big integer provider: gmp），
    这正是 Debian 单独写 autopkgtest bigint-provider 的原因。
    注意 test.sh 依赖 bash 的进程替换 <(...) 和 $'...'，必须用 bash 跑，
    且最后的 fd 测试依赖 perl。

patch_generation:
  method: none
  patches_count: 0
