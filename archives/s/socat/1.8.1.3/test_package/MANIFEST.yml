# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: socat/1.8.1.3
homepage: "http://www.dest-unreach.org/socat/"

# 上游测试命令 (make test 由 test.sh 驱动，非 ctest)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test.sh 是 socat 官方测试驱动脚本）
upstream_tests:
  - file: test.sh
    source: socat-1.8.1.3/test.sh
    description: "socat 官方自测脚本（shell 驱动，覆盖 TCP/UDP/UNIX 等双向转发场景）"
    command: "./test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试：调用安装后的 socat 二进制运行 --version"
    command: "socat --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
