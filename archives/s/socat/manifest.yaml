software: socat
display: "socat"
description: "多用途双向数据中继工具（socket/文件/管道/命令之间的连接与转发）"
category: network
homepage: "http://www.dest-unreach.org/socat/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游为 release dist tarball，自带 configure（无需 autoreconf），亦不涉及 config.guess 的 OHOS 三元组补丁（configure.ac 内 AC_CANONICAL_* 命中为 0）"
    - "OHOS sysroot 有 <resolv.h> 但 libc 不导出全局 `_res`（也无 __res_state()）；socat 的 AC_HEADER_RESOLV() 只判断头文件存在 → HAVE_RESOLV_H=1 → xio-ip.c 使用 `_res.options` 编译失败。以 ac_cv_header_resolv_h=no 收口（同族 E516）"
    - "同族第二处：sysroot 有 <sys/stropts.h>（→ <stropts.h>，定义 I_LIST）但不声明/导出 isastream()，使 filan.c 的 #ifdef I_LIST 块激活 → 链接期 undefined symbol: isastream。以 ac_cv_header_sys_stropts.h=no 收口"
    - "HMDFS 上 configure 的 umask 077 临时目录创建失败（E114 同族），须补丁移除"
    - "上游仅提供 http，无 https 端点"
  common_dependencies: []

versions:
