    status: built
    build_date: "2026-09-20"
    conan_ref: "socat/1.7.4.4.1"
    note: "基于上游 1.7.4.4 的 OHOS 适配轮次（本仓 .1 惯例）；源码 URL 与产物自报版本均为 1.7.4.4"
