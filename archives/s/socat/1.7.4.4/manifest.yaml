software: socat
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.7.4.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: socat

# 版本号
version: "1.7.4.4"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶级字段，用于 verify-build）
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-14"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://www.dest-unreach.org/socat/download/socat-1.7.4.4.tar.gz"

  # 源码校验和（从 .tarball-sha256 获取）
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本次编译无源码修改）
patches_applied: []

# ============================================================
# 平台兼容性记录
# ============================================================

# musl 兼容性问题
musl_compatibility_issues:
  - "_res state deprecated (保留但未使用)"
  - "isastream() not available in musl (configure 自动检测并禁用)"

# HMDFS 限制
hmdfs_limitations:
  - "chmod/chown 在 HMDFS 上可能无权限效果（非阻塞）"
  - "测试套件使用符号链接可能失败（需跳过相关测试）"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "socat 在 HarmonyOS 上可直接编译，无需修改源码"
  - "autotools 自动检测平台特性，正确处理 musl 缺失的函数"
  - "生成的二进制文件：socat, procan, filan"
  - "功能验证：TCP/UDP/UNIX socket 等核心功能可用"
