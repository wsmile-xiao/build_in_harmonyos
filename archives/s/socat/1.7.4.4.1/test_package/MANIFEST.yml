# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: socat/1.7.4.4.1
homepage: "http://www.dest-unreach.org/socat/"

# 本包在依赖链中的位置：socat（本包）→ swtpm 测试套件
topology: "socat (本包) → swtpm tests/（--enable-tests 的五项硬门禁之一）"

# 上游测试命令
upstream_check_command: "make test（目标为 `test: progs` → ./test.sh）"

# conanfile.py build() 中是否已集成上游测试 → 否
# 原因：上游 test.sh 是 15801 行的巨型 shell 脚本，逐用例执行并比对 stdout/stderr，
# 需要大量外部服务（openssl、proxy、tcp/udp 对端、UNIX socket 等）与较长时间；
# 其完整运行不属于包构建的职责范围。已如实申报未在 build() 内执行。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试（已声明但本包未运行，含原因）
upstream_tests:
  - name: "socat-test-sh"
    source: "test.sh（上游唯一测试入口；Makefile 的 `test:` 目标调用它）"
    command: "make test"
    expected: "not-run"
    run_2026_09_20:
      total: 316
      executed: 0
      skipped: 316
      counting_method: >
        用例数以脚本内 N 计数器为准：`N=$((N+1))` 出现 316 次，即用例编号上界为 316
        （另：`testecho` 显式调用 44 次，`# test` 注释标题 102 处）。采用 N 计数器的
        可复现口径，避免按注释数量估计。
      reason: >-
        上游 test.sh 需要完整的外部对端（openssl 证书链、代理、TCP/UDP 服务端、
        UNIX 域 socket 等）与长时间运行，不属于包构建职责；本包在 build() 内只做
        编译与安装。如实申报 316 项未执行，未以 skip/xfail 掩盖，亦不计入通过率分母。

# test_package 中自带的测试（消费者视角验证，R34 反空壳）
test_package_tests:
  - file: test_socat.sh
    description: >-
      实际执行交付产物并断言运行时行为：socat -V 版本输出、socat -h 可用、
      单向中继（exec:echo → stdout）、**TCP 中继**（起监听端 + 客户端，验证
      内容真正到达，这是 socat 的核心能力，也是 swtpm 测试消费它的方式）、
      同包交付的 filan 与 procan 可执行
    command: "bash test_socat.sh"

# 测试断言总数
# 1 (socat -V) + 1 (socat -h) + 1 (单向中继) + 1 (TCP 中继)
# + 1 (filan) + 1 (procan) = 6
assertion_count: 6

# 断言理由：swtpm 的测试以
#   socat -x -t50 "FILE:...,rdonly" "UNIX-CONNECT:..." / socat -T1 - "UNIX-CONNECT:..."
# 形式消费本包，依赖 socket/文件地址之间的转发能力。OHOS 上 AF_UNIX 路径名 socket
# 受域限制，故断言以 **TCP** 作为确定性判据（同样走 socat 的 socket 转发路径），
# 而非仅检查文件存在 —— 只检查存在无法发现「构建通过但产物不可执行」这类缺陷。
