software: socat
# 版本级 manifest — socat 1.7.4.4.1
# 文件位置: archives/s/socat/1.7.4.4.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# 版本说明：1.7.4.4.1 = 基于上游 1.7.4.4 的 OHOS 适配轮次（本仓惯例，如 gnupg 2.4.9.1）；
#           源码 URL 与产物自报版本均为上游 1.7.4.4。

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: socat

# 版本号（conan 引用版本；上游版本为 1.7.4.4）
version: "1.7.4.4.1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶级字段，用于 verify-build）
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-14"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://www.dest-unreach.org/socat/download/socat-1.7.4.4.tar.gz"

  # 源码校验和（实测 sha256sum 取得）
  sha256: "0f8f4b9d5c60b8c53d17b60d79ababc4a0f51b3bb6d2bd3ae8a6a4b9d68f195e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "ac_cv_header_resolv_h=no"
    - "ac_cv_header_sys_stropts_h=no"
    - "--prefix=/"

  # 编译依赖列表（格式: name/version）
  # 本包无库依赖；以下工具为 swtpm 测试链的消费方所需，与本包构建无关
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-configure-drop-umask-077.patch"

# ============================================================
# 平台兼容性记录
# ============================================================

# musl / OHOS libc 兼容性问题
musl_compatibility_issues:
- "OHOS libc 不导出全局 `_res`（也无 __res_state() 访问器），但 sysroot 有 <resolv.h>；socat 的 AC_HEADER_RESOLV() 只判断头文件存在 → HAVE_RESOLV_H=1 → xio-ip.c 使用 `_res.options` 编译失败（use of undeclared identifier '_res'）。以 ac_cv_header_resolv_h=no 收口（同族知识条目 E516）"
- "OHOS sysroot 有 <sys/stropts.h>（→ <stropts.h>，定义 I_LIST）但不声明/导出 isastream()，使 filan.c 的 `#ifdef I_LIST` 块激活 → 链接期 undefined symbol: isastream。以 ac_cv_header_sys_stropts_h=no 收口"

# HMDFS 限制
hmdfs_limitations:
- "configure 生成 config.status 时用 `umask 077 && mktemp -d` 建临时目录，HMDFS 强制目录 setgid 下 077 会导致 config.status 无法创建临时文件（config.status: error: could not setup config files machinery）；已由 0001 补丁移除两处 umask 077（同族 E114）"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "socat 自带 configure（release dist tarball），无需 autoreconf，因此也不涉及 config.guess 的 OHOS 三元组补丁 —— configure.ac 内 AC_CANONICAL_* 命中为 0，不调用 config.guess"
- "OHOS libc 缺全局 _res 而 sysroot 有 resolv.h，形成「头文件存在但符号不存在」的探测误判；以 ac_cv_header_resolv_h=no 跳过整段（该路径只提供已废弃的 resolver 调优选项，域名解析仍由 getaddrinfo 提供）"
- "同上形态第二处：sys/stropts.h 存在并定义 I_LIST，但 isastream() 不存在，须以 ac_cv_header_sys_stropts_h=no 收口"
- "HMDFS 上 configure 的 umask 077 临时目录创建失败（E114 同族），须补丁移除"
- "交付产物：socat / filan / procan；实测 socat -V 与 TCP 中继功能正常"
- "本包为 swtpm 测试套件 --enable-tests 的五项硬门禁之一（expect/gawk/socat/base64/cp 及 netstat|ss）"
