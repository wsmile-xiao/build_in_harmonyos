# conandata.yml — socat 1.7.4.4.1
# 上游为 release dist tarball，自带 configure / Makefile.in（无需 autoreconf）。
# 版本说明：conan 引用版本 1.7.4.4.1 表示「基于上游 1.7.4.4 的再次适配」
# （本仓惯例，如 gnupg 2.4.9.1）。**源码 URL 仍指向上游 1.7.4.4 tarball**，
# 交付产物自报版本亦为 1.7.4.4（上游版本号不因适配轮次改变）。

sources:
  url: "http://www.dest-unreach.org/socat/download/socat-1.7.4.4.tar.gz"
  sha256: "0f8f4b9d5c60b8c53d17b60d79ababc4a0f51b3bb6d2bd3ae8a6a4b9d68f195e"

patches:
  # E114：configure 在生成 config.status 时用 `umask 077 && mktemp -d` 建临时目录，
  # 而 HMDFS 会强制目录 setgid，077 下 config.status 无法创建临时文件，实测报
  #   ./config.status[692]: can't create ./confXXXXXX/subs1.awk: Permission denied
  #   config.status: error: could not setup config files machinery
  # 移除两处 umask 077（与 libtpms / swtpm / tpm2-tss 同族修法）。
  - patch_file: "patches/0001-configure-drop-umask-077.patch"
    patch_description: "Drop umask 077 from configure's temp-dir creation (HMDFS setgid dirs, E114)"
    patch_type: "portability"
