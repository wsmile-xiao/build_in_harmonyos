# conandata.yml — snapraid 14.9

sources:
  url: "https://github.com/amadvance/snapraid/releases/download/v14.9/snapraid-14.9.tar.gz"
  sha256: "40c216979d9d9853248060497341f74feaa07c8ae15927b6b14972c4f9d143d5"

patches:
  - patch_file: "patches/0001-Makefile.am.patch"
    patch_description: "Upstream test suite only: HMDFS (OHOS) has no O_DIRECT support (open returns EINVAL); switch the single --test-io-advise-direct regression sub-run to --test-io-advise-none so the sync assertion still executes."
    patch_type: "portability"
  - patch_file: "patches/0002-Makefile.in.patch"
    patch_description: "Same as 0001 but for the generated Makefile.in that configure uses (the tarball's configure regenerates Makefile from it)."
    patch_type: "portability"
  - patch_file: "patches/0003-config.guess.patch"
    patch_description: "E007: config.guess cannot guess the build type because uname -s reports HarmonyOS; add a HarmonyOS case branch emitting aarch64-unknown-linux-ohos."
    patch_type: "portability"
  - patch_file: "patches/0004-config.sub.patch"
    patch_description: "E007: teach config.sub the ohos triplet (ohos-linux alias case, ohos* basic-system entry, linux+ohos kernel/OS compatibility pair)."
    patch_type: "portability"
  - patch_file: "patches/0005-configure.patch"
    patch_description: "E011/E114: configure's `umask 077` mktemp directories are unwritable on HMDFS (setgid 2700), breaking config.status (subs1.awk Permission denied); relax to umask 022."
    patch_type: "portability"
