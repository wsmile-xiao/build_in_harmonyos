knowledge_gained:
  - "E007: upstream config.guess cannot guess HarmonyOS (uname -s); added a HarmonyOS case branch emitting aarch64-unknown-linux-ohos, plus config.sub ohos alias/OS-entry/kernel-compat pairs"
  - "E011/E114: configure's umask 077 mktemp dirs are setgid-2700 on HMDFS and unwritable; relaxed to umask 022 (subs1.awk Permission denied)"
  - "E386: profile CONFIG_SHELL (hnp bash) cannot getcwd() inside HMDFS conan cache dirs; probe candidate shells with pwd from the real build dir and route configure via env -u CONFIG_SHELL SHELL=<tested>"
  - "E079: HMDFS cannot create hard links; a PATH-front ln shim (real ln first, cp -p fallback on EPERM) lets the upstream hardlink test block run unmodified"
  - "HMDFS lacks fallocate()/O_DIRECT: suite-wide --test-skip-fallocate via CHECKFLAGS_COMMON (flag the upstream suite itself already uses), single --test-io-advise-direct sub-run switched to --test-io-advise-none via patch"
  - "conan basic_layout keeps source/ and build/ apart while snapraid's configure + make check suite are in-source: run every step with cwd=source_folder"
