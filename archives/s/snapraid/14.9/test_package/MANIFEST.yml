# test_package/MANIFEST.yml — snapraid 14.9
# CI L0e requires this file to exist.

package: snapraid/14.9
homepage: "https://www.snapraid.it"

# Upstream ships a full `make check` regression suite (check-local, 74
# test blocks); it is executed inside build() with HMDFS adaptations
# (ln shim + --test-skip-fallocate, see conanfile.py / notes.md).
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
