# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sqlite-vec/0.1.9
homepage: "https://github.com/asg017/sqlite-vec"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.sql
    source: sqlite-vec-0.1.9/test.sql
    description: "上游 SQL 测试脚本，需要 sqlite3 CLI 加载 vec0 扩展"
    command: "sqlite3 :memory: '.read test.sql'"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "向量搜索基础功能验证：版本检查、KNN搜索、距离验证"
    command: "./test_sqlite_vec"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
