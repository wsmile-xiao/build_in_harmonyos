# 版本级 manifest — srf 0.1
# 遵循 ARCHIVE-SPEC v3.0

version: "0.1"

software: srf

status: built

build_date: "2026-10-03"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/s/srf/srf_0.1+dfsg.orig.tar.gz"
  sha256: "1a2a221e3560c4eb1a140fc0ee6b9fb23d8aa622819625c66fca1089094ae863"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=<conan private prefix>"
  dependencies:
    - io_lib/1.14.9
  cc: clang
  cxx: clang++

patches_applied:
  - patches/0001-explicit-int-main.patch
  - patches/0002-configure-umask-tmpdir.patch
  - patches/0003-iolib-config-param.patch
  - patches/0004-missing-return.patch

knowledge_gained:
  - category: L1
    content: "非 void 函数掉出函数尾（missing return）在新 arm64 clang 下不再侥幸：编译器在 UB 路径尾 emits brk #0x1 → 运行时 SIGTRAP/SIGSEGV，崩点随优化级别/布局漂移（-O0 崩在 write 返回后、-O3 崩在 write 内），ASAN 不报告（是陷阱不是越界）——排查法：/proc/self/maps 修正 PIE 基址后 llvm-objdump 反汇编崩溃 pc，见 brk 即查 -Wreturn-type"
    reason: "srf 4 处缺 return（SRF_Container::write / SRF_Read::write / SRF_ReadSet::write / SRF_writeZtr）致 test_package SIGSEGV，15+ 轮诊断后反汇编定位，0004 补丁修复后 conan create 全绿"
  - category: L1
    content: "老 autotools configure 假成功陷阱：config.status 在 HMDFS 上写 ./confXXXX 临时目录失败（umask 077 + chmod 被忽略），rc=0 但 Makefile/config.h 全缺——判定必须查产物存在性，不能只看退出码（0002 umask 022 修复）"
    reason: "srf/io_lib/commoncpp2 三库同坑（KB-ATBOOT B 类特征）"
  - category: L1
    content: "GNU make 无 $(SHELL ...) 函数——$(SHELL io_lib-config --libs) 展开为空串（静默！），上游在 /usr 布局下从未暴露。io_lib 头/库路径必须走 CPPFLAGS/LDFLAGS env 通道注入；io_lib-config 内嵌构建机绝对路径，下游不可依赖其输出"
    reason: "srf generate() 实测（0003 参数化 + env 注入双保险）"
  - category: L1
    content: "2008 automake maintainer-mode：patch 后 mtime 倒挂触发 missing automake-1.10 重生成（设备无 automake，exit 127）；须按依赖序（configure.in → aclocal.m4 → configure → *.am → *.in）把全部时间戳刷到过去，且过去时间才能过 configure 的 ls -t sanity 检查"
    reason: "srf build() 时间戳序实测（同 E248 处方，KB-ATBOOT B' 类特征）"
