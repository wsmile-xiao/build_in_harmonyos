# conandata.yml — srf 0.1 (Sequence Read Format C++ implementation)
# Source: Debian official archive pool srf_0.1+dfsg.orig.tar.gz (the
# upstream sourceforge original is 404 as of 2026-09; salsa.debian.org
# intermittently 500s). Debian Med packaging carries the same upstream
# code (verified: salsa upstream/0.1+dfsg tree diff == 0 vs this
# tarball). PF7: Debian official pool = authoritative mirror, PR 说明已附.
sources:
  url: "https://deb.debian.org/debian/pool/main/s/srf/srf_0.1+dfsg.orig.tar.gz"
  sha256: "1a2a221e3560c4eb1a140fc0ee6b9fb23d8aa622819625c66fca1089094ae863"

patches:
  "0.1":
    - patch_file: "patches/0001-explicit-int-main.patch"
      patch_description: "implicit-int main() in 4 test programs -> int main (clang C++11 hard error)"
      patch_type: "portability"
    - patch_file: "patches/0002-configure-umask-tmpdir.patch"
      patch_description: "configure secure-tmp umask 077->022 (HMDFS exec restriction, commoncpp2/io_lib precedent)"
      patch_type: "portability"
    - patch_file: "patches/0003-iolib-config-param.patch"
      patch_description: "AC_ARG_VAR IO_LIB_CONFIG + Makefiles use $(IO_LIB_CONFIG); drop stale -lread (io_lib-config --libs already yields -lstaden-read)"
      patch_type: "portability"
    - patch_file: "patches/0004-missing-return.patch"
      patch_description: "4 non-void functions (SRF_Container::write / SRF_Read::write / SRF_ReadSet::write / SRF_writeZtr) fall off the end without return; aarch64 clang emits brk trap -> SIGTRAP/SIGSEGV at runtime (returns added)"
      patch_type: "bugfix"
