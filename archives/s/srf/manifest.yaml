# 软件级 manifest — srf
# 遵循 ARCHIVE-SPEC v3.0

software: srf

display: "SRF (Sequence Read Format)"

description: "SRF（Sequence Read Format）DNA 测序容器格式的 C++ 实现，基于 io_lib（libstaden-read）ZTR/SRF API"

category: library

homepage: "http://srf.sourceforge.net/"

license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "2008 年代代码：4 个非 void 函数掉出函数尾无 return——aarch64 clang 对 UB 路径埋 brk 陷阱（SIGTRAP/SIGSEGV），gcc/x86 时代侥幸可用；补 return 修复（0004）"
    - "tarball 无 config.guess/config.sub，configure 亦无 AC_CANONICAL_*（不调用）——KB-ATBOOT 检测项，本库无需注入"
    - "configure 内嵌 umask 077：HMDFS 临时目录不可写致 config.status 假成功（rc=0 但 Makefile 全缺）——0002 改 022（commoncpp2/io_lib 同款）"
    - "Makefile 调 $(SHELL io_lib-config ...) 非 GNU make 函数展开为空——io_lib 头/库经 CPPFLAGS/LDFLAGS env 注入；-lread 已改 -lstaden-read"
    - "maintainer-mode 时间戳链须按 autotools 依赖序刷新到过去（configure 的 ls -t sanity 检查要求）"
  common_dependencies:
    - io_lib

versions:
  "0.1":
    status: built
    build_date: "2026-10-03"
    conan_ref: "srf/0.1"
    note: "conan create 全绿（0001-0004 补丁 + test_package 消费者测试）；KB-ATBOOT 共性知识样例库"
