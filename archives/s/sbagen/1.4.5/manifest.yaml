# ============================================================
# 版本级 manifest — sbagen 1.4.5
# 文件位置: archives/s/sbagen/1.4.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# ============================================================

version: "1.4.5"
software: "sbagen"
status: built
build_date: "2026-10-01"

# 上游没有 configure/Makefile，只有 mk* 构建脚本（无标准构建系统）：
# 配方内部自定义调用 clang 编译单文件 sbagen.c。
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://uazu.net/sbagen/sbagen-1.4.5.tgz"
  sha256: "02b05d0f89f1baa6e6b282f4a5db279b4c59ee6fc400a5a9686aa11287f220e4"
  tar_format: tar.gz
  # 713168 字节；与 FreeBSD ports/FreshPorts 记录逐字节一致

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom
  configure_options: []
  # 等价的完整编译命令（上游 mk-nodevdsp 口径 + 单文件直编）
  compile_command: "clang -DT_POSIX -D_GNU_SOURCE -Wall -O2 sbagen.c -o sbagen -lm -lpthread"
  # 零三方依赖：仅 libc/libm；可选解码器（OGG/MP3）需要 tremor/libmad，
  # 其中 tremor 未在 OHOS 制品仓发布（R36），故不启用。
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁：平台适配完全依赖上游内置的 T_POSIX 目标宏
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - 上游自带 T_POSIX 目标宏（见 mk-nodevdsp）就是「无 OSS 音频设备」平台的官方支持路径：定义 NO_AUDIO，输出只走文件/管道，OHOS 适配无需任何源码补丁
  - 上游无 configure/Makefile，仅 mk* 脚本；其 shebang 指向 /bin/bash（OHOS 无此路径）且默认带 -m32，配方不能直接执行，须按 mk-nodevdsp 口径自行调用编译器
  - 上游 tarball 内自带 32 位 x86 预编译 sbagen 与 libs/*.a（x86 与 arm32）：打包只能收自建产物，否则会把错架构二进制发出去（test_package 已加 ELF machine=aarch64 断言防回归）
  - 可选解码器 OGG/MP3 依赖 tremor/libmad，tremor 未在 OHOS 制品仓发布 → 保持关闭；运行时对这类输入给出明确提示而非崩溃
  - sbagen 的 -p 预编程序列会无视 -L 长度限制写出整段序列（实测一次写出 608MB）→ 冒烟与回归测试必须避开 -p，改用 -i 加 -L 控制时长
  - OHOS 目标机 /tmp 只读（E002）：编译与运行都需显式提供可写 TMPDIR，配方 build() 与 test_package 均已注入
