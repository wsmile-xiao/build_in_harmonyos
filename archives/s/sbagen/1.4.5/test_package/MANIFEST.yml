# test_package/MANIFEST.yml
# 上游测试声明文件（CI L0e 门禁要求存在）
# 填写依据：R51「上游测试三步法」——清点 → 实际运行 → 如实回填

package: sbagen/1.4.5
homepage: "https://uazu.net/sbagen/"

# 上游测试命令：
#   上游发布包内**没有** configure/Makefile，只有 mk* 构建脚本，故不存在 make check；
#   也没有 ctest / pytest / meson test 注册项（tarball 顶层仅有 sbagen.c、mk*、
#   examples/、scripts/、libs/、若干 txt 文档）。
upstream_check_command: "（无：发布包不含 Makefile/configure/测试框架，仅 mk* 构建脚本）"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游自动化测试程序：无
upstream_tests: []

# test_package 自带的消费者测试（两层，均只使用打包产物）
test_package_tests:
  - file: test_cli_consumer.c
    description: "C 消费者：execv 调用 bin/sbagen 合成 2s WAV，解析 RIFF/WAVE 头（2ch/44100Hz/16bit/data 长度），校验左右声道非静音且互异（双耳拍频），并检查 -h 版本号"
    command: "./test_cli_consumer <pkg>/bin/sbagen <workdir>"
  - file: sbagen_consumer_e2e.py
    description: "CLI e2e：产物契约 + ELF aarch64 架构 + -h 版本 + 合成确定性 + raw/WAV 尺寸口径 + 混音生效 + -O 管道输出 + 上游示例序列合成 + 无音频设备提示 + 未编译解码器优雅报错 + 未知选项"
    command: "python3 sbagen_consumer_e2e.py <pkg> <workdir>"

# 测试断言总数（C 侧 12 项 + Python e2e 32 项 = 44）
# 实测证据（同一次 conan create 的标准输出；reports/ 不随 PR 提交）：
#   [test_cli_consumer] 12/12 checks passed
#   [sbagen_consumer_e2e] 32/32 checks passed
assertion_count: 44
