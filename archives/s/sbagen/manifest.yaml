software: sbagen
display: "SBaGen"
description: "Sequenced Binaural Beat Generator — synthesizes binaural beats from tone-sets/sequence files to files or pipes"
category: audio
homepage: "https://uazu.net/sbagen/"
license: GPL-2.0-only
build_system: custom
ohos_adaptation:
  key_points:
    - "OHOS 无 OSS 音频设备（/dev/dsp）：采用上游自带的 T_POSIX 无设备目标（NO_AUDIO），输出只走文件/管道，因此无需任何源码补丁"
    - "上游没有 configure/Makefile，只有指向 /bin/bash 且默认 -m32 的 mk* 脚本；配方在 build() 内按 mk-nodevdsp 口径用 OHOS clang 直编单文件 sbagen.c"
    - "零三方依赖（仅 libc/libm/libpthread）；可选 OGG/MP3 解码需要 tremor，其未在 OHOS 制品仓发布（R36），故不启用"
    - "上游 tarball 自带 x86/arm32 预编译产物，配方只打包自建 aarch64 产物；test_package 断言 ELF machine == aarch64 防回归"
    - "test_package 为真实消费者（C 侧 fork+execv 运行 bin/sbagen 并解析 WAV，Python e2e 直调 CLI）；上游无自动化测试可运行，清点证据见 1.4.5/notes.md（R51）"
versions:
  "1.4.5":
    status: built
    build_date: "2026-10-01"
    packaging: conan
    notes: "首次适配；零依赖零补丁（上游 T_POSIX 无设备目标）；test_package 44 断言（C 侧 12 + Python e2e 32），L1e 破坏性负测通过（R34）"
    dependencies: []
