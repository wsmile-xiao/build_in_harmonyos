software: synergy-core
display: "Synergy Core"
description: "Cross-platform keyboard and mouse sharing service"
category: system
homepage: "https://symless.com/synergy"
license: "GPL-2.0-only WITH LicenseRef-OpenSSL-Exception"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Uses native InputKit monitoring, interception, and injection APIs"
    - "Uses the native display manager and pasteboard APIs"
    - "Builds the unified command-line service without the Qt GUI"
    - "Uses AWS-LC as the OpenSSL-compatible TLS provider"
  common_dependencies:
    - aws-lc
  validation_boundary: >-
    Source selection and native-library linkage are verified; cross-device
    input and clipboard, primary-screen interception, display hotplug, hotkey,
    and screensaver runtime workflows remain unverified.

versions:
  "1.20.4":
    status: built
    build_date: "2026-08-09"
    conan_ref: "synergy-core/1.20.4"
    local_cross_build_status: "r33-candidate-local-cross-build-pass"
    formal_conan_verify: "pass-r33-current-ci-input-build-only"
    blocked_reason: "target W3, successor independent W4, W5, PR, CI, and submission remain pending"
