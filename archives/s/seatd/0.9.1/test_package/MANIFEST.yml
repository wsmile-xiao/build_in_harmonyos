package: seatd/0.9.1
homepage: "https://git.sr.ht/~kennylevinsen/seatd"

upstream_check_command: "meson test -C <builddir>"
upstream_test_in_build: true
upstream_test_command: "meson test -v --print-errorlogs --no-rebuild -C <builddir> linked_list connection"

upstream_tests:
  - file: tests/linked_list.c
    source: upstream
    description: "Doubly linked-list insertion, removal, iteration, and take operations"
    command: "meson test -C <builddir> linked_list"
    included: true
  - file: tests/connection.c
    source: upstream
    description: "Socketpair message encoding and SCM_RIGHTS file-descriptor passing"
    command: "meson test -C <builddir> connection"
    included: true
  - file: tests/poller.c
    source: upstream
    description: "File-descriptor and real-time-signal event dispatch"
    command: "meson test -C <builddir> poller"
    included: false
    skip_reason: "Existing OHOS aarch64 evidence shows an indefinite block; run separately with an external timeout during device validation"

test_package_tests:
  - file: test_package.c
    description: "15 assertions covering libseat errors and the noop backend lifecycle"
    command: "./test_seatd"

assertion_count: 15
