software: seatd
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.9.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://git.sr.ht/~kennylevinsen/seatd/archive/0.9.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: meson
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "-Dlibseat-logind=disabled"
    - "-Dman-pages=disabled"
    - "-Dwerror=false"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "需要禁用 -Dwerror=false 以避免 OpenHarmony SDK sys/socket.h 中 CMSG_NXTHDR 宏的类型比较警告"
    - "poller 测试超时（HarmonyOS poll 系统调用行为差异），可跳过"
    - "需要禁用 libseat-logind（无 systemd/elogind 支持）"
