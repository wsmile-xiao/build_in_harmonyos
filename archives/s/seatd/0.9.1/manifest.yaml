software: seatd
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.9.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-22"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/kennylevinsen/seatd/archive/refs/tags/0.9.1.tar.gz"

  # 源码校验和
  sha256: "819979c922a0be258aed133d93920bce6a3d3565a60588d6d372ce9db2712cd3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: meson
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dlibseat-logind=disabled"
    - "-Dman-pages=disabled"
    - "-Dexamples=disabled"
    - "-Dwerror=false"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "OHOS sys/socket.h CMSG_NXTHDR 宏有类型比较警告，需禁用 werror"
    - "poller 测试在 OHOS 上无限阻塞（poll 系统调用行为差异），排除该测试"
    - "禁用 libseat-logind（OHOS 无 systemd/elogind 支持）"
    - "OHOS profile 仅声明 clang，需注入 llvm-ar/llvm-ranlib 到 meson native file"
