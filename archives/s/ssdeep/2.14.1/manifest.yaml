software: ssdeep
version: "2.14.1"
status: published
build_date: "2026-06-02"
build_system: autotools

source:
  url: "https://github.com/ssdeep-project/ssdeep/releases/download/release-2.14.1/ssdeep-2.14.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ssdeep uses -V flag for version (not --version)"
  - "Debian orig tarball requires manual bootstrap (autoreconf), no pre-generated configure"
  - "HMDFS: libtoolize fails (cannot readdir share/libtool/build-aux), manual build-aux copy needed"
  - "aclocal/automake need AUTOM4TE/AUTOCONF env vars (template @am_AUTOM4TE@ not substituted)"
  - "DESTDIR mode: verify-build needs --install-prefix to specify TEST_PREFIX/DEFAULT_PREFIX"