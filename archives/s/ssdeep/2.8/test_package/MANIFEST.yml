# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）

package: ssdeep/2.8
homepage: "https://github.com/ssdeep-project/ssdeep"

# 上游测试命令分析：上游源码无 tests/ 目录、无 TESTS/check_PROGRAMS 注册、
# 无测试框架宏（grep TEST_CASE/CHECK/assert 无命中），make check 为空操作
# （exit=0）。full 枚举台账见 notes.md「上游测试完整枚举台账」。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无独立上游测试用例
upstream_tests: []

# test_package 自带的测试（随本 PR 交付，均在 conan create 内实际编译运行）
test_package_tests:
  - file: test.c
    description: "消费者测试 — 调用 fuzzy_hash_buf/fuzzy_compare 公开 API，验证确定性哈希与相同摘要得分"
    command: "./test_ssdeep"
  - file: ssdeep-ohos-test.c
    description: "HarmonyOS 专项测试 — 9 项断言：fuzzy_hash_buf 成功且非空 / 同内容两次哈希一致（确定性）/ fuzzy_hash_filename 与 fuzzy_hash_buf 摘要一致 / 相同摘要 fuzzy_compare 得分=100 / 近似内容哈希成功 / 近似内容得分>0（单字节扰动）/ 无关内容哈希成功 / 无关内容得分=0 / CLI ssdeep 输出包含被哈希文件名（管线可用）"
    command: "./test_ssdeep_ohos"

# 测试断言总数口径（与 PR body 一致）：
# assertion_count = 9 = ssdeep-ohos-test.c（HarmonyOS 专项测试）的 9 项断言；
# test.c 消费者验证（3 个运行校验点：非空、确定性、score>=0）为消费者可用性
# 门禁，与上游测试、鸿蒙专项测试分别计数，不计入 assertion_count（避免重复充数）。
assertion_count: 9
