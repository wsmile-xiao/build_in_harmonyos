# test_package/MANIFEST.yml
package: slre/1.3
homepage: "https://github.com/cesanta/slre"

upstream_check_command: "clang -O2 -I<src> unit_test.c libslre.a -o slre_unit_test && ./slre_unit_test"
upstream_test_in_build: true
upstream_test_command: "./slre_unit_test"

upstream_tests:
  - file: unit_test.c
    source: slre-1.3/unit_test.c
    description: >-
      Upstream unit test: single main() with 126 ASSERT() cases covering
      metacharacters, character sets, flags, quantifiers, capture groups,
      slre_replace and URL extraction. Compiled and executed inside build();
      124/126 pass — the 2 failing ASSERTs (lines 87-88) encode stale "(?m)"
      expectations that slre.c 1.3 does not implement (only the "(?i)" flag
      exists), so they fail on every platform (upstream defect, not OHOS).
    command: "./slre_unit_test"

test_package_tests:
  - file: test.c
    description: >-
      Consumer-side API validation: 10 CHECKs on slre_match() covering
      literal/charset/flag/hex-escape matching, capture groups and error
      codes. Returns non-zero on any failed check.
    command: "./test_slre"

assertion_count: 10
