# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: snaphu/2.0.7
homepage: "https://web.stanford.edu/group/radar/softwareandlinks/sw/snaphu/"

# 上游没有 check/test 目标：tarball 只有 README / README_releasenotes.txt /
# bin/ / config/ / man/ / src/，src/Makefile 的目标是 all/gdebug/install/clean。
upstream_check_command: ""

# 上游无测试套件，因此 build() 中没有可集成的上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证，R34：实质驱动被测二进制）
test_package_tests:
  - file: test_snaphu.c
    description: "驱动已安装的 snaphu 执行 -hv，断言退出码 1（上游缺 infile 视为用法错误）且输出含 'snaphu v2.0.7' 与 usage"
    command: "./test_snaphu <snaphu-bin>"
  - file: test_snaphu.c
    description: "已知答案：16x16 全零相位输入解缠后每个样本精确为 0，输出恰为 R*C*4 字节"
    command: "./test_snaphu <snaphu-bin>"
  - file: test_snaphu.c
    description: "16x16 缠绕斜坡：退出码 0、输出 R*C*4 字节、样本全为有限值、与缠绕输入不同且非恒定场，stdout 含 'Program snaphu done'"
    command: "./test_snaphu <snaphu-bin>"

# 测试断言总数（test_snaphu.c 中的 check() 调用数）
assertion_count: 14
