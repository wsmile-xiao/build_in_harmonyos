# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# R51 上游测试清点证据（收尾-5 2026-09-29 实测，源码 15 个文件）：
#   - 目录清单：arg.h config.def.h config.h config.mk st.c st.h st.info win.h x.c
#     FAQ LEGACY LICENSE Makefile README TODO st.1 —— **没有 tests/ 也没有 test/**（ls 实测不存在）
#   - Makefile 目标：all / st / clean / dist / install / uninstall —— **没有 check 目标**
#     （`grep -n '^check' Makefile` 无命中）
#   ⇒ 结论：上游**确无测试套件**（suckless 惯例），因此下方 upstream_tests 为空、
#     upstream_check_command 留空；消费者侧由 test_package_tests 的 st 二进制冒烟测试覆盖。

package: st/0.9.1
homepage: "https://st.suckless.org/"

# 上游测试命令 —— 上游无 check 目标，故留空（清点证据见文件头）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试（上游无测试 ⇒ false）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 —— 上游确无测试套件（R51 清点证据见文件头）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34 非空壳：真实执行打包产物)
test_package_tests:
  - file: test_st.py
    source: test_package/test_st.py
    description: "消费者测试：真实执行打包产物 st，断言 -v 输出含 0.9.1、-h 输出 usage、产物可执行"
    command: "ST_BINDIR=<bin>/st python3 test_st.py"

# 测试断言数（test_st.py 内四处校验：产物存在 / 可执行 / 版本串 / usage）
assertion_count: 4
