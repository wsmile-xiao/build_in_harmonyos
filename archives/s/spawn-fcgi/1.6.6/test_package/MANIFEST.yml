# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: spawn-fcgi/1.6.6
homepage: "https://www.lighttpd.net/"

# 上游测试命令 (spawn-fcgi 使用 meson 构建，上游无 make check)
upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# spawn-fcgi 上游 meson.build 定义了 test('spawn-fcgi', ...) 测试
upstream_tests:
  - file: src/spawn-fcgi.c
    source: spawn-fcgi-1.6.6/src/spawn-fcgi.c
    description: "spawn-fcgi 主程序源码，编译生成二进制"
    command: "spawn-fcgi -v"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 spawn-fcgi -v 验证二进制功能"
    command: "spawn-fcgi -v"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
