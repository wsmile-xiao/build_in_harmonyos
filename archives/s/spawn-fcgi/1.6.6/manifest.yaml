software: spawn-fcgi
build_system: meson
# 版本级 manifest
# 文件位置: archives/s/spawn-fcgi/1.6.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.6"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.lighttpd.net/download/spawn-fcgi-1.6.6.tar.gz"

  # 源码校验和
  sha256: "4ffe2e9763cf71ca52c3d642a7bfe20d6be292ba0f2ec07a5900c3110d0e5a85"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "meson setup build --prefix=$DEFAULT_PREFIX"
    - "ninja -C build -j1"
    - "DESTDIR=$TEST_PREFIX ninja -C build install"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 特殊环境变量
  env:
    PYTHONHOME: "/data/service/hnp/python.org/python_3.12"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "meson项目需要设置PYTHONHOME环境变量以解决python3-fixed路径问题"
  - "spawn-fcgi使用-v显示版本而非--version"
  - "meson项目不支持--build/--host/--target参数，为native编译"
  - "G0 clean-verify脚本对meson项目存在已知限制：会尝试执行./configure而非meson setup"
