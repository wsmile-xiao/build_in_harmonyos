software: sirocco
version: 2.1.1
build_system: autotools
status: built
build_date: '2026-09-19'
source:
  url: https://github.com/miguelmarco/SIROCCO2/releases/download/2.1.1/libsirocco-2.1.1.tar.gz
  sha256: 83d1dd5622120eda42c475696235dd67be8072a76baad0a70693d9743a659a61
knowledge_gained:
- sirocco (SIROCCO2) 是 Autotools C++ 库，configure.ac 用 AC_PROG_CXX + LT_INIT，无 --with-gmp/mpfr
  选项，因此把制品仓 gmp/mpfr 的 include/lib 通过 CPPFLAGS/LDFLAGS 注入（AutotoolsToolchain environment）
- '公开头 include/sirocco.h 内嵌 #include <mpfr.h>，且库符号是 C++ mangled（无 extern "C"），消费者必须用
  C++ 编译链接（test_package 用 CMake + LANGUAGES CXX）'
- '上游测试为 Automake TESTS = sirocco_test sirocco_minimal_test（tests/Makefile.am），make
  check 产 test-suite.log 汇总 `# TOTAL: 2`'
- OHOS 需给 configure 显式传入 llvm-ar/ld.lld/llvm-ranlib 等（同 mpfr），否则 AM_PROG_AR/LT_INIT
  找不到 GNU binutils 同名工具
- HMDFS 下 configure 的 umask 077 需改为 022（gmp/fplll/arb 同源问题），否则 conftest 临时目录不可用
- sirocco 依赖的 gmp/mpfr 若声明裸版本 gmp/6.3.0 / mpfr/4.2.2，preflight 会解析到 conancenter 的配方；conancenter
  的 gmp recipe 带 m4 tool_require，其 m4/1.4.19 未做 OHOS 适配，在 CONFIG_SHELL=/data/service/hnp/bin/bash(HMDFS
  getcwd 损坏)下 configure 报 working directory cannot be determined → 整链失败。修复（soplex/7.1.6
  2026-09-18 先例）：改用【本仓专属补丁版本】gmp/6.3.0.1、mpfr/4.2.2.1（与裸版本同一 tarball，sha256 一致，仅构建配置/补丁差异），conancenter
  无这些版本，解析强制落 ohpcd 预编译二进制 → 不源码重编 → 不进 m4。requirements() 用 override=True 使整图（含 mpfr
  传递的 gmp/6.3.0）统一到本仓补丁版本。注意：给 tool_requires 传 consistent 参数在 OHOS conan 2.29.1 会抛
  TypeError；根配方 tool_require m4 覆盖不到 gmp/mpfr 各 build 上下文 m4 节点。
