# test_package/MANIFEST.yml — sirocco 2.1.1
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sirocco/2.1.1
homepage: "https://github.com/miguelmarco/SIROCCO2"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "libsirocco-2.1.1.tar.gz (official GitHub Release 2.1.1, SHA-256 verified)"
  source_sha256: "83d1dd5622120eda42c475696235dd67be8072a76baad0a70693d9743a659a61"
  build_system: "Autotools (automake TESTS)"
  test_definition: >
    tests/Makefile.am declares check_PROGRAMS = TESTS =
    sirocco_test sirocco_minimal_test. `make check` builds and runs these
    two test programs; the Automake test driver writes tests/test-suite.log
    with `# TOTAL: 2`, `# PASS: 2`, `# FAIL: 0`. There is no other
    test framework (unit/integration) in the release tarball.

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试程序（Automake TESTS = sirocco_test sirocco_minimal_test）
upstream_tests:
  - file: tests/sirocco_test.cpp
    source: libsirocco-2.1.1/tests/sirocco_test.cpp
    description: "双精度 homotopyPath 与 MPFR homotopyPath_mp 的路径跟踪"
    command: "./sirocco_test"
  - file: tests/sirocco_minimal_test.cpp
    source: libsirocco-2.1.1/tests/sirocco_minimal_test.cpp
    description: "homotopyPath / _comps / _mp / _mp_comps 基础冒烟"
    command: "./sirocco_minimal_test"

# 上游测试注册总数与口径：2 个 Automake TESTS 测试程序（tests/Makefile.am）
upstream_test_total: 2
upstream_test_count_method: autotools_tests

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sirocco.cpp
    description: "消费者视角: 调用 4 个公开 API 并断言返回的认证路径非空、点数>0"
    command: "./test_sirocco"

# 测试断言总数 (近似值, 用于质量评估)——消费者测试 4 个 API 各 1 项断言
assertion_count: 4
