software: spdlog
version: "1.17.0"
build_system: cmake
build_date: "2026-08-27"
status: built
source:
  url: "https://github.com/gabime/spdlog/archive/refs/tags/v1.17.0.tar.gz"
  sha256: "d8862955c6d74e5846b3f580b1605d2428b11d97a410d86e2fb13e857cd3a744"
knowledge_gained:
  - spdlog 1.17.0 需 fmt 10+（spdlog/fmt/fmt.h 引用 fmt/base.h），使用 fmt/12.2.0
  - 以 SPDLOG_FMT_EXTERNAL=ON 构建，与 1.11.0 路线一致
  - CMake 项目，配置选项: SPDLOG_BUILD_PIC=ON, SPDLOG_INSTALL=ON
  - 编译产物: 静态库/动态库 libspdlog.{a,so} + 头文件 + CMake 配置文件
configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
  - "-DSPDLOG_BUILD_PIC=ON"
  - "-DSPDLOG_INSTALL=ON"
  - "-DSPDLOG_BUILD_TESTS=OFF"
  - "-DSPDLOG_BUILD_EXAMPLE=OFF"
patches_applied: []
source_url: https://github.com/gabime/spdlog/archive/refs/tags/v1.17.0.tar.gz
