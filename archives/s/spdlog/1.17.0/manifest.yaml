software: spdlog
version: 1.17.0
status: success
build_system: cmake
created_at: 2026-04-21
knowledge_gained:
  - spdlog 1.17.0 可用 bundled fmt 独立编译，无需外部 fmt
  - CMake 项目，配置选项: SPDLOG_BUILD_PIC=ON, SPDLOG_INSTALL=ON
  - 编译产物: 静态库 libspdlog.a + 头文件 + CMake 配置文件
configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
  - "-DSPDLOG_BUILD_PIC=ON"
  - "-DSPDLOG_INSTALL=ON"
  - "-DSPDLOG_BUILD_TESTS=OFF"
  - "-DSPDLOG_BUILD_EXAMPLE=OFF"
  - "-DSPDLOG_BUILD_BENCH=OFF"
patches_applied: []
build_log: logs/build.log
source_url: https://api.github.com/repos/gabime/spdlog/tarball/v1.17.0
