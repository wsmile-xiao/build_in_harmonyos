software: spdlog
display: "spdlog"
description: "Fast C++ logging library"
category: library
homepage: "https://github.com/gabime/spdlog"
license: MIT
build_system: cmake

versions:
  "1.11.0":
    status: built
    build_date: "2026-08-06"
    notes: >-
      首个鸿蒙 PC conan 配方，未打补丁。

      **版本钉在 1.11.0**：1.15.3 的 `spdlog/fmt/fmt.h` 会 `#include <fmt/base.h>`，
      那是 fmt 10+ 才有的头；我们为迁就 ad-map 的 libfmt.so.8 钉了 fmt 8.1.1，
      两者不兼容（实撞 `fatal error: 'fmt/base.h' file not found`）。
      1.11.0 用的是 fmt/core.h，与 fmt 8 匹配。

      **以 SPDLOG_FMT_EXTERNAL=ON 构建**，因为 ad-map 系同时依赖 fmt 与 spdlog，
      必须是同一份 fmt —— 同进程里两套 fmt 符号会打架。

      **该宏必须经 cpp_info.defines 传给消费方**（连同 SPDLOG_COMPILED_LIB）。
      缺了它，消费方的 `spdlog/fmt/fmt.h` 会走 bundled 分支去 include
      `spdlog/fmt/bundled/core.h`，而以外部 fmt 构建时那套头根本没装进包
      （实撞：file not found）。

      test_package 把日志导进内存流断言写出的字符串本身，共 5 组：
      写入/fmt 转发/fmt 说明符穿透/级别过滤/自定义 pattern，
      并在编译期确认收到了 SPDLOG_FMT_EXTERNAL —— 防的是「宏没传、
      却因 bundled 头恰好存在而静默编过」，那样两份 fmt 会同时在场。
  "1.17.0":
    status: built
    build_date: "2026-08-27"
    notes: >-
      spdlog 1.17.0（2026-01-04 release），以外部 fmt/12.2.0 构建。

      spdlog 1.17.0 的 `spdlog/fmt/fmt.h` 引用 `fmt/base.h`（fmt 10+ 才有的头），
      必须用 fmt/12.2.0 而非 fmt/8.1.1。1.17.0 内置 bundled fmt 12.1.0，
      使用 fmt/12.2.0（>=12.1.0）外部构建。

      完全继承 1.11.0 的 OHOS 平台适配（CMAKE_SYSTEM_NAME=OHOS 守卫 / 二进制签名 /
      include 目录检测 / SPDLOG_FMT_EXTERNAL+SPDLOG_COMPILED_LIB 经 cpp_info.defines 传出）。

      test_package 与 1.11.0 一致：5 组断言 + 编译期确认 SPDLOG_FMT_EXTERNAL。
