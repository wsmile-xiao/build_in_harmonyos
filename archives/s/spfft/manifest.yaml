# manifest.yaml - spfft 软件级元数据
software: spfft
display: "SpFFT"
description: "面向稀疏频域数据的 3D FFT 变换库（C/C++ 接口），ETH-CSRS 出品，常用于分子动力学与材料模拟"
category: "library"
homepage: "https://github.com/eth-cscs/SpFFT"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "SPFFT_MPI=OFF（OHOS 无 MPI 运行时）、SPFFT_OMP=OFF、CUDA/ROCm 自动关闭"
    - "SPFFT_BUILD_TESTS=OFF：上游测试经 CMake FetchContent 拉 googletest/CLI11（github 网络 + 制品仓均无替代），原因与证据见 notes"
    - "FFTW 后端取自制品仓 fftw/3.3.10.3"

versions:
  "1.1.1":
    status: built
    build_date: "2026-09-25"
    source_url: "https://github.com/eth-cscs/SpFFT/archive/refs/tags/v1.1.1.tar.gz"
    source_sha256: "675a048124a96b8c7f89d59d3ac0355833e28b38622e76c4d478ee91b25d766c"
