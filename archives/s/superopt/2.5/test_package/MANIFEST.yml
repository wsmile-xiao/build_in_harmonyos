# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: superopt/2.5
homepage: "https://www.gnu.org/software/superopt/"

# 上游测试命令: 上游无自动化测试（Makefile 仅 build 目标，无 check/TESTS）
upstream_check_command: "无（上游无测试套件，清点证据见 notes.md）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: "(无)"
    source: "superopt-2.5 全树无 TESTS/check 目标/测试脚本"
    description: "上游无自动化测试（N_static=0，仅消费者测试补位）"
    command: "(无)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_superopt.sh
    description: "消费者测试：运行安装的 superopt-sparc 二进制，断言真实合成运行（-flts0 -as 输出结果序列）与空参数/未知选项退出码"
    command: "sh test_superopt.sh <superopt-sparc 路径>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
