package: seccure/0.5
homepage: "https://point-at-infinity.org/seccure/"

upstream_check_command: "make -C test -j1"
upstream_test_in_build: true
upstream_test_command: "make -C test -j1"

upstream_tests:
  - file: encdec-test
    source: test/Makefile
    description: "Encrypt and decrypt message.txt, then compare the round trip with cmp"
    command: "make -C test encdec-test"
  - file: signveri-test
    source: test/Makefile
    description: "Sign message.txt with a brainpoolp512r1 key and verify the signature"
    command: "make -C test signveri-test"
  - file: signcrypt-test
    source: test/Makefile
    description: "Signcrypt with one key and veridec with the other key, then compare"
    command: "make -C test signcrypt-test"

test_package_tests:
  - file: run_upstream_tests.sh
    description: "Rerun all three upstream end-to-end targets against the installed binaries and verify all eight hard-linked command names are executable"
    command: "run_upstream_tests.sh <package>/bin <build>/upstream-test"

assertion_count: 11
