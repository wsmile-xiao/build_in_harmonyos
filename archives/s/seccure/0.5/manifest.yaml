version: "0.5"
software: seccure
status: built
build_date: "2026-09-28"
conan_ref: "seccure/0.5"

source:
  url: "https://deb.debian.org/debian/pool/main/s/seccure/seccure_0.5.orig.tar.gz"
  sha256: "6566ce4afea095f83690b93078b910ca5b57b581ebc60e722f6e3fe8e098965b"
  tar_format: tar.gz

build:
  system: make
  configure_options: []
  dependencies:
    - libgcrypt/1.11.0
  cc: clang

patches_applied: []

knowledge_gained:
  - "seccure uses a small plain Makefile rather than configure/CMake; passing dependency include and library paths explicitly is more reliable than relying on pkg-config."
  - "The upstream install target hard-codes /usr/bin, so the recipe installs the eight hard-linked command names and the man page explicitly."
  - "The installed suite must preserve all eight command names because seccure dispatches behavior from argv[0] of the shared hard-linked executable."
  - "Three real upstream end-to-end targets cover encrypt/decrypt, sign/verify, and signcrypt/veridec; all are executed on the HarmonyOS device."

tests:
  upstream:
    framework: make
    test_count: 3
    note: "test/Makefile targets encdec-test, signveri-test, and signcrypt-test."
  adapted:
    command: "Conan test_package -> run_upstream_tests.sh"
    passed: 11
    failed: 0
    pass_rate: 11/11
    breakdown:
      upstream_end_to_end: 3
      installed_command_contract: 8

blockers: []

verification:
  environment: OpenDesk HarmonyOS aarch64
  command: "conan create archives/s/seccure/0.5 -pr:b=ci/conan/profiles/ohos-aarch64 -pr:h=ci/conan/profiles/ohos-aarch64 --build=missing"
  upstream_pass_rate: 3/3 (100%)
  adapted_pass_rate: 11/11 (100%)
