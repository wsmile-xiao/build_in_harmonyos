knowledge_gained:
  - "严格 C++11/OHOS clang 不提供未限定 uint；exceptions.hpp 和 debug-only po_message.hpp 必须使用 std::size_t。"
  - "spirit-po 是 header-only；Boost.Spirit 头文件是唯一 Conan 构建依赖，test_package 必须验证真实 API。"
  - "libintl 对照测试需 libintl.h 与 libintl 链接库；OHOS 设备仅有 msgfmt 时不能以 msgfmt 代替运行时对照。"

