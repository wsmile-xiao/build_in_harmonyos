package: spirit-po/1.1.2
homepage: "https://github.com/cbeck88/spirit-po"

# The upstream repository has a Makefile only for the unit suite; the
# package recipe reproduces that compile/run entry point in build().
upstream_check_command: "make -C test check"
upstream_test_in_build: true
upstream_test_command: "clang++ -std=c++11 -isystem../include -isystem<Boost>/include test/main.cpp -o upstream-unit && ./upstream-unit"

upstream_tests:
  - file: test/main.cpp
    source: spirit-po-1.1.2/test/main.cpp
    description: "手写上游单元测试：126 个运行时 assertion，覆盖复数表达式、PO grammar、目录解析和 merge"
    command: "upstream-unit (126/126 passed)"
    case_count: 126
  - file: test_libintl/main.cpp
    source: spirit-po-1.1.2/test_libintl/main.cpp
    description: "与 GNU libintl 对照的 206 个 PO 数据驱动用例；OHOS 缺少 libintl.h 和 libintl 链接库，按证据跳过"
    command: "SKIPPED: libintl.h and libintl link library unavailable on OHOS"
    case_count: 206
    status: skipped
    skip_reason: "OHOS environment lacks libintl.h and libintl link library; msgfmt alone cannot build the upstream comparator"

test_package_tests:
  - file: test_spirit_po.cpp
    description: "消费者测试：解析 PO header、目录大小、gettext/pgettext/ngettext 及缺失键回退"
    command: "./test_spirit_po"
    case_count: 1

# The upstream unit source reports 126 assertion-level checks.  The 206
# libintl entries are data-driven executable-level cases, not fixed assertions.
assertion_count: 126
upstream_case_count: 332
consumer_case_count: 1
