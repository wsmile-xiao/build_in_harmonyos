software: spirit-po
display: "spirit-po"
description: "Header-only C++11 GNU gettext PO parser based on Boost.Spirit"
category: localization
homepage: "https://github.com/cbeck88/spirit-po"
license: BSL-1.0
build_system: custom

ohos_adaptation:
  key_points:
    - "Header-only package installs include/spirit_po/ without a library artifact"
    - "Requires boost/1.90.0 headers"
    - "Two std::size_t portability patches fix strict OHOS clang compilation"
  common_dependencies:
    - "boost/1.90.0"

versions:
  "1.1.2":
    status: built
    build_date: "2026-09-03"
    conan_ref: "spirit-po/1.1.2"
    note: "Upstream unit 126/126; libintl comparison 206 cases explicitly skipped because OHOS lacks libintl.h and libintl link library; consumer 1/1"
