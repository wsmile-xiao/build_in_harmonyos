software: surfraw
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统（顶层，G4门禁需要）
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.openbsd.org/pub/OpenBSD/distfiles/surfraw-2.3.0.tar.gz"

  # 源码校验和
  sha256: "ad0420583c8cdd84a31437e59536f8070f15ba4585598d82638b950e5c5c3625"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.status.patch"
  - "0002-opensearch-discover.patch"
  - "0003-opensearch-genquery.patch"
  - "0004-surfraw-update-path.IN.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autoconf 2.69 config.status uses umask 077 for temp dirs, which creates unwritable directories on HMDFS; fix by changing to umask 002"
  - "perl scripts with hardcoded #!/usr/bin/perl shebang fail on OHOS where perl is at ~/usr/local/bin/perl and /usr/bin is read-only; fix by using #!/usr/bin/env perl"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/surfraw-2.3.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/surfraw-2.3.0.work
  source_orig_hash: babbeb1ad3f06bae
  source_work_hash: d8101f75b2cbe045
  generated_at: '2026-06-24T15:10:01'
  patches_count: 4

patch_classification:
  - file: 0001-config.status.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-opensearch-discover.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-opensearch-genquery.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-surfraw-update-path.IN.patch
    type: auto
    platform_only: True
    guard: 'pending'
