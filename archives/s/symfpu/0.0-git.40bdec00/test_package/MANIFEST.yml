# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: symfpu/0.0-git.40bdec00
homepage: "https://github.com/martin-cs/symfpu"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 test 程序 = applications/test.cpp，单二进制自校验：
#   24 个测试项 (unpackPack/negate/absolute/isNormal/isSubnormal/isZero/
#   isInfinite/isNaN/isPositive/isNegative/smtlibEqual/ieee754Equal/
#   lessThan/lessThanOrEqual/multiply/add/subtract/divide/max/min/sqrt/
#   rti/fma/remainder)，舍入模式 RNE/RTP/RTN/RTZ；
#   通过判据 = 无 "vector[...]" 失配行输出（程序自然终态 exit=1 为上游设计）。
upstream_tests:
  - file: applications/test.cpp
    source: symfpu-0.0-git.40bdec00/applications/test.cpp
    description: "SymFPU 单精度位向量运算 vs 原生 float 差分测试（24 项 × 舍入模式，15876 向量/项）"
    command: "./test --allTests --specialValues"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者验证：仅用公开头文件/API 调用 SymFPU add/multiply/unpackPack/isNaN 并与原生 float 对照"
    command: "./test_symfpu"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 24