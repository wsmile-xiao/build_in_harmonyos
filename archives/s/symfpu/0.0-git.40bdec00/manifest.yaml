# 编译中学到的知识
knowledge_gained:
- "E600: 上游 Makefile flags 硬编码 x86 专属编译选项（-msse2 -mfpmath=sse -mfma -mno-fma4）在 aarch64/OHOS 被 clang 拒绝（unknown FP unit 'sse'），需 patch 移除或配方侧覆盖"
- "E601: glibc 专属头文件（ieee754.h 等）在 OHOS musl 系 libc 缺失，需用可移植位域 union/内联定义替代"
- "symfpu 上游 Makefile 期望源码目录名为 symfpu/（子 Makefile -I../..），conan 构建需父目录 symlink；-j1 串行避免顶层隐式规则竞争"
- "上游 test 程序 max/min 在 ±0 平局与 C fmaxf/fminf 有语义差异（SMT-LIB fp.max/min），属上游参考差异非 OHOS 适配缺陷"
