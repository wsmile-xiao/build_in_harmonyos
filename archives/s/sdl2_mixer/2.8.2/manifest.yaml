  sha256: ""
  tar_format: tar.gz

build:
  build_system: cmake
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DSDL2MIXER_CMD=OFF"
    - "-DSDL2MIXER_MOD=OFF"
    - "-DSDL2MIXER_GME=OFF"
    - "-DSDL2MIXER_MIDI_FLUIDSYNTH=OFF"
    - "-DSDL2MIXER_SAMPLES=OFF"
    - "-DSDL2MIXER_WAVPACK=OFF"
    - "-DSDL2MIXER_OPUS=OFF"
    - "-DSDL2MIXER_DEPS_SHARED=OFF"
  dependencies:
    - "sdl2/2.30.10"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-build-scripts-config.guess.patch"
  - "0002-build-scripts-config.sub.patch"

knowledge_gained:
  - "SDL2_mixer使用CMake构建系统（autotools的config.status在HMDFS上有权限问题）"
  - "需要config.guess/config.sub OHOS triplet补丁（E007）才能识别HarmonyOS系统"
  - "opusfile依赖ogg头文件，但ogg/ogg.h缺失导致无法启用Opus支持"
  - "内置编解码器（stb_vorbis/dr_flac/minimp3/timidity）无需外部依赖"
  - "libxmp/wavpack/mpg123/modplug/gme/fluidsynth在OHOS上无预编译包"

