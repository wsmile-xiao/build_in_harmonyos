sources:
  url: "https://www.libsdl.org/release/SDL-1.2.15.tar.gz"
  sha256: "d6d316a793e5e348155f0dd93b979798933fb98aa1edebcc108829d6474aad00"

patches:
  - patch_file: "patches/0001-config-guess-ohos.patch"
    patch_description: "Teach the bundled 2009-vintage config.guess the HarmonyOS system type (aarch64-unknown-linux-ohos)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-config-sub-ohos.patch"
    patch_description: "Accept the aarch64/linux-ohos triplet in the bundled 2009-vintage config.sub"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-configure-umask-022.patch"
    patch_description: "Create config.status tmp dir with umask 022 (setgid hmdfs makes 0700 dirs unwritable for the non-owner build UID)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-systhread-ohos-no-pthread-cancel.patch"
    patch_description: "Guard pthread_setcanceltype/pthread_cancel with capability macro SDL_NO_THREAD_CANCEL (musl does not implement POSIX thread cancellation; defined from the recipe when the configure probe detects its absence)"
    patch_type: "portability"
    strip: 1
