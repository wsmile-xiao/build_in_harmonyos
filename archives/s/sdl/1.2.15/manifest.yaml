# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.15/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.15"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.libsdl.org/release/SDL-1.2.15.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "SDL 1.2.15（2012）自带 2009 版 autotools 辅助脚本：config.guess 完全没有 HarmonyOS 分支、config.sub 既无 aarch64 机器识别也无 linux-ohos os 分支——必须在 case 分派首部插 HarmonyOS 分支、补 aarch64 到机器列表、把 linux-ohos 加进 maybe_os/os 合法列表并加 -linux-ohos 特判"
  - "SDL 1.2 主库与 upstream testautomation 分离构建（test/ 需单独 configure），配方以 test_package 驱动 dummy 视频驱动 + timer 完整调用链（Init/SetVideoMode/FillRect/BlitSurface/Flip/GetTicks）"
  - "musl(OHOS) 不实现 POSIX 线程取消：pthread_setcanceltype/pthread_cancel 链接期 undefined symbol，需 #ifndef __OHOS__ 守卫（SDL2 配方同款补丁），且 SDL_SYS_KillThread 的 #ifdef PTHREAD_CANCEL_ASYNCHRONOUS 要改成 && !defined(__OHOS__) 走 pthread_kill 回退"
  - "老 autotools 库在 hmdfs 卷同样踩 config.status umask 077 建目录 Problem：0003 umask 022 补丁（同 inn2）；另需 cross.cache 预置 ac_cv_prog_cc_works + ac_cv_prog_cc_cross 双值"
  - "conan copy(self, 'include/*.h', dst=...) 会保留 glob 里的 include/ 前缀路径——必须 keep_path=False，否则头文件落到 include/SDL/include/SDL.h"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
