# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sdl/1.2.15
homepage: "https://www.libsdl.org/"

# 上游测试命令：test/testautomation（SDL 1.2 自带自动化测试套件）
upstream_check_command: "cd test && ./testautomation --video=dummy --audio=dummy"

# conanfile.py build() 方法中是否已集成上游测试
# 否：SDL 1.2.15 的 test/ 目录通过 tests/configure 单独构建（不随主库 make 目标），
# 且 testautomation 需在构建后单独链接生成；功能覆盖由 test_package 提供（见下）。
upstream_test_in_build: false
upstream_test_command: "testautomation --video=dummy"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/testautomation.c
    source: SDL-1.2.15/test/testautomation.c
    description: "SDL 1.2 上游自动化测试驱动（video/audio/render/events 等多组用例），需经 test/tests/configure 单独构建"
    command: "./testautomation --video=dummy"

# 豁免声明 (TEST_QUALITY_SPEC.md 3.3 / 平台限制)
exemptions:
  - rule: "upstream_testautomation_separate_build"
    reason: "SDL 1.2.15 的 testautomation 不在主库构建目标内，需单独 configure；本配方以 test_package 的等价真实调用覆盖（Init/SetVideoMode/FillRect/BlitSurface/Flip/GetTicks/Delay），全部走 dummy 与 timer 子系统"
  - rule: "no_display_stack"
    reason: "OHOS 沙箱无 X11/DirectFB/fbcon 显示栈与 OSS/ESD/PulseAudio 音频守护进程——配方显式关闭这些后端，仅保留 dummy video + dummyaudio（+ ALSA）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.c
    description: "链接打包的 libSDL 1.2 并真实运行：SDL_Linked_Version 版本断言 → SDL_Init(VIDEO|TIMER) → SDL_VideoDriverName 断言 dummy 驱动 → SDL_SetVideoMode(160x120x32) → SDL_CreateRGBSurface + FillRect + BlitSurface 断言返回码 → SDL_Flip → SDL_GetTicks/SDL_Delay 计时推进断言 → SDL_Quit，共 8 项断言"
    command: "SDL_VIDEODRIVER=dummy ./sdl_consumer_test <tmpdir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
