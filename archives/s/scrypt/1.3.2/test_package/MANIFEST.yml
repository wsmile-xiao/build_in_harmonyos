# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制）

package: scrypt/1.3.2
homepage: "http://www.tarsnap.com/scrypt.html"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 是否集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（tests/ 目录 9 个场景脚本 + verify-strings）
upstream_tests:
  - file: tests/test_scrypt.sh
    source: scrypt-1.3.2/tests/test_scrypt.sh
    description: "上游测试主入口，依次运行 01-09 场景脚本（known-values/decrypt-fail/passphrase 等）"
    command: "./tests/test_scrypt.sh ."
  - file: tests/01-known-values.sh
    source: scrypt-1.3.2/tests/01-known-values.sh
    description: "已知向量：scrypt KDF 输出与 RFC 7914 标准向量对比"
    command: "./tests/test_scrypt.sh"
  - file: tests/verify-strings/test_scrypt.c
    source: scrypt-1.3.2/tests/verify-strings/test_scrypt.c
    description: "verify-strings：C API 层已知向量校验程序（4 组向量），输出与 test_scrypt.good 一致"
    command: "./tests/verify-strings/test_scrypt"

# test_package 自带消费者测试（执行已安装的 scrypt 二进制）
test_package_tests:
  - file: test.c
    description: "消费者测试：scrypt --version + 文件加解密往返 + 错误口令必败"
    command: "./test_scrypt"

# 测试断言总数（上游 9 场景各含多 check + verify-strings 4 向量 + 消费者 3 项）
assertion_count: 16