  "1.3.0":
    - patch_file: "patches/0001-ohos-fix-test-runall-shebang-and-git-root.patch"
      patch_description: "修复上游测试脚本三处：(1) shebang (/usr/bin/python3 改为 /usr/bin/env python3)；(2) git rev-parse --show-toplevel 调用（tarball 非 Git 仓时失败，改为基于脚本自身路径定位源码根)；(3) MAKE_CMD 硬编码 make（HMDFS posix_spawn 不查 PATH，改为 os.environ.get('MAKE','make') 以便注入 make 绝对路径)"
      patch_type: "portability"
