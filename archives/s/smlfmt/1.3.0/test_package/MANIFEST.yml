package: smlfmt/1.3.0
homepage: "https://github.com/shwestrick/smlfmt"
upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  - type: parse_check
    count: 106
    framework: "test/runall (Python)"
    description: "上游 runall 选中 65 fail + 41 succeed = 106 例，每例 smlfmt --preview-only --safety-check 断言退出码"
test_package_tests:
  - file: "good.sml"
    description: "验证打包后的 smlfmt 能成功解析格式正确的 Standard ML 源码"
    command: "smlfmt --preview-only --safety-check good.sml"
  - file: "bad.sml"
    description: "验证打包后的 smlfmt 以非零状态拒绝语法错误的 Standard ML 源码"
    command: "smlfmt --preview-only --safety-check bad.sml（期望失败）"
  - file: "unformatted.sml"
    description: "验证打包后的 smlfmt --check 检测到未格式化代码并以非零状态退出"
    command: "smlfmt --check unformatted.sml（期望失败）"
assertion_count: 4
