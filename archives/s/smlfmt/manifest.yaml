software: smlfmt
display: "smlfmt"
description: "Source code formatter for Standard ML."
category: build-tool
homepage: "https://github.com/shwestrick/smlfmt"
license: MIT
build_system: make
ohos_adaptation:
  key_points:
    - "使用 mlton/20241230 作为显式 Conan build requirement 编译 smlfmt 二进制（MLton C codegen 需 gmp）"
    - "MLton C codegen 需显式传入 -cc clang、GMP include/lib 路径"
    - "修复上游测试脚本 runall 的 shebang 和 git rev-parse 路径假设"
    - "绕过 Makefile install 目标（OHOS 无 install 命令），改用 Conan copy 手动打包"
    - "为构建产物 smlfmt 二进制添加 HarmonyOS 自签名"
  common_dependencies:
    - mlton/20241230
    - gmp/6.3.0
versions:
  "1.3.0":
    status: built
    conan_ref: "smlfmt/1.3.0"
