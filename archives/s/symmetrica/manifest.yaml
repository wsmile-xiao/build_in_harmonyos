# 软件级 manifest — symmetrica
# 遵循 ARCHIVE-SPEC v2.0

software: symmetrica
display: "Symmetrica"
description: "对称群表示论与组合学 C 库 —— 分拆、Schur 函数、对称函数、杨表等"
category: math
homepage: "https://gitlab.com/sagemath/symmetrica"
license: Public Domain
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "**必须带 `-DFAST -DALLTRUE`**：少了 ALLTRUE，一大批组合学函数根本不编进库，而构建/装包全程成功 —— 是那种「装得上、下游才炸」的静默缺失"
    - "上游 tarball 来自 sage-package 的 tars 归档（与 sage 用的同一份，sha256 一致）"

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "3.1.0"
    status: built
    build_date: "2026-08-17"
    notes: "首个鸿蒙 PC conan 配方；真机 conan create + test_package 断言全过"
