software: stuntman
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.16/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.16"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# 构建系统类型（顶层字段，verify-build 必需）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.stunprotocol.org/stunserver-1.2.16.tgz"

  # 源码校验和
  sha256: "4479e1ae070651dfc4836a998267c7ac2fba4f011abcfdca3b8ccd7736d4fd26"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: ["LDFLAGS=-fuse-ld=/data/service/hnp/bin/ld -L/storage/Users/currentUser/usr/local/lib"]
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: ["openssl/1.1.1w"]
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: ["0001-common-inc-ohos-ldflags.patch"]
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: ["lld linker requires libxml2.so.16 unavailable on OHOS; use GNU ld via -fuse-ld=/data/service/hnp/bin/ld", "Custom Makefile project has no install target; manual install of binaries/manpages", "GNU ld on OHOS doesn't search ~/usr/local/lib by default; add -L to LDFLAGS"]
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/stuntman-1.2.16.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/stuntman-1.2.16.work
  source_orig_hash: 0ce270c73dcbcfea
  source_work_hash: 7e8318d4746708e1
  generated_at: '2026-06-05T17:53:15'
  patches_count: 1

patch_classification:
  - file: 0001-common.inc.patch
    type: platform-adaptation
    platform_only: True
    guard: '__OHOS__'
