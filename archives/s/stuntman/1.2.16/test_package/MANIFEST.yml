# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: stuntman/1.2.16
homepage: "https://www.stunprotocol.org/"

# 上游测试命令
upstream_check_command: "./stuntestcode"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: stuntestcode
    source: stunserver-1.2.16/stuntestcode
    description: "STUN protocol unit test suite (13 tests)"
    command: "./stuntestcode"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 验证 stunclient 二进制可执行"
    command: "stunclient --help"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
