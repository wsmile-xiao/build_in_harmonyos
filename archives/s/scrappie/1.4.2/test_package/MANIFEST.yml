# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试入口: CMake CTest（CMakeLists.txt enable_testing()，共 20 个 add_test）
#   - 1 个 CUnit 单元测试套件（scrappie_unittest，含 11 个 suite 内用例文件）
#   - 19 个 CLI 功能测试（events/raw/mappy/squiggle/help/version 等）

package: scrappie/1.4.2
homepage: "https://github.com/nanoporetech/scrappie"

# 上游测试命令
upstream_check_command: "ctest (CMake enable_testing，构建后于源码树运行)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.build() 后执行 cmake.test()（即 ctest）"

# 上游实际运行的测试（ctest -N 清单，全部 20 项）
upstream_tests:
  - file: src/test/scrappie_test_runner.c 等 13 个 src/test/*.c
    source: scrappie-release-1.4.2/src/test/
    description: "CUnit 单元测试套件 unittest（矩阵/解码/事件检测/卷积/信号等 11 组用例）"
    command: "ctest -R unittest"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：events（事件检测，reads/ 测试数据）"
    command: "ctest -R test_events_call"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：raw basecall（raw_r94 模型）"
    command: "ctest -R test_raw_call"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：raw basecall（rgrgr_r94 模型）"
    command: "ctest -R test_rawrgrgr_r94_call"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：raw basecall（rgrgr_r941 模型）"
    command: "ctest -R test_rawrgrgr_r941_call"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：raw basecall（rgrgr_r10 模型）"
    command: "ctest -R test_rawrgrgr_r10_call"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：raw basecall（rnnrf_r94 模型）"
    command: "ctest -R test_rawrnnrf_r94_call"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：event_table（fast5 事件表输出）"
    command: "ctest -R test_event_table"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：mappy（序列映射）"
    command: "ctest -R test_mappy"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：seqmappy（序列到序列映射）"
    command: "ctest -R test_seqmappy"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：squiggle（squiggle_r94 模型）"
    command: "ctest -R test_squiggle_r94"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：squiggle（squiggle_r10 模型）"
    command: "ctest -R test_squiggle_r10"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：licence 输出"
    command: "ctest -R test_licence"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：license 输出（美式拼写别名）"
    command: "ctest -R test_licence (第二项同名)"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：help 输出"
    command: "ctest -R test_help"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：help events"
    command: "ctest -R test_help_events"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：help event_table"
    command: "ctest -R test_help_event_table"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：help raw"
    command: "ctest -R test_help_raw"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：help squiggle"
    command: "ctest -R test_help_squiggle"
  - file: CMakeLists.txt add_test
    source: scrappie-release-1.4.2/CMakeLists.txt
    description: "CLI 功能测试：version 输出"
    command: "ctest -R test_version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：mat_from_array/array_from_scrappie_matrix 矩阵往返校验（鸿蒙消费者用例）"
    command: "./test_scrappie"

# 测试断言总数（CUnit 套件 + CLI 退出码断言，近似值）
assertion_count: 40
