# test_package/MANIFEST.yml
# 上游官方测试声明文件
#
# spinner 1.2.4 (2003-02-17) 上游**没有自动化测试**：实测清点结果 —
#   * 无 tests/ 或 test/ 目录
#   * tarball 内无任何 test*/check*/RUNTEST 文件
#   * Makefile.am 仅有 bin_PROGRAMS = spinner（无 TESTS / check_PROGRAMS）
#   * 生成的 Makefile 里 `check:` 目标体为空壳（checked target = "all"），
#     即 `make check` 不执行任何断言
# ⇒ 上游测试用例数 = 0，assertion_count = 0。
# 下面 test_package_tests 的断言全部是本适配新增的消费者行为断言。

package: spinner/1.2.4
homepage: "http://www.laffeycomputer.com/spinner.html"

# 上游测试命令（不存在；保留字段说明为何为空）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实调用已安装二进制）
test_package_tests:
  - file: test.sh
    description: >-
      消费者测试 — 执行已安装 spinner 二进制：-L 授权路径(A1-A5)、非法选项
      usage 路径(B1-B5, 14 个开关全量渲染)、长选项拒绝(C1)、TERM 兼容性守卫
      (D1-D7)、pty 上真实守护进程持续旋转的 VT100 帧输出(E1-E9)、ELF/aarch64
      产物身份与宿主路径泄漏检查(F1-F9)、交付面(G1-G2)
    command: "bash test.sh <pkg>/bin/spinner"
  - file: pty_capture.py
    description: >-
      pty 采集辅助脚本 — 用 python3 pty.openpty() 分配真实 pty，让 spinner 在前台
      运行于 pty slave，并在守护进程父进程退出后继续读取 master，以观测“持续旋转”。
      跑 spinner 之前先做三步能力探针；第三步用已知良好的写入者完整复现 spinner 的
      Daemonize()+OpenTTY() 序列（fork/setsid/close(0,1,2)/按路径重开/isatty/tcdrain/write）
    command: "python3 pty_capture.py <pkg>/bin/spinner <out> 6"

# 上游测试断言总数（上游无测试 → 0）
assertion_count: 0

# 本适配新增的消费者断言总数。
# 完整执行（pty 能力可用 + readelf 可用）为 38 条，与 conan create 实测输出
# "consumer assertions passed: 38/38 (skipped: 0)" 一致。
#
# ── 跳过项（不记为通过，附实测证据）──────────────────────────────────────────
# E 组需要 spinner 那种“fork 后 setsid 并按路径重开 tty”的守护进程用法。
# pty_capture.py 在跑 spinner 之前做三步能力探针：
#   (1) openpty() 后往 slave 写 PTYPROBE 并从 master 读回；
#   (2) 按 ttyname(slave) 路径重新 os.open(O_WRONLY)；
#   (3) 完整复现 spinner's Daemonize()+OpenTTY() 序列：fork → setsid →
#       close(0,1,2) → open(path, O_WRONLY) → isatty() → termios.tcdrain() →
#       write()，父进程监视 pipe 与 pty master 确认字节回到 master。
#       该复现必须使用自行分配的私有 pty（关闭最后一个 fd 会销毁设备并 unlink
#       /dev/pts 入口，复用前两步的 pty 会恒定 ENOENT）。
# 退出码：0=抓到帧；3=已证明宿主无法完成该序列；4=复现通过但 spinner 零字节
# （真实产品缺陷，test.sh 判 FAIL 而非 skip）；2=用法错。
# 实测：本地 WSL 下三步全过 -> 38/38；HarmonyOS CI runner 上 E 组记 skipped。
skipped:
  - name: "E1-E9 pty 上守护进程持续旋转的 VT100 帧输出"
    reason: >-
      无头 HarmonyOS CI runner 的 pty 无法支撑 spinner 的守护进程用法：OpenTTY()
      要求 setsid()+close(0,1,2) 之后仍能按 ttyname(STDIN_FILENO) 的路径重开 tty、
      isatty() 为真且 tcdrain() 可用。
    evidence: >-
      CI 构建 #66242/#66256/#66303 三次实测均为 0 字节（A1-D7 与 F1-F9 全部通过，
      编译与打包成功：package(): Packaged 2 files: spinner, COPYING）。
      本地同一路径实测 84 字节 / 7 帧 / \ | / - 四字形齐全。
      第 3 步复现探针使“宿主不支持”与“spinner 有缺陷”可判定：复现失败才记 skipped，
      复现通过却静默则判 FAIL（本地四场景实测 rc 分别为 0/3/3/4）。
      注意：构建 #66327 的完整日志平台侧不可取（/ci/builds/66327 与
      /pulls/14154/ci 均 404，看板页面为 SPA 不含日志），故 worker 当时究竟走
      rc=3 还是 rc=4 未能复核；本项按“未在 CI 实测通过”申报，不计入通过数。
    declared_not_passed: true

# 断言计数（完整执行为 38；按 skip 组合不同）
consumer_assertion_count: 38
# E 组 9 条 + F 组 9 条在 pty/readelf 不可用时跳过
consumer_assertion_count_min: 20

# HarmonyOS 特有测试（PR 要求 N>=1）
#   D 组 7 项（TERM 兼容性守卫）+ E 组 9 项（pty 上持续旋转的 VT100 帧输出）
#   + F 组 9 项（aarch64/OHOS 产物身份与路径泄漏）
ohos_specific_assertion_count: 25
