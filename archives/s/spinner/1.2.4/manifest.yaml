# 版本级 manifest
# spinner 1.2.4

version: "1.2.4"
software: "spinner"
status: built
build_date: "2026-10-01"
build_system: autotools

source:
  url: "https://distfiles.macports.org/spinner/spinner-1.2.4.tar.gz"
  sha256: "13419c4410db739020532e0628e1b6f7321db102739f3b1b88f105b29a2fcbb2"
  tar_format: tar.gz
  # 上游官方站点只有明文 HTTP 且文件名不固定（spinner-current.tar.gz），
  # 采用 MacPorts 官方 distfiles 镜像；与 FreeBSD distcache distfile 逐字节一致。
  upstream_homepage: "http://www.laffeycomputer.com/spinner.html"

build:
  system: autotools
  # 实际传给 configure 的参数：AutotoolsToolchain 默认注入 --prefix=/ 与
  # --bindir/--libdir/--includedir（值均为 ${prefix}/...）。
  # 注意：本仓库 CI 用 host/build 同 profile（均为 os=OHOS arch=armv8），
  # 因此 conan 的 cross_building() 为 false，**不会**注入 --host 三元组；
  # 构建日志实测为 "checking if we are cross compiling... no"。
  # 目标三元组仍由工具链 shim 以 --target=aarch64-linux-ohos 指定。
  configure_options:
    - "--prefix=/"
    - "--bindir=${prefix}/bin"
    - "--libdir=${prefix}/lib"
    - "--includedir=${prefix}/include"
  target_triplet: "aarch64-linux-ohos"
  # 并行度固定 -j1：HMDFS 不允许在 jobserver 临时目录创建 FIFO
  # （"jobserver mkfifo: .../tmp/GMfifoNNNNN: Operation not permitted"）。
  make_args:
    - "-j1"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - patch_file: "patches/0001-configure-hmdfs-umask.patch"
    patch_description: "configure: umask 077 -> 022 for the confstat tmp dir (HMDFS setgid)"
    patch_type: "portability"

knowledge_gained:
  - "E011/E129"
