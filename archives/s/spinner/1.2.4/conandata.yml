# conandata.yml — spinner 1.2.4
#
# 源码取自 MacPorts distfiles（sysutils/spinner Portfile 所引用的权威 distfile
# 镜像，HTTPS 可用）。上游官方站点 http://downloads.laffeycomputer.com 仅有
# 明文 HTTP，且文件名不固定（spinner-current.tar.gz），不适合作为可复现的
# 配方源，故采用 MacPorts 官方 distfiles 镜像；该 tarball 与 FreeBSD
# distcache 上的同名 distfile 逐字节一致（sha256 相同，已核验）。
#
# SHA-256: 13419c4410db739020532e0628e1b6f7321db102739f3b1b88f105b29a2fcbb2
sources:
  url: "https://distfiles.macports.org/spinner/spinner-1.2.4.tar.gz"
  sha256: "13419c4410db739020532e0628e1b6f7321db102739f3b1b88f105b29a2fcbb2"
  filename: "spinner-1.2.4.tar.gz"

# 源码补丁
# 0001: HMDFS 上 configure 创建 ./confstatXXXXXX 时 umask 077 会得到
#       drwx--S---（HMDFS 强制 setgid），导致 config.status 无法写入
#       subs.sed/subs.frag/out，Makefile 根本不生成，随后 make 报
#       "No targets specified and no makefile found"。改为 022（E011/E129）。
patches:
  - patch_file: "patches/0001-configure-hmdfs-umask.patch"
    patch_description: "0001 configure: relax confstat tmp dir umask 077 -> 022 for HMDFS"
    patch_type: "portability"
