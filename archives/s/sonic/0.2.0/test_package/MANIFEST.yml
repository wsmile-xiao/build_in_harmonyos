# test_package/MANIFEST.yml — sonic 0.2.0
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: sonic/0.2.0
homepage: "https://github.com/waywardgeek/sonic"

# 上游测试：sonic 0.2.0 无独立测试套件——无 test/ 目录、无 make test 目标，
# 源码仅 CLI 示例与 Java 移植示例，README 只含手动性能基准
# （rule 1.2：如实声明，非跳过）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（如实声明：上游无测试）
upstream_tests: []

# test_package 消费者测试（R34 真实产物校验：CLI 存在 + ELF + 运行打印 usage +
# libsonic.so 存在）
test_package_tests:
  - file: test_sonic.py
    description: "Verifies bin/sonic exists + is aarch64 ELF + runs (prints usage on no-args); lib/libsonic.so.0.2.0 exists + is ELF shared object"
    command: "python3 test_sonic.py"

# 断言总数：4（CLI 存在 + ELF + usage 运行 + libsonic.so 存在/ELF）
assertion_count: 4
