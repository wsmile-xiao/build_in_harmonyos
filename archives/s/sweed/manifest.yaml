software: sweed
display: "SweeD"
description: "基于位点频率谱（SFS）的极大似然选择性清除检测工具"
category: utility
homepage: "https://sco.h-its.org/exelixis/web/software/sweed/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游只提供 GCC 专用 Makefile*.gcc，无 configure；用 make -f Makefile.gcc CC=<ohos clang>"
    - "零三方依赖，仅链 -lm；只构建顺序版（PTHREADS/MPFR 变体不使用）"
    - "上游无 git tag，源码坐标以 Debian dfsg orig tarball sha256 固定"
  common_dependencies: []

versions:
  - version: "3.2.1"
    status: built
    build_date: "2026-10-03"
