# test_package/MANIFEST.yml
# SweeD 3.2.1 - upstream test declaration and consumer-test audit.

package: sweed/3.2.1
homepage: "https://sco.h-its.org/exelixis/web/software/sweed/"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream SweeD 3.2.1 ships no test suite: the source directory contains only
  SweeD*.c/.h, the various Makefile*.gcc build files and README.txt. There is no
  `check`/`test` target and no tests/ directory.
upstream_check_command: "n/a (no test target)"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests: []

test_package_tests:
  - file: test_sweed.sh
    description: >-
      installed-program consumer checks: presence/executability of SweeD, the
      -h option list, the -v version banner and the no-argument banner.
    command: "sh test_sweed.sh"

test_files:
  - path: "test_package/test_sweed.sh"
    test_type: "R34"
    assertion_count: 5

test_package_test_count: 1
consumer_assertion_count: 5
upstream_test_cases: 0
assertion_count: 5
