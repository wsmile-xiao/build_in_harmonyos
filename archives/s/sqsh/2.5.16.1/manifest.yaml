# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.5.16.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.5.16.1"

# 软件名
software: "sqsh"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/sqsh/sqsh/sqsh-2.5/sqsh-2.5.16.1.tgz"

  # 源码校验和
  sha256: "d6641f365ace60225fc0fa48f82b9dbed77a4e506a0e497eb6889e096b8320f2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--without-readline"
  - "--without-x"
  - "--without-motif"
  - "--without-static"
  - "--without-debug"
  - "--with-sybase=<freetds-package-prefix>"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "freetds/1.4.23"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# config.guess / config.sub 以 OHOS-aware 版本替换（见 config/ 目录），
# 属源码文件替换，未使用 diff 补丁。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "FreeTDS/1.4.23 在 ohpcd 仓库仅发布 libct.a/libsybdb.a 静态库；sqsh 链接须用 -l:libct.a 静态嵌入，本地 ar x + clang -shared 拼装的 libct.so 在运行时会因 'Error loading shared library libct.so' + 全量 CT-lib 符号 relocation 失败 (ref: E073)"
- "依赖方仅有静态库 (.a) 时，若误链临时拼装的动态 .so，运行期符号全部解析失败；正确做法是消费端直接 -l:<name>.a 静态链接，产物自包含无运行时 .so 依赖 (ref: E123)"
- "sqsh 的 autotools Makefile 在 OHOS 上不可用（make jobserver 经 posix_spawn 派生的 clang 子进程静默死亡）；正确做法是绕过 make，bash 脚本逐文件 clang 编译 + 手工链接 (ref: E055)"
