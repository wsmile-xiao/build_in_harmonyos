# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sqsh/2.5.16.1
homepage: "https://sourceforge.net/projects/sqsh/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# sqsh 2.5.16.1 上游不提供任何测试套件（源码树无 make check / testsuite，
# configure 无 --enable-tests 选项），此处如实声明为空。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "端到端消费者测试：sqsh 二进制存在性 + 纯 Python ELF arm64 头校验（magic \\x7fELF + e_machine=183）+ 实际运行 `sqsh --help` 校验 usage 输出（鸿蒙特有，非纯断言清单）"
    command: "sqsh --help"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
