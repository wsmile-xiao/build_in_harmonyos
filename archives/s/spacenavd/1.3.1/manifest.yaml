# manifest.yaml - spacenavd 1.3.1 版本级元数据
software: spacenavd
version: "1.3.1"
status: built
build_date: "2026-09-25"
task_id: 10828
build_system: "handwritten configure（非 autoconf）"

description: "spacenavd：用户态守护进程，将 3Dconnexion 空标鼠设备经 unix socket（spacenav 协议）提供给客户端"
category: system
license: GPL-3.0-or-later

compiler: "clang (OHOS NDK clang-15)"
target_arch: aarch64
target_os: ohos

configure_options:
  - "--prefix=PACKAGE_FOLDER（conan package_folder）"
  - "--disable-x11（OHOS 无 X11；X11 通信模式默认开）"
  - "CFLAGS=-DHAVE_STDINT_H（手写 configure 的 config.h 不探测 stdint；proto.h 的 int32_t 原被 X11 头传递包含掩盖）"

build_commands:
  - "CC=<ohos clang> CFLAGS=-DHAVE_STDINT_H ./configure --prefix=<pkg> --disable-x11"
  - "make -j2 CC=<ohos clang>"

test_result: PASS
test_summary: "upstream_static: 0（上游无任何测试目标）；upstream_executed: 0；consumer: 1 程序 / 4 组断言（-V 版本、-h 用法、非法选项拒绝、PATH 解析）全部 PASS"
test_commands:
  - "test_package/test_spnavd.sh（4 组消费者断言）"

artifacts:
  - bin/spacenavd

patches_applied: []
