# manifest.yaml - spacenavd 软件级元数据
software: spacenavd
display: "spacenavd"
description: "用户态守护进程，将 3Dconnexion 空标鼠设备经 unix socket（spacenav 协议）提供给客户端（Debian spacenavd 包上游）"
category: "system"
homepage: "http://spacenav.sourceforge.net"
license: GPL-3.0-or-later
build_system: "handwritten configure（非 autoconf；支持 CC/CFLAGS env 与 --prefix/--disable-x11）"

ohos_adaptation:
  key_points:
    - "手写 configure 原生支持 CC/CFLAGS env 注入与 --prefix：CC=<ohos clang> 即可，无需补丁（区别于 M18 烧死型）"
    - "--disable-x11 关闭 X11 通信模式（OHOS 无 X11）；禁用后暴露 proto.h 的 int32_t 依赖（原被 X11 头传递包含掩盖）⇒ CFLAGS=-DHAVE_STDINT_H"
    - "守护主循环需要 /dev/input/event 真实设备，属硬件权限面，未纳入消费者断言"

versions:
  "1.3.1":
    status: built
    build_date: "2026-09-25"
    source_url: "https://deb.debian.org/debian/pool/main/s/spacenavd/spacenavd_1.3.1.orig.tar.gz"
    source_sha256: "44ea2a3af1050df0ac26ee8fb00cf8c7358ed98a900159b8756ee2c7979c34bc"
