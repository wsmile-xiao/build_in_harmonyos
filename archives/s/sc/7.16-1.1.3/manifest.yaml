build_system: makefile

source:
  url: "https://github.com/n-t-roff/sc/archive/refs/tags/7.16_1.1.3.tar.gz"
  sha256: "a734a399967f6a74772e9f169614b803d29c856b04fe289f965ab919feb7c625"
  tar_format: tar.gz
  # conan 版本 7.16-1.1.3 对应上游 tag 7.16_1.1.3
  # (commit 77c8e5879bc364bcc6f34711fd187cf002ba827d)

build:
  system: makefile
  configure_options: []
  dependencies:
    - ncurses/6.6
  # gram.y 生成器：不需要。gram.c/y.tab.h 已用 bison 3.8.2 -y -d 从 gram.y
  # 预生成并随配方发布（pregenerated/，bison 兼容模式输出点命名 y.tab.c/y.tab.h，
  # 与 Makefile 的 `$(YACC) -d gram.y; mv y.tab.c gram.c` 规则一致；gram.y 为
  # 纯 POSIX yacc，无 bison 扩展）。build() 在 configure 后把预生成文件装入
  # 源码树并 touch 新于 gram.y，使 make 的 `gram.c: gram.y` YACC 规则永不触发。
  # 曾试过 tool_requires bison（conancenter m4 重执行缺失的
  # CONFIG_SHELL=/data/service/hnp/bin/bash 而失败）、tool_requires btyacc
  #（conancenter CMake 版要求 cmake<3.5，与真机 cmake 4.4.3 不兼容；在档纯
  # Makefile 版尚未发布，单 PR 又不能顺带发布）、配方内自举私用 btyacc
  #（仍原样信任 tools.build:compiler_executables，在缺该路径的预检机上
  # make Error 127），均已放弃。
  # 编译器选择：只在文件存在时才用 conf 的 c 值，否则经 PATH 探测
  # clang/cc/gcc（HMBS 与 VirtualBuildEnv 已把真实工具链放上 PATH，与
  # ncurses OHOS 构建的 shutil.which 模式一致）。
  build_tools_system:
    - none-yacc-pregenerated-parser-vendored
  cc: clang
  cxx: clang++

patches_applied: []

patch_generation:
  method: none
  patches_count: 0
  why_manual: >-
    首轮无补丁：上游 configure+Makefile 均为 POSIX shell/make，
    未引入 __OHOS__ 平台宏；是否需要 OHOS 移植补丁以后续真机预检为准。

