# 版本级 manifest — stduuid 1.2.3
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.2.3"

# 软件名
software: "stduuid"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://codeload.github.com/mariusbancila/stduuid/tar.gz/refs/tags/v1.2.3"

  # 源码校验和（官方 v1.2.3 tarball, 184170 bytes）
  sha256: "b1176597e789531c38481acbbed2a6894ad419aab0979c10410d59eb0ebf40d3"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（header-only INTERFACE 库）
  configure_options:
    - "-DUUID_BUILD_TESTS=OFF"
    - "-DUUID_ENABLE_INSTALL=ON"
    - "-DUUID_USING_CXX20_SPAN=OFF"

  # 编译依赖列表（无编译期依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无需补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "stduuid 是 header-only CMake INTERFACE 库，无编译产物；conan package_type 应声明为 header-library，package_info 的 cpp_info.libs 留空"
  - "上游 codeload tar.gz 直链以 /refs/tags/v1.2.3 结尾无文件扩展名，conan get() 需显式 filename='<pkg>-<ver>.tar.gz' 否则按 zip 解压报 BadZipFile"
  - "上游默认 UUID_USING_CXX20_SPAN=OFF 时会把 gsl/span 头一并安装到 include/，OHOS C++17 消费者依赖 <gsl/span>，配方需保留该默认并打包 gsl 头"
  - "basic_uuid_random_generator<Engine> 构造需传入引擎实例引用（engine_type&），不能直接传 std::random_device() 返回值"
