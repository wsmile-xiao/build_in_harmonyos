# test_package/MANIFEST.yml
# 上游官方测试声明文件 — stduuid 1.2.3
#
# stduuid 是 header-only C++17 UUID 库，无编译期依赖、无二进制产物。
# 上游使用 Catch2 单元测试（test/ 目录，CMake UUID_BUILD_TESTS=ON 时构建
# 为 run_test 单测程序），此处声明上游测试与 test_package 消费者测试。

package: stduuid/1.2.3
homepage: "https://github.com/mariusbancila/stduuid"

# 上游测试命令：CMake 启用 UUID_BUILD_TESTS 后 ctest 运行 Catch2 test/test.cpp
upstream_check_command: "cmake -DUUID_BUILD_TESTS=ON .. && cmake --build . && ctest"

# conan 包构建时不运行上游测试（包为 header-only INTERFACE 库，无构建产物）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（Catch2 单测，test/test.cpp 编译为 test）
upstream_tests:
  - file: test/test.cpp
    source: stduuid-1.2.3/test/test.cpp
    description: "Catch2 单元测试：默认构造 nil、随机 v4 生成、名称 v5、字符串序列化/解析、相等与比较"
    command: "./test"

# test_package 自带的消费者测试（真实调用 uuids API）
test_package_tests:
  - file: test.c
    description: "C++17 消费者测试：nil 判定、100 个 v4 UUID 生成与唯一性、字符串往返解析、相等/顺序"
    command: "./test_stduuid"

# 测试断言总数（上游 Catch2 断言 + 消费者循环断言）
assertion_count: 300