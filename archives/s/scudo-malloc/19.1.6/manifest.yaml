software: scudo-malloc
version: "19.1.6"
status: built
build_date: "2026-08-24"
build_system: cmake

source:
  url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.6/compiler-rt-19.1.6.src.tar.xz"
  sha256: "0d4f312e1419152282c267e6b6a1fa5914a7a0c753a5e926bee1c8c28e614ae4"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCOMPILER_RT_BUILD_SANITIZERS=ON"
    - "-DCOMPILER_RT_SANITIZERS_TO_BUILD=scudo_standalone"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCOMPILER_RT_BUILD_XRAY=OFF"
    - "-DCOMPILER_RT_BUILD_LIBFUZZER=OFF"
    - "-DCOMPILER_RT_BUILD_PROFILE=OFF"
    - "-DCOMPILER_RT_BUILD_BUILTINS=OFF"
    - "-DCOMPILER_RT_BUILD_ORC=OFF"
    - "-DCOMPILER_RT_BUILD_MEMPROF=OFF"
    - "-DCOMPILER_RT_BUILD_CTX_PROFILE=OFF"
    - "-DCOMPILER_RT_BUILD_GWP_ASAN=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "scudo-malloc 需要 CMAKE_SYSTEM_NAME=Linux 才能在 OHOS 上编译"
  - "scudo-malloc 依赖 LLVM compiler-rt 构建系统，需要 LLVM_CMAKE_DIR 和 LLVM_MAIN_SRC_DIR"
  - "scudo-malloc 的 C 包装器（malloc/free 覆盖）在 OHOS 上初始化时崩溃，原因待分析"
  - "C++ 包装器（operator new/delete）不覆盖系统 malloc，可正常链接"
  - "Conan 配方使用 dlopen 加载共享库进行测试，避免静态链接导致的 malloc 覆盖崩溃"
  - "库名称使用 LLVM 约定：clang_rt.scudo_standalone-aarch64，Conan arch=armv8 需映射为 aarch64"
  - "使用个体 LLVM 源码包（compiler-rt + cmake + llvm）替代 141MB 完整源码树，加快下载"
