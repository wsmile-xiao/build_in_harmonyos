    description: "scudo standalone unit tests (requires gtest, not built in OHOS)"
    command: "./ScudoStandaloneTest-aarch64"
test_package_tests:
  - file: test.c
    description: "Consumer test: dlopen scudo shared library and call malloc/free via dlsym"
    command: "./test_scudo_malloc $SCUDO_LIB_PATH"
assertion_count: 6
