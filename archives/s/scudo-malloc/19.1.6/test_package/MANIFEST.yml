# test_package/MANIFEST.yml
package: scudo-malloc/19.1.6
homepage: "https://llvm.org/"
upstream_check_command: "make ScudoStandaloneTest"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: compiler-rt/lib/scudo/standalone/tests/scudo_unit_test_main.cpp
