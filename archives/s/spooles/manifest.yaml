software: spooles
display: "SPOOLES"
description: "SParse Object Oriented Linear Equations Solver: C library for solving sparse real and complex linear systems of equations"
category: math
homepage: "https://www.netlib.org/linalg/spooles/spooles.2.2.html"
license: LicenseRef-SPOOLES-Public-Domain
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 递归构建：改写 Make.inc（Conan conf 注入 CC/AR/RANLIB，CFLAGS=-O2 -fPIC），make -f makefile global -j1 串行"
    - "修正 Tree/src/makeGlobalLib 过时引用 drawTree.c -> draw.c（与 Spack/Homebrew 同因）"
    - "归档无顶层目录，source() 用 strip_root=False；产物为静态 libspooles.a，头文件保留源码树相对布局"
    - "上游无可执行测试套件（仅需外部输入文件的 drivers 示例），按 no_tests 申报"
  common_dependencies: []

versions:
  "2.2":
    status: built
    build_date: "2026-09-23"
