# 版本级 manifest
# 文件位置: archives/s/spooles/2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2"

# 软件名
software: "spooles"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.netlib.org/linalg/spooles/spooles.2.2.tgz"

  # 源码校验和
  sha256: "a84559a0e987a1e423055ef4fdf3035d55b65bbe4bf915efaa1a35bef7f8c5dd"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "make -f makefile global -j1"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零 patch 文件；两处可移植修正直接在配方 build() 内完成并校验）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "spooles.2.2.tgz 无顶层目录，conan get 必须 strip_root=False"
  - "Tree/src/makeGlobalLib 引用了不存在的 drawTree.c，实际文件为 draw.c，不改则 make global 在 Tree/src 失败"
  - "Make.inc 默认 CC=/usr/lang-4.0/bin/cc、RANLIB=echo，必须改写为 Conan 工具链并加 -fPIC"
  - "make global 为串行递归 make，必须 -j1；MT/MPI 子目录默认注释在外，保持上游默认不启用"
  - "上游无 check/test 目标：drivers 需外部输入文件，属于示例而非测试套件，按 no_tests 申报"
