# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 实测申报）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: spooles/2.2
homepage: "https://www.netlib.org/linalg/spooles/spooles.2.2.html"

upstream_tests_exist: false
upstream_test_audit:
  - source: "spooles.2.2.tgz 顶层 makefile（1871 个归档成员，45+ 模块子目录）"
    reason: "顶层 makefile 只定义 drivers / lib / global / clean 四类目标；逐行扫描确认无 check、test、tests 目标（配方 build() 中 _assert_no_upstream_test_target 做同样的机器校验，新增即报错）。"
  - source: "各模块 drivers/makefile（如 IV/drivers、InpMtx/drivers、LinSol/drivers）"
    reason: "只定义 testQR、testIO、testDrand 等与 spooles.a 链接的演示驱动，且全部需要外部输入文件（argv 读 *.inpmtxf 矩阵、do_* 脚本），无聚合测试入口、无期望输出比对。"
  - source: "归档全文扫描（*.c 无 drivers 统计 + 全量 makefile/makeGlobalLib 文本）"
    reason: "未发现 ctest/pytest/gtest 注册、TESTS/check_PROGRAMS 接线或 All tests passed 类汇总；drivers 属于示例程序而非测试套件。"
  - conclusion: "上游 2.2 无可执行的官方测试套件；适配不呈现上游覆盖率，消费者验证走 test_package 真实 API 测试（IV/DV/InpMtx 10 断言 + 端到端 SpMV/落盘重载消费者用例 5 断言，共 15 断言）。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# 上游无注册测试框架（makefile drivers 不可解析统计），总数为 0；
# 口径标记 auto 并附本文件审计说明。
upstream_test_total: 0
upstream_test_count_method: "auto"

# test_package 中自带的测试（消费者视角验证，真实调用被测包 API）
test_package_tests:
  - file: test_spooles.c
    description: "消费者测试：IV 整型向量（size/entry/求和 4 断言）+ DV 双精度向量（size/entry/求和 3 断言）+ InpMtx 2x2 矩阵逐项输入（nent/coordType/inputMode 3 断言）+ 端到端完整消费者用例：同矩阵组装后经 InpMtx_nonsym_gmvm 做 y=A*x 稀疏矩阵向量乘（x=[1,2] 得 y=[6,7]）、落盘（writeToFormattedFile）、重载（readFromFormattedFile）后复算校验全流程（5 断言）"
    command: "./test_spooles"

# 测试断言总数（test_spooles.c 内 CHECK 宏固定 15 处，程序末尾自校验总数）
assertion_count: 15
assertion_count_basis:
  iv_vector: 4
  dv_vector: 3
  inpmtx_input: 3
  e2e_spmv_persist_flow: 5
