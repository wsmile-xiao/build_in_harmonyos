# test_package/MANIFEST.yml

package: sole/1.0.4
homepage: "https://github.com/r-lyeh/sole"

# 上游测试：sole.cxx (SOLE_BUILD_TESTS) 内建校验/碰撞测试
upstream_check_command: "/data/service/hnp/bin/clang++ sole.cxx -std=c++11 -O2 -o sole-tests && ./sole-tests"
upstream_test_in_build: false
upstream_test_command: "./sole-tests"

# 上游测试文件列表（sole.hpp SOLE_BUILD_TESTS 内建测试，无独立测试框架）
upstream_tests:
  - path: sole.cxx (SOLE_BUILD_TESTS)
    type: 内建 run::verify + run::tests + sizeof 断言
    case_count: 5
    assertion_count: 5
    executed: true
    result: "verify(1M 序列化往返) 通过；sizeof 断言通过；碰撞测试为无界压力测试（numtests=~0），运行 10,131,192 次无碰撞后按预算超时，非失败"

test_package_tests:
  - file: test.cpp
    description: "消费者编译/运行验证：sole::uuid0/uuid1/uuid4 格式、version nibble、rebuild 往返、1000 个 v4 唯一性"
    command: "./test_sole"
    case_count: 1
    assertion_count: 5

assertion_count: 5
