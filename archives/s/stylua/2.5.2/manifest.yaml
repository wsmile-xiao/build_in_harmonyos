software: stylua
version: "2.5.2"
status: built
build_date: "2026-06-15"
build_system: custom

source:
  url: "https://github.com/JohnnyMorganz/stylua/archive/refs/tags/v2.5.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "cargo build --release --no-default-features --features editorconfig,lsp"
  dependencies:
    - rust/1.96.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Rust/Cargo 项目无需 configure/make，使用 cargo build --release 编译 (knowledge_ref: E035-draft)"
  - "Cargo 不支持 DESTDIR，需手动 cp 到 staging目录 (knowledge_ref: E035-draft)"
  - "cdylib crate type 不被 aarch64-unknown-linux-musl 支持（warning，非阻塞） (knowledge_ref: L3)"
  - "wasm-bindgen feature 需禁用（非 wasm 目标） (knowledge_ref: L3)"
  - "cargo test doctest 在 OHOS 上因 SELinux sandbox 限制无法执行 (knowledge_ref: E046)"
