# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 注意：smp-utils 上游未提供任何测试用例
#   - 源码包无 tests/ 目录
#   - 任何 Makefile.am 内均无 TESTS 变量（bin_PROGRAMS 只有 29 个工具）
#   - automake 自动生成的 make check 是 no-op（exit 0）
# 因此本文件 upstream_tests 为空；test_package_tests 列出本适配补全的消费者测试。

package: smp-utils/0.99
homepage: "https://sg.danny.cz/sg/smp-utils.html"

# 上游测试命令 (无上游测试)
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试调用（no-op，留证 T009）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游官方测试用例 — 无
upstream_tests: []

# test_package 中自带的测试（适配补全）
test_package_tests:
  - file: test_consumer.c
    description: "REPORT_GENERAL 请求长度 == 0（smp_def_rrlen_arr 表值）"
    command: "smp_get_func_def_req_len(SMP_FN_REPORT_GENERAL)"
  - file: test_consumer.c
    description: "REPORT_GENERAL 响应长度 == 6"
    command: "smp_get_func_def_resp_len(SMP_FN_REPORT_GENERAL)"
  - file: test_consumer.c
    description: "DISCOVER 请求长度 == 2"
    command: "smp_get_func_def_req_len(SMP_FN_DISCOVER)"
  - file: test_consumer.c
    description: "DISCOVER 响应长度 == 12"
    command: "smp_get_func_def_resp_len(SMP_FN_DISCOVER)"
  - file: test_consumer.c
    description: "数字后缀解析 2k == 2048"
    command: "smp_get_num(\"2k\")"
  - file: test_consumer.c
    description: "数字后缀解析 2KB == 2000（十进制 KB）"
    command: "smp_get_num(\"2KB\")"
  - file: test_consumer.c
    description: "十六进制解析 0x10 == 16"
    command: "smp_get_num(\"0x10\")"
  - file: test_consumer.c
    description: "64 位数字后缀解析 1m == 1048576"
    command: "smp_get_llnum(\"1m\")"
  - file: test_consumer.c
    description: "页大小 == 4096（sysconf）"
    command: "smp_get_page_size()"
  - file: test_consumer.c
    description: "uname().machine 为 aarch64（qemu 下透传宿主 x86_64 亦接受）"
    command: "uname()"
  - file: test_consumer.c
    description: "自解析 /proc/self/exe：ELFCLASS64"
    command: "fopen(\"/proc/self/exe\") + EI_CLASS check"
  - file: test_consumer.c
    description: "自解析 /proc/self/exe：e_machine == EM_AARCH64 (0xB7)"
    command: "fopen(\"/proc/self/exe\") + e_machine check"
  - file: test_consumer.c
    description: "自解析 /proc/self/exe：无 PT_INTERP（静态自包含）"
    command: "fopen(\"/proc/self/exe\") + program header walk"
  - file: test.sh
    description: "安装的 smp_* 二进制数 >= 29"
    command: "ls bin/smp_*"
  - file: test.sh
    description: "每个 smp_* 工具 --version 输出含 version:（29 个，运行时发现）"
    command: "smp_* --version"
  - file: test.sh
    description: "smp_rep_general --help 含 usage"
    command: "smp_rep_general --help"
  - file: test.sh
    description: "smp_discover_list --help 含 usage"
    command: "smp_discover_list --help"
  - file: test.sh
    description: "smp_rep_general 缺设备 exit == 92（SMP_LIB_FILE_ERROR）"
    command: "smp_rep_general /dev/no-such-smp-dev"
  - file: test.sh
    description: "smp_rep_general 缺设备 stderr 提及设备名"
    command: "smp_rep_general /dev/no-such-smp-dev"
  - file: test.sh
    description: "smp_discover 缺设备 exit == 92（SMP_LIB_FILE_ERROR）"
    command: "smp_discover /dev/no-such-smp-dev"
  - file: test.sh
    description: "smp_discover 缺设备 stderr 提及设备名"
    command: "smp_discover /dev/no-such-smp-dev"
  - file: test.sh
    description: "readelf 校验 smp_rep_general ELF 类型（EXEC/DYN）"
    command: "readelf -h smp_rep_general"
  - file: test.sh
    description: "校验产物为静态链接（R26：不应有 NEEDED 项）"
    command: "readelf -d smp_rep_general"

# 测试断言总数（实测）：
#   test_consumer.c: 13（9 条 API + 1 条 uname + 3 条 ELF）
#   test.sh: 38（29 version + 1 计数 + 2 help + 2×(exit+stderr) + 2 readelf）
assertion_count: 51
