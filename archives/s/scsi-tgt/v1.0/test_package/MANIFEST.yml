# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: scsi-tgt/v1.0
homepage: "https://github.com/fujita/tgt"

# Upstream test command (tgt has no make check target)
upstream_check_command: ""

# conanfile.py build() method does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (tgt has no formal test suite)
upstream_tests: []

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Smoke test: tgtd --version outputs version string"
    command: "tgtd --version"

# Approximate assertion count
assertion_count: 1
