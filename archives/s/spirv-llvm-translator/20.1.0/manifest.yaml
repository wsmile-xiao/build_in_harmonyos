# manifest.yaml — SPIRV-LLVM-Translator 20.1.0 (版本级)
software: SPIRV-LLVM-Translator
version: "20.1.0"
status: built
build_system: cmake
build_date: 2026-07-24
compiler: clang/clang++ (15.0.4)
upstream_version: "v20.1.0"
base_llvm_version: "20.1.0"

dependencies:
  - llvm/20.1.0

build_flags:
  - "-DLLVM_SPIRV_INCLUDE_TESTS=OFF"
  - "-DLLVM_SPIRV_BUILD_EXTERNAL=YES"
  - "-DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR=<local spirv-headers>"

platform_adaptations:
  - "Platform/HarmonyOS.cmake (include(Platform/Linux)) — 绕过 HandleLLVMOptions.cmake 平台检测"
  - "SPIRV-Headers 从 GitHub 下载到本地目录，绕过 FetchContent 网络限制"
  - "ELF 签名 (llvm-objcopy + binary-sign-tool) — OHOS XPM 要求"

products:
  - lib/libLLVMSPIRVLib.a
  - bin/llvm-spirv
  - include/LLVMSPIRVLib/LLVMSPIRVLib.h
  - include/LLVMSPIRVLib/LLVMSPIRVOpts.h
  - include/LLVMSPIRVLib/LLVMSPIRVExtensions.inc
  - lib/pkgconfig/LLVMSPIRVLib.pc
