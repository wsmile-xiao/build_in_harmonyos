# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: SPIRV-LLVM-Translator/20.1.0
homepage: "https://github.com/KhronosGroup/SPIRV-LLVM-Translator"

# 上游测试命令
upstream_check_command: "cmake --build . --target check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/_lit.cfg.py
    source: SPIRV-LLVM-Translator-20.1.0/test/lit.cfg.py
    description: "LLVM lit 测试套件配置（需 LLVM lit 工具，OHOS 上不可用）"
    command: "llvm-lit test/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "编译验证 + 二进制执行测试"
    command: "llvm-spirv --help"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
