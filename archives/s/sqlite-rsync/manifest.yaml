# 软件级 manifest.yaml
# 文件位置: archives/s/sqlite-rsync/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: sqlite-rsync
description: SQLite remote database synchronization tool
license: blessing
category: database

# 版本索引（自动更新）
versions:
  - version: "3.51.3"
    status: built
    build_date: "2026-06-05"
    tarball: sqlite-rsync-3.51.3-ohos-aarch64.tar.gz

# 软件元数据
metadata:
  homepage: https://sqlite.org/sqlite3_rsync.html
  source_url_pattern: https://sqlite.org/{year}/sqlite-src-{version_code}.zip
  documentation: https://sqlite.org/docs.html

# 构建特性
build_features:
  build_system: autotools
  special_handling: manual_compile  # autosetup 在鸿蒙系统上无法工作
  requires_amalgamation: true       # 需要 amalgamation 版本的 sqlite3.c

# 依赖关系
dependencies:
  runtime:
    - libc
  optional:
    - ssh  # 远程同步功能

# 相关工具
related_tools:
  - sqlite3
  - sqldiff
  - sqlite3_analyzer

# 标签
tags:
  - database
  - sync
  - remote
  - backup
  - sqlite

---

**最后更新**: 2026-06-06