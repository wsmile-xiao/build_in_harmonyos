# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sqlite-rsync/3.51.3
homepage: https://sqlite.org/

# 上游测试命令
# sqlite3_rsync is a utility; upstream (main.mk) ships no dedicated test
# target for it — upstream validation is exercising the tool itself
# (see https://sqlite.org/rsync.html usage examples).
upstream_check_command: "sqlite3_rsync --version"
upstream_test_in_build: false
upstream_test_command: "sqlite3_rsync SRC.db REPLICA.db (local round-trip sync)"
upstream_test_result: "PASS on HarmonyOS PC (aarch64): --version OK; 100/100 rows synced and verified"

# test_package 中自带的测试
test_package_tests:
  - file: test_sqlite_rsync.sh
    description: "fail-able 功能测试: --version 执行 + 本地同步 round-trip + 副本数据断言(count/spot-check) + argv 加固回补回归(未知选项必须报错)"
    command: "bash test_sqlite_rsync.sh (via conanrun env, python3 stdlib sqlite3 建库/断言)"

# 测试断言总数
# [1] --version exit 0; [3] sync exit 0; [4] dst 非空 + count=100 + count 一致 + 行内容一致;
# [5] 未知选项 exit != 0 + 错误信息含 "unknown option"
assertion_count: 8
