software: sqlite-rsync
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.51.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.51.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# 构建系统类型（顶层字段，供 manifest_complete 检查）
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sqlite.org/2026/sqlite-src-3510300.zip"

  # 源码校验和
  sha256: "f8a67a1f5b5cae7c6d42f0994ca7bf1a4a5858868c82adc9fc1340bed5eb8cd2"

  # 额外源码（amalgamation 版本）
  amalgamation_url: "https://sqlite.org/2026/sqlite-amalgamation-3510300.zip"
  amalgamation_sha256: "acb1e6f5d832484bf6d32b681e858c38add8b2acdfd42ac5df24b8afb46552b4"

  # 压缩格式
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: custom

  # 实际构建方式（因 autosetup 问题）
  actual_build_method: manual_compile

  # 配置选项列表
  configure_options: []
  manual_compile_steps:
    - "clang -c -fPIC -O2 -DSQLITE_ENABLE_DBPAGE_VTAB -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_OMIT_DEPRECATED sqlite3.c -o sqlite3.o"
    - "clang -c -fPIC -O2 -I{amalgamation_dir} -DSQLITE_ENABLE_DBPAGE_VTAB -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_OMIT_DEPRECATED sqlite3_rsync.c -o sqlite3_rsync.o"
    - "clang sqlite3_rsync.o sqlite3.o -o sqlite3_rsync -lpthread -ldl -lm"
    - "ohc-run.py sign-elf sqlite3_rsync"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++
  cc_version: "15.0.4"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-backport-upstream-argv-hardening.patch"
# 上游 check-in c84d596b6da2 (2026-05-26, 晚于 3.51.3 release)：
#   1. main() argv 循环 z[i]=='-' 越界读/误判修复（应为 z[0]）
#   2. ssh 命令构造中 origin/replica 参数转义加固
# 上游引用: https://sqlite.org/src/info/c84d596b6da22061627282d444913c88dc2f9bd82e86957183f7e732f2713b33

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - issue: "autosetup 临时文件路径问题"
    category: "L1 平台真理"
    description: "autosetup 在创建临时编译测试文件时硬编码使用 /tmp，而鸿蒙系统 /tmp 是只读文件系统，导致 configure 失败"
    impact: "所有使用 SQLite autosetup 构建系统的工具（sqlite3_analyzer、sqlite3_rsync 等）"
    solution: "使用 amalgamation 版本 + 手动编译，或修改 autosetup 使用 $TMPDIR 环境变量"
    suggested_error_id: "E-TMPDIR-001"

  - issue: "sqlite3_rsync 必须启用 SQLITE_ENABLE_DBPAGE_VTAB"
    category: "L2 模式经验"
    description: "sqlite3_rsync 的 originSide/replicaSide 通过 sqlite_dbpage 虚拟表读写页数据（sqlite3_rsync.c: INSERT INTO sqlite_dbpage / FROM sqlite_dbpage('main')）；未定义该宏时二进制可编译链接，但任何同步操作都会运行时报 no such table: sqlite_dbpage"
    impact: "所有手动编译 sqlite3_rsync / sqlite_dbpage 使用者的配方"
    solution: "编译标志与上游 main.mk 的 RSYNC_OPT 保持一致（-DSQLITE_ENABLE_DBPAGE_VTAB 等 4 个 -D 宏）"

  - issue: "OHOS 本地同步模式实测可用"
    category: "L2 模式经验"
    description: "sqlite3_rsync 本地模式通过 execl(\"/bin/sh\", \"-c\", cmd) 派生 replica 子进程；实测 HarmonyOS PC (aarch64) 上 mksh 可以正常 exec 已签名的 ELF，round-trip 同步 100 行数据校验通过（此前误判为平台限制）"
    impact: "sqlite3_rsync 及其他依赖 popen2/system 的工具在 OHOS 上的可行性评估"
    solution: "测试用例直接执行本地 round-trip 并断言副本数据（test_package/test_sqlite_rsync.sh）"

  - issue: "unzip 解压后权限丢失"
    category: "L2 模式经验"
    description: "unzip 解压后 autosetup-find-tclsh 缺少执行权限"
    solution: "chmod +x autosetup-find-tclsh configure"

  - issue: "ccache 兼容性问题"
    category: "L2 模式经验"
    description: "autosetup 默认使用 ccache，在鸿蒙系统上可能有兼容性问题"
    solution: "设置 CCACHE=none 禁用 ccache"
