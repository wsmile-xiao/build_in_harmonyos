# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: spin/6.5.2
homepage: https://spinroot.com/

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# spin 无 make check 目标
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "spin -V 版本号验证"
    command: "sh test.sh"

# 测试断言总数 (近似值)
assertion_count: 1
