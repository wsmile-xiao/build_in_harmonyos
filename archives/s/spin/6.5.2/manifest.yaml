software: spin
version: "6.5.2"
status: built
build_date: "2026-06-08"
build_system: makefile

source:
  url: "https://github.com/nimble-code/Spin/archive/refs/tags/version-6.5.2.tar.gz"
  sha256: "e46a3bd308c4cd213cc466a8aaecfd5cedc02241190f3cb9a1d1b87e5f37080a"
  tar_format: tar.gz

build:
  system: makefile
  build_subdir: Src
  configure_options:
    - "CC=clang"
  dependencies: []
  cc: clang
  cxx: clang++

required_env:
  CFLAGS: "-fPIC -O2 -DNXT -Wall -pedantic"
  YACC: "bison -y"
  LDFLAGS: "-fuse-ld=bfd"
  INSTALL: "install -D"

patches_applied: []

knowledge_gained:
  - "E081: Makefile 项目 bison 输出格式不兼容 + OHOS lld 链接器依赖问题 — YACC='bison -y' 与 -fuse-ld=bfd"
  - "spin 使用自定义 Makefile，无 configure 脚本，需手动传递编译参数"
  - "spin Makefile DESTDIR 变量实际为安装 PREFIX（非 autotools 标准 DESTDIR 含义）"
  - "make install 需 INSTALL='install -D' 自动创建目标目录（spin Makefile 不自动 mkdir）"