software: ssmtp
version: "2.64"
status: published
build_date: "2026-09-17"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/s/ssmtp/ssmtp_2.64.orig.tar.bz2"
  sha256: "22c37dc90c871e8e052b2cab0ad219d010fa938608cd66b21c8f3c759046fa36"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--enable-ssl"
    - "--enable-md5auth"
    - "--enable-inet6"
    - "--enable-logfile"
  dependencies:
    - openssl/1.1.1w
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ssmtp uses autoconf 2.13 configure script; no config.guess/config.sub needed"
  - "(char)NULL casts in ssmtp.c cause clang errors; suppress with -Wno-int-conversion"
  - "Makefile lacks DESTDIR support; package() installs manually"
  - "generate_config uses hostname --fqdn which fails on HarmonyOS; create default ssmtp.conf"
  - "openssl/1.1.1w published to ohpcd registry (2026-08); SSL enabled by default, no trimming"
  - "autoconf 2.13 Makefile link line uses @LIBS@ only (no LDFLAGS); -L/-lcrypto must ride in LIBS env at configure time"
  - "Makefile does not capture env CPPFLAGS into CFLAGS; openssl -I injected via Makefile regex patch"
