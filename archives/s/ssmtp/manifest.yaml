software: ssmtp
display: "ssmtp"
description: "Send-only sendmail emulator for machines which pick up mail from a centralized mailhub"
category: network
homepage: "https://packages.debian.org/source/ssmtp"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "autoconf 2.13 老式 configure：--enable-ssl 仅定义 HAVE_SSL 并追加 -lssl，无 SSL 检测"
    - "老 Makefile 链接行只用 @LIBS@（无 LDFLAGS）：openssl -L/-lcrypto 通过 LIBS 环境变量注入"
    - "Makefile 不捕获环境 CPPFLAGS：openssl -I 通过 Makefile 正则补丁追加到 CFLAGS"
    - "ssmtp.c 27 处 (char)NULL 需 -Wno-int-conversion 等警告抑制"
    - "generate_config 依赖 hostname --fqdn（OHOS 不支持）：package() 手动创建默认 ssmtp.conf"
  common_dependencies:
    - openssl/1.1.1w

versions:
  "2.64":
    status: published
    build_date: "2026-09-17"
