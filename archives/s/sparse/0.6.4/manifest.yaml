software: sparse
build_system: makefile
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.6.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.6.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/sparse/sparse-0.6.4.tar.xz"

  # 源码校验和
  sha256: "6ab28b4991bc6aedbd73550291360aa6ab3df41f59206a9bde9690208a6e387c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang-wrapper"
    - "PREFIX=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

  # 平台适配
  hints:
    - "E064: clang-wrapper 自动签名绕过 conftest 执行限制"
    - "E007: config.guess/config.sub 需替换为 OHOS 识别版本"
    - "E011: umask 022 替换 umask 077 绕过 HMDFS 权限问题"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "sparse 0.6.4 uses plain Makefile (no configure script), build with make CC=clang-wrapper PREFIX=$DEFAULT_PREFIX"
  - "GCC_BASE and MULTIARCH_TRIPLET detection works correctly with clang-wrapper (--print-file-name= and -print-multiarch)"
  - "libxml, sqlite3, gtk, llvm are optional dependencies; sparse builds fine without them (disabled with warnings)"
  - "make check (test-suite) hangs/times out on OpenHarmony platform, skip and record reason"
