software: sqlpage
display: "SQLPage"
description: "SQL-powered web page builder — write SQL queries to generate interactive web pages"
category: db
homepage: "https://github.com/sqlpage/SQLPage"
license: MIT
build_system: cargo

ohos_adaptation:
  key_points:
    - "Rust项目，使用cargo构建，目标为aarch64-unknown-linux-ohos"
    - "需要9个补丁：cargo配置、Cargo.toml/lock依赖修改、数据库模块适配"
    - "生成静态二进制文件，无外部动态库依赖"
    - "需要.cargo/config.toml配置OHOS交叉编译工具链"
    - "数据库模块(connect/mod/sql/sql_to_json)需要适配OHOS环境"
  common_dependencies:
    - rust-toolchain

versions:
  "0.44.0":
    status: built
    build_date: "2026-06-12"