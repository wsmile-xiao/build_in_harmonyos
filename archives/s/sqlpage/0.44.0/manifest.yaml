version: "0.44.0"
status: built
build_date: "2026-06-12"

source:
  url: "https://github.com/sqlpage/SQLPage/archive/refs/tags/v0.44.0.tar.gz"
  tar_format: tar.gz

build:
  system: cargo
  configure_options:
    - "Target: aarch64-unknown-linux-ohos"
    - "Static binary build (no external dependencies)"
  dependencies:
    - "rust-toolchain"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-.cargo-config.toml.patch"
  - "0002-Cargo.lock.patch"
  - "0003-Cargo.toml.patch"
  - "0004-build.rs.patch"
  - "0005-src-webserver-database-connect.rs.patch"
  - "0006-src-webserver-database-mod.rs.patch"
  - "0007-src-webserver-database-sql.rs.patch"
  - "0008-src-webserver-database-sql-parameter_extraction.rs.patch"
  - "0009-src-webserver-database-sql_to_json.rs.patch"

knowledge_gained:
  - "Rust cargo projects need .cargo/config.toml for OHOS cross-compilation toolchain"
  - "Cargo.toml/Cargo.lock dependency versions may need adjustment for OHOS compatibility"
  - "build.rs scripts may need patching for OHOS-specific build environment"
  - "Database module source files need adaptation for OHOS system call differences"
  - "Static binary build eliminates runtime dependency issues on OHOS"
  - "sqlpage generates a self-contained static binary with built-in SQLite"