# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sml/1.1.11
homepage: "https://github.com/boost-ext/sml"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ctest 全量 30 项: ft 23 + ut 3 + unit 4, 实测 30/30 通过)
upstream_tests:
  - file: test/ft/*.cpp
    source: sml-1.1.11/test/ft
    description: "Functional tests (actions/defer/composite/di/events/exceptions/history/orthogonal_regions/policies/state_machine/transitions/unexpected_events)"
    command: "ctest -R test_"
  - file: test/ut/*.cpp
    source: sml-1.1.11/test/ut
    description: "Utility tests (concepts/type_traits/utility)"
    command: "ctest -R test_"
  - file: test/unit/*.cpp
    source: sml-1.1.11/test/unit
    description: "Unit tests (units)"
    command: "ctest -R test_"
  - file: test/ft/errors/*.cpp
    source: sml-1.1.11/test/ft/errors
    description: "Compile-fail tests (expect non-zero compile)"
    command: "make test"  # 仅出现在 Makefile 目标, 不注册 ctest

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：真实调用 sml 状态机 API（事件/状态/迁移/断言）"
    command: "./test_sml"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 34