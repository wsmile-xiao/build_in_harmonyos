# SISL 4.6.0 test inventory (R51)
package: sisl/4.6.0
homepage: "https://github.com/SINTEF-Geometry/SISL"

# Upstream registers no CTest suite (the root CMakeLists.txt has no enable_testing()/add_test()),
# and the released tarball's examples/Makefile is the single line `include ../makefile_template`,
# a file the tarball does not ship, so `make -f Makefile` inside examples/ stops with
#   Makefile:1: ../makefile_template: No such file or directory
#   make: *** No rule to make target '../makefile_template'.  Stop.
# The 26 demo/example assets declared in the PR body were therefore built and executed out-of-band
# on HarmonyOS PC (build host A, runner CIW-S4k3, 2026-09-27). Per-asset results, the success
# predicate and the machine-readable summary are in notes.md, section
# "Upstream test suite real execution".
upstream_check_command: "none registered: no tests/ directory, no enable_testing()/add_test(); examples/Makefile unusable (missing ../makefile_template). Executed instead: clang++ -std=c++11 -O2 -I<tree>/include -I<tree>/examples/streaming/include -o <bin>/exampleNN <tree>/examples/exampleNN.cpp <tree>/examples/streaming/src/GoReadWrite.cpp <build>/libsisl.a -lm, then run in numeric order from one shared CWD"
upstream_test_in_build: false
upstream_test_command: ""

# 19 of the 26 upstream assets carry main(); 18 were executed and passed, 1 is blocked at build.
# The PASS rule for exampleNN comes from upstream's own code: its main() ends with
#   } catch (exception& e) { cerr << "Exception thrown: ..." ; return 0; }  return 1;
# i.e. rc==1 is success and rc==0 means SISL threw. So a pass is rc==1, no "Exception thrown"
# line, every declared IN_FILE_* input present and every declared OUT_FILE_* produced non-empty.
# app/*prob.C are targets registered by the upstream CMake app/*.C glob and pass on rc==0.
# Descriptions below are condensed from each file's own upstream DESCRIPTION string.
upstream_tests:
  - file: app/s1013prob.C
    source: SISL-4.6.0/app/s1013prob.C
    description: "Upstream CMake-registered problem program exercising s1013 and s1221; executed, rc=0, 24 bytes of numeric geometry output"
    command: "./s1013prob"
  - file: app/s1320prob.C
    source: SISL-4.6.0/app/s1320prob.C
    description: "Upstream CMake-registered problem program exercising s1602 and s1955; executed, rc=0, 8 bytes of numeric output"
    command: "./s1320prob"
  - file: app/s1606prob.C
    source: SISL-4.6.0/app/s1606prob.C
    description: "Upstream CMake-registered problem program exercising s1606 and s1611; executed, rc=0, 404 bytes including a GoNurbsCurve3D result"
    command: "./s1606prob"
  - file: examples/example01.cpp
    source: SISL-4.6.0/examples/example01.cpp
    description: "Generate a SISL spline object from predefined control points and parametrization and write it, plus its control points, in Go-format; executed rc=1 (upstream success code), 2 declared output files produced non-empty"
    command: "./example01"
  - file: examples/example02.cpp
    source: SISL-4.6.0/examples/example02.cpp
    description: "Generate a curve by interpolating a given point set with automatically calculated parametrization (routine s1356); executed rc=1, 2 output files produced"
    command: "./example02"
  - file: examples/example03.cpp
    source: SISL-4.6.0/examples/example03.cpp
    description: "Create a blend curve joining the endpoints of the curves generated by examples 1 and 2 (s1606, endpoints evaluated with s1227); executed rc=1, 2 declared inputs read back, 1 output produced"
    command: "./example03"
  - file: examples/example04.cpp
    source: SISL-4.6.0/examples/example04.cpp
    description: "Generate a curve approximating an offset of a given input curve (s1360); executed rc=1, 1 declared input read, 1 output produced"
    command: "./example04"
  - file: examples/example05.cpp
    source: SISL-4.6.0/examples/example05.cpp
    description: "Generate conic sections as exact NURBS SISLCurves (s1011) and save them in Go-format; executed rc=1, 1 output produced"
    command: "./example05"
  - file: examples/example06.cpp
    source: SISL-4.6.0/examples/example06.cpp
    description: "Generate two planar-in-3D curves from internal data and compute their intersections (s1857), saving curves and intersection points; executed rc=1, 3 outputs produced"
    command: "./example06"
  - file: examples/example07.cpp
    source: SISL-4.6.0/examples/example07.cpp
    description: "Compute the length of a curve read from file (example6_curve_1.g2); executed rc=1, 1 declared input read, result on stdout (254 bytes)"
    command: "./example07"
  - file: examples/example08.cpp
    source: SISL-4.6.0/examples/example08.cpp
    description: "Generate two non-intersecting curves from internal data and compute their mutual closest points (s1955); executed rc=1, 3 outputs produced"
    command: "./example08"
  - file: examples/example09.cpp
    source: SISL-4.6.0/examples/example09.cpp
    description: "Generate a series of surfaces each interpolating an internally defined 3D point array (s1534/s1537) and write them plus the points; executed rc=1, 2 outputs produced"
    command: "./example09"
  - file: examples/example10.cpp
    source: SISL-4.6.0/examples/example10.cpp
    description: "Generate a series of curves and a lofted surface through them (s1538), writing curves and surface separately; executed rc=1, 2 outputs produced"
    command: "./example10"
  - file: examples/example11.cpp
    source: SISL-4.6.0/examples/example11.cpp
    description: "Generate a cylindrical surface and save it to file; executed rc=1, 1 output produced"
    command: "./example11"
  - file: examples/example12.cpp
    source: SISL-4.6.0/examples/example12.cpp
    description: "Compute all intersection points between a curve and a surface, both taken from earlier example outputs (example4 and example10), via s1858; executed rc=1, 2 declared inputs read, 1 output produced"
    command: "./example12"
  - file: examples/example13.cpp
    source: SISL-4.6.0/examples/example13.cpp
    description: "Compute the intersection curves between two surfaces from earlier example outputs (example10 and example11), via s1310/s1859; executed rc=1, 2 declared inputs read, 1 output produced (11877-byte result file)"
    command: "./example13"
  - file: examples/example14.cpp
    source: SISL-4.6.0/examples/example14.cpp
    description: "Demonstrate a SISL data-reduction capability: sample a dense point set from a predefined curve, then fit a curve to those samples with as few control points as possible; executed rc=1, 2 outputs produced"
    command: "./example14"
  - file: examples/example15.cpp
    source: SISL-4.6.0/examples/example15.cpp
    description: "Simple ray-tracing of a bspline surface - rays from a point towards the surface, computing the intersection points, with the default and the quick method compared; executed rc=1, 1 declared input read, 1 output produced (145926-byte point cloud), self-timed"
    command: "./example15"
  - file: examples/viewer/sisl_view_demo.cpp
    source: SISL-4.6.0/examples/viewer/sisl_view_demo.cpp
    description: "BLOCKED at build on this platform and NOT counted as passed. First real error: examples/viewer/sisl_view_demo.cpp:52:10: fatal error: 'GL/glut.h' file not found. The absence was measured, not assumed: the OHOS SDK sysroot ships only GL/gl.h, GL/glcorearb.h and GL/glext.h (no glut.h, no glx.h); no libglut/libGLU/libGL exists anywhere on the machine; and conan list 'glut/*' -r=ohpcd as well as 'opengl/*' both report 0 recipes"
    command: "./sisl_view_demo"

# The remaining 7 upstream assets have no main(): they are translation units consumed as
# compile/link inputs by the programs above. They cannot be executed as standalone cases, so
# they are gated by their compiler exit code.
upstream_support_translation_units:
  - file: examples/streaming/src/GoReadWrite.cpp
    description: "COMPILED (rc=0) - readGoCurve/readGoSurface/writeGoCurve/writeGoSurface/writeGoPoints used by all 15 executed examples"
  - file: examples/viewer/src/aux2.cpp
    description: "COMPILED (rc=0)"
  - file: examples/viewer/src/sisl_aux.cpp
    description: "COMPILED (rc=0)"
  - file: examples/viewer/src/gl_aux.cpp
    description: "BLOCKED (rc=1) - examples/viewer/include/gl_aux.h:44:10: fatal error: 'GL/glut.h' file not found"
  - file: examples/viewer/src/glutils.cpp
    description: "BLOCKED (rc=1) - examples/viewer/include/glutils.h:44:12: fatal error: 'GL/glx.h' file not found"
  - file: examples/viewer/src/mouse.cpp
    description: "BLOCKED (rc=1) - examples/viewer/src/mouse.cpp:42:10: fatal error: 'GL/glut.h' file not found"
  - file: examples/viewer/src/transfutils.cpp
    description: "BLOCKED (rc=1) - examples/viewer/src/transfutils.cpp:40:10: fatal error: 'GL/glut.h' file not found"

# Counting summary of the 26 declared upstream assets (per-asset table in notes.md).
# executable assets 19 -> 18 passed, 0 failed, 1 blocked
# support units      7 ->  3 compiled, 4 blocked
# total             26 -> 21 passed, 0 failed, 5 blocked
upstream_asset_total: 26
upstream_passed: 21
upstream_failed: 0
upstream_blocked: 5
upstream_go_output_files: 23
upstream_runner_exit_code: 0

test_package_tests:
  - file: test.c
    description: "Create a linear SISLCurve and evaluate it with s1221 at u=0.5; check allocation, status, and both coordinates"
    command: "test_sisl"
assertion_count: 55
# 55 = the 4 hard assertions in test_package/test.c plus the 51 upstream in-source status guards
# (jstat != ... tests and throw runtime_error sites, grepped from the 15 executed exampleNN.cpp
# files) that all had to stay silent for those programs to reach rc==1.
