# test_package/MANIFEST.yml
# 上游测试声明文件 — sgml 0.6.3 (sgml-common)

package: sgml/0.6.3
homepage: "https://www.sourceware.org/docbook-tools/"

# 上游测试命令分析 (R51): 上游 tarball 为 2001 年代 autotools 工程，
# 无任何 test 目标实现 (doc/Makefile.in check 为 no-op)，无 tests/ 目录、
# 无 ctest/pytest 注册 —— 上游零测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# 上游零测试 → 按规则自写 test_package 消费者测试 (bonus +0.5)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 调用已安装 install-catalog/sgmlwhich，验证 sgmlwhich 输出、版本与 usage、数据文件树 (xml.dcl/ISO 实体)、sgml.conf、以及上游硬编码 /etc/sgml 可写性守卫行为 (exit 2)"
    command: "bash test.sh"

# 自写测试断言总数 (test.sh 内 6 组检查)
assertion_count: 6
