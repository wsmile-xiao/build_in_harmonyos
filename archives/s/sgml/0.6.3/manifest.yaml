# 关键适配点：
# 上游 tarball 将 automake 辅助脚本 (install-sh / mkinstalldirs / missing /
# INSTALL / COPYING) 以指向 /usr/share/automake/* 的绝对路径符号链接打包；
# conan 解包后为悬空链接，且 OHOS 无 /usr/bin/install、无 /usr/share/automake。
# conanfile.py build() 在 configure 前重建自包含 install-sh / mkinstalldirs，
# 无需任何补丁、不依赖宿主 automake。

knowledge_gained:
  - "2001 年代 autotools 包可能以绝对路径符号链接打包 automake 辅助脚本，conan 的 fully_trusted 解包不会失败但 build/install 会；可在 build() 内重建自包含 helper 脚本解决"
  - "OHOS 无 /usr/bin/install，configure 的 AC_PROG_INSTALL 依赖源码树内 install-sh 存在"
