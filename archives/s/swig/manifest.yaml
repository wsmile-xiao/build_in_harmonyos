software: swig
display: "SWIG"
description: "Simplified Wrapper and Interface Generator for connecting C/C++ to scripting languages"
category: build-tool
homepage: "http://www.swig.org/"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 CCache/configure/config.guess/config.sub 四个补丁"
    - "依赖 pcre2，通过 PCRE2_CFLAGS/PCRE2_LIBS 传递路径"
    - "需设置 SWIG_LIB 环境变量指向 share/swig/4.4.0 目录"
  common_dependencies:
    - pcre2

versions:
  "4.4.0":
    status: published
    build_date: "2026-08-22"
  "4.4.1":
    status: published
    build_date: "2026-07-23"
