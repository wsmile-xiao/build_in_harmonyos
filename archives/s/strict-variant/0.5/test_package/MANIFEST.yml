package: strict-variant/0.5
homepage: "https://github.com/cbeck88/strict-variant"

upstream_check_command: "bash test/run_tests.sh"
upstream_test_in_build: true
upstream_test_command: "conan build() compiles and runs the six default Jamroot targets with clang++"

# test/Jamroot.jam registers four harness executables, two tutorial examples,
# and one optional Boost Spirit executable. Counts below are source-derived and
# keep optional inventory separate from executed results.
upstream_tests:
  - file: test/variant.cpp
    source: strict-variant-0.5/test/variant.cpp
    target: variant
    case_count: 27
    assertion_count: 266
    result: "PASS (27/27 registered cases; 266 TEST_* assertions)"
  - file: test/compare.cpp
    source: strict-variant-0.5/test/compare.cpp
    target: compare
    case_count: 2
    assertion_count: 20
    result: "PASS (2/2 registered cases; 20 TEST_* assertions)"
  - file: test/hash.cpp
    source: strict-variant-0.5/test/hash.cpp
    target: hash
    case_count: 2
    assertion_count: 20
    result: "PASS (2/2 registered cases; 20 TEST_* assertions)"
  - file: test/alloc.cpp
    source: strict-variant-0.5/test/alloc.cpp
    target: alloc
    case_count: 1
    assertion_count: 8
    result: "PASS (1/1 registered case; 8 TEST_* assertions)"
  - file: test/tutorial_basic.cpp
    source: strict-variant-0.5/test/tutorial_basic.cpp
    target: tutorial_basic
    case_count: 1
    assertion_count: 9
    result: "PASS (example executable; 9 assert() calls)"
  - file: test/tutorial_advanced.cpp
    source: strict-variant-0.5/test/tutorial_advanced.cpp
    target: tutorial_advanced
    case_count: 1
    assertion_count: 0
    result: "PASS (example executable; exit code 0, output 10 and 22.5)"

upstream_tests_skipped:
  - file: test/spirit.cpp
    source: strict-variant-0.5/test/spirit.cpp
    target: spirit
    case_count: 1
    assertion_count: 20
    result: "SKIP (expected)"
    reason: "test/Jamroot.jam makes Boost Spirit optional; /usr/include/boost/version.hpp is absent on the OHOS device, so this target is not registered."

upstream_inventory_binary_count: 7
upstream_executed_binary_count: 6
upstream_skipped_binary_count: 1
upstream_unit_case_count: 32
upstream_example_count: 2
upstream_executed_assertion_count: 323
upstream_skipped_assertion_count: 20

test_package_tests:
  - file: test_package.cpp
    description: "Consumer test: default construction, type/index access, assignment, apply_visitor, and emplace — 8 assertions."
    command: "./strict_variant_consumer"
    case_count: 1
    assertion_count: 8

test_package_test_count: 1
