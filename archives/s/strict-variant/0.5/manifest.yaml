# 版本级 manifest 模板
# 文件位置: archives/s/strict-variant/0.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5"

# 软件名
software: "strict-variant"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/cbeck88/strict-variant/archive/refs/tags/v0.5.tar.gz"

  # 源码校验和
  sha256: "6bbb7add1323b8a298b2e264e22063abcbb2eb30e68afcccd6e95e88dea68ce0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "strict-variant/0.5 是 header-only C++11 库；官方归档的首个嵌套 CMakeLists.txt 位于 bench/eggs-variant，不能据此替代顶层 include/strict_variant。"
  - "官方 test/run_tests.sh 依赖 b2 或 bjam；OHOS 设备未安装该工具，配方按 test/Jamroot.jam 的参数直接编译运行默认目标。"
  - "Clang 15 在未修改的上游测试中触发 deprecated-copy-with-user-provided-copy 与 return-type 两项 -Werror 诊断；仅对这两项使用 -Wno-error，未改测试源码或断言。"
  - "Boost Spirit 测试由上游按 boost/version.hpp 条件注册；OHOS 设备缺少 Boost 头文件，按上游条件预期跳过并保留清单分母。"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
