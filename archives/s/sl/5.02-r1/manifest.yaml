software: sl
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/5.02-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "5.02-r1"
status: built
build_system: makefile
build_date: "2026-08-22"

source:
  url: "https://github.com/mtoyoda/sl/archive/5.02.tar.gz"
  sha256: "1e5996757f879c81f202a18ad8e982195cf51c41727d3fea4af01fdcbbb5563a"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang"
    - "CPPFLAGS=-I<ncurses_include>"
    - "LDFLAGS=-L<ncurses_lib>"
    - "LIBS=-lncursesw"
  dependencies:
    - ncurses/6.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.patch"

knowledge_gained:
  - "sl使用简单Makefile，非autotools，需手动修改CC/CFLAGS/LDFLAGS"
  - "ncursesw(wide-char)是预编译包中的ncurses库形式，需用-lncursesw而非-lncurses"
  - "OHOS ncurses包中libtinfo已合并进libncursesw，无需单独-ltinfo"
  - "Makefile使用?=使Conan可通过命令行覆盖CC/CFLAGS"
  - "sl为命令行工具(application类型)，需commands.json声明(R38)"

conan_adaptation:
  recipe: conanfile.py
  test_package: test_package/
  package_type: application
  commands_json: true
