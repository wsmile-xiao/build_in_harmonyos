# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sl/5.02-r1
homepage: "https://github.com/mtoyoda/sl"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# sl has no upstream test suite — it is an interactive animation program
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sl.py
    description: "Verify sl binary exists, is executable, and links ncurses correctly (TERM=dumb smoke test)"
    command: "python3 test_sl.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
