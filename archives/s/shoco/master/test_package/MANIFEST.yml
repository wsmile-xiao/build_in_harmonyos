# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# shoco master 上游测试声明（ET 双口径台账见 notes.md ）：
#   上游用户测试源 2 个（tests.c / test_input.c），均为单 main + assert 驱动，
#   无第三方测试框架（无 TEST()/TEST_CASE 宏）。全量发现 2 项，均构建并实际运行通过。

package: shoco/master
homepage: "https://github.com/Ed-von-Schleck/shoco"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests.c
    source: shoco-master/tests.c
    description: "shoco 压缩/解压 API 断言测试（31 个 assert）"
    command: "./tests"
  - file: test_input.c
    source: shoco-master/test_input.c
    description: "stdin 行级压缩/解压回环一致性测试（3 个 assert）"
    command: "./test_input"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：公开 API 压缩/解压回环一致性"
    command: "./test_shoco"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 34