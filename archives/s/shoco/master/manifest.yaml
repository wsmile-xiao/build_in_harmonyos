# 版本级 manifest
# 文件位置: archives/{letter}/{name}/master/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "master"

# 软件名
software: "shoco"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/Ed-von-Schleck/shoco/tar.gz/refs/heads/master"

  # 源码校验和
  sha256: "512648c8211e6ffe43893ccbdd2417675494eed1baf50bd945e024992a8ac335"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-shoco-bin-alloca-h.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OKUNOS musl 下 alloca() 需显式包含 <alloca.h>：glibc 由 stdlib.h 隐式声明、musl 不提供，缺失导致隐式声明 + ld.lld undefined symbol: alloca"
  - "codeload.github.com 的 tar.gz URL 末段无扩展名时 conan get() 会误判为 zip（BadZipFile），conandata.yml 需显式 filename 字段"
  - "纯 Makefile 项目无 configure/install 目标时，conanfile.py 需用 conf 中的 compiler_executables 手工 CC/AR 构建并用 conan.tools.files.copy 打包（Conan 2 无 self.copy）"
  - "conandata.yml patches 必须用 list 格式（patch_file/patch_description/patch_type），dict 按 version 键查找会静默不应用"