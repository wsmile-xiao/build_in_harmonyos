# test_package/MANIFEST.yml — serializer 0.5
# 上游官方测试声明文件（CI L0e 强制要求）
#
# 上游清点证据：官方 v0.5 源码归档（SHA-256
# e749ab8ea08623c69f451979ef0d0d8afad6e0652bc8249c9fb214ef7fc6fa5f）仅含
# serializer.h / README.md / LICENSE 三个文件，无 tests/ 目录、无 CMakeLists、
# 无 configure/make check/ctest/meson 等任何测试入口（完整枚举见 notes.md 台账）。
package: serializer/0.5
homepage: "https://github.com/eyalz800/serializer"

upstream_check_command: "find . -maxdepth 2 -type f | sort"

# 上游无任何测试套件，conanfile.py 不集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（源码包不含测试）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，R34：真实调用公开 API）
test_package_tests:
  - file: test_package/test.cpp
    description: "消费者用例：通过已安装的 serializer.h 公开头文件做 save/load 往返（STL 容器、自定义类、多态类型），模拟业务上层仅经公开 API 使用该库"
    command: "./serializer_test"
  - file: test_package/ohos_test.cpp
    description: "鸿蒙专项测试：OHOS aarch64 平台特有行为（端序/字节布局、size_is 大小前缀、C++17 optional/variant、polymorphic 8 字节 ID）"
    command: "./ohos_test"

# 测试断言总数（test.cpp 实际 5 项 check + ohos_test.cpp 实际 14 项 check，均含程序成功退出）
assertion_count: 19
