# 版本级 manifest — sockpp 1.0.0
# 遵循 ARCHIVE-SPEC v2.0

software: sockpp
version: "1.0.0"
# published | built | failed | archived
status: built
build_date: "2026-09-26"
build_system: cmake

source:
  url: "https://github.com/fpagliughi/sockpp/archive/refs/tags/v1.0.0.tar.gz"
  sha256: "818477fae6eb29b9daacef71a3d0c494de9e48f6fd267a7fc5a4c332db211bc5"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DSOCKPP_BUILD_SHARED=OFF"
    - "-DSOCKPP_BUILD_STATIC=ON"
    - "-DSOCKPP_BUILD_TESTS=ON"
    - "-DSOCKPP_BUILD_EXAMPLES=OFF"
    - "-DSOCKPP_BUILD_DOCUMENTATION=OFF"
    - "-DSOCKPP_BUILD_CAN=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

test_dependencies:
  - "catch2/3.8.1 as a Conan test requirement when run_upstream_tests=True"

patches: []

platform_requirements:
  - "POSIX sockets only: no extra system library beyond libc/libc++; the Windows-only ws2_32 branch is not taken"
  - "Upstream unit tests bind 127.0.0.1 on an ephemeral port and use AF_UNIX socketpair() (no filesystem path), so the suite needs loopback networking but no writable /tmp"

knowledge_used:
  - "E092: CMake has no HarmonyOS platform module; pin CMAKE_SYSTEM_NAME=Linux so platform variables (DT_SONAME) are defined"

knowledge_gained:
  - "Upstream tests/unit/CMakeLists.txt calls include(CTest) only in the subdirectory and the top level never enables testing, so the build root has no CTestTestfile.cmake: running ctest at the build root prints 'No tests were found!!!' and still exits 0 (false green); the suite must be run with cwd=<build>/tests/unit"
  - "conan CMakeToolchain does not write CMAKE_SYSTEM_NAME, so CMake falls back to uname=HarmonyOS, gets 'System is unknown to cmake', leaves CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG empty and links shared libraries without DT_SONAME (readelf -d shows no SONAME); pinning CMAKE_SYSTEM_NAME=Linux restores libsockpp.so.1"
  - "Upstream ships test_inet6_address.cpp and test_result.cpp but never lists them in tests/unit/CMakeLists.txt add_executable, and test_socket.cpp / test_stream_socket.cpp each contain one #if 0 test case: 43 source TEST_CASE macros, 33 registered and executed"

verification:
  local:
    - "git ls-remote --tags https://github.com/fpagliughi/sockpp shows refs/tags/v1.0.0 = e6c4688a576d95f42dd7628cefe68092f6c5cd0f"
    - "Downloaded https://github.com/fpagliughi/sockpp/archive/refs/tags/v1.0.0.tar.gz (114358 bytes) and computed sha256 818477fae6eb29b9daacef71a3d0c494de9e48f6fd267a7fc5a4c332db211bc5, byte-identical to the CCI conandata.yml entry"
    - "W0 portability grep: no altivec/mmx/3dnow/immintrin/x86intrin/arm_neon/cpuid hits and no register_printf_*/printf.h glibc hook hits anywhere in the source tree"
    - "W0 dependency check: conan list -r=ohpcd catch2/* -> 3.16.0 / 3.8.1 / 2.13.10 / 2.13.10-r0 (ohos-aarch64 binary present); runtime dependencies: none"
    - "Exploratory cmake configure+build+install with the device clang toolchain and SOCKPP_BUILD_TESTS=ON completed; the Catch2 suite ran under ctest in tests/unit"
    - "Exploratory device probes: gethostbyname('localhost') -> 127.0.0.1, bind 127.0.0.1:12345 OK, AF_UNIX bind under /tmp denied with EROFS (upstream tests never bind an AF_UNIX path)"
    - "conan create on profile ohos-aarch64: package built, upstream suite ran (ctest -N Total Tests 33; 100% tests passed out of 33; Catch2 236 assertions) and test_package consumer test ran (20 assertions) - rc 0"
    - "conan_verify_round.sh rc=0 clean round (run_make=8 calling_build=2 apply_patch=0, conan DB empty beforehand); conan-verify verdict PASS with L2/L4 skipped because this is a pure-library package, manually supplemented in reports/conan-verify-supplement.md"
    - "finish built rc=0; finish_restore --apply reverted every side effect; capture_evidence --verify reports 3/3 evidence copies consistent"

next_commands:
  real_device_or_shadow_ci:
    - "CI_PACKAGES=\"archives/s/sockpp/1.0.0\" zsh ci/conan/build_and_test.sh"
    - "conan create archives/s/sockpp/1.0.0"
