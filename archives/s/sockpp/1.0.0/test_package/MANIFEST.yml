# test_package/MANIFEST.yml
# test_package 声明（CI L0e 强制要求，详见 docs/TEST_QUALITY_SPEC.md）

package: sockpp/1.0.0
homepage: "https://github.com/fpagliughi/sockpp"

# 上游测试入口（CMake/CTest；注意必须在 tests/unit 子目录执行，见下方说明）
upstream_check_command: "ctest --output-on-failure -j1"
upstream_test_in_build: true
upstream_test_mode: "required by the default run_upstream_tests=True option"
upstream_test_command: "conan create archives/s/sockpp/1.0.0"

upstream_tests:
  - file: "tests/unit"
    source: "sockpp-1.0.0/tests/unit"
    description: "Catch2 v3 单元测试（inet_address/inet6_address/socket/stream_socket/tcp_socket/datagram_socket/acceptor/connector/unix_address/unix_stream_socket/unix_dgram_socket/result），由 tests/unit/CMakeLists.txt 的 catch_discover_tests 注册为 33 个 CTest 用例"
    command: "ctest --output-on-failure -j1   # cwd = <build>/tests/unit"
    # N = 源码 TEST_CASE 宏清点（候选数法最大值）；N' = 框架注册并实际执行数
    cases: 43
    executed: 33
    registered: 33
    status: "33/33 执行用例全部 PASS；源码 TEST_CASE 宏 43 个，差额 10 个逐项归因"
    result: "ctest: 100% tests passed, 0 tests failed out of 33；Catch2 聚合摘要 All tests passed (236 assertions in 33 test cases)。未运行 10 个：8 个（test_inet6_address.cpp 6 + test_result.cpp 2）未被上游 tests/unit/CMakeLists.txt 的 add_executable 收录，上游自身也不编译；2 个在 test_socket.cpp / test_stream_socket.cpp 的 #if 0 死块内（thread-safe last error、stream_socket address constructor）"
    evidence: "设备 conan create 干净轮日志（reports/conan-create.log）与 reports/test-report.md"

test_package_tests:
  - file: test_sockpp.cpp
    description: "消费者视角：链接已安装的 sockpp，校验版本指纹、IPv4 地址与名字解析、TCP 环回 accept/connect/write_n/read_n 收发、AF_UNIX socketpair 收发"
    command: "./test_sockpp"

# test_package 断言数 = PR 正文「鸿蒙特有测试」行取值
assertion_count: 20
