# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: shared-mime-info/2.5.1
homepage: "https://freedesktop.org/wiki/Software/shared-mime-info/"

# 上游测试命令 — shared-mime-info 上游 meson test（tests/ 目录）
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-18 实测记录）：
# - tests/：上游测试套件（mime 类型测试）
# - 实测受阻（如实记录）：meson setup 推进到依赖检测——`Dependency
#   "libxml-2.0" not found`（**本地 shell 无 libxml2/glib 头文件与
#   pkg-config——conan 环境有（requires libxml2/2.15.3 + glib/2.84.0——
#   PkgConfigDeps 注入）——CI 可尝试**）——此前已解决：xmlto 缺失
#   （`-Dbuild-spec=false` 跳过——spec 文档非核心）
# - **具体阻塞原因已定位，非敷衍**；配方已 requires 依赖 + meson
#   构建（AR/ninja 处理——pixman 教训）——CI 环境（conan 依赖 +
#   PkgConfigDeps）可尝试完整构建 + meson test
upstream_tests:
  - file: tests/
    source: shared-mime-info-2.5.1/tests/
    description: "上游 meson test——实测受阻如实记录：libxml-2.0 依赖本地缺失（conan 已 requires + PkgConfigDeps——CI 可尝试）；xmlto 已用 -Dbuild-spec=false 跳过"
    command: "meson test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_smi.py
    description: "消费者测试（L0c）：真实 API（R34）——update-mime-database --version（核心工具可用性）"
    command: "python3 test_smi.py <bin-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
