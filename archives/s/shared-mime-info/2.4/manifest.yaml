software: shared-mime-info
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4"

# 构建系统（顶层字段，验证脚本要求）
build_system: meson

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（freedesktop 官方镜像源，R39 合规）
  url: "https://gitlab.com/freedesktop-sdk/mirrors/freedesktop/xdg/shared-mime-info/-/archive/2.4/shared-mime-info-2.4.tar.gz"

  # 源码校验和
  sha256: "531291d0387eb94e16e775d7e73788d06d2b2fdd8cd2ac6b6b15287593b6a2de"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dupdate-mimedb=false"
    - "-Dbuild-translations=true"
    - "-Dbuild-tests=true"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "glib/2.84.0"
    - "libxml2/2.15.3"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []

patch_generation:
  method: none
  patches_count: 0
