# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: shared-mime-info/2.4
homepage: "https://freedesktop.org/wiki/Software/shared-mime-info/"

# 上游测试命令 — shared-mime-info 上游 meson test（tests/ 目录）
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序：
# - tests/：上游测试套件（mime 类型测试）
# - conanfile.py build() 中已集成 meson test（build-tests=true）
# - test_tree_magic 变量作用域问题已在 build() 中修复（root meson.build 注入）
upstream_tests:
  - file: tests/
    source: shared-mime-info-2.4/tests/
    description: "上游 meson test——已在 conanfile.py build() 中集成（build-tests=true + test_tree_magic root 声明修复）"
    command: "meson test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_smi.py
    description: "消费者测试（L0c）：真实 API（R34）——update-mime-database -h（核心工具可用性）"
    command: "python3 test_smi.py <bin-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
