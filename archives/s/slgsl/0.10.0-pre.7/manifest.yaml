version: "0.10.0-pre.7"
software: "slgsl"
status: built
build_date: "2026-09-29"
build_system: "autotools"

source:
  url: "https://jedsoft.org/snapshots/slgsl-pre0.10.0-7.tar.gz"
  sha256: "11963a7343c44400984b0e55f1b3b960e2e4c08e6c1efa81245a44091ef04788"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-slanginc=<slang>/include"
    - "--with-slanglib=<slang>/lib"
    - "--with-gslinc=<gsl>/include"
    - "--with-gsllib=<gsl>/lib"
  dependencies:
    - slang/2.3.3
    - gsl/2.8
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-autoconf-config.guess-ohos.patch"
  - "0001-autoconf-config.sub-ohos.patch"
  - "0002-configure-umask-022.patch"

knowledge_gained:
  - "设备 uname -s 返回 HarmonyOS（非 Linux），2018 版 config.guess 会进入 Linux|GNU 分支去编译 dummy.c 探针——在 hmdfs 上因只读 /tmp 与 umask 限制失败；正确做法是直接 echo aarch64-unknown-linux-ohos 并 exit"
  - "旧版 config.sub 需三处齐改：maybe_os 列表、OS 合法性列表、以及 -linux*) 改写规则之前的 -linux-ohos* 特判（否则被改写成 linux-gnu-ohos）"
  - "configure 用 umask 077 建 config.status 临时目录，hmdfs 上本会话不可写 → confXXXXXX/subs1.awk: Permission denied；改 umask 022（SDL/inn2 同款）"
  - "slgsl 的 configure 拒绝源码外构建（srcdir 检查），必须 self.folders.build='.'"
  - "上游测试用 slsh 跑，而测试脚本首行调用 prepend_to_slang_load_path()——该函数仅由 slang 的 etc/slsh.rc 定义；slsh 靠 SLSH_CONF_DIR 找到 slsh.rc，rc 自身又读 SLSH_PATH，两者缺任一都报 undefined"
  - "编译出的 *-module.so 由解释器 dlopen，运行时需 SLANG_MODULE_PATH 指向模块目录才会被找到"
