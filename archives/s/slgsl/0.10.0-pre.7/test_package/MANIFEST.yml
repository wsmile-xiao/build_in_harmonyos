# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: slgsl/0.10.0-pre.7
homepage: "http://space.mit.edu/cxc/software/slang/modules/gsl/"

# 上游测试命令：src/Makefile 的 check 目标遍历 src/tests/test_*.sl 并用 slsh 运行
upstream_check_command: "make -C src check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check (cwd=src)"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/tests/test_import.sl
    source: slgsl-pre0.10.0-7/src/tests/test_import.sl
    description: "逐个 require 全部 GSL 模块（gslrand/gslcdf/gslsf/gslmatrix/gslconst/gslfft/...）并校验命名空间加载"
    command: "make check"
  - file: src/tests/test_err.sl
    source: slgsl-pre0.10.0-7/src/tests/test_err.sl
    description: "gsl_set_error_disposition 错误处理回调路径真实调用"
    command: "make check"
  - file: src/tests/test_fft.sl
    source: slgsl-pre0.10.0-7/src/tests/test_fft.sl
    description: "gslfft 正/逆变换与自相关数值往返"
    command: "make check"
  - file: src/tests/test_interp.sl
    source: slgsl-pre0.10.0-7/src/tests/test_interp.sl
    description: "gslinterp 线性/样条插值数值校验"
    command: "make check"
  - file: src/tests/test_integ.sl
    source: slgsl-pre0.10.0-7/src/tests/test_integ.sl
    description: "gslinteg 数值积分与误差界校验"
    command: "make check"
  - file: src/tests/test_rand.sl
    source: slgsl-pre0.10.0-7/src/tests/test_rand.sl
    description: "gslrand 随机数生成器与分布（含统计量界）校验"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_slgsl.py
    description: "消费者视角：用 packaged slsh 加载已打包的 gsl 模块，① gslrand 抽 1000 个标准正态样本并断言均值；② gslconst 断言光速常数；均通过真实 dlopen 路径"
    command: "conan create . (test_package)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
