sources:
  url: "https://jedsoft.org/snapshots/slgsl-pre0.10.0-7.tar.gz"
  sha256: "11963a7343c44400984b0e55f1b3b960e2e4c08e6c1efa81245a44091ef04788"
patches:
  - patch_file: "patches/0001-autoconf-config.guess-ohos.patch"
    patch_description: "autoconf/config.guess: recognise HarmonyOS (the device reports uname -s = HarmonyOS) and answer aarch64-unknown-linux-ohos directly instead of entering the generic Linux branch, which compiles a dummy.c probe that cannot run on this platform"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0001-autoconf-config.sub-ohos.patch"
    patch_description: "autoconf/config.sub: accept the linux-ohos system (add linux-ohos* to the maybe_os list, to the OS validity list, and add a -linux-ohos* case ahead of the generic -linux* rule that would otherwise rewrite it to linux-gnu)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-configure-umask-022.patch"
    patch_description: "configure: create the config.status temp directory with umask 022 instead of 077 — on hmdfs the 077 directory is unwritable for this session, so config.status fails to create its awk helper scripts (SDL/inn2 precedent)"
    patch_type: "portability"
    strip: 1
