# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: shapelib/1.5.0
homepage: "https://shapelib.maptools.org/"

# 上游测试命令: CMake BUILD_TEST=ON 时注册 ctest test1/test2/test3
# (tests/test1.sh 依赖外部 shape_eg_data.zip; test2/test3 自包含)
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游实际运行的测试 (详见 notes.md R51 申报表)
upstream_tests:
  - file: tests/test2.sh
    source: shapelib-1.5.0/tests/test2.sh
    description: "shptest 0..13 共 14 组 Shapefile/DBF 创建+shpdump 回读（实测全部通过；参照 stream2.out 未随 tarball 发布，逐组手工验证）"
    command: "bash tests/test2.sh（构建目录内，sed 替换二进制路径后）—— 实测 14/14"
  - file: tests/test3.sh
    source: shapelib-1.5.0/tests/test3.sh
    description: "shpcreate/dbfcreate/shpadd/dbfadd/shpdump 全链路（实测通过，Polygon 9 顶点 2 parts）"
    command: "bash tests/test3.sh（构建目录内）—— 实测通过"
  - file: tests/test1.sh
    source: shapelib-1.5.0/tests/test1.sh
    description: "依赖外部 shape_eg_data.zip (dl.maptools.org 不可达), 无法运行, 见 notes.md"
    command: "N/A (EG_DATA 缺失)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "端到端 API 测试: SHPCreate/DBFCreate 写入 3 个带属性的 Point, 重开回读校验坐标与属性"
    command: "./test_shapelib"

# 测试断言总数 (近似值)
assertion_count: 15
