software: shapelib
display: "Shapelib"
description: "Shapelib 是一个用于读写 ESRI Shapefiles 的 C 库"
category: library
homepage: "https://shapelib.maptools.org/"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建系统需要修复 cmake_minimum_required 版本（原版本 2.8.5 不兼容 CMake 4.x）"
    - "config.guess 和 config.sub 需更新以支持 HarmonyOS"
    - "LOCATION 属性在 CMake 4.x 中已废弃，需注释掉相关测试代码"
    - "构建为静态库 libshp.a"
  common_dependencies:
    - cmake

versions:
  "1.5.0":
    status: built
    build_date: "2026-05-26"
    source_url: "https://download.osgeo.org/shapelib/shapelib-1.5.0.tar.gz"
    configure_options:
      - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DBUILD_TEST=OFF"
      - "-DBUILD_SHARED_LIBS=OFF"