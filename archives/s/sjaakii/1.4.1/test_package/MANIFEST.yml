# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制）

package: sjaakii/1.4.1
homepage: "http://www.eglebbk.dds.nl/program/chess-index.html"

# 上游无 ctest/add_test/make check（CMakeLists.txt 零测试注册）；
# 测试面 = 引擎内置 `test movegen` 命令：7 个变体的 perft 参考位点数组
# （src/xboard.cc: perftests/spartan/shogi/xiangqi/seirawan/sittuyin/crazyhouse）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: src/xboard.cc
    source: SjaakII/src/xboard.cc
    description: "引擎内置 test movegen：7 变体 perft 参考计数比对（Release 构建 72 个参考位点：chess 50 + spartan 7 + shogi 3 + xiangqi 3 + seirawan 4 + sittuyin 2 + crazyhouse 3；另有 12 个 #ifdef DEBUGMODE 位点在 WANT_ASSERT=off 下不编译）"
    command: "printf 'test movegen\\nquit\\n' | sjaakii"

test_package_tests:
  - file: test_sjaakii.py
    description: "消费者执行器：stdin 驱动 test movegen，断言 rc=0、无 '*** Failed'、'Ok.' 存在、连续点串=72、banner 含 1.4.1 与 (aarch64)（ARCHSTR 补丁实证）"
    command: "python3 test_sjaakii.py <package bin dir>"

# 上游断言数（perft 参考位点比对，源码注册口径）= 72；test_package 消费者断言 6 项单列不混入
assertion_count: 72
