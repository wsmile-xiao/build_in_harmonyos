# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMakeLists 的 find_library(M_LIB m) 在 musl/HarmonyOS 必落空（数学函数并入 libc），须 if(NOT M_LIB) 置空守卫，否则 generate 阶段 NOTFOUND 硬错"  # knowledge_ref: knowledge/drafts/DRAFT-E722-sjaakii-find-module-plural-static-terminfo.kv
  - "上游自带 FindReadline.cmake 只 set 单数 READLINE_INCLUDE_DIR，而 CMakeLists 消费复数 READLINE_INCLUDE_DIRS —— 非系统前缀（conan 包目录）下 include 路径丢失，readline.h 找不到"  # knowledge_ref: knowledge/drafts/DRAFT-E722-sjaakii-find-module-plural-static-terminfo.kv
  - "静态 libreadline.a 未定义 tgetent/tgetflag/tgoto/tputs/BC/PC/UP，必须并链 ncurses（conan ncurses/6.6 libncursesw.a 经 nm 实证提供 tgetent），否则链接期 undefined reference"  # knowledge_ref: knowledge/drafts/DRAFT-E722-sjaakii-find-module-plural-static-terminfo.kv
  - "CMake 4.x 拒绝 cmake_minimum_required(2.8.12) → tc.cache_variables 设 CMAKE_POLICY_VERSION_MINIMUM=3.5（须 cache_variables，tc.variables 写 toolchain 文件不生效）"  # knowledge_ref: knowledge/drafts/DRAFT-E321-cmake4-policy-version-minimum.kv
  - "上游 WANT_SSE42 option 默认 on 会向 CFLAGS 注入 -msse4.2，aarch64 必须 -DWANT_SSE42=OFF（embree -DEMBREE_ISA_SSE42=OFF 同型先例）"  # knowledge_ref: conanfile.py generate()
  - "上游 --version/--help 走 Unknown option 分支 exit(0)：L2 平台冒烟天然通过，无需 #95 aa3d 式包内补丁"  # knowledge_ref: notes.md 验证结果
  - "ARCHSTR 宏按 __LP64__ 误报 (x86_64)，aarch64 补丁改判 __aarch64__ → (aarch64)（banner 输出正确性，test_package 断言）"  # knowledge_ref: patches/0003-src-xboard.cc.patch

