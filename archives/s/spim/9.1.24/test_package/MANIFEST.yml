# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file to exist

package: spim/9.1.24
homepage: "https://spimsimulator.sourceforge.net/"

# Upstream test command
upstream_check_command: "make test"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests actually run by the spim Makefile
upstream_tests:
  - file: tt.bare.s
    source: spim-9.1.24/Tests/tt.bare.s
    description: "Bare machine tests (no pseudo-ops, delayed branches/loads)"
    command: "./spim -delayed_branches -delayed_loads -noexception -file Tests/tt.bare.s"
  - file: tt.core.s
    source: spim-9.1.24/Tests/tt.core.s
    description: "Core instruction tests"
    command: "./spim -ef CPU/exceptions.s -file Tests/tt.core.s < Tests/tt.in"
  - file: tt.le.s
    source: spim-9.1.24/Tests/tt.le.s
    description: "Little-endian tests"
    command: "./spim -ef CPU/exceptions.s -file Tests/tt.le.s"
  - file: tt.dir.s
    source: spim-9.1.24/Tests/tt.dir.s
    description: "Directive tests"
    command: "./spim -ef CPU/exceptions.s -file Tests/tt.dir.s"

# test_package tests (consumer-perspective verification)
test_package_tests:
  - file: test_hello.s
    description: "Run a simple MIPS program through spim and verify output"
    command: "./spim -ef share/spim/exceptions.s -file test_hello.s"

# Test assertion count (approximate)
assertion_count: 4
