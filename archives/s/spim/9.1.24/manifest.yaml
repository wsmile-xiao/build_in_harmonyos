software: spim
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/9.1.24/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.1.24"

# 构建系统类型
build_system: makefile

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/spim/spim-9.1.24.tar.gz"

  # 源码校验和
  sha256: "e14a9f58a4a1db7df9743908f4770c37bad20a088f9fda96badcf7424f201df8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CXX=clang++"
    - "LDFLAGS=-lm -fuse-ld=/data/service/hnp/bin/ld.bfd"
    - "PREFIX=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-makefile-gnu-ld.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "鸿蒙平台lld链接器依赖libxml2.so.16导致链接失败，使用GNU ld(ld.bfd)替代，fuse-ld=/data/service/hnp/bin/ld.bfd"
  - "spim tarball为嵌套结构（CPU/spim/Tests/Documentation)，需完整解压后在spim子目录中编译"
  - "纯Makefile项目需修改CXX/PREFIX/LDFLAGS三行适配鸿蒙平台"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
