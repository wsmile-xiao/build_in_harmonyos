software: spim
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/9.1.24/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.1.24"

# 构建系统类型
build_system: makefile

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (SourceForge SVN, revision 764 = 9.1.24)
  url: "https://svn.code.sf.net/p/spimsimulator/code"
  revision: "764"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CXX=clang++"
    - "LDFLAGS=-lm -fuse-ld=ld.bfd (resolved via shutil.which at build time)"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁：LDFLAGS 通过 conanfile.py build() 动态传递
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "鸿蒙平台lld链接器依赖libxml2.so.16导致链接失败，使用GNU ld(ld.bfd)替代，通过conanfile.py build()动态传递LDFLAGS"
  - "spim源码从SVN下载，包含CPU/spim/Tests/Documentation嵌套目录，需在spim子目录中编译"
  - "纯Makefile项目通过make命令行参数传递CXX和LDFLAGS适配鸿蒙平台"
