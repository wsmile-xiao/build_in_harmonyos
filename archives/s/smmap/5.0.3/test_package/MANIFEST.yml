# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: smmap/5.0.3
homepage: "https://github.com/gitpython-developers/smmap"

# Upstream test command
upstream_check_command: "pytest"

# conanfile.py build() method - upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: smmap/test/test_pack.py
    source: smmap-5.0.3/smmap/test/test_pack.py
    description: "Upstream pytest suite for smmap pack/encoding"
    command: "pytest smmap/test/test_pack.py"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test_smmap.py
    description: "Import smmap module and verify version string"
    command: "python test_smmap.py"
  - file: conanfile.py
    description: "Conan test_package entrypoint — runs test_smmap.py"

# Test assertion count (approximate, for quality assessment)
assertion_count: 3
