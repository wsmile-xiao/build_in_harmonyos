software: sqawk
version: "0.24.0"
status: built
build_date: "2026-06-09"
build_system: makefile

source:
  url: "https://github.com/dbohdan/sqawk/archive/refs/tags/v0.24.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - tcl/8.6.14
    - tcllib/1.21
    - sqlite3-tcl/3.49.1
  cc: ""
  cxx: ""

patches_applied:
  - "0001-ginstall.patch"

knowledge_gained:
  - "sqawk is a pure Tcl script - 'make sqawk' just assembles sqawk-dev.tcl into sqawk.tcl using tclsh"
  - "Tcl 8.6+ must be installed to build sqawk (needed for tclsh)"
  - "Runtime deps: Tcllib (cmdline, snit, fileutil) and sqlite3-tcl"
  - "HarmonyOS lacks 'install' command; use 'ginstall' from coreutils instead"
