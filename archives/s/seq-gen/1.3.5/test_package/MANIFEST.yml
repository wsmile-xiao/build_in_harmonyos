# test_package/MANIFEST.yml - seq-gen 1.3.5
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。详见 docs/TEST_QUALITY_SPEC.md
#
# 计数口径（唯一口径，贯穿 MANIFEST / notes.md / 测试日志 / PR 两张表）：
#   按「独立检查项数量」计数 —— 每个检查项可单独判定成败、单独打印 ok/FAIL，
#   同一检查项在 build() 与 test_package 各执行一次也只计 1 项。
#   适配后合计 29 项 = 功能补全 20 项（F1-F20）+ 鸿蒙特有 9 项（A1-A9）。

package: seq-gen/1.3.5
homepage: "https://github.com/rambaut/Seq-Gen"

# ── 上游测试套件存在性（经审计官方 tar 包确认）────────────────────
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

upstream_test_audit:
  source_tarball: "v1.3.5.tar.gz (https://github.com/rambaut/Seq-Gen/archive/refs/tags/v1.3.5.tar.gz)"
  source_sha256: "abd03af0239f02786ddfdddf02ce6b655e544e3bdcf864091538735fe1ce58ae"
  upstream_tag_commit: "d52dc23c3b387be5df5ab9a5131150682163b663 (tag v1.3.5)"
  build_system: "手写 source/Makefile（无 configure / 无 CMake / 无 meson；README 只写 cd source && make）"
  scanned_for:
    - "tests/ 或 test/ 目录内的可执行测试"
    - "source/Makefile 中的 check / test 目标"
    - "gtest / criterion / check / CUnit 等 C 测试框架绑定"
    - "*_test.c / test_*.c 命名的测试源文件"
    - "CI 配置（.github/workflows、.travis.yml 等）"
  scan_result: >-
    tarball 共 35 个文件：.gitignore、README.md、manual.md、
    documentation/(Seq-Gen.Manual.html、Using_Seq-Gen_with_PAUP、
    Version_History、icon.gif)、examples/(example.tree、heterogeneity.tree、
    recombinant.tree)、source/(Makefile + 11 个 .c + 10 个 .h + 一个已提交的
    预编译二进制 seq-gen)、test/ZIKV_100.newick.trees。test/ 目录只有 1 个
    3.0 MB 的 Newick 树数据文件，没有任何测试脚本、断言或驱动；
    source/Makefile 的目标只有 dummy/clean/default/all/seq-gen/debug，
    没有 check 或 test 目标；仓库无 CI 配置，无第三方测试框架依赖，
    无 *_test.c / test_*.c 源文件。
  reason: >-
    seq-gen 1.3.5 上游无任何测试框架与测试目标（test/ 仅为数据文件，
    Makefile 无 check/test 目标），按 no_tests 处理；适配后由 test_package
    补全 29 个独立检查项。

# 上游测试命令（无测试套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 中未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ── test_package 自带的功能测试（上游无测试，适配后补全）──────────
# 执行位置: test_package/test_seq_gen.sh（can_run() 为真时在 HarmonyOS 上实跑）
test_package_tests:
  - file: test_seq_gen.sh
    description: >-
      功能补全 20 项（F1-F20），覆盖 seq-gen 全部文档化 CLI 模式，断言值均
      由参数唯一决定（taxa 数、序列长度、字母表、格式头、种子确定性），
      因此同时锁定本平台 libc/libm 的数值与 I/O 行为：
      F1 -h 退出码 0；F2 stderr 含 "Usage: seq-gen" 概要；F3 banner 含
      "Version 1.3.5"；F4 无参数被拒（rc!=0 且 stderr 有 usage 概要，
      防止"无法执行"被误判为"正确拒绝"）；F5 未知模型被拒（rc!=0 且
      stderr 有 "Unknown Model: BOGUS"）；F6 HKY + 4 分类树 → 恰好 4 条
      记录；F7 每条序列长度 == -l 60；F8 核苷酸输出字母表仅 ACGT；
      F9 同一 -z 种子两次输出逐字节相同；F10 不同 -z 种子输出不同；
      F11 PHYLIP(-op) 头为 " 4 60"；F12 PHYLIP 主体每分类一行定宽；
      F13 relaxed PHYLIP(-or) 单空格分隔且长度 60；F14 NEXUS(-on) 首行
      #NEXUS；F15 WAG 氨基酸模型 → 4 条记录且字母表属于
      ARNDCQEGHILKMFPSTWYV；F16 -n 2 → 2 数据集 x 4 分类 = 8 条记录；
      F17 gamma 速率异质 (-a 0.5 -g 4) 仍为 4 x 60；F18 双树文件 →
      2 x 3 分类 = 6 条记录；F19 -of 在可写 cwd 生成 output_1.fasta
      （4 条记录）；F20 -wa 额外输出内部节点祖先序列（记录数 > 4）。
    command: "sh test_seq_gen.sh <bindir>"
    assertion_count: 20

# 鸿蒙特有测试（rule12: N >= 1，本包 N = 9）
# 上游是纯 ISO C（stdio/stdlib/math/time/string/ctype/limits），无任何平台
# ifdef，故本次适配点全部落在工具链 / ABI / 打包层，A1-A9 逐项锁定。
# 执行位置: test_package/ohos_abi_check.py，纯 Python 解析 ELF，不依赖
# readelf，因此交叉编译的开发机与鸿蒙 worker 上都能实跑（本机已实跑 9/9）。
harmonyos_specific_tests:
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A1: 产物为 ELF64 小端且 e_machine == EM_AARCH64(183)，即
      HarmonyOS PC arm64 目标。上游 Makefile 硬编码 CLINKER = cc，该断言
      证明配方注入的 Conan 编译器确实生效（负向对照：宿主 Mach-O 直接 FAIL）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/seq-gen"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A2: PT_INTERP == /lib/ld-musl-aarch64.so.1（鸿蒙 musl 动态
      加载器）；glibc sysroot 产物会是 /lib/ld-linux-aarch64.so.1，在鸿蒙上
      无法加载，故该断言可区分 sysroot 是否真的指向 OHOS。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/seq-gen"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A3: 存在 .note.ohos.ident 且 owner == "OHOS"。该段由 OHOS
      clang/lld 生成，是 knowledge/operations/harmonyos-specifics.md 明确
      记录且不可删除的平台标识段；通用 Linux 工具链不会产出。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/seq-gen"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A4: DT_NEEDED 含未版本化的 musl libc.so，且不含 glibc 风格
      版本化 soname（libc.so.6 / libm.so.6）与任何宿主库。锁定链接目标是
      鸿蒙 musl 而非 glibc 或宿主 sysroot。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/seq-gen"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A5: exp/log/pow/cos/sin 在 .dynsym 中为 UND，同时 DT_NEEDED
      不含版本化 libm。上游 Makefile 链接 -lm，而 OHOS SDK sysroot 只提供
      88 字节的 libm.a 桩、musl 把 libm 折进 libc.so，因此这是鸿蒙上唯一
      可加载的形态；glibc 形态（libm.so.6）会在设备上加载失败。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/seq-gen"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A6: 包内产物不是上游 tarball 里那个已提交的预编译二进制。
      v1.3.5 tarball 的 source/seq-gen 是 Mach-O arm64
      (sha256 a8c0c6eadb39373b...)；断言同时检查魔数与 sha256，证明配方
      在 make 前删除了它并真的为鸿蒙重新链接（否则会打进一个无法在
      HarmonyOS 上执行的外来 ABI 产物）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/seq-gen"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A7: 无 DT_RPATH / DT_RUNPATH。构建机与 conan 缓存路径在鸿蒙
      设备上不存在，泄漏即运行时加载失败（与已合入的 liblqr 0.4.3 同口径）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/seq-gen"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A8: PIE(ET_DYN + DF_1_PIE) + PT_GNU_RELRO + 不可执行
      PT_GNU_STACK(NX) + BIND_NOW 四项同时成立，即 OHOS HNP 对可执行文件的
      加固基线（CI L4 静态安全扫描检查同一组属性）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/seq-gen"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A9: 无 .gnu.version_r 的 GLIBC_* 版本需求，且无 GNU
      .note.ABI-tag。musl/OHOS 产物两者皆无，glibc 链接产物两者皆有，
      是比 soname 更底层的 libc 归属判据。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/seq-gen"
    assertion_count: 1

# 未断言 .codesign 的有无：按 knowledge/operations/harmonyos-specifics.md
# (E077)，配方先 llvm-objcopy --remove-section .codesign 再由
# binary-sign-tool 重新签名，因此该段在具备签名能力的鸿蒙 worker 上存在、
# 在交叉编译的开发机上不存在；任一方向的断言都依赖宿主，不可复现，故不纳入。

# 测试断言总数（独立检查项：功能补全 20 + 鸿蒙特有 9）
assertion_count: 29
test_package_test_count: 20
harmonyos_specific_test_count: 9
count_method: "independent_check_items"
