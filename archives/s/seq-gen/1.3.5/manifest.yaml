software: seq-gen
version: "1.3.5"
status: built
build_date: "2026-09-26"
build_system: makefile

source:
  url: "https://github.com/rambaut/Seq-Gen/archive/refs/tags/v1.3.5.tar.gz"
  sha256: "abd03af0239f02786ddfdddf02ce6b655e544e3bdcf864091538735fe1ce58ae"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Seq-Gen 1.3.5 is pure ISO C (stdio/stdlib/math/time/string/ctype/limits only); no platform ifdef, no configure, no external dependency beyond libm."
  - "source/Makefile hardcodes CLINKER = cc and CFLAGS = -O3 and has no install target; the recipe must inject the Conan compiler and install bin/seq-gen itself."
  - "The upstream tarball ships a prebuilt Mach-O arm64 binary at source/seq-gen; it must be deleted before make, otherwise a foreign-ABI artifact can be packaged."
  - "Upstream has no test suite: test/ holds only the data file ZIKV_100.newick.trees and the Makefile has no test/check target."

verification:
  local_native_host: "make CLINKER=cc CFLAGS='-O2 -Wall -Wextra' -> binary runs, used only to validate the test assertions themselves"
  local_cross: "python3 scripts/ohc-run.py conan-verify seq-gen 1.3.5 --profile ohos-local"
  consumer_test: "test_package/test_seq_gen.sh <bin-dir> (runs on the HarmonyOS worker, gated by can_run())"
  ohos_specific_test: "test_package/ohos_abi_check.py --binary <package>/bin/seq-gen (pure Python ELF inspection, runs on any host)"
