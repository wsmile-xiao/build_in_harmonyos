software: seq-gen
display: "Seq-Gen"
description: "Monte Carlo simulation of molecular sequence evolution along phylogenetic trees"
category: data
homepage: "https://github.com/rambaut/Seq-Gen"
license: "BSD-3-Clause AND GPL-3.0-only"
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 ISO C 单可执行程序, 无 configure / CMake / meson, 无外部依赖(仅 -lm)"
    - "source/Makefile 硬编码 CLINKER = cc 与 CFLAGS = -O3, 且无 install 目标, 配方必须注入 Conan 编译器并自行安装 bin/"
    - "v1.3.5 tarball 内含一个已提交的预编译 Mach-O arm64 二进制 source/seq-gen, 构建前必须删除, 否则可能把外来 ABI 产物打进包"
    - "上游无测试套件(test/ 只有数据文件 ZIKV_100.newick.trees, Makefile 无 check/test 目标), 由 test_package 补全 29 项独立检查"
    - "OHOS musl 把 libm 折进 libc.so(sysroot 只有 88 字节 libm.a 桩), 故产物 DT_NEEDED 仅 libc.so"
    - "命令行工具, 已声明 commands.json (R38)"
  common_dependencies: []

versions:
  "1.3.5":
    status: built
    build_date: "2026-09-26"
    source_url: "https://github.com/rambaut/Seq-Gen/archive/refs/tags/v1.3.5.tar.gz"
