# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: simavr/1.6
homepage: "https://github.com/buserror/simavr"

# 上游测试命令 — simavr 上游无独立 CI 单元测试套件（examples 需
# AVR 目标板/hex 固件），README 构建验证入口为 make（生成 libsimavr）
upstream_check_command: "make"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-20 实测记录）：
# - 上游无独立测试套件（无 make test / ctest / gtest 入口）
# - 构建验证：make 生成 libsimavr.a（静态库）+ include/simavr 头文件
# - 消费者验证（test_package）：编译真实调用 libsimavr API 的 C 程序
#   （avr_make_mcu_by_name/avr_init/avr_terminate）并链接 libsimavr.a +
#   libelf——真实链接（无 --unresolved-symbols=ignore-all），链接失败
#   或无产物即测试失败——实测通过（R34）
upstream_tests: []
