# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: slicot/5.9.1
homepage: "https://github.com/SLICOT/SLICOT-Reference"

# 上游测试命令：CMake 顶层工程启用 SLICOT_TESTING 后注册 examples 的 CTest
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure"

# 上游实际运行的测试程序（examples/ 下 242 个驱动，按族归类）
upstream_tests:
  - file: examples/TAB*.f
    source: SLICOT-Reference-5.9.1/examples/
    description: "Analysis/benchmark 族例程驱动（TAB/TAG），每个对照 examples/results/*.res 校验"
    command: "ctest"
  - file: examples/TB*.f
    source: SLICOT-Reference-5.9.1/examples/
    description: "Benchmark 族例程驱动，真实数值往返"
    command: "ctest"
  - file: examples/TG*.f
    source: SLICOT-Reference-5.9.1/examples/
    description: "Generator 族例程驱动"
    command: "ctest"
  - file: examples/TF/TI/TK/TM/TS/TT/TU*.f
    source: SLICOT-Reference-5.9.1/examples/
    description: "其余各族例程驱动（共 242 个 CTest 目标）"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_slicot.py
    description: "消费者视角：用 flang 把一段真实 Fortran 程序链接到「已打包」的 libslicot.a（+ BLAS/LAPACK/Fortran 运行时闭包）并运行，断言 MA02AD 转置结果的数值正确"
    command: "conan create . (test_package)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 242
