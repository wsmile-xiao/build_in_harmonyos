version: "5.9.1"
software: "slicot"
status: built
build_date: "2026-09-29"
build_system: "cmake"

source:
  url: "https://github.com/SLICOT/SLICOT-Reference/archive/refs/tags/v5.9.1.tar.gz"
  sha256: "37b0c0fc1800454f8d7553a004a5bb6fac9e042fe2b592ce1eec92045ce9b7a1"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DSLICOT_TESTING=ON"
    - "-DCMAKE_Fortran_COMPILER=<flang-ohos>/bin/flang"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY"
    - "-DHAVE_DGEGS/-DHAVE_ZGEGS/-DHAVE_DLAZTM/-DHAVE_ZLAZTM/-DHAVE_DGEGV/-DHAVE_ZGEGV=FALSE"
  dependencies:
    - blas/3.12.1
    - lapack/3.12.1
  cc: clang
  cxx: clang++
  fc: flang-ohos/20.1.0

patches_applied: []

knowledge_gained:
  - "上游用 Check_Fortran_Function_Exists 探测 LAPACK 是否含已移除老例程（dgegv/zgegv/dlatzm/zlatzm/dgegs/zgegs），探测不到才编译自带副本；OHOS 强制 CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY 使探测只编译不链接→误判为存在→不补编→examples 链接报 undefined symbol。显式置 6 个 HAVE_* 为 FALSE 即修复"
  - "Fortran 项目在 OHOS 需 flang-ohos/20.1.0 tool_requires + CMAKE_SYSTEM_NAME=Linux + STATIC_LIBRARY try-compile + 强制 C/C++ 编译器（arpack-ng 先例）"
  - "SLICOT 的 CMake 在顶层工程才启用 SLICOT_TESTING（242 个 examples CTest）——作为子工程会被自动关闭"
  - "OHOS 上 make jobserver FIFO 创建失败，需 CMAKE_BUILD_PARALLEL_LEVEL=1"
