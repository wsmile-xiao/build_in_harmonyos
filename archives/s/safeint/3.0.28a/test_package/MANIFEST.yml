package: safeint/3.0.28a
homepage: "https://github.com/dcleblanc/SafeInt"

upstream_check_command: "cmake --build build --target <11 clang targets> && ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error -R SafeIntTest_clang|safe_math_test_clang"

upstream_tests:
  - file: Test/ClangTest/SafeIntTest_clang
    source: "Test/{Add,Cast,Div,IncDec,Mod,Mult,Sub}Verify.cpp and test vectors"
    description: "Default SafeInt runtime matrix with Clang and int128 support"
    command: "SafeIntTest_clang"
    status: passed
  - file: Test/ClangTest/SafeIntTest_clang_NoIntrinsic
    source: "Same upstream runtime matrix with SAFEINT_USE_INTRINSICS=0 and SAFEINT_HAS_INT128=0"
    description: "Fallback arithmetic implementation runtime test"
    command: "SafeIntTest_clang_NoIntrinsic"
    status: passed
  - file: Test/ClangTest/SafeIntTest_clang_NoInt128
    source: "Same upstream runtime matrix with SAFEINT_HAS_INT128=0"
    description: "Non-int128 arithmetic implementation runtime test"
    command: "SafeIntTest_clang_NoInt128"
    status: passed
  - file: Test/ClangTest/safe_math_test_clang
    source: "Test/c_safe_math plus upstream arithmetic vectors"
    description: "C safe_math casting and arithmetic runtime test"
    command: "safe_math_test_clang"
    status: passed

upstream_compile_checks:
  total: 7
  description: "C++11, C++14, C++17, no-exceptions, C++98 and C safe_math compile targets are all built"

test_package_tests:
  - file: test_safeint.cpp
    description: "C++ consumer test with 10 checked SafeInt API behaviors"
    command: "test_safeint"
  - file: test_safe_math.c
    description: "C consumer test with 8 checked safe_math API behaviors"
    command: "test_safe_math"
  - file: test_safeint_ohos.cpp
    description: "HarmonyOS-specific aarch64, Clang, int128 and overflow-path test with 7 checks"
    command: "test_safeint_ohos"

assertion_count: 25
