software: sxid
display: "sxid"
description: "s[ug]id 文件与目录审计工具：记录属主/属组/模式，按 inode 跟踪目录、按 SHA-256 跟踪普通文件，报告自上次检查以来的新增/移除/变化"
category: tool
homepage: "https://github.com/taem/sxid"
license: GPL-2.0-or-later
build_system: direct

ohos_adaptation:
  key_points:
    - "上游是 autotools 工程（autoconf 2.69，自带 configure），但无测试套件；配方直接用 OHOS clang 编译 6 个 C 源文件，并生成 configure 本会产出的 config.h"
    - "OHOS bionic 提供 getopt_long_only，随包的 GNU getopt 不参与编译；无第三方依赖"
    - "CLI 工具：装 bin/sxid + man1/sxid.1 + 示例 conf/cron，并提供软件级 commands.json"
    - "OHOS/HMDFS 对 S_ISUID/S_ISGID 的语义与 Linux 相反：普通文件无法保存 s 位、目录被强制 SGID（详见 notes.md）"
  common_dependencies: []

versions:
  "4.20130802":
    status: built
    build_date: "2026-09-24"
    conan_ref: "sxid/4.20130802"
