knowledge_gained:
  - "上游自带 autoconf 2.69 的 configure，但 6 个 C 源文件可直接用 clang 编译；只需生成 configure 本会产出的 config.h（VERSION/CONF_FILE/MAIL_PROG/CL_SUBJ/HAVE_STRTOK_R），完全绕开 autoreconf/automake/config.guess"
  - "OHOS bionic 提供 getopt_long_only，无需编译随包的 GNU getopt.c/getopt1.c"
  - "OHOS/HMDFS 上普通文件的 S_ISUID/S_ISGID 位无法保存：chmod(2)/fchmod(2) 返回 0 但位被静默剥离，lstat 永不报告；目录则被强制 SGID（group file_manager）"
  - "因此 sxid 在 OHOS 上永远发现不了 setuid 普通文件，却会把每个子目录都当作 setgid 条目；'禁止路径强制去 s 位' 也无法生效"
  - "CLI 工具产物含 bin/ → 需软件级 commands.json（L0k）"
