# test_package/MANIFEST.yml
# sxid 4.20130802.

package: sxid/4.20130802
homepage: https://github.com/taem/sxid

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream 4.20130802 ships an autotools project with no test suite: there is
  no `make check` target (Makefile.am only defines bin_PROGRAMS and man/doc
  data), no `tests/` directory and no `.sh`/`.py` test scripts. The only
  executables are the installed `sxid` itself and the sample `examples/sxid.cron`.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_sxid.sh
    description: "drives installed bin/sxid: -V/-h, first-run addition of an EXTRA_LIST file, setuid/setgid platform-capability match, log mode 600, recorded SHA-256, SHA-256+inode change on the second run, log rotation, listall, spotcheck"
    command: "sh test_sxid.sh"

test_files:
  - path: "test_package/test_sxid.sh"
    test_type: "R34"
    assertion_count: 12

test_package_test_count: 1
consumer_assertion_count: 12
upstream_test_cases: 0
assertion_count: 12
