software: slowhttptest
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.9.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/shekyan/slowhttptest/archive/refs/tags/v1.9.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-dependency-tracking"
    - "LDFLAGS=-L$HOME/usr/local/lib"
    - "CPPFLAGS=-I$HOME/usr/local/include"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/1.1.1w
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure-tmpdir.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 文件系统不支持 umask 077 创建的子目录中写入文件，需要修改 configure/config.status 的临时目录创建逻辑"
  - "configure/config.status 硬编码使用 ./confXXXXXX 临时目录，需要改为 $TMPDIR/confXXXXXX"
  - "OpenSSL 路径通过 LDFLAGS 和 CPPFLAGS 参数指定"
  - "预编译包需要包含 OpenSSL 动态库（libssl.so.1.1 和 libcrypto.so.1.1）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
