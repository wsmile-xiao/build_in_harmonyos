---
software: sdl3
version: 3.4.8
build_date: "2026-09-20"
build_system: cmake
status: built
compiler: clang
platform: ohos-aarch64

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DSDL_SHARED=ON"
    - "-DSDL_STATIC=OFF"
    - "-DSDL_PTHREADS=ON"
    - "-DSDL_TRAY=OFF"
    - "-DSDL_TESTS=ON"
    - "-DSDL_X11=OFF"
    - "-DSDL_WAYLAND=ON"
    - "-DSDL_KMSDRM=OFF"
    - "-DSDL_RPI=OFF"
    - "-DSDL_ROCKCHIP=OFF"
    - "-DSDL_FRIBIDI=OFF"
    - "-DSDL_LIBTHAI=OFF"
    - "-DSDL_ALSA=OFF"
    - "-DSDL_JACK=OFF"
    - "-DSDL_PIPEWIRE=OFF"
    - "-DSDL_PULSEAUDIO=OFF"
    - "-DSDL_SNDIO=OFF"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"
  dependencies: [wayland/1.24.0, libxkbcommon/1.13.1, libffi/3.4.4, libxml2/2.15.3]
  cc: clang
  cxx: clang++

archive:
  source_url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.8/SDL3-3.4.8.tar.gz
  source_hash: e9fff7467fb60f037e6708da18b25560649e4c63edc2a69bb871b960d9cbfbba

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-include-SDL3-SDL_platform_defines.h.patch"
  - "0003-src-SDL.c.patch"
  - "0004-src-thread-pthread-SDL_systhread.c.patch"
  - "0005-CMakeLists-soname.patch"
  - "0006-CMakeLists-ohos-unix-sources.patch"

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: platform_detection
    platform_only: true
    guard: '__OHOS__'
  - file: 0002-include-SDL3-SDL_platform_defines.h.patch
    type: platform_detection
    platform_only: true
    guard: '__OHOS__'
  - file: 0003-src-SDL.c.patch
    type: platform_exclusion
    platform_only: true
    guard: 'SDL_PLATFORM_OHOS'
  - file: 0004-src-thread-pthread-SDL_systhread.c.patch
    type: libc_probe
    platform_only: true
    guard: '__OHOS__'
  - file: 0005-CMakeLists-soname.patch
    type: build_fix
    platform_only: true
    guard: 'OHOS (CMake variable set by patch 0001)'
  - file: 0006-CMakeLists-ohos-unix-sources.patch
    type: platform_detection
    platform_only: true
    guard: 'OHOS (CMake variable set by patch 0001)'

knowledge_gained:
  - "HarmonyOS 需要 cmake 检测 OHOS 平台：set(OHOS true) + add_definitions(-D__OHOS__)"
  - "SDL3 需要定义 SDL_PLATFORM_OHOS 并取消 SDL_PLATFORM_LINUX（避免错误识别为 Linux）"
  - "HarmonyOS pthread 实现不完整：禁用 pthread_setcanceltype（线程取消功能）"
  - "HarmonyOS 无 Gtk 支持：禁用 SDL_TRAY 并排除 SDL_Gtk_Quit 调用"
  - "CMake 不识别 HarmonyOS 平台时 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 为空，共享库无 SONAME/版本号；配方注入 -Wl,-soname, 修复（sdl2-compat 依赖 dlopen libSDL3.so.0）"
  - "OHOS musl pthread_rwlock 无写者排队公平性：testrwlock 饱和读锁模式下 writer 永久饥饿（glibc/macOS/Windows 均有写者救济）；SDL_RWLock API 不承诺写者优先，ctest 排除并记录技术原因"
  - "CMake 对 HarmonyOS 判定 UNIX 为假：if(UNIX) 门控下的 src/core/unix/*（SDL_poll.c/SDL_appid.c）与 src/dialog/unix/SDL_zenitymessagebox.c 整批漏编；Wayland 后端引用其中 SDL_IOReady/SDL_GetAppID/SDL_Zenity_ShowMessageBox，静态库不报、shared 链接直接 undefined symbol"

quality:
  g0_clean_build: pass
  g1_binary_integrity: pass
  g2_functional: pass
  g3_portability: pass
  g4_archive_complete: pass
