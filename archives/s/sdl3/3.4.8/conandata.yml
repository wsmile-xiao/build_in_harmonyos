# conandata.yml — sdl3 3.4.8

sources:
  url: "https://github.com/libsdl-org/SDL/releases/download/release-3.4.8/SDL3-3.4.8.tar.gz"
  sha256: "e9fff7467fb60f037e6708da18b25560649e4c63edc2a69bb871b960d9cbfbba"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Add HarmonyOS platform detection to CMakeLists.txt"
    patch_type: "portability"
  - patch_file: "patches/0002-include-SDL3-SDL_platform_defines.h.patch"
    patch_description: "Define SDL_PLATFORM_OHOS and undefine SDL_PLATFORM_LINUX for HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0003-src-SDL.c.patch"
    patch_description: "Exclude SDL_Gtk_Quit on HarmonyOS (no Gtk support)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-thread-pthread-SDL_systhread.c.patch"
    patch_description: "Guard pthread_setcanceltype with __OHOS__ for HarmonyOS compatibility"
    patch_type: "portability"
  - patch_file: "patches/0005-CMakeLists-soname.patch"
    patch_description: "Set SOVERSION on SDL3-shared for HarmonyOS so libSDL3.so.0 SONAME is produced"
    patch_type: "portability"
  - patch_file: "patches/0006-CMakeLists-ohos-unix-sources.patch"
    patch_description: "Include the Unix core and dialog sources on HarmonyOS so the Wayland backend links (SDL_IOReady/SDL_GetAppID/SDL_Zenity_ShowMessageBox)"
    patch_type: "portability"
