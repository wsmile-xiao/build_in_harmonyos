# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sdl3/3.4.8
homepage: "https://www.libsdl.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N (SDL_TESTS=ON registers SDL_NONINTERACTIVE-marked programs)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --timeout 180 -E '^testrwlock$' (dummy drivers injected via upstream TESTS_ENVIRONMENT)"

# 上游测试清点: test/ 目录 94 个 add_sdl_test_executable 程序（其中 pretest 为
# WIN32+32bit-only 条件 fixture，OHOS 构建实际创建 93 个），CTest 注册非交互
# 25 个条目（23 个 SDL_NONINTERACTIVE 程序 + 2 个 no-simd 变体），全部编译，
# 运行 24 个（1 个排除，见 upstream_test_note）。
upstream_total_programs: 94
upstream_built_count: 93
upstream_case_count: 25
upstream_pass_count: 24
upstream_skipped_count: 1
upstream_test_note: "testrwlock excluded: OHOS musl pthread_rwlock has no writer-queue fairness (a waiting writer does not block new readers); under testrwlock's saturated reader pattern (6 readers holding the lock 1000ms with 10ms gaps) the writer thread starves forever and the test deadlocks. Verified by direct experiment: a bare pthread_rwlock probe acquires a write lock normally, and testrwlock --nbthreads 1 (unsaturated) passes, so this is a libc fairness difference vs glibc/macOS/Windows, not an SDL logic defect. The SDL_RWLock API does not promise writer priority. The remaining 24 tests passed: testaudioinfo, testautomation, testautomation-no-simd, testatomic, testbounds, testdisplayinfo, testerror, testevdev, testfile, testfilesystem, testkeys, testlocale, testplatform, testplatform-no-simd, testpower, testprocess, testqsort, testsem, testsymbols, testthread, testtimer, testver, testyuv, torturethread."

upstream_tests:
  - {file: test/testautomation.c, command: "./testautomation", description: "SDL API automated test suite (SDL_NONINTERACTIVE, 120s)"}
  - {file: test/testatomic.c, command: "./testatomic --no-threads", description: "Atomic operations"}
  - {file: test/testerror.c, command: "./testerror --no-threads", description: "Threaded error state"}
  - {file: test/testsymbols.c, command: "./testsymbols 0 10 20 40 80 160 320 640", description: "Public symbol link check"}
  - {file: test/testevdev.c, command: "./testevdev", description: "evdev keyboard classification (BUILD_DEPENDENT)"}
  - {file: test/testfile.c, command: "./testfile", description: "RWops file operations"}
  - {file: test/testthread.c, command: "./testthread", description: "Thread lifecycle and naming (40s)"}
  - {file: test/testlocale.c, command: "./testlocale", description: "Locale detection"}
  - {file: test/testplatform.c, command: "./testplatform", description: "Platform, byte order, CPU info"}
  - {file: test/testpower.c, command: "./testpower", description: "Power supply info"}
  - {file: test/testfilesystem.c, command: "./testfilesystem", description: "Filesystem paths"}
  - {file: test/testsem.c, command: "./testsem --no-threads 10", description: "Semaphore contention"}
  - {file: test/testtimer.c, command: "./testtimer --no-interactive", description: "Timer callbacks"}
  - {file: test/testver.c, command: "./testver", description: "Compile-time vs runtime version"}
  - {file: test/testyuv.c, command: "./testyuv --automated", description: "YUV conversion"}
  - {file: test/testautomation.c, command: "./testautomation-no-simd", description: "SDL API automated suite with SIMD disabled (SDL_CPU_FEATURE_MASK=-all)"}
  - {file: test/testplatform.c, command: "./testplatform-no-simd", description: "Platform/CPU info with SIMD disabled"}
  - {file: test/torturethread.c, command: "./torturethread", description: "Nested thread create/destroy"}
  - {file: test/testqsort.c, command: "./testqsort", description: "SDL_qsort"}
  - {file: test/testbounds.c, command: "./testbounds", description: "Display bounds"}
  - {file: test/testprocess.c, command: "./testprocess", description: "Process spawn (uses childprocess fixture)"}
  - {file: test/testkeys.c, command: "./testkeys", description: "Keycode names"}
  - {file: test/testaudioinfo.c, command: "./testaudioinfo", description: "Audio device info (dummy driver)"}
  - {file: test/testdisplayinfo.c, command: "./testdisplayinfo", description: "Display info (dummy driver)"}

unattended_exclusions:
  musl_rwlock_writer_starvation: [testrwlock]
  interactive_window_input: [checkkeys, testmouse, testoverlay, testpopup, testrendercopyex, testrendertarget, testrotate, testscale, testviewport, testwm, testmessage, testcustomcursor, testgeometry, testdraw, testdrawchessboard, testintersections, testrelative, testhittesting]
  needs_display_or_audio_device: [testmultiaudio, testaudiohotplug, testcamera, testsensor, testcontroller, testime, testiconv]
  opengl_gpu: [testgl, testgles, testshader, testvulkan, testoffscreen]
  requires_user_interaction: [testdialog, testclipboard, testurl, testnative, testdlopennote]

test_package_tests:
  - file: test.c
    description: "Consumer test: runtime SDL_GetVersion() must match packaged SDL_VERSION headers; SDL_InitSubSystem(SDL_INIT_EVENTS)/SDL_QuitSubSystem cycle; SDL_GetPlatform sanity"
    command: "./test_sdl3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 26
