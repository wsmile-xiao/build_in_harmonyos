software: scip
# 版本级 manifest 模板
# 文件位置: archives/s/scip/10.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "10.0.2"

# 编译状态
status: built

build_system: cmake

build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/scipopt/scip/archive/refs/tags/v10.0.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DAUTOBUILD=ON"
    - "-DSHARED=OFF"
    - "-DZIMPL=OFF"
    - "-DPAPILO=OFF"
    - "-DAMPL=OFF"
    - "-DIPOPT=OFF"
    - "-DREADLINE=OFF"
  dependencies:
    - zlib/1.3.1
    - gmp/6.3.0
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained: []
