patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Detect HarmonyOS/OHOS in config.guess and map __OHOS__ libc to linux-ohos triplet (E007)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Accept aarch64-linux-ohos / ohos-linux triplets in config.sub (E007)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "Fix umask 077 to 022 for HMDFS (E011) and add CONFIG_SHELL fallback to bash when profile path is invalid"
    patch_type: "portability"
  - patch_file: "patches/0004-fno-common-program-name.patch"
    patch_description: "Declare program_name extern in src/*-opts.h; tentative definition was emitted by both the tool .c and *-opts.c, and clang 15 / GCC 10+ default -fno-common turns it into a duplicate symbol (same fix as BLFS sharutils-4.15.2)"
    patch_type: "portability"
