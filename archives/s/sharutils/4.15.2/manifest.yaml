# manifest.yaml — sharutils 4.15.2 版本级编译元数据
# 文件位置: archives/s/sharutils/4.15.2/manifest.yaml
# 遵循 templates/manifest-version.yaml (ARCHIVE-SPEC v2.0)

software: "sharutils"
version: "4.15.2"
status: built
build_date: "2026-09-16"
build_system: "autotools"

source:
  url: "https://ftpmirror.gnu.org/gnu/sharutils/sharutils-4.15.2.tar.xz"
  sha256: "2b05cff7de5d7b646dc1669bc36c35fdac02ac6ae4b6c19cb3340d87ec553a9a"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "SHELL=<bash> (CONFIG_SHELL, 回退到 /data/service/hnp/bin/bash; OHOS 无 /bin/sh)"
    - "gl_cv_have_weak=no (OHOS musl 无 pthread_cancel, 关闭 gnulib 弱符号路径)"
    - "CFLAGS 追加 -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion (clang 15 兼容 2015 年旧代码)"
    - "make -j1 (单作业; HMDFS jobserver fifo 受限)"
    - "makeinfo 缺失时 MAKEINFO=true, 仅跳过 doc/sharutils.info 重建, 6 个 TESTS 照常执行"
  dependencies: []
  cc: clang

patches_applied:
  - "patches/0001-config.guess.patch"
  - "patches/0002-config.sub.patch"
  - "patches/0003-configure.patch"
  - "patches/0004-fno-common-program-name.patch"

knowledge_gained:
  - "config.guess/config.sub 需识别 HarmonyOS/OHOS 并映射到 linux-ohos 三元组 (E007)"
  - "2015 年旧代码在 clang 15 下隐式函数声明与整型转换为 error, 需降级为警告"
  - "gnulib USE_POSIX_THREADS_WEAK 在 OHOS musl 上误触发, 需预设 gl_cv_have_weak=no 并清理生成 config.h 中的残留定义"
  - "src/*-opts.h 的 program_name 暂定定义在 -fno-common (clang 15 / GCC 10+ 默认) 下产生重复符号, 需加 extern"
  - "上游 6 个 automake TESTS 须在配方 build() 内以 make check -j1 真实执行, 解析 tests/test-suite.log 的 # TOTAL/# PASS/# FAIL 汇总行产生证据标记"
  - "HMDFS 上 chmod 为静默 no-op 且各 TESTS 对创建模式断言冲突 (uutest-1 需 0664, shar-1 需 0644), 只能用各自脚本内的作用域 umask, 不能用单一全局 umask"
