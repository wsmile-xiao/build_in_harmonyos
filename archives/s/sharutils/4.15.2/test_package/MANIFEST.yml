# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (ci/conan/build_and_test.sh L0e) 强制要求此文件存在

package: sharutils/4.15.2
homepage: "https://www.gnu.org/software/sharutils/"

# 上游 automake 测试套件: tests/Makefile.am 声明
#   TESTS = uutest-1 uudecode-2 shar-1 shar-2 shar-3 shar-4
# 共 6 个 shell 脚本测试。配方 build() 在真机按此命令真实执行,
# 并解析 tests/test-suite.log 的 # TOTAL/# PASS/# FAIL/# SKIP 汇总行
# (兼顾 XFAIL/XPASS/ERROR) 产生 HMBS_UPSTREAM_TEST_RESULT 标记。
upstream_check_command: "make check -j1"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游注册总数与统计口径 (与 tests/Makefile.am 的 TESTS 声明一致,
# 非本次可运行子集; 审查 rule4 少报核验依据)。
upstream_test_total: 6
upstream_test_count_method: autotools_tests

# 上游实际运行的测试程序 (make check, 6 TESTS)
upstream_tests:
  - file: tests/shar-1
    source: sharutils-4.15.2/tests/shar-1
    description: "shar -f/--basename 选项剥离旧文件名引用, 生成归档与 shar-1.ok (3727 字节) 逐字节比对"
    command: "make check -j1"
  - file: tests/shar-2
    source: sharutils-4.15.2/tests/shar-2
    description: "多文件含子目录 (one/two) 的 shar 打包, 经 unshar (--debug) 解包后内容比对"
    command: "make check -j1"
  - file: tests/shar-3
    source: sharutils-4.15.2/tests/shar-3
    description: "基于 TMPDIR 临时目录的 shar 打包/解包功能测试"
    command: "make check -j1"
  - file: tests/shar-4
    source: sharutils-4.15.2/tests/shar-4
    description: "uuencode --base64 --encode-file-name 编码后经 uudecode 解码比对"
    command: "make check -j1"
  - file: tests/uutest-1
    source: sharutils-4.15.2/tests/uutest-1
    description: "uudecode 循环解码 tests/testdata (381 字节) 基准向量"
    command: "make check -j1"
  - file: tests/uudecode-2
    source: sharutils-4.15.2/tests/uudecode-2
    description: "uudecode 功能测试 (mktemp 临时目录, base.txt/all.txt diff 比对)"
    command: "make check -j1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sharutils.sh
    description: "打包后 uuencode/uudecode 往返与 shar/unshar 往返, 非空负载逐字节 cmp + 内容 grep, 共 2 个断言"
    command: "./test_sharutils.sh <pkg>/bin"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2

# 审计说明：上游测试存在且已在真机完整执行。
upstream_tests_exist: true
upstream_test_audit: >
  检查范围：sharutils-4.15.2 官方 tarball (ftpmirror.gnu.org,
  sha256 见 conandata.yml)。上游测试位于 tests/, 由 tests/Makefile.am
  的 TESTS 变量声明 (uutest-1 uudecode-2 shar-1 shar-2 shar-3 shar-4,
  共 6 个 shell 脚本), EXTRA_DIST 另含参照文件 tests/shar-1.ok (3727 字节)
  与 tests/testdata (381 字节), 均为非空。配方 build() 在真机执行
  make check -j1, 解析 tests/test-suite.log 的 automake 汇总行
  (# TOTAL/# PASS/# FAIL/# SKIP, 兼顾 XPASS/ERROR) 产生
  HMBS_UPSTREAM_TEST_RESULT 标记；执行数为 0 时直接失败, 不计为通过。
  结论：上游存在测试, 已在真机 build() 阶段真实完整执行。
