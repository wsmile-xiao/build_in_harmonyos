software: stk
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.0.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/thestk/stk/archive/refs/tags/5.0.1.tar.gz"

  # 源码校验和
  sha256: "1dd1a5063efa43d4bc9792d1394b395672fb2222cdb0e56c7c8e3f6db22ece86"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-realtime"
    - "--enable-shared"
    - "RAWWAVE_PATH=/storage/Users/currentUser/usr/local/share/stk/rawwaves"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libm/system"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E105: stk --disable-realtime 禁用 ALSA/PulseAudio/JACK 音频 API（鸿蒙平台无这些库）"
  - "stk 的 install 目标默认只安装共享库，需手动安装 libstk.a 静态库"
  - "stk 需要 RAWWAVE_PATH 设置为安装路径下的 share/stk/rawwaves，否则运行时找不到波形数据"
  - "stk 的 demo/effects/ragamatic 项目依赖 realtime 音频功能，--disable-realtime 时无法编译"
  - "stk 无 make check 目标，无测试套"

knowledge_refs:
  - E081

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/stk-5.0.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/stk-5.0.1.work
  source_orig_hash: 86c0918be4077d1a
  source_work_hash: a4de590594652115
  generated_at: '2026-06-03T15:09:03'
  patches_count: 2

patch_classification:
  - file: 0001-config-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
