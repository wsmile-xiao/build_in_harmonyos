# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS HMDFS 文件系统大小写不敏感：可执行目标名 linuxpba 与源码目录 LinuxPBA 路径冲突，需重命名产物（sedutil-pba）"
  - "OHOS 无 /bin/bash，脚本 shebang 需用 /bin/sh"
  - "OHOS SDK lld 依赖配套 libxml2，LD_LIBRARY_PATH 需前置 llvm/lib 避免被 usr/local/lib 的同名库抢占"
  - "HMDFS 新建子目录继承父目录属主，umask 077 会导致 config.status 无法写入，构建目录需放属主为当前用户的路径"
  - "系统 usr/local/include/sha1.h 会遮蔽项目内同名头文件，include 用相对路径规避"
  - "GitHub archive tarball 不含 autoreconf 生成的 configure，需在配方 build() 内用 aclocal→autoconf→autoheader→automake 直跑链生成"
  - "autoconf 不可作为 tool_requires 引入（其 conan perl 依赖链会污染系统 perl 致 autoconf 自身 Cwd.pm 加载失败），应使用系统 hnp/bin 的 autoconf，仅 tool_requires automake"
  - "sedutil 的 Makefile.am 假定 in-source 构建，conan 配方需设 folders.build='.' 强制 in-source"
  - "refresh-patch 无编辑追踪器时走 fallback 扫描会把 autoreconf 构建产物也生成补丁，需先 track-edit snapshot 基线+track 源码修改后精准生成"

