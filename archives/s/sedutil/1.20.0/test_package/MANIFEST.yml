# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sedutil/1.20.0
homepage: "https://github.com/Drive-Trust-Alliance/sedutil"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "sedutil-cli --validatePBKDF2"

# 上游实际运行的测试程序
upstream_tests:
  - file: linux/TestSuite.sh
    source: sedutil-1.20.0/linux/TestSuite.sh
    description: "端到端磁盘测试套件，需真实 SED 磁盘 + root 权限（破坏性测试，OHOS 平台不可运行）"
    command: "linux/TestSuite.sh <device>"
  - file: Common/DtaHashPwd.cpp
    source: sedutil-1.20.0/Common/DtaHashPwd.cpp
    description: "PBKDF2 验证套件（4 组 RFC 6070 测试向量），通过 sedutil-cli --validatePBKDF2 执行，实测 4/4 通过"
    command: "./sedutil-cli --validatePBKDF2"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者 smoke test：运行 sedutil-cli --scan"
    command: "./sedutil-cli --scan"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
