# conandata.yml — sedutil 1.20.0

sources:
  url: "https://github.com/Drive-Trust-Alliance/sedutil/archive/refs/tags/1.20.0.tar.gz"
  sha256: "88016b93cbbef98fa6f5c4e6f58e6c871662b6a7f1fc8dc788c8599fa37a44f3"

patches:
  - patch_file: "patches/0001-Common-DtaHashPwd.cpp.patch"
    patch_description: "Include pbkdf2/sha1.h via relative path to avoid shadowing by system sha1.h"
    patch_type: "portability"
  - patch_file: "patches/0002-Makefile.am.patch"
    patch_description: "Rename linuxpba binary to sedutil-pba (HMDFS case-insensitive filesystem conflicts with LinuxPBA source dir)"
    patch_type: "portability"
  - patch_file: "patches/0003-linux-DtaDevLinuxNvme.h.patch"
    patch_description: "Include linux/nvme_ioctl.h directly (drop linux/version.h version gating and legacy linux/nvme.h path)"
    patch_type: "portability"
  - patch_file: "patches/0004-linux-GitVersion.sh.patch"
    patch_description: "Change shebang from /bin/bash to /bin/sh (OHOS has no /bin/bash)"
    patch_type: "portability"
