software: sedutil
display: "sedutil"
description: "CLI tool to manage self encrypting drives conforming to TCG OPAL 2.0"
category: system
homepage: "https://github.com/Drive-Trust-Alliance/sedutil"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "产物名 linuxpba 与源码目录 LinuxPBA 在 HMDFS 大小写不敏感文件系统下路径冲突，改名 sedutil-pba"
    - "OHOS 无 /bin/bash，GitVersion.sh shebang 改 /bin/sh"
    - "OHOS sysroot 内核 UAPI 提供 nvme_ioctl.h（内核5.10>=4.4），直接 include 去掉 version.h 版本判断与旧 nvme.h 路径"
    - "系统 usr/local/include/sha1.h 遮蔽项目内 cifra sha1.h，改相对路径 pbkdf2/sha1.h 规避"
  common_dependencies: []

versions:
  "1.20.0":
    status: built
    build_date: "2026-09-29"
