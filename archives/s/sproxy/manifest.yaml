# Software-level manifest for sproxy
# Location: archives/s/sproxy/manifest.yaml

software: sproxy
display: "sproxy"
description: "记录经过它的 HTTP 请求 URL 为 Siege urls.txt 格式的 Perl 代理"
category: network
homepage: "https://www.joedog.org/"
license: GPL-2.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Perl 脚本（src/sproxy.in + 自带纯 Perl 模块 JoeDog::Config），无 C/C++ 编译；上游 autotools 只做 %_VAR% sed 替换与拷贝"
    - "configure 的 perl 模块探测（$PERL utils/modtest）需在构建机执行目标 perl，交叉构建（x86 构建机 + aarch64 perl）下不可行，配方以 Python 等价替换，构建机无需 autoconf/automake/libtool"
    - "OHOS 无 /usr/bin/perl 且不允许 #!/usr/bin/env perl，shebang 重写为 perl 依赖包的绝对路径"
    - "运行时依赖 perl/5.42.2.3；perl 不带 libwww-perl 栈，包自包含（上游自带 libwww-perl 5.76 + CPAN URI 5.35 装到 lib/sproxy，sproxy.in 插入 parse_head(0)）"
  common_dependencies:
    - perl

versions:
  "1.02":
    status: built
    build_date: "2026-09-29"
