knowledge_gained:
  - "上游为 autotools 包装的纯 Perl 脚本（src/sproxy.in + 自带 JoeDog::Config），configure/Makefile 仅做 %_VAR% sed 替换与拷贝、无编译；配方在 build() 以 Python 等价实现，构建机无需 autoconf/automake/libtool"
  - "上游 configure 用 $PERL utils/modtest 探测 perl 模块——交叉构建时需在构建机执行目标 perl（aarch64 perl 于 x86 构建机），无法运行，探测结果为空会导致自带模块不被安装；因此绕过 configure，直接从 lib/JoeDog-Config-1.2.tar.gz 取出 Config.pm"
  - "依赖 perl 与设备系统 perl 都不带 libwww-perl 栈：包自包含，装上游自带 libwww-perl 5.76（纯 Perl）+ CPAN URI 5.35 到 lib/sproxy；对 sproxy.in 插入 $ua->parse_head(0) 以免依赖 HTML::Parser(XS)"
  - "OHOS 无 /usr/bin/perl 且不允许 #!/usr/bin/env perl，shebang 重写为 perl 依赖包绝对路径"
upstream_test_pass_rate: "N/A（上游 1.02 无任何测试：无 tests/ 目录、无 check 目标；见 notes.md 清点）"
adapted_test_pass_rate: "100%（test_package 10 断言）——见 notes.md 验证记录"
test_command: "conan create . --build=missing"
