# test_package/MANIFEST.yml — sproxy 1.02
package: sproxy/1.02
homepage: "https://www.joedog.org/"

# 上游 1.02 源码包无任何自动化测试：无 tests/ 目录、Makefile.am 无 check 目标、
# 无 ctest/pytest 注册（清点：find -name 'test*' 仅得 utils/modtest —— configure
# 用的 perl 模块探测脚本，非测试）。故上游用例 N=0，由 test_package 补真实功能测试。
upstream_check_command: "(none: no check/test target in Makefile.am)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_sproxy.py
    description: >-
      真实消费者测试（rule12 鸿蒙特有测试 1 条）：拿已安装包的 bin/sproxy
      （Perl 脚本，shebang 已重写为 perl 依赖路径；默认 etc/sproxy.conf；包内
      lib/sproxy/JoeDog/Config.pm）真实启动为 HTTP 代理，经代理向本地 origin 服务器
      发 GET 与 POST，断言：LWP/HTTP::Daemon/HTTP::Request/URI/JoeDog::Config 均解析自包内 lib/sproxy、
      -V/-h 输出含替换后的版本号、shebang 无占位符、代理正常监听、GET/POST 响应与
      origin 一致、HTML::* 不可加载时 text/html 仍被转发（parse_head 已关）、origin 确实
      收到请求、sproxy 输出文件写入 siege 格式 URL 行（`<url>` 与 `<url> POST a=1&b=2`）。
    command: "python3 test_sproxy.py <package-folder> <work-dir>"

# 测试断言总数：10（模块来源、-V、-h、shebang、监听、GET、POST、HTML、origin 收到、URL 日志）
assertion_count: 10
