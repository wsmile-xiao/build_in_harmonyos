# test_package/MANIFEST.yml - shed 1.16
# Upstream ships no test suite: no tests/ directory, and the automake
# `check` target registers no TESTS/check_PROGRAMS ("Nothing to be done").

package: "shed/1.16"
homepage: "https://sourceforge.net/projects/shed/"

upstream_check_command: "make check (automake target without TESTS/check_PROGRAMS: Nothing to be done for 'check')"
# build() runs `make check` anyway (R51); it registers no tests, hence the empty list.
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []

test_package_tests:
  - file: "test_shed_consumer.c"
    description: >-
      5 consumer cases, 26 assertions, driving the packaged bin/shed: command
      line contract (--version "(lfs)", --help, missing file, two operands),
      24x80 vt100 screen render of a 16-byte file, hex-column and ascii
      search, jump + hex edit written through to the file on disk, and the
      dump command output parsed back line by line.
    command: "./test_shed_consumer <package>/bin/shed <scratch-dir>"
  - file: "test_shed_ohos.c"
    description: >-
      2 HarmonyOS-specific cases, 11 assertions: `producer | shed` with stdin
      on a pipe and keys on a pseudo tty. OHOS musl tmpfile() is hard-wired
      to /data/local/tmp, so the buffer must be created in $TMPDIR
      (patches/0001): all piped bytes rendered, buffer anonymous and cleaned
      up, and a missing $TMPDIR reported as "tmpfile() failed (No such file
      or directory)".
    command: "./test_shed_ohos <package>/bin/shed <scratch-dir>"

test_case_count: 7
harmonyos_specific_test_count: 2
assertion_count: 37
