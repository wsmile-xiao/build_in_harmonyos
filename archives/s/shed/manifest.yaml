software: shed
display: "shed"
description: "Simple Hex EDitor: full-screen ncurses hex editor with a pico-like interface"
category: utility
homepage: "https://sourceforge.net/projects/shed/"
license: "GPL-2.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "OHOS musl 的 tmpfile() 写死 /data/local/tmp/tmpfile_XXXXXX(NDK libc.a 字符串, E272 设备实测) 且不读 TMPDIR，管道输入模式改为 $TMPDIR 下 mkstemp+unlink(补丁 0001)"
    - "configure.ac 无 AC_CANONICAL_HOST: 只传 --host=aarch64-linux-ohos 让 configure 自行探测, 不调用 config.sub"
    - "ncurses/6.6 只有静态宽字符库, terminfo 在依赖包内: 以 run=True 依赖, 由 conanrun 导出 TERMINFO"
    - "ncurses 以 root(uid 0)运行时忽略 TERMINFO(x86 qemu 实测复现), 需以普通用户运行(知识草稿 E429-draft-5ED1)"
    - "SDK 链接器写入的 .codesign 不被加载器认可, package() 对 bin/shed 重新自签"
    - "上游无测试套件, 由 test_package 补全 7 个消费者用例(37 条断言, 含 2 个鸿蒙特有用例)"
    - "命令行工具, 已声明 commands.json (R38)"
  common_dependencies:
    - ncurses

versions:
  "1.16":
    status: built
    build_date: "2026-09-28"
    source_url: "https://downloads.sourceforge.net/project/shed/shed/shed%201.16/shed-1.16.tar.gz"
