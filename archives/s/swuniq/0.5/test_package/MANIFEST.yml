package: swuniq/0.5
homepage: "https://github.com/mterron/swuniq"
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check (cross-built static binary; qemu-aarch64/binfmt on x86 runner)"
upstream_tests:
  - file: Makefile
    source: swuniq-0.5/Makefile
    description: "重复 1..10 输入、-w 10 时输出行数为 10"
    command: "make check"
test_package_tests:
  - file: test.c
    description: "OHOS aarch64 ELF 校验与管道窗口去重（-w 2 / 默认）"
    command: "test_swuniq <package>/bin/swuniq"
assertion_count: 4
