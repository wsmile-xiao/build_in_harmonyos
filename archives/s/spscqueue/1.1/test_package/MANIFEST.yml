# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: spscqueue/1.1
homepage: "https://github.com/rigtorp/SPSCQueue"

# 上游测试命令（header-only CMake INTERFACE 库，使用 ctest）
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/SPSCQueueTest.cpp
    source: SPSCQueue-1.1/src/SPSCQueueTest.cpp
    description: "上游唯一测试程序（SPSCQueueTest）：断言 7 组功能（基础 FIFO、copyable、copyable-noexcept、movable、capacity<1、padding overflow、fuzz/性能），全量通过"
    command: "./SPSCQueueTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_spscqueue.cpp
    description: "消费者验证：真实调用 SPSCQueue<T> 的 push/pop/front/emplace，含单生产者单消费者多线程路径"
    command: "./test_spscqueue"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14