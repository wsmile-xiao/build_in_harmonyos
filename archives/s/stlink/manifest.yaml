software: stlink
display: "stlink"
description: "STM32 ST-LINK调试/烧写工具集（st-flash / st-info / st-util / st-trace）"
category: embedded
homepage: "https://github.com/stlink-org/stlink"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 不识别 HarmonyOS (E092)，设 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64 使 UNIX 安装规则生效"
    - "上游 Findlibusb.cmake 用 LIBUSB_INCLUDE_DIR/LIBUSB_LIBRARY cache 变量（单数），需从 libusb Conan 依赖显式解析"
    - "上游 udev/modprobe 配置默认安装到绝对路径 /etc 与 /lib，以 STLINK_MODPROBED_DIR/STLINK_UDEV_RULES_DIR cache 变量重定向到包内"
    - "鸿蒙要求 ELF 签名：libstlink.so 与 bin/ 下 4 个工具需 binary-sign-tool 签名 (SHA256withECDSA)"
    - "clang 15 将 size_t→uint32_t 窄化视为硬错误，需显式强转（5 个补丁）"
  common_dependencies:
    - libusb

versions:
  "1.8.0":
    status: built
    build_date: "2026-08-15"
    conan_ref: "stlink/1.8.0"
