# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: stlink/1.8.0
homepage: "https://github.com/stlink-org/stlink"

# 上游测试命令: stlink 是 CMake 项目，tests/CMakeLists.txt 注册了
# test-usb / test-sg / test-flash 三个 ctest 入口。
# - test-flash: flash_opts 纯逻辑解析测试，无需硬件，可运行
# - test-usb / test-sg: 需要物理 ST-LINK USB 适配器 (stlink_open_usb())，
#   沙箱无 USB 设备，属平台限制（E051 类），不可运行
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/flash.c
    source: stlink-1.8.0/tests/flash.c
    description: "flash_opts 命令行解析纯逻辑测试（无硬件依赖，可运行）"
    command: "./bin/test-flash"
  - file: tests/usb.c
    source: stlink-1.8.0/tests/usb.c
    description: "USB 探测/复位测试，需要物理 ST-LINK 适配器（平台限制，不可运行）"
    command: "./bin/test-usb --reset"
  - file: tests/sg.c
    source: stlink-1.8.0/tests/sg.c
    description: "SG（SCSI generic）传输测试，需要物理 ST-LINK 适配器（平台限制，不可运行）"
    command: "./bin/test-sg"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libstlink 调用 stlink_parse_ihex() 解析真实 Intel HEX 数据并断言字节，另运行 st-info --version 冒烟"
    command: "./test_stlink"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
