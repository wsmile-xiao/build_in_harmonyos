# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.8.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.0"

# 软件名
software: "stlink"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-15"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/stlink-org/stlink/archive/refs/tags/v1.8.0.tar.gz"

  # 源码校验和 (下载后 sha256sum 实际核对)
  sha256: "cff760b5c212c2cc480f705b9ca7f3828d6b9c267950c6a547002cd0a1f5f6ac"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libusb/1.0.27"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-cmake-modules-c_flags.cmake.patch"
  - "0002-src-st-util-gdb-remote.c.patch"
  - "0003-src-stlink-lib-chipid.c.patch"
  - "0004-src-stlink-lib-common.c.patch"
  - "0005-src-stlink-lib-flash_loader.c.patch"
  - "0006-src-stlink-lib-map_file.c.patch"
  - "0007-src-stlink-lib-usb.c.patch"
  - "0008-CMakeLists-include-absolute-path.patch"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: official
  total: 1
  passed: 1
  failed: 0

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E092: CMake 不认识 HarmonyOS，配方 generate() 设 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64 使 UNIX 安装规则生效"  # ref: E092
  - "上游 Findlibusb.cmake 使用 LIBUSB_INCLUDE_DIR/LIBUSB_LIBRARY cache 变量（单数），配方 generate() 需从 libusb 依赖包显式解析"  # ref: E092
  - "上游 udev/modprobe 配置默认安装到绝对路径 /etc 与 /lib，配方以 STLINK_MODPROBED_DIR/STLINK_UDEV_RULES_DIR cache 变量重定向到包内"  # ref: E092
  - "鸿蒙要求 ELF 签名：libstlink.so 与 bin/ 下 4 个工具必须 binary-sign-tool 签名后才能加载/执行（package() 中统一签名）"  # ref: E077
  - "clang 15 将 size_t→uint32_t 窄化视为硬错误，需显式强转（7 个补丁中的 5 个为此类修正）"  # ref: E030
  - "上游头文件安装到 include/stlink/，package_info() includedirs 指向该子目录使 #include <stlink.h> 可解析"  # ref: E092
