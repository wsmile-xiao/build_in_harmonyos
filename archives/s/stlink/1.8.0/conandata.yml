# conandata.yml — stlink 1.8.0
# Source: official GitHub tag (checksum verified on download)
# R39: use official URL only; CI adds mirror fallbacks automatically

sources:
  url:
    - "https://gh-proxy.com/https://ghfast.top/https://github.com/stlink-org/stlink/archive/refs/tags/v1.8.0.tar.gz"
    - "https://ghfast.top/https://github.com/stlink-org/stlink/archive/refs/tags/v1.8.0.tar.gz"
  sha256: "cff760b5c212c2cc480f705b9ca7f3828d6b9c267950c6a547002cd0a1f5f6ac"

patches:
  - patch_file: "patches/0001-cmake-modules-c_flags.cmake.patch"
    patch_description: "Disable -Wshorten-64-to-32 (clang 15 on OHOS treats size_t narrowing as hard error)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-st-util-gdb-remote.c.patch"
    patch_description: "Use <poll.h> instead of <sys/poll.h> (musl-based OHOS libc layout)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-stlink-lib-chipid.c.patch"
    patch_description: "Cast strlen() result to uint32_t in chipid.c (explicit 64->32 narrowing)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-stlink-lib-common.c.patch"
    patch_description: "Cast strlen() result to uint32_t in common.c hex parser (explicit 64->32 narrowing)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-stlink-lib-flash_loader.c.patch"
    patch_description: "Cast size_t arithmetic to uint32_t in flash_loader.c (explicit 64->32 narrowing)"
    patch_type: "portability"
  - patch_file: "patches/0006-src-stlink-lib-map_file.c.patch"
    patch_description: "Cast st_size to uint32_t in map_file.c (explicit 64->32 narrowing)"
    patch_type: "portability"
  - patch_file: "patches/0007-src-stlink-lib-usb.c.patch"
    patch_description: "Use size_t for stlink_serial() result in usb.c (correct return type)"
    patch_type: "portability"
  - patch_file: "patches/0008-CMakeLists-include-absolute-path.patch"
    patch_description: "Include cmake modules by absolute path (conan toolchain PREPENDs its generators dir to CMAKE_MODULE_PATH, breaking include(${CMAKE_MODULE_PATH}/...))"
    patch_type: "portability"
