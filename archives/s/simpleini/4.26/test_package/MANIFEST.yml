# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# simpleini 4.26 上游测试为 gtest 套件（tests/CMakeLists.txt, 17 个 ts-*.cpp，
# ts-wchar.cpp 仅 Windows 生效），由 build-ohos 目录 CMake+FetchContent(gtest v1.14.0)
# 实际构建并在 HarmonyOS aarch64 本机运行：253 tests, 250 passed, 3 skipped
# (malloc --wrap 相关，仅 Linux 系统名启用), 0 failed（适配 tmpfile() 后）。

package: simpleini/4.26
homepage: "https://github.com/brofield/simpleini"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
# simpleini 为 header-only 库，测试依赖 gtest(FetchContent)，由上游测试门禁单独执行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/ts-iostream.cpp
    source: simpleini-4.26/tests/ts-iostream.cpp
    description: "iostream LoadData/stream rejection/LoadFile(FILE*) regression"
    command: "./tests/tests"
  - file: tests/ts-utf8.cpp
    source: simpleini-4.26/tests/ts-utf8.cpp
    description: "UTF-8 CSimpleIniA handling"
    command: "./tests/tests"
  - file: tests/ts-numeric.cpp
    source: simpleini-4.26/tests/ts-numeric.cpp
    description: "numeric value conversion"
    command: "./tests/tests"
  - file: tests/ts-quotes.cpp
    source: simpleini-4.26/tests/ts-quotes.cpp
    description: "quoted value handling"
    command: "./tests/tests"
  - file: tests/ts-sections.cpp
    source: simpleini-4.26/tests/ts-sections.cpp
    description: "section key operations"
    command: "./tests/tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：LoadData + GetValue/SetValue round-trip（实质调用 SimpleIni API）"
    command: "./test_simpleini"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 253