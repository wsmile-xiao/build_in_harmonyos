# 版本级 manifest
# 文件位置: archives/s/snitch/1.2.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.3"

# 软件名
software: "snitch"

# 编译状态
# published | built | failed | archived
# O5: 合并且 release upload 确认前一律 built
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 CCI recipes/snitch/all/conandata.yml 逐字一致；
  # 版本可得性 git ls-remote 16 tag 命中 v1.2.3=c0a910cb4962f1e0）
  url: "https://github.com/snitch-org/snitch/archive/refs/tags/v1.2.3.zip"

  # 源码校验和（2026-09-25 设备实测复算，与 CCI 逐字一致）
  sha256: "f2649e716b612f3dbb5f109b7250be80e2d7e43c7827034a270bd1ca91eafb12"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 CCI 同款：SNITCH_DO_TEST=FALSE 不构建上游测试——
  # doctest 由 FetchContent 联网拉取，且 approval 用例对源码路径布局/
  # git 元数据有隐含依赖；上游测试在设备原生构建侧独立运行）
  configure_options: []

  # 编译依赖列表（格式: name/version）— 零运行依赖（W0-2 实查 CCI recipe
  # 无 requirements/build_requirements；仅 system lib m）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁：上游源码零修改可在 OHOS/aarch64 构建）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  # approval/快照测试的归一化正则硬编码 checkout 目录名（/snitch/tests/）与
  # 4 段 git 版本号（git log -1 %h）——tag 归档解包直接跑整套失配，
  # 须按上游 CI 布局物化源码（目录名 + git init），不改 expected 基线
  - "approval/快照测试跑之前先满足归一化正则的目录名与 git 版本号前提，否则整套假失败" # knowledge_ref: DRAFT-E745-approval-snapshot-checkout-preconditions
  # CI profile 固定 compiler.cppstd=17，上游要求 C++20 的包在 configure()
  # 覆盖 cppstd=20（arrow/abseil 先例），否则 validate check_min_cppstd
  # 构建前即判 Invalid rc=6（反证探针留档）
  - "C++20 包必须在 recipe configure() 覆盖 self.settings.compiler.cppstd=20" # knowledge_ref: DRAFT-E746-cppstd20-configure-override
  # 本任务实测佐证既有草稿：CMake 4.1.2 拒绝 <3.5 的 cmake_minimum_required，
  # doctest v2.4.9（FetchContent）configure 需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
  - "CMake 4.x 下老项目子依赖 cmake_minimum_required<3.5 需加 CMAKE_POLICY_VERSION_MINIMUM=3.5" # knowledge_ref: DRAFT-E321-cmake4-policy-version-minimum
