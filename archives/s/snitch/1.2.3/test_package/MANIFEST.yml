# test_package/MANIFEST.yml — snitch/1.2.3
# CI L0e 要求该文件存在（声明上游测试来源与消费者测试）

package: snitch/1.2.3
homepage: "https://github.com/snitch-org/snitch"

# ── 上游测试：tests/ 两套（approval + runtime）+ snitch 自测，全部真跑 ──
# 计数口径（R51 候选数法，四口径不混用；详见 reports/test-report.md）：
#   ① 源码注册点（宏字面）：runtime 83（77 普通含 2 个 SNITCH_TEST_WITH_SNITCH
#      守卫 + 6 个 TEMPLATE 站点）+ approval 3 = 86
#   ② 模板展开后 distinct 注册数：runtime 104（75 常编译 + 2 守卫 + 27 模板）
#      + approval 3 = 107
#   ③ 执行口径（三可执行文件相加，声明 N）：doctest runtime 102
#      + snitch 自测 104 + approval 3 = 209（runtime 被两套驱动各执行一遍）
#   ④ assertion 口径（不与用例数混用）：3809 + 4574 + 2782 = 11165
# 差额归因：86→107 = TEMPLATE 6 站点展开 27（+21）；107→209 = runtime
# 第二驱动（doctest）重复执行 102。
# 配方构建 SNITCH_DO_TEST=FALSE（与 CCI 同款）：doctest 由 FetchContent
# 联网拉取，且 approval 用例的路径归一化正则硬编码 "/snitch/tests/"、
# 版本归一化正则要求 4 段 "X.Y.Z.<githash>"（git checkout 前提）——
# 上游测试在设备原生构建侧按上游 CI 预期布局独立运行（见 notes.md）。
upstream_check_command: "cmake --build <build> --target snitch_runtime_tests snitch_approval_tests snitch_runtime_tests_self && 三可执行分别直跑"
upstream_test_in_build: false
upstream_test_command: "(cd tests/runtime_tests && <build>/tests/snitch_runtime_tests); (cd tests/approval_tests && <build>/tests/snitch_approval_tests); (cd tests/runtime_tests && <build>/tests/snitch_runtime_tests_self)"
upstream_tests:
  - file: tests/runtime_tests（14 个源文件 + testing* 共享工具）
    source: snitch-1.2.3.zip/tests/runtime_tests/
    description: "runtime 用例（doctest 驱动）：102 用例 / 3809 断言，全过"
    command: "./snitch_runtime_tests"
  - file: tests/approval_tests（3 个 reporter 快照用例 + data/expected）
    source: snitch-1.2.3.zip/tests/approval_tests/
    description: "approval 快照用例（doctest 驱动）：3 用例 / 2782 断言，全过"
    command: "./snitch_approval_tests"
  - file: tests/runtime_tests（同源，SNITCH_TEST_WITH_SNITCH 自测驱动）
    source: snitch-1.2.3.zip/tests/runtime_tests/
    description: "snitch 自测自身：104 用例 / 4574 断言，全过"
    command: "./snitch_runtime_tests_self"

# ── 适配后（test_package 消费者断言） ─────────────────────────────
test_package_tests:
  - file: test_package/test_snitch.cpp
    description: "snitch 消费者断言（鸿蒙特有测试）：4 个用例（安装头版本指纹 4 / 基础断言 4 / 字符串匹配器 2 / section+capture 3），由已安装 snitch 制品驱动，全过时退出码 0"
    command: "conan create（test() 直跑 test_snitch，snitch 汇总行对账）"

# 测试断言总数（消费者视角；conan create 日志 snitch 汇总行实测 18 =
# 13 显式断言（版本 4 + CHECK/REQUIRE/CHECK_THAT 9）+ 5 隐式
# no exception caught（snitch 对每次用例执行 pass 追加异常检查，
# section 用例执行 2 遍得 2 条））
assertion_count: 18
