software: simka
display: "simka"
description: "基于 minimizer 分区的快速 k-mer 计数与样本比较工具（GATB core）"
category: utility
homepage: "https://github.com/GATB/simka"
license: BSD-3-Clause
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "形态是命令行工具而非库：上游顶层 CMakeLists 只有 5 个 add_executable（simka/simkaCount/simkaCountProcess/simkaMerge/simkaMinCore），无 add_library、无头文件导出 ⇒ package_type=application 且必须有软件级 commands.json（R38/PF8）"
    - "构建期硬依赖 vendored 子模块 thirdparty/gatb-core：GitHub 的 tag 归档里该目录是空的，必须按 .gitmodules 锁定的 commit 从 GATB/gatb-core 官方仓补齐，否则 include(GatbCore) 直接 FATAL_ERROR"
    - "顶层 cmake_minimum_required(VERSION 2.6) 在 CMake 4.x 下必炸（<3.5 兼容已移除），要用 cache_variables 传 CMAKE_POLICY_VERSION_MINIMUM=3.5；tc.variables 无效（E321/DRAFT-E321）"
    - "gatb-core 在 Linux 分支上用 cat /proc/cpuinfo 探测 sse2/sse4_2 决定是否加 -msse2 -msse4.2 -mpopcnt；aarch64 OHOS 实测两项均为假 ⇒ 不会注入 x86 SIMD 标志（勿手工开 NO_SSE，那是多余变量）"
    - "内嵌 HDF5 子项目的 zlib filter 显式关成 OFF：它的 find_package(ZLIB) 只认自家 tgz 布局；zlib 统一由 Conan 依赖提供（gatb-core 链接行写死了 z）"
    - "全静态产物（BUILD_SHARED_LIBS=OFF）：gatbcore-static / hdf5-static 都是静态库，且 zlib 是系统同名库 ⇒ 包内不出 .so（R26）"
    - "测试不经构建系统注册（0 个 add_test），上游是 tests/simple_test.py + tests/simkaMin/test_simkaMin.py 两个脚本硬编码 ../build/bin/ 相对路径"
  common_dependencies:
    - zlib

versions:
  "1.5.3":
    status: built
    build_date: "2026-09-27"
    conan_ref: "simka/1.5.3"
