# test_package/MANIFEST.yml
# 上游官方测试声明（CI 门禁 L0e 要求本文件存在；口径见 docs/TEST_QUALITY_SPEC.md §4.3
# 与 references/iron-rules.md R51「上游测试三步法」）

package: simka/1.5.3
homepage: "https://github.com/GATB/simka"

# 上游测试命令：本包**没有** ctest / add_test / Makefile check 目标。
# 一手复算证据（notes.md §测试账本）：
#   grep -n "add_test|enable_testing|ctest|BUILD_TESTS" CMakeLists.txt  -> 0 命中
#   且顶层显式 SET(GATB_CORE_EXCLUDE_TESTS 1) 排除内嵌 gatb-core 的测试
# 上游的测试是**两个独立 Python 集成脚本**（tests/simple_test.py、
# tests/simkaMin/test_simkaMin.py）+ 两套 truth 数据目录，不经构建系统注册。
upstream_check_command: "无（上游不经 ctest/make check 注册测试；实测 grep add_test|enable_testing|ctest 在顶层 CMakeLists.txt 0 命中）"

# conanfile.py build() 里是否集成了上游测试
upstream_test_in_build: false
upstream_test_command: ""
# 不集成的**具体技术原因**（不是"没环境"）：
#   tests/simple_test.py 与 tests/simkaMin/test_simkaMin.py 硬编码相对路径
#   `../build/bin/simka`、`../build/bin/simkaMinCore`、`../example/simka_input.txt`，
#   即要求"源码目录同级有个 build/ 目录"。Conan 的 cmake_layout 把构建目录放到
#   <build>/<hash>/build/Release，与源码目录不同级 ⇒ 脚本按原样在配方构建目录里必炸。
#   上游测试改为在 W3 探索阶段用"复刻目录布局"的方式实跑（结果记 notes.md §测试账本），
#   其功能断言同时被 test_package 以确定性方式重做（见下）。

# 上游实际存在的测试程序
upstream_tests:
  - file: tests/simple_test.py
    source: simka-1.5.3/tests/simple_test.py
    description: "k-mer 计数主集成测试：4 个 (k, abundance-min) 组合（k=31/21 × t=0/2）各产出 21 个距离矩阵（8 presenceAbsence + 13 abundance），其中 20 个与 tests/truth/results_k*_t*/ 逐字节比对、mat_abundance_jaccard.csv 由上游 simple_test.py:38-40 明示不进 truth；另有 1 个 test_parallelization() 用两组 -nb-cores/-max-memory 跑同一输入并比对两次结果一致性"
    command: "python3 tests/simple_test.py"
  - file: tests/simkaMin/test_simkaMin.py
    source: simka-1.5.3/tests/simkaMin/test_simkaMin.py
    description: "simkaMin 草图（minhash）流水线的参数组合测试：K={21,31} × FILTER={'',-filter} × NB_READS={0,100} × NB_KMERS={100,1000} × NB_CORES={1,0}（=32 组），经 simkaMin/*.py 驱动 bin/simkaMinCore，并与 truth_simkaMin/、truth_simkaMin_symetrical/ 比对"
    command: "python3 tests/simkaMin/test_simkaMin.py"

# test_package 自带的消费者测试（本 PR 实际执行并计入通过率的部分）
test_package_tests:
  - file: test_simka.sh
    description: "真跑包内 bin/simka 对上游 example/simka_input.txt 做 k-mer 计数：断言 5 个上游可执行目标齐备、21 个距离矩阵数量正确（8/13 两族计数，⛔ 旧的「直方图非空」判据在 .csv.gz 命名下会假通过、已换掉）、k=21/t=0 与 k=31/t=2 的 mat_presenceAbsence_jaccard.csv 与上游 truth 原文逐字节一致、-simple-dist/-complex-dist 两族计数 8 与 13、以及换 -nb-cores 2 -max-memory 2000 后结果不变（对应上游 test_parallelization）"
    command: "sh test_simka.sh <simka package folder>"

# 测试断言总数（test_simka.sh 实测静态计数：
#   产物齐备 5 + 数据集就位 1 + 2 个用例 × 5 项（退出码/矩阵数/矩阵文件存在/逐字节比对/直方图）+ 并行不变性 2 = 18）
assertion_count: 18
