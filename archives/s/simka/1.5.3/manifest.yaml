knowledge_gained:
  - "gatb-core CommonFile::gets() 用 plain char 承接 fgetc() 返回值并与 EOF 比较：aarch64-ohos 的 plain char 默认无符号（探针实测 CHAR_MIN=0），EOF(-1) 存不进 char ⇒ 读末行无换行符的文件时跳过循环无出口，进程满核纯用户态死转且零系统调用；x86-64 有符号 char 恰好能退出，故上游隐形（knowledge_ref: DRAFT-8543-plain-char-eof-sentinel-infinite-loop）"
  - "同一机制的第二处触发面：simka 在写 bank list 前 erase 掉末字符（SimkaAlgorithm.cpp:324/340/506/520）使 list 末行必无换行 ⇒ BankAlbum.cpp:58 的 while(isEOF()==false) 永远走不到退出分支；修 gets() 的接收类型即可同时覆盖 BankAlbum 与 Property 两个调用方（knowledge_ref: DRAFT-8543-plain-char-eof-sentinel-infinite-loop）"
  - "simka 1.5.3 的距离矩阵产物是 *.csv.gz（上游 tests/simple_test.py L16-24 先 decompress 再与 tests/truth 逐字节比）：实测 21 个 = truth 的 20 个 + 由 Bray-Curtis 派生且不进 truth 的 mat_abundance_jaccard（knowledge_ref: 无，理由：本包产物形态事实，非可复用机制）"

