# 上游 gatb-core 的 CommonFile::gets() 在读「末行无换行符」的文件时死转：
#   for (char c = tmp[result-1]; c !='\n' && c!=EOF; c = fgetc(...)) {}
# aarch64/ARM ABI 下 char 默认 unsigned，c 恒在 [0,255]，与 EOF(-1) 永不相等
# ⇒ 末行无换行时该跳过循环无出口（fgetc 到 EOF 只查标志位、不发 read 系统调用
#   ⇒ 纯用户态自旋）。x86-64 上 char 默认 signed，(char)EOF==-1 才恰好能退出。
# simka 写 bank list 前恰好 erase 掉了行尾换行，因此 100% 触发（详见 notes.md）。
patches:
  - patch_file: "patches/0001-thirdparty-gatb-core-gatb-core-src-gatb-system-impl-FileSystemCommon.hpp.patch"
    patch_description: "修复 gatb-core CommonFile::gets() 在末行无换行符的文件上纯用户态死循环：跳过残余字符的循环用 char 承接 fgetc() 返回值，而 aarch64 ABI 下 char 默认无符号，取值恒在 0..255 永不等 EOF(-1) ⇒ 循环无出口；改为 int 并对初值做 static_cast 到无符号字符（在 x86-64 有符号 char 平台上，行为差出现在**任意被跳过的字节恰为 0xFF 时**——含循环首字节与后续 fgetc 读到的字节：旧实现把 (char)0xFF==-1 误当 EOF 提前退出，新实现按真实字节值继续跳行，属修正而非行为不变）"
    patch_type: "bugfix"
