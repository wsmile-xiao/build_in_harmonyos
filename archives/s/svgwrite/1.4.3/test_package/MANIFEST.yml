package: svgwrite/1.4.3
homepage: "https://github.com/mozman/svgwrite"
upstream_check_command: "python3 -m pytest tests -q"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests -q"
upstream_tests:
  - file: tests/
    description: "All 477 upstream cases plus one long-path regression remain declared. H1/W3 supplied environments each ran 478 pytest cases and 4 consumer groups. Clean official Worker CI 61615 lacked pytest; the Conan build now checks Python syntax only and must not claim the full pytest suite ran there."
