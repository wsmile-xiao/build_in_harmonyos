knowledge_gained:
  - "On OHOS, the shared target uses the upstream SZ_AVOID_LIBC=1 path, which disables the Linux POSIX register probe and returns conservative Arm capabilities without a new platform macro."
  - "On OHOS, SZ_OVERRIDE_LIBC=0 avoids exporting custom libc symbol overrides that caused the shared consumer to fault at runtime."
  - "With OHOS Clang warnings-as-errors, the upstream C++11/C++14 range-wrapper tests need -Wno-c++17-extensions because their iterator/sentinel pair is a C++17 extension."
  - "The Conan consumer target is stringzilla::shared and the recipe intentionally provides the shared variant only."
  - "StringZilla's upstream CMake now prefers the Conan forkunion::header package target and retains the vendored submodule as a fallback."
knowledge_ref:
  - "knowledge/drafts/E2174-draft-8DAC.kv"

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: portability_and_dependency_integration
    platform_only: false
    guard: 'Conan package target first; pre-C++17 Clang range-wrapper warning suppression; OHOS capability definitions under CMAKE_SYSTEM_NAME=OHOS'
