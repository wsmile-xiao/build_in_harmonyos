# conandata.yml — simstring 1.0

sources:
  url: "https://www.chokkan.org/software/dist/simstring-1.0.tar.gz"
  sha256: "386f5e18c9a92a84eccd6caee407e28da939dd74bb68bd17912c4d918f0e4171"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Teach the 2009 config.guess to recognize HarmonyOS uname and emit aarch64-unknown-linux-ohos (E007 semantics)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Add aarch64 CPU and linux-ohos OS to the 2009 config.sub so the OHOS triplet validates"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "Use umask 022 for configure/config.status temp dirs: HMDFS maps dir owner to a shared uid, umask 077 drops group-write and ./confXXXXXX/subs1.awk creation fails with Permission denied (a52dec precedent)"
    patch_type: "bugfix"
  - patch_file: "patches/0004-include-simstring-simstring.h.patch"
    patch_description: "Include <unistd.h> so POSIX read/write/lseek declarations are visible (Debian patch 0001 'To use standard library correctly')"
    patch_type: "bugfix"
