# 编译中学到的知识
knowledge_gained:
  - "老 autotools 发行包（config.guess/sub 2009 基线）不识 HarmonyOS/aarch64：官方 patch-autotools-ohos.pl 在老基线只成功一半（cg=1 sub=0 rc=1，锚点 android-linux/linux-uclibc 不存在），需对老基线手写同语义最小补丁（主 case 插 HarmonyOS 分支 + config.sub 三处），且严禁 --build/--host（E007 cross_compiling 假设）"  # knowledge_ref: knowledge/drafts/DRAFT-E685-autotools-legacy-configscripts-harmonyos-hmdfs-umask.md
  - "autoconf 'umask 077 && mktemp -d ./confXXXXXX' 在本设备必炸：目录落盘属主恒映射共享 uid 20001006 而 euid=20020085，mode 0700 丢 group-w 后写路径全断（toybox mktemp -d 权限随 umask：077 拒 / 022 通），configure 两处 umask 077→022 原地修即可；E110/E125 的换构建目录方案在同文件系统下无效"  # knowledge_ref: knowledge/drafts/DRAFT-E685-autotools-legacy-configscripts-harmonyos-hmdfs-umask.md
  - "上游 1.0 simstring.h 缺 <unistd.h> 致 read/write 被类成员遮蔽（invalid use of non-static data member）：与 Debian 官方补丁 0001 同款修法"  # knowledge_ref: knowledge/drafts/DRAFT-E685-autotools-legacy-configscripts-harmonyos-hmdfs-umask.md
  - "本包上游 N=0（无任何测试套件，make check 空过）：通过率分母只能用 test_package 自写断言（12 头文件 API 断言 + 5 CLI 检查 = 17），上游与自写严格分栏"  # knowledge_ref: knowledge/drafts/DRAFT-E685-autotools-legacy-configscripts-harmonyos-hmdfs-umask.md
  - "chokkan.org 对 .tar.gz 无条件加 Content-Encoding: gzip/x-gzip（4 形态实测）：Conan requests 栈透明解码一层拿内层 plain tar（fa0fa296）与 conandata 文件面 sha（386f5e18==官方==Debian .dsc）必然 mismatch——修法=source() 先 get() 捕 ConanException 后 urllib 回退（不解码）+ check_sha256 兜底，保留权威文件面 sha；改记解码面 sha 会让 W4 curl 独立复算判 mismatch"  # knowledge_ref: knowledge/drafts/DRAFT-E690-content-encoding-x-gzip-conan-decode-two-faced-sha256.md
  - "判断 Content-Encoding 类哈希错先做三步定性：gunzip -c 文件面|sha256sum 是否等于报错 Computed 值、curl/urllib(不认 content-encoding) 是否得 conandata sha、请求头 identity/bogus 是否能诱导服务器不打标（本包 4 形态实测不能）——三步可把'网络瞬时'与'解码定式'彻底分开，避免同错盲跑多轮"  # knowledge_ref: knowledge/drafts/DRAFT-E690-content-encoding-x-gzip-conan-decode-two-faced-sha256.md
  - "header-library 类型包的 cpp_info.bindirs 永不进 conanrun PATH：VirtualRunEnv 只对 require.run=True 的依赖做 runenv（virtualrunenv.py:79），header-library 边 run=False ⇒ conanrunenv 脚本 for v in 空表、test_package 裸调包内二进制恒 127（包内实物在+直跑 rc=0 具迷惑性）——修法=test() 显式传 package_folder/bin 作 $1（abiword 族先例）；改 package_type=application 属表意失真（aa3d 虽可行但裁决否决）"  # knowledge_ref: knowledge/drafts/DRAFT-E691-header-library-run-false-bindirs-not-in-conanrun-path.md
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
