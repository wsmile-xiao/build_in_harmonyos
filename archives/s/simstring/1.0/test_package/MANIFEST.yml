# test_package/MANIFEST.yml — simstring 1.0
# CI L0e requires this file to exist (docs/TEST_QUALITY_SPEC.md).

package: simstring/1.0
homepage: "https://www.chokkan.org/software/simstring/index.html.en"

# Upstream 1.0 ships no test suite at all: no TESTS/check_PROGRAMS in any
# Makefile.am, no test files in the tarball, and `make check` prints
# "Nothing to be done for 'check'" in every subdirectory (rc=0).
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball (N = 0, cleared by
# `grep -rn 'TESTS\|check_PROGRAMS' Makefile.am */Makefile.am` -> no hits).
upstream_tests: []

# test_package tests (consumer perspective, all self-written)
test_package_tests:
  - file: test.cpp
    description: "Header-only API consumer: builds an n-gram DB with the packaged writer, reopens it with the reader and asserts exact/cosine/dice/jaccard/overlap retrieval (12 assertions)"
    command: "./test_simstring"
  - file: test.sh
    description: "Packaged CLI frontend via explicit <package-bin-dir> arg (header-library → conanrun PATH excludes bindirs): -v banner, DB build from stdin (3 strings), exact + cosine query output, -h help (5 checks)"
    command: "bash test.sh <package-bin-dir>"

# Approximate assertion count (12 + 5)
assertion_count: 17
