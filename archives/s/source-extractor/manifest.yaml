# 软件级 manifest — source-extractor
software: source-extractor
display: "SExtractor (Source Extractor)"
description: "从天文图像中提取源并生成星表的工具（AstrOmatic 套件核心，Debian 包名 source-extractor）"
category: science
homepage: "https://www.astromatic.net/software/sextractor"
license: "GPL-3.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "autoreconf 自举 + config.guess/config.sub 内联补 OHOS 识别（aarch64-unknown-linux-ohos）"
    - "configure 重执行 shell 的 cwd 环境变量预置（toybox sh 不 export）"
    - "--enable-threads=no（OHOS pthread.h 无 pthread_cancel）"
    - "依赖头文件 -I 经 CFLAGS 注入；cfitsio 需 -Lz -lz"
  common_dependencies:
    - fftw3f
    - openblas
    - cfitsio
    - zlib

versions:
  "2.28.2":
    status: built
    build_date: "2026-08-24"
    conan_ref: "source-extractor/2.28.2"
