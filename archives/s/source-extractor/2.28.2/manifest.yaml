# 版本级 manifest — source-extractor 2.28.2
version: "2.28.2"
software: "source-extractor"
status: built
build_date: "2026-08-24"
conan_ref: "source-extractor/2.28.2"
build_system: "autotools"

source:
  url: "https://github.com/astromatic/sextractor/archive/refs/tags/2.28.2.tar.gz"
  sha256: "d92c5214ea75b8a70214d7d7f6824207fc53861ec923ceb2cc574f2ec9effa94"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-openblas"
    - "--enable-threads=no"
    - "--with-fftw-incdir=<pkg>/include"
    - "--with-fftw-libdir=<pkg>/lib"
    - "--with-openblas-incdir=<pkg>/include"
    - "--with-openblas-libdir=<pkg>/lib"
    - "--with-cfitsio-incdir=<pkg>/include"
    - "--with-cfitsio-libdir=<pkg>/lib"
  dependencies:
    - fftw3f/3.3.9.1
    - openblas/0.3.34
    - cfitsio/4.6.4
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-Makefile.am.patch"
  - "0002-Makefile.am.patch"

knowledge_gained:
  - "OHOS 设备 toybox sh 不 export 当前目录环境变量，configure 以 CONFIG_SHELL=bash 重执行时 bash 启动 getcwd() 失败（working directory cannot be determined）——预置当前目录环境变量（os.environ）即可绕过"
  - "SExtractor configure 宏（ACX_FFTW/ACX_OPENBLAS/ACX_CFITSIO）只做存在性检查，不把 -I 写入 AM_CPPFLAGS——依赖头文件路径须经 CFLAGS 注入"
  - "cfitsio 静态库依赖 zlib（deflate 等符号）——AC_CHECK_LIB 链接测试需 -Lz + -lz（同 swarp）"
  - "OHOS pthread.h 未声明 pthread_cancel——--enable-threads=no 禁用多线程（同 swarp）"
