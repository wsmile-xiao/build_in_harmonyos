# test_package/MANIFEST.yml — source-extractor 2.28.2
# 上游测试声明文件（CI L0e 强制存在；详见 docs/TEST_QUALITY_SPEC.md）

package: source-extractor/2.28.2
homepage: "https://www.astromatic.net/software/sextractor"

# 上游官方测试：make check 运行 tests/modelfit.test（TESTS 机制）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "self.run(\"make check\", cwd=self.build_folder, env=\"conanrun\")"

# 上游实际运行的测试（tests/Makefile.am: TESTS = modelfit.test，实测 1 PASS）
upstream_tests:
  - file: tests/modelfit.test
    source: sextractor-2.28.2/tests/modelfit.test
    description: "端到端冒烟：sex galaxies.fits -WEIGHT_IMAGE galaxies.weight.fits -CATALOG_NAME galaxies.cat（星系 FITS 图源提取）"
    command: "make check (modelfit.test)"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_source_extractor.py
    description: "消费者测试：sex --version 输出 SExtractor version 2.28.2 + ldactoasc --help 用法"
    command: "python3 test_source_extractor.py <bindir>"

# 测试断言总数（test_package 冒烟断言数，CI 统计口径）
assertion_count: 2
