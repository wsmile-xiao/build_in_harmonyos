# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e check (R51 three-step inventory).

package: sent/1
homepage: "https://tools.suckless.org/sent/"

# sent 1 ships no automated test suite of any kind.  The inventory below is
# the evidence, taken from the released tarball (sent-1.tar.gz, sha256
# 7bf3de9311ce291ff36adf5315b78fa72373e3ab80ca71387fb5884bcbd7be33), not from
# an assumption.
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile"
    reason: "完整目标清单为 all / options / config.h / .c.o / sent / cscope / clean / dist / install / uninstall / .PHONY；无 check、无 check-local、无 TESTS 变量，故 `make check` 直接报 No rule to make target。"
  - source: "构建系统其它入口"
    reason: "源码包无 configure/configure.ac/Makefile.am/meson.build/CMakeLists.txt（裸 Makefile + config.mk），因此不存在 ctest / meson test 注册数可清点。"
  - source: "源码树"
    reason: "解包后 16 个条目：.gitignore LICENSE Makefile README.md arg.h config.def.h config.mk drw.c drw.h example nyan.png sent.1 sent.c transparent_test.ff util.c util.h；无 tests/ 或 test/ 目录、无 *_test.*/test_*.* 测试源文件。example/ 是示例演示文稿（文本幻灯片），transparent_test.ff 与 nyan.png 是 example 里引用的素材，均非自动化测试。"
  - conclusion: "上游静态测试总数 = 0；由 test_package 真实执行打包后的 sent 二进制补足验证（见 test_package_tests）。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_sent.sh
    description: "真实执行打包后的 sent 二进制，覆盖 upstream 在 xinit()/XOpenDisplay() 之前到达的 4 条代码路径：(1) -v 退出码 0 且输出严格等于 sent-1（同时反证 -DVERSION 未被 make 命令行覆盖弄丢）；(2) 未知选项 -Z 走 usage()->die() 退出码 1，并断言 usage 行里含被测二进制的绝对路径（argv[0] 只有真正被执行的那个二进制才会打印出来，可排除桩/错位产物）；(3) 不存在的演示文稿文件走 fopen 失败 die() 退出码 1 且输出含 Unable to open；(4) `sent - < /dev/null` 空输入使 slidecount==0 走 usage() 退出码 1。另有 2 条纯存在性检查（share/man/man1/sent.1、licenses/LICENSE），脚本内以 [exec]/[file] 前缀显式区分，不混计为执行。不喂入可解析的演示文稿：main() 之后会调 xinit()，若宿主恰好导出 DISPLAY 则会开窗口阻塞直至 CI 超时。"
    command: "$SHELL test_sent.sh <package>/bin/sent <LD_PRELOAD_libs>"

assertion_count: 6
