software: sent
version: "1"
upstream_version: "v1"
conan_ref: "sent/v1"
status: built
build_date: "2026-09-28"
build_system: makefile

source:
  url: "https://dl.suckless.org/tools/sent-1.tar.gz"
  sha256: "7bf3de9311ce291ff36adf5315b78fa72373e3ab80ca71387fb5884bcbd7be33"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  make_arguments:
    - "make -j1 CC=<conan conf c-compiler> INCS=<-I. plus dependency include dirs> LIBS=<-L dependency lib dirs> -lXft -lfontconfig -lX11 -lm"
    - "make install <same overrides> PREFIX= MANPREFIX=/share/man DESTDIR=<package_folder>"
  dependencies:
    - libxft/2.3.9
    - fontconfig/2.18.3
    - libx11/1.8.13
    - libxrender/0.9.12
    - freetype/2.14.3
    - xorgproto/2025.1
  cc: clang
  cxx: ""

patches_applied: []

knowledge_gained:
  - "suckless 归档布局不统一：sent-1.tar.gz 是扁平包（顶层直接是 Makefile/sent.c），conan 2.29.1 的 untargz 在 strip_root=True 时对扁平包抛 ConanException('Can't untar a tgz containing files in the root with strip_root enabled')，所以不能照抄 farbfeld 的 strip_root=True；同族打包前必须逐个 tar -tzf 实测"
  - "裸 Makefile 的依赖注入点应选 INCS/LIBS（普通 = 赋值、命令行覆盖即整体生效），把 CFLAGS/LDFLAGS 的 += 语义连同 CPPFLAGS 里的 -DVERSION 一起保留；覆盖 CFLAGS/CPPFLAGS 会静默丢掉 -DVERSION=\"1\"，sent -v 会退化成打印 sent- 而编译照常成功"
  - "suckless install 目标把 ${DESTDIR}${PREFIX} 与 ${DESTDIR}${MANPREFIX} 无分隔符直接拼接，PREFIX 与 MANPREFIX 必须一个留空、一个自带前导斜杠（MANPREFIX=/share/man）"
  - "X11 头文件到 conan 包的映射可实测：ft2build.h 在 freetype 的 include/freetype2/ 而非 include/ 根（Xft.h 第 39 行 include 它），故 -I<pkg>/include/freetype2 是硬需求；X11/X.h 与 X11/keysym.h 来自 xorgproto，X11/extensions/Xrender.h 来自 libxrender，X11/Xlib.h 来自 libx11"
  - "★preflight 假阴性陷阱：隔离 CONAN_HOME 默认没有 ohpcd remote（只有 conancenter），而 preflight_check.sh 只看 conan download -r=ohpcd 的退出码且不负责加 remote ⇒ 任何依赖都会被误报『未发布』。跑 preflight 前必须 conan remote add --force ohpcd https://conan.cnb.cool/OpenHarmonyPCDeveloper/Conan/-/packages/（照抄 ci/conan/setup.sh），并且先用已知已发布的 ref 做正对照、bogus ref 做负对照，再采信结论；否则可能凭一次配置缺失去做依赖转手/block 决策"
  - "隔离 CONAN_HOME 下 -pr:b=default 会报 Profile not found: default（没建过默认 profile），conan install/create 要把 ci/conan/profiles/ohos-aarch64 同时传给 -pr:h 与 -pr:b"
  - "sent 的 -v 打印到 stderr（sent.c main 里 fprintf(stderr,...)），而 sent.1 手册页写的是 'Print version information to stdout'，上游文档与实现不一致"
  - "图形类软件包的 test_package 只能取 main() 里 XOpenDisplay 之前的路径（-v / 未知选项 / 打不开文件 / 空 stdin）；喂入可正常解析的输入会让进程进事件循环永久阻塞挂 CI"

  - "制品仓发布的 fontconfig/2.18.3 与 libxft/2.3.9 二进制 .codesign 节存在但加载器拒载（E135 族签名失效：LD_LIBRARY_PATH / LD_PRELOAD / 精确 DT_NEEDED 名副本全部 Error loading shared library，同批其余 7 库正常）。对策：test_package 把 9 库闭包按 SONAME 名拷入 $TMPDIR scratch 目录、逐个 binary-sign-tool -selfSign 1 重签（objcopy 先剥旧 .codesign），目录作为 argv[3] 置顶 LD_LIBRARY_PATH；_find_so 按『非链接优先→尺寸下限→最长名』排序，防 HMDFS 懒物化符号链接（E050）把未物化链接名交给加载器"

conan_recipe: true
