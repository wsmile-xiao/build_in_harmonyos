software: sent
display: "sent"
description: "Simple plaintext presentation tool for X11"
category: gfx
homepage: "https://tools.suckless.org/sent/"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "裸 Makefile + config.mk：无 configure / autotools / CMake，构建就是 make 加 make install PREFIX= MANPREFIX="
    - "依赖注入走 make 命令行变量覆盖 INCS/LIBS（二者是普通 = 赋值，命令行覆盖即整体替换），从而剔除上游硬编码的 /usr/X11R6、/usr/include、/usr/include/freetype2、/usr/lib"
    - "绝不覆盖 CFLAGS/LDFLAGS/CPPFLAGS：config.mk 的 CPPFLAGS 携带 -DVERSION=\"1\"，命令行覆盖会让 sent -v 打印成 sent-"
    - "make install 用 ${DESTDIR}${PREFIX} 与 ${DESTDIR}${MANPREFIX} 直接拼接、中间无分隔符，故 MANPREFIX 必须自带前导斜杠（/share/man）"
    - "上游无 STRIP 变量、install 只是 cp -f，编译器与 strip 工具路径不会被烤进产物；产物仍需 binary-sign-tool 自签否则 OHOS 内核拒执行"
    - "上游 sent-1.tar.gz 是扁平归档（无 sent-1/ 顶层目录），conan get() 不能带 strip_root=True，否则 ConanException"
    - "sent 是 GUI 查看器，测试只能取 xinit() 之前的路径（-v / 未知选项 / 打不开文件 / 空输入）"
  common_dependencies:
    - libxft
    - fontconfig
    - libx11
    - libxrender
    - freetype
    - xorgproto

versions:
  "1":
    status: built
    build_date: "2026-09-23"
    source_url: "https://dl.suckless.org/tools/sent-1.tar.gz"
