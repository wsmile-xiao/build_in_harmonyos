sources:
  4.21.0:
    url: "https://github.com/samba-team/samba/archive/refs/tags/samba-4.21.0.tar.gz"
    sha256: "79ad4e1820f9eb405640bea57076b514082ef01ade0d435b2f03005b9e4c9072"

patches:
  4.21.0:
    - patch_file: "patches/0001-lib-replace-wscript.patch"
      patch_description: "lib/replace mkstemp 探针修复：探针用 TMPDIR 而非硬编码 /tmp（/tmp 只读文件系统上失败），且安全判定从『恰好 0600』放宽为『属主可读写(0700==0600)且组/其他无写权限(0002==0)』——如 mode 0660（restrictive umask）这类真实安全 mkstemp 也能获得 HAVE_SECURE_MKSTEMP，不再落入不安全的 rep_mkstemp(mktemp) 替换；探针改为非强制"
      patch_type: "bugfix"
    - patch_file: "patches/0002-lib-socket-interfaces.c.patch"
      patch_description: "interfaces.c 链路速率查询用 HAVE_ETHTOOL_CMD_SPEED 分支：符号可用走 ethtool_cmd_speed()，否则 *speed=0 兜底（与无链接检测降级路径对齐）"
      patch_type: "bugfix"
    - patch_file: "patches/0003-lib-socket-wscript.patch"
      patch_description: "符号级链接探测 ethtool_cmd_speed()（glibc 提供、部分 libc 不提供），define HAVE_ETHTOOL_CMD_SPEED 由工具链真实链接结果决定，不依赖平台宏"
      patch_type: "bugfix"
    - patch_file: "patches/0004-pidl-wscript.patch"
      patch_description: "lib/replace 探针/生成器降级：Parse::Yapp::Driver 由配方 vendored 注入，yapp 二进制缺失时改用 pre-generated 解析器（release tarball 已带），不再硬失败"
      patch_type: "bugfix"
    - patch_file: "patches/0005-third_party-cmocka-cmocka.h.patch"
      patch_description: "cmocka.h uintptr_t typedef 冲突修复：libc 已通过编译器内建宏 __UINTPTR_TYPE__ 提供 uintptr_t（C23 风格 libc）时跳过重复 typedef，避免 typedef redefinition"
      patch_type: "bugfix"
    - patch_file: "patches/0006-buildtools-wafsamba-samba_third_party.py.patch"
      patch_description: "uid_wrapper 最低版本 1.3.1→1.2.5：制品仓仅有 uid-wrapper/1.2.5；nm 实证 1.2.5 导出符号覆盖 1.3.1 源码全部 selftest 相关截获函数（setuid/setgid/setre*/setres*/getres*/setgroups/getgroups/pthread_create/pthread_exit/uid_wrapper_enabled/uwrap_constructor/uwrap_destructor），唯一差异 __getgroups_chk 为 glibc fortify 符号、OHOS/musl 不存在；selftest 经 LD_PRELOAD+UID_WRAPPER=1 环境变量协议工作，不直接调用 wrapper 符号 API"
      patch_type: "bugfix"
    - patch_file: "patches/0007-source3-modules-wscript_build.patch"
      patch_description: "vfs_nfs4acl_xattr 模块按 rpcgen 可用性门控：OHOS 设备无 rpcgen 二进制（rpc/xdr.h 亦缺失），默认构建本就不启用该模块；无 rpcgen 时跳过 nfs41acl.x→nfs41acl.h 生成任务且不声明该模块，selftest 构建对齐默认构建模块集（无 selftest 套件依赖该模块）；有 rpcgen 的上游构建不受影响"
      patch_type: "bugfix"
    - patch_file: "patches/0008-source3-modules-wscript_build.patch"
      patch_description: "test_vfs_posixacl 自测二进制按 acl 头可用性门控：该测试直接 include vfs_posixacl.c 源文件，需 acl_t 等类型（filesys.h 按 HAVE_SYS_ACL_H/HAVE_ACL_LIBACL_H 条件 include sys/acl.h 或 acl/libacl.h）；OHOS sysroot 无 libacl（两头均不存在，--without-acl-support）→ 无 acl 时不构建该测试二进制（无 selftest 套件运行它，vfs_posixacl 模块无 acl 时本就不构建）；有 acl 平台行为不变"
      patch_type: "bugfix"
    - patch_file: "patches/0009-selftest-wscript.patch"
      patch_description: "selftest/wscript cmd_testonly 对 wrapper .so 路径变量做 None 防御：pam_wrapper/pam_matrix 在 --without-pam（OHOS 无 PAM 头）时 configure 整体跳过、变量未定义，原代码 str+NoneType 直接崩溃（SELFTEST_EXIT=2）；改为逐变量判空、仅已设置项拼入 selftest.pl 选项（nss/resolv/uid/socket 四值实测已在 config.h 设置为裸 .so 名，经 LD_LIBRARY_PATH 解析），pam 相关套件按环境受限如实归类"
      patch_type: "bugfix"
    - patch_file: "patches/0010-selftest-optional-python-modules.patch"
      patch_description: "python/wscript selftest_pkgs（cryptography/pyasn1）缺失模块处理由 fatal 改为非必需：两模块仅被 AD-DC GPO/GPDI/krb5 加密相关套件运行时 import（gkdi、gp_cert_auto_enroll_ext、krb5 kcrypto/lockout/pkinit），OHOS 设备 python 无对应系统包（python3-cryptography/python3-pyasn1 不可安装）；缺失时由 Errors.WafError 改为 COMPOUND_END(False) 跳过、受影响套件运行时 ImportError 按环境受限如实归类；dateutil.parser 实测可用（与 iso8601 的二选一检查天然满足）；模块在场时行为不变"
      patch_type: "bugfix"
    - patch_file: "patches/0011-source3-selftest-tests.py.patch"
      patch_description: "source3/selftest/tests.py kernel oplocks 判定 None 守卫：非 Linux 平台（OHOS 实测 platform.system()='HarmonyOS'、release='HongMeng Kernel 1.12.0'）下 linux_kernel_version 保持 None，而 config.h 有 HAVE_KERNEL_OPLOCKS_LINUX 时原代码无条件 compare_versions(None, [5,3,1]) → TypeError，测试列表生成崩溃（selftest.pl 0 tests）；改为 None 时视同无 kernel oplocks（have_linux_kernel_oplocks=False，依赖该特性的套件按环境受限如实归类）；Linux 平台行为不变（linux_kernel_version 非 None 照常比较）"
      patch_type: "bugfix"
