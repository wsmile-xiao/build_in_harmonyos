# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.21.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.21.0"

# 软件名
software: "samba"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "waf"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39 —— samba-team 官方仓库 tag 发布物，同 sha256）
  url: "https://github.com/samba-team/samba/archive/refs/tags/samba-4.21.0.tar.gz"

  # 源码校验和（GitHub tag 源 tarball 实测）
  sha256: "79ad4e1820f9eb405640bea57076b514082ef01ade0d435b2f03005b9e4c9072"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: waf

  # 配置选项列表（waf configure 裁剪参数）
  # 默认变体（发布制品/CI）选项；selftest 变体（with_selftest=True，
  # 本地证据非发布）不传 --disable-python 与 --without-libarchive，
  # 增传 --enable-selftest（启用 python 绑定，python_cross_compile
  # 环境变量旁路，见 conanfile docstring）
  configure_options:
  - "--prefix=/"
  - "--disable-python"
  - "--without-ad-dc"
  - "--without-ldap"
  - "--without-json"
  - "--without-libarchive"
  - "--without-acl-support"
  - "--without-ads"
  - "--without-pam"
  - "--without-quotas"
  - "--disable-cups"
  - "--without-systemd"
  - "--without-lttng"
  - "--without-gettext"

  # 编译依赖列表（格式: name/version）
  # perl 为 tool_requires（PIDL Parse::Yapp）；selftest 变体另消费
  # 5 个 cwrap wrapper（resolv/nss/socket/uid/pam）+ libarchive/3.8.7
  dependencies:
  - "gnutls/3.8.10"
  - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "patches/0001-lib-replace-wscript.patch"
- "patches/0002-lib-socket-interfaces.c.patch"
- "patches/0003-lib-socket-wscript.patch"
- "patches/0004-pidl-wscript.patch"
- "patches/0005-third_party-cmocka-cmocka.h.patch"
- "patches/0006-buildtools-wafsamba-samba_third_party.py.patch"
- "patches/0007-source3-modules-wscript_build.patch"
- "patches/0008-source3-modules-wscript_build.patch"
- "patches/0009-selftest-wscript.patch"
- "patches/0010-selftest-optional-python-modules.patch"
- "patches/0011-source3-selftest-tests.py.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "waf 的 mkstemp 探针要求文件 mode 恰为 0600，restrictive umask 下私有/组权限但属主可读写的真实安全文件会误判；放宽为属主可读写且组与他人无写权限"
- "waf 构建生成的可执行文件需 chmod +x，未设执行位导致 configure 失败"
- "GnuTLS/zlib 是 waf configure 的强制依赖，需通过 conan 注入 PKG_CONFIG_PATH"
- "OHOS HAP 沙箱全量 selftest 判定环境受限（root/能力集）：/proc/self/status 实测 CapBnd=0，setuid/sudo 无法获得能力集（setuid exec 授 euid=0 但 CapEff=0），smbd 默认端口 445 内核按能力集（CAP_NET_BIND_SERVICE）而非 uid 检查，uid wrapper 提权（setresuid(0,0,0)）被空限界集挡死；upstream CI 以 root 运行，非 OHOS 适配层引入"
- "waf python 交叉编译环境变量旁路（PYTHON_VERSION/PYTAG/pyext_PATTERN(%s 模板)/PYTHON_PYEXT_LDFLAGS/PYTHON_PYEMBED_LDFLAGS）可避免 python3-config --ldflags --embed 输出 -lintl -ldl（OHOS/musl 无 libintl，ld.lld: unable to find library -lintl 实测）"
- "samba 构建树纯 python 全量复制到 bin/python/samba/ 并同置 86 个扩展 .so 构成完整 samba 包；测试期 PYTHONPATH 必须 bin/python 置前（源码目录 python/ 包在路径扫描中胜出但无 .so → samba.param ModuleNotFoundError 实测）"

