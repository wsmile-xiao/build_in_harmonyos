software: seexpr
display: "SeExpr"
description: "Disney/Pixar 嵌入式表达式语言库（程序化图形）"
category: gfx
homepage: "https://github.com/wdas/SeExpr"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "ENABLE_SSE4=OFF（aarch64 无 SSE4.1，Noise.cpp 走便携路径）"
    - "CMake 无 Platform/HarmonyOS 模块，需 toolchain 层补 DT_SONAME"
    - "parser 需 flex/bison 构建期重新生成（tarball 不含预生成文件）"
    - "gtest 1.17 需 C++14+，上游 -std=c++11 需补丁提升"
  common_dependencies: []

versions:
  "3.0.1":
    status: built
    build_date: "2026-09-21"
    conan_ref: "seexpr/3.0.1"
