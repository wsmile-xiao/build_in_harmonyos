# test_package/MANIFEST.yml
# Test declaration for Conan L1 consumer test.

package: seexpr/3.0.1
homepage: "https://github.com/wdas/SeExpr"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error --timeout 300 -E '^BlockTests$' + testmain2 --gtest_filter=BasicTests.*"

# 统一计数口径：gtest TEST 宏/case 级（与赛事审查实测口径一致，全量 36）；
# 独立测试程序/脚本各按 1 个可判定成败的场景计；鸿蒙特有测试按独立检查项计。
upstream_tests:
  - file: basic.cpp
    source: "src/tests/basic.cpp (ctest 'basic')"
    description: "gtest BasicTests 12 cases"
    command: "testmain2 --gtest_filter=BasicTests.*"
    status: "built-and-run-in-build"
  - file: string.cpp
    source: "src/tests/string.cpp (ctest 'string', 补丁 0002 补注册)"
    description: "gtest StringTests 5 cases（上游编译进 testmain2 但未注册 ctest）"
    command: "testmain2 --gtest_filter=StringTests.*"
    status: "wired-by-patch-0002"
  - file: imageTests.cpp
    source: "src/tests/imageTests.cpp (ctest 'imagetest', 补丁 0002 补注册 + 0003 输出改 cwd)"
    description: "gtest perf.noexpr 1 case（上游未注册；原硬编码写 /tmp/ka.png，OHOS /tmp 只读 E002）"
    command: "testmain2 --gtest_filter=perf.noexpr"
    status: "wired-by-patch-0002"
  - file: typeTests.cpp
    source: "src/tests/typeTests.cpp (ctest 'typeTests', 孤儿套件由补丁 0002 接入，0004/0005 修复支撑代码)"
    description: "gtest TypeTests 17 cases（上游 CMake 从不引用该文件）"
    command: "typeTests"
    status: "wired-by-patch-0002"
  - file: multiTests.cpp
    source: "src/tests/multiTests.cpp (ctest 'multiTests', 孤儿套件由补丁 0002 接入)"
    description: "gtest MultiTests 1 case（上游 CMake 从不引用该文件，需 gmock）"
    command: "multiTests"
    status: "wired-by-patch-0002"
  - file: dirtSimple.cpp
    source: "src/tests/dirtSimple.cpp"
    description: "Standalone end-to-end expression eval program (ctest 'dirtSimple')"
    command: "dirtSimple"
    status: "built-and-run-in-build"
  - file: BlockTests.cpp
    source: "src/tests/BlockTests.cpp"
    description: "VarBlock evaluation via LLVM JIT only; excluded from ctest (-E '^BlockTests$') because ENABLE_LLVM_BACKEND=OFF makes upstream throw 'LLVM is not enabled in build' by design"
    command: "BlockTests"
    status: "excluded-needs-llvm-backend"
  - file: imageTestsReportNew.py
    source: "src/tests/imageTestsReportNew.py (ctest 'imageTestsReport')"
    description: "Image regression report; soft-skip by upstream design when RP_SeExpr/RP_seexpr2 env unset (exit 0)"
    command: "python imageTestsReportNew.py runall"
    status: "soft-skip-upstream-design"
  - file: basicPython.py
    source: "src/tests/basicPython.py (ctest 'basicPython')"
    description: "Python binding tests; soft-skip by upstream design when SeExprPy module missing (USE_PYTHON=OFF)"
    command: "python basicPython.py"
    status: "soft-skip-upstream-design"
  # 不运行项：VarBlockExample（上游仅 ENABLE_SLOW_TESTS=ON 注册，默认 OFF）；
  # TypePrinter.cpp 为独立 main 调试工具（非测试）。

test_package_tests:
  - file: test.cpp
    description: "A3 HarmonyOS-specific: consumer links packaged libSeExpr2 and evaluates expressions incl. noise() on the portable non-SSE4.1 path (determinism + [0,1] range)"
    command: "./test_seexpr"
  - file: conanfile.py (test)
    description: "A1/A2 HarmonyOS-specific: packaged libSeExpr2.so is ELF64 AArch64 with DT_SONAME=libSeExpr2.so"
    command: "python ELF inspection in test() (no external tools)"

assertion_count: 7
