sources:
  url:
    - "https://gh-proxy.com/https://github.com/wdas/SeExpr/archive/refs/tags/v3.0.1.tar.gz"
    - "https://github.com/wdas/SeExpr/archive/refs/tags/v3.0.1.tar.gz"
  sha256: "1e4cd35e6d63bd3443e1bffe723dbae91334c2c94a84cc590ea8f1886f96f84e"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Raise -std=c++11 to -std=c++17 so the gtest 1.17 test suite compiles (std::make_index_sequence requires C++14+)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-tests-CMakeLists.txt.patch"
    patch_description: "Wire orphan upstream gtest suites into ctest: register StringTests/perf.noexpr entries of testmain2 and build+register typeTests (17 cases) and multiTests (1 case) which upstream never adds to the build"
    patch_type: "portability"
  - patch_file: "patches/0003-src-tests-imageTests.cpp.patch"
    patch_description: "Add missing #include <libgen.h> for basename() (musl/OHOS has no transitive declaration); write perf.noexpr output to ka.png in cwd instead of /tmp/ka.png (OHOS /tmp is read-only, E002)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-tests-typeTests.cpp.patch"
    patch_description: "Fix include path: TypeIterator.h lives in src/tests/, not src/SeExpr2/"
    patch_type: "portability"
  - patch_file: "patches/0005-src-tests-TypeBuilder.h.patch"
    patch_description: "Fix stale test-support signature: ExprFuncX::prep takes ExprVarEnvBuilder& (not ExprVarEnv&) in v3.0.1, which left DummyFuncX abstract"
    patch_type: "portability"
