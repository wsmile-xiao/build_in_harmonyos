# conandata.yml -- sma 1.4：源码单一真相源（PF7/R39 取源定案）
#
# 2026-09-25 在 B 机实测的三方对撞（完整表见 notes.md）：
#   上游官方站发布页 https 200 仍在线，但**已不对外提供 tarball**：
#     download.html 全文只剩 1 枚 <a href>（Home），"Download the latest SMA
#     source code" 等条目的链接已丢失；发布页登记的 MD5
#     f7fc3f4fc16ae13f15cc6f3313c958a3 因此无从核对。
#     pkgsrc mail/sma/Makefile 记录的 MASTER_SITES 目录位（站点同名子路径）
#     对任何候选文件名一律 301 -> 站点首页（3310 B HTML，sha256 31fa9f24...），
#     即官方发布位失效。
#   Debian pool 的 .orig：121902 B，sha256 865042635a62e8f0fa08a1a536f163c74a267e507749139d6d6881bf6bdae476，
#     解包顶层目录被改名成 sma-1.4.orig/ ⇒ 属下游重打包，PF7 分类为
#     "Debian 下游重打包源"，不作为构建输入。
#   本配方采用 pkgsrc（NetBSD）distfile 缓存条目：它是按 pkgsrc Makefile 记录的
#     官方发布位原样抓取的上游原始 tar（pkgsrc 不重新打包），
#     121365 B，sha256 a5b5afbb2a8081f72a22e3dc4f2fe75e977d56883dd2466311fb16f3f07e30af，
#     解包顶层目录 sma-1.4/。
#   等价性证据：两棵解包树 `diff -rq` **零差异、rc=0**（逐文件同内容），
#     差异只在容器打包层 ⇒ 编译输入与 Debian 通道同一份源码。

sources:
  url: "https://ftp.netbsd.org/pub/pkgsrc/distfiles/sma-1.4.tar.gz"
  sha256: "a5b5afbb2a8081f72a22e3dc4f2fe75e977d56883dd2466311fb16f3f07e30af"

patches:
  "1.4":
    - patch_file: "patches/0001-sma.h-sma.c-globals-extern.patch"
      patch_type: portability
      patch_description: "OHOS portability: extern-ify the 93 sma.h tentative global definitions with one definition site in sma.c, per E491 :21"
      strip: 1

# 补丁只改全局符号的声明形态（编译期可移植性），不动上游任何功能逻辑；
