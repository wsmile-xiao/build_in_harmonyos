knowledge_gained:
  - "上游官方发布位失效时，pkgsrc distfile 缓存可按 MASTER_SITES 原样保存上游原始 tar；与 Debian .orig 重打包树 `diff -rq` 零差异即可换源，sha256 用官方缓存件自己的哈希"
  - "sma 的 regex/ 目录在非 Windows 平台是死代码（sma.h 走系统 <regex.h>），Makefile 里没有任何 -l 标志 ⇒ Conan requires 为空"
  - "上游 Makefile 把共享系统前缀烧进 BINDIR/MANDIR 且 install 目标依赖 ./install-sh；本机 install(1) 不可用 ⇒ 配方不跑 make install，package() 手工 copy"

