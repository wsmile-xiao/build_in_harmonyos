# test_package/MANIFEST.yml
# 上游官方测试声明 -- sma 1.4
#
# "六形"实测（全部在 B 机对 pkgsrc 缓存的上游原始 tar 解包树 $HOME/tmp/uc2/z32-sma/probe/sma-1.4 做过）：
#   1) tar 清单：无 tests/、无 t/、无 *_test.c / *_t.c；.c 只有 8 个产品源 + getopt.c
#      + regex/ 下 6 个 BSD 正则源码（sma.h 在非 Windows 平台走系统 <regex.h>，
#      这些文件不参与编译，只有 Makefile.w32/msvcp 才编它们）；
#   2) Makefile 目标：只有 sma / clean / install 三条，**无 test、无 check**；
#      Makefile.w32、Makefile.msvcp 同样无测试目标；
#   3) CI 文件：tar 内无 .github/、无 .gitlab-ci.yml、无 Makefile.am（非 autotools，
#      因而不存在 distcheck 这一类上游自检）；
#   4) 测试语料：无样例日志文件；docs/ 只有 sma.8/sma.txt/pdf/ps 与 re_format 手册，
#      sma.conf 是运行时配置不是用例；
#   5) 源码自测入口：无（-h 的选项表里没有 selftest/-t 之类的用例开关，
#      -t 是 hash table size）；
#   6) 那两枚脚本：contrib/spam-graph.pl 把报告喂给 R/gd 画月历图（依赖 perl + GD，
#      无断言、无退出码判定）；contrib/mailwrapper.sh 是 sendmail 包装示例（不产生判定）。
#      两者都不是上游用例，不计入分母。
# => 上游官方用例数 = 0：本包不存在"上游用例覆盖率"分母，全部断言由适配层提供。
#    （口径提醒：不得把上游 0 用例写成"覆盖全部上游用例"，也不得为凑分母编造用例。）

package: sma/1.4
homepage: "http://www.klake.org/sma/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "消费者视角往返断言：从 PATH 真跑已安装 sma，喂自造最小 sendmail 日志（2 个 envelope 发件人 / 2 个收件人 / Sent 与 User unknown 各 1），逐字回读报告抬头、Server、榜单条目与计数；覆盖 -h/-c/-C/-o/-p/-F/-f/-O 与 stdin 通道；对 -DUSE_REGEXP 的 ^ 锚点过滤器做正反两向断言（子串匹配无法复现，故可证伪）；末尾 A23 用换日志必换报告自检可证伪性"
    command: "bash test.sh"

# 断言总数：test.sh 内 25 个 ok()/bad() 判定点（标签 A1-A23，其中 A11、A17 各含 a/b 两项）
# 实测：B 机原生探针（同一份 clang E491:33 禁止的全局兼容旗标 构建出的 sma）25/25 PASS
# 同源口径：test_package/test.sh、本文件、1.4/notes.md 三处已对齐；
#           PR 正文与登记表的数字由主窗从提交态复取，必须同为 25。
assertion_count: 25
