# 软件级 manifest — sma
# 遵循 ARCHIVE-SPEC v2.0

software: sma
display: "SMA - Sendmail log analyser"
description: "纯 C 的 sendmail 日志分析器：把 sendmail syslog 转成 ASCII/HTML/clog 流量报告"
category: utility
homepage: "http://www.klake.org/sma/"
license: BSD-2-Clause

build_system: makefile

ohos_adaptation:
  key_points:
    - "裸 Makefile：无 configure/CMake，make -j1 一步出单文件 sma"
    - "Makefile 硬编码 CC=gcc，OHOS 镜像只有 clang ⇒ 构建时 make CC=<clang> 覆盖（R33）"
    - "上游把共享系统前缀烧进 BINDIR/MANDIR ⇒ 配方不跑 make install，package() 自己 copy 到 package_folder"
    - "上游 Makefile 无 -l 标志 ⇒ Conan requires 为空；正则走系统 <regex.h>"
    - "install(1) 在本机不可用（/bin/install 不可访问、PATH 无 install）⇒ 更不能用 ./install-sh 路线"
  common_dependencies: []

versions:
  "1.4":
    status: built
    build_date: "2026-09-25"

