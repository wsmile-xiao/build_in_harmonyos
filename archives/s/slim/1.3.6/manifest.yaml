software: slim
version: "1.3.6"
status: built
build_date: "2026-06-05"

source:
  url: "https://github.com/iwamatsu/slim/archive/refs/tags/v1.3.6.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DUSE_PAM=OFF"
    - "-DUSE_CONSOLEKIT=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DNEEDS_BASENAME_FOR_MUSL=ON"
    - "-DNO_SHADOW_SUPPORT=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - "libX11 (core headers + .so)"
    - "libXext"
    - "libfontconfig"
    - "libfreetype (static)"
    - "libjpeg"
    - "libpng"
    - "libz (static)"
    - "libpthread"
  cc: clang
  cxx: clang++

patches_applied:
  - 0001-musl_stub.cpp.patch
  - 0002-xft_stub.cpp.patch
  - 0003-xrandr_stub.cpp.patch
  - 0004-CMakeLists.txt.patch
  - 0005-app.cpp.patch
  - 0006-panel.cpp.patch
  - 0007-musl_stub.h.patch
  - 0008-image.h.patch
  - 0009-panel.h.patch

knowledge_gained:
  - "SLiM is an X11 login manager. Built with stubs for missing Xft, Xmu, Xrandr libraries"
  - "PAM disabled (not available). Shadow password support disabled (musl libc limited)"
  - "musl libc stubs for getusershell/setusershell/endusershell"
  - "CMAKE_SYSTEM_NAME=Linux override needed for FindX11 module to work"
  - "slimlock disabled (requires PAM)"