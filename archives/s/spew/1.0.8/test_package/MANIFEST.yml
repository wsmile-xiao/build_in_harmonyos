package: spew/1.0.8
homepage: "https://github.com/apatters/spew"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"
upstream_tests: []
upstream_test_absence_evidence: >
  The official 1.0.8 tag contains 85 files and no tests/ directory or test-named
  source. Root Makefile.am declares only SUBDIRS=src man etc; src/Makefile.am
  declares no TESTS, check_PROGRAMS, check_SCRIPTS, or test targets; configure.ac
  has no test framework registration. Therefore the complete upstream inventory
  is N_static=0. The recipe still runs make -j1 check and requires it to pass.

test_package_tests:
  - file: test.sh
    description: >
      Ten consumer assertions execute installed spew, gorge, and regorge.
      They verify version/help behavior, real write/read paths, successful data
      integrity, and rejection of deliberately corrupted data. The OHOS-specific
      test writes only below the private writable TMPDIR rather than read-only
      /tmp, then validates size and both alias execution modes.
    command: "conan test"

assertion_count: 10
max_rss_mb: 256
