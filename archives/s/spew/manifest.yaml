software: spew
display: "spew I/O load generator"
description: "I/O performance measurement, load generation, and data integrity tool"
category: benchmark
homepage: "https://github.com/apatters/spew"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "Bootstraps the VCS tag with automake/1.18"
    - "Links the published popt and wide-character ncurses packages"
    - "Uses a private writable TMPDIR for OHOS integrity tests"
  common_dependencies:
    - popt
    - ncurses

versions:
  "1.0.8":
    status: built
    build_date: "2026-10-07"
    conan_ref: "spew/1.0.8"
