# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.0-3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0-3"

# 软件名
software: string_id

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/foonathan/string_id/archive/refs/tags/v2.0-3.tar.gz"

  # 源码校验和
  sha256: "4786198fa071a4e9b241368f7a54dca284c50f44e86ea0f481214549e5a9a9c9"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DFOONATHAN_STRING_ID_DATABASE=ON"
    - "-DFOONATHAN_STRING_ID_MULTITHREADED=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.1.2 requires CMAKE_POLICY_VERSION_MINIMUM=3.5 for the upstream CMakeLists.txt VERSION 2.8 declaration (reference: knowledge/graph/E187.kv)."
  - "The upstream project has no install rules or CTest entries; package() stages headers, generated config_impl.hpp, and the static library, while build() runs the official example smoke test (reference: knowledge/drafts/E321-draft-220E.kv)."
knowledge_ref:
  - "knowledge/graph/E187.kv"
  - "knowledge/drafts/E321-draft-220E.kv"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
