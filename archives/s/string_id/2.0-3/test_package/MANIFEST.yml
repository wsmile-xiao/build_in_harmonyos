# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: string_id/2.0-3
homepage: "https://github.com/foonathan/string_id"

# 上游 CMakeLists.txt 没有 enable_testing()/add_test()；配方直接调用 ctest
# 并返回 0，设备输出为 No tests were found!!!。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests: []

test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：覆盖数据库查找、哈希、编译期字面量、ID 比较、前缀和计数生成器"
    command: "./test_package"

# 5 个基础 string_id 检查 + 6 个 prefix/counter 检查。
assertion_count: 11
