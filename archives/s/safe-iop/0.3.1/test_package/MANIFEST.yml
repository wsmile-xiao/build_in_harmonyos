package: safe-iop/0.3.1
homepage: "https://code.google.com/archive/p/safe-iop/"

upstream_check_command: "make test"
upstream_tests_exist: true
upstream_test_audit: >
  The official 0.3.1 tarball has no separate tests directory. Its Makefile
  builds src/safe_iop.c with SAFE_IOP_TEST and runs safe_iop_test. The main
  function registers 73 test groups and the runtime summary reports 459
  EXPECT_TRUE/EXPECT_FALSE assertions. The recipe runs this unmodified target
  natively and rejects any result other than 73/73 groups and 459/459 assertions.

upstream_test_in_build: true
upstream_test_command: "make test CC=<Conan compiler> CFLAGS=-Wall -O2 -Iinclude"

upstream_tests:
  - file: src/safe_iop.c
    source: safe-iop-0.3.1/src/safe_iop.c
    description: "73 upstream groups covering add/subtract/multiply/divide/modulo across signed and unsigned integer widths"
    command: "make test"

test_package_tests:
  - file: test_safe_iop.c
    description: "Linked consumer test with 12 checks across the macro API and safe_iopf"
    command: "./test_safe_iop"
  - file: test_safe_iop_ohos.c
    description: "HarmonyOS-specific AArch64 LP64 and integer-boundary test with 5 checks"
    command: "./test_safe_iop_ohos"

upstream_test_case_count: 73
harmony_specific_test_count: 1
assertion_count: 476
