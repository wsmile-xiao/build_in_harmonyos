# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: stb_ds/0.67
homepage: "https://github.com/nothings/stb"

# 上游测试命令 (上游 Makefile 的 all 目标不编译测试，测试为手动编译运行)
upstream_check_command: "make"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_ds.c
    source: stb_ds-0.67/tests/test_ds.c
    description: "上游单元测试（DS_TEST 模式）：STBDS_UNIT_TESTS 全量单元测试（数组/哈希表/字符串哈希/结构体 key）+ STBDS_SMALL_BUCKET 配置 + 8 组 churn 插入删除压力测试（最大 5 万次循环）"
    command: "./test_ds"
  - file: test_ds_cpp.cpp
    source: stb_ds-0.67/tests/test_ds_cpp.cpp
    description: "上游 C++ 模式单元测试（DS_TEST）：STBDS_UNIT_TESTS 全量单元测试 + 8 组 churn 插入删除压力测试（最大 5 万次循环）"
    command: "./test_ds_cpp"
  - file: test_ds.c (DS_STATS)
    source: stb_ds-0.67/tests/test_ds.c
    description: "上游统计模式（DS_STATS）：STBDS_STATISTICS 探针统计（8 组 500000 项插入/删除统计，max/avg 探针数输出）"
    command: "./test_ds_stats"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：实际调用 stb_ds API（arrput/arrlen/arrfree、hmput/hmget/hmlen/hmfree、shput/shget/shlen/shfree）验证头文件可用性"
    command: "./test_stb_ds"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2000
