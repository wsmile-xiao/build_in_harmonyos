# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（单头文件库，无构建系统，conan 直接打包头文件）
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无需补丁：stb_ds.h 与上游 v0.67 完全一致）
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "stb_ds 为单头文件库（header-only），conanfile.py 使用 package_type=header-library + no_copy_source，无需构建步骤" # ref: notes.md
  - "上游 STBDS_ADDRESSOF 宏在 clang C 模式（literal array 路径）下对数组 key 有固有限制（上游注释自认 broken for clang），test_ds.c 以 C++ 模式编译运行全部通过" # ref: notes.md
  - "上游 Makefile all 目标不编译 test_ds.c（上游 CI 仅跑 OSS-Fuzz），clang 下测试从未暴露" # ref: notes.md
  - "conan 2 的 get() 默认 strip_root=False，GitHub archive 下载需显式 strip_root=True" # ref: notes.md
