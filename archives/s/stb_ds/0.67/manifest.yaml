# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.67"

# 软件名
software: "stb_ds"

# 编译状态（本地 W3 验证通过，CI 未 upload → built）
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-31"
build_system: "header-only"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/nothings/stb/archive/2c980bb59875b0d32144a71867fbdebb2f77cd20.tar.gz"

  # 源码校验和
  sha256: "9a955b1b49a4410088a2e0ee2a9c057c3c907d0c1d75454144cb980aca0ba515"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
