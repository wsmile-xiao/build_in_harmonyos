software: sleuthkit
# 软件级 manifest 模板
# 文件位置: archives/s/sleuthkit/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: sleuthkit

# 软件描述（一句话）
description: 数字取证工具集，用于分析磁盘和文件系统

# 软件分类
# filesystem | database | network | security | utility | library | tool
category: security

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（按时间倒序）
versions:
  - version: "4.12.1"
    status: published
    build_date: "2026-05-25"
    tarball: "sleuthkit-4.12.1-aarch64-linux-gnu.tar.gz"

# ============================================================
# 源码信息
# ============================================================

# 官方源码仓库
homepage: "https://www.sleuthkit.org/"

# 源码下载模式
# github | gitlab | savannah | custom
source_type: github

# ============================================================
# 编译信息
# ============================================================

# 构建系统类型
build_system: autotools

# 编译依赖列表
dependencies: []

# ============================================================
# 备注
# ============================================================

# 特殊说明
notes: |
  sleuthkit 是一套数字取证工具，用于分析磁盘映像和文件系统。
  包含 fls, mmls, icat, blkcat 等工具。
  编译时需注意移除 -Werror 标志。