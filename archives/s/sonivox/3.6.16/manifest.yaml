# 版本级 manifest
# 文件位置: archives/s/sonivox/3.6.16/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.6.16"

# 软件名
software: "sonivox"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档，R39）
  url: "https://github.com/pedrolcl/sonivox/archive/refs/tags/v3.6.16.tar.gz"

  # 源码校验和（设备端 sha256sum 复核）
  sha256: "8e9adf39a5e60c5b9ce4d1b79c83680cfab97d6e8eec6ffb6a3d0bad41413531"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "BUILD_TESTING=OFF"          # 交付构建自包含：上游测试 configure 期需联网取 GTest + 81MB DLS
    - "BUILD_EXAMPLE=ON"           # 产出 sonivoxrender CLI（commands.json 已声明）
    - "BUILD_MANPAGE=OFF"
    - "BUILD_SONIVOX_STATIC=ON"    # default shared=False
    - "BUILD_SONIVOX_SHARED=OFF"
    - "USE_44KHZ=ON"               # 上游默认：44100 Hz 输出
    - "USE_16BITS_SAMPLES=ON"      # 上游默认
    - "NEW_HOST_WRAPPER=ON"        # 上游默认：CRT 主机包装
    - "MAX_VOICES=64"              # 上游默认

  # 编译依赖列表（格式: name/version）；运行期无 conan 依赖（仅 libm）
  dependencies: []
  tool_dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零补丁：上游源码在 OHOS clang 15 下原样编译）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake 4.4.3 对 CMAKE_SYSTEM_NAME=OHOS 无 platform module（提示 HarmonyOS 未知），但不影响 sonivox 构建：test_big_endian/find_library(m)/configure_file 等均按通用 Unix 路径工作，无需补丁或 -D 绕过（知识库 E092 预扫描命中）。"
  - "上游测试套件（GoogleTest）configure 期 file(DOWNLOAD) 拉取 81MB DLS 音色库并校验 size+MD5：交付 conanfile 必须 BUILD_TESTING=OFF 保持自包含；上游测试以独立构建树（TEMP 指向 DLS 目录 + 本地 GTest/1.17.0）在真机原样运行，33/33 通过。"
  - "sonivoxrender 的 --version/--help 上游实现返回 EXIT_FAILURE(1)（sonivoxrender.c 的 case 'v'/'h' 直接 return EXIT_FAILURE）：CI L2 smoke 判 non-blocking warn，本适配不改动上游行为。"
  - "NEW_HOST_WRAPPER=ON 时 EAS_HWCloseFile 仅在 file->own 为真时 fclose（locator 打开的文件 own=EAS_FALSE）：消费者需自行 fclose，EAS_CloseFile 不接管句柄（test_package 已固化该契约）。"
