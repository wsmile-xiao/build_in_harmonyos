# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）+ R51 上游测试三步法证据
#
# 清点（一）: 上游 v3.6.16 归档自带 CMake+GoogleTest 测试套件
#   test/SonivoxTest.cpp：3 个 TEST_P（DecodeTest / SeekTest /
#   DecodePauseResumeTest），INSTANTIATE_TEST_SUITE_P 注册 11 组参数
#   （5 组不带音色库 + 6 组加载 DLS soundfont），gtest_discover_tests
#   展开为 33 个 ctest 用例；测试资源为 test/res/ 下 5 个 MIDI 文件。
#   configure 期会下载 81MB Airfont_340.dls 到 $TEMP/soundfont.dls 并校验
#   size=81362584 / MD5=40c0cd4ad29ae411a8fc3d6681002a2b。
#
# 实测（二）: 2026-09-21 于鸿蒙 PC（aarch64, HarmonyOS 6.1.0.117）使用
#   OHOS SDK clang 15.0.4 独立构建 BUILD_TESTING=ON 后在真机执行 ctest，
#   33/33 通过（DLS 依据上游 CMake 的 size+MD5 校验加载）。
#
# 说明（三）: conanfile.py 交付构建固定 BUILD_TESTING=OFF —— configure 期
#   需要联网拉取 GoogleTest 与 81MB DLS，会使 `conan create` 非自包含；
#   上游测试改为在适配验证阶段独立构建运行，结果如实回填（见 notes.md、
#   reports/test-report.md）。test_package 为消费者视角回归测试。

package: sonivox/3.6.16
homepage: "https://github.com/pedrolcl/sonivox"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/SonivoxTest.cpp
    source: sonivox-3.6.16/test/SonivoxTest.cpp
    description: "GoogleTest 参数化套件：3 个 TEST_P × 11 组参数 = 33 个 ctest 用例（Decode/Seek/PauseResume；含 6 组 DLS 音色库加载）"
    command: "ctest --output-on-failure  # BUILD_TESTING=ON 独立构建（33 用例）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 API 测试：EAS_Config 版本/采样率/声道断言、生成 SMF 渲染帧数与非静音校验、坏文件负例（19 项断言）"
    command: "./test_sonivox"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 19
