# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.1"

# 软件名
software: sciplot

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sciplot/sciplot/archive/refs/tags/v0.3.1.tar.gz"

  # 源码校验和
  sha256: "d5f8fa7783920c0db4f54d8d9cea8a5e50be99153e81dcaccf91532994ebbad0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DSCIPLOT_BUILD_TESTS=ON"
  - "-DSCIPLOT_BUILD_EXAMPLES=OFF"
  - "-DSCIPLOT_BUILD_DOCS=OFF"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "sciplot 为 header-only CMake 库（INTERFACE target，无第三方依赖）；配方用 CMakeToolchain + SCIPLOT_BUILD_TESTS=ON 保持上游 Catch2 测试随包编译运行"
- "上游 tests/testing-project 声明 cmake_minimum_required(VERSION 3.0)，CMake 4.x 直接拒绝 <3.5 兼容；在 generate() 设 CMAKE_POLICY_VERSION_MINIMUM=3.5 放行"
- "上游测试用 add_custom_target(tests) 而非 CTest 注册，cmake.test() 会找不存在的 test 目标；配方 build() 直接运行 tests/sciplot-cpptests 二进制"
- "Canvas::save()/saveplotdata() 在无 gnuplot 环境仍会生成 .plt 脚本与 .dat 数据文件；消费者/专项测试以脚本与数据文件内容为可观察结果"
