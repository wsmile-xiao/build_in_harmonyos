# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sciplot/0.3.1
homepage: "https://sciplot.github.io"

# 上游测试命令 (CMake 项目: cmake --build + 测试二进制 sciplot-cpptests)
upstream_check_command: "ctest -N && ./tests/sciplot-cpptests"

# conanfile.py build() 方法中是否已集成上游测试 (SCIPLOT_BUILD_TESTS=ON + cmake.test())
upstream_test_in_build: true
upstream_test_command: "cmake --build . && ctest --output-on-failure"

# 上游实际运行的测试程序 (Catch2 测试二进制，24 个 TEST_CASE / 180 assertions)
upstream_tests:
  - file: sciplot.test.cxx
    source: sciplot-0.3.1/tests/sciplot.test.cxx
    description: "上游 Catch2 测试入口 (plotting tests)，含全部 24 个 TEST_CASE 的注册"
    command: "./tests/sciplot-cpptests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 公开 API Plot2D::drawCurve + Canvas::save 生成数据文件并校验内容"
    command: "./test_sciplot"

# 测试断言总数 (上游 180 assertions + 消费者测试 4 项产物断言)
assertion_count: 184
