# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.9.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9.5"

# 软件名
software: "srs-state"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-08"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ossrs/state-threads/archive/refs/tags/v1.9.5.tar.gz"

  # 源码校验和
  sha256: "1fb10632fd047f7b274845e4047ea1e3379dbdf430c58fe3fe910b81c742d030"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS uname -r 返回含空格字符串，state-threads Makefile 的 TARGETDIR=LINUX_$(shell uname -r)_$(BUILD) 模式规则失效，须命令行覆盖 TARGETDIR (ref: archives/s/srs-state/1.9.5/notes.md)"
  - "clang driver 不识别 GNU ld 裸 -soname= 语法，纯 Makefile 共享库链接须改写为 -Wl,-soname (ref: archives/s/srs-state/1.9.5/notes.md)"
  - "Makefile 以无操作符方式调用 $(RANLIB) $@ 时不能用 llvm-ar（要求显式操作符），须用 ranlib 或 llvm-ranlib (ref: archives/s/srs-state/1.9.5/notes.md)"
