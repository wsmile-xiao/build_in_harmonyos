# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试来源: srs-state-threads v1.9.5 自带的 utest/ 目录
# (bundled gtest-fit, Makefile 目标 linux-debug-utest, 运行 ./obj/st_utest)

package: srs-state/1.9.5
homepage: "https://github.com/ossrs/state-threads/"

# 上游测试命令 (make -n 分析: linux-debug-utest 构建 libst.a + utest/ 下 gtest)
upstream_check_command: "make linux-debug-utest && ./obj/st_utest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./obj/st_utest"

# 上游实际运行的测试程序 (7 用例 / 25 断言, 全部通过)
upstream_tests:
  - file: utest/st_utest.cpp
    source: srs-state-1.9.5/utest/st_utest.cpp
    description: "SampleTest.ExampleIntSizeTest — st 环基础样例"
    command: "./obj/st_utest"
  - file: utest/st_utest_coroutines.cpp
    source: srs-state-1.9.5/utest/st_utest_coroutines.cpp
    description: "CoroutineTest.StartCoroutine/StartCoroutineX3/StartCoroutineAdd/StartCoroutineAddX3/StartCoroutineParams — 协程创建与调度 (5 用例)"
    command: "./obj/st_utest"
  - file: utest/st_utest_tcp.cpp
    source: srs-state-1.9.5/utest/st_utest_tcp.cpp
    description: "TcpTest.TcpConnection — st 协程内 TCP 连接"
    command: "./obj/st_utest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "通用消费者测试: st_init/协程创建/Join/参数传递/协作式调度"
    command: "./test_srs_state"
  - file: test_srs_state_ohos.c
    description: "HarmonyOS AArch64 消费者测试 (consumer.ohos): 平台 ABI 断言 + 协程调度 + 单调时钟"
    command: "./test_srs_state_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
