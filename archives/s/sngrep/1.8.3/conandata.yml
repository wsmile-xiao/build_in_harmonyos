# conandata.yml — sngrep 1.8.3
# 上游官方 GitHub archive（R39/PF7）
# sha256 实测：codeload.github.com 官方入口下载同源 tarball（DS-9 2026-09-21）
sources:
  url: "https://github.com/irontec/sngrep/archive/refs/tags/v1.8.3.tar.gz"
  sha256: "794224f4cd08978a6115a767e9945f756fdf7cbc7c1a34eabca293e0293b21b8"

patches:
  - patch_file: "patches/0003-configure.ac.patch"
    patch_description: "a) libgcrypt 检测去 pkg-config 化（工具链缺 pkg.m4 时未守卫的 PKG_CHECK_MODULES 字面残留致 configure 解析期语法错，--without-gnutls 亦不可规避）；b) 补 pthread_cancel 存在性探测（OHOS musl 不提供，供 capture.c 兼容守卫）"
    patch_type: "portability"
  - patch_file: "patches/0004-src-capture.c.patch"
    patch_description: "在不提供 pthread_cancel 的 libc 上以 no-op 兼容（线程关闭已由 pcap_breakloop 协同完成）"
    patch_type: "portability"
  - patch_file: "patches/0001-INSTALL.patch"
    patch_description: "autoreconf -fi 对上游自带 INSTALL 的版本更新（生成物随自举刷新，无语义变化）"
    patch_type: "portability"
  - patch_file: "patches/0002-compile.patch"
    patch_description: "autoreconf -fi 对上游自带 compile 脚本的版本更新（生成物随自举刷新，无语义变化）"
    patch_type: "portability"
  - patch_file: "patches/0005-autotools-generated.patch"
    patch_description: "自举生成物入库（configure/aclocal.m4/Makefile.in×4/depcomp/missing/install-sh/test-driver）：CI worker 缺 automake(aclocal) 无法 autoreconf -fi，本地自举（autoconf/automake 2.72 工具链）后以补丁形态入库，build() 仅恢复执行位；生成物为纯 autotools 产物、无手工语义改动"
    patch_type: "portability"
