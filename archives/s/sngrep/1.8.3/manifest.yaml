  sha256: "794224f4cd08978a6115a767e9945f756fdf7cbc7c1a34eabca293e0293b21b8"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-unicode"
    - "--without-gnutls"
    - "--without-openssl"
    - "--without-pcre"
    - "--without-pcre2"
    - "--without-zlib"
    - "--disable-eep"
    - "--disable-logo"
  dependencies:
