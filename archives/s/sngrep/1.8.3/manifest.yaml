  cxx: clang++

patches_applied:
  - "0001-INSTALL.patch"
  - "0002-compile.patch"
  - "0003-configure.ac.patch"
  - "0004-src-capture.c.patch"
  - "0005-autotools-generated.patch"

knowledge_gained:
  - "autotools 项目 tarball 无 configure 时在配方 build() 内 autoreconf -fi 自举；E011/E114 两处 umask 077 包裹需在自举后去除（HMDFS 下 config.status 临时目录不可写）"
  - "工具链缺 pkg.m4 时 configure.ac 中未守卫的 PKG_CHECK_MODULES 调用会字面残留导致 configure 解析期语法错（--without-* 不可规避）：标准解法为拷 pkg.m4 进 m4/，本包改为纯 AC_CHECK_LIB 简化该探测（见 DRAFT-sngrep-1.8.3-pkg-m4-missing-parse-error）"
  - "CI worker 只有 autoconf 没有 automake（aclocal 缺失）⇒ 配方内 autoreconf -fi 必挂且本地设备不可复现：自举生成物（configure/aclocal.m4/Makefile.in 等）在本地自举后以补丁入库、build() 只 chmod 恢复执行位（仓内其它配方均不自举，本条为首例）"
  - "OHOS musl 无 pthread_cancel：AC_CHECK_FUNCS 探测 + HAVE_PTHREAD_CANCEL 守卫的 no-op 兼容（线程关闭已由 pcap_breakloop 协同完成）"

