version: "1.8.3"
software: "sngrep"

# conan-verify：G0-G3 PASS，G4 PASS 带告警，L2/L4/L5 框架口径 PASS（实为跳过：无 cache 路径）；
# 制品上传由 release 流水线完成后才允许标 published
status: built

build_date: "2026-09-21"
