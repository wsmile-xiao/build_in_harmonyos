# test_package/MANIFEST.yml — sngrep/1.8.3
package: sngrep/1.8.3
homepage: "https://github.com/irontec/sngrep"

# 上游测试命令（tests/Makefile.am: TESTS = $(check_PROGRAMS)，autotools make check 驱动）
upstream_check_command: "make check（TESTS=test-001..test-011 共 11 个程序）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "Autotools.make(target=\"check\")（11/11 全过，见 notes.md 账本）"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_001.c
    source: sngrep-1.8.3/tests/test_001.c
    description: "test-001：基本文件读取冒烟"
    command: "make check（test-001）"
  - file: tests/test_002.c
    source: sngrep-1.8.3/tests/test_002.c
    description: "test-002：基本输入冒烟"
    command: "make check（test-002）"
  - file: tests/test_003.c
    source: sngrep-1.8.3/tests/test_003.c
    description: "test-003：冒烟"
    command: "make check（test-003）"
  - file: tests/test_004.c
    source: sngrep-1.8.3/tests/test_004.c
    description: "test-004：冒烟"
    command: "make check（test-004）"
  - file: tests/test_005.c
    source: sngrep-1.8.3/tests/test_005.c
    description: "test-005：冒烟"
    command: "make check（test-005）"
  - file: tests/test_006.c
    source: sngrep-1.8.3/tests/test_006.c
    description: "test-006：冒烟"
    command: "make check（test-006）"
  - file: tests/test_007.c
    source: sngrep-1.8.3/tests/test_007.c
    description: "test-007：vector 数据结构（10 断言）"
    command: "make check（test-007）"
  - file: tests/test_008.c
    source: sngrep-1.8.3/tests/test_008.c
    description: "test-008：冒烟"
    command: "make check（test-008）"
  - file: tests/test_009.c
    source: sngrep-1.8.3/tests/test_009.c
    description: "test-009：冒烟"
    command: "make check（test-009）"
  - file: tests/test_010.c
    source: sngrep-1.8.3/tests/test_010.c
    description: "test-010：hash 数据结构（8 断言）"
    command: "make check（test-010）"
  - file: tests/test_011.c
    source: sngrep-1.8.3/tests/test_011.c
    description: "test-011：冒烟"
    command: "make check（test-011）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_smoke.sh
    description: "消费者测试（真实执行被测包安装的 sngrep 二进制）：① --version 退出 0 且输出含 1.8.3；② --help 退出 0 且含 Usage；③ 功能断言：`-N -I` 解析运行期解码还原的真实 SIP pcap（ipip.pcap.b64 文本入仓、二进制不入仓——平台 git-am checkout 缺 --binary），断言输出含 `Dialog count: 1`（SIP 流重建核心能力）"
    command: "sh test_package/test_smoke.sh <sngrep> <workdir> <ipip.pcap>（conanfile.py test() 经 conanrun 环境调用）"

# 消费者测试被测二进制内存预算（AGENTS §14.1④：本机实测 maxrss≈5.7MB，
# 取 8 倍余量作硬预算；该断言只喂 3.1KB 小 pcap，不构成整机内存风险）
max_rss_mb: 64

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
