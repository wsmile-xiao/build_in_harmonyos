# samtools 1.21 test manifest
package: samtools/1.21
homepage: "https://www.htslib.org/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check CC=/data/service/hnp/bin/clang AR=/data/service/hnp/bin/llvm-ar RANLIB=/data/service/hnp/bin/llvm-ranlib"
upstream_tests:
  source_tree: "samtools-1.21/test/ and samtools-1.21/htslib-1.21/test/"
  test_programs: 951
  passed: 920
  expected_failures: 31
  unexpected_failures: 0
  harness_result: pass
  pass_rate_including_expected_failures: "100%"
  strict_assertion_pass_rate: "96.74% (920/951; 31 expected failures are part of upstream semantics)"
  result: "PASS: 951 test cases completed; 920 passed and 31 expected failures"
  command: "LD_LIBRARY_PATH=<Conan dependency libdirs> make check CC=/data/service/hnp/bin/clang AR=/data/service/hnp/bin/llvm-ar RANLIB=/data/service/hnp/bin/llvm-ranlib"
  notes:
    - "The first invocation without Conan tool variables attempted to use unavailable gcc and was not counted."
    - "The final invocation inherited Conan dependency library directories so OHOS could resolve libcurl.so."

upstream_test_files:
  - file: test/test.c
    description: "samtools core test harness"
  - file: test/merge/test_bam_translate.c
    description: "BAM translation"
  - file: test/split/test_count_rg.c
    description: "split read-group counting"
  - file: test/vcf-miniview.c
    description: "VCF mini viewer"
  - file: "htslib-1.21/test/*.c"
    description: "bundled htslib upstream tests"

test_package_tests:
  assertion_count: 10
  result: "PASS: 10/10"
  command: "./test_samtools <packaged-samtools-path>"
  tests:
    - "samtools --version reports 1.21"
    - "samtools --help exits successfully"
    - "samtools view -h reads SAM headers and records"
    - "samtools view -b converts SAM to BAM"
    - "samtools view -c counts two records"
    - "samtools sort creates a sorted BAM"
    - "samtools index creates a BAI index"
    - "samtools flagstat reports total reads"
    - "samtools quickcheck accepts the sorted BAM"
    - "samtools faidx extracts chr1:1-5"
  ohos_specific:
    - "temporary fixtures use TMPDIR rather than read-only /tmp"
    - "VirtualRunEnv exports Conan dependency libdirs through LD_LIBRARY_PATH"
    - "packaged executable resolves libcurl and other bundled htslib dependencies"
