software: samtools
version: "1.21"
status: published
build_system: autotools
build_date: "2026-06-15"

source:
  url: "https://github.com/samtools/samtools/releases/download/1.21/samtools-1.21.tar.bz2"
  sha256: "05724b083a6b6f0305fcae5243a056cc36cf826309c3cb9347a6b89ee3fc5ada"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--host=aarch64-linux-gnu"
    - "--build=aarch64-linux-gnu"
  dependencies:
    - zlib/1.3.1
    - bzip2/1.0.8
    - ncurses/6.4
    - curl/8.19.0
    - openssl/1.1.1w
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "config.guess in bundled htslib-1.21 doesn't recognize HarmonyOS; use --host=aarch64-linux-gnu --build=aarch64-linux-gnu"
  - "Bundled htslib-1.21 compiles successfully with configure flags"
  - "libcrypto version conflict warning (libcrypto.so.1.1 vs .3) - harmless linker warning"
