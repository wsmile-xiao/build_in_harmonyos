software: snapcast
build_system: cmake
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.35.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.35.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/snapcast/snapcast/archive/refs/tags/v0.35.0.tar.gz"

  # 源码校验和
  sha256: "cb75a71479bf52910bf5f47ae8120ec41c89459b0d77d7cd560e674e437ef050"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_WITH_AVAHI=OFF"
    - "-DBUILD_WITH_ALSA=ON"
    - "-DBUILD_WITH_FLAC=ON"
    - "-DBUILD_WITH_VORBIS=ON"
    - "-DBUILD_WITH_TREMOR=OFF"
    - "-DBUILD_WITH_OPUS=ON"
    - "-DBUILD_WITH_EXPAT=ON"
    - "-DBUILD_WITH_SSL=ON"
    - "-DBUILD_WITH_PULSE=OFF"
    - "-DBUILD_WITH_JACK=OFF"
    - "-DBUILD_WITH_PIPEWIRE=OFF"
    - "-DBUILD_WITH_SDL2=OFF"
    - "-DBUILD_TESTS=OFF"
    - "-DWERROR=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_STATIC_LIBS=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - alsa-lib/1.2.16.1
    - boost/1.84.0
    - flac/1.4.3
    - libogg/1.3.6
    - libvorbis/1.3.7
    - opus/1.5.2.1
    - libsoxr/0.1.3
    - openssl/1.1.1w
    - expat/2.8.2.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-common-CMakeLists.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenHarmony musl libc 缺少 pthread_setcancelstate，需要提供 stub 声明+实现"
  - "Boost 1.84 sp_thread_sleep.hpp 在 HarmonyOS 上因 pthread_setcancelstate 编译失败"
  - "Avahi client library not available in OHOS Conan registry - BUILD_WITH_AVAHI=OFF"
  - "Tremor not available - BUILD_WITH_TREMOR=OFF (libvorbis provides Vorbis support)"
  - "CMAKE_SYSTEM_NAME 在 HarmonyOS 上为 'HarmonyOS'"
  - "需 -include 强制注入 ohos_compat.h 解决 Boost inline 代码编译问题"
  - "Conan CMakeDeps generates openssl::openssl target but snapcast uses OpenSSL::SSL/OpenSSL::Crypto - needs alias"
  - "pkg_search_module ALSA_LIBRARIES doesn't include -L path - need LIBRARY_PATH env var fix"
  - "libogg version conflict: flac pins 1.3.5, libvorbis pins 1.3.6 - resolved with override=True"

patch_generation:
  method: per-file-difflib
  generated_at: '2026-08-25'
  patches_count: 2

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-common-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'pending'
