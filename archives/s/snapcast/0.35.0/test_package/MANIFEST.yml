test_type: binary
upstream_test: true
description: |
  Tests snapserver and snapclient binaries by running them with --version flag.
  Verifies that both executables are built correctly and report version 0.35.0.
  The test also verifies that the binaries can find their shared library dependencies
  (alsa-lib, flac, libvorbis, opus, libsoxr, etc.) at runtime.
