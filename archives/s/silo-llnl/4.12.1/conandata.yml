# conandata.yml — Silo 4.12.1
# 官方发布归档（GitHub Release）：Silo-4.12.1.tar.xz
# sha256 与 Spack/Debian 官方 recipe 一致：
#   spack   4.12.1 sha256=9fdf81303b8dc7fab941e365f4156fe48d0bb036cdfdcb59a7c2d218771576b6
#   Debian  silo-llnl_4.12.1.orig 同源
# 真机预检环境 github.com 直连超时（ConnectTimeoutError），复用 build_and_test.sh
# 已验证的镜像映射：gh-proxy.com 前置、官方 URL 兜底（sha256 不变）。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/llnl/Silo/releases/download/4.12.1/Silo-4.12.1.tar.xz"
    - "https://github.com/llnl/Silo/releases/download/4.12.1/Silo-4.12.1.tar.xz"
  sha256: "9fdf81303b8dc7fab941e365f4156fe48d0bb036cdfdcb59a7c2d218771576b6"

# 上游 tests/CMakeLists.txt 有三处把依赖已关闭功能（HDF5/browser）的测试注册在
# 对应 if() 守卫之外，导致 SILO_ENABLE_HDF5=OFF / SILO_ENABLE_BROWSER=OFF 配置下
# 这些测试仍被 ctest 注册并在运行时失败：
#   * test_mat_compression-basic / test_mat_compression-dense：其可执行文件默认
#     driver=DB_HDF5（test_mat_compression.c 第 162 行），输出名 .pdb 仅文件名，
#     实际仍走 HDF5 驱动；上游所有同族判例（*-basic-hdf5/*-dense-hdf5/*-gzip-hdf5/
#     *-zfp-hdf5）均已在 if(SILO_ENABLE_HDF5 AND HDF5_FOUND) 内，唯独这两个遗漏。
#   * testdtypes：shell 脚本无条件要求 silo 的 browser 工具（browser 不存在即
#     exit 1）；browser 由 SILO_ENABLE_BROWSER 控制。HDF5 关闭后该脚本本可仅用
#     PDB specmix 文件工作，但仍必须先有 browser。
# 补丁把这些用例移入与上游同款的 if() 守卫，使无 HDF5/无 browser 配置下注册的
# 测试集合与上游对该配置的设计一致（与其他 *-hdf5 用例同样：不注册、不计数）。

patches:
  "4.12.1":
    - patch_file: "patches/0001-gate-hdf5-browser-dependent-tests.patch"
      patch_description: "gate hdf5/browser-dependent tests for the no-HDF5/no-browser build config (align with upstream if() guards)"
      patch_type: "bugfix"
