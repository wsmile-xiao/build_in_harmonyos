# 版本级 manifest — silo-llnl 4.12.1
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 是 CI 唯一构建输入；本文件为交叉校验元数据）

version: "4.12.1"
software: "silo-llnl"

# 编译状态（适配中）
status: built
build_date: "2026-09-19"
build_system: cmake

# 源码信息
source:
  url:
    - "https://gh-proxy.com/https://github.com/llnl/Silo/releases/download/4.12.1/Silo-4.12.1.tar.xz"
    - "https://github.com/llnl/Silo/releases/download/4.12.1/Silo-4.12.1.tar.xz"
  sha256: "9fdf81303b8dc7fab941e365f4156fe48d0bb036cdfdcb59a7c2d218771576b6"
  tar_format: tar.xz

# 构建配置
build:
  system: cmake
  configure_options:
    - "-DSILO_ENABLE_HDF5=OFF"
    - "-DSILO_ENABLE_FORTRAN=OFF"
    - "-DSILO_ENABLE_PYTHON_MODULE=OFF"
    - "-DSILO_ENABLE_JSON=OFF"
    - "-DSILO_ENABLE_BROWSER=OFF"
    - "-DSILO_ENABLE_SILOCK=OFF"
    - "-DSILO_ENABLE_SHARED=OFF"
    - "-DSILO_BUILD_FOR_BSD_LICENSE=ON"
    - "-DBUILD_TESTING=ON"
  # 无外部 conan 依赖：真机 conan remotes（conancenter/ohpcd）不可解析 hdf5/1.13.0，
  # 故 HDF5 关闭，仅用 PDB/内置 netcdf/taurus 驱动（均为上游官方支持配置）。
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied:
  - id: "0001-gate-hdf5-browser-dependent-tests"
    description: >-
      tests/CMakeLists.txt：把三个遗漏在 if() 守卫之外的用例移入与上游同款的守卫。
      test_mat_compression-basic/dense 的可执行文件默认 driver=DB_HDF5（输出名 .pdb
      仅文件名），需 HDF5，移入 if(SILO_ENABLE_HDF5 AND HDF5_FOUND)；testdtypes
      shell 脚本无条件要求 silo browser 工具（browser 由 SILO_ENABLE_BROWSER 控制），
      移入 if(SILO_ENABLE_BROWSER)。使无 HDF5/无 browser 配置下注册的 ctest 集合与
      上游对该配置的设计一致（与其他 *-hdf5 同样：不注册、不计数）。

# 知识沉淀
knowledge_gained:
  - "Silo 4.12.1 已移除 autotools，纯 CMake 构建"
  - "E092：CMake 无 HarmonyOS 平台模块，CMAKE_SYSTEM_NAME 别名 Linux 以启用 if(UNIX) 分支"
  - "SILO_ENABLE_HDF5=OFF：真机 conan remotes 无可用 hdf5 包（hdf5/1.13.0 未 publish），故关闭 HDF5，仅 PDB/内置 netcdf/taurus 驱动；库名改为 libsilo（非 libsiloh5）"
  - "静态构建（SILO_ENABLE_SHARED=OFF）可规避 silo 测试用的 macOS 专属 RPATH（@loader_path）在 Linux 上失效的问题"
  - "测试用 ctest；计数以 ctest -N Total Tests 与 LastTest.log 的 Test Passed./Test Failed. 为准（HDF5 关闭后仅注册 PDB/base 用例，0001 补丁后共 57 个）"
  - "上游 tests/CMakeLists.txt 有三处把依赖已关闭功能的测试注册在 if() 守卫之外：test_mat_compression-basic/dense（默认 driver=DB_HDF5，输出名 .pdb 仅文件名）与 testdtypes（shell 脚本无条件要求 silo browser 工具）。用 0001 补丁移入与上游同款的 if() 守卫，避免无 HDF5/无 browser 配置下 ctest 运行失败。"
