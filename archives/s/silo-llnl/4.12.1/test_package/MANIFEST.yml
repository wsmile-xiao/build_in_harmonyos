# test_package/MANIFEST.yml — silo-llnl 4.12.1
# 上游官方测试声明文件 (L0e 要求)。
# 详见 docs/TEST_QUALITY_SPEC.md

package: silo-llnl/4.12.1
homepage: "https://silo.llnl.gov"

# 上游测试是否存在（确有），以及官方盘点口径。
upstream_tests_exist: true
# 官方测试盘点口径：Silo 4.12.1（已移除 autotools）是纯 CMake 工程，
# 顶层 CMakeLists 在 BUILD_TESTING=ON 时 include(CTest) 并 add_subdirectory(tests)，
# 由 tests/CMakeLists.txt 通过 add_test() 注册 ctest 用例 —— 故口径为 ctest_entries。
#
# 本适配 BUILD 配置为 SILO_ENABLE_HDF5=OFF（真机 conan remotes 无可用 hdf5 包，
# 见 conanfile.py），因此在 tests/CMakeLists.txt 中：
#   - HDF5_ONLY_SOURCES（compression/grab/largefile/memfile_simple/mk_nasf_h5/
#     partial_io/readstuff/testhdf5/locking）不注册；
#   - 每个测试本应存在的 *-hdf5 变体（含 compression-*/multi_test-*/multi_file-*/
#     testdtypes-hdf5/checksums 等）不注册；
#   - 只保留 PDB/base 驱动用例与 testall/onehex/multi_test/multi_file/specmix/
#     ucd 等多对象读写回集成测试及 testdtypes/test_mat_compression 等。
#   - 0001-gate-hdf5-browser-dependent-tests.patch 把三个遗漏在 if() 守卫之外的
#     用例移入与上游同款的守卫：test_mat_compression-basic/dense（其可执行文件
#     默认 driver=DB_HDF5，输出名 .pdb 仅文件名）移入 if(SILO_ENABLE_HDF5 AND
#     HDF5_FOUND)；testdtypes（shell 脚本无条件要求 silo browser 工具，browser
#     由 SILO_ENABLE_BROWSER 控制）移入 if(SILO_ENABLE_BROWSER)。
# 权威计数以真机 ctest -N 的 Total Tests 为准（HMBS marker 的 discovered）。
upstream_test_count_method: ctest_entries
# 依据上表对 tests/CMakeLists.txt 的逐项分析（HDF5/JSON/Fortran/Python/Parallel/
# 静态构建 + 0001 补丁将 3 个依赖已关闭功能的用例纳入守卫），本配置下预计注册
# 57 个 ctest 用例；真机 ctest -N 的 discovered 是最终校准来源（若偏差以此为准并回填）。
upstream_test_total: 57

# 上游测试命令（conanfile build() 已集成）
upstream_check_command: "ctest -N && ctest --output-on-failure -j1"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"

# 上游实际运行的测试程序（Silo tests/ 目录，逐个源码文件编译出的可执行测试；
# HDF5 已禁用，仅列举 PDB/base 驱动用例，含面向 PDB 驱动的 -hdf5 用例不再注册）
upstream_tests:
  - file: tests/testall.c
    source: Silo-4.12.1/tests/testall.c
    description: "Silo 主测试程序（SiloCheckVersion/DBOpen 版本一致性、多类型写入与读回），ctest 注册 testall 及 testall-small 变体"
    command: "./testall"
  - file: tests/onehex.c
    source: Silo-4.12.1/tests/onehex.c
    description: "基本单 hex 网格写入/读回，含命名 scheme 变体（onehex/onehex-split/onehex-custom 中的 PDB/base 变体）"
    command: "./onehex"
  - file: tests/multi_test.c
    source: Silo-4.12.1/tests/multi_test.c
    description: "多块网格多场景测试（read/badread/earlyclose/flush/libver 等，本配置下注册 PDB/base 变体）"
    command: "./multi_test"

# test_package 自带的消费者测试
test_package_tests:
  - file: test_package/test.c
    description: "调用 DBCreate/DBPutCurve/DBClose/DBOpen/DBGetCurve 在 PDB 驱动上做一次曲线写读回验证（本构建 HDF5 禁用）"
    command: "./test_silo_llnl"

# 测试断言总数（近似，用于质量评估；test_package 单用例含 曲线点对点断言）
assertion_count: 1
