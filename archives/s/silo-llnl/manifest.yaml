# 软件级 manifest — silo-llnl
# 遵循 ARCHIVE-SPEC v3.0

software: silo-llnl
display: "Silo (LLNL)"
description: "Silo 是 LLNL 开发的用于将多种科学数据以二进制文件写入磁盘或内存的强大库"
category: data
homepage: "https://silo.llnl.gov"
license: BSD-3-Clause
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "4.12.x 起为纯 CMake 构建（已移除 autotools），需要 CMAKE_SYSTEM_NAME=Linux 别名以启用 if(UNIX) 分支（E092）"
    - "启用 HDF5 时库输出名为 libsiloh5，consumers 链接 siloh5"
    - "SILO_BUILD_FOR_BSD_LICENSE=ON 可关闭 fpzip/hzip，避免 zlib 依赖，许可证保持 BSD-3-Clause"
    - "Fortran/Python/JSON/Browser/Silock 等可选组件在 OHOS 上禁用"
  common_dependencies:
    - hdf5

# 版本索引
versions:
  "4.12.1":
    status: built
    build_date: "2026-09-19"
    conan_ref: "silo-llnl/4.12.1"
