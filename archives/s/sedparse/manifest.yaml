software: sedparse
display: "sedparse (GNU sed parser in Python)"
description: "GNU sed's parser translated from C to Python; parses sed scripts to objects/dicts/JSON with a CLI"
category: system
homepage: "https://github.com/aureliojargas/sedparse"
license: GPL-3.0-only
build_system: pysetuptools

ohos_adaptation:
  key_points:
    - "纯 Python 单模块包，无编译扩展与运行时依赖；直接安装 sedparse.py 到 lib/python/site-packages"
    - "上游 PyPI sdist 不含 tests 目录，采用官方 GitHub 0.1.2 tag 包以运行完整上游测试"
    - "产物含 sedparse CLI，package_type=application，声明 cpp_info.bindirs=['bin'] 并提供软件级 commands.json"
  common_dependencies: []

versions:
  "0.1.2":
    status: built
    build_date: "2026-10-02"
    conan_ref: "sedparse/0.1.2"
