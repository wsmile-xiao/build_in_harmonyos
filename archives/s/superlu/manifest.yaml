software: superlu
display: "SuperLU"
description: "General purpose library for solving large, sparse, nonsymmetric systems of linear equations"
category: math
homepage: "http://crd-legacy.lbl.gov/~xiaoye/SuperLU/"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "需禁用 Fortran 支持：-DXSDK_ENABLE_Fortran=OFF（7.0.1 上游 cmake_minimum_required 已是 3.12，无需版本 patch）"
    - "7.0.1 起默认链接外部 BLAS（XSDK 默认禁用内置 CBLAS），配方用 TPL_BLAS_LIBRARIES 指向 openblas"
    - "编译为静态库 libsuperlu.a（c/s/d/z 四精度合一）"
  common_dependencies:
    - cmake
    - openblas

versions:
  "5.3.0":
    status: built
    build_date: "2026-05-22"
  "7.0.1":
    status: built
    build_date: "2026-09-18"
