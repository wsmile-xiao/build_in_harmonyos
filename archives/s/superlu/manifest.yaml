software: superlu
display: "SuperLU"
description: "General purpose library for solving large, sparse, nonsymmetric systems of linear equations"
category: math
homepage: "http://crd-legacy.lbl.gov/~xiaoye/SuperLU/"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 版本兼容性：需更新 cmake_minimum_required(VERSION) 至 3.5+"
    - "需禁用 Fortran 支持：-DXSDK_ENABLE_Fortran=OFF"
    - "使用内置 CBLAS（性能较低，如需高性能应链接外部 BLAS 库）"
    - "编译为静态库，不支持动态库构建"
  common_dependencies:
    - cmake

versions:
  "5.3.0":
    status: built
    build_date: "2026-05-22"