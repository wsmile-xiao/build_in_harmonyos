# 版本级 manifest
# 文件位置: archives/{letter}/{name}/7.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.0.1"

# 软件名
software: "superlu"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/xiaoyeli/superlu/archive/refs/tags/v7.0.1.tar.gz"

  # 源码校验和
  sha256: "86dcca1e086f8b8079990d07f00eb707fc9ef412cf3b2ce808b37956f0de2cb8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-Denable_internal_blaslib=OFF"
    - "-DTPL_BLAS_LIBRARIES=<openblas>/lib/libopenblas.a"
    - "-DXSDK_ENABLE_Fortran=OFF"
    - "-Denable_fortran=OFF"
    - "-Denable_matlabmex=OFF"
    - "-Denable_doc=OFF"
    - "-Denable_examples=OFF"
    - "-Denable_tests=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openblas/0.3.34

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零 patch，上游 7.0.1 兼容 OHOS 交叉编译）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "7.0.1 上游 cmake_minimum_required 已升到 3.12，无需 5.3.0 时代的版本 patch"
  - "XSDK 默认禁用内置 BLAS，改用 TPL_BLAS_LIBRARIES 链接制品仓 openblas/0.3.34（性能+生态双赢）"
  - "USE_VENDOR_BLAS 宏由上游 CMake 自动添加，openblas 的 f2c 风格符号兼容"
