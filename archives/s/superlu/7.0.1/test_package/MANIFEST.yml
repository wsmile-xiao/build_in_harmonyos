# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 实测申报）

package: superlu/7.0.1
homepage: "http://crd-legacy.lbl.gov/~xiaoye/SuperLU/"

# 上游测试命令（cmake 构建后 ctest 注册 24 个用例）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试在适配验证阶段已实跑（24/24 通过，见 notes.md）；conan create 时关闭
# enable_tests 以保持包构建精简，消费者验证走 test_package 真实 API 测试。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（TESTING/ 下 4 个驱动，各注册 6 个 ctest 用例：
# 2 个 SP 用例（s/d 驱动输入 EXAMPLE/g20.rua，c/z 驱动输入 EXAMPLE/cg20.cua）
# + 4 个 LA 用例（-t LA -n 9/19 -s 2 -l 0/10000000））
upstream_tests:
  - file: TESTING/sdrive.c
    source: superlu-7.0.1/TESTING/sdrive.c
    description: "单精度求解测试驱动（6 用例：s_test_9/19_2_0/10000000_LA + s_test_2_0/10000000_SP）"
    command: "./s_test -t LA -n 9 -s 2 -l 0"
  - file: TESTING/ddrive.c
    source: superlu-7.0.1/TESTING/ddrive.c
    description: "双精度求解测试驱动（6 用例：d_test_9/19_2_0/10000000_LA + d_test_2_0/10000000_SP）"
    command: "./d_test -t LA -n 9 -s 2 -l 0"
  - file: TESTING/cdrive.c
    source: superlu-7.0.1/TESTING/cdrive.c
    description: "单精度复数求解测试驱动（6 用例：c_test_9/19_2_0/10000000_LA + c_test_2_0/10000000_SP）"
    command: "./c_test -t LA -n 9 -s 2 -l 0"
  - file: TESTING/zdrive.c
    source: superlu-7.0.1/TESTING/zdrive.c
    description: "双精度复数求解测试驱动（6 用例：z_test_9/19_2_0/10000000_LA + z_test_2_0/10000000_SP）"
    command: "./z_test -t LA -n 9 -s 2 -l 0"

# test_package 中自带的测试（消费者视角验证，真实调用 dgssv API 并校验解向量）
test_package_tests:
  - file: test.c
    description: "消费者测试：dgssv 求解 4x4 稀疏线性方程组并校验解误差 < 1e-8"
    command: "./test_superlu"

# 测试断言总数（上游 ctest 24 用例 + test_package 解校验 1 项）
assertion_count: 25
