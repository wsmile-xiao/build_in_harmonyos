# 版本级 manifest
# 文件位置: archives/s/smhasher/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.0"
software: "smhasher"
status: built
build_date: "2026-09-15"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/aappleby/smhasher/archive/07bb4de10a63e8cc2e1724865454eba635742383.tar.gz"
  sha256: "c2d4afa595d2fc186a40022d8566c2fbe06d6c26668d48eeea3b3e1bc2ea05c1"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "直接使用上游 src/CMakeLists.txt（构建 SMHasherSupport 库 + SMHasher 测试主程序）"
    - "conanfile build() 运行 SMHasher --selftest-only（g_hashes[] 25 项固定验证值自检；第 26 个交付哈希 MurmurHash1 由 test_package 覆盖）"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-src-cmakelists-minimum-version.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "SMHasher 上游自带 src/CMakeLists.txt（与 hancho 并存），配方无需手写 CMakeLists"
  - "上游 CMakeLists 没有 install() 规则，package() 用 copy() 手工安装库与头文件"
  - "上游 CMakeLists 在 src/ 子目录，cmake.configure 需传 build_script_folder"
  - "只交付 SMHasherSupport 库与头文件，不安装 SMHasher 测试主程序（纯库包，无需 commands.json）"
  - "已知向量: MurmurHash3_x86_32(\"hello\", 5, 0) = 0x248bfa47；PMurHash32 与之同算法输出一致"
