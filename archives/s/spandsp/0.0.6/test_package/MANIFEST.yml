# 未运行 55 个测试的技术原因（R51 如实申报）：
# - 依赖 spandsp-sim（libsndfile+fftw）测试主体为 WAV 数据驱动
# - sox/pbmtog3/fax2tiff 外部程序缺失（configure AC_MSG_ERROR）
# - X11/fltk GUI 库无
# - 若干测试需 ITU/贝尔科版权测试数据（不可分发）

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 spandsp 公开 API（g711 编解码往返 + DTMF 生成）验证编译/链接/运行"
    command: "./test_spandsp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
