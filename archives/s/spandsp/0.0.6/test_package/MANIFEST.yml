# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: spandsp/0.0.6
homepage: "https://www.soft-switch.org/"

# 上游测试命令
# spandsp 使用 Autotools，测试为 noinst_PROGRAMS，无 automake TESTS harness。
# 需 --enable-tests + make 手动运行；configure 阶段要求 sox/pbmtog3/fax2tiff
# 外部程序与 libsndfile/fftw/libxml2/libpcap/X11/fltk 库。
upstream_check_command: "./configure --enable-tests && make"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# R51 申报：上游共 75 个测试程序（tests/Makefile.am noinst_PROGRAMS）
# - 纯算法测试（仅依赖 -lspandsp）30 个
# - 依赖 spandsp-sim / 外部程序 / GUI 库 45 个（OHOS configure --enable-tests
#   即失败：sox/pbmtog3/fax2tiff 外部程序缺失 + X11/fltk 无 + 若干需 ITU/版权测试数据）
# OHOS 实际编译运行 20 个纯算法测试，20/20 全 PASS（通过率 100%）
upstream_tests_total: 75
upstream_tests_pass: 20
upstream_tests_fail: 0
upstream_tests_skip: 55
upstream_test_pass_rate: "20/75 (可运行子集 20/20 = 100%)"

# OHOS 上实际运行 PASS 的 20 个纯算法测试
upstream_tests:
  - file: tests/bit_operations_tests.c
    source: spandsp-0.0.6/tests/bit_operations_tests.c
    description: "位操作函数测试"
    command: "./bit_operations_tests"
  - file: tests/crc_tests.c
    source: spandsp-0.0.6/tests/crc_tests.c
    description: "CRC 校验测试"
    command: "./crc_tests"
  - file: tests/complex_tests.c
    source: spandsp-0.0.6/tests/complex_tests.c
    description: "复数运算测试"
