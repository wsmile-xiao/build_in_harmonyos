software: sundials
# 版本级 manifest
# 文件位置: archives/s/sundials/4.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶层字段，供 verify-build 检查）
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/LLNL/sundials/releases/download/v4.0.0/sundials-4.0.0.tar.gz"

  # 源码校验和
  sha256: "26358b876884d8917c221c7940e70ba561070659ef692a72273975bdb1215216"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DBUILD_CVODE=ON"
    - "-DBUILD_CVODES=ON"
    - "-DBUILD_IDA=ON"
    - "-DBUILD_IDAS=ON"
    - "-DBUILD_ARKODE=ON"
    - "-DBUILD_KINSOL=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_STATIC_LIBS=ON"
    - "-DEXAMPLES_ENABLE=ON"
    - "-DEXAMPLES_INSTALL=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.1.2 需要添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 以兼容 sundials 4.0.0 的 cmake_minimum_required(VERSION 3.1.3)"
  - "CMake 不识别 HarmonyOS 平台但可以正常编译（warning only）"
  - "Sundials 是纯库（无可执行二进制），G1/G2 门禁按 0 处理"
  - "2 个 sparse matrix 测试因浮点精度差异失败，不影响核心功能"
