software: sol2
version: "3.5.0"
status: built
build_date: "2026-09-02"
build_system: cmake

source:
  url: "https://github.com/ThePhD/sol2/archive/refs/tags/v3.5.0.tar.gz"
  sha256: "86c0f6d2836b184a250fc2907091c076bf53c9603dd291eaebade36cc342e13c"
  tar_format: tar.gz

build:
  system: cmake
  dependencies: []
  package_type: header-library
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-include-sol-ebco.hpp.patch"
  - "0002-include-sol-types.hpp.patch"
  - "0003-include-sol-usertype_container.hpp.patch"
  - "0004-include-sol-usertype_storage.hpp.patch"

test_results:
  upstream:
    source_registrations: 342
    source_registration_breakdown: "339 TEST_CASE + 3 TEMPLATE_LIST_TEST_CASE"
    source_assertion_macros: 2312
    target: "sol2.tests.run_time"
    executed_cases: 306
    passed_cases: 301
    failed_cases: 5
    executed_assertions: 3689
    passed_assertions: 3680
    failed_assertions: 9
    executed: true
    result: "partial: 301/306 cases and 3680/3689 assertions passed"
    reason: >-
      The upstream suite was built and executed on OHOS aarch64 from the final
      patched source. Catch2 tag normalization was limited to four invalid empty
      tag descriptions in the temporary test copy, and overflow.cpp:59 used a
      temporary -Wno-error=unused-but-set-variable test-build flag; neither is
      part of the package. The five remaining failures are documented below.
    failures:
      - case: "usertypes/unregister/re-register"
        location: "tests/run_time/source/usertypes.unregister.cpp:78"
        evidence: >-
          After unregistering and registering the same usertype again,
          safe_script("assert(u:f() == 'registered')") returns invalid with
          "attempt to index a userdata value (global 'u')".
        classification: "OHOS Lua runtime limitation in re-registering an unregistered usertype"
      - case: "containers/sequence containers"
        location: "tests/run_time/source/container_semantics.cpp:92"
        evidence: >-
          Four template instantiations fail at r.valid() because the upstream
          script uses issuec in c[issuec + 1] without defining issuec; rg found
          no definition in tests/run_time/source.
        classification: "upstream test defect: undefined issuec"
      - case: "containers/append idiom"
        location: "tests/run_time/source/containers.cpp:411"
        evidence: >-
          vec2.size() remains 3 instead of 4; the preceding upstream script
          indexes issuevec at lines 390-391, but issuevec is not defined in the
          test source.
        classification: "upstream test defect: undefined issuevec"
      - case: "containers/associative ordered pairs"
        location: "tests/run_time/source/container_semantics.ordered.cpp:273"
        evidence: >-
          Both map and multimap sections fail data == reflect. They serialize
          unregistered bar* values through Lua and cannot reconstruct equivalent
          pointer values on the OHOS runtime.
        classification: "OHOS Lua/sol2 limitation for unregistered pointer values"
      - case: "policies/stack_dependencies"
        location: "tests/run_time/source/policies.cpp:206"
        evidence: >-
          safe_script() returns invalid for c = dor.comp; the recorded Lua error
          is "attempt to index a userdata value (global 'dor')" while exercising
          stack_dependencies.
        classification: "OHOS Lua runtime limitation in stack_dependencies usertype access"
  test_package:
    logical_cases: 1
    assertions: 4
    passed: 1
    failed: 0
  device_validation: >-
    OHOS aarch64 conan create passed with host/build both using the absolute
    ohos-aarch64 profile; all four conandata patches were applied by patch_ng,
    the package was created, and test_package compiled and ran with return code 0.

knowledge_gained:
  - "sol2 3.5.0 is header-only; Lua is an external consumer runtime rather than a package dependency."
  - "The Conan consumer target is sol2::sol2 and has no link libraries."
  - "The test package validates version macros and sol::optional instead of a print-only smoke test."
  - "OHOS Clang needs tagged ebco construction and explicit container-proxy conversion to avoid ambiguous overloads."
  - "The associative iterator sentinel must use sol2's sen() accessor rather than end() for this OHOS build."
  - "Named usertype property/variable setters must be searched during __newindex dispatch; otherwise class-table assignments store raw Lua values and bypass C++ setters."
  - "The upstream runtime result must distinguish source registration counts, expanded executed cases, and assertion totals."

patch_classification:
  - file: 0001-include-sol-ebco.hpp.patch
    type: portability
    platform_only: true
    guard: 'OHOS Clang ambiguous ebco construction'
  - file: 0002-include-sol-types.hpp.patch
    type: portability
    platform_only: true
    guard: 'OHOS Clang container proxy conversion'
  - file: 0003-include-sol-usertype_container.hpp.patch
    type: bugfix
    platform_only: false
    guard: 'none'
  - file: 0004-include-sol-usertype_storage.hpp.patch
    type: bugfix
    platform_only: true
    guard: 'OHOS Lua named usertype setter dispatch'
