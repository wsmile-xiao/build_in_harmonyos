sources:
  url:
    - "https://github.com/ThePhD/sol2/archive/refs/tags/v3.5.0.tar.gz"
  sha256: "86c0f6d2836b184a250fc2907091c076bf53c9603dd291eaebade36cc342e13c"

patches:
  "3.5.0":
    - patch_file: "patches/0001-include-sol-ebco.hpp.patch"
      patch_description: "Use tagged construction to avoid ambiguous wrapper overloads on OHOS Clang"
      patch_type: "bugfix"
    - patch_file: "patches/0002-include-sol-types.hpp.patch"
      patch_description: "Disambiguate container proxy construction on OHOS Clang"
      patch_type: "bugfix"
    - patch_file: "patches/0003-include-sol-usertype_container.hpp.patch"
      patch_description: "Fix associative container iterator end sentinel lookup"
      patch_type: "bugfix"
    - patch_file: "patches/0004-include-sol-usertype_storage.hpp.patch"
      patch_description: "Dispatch named usertype setters for static properties on OHOS Lua"
      patch_type: "bugfix"
