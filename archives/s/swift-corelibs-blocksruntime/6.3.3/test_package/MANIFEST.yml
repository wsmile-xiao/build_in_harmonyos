package: swift-corelibs-blocksruntime/6.3.3
homepage: "https://github.com/swiftlang/swift-corelibs-blocksruntime"

upstream_official_tests: []
upstream_check_command: "not available: upstream repository contains no test target"
upstream_test_in_build: false

adapted_tests: []

test_package_tests:
  - file: test_global_block.c
    origin: ohos-adaptation (self-authored)
    description: "Copy, invoke, and release a no-capture global Block"
    command: "test_global_block"
  - file: test_captured_block.c
    origin: ohos-adaptation (self-authored)
    description: "Copy a stack Block with a captured value and invoke its heap copy"
    command: "test_captured_block"
  - file: test_escape_lifetime.c
    origin: ohos-adaptation (self-authored)
    description: "Return a copied Block from a function and invoke it after its defining stack frame exits"
    command: "test_escape_lifetime"
  - file: test_byref_capture.c
    origin: ohos-adaptation (self-authored)
    description: "Copy a Block with a mutable __block capture and verify forwarding semantics"
    command: "test_byref_capture"
  - file: test_nested_block.c
    origin: ohos-adaptation (self-authored)
    description: "Copy and invoke a Block that captures another Block"
    command: "test_nested_block"
  - file: test_retain_release.c
    origin: ohos-adaptation (self-authored)
    description: "Copy an existing heap Block, release one reference, and verify the retained copy remains callable"
    command: "test_retain_release"
  - file: test.c
    origin: ohos-adaptation (self-authored)
    description: "Validate Block_size, signature presence, and metadata consistency for stack and heap Blocks"
    command: "test_block_metadata"

assertion_count: 7
