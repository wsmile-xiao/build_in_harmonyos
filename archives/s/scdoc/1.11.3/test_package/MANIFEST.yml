package: scdoc/1.11.3
homepage: "https://git.sr.ht/~sircmpwn/scdoc"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: test/comments
    description: "Comment parsing and invalid comment rejection"
  - file: test/heading
    description: "Heading parsing"
  - file: test/indent
    description: "Indentation and literal block handling"
  - file: test/inline-formatting
    description: "Inline formatting and escaping"
  - file: test/line-breaks
    description: "Explicit line-break handling"
  - file: test/preamble
    description: "Preamble validation and SOURCE_DATE_EPOCH"
  - file: test/tables
    description: "Table parsing and alignment"

test_package_tests:
  - file: test.sh
    description: "Consumer: execute scdoc and verify generated roff"
    command: "sh test.sh"

assertion_count: 1
