# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.3"

# 软件名
software: "shishi"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 release tarball：自带 gengetopt 生成的 src/*_cmd.c 解析器）
  url: "https://ftp.gnu.org/gnu/shishi/shishi-1.0.3.tar.gz"

  # 源码校验和（本地 sha256sum 实核）
  sha256: "95798ffd12dd01a4f88e0311ee03ca4a26e5cb4e5e9059a40e4fc4d9f2917e92"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（配方 generate() 注入；--with-libgcrypt-prefix 指向 conan 包前缀，构建期解析）
  configure_options:
    - "--disable-gtk-doc"
    - "--disable-nls"
    - "--without-stringprep"
    - "--disable-starttls"
    - "--disable-pam"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--with-libgcrypt-prefix=<libgcrypt package_folder>"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libgcrypt/1.12.2"
    - "libtasn1/4.21.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "gengetopt 生成的 src/*_cmd.c 解析器只随 release tarball 发布，git 快照/本地 autogen 在设备与 CI 均不可用，源必须锚定官方 tarball + sha256" # knowledge_ref: E670
  - "configure 补丁会让 doc/ 时间戳链重算并要求 makeinfo；对齐 stamp-vti/version.texi/shishi.info 的 mtime 即断链（mdate-sh 空输出会让 set 无参把环境倒进文档）" # knowledge_ref: E676
patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/ws/tmp/builds/shishi-1.0.3.orig
  source_work_dir: /storage/Users/currentUser/ws/tmp/builds/shishi-1.0.3.work
  source_orig_hash: 81eb4980b807aeac
  source_work_hash: a408cc425889c50f
  generated_at: '2026-09-23T14:17:56'
  patches_count: 1
patch_classification:
  - file: 0001-configure.patch
    type: portability
    platform_only: True
    guard: 'HMDFS mktemp -d 目录 2700 不可写（设备事实 §一.10）'
