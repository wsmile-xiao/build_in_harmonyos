package: shishi/1.0.3
homepage: "https://www.gnu.org/software/shishi/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: tests/Makefile.am
    source: shishi-1.0.3/tests/Makefile.am
    description: "automake TESTS/check_PROGRAMS 注册的 16 个 C 单元测试: authenticator crypto gztime priv safe ticketset crypto-ctx low-crypto rijndael key keytab ccache nonce passwdpromptcb multiname version"
    command: "make -C tests check"

test_package_tests:
  - file: test_shishi.c
    description: "libshishi/libshisa 消费者 API 断言 4 项（版本自报×2/错误串/shisa_init_with_paths 对显式可写库位置的句柄生命周期），真实链接被测包"
    command: "./test_shishi"
  - file: test_shishi_tools.sh
    description: "包内 5 个命令行工具 --version 冒烟（shishi/shisa/ccache2shishi/shishid/keytab2shishi，conan 将 sbindir 折入 bin/），绝对路径调用"
    command: "sh test_shishi_tools.sh <package-folder>"

assertion_count: 9
