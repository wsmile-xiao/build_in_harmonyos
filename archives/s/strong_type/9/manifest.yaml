# 编译中学到的知识
knowledge_gained:
  - "Conan 2.29.1 拒绝单字符版本号：任务卡版本 '9' 在 conan create 导出阶段报 Invalid package version '9'；conanfile.py 不写字面 version，改用 set_version() 归一化为上游 tag 'v9'（目录-制品版本分离），分支/白名单保持单字符不变（L0n 兼容）。草稿 DRAFT-strong_type-9-conan-single-char-version-set-version（路径 B）"
  - "上游 fmt 对照测试 test_fmt8：制品仓 fmt/8.1.1 预编译 binary 与设备 libc++ 运行时 ABI 不兼容（fmt::v8::detail::locale_ref::get 等 symbol not found），属真实外部制品阻塞；test_fmt9 因制品仓无 fmt 9.x 且上游 find_package(fmt 9) 主版本严格匹配而未实例化"