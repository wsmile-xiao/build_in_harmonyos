# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: strong_type/9
homepage: "https://github.com/rollbear/strong_type"

# 上游测试命令 (ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试 (header-only 库无构建步骤)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Catch2, 见测试台账)
upstream_tests:
  - file: test.cpp
    source: strong_type-9/test/test.cpp
    description: "上游 Catch2 聚合套件 self_test (83 test cases / 294 assertions, 全部通过)"
    command: "./self_test"

# test_package 中自带的测试 (消费者视角验证, 真实 API 调用)
test_package_tests:
  - file: test_strong_type.cpp
    description: "消费者验证：arithmetic/ordered/hashable/incrementable 真实 API 调用 (10 项断言)"
    command: "./test_strong_type"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 304
