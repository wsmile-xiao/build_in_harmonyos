# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: stb_image_write/1.16
homepage: "https://github.com/nothings/stb"

# 上游测试命令 (header-only 库，无标准 make check)
upstream_check_command: "N/A (header-only library)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/image_write_test.c
    source: stb-master/tests/image_write_test.c
    description: "上游官方图像写入测试：测试 PNG/BMP/TGA/JPG/HDR 格式写入（常规和垂直翻转）"
    command: "gcc -DIWT_TEST tests/image_write_test.c -o image_write_test && ./image_write_test"
  - file: tests/test_image_write.c
    source: stb-master/tests/test_image_write.c
    description: "上游测试模块源文件（被其他测试引用）"
    command: "N/A (module source)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：验证 PNG/BMP/TGA/JPEG 四种格式的图像写入功能"
    command: "./test_stb_image_write"

# 测试断言总数 (近似值, 用于质量评估)
# 上游测试: 10 个格式写入调用 (5 格式 × 2 模式)
# test_package: 4 个格式写入验证
assertion_count: 14
