# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: suil/0.10.26
homepage: "https://drobilla.net/software/suil.html"

# 上游测试命令（meson 注册 test/headers/headers 套件）
upstream_check_command: "meson test -C build --list"
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs"

# 上游实际注册的测试（test/headers/meson.build，suite: unit）
upstream_tests:
  - file: test/headers/test_headers.c
    source: suil-v0.10.26/test/headers/test_headers.c
    description: "headers 冒烟测试：编译+运行 main() 返回 0（链接 suil_dep 验证公共头可编译、库可链接）"
    command: "meson test -C build -R headers"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_suil.c
    description: "消费者测试: suil_init 初始化 + suil_host_new/suil_host_set_touch_func/suil_host_free 宿主生命周期 + suil_ui_supported 原生/跨工具包包装探测 (API 契约断言)"
    command: "./test_suil"

# 测试断言总数 (实测, rule 4)
# 上游 test/headers: 1 个注册用例（headers，main 仅 return 0 无断言）
# 消费者测试新增 4 项 API 断言（init 无返回值、host 非空、native_q∈{0,1}、wrapped_q 不崩溃）
assertion_count: 5
