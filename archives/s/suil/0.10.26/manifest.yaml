knowledge_gained:
  - "suil 0.10.26 上游构建系统已是 meson（非 waf）——任务背景中的 waf 认知基于旧版本；LV2 全家桶（serd/sord/sratom/lilv/suil/lv2）2021 年起统一迁移 meson"
  - "核心库 libsuil-0 仅需 lv2 + dl，OHOS 交叉编译零补丁"
  - "GUI 适配模块（x11/gtk2/gtk3/qt5/qt6/cocoa）是独立 shared_module，按上游 feature 开关禁用即可精简构建；主库契约不受影响"
  - "meson 交叉编译时 meson test 对宿主可执行测试默认 SKIP(exit 77)，本机同架构可直接执行测试二进制补跑"
  - "上游 versioned 安装布局：libsuil-0.so / include/suil-0/ / suil-0.pc 均带主版本后缀，支持 0.x/1.x 并行安装"

