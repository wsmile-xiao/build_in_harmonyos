software: sic
display: "sic"
description: "极简 IRC 客户端（suckless）：从 stdin 读命令、多路复用所有频道输出到 stdout，约 250 行 C"
category: tool
homepage: "https://tools.suckless.org/sic/"
license: MIT
build_system: make

ohos_adaptation:
  key_points:
    - "单源文件（sic.c，内含 strlcpy.c/util.c），无依赖，上游 Makefile 直接构建"
    - "config.h 由 Makefile 从 config.def.h 生成，无需补丁"
    - "上游无测试 → test_package 补全消费者测试：真跑本地 IRC 握手（NICK/USER/PONG）"
    - "CLI 工具：装 bin/sic + man1/sic.1，并提供软件级 commands.json"

versions:
  "1.3":
    status: built
    build_date: "2026-09-21"
    conan_ref: "sic/1.3"
