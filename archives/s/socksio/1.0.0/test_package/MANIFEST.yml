package: socksio/1.0.0
homepage: "https://github.com/sethmlarson/socksio"
upstream_check_command: "python3 -m pytest tests -q -o addopts="
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests -q -o addopts="
upstream_tests:
  - file: tests/
    source: socksio-1.0.0.tar.gz/tests/
    description: "Unmodified pytest suite from fixed PyPI sdist; run separately on H1 with pinned private test dependencies; not executed by Conan build() or W3"
    command: "python3 -m pytest tests -q -o addopts="
test_package_tests:
  - file: functional.py
    description: "Five groups: package provenance and SOCKS4, SOCKS4A, SOCKS5 wire protocol and malformed reply checks"
    command: "python3 functional.py <absolute-package-folder> <results-json>"
assertion_count: 12
