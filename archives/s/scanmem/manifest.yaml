software: scanmem
display: "scanmem"
description: "Locate and modify variables in a running process's memory"
category: debugging
homepage: "https://github.com/scanmem/scanmem"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "E007 平台三元组：tag 包无预生成 configure，需 autoreconf -fi 引导；引导后 config.guess/config.sub 必须补 HarmonyOS 分支，且必须在 autoreconf 之后打补丁（autoreconf 会重装这两个脚本）"
    - "config.sub 需三处同时改：ohos-linux 三元组、OS 类型表、kernel-OS 校验表。框架 perl 脚本的第三处被自身第二处的守卫条件（全局搜 /linux-ohos/）短路，属于死代码，配方内自实现并以 `sh -n` 自检"
    - "readline/8.3 是 configure 硬要求；其静态库依赖 ncurses terminfo 符号（tputs/tgetent/PC/UP），readline 的 package_info 不向下透传 ncurses，靠 Conan 依赖图传递 + '消费者在前、提供者在后' 的链接顺序解决"
    - "intltool / po/ 为死代码：0.17 全树无 _()、无 libintl.h、无 gettext 符号，po/ 仅在 --enable-gui（另需 Python 2.7）时进入 SUBDIRS"
    - "BSD 别名 uint 需显式 #include <sys/types.h>：musl 系头文件不再传递引入"
    - "产物同时含可执行文件与共享库（application），因此配软件级 commands.json"
  common_dependencies:
    - readline
    - ncurses
    - automake
    - libtool

versions:
  "0.17":
    status: built
    build_date: "2026-09-29"
    conan_ref: "scanmem/0.17"
