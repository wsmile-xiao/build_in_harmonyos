# conandata.yml — scanmem 0.17
#
# Source: official upstream GitHub tag archive (R39: authoritative upstream
# source). The v0.17 *release asset* does not exist — the GitHub releases page
# has no scanmem-0.17.tar.gz (HTTP 404, verified 2026-09-29) — so the tag
# archive is the only official distribution. It ships no generated `configure`
# (only configure.ac/Makefile.am/autogen.sh), hence the mandatory autoreconf.
sources:
  url: "https://github.com/scanmem/scanmem/archive/refs/tags/v0.17.tar.gz"
  sha256: "f02054b91322cf41517506158fcb74554e9fc6644e696f8aa25e5acf162d374b"

patches:
  - patch_file: "patches/0001-configure.ac-drop-intltool.patch"
    patch_description: "drop IT_PROG_INTLTOOL and po/Makefile.in (intltool absent on OHOS; po/ is GUI-only and gettext is unused)"
    patch_type: "build"
  - patch_file: "patches/0002-include-sys-types-for-uint.patch"
    patch_description: "include <sys/types.h> for the BSD 'uint' alias, which musl-style OHOS headers do not pull in transitively"
    patch_type: "portability"
