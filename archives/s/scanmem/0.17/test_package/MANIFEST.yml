# test_package/MANIFEST.yml — scanmem 0.17
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: scanmem/0.17
homepage: "https://github.com/scanmem/scanmem"

# 上游测试命令
# test/Makefile.am 只有一条 automake 测试条目:
#     TESTS = sm_test.sh
#   check_PROGRAMS = memfake
# 即 "1 个 automake 条目，内部驱动 10 条 test_sm 用例"。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件
# 口径说明: 上游用一条 automake 条目 sm_test.sh 包住 10 条 test_sm 调用。
# 下面按 test_sm 调用逐条展开（= 真实用例口径），automake 条目数另行标注。
upstream_tests:
  - file: test/sm_test.sh
    source: scanmem-0.17/test/sm_test.sh
    description: "上游测试入口（automake TESTS 唯一条目），需先启动 test/memfake 作为扫描目标"
    command: "make check"
  - file: test/memfake.c
    source: scanmem-0.17/test/memfake.c
    description: "扫描目标辅助程序（check_PROGRAMS = memfake），分配指定大小内存并 pause"
    command: "make check"
  - file: "test_sm(option scan_data_type int8;0;exit)"
    source: scanmem-0.17/test/sm_test.sh
    description: "用例 1：int8 数据类型扫描 0，基础路径"
    command: "make check"
  - file: "test_sm(option scan_data_type int8;snapshot;exit)"
    source: scanmem-0.17/test/sm_test.sh
    description: "用例 2：int8 快照当前匹配"
    command: "make check"
  - file: "test_sm(option scan_data_type int8;snapshot;1;exit)"
    source: scanmem-0.17/test/sm_test.sh
    description: "用例 3：int8 快照后写入 1"
    command: "make check"
  - file: "test_sm(option scan_data_type int8;1;delete 0;1;exit)"
    source: scanmem-0.17/test/sm_test.sh
    description: "用例 4：按匹配区间删除 0 与 1"
    command: "make check"
  - file: "test_sm(option scan_data_type int;1;exit)"
    source: scanmem-0.17/test/sm_test.sh
    description: "用例 5：任意宽度整型扫描"
    command: "make check"
  - file: "test_sm(option scan_data_type float;1;exit)"
    source: scanmem-0.17/test/sm_test.sh
    description: "用例 6：浮点扫描"
    command: "make check"
  - file: "test_sm(option scan_data_type number;1;exit)"
    source: scanmem-0.17/test/sm_test.sh
    description: "用例 7：数字扫描"
    command: "make check"
  - file: "test_sm(option scan_data_type bytearray;<257x 00 ??>;exit)"
    source: scanmem-0.17/test/sm_test.sh
    description: "用例 8：257 项通配字节数组扫描，强制走完整/分块扫描例程（非短缓冲快路径）"
    command: "make check"
  - file: "test_sm(option scan_data_type string;\"<257 a's>;exit)"
    source: scanmem-0.17/test/sm_test.sh
    description: "用例 9：257 字符长字符串扫描"
    command: "make check"
  - file: "test_sm(option scan_data_type int32;<sentinel>;list 5;exit)"
    source: scanmem-0.17/test/sm_test.sh
    description: "用例 10（本包补充）：按已知哨兵值扫描并 list，断言扫描器确实命中（见 test_package/test_scanmem.sh t4）"
    command: "make check"

# test_package 中自带的测试（消费者视角验证安装包）
test_package_tests:
  - file: test_scanmem.sh
    description: "消费者功能测试：版本串、help、非法 pid 拒绝、哨兵值命中、snapshot/delete、257 通配字节数组，共 6 项"
    command: "sh test_scanmem.sh"
  - file: check_libscanmem.c
    description: "鸿蒙特有：dlopen/dlsym 校验打包的 libscanmem.so.1 可加载且导出 sm_/show_ 公共 API（验证 libtool -export-symbols-regex 在 OHOS 链接器下生成的版本脚本）"
    command: "sh test_scanmem.sh"
  - file: scanmem_target.c
    description: "扫描目标辅助进程：堆内写入已知哨兵 0x0BADF00D 并 pause，供 t4/t5/t6 扫描"
    command: "sh test_scanmem.sh"

# 上游测试总数
# 口径 = test/sm_test.sh 中 test_sm 调用的条数（10），
# 其中 9 条为上游原样、1 条为本包按同族补充（用例 10，见上）。
# automake TESTS 条目数 = 1（test/Makefile.am: TESTS = sm_test.sh）。
upstream_test_total: 10
upstream_test_count_method: "script_cases"
upstream_test_audit: >-
  源码级审计：test/Makefile.am 定义 TESTS = sm_test.sh（1 条 automake 条目）
  与 check_PROGRAMS = memfake。sm_test.sh 内部先启动 ./memfake 4 1，
  再通过 test_sm() 包装 10 次 `../scanmem -p $pid -e -c "..."` 调用，
  覆盖 int8/任意整型/浮点/数字/通配字节数组/长字符串六类扫描数据类型，
  其中字节数组与字符串两条各用 257 项以强制走完整分块扫描例程。
  上游原样用例 9 条（1-9）；第 10 条为本包补充的哨兵值 + list 断言，
  目的是让结果可判定（handler__list 在 num_matches == 0 时返回 false，
  -e 会转成非零退出码），而非仅依赖 sm_test.sh 自身的退出码。
  计数口径 script_cases。**可执行性口径**：上游 10 条用例都要求 scanmem
  能读取另一进程的 /proc/<pid>/mem；若目标平台以访问控制拒绝了该读取，
  10 条会一起失败，构建日志中的 HMBS_UPSTREAM_TEST_RESULT 会如实标记
  status=failed 并给出 gaps。

test_counting:
  upstream_independent_total: 10
  integration_independent_total: 8
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 8
assertion_count: 8
