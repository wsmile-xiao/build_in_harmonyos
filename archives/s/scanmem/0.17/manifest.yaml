# 版本级 manifest
# 文件位置: archives/s/scanmem/0.17/manifest.yaml

# 版本号
version: "0.17"

# 软件名
software: "scanmem"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "autotools"
conan_ref: "scanmem/0.17"

# 源码信息
source:
  # 源码下载 URL（上游官方 GitHub tag 归档，与 conandata.yml 一致）
  url: "https://github.com/scanmem/scanmem/archive/refs/tags/v0.17.tar.gz"

  # 源码校验和（2026-09-29 实测下载验证）
  sha256: "f02054b91322cf41517506158fcb74554e9fc6644e696f8aa25e5acf162d374b"

  # 压缩格式
  tar_format: tar.gz

# 构建配置
build:
  system: autotools

  # 配置选项列表（与 conanfile.py generate() 一致）
  configure_options:
    - "--disable-rpath"
    - "# 无 --host/--build 覆盖：host 与 build 同 profile，configure 自检为原生构建（R1/E007 禁止交叉绕过）"

  # 编译依赖列表（格式: name/version，均为制品仓已发布版本，W0 用 conan download 校验）
  dependencies:
    - readline/8.3
    - ncurses/6.6

  # 构建期工具依赖（CI 预装 autoconf，但不预装 automake/aclocal）
  build_dependencies:
    - automake/1.18
    - libtool/2.5.4.1

  # 编译器
  cc: clang
  cxx: clang++

# 应用的补丁列表
patches_applied:
  - "0001-configure.ac-drop-intltool.patch"
  - "0002-include-sys-types-for-uint.patch"

# 编译中学到的知识
knowledge_gained:
  - "E007 实证：tag 归档无预生成 configure，autoreconf -fi 生成的 config.sub(2022-01-03) 双重失败——先 'OS `ohos' not recognized'，补 OS 表后变成 'Kernel `linux' not known to work with OS `ohos''，必须同时补三元组/OS 表/kernel-OS 校验表三处"
  - "框架 patch-autotools-ohos.pl 的 kernel-OS hunk(2.3) 守卫条件是全局搜 /linux-ohos/，而 2.1 刚写入 basic_os=linux-ohos 已满足该条件，故 2.3 恒被跳过（lftp/4.9.3 已记录，本次独立复现）"
  - "自实现 config.sub 三元组补丁时，若用带尾部 [ \\t]* 的正则分组重建 case 分支，会静默吞掉下一行缩进并多出一个裸 ;;，把 config.sub 变成语法错误；改为整体克隆 android-linux 分支再字符串替换，并在补丁后用 `sh -n config.sub` 自检"
  - "readline/8.3 的 OHOS 包是纯静态（libreadline.a + libhistory.a），其 display.o/terminal.o 引用 terminfo 符号 tputs/tgetstr/tgetnum/tgoto/tgetent 与能力变量 PC/BC/UP；readline 的 package_info 只声明 libs=[readline,history] 不透传 ncurses，靠 Conan 依赖图把 ncurses/6.6 传进来并按'消费者在前'顺序链接才通过"
  - "scanmem 的 AC_CHECK_LIB([termcap],[tgetent]) 失败不致命（action-if-found 为空），所以它不会把 -ltermcap 带进 LIBS，terminfo 只能靠依赖图补"
  - "musl 系 OHOS 头文件不再传递引入 BSD 别名 uint，scanroutines.c / targetmem.h / test/memfake.c 需显式 #include <sys/types.h>；uint 实为 unsigned int 别名，故补头文件而非改类型"
  - "scanmem 的 -v/-h 处理后是 exit(EXIT_FAILURE)，成功也返回 1：test_package 里绝不能用 self.run(\"scanmem --version\")（会被当失败抛 ConanException），必须对输出内容断言；CI 的 L2 冒烟同样只能给非阻塞 warn"
  - "本地 WSL guest 运行时的 glibc 不导出 __fd_chk（真机 OHOS libc 导出），导致链接了 registry OHOS libreadline.a 的 aarch64 二进制在本机无法重定位；这是纯本机运行期差异，不影响 CI 真机结论"
