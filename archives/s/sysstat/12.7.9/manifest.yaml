software: sysstat
# 版本级 manifest
# 文件位置: archives/s/sysstat/12.7.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "12.7.9"

# 构建系统类型
build_system: autotools

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sysstat/sysstat/archive/refs/tags/v12.7.9.tar.gz"

  # 源码校验和（SHA256）
  sha256: "e48fc69401135dc08d2cd4ff58dbdbfce9b7485f76fc9049d97848e313c08dda"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--disable-sensors"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁 - 仅通过 configure 参数适配）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "sysstat 使用 -V 查看版本而非 --version（软件设计特性）"
- "make install 需要覆盖 SA_DIR 和 SYSCONFIG_DIR 以避免 HMDFS 只读路径"
- "G0 clean-verify 的 config.status Permission denied 是 HMDFS 平台已知限制(E046)"
- "sysstat 无 make check 目标，需手动验证功能"

