software: sasm
display: "SASM"
description: "Simple crossplatform IDE for NASM/MASM/GAS/FASM assembly development (Qt5 Widgets GUI)"
category: development
homepage: "https://github.com/Dman95/SASM"
license: GPL-3.0-or-later
build_system: cmake
ohos_adaptation:
  key_points:
    - "上游为 qmake 工程（SASM.pro）；CI 无 qmake 消费链路，改为等价 CMakeLists.txt（AUTOMOC/AUTOUIC/AUTORCC，Qt5 Core/Gui/Widgets/Network）"
    - "singleapplication 子树：qtlocalpeer.cpp 在 QtLP_Private 命名空间内 #include qtlockedfile*.cpp，CMake 源列表只能编 qtsingleapplication.cpp + qtlocalpeer.cpp，否则报 use of undeclared identifier 'QtLockedFile'（知识草稿 E429）"
    - "GitHub release tarball 为即时生成产物，直连易超时/截断；sha256 须以 conan 完整下载体（22MB）校验，代理截断体不可用"
    - "test_package 以 QT_QPA_PLATFORM=offscreen 实际运行 sasm 二进制（8s 存活判定），非空壳测试"
versions:
  "3.15.0":
    status: built
    build_date: "2026-10-01"
    packaging: conan
    notes: "conan recipe (os=OHOS arch=armv8); deps qt/5.15.19; qmake to CMake rewrite (patch 0001); test_package runs the IDE headless (3 assertions); upstream tests = 0"
    dependencies:
      - qt/5.15.19
