# conandata.yml — sasm 3.15.0
# 官方源：https://github.com/Dman95/SASM (tag v3.15.0)
# 上游归属：Dmitriy Manushin (Dman95)，SASM — 简单跨平台汇编 IDE（GPL-3.0）
# 官方 GitHub releases 为正式发布渠道；镜像由 CI 预下载脚本自动注入。

sources:
  # www.github.com intermittently times out from CI workers (#71145/#71146);
  # the one build that got past the download (#71147) failed later in CMake.
  # codeload.github.com is GitHub's official direct-download host (CI-reachable,
  # pd-vbap #67523 precedent) serving the byte-identical tarball pinned by the
  # original sha256 (conan download re-verified it against the codeload URL;
  # bare curl through some local egress paths sees a re-compressed stream —
  # use conan/W3 to validate, not raw curl).
  url: "https://codeload.github.com/Dman95/SASM/tar.gz/refs/tags/v3.15.0"
  sha256: "9f4df1abcf4ae106100ce4b59a95169a0a412097cbd54dd158168f720e738971"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    strip: 1
    patch_description: "Add CMakeLists.txt (qmake SASM.pro to CMake rewrite) for OHOS CI"
    patch_type: "portability"
