# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sasm/3.15.0
homepage: "https://github.com/Dman95/SASM"

# 上游为 Qt5 GUI 应用（qmake SASM.pro），无 make check/ctest 测试目标；
# 适配以 CMake 改写（patches/0001-CMakeLists.txt.patch），无上游可执行测试。
upstream_check_command: ""
upstream_test_in_build: false

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sasm.sh
    description: "消费者视角：以 QT_QPA_PLATFORM=offscreen 实际执行打包出的 sasm 二进制，验证 ELF 可加载、Qt5 插件/资源加载与 singleapplication(Network) 初始化（进程存活 8s 判定启动成功）"
    command: "bash test_sasm.sh (test_package/conanfile.py test() 经 self.run 调用)"

# 测试断言总数 (真实运行统计)
assertion_count: 3
