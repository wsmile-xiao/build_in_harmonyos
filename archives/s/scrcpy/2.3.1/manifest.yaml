software: scrcpy
version: "2.3.1"
status: built
build_date: "2026-05-22"

source:
  url: "file:///storage/Users/currentUser/tmp/downloads/scrcpy-2.3.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--buildtype=release"
    - "--strip"
    - "-Dcompile_app=true"
    - "-Dcompile_server=false"
    - "-Dusb=true"
    - "-Dv4l2=false"
  dependencies:
    - SDL2/2.30.0
    - ffmpeg/7.1.4
    - libusb/1.0.27
    - android-tools/35.0.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "scrcpy 使用 meson 构建系统"
  - "需要 SDL2 >= 2.0.5 和 ffmpeg >= 57.x"
  - "server 是 Android 端组件，需要预下载"
  - "客户端依赖 libavformat, libavcodec, libavutil, libswresample, SDL2"
  - "HMDFS 动态库加载需要特殊处理"
