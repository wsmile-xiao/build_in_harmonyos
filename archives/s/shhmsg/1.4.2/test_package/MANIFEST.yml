package: shhmsg/1.4.2
homepage: "https://shh.thathost.com/pub-unix/"

# R51 inventory: the release archive has no tests/test directory, test
# source, test framework, or check/test target. README only records historical
# compilation on other systems and does not identify an executable test suite.
upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_shhmsg.c
    description: "General consumer test: 21 assertions cover program names, stream routing, formatting, quiet and verbose filters, environment defaults, and errno messages"
    command: "test_shhmsg"
  - file: test_shhmsg_ohos.c
    description: "HarmonyOS-specific test: 4 assertions require __OHOS__/aarch64 and verify LP64, file-stream routing, UTF-8 bytes, and strerror integration"
    command: "test_shhmsg_ohos"

assertion_count: 25
