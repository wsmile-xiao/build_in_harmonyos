software: shhmsg
display: "shhmsg"
description: "为终端程序提供错误、普通消息和分级详细输出的轻量级 C 库"
category: library
homepage: "https://shh.thathost.com/pub-unix/"
license: Artistic-1.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 C 库且仅依赖 libc，使用 HarmonyOS 原生 Clang 与上游 Makefile 构建，无需源码补丁"
    - "通过 Conan 显式传递编译器和编译参数，避免使用上游 Makefile 默认的 gcc"
    - "共享库以实体文件提供完整版本、SONAME 和链接名，规避 HMDFS 软链接限制"
    - "上游无自动化测试；新增真实 API 消费者测试及 OHOS aarch64 专项测试"
  common_dependencies: []

versions:
  "1.4.2":
    status: built
    build_date: "2026-09-20"
    conan_ref: "shhmsg/1.4.2"
