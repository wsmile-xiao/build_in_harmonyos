sources:
  "0.4.5-cvs20030824":
    url: "https://deb.debian.org/debian/pool/main/s/smpeg/smpeg_0.4.5+cvs20030824.orig.tar.gz"
    sha256: "1276ea797dd9fde8a12dd3f33f180153922544c28ca9fc7b477c018876be1916"

patches:
  - patch_file: "patches/0001-cxx17-source-modernisation.patch"
    patch_description: >
      Make the 2003 C++ sources build under -std=c++17 (the OHOS profile's cppstd):
      drop the register storage class (removed in C++17), add explicit casts to the
      -1 sentinels stored in unsigned table fields (list-initialisation narrowing is
      an error since C++11) and declare the SDL audio callbacks at namespace scope
      because modern compilers no longer introduce friend declarations there
    patch_type: "portability"
  - patch_file: "patches/0002-libtool-cxx-link-driver.patch"
    patch_description: >
      Upstream forces the libtool C++ link driver to cc and appends a hardcoded
      -lstdc++ to libsmpeg_la_LDFLAGS; the OHOS toolchain ships libc++ and no
      libstdc++, so use $(CXX) as the driver and drop the stale library
    patch_type: "portability"
  - patch_file: "patches/0003-config-sub-aarch64-ohos.patch"
    patch_description: >
      Teach the bundled 2001 config.sub about the aarch64 CPU and the ohos OS, so
      that the aarch64-linux-ohos triplet --build/--host pair is canonicalised
      instead of being rejected (same three-line fix as the aalib/1.4p5 recipe)
    patch_type: "portability"
  - patch_file: "patches/0004-configure-config-status-umask.patch"
    patch_description: >
      HMDFS marks new directories with the setgid bit, which makes the config.status
      scratch directory created with umask 077 unusable (the helper files inside it
      cannot be written), so create it with umask 022 instead (knowledge E129/E011)
    patch_type: "portability"
