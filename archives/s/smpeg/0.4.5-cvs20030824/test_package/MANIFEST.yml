package: smpeg/0.4.5-cvs20030824
homepage: "https://www.libsdl.org/projects/smpeg/"

upstream_check_command: "n/a"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests:
  - name: upstream-suite-audit
    command: "grep -nE 'check_PROGRAMS|^TESTS|check-local|^check:' Makefile.in audio/Makefile.in video/Makefile.in"
    expected: "no match: the 2003 release ships no test suite at all; the audit runs in build() and is recorded in the conan create log"

test_package_tests:
  - file: test_smpeg.c
    description: >
      Consumer (application) view: link the installed static libsmpeg through
      smpeg::smpeg and drive the public C API - version macros, SMPEG_new() on an
      unreadable stream, the documented SMPEG_error()/SMPEG_status() failure
      reporting, SMPEG_getinfo() on the failed object and SMPEG_delete().
      Prints one CHECK-OK line per assertion plus SMPEG_CONSUMER_OK.
    command: "./test_smpeg"

assertion_count: 6
