# conandata.yml — scanelf 1.3.9
#
# 本包是 pax-utils 的按工具拆分：源码取上游 pax-utils v1.3.9，只交付 scanelf
# （同一源码树的其他工具见 archives/p/pax-utils/1.3.10）。
#
# 单值带引号的 url：CI 的 replace_url() 只重写这种形式（写成 list 会关掉镜像注入），
# 注释里也不放任何带 scheme 的地址（预下载扫描会把它当源码去抓）。
#
# 端点选 codeload.github.com：真机直连 github.com/archive 会 connect/read 超时
# （2026-09-20 实测 ReadTimeout/ConnectTimeout），codeload 是 GitHub 官方 tag 制品
# 端点、可达。上游没有独立 release 附件，tag archive 即官方制品；tag 名带 v 前缀
# （不带 v 是 404）。codeload 路径没有 .tar.gz 后缀，故 source() 显式传 filename=，
# 否则 conan 误判 zip。
# 2026-09-30 两次独立下载字节一致：148310 B，
# sha256 d8db28f8f55d03b1f302b719857e9ffd6574ecade0c3b762ebd1c215e0a68754

sources:
  url: "https://codeload.github.com/gentoo/pax-utils/tar.gz/refs/tags/v1.3.9"
  sha256: "d8db28f8f55d03b1f302b719857e9ffd6574ecade0c3b762ebd1c215e0a68754"

patches:
  - patch_file: "patches/0001-use-portable-interpreter-shebangs.patch"
    patch_description: "OHOS 没有 /bin/bash，也没有裸 `python` 解释器（bash 在 harmonybrew 前缀下，PATH 上只有 python3），execve 这些写死的 shebang 会 ENOENT，而 meson 会把它误报成 dotest 脚本本身缺失。把上游 10 个 shell/python 脚本的 shebang 指向 /usr/bin/env bash 与 /usr/bin/env python3。"
    patch_type: "portability"
  - patch_file: "patches/0002-security-unshare-sigsys-guard.patch"
    patch_description: "ns_unshare(): unshare(2) 不一定以普通系统调用失败返回。在 seccomp 过滤器以 SECCOMP_RET_TRAP 拦截该调用时，内核给调用者投递 SIGSYS 而不是返回 -1/EPERM，默认处置直接杀死进程，于是上游只处理 EPERM 的回退路径看不到失败，工具会在 security_init() 内就死掉。仅在 unshare() 调用期间接管 SIGSYS，把陷入翻译为 EPERM——即 ns_unshare() 本来就会降级成的『没有可用 namespace』。检测在运行期完成，既不绑定任何工具链宏，也无法被静默跳过；unshare() 成功或返回自身 errno 时行为不变。"
    patch_type: "portability"
