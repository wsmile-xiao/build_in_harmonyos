# 版本级 manifest — scanelf 1.3.9
# 文件位置: archives/s/scanelf/1.3.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.9"

# 软件名
software: "scanelf"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游 pax-utils v1.3.9 tag 归档；scanelf 是该树里的一个工具，
  # 上游没有独立 scanelf 仓库，本包按工具拆分，只交付 bin/scanelf）
  url: "https://codeload.github.com/gentoo/pax-utils/tar.gz/refs/tags/v1.3.9"

  # 源码校验和（2026-09-30 两次独立下载字节一致：148310 B）
  sha256: "d8db28f8f55d03b1f302b719857e9ffd6574ecade0c3b762ebd1c215e0a68754"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表（MesonToolchain project_options）
  configure_options:
    - "-Ddefault_library=static"
    - "-Dtests=true"                  # 注册上游 tests/{lddtree,pspax,scanelf,source} 套件
    - "-Duse_fuzzing=false"           # libFuzzer 探针非功能测试
    - "-Duse_libcap=disabled"         # 保持零运行时依赖
    - "-Duse_seccomp=false"           # 上游手写 BPF allowlist 在 OHOS 上 SIGSYS 杀进程（见 notes.md）
    - "-Dbuild_manpages=disabled"     # 设备无 xmlto
    - "-Dlddtree_implementation=sh"   # python 实现需 pyelftools，目标环境没有

  # 编译依赖列表（格式: name/version）
  # 以上三者均为 tool_requires（构建工具），非运行时依赖
  dependencies:
    - "meson/1.11.0"
    - "ninja/1.12.1"
    - "pkgconf/3.0.5"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-use-portable-interpreter-shebangs.patch"
  - "0002-security-unshare-sigsys-guard.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 的 musl 把 libc 与动态加载器做成同一个文件：/system/lib/ld-musl-aarch64.so.1；进程 /proc/self/maps 里没有 libc.so 条目，按 libc.so 名字找系统 C 库会落空（应匹配 ld-musl-* 或 libc.so*）。"
  - "上游 dotest 脚本用写死的 shebang（#!/bin/bash、#!/usr/bin/env python）在 OHOS 上 execve 直接 ENOENT（无 /bin/bash、无裸 python），而 meson 会把它误报为 dotest 脚本本身缺失——shebang 必须走 /usr/bin/env bash 与 python3。"
  - "unshare(CLONE_NEW*) 在 OHOS 上被平台 seccomp 以 SECCOMP_RET_TRAP 拦截，内核投递 SIGSYS（默认处置 = 杀进程，exit 159）而不是返回 EPERM，上游只处理 EPERM 的回退路径完全看不到失败；运行期 SIGSYS 守护（翻译为 EPERM）可解，无需平台条件编译宏。"
  - "meson 的 configure 不继承 conan profile 的自定义 buildenv，找不到 clang 默认归档器 llvm-ar 会在 meson.build:1 直接 ERROR（Unknown linker）——须把 LLVM 工具链显式 pin 进去（同一坑见 archives/a/account-utils、正例 archives/j/jose/15）。"
  - "本机 /tmp 只读（Read-only file system）：编译器/测试脚本的临时文件要落 $TMPDIR 或工作目录，写死 /tmp 的探测脚本会自伤。"
