# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: scanelf/1.3.9
homepage: "https://github.com/gentoo/pax-utils"

# 上游测试入口：meson 注册的 dotest 套件（上游 .github/workflows/build-test-ci.yml
# 用 `ninja -C build test` 跑同一批用例）。上游没有 make check / ctest。
upstream_check_command: "meson test -C <builddir>  (需 -Dtests=true)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir>  (由 conan.tools.meson.Meson.test() 调用)"

# -Dtests=true 注册 6 条套件；-Duse_fuzzing=true 会再加 2 条 libFuzzer 探针（非功能测试，本配方显式关闭）。
# 2026-09-30 真机 conan create 实测：Ok 6 / Fail 0，日志 reports/conan-create.log。
upstream_suite_count: 6
upstream_assertion_count: 13

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/scanelf/dotest
    source: pax-utils-1.3.9/tests/scanelf/dotest
    description: "本包交付物直接对应用例：scanelf -qsmain -F'%s %f' \"<builddir>/scanelf\" 的输出与 golden tests/scanelf/scanelf.simple.good 逐字节比对。真机有效用例（实测 PASS: scanelf.simple）。"
    command: "meson test scanelf-test"
  - file: tests/pspax/dotest
    source: pax-utils-1.3.9/tests/pspax/dotest
    description: "pspax 跑一遍 /proc，要求 stderr 为空。真机有效用例（直接考验 OHOS procfs 与进程枚举）；pspax 本身不在本包交付范围（见 archives/p/pax-utils）。实测 PASS: pspax.err。"
    command: "meson test pspax-test"
  - file: tests/lddtree/dotest-sh
    source: pax-utils-1.3.9/tests/lddtree/dotest-sh（尾部 include dotest-sfx）
    description: "lddtree.sh /bin/bash | grep -i none 期望空。OHOS 上 /bin/bash 不存在，空输出恰好满足期望 → 该用例在本平台空跑（上游用例把 /bin/bash 当固定输入的自身局限，非移植引入）。实测 PASS: lddtree.sh.smoke。"
    command: "meson test lddtree-sh"
  - file: tests/lddtree/dotest-py
    source: pax-utils-1.3.9/tests/lddtree/dotest-py
    description: "同上，走 lddtree.py；本机 python 无 elftools（pyelftools）模块，stderr 报 ModuleNotFoundError 而 stdout 仍空 → 同样空跑。实测 PASS: lddtree.py.smoke。"
    command: "meson test lddtree-py"
  - file: tests/lddtree/dotest-cmp
    source: pax-utils-1.3.9/tests/lddtree/dotest-cmp
    description: "比较 lddtree.py 与 lddtree.sh 对 /bin/bash 的 -l / -l -a 列表输出。两端输入都不存在 → 比的是「两个空文件相同」，成立但无效。实测 2 条 PASS。"
    command: "meson test lddtree-cmp"
  - file: tests/source/dotest
    source: pax-utils-1.3.9/tests/source/dotest
    description: "源码风格/禁用函数扫描。上游 tests/*/meson.build 只导出 builddir/srcdir/current_srcdir，脚本却用未定义的 top_srcdir，find '' 直接报错、产出空文件，7 条 PASS 全为空跑（上游自身缺陷）。"
    command: "meson test 'source tests'"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_scanelf.sh
    description: "15 条消费者断言，其中 4 条为鸿蒙特有场景。①交付物与拆包隔离性：bin/scanelf 可执行、本包只交付 scanelf（不得夹带 dumpelf/pspax/scanmacho/lddtree/symtree）、licenses/COPYING 交付；②工具功能：-V 版本自证（pax-utils-1.3.9）、-qsmain -F'%s %f' 在「安装后的二进制」上复现上游 golden 语义（输出恰为 \"main scanelf\"）、-q -F'%f %n' 多文件逐行输出、-I OSABI 视图、-t 类型视图；③[OHOS] -n 报出 musl 运行时 libc.so 且无 glibc 的 libc.so.6；④[OHOS] -i 解出 INTERP 且指向 musl 加载器（/lib/ld-musl-aarch64.so.1），证实产物是 OHOS/musl 目标；⑤[OHOS] 运行期从 /proc/self/maps 解析真实系统 musl C 库（OHOS musl 的 libc 即加载器 ld-musl-aarch64.so.1，maps 里没有 libc.so 条目；路径不写死，真机与 CI 同样成立），分别用 -n / -e 解析出 ET_DYN；⑥2 条负向对照（非 ELF 输入不得产出符号匹配、不得解出 ET_DYN/ET_EXEC）防假绿。"
    command: "sh test_scanelf.sh <package bin dir> <package folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
