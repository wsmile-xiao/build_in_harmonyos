sources:
  # 镜像列表形态：官方源 + GitHub 加速镜像（conan 2 原生按序多源尝试，
  # CI Worker 与本机网络波动时自愈；SDL2 2.30.10 / libosmo-netif 1.6.0 同款打法）
  url:
    - "https://github.com/jarikomppa/soloud/archive/refs/tags/version_1_0.tar.gz"
    - "https://ghfast.top/https://github.com/jarikomppa/soloud/archive/refs/tags/version_1_0.tar.gz"
    - "https://gh-proxy.com/https://github.com/jarikomppa/soloud/archive/refs/tags/version_1_0.tar.gz"
  sha256: "dea10b4ab9c1cc2ce45dd1074d7a0942032c9110af424fbf21203a54fb6c6d3b"

patches:
  - patch_file: "patches/0001-add-headless-cmakelists.patch"
    patch_description: "add headless CMakeLists.txt (upstream version_1_0 ships none); builds core/sinewave/speech/wav/filter, excludes SDL back-end and demos"
    patch_type: "portability"
  - patch_file: "patches/0002-klatt-fix-gElement-declaration.patch"
    patch_description: "klatt.cpp: drop the stray 'extern Element gElement[]' forward declaration (clang rejects static redefinition after extern; gcc tolerated it) — gElement is only used inside klatt.cpp"
    patch_type: "bugfix"
