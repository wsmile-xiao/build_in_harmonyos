version: "version_1_0"
status: built
build_date: "2026-09-20"

source:
  url: "https://github.com/jarikomppa/soloud/archive/refs/tags/version_1_0.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "SOLOUD_HEADLESS=ON (由 patch 注入的 CMakeLists 固化)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-add-headless-cmakelists.patch"
  - "0002-klatt-fix-gElement-declaration.patch"

knowledge_gained:
  - "上游 version_1_0（2013 首个 tag）无任何构建系统：demos 直接驱动 SDL。补丁注入 headless CMakeLists——只编纯软件混音核心（core/sinewave/speech+Klatt TTS/wav+自带 stb_vorbis/filter），排除 sdl/ 后端与全部 SDL demos，实现 OHOS 零依赖"
  - "version_1_0 的 Soloud 类无 deinit()（后端负责关停）；setText(char*) 收非 const 指针；play() 首次调用返回 handle 0 合法（ch|mPlayIndex<<8 且 mPlayIndex 从 0 起），-1 才是失败——消费者测试按 2013 API 原型编写"
  - "klatt.cpp 上游缺陷：extern Element gElement[] 前向声明 + static 定义冲突（gcc 容忍 clang 拒绝）——bugfix 补丁删除死 extern（gElement 仅 klatt.cpp 内部使用）"
  - "soloud_wav.h 公共头用 FILE* 未 include <stdio.h>（上游靠 .cpp TU 顺序掩盖）——消费者侧先含 <cstdio> 规避，头文件保持原样"
  - "patch-ng 与 GNU patch 差异：手写 patch hunk 行数声明必须与实际 + 行数严格一致（声明 61 实际 65 行被截断）；复杂删行补丁用 git diff 生成标准格式最稳"
  - "OHOS 二进制执行：mksh 不能直接跑 ELF，test() 用 bash 包装 + LD_LIBRARY_PATH 补 SDK llvm triplet 目录（soundtouch 先例复用）"
  - "GitHub 直连波动：conandata 用镜像列表形态（官方+ghfast.top+gh-proxy.com），conan 2 原生按序多源自愈（SDL2 2.30.10 同款打法）"
