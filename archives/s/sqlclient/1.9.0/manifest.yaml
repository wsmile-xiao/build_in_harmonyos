version: "1.9.0"
software: "sqlclient"
status: adapted
build_date: "2026-09-10"
build_system: "autotools + gnustep-make"

source:
  url: "https://ftp.gnustep.org/pub/gnustep/libs/SQLClient-1.9.0.tar.gz"
  sha256: "4de755329874912eafd70d36dc2478c2fc9d6345da30ba2cdb710c35d041ba46"
  tar_format: tar.gz

build:
  system: "autotools configure + gnustep-make"
  configure_options:
    - "--disable-ecpg-bundle (制品仓无 libecpg 依赖库)"
    - "--disable-jdbc-bundle (制品仓无 Java/JDBC VM 依赖)"
    - "保留 MySQL/Postgres/SQLite 三个数据库后端 bundle"
  dependencies:
    - "gnustep-base/1.31.1"
    - "performance/0.6.0"
    - "libobjc2/2.2.1"
    - "mysql/8.0.46 (MySQL 后端)"
    - "libpq/18.6 (Postgres 后端)"
    - "sqlite3/3.53.4 (SQLite 后端)"
  tool_requires:
    - "gnustep-make/2.9.2.1"

patches:
  - "patches/0001-mysql-header-path.patch (MySQL 头文件路径 <mysql/mysql.h> → <mysql.h> 适配 conan mysql 包布局)"

tests:
  upstream_tests_discovered: true
  upstream_tests_count: 5
  upstream_tests_note: "上游自带 testSQLite/testMySQL/testPostgres/testECPG/testJDBC 五个后端测试工具（test-tool.make 注册），依赖真实数据库连接，OHOS 上需逐项实测；test_package 消费者测试验证核心 API"
  upstream_tests_executed: 0
  consumer_test: "Objective-C consumer test in test_package (SQLClient/SQLRecord/SQLClientPool 类解析与核心 API)"

notes:
  - "SQLClient 是 GNUstep SQL 数据库访问框架，核心为 libSQLClient（SQLClient.m + SQLClientPool.m）"
  - "autotools configure 生成 config.make 控制各后端 bundle 构建，GNUstep make 构建核心库与 bundle"
  - "核心库硬依赖 performance（GSCache/GSTicker），已随 Performance 0.6.0 合入发布"
  - "MySQL/Postgres/SQLite 后端全部保留（制品仓依赖齐备），供 adun.app 等下游按需加载"
  - "ECPG/JDBC 后端因制品仓无对应依赖库而禁用（configure --disable-*-bundle）"
  - "bundle 产物经 GNUstep make 构建，hmdfs ln 限制用 LN_S=true + copyfile 规避"