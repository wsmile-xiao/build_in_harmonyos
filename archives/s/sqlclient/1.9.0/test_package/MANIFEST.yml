# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sqlclient/1.9.0
homepage: "https://gnustep.github.io/"

# 上游测试命令 (SQLClient 后端 bundle 自带 testECPG/testJDBC/testMySQL/
# testPostgres/testSQLite 测试工具，依赖真实数据库连接)
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "testSQLite / testMySQL / testPostgres (需真实数据库连接)"

# 上游实际运行的测试程序
# SQLClient 1.9.0 源码 GNUmakefile 注册 5 个后端测试工具 (TEST_TOOL_NAME),
# 均需真实数据库连接；test_package 提供消费者测试验证核心 API。
upstream_tests:
  - name: "testSQLite"
    discovered: 1
    note: "需真实 SQLite 数据库连接 (sqlite3_open)"
  - name: "testMySQL"
    discovered: 1
    note: "需真实 MySQL 服务连接 (mysql_init)"
  - name: "testPostgres"
    discovered: 1
    note: "需真实 PostgreSQL 服务连接 (PQfformat)"
  - name: "testECPG"
    discovered: 1
    note: "ECPG 后端, 制品仓无依赖库, 适配中关闭"
  - name: "testJDBC"
    discovered: 1
    note: "JDBC 后端, 制品仓无依赖库, 适配中关闭"

# test_package 中自带的测试 (消费者视角验证核心 API)
test_package_tests:
  - file: test_sqlclient.m
    description: "消费者测试: SQLClient/SQLRecord/SQLClientPool/SQLTransaction 类解析、SQLClient defaultClient、SQLRecord alloc+init、C 支撑函数引用"
    command: "./test_sqlclient"

# 构建方式说明: 本 test_package 使用直接 clang 编译(本机 cmake 需系统
# libc++_shared.so 而加载失败), 与主配方验证过的工具链一致
build_method: direct-clang

# 测试断言总数
assertion_count: 8