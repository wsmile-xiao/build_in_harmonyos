# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点证据 (R51)：
#   1. 上游 GitHub release tarball (v3.2.0) 内无 tests/ 目录；
#   2. 顶层 Makefile.am 的 SUBDIRS 仅有 include/lib/examples，无测试目录，
#      `make -n check` 不注册任何检查程序（automake check 目标为空）；
#   3. configure.ac 提供 --enable-unittest，但 m4/unittest.m4 只定义
#      AM_CONDITIONAL(ENABLE_UNITTEST)，全部 Makefile.am 中无任何引用；
#   4. tarball 中唯一带 "test" 的文件为 examples/thread/ThreadTest.h（示例头
#      文件）与 lib/Core 的框架源码本身，均非断言型测试套件。
#   因此上游自动化用例数 = 0，适配后按赛道底线补充消费者测试（见下）。

package: skypat/3.2.0
homepage: "https://github.com/skymizer/SkyPat"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (上游无自动化测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，不替代上游测试统计)
test_package_tests:
  - file: test_skypat.cpp
    description: "消费者 API 测试：SKYPAT_F 注册/运行、EXPECT/ASSERT 断言、PERFORM() 计时与 perf 降级（经 CSVResultPrinter 校验真实时间递增）"
    command: "./test_skypat"

# 测试断言总数 (近似值): 6 个框架断言 + 6 个运行期校验
assertion_count: 12
