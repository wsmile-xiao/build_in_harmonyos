sources:
  url: "https://github.com/skymizer/skypat/archive/refs/tags/v3.2.0.tar.gz"
  sha256: "820baae29d355cfa3364d71dad4356cb0938d420a61d8fbc408c22f33177b8c0"

patches:
  - patch_file: "patches/0001-lib-Support-Unix-Perf.inc.patch"
    patch_description: >-
      Runtime perf_event_open capability probe for the counter path: refuse to
      read/ioctl an invalid descriptor, report the failure once on stderr and
      degrade counters to 0 instead of returning uninitialized stack data.
      (OHOS sysroot provides linux/perf_event.h and asm/unistd.h, but the
      kernel denies perf_event_open with EACCES at run time.)
    patch_type: "portability"
  - patch_file: "patches/0002-lib-Support-Unix-Timer.inc.patch"
    patch_description: >-
      Timer fallback: use the perf clock only when a descriptor was actually
      granted, otherwise fall back to clock_gettime/gettimeofday instead of
      returning uninitialized stack data; report the fallback once.
    patch_type: "portability"
  - patch_file: "patches/0003-lib-Thread-Pthread-Mutex.inc.patch"
    patch_description: >-
      Add the exception specification 'throw()' to the Mutex::tryLock()
      definition so it matches the declaration in Mutex.h.  clang in C++17
      mode treats the missing specification as a hard error ('tryLock' is
      missing exception specification 'throw()'), and the OHOS profile
      compiles with -std=c++17.
    patch_type: "portability"
