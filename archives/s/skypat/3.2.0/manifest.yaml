# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "perf_event_open 在 OHOS 上编译可用（头文件与 __NR=241 均在）但运行期返回 EACCES：编译期 AC_CHECK_HEADERS 门控不能代表运行期权限，须按 fd 有效性做运行期探测并为计时提供时钟回退（补丁 0001/0002）。"
  - "上游在 fd=-1 时仍 read() 未初始化栈缓冲并以 assert 兜底：Release 下输出伪数据（实测 fib(10) 报 156.9 秒），Debug 下可能中止；修复须同时校验 read() 返回值。"
  - "OHOS profile cppstd=17 覆盖 Makefile 的 -std=c++11：老代码的异常规范声明/定义不匹配（tryLock 缺 throw()）会成为硬错误，需补丁修复而非对抗工具链（补丁 0003）。"
  - "GitHub git-snapshot 发布包无 configure：CI 干净 PATH 缺 aclocal/automake/libtoolize，用 tool_requires(automake/1.18 + libtool/2.5.4) + bash -e autogen.sh 引导。"
  - "HMDFS 上 toybox mktemp -d 目录不可写会中止 config.status：构建目录内 mktemp wrapper（mkdir）仅注入 conanbuild PATH（E011 mktemp -d 变体）。"
  - "config.guess 不识 HarmonyOS：显式 --build/--host=aarch64-unknown-linux-gnu（E007/E160）。"

