# 软件级 manifest — skypat
# 文件位置: archives/s/skypat/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: skypat
display: "SkyPat"
description: "C++ performance analyzing and testing framework (perf_events + unit tests)"
category: library
homepage: "https://github.com/skymizer/SkyPat"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub 发布包为 git snapshot（无预生成 configure）：tool_requires(automake/1.18 + libtool/2.5.4) 补齐 CI 缺失的 aclocal/automake/libtoolize，以 bash -e autogen.sh 引导"
    - "config.guess 不识 HarmonyOS：显式 --build/--host=aarch64-unknown-linux-gnu"
    - "HMDFS toybox mktemp -d 目录不可写导致 config.status 中止：构建目录内私有 mktemp wrapper（仅注入 conanbuild PATH）"
    - "OHOS profile cppstd=17：补丁 0003 修复 Mutex::tryLock() 缺失 throw() 异常规范（C++17 硬错误）"
    - "OHOS 运行期 perf_event_open 返回 EACCES：补丁 0001/0002 将 PERFORM() 改为运行期能力探测（fd 有效性）+ 计时时钟回退 + 计数诚实 0 + 一次性 stderr 报告"
    - "zlib 未被任何源码引用：--without-zlib 保持零依赖"
  common_dependencies: []

versions:
  "3.2.0":
    status: built
    build_date: "2026-09-16"
    conan_ref: "skypat/3.2.0"
