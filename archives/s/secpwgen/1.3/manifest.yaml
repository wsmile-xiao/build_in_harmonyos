knowledge_gained:
  - "上游只给 Makefile.proto 且默认把 OpenSSL 后端注释掉：不给 CRYPTO_OBJS=secure_random_openssl.o 就会缺 SRNG_init/SRNG_bytes/SRNG_destroy 符号链接失败"  # knowledge_ref: 无需独立条目（上游打包者配置项，非平台问题；手写 Makefile 命令行接管同类先例 archives/v/vamps/0.99.2）
  - "上游 LDFLAGS 默认含 LINK_STATIC=-static；GNU make 命令行赋值胜过 makefile 内赋值（除非用 override），一条命令行即可同时接管 CC/CRYPTO_OBJS/CFLAGS/LDFLAGS，构建系统零补丁"  # knowledge_ref: 无需独立条目（GNU make 语义；同类先例 archives/v/vamps/0.99.2）
  - "鸿蒙 E051：非特权进程发起特权 id syscall（seteuid/setreuid 族）会被内核回以不可捕获的 SIGSYS（退出码 159），signal handler 完全无效；正解是在调用前判定该调用是否为空操作并跳过，而不是尝试捕获信号"  # knowledge_ref: E051
  - "seteuid(getuid()) 的空操作守卫用 geteuid()==getuid() 判定即可，纯 POSIX、对非鸿蒙平台透明，规避 R8/PF5 的补丁平台宏禁令（screen 5.0.0 用另一种口径把失败改成非致命，但对 SIGSYS 无效，因为进程在返回前就被杀）"  # knowledge_ref: E051, DRAFT-E577, knowledge/drafts/DRAFT-secpwgen-1.3-e051-privileged-id-noop-guard.kv（本次新增草稿：E051 的 __OHOS__ 修法已被 R8/PF5 判废，补上特权 id syscall 族的无平台宏方案）
  - "openssl/3.5.6 为 no-shared 静态变体，链入后产物 DT_NEEDED 只有 libc.so；可直接用 llvm-nm/readelf 验证 R26 系统同名库不落地 /lib"  # knowledge_ref: R26（系统同名库静态），archives/o/openssl/3.5.6/conanfile.py
  - "交叉产物的鸿蒙 ABI 可用纯 Python 解析 ELF 校验（e_machine=EM_AARCH64、.interp=/lib/ld-musl-aarch64.so.1、DT_NEEDED），不依赖 worker 上是否有 readelf，且在无法执行目标二进制的 macOS 模拟环境里同样能跑"  # knowledge_ref: 无需独立条目（同类先例 archives/w/wasi-runtimes/25.0.0 的 check_wasi_assets.py；本机 can_run 误判处置见 archives/l/libidl2/0.8.14）
  - "验证补丁是否真编入产物：比对目标文件（非链接产物）的未定义符号——未打补丁的 secure_memory_unix.o 只引用 getuid/seteuid，打补丁后多出 geteuid；链接产物层面不可用，因为静态 libcrypto 自身也引用 geteuid"  # knowledge_ref: 已写入 knowledge/drafts/DRAFT-secpwgen-1.3-e051-privileged-id-noop-guard.kv 的 verification_cmd 第 3-4 步
  - "secpwgen 各模式的 ;ENTROPY= 值是参数的确定函数（13.00/词 Diceware、11.00/词 S/Key、5.17/元素 alnum|special、7.75/元素音节、-r 为 bytes<<3、-k 为 bytes*7），可当强断言用；-Aadhs 的长度只能断言下界，因为 special 表含 4 个双字符记号（-- == .. //）"  # knowledge_ref: 无需独立条目（包内特性，已固化在 test_package/test.sh 的 F1-F8 断言与 notes.md）

