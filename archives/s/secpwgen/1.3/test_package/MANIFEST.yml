# test_package/MANIFEST.yml — secpwgen 1.3
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。
# 详见 docs/TEST_QUALITY_SPEC.md
#
# 计数口径（唯一口径，贯穿 MANIFEST / notes.md / 测试日志 / PR 两张表）：
#   按「独立检查项数量」计数 —— 每个检查项可单独判定成败、单独打印 ok/FAIL，
#   同一检查项在 build() 与 test_package 各执行一次也只计 1 项（A1-A3）。
#   适配后合计 17 项 = 功能补全 10 项（F1-F10）+ 鸿蒙特有 7 项（A1-A4 + H1-H3）。

package: secpwgen/1.3
homepage: "https://github.com/itoffshore/secpwgen"

# ── 上游测试套件存在性（经审计官方 tar 包确认）──────────────────────
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

upstream_test_audit:
  source_tarball: "secpwgen-1.3.tar.gz (https://github.com/itoffshore/secpwgen/archive/refs/tags/v1.3.tar.gz)"
  source_sha256: "ae2e33db5c94a18d55ad50563b026f3aecd9d4f6ebb19b2dcc9a68625fd1f509"
  upstream_tag_commit: "c454e82808 (tag v1.3, 仓库唯一 tag)"
  build_system: "手写 Makefile.proto（无 configure / 无 CMake / 无 meson；README 要求打包者自行 cp 成 Makefile 并取消注释加密后端）"
  scanned_for:
    - "tests/ 或 test/ 目录"
    - "Makefile.proto 中的 check / test 目标"
    - "gtest / criterion / check / CUnit 等 C 测试框架绑定"
    - "*_test.c / test_*.c 命名的测试源文件"
  scan_result: "tarball 共 20 个文件：ChangeLog、LICENSE、Makefile.proto、README、README.md、secpwgen.1(man)、cexcept.h、diagnostics.h、exceptions.h、pwgen.h、secure_memory.h、secure_random.h、diceware8k.c(8192 词表数据)、skeylist.c(2048 词表数据)、main.c、pwgen.c、secure_memory_unix.c、secure_random_openssl.c、secure_random_cryptlib.c。无 tests/ 或 test/ 目录；Makefile.proto 的 .PHONY 目标仅 all/install-strip/install/clean，无 check 或 test 目标；无第三方测试框架依赖；两个 *.c 词表文件是数据表而非测试。"
  reason: "secpwgen 1.3 上游无任何测试框架与测试目标（Makefile.proto 只有 all/install-strip/install/clean），按 no_tests 处理；适配后由 test_package 补全 17 个独立检查项。"

# 上游测试命令（无测试套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 中未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ── test_package 自带的功能测试（上游无测试，适配后补全）────────────
# 执行位置: test_package/test.sh（can_run() 为真时在 HarmonyOS 上实跑）
test_package_tests:
  - file: test.sh
    description: >-
      功能补全 10 项（F1-F10），覆盖 secpwgen 全部文档化 CLI 模式，并断言
      精确 ENTROPY 值（该值只由参数决定：Diceware 13.00/词、S/Key 11.00/词、
      alphanumeric|special 5.17/元素、syllables 7.75/元素、-r 为 bytes<<3、
      -k 为 bytes*7），因此同时锁定本平台 libm 与熵计账：
      F1 -p 4 → 4 词 + 52.00 bits；F2 -pe 5 → 5 词且熵严格高于未增强的
      65.00；F3 -s 4 → 4 词 + 44.00 bits；F4 -se 4 → 熵严格高于 44.00；
      F5 -Aa 16 → 恰好 16 个 [A-Z0-9] + 82.72 bits；F6 -Aadhs 20 → ≥20 字符
      + 103.40 bits（special 表含 4 个双字符记号，故为下界）；
      F7 -r 128 → 22 位 base64 + "==" + 128.00 bits；F8 -k 128 → 全大写
      koremutake 音节 + 133.00 bits；F9 无参数 → rc=1 且 stderr 含 USAGE；
      F10 -p 0 → rc=1 且 stderr 含 "ERROR: N must be an integer > 0"。
    command: "sh test.sh <bindir>"
    assertion_count: 10

# ── 鸿蒙特有测试（rule12: N >= 1，本包 N = 7）──────────────────────
harmonyos_specific_tests:
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A1: 产物为 ELF64 小端且 e_machine == EM_AARCH64(183)，
      即 HarmonyOS PC arm64 目标（交叉编译三元组 aarch64-linux-ohos 生效）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/secpwgen"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A2: .interp == /lib/ld-musl-aarch64.so.1，即鸿蒙 musl 动态
      加载器；glibc 产物会是 /lib/ld-linux-aarch64.so.1，故该断言可区分
      工具链/sysroot 是否真的指向 OHOS。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/secpwgen"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A3: DT_NEEDED 不含 libcrypto/libssl（实测只有 libc.so）。
      R26 要求系统同名库 openssl 静态链接，避免向鸿蒙 /lib 投放同名 .so；
      该断言把这条平台约束固化成可执行检查。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/secpwgen"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A4: secure_memory_unix.o 存在未定义符号 geteuid，证明 E051
      的 drop_privileges() 空操作守卫确实编入产物（未打补丁的同一编译单元
      只引用 getuid/seteuid，从不引用 geteuid，该检查会 FAIL）。仅在
      conanfile.py build() 中执行：目标文件不进包。
    command: "python3 ohos_abi_check.py --binary <build>/secpwgen --object <build>/secure_memory_unix.o"
    assertion_count: 1
  - file: test.sh
    description: >-
      鸿蒙特有 H1（E051）: 鸿蒙内核对非特权进程发起的特权 id syscall 回以
      不可捕获的 SIGSYS（退出码 159），上游无条件调用 seteuid(getuid())
      会在 secure_memory_init() 阶段直接被打死。断言打包后的二进制退出码
      != 159 且 stderr 无 "FATAL: system call failed"，即补丁生效。
    command: "sh test.sh <bindir>"
    assertion_count: 1
  - file: test.sh
    description: >-
      鸿蒙特有 H2: 鸿蒙应用沙箱可能拒绝 mlockall(MCL_FUTURE)/mlock() 与
      setrlimit(RLIMIT_CORE)。上游对此已降级为 "WARNING: using insecure
      memory."，本项断言无论走哪条路径都仍产出正确口令（-Aa 12 → 12 位
      [A-Z0-9] + 62.04 bits）、rc=0 且无 FATAL，并记录实际走的是哪条路径。
    command: "sh test.sh <bindir>"
    assertion_count: 1
  - file: test.sh
    description: >-
      鸿蒙特有 H3: 熵源可用性。RAND_bytes 必须由鸿蒙内核 RNG 正确播种，
      否则 Blowfish 计数式 SRNG 会输出可预测口令。连续两次 -r 128 的输出
      必须不同（cmp 判定）。
    command: "sh test.sh <bindir>"
    assertion_count: 1

# 测试断言总数（独立检查项：功能补全 10 + 鸿蒙特有 7）
assertion_count: 17
test_package_test_count: 10
harmonyos_specific_test_count: 7
count_method: "independent_check_items"
