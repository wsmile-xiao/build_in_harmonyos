# conandata.yml — secpwgen 1.3
# 上游源码: GitHub 官方仓库 itoffshore/secpwgen（作者 Željko Vrba 的 secpwgen 源码托管，
#   官方源 R39/PF7；Alpine community/secpwgen 1.3 亦以此 tag 为唯一上游来源）
#   https://github.com/itoffshore/secpwgen/archive/refs/tags/v1.3.tar.gz
# sha256 = ae2e33db5c94a18d55ad50563b026f3aecd9d4f6ebb19b2dcc9a68625fd1f509
#   （本地实测下载校验，与 tag v1.3 的 commit c454e82808 对应）
# 适配补丁共 1 个（见下方 patches 段）：上游 Makefile.proto 的打包者配置项
#   （CRYPTO_OBJS/CRYPTO_LIBS/LINK_STATIC/PREFIX）全部由 build() 在 make 命令行
#   注入接管，构建系统无需补丁；唯一源码改动是 secure_memory_unix.c 的
#   drop_privileges() 空操作守卫（HarmonyOS E051：不可捕获 SIGSYS）。
# 注意（R39/PF7）：此处只写官方源，不得手写镜像前缀。ci/conan/build_and_test.sh
#   会在运行时自动加 gh-proxy.com 镜像回退（mirrors = [镜像, 官方]），写进版本库
#   反而会被 create-pr 的 PF7 源URL闸判为 R39 违规。

sources:
  url: "https://github.com/itoffshore/secpwgen/archive/refs/tags/v1.3.tar.gz"
  sha256: "ae2e33db5c94a18d55ad50563b026f3aecd9d4f6ebb19b2dcc9a68625fd1f509"

patches:
  - patch_file: "patches/0001-secure_memory_unix.c.patch"
    patch_description: "Skip the no-op seteuid(getuid()) privilege drop when the effective uid already equals the real uid. HarmonyOS kills an unprivileged process that issues the privileged-id syscall with an uncatchable SIGSYS (E051, exit 159), so the unpatched binary dies during secure_memory_init() before producing any output. Plain POSIX guard, no platform macro (R8)."
    patch_type: "portability"
