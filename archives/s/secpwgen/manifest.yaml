# 软件级 manifest — secpwgen
software: secpwgen
display: "secpwgen"
description: "安全口令/通行短语生成器（OpenSSL CSPRNG + 锁定内存）"
category: crypto
homepage: "https://github.com/itoffshore/secpwgen"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游只给 Makefile.proto（要求打包者自行 cp 成 Makefile 并取消注释加密后端）；配方经 make 命令行注入 CC/CRYPTO_OBJS/CFLAGS/LDFLAGS 全量接管，构建系统无需补丁"
    - "必须显式给 CRYPTO_OBJS=secure_random_openssl.o，否则 SRNG_* 符号缺失链接失败（上游默认注释掉，另有 cryptlib 后端可选）"
    - "上游 LDFLAGS 默认带 LINK_STATIC=-static，必须压掉：Conan 提供的 libcrypto.a 要在可重定位包里按需静态链入"
    - "secure_random_openssl.c 刻意使用 OpenSSL 3 已弃用但仍提供的低层 Blowfish API（BF_set_key/BF_ecb_encrypt），用 -DOPENSSL_SUPPRESS_DEPRECATED 显式声明意图"
    - "唯一源码补丁 patches/0001-secure_memory_unix.c.patch：drop_privileges() 增加 geteuid()==getuid() 空操作守卫。鸿蒙对非特权进程发起的特权 id syscall 回以不可捕获的 SIGSYS（E051，退出码 159），未打补丁的二进制会在启动阶段被直接打死。守卫为纯 POSIX 写法，不含平台宏（R8/PF5）"
    - "openssl/3.5.6 为 no-shared 静态变体（R26 系统同名库），产物 DT_NEEDED 只有 libc.so，不向鸿蒙 /lib 投放同名 .so"
    - "mlockall(MCL_FUTURE)/mlock() 与 setrlimit(RLIMIT_CORE) 在鸿蒙沙箱内可能被拒；上游已降级为 WARNING 非致命，无需补丁"
    - "上游无任何测试套件；test_package 补全 17 个独立检查项（功能 10 + 鸿蒙特有 7）"
  common_dependencies:
    - openssl

versions:
  "1.3":
    status: built
    build_date: "2026-09-22"
    conan_ref: "secpwgen/1.3"
