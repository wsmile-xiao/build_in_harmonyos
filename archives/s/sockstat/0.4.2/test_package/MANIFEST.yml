package: sockstat/0.4.2
homepage: "https://codeberg.org/alteholz/sockstat"

# ── 上游测试清点（R51 第一步：适配前清点，如实申报，不允许"没环境"当理由）──
# 官方 tarball（codeberg tag v0.4.2，sha256 f2e89b4b…8819）完整文件清单：
#   .gitignore  CHANGELOG  LICENSE  Makefile  README.md  sockstat.1  sockstat.c
#   → 无 tests/ 目录、无 test/ 目录、无 CI 配置、无 fixture。
# 上游 Makefile 的全部 target：sockstat / all / build / install / clean / distclean
#   → 无 check、无 test，无 ctest/pytest 注册。
# 结论：上游 0.4.2 确无自动化测试（N = 0），证据如上（文件清单 + target 清单）。
upstream_check_command: ""
upstream_test_command: ""
upstream_test_in_build: false
upstream_tests: []
upstream_test_inventory:
  tarball_files: 7
  tests_dir: false
  makefile_test_target: false
  ctest_or_pytest_registration: false

# ── 补全测试用例（本包新增，全部真实执行本包产出的 bin/sockstat）──────────
test_package_tests:
  - file: test.sh
    description: >-
      sockstat 消费者测试（31 断言，六组）：
      T1 产物完整性 6（bin 可执行 / ELF magic / e_machine=183 aarch64 /
      e_type=ET_DYN PIE / man page / LICENSE）；
      T2 参数解析 6（-h、usage 选项覆盖度、-Z 非法选项、-p 99999 越界端口、
      -p abc 非法端口、-p 0-1 合法区间——全部在打开 /proc/net 之前返回，
      故 OHOS 真机必过）；
      T3 读表路径 11（默认/-4/-6/-u/-l/-c/-R tcp/-R udp/-P/-U/-o 每种调用
      必须给出表头或明确的 /proc/net 权限诊断）；
      T4 鸿蒙特有 4（NEEDED 仅 libc.so 无宿主 .so 污染、包内无 .so/.a 不污染
      /lib、受限态必须点名 /proc/net/<file> 而非静默输出空表、受限态 rc=134
      与上游 abort() 语义一致）；
      T5 读表内容校验 3（PROTO 列取值域、PID 列全数字、SOURCE ADDRESS 契约）；
      T6 上游已知缺陷取证 1（-G 组过滤：区分 SIGSEGV(139)=上游 gr_mem NULL
      dereference 与 SIGABRT(134)=OHOS /proc/net 沙箱前置拦截——真机上 abort
      发生在读表阶段、早于缺陷代码约 140 行，故不能拿它当缺陷证据）。
    command: "bash test.sh <package_folder>/bin/sockstat"
    assertion_count: 31
    ohos_specific_assertions: 4

# ── 鸿蒙特有测试（rule12：N >= 1）────────────────────────────────────────
ohos_specific_tests:
  - id: T4-1
    name: "动态依赖仅 libc.so"
    detail: "readelf -d 断言 NEEDED 集合无宿主第三方 .so，证明交叉编译未污染链接面"
  - id: T4-2
    name: "包内无 .so/.a"
    detail: "不污染 /lib、/lib64（R26 口径），纯 CLI 交付物"
  - id: T4-3
    name: "受限态输出明确 /proc/net 诊断"
    detail: "OHOS 沙箱 /proc/net 内容 EACCES 时必须点名缺失文件，不得静默输出空表"
  - id: T4-4
    name: "受限态 rc=134 (SIGABRT)"
    detail: "与上游 handle_missing_file()->abort() 语义一致，行为与 Linux 对齐"

# ── 断言口径（三态分类，不掩盖）──────────────────────────────────────────
# PASS       : 真实执行/真实取证且符合契约
# RESTRICTED : /proc/net 受 OHOS 沙箱 EACCES，工具如实报缺失并 abort（不计 FAIL）
# SKIP       : 该环境无法执行 aarch64 产物或无法取证（每条独立记账，不合并）
# KNOWN_DEFECT: 上游 0.4.2 自身缺陷，Linux 上同样复现，记录证据不判 FAIL；
#   但"行为不可解释"（既非 SIGSEGV 也非沙箱 abort）一律判 FAIL，
#   该分支不记账为 defect，避免取证断言永远无法失败。
assertion_policy:
  total: 31
  fail_on: "FAIL > 0 或 断言计数与本文件声明不一致 或 零 PASS"
  vacuous_pass_guards:
    - "T4-1：readelf -d 解析不出任何 NEEDED 项时判 FAIL，而非空过"
    - "T5 三条：读表可用但样本为空（无进程持有套接字）时记 SKIP 并说明，不空过"
  ohos_restricted_basis: >-
    archives/n/net-tools/2.1/reports/manual-runtime-evidence.md 的 12/12
    /proc/net EACCES 权限矩阵（route/arp/dev/tcp/udp/unix/sockstat/stat/
    wireless/protocols/netstat/if_inet6，普通 uid 逐一实测）
