# 版本级 manifest - sockstat 0.4.2
# 遵循 ARCHIVE-SPEC v2.0

version: "0.4.2"
software: "sockstat"
status: built
build_date: "2026-10-02"
build_system: makefile

source:
  url: "https://codeberg.org/alteholz/sockstat/archive/v0.4.2.tar.gz"
  sha256: "f2e89b4baa9823b522be5b02bfad0cd57ffe5dee88b6ad94ff86402617168819"
  tar_format: tar.gz
  upstream_homepage: "https://codeberg.org/alteholz/sockstat"
  upstream_tag: "v0.4.2"
  upstream_note: >-
    上游托管在 codeberg.org/alteholz/sockstat（原始作者 William Pitcock 的
    nenolod 账号；Debian 0.4.1-2 起仓库由 github 迁至 codeberg）。取官方
    git-archive tarball，非下游重打包。

build:
  system: makefile
  configure_options: []
  configure_note: "上游无 configure 步骤，16 行手写 Makefile，make 命令行变量覆盖 CC/CFLAGS"
  dependencies: []
  cc: "取自 profile tools.build:compiler_executables（R33），经 make 命令行变量注入"
  cxx: ""
  cflags: "Release 下 -O2 -Werror=implicit-function-declaration（其余 build_type 档位由 conanfile._cflags() 派生）"

patches_applied: []

patch_classification: []

knowledge_gained:
  - "上游 Makefile 把编译与链接合在一步 $(CC) $(CFLAGS) -o $@ $(LDFLAGS)，链接模式随 CFLAGS 走；命令行变量可覆盖"
  - "上游 0.4.2 对 OHOS musl sysroot 零改动可编译：<err.h>/err/errx/inet_lnaof/inet_ntop 全部可用，无需任何补丁"
  - "上游 #define VERSION \"0.4.2\" 未被引用，且 getopt 串无 v/V —— sockstat 无 --version 选项，产物内也不含版本串；测试不能按 --version 断言"
  - "OHOS 沙箱 /proc/net 内容 EACCES（12/12，普通 uid），上游对缺失文件走 handle_missing_file()->abort()，真机上读表类调用 rc=134 并打印 'can not open file /proc/net/<file>'"
  - "上游 -G 组过滤必崩：grp->gr_mem 的 NULL 终止项被传给 getpwnam()，任意组（含有成员的组）均 SIGSEGV；与平台无关"
  - "codeberg.org 可作为上游 forge 使用（本仓已验证先例：libjodycode、libscfg、mad、newsraft 直接取 codeberg 归档/发布；fcft 的依赖 tllist 亦托管于 codeberg releases/download）。注意 fcft 记录 codeberg releases/download 曾因共享 CI 出口 IP 持续 429，archive/ 端点无此问题，本包用的正是 archive/ 端点"

revision_history:
  - version: "0.4.2"
    date: "2026-10-02"
    reason: "首次适配 HarmonyOS PC（积分赛）"
    changes:
      - "配方零补丁：上游对 OHOS sysroot 干净编译，保持与 v0.4.2 逐字节一致"
      - "编译器经 tools.build:compiler_executables 注入（R33），命令行变量覆盖上游 Makefile 的 CC/CFLAGS"
      - "-Werror=implicit-function-declaration 防 C89 隐式声明截断 64 位返回值（tal/1.9 同类回归）"
      - "test_package 补全 31 断言消费者测试（上游测试数 N=0，附清点证据）；含 4 条鸿蒙特有断言"
      - "三态断言口径 PASS/RESTRICTED/SKIP + KNOWN_UPSTREAM_DEFECT，断言计数与环境无关恒为 31"
