software: sockstat
display: "sockstat"
description: "打开套接字明细查看器：关联 /proc/net/* 套接字表与 /proc/<pid>/fd，按进程列出每个打开的套接字（FreeBSD sockstat 的 Linux 实现）"
category: utility
homepage: "https://codeberg.org/alteholz/sockstat"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "零补丁：上游 0.4.2 对 OHOS musl sysroot 干净编译——<err.h> 的 err/errx 与 arpa/inet.h 的 inet_lnaof 均在 sysroot 中提供，无需任何适配改动"
    - "上游 Makefile 把编译与链接合为一步 $(CC) $(CFLAGS) -o $@ $(LDFLAGS)，链接模式随 CFLAGS 走；编译器取自 profile tools.build:compiler_executables（R33），经 make 命令行变量覆盖"
    - "-Werror=implicit-function-declaration：源码为 C89 风格，若 musl 把 POSIX 声明藏到 feature macro 后会隐式声明成 int、截断 64 位指针，编译仅一条告警而运行 SIGSEGV（tal/1.9 同类回归），升级为错误防其悄悄回来"
    - "OHOS 沙箱 /proc/net 内容 EACCES（12/12，普通 uid），上游对缺失文件走 handle_missing_file()->abort()：真机读表类调用 rc=134 并点名 /proc/net/<file>，属平台权限差异，测试按 RESTRICTED 计而非 FAIL"
    - "上游 -G 组过滤必崩（grp->gr_mem 的 NULL 终止项被解引用后传给 getpwnam()），普通 Linux 同样复现，属上游缺陷而非平台问题，配方不打补丁、以取证断言公开"
  common_dependencies: []

versions:
  "0.4.2":
    status: built
    build_date: "2026-10-02"
    conan_ref: "sockstat/0.4.2"
