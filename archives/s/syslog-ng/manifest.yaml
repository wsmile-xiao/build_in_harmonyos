software: syslog-ng
display: "syslog-ng"
description: "增强型日志守护进程：高可靠日志收集、过滤、解析与转发（syslog/JSON/网络多来源），模块化 dlopen 架构"
category: system
homepage: "https://www.syslog-ng.com/"
license: "GPL-2.0-or-later, LGPL-2.1-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 补丁各两份：顶层 + 捆绑 lib/ivykis（AC_CONFIG_SUBDIRS 子配置），使 uname -s=HarmonyOS 识别为 aarch64-unknown-linux-ohos"
    - "E011：configure 内 umask 077 临时目录在 HMDFS 不可写 → 两处 configure 均改 umask 022"
    - "五组致命 pkg 检查（GLIB/PCRE2/OPENSSL/JSON/CRITERION）经 pkg.m4 变量短路注入真实包路径，绕开 relocatable .pc 的 \"/\" 前缀；JSON 的 PKG_CHECK_EXISTS 模块名探测不认变量，仍以 PKG_CONFIG_PATH 保可发现"
    - "模块目录运行期定位走 SYSLOGNG_PREFIX 环境变量（lib/reloc.c lookup_sysprefix）重定位到包前缀 lib/syslog-ng"
    - "criterion 经 test_requires 提供并变量短路 → configure 自动开启上游单元测试；make check 在设备缓存构建树内全量实跑（不在 build() 内，保持 conan create 确定性）"
    - "autotools 通用三件套：E490 辅助脚本执行位恢复、依赖 .la 清理、TMPDIR 钉在 build 目录（OHOS /tmp 只读）"
    - "glib 依赖必须是 shared 单实例：40+ dlopen 模块与框架库共享同一 gobject 类型系统"
  common_dependencies:
    - glib
    - pcre2
    - openssl
    - json-c
    - libcurl

versions:
  "4.8.1":
    status: built
    build_date: "2026-10-11"
    conan_ref: "syslog-ng/4.8.1"
