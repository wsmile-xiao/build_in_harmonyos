# conandata.yml — syslog-ng 4.8.1
# Primary source: Buildroot source mirror (sources.buildroot.net) — serves the
# pristine upstream release tarball, verified byte-identical to the official
# release asset (same sha256). Fallback #2: Yocto Project source mirror
# (downloads.yoctoproject.org/sources likewise hosts the pristine tarball,
# verified byte-identical). The canonical GitHub release URL is kept last as
# reference; it is subject to the platform E017 ghfast.top rewrite (dead
# domain), which is why the two non-GitHub mirrors come first.
# E017 免疫：前两条镜像 URL 不含 github 子串，CI 下载不会走 ghfast.top 替换。

sources:
  url:
    - "https://sources.buildroot.net/syslog-ng/syslog-ng-4.8.1.tar.gz"
    - "https://downloads.yoctoproject.org/mirror/sources/syslog-ng-4.8.1.tar.gz"
    - "https://github.com/syslog-ng/syslog-ng/releases/download/syslog-ng-4.8.1/syslog-ng-4.8.1.tar.gz"
  sha256: "e8b8b98c60a5b68b25e3462c4104c35d05b975e6778d38d8a81b8ff7c0e64c5b"

# Patches (applied by apply_conandata_patches, patch_ng a/ b/ paths):
# - 0001/0002: top-level config.guess/config.sub HarmonyOS platform
#   recognition (config.guess cannot guess uname -s=HarmonyOS; config.sub
#   lacks the linux-ohos kernel-os combination).
# - 0003/0004: same for the bundled lib/ivykis (AC_CONFIG_SUBDIRS runs its
#   own configure with its own copies of the two triplet scripts).
# - 0005/0006: configure E011 HMDFS fix — "umask 077 && mktemp -d" in the
#   tmp-dir creation block is not writable on HMDFS; relax to umask 022
#   (same approach as the rsyslog/libestr/libfastjson recipes). Applies to
#   both the top-level configure and lib/ivykis/configure.
# - 0007/0008/0009: same treatment for lib/ivykis/test.mt — ivykis's own
#   AC_CONFIG_SUBDIRS sub-project ships a third independent copy set of
#   the triplet scripts plus its own configure; the unpatched config.guess
#   fell through to the compile-a-dummy fallback and died on HMDFS
#   (mktemp -d creates 0700 dirs, E046-family Permission denied).
# - 0010: lib/ivykis/test.mt/iv_thread_test.c calls pthread_cancel() and
#   pthread_testcancel(), which the OHOS libc does not provide (undefined
#   symbols at link time).  Guard the cancellation-only test with a
#   HAVE_PTHREAD_CANCEL configure probe added to the test.mt sub-project
#   (its own configure/config.h.in/configure.ac) — the only use site of
#   these symbols in the whole tree.
# - 0011: modules/afuser/afuser.c — OHOS ships a stub utmpx.h (struct utmpx
#   only); its libc neither declares nor provides getutxent()/endutxent(),
#   and there is no utmp database on the platform.  The upstream configure
#   already probes getutxent; guard the utmp query bodies with the existing
#   SYSLOG_NG_HAVE_GETUTXENT capability macro and provide empty lookups
#   where the probe fails, so the usertty() destination builds (behaves as
#   "no user logged in").
# - 0012: lib/thread-utils.h — thread_cancel() (inline, zero callers in the
#   tree) calls pthread_cancel(), absent on the target libc.  C TUs only
#   warn, but C++ TUs including this header
#   (modules/examples/random-choice-generator) turn the undeclared
#   identifier into a hard error.  Add pthread_cancel to the existing
#   AC_CHECK_FUNCS list (configure.ac/configure/config.h.in) and no-op the
#   helper when SYSLOG_NG_HAVE_PTHREAD_CANCEL is undefined.
# - 0013: modules/http — libhttp.so calls zlib directly (compression.c:
#   deflateInit2_/deflateEnd for gzip content-encoding), but upstream's
#   dynamic-linking mode never gets -lz on the link line (configure.ac
#   adds it to LIBS only in the non-dynamic branch); glibc tolerates the
#   unresolved symbols via lazy binding + global-scope lookup, musl
#   relocates everything eagerly at dlopen and the module fails to load
#   ("Error relocating libhttp.so: deflateInit2_: symbol not found").
#   Link $(ZLIB_LIBS) explicitly in the module LIBADD — root Makefile.in
#   (the file actually consumed by the build; non-recursive automake) and
#   modules/http/Makefile.am.  ZLIB_LIBS is configure.ac's own AC_SUBST
#   variable (already consumed by modules/afsocket) and is supplied via
#   the recipe environment like the other dependency variables.
patches:
  - patch_file: "patches/0001-config.guess-harmonyos.patch"
    patch_description: "0001 config.guess recognize HarmonyOS aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-linux-ohos.patch"
    patch_description: "0002 config.sub accept linux-ohos kernel-os combination"
    patch_type: "portability"
  - patch_file: "patches/0003-ivykis-config.guess-harmonyos.patch"
    patch_description: "0003 lib/ivykis config.guess recognize HarmonyOS aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0004-ivykis-config.sub-linux-ohos.patch"
    patch_description: "0004 lib/ivykis config.sub accept linux-ohos kernel-os combination"
    patch_type: "portability"
  - patch_file: "patches/0005-configure-E011-HMDFS-umask-fix.patch"
    patch_description: "0005 configure E011 HMDFS fix umask 077 to 022 in tmp-dir block"
    patch_type: "portability"
  - patch_file: "patches/0006-ivykis-configure-E011-HMDFS-umask-fix.patch"
    patch_description: "0006 lib/ivykis configure E011 HMDFS fix umask 077 to 022 in tmp-dir block"
    patch_type: "portability"
  - patch_file: "patches/0007-ivykis-test-mt-config.guess-harmonyos.patch"
    patch_description: "0007 lib/ivykis/test.mt config.guess recognize HarmonyOS aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0008-ivykis-test-mt-config.sub-linux-ohos.patch"
    patch_description: "0008 lib/ivykis/test.mt config.sub accept linux-ohos kernel-os combination"
    patch_type: "portability"
  - patch_file: "patches/0009-ivykis-test-mt-configure-E011-HMDFS-umask-fix.patch"
    patch_description: "0009 lib/ivykis/test.mt configure E011 HMDFS fix umask 077 to 022 in tmp-dir block"
    patch_type: "portability"
  - patch_file: "patches/0010-ivykis-test-mt-pthread-cancel-feature-detection.patch"
    patch_description: "0010 lib/ivykis/test.mt iv_thread_test guard cancellation test with HAVE_PTHREAD_CANCEL (test.mt configure probes pthread_cancel)"
    patch_type: "portability"
  - patch_file: "patches/0011-afuser-utmp-getutxent-feature-detection.patch"
    patch_description: "0011 modules/afuser guard utmp queries with existing SYSLOG_NG_HAVE_GETUTXENT; empty lookups when the libc lacks getutxent (stub utmpx.h, no utmp database)"
    patch_type: "portability"
  - patch_file: "patches/0012-thread-utils-pthread-cancel-feature-detection.patch"
    patch_description: "0012 lib/thread-utils.h no-op thread_cancel() when SYSLOG_NG_HAVE_PTHREAD_CANCEL is undefined (pthread_cancel added to AC_CHECK_FUNCS)"
    patch_type: "portability"
  - patch_file: "patches/0013-http-link-zlib-explicitly-musl-eager-reloc.patch"
    patch_description: "0013 modules/http link zlib explicitly (compression.c calls deflateInit2_; upstream dynamic mode omits -lz, musl eager relocation fails dlopen)"
    patch_type: "portability"
