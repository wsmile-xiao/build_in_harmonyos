package: syslog-ng/4.8.1
homepage: "https://www.syslog-ng.com/"

upstream_check_command: "make check -j1（criterion 单元测试；configure 探测到 criterion>=2.2.1 即自动开启，无显式开关）"
upstream_test_in_build: false
upstream_test_command: "make check -j1（设备缓存构建树内另行执行；criterion 经 test_requires 提供，测试程序在 check 阶段编译并全量运行）"

# Upstream test suite inventory (R51):
# syslog-ng 的单元测试由 criterion 框架驱动（lib/tests + 已启用各模块的
# tests/ 目录，check_PROGRAMS/TESTS 声明），configure 探测到
# criterion>=2.2.1 即自动开启（无 --enable-tests 开关；找不到时静默关闭）。
# 配方经 test_requires criterion/2.4.3 + CRITERION_CFLAGS/CRITERION_LIBS
# 变量短路确保命中；make check 在设备缓存构建树内全量实跑
# （upstream_test_in_build=false，与仓库惯例一致）。
# 具体程序/用例数以设备实测输出为准（补齐于设备实测后）。
upstream_tests:
  - name: "unit tests (criterion, lib + modules)"
    command: "make check -j1"
    description: "configure 摘要 Unit tests=yes 即启用；覆盖 lib/tests 与已启用模块 tests/ 的 criterion 单元测试。"

test_package_tests:
  - file: test.sh
    description: "版本横幅与 SYSLOGNG_PREFIX 模块目录重定位、--module-registry 全量 dlopen、配置解析/完整启动检查、端到端守护进程（internal() → file() 路由 + syslog-ng-ctl stats + SIGTERM 优雅退出）"
    command: "sh test.sh <workdir>"

assertion_count: 14
