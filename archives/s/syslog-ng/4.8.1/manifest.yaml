version: "4.8.1"
software: "syslog-ng"
status: built
build_date: "2026-10-11"
build_system: "autotools"

source:
  url: "https://sources.buildroot.net/syslog-ng/syslog-ng-4.8.1.tar.gz"
  sha256: "e8b8b98c60a5b68b25e3462c4104c35d05b975e6778d38d8a81b8ff7c0e64c5b"
  tar_format: tar.gz
  mirrors:
    - "https://sources.buildroot.net/syslog-ng/syslog-ng-4.8.1.tar.gz"
    - "https://downloads.yoctoproject.org/mirror/sources/syslog-ng-4.8.1.tar.gz"
    - "https://github.com/syslog-ng/syslog-ng/releases/download/syslog-ng-4.8.1/syslog-ng-4.8.1.tar.gz（E017 场景经 ghfast.top 兜底）"

build:
  system: autotools
  configure_options:
    - "--disable-python --disable-python-modules"
    - "--disable-java --disable-java-modules"
    - "--disable-systemd"
    - "--with-libcurl=<libcurl 包目录>"
    - "GLIB/PCRE2/OPENSSL/JSON/CRITERION 五组致命 pkg 检查经 <VAR>_CFLAGS/<VAR>_LIBS 环境变量短路（relocatable .pc 前缀为 \"/\"，不可直用）"
  dependencies:
    - glib/2.84.0.1
    - pcre2/10.45
    - openssl/3.5.6
    - json-c/0.18
    - libcurl/8.5.0
    - zlib/1.3.1.1（显式直连 requires：libhttp 直接调 zlib，见补丁 0013；制品仓为静态库修订）
    - criterion/2.4.3（test_requires，命中即自动开启上游单元测试）
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess-harmonyos.patch"
  - "0002-config.sub-linux-ohos.patch"
  - "0003-ivykis-config.guess-harmonyos.patch"
  - "0004-ivykis-config.sub-linux-ohos.patch"
  - "0005-configure-E011-HMDFS-umask-fix.patch"
  - "0006-ivykis-configure-E011-HMDFS-umask-fix.patch"
  - "0007-ivykis-test-mt-config.guess-harmonyos.patch"
  - "0008-ivykis-test-mt-config.sub-linux-ohos.patch"
  - "0009-ivykis-test-mt-configure-E011-HMDFS-umask-fix.patch"
  - "0010-ivykis-test-mt-iv-thread-test-OHOS-pthread-cancel.patch"
  - "0011-afuser-utmp-OHOS-no-utmp-db-stub.patch"
  - "0012-thread-utils-OHOS-pthread-cancel-noop.patch"
  - "0013-http-link-zlib-explicitly-musl-eager-reloc.patch"

knowledge_gained:
  - "config.guess/config.sub 需打两份：顶层一套 + 捆绑 lib/ivykis 一套（AC_CONFIG_SUBDIRS 会在其中再跑一次 configure）"
  - "E011 umask 修补同样两处：configure 内 umask 077 && mktemp -d 在 HMDFS 上 Permission denied"
  - "致命 PKG_CHECK_MODULES 可经 pkg.m4 的 <VAR>_CFLAGS/<VAR>_LIBS 变量短路整体绕过坏 .pc；但 PKG_CHECK_EXISTS 不认变量（json-c 模块名探测），仍需真实 pkg-config + PKG_CONFIG_PATH 可发现"
  - "criterion>=2.2.1 被 configure 探测到即静默开启单元测试（无 --enable-tests 开关）→ test_requires criterion 是让 make check 真正有测试可跑的前提"
  - "模块目录运行期 = ${exec_prefix}/lib/syslog-ng（conan 下为 /lib/syslog-ng 死路径）→ 经 SYSLOGNG_PREFIX 环境变量重定位（lib/reloc.c lookup_sysprefix）"
  - "GLIB/PCRE2/OPENSSL/JSON/CRITERION 五组变量名与 libs 清单需对 configure.ac 逐行核对（GLIB 含 GLIB_ADDONS=gmodule-2.0 gthread-2.0；PCRE2=libpcre2-8）"
  - "json 头以 <json.h> 包含 → JSON_CFLAGS 需补 <pkg>/include/json-c 子目录"
  - "sbin→../lib、lib/syslog-ng→.. 两档 $ORIGIN rpath 负责自身产物互查找；依赖库走绝对 rpath"
  - "autotools 适配三件套在本包同样成立：E490 辅助脚本执行位、依赖 .la 清理（relocatable 打包坏路径）、TMPDIR 钉到可写目录（OHOS /tmp 只读）"
  - "捆绑子项目补丁面翻倍：lib/ivykis/test.mt 是第三套独立 config.guess/config.sub/umask 块（AC_CONFIG_SUBDIRS 逐层各跑自己的 configure）——三元组识别按「每个 configure 一套」清点（共三套）"
  - "OHOS libc（musl）缺 pthread_cancel/pthread_testcancel 与 getutxent/endutxent：测试守卫（0010）+ 头文件 no-op（0012，C++ TU 否则硬错误）+ utmp 查询空实现（0011，usertty() 退化为无登录用户）"
  - "musl 对 dlopen 模块 eager 重定位：上游动态链接模式不给 libhttp.so 链 -lz（compression.c 调 deflateInit2_/deflateEnd），glibc 惰性绑定容忍、musl 直接拒载 → 模块 LIBADD 显式补 $(ZLIB_LIBS)（根 Makefile.in 实际消费 + modules/http/Makefile.am），zlib/1.3.1.1 显式直连 requires"
  - "上游 make check 在 OHOS 的三件套注入：TMPDIR→el2 可写卷；AM_CPPFLAGS 追加 libcurl 包内 include；LOG_COMPILER 包装器（AF_UNIX bind/mkfifo/fallocate 受限 → 3 个 cwd 敏感测试切 el2）"
  - "criterion worker fork 扰动挂死是环境级现象：test-driver 永久等待（无 [FAIL] 用例行/Synthesis/.trs），先 kill -9 子 worker 再杀测试父进程可解锁并落 FAIL .trs；复跑正常，与配方无关"
  - "平台性失败清单 11 项（时区数据库/TZ 4、musl 时区解析 5、/tmp 只读 1、无 sys 组 1）：上游 make check 全绿在 OHOS 不可达，退出码 2 为平台可及上限"
  - "非递归 automake（subdir-objects）的 mtime 竞态：全树仅一个生效顶层 Makefile.in，其再生规则依赖全部 Makefile.am；补丁触任一 Makefile.am（同秒毫秒差即可）即触发 missing→automake 再生，设备无 automake 直接 127 → 配方在补丁应用后把全树 Makefile.in 的 mtime 归一到当前（只动时间戳不动内容）"
