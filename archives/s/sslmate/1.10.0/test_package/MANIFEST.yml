# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: sslmate/1.10.0
homepage: "https://sslmate.com"

# 上游测试命令（sslmate Makefile 无 check/test 目标，纯 Perl 脚本应用）
upstream_check_command: ""

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无自动化测试套件）
upstream_tests: []

# test_package 自带的测试（消费者视角验证：加载 SSLMate 模块 + 验证二进制存在）
test_package_tests:
  - file: test.sh
    description: "sslmate 二进制定位 + SSLMate 模块加载 + 版本验证"
    command: "bash test.sh"

# 测试断言总数（近似值）
assertion_count: 3
