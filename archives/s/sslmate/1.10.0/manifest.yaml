software: sslmate
version: "1.10.0"
status: published
build_system: makefile
build_date: "2026-06-17"

source:
  url: "https://packages.sslmate.com/other/sslmate-1.10.0.tar.gz"
  sha256: "ca378afc28c54a38f29ab8956f8d405b2d12489e66c0fa7a4fe6acc8769e5f91"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
  dependencies:
    - perl/5.42.2
    - TermReadKey/2.38
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "sslmate is Perl script-based, no configure/autotools; uses simple Makefile with PREFIX"
  - "Requires Perl module Term::ReadKey (not pre-installed on OHOS)"
  - "No make check target available (Perl script application without test suite)"
