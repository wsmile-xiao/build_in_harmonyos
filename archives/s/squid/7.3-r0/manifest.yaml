# Squid 7.3-r0 OpenHarmony Build Manifest
# This file contains metadata for the Squid web proxy build

software:
  name: squid
  version: 7.3-r0
  description: Squid Web Proxy Cache - A caching proxy for the Web supporting HTTP, HTTPS, FTP, and more
  homepage: http://www.squid-cache.org/
  license: GPL-2.0-or-later
  
build:
  status: published
  date: 2025-05-25
  platform: OpenHarmony
  architecture: aarch64
  toolchain: gcc
  build_env:
    TMPDIR: /data/storage/el2/base/cache
  build_type: Release
  
source:
  url: http://www.squid-cache.org/Versions/v7/squid-7.3.tar.xz
  checksum: "N/A"  # Add actual checksum if available
  
dependencies:
  required:
    - name: openssl
      version: ">=1.1.1"
      description: SSL/TLS encryption support
    - name: krb5
      version: ">=1.18"
      description: Kerberos authentication support
    - name: libxml2
      version: ">=2.9"
      description: XML parsing for ICAP and eCAP
    - name: libcap
      version: ">=2.30"
      description: POSIX capabilities support
    - name: nettle
      version: ">=3.6"
      description: Cryptographic library
    - name: glib-2.0
      version: ">=2.60"
      description: GLib library for data structures
      
files:
  binaries:
    - path: bin/squid
      size: 7.6M
      type: ELF 64-bit LSB executable, ARM aarch64
      description: Squid web proxy main executable
  libraries: []  # No additional libraries packaged
  headers: []    # No headers included in this package
  
patches:
  - file: 0001-disable-shadow-h.patch
    description: Disable shadow password functions for OpenHarmony compatibility
    reason: OpenHarmony's musl libc lacks shadow password API (getspnam, etc.)
    impact: Shadow password authentication disabled; other auth methods functional
    
configuration:
  features:
    - SSL/TLS support (via OpenSSL)
    - Kerberos authentication (via krb5)
    - ICAP support (via libxml2)
    - POSIX capabilities (via libcap)
    - HTTP/1.1 compliant
    - FTP proxy support
  disabled_features:
    - shadow password authentication
    - SNMP monitoring (optional, not configured)
    
testing:
  status: passed
  date: 2025-05-25
  notes: |
    - Binary successfully compiled on aarch64
    - Basic proxy functionality verified
    - No shadow password support (expected)
    
packaging:
  format: tar.gz
  archive: squid-7.3-r0-ohos-aarch64.tar.gz
  contents:
    - bin/squid
    
notes: |
  This build is specifically for OpenHarmony aarch64 platform.
  
  Important limitations:
  - Shadow password authentication is disabled
  - Uses musl libc (not glibc)
  - Ensure all dependencies are available in the runtime environment
  
  For production deployment:
  1. Configure squid.conf according to your requirements
  2. Set up proper file permissions
  3. Configure cache directories
  4. Review security settings