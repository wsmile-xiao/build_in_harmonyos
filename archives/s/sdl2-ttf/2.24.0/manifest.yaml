# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.24.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.24.0"

# 软件名
software: "sdl2-ttf"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/libsdl-org/SDL_ttf/tar.gz/refs/tags/release-2.24.0"

  # 源码校验和
  sha256: "2c45241a56203a59d66ec6b4eae9457e5675fc609376566a257391fd29d341a2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--enable-static"
  - "--disable-shared"
  - "--disable-freetype-builtin"
  - "--disable-harfbuzz-builtin"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "sdl2/2.30.10"
  - "freetype/2.14.3"
  - "harfbuzz/14.2.0.1.1.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-config-guess-sub.patch"
- "0002-configure-umask.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "SDL2_ttf release tarball 不含 external/ (FreeType/HarfBuzz submodule)，需 --disable-freetype-builtin --disable-harfbuzz-builtin 走系统依赖"
- "HMDFS setgid 下 configure/config.status 临时目录 umask 077 阻塞属主写入，需改 umask 022 (E129)"
- "codeload GitHub URL 无扩展名导致 conan get() 按 zip 解压，需 conandata filename 字段"