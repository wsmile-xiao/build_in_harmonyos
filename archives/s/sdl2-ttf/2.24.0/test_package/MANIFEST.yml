# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sdl2-ttf/2.24.0
homepage: "https://github.com/libsdl-org/SDL_ttf"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# SDL2_ttf 2.24.0 (Autotools) 无独立测试目标；验证通过 conan create 的
# test_package 消费者测试完成
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：初始化 SDL2，调用 TTF_Init/TTF_Linked_Version/TTF_GetError，校验链接版本为 2.24.0"
    command: "./test_sdl2-ttf"

# 鸿蒙特有测试（平台适配验证，设备上实际运行）
ohos_special_tests:
  - file: test_ohos.c
    description: "OHOS 平台适配测试：SDL 视频子系统在 HarmonyOS 生效；验证链接的是外部 FreeType(>=2.14)/HarfBuzz(>=14) 而非 tarball 内嵌 submodule（--disable-freetype-builtin/--disable-harfbuzz-builtin 适配生效）"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8