software: simh
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/3.8.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "3.8.1"
status: built
build_system: makefile
build_date: "2026-09-27"

source:
  url: "http://simh.trailing-edge.com/sources/archive/simhv38-1.zip"
  sha256: "4fe294fa5285b1d6d0bd69f60889c00e518ce2be5f00abc2bd4adfa8daa85b06"
  tar_format: zip
  # 上游版本为 V3.8-1（2009-02-08，sim_rev.h SIM_MAJOR=3 MINOR=8 PATCH=1），
  # Debian/发行版打包版本号为 3.8.1
  upstream_version: "3.8-1"

build:
  system: makefile
  configure_options:
    - "CC=clang -std=c99 -U__STRICT_ANSI__ -O2 -D_GNU_SOURCE -fcommon -I."
    - "LDFLAGS=-lm"
    - "target: all (makefile 默认 all，构建 26 个模拟器)"
  dependencies: []
  cc: clang
  cxx: ""

patches_applied: []

knowledge_gained:
  - "simh 是纯 C(C99)+手写 makefile，无 autotools/cmake，无 install/test 目标"
  - "makefile 把 CC 当作完整编译命令(含 -lrt -lm -D_GNU_SOURCE -I.)，命令行覆盖 CC 可一次性替换 gcc+flags"
  - "musl 无独立 librt，需去掉 -lrt；-lm 必须放 LDFLAGS 使链接顺序正确(源文件之后)"
  - "simh V3.8-1 依赖 gcc 历史默认的 common-symbol 合并(tentative definition)，clang 默认 -fno-common 报 duplicate symbol，必须加 -fcommon（本机实验：去掉后 altairz80/ibm1130 链接失败）"
  - "源码 zip 携带的空 BIN/ 目录解压丢失，makefile 直接写 BIN/ 却不创建目录，build() 需 os.makedirs（本机实验：不建则 26/26 全部链接失败）"
  - "源码 zip 含 44 个顶层条目(无单一根目录)，strip_root=False"
  - "simh 使用少量 GNU 扩展(strncasecmp/usleep)，需保留 -D_GNU_SOURCE"
  - "simh 命令行非 - 参数被当作脚本文件打开，非交互退出需 stdin 传 quit（quit 匹配命令表 QUIT -> exit_cmd -> main return 0）"
  - "simh V3.8-1 无上游单元测试套件，验证方式=完整构建 26 个模拟器 + 消费端冒烟测试"
  - "makefile 的 ALL 列表含 i1620 重复项，且有 hp2100/s3/altairz80/ibm1130；去重后实际 26 个模拟器"
  - "OHOS 需对 ELF 可执行文件 binary-sign-tool -selfSign 签名后才能运行"

conan_adaptation:
  recipe: conanfile.py
  conandata: conandata.yml
  test_package: test_package/
  package_type: application
  commands_json: true
