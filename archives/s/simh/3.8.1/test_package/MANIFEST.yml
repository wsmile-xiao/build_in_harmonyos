# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: simh/3.8.1
homepage: "http://simh.trailing-edge.com/"

# 上游测试注册口径：SIMH V3.8-1 的 GNU makefile 只有 all/clean 与各模拟器
# 目标，无 check/test 目标；源码树不含任何测试文件或测试框架。
# 清点证据: `find . -name '*.ini' -o -name 'test*' | wc -l` -> 0（无测试套件）
upstream_check_command: "make -n check   # -> make: *** No rule to make target 'check'"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_simh.py
    description: "26 个模拟器冒烟测试：逐一运行，断言 SCP banner '<machine> simulator V3.8-1' 且 quit 后 exit 0"
    command: "python3 test_simh.py <package>/bin"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 26
