# 完整消费者用例（平台 rule12：鸿蒙特有测试不能只有断言，必须有真正跑通功能/流程的
# 端到端用例）。consumer_ephe.py 按 libswe / swetest 的真实取数路径把数据消费一遍：
#   SE_EPHE_PATH 契约 → 182 个 *.se1 头部 + CRC-32/BZIP2 完整性 → 按世纪规则定位文件
#   → 读取该历元的 Chebyshev 段 → 解包（4/3/2/1 字节与半/四分之一字节打包）
#   → 赤道面旋转 rot_back（含月球的参考椭圆与 J2000 赤道面转换）→ 求值
#   → 日心位置（无 HELIO 标志的记录再加"质心地球-日心地球"修正）/ 地心月球
#   → 与上游参考实现 libswe 2.10.03 `swetest`（配本数据包）的参照值逐项比对
#   → 主小行星 6 槽位 → 32 个行星卫星到中心体距离 vs 文档半长轴 → 文本表解析
