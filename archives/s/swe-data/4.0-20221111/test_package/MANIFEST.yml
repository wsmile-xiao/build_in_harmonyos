  file: "test_package/consumer_ephe.py"
  kind: "end-to-end consumer (SE_EPHE_PATH -> se1 header + CRC -> century file resolution -> Chebyshev segment unpack/rotate/evaluate -> heliocentric/geocentric vectors vs upstream swetest reference)"
