# test_package/MANIFEST.yml — upstream test declaration (R51)

package: since/1.1
homepage: "http://welz.org.za/projects/since"

# 上游 tarball（since-upstream-1.1: COPYING, Makefile, README, since.1, since.c）
# 不含任何测试资产：无 tests/ 目录、无 configure、Makefile 只有 3 个 target
# （since / install / clean），`make -n check` 报 "No rule to make target 'check'"。
upstream_check_command: "make check  # 不存在：Makefile 无 check/test target"
upstream_test_count: 0

# conanfile.py build() 中未集成上游测试（上游无测试可跑）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 自带的功能测试（消费者视角），断言语义移植自 Debian 官方
# autopkgtest 套件 debian/tests/simple（salsa.debian.org/debian/since，
# tag debian/1.1-7），该套件不在上游 tarball 内。
test_package_tests:
  - file: test_since.py
    description: "artifact 校验：产物存在、aarch64 ELF、可执行位"
    command: "python3 test_since.py <bindir>"
  - file: test_since.py
    description: "-z 丢弃单文件既有内容并写入状态文件（两个文件各一次，同时校验退出码与 $HOME/.since）"
    command: "since -z example.txt / since -z example2.txt"
  - file: test_since.py
    description: "默认动作只输出新追加的行"
    command: "since example.txt"
  - file: test_since.py
    description: "文件被截断时提示 truncated 并从头显示"
    command: "since example.txt"
  - file: test_since.py
    description: "-z 多文件输出 [discarded] 头"
    command: "since -z example.txt example2.txt"
  - file: test_since.py
    description: "多文件默认动作输出 ==> file <== 头与新增行"
    command: "since example.txt example2.txt"
  - file: test_since.py
    description: "-f 跟随模式实时输出启动后追加的行（覆盖补丁启用的 inotify/poll 路径）"
    command: "since -f follow.log"

# 断言总数：1 条 artifact 校验 + 7 条运行时功能断言
assertion_count: 8
