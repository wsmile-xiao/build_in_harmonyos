# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "手写 Makefile 的特性探测若读 /usr/include，交叉编译下探测的是构建机而非目标 sysroot；改用 $(CC) -E -include <header> /dev/null 由目标编译器决定"
  - "init-build 的 .work 与 .orig 是硬链接，原地写回的编辑器会同时改 .orig，导致 refresh-patch 生成空补丁（草稿 E543-draft-7C1A）"
  - "qemu-aarch64 可跑静态链接的 OHOS 产物，动态链接产物在 OHOS musl loader 阶段 segfault，x86 runner 上只能用静态副本做功能实跑（草稿 E544-draft-7C1A）"
  - "test_package 的 skip 判据不能取被测二进制的退出码：进程能启动即应由功能断言裁决，否则真机上启动即失败会被吞成通过"

