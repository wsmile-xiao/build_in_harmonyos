# 软件级 manifest — since
# 文件位置: archives/s/since/manifest.yaml
# 字段规范: knowledge/ARCHIVE-SPEC.md §4.1

software: since
display: "since"
description: "带状态的 tail：只输出文件自上次查看以来新增的行"
category: system
homepage: "http://welz.org.za/projects/since"
license: GPL-3.0-or-later
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  notes:
    - "上游 Makefile 写死 CC=gcc 且整行覆盖 CFLAGS，交叉编译需补丁改为 ?= 并补 CPPFLAGS/LDFLAGS"
    - "inotify 特性须用目标编译器探测（$(CC) -E -include sys/inotify.h），不能读构建机 /usr/include"
    - "状态文件默认写 $HOME/.since，$HOME 不可用时回退 /tmp/since；鸿蒙 /tmp 只读（E002）"
  dependencies: []

# 版本索引
versions:
  "1.1":
    status: built
    build_date: "2026-09-21"
    conan_ref: "since/1.1"

latest: "1.1"
