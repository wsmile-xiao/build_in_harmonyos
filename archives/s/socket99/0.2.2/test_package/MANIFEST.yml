package: socket99/0.2.2
homepage: "https://github.com/silentbicycle/socket99"

# socket99 has no make check target. Its upstream Makefile test entrypoint is
# make test, which invokes the shell harness below after building the test app.
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# Five scenario groups launch ten test_socket99 roles in total. The upstream
# shell harness does not wait for/assert the background server exit status; the
# recipe preserves that test unchanged and records the exact scope here.
upstream_tests:
  - file: test_socket99.c
    source: socket99-0.2.2/test_socket99.c
    description: "TCP blocking client/server pair"
    command: "./test_socket99 tcp_server PORT & ./test_socket99 tcp_client PORT"
  - file: test_socket99.c
    source: socket99-0.2.2/test_socket99.c
    description: "TCP nonblocking client/server pair"
    command: "./test_socket99 tcp_server_nonblocking PORT & ./test_socket99 tcp_client_nonblocking PORT"
  - file: test_socket99.c
    source: socket99-0.2.2/test_socket99.c
    description: "UDP client/server pair"
    command: "./test_socket99 udp_server PORT & ./test_socket99 udp_client PORT"
  - file: test_socket99.c
    source: socket99-0.2.2/test_socket99.c
    description: "Unix domain stream client/server pair"
    command: "./test_socket99 unix_server_stream PORT & ./test_socket99 unix_client_stream PORT"
    ohos_status: skipped
    skip_reason: "OHOS bind() on filesystem Unix sockets returns Operation not permitted, reproduced in a writable user directory"
  - file: test_socket99.c
    source: socket99-0.2.2/test_socket99.c
    description: "Unix domain datagram client/server pair"
    command: "./test_socket99 unix_server_datagram PORT & ./test_socket99 unix_client_datagram PORT"
    ohos_status: skipped
    skip_reason: "OHOS bind() on filesystem Unix sockets returns Operation not permitted, reproduced in a writable user directory"

test_package_tests:
  - file: test_socket99.c
    description: "Consumer API checks for address hints, configuration errors, and error formatting"
    command: "./test_socket99_consumer"

# Upstream has ten boolean-returning roles (six executed and four explicitly
# skipped on OHOS); the added consumer test has eight explicit CHECK assertions.
assertion_count: 18
