software: ssl-cert-check
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.14"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-22"

# 构建系统类型（verify-build 期望的字段名）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Matty9191/ssl-cert-check/archive/967b93707f53cfdfefd61e074f18348f1f82bab9.tar.gz"

  # 源码校验和
  sha256: "1b6dab0a7bd29727d92ef455c99c50023b830c8f5b5c36018dccc0b14d7e86df"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 纯脚本工具，无需 configure，直接 make install
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-ssl-cert-check.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ssl-cert-check is a pure shell script tool, no compilation needed"
  - "basic_layout sets build folder to build/ subdirectory, use copy() not make for install"
  - "ssl-cert-check -V prints version and exits 0; -h prints help and exits 1"
  - "CI L0p requires all four settings (os, compiler, build_type, arch) for OHOS profile"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"


patch_classification:
  - file: 0001-ssl-cert-check.patch
    type: auto
    platform_only: True
    guard: 'pending'
