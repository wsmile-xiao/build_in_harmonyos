# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ssl-cert-check/4.14
homepage: "https://github.com/Matty9191/ssl-cert-check"

# 上游测试命令 (ssl-cert-check 使用 bats 测试框架)
upstream_check_command: "bats tests/ssl_cert_check.bats"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/ssl_cert_check.bats
    source: ssl-cert-check-4.14/tests/ssl_cert_check.bats
    description: "Bats-based unit tests for ssl-cert-check script"
    command: "bats tests/ssl_cert_check.bats"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ssl_cert_check.sh
    description: "Verify ssl-cert-check binary responds to -V (version) and -h (help)"
    command: "bash test_ssl_cert_check.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
