# 版本级 manifest — schroot 1.6.13
# 文件位置: archives/s/schroot/1.6.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.13"

# 软件名
software: "schroot"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 2026-10-10 换源：codeberg 归档对 CI 共享出口 IP 持续 429（build#79798 首错，
  # 且 worker 无 curl 使 pre-download 落空）⇒ 改用权威镜像承载的 pristine 上游件
  # schroot_1.6.13.orig.tar.xz。上游项目主页仍为
  # https://codeberg.org/shelter/reschroot（仅下载受阻，非换项目）。
  # 内容对账：解包后 318 文件与上游发行件全同，仅 NEWS / cmake/GitVersion.cmake
  # （发行日期字串）不同，7 个补丁无一触及；四站实件逐字节同哈希。详见 conandata.yml 抬头。
  url:
    - "https://mirrors.ustc.edu.cn/debian/pool/main/s/schroot/schroot_1.6.13.orig.tar.xz"
    - "https://mirrors.aliyun.com/debian/pool/main/s/schroot/schroot_1.6.13.orig.tar.xz"
    - "https://mirrors.nju.edu.cn/debian/pool/main/s/schroot/schroot_1.6.13.orig.tar.xz"
    - "https://mirrors.163.com/debian/pool/main/s/schroot/schroot_1.6.13.orig.tar.xz"

  # 源码校验和（pristine 上游件；换源前 c05d6a1b… 为 codeberg git-archive 件）
  sha256: "2d79ab1ae5ed5b06601ece4b20b7cc0ef0c0c486922693f9bedda927945cc6b3"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 关键缓存变量（全部在 conanfile.py::generate() 中设置）
  configure_options:
    - "CMAKE_SYSTEM_NAME=Linux"                  # CMake 无 HarmonyOS 平台模块，用 linux 平台模块 + OHOS clang/musl 工具链
    - "CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"         # 上游声明 cmake_minimum_required(2.8.12)，CMake 4 拒收 3.5 以下
    - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON"      # CMake 4 已无 FindBoost 模块，Boost 改走 BoostConfig
    - "BOOST_ROOT=<boost 包目录>"
    - "UUID_HEADER=1/UUID_FUNC=1/uuid=ON"        # 交叉编译下 check_library_exists 试链接不可靠，直接给定探针结果
    - "PAM_HEADER=1/PAM_FUNC=1/pam=ON"
    - "CPPUNIT_CLASS=1/test=ON"                  # with_upstream_tests=True 时构建上游测试
    - "personality=OFF"                          # 稳定化取舍：头/函数在 OHOS 上探测为 found（见 w3-local-ci.log），关闭是为规避受限 syscall，非缺头
    - "lvm-snapshot=OFF/zfs-snapshot=OFF/btrfs-snapshot=OFF/loopback=OFF"  # 依赖 Linux 专有工具，构建机上不存在
    - "nls=OFF"                                  # OHOS sysroot 的 libintl.h 是空壳且无 libintl，NLS 交给 gettext 依赖
    - "doxygen=OFF"
    - "SCHROOT_LIBEXEC_DIR=<package>/libexec/schroot"  # conan 工具链把 CMAKE_INSTALL_LIBEXECDIR 设为 bin，与同名可执行文件冲突
    - "CMAKE_BUILD_RPATH=CMAKE_INSTALL_RPATH=<依赖 libdir>"  # 依赖以 -L/-l 接入，CMake 推不出 RPATH；安装期重链产物在 OHOS 上 execve 返回 EPERM

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "boost/1.84.0"
    - "linux-pam/1.7.2"
    - "libuuid/2.40.4"
    - "gettext/0.22.5.1"
    - "cppunit/1.15.1"        # test_requires，仅 with_upstream_tests=True 时

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-undefined-warn-cmake-command.patch"            # man/CMakeLists.txt 调用未定义的 warn()，configure 直接失败
  - "0002-fix-nls-feature-flag-source-variable.patch"        # NLS 特性位误取自 ${pam}，gettext 目标缺失
  - "0003-include-sbuild-i18n-header.patch"                  # 显式包含项目自己的 gettext 封装头
  - "0004-libcxx-locale-name-conversion.patch"               # libc++ 无非标准 std::locale → std::string 转换
  - "0005-include-libintl-for-pam-prompt-translation.patch"  # sbuild-auth-pam.cc 调用 dgettext() 需 <libintl.h>
  - "0006-include-libintl-for-bindtextdomain.patch"          # schroot-base-run.h 传递式调用 bindtextdomain() 需 <libintl.h>
  - "0007-install-pam-config-under-sysconfdir.patch"         # PAM 配置改装 sysconfdir 下，避免写入绝对路径 /etc/pam.d

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "cmake --install 会用安装期 RPATH 重链可执行文件；该重链产物在 HarmonyOS 文件安全策略下无法执行（execve 返回 EPERM）。让 CMAKE_INSTALL_RPATH 与 CMAKE_BUILD_RPATH 一致即可跳过重链，并在 package() 中用构建树产物覆盖安装副本做保证（md5 可辨识差异）。（knowledge_ref: DRAFT-SCHROOT-1613-INSTALL-RPATH-EXEC-EPERM）"
  - "上游 install 不安装 configure 生成的公共头（sbuild-config.h），而已安装的公共头会引用它，消费者编译必然失败——配置期生成的公共头须在 package() 中一并装入 include/。（knowledge_ref: DRAFT-SCHROOT-1613-GENERATED-PUBLIC-HEADER）"
  - "conan 消费者图中，被依赖包的『只用于构建』依赖二进制会被跳过（package_folder 为 None，CPP 头/库路径取不到）；仅靠配方侧的 transitive_headers/transitive_libs 声明不足，消费者（含 test_package）需显式 require 这些依赖，或在 package_info() 中声明使用关系。（knowledge_ref: DRAFT-SCHROOT-1613-CONAN-DEP-BINARY-SKIP）"
  - "CMake 4 起不再提供 FindBoost 模块：上游若使用 ${Boost_INCLUDE_DIRS}/${Boost_<COMPONENT>_LIBRARY_RELEASE} 等旧式变量，交叉编译时须由配方显式给出 Boost 头/库目录与各组件库文件路径，并置 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON（BoostConfig 只提供 imported target）。（knowledge_ref: DRAFT-SCHROOT-1613-CMAKE4-FINDBOOST）"
  - "OHOS sysroot 的 libintl.h 是空壳且不提供 libintl（glibc 侧 gettext 属 libc）；任何直接调用 dgettext()/bindtextdomain() 的源文件都需显式包含 <libintl.h> 并由配方链接制品仓 gettext 包的 -lintl 与 -L<gettext libdir>。（knowledge_ref: DRAFT-SCHROOT-1613-OHOS-LIBINTL-STUB）"
  - "conan 工具链把 CMAKE_INSTALL_LIBEXECDIR 设为 bin，会让 helper 程序与同名可执行文件争夺 bin/ 目录（install 报 destination is not a directory）；上游该路径是 CACHE 变量时显式覆盖即可保留 libexec/<pkg> 布局。（knowledge_ref: DRAFT-SCHROOT-1613-LIBEXECDIR-BIN-CLASH）"
  - "上游 sbuild-chroot-config 套件的 testdata 必须为 root 属主（load_data() 显式拒绝非 root 属主），非特权构建沙箱无法满足——以上游 test 目标等价方式自调 ctest 并 -E 排除该套件后，其余 7 个套件全部通过。（knowledge_ref: DRAFT-SCHROOT-1613-ROOT-OWNED-TESTDATA）"

patch_generation:
  method: manual
  patches_count: 7
