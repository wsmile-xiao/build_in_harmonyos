# 取源说明（2026-10-10 换源；只改 URL/哈希，配方与 7 个补丁一字未动）
#
# ── 为什么换（CI 首错即源码下载）────────────────────────────────────────────
#   2026-10-10 build#79798 conan source() 首错即 codeberg 限流：
#     WARN: network: Error 429 downloading file
#       https://codeberg.org/shelter/reschroot/archive/release/reschroot-1.6.13.tar.gz
#     ⇒ ERROR: schroot/1.6.13: Error in source() method ⇒ 判决 CI 校验失败。
#   同轮日志另证 build_and_test.sh 的 pre-download 在该 worker 上必落空：
#     [fail] [Errno 2] No such file or directory: 'curl'
#   ⇒ 只能靠 conan 自身下载，而 codeberg 对共享 CI 出口 IP 持续 429
#     （同类先例 archives/f/fcft/3.3.3：4 连构建同因失败后改用镜像列表）。
#
# ── 内容对账（逐文件证据，本机实测）─────────────────────────────────────────
#   上游发行件（codeberg git-archive）与 Debian pristine
#   schroot_1.6.13.orig.tar.xz 解包后：318 个文件全同，仅 NEWS 与
#   cmake/GitVersion.cmake（发行日期字串）不同；本配方 7 个补丁无一触及这两个
#   文件（目标文件：CMakeLists.txt、man/CMakeLists.txt、etc/pam/CMakeLists.txt、
#   sbuild/*.cc|tcc|h）⇒ 补丁上下文与构建行为不受换源影响。
#   Debian source format 3.0 (quilt) ⇒ 此 .orig 即 pristine 上游件，非下游改动件。
#   四站实件逐字节相同（本机 curl -L 全 200，382716 B）：
#     sha256 = 2d79ab1ae5ed5b06601ece4b20b7cc0ef0c0c486922693f9bedda927945cc6b3
#
# ── R39/PF7 口径 ────────────────────────────────────────────────────────────
#   所列全部为权威镜像源（R39 明确允许"官方源或权威镜像源"）；sha256 为
#   pristine 上游件哈希，未做任何镜像前缀改写。上游项目主页仍为
#   https://codeberg.org/shelter/reschroot（仅下载受阻，非换项目）。
sources:
  "1.6.13":
    url:
      - "https://mirrors.ustc.edu.cn/debian/pool/main/s/schroot/schroot_1.6.13.orig.tar.xz"
      - "https://mirrors.aliyun.com/debian/pool/main/s/schroot/schroot_1.6.13.orig.tar.xz"
      - "https://mirrors.nju.edu.cn/debian/pool/main/s/schroot/schroot_1.6.13.orig.tar.xz"
      - "https://mirrors.163.com/debian/pool/main/s/schroot/schroot_1.6.13.orig.tar.xz"
    sha256: "2d79ab1ae5ed5b06601ece4b20b7cc0ef0c0c486922693f9bedda927945cc6b3"
patches:
  "1.6.13":
    - patch_file: "patches/0001-fix-undefined-warn-cmake-command.patch"
      patch_description: "replace the undefined warn() CMake command with message(WARNING) so configure works without po4a"
      patch_type: "portability"
      patch_source: "https://codeberg.org/shelter/reschroot"
      strip: 1
    - patch_file: "patches/0002-fix-nls-feature-flag-source-variable.patch"
      patch_description: "derive SBUILD_FEATURE_NLS from the nls option instead of the pam option (upstream typo breaks builds without NLS)"
      patch_type: "portability"
      patch_source: "https://codeberg.org/shelter/reschroot"
      strip: 1
    - patch_file: "patches/0003-include-sbuild-i18n-header.patch"
      patch_description: "include sbuild-i18n.h where the project's own gettext() helper is used (was only reachable via libintl.h when NLS was enabled)"
      patch_type: "portability"
      patch_source: "https://codeberg.org/shelter/reschroot"
      strip: 1
    - patch_file: "patches/0004-libcxx-locale-name-conversion.patch"
      patch_description: "call std::locale::name() instead of relying on the non-standard std::locale::operator std::string() of libstdc++"
      patch_type: "portability"
      patch_source: "https://codeberg.org/shelter/reschroot"
      strip: 1
    - patch_file: "patches/0005-include-libintl-for-pam-prompt-translation.patch"
      patch_description: "include <libintl.h> where dgettext() is used for the PAM prompt comparison (was only reachable transitively while NLS was enabled)"
      patch_type: "portability"
      patch_source: "https://codeberg.org/shelter/reschroot"
      strip: 1
    - patch_file: "patches/0006-include-libintl-for-bindtextdomain.patch"
      patch_description: "include <libintl.h> where bindtextdomain()/textdomain() are used (was only reachable transitively while NLS was enabled)"
      patch_type: "portability"
      patch_source: "https://codeberg.org/shelter/reschroot"
      strip: 1
    - patch_file: "patches/0007-install-pam-config-under-sysconfdir.patch"
      patch_description: "install the PAM configuration under the configured sysconf dir instead of the hard-coded absolute path /etc/pam.d"
      patch_type: "portability"
      patch_source: "https://codeberg.org/shelter/reschroot"
      strip: 1
