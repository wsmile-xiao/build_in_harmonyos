# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: schroot/1.6.13
homepage: "https://codeberg.org/shelter/reschroot"

# 上游测试入口：CMake/CTest（test/CMakeLists.txt 注册 8 个套件）。
# 上游 test 目标内部直接调用 ctest 且不接受额外参数，故配方 build() 内以等价方式
# 自调 ctest，并 -E 排除 sbuild-chroot-config：该套件的 testdata 必须是 root 属主
# （上游 sbuild/sbuild-chroot-config.cc 的 load_data() 显式拒绝非 root 属主，属安全
# 设计），构建沙箱以普通用户运行、FUSE 挂载下 chown 无效，非特权环境无法满足。
upstream_check_command: "ctest --output-on-failure -E sbuild-chroot-config   # 工作目录 = conan 构建目录"

# conanfile.py build() 中已集成上游测试（with_upstream_tests=True，默认开启）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -E sbuild-chroot-config"

# 2026-10-01 conan create 内真机实跑：7/7 Passed，0 failed
# (100% tests passed, 0 tests failed out of 7)
upstream_suite_count: 8
upstream_assertion_count: 7

upstream_tests:
  - file: test/CMakeLists.txt
    source: reschroot-1.6.13/test
    description: "setup-test-data：为后续套件准备构建树内的测试数据（Passed 0.20s）"
    command: "ctest --output-on-failure -E sbuild-chroot-config"
  - file: test/CMakeLists.txt
    source: reschroot-1.6.13/test
    description: "sbuild-chroot-chroot：chroot 定义（directory 类型）相关单元测试（Passed 0.11s）"
    command: "ctest --output-on-failure -E sbuild-chroot-config"
  - file: test/CMakeLists.txt
    source: reschroot-1.6.13/test
    description: "sbuild-standard：sbuild 标准/配置解析单元测试（Passed 0.04s）"
    command: "ctest --output-on-failure -E sbuild-chroot-config"
  - file: test/CMakeLists.txt
    source: reschroot-1.6.13/test
    description: "sbuild-keyfile：keyfile 配置解析单元测试（Passed 0.04s）"
    command: "ctest --output-on-failure -E sbuild-chroot-config"
  - file: test/CMakeLists.txt
    source: reschroot-1.6.13/test
    description: "sbuild-run-parts：setup 脚本 run-parts 执行逻辑测试（Passed 0.25s）"
    command: "ctest --output-on-failure -E sbuild-chroot-config"
  - file: test/CMakeLists.txt
    source: reschroot-1.6.13/test
    description: "schroot-base-option-action：命令行选项/动作解析测试（Passed 0.03s）"
    command: "ctest --output-on-failure -E sbuild-chroot-config"
  - file: test/CMakeLists.txt
    source: reschroot-1.6.13/test
    description: "cleanup-test-data：清理测试数据（Passed 0.07s）"
    command: "ctest --output-on-failure -E sbuild-chroot-config"

# 未执行的上游套件（如实申报，见 notes.md 第三节/第五节）
upstream_tests_excluded:
  - file: test/CMakeLists.txt
    name: sbuild-chroot-config
    reason: "testdata 必须为 root 属主（上游安全设计），非特权构建沙箱无法满足"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/schroot_consumer.cpp
    description: "11 条消费者断言（2026-10-01 conan create 内实测 ALL CHECKS PASSED / 0 failure）：链接包内 lib/libsbuild.a，调用 sbuild 公共 API——basename（带目录/裸文件名）、dirname、normalname（重复与尾部分隔符）、is_absname（绝对/相对）、is_valid_sessionname（拒绝点文件）、getcwd（非空且绝对）、unique_identifier（非空），共 10 条；另有 1 条 [OHOS] 平台断言——aarch64-linux-ohos 的 musl 动态加载器 /system/lib/ld-musl-aarch64.so.1 存在。"
    command: "conan create（test_package 内构建并运行消费者程序）"
  - file: conanfile.py
    description: "4 项 CLI/布局检查：包内 bin/schroot 存在且可执行、schroot --version 正常返回、schroot --help 输出含 session、schroot-mount 与 schroot-listmounts 装于 libexec/schroot/。"
    command: "conan create（test_package/conanfile.py::test()）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
