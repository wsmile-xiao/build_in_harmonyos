software: schroot
display: "schroot"
description: "schroot — 在 chroot 环境中执行命令的会话管理工具（sbuild 库 + schroot/schroot-mount/schroot-listmounts 前端）"
category: sys
homepage: "https://codeberg.org/shelter/reschroot"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "安装期 RPATH 重链产物在 HarmonyOS 上无法执行（execve 返回 EPERM）：令 CMAKE_INSTALL_RPATH 与 CMAKE_BUILD_RPATH 一致以跳过重链，并由 package() 用构建树产物覆盖安装副本"
    - "上游 install 不安装 configure 生成的公共头 sbuild-config.h，消费者编译必然失败，需 package() 补装到 include/sbuild/"
    - "OHOS sysroot 的 libintl.h 是空壳且无 libintl：gettext 由制品仓依赖提供（-lintl + -L<gettext libdir>），并以 0003/0005/0006 补 <libintl.h>"
    - "CMake 4 已无 FindBoost 模块，上游使用 ${Boost_<COMPONENT>_LIBRARY_RELEASE} 旧式变量，需配方显式给出 Boost 头/库目录与组件库文件路径（CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON）"
    - "conan 工具链把 CMAKE_INSTALL_LIBEXECDIR 设为 bin，helper 与同名可执行文件争夺 bin/ 目录，按上游 CACHE 变量覆盖为 libexec/schroot"
  common_dependencies:
    - boost
    - linux-pam
    - libuuid
    - gettext

versions:
  "1.6.13":
    status: built
    build_date: "2026-10-01"
