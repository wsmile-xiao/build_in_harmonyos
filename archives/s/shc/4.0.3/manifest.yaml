software: shc
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.0.3"

# 构建系统类型（必填，verify-build G4 检查）
build_system: autotools

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/neurobin/shc/archive/refs/tags/4.0.3.tar.gz"

  # 源码校验和
  sha256: "7d7fa6a9f5f53d607ab851d739ae3d3b99ca86e2cb1425a6cab9299f673aee16"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure-remove-umask-077-for-hmdfs.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS文件系统umask 077权限问题：HMDFS强制新目录owner为固定UID(20001006)，umask 077创建的目录仅owner可访问，导致autotools config.status临时文件Permission denied"
  - "shc测试套件依赖多种shell(/bin/dash等)和ELF签名，在OpenHarmony上全部FAIL，属平台限制而非软件bug"
  - "CONFIG_SHELL=bash无法解决config.status的umask 077问题，根因是HMDFS的UID映射机制"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/shc-4.0.3.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/shc-4.0.3.work
  source_orig_hash: 180a695c117449a3
  source_work_hash: 2356451d0038d91c
  generated_at: '2026-06-01T12:38:05'
  patches_count: 1

patch_classification:
  - file: 0001-configure.patch
    type: hmdfs-compat
    platform_only: True
    guard: HMDFS-umask
