# conandata.yml — systemd 261.1
sources:
  url: "https://github.com/systemd/systemd/archive/refs/tags/v261.tar.gz"
  sha256: "f1c2e6a0d19ea5cae946386eb288432de12f3c6b7730cdb0d2a06f8ab8e3f8dc"

patches:
  "261.1":
    - patch_file: "patches/0001-units-drop-escaped-slices.patch"
      patch_description: "units/meson.build：移除三个含 \\x2d 转义文件名的 daemon slice 条目（mute-console/cryptsetup/veritysetup）——磁盘文件含字面反斜杠 \\x2d，meson 在 OHOS HMDFS 上无法 stat 该类文件名报 \"File ... does not exist\"；libsystemd 客户端库不需这些 daemon units"
      patch_type: "portability"
    - patch_file: "patches/0002-musl-string-explicit-bzero.patch"
      patch_description: "src/include/musl/string.h：OHOS musl 不提供 explicit_bzero（glibc 2.25+）——补 memset + 编译器 barrier 内联实现（SD_BOOT 分支同款写法）"
      patch_type: "portability"
    - patch_file: "patches/0003-musl-statx-define.patch"
      patch_description: "src/include/musl/sys/stat.h（合并）：OHOS musl 不定义 struct statx 也无 STATX_TYPE/INO/UID/MNT_ID 宏——补 #include <stdint.h> + struct statx_timestamp 先定义的 struct statx 最小字段定义 + STATX_* 宏（合并为单补丁避免同文件双补丁冲突）"
      patch_type: "portability"
    - patch_file: "patches/0004-musl-crypt-r-decl.patch"
      patch_description: "src/include/musl/crypt.h：OHOS musl 的 crypt.h 不声明 crypt_r（只有 struct crypt_data）——补 crypt_r 声明；实现见 0020 的 ENOSYS stub（libsystemd 客户端库不链 libxcrypt，实测链接命令无 -lcrypt）"
      patch_type: "portability"
    - patch_file: "patches/0005-musl-mallinfo2-guard.patch"
      patch_description: "src/include/musl/malloc.h：OHOS musl 自带 struct mallinfo2 + mallinfo2()（API 20+），systemd 的 musl 兼容头重复定义——用 __OHOS__ guard 跳过"
      patch_type: "portability"
    - patch_file: "patches/0006-musl-secure-getenv-reallocarray-decl.patch"
      patch_description: "src/include/musl/stdlib.h（合并）：OHOS musl 无 secure_getenv 与 reallocarray（均 glibc 特有）——补 missing_secure_getenv / missing_reallocarray 声明 + #define 映射"
      patch_type: "portability"
    - patch_file: "patches/0007-musl-stdlib-combined.patch"
      patch_description: "src/libc/musl/stdlib.c（合并）：实现 missing_secure_getenv（透传 getenv）+ missing_reallocarray（溢出安全）+ 提供 program_invocation_name/short_name 可写定义（合并为单补丁避免同文件多补丁 hunk 冲突）"
      patch_type: "portability"
    - patch_file: "patches/0008-musl-sigisemptyset.patch"
      patch_description: "src/include/musl/signal.h：OHOS musl 无 sigisemptyset（glibc 特有）——内联实现 + #define 映射"
      patch_type: "portability"
    - patch_file: "patches/0009-musl-mqueue-mq-getattr.patch"
      patch_description: "新增 src/include/musl/mqueue.h：OHOS musl 只定义 struct mq_attr 不声明 mq_getattr（无 POSIX 消息队列运行时）——stub 返回 -1 + ENOSYS，sd_is_mq() 走 -ENOSYS 表示不支持"
      patch_type: "portability"
    - patch_file: "patches/0010-musl-errno-program-invocation.patch"
      patch_description: "新增 src/include/musl/errno.h：glibc 在 <errno.h>（__USE_GNU）声明 program_invocation_name/program_invocation_short_name，OHOS musl 无——补 extern 声明"
      patch_type: "portability"
    - patch_file: "patches/0011-musl-libintl-gettext.patch"
      patch_description: "新增 src/include/musl/libintl.h：OHOS libintl.h 是空 stub 不声明 gettext 族——locale-util.h 的 DLSYM_PROTOTYPE(dgettext)（typeof）需要声明；实现在运行期由 dlopen 的 libintl.so 提供"
      patch_type: "portability"
    - patch_file: "patches/0012-musl-getcwd-decl.patch"
      patch_description: "src/include/musl/unistd.h：OHOS musl 无 get_current_dir_name（glibc 特有）——补 missing_get_current_dir_name 声明 + #define 映射"
      patch_type: "portability"
    - patch_file: "patches/0013-musl-getcwd-impl.patch"
      patch_description: "src/libc/musl/unistd.c：实现 missing_get_current_dir_name（基于 getcwd + malloc，glibc 语义）"
      patch_type: "portability"
    - patch_file: "patches/0014-musl-pwd-decl.patch"
      patch_description: "新增 src/include/musl/pwd.h：OHOS musl 无 putpwent/fgetpwent（glibc passwd 文件访问）——补声明，实现由 userdb.c 提供"
      patch_type: "portability"
    - patch_file: "patches/0015-musl-grp-decl.patch"
      patch_description: "新增 src/include/musl/grp.h：OHOS musl 无 putgrent/fgetgrent（glibc group 文件访问）——补声明，实现由 userdb.c 提供"
      patch_type: "portability"
    - patch_file: "patches/0016-musl-shadow-decl.patch"
      patch_description: "新增 src/include/musl/shadow.h：OHOS musl 无 putspent/fgetspent（glibc shadow 文件访问）——补声明，实现由 userdb.c 提供"
      patch_type: "portability"
    - patch_file: "patches/0017-musl-userdb-impl.patch"
      patch_description: "新增 src/libc/musl/userdb.c：passwd/group/shadow 文件访问 stub（OHOS 不管理这些文件，读返回 NULL、写返回 ENOSYS）"
      patch_type: "portability"
    - patch_file: "patches/0018-musl-userdb-meson.patch"
      patch_description: "src/libc/musl/meson.build：注册 userdb.c 进 libc_wrapper_sources"
      patch_type: "portability"
    - patch_file: "patches/0019-musl-ucontext-decl.patch"
      patch_description: "新增 src/include/musl/ucontext.h：OHOS musl 的 ucontext.h 只有 ucontext_t 类型、不声明 getcontext/makecontext/swapcontext/setcontext（fiber.c 需要）——补声明，实现由 -lucontext（libucontext/1.5.2）提供"
      patch_type: "portability"
    - patch_file: "patches/0020-musl-crypt-r-impl.patch"
      patch_description: "src/libc/musl/crypt.c：实现 crypt_r stub（OHOS 无真实 crypt 数据源，libxcrypt 未链入——返回 NULL + ENOSYS）"
      patch_type: "portability"
    - patch_file: "patches/0021-musl-test-support.patch"
      patch_description: "补齐 musl 兼容层缺失实现（OHOS 实测运行 systemd 纯单元测试所需）：qsort_r（TLS 存 compar+arg 修复 SIGSEGV）、crypt_r stub、get_current_dir_name、statx syscall 包装、program_invocation_* 定义、userdb 族实现补全（putspent/fgetspent/putgrent 等）、sigisemptyset、SEEK_DATA/SEEK_HOLE、SEGV_MTEAERR/MTESERR、STATX_ATTR_WRITE_ATOMIC、libintl.h/mqueue.h 声明头——本补丁使 OHOS 配置可构建并逐一运行 361 个测试可执行（双口径台账：通过 193/跳过 40/失败 127 平台限制/超时 1/未实例化 16，见 manifest.yaml test_results 与 reports/upstream-tests-ledger.md）"
      patch_type: "portability"
