    - "-Dkmod=disabled -Dcryptsetup=disabled -Daudit=disabled -Dgnutls=disabled"
    - "-Dbpf-framework=disabled -Dselinux=disabled -Dapparmor=disabled -Dpolkit=disabled"
    - "-Dman=disabled -Dhtml=disabled"
  notes: "meson 交叉编译；只打 libsystemd 客户端库（sd-bus/sd-event/sd-daemon），关闭 daemon（core/journald/udevd/networkd/logind 等）与缺依赖组件；依赖注入沿用 polkit 模式（私有 .pc + prefix 改写 + PKG_CONFIG_PATH）；OHOS musl 兼容层 src/libc/musl + 21 个 portability 补丁"

