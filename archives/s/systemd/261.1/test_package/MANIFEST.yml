# test_package/MANIFEST.yml — systemd 261.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: systemd/261.1
homepage: "https://systemd.io"

# 上游测试双口径台账（2026-09-19 实测，与 manifest.yaml test_results /
# reports/upstream-tests-ledger.md 完全一致）：
# - source_declared_total = 252（src/test/test-*.c 可复制枚举）
# - configured_executable_total = 363（OHOS 配置 meson 注册 test-* ninja 目标；
#   2 个因 OHOS musl sysroot 缺 pthread_cancel 编译失败：test-pressure/
#   test-bus-benchmark）
# - built + executed = 361，逐一运行：通过 193（exit 0）、跳过 40（exit 77
#   平台条件）、失败 127（全为 OHOS 沙箱平台限制：/tmp EROFS 硬编码 mkdtemp、
#   safe_fclose EBADF、无 bpf/capability，rule 1.2 如实计失败非跳过）、
#   超时 1（test-sleep）、未实例化 16（feature 依赖关闭）
# 执行方式：conan 构建目录独立 meson reconfigure -Dtests=true 后逐一运行
# 361 个 ELF 并记录 exit code（reports/test-results.tsv 逐项映射）——
# 配方 build() 按 -Dtests=false 交付（避免 1540 目标全构建超时），
# 上游测试在配方外以实测台账形式申报，见 notes.md/manifest.yaml。
upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: "独立 meson reconfigure -Dtests=true 后逐一运行 361 个 test-* ELF，记录 exit code（见 reports/test-results.tsv）"

# 上游 252 个纯单元测试（src/test/test-*.c）；双口径：配置可执行 363
# （构建成功 361），实际执行 361（通过 193/跳过 40/失败 127/超时 1），
# 未实例化 16（feature 依赖关闭）+ 2 编译失败（pthread_cancel 缺失）。
upstream_tests:
  - count: 252
    kind: pure-unit
    note: "src/test/test-*.c DEFINE_TEST 单元测试；OHOS 实测通过 193、跳过 40、失败 127（平台限制）、超时 1、未实例化 16；当前配置可执行通过率 193/361 (53.5%)，详见 manifest.yaml test_results 与 reports/upstream-tests-ledger.md"

# test_package 消费者测试（R34 真实产物校验：libsystemd.so + sd-bus.h）
test_package_tests:
  - file: test_systemd.py
    description: "Verifies lib/libsystemd.so exists + is valid aarch64 ELF shared object (ET_DYN); include/systemd/sd-bus.h present"
    command: "python3 test_systemd.py"
  - file: test_consumer.c
    description: "消费者硬门禁：仅通过公开头 systemd/sd-event.h 与公开 API sd_event_new/sd_event_add_time/sd_event_run/sd_event_unref 编译链接运行，验证 timer 回调实际触发（可观察结果 fired=1）"
    command: "clang -I<include> -o test_consumer test_consumer.c -L<lib> -lsystemd && LD_LIBRARY_PATH=<lib> ./test_consumer"
    expected_output: "CONSUMER_OK: sd-event timer fired=1"

# 断言总数：3（libsystemd.so 存在 + ELF + sd-bus.h 存在）+ 1 消费者运行时验证（timer fired=1）
assertion_count: 4
