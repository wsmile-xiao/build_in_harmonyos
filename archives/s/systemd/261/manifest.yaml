# 版本级 manifest — systemd 261
# 遵循 ARCHIVE-SPEC v3.0

version: "261"
software: systemd
status: built
build_date: "2026-09-03"
build_system: meson

source:
  url: "https://gh-proxy.com/https://github.com/systemd/systemd/archive/refs/tags/v261.tar.gz"
  sha256: "f1c2e6a0d19ea5cae946386eb288432de12f3c6b7730cdb0d2a06f8ab8e3f8dc"
  compression: tar.gz
  archive_root: "systemd-261"

dependencies:
  required:
    - "libcap/2.69"
    - "liblzma/5.8.1"
    - "libzstd/1.5.7"
    - "zlib/1.3.1"
    - "libcrypt/4.5.2"
    - "libucontext/1.5.2"
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - "-Dmode=release"
    - "-Dlibmount=disabled -Dblkid=disabled -Dacl=disabled -Dpcre2=disabled"
    - "-Dkmod=disabled -Dcryptsetup=disabled -Daudit=disabled -Dgnutls=disabled"
    - "-Dbpf=disabled -Dselinux=disabled -Dapparmor=disabled -Dpolkit=disabled"
    - "-Dman=disabled -Dhtml=disabled -Dtests=false"
  notes: "meson 构建；只打 libsystemd 客户端库（sd-bus/sd-event/sd-daemon），关闭 daemon（core/journald/udevd/networkd/logind 等）与缺依赖组件；依赖注入沿用 polkit 模式（私有 .pc + prefix 改写 + PKG_CONFIG_PATH）"

patches_applied: []

compatibility:
  level: medium
  issues: []
  notes: "systemd 是 Linux init 系统，OHOS 不运行其守护进程——daemon 运行类功能按平台限制声明；libsystemd 客户端库编译可用"

