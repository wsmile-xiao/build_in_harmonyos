knowledge_gained:
  - "systemd 是 Linux 系统与服务管理器：libsystemd 客户端库（sd-bus/sd-event/
    sd-daemon）+ 大量 daemon（core/journald/udevd/networkd/logind 等）；meson
    构建，多数依赖是 feature 型可关闭；OHOS 不运行 systemd，只打客户端库"
  - "libmount/libblkid/libacl/libpcre2/libkmod/libcryptsetup/libaudit/libgnutls
    在 ohpcd 无——systemd 的这些组件用 -Dxxx=disabled 关闭；libcap/liblzma/
    libzstd/zlib/libcrypt/libucontext 可用"

