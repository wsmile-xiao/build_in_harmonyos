package: swarp/2.41.5
homepage: "https://www.astromatic.net/software/swarp"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - name: test/（test.fits 1 个测试数据文件——上游无 make check 自动化测试目标）
    count: 1
    description: "上游无自动化测试套件（全量 Makefile.am 核验无 check/test/TESTS 目标——与 scamp 不同，swarp 仅提供 test/test.fits 测试数据）——如实分类：数据文件非自动化测试，R34 用 test.fits 实测图像重采样验证（非 N/A、非跳过）"

test_package_tests:
  - file: test_swarp.py
    description: "R34 真实 CLI：swarp --help + 用上游 test.fits 做图像重采样（-RESAMPLE Y）验证输出"
    command: "python3 test_swarp.py <bindir>"
  - file: test_swarp.py 内联下载
    description: "上游测试数据 test.fits（FITS 图像）二进制不放包——运行时从 GitHub raw URL 下载（CI checkout-pr 的 git apply 无法应用二进制 diff——missing binary patch data 实测）"

assertion_count: 2
