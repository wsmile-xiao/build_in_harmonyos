# test_package/MANIFEST.yml — sollya 8.0
# CI L0e 门禁强制要求本文件存在（G1 同样检查）。
#
# ⚠ 口径纪律（AGENTS §3.5 / pr-audit rule4+rule12）：
#   * 上游测试 = tests-lib(348) + tests-tool(33) = N 381，由 build() 内
#     `make check` 执行（upstream_test_in_build: true）；
#   * test_package 与鸿蒙特有测试**不混入** N=381，分栏统计；
#   * N′ 四分项（PASS/FAIL/SKIP/NOT_RUN）由设备日志复算后写进 notes.md 与
#     PR 正文，不在本文件锁死具体通过数（避免实测与声明漂移）。

package: sollya/8.0
homepage: "https://www.sollya.org/"

# 上游官方测试入口（两个 automake 子目录，顶层 SUBDIRS = tests-tool tests-lib）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: tests-tool
    command: "make check（tests-tool/ 子目录）"
    description: >-
      33 个 CLI 用例：check001.sollya … check032.sollya（REGULAR）+ timecheck.sollya
      （MAYFAIL）。每个脚本经 check.proto 生成 .sh 驱动：GNUTERM=unknown 起 sollya
      吃输入 → 与 .sollya.reference 做 diff。输出写 cwd（非 /tmp），故 §一.1
      /tmp 只读假绿不适用；diff 走 GNU diffutils 3.10（非 toybox，§一.24 不适用）。
    expected: >-
      32 项常规期望与 reference 逐字一致；timecheck.sollya 上游以
      RETURN_CODE_IN_CASE_OF_FAILURE=77 声明为「可能失败」——77 是 automake 的
      SKIP 码，故其不通过应记 **SKIP** 而非 FAIL（计入 N=381，判读归 SKIP）。
  - name: tests-lib
    command: "make check（tests-lib/ 子目录）"
    description: >-
      348 个 C 消费者程序（TESTFILES 列表 = 磁盘 t*.c，双向差集为空），每个
      check_PROGRAMS 编译后由 check.proto 生成 .sh 驱动：非空 .reference 时先跑
      退出码（非 0 即 FAIL）再 diff（不一致即 FAIL）；**空 .reference 分支只查
      退出码**（上游设计为「跑通不崩」型断言，不比对输出——不得据此判假绿，
      它有正面判据）。LDADD 链接 -lsollya -lc++（经 0002 补丁由 -lstdc++ 改来）。
    expected: >-
      上游设计为全部通过；libraryexample.c 不在其中——它属 check_LIBRARIES、
      链接成 libraryexample.a 用于验证外部程序能链上 sollya，无 .reference、
      不进 TESTS 展开，故**不计入 N**（N=381 差额归因的唯一一条）。
  - name: upstream-check-total
    command: "make check（tests-tool + tests-lib 合计）"
    description: "N = 381（框架注册数 33+348 与文件对数 33+348 两口径一致，差额 0）"
    expected: "N′ 四分项见 notes.md「验证结果」与 PR 正文（TOTAL = PASS + FAIL + SKIP + NOT_RUN）"

test_package_tests:
  - file: check_version.sh
    origin: ohos-adaptation (self-authored consumer check)
    description: >-
      独立测试源 —— **CI L0c `no_test_sources` 门禁要求 test_package/ 下至少一个
      `.c/.cpp/.cc/.cxx/.sh/.py` 测试源**（第一版把断言全写在 conanfile.py 里，
      使 test_package/ 只剩 conanfile.py + MANIFEST.yml，finish Step5 的 W3 本地
      CI 模拟以 `L0c: No test source files in test_package/` 拦下，EXIT_CODE=2
      可 resume）。本脚本由 `test_package/conanfile.py::test()` 经
      `self.run("sh …", env="conanrun")` **真调用**（非死文件，同时满足 L0d 的
      `def test` + `self.run`）。在 **OHOS/aarch64/musl** 目标平台直跑**已安装**
      的 `sollya --version`（`conanrun` 提供 libfplll.so.9/libxml2.so.16/
      libmpfi.so.0；非 `echo … | cmd`，避免被闸判 fake），把 84 行原始输出写为
      sollya-version.txt（轮 B 实测 3085 字节），并断言 4 重「产物自报指纹」
      （device-facts §二.19：断言产物自报的版本/指纹，非空壳验证）：
      ① `This is sollya 8.0`（PACKAGE_STRING 版本自报）
      ② `This build of sollya 8.0 is based on GMP 6.3.0, MPFR 4.2.2 and MPFI 1.5.4.`
         —— 一行同时自报**三个实链依赖的库版本**，任一缺失/链空壳即失败
      ③ `It uses FPLLL as:` —— 自报 --with-fplll 生效、fplll.h 直接命中、
         -lfplll 链接兼容、-std=c++11、standard API
      ④ `CeCILL-C` —— license 自报，与配方 license = CeCILL-C 相互印证
      （库消费者维度不重复：上游 tests-lib 348 个程序在 build() 内已覆盖
      「header 可包含 + -lsollya 可链接」，避免手工聚合 6 依赖 -I/-L/-l 出错。）
    command: "conan create → test() → self.run('sh check_version.sh <out>', env='conanrun')"
    expected: "rc=0 且 4 个指纹子串全部出现在 sollya-version.txt；缺任一即非 0 退出 = conan test 失败"

# test_package 断言数（上述 4 个 fingerprint 断言）
assertion_count: 4
