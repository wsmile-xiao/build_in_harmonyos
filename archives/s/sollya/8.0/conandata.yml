# conandata.yml — sollya 8.0
#
# 源 = 上游 GitLab 分支 sollya-8.0 的 **commit 归档**（编排方条件 2 采纳此形态，
#      冻结到 commit 而非分支名，避免 branch force-push 造成版本漂移）。
#
# ⚠️ W0-1 偏差（须在 notes.md / final-report / PR 正文单列）：
#    上游 **无 `8.0` 正式 tag**（`git ls-remote --tags` 全量 25 行、最高 `sollya-7.0`）；
#    版本可得性依据 = ① 同名分支 `refs/heads/sollya-8.0` = `587cb7cf9375110c495934e08b5af06ede3aa9e3`
#    ② 该 commit 归档可构建 ③ 内证 `configure.ac:6 AC_INIT([sollya], [8.0], …)`
#    ④ 两次独立下载 sha256 一致（STABLE=OK）。
#    分支可 force-push ⇒ **版本未冻结**：sha256 不符即响亮失败，不静默。
#
# sha256 归因：与「分支归档」`f8a9e9320e6d2f1021ac52d51e07245c48b3c795620d583114408c1ffd9207d1`
#    不同，差异**仅在顶层目录名**（分支归档 `sollya-sollya-8.0/` vs commit 归档
#    `sollya-587cb7cf…/`），两归档解包后 FILELIST-IDENTICAL（源码等价）。

sources:
  url: "https://gitlab.inria.fr/sollya/sollya/-/archive/587cb7cf9375110c495934e08b5af06ede3aa9e3/sollya-587cb7cf9375110c495934e08b5af06ede3aa9e3.tar.gz"
  sha256: "d592496394c3bd7d00a2f7fb17e8cf4da6d28b5bb284bbd9f79f441c15d588fe"

# 两个上游源文件补丁（由 refresh-patch --auto 生成并核对；二者均为
# **tarball 上游源文件** => 走 refresh-patch 正规登记，与只改 autoreconf 生成物的
# _drop_umask_077()（免登记）相对的另一侧边界）。
# 语义：把上游硬编码的 -lstdc++ 移除/换成 -lc++，因为 clang/libc++ 平台无 libstdc++ 实体，
# 且 libtool 链 .so 必加 -nostdlib 使 clang driver 不再做 -lstdc++→libc++ 内部映射。
patches:
  - patch_file: "patches/0001-configure.ac.patch"
    patch_description: "Set ADD_LSTDC=no so the generated LIBS never keeps -lstdc++ (upstream tests a link flag with AC_COMPILE_IFELSE so the probe always passes)"
    patch_type: "platform"
  - patch_file: "patches/0002-tests-lib-Makefile.am.patch"
    patch_description: "tests-lib LDADD -lstdc++ to -lc++ so test programs link against the clang libc++ runtime"
    patch_type: "platform"
