# 版本级 manifest
# 文件位置: archives/s/sollya/8.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.0"

# 软件名
software: "sollya"

# 编译状态
# published | built | failed | archived
# 注（AGENTS §1 O5）：只有合并后 release upload 已确认才 published，在此之前一律 built。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL —— 上游 GitLab 分支 sollya-8.0 的 **commit 归档**（冻结到 commit，
  # 避免 branch force-push 造成版本漂移；编排方 2026-09-23 条件 2 采纳此形态）
  url: "https://gitlab.inria.fr/sollya/sollya/-/archive/587cb7cf9375110c495934e08b5af06ede3aa9e3/sollya-587cb7cf9375110c495934e08b5af06ede3aa9e3.tar.gz"

  # 源码校验和（两次独立下载一致 STABLE=OK）
  sha256: "d592496394c3bd7d00a2f7fb17e8cf4da6d28b5bb284bbd9f79f441c15d588fe"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表 —— **机器消费面**（G0 / clean_verify 会逐项拆词后喂给 configure），
  # 因此**只申报可字面化的静态旗**，每项必须无空格且以 '-' 开头。
  # 第一版曾写 `--with-gmp=<dep: gmp package_folder>` 等 6 个含空格占位串，被
  # overlay clean_verify 的 G0 响亮拦下：`清单解析失败（manifest configure_options）:
  # 选项 'gmp' 不以 '-' 开头`（占位被 shlex 拆成 3 token、`gmp` 不以 '-' 起）；
  # 同族先例 = integrit P2-2（configure_options 占位符=机器消费错误输入，裁强制修）。
  # 申报面 vs 运行面分离：`--with-{gmp,mpfr,mpfi,xml2,fplll,z}` 虽然 configure.ac
  # 确有这些选项（22 个 AC_ARG_WITH），但其值是 conan 依赖的 **package_folder 动态
  # 路径**，manifest 静态字段装不了跨机不可复核的绝对路径 ⇒ 由 conanfile generate()
  # 的 AutotoolsToolchain 在**运行期**按 self.dependencies[...] 注入（G2 实测已用过）。
  configure_options:
    # 必需：上游自带 config.guess 不认 HarmonyOS/HongMeng uname（E114 同族 fallback
    # 探针在 HMDFS 下写 dummy.c 被拒）⇒ configure 报 "cannot guess build type; you
    # must specify one"，故显式给 GNU 三元组（取值依据 device-facts:189 本机 clang
    # `Target: aarch64-unknown-linux-ohos`；config.sub 实测认识该值）
    - "--build=aarch64-unknown-linux-ohos"

  # 编译依赖列表（格式: name/version）
  # 诚实口径（编排方条件 3）：依赖图**非**「全部预编译在档」——
  # fplll/5.5.0 的唯一远端 binary 绑 gmp/6.3.0，而 mpfi/1.5.4 recipe 是
  # `self.requires("gmp/6.3.0.1", force=True)`，二者互斥 ⇒ `--build=never` 下
  # fplll 缺 binary，须由 `--build=missing` **本地编译（+≈20min/干净轮）**；
  # CI 侧 build_and_test.sh:321 同为 `--build=missing`，行为同构自愈。
  # 不得表述为「依赖全部预编译在档」。
  dependencies:
    - "gmp/6.3.0"
    - "mpfr/4.2.2.1"
    - "mpfi/1.5.4"
    - "libxml2/2.15.3.1"
    - "fplll/5.5.0"
    - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（refresh-patch --auto 生成并经 patch --dry-run 核验可干净应用；
# 描述不用逗号 —— 见 notes/defects/patch-and-finalize.md finalize 计数缺陷）
patches_applied:
  - "0001-configure.ac.patch"
  - "0002-tests-lib-Makefile.am.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（每条行尾注释引用知识草稿号 —— 唯一形态见 AGENTS §3.8）
knowledge_gained:
  - "autotools 包在 HarmonyOS+HMDFS 上 configure 双杀需显式 --build 三元组并剥生成物 configure 的 umask 077（E114 同族）" # knowledge_ref: E678
  - "上游 AC_COMPILE_IFELSE 测链接选项恒通过致 LIBS 保留 -lstdc++ 在 clang/libc++ 平台链接失败需置 ADD_LSTDC=no" # knowledge_ref: E678

# 补丁生成方式留痕（**刻意不写 source_orig_dir/source_work_dir**：那是任务私有绝对
# 跨机不可复核路径，按 notes/defects/patch-and-finalize.md 的 ocproxy 先例不落盘；
# 只保留无路径的可复核字段）
patch_generation:
  method: per-file-difflib
  patches_count: 2

# 补丁分类（refresh-patch --auto 默认 type=auto/guard=pending/platform_only=True，
# 已按 defects 要求人工改为真实分类）：
#   两条均为 portability —— 移除/替换 -lstdc++ 是让上游探测逻辑在**任何**
#   clang/libc++ 平台正确（那些平台无 libstdc++ 实体），并非鸿蒙特有 ⇒ platform_only False；
#   guard none —— 无条件生效，无需运行期探测守卫。
# ⚠ **finish 内嵌 refresh-patch --auto 会再次把本段改回 auto/pending/True 并加回
#   source_*_dir 任务私有绝对路径**（2026-09-24 14:58 实测发生过一次，本文件即
#   为其后的还原）—— 收尾时必须 diff 并还原、且**不把该副作用提交进 PR**。
patch_classification:
  - file: 0001-configure.ac.patch
    type: portability
    platform_only: False
    guard: 'none'
  - file: 0002-tests-lib-Makefile.am.patch
    type: portability
    platform_only: False
    guard: 'none'
