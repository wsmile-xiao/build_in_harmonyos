# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: scope-lite/0.3.0
homepage: "https://github.com/martinmoene/scope-lite"

upstream_check_command: "ctest -N"

upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: lest 框架, CTest 按标准变体编译 (cpp98/cpp11/cpp14/cpp17/cpp20)
# 每个可执行文件包含 scope_exit/scope_fail/scope_success 等 lest 测试用例
upstream_tests:
  - file: test/scope.t.cpp
    source: scope-lite-0.3.0/test/scope.t.cpp
    description: "scope guard 核心单元测试 (lest 用例: scope_exit/scope_fail/scope_success 语义)"
    command: "ctest -R test-cpp11"
  - file: test/scope-main.t.cpp
    source: scope-lite-0.3.0/test/scope-main.t.cpp
    description: "测试主函数入口 (lest 框架 main)"
    command: "ctest -R test-cpp11"

test_package_tests:
  - file: test_scope_lite.cpp
    description: "消费者测试: 验证 scope-lite 库链接、scope_exit/scope_fail/scope_success API"
    command: "./test_scope_lite"

assertion_count: 4
