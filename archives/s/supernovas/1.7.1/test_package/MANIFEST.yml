package: supernovas/1.7.1
homepage: "https://github.com/Smithsonian/SuperNOVAS"

upstream_check_command: "ctest --test-dir <build_folder> --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: test/c99/CMakeLists.txt
    description: "C99 CTest programs: test-compat, test-super, test-errors"
    command: "ctest -R 'test-(compat|super|errors)'"
  - file: test/cpp/CMakeLists.txt
    description: "34 C++ wrapper CTest programs generated from *Test.cpp"
    command: "ctest -R '.*Test'"

test_package_tests:
  - file: test_supernovas.c
    description: "C public API consumer for Julian date, calendar, vector, observer, and version checks"
    command: "./test_supernovas_c"
  - file: test_supernovas.cpp
    description: "C++ public API consumer for Time, Angle, Unit, and CalendarDate checks"
    command: "./test_supernovas_cpp"

