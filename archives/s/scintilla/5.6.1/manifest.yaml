name: scintilla
version: 5.6.1
description: "Cross-platform source code editor component library"
homepage: https://www.scintilla.org/
license: License.txt
source_url: https://www.scintilla.org/scintilla561.tgz

build:
  system: HarmonyOS (aarch64-unknown-linux-ohos)
  compiler: clang++ 15.0.4
  standard: c++17
  type: static_and_shared_library
  output:
    - libscintilla_core.a
    - libscintilla_ohos.so

adapter:
  approach: "core_only_with_platform_layer"
  description: |
    Scintilla's native build depends on GTK (PlatGTK.cxx). Since HarmonyOS
    has neither GTK nor a package manager, we compile only the core library
    (src/*.cxx, 33 files) with zero modifications, and provide a complete
    platform layer (PlatOHOS.cxx, 707 lines) using HarmonyOS Native Drawing API.

    Platform layer implementation:
    - SurfaceImplOHOS: Full rendering surface (~40 virtual methods) using
      OH_Drawing_Canvas, Brush, Pen, Path, Bitmap, TextBlob
    - FontHandleOHOS: Font management via OH_Drawing_Font, Typeface, FontMgr
    - ListBoxX: In-memory list stub (pending ArkUI integration)
    - Window/Menu: Stub implementations (pending XComponent integration)

    All 33 core source files compile unchanged. 52/52 unit tests pass (3791 assertions).

    Build produces two targets:
    - libscintilla_core.a: Static library (33 core + PlatOHOS.cxx)
    - libscintilla_ohos.so: Shared library (--whole-archive link of core + ScintillaOHOS.o)

  patches:
    - patches/0001-add-harmonyos-rendering-platform-layer.patch
    - patches/0002-add-harmonyos-editor-integration.patch
    - patches/0003-add-fineticker-overrides.patch
    - patches/0004-performdraw-fix-and-diagnostics.patch
    - patches/0005-hilog-diagnostics-for-sigabrt-debugging.patch
    - patches/0006-fix-have-mouse-capture-for-buttonmove-crash.patch
    - patches/0007-platohos-init-windowid-diagnostics.patch
    - patches/0008-mousecapture-fix-and-buttonmove-diagnostics.patch
    - patches/0005-hilog-diagnostics-for-sigabrt-debugging.patch

  dependencies:
    runtime:
      - libnative_drawing.so (HarmonyOS SDK)

  notes:
    - /tmp is read-only; use ${TMPDIR:-$HOME/tmp} for temp files
    - Internal headers have fragile include order; external use requires adding missing includes
    - curl downloads need --insecure (missing CA certificates)
    - Unit tests pass but require sanitizer disabled (loading timeout)
    - aarch64 binaries cannot be executed in build sandbox; device testing needed
    - Shared library requires --whole-archive linking to prevent symbol stripping

status: device_testing
