# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: spoa/4.1.5
homepage: "https://github.com/rvaser/spoa"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (CMake spoa_test, GTest 22 用例通过, 详见 reports/test-report.md)
upstream_tests:
  - file: test/spoa_test.cpp
    source: spoa-4.1.5/test/spoa_test.cpp
    description: "上游 GTest 单元测试 (22/22 通过, 95.7% 全量通过率; Archive 用例在 SPOA_USE_CEREAL 互斥分支)"
    command: "./bin/spoa_test"

# test_package 中自带的测试 (消费者视角验证, HarmonyOS 专项测试)
test_package_tests:
  - file: test.cpp
    description: "HarmonyOS 消费者测试: 真实调用 spoa API (Version/AlignmentEngine/Graph/Consensus/MSA)"
    command: "./test_spoa"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 27