# ============================================================
# 构建配置
# ============================================================

build:
  # 上游是**纯 Makefile**，无 configure / configure.ac / Makefile.am / aclocal.m4
  # （实测 ls 全部 No such file），因此不是 autotools，不需要 autoreconf。
  system: make

  # conanfile.build() 实际下发、且已在 tmpfs 复现树与 conan 侧各跑过一遍的
  # make 覆盖项（`make -j1 CC=<c> prefix=<build_folder>/prefix
  #                     SKFLAGS="<-O2|-O0 -g> -DSYSV -Wall" LDFLAGS=""
  #                     syslogd klogd` ⇒ MAKE_RC=0，
  # 产物 syslogd 55744 B / klogd 43392 B；见 notes.md §9.1、§10.4）。
  # -DSYSV 必须保留：syslogd.c:530 在 SYSV 下走 <fcntl.h>，否则走
  #   <sys/msgbuf.h>，而后者在本次 48 个系统头全量扫描中确认为 sysroot MISSING。
  # 剔除 -fno-strength-reduce：Makefile:23 的 GCC 专有 flag。
  # LDFLAGS 置空：上游 LDFLAGS=-s 在链接期改写 ELF，OHOS MAC 会拒绝
  #   （同 archives/a/abduco/0.6、archives/a/acorn-fdisk/3.0.6 记录的教训）。
  configure_options:
    - "CC=<tools.build:compiler_executables 的 c 项，回退 clang>"
    - "prefix=<build_folder>/prefix（build 私有前缀，R49/PF6，不落共享前缀）"
    - "SKFLAGS=<按 build_type 选 -O2/-O0 -g/-Os> -DSYSV -Wall"
    - "LDFLAGS=（空值，避免链接期 strip）"
    - "显式只构建两个目标：syslogd klogd（因而永不牵入 Makefile:78 的 test 目标）"

  # 交付态无第三方 Conan 依赖（sysklogd 只用 libc + 内核接口）。
  # 该结论一手依据：`conan-verify` G1「12 项配方完整性逐条 ✅」中的依赖检查
  # 与 `finish` Step4「✅ conan-verify 通过」（notes.md §10.4 / §10.5）。
  # 前置调查轮的 `preflight_check.sh sysklogd/1.5.1` RC=0 打印
  # 「[OK] 预检通过（无依赖需要检查）」是在 conanfile 生成前跑的，
  # 只作旁证、不作交付态判据。
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 六个适配补丁。0001/0002 由配方编写回合静态自检并按 §9 的 A/B 对照实验复核
# （回退 0001 后 `make klogd` 编译步 CC_RC=0、失败点后移到链接期
#  `ld.lld: error: undefined symbol: ksyslog` → `make: *** [Makefile:86: klogd] Error 1`；
#  打回补丁则 MAKE_RC_WITH_PATCH=0、klogd 43392 B；见 notes.md §9.5 与
#  `$HOME/tmp/uc2/sysklogd/{b0-report.log,syscall3-mechanism-probe.log,syscall3-mechanism-probe.c,b0-control-probe.sh}`）。
# 0003-0006 由构建验证回合按真机首错逐条补入，六条全部在 tmpfs 复现树上以
# `patch -p1` 顺序应用（--dry-run 与真实应用 RC 均为 0）并通过
# `make syslogd klogd`（`MAKE_RC=0`、`error:` 计数 0）。
# 全部补丁新增行不含平台宏（R8/PF5：`__OHOS__` 一类判定 grep 零命中），
# 依据的是「libc 是否提供 klogctl()/socklen_t 原型」这类能力事实。
patches_applied:
  - "0001-klogd-use-klogctl.patch - klogd 改走 libc 的 klogctl() 包装，替换 _syscall3() 自造 syscall（musl 派生 sysroot 无 _syscall3 宏；功能不裁剪，klogd 保留）"
  - "0002-syslogd-recvfrom-socklen-t.patch - syslogd 非 glibc 分支里 recvfrom 长度实参由 int 改 socklen_t（消除不兼容指针类型，与 glibc 分支对齐）"
  - "0003-syslogd-dprintf-name-collision.patch - syslogd 私有的调试 dprintf 无条件改名 mydprintf：上游只为 __GLIBC__ 做该改名，而 musl 派生 sysroot 同样在 stdio.h 声明 POSIX dprintf(int, const char *, ...) 却不定义 __GLIBC__，守卫落空即 static declaration of dprintf follows non-static declaration（该符号 file-local，改名对没有 dprintf 的 libc 是空操作）"
  - "0004-syslogd-wait3-int-status.patch - reapchild() 里 wait3() 的状态量由 BSD 遗留的 union wait 改为 int：sysroot 的 sys/wait.h 全文 grep 无 union wait（报 incomplete type），而 wait3() 在现带头集合里的状态实参就是 int *"
  - "0005-include-fcntl-h-pidfile-syslog.patch - pidfile.c 与 syslog.c 显式包含 fcntl.h：两文件只靠 sys/file.h 就调用 open() 与 O_RDWR/O_CREAT/O_TRUNC/O_WRONLY/O_NOCTTY，glibc 的 sys/file.h 会传递包含 fcntl.h，本 sysroot 的 sys/file.h 全文只有 LOCK_* 常量与 flock() 原型。另注：pidfile.o 无显式规则、走 make 内建规则因而不吃 SKFLAGS，此类缺头只能由源码补"
  - "0006-drop-linux-time-h-klogd-ksym-mod.patch - klogd.c 与 ksym_mod.c 上游非 glibc 分支里的 linux/time.h 换为用户态 time.h：该头是安装出来的内核头，其中 struct timespec 无守卫，与 musl 派生 sysroot 的 bits/alltypes.h 重定义；两文件对内核头符号零使用（timeval/timespec/gettimeofday 等全文 grep 皆空），换头不改语义"

# ============================================================
# 知识沉淀
# ============================================================

# 已入库的 B 草稿（本 PR 内附，路径 B 判=create）：
# 机制：musl 派生 sysroot 缺 glibc 时代 `_syscallN()` 宏、但被包装的 libc
# 函数（`klogctl`）在位 ⇒ clang 把 `_syscall3(...)` 按隐式 int 降级为
# 函数声明，编译步 RC=0，故障点后移到链接期 undefined symbol。
knowledge_gained:
  - "knowledge/drafts/DRAFT-sysklogd-1.5.1-syscalln-macro-missing-defers-to-link.md"
  - "knowledge/drafts/DRAFT-sysklogd-1.5.1-syscalln-macro-missing-defers-to-link.kv"
