# sysklogd 1.5.1 -- Conan source/patch declaration
#
# schema 取自同仓先例（archives/a/acpid/2.0.34/conandata.yml 的
# flat `sources: url/sha256` + `patches: [{patch_file, patch_description,
# patch_type}]`），未自创字段。

sources:
  # R39/PF7 官方源核实（curl -fsSIL，http=200，Apache/2.4.68 Debian，
  # last-modified 2014-10-04）；非镜像、非个人 fork、非 gitcode/gitee 搬运。
  url: "https://www.infodrom.org/projects/sysklogd/download/sysklogd-1.5.1.tar.gz"
  # 本任务实测值（真实下载 90011 字节后 sha256sum 得出，非编造、非占位符）：
  #   $ curl -fsSL -o sysklogd-1.5.1.tar.gz <url>   -> DL_RC=0
  #   $ sha256sum sysklogd-1.5.1.tar.gz
  #   5166c185ae23c92e8b9feee66a6e3d0bc944bf673112f53e3ecf62e08ce7c201
  sha256: "5166c185ae23c92e8b9feee66a6e3d0bc944bf673112f53e3ecf62e08ce7c201"

# 上游 tarball 自带的 modutils.patch 属上游历史补丁，不由 Conan 应用。
#
# 下列六个补丁均**不含任何平台宏**（R8/PF5：新增行不出现 __OHOS__ 一类判定），
# 判定依据是「 libc 是否提供 klogctl()/socklen_t 原型」这类能力事实，而不是
# 「是不是 HarmonyOS」。两者都已在解包树上通过
#   patch -p1 --dry-run -i <patch>            -> RC=0
# 以及真实 `patch -p1` 应用后 grep 复核（见同目录 notes.md 的静态自检表）。
patches:
  - patch_file: "patches/0001-klogd-use-klogctl.patch"
    patch_description: "klogd: 用 libc 的 klogctl() 包装取代 _syscall3() 自造 syscall（musl 派生 sysroot 无 _syscall3 宏，但有 klogctl；功能不裁剪）"
    patch_type: "portability"
  - patch_file: "patches/0002-syslogd-recvfrom-socklen-t.patch"
    patch_description: "syslogd: 非 glibc 分支里 recvfrom() 的长度实参由 int 改为 socklen_t，消除不兼容指针类型（与 glibc 分支写法对齐）"
    patch_type: "portability"

# 以下四条由构建验证回合（主理-9 子代理，2026-09-23）在真机上按第一条真实错误
# 逐条定位后补入。四条同样**不含任何平台宏**，判定依据一律是 libc/内核头能力事实：
# 编译命令与首条错误原文见同目录 notes.md 的「构建闸口实测」小节。
  - patch_file: "patches/0003-syslogd-dprintf-name-collision.patch"
    patch_description: "syslogd: 把内部调试用的私有 dprintf() 无条件改名 mydprintf。上游只为 __GLIBC__ 做该改名，因为 glibc 的 stdio.h 声明 POSIX dprintf(int, const char *, ...)；musl 派生 sysroot 同样声明该原型却不定义 __GLIBC__，守卫落空即 error: static declaration of dprintf follows non-static declaration。该符号是 file-local 静态符号，无条件改名对没有 dprintf() 的 libc 是空操作。"
    patch_type: "portability"
  - patch_file: "patches/0004-syslogd-wait3-int-status.patch"
    patch_description: "syslogd: reapchild() 中 wait3() 的状态实参由 BSD 遗留类型 union wait 改为 int。sysroot 的 sys/wait.h 全量 grep 无 union wait 定义（error: variable has incomplete type），而 wait3() 在现带头集合里的状态实参即 int *，glibc 的 BSD 兼容形参形式同样接受 int *。"
    patch_type: "portability"
  - patch_file: "patches/0005-include-fcntl-h-pidfile-syslog.patch"
    patch_description: "pidfile.c 与 syslog.c: 显式包含 fcntl.h。两文件只用 sys/file.h 就调用 open() 与 O_RDWR/O_CREAT/O_TRUNC/O_WRONLY/O_NOCTTY，这在 glibc 上成立（其 sys/file.h 会传递包含 fcntl.h），而 sysroot 的 sys/file.h 全文只有 LOCK_* 常量与 flock() 原型，于是 error: use of undeclared identifier O_RDWR 及 implicit declaration of open。"
    patch_type: "portability"
  - patch_file: "patches/0006-drop-linux-time-h-klogd-ksym-mod.patch"
    patch_description: "klogd.c 与 ksym_mod.c: 上游非 glibc 分支里的 linux/time.h 改为用户态 time.h。linux/time.h 是安装出来的内核头，其中 struct timespec 无 include 守卫，与 musl 派生 sysroot 的 bits/alltypes.h 已定义的同名结构相撞（error: redefinition of timespec）；两文件对内核头里的符号零使用（timeval/timezone/timespec/time_t/gettimeofday 全文 grep 皆空），故换成 time.h 不改语义。"
    patch_type: "portability"
