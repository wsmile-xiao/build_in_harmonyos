software: shfmt
# 版本级 manifest
# 文件位置: archives/s/shfmt/3.13.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.13.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-14"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/mvdan/sh/archive/refs/tags/v3.13.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOPROXY=https://goproxy.cn,direct"
    - "GOTOOLCHAIN=local"
  dependencies:
    - "goenv/3.1.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "shfmt 是纯 Go 项目，CGO_ENABLED=0 编译，无需源码补丁 (ref: E077)"
  - "Go 项目在 HarmonyOS 上使用 goenv 管理的 Go 版本编译 (ref: E050)"
