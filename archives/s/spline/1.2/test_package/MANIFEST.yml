# test_package/MANIFEST.yml — spline 1.2
package: spline/1.2
homepage: "https://tracker.debian.org/pkg/spline"

# 上游无独立测试套件：spline 1.2 是 David Frey 1996-1998 的两个 .c 工具
# （aspline.c + utils.c）。上游 Makefile 只有 all / clean / install 类目标，
# **没有 check 或 test 目标**，源码 tarball 内也不含测试源文件或期望输出。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_spline.c
    description: >-
      消费者测试 51 条断言，判据主体是**自闭合属性**而非 golden 向量：
      ① P2 常量保持性——输入全为同一常量 y=c 时，输出全部 101 行必须仍为 c
         （3 个常量 5 / 0 / -3.25）；
      ② P1 输入点包含性——手册明示 "includes the input set"，逐点校验 y=x²
         的 5 个输入点都出现在输出中；
      ③ 结构属性——输出 x 严格递增、行数不少于输入点数、首末 x/y 与输入端点
         一致、默认 101 行（100 个区间）且前三点等间距；
      ④ -n 属性——各档退出码 0、行数落在 [输入点数, 2n+2] 内（实测行数**不随
         n 单调**，因输出必须包含输入点而托底），并断言 n=20 时精确 21 行；
      ⑤ -a 自动 abscissa（输入仅 y）与缺参报错；递减输入被升序整理；
      ⑥ 用法/版本/许可（-h/--help/-V/--version/-W，断言均不含由 argv[0] 派生的
         程序名）；空输入、单点、非数字、不存在文件等错误路径。
    command: "test_spline <bin/aspline> <scratch-dir>"

# 测试断言总数
assertion_count: 51
