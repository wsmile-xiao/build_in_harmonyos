software: spline
display: "spline"
description: "Akima spline interpolation (aspline): smooth curve through (x, y) points without cubic-spline overshoot"
category: math
homepage: "https://tracker.debian.org/pkg/spline"
license: GPL-2.0-or-later
build_system: custom  # 两个 .c + 上游 Makefile 含 -mfpmath=sse（x86 专有），conanfile 直驱 clang

ohos_adaptation:
  key_points:
    - "两个 .c（aspline.c + utils.c）+ utils.h，无外部依赖（仅 libc + libm）"
    - "★ 上游 Makefile 的 CFLAGS 含 -mfpmath=sse（x86 专有）与大量告警开关，aarch64 上不可用 → build() 直驱 clang"
    - "★ 直编需补上游 Makefile 的 DEFS：-D_GNU_SOURCE -DHAVE_GETLINE -D<版本宏>"
    - "链接 -lm（musl 下数学函数在 libc 内，-lm 为兼容空壳）"
    - "musl 全支持，无 patch"
    - "编译产出单可执行文件 bin/aspline（约 35KB）"
    - "★ 用法/版本串里的程序名取自 argv[0] 的 basename（改名调用则跟着变）"
  common_dependencies:
    - libc (stdio/stdlib/string/ctype/math)
    - libm

versions:
  "1.2":
    status: built
    build_date: "2026-09-19"
    source_url: "https://deb.debian.org/debian/pool/main/s/spline/spline_1.2.orig.tar.gz"
    source_sha256: "cb0b76abe83ece66fed8d7b746471e0383a84cd734b304334edefa3ea3464b14"
    test_assertions: 51
