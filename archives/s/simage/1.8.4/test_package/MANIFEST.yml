package: simage/1.8.4
homepage: "https://github.com/coin3d/simage"
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests_exist: true
upstream_test_total: 1
upstream_test_count_method: ctest_entries
upstream_tests:
  - file: tests/loaders.c
    source: simage/tests/loaders.c
    description: "upstream loaders test — loads 8 images via simage_check_supported/read_image"
    command: "ctest -R loaders --output-on-failure"

test_package_tests:
  - file: test_simage.c
    description: "version + check_supported/power_of_two + resize — real simage API"
    command: "./test_simage"

assertion_count: 3
