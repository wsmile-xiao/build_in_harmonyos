software: simage
version: "1.8.4"
status: built
build_date: "2026-09-21"
build_system: cmake

source:
  url: "https://github.com/coin3d/simage/releases/download/v1.8.4/simage-1.8.4-src.tar.gz"
  sha256: "b2bdc665cbe43036c29a479a0560a3c34697b25fad3a20ef49b240b1ac5f2956"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "SIMAGE_BUILD_SHARED_LIBS=OFF"
    - "SIMAGE_BUILD_EXAMPLES=OFF"
    - "SIMAGE_BUILD_TESTS=ON"
    - "SIMAGE_LIBJASPER_SUPPORT=OFF"
    - "SIMAGE_LIBSNDFILE_SUPPORT=OFF"
    - "SIMAGE_OGGVORBIS_SUPPORT=OFF"
    - "SIMAGE_TGA_SUPPORT=ON"
    - "SIMAGE_ZLIB_SUPPORT=OFF"
    - "SIMAGE_GIF_SUPPORT=OFF"
    - "SIMAGE_JPEG_SUPPORT=OFF"
    - "SIMAGE_PNG_SUPPORT=OFF"
    - "SIMAGE_TIFF_SUPPORT=OFF"

products:
  libs:
    - libsimage.a
  tools: []

knowledge_gained:
  - "simage 1.8.4 is Coin3D image abstraction (C, CMake), upstream ISC, single ctest 'loaders'"
  - "OHOS build driven directly via cmake + ohos.toolchain.cmake to avoid conancenter cmake tool_requires KeyError"
  - "External codecs disabled for self-contained build; builtin RGB/PIC/TGA/EPS/MPEG2 remain"
