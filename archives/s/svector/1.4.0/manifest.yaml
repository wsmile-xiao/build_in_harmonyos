knowledge_gained:
  - "svector 1.4.0 is header-only (include/ankerl/svector.h): upstream CMake target is INTERFACE and only installs; its own tests are meson-driven and fetch doctest/fmt via wrap files from the network, so the recipe has no compile step and the consumer test exercises the installed header instead"
  - "Upstream unit tests can be run without meson by compiling each test/unit/*.cpp directly: clang++ -std=c++17 -DDOCTEST_CONFIG_IMPLEMENT_WITH_MAIN with doctest 2.5.3 + fmt 11.2.0 headers plus helper objects test/app/Counter.cpp, test/fuzz/api.cpp, test/app/ui/{Periodic,ProgressBar}.cpp and fmt src format/os objects; all 30 TUs pass on OHOS"
  - "doctest.h in the doctest 2.5.3 tarball lives at doctest/doctest.h (no include/ prefix) while unit tests include <doctest.h>; fmt 11 splits print symbols (fmt::v11::vprint) outside format.cc, so TUs printing via fmt/print.h need src print.cc objects too"
  - "OHOS consumer tests that compile their own binary at test time must sign it (E077 four-step) before execution; the packaged braa-style signing only covers package()-installed artifacts"

