# test_package/MANIFEST.yml — svector 1.4.0
# CI L0e requires this file to exist.

package: svector/1.4.0
homepage: "https://github.com/martinus/svector"

# svector's own CI drives tests with meson (CMakeLists.txt only installs).
# The meson suite fetches doctest 2.5.3 and fmt 11.2.0 via wrap files from the
# network. Static count: 34 files in test/unit/, 30 contain TEST_CASE macros,
# 133 TEST_CASE registrations in total.
upstream_check_command: "meson test -C build"
upstream_test_in_build: false
upstream_test_command: "meson test"

# Upstream unit tests, executed on-device by compiling each test/unit/*.cpp
# directly with clang++ -std=c++17 (doctest 2.5.3 + fmt 11.2.0 headers, plus
# test/app and test/fuzz helper TUs) — see reports/test-report.md for the
# per-file breakdown. Numbers below are filled from that run.
upstream_tests:
  - file: "test/unit/*.cpp (30 files with TEST_CASE)"
    description: "Upstream doctest unit suite compiled and executed directly (doctest 2.5.3, fmt 11.2.0, helper objects Counter.cpp/api.cpp/format.cc/os.cc)"
    command: "clang++ -std=c++17 per file + run (see reports/test-report.md)"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Compiles test_svector.cpp against the packaged header, signs the binary (E077) and runs 16 API checks (SVO inline path, heap growth, erase, non-trivial element type)"
    command: "bash test.sh <include-dir>"

assertion_count: 16
