software: soplex
display: "SoPlex"
description: "线性规划（LP）求解器，ZIB 出品，含 C++ 库与命令行求解器"
category: library
homepage: "https://soplex.zib.de/"
license: LicenseRef-ZIB-Academic-License
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake >= 4 需注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（上游 cmake_minimum_required(3.0.0)）"
    - "OHOS 平台设置 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "GMP=ON 保留 exact 有理数求解；ZLIB=ON 保留 gz 流读取"
  common_dependencies:
    - gmp/6.3.0
    - zlib/1.3.1

versions:
  "3.1.1":
    status: built
    build_date: "2026-09-16"
    format: conan
    note: "首次适配；上游 ctest 320/320 通过；消费者用例 + 鸿蒙专项测试通过"
  "7.1.6":
    status: built
    build_date: "2026-09-18"
    format: conan
    note: "版本升级；上游 ctest 351 用例待真机回填；消费者用例 + 鸿蒙专项测试待真机回填"