software: soplex
version: "3.1.1"
status: built
build_system: cmake
build_date: "2026-09-16"

source:
  url: "https://soplex.zib.de/download/release/soplex-3.1.1.tgz"
  sha256: "1ae72c6f324ba69c72aec7f1a910ddb80f73d40a3b52f1d63a88034e93b111de"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DGMP=ON"
    - "-DZLIB=ON"
    - "-DSANITIZE_UNDEFINED=OFF"
  dependencies:
    - gmp/6.3.0
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "SoPlex 3.1.1 声明 cmake_minimum_required(3.0.0)，CMake>=4 需注入 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "库与 CLI 双产出：libsoplex.a + bin/soplex，R38 需软件级 commands.json"