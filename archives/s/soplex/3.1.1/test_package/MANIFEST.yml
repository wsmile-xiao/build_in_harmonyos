# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: soplex/3.1.1
homepage: "https://soplex.zib.de/"

# 上游测试命令 (ctest -N 枚举: check/CMakeLists.txt 注册 40 实例 x 8 settings)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: check/CMakeLists.txt
    source: soplex-3.1.1/check/CMakeLists.txt
    description: "SoPlex 官方回归测试: 37 成功实例 + 3 失败实例 x 8 组 settings，经 add_test 注册为 ctest 用例，运行 bin/soplex 求解 MPS 实例并校验 Validation 状态"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_soplex.cpp
    description: "消费者测试: 通过公开 SoPlex C++ API 构建并求解最小化 LP，校验最优目标值 90.0"
    command: "./test_soplex"
  - file: test_ohos_soplex.cpp
    description: "鸿蒙专项测试: 校验 aarch64-ohos 平台属性（编译期 __aarch64__/__linux__ + 运行时 ELF e_machine=EM_AARCH64）并通过公开 API 求解验证数值正确性"
    command: "./test_ohos_soplex"

# 测试断言总数 (上游 ctest 用例总数, 用于质量评估)
assertion_count: 320