software: soplex
version: "7.1.6"
status: built
build_system: cmake
build_date: "2026-09-18"

source:
  url: "https://github.com/scipopt/soplex/archive/refs/tags/release-716.tar.gz"
  sha256: "f031d60e7ad9a575393b04083c2914fb71a9886ba70ae77931c5a46c76b85ae4"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DGMP=ON"
    - "-DZLIB=ON"
    - "-DSANITIZE_UNDEFINED=OFF"
    - "-DBOOST=OFF"
    - "-DMPFR=OFF"
    - "-DPAPILO=OFF"
    - "-DQUADMATH=OFF"
  dependencies:
    - gmp/6.3.0.1
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "SoPlex 7.1.6 声明 cmake_minimum_required(3.9)，无需 3.1.1 所需的 CMAKE_POLICY_VERSION_MINIMUM=3.5 注入"
  - "7.1.6 新增 BOOST/MPFR/PAPILO/QUADMATH 可选增强，显式关闭以保持与 3.1.1 一致的 gmp+zlib 最小依赖闭包；CLI 二进制不受影响"
  - "上游许可证由 ZIB Academic License 变更为 Apache-2.0"
  - "库与 CLI 双产出：libsoplex.a + bin/soplex，R38 需软件级 commands.json"
