# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: soplex/7.1.6
homepage: "https://soplex.zib.de/"

# 上游测试命令 (check/CMakeLists.txt 注册实例 x settings，见下方审计)
upstream_check_command: "ctest --output-on-failure -j1"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"

# 上游实际运行的测试程序
upstream_tests:
  - file: check/CMakeLists.txt
    source: soplex-release-716/check/CMakeLists.txt
    description: "SoPlex 官方回归测试: 37 个 MPS 实例 + 2 个 LP 实例 x 9 组 settings，经 add_test 注册为 ctest 用例，运行 bin/soplex 求解实例并以 Validation 状态为通过正则"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_soplex.cpp
    description: "消费者测试: 通过公开 SoPlex C++ API 构建并求解最小化 LP，校验最优目标值 90.0"
    command: "./test_soplex"
  - file: test_ohos_soplex.cpp
    description: "鸿蒙专项测试: 校验 aarch64-ohos 平台属性（编译期 __aarch64__/__linux__ + 运行时 ELF e_machine=EM_AARCH64）并通过公开 API 求解验证数值正确性"
    command: "./test_ohos_soplex"

# 测试断言总数 (上游 ctest 用例总数, 用于质量评估)
assertion_count: 351

# 审计说明：上游存在测试（见下方推导），待真机预检 ctest 全量执行回填通过率。
upstream_tests_exist: true
upstream_test_audit: >
  检查范围：scipopt/soplex release-716 tag（v7.1.6）源码树，check/CMakeLists.txt、
  check/instances/ 与 settings/ 目录。上游测试由 check/CMakeLists.txt 的
  add_instancetests 宏注册为 ctest 用例：successInstances 37 个 MPS 实例
  （27 个有限最优值实例 + 9 个 +infinity 不可行实例 + 1 个 -infinity 无界实例）
  与 lpInstances 2 个 LP 实例（afiro、scagr25），乘以 9 组基础 settings
  （default、default-col、default-row、devex、internalsimplifier、
  papilosimplifier、polish1、polish2、steep），即 (37+2)×9 = 351 个 ctest 用例；
  failInstances 变量在该文件中未定义，贡献 0 用例。exact/mpf/quad 等额外
  settings 仅在 BOOST 启用且找到 Boost/MPFR 时追加，本配方显式 BOOST=OFF、
  MPFR=OFF，故 settings 固定为 9 组。每个用例运行构建产物 bin/soplex 求解
  对应实例文件并以 "Validation : Success" 正则判定通过。tests/c_interface 下
  的 soplex_c_testing（链接 libsoplexshared 的 C 接口冒烟测试）不在 ctest
  注册数内。结论：上游存在测试（351 个 ctest 用例），随配方构建产物
  在构建树中注册，待真机预检全量执行后回填通过率。
