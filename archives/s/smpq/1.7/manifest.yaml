# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.7"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/notmgn/smpq/archive/refs/heads/main.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "smpq 用 STORMLIB_INCLUDE_DIR/STORMLIB_LIBRARY 原始变量定位 StormLib（并 try_compile check.c 拒绝 <9.14），配方直接把这两个变量指向 Conan 包的绝对路径即可；WITH_KDE=OFF（KDE4 桌面插件与无头打包无关且 OHOS 无 KDE4）"
  - "链接顺序坑：smpq 通过裸库路径链 StormLib，CMake 看不到依赖的传递需求。StormLib 是 C++ 静态库，其对象需要 zlib/bzip2 与 C++ 运行期（__gxx_personality_v0），必须排在 libstorm.a **之后**。CMAKE_EXE_LINKER_FLAGS 会出现在对象文件之前导致仍报 undefined symbol——应改用 CMAKE_C_STANDARD_LIBRARIES（CMake 把它排在目标库之后）；且 flag 字符串内不能带引号，否则 CMake 会把整串当成单个参数"
  - "smpq 的 MPQ 文件名为哈希存储：--create 若传绝对路径，会连同构建机前缀一起写进 listfile，且 --extract 会去重建该绝对路径（表现为莫名的 'File exists' 而实际未提取）。测试应在源目录以相对文件名建归档，再在独立空目录里 --extract"
  - "上游 notmgn/smpq 无任何 tag/release：CHANGELOG 首条与 CMakeLists 的 set(VERSION 1.7) 共同确认 main 分支即 1.7（HEAD 为 1.7 最终版），可参照 aaphoto 的 master==版本 做法并在 conandata.yml 注释说明"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
