# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: smpq/1.7
homepage: "https://github.com/notmgn/smpq"

# 上游测试命令：上游无自动化测试套件（仓库内无 test/ 目录、无 make test/ctest 目标）
upstream_check_command: "none (上游未提供测试套件)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "none"

# 上游实际运行的测试程序
upstream_tests: []

# 豁免声明 (TEST_QUALITY_SPEC.md 3.3 / 平台限制)
exemptions:
  - rule: "upstream_has_no_test_suite"
    reason: "smpq 上游仓库无 tests/、无 CTest 目标、无自动化测试脚本——功能覆盖改由 test_package 的真实 MPQ 往返测试提供"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "驱动打包的 smpq 二进制完成真实 MPQ 生命周期：--version 版本横幅 → 在源目录以相对名 --create 建归档 → 断言归档落盘且非空 → --info / --list 查看 → 在独立 out 目录 --extract → 与原始 payload 逐字节比对"
    command: "conan create . (test_package)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
