software: sqlite3
display: "SQLite"
description: "Self-contained, serverless, zero-configuration SQL database engine"
category: db
homepage: "https://www.sqlite.org/"
license: Public-Domain
build_system: custom

ohos_adaptation:
  key_points:
    - "autosetup 的 jimsh0 在 HMDFS 上无法 exec 子进程，需手动编译"
    - "手动编译：clang -c sqlite3.c + clang -o sqlite3 shell.c sqlite3.c"
    - "3.53.4 直接使用 amalgamation，不需要 configure 或 config.guess/config.sub"
    - "静态库边界避免与目标系统 sqlite3 同名库冲突"
  common_dependencies: []

versions:
  "3.49.1":
    status: published
    build_date: "2026-04-16"
  "3.53.4":
    status: built
    build_date: "2026-09-04"
