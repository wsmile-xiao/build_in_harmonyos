package: sqlite3/3.53.4
homepage: "https://www.sqlite.org/"

# The autoconf bundle is the amalgamation plus shell; the separate Tcl test
# tree is distributed in sqlite-src and is not present in this source package.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_zero_evidence: >-
  sqlite-autoconf-3530400.tar.gz contains sqlite3.c, shell.c, headers and the
  build scripts but no test/ directory, testfixture or check target. SQLite's
  Tcl test suite is a separate sqlite-src distribution.

test_package_tests:
  - file: test.c
    count: 1
    description: "Consumer CRUD, prepared-query, and library-version API test"
    command: "./test_sqlite3"

test_case_count: 1
assertion_breakdown:
  consumer_crud: 7
assertion_count: 7
