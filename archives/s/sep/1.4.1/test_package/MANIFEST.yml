package: sep/1.4.1
homepage: "https://github.com/sep-developers/sep"

upstream_tests_exist: true
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "sep_upstream_test_image && python3 ctest/compare.py"

upstream_tests:
  - file: ctest/test_image.c
    source: "sep-1.4.1/ctest/test_image.c"
    description: "Official C API integration executable covering background estimation, extraction and circular-aperture photometry"
    command: "sep_upstream_test_image data/image.fits sep-test.cat"
    discovered: 1
    executed: 1
    passed: 1
  - file: ctest/compare.py
    source: "sep-1.4.1/ctest/compare.py"
    description: "Official catalog oracle comparing object positions and aperture flux against the bundled SExtractor reference"
    command: "python3 ctest/compare.py data/image.cat sep-test.cat"
    discovered: 1
    executed: 1
    passed: 1

upstream_release_baseline:
  - file: test.py
    description: "Upstream Python/Cython binding regression suite, retained as a source-baseline check outside the C-library Conan artifact"
    command: "python3 -m pytest -q test.py"
    discovered: 26
    executed: 26
    passed: 26

excluded_binding_tests:
  - file: test.py
    reason: "The 26 pytest cases exercise the separately distributed Python/Cython binding; the selected cpp task packages the official standalone C API built by the upstream CMake project. The host baseline nevertheless passed 26/26."

test_package_tests:
  - file: test_sep.c
    description: "Installed-library consumer test with 30 checks covering versioning, background, extraction, apertures, ellipses and configuration setters"
    command: "test_sep"
  - file: test_sep_errors.c
    description: "Installed-library negative-path test for invalid image datatypes and public error messages"
    command: "test_sep_errors"
  - file: test_sep_ohos.c
    description: "HarmonyOS-specific AArch64 ABI, __OHOS__, double-image and shared-library runtime test"
    command: "test_sep_ohos"

upstream_test_case_count: 28
test_package_case_count: 3
adapted_test_case_count: 31
assertion_count: 37
