# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sdl2_image/2.6.0.1
homepage: "https://github.com/libsdl-org/SDL_image"

# 上游测试命令：SDL_image 上游有 CTest 测试（test/testimage，
# test/CMakeLists.txt add_test NAME testimage）；conanfile.py build()
# 末尾以 ctest --output-on-failure 完整执行
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: main.c
    source: SDL2_image-2.6.0/test/main.c
    description: "上游 SDL_test 自动化测试 testimage，遍历图像格式的加载/保存断言"
    command: "./testimage"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libSDL2_image.a；IMG_Init 断言 PNG|JPG|WEBP 三格式，并用 libpng 后端解码灰度+alpha PNG"
    command: "./test_sdl2_image"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
