software: SDL2_image
# 版本级 manifest 模板
# 文件位置: archives/s/SDL2_image/2.6.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.6.0.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"

# 构建系统类型（顶层字段）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 2.6.0 相同）
  url: "https://github.com/libsdl-org/SDL_image/releases/download/release-2.6.0/SDL2_image-2.6.0.tar.gz"

  # 源码校验和
  sha256: "611c862f40de3b883393aabaa8d6df350aa3ae4814d65030972e402edae85aaa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（关键：libpng 后端、禁 libtiff、禁 stb）
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DSDL2IMAGE_BACKEND_STB=OFF -DSDL2IMAGE_PNG=ON -DSDL2IMAGE_JPG=ON"
    - "-DSDL2IMAGE_TIF=OFF -DSDL2IMAGE_WEBP=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "sdl2/2.30.10.1"
    - "libpng/1.6.58"
    - "libjpeg-turbo/3.2.0"
    - "libwebp/1.6.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 本次采用 CMake 路径，无 autotools 补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 容器 /bin/sh 为 execute-only，CMake try-compile 用 GNU make 会因 stat /bin/sh 失败（E009/E011）；改用 Ninja generator + CMAKE_C_COMPILER_WORKS=TRUE 可绕过"
  - "HMDFS 不跟踪符号链接（E050/E073），conan 缓存内 shared 库(.so)符号链接不可访问，conan CMakeDeps find_library 找不到；用实体镜像 + 重定向依赖 cpp_info.libdirs/includedirs 使 find_library 命中实体，Findwebp 模块注入 webp_LIBRARY/webp_INCLUDE_PATH，运行时用 LD_LIBRARY_PATH 指向镜像"
  - "libtiff 在 OHOS 无可用二进制且 zstd 链复杂，裁剪掉（SDL2IMAGE_TIF=OFF）"

patch_generation:
  method: none
  patches_count: 0

patch_classification: []
