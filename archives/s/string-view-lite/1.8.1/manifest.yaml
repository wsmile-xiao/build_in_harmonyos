# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.8.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.1"

# 软件名
software: "string-view-lite"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/martinmoene/string-view-lite/archive/refs/tags/v1.8.1.tar.gz"

  # 源码校验和
  sha256: "97b812275f07d02592efb092bd70366d310b2294f677644ea07828e6138b091d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DSTRING_VIEW_LITE_OPT_BUILD_TESTS=ON"
  - "-DSTRING_VIEW_LITE_OPT_BUILD_EXAMPLES=OFF"
  - "-DCMAKE_SYSTEM_NAME=Linux"
  - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 本次无新增知识：配方骨架直接复用知识 E321（martinmoene lite 系
# header-only Conan 2.x 配方模式）与本仓已合入的 string-view-lite/1.8.0 配方，
# 一次构建通过，未产生新的可跨仓库复用错误模式。
knowledge_ref: "E321"
