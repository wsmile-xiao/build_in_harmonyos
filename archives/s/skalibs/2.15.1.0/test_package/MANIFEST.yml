# test_package/MANIFEST.yml — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: skalibs/2.15.1.0
homepage: "https://skarnet.org/software/skalibs/"

# 上游测试命令 (skarnet 构建系统无 make check; skalibs 是纯库，无自带测试套件)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序 (skalibs 是纯 C 库，上游源码无独立测试二进制)
upstream_tests:
  - file: src/libdatastruct/avlnode_insertnode.c
    source: skalibs-2.15.1.0/src/libdatastruct/avlnode_insertnode.c
    description: "skalibs 核心数据结构实现 (编译期验证)"
    command: "n/a (library, no standalone test binary)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "skalibs API 测试: stralloc (ready/copys/cats/shrink/free) + bytestr (byte_chr/byte_diff)"
    command: "./test_skalibs"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
