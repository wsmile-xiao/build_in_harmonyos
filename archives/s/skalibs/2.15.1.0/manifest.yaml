# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.15.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.15.1.0"

# 软件名
software: "skalibs"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-24"
build_system: "skarnet-configure"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 GitHub 源，CI 自动添加镜像 fallback)
  url: "https://github.com/skarnet/skalibs/archive/refs/tags/v2.15.1.0.tar.gz"

  # 源码校验和
  sha256: "efa8b213fe341d57c8b7ad087d928b8d3296643a3a1583bf7e7675766bb68b06"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "--disable-shared"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # skalibs 无外部依赖，仅依赖 C 标准库

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
