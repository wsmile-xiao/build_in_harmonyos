software: skalibs
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.14.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.14.5.1"

# 构建系统类型
build_system: autotools

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/skarnet/skalibs/tarball/refs/tags/v2.14.5.1"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-sysdep-devurandom=yes"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "skalibs 使用自定义 configure 脚本（非标准 GNU autotools），交叉编译时需手动传递 --with-sysdep-devurandom=yes"
  - "skarnet.org 原始源码 URL 在该平台不可达（连接被重置），需使用 GitHub API tarball 替代下载"
  - "GitHub API tarball 内目录名非标准（如 skarnet-skalibs-6b1d07c），init-build 已自动处理"
  - "skalibs env_get 函数已标记为 deprecated，建议使用 env_get2 替代"
  - "bitarray_peek 是宏定义而非函数，bitarray_test 不存在"
  - "SHA256Schedule 是 skalibs 自定义结构体名（不是标准 SHA256_CTX）"
  - "skalibs 是纯库项目（无可执行文件和自带测试套件），需自编验证程序进行测试"
  - "预扫描风险 pthread_cancel 和 ppoll 在 musl/OHOS 上不可用，编译时无实际错误（代码已条件处理）"
  - "make -j2+ 在 OHOS 环境下因 jobserver mkfifo 权限问题失败，建议使用 make -j1"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
