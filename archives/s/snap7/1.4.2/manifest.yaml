  - "snap7 使用自定义 Makefile (build/unix/) 而非标准 autotools/cmake"
  - "源码以 .7z 格式分发，需从源码编译 p7zip 获取 7za"
  - "HarmonyOS 缺少 pthread_cancel/pthread_setcanceltype，需禁用线程取消机制"
  - "C++ 静态库需在 package_info 声明 system_libs=['c++','c++abi'] 供 C 消费者链接"
  - "package() 中库路径为 build/bin/ 而非 build/unix/bin/（OutputFile 使用 ../bin/ 相对路径）"

