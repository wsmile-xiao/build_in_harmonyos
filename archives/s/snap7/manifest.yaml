software: snap7
display: "snap7"
description: "Ethernet communication suite that works natively with Siemens S7 PLCs"
category: network
homepage: "https://snap7.sourceforge.net/"
license: LGPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "源码以 .7z 格式分发，需 7za 解压"
    - "使用自定义 Makefile (build/unix/)，非标准 autotools"
    - "HarmonyOS 缺少 pthread_cancel/pthread_setcanceltype，需禁用线程取消"
    - "C++ 库，消费者需链接 libc++/libc++abi"
    - "编译器 clang++ 15，归档工具 llvm-ar"
  common_dependencies: []

versions:
  "1.4.2":
    status: published
    build_date: "2026-06-29"
    conan_ref: "snap7/1.4.2@ohpcd/stable"
