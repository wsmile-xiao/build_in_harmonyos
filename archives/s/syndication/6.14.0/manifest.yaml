software: syndication
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/6.14.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.14.0"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 KDE 发布源，R39）
  url: "https://download.kde.org/stable/frameworks/6.14/syndication-6.14.0.tar.xz"

  # 源码校验和（对官方 KDE 下载页核对）
  sha256: "14e5ac6f632dc3022f6a32b9c8e5bd00896bdda5fad8585745023b2539561a19"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS=ON"
  - "-DBUILD_TESTING=ON"
  - "-DBUILD_QCH=OFF"
  - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
  - "-DCMAKE_CXX_STANDARD=20"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - qtbase/6.11.1
  - kcodecs/6.14.0
  - ecm/6.20.0   # tool_requires (ECM 构建基础设施)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 本版本无需补丁：OHOS 适配全部通过 CMake 变量（KF_IGNORE_PLATFORM_CHECK=TRUE）
# 与 generate() 路径注入完成，未修改上游源码。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "KDE Frameworks 6 库在 OHOS 上需 KF_IGNORE_PLATFORM_CHECK=TRUE 绕过 KDE 平台检测（OHOS 不在 KDE 平台列表）"
- "qtbase 以 cmake_find_mode=none 消费时 CMakeDeps 不生成 find path，需在 generate() 写私有 build_folder paths.cmake 注入 CMAKE_PREFIX_PATH/CMAKE_MODULE_PATH（R49）"
- "QT_ADDITIONAL_PACKAGES_PREFIX_PATH（分号分隔）让 Qt6Xml/Qt6Test/Qt6Network 模块配置在 qtbase 包内可被发现"
- "BUILD_TESTING=ON 并直接在 build() 中跑 ctest，可在 conan create 阶段执行上游 autotests（R51）"
