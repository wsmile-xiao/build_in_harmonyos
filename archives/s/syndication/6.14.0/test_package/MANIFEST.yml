# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: syndication/6.14.0
homepage: "https://invent.kde.org/frameworks/syndication"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"

# 上游实际运行的测试程序
upstream_tests:
  - file: autotests/testpersonimpl.cpp
    source: syndication-6.14.0/autotests/testpersonimpl.cpp
    description: "Person 解析 (email/name 格式) 单元测试"
    command: "./testpersonimpl"
  - file: autotests/syndicationtest.cpp
    source: syndication-6.14.0/autotests/syndicationtest.cpp
    description: "RSS2/RDF/Atom feed 文件解析与期望值比对测试 (数据目录 autotests/{atom,rdf,rss2}/)"
    command: "./syndicationtest"
  - file: autotests/loaderutiltest.cpp
    source: syndication-6.14.0/autotests/loaderutiltest.cpp
    description: "feed 解析工具函数测试 (数据目录 autotests/feeds/)"
    command: "./loaderutiltest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 通过 Syndication::parserCollection 解析 RSS 2.0 feed 并校验 title/items"
    command: "./test_syndication"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
