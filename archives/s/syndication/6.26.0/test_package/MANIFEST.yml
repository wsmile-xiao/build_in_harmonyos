# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包（syndication-6.26.0.tar.xz）
#   2. 运行 ctest -N 查看测试列表
#   3. 把实际运行的测试记录到下方

name: test_syndication
package: syndication/6.26.0
homepage: "https://invent.kde.org/frameworks/syndication"
description: "Syndication ParserCollection consumer smoke test for syndication 6.26.0"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"

# 上游实际注册运行的测试程序 (autotests/CMakeLists.txt add_test)
upstream_tests:
  - file: autotests/testpersonimpl.cpp
    source: syndication-6.26.0/autotests/testpersonimpl.cpp
    description: "Person 解析 (email/name/uri 格式) 单元测试，14 组 personFromString 输入断言"
    command: "./testpersonimpl"
  - file: autotests/syndicationtest.cpp
    source: syndication-6.26.0/autotests/syndicationtest.cpp
    description: "RSS2/RDF/Atom feed 文件解析与期望值比对测试（数据驱动：atom 28 + rdf 9 + rss2 34 = 71 个 feed 文件）"
    command: "./syndicationtest"
  - file: autotests/loaderutiltest.cpp
    source: syndication-6.26.0/autotests/loaderutiltest.cpp
    description: "feed 解析工具函数 LoaderUtil::parseFeed 测试（bug-383381 / test-gentoo-url / bug-484615）"
    command: "./loaderutiltest"

# 上游存在但未注册 ctest 的 .cpp（手动工具，无 add_test，逐条说明）
upstream_unregistered:
  - file: autotests/testlibsyndication.cpp
    reason: "命令行 feed 解析打印工具（打印解析内容到 stdout 的手动 utility），上游未 add_test，无断言，不属测试"
  - file: autotests/benchmark.cpp
    reason: "手动基准测试工具（读 feed 打印耗时），上游未 add_test，无断言，不属测试"
  - file: tests/testloader.cpp
    reason: "手动网络加载工具（QNetworkAccessManager 拉取在线 feed），上游未 add_test，需真实网络，不属测试"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 通过 Syndication::parserCollection 解析 RSS 2.0 feed 并校验 title/items/debugInfo"
    command: "./test_syndication"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 88
