# 软件级 manifest — smemstat
# 遵循 ARCHIVE-SPEC v2.0
software: smemstat
display: "smemstat"
description: "Kernel memory usage reporter with ncurses display (samples /proc/meminfo and per-process memory)"
category: utils
homepage: "https://github.com/ColinIanKing/smemstat"
license: GPL-2.0-only

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目：命令行 CFLAGS 会令 Makefile 的 `CFLAGS +=` 追加失效，须完整重供并以 -DVERSION='\"X.Y.Z\"' 引号形态保留版本宏（知识草稿 DRAFT-smemstat-0.02.13-make-cli-cflags-override）"
    - "Makefile 硬链接 -lncursesw：依赖 ohpcd 制品仓 ncurses/6.6（静态宽字符构建，libs=formw/menuw/panelw/ncursesw），静态链接规避系统 ncurses 影子（R26 类）"
    - "HMDFS 上不做 make install（install-sh/chmod 类问题），package() 纯 Python 拷贝 staging（dhcpoptinj 0.5.3 先例）"

versions:
  "0.02.13":
    status: built
    build_date: "2026-09-18"
