# 版本级 manifest — smemstat 0.02.13
# 遵循 ARCHIVE-SPEC v2.0

version: "0.02.13"
software: "smemstat"

# built = 构建验证完成（W3/conan-verify 通过，未走 release/upload 流水线）
status: built

build_date: "2026-09-18"
build_system: "makefile"

source:
  url: "https://github.com/ColinIanKing/smemstat/archive/refs/tags/V0.02.13.tar.gz"
  sha256: "0c0caf1ee9a0c0c4a840c0d01836bc4ea59d715e4df03cc3f24960c8e4009044"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make CC=<profile clang> CFLAGS='-O2 -fPIC -DVERSION=\"0.02.13\" -I<ncurses include>' LDFLAGS='-L<ncurses lib>' smemstat"
  dependencies:
    - "ncurses/6.6"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "纯 Makefile 项目：命令行 CFLAGS 会静默关闭 Makefile 的 `CFLAGS +=` 追加，必须在命令行完整重供 -DVERSION（上游用 -DVERSION='\"$(VERSION)\"' 引号形态）"
  - "smemstat 硬依赖 -lncursesw，ohpcd 制品仓 ncurses/6.6 为静态宽字符构建（formw/menuw/panelw/ncursesw），直接满足"
  - "HMDFS 上避免 make install（install-sh/chmod 类问题），package() 用纯 Python 拷贝 staging"
