package: smemstat/0.02.13
homepage: "https://github.com/ColinIanKing/smemstat"

upstream_tests_exist: false
upstream_test_audit:
  - source: "smemstat-0.02.13 source tree root"
    reason: "No tests/ or test/ directory present; only smemstat.c, Makefile, man page, bash-completion, debian/, scripts/."
  - source: "Makefile"
    reason: "Targets are smemstat, smemstat.8.gz, dist, clean, install; no check/test target registered."
  - source: "release tarball CI configs"
    reason: "Tarball ships no .travis.yml/.github workflows; nothing invokes a test suite."
  - source: "smemstat.c full-text scan"
    reason: "No TEST/TEST_F/check/cmocka/munit harness strings; test-like hits are ordinary words (latest, contest)."
  - conclusion: "Upstream 0.02.13 ships zero automated tests; adaptation validates via test_package binary checks without claiming upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "Run packaged bin/smemstat -h and verify usage + version text"
    command: "test_smemstat"
  - file: test.c
    description: "Run packaged smemstat -k 1 1 one-shot memory snapshot via /proc and verify non-trivial output"
    command: "test_smemstat"
  - file: test.c
    description: "Run packaged binary with invalid option -Z; require non-silent failure handling"
    command: "test_smemstat"
