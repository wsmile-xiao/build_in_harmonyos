# test_package/MANIFEST.yml — syrep 0.9 上游测试声明
#
# 上游测试清点（R51 三步法）：
#   1) 清点：src/Makefile.am:23 `noinst_PROGRAMS = rm-rf-test copy-fd-test`
#      —— 两个程序会被 make 编译，但未注册进 TESTS，make check 不会执行它们；
#      Makefile.am 无 TESTS 变量，上游无 tests/ 目录，Debian 打包亦未附带测试套件。
#   2) 执行：本适配在 conanfile.py build()（make 之后）内把两者接入自动化调用，
#      实测 2/2 PASS（copy-fd-test 断言拷贝结果 sha256 一致；rm-rf-test 断言目录树删除）。
#   3) 申报：如实登记于下方 upstream_tests/observed；上游测试源码未做任何修改。

package: syrep/0.9
homepage: "http://0pointer.de/lennart/projects/syrep/"

upstream_check_command: "make check"          # 空操作：上游无 TESTS 注册
upstream_test_command: "copy-fd-test <src> <dst>; rm-rf-test <dir>（由 conanfile.py build() 内联执行）"
upstream_test_in_build: true

# 上游实际测试程序（未注册进 TESTS，本适配接入自动化执行并实测）
upstream_tests:
  - file: src/copy-fd-test.c
    source: syrep-0.9/src/copy-fd-test.c
    description: "拷贝文件一致性调试程序；适配后接入自动化"
    command: "copy-fd-test <src> <dst>"
    observed: "PASS — 65792 bytes, sha256 match"
  - file: src/rm-rf-test.c
    source: syrep-0.9/src/rm-rf-test.c
    description: "递归删除目录树调试程序；适配后接入自动化"
    command: "rm-rf-test <dir>"
    observed: "PASS — nested tree removed"

test_package_tests:
  - file: test_syrep.cpp
    description: "运行打包的 syrep 二进制：--version 冒烟 + update→makepatch→merge 往返，断言 B 仓库文件内容与 A 一致"
    command: "./test_syrep"

assertion_count: 7
