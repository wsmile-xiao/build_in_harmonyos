# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9"

# 软件名
software: "syrep"

# 编译状态
# published | built | failed | archived
# built = conan create（含 test_package）本地/CI 校验通过，制品仓 upload 待 PR 合并后 release 流水线执行
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://0pointer.de/lennart/projects/syrep/syrep-0.9.tar.gz"

  # 源码校验和
  sha256: "b4072bdd0eef99fdd57a0758e99be8d15917d0ba90cd67e1ffa0832de2568ed2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-lynx"
    - "--build=aarch64-unknown-ohos"
    - "--host=aarch64-unknown-ohos"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - berkeley-db/4.8.30
    - zlib/1.3.1

  # 构建工具依赖（tool_requires）
  build_requirements:
    - autoconf/2.72

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（0002 为上游 2005 版 configure 的 4 行守卫修正，替代旧的
# 14805 行整文件重生成补丁 0004；build() 以 os.utime + /bin/true 防止 make
# 重跑 autotools —— E248/E041）
patches_applied:
  - "0001-config.guess.patch"
  - "0002-configure.patch"
  - "0003-config.sub.patch"
  - "0005-configure.ac.patch"
  - "0006-src-package.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "2005 年代 autotools 项目的 config.guess/sub 需补 ohos 识别（HarmonyOS uname case + -ohos* triple）"
  - "老式 AC_CHECK_HEADER 依赖探测必须用 AutotoolsDeps 注入 -I/-L，否则 conan 依赖的头文件不可见"
  - "HMDFS 无硬链接（E079）：依赖 link() 落盘的工具需 patch 回退 copy（syrep package.c 为例）"
  - "生成文件（configure）不做整文件重生成补丁：上游 2005 版 configure 内联的 DB 版本守卫用 4 行补丁直接改（旧 0004 曾达 14805 行，不可审）；CI 亦不应依赖 autotools 重生成——本机实测系统 autoconf 与 conan perl 混搭报 Perl_my_cxt_init 符号缺失（E041/E071 口径）"
  - "E248 防误触发：patch 过 configure.ac 后，Makefile.in 的 $(top_srcdir)/configure: $(am__configure_deps) 规则会在 make 时重跑 AUTOCONF/AUTOHEADER/AUTOMAKE（CI 无这些工具）。build() 对 configure/config.h.in/所有 Makefile.in 做 os.utime，并把 AUTOCONF/AUTOHEADER/AUTOMAKE/ACLOCAL 置为 /bin/true 双保险"
  - "HMDFS 权限：config.status 以 (umask 077 && mktemp -d ./confXXXXXX) 建临时目录，写 subs1.awk 报 Permission denied → 'could not setup config files machinery'。修法必须内化进配方（build() 装组可写 mktemp 垫片 + umask 002 + PATH 前置）；曾因依赖本机全局 PATH 垫片导致本地 W3 绿、CI 红"
  - "profile [buildenv] 导出的 SHELL/CONFIG_SHELL=hnp bash 优先级高于配方 env，configure 需以命令前缀赋值 SHELL=/bin/sh CONFIG_SHELL=/bin/sh 调用，避免 configure 在 ksh 下测得 ECHO='print -r --' 而 config.status 在 bash 下执行失败"
  - "上游测试清点口径：src/Makefile.am 的 noinst_PROGRAMS（rm-rf-test、copy-fd-test）确属上游测试程序——会被 make 编译但不在 TESTS 中，make check 不执行；适配须在 build() 中真实运行二者并断言结果（R51），不能以『未接线』为由记为 0 用例"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/syrep-0.9.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/syrep-0.9.work
  source_orig_hash: ac0424a17e830a56
  source_work_hash: b422cd44c84765e2
  generated_at: '2026-09-25T22:09:12'
  patches_count: 4
  # 生成文件不落补丁，改由 tool_requires autoconf/2.72 在 build() 中重生成
  regenerated_in_build:
    - configure
    - config.h.in

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0005-configure.ac.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0006-src-package.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
