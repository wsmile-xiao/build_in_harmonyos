# test_package/MANIFEST.yml — 上游官方测试声明（shmcat 1.10）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: shmcat/1.10
homepage: "https://sourceforge.net/projects/shmcat/"

# 上游测试情况（设备实测，pristine tarball ~/builds/shmcat-1.10.tar.xz）
# shmcat 1.10 上游没有任何自动化测试：
#   ① 官方 tarball 内无 tests/ 目录（`ls -d tests` -> No such file or directory）；
#   ② Makefile.am / src/Makefile.am 中 `TESTS|check_|add_test` 命中数 0 / 0；
#   ③ `make -n check` 只递归出 automake 的通用规则（`test -f config.h || rm -f stamp-h1`
#      一类的 header 检查），没有任何测试程序或测试脚本被执行；生成的
#      Makefile / src/Makefile 里 `^check` 各 2 行均为 automake 内建空壳目标。
# 因此 N_static = 0，配方 build() 中无可执行的上游测试入口（非本适配删改）。
upstream_check_command: ""
upstream_test_in_build: false

upstream_tests: []

# test_package 中自带的测试（消费者视角验证，调用已安装二进制）
# shmcat/ftok 是 CLI 工具而非库，故消费者测试驱动安装后的二进制，
# 对其 stdout 字节序列与退出码契约逐条断言。
test_package_tests:
  - file: "test_shmcat.sh"
    description: "消费者测试 — 驱动已安装 shmcat/ftok：-V/-h 特性旗标、-t/-f/-i/-n/无操作数(stdin) 四条输出路径的字节级一致、-p 对真实 POSIX 共享内存对象(/dev/shm) 的 shm_open+fstat+mmap 端到端转储、-f 缺文件/-M IPC_PRIVATE/-m 负 id/--未知长选项 的退出码契约(1/1/1/10)、ftok 十六进-十-八进制三形态互洽与参数校验"
    command: "bash test_shmcat.sh <shmcat_bin> <ftok_bin> <workdir>"

# 上游测试断言总数（0：上游无自动化测试）；消费者断言总数见下
assertion_count: 14
consumer_assertions: 14
platform_limited_cases: 0
notes: >
  System V 转储路径（-M key / -m id 真正触达 shmget/shmat 的分支）在 OHOS
  AppSpawn 沙箱下由内核以 SIGSYS(signal 31) 终止，不返回 -1/errno，
  因此按 DRAFT-E584 的口径只作为"平台限制"诊断信息如实打印，不计入断言、
  也不用 timeout/|| true 吞掉以制造假通过。
