license: GPL-2.0-or-later
status: built
build_system: autotools
build_date: "2026-09-24"

source:
  url: "https://downloads.sourceforge.net/project/shmcat/shmcat-1.10.tar.xz"
  sha256: "821212924bf9ef3fbd7a357b4f1065898c12635b86fa5d7bad259533d251076e"

patches_applied:
  - "0001-configure-hmdfs-umask.patch"

upstream_tests:
  command: ""
  test_count: 0
  notes: "Upstream ships no automated test at all: the tarball has no tests/ directory, `grep -c 'TESTS|check_|add_test' Makefile.am src/Makefile.am` is 0/0, and `make -n check` only recurses automake's generic header rules. Nothing was deleted by this adaptation; N_static = 0."

test_package:
  assertion_count: 14
  description: "Consumer test drives the installed shmcat and ftok binaries: -V/-h feature flags, byte-exact -t/-f/-i -n/no-operand(stdin) output paths, a real POSIX shared-memory dump through /dev/shm (shm_open+fstat+mmap), the exit-code contract (missing file / IPC_PRIVATE key / negative id / unknown long option = 1/1/1/10), and ftok hex-decimal-octagonal mutual consistency plus argument validation."

knowledge_gained:
  - "E011: on HMDFS config.status creates ./confXXXXXX under umask 077 and then cannot write subs1.awk (Permission denied); the two umask 077 sites in configure must be relaxed to 022"
  - "E544: the OHOS toolchain closure ships ld.lld/ld64.lld but no bare `ld`, so configure dies with 'no acceptable ld found in $PATH'; pass an absolute LD=<...>/ld.lld"
  - "E580: AX_COMPILER_FLAGS injects -Werror and this package registers no --disable-werror; clang's -Wunused-command-line-argument on -Wl,--code-sign aborts the build — silence with -Qunused-arguments instead of loosening warnings"
  - "E584: System V IPC (shmget/shmat/shmctl) is terminated by the kernel with SIGSYS(31) under the OHOS AppSpawn sandbox instead of returning -1/errno, while configure's probes print 'yes' (false green); only the POSIX shared-memory surface is delivered, disclosed as a platform limitation"
  - "shmcat's bundled config.guess has no OHOS/HarmonyOS branch while config.sub already accepts linux-ohos*, so both --build and --host triplets must be given explicitly"
  - "configure.ac:103 gates the POSIX dumper on $enable_posix_shm while the probe blocks test the differently-spelled $enable_posix-shm (always true); the feature flag only takes effect at the gate, which is what -V reports"
