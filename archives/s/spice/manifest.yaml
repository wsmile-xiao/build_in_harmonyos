software: spice
display: "SPICE"
description: "SPICE remote desktop protocol server library (libspice-server)"
category: network
homepage: "https://www.spice-space.org/"
license: LGPL-2.1
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "消费者依赖传播：配方 requires 须显式 transitive_headers=True / transitive_libs=True（平台惯例，全仓 412 处同款），否则消费者侧 CMakeDeps 丢失静态依赖与 header-only 依赖（实测仅剩共享库）——公共头链引用的包（如 spice-protocol 的 <spice/qxl_dev.h>）在消费者编译期直接 file not found"
    - "单一无版本共享库：hmdfs 家目录拒绝符号链接（ln -s EPERM），meson 检测后跳过全部 symlinking，versioned 目标缺 .so 开发链接；按平台规范以补丁去掉 library() 的 version 参数，产出单文件 libspice-server.so（先例 libwebp -DCMAKE_PLATFORM_NO_VERSIONED_SONAME=ON、工具链 no-versioned-soname.cmake）"
    - "AF_UNIX 方言：OHOS 对 AF_UNIX socket 的 IPPROTO_TCP 选项返回 ENOPROTOOPT（keepalive 容错集合需覆盖，否则 Spice 警告被测试框架视为致命）；hmdfs 不支持路径式 unix socket（bind EPERM），测试回退抽象命名空间（@ 前缀，reds_init_socket 原生支持）"
    - "OHOS 内核禁止 shebang 脚本直接 execve（EACCES）：meson run_command 与 glib-mkenums 均需显式解释器执行（先例 glib）"
    - "构建期 codegen 依赖 pyparsing：以第二源固定 sdist + PYTHONPATH 注入，不依赖宿主 python 环境"
  common_dependencies:
    - glib
    - pixman
    - openssl
    - libjpeg-turbo
    - zlib
    - lz4
    - spice-protocol

# 版本索引（所有已归档版本，含状态）
versions:
  "0.16.0":
    status: built
    build_date: "2026-10-03"
    conan_ref: "spice/0.16.0"
