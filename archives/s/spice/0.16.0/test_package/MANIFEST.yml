# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: spice/0.16.0
homepage: "https://www.spice-space.org/"

# 上游测试命令：meson test（配方 build() 内经 meson.test 实际执行；native OHOS
# 真机加 --timeout-multiplier=16 --no-rebuild，cross 构建跳过执行）
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test -v --timeout-multiplier=16 --no-rebuild"

# 上游实际测试程序（23 项 = spice-common 5 + server 18），真机全部实际执行
# （create 实测 Ok: 23 / Fail: 0，无跳过、无失败）
upstream_tests:
  - category: spice-common
    count: 5
    description: "spice-common 子项目测试：test_logging / test_marshallers / test_region / test_ssl_verify / test_utils"
    status: run_in_build
    note: "test_ssl_verify 需要 0002 补丁（静态 libcrypto.a 下符号插入式测试桩与库强符号冲突，加 -Wl,--allow-multiple-definition）"
  - category: server
    count: 18
    description: "spice-server 套件：test-agent-msg-filter / test-channel / test-codecs-parsing / test-dispatcher / test-empty-success / test-fail-on-null-core-interface / test-leaks / test-listen / test-loop / test-options / test-qxl-parsing / test-record / test-set-ticket / test-stat / test-stat-file / test-stream / test-stream-device / test-vdagent"
    status: run_in_build
    note: "test-listen 需要 0004 补丁（hmdfs 不可 bind 路径式 unix socket → 回退抽象命名空间）；test-leaks 依赖 0003 补丁（AF_UNIX 上 TCP_KEEPIDLE 返回 ENOPROTOOPT，Spice 警告被测试框架视为致命）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_spice_server_api.c
    description: "链接 spice-server::spice-server 真实调用公开 API（SPICE_SERVER_VERSION 宏 / new / set_port 5912 通过·70000 拒绝 / set_name / set_ticket 通过·NULL 拒绝 / destroy，8 项断言）"
    command: "./test_spice_server_api"
  - file: test_ohos_platform.c
    description: "包内 libspice-server.so 平台 ABI 实测：ELF64/EM_AARCH64/PT_DYNAMIC、DT_NEEDED 含 libc.so 与 libglib-2.0.so.0、无 libc.so.6、含 libc++_shared.so、OHOS loader dlopen(RTLD_NOW)（9 项断言）"
    command: "./test_ohos_platform <pkg>/lib/libspice-server.so"
  - file: test_ohos_runtime.c
    description: "运行时闭包实测：包内每个真实共享库 dlopen(RTLD_NOW)、至少 1 个共享库、闭包驻留后重新加载、5 个契约符号 dlsym、loader 路径真实调用 new→set_port/set_name/set_ticket→destroy（5 项断言）"
    command: "./test_ohos_runtime <pkg>/lib/libspice-server.so"

# 测试断言总数：test_package 22 项（8+9+5）；上游 23 项测试用例在构建期真机执行
assertion_count: 22
