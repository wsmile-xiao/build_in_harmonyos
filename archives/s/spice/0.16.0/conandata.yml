sources:
  url: "https://www.spice-space.org/download/releases/spice-server/spice-0.16.0.tar.bz2"
  sha256: "0a6ec9528f05371261bbb2d46ff35e7b5c45ff89bb975a99af95a5f20ff4717d"

# 构建期 codegen 依赖（spice-common Marshallers 生成需要 python3 模块 pyparsing，
# spice_parser.py 缺模块直接 exit(1)）。固定版本纯 python sdist（MIT），
# 不使用宿主环境模块；先例 glib 的 proxy-libintl 第二源。
pyparsing:
  url: "https://files.pythonhosted.org/packages/c1/47/dfc9c342c9842bbe0036c7f763d2d6686bcf5eb1808ba3e170afdb282210/pyparsing-2.4.7.tar.gz"
  sha256: "c203ec8783bf771a155b207279b9bccb8dea02d8f0c9e5f8ead507bc3246ecc1"

patches:
  - patch_file: "patches/0001-meson-sh-script-invocation.patch"
    patch_description: "OHOS 内核/沙箱禁止 shebang 脚本直接 execve（真机实测脚本可执行位齐全仍 EACCES，rc=126），顶层 meson.build 两处构建期 run_command 改为显式 sh 调用（git-version-gen 取版本、check-spice-common 子模块检查）；对 Linux 宿主等价无副作用"
    patch_type: "portability"
  - patch_file: "patches/0002-spice-common-test-ssl-verify-static-openssl.patch"
    patch_description: "spice-common 的 test-ssl-verify.c 以符号插入方式故意重定义 OpenSSL 的 X509_NAME_add_entry_by_txt（注释原文 'This override the OpenSSL function'）：shared libcrypto 下可执行文件定义优先生效；静态 libcrypto.a 下该归档成员因其余 X509 符号被拉入，两个强定义冲突致链失败。给该测试目标加 -Wl,--allow-multiple-definition（先定义者胜=测试桩，等价共享库插入语义）；shared openssl 场景下无非重复定义，为空操作"
    patch_type: "portability"
  - patch_file: "patches/0003-net-utils-keepalive-enoprotoopt.patch"
    patch_description: "red_socket_set_keepalive 对 TCP_KEEPIDLE 的容错补上 ENOPROTOOPT：OHOS 内核对 AF_UNIX socket 的 IPPROTO_TCP 选项返回 ENOPROTOOPT（92，Protocol not available），而上游容错集合仅含 ENOTSUP/EOPNOTSUPP，导致 accept unix 连接时打 g_warning，测试框架把 Spice 警告视为致命（test-leaks 因此 Bail out）。同文件 red_socket_set_no_delay（TCP_NODELAY）已有完全相同写法的先例，本补丁照该先例补一行；Linux 上该场景返回 EOPNOTSUPP，已被原容错覆盖，行为无变化"
    patch_type: "portability"
  - patch_file: "patches/0004-test-listen-abstract-socket-fallback.patch"
    patch_description: "test-listen 的 connect_unix 用例在 cwd 内创建路径式 unix socket；OHOS 用户家目录是 hmdfs（分布式文件系统），bind() 一律 EPERM（/tmp 为只读挂载），用例在真机与 CI 均必然失败。补丁先 bind 探测 cwd 能否创建路径式 unix socket，不能则回退抽象命名空间（@ 前缀；spice 服务端 reds_init_socket 原生支持该形式，不经文件系统）；客户端按与其相同的 SUN_LEN 约定连接 @ 地址。常规 Linux 上探测成功，测试行为与上游一致"
    patch_type: "portability"
  - patch_file: "patches/0005-server-meson-unversioned-so.patch"
    patch_description: "hmdfs 家目录拒绝符号链接（ln -s 返回 EPERM），meson 探测到后打印 'Symlink creation does not work on this platform. Skipping all symlinking.' 并跳过全部符号链接：versioned 共享库只安装 libspice-server.so.1.15.0 本体，libspice-server.so 开发链接缺失，消费者无法解析（CMakeDeps 精确名 find_library(spice-server) 在配置期直接报 Library not found，链接器 -lspice-server 同样失败）。平台规范即单一无版本文件（no-versioned-soname.cmake 文件头：每个已发布 OHOS 生态系统库都是单一无版本文件，如 libKF6Screen.so / libQt6ShaderTools.so）；本补丁去掉 server/meson.build 中 library('spice-server') 的 version 参数，产出单一 libspice-server.so（真机 readelf 实测 SONAME 同名 libspice-server.so），与平台形态一致。Linux 宿主上该参数仅影响文件名与 SONAME，行为无差异"
    patch_type: "portability"
