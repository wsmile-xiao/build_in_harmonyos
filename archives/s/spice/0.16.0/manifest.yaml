version: "0.16.0"
status: built
build_date: "2026-10-03"
conan_ref: "spice/0.16.0"

source:
  url: "https://www.spice-space.org/download/releases/spice-server/spice-0.16.0.tar.bz2"
  sha256: "0a6ec9528f05371261bbb2d46ff35e7b5c45ff89bb975a99af95a5f20ff4717d"
  tar_format: tar.bz2

build:
  system: meson
  configure_options:
    - "-Dgstreamer=no"
    - "-Dlz4=true"
    - "-Dsasl=false"
    - "-Dopus=disabled"
    - "-Dsmartcard=disabled"
    - "-Dmanual=false"
    - "-Dinstrumentation=no"
    - "-Dalignment-checks=false"
    - "-Dextra-checks=false"
    - "-Dstatistics=false"
    - "-Dtests=true"
  dependencies:
    - glib/2.84.0.1
    - pixman/0.46.4.1
    - openssl/3.5.6
    - libjpeg-turbo/3.2.0
    - zlib/1.3.1.1
    - lz4/1.10.0.3
    - spice-protocol/0.14.5
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-meson-sh-script-invocation.patch"
  - "0002-spice-common-test-ssl-verify-static-openssl.patch"
  - "0003-net-utils-keepalive-enoprotoopt.patch"
  - "0004-test-listen-abstract-socket-fallback.patch"
  - "0005-server-meson-unversioned-so.patch"

knowledge_gained:
  - "消费者依赖传播（G2 实测）：本平台 conan 的 requires 默认不向消费者传递——消费者侧 CMakeDeps 实测仅生成 3 个共享依赖 target（glib/pixman/libjpeg-turbo），静态依赖（openssl/zlib/lz4）与 header-only 依赖（spice-protocol）全部缺失，公共头链 spice-core.h → <spice/qxl_dev.h> 在消费者编译期直接 file not found。按平台惯例（全仓 412 处同款）对所有 requires 显式 transitive_headers=True / transitive_libs=True 后，消费者 target 恢复全量 8 个（7 依赖 + 本体）"
  - "hmdfs 禁 symlink：meson 打印 'Symlink creation does not work on this platform. Skipping all symlinking.' 后 versioned 库仅装 libX.so.a.b.c 本体；meson 侧的平台规范等价物=去掉 library() 的 version 参数（cmake 侧=-DCMAKE_PLATFORM_NO_VERSIONED_SONAME=ON / no-versioned-soname.cmake），产出单文件 libspice-server.so，SONAME 同名（真机 readelf 实测）"
  - "OHOS AF_UNIX + IPPROTO_TCP 选项返回 ENOPROTOOPT(92)：上游 keepalive 容错仅覆盖 ENOTSUP/EOPNOTSUPP；同文件 red_socket_set_no_delay（TCP_NODELAY）已有同款处理，照先例补 errno != ENOPROTOOPT"
  - "hmdfs bind() EPERM：路径式 unix socket 不可用（/tmp 只读），回退抽象命名空间需按 SUN_LEN 约定与 reds_init_socket 的服务端绑定长度一致"
  - "shebang 脚本 execve EACCES（OHOS 内核/沙箱禁止）：meson run_command 用显式 sh 调用（git-version-gen / check-spice-common），glib-mkenums 注入 [python3, script] 数组（先例 glib）"
  - "spice-common codegen（Marshallers/parser）需要 pyparsing 且缺失时 exit(1)：以 conandata 第二源固定 2.4.7 纯 python sdist（MIT，先例 glib proxy-libintl）+ PYTHONPATH 注入，覆盖 configure 期 python-checks 与构建期 custom_target"
  - "MesonToolchain 不写 ar/ranlib，cross 侧缺 pkg-config：从 compiler_executables 同目录推导 llvm-ar/llvm-ranlib 并注入 conan_meson_*.ini（先例 glib/pixman）；lz4 的 .pc 需别名 liblz4.pc（dependency('liblz4')）"
