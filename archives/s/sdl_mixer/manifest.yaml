software: sdl_mixer
display: "SDL_mixer"
description: "Audio mixing library for SDL 1.2"
category: multimedia
homepage: "https://www.libsdl.org/projects/SDL_mixer/"
license: Zlib
build_system: autotools
status: built

ohos_adaptation:
  key_points:
    - "Uses published sdl12-compat/1.2.68 through a build-folder sdl-config wrapper for legacy AM_PATH_SDL."
    - "Disables optional music backends to keep the dependency graph reproducible on HarmonyOS PC."
    - "Uses an HMDFS umask 022 configure patch and GNU build/host tuples accepted by the legacy config.sub."
  common_dependencies:
    - sdl12-compat/1.2.68

versions:
  "1.2.12":
    status: built
    build_date: "2026-09-15"
