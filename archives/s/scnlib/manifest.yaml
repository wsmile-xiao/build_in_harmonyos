software: scnlib
display: "scnlib — scanf for modern C++"
description: "现代 C++17 scanf 替代库，提供类型安全的值扫描（scanning）能力，是 std::scanf/iostreams 的高性能替代"
category: foundation
homepage: "https://github.com/eliaskosunen/scnlib"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "C++17 compiled library（libscn），非 header-only"
    - "fast_float 依赖：上游 FetchContent bundled v6.1.6，仓内改用外部 fast_float/6.1.6（版本精确对应）"
    - "find_package(FastFloat) 与 Conan CMakeDeps 生成的 fast_float-config.cmake 命名不匹配，需 patch 对齐"
    - "xlocale.h 在 OHOS musl 不存在，上游 SCN_XLOCALE 宏自动落到 OTHER 分支（std::strtod fallback），无需 patch"
    - "上游 tests 用 FetchContent 拉 googletest（CI 网络禁 GitHub），SCN_TESTS=OFF，测试由 test_package 覆盖"
  common_dependencies:
    - "fast_float/6.1.6"

versions:
  "4.0.1":
    status: built
    build_date: "2026-09-12"
    notes: "首次适配，CMake compiled library，外部 fast_float 依赖 + find_package 命名 patch"
