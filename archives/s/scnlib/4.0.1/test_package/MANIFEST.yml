# test_package/MANIFEST.yml — scnlib 4.0.1

package: scnlib/4.0.1
homepage: "https://github.com/eliaskosunen/scnlib"

# 上游测试命令（官方 CI .github/workflows/linux.yml：SCN_CI=ON + ctest）
upstream_check_command: "cmake -G Ninja -DSCN_CI=ON -B build && cmake --build build && ctest --output-on-failure"

# conanfile.py build() 中已集成上游测试（回修后）：
# - SCN_USE_EXTERNAL_GTEST=ON：上游内建开关，googletest 由仓内已发布的
#   googletest/1.12.1 提供（CMakeDeps 桥接 GTest-config.cmake），替代上游
#   FetchContent 拉 GitHub main（CI 禁网不可达）
# - SCN_TESTS=ON + SCN_EXAMPLES=ON 构建 scn_tests/scn_impl_tests/
#   scn_stdin_test/scn_examples_test + 22 个 compile-fail 测试，
#   build() 中 ctest --output-on-failure 执行
# - OHOS 运行时：LD_LIBRARY_PATH=/system/lib64 解析 libc++_shared.so；
#   TMPDIR 指向可写构建目录（compile-fail 测试写临时文件，/tmp 只读 E002）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游默认形态（SCN_CI=ON）注册的 CTest 目标（实测：26 个全部构建并执行）
# scn_tests(336 gtest 断言) / scn_impl_tests(2275 gtest 断言) /
# scn_stdin_test(1, Python runner) / scn_examples_test(1, Python runner) +
# 22 个 compile-fail 测试（14 基础 + 8 regex）
# 实测结果（OHOS aarch64, clang 15, libc++, googletest/1.12.1）：26/26 全过
upstream_tests:
  - file: tests/unittests/*.cpp（26 个测试源）
    source: scnlib-4.0.1/tests/unittests/
    description: "googletest 单元测试套件 scn_tests（336 断言）+ scn_impl_tests（2275 断言），googletest/1.12.1 外部化后构建执行"
    command: "ctest"
  - file: tests/unittests/compilefail_tests/
    source: scnlib-4.0.1/tests/unittests/compilefail_tests/
    description: "22 个编译失败测试（14 基础 + 8 regex），icm_build_failure_testing 驱动，全部通过"
    command: "ctest"
  - file: tests/unittests/stdin_test.cpp
    source: scnlib-4.0.1/tests/unittests/stdin_test.cpp
    description: "stdin 扫描测试（Python runner 驱动 scn_stdin_test，1 断言通过）"
    command: "ctest"
  - file: examples/example_*.cpp（5 个示例）
    source: scnlib-4.0.1/examples/
    description: "示例一致性测试（Python runner 驱动 scn_example_1..5 并校验输出，1 目标通过）"
    command: "ctest"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "消费者测试 — scn::scan int/多值/float(fast_float 后端)/string/空白跳过负数/错误处理(invalid_scanned_value)/xchar 宽字符/vector range 序列/scan_int 快速路径，共 9 组断言"
    command: "./test_scnlib"

# 测试断言总数（test.cpp CHECK 宏计数）
assertion_count: 21
