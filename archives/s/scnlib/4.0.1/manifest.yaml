software: scnlib
# 版本级 manifest
# 文件位置: archives/s/scnlib/4.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "4.0.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/eliaskosunen/scnlib/archive/refs/tags/v4.0.1.tar.gz"
  sha256: "ece17b26840894cc57a7127138fe4540929adcb297524dec02c490c233ff46a7"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DSCN_INSTALL=ON"
    - "-DSCN_USE_EXTERNAL_FAST_FLOAT=ON"
    - "-DSCN_USE_EXTERNAL_GTEST=ON"
    - "-DSCN_TESTS=ON"
    - "-DSCN_DOCS=OFF"
    - "-DSCN_EXAMPLES=ON"
    - "-DSCN_BENCHMARKS=OFF"
    - "-DSCN_BENCHMARKS_BUILDTIME=OFF"
    - "-DSCN_BENCHMARKS_BINARYSIZE=OFF"
    - "-DSCN_WERROR=OFF"
    - "-DSCN_PEDANTIC=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "fast_float/6.1.6"
    - "googletest/1.12.1"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-external-fast-float-find-package.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 find_package(FastFloat) 与 Conan CMakeDeps fast_float-config.cmake 命名不匹配（大小写），patch 兼容两种拼写"
  - "OHOS musl 无 xlocale.h，scnlib SCN_XLOCALE 检测链自动落到 OTHER 分支，strtod 走 std 命名空间 fallback，无需源码改动"
  - "上游 googletest FetchContent 外部化：SCN_USE_EXTERNAL_GTEST=ON（上游内建开关）+ googletest/1.12.1 CMakeDeps 桥接（GTest-config.cmake + GTest::gtest_main/GTest::gmock_main，与上游 install 导出目标名一致），无需 patch；上游对 gtest 无版本约束"
  - "上游测试在 OHOS 直跑：musl ld.so 需 LD_LIBRARY_PATH=/system/lib64 解析 libc++_shared.so；compile-fail 测试需 TMPDIR 指向可写构建目录（/tmp 只读 E002）；26/26 CTest 目标全过（scn_tests 336 + scn_impl_tests 2275 + scn_stdin_test 1 + scn_examples_test 1 + compile-fail 22）"
  - "scnlib 4.0.1 是 compiled library（非 header-only），产出 libscn + scn::scn CMake target"
