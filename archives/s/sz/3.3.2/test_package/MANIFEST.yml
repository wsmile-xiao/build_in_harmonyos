# test_package/MANIFEST.yml — sz/3.3.2
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sz/3.3.2
homepage: "https://github.com/szcompressor/SZ3"

# 上游测试命令（列出用例：BUILD_TESTING=ON 配置后 ctest -N；
# gtest_discover_tests PRE_TEST 模式下用例在 ctest 执行期发现）
upstream_check_command: "cmake -DBUILD_TESTING=ON .. && ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test()（ctest；BUILD_TESTING=ON，3 可执行/7 用例全过，见 notes.md 账本）"

# 上游实际运行的测试程序（tools/test/modules/，gtest_discover_tests 注册）
upstream_tests:
  - file: tools/test/modules/test_encoder.cpp
    source: SZ3-3.3.2/tools/test/modules/test_encoder.cpp
    description: "编码器 4 用例：HuffmanEncoder/RunlengthEncoder/ArithmeticEncoder/BypassEncoder"
    command: "ctest -R test_encoder（gtest_discover_tests）"
  - file: tools/test/modules/test_lossless.cpp
    source: SZ3-3.3.2/tools/test/modules/test_lossless.cpp
    description: "无损失后级 2 用例：LosslessZstd/LosslessBypass"
    command: "ctest -R test_lossless（gtest_discover_tests）"
  - file: tools/test/modules/test_quantizer.cpp
    source: SZ3-3.3.2/tools/test/modules/test_quantizer.cpp
    description: "量化器 1 用例：LinearQuantizer"
    command: "ctest -R test_quantizer（gtest_discover_tests）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sz.cpp
    description: "消费者测试：SZ3::Config(64,64,16)+EB_ABS=0.1 → SZ_compress → SZ_decompress，断言压缩产物非空、解压成功、最大绝对误差≤误差界"
    command: "./test_sz"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
