# 版本级 manifest — sz 3.3.2（HarmonyOS PC 适配）
# 遵循 ARCHIVE-SPEC v2.0；DS-9 2026-09-21

version: "3.3.2"
software: "sz"

# G0-G3 PASS；G4 PASS 带告警（未能定位包 ID）；L2/L4/L5 框架口径 PASS（实为跳过：无 cache 路径），见 reports/conan-verify-report.md；
# 制品上传由 release 流水线完成后才允许标 published
status: built

build_date: "2026-09-21"
build_system: "cmake"

source:
  url: "https://github.com/szcompressor/SZ3/archive/refs/tags/v3.3.2.tar.gz"
  sha256: "5ab31e5d3fa2993bfdc13ac7f102ec31f893eeab716777f41e92eafe98abf878"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_H5Z_FILTER=OFF"
    - "-DBUILD_MDZ=OFF"
    - "-DBUILD_PARAVIEW_PLUGIN=OFF"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_GSL=ON"
    - "-DSZ3_USE_BUNDLED_ZSTD=OFF"
  # 运行依赖：zstd（无损失后级）；测试依赖：gtest（上游 tools/test gtest 套件）
  dependencies:
    - zstd/1.5.7.1
    - gtest/1.17.0.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "SZ3 核心=INTERFACE header-only（C++17）；根 CMakeLists 经 pkg_search_module(libzstd) 发现 zstd，conan 侧用 PkgConfigDeps 生成 libzstd.pc 注入 PKG_CONFIG_PATH 即命中，不需要编译上游捆包的 tools/zstd"
  - "上游 tools/test/modules/ 为 gtest 套件（BUILD_TESTING=ON 注册，gtest_discover_tests PRE_TEST），build() 内 cmake.test() 真实执行 7 用例全过"
  - "lang-preflight 因 tools/pysz/ 子目录 cython 绑定 pyproject.toml 误判 mixed；按 tinyvdb/tinydng/cxref 先例取证后按 cpp 主体继续，终态 result --force 覆盖"
  - "conan dlcache sidecar 权威格式：references 字典（键=包引用，值=URL 列表）加 timestamp；失败的缓存下载会留下 .dirty 标记，恢复 blob 时必须同时删标记，否则 remove_if_dirty 会反复清掉恢复的文件"
