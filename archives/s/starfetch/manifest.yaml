software: starfetch
display: "starfetch"
description: "Command line tool that displays constellations"
category: utility
homepage: "https://github.com/Haruno19/starfetch"
license: GPL-3.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "Single-file C++17 program; compile directly instead of using the upstream install target that hardcodes /usr/local."
    - "Resource directory is made relocatable via the STARFETCH_RES_DIR environment variable (patch 0001)."
    - "Data files (constellations, template, help message) are packaged under share/starfetch and exported through runenv_info."
    - "ELF binary is self-signed on OHOS builds so first execution is not blocked (E077)."
  common_dependencies: []

versions:
  "0.0.4":
    status: built
    build_date: "2026-09-28"
    path: archives/s/starfetch/0.0.4
