software: SDL2_ttf
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.22.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.22.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-20"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（空字符串表示无额外选项）
  configure_options: ""
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - SDL2/2.30.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - file: "0001-config.guess.patch"
    purpose: "HarmonyOS platform detection"
  - file: "0002-config.sub.patch"
    purpose: "ohos triplet support"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "config.status $ac_tmp variable empty on HarmonyOS shell"
  - "Uses bundled FreeType and HarfBuzz"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: platform
    platform_only: true
    guard: pending
  - file: 0002-config.sub.patch
    type: platform
    platform_only: true
    guard: pending