# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sdcv/0.5.3
homepage: "https://github.com/Dushistov/sdcv"

# 上游测试命令: BUILD_TESTS=ON 时 CMake 注册 11 个 shell 测试（tests/t_*），
# 经 enable_testing()/add_test 由 ctest 驱动
upstream_check_command: "cmake -DBUILD_TESTS=ON . && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test()（BUILD_TESTS=ON，ctest 执行 11 个 tests/t_* shell 用例）"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/t_list
    source: sdcv-0.5.3/tests/t_list
    description: "词典列表：sdcv -l 数量与数据目录 .ifo 文件数一致"
    command: "sh tests/t_list <sdcv> <testsdir>"
  - file: tests/t_use
    source: sdcv-0.5.3/tests/t_use
    description: "基本查询：安装 test_dict 后查询关键词返回 test passed"
    command: "sh tests/t_use <sdcv> <testsdir>"
  - file: tests/t_only_data_dir
    source: sdcv-0.5.3/tests/t_only_data_dir
    description: "--data-dir 指定词典目录行为"
    command: "sh tests/t_only_data_dir <sdcv> <testsdir>"
  - file: tests/t_synonyms
    source: sdcv-0.5.3/tests/t_synonyms
    description: "同义词词典查询"
    command: "sh tests/t_synonyms <sdcv> <testsdir>"
  - file: tests/t_json
    source: sdcv-0.5.3/tests/t_json
    description: "-j JSON 输出格式（依赖 jq，OHOS 平台不提供，逐项跳过：工具或依赖未安装且 CI 无法提供）"
    command: "skipped (jq missing on OHOS)"
  - file: tests/t_exact
    source: sdcv-0.5.3/tests/t_exact
    description: "精确匹配查询"
    command: "sh tests/t_exact <sdcv> <testsdir>"
  - file: tests/t_interactive
    source: sdcv-0.5.3/tests/t_interactive
    description: "非交互模式不等待输入（1 秒内退出）"
    command: "sh tests/t_interactive <sdcv>"
  - file: tests/t_utf8output
    source: sdcv-0.5.3/tests/t_utf8output
    description: "UTF-8 输出"
    command: "sh tests/t_utf8output <sdcv> <testsdir>"
  - file: tests/t_utf8input
    source: sdcv-0.5.3/tests/t_utf8input
    description: "UTF-8 输入"
    command: "sh tests/t_utf8input <sdcv> <testsdir>"
  - file: tests/t_datadir
    source: sdcv-0.5.3/tests/t_datadir
    description: "数据目录叠加行为"
    command: "sh tests/t_datadir <sdcv> <testsdir>"
  - file: tests/t_return_code
    source: sdcv-0.5.3/tests/t_return_code
    description: "查询失败退出码语义"
    command: "sh tests/t_return_code <sdcv> <testsdir>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sdcv.sh
    description: "消费者测试：运行安装的 sdcv 二进制，断言 --help 输出与未知选项退出码"
    command: "sh test_sdcv.sh <sdcv 路径>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
