# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

package: shellia/5.10
homepage: "https://salsa.debian.org/bs/shellia"

# 上游测试：shellia 提供 run_tests（Makefile shellia-tested-stamp 目标执行），
# 62 个 test.* 测试文件 × 5 种 shell（bash/dash/busybox sh/mksh/posh）。
# OHOS 实测（bash/busybox sh 下），详见 notes.md。
upstream_check_command: "make check（= ./run_tests）"
upstream_test_in_build: false
upstream_test_command: "./run_tests"

# 上游实际运行的测试程序（run_tests 内部驱动 62 个 test.* 脚本）
upstream_tests:
  - file: run_tests
    source: shellia-5.10/run_tests
    description: "shellia 测试驱动器：对 62 个 test.* 脚本 × 5 种 shell 运行，校验 ia 库输出与期望一致"

# test_package 中自带的测试（消费者视角验证：ia* 库可 source、核心函数可用）
test_package_tests:
  - file: test_shellia.sh
    description: "断言 share/shellia/ia* 8 个库文件存在非空；bash source ia 成功；ia_set2var/ia_easy_backslash 核心函数可调用；ia_arr base64 编解码往返（0001 补丁覆盖）；ia_check_logfile /dev/null 守卫（0003 补丁覆盖）"
    command: "conan create 内自动执行（test() 用 bash 运行）"

# 测试断言总数（test_shellia.sh 中 check 调用数）
assertion_count: 6