# conandata.yml — shellia 5.10
# shellia 是 Debian 官方包（deb.debian.org pool，sid 分支 5.10）。
# 源码 tar.xz 为 Debian native 包（Format 3.0），sha256 已从官方 dsc 核对：
#   dsc: shellia_5.10.dsc Checksums-Sha256: cdd0d5629cc3033b5ec553ce2d1409e576339c8a429416d650d2a08678d3bebc

sources:
  url: "https://deb.debian.org/debian/pool/main/s/shellia/shellia_5.10.tar.xz"
  sha256: "cdd0d5629cc3033b5ec553ce2d1409e576339c8a429416d650d2a08678d3bebc"

patches:
  - patch_file: "patches/0001-ia.array.patch"
    strip: 1
    patch_description: "ia_arr_get: base64 -d 去掉 -w 0（toybox base64 decode 模式不支持 -w，GNU base64 忽略该参数）"
    patch_type: "portability"
  - patch_file: "patches/0002-ia.basic.patch"
    strip: 1
    patch_description: "ia_easy_backslash: 去除 sed --unbuffered（toybox sed 不支持该选项，仅影响缓冲性能不影响转义结果）"
    patch_type: "portability"
  - patch_file: "patches/0003-ia.log.patch"
    strip: 1
    patch_description: "ia_check_logfile: ia_logfile=/dev/null 时跳过 touch 探测（toybox touch /dev/null 报 Operation not permitted，SELinux 平台限制）"
    patch_type: "portability"