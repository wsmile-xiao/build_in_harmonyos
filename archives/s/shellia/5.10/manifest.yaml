# 编译中学到的知识
knowledge_gained:
- "shellia 是 Debian 官方包（Architecture: all），纯 Shell 库（8 个 ia* 文件），无编译无 configure，构建=plain Makefile（rst2man 生成 man 页 + run_tests 生成 stamp）"
- "下游（如 bootcd 的 bootcdmk2diskconf）通过 . /usr/share/shellia/ia 使用，conan 包须把 ia* 安装到 share/shellia/ 对应路径"
- "OHOS toybox 与 GNU 工具差异：sed 无 --unbuffered / base64 decode 无 -w / head 无 -n 负数 / time 无 -f 且输出为 real/user/sys 三行 / touch /dev/null 报 Operation not permitted——测试框架假定 GNU coreutils，需按 toybox 能力降级（--unbuffered 仅缓冲性能、-w 0 在 decode 模式无意义、time 格式仅统计用）"
- "ia_unused_fd_calc 用 seq+fd 探测，OHOS 上正常返回最小可用 fd"

