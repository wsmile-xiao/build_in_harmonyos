software: seqtk
# 版本级 manifest 模板
# 文件位置: archives/s/seqtk/1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: makefile

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lh3/seqtk/archive/refs/tags/v1.5.tar.gz"

  # 源码校验和
  sha256: "384aa1e3cecf4f70403839d586cbb29d469b7c6f773a64bc5af48a6e4b8220a6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（seqtk无configure，实际为make参数）
  configure_options:
    - "CC=clang"
    - "CFLAGS=-fPIC -O2 -g -Wall -Wno-unused-function -Wno-format"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "zlib/system"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "seqtk是单文件C程序，使用简单Makefile，无需configure步骤"
  - "Makefile不支持DESTDIR，需要手动mkdir+cp到staging目录"
  - "make CC=clang覆盖Makefile默认的gcc编译器"
  - "seqtk不支持--version标志，版本信息在直接运行时显示(Usage头部)"
  - "G0 clean-verify对无configure的软件会失败，需手动验证"
  - "简单Makefile软件需添加顶层build_system: makefile字段到manifest.yaml"