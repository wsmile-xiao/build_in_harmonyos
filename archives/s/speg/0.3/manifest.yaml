knowledge_gained:
  - "纯 Python 库：conan-init 默认生成 Autotools 模板，须按 s3transfer 范式重写——build()=pass、package() 拷贝模块到 lib/python3、package_info 无 libs (ref: archives/s/s3transfer/0.19.2, notes.md)"
