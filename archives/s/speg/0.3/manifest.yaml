  - "W3 本地 CI 在未提交 worktree 上 junk_check 回退 full 模式会误报 main 存量 .build-closed/.staging-verified；真实 CI 用 PR diff 模式——本地模拟须先生成 pr.diff (ref: E255, notes.md)"
