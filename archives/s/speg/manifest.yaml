software: speg
display: "speg"
description: "PEG-based parser interpreter with memoization（纯 Python）"
category: library
homepage: "https://github.com/avakar/speg"
license: MIT
build_system: python

ohos_adaptation:
  key_points:
    - "纯 Python 库：无 C/C++ 源码、无 autotools/CMake 构建系统"
    - "package_type=python-require，speg/ 拷到 lib/python3，无 bin/ 产物（不建 commands.json）"
    - "conanfile.py build() 为 no-op；package_info 无 libs"
  common_dependencies: []

versions:
  "0.3":
    status: built
    build_date: "2026-10-02"
    conan_ref: "speg/0.3"
