# conandata.yml — saytime 1.0
# 上游: saytime 1.0 —— Jef Poskanzer 1990 年为 SPARCstation 写的报时语音程序
#       （"audio time hack for the SPARCstation"）。按当前时刻挑选 30 段
#       8-bit μ-law 裸 PCM 语音片段，顺序拼成一条流写进 /dev/audio。
#       随包附 saytime.sh —— 同等逻辑的 shell 版。
# 源: Debian pool 官方源包（main/s/saytime）
#     仓库规则 12 要求取包 URL 必须 HTTPS；CI 侧对 http:// 前缀不做镜像 fallback。
# sha256: 9e0dbccc016ea179a281c72449c935488f91f0718336f58fae5fabcc4f43267f
sources:
  url: "https://deb.debian.org/debian/pool/main/s/saytime/saytime_1.0.orig.tar.gz"
  sha256: "9e0dbccc016ea179a281c72449c935488f91f0718336f58fae5fabcc4f43267f"

# patches 必须是列表格式（Conan 2.x 按 self.version 查找；误写成 dict-by-filename
# 会取到空列表并静默跳过补丁，且被 CI 门禁 L0f 报 bad_patch_format）。
patches:
  - patch_file: "patches/0001-ohos-audio-fallback.patch"
    patch_description: "OHOS PC 无 SPARCstation 的 /dev/audio 设备节点：打开失败时回退到 stdout 而非 exit(1)；并让声音目录可用 SAYTIME_SOUNDS 环境变量覆盖（上游 Makefile 把 SOUND_DIR 写死成作者家目录 /users/mag/games/sounds/audio）"
    patch_type: "portability"
