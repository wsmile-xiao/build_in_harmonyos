software: saytime
display: "saytime"
description: "Jef Poskanzer's 1990 spoken-clock for the SPARCstation: concatenates 30 raw mu-law PCM phrase clips into the current time and writes the stream to /dev/audio"
category: utils
homepage: "https://sources.debian.org/src/saytime/1.0/"
license: MIT
build_system: custom  # 上游 Makefile 只有 `saytime:`/`clean:` 两个目标，且把 SOUND_DIR 写死成作者家目录；conanfile 直驱 CMakeToolchain 编单源文件

ohos_adaptation:
  key_points:
    - "单源文件 saytime.c（450 行）+ saytime.sh + Makefile + sounds/（30 段语音，合计 128602 字节），零外部依赖"
    - "仅 libc：stdio、time、sys/file、sys/fcntl，补丁另加 errno、stdlib、string"
    - "★ 适配点 1（行为变更）：OHOS PC 没有 SPARCstation 的 /dev/audio 音频设备节点。上游是 perror + exit(1)，patch 0001 改为打印一行诊断后把 fd 换成 1（stdout）。调用方 `saytime | player` 即可，程序不再因缺设备退出"
    - "★ 适配点 2：上游 Makefile 硬编码 -DSOUND_DIR=\"/users/mag/games/sounds/audio\"（作者家目录）。配方改为指向包内 share/saytime/sounds，patch 0001 再加 SAYTIME_SOUNDS 环境变量覆盖，部署方无需重编译即可换语音目录"
    - "产物 ELF64 / AArch64，NEEDED 仅 libc.so；可执行文件约 17.5KB"
    - "★ 30 段语音是**无头裸 PCM**（不是 .au 容器），拼接结果本身就是 SPARCstation 音频设备期望的字节流 —— 因此「stdout 流可被精确分解成片段序列」是与当前时刻无关的确定性性质，可直接作为测试断言"
  common_dependencies:
    - libc (stdio, time, sys/file, sys/fcntl, errno, stdlib, string)

patches:
  - id: "0001-ohos-audio-fallback.patch"
    reason: "OHOS PC 不存在 SPARCstation 的 /dev/audio 设备节点，上游逻辑会 perror 后 exit(1)，程序完全不可用；同时 SOUND_DIR 被上游 Makefile 写死成作者家目录"
    strategy: "打开 /dev/audio 失败时打印诊断并把 fd 换成 stdout(1) 而非退出；声音目录改为「SAYTIME_SOUNDS 环境变量优先，编译期 SOUND_DIR 兜底」；补 errno/stdlib/string 三个头文件"
    behavior_change: true

versions:
  "1.0":
    status: built
    build_date: "2026-10-01"
    source_url: "https://deb.debian.org/debian/pool/main/s/saytime/saytime_1.0.orig.tar.gz"
    source_sha256: "9e0dbccc016ea179a281c72449c935488f91f0718336f58fae5fabcc4f43267f"
    test_assertions: 17
