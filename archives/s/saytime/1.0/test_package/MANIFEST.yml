# test_package/MANIFEST.yml — saytime 1.0
package: saytime/1.0
homepage: "https://sources.debian.org/src/saytime/1.0/"

# 上游无独立测试套件：saytime 1.0 是 Jef Poskanzer 1990 年的单文件程序，
# 原包只有 saytime.c（450 行）/ saytime.sh / Makefile / sounds/（30 段语音）。
# Makefile 只有 `saytime:` 与 `clean:` 两个目标，没有 check/test；
# saytime.sh 是同等逻辑的 shell 实现，不是测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_saytime.c
    description: >-
      消费者测试 17 条断言。saytime 是可执行程序、没有可链接的库 API，
      因此用例按"该程序的真实调用方式"验证：把包内 bin/saytime 以子进程
      拉起，检查它对 SAYTIME_SOUNDS 的响应、对缺失/空声音目录的诊断，以及
      最核心的一条——**stdout 上的音频流能被精确还原成包内 30 段 .au 语音
      片段的有序拼接**。
      (A) SAYTIME_SOUNDS 指向包内 sounds → 退出码 0，stderr 同时报
          `/dev/audio unavailable` 与 `writing the audio stream to stdout`，
          stdout 拿到非空音频流；
      (B) 音频流逐段贪心分解：每次在当前位置匹配一个完整的 .au 片段并消耗，
          最终必须正好消耗完整个流、不留任何半截字节；拼接片段数 >= 3 且
          <= 30；且流必须以 the_time_is.au 开头（"The time is ..." 是固定
          的第一句）。**这条断言与当前时刻无关**——saytime 按小时/分/秒
          选句子，同一分钟内长度固定、跨分钟会变，所以不能直接断言字节数，
          只能断言"流是包内片段的精确拼接"；
      (C) SAYTIME_SOUNDS 指向不存在的目录 → 退出码 1，stderr 含
          `opening audio file` 与 errno 文本，stdout 为 0 字节；
      (D) SAYTIME_SOUNDS 指向空目录 → 同样退出码 1、stdout 为 0 字节、
          stderr 含 `opening audio file`。
      前置断言：包内必须带齐 30 段 .au 语音。
      全部期望文本取自 qemu-aarch64 + OHOS sysroot 下的**实测输出**。
    command: "test_saytime <package_root>"

# 测试断言总数
assertion_count: 17
