# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sleepenh/1.8
homepage: "https://codeberg.org/nsc/sleepenh"

# 上游测试命令（清点证据：源码包共 5 个文件 .gitignore / Makefile / changelog / sleepenh.1 / sleepenh.c，
# 无子目录；Makefile 目标只有 all / sleepenh / %.1.gz / clean / distclean / install，
# `make -n check`、`make -n test`、`make -n tests` 均报 "No rule to make target"；
# 无 tests/ 目录、无测试脚本、无 ctest/pytest 注册；作者仓库 tag 1.8 与本源码树哈希相同，
# Debian 打包（tag debian/1.8-1）也没有 debian/tests 自动化测试。上游测试用例数为 0，故无上游测试命令）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：上游不含任何测试）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，适配后补全）
test_package_tests:
  - file: test_sleepenh.py
    description: "A1-A4 产物检查（ELF64 AArch64 / PIE / PT_INTERP=/lib/ld-musl-aarch64.so.1 / man 页 .TH SLEEPENH 1，所有主机）+ F1-F8 功能检查（--version/-V 版本串 sleepenh 1.8、--help/-h 用法行程序名、无参数退出码 10、inf/nan 退出码 12、过期起点立即输出 1000.750000 退出码 1、--warp 时间折返到 INITIALTIME+k*0.5、真实休眠 0.3 s 由 SIGALRM 唤醒退出码 0、链式调用两次结束时间精确为 T0+0.5/T0+1.0 无累计漂移：退出码 + stdout 精确比对 + 计时窗口，每次运行 30 s 超时；aarch64 CI worker 上必跑，异架构主机仅在加载器/格式标记下记 SKIPPED）"
    command: "python3 test_sleepenh.py <package_folder>"

# 测试断言总数（按独立检查项计数：A1-A4 共 4 项 + F1-F8 共 8 项）
assertion_count: 12
