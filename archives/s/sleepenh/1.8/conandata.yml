    sha256: "6bb42f569bfdb9a61e10d7c0fa0623aa644b107a54a15f61c99b48b9091955fa"

patches:
  "1.8":
    - patch_file: "patches/0001-sleepenh.c.patch"
      patch_type: "portability"
      patch_description: "Take the program name shown by usage() from argv[0] (basename) instead of glibc's program_invocation_short_name, which OHOS musl neither declares in its headers nor exports from libc.so"
