# 版本级 manifest - sleepenh 1.8

version: "1.8"
software: sleepenh

# published | built | failed | archived
# 本地 conan-verify + W3 通过后置 built；CI 合并发布后置 published（由 CI 流水线处理）
status: built

build_date: "2026-09-23"
build_system: makefile

source:
  # salsa debian/sleepenh 的 upstream/1.8 标签归档（纯上游分支，git tree 与作者 codeberg 仓库 1.8 标签相同）
  url: "https://salsa.debian.org/debian/sleepenh/-/archive/upstream/1.8/sleepenh-upstream-1.8.tar.gz"
  sha256: "6bb42f569bfdb9a61e10d7c0fa0623aa644b107a54a15f61c99b48b9091955fa"
