build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  notes: "小型裸 Makefile（CC = gcc，内置 %: %.c 规则），in-source 构建；CC/CPPFLAGS/LDFLAGS 与经 EXTRA_CFLAGS 传入的 CFLAGS 取自 AutotoolsToolchain（R33）；vcsversion 在 make 命令行给出（源码归档无 .git）；只构建 sleepenh 目标"

patches_applied:
  - "0001-sleepenh.c.patch"

knowledge_gained:
  - "OHOS musl 的 program_invocation_short_name/program_invocation_name：头文件无声明、libc.so 只导出 __progname，libc.a 却有弱别名——只补 extern 声明时 -static 链接可过可跑、动态链接报 undefined symbol，静态重链验证因此是假阳性；改为从 argv[0] 取 basename（新增草稿；ref: knowledge/drafts/E6402-draft-6822.kv）"
  - "Makefile 以 git describe 生成版本串，源码归档无 .git 时为空：在 make 命令行覆盖 vcsversion（已有草稿覆盖；ref: knowledge/drafts/DRAFT-libfirm-1.22.0-makefile-version-header-tarball.kv）"

# refresh-patch（finish 第 1 步）会把本行起到文件末尾重置为 auto/pending，须放在最后
patch_classification:
  - file: 0001-sleepenh.c.patch
    type: portability
    platform_only: false
    guard: none
    hunks:
      - "usage() 的程序名由 glibc 扩展变量 program_invocation_short_name 改为 main() 中从 argv[0] 取 basename 的 progname：OHOS musl 头文件不声明、libc.so 不导出该变量；无平台宏，glibc/musl 同一代码路径"
