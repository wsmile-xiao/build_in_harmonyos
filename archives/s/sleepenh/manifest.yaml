software: sleepenh
display: "sleepenh"
description: "增强版 sleep：打印每次休眠的绝对结束时间，下一次调用可以此为起点，使 shell 循环按固定间隔执行而不累计误差（Pedro Zorzenon Neto 2003，Nicolas Schier 2014-2024）"
homepage: "https://codeberg.org/nsc/sleepenh"
license: "GPL-2.0-or-later"
category: utility
language: c
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C（gettimeofday / setitimer / sigaction / pause），上游 Makefile 写死 CC = gcc：make 命令行以 AutotoolsToolchain 给出的编译器覆盖，编译标志经上游 EXTRA_CFLAGS 钩子传入（R33）"
    - "usage() 引用 glibc 扩展变量 program_invocation_short_name：OHOS musl 头文件未声明（编译报错）、libc.so 也不导出，补丁改为从 argv[0] 取 basename，无平台宏"
    - "版本串由 git describe 生成，源码包无 .git：与 Debian rules 相同，在 make 命令行传 vcsversion"
    - "单二进制命令行工具安装到 bin/，man 页安装到 share/man/man1/，commands.json 声明（R38）"

versions:
  "1.8":
    status: built
    build_date: "2026-09-23"
    conan_ref: "sleepenh/1.8"
