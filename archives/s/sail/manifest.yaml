software: sail
display: "SAIL"
description: "SAIL — the missing small and fast image decoding library for humans (not for machines)"
category: gfx
homepage: "https://sail.software"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 项目，原生构建 OHOS aarch64 成功"
    - "可插拔 codec：此适配启用 PNG/JPEG/GIF/TIFF + 12 个自包含 codec，用标准模块 find_package 解析 Conan 依赖"
    - "C++ binding（sail-c++）按上游默认开启（SAIL_BUILD_BINDINGS=ON），其对应用例一并注册，上游测试总数完整覆盖 N=48"
    - "上游测试是 codec-aware（test-images.h 按 SAIL_HAVE_BUILTIN_<CODEC> 守卫），随启用 codec 集自适应"
  common_dependencies:
    - giflib
    - libpng
    - libjpeg
    - libtiff

versions:
  "0.9.10":
    status: built
    build_date: "2026-09-18"
    conan_ref: "sail/0.9.10"
