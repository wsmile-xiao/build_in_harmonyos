software: sail
version: "0.9.10"
status: built
build_date: "2026-09-18"
build_system: cmake

source:
  url: "https://github.com/HappySeaFox/sail/archive/refs/tags/v0.9.10.tar.gz"
  sha256: "dc0d6fa87cb4fa8b514f450a3fb13cee6e3e60f03250f683564fabbec0f722e3"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "SAIL_COMBINE_CODECS=ON"
    - "SAIL_ONLY_CODECS=bmp;gif;hdr;ico;jpeg;pcx;pnm;png;psd;qoi;tga;tiff;wal;xbm;xpm;xwd"
    - "SAIL_BUILD_APPS=OFF"
    - "SAIL_BUILD_EXAMPLES=OFF"
    - "SAIL_BUILD_BINDINGS=ON"
    - "SAIL_ENABLE_OPENMP=OFF"
    - "SAIL_THREAD_SAFE=ON"
    - "BUILD_TESTING=ON"

  dependencies:
    - "giflib/5.2.2"
    - "libpng/1.6.58"
    - "libjpeg-turbo/3.2.0"
    - "libtiff/4.7.2"

products:
  libs:
    - libsail.a
    - libsail-common.a
    - libsail-codecs.a
    - libsail-manip.a
    - libsail-c++.a
  tools: []

knowledge_gained:
  - "sail 0.9.10 是 C11 图像解码库，CMake 构建；codec 用标准模块 find_package（FindPNG/JPEG/GIF/TIFF）经 CMAKE_PREFIX_PATH 解析 Conan 依赖"
  - "上游测试是 codec-aware：tests/images/acceptance/test-images.h.in 用 #ifdef SAIL_HAVE_BUILTIN_<CODEC> 守卫，只测试启用 codec 的格式，可随 SAIL_ONLY_CODECS 裁剪"
  - "webp codec 走 config-mode find_package(WebP) 需要 WebP::webpdecoder/demux/libwebpmux 目标，libwebp 配方未完整暴露；avif/heif/jpeg2000/jpegxl/openexr/jbig/svg 依赖过大，本轮不启用"
  - "静态组合库 SAIL_COMBINE_CODECS=ON 时 codec 依赖须在 package_info 组件 requires 传播给下游链接"
