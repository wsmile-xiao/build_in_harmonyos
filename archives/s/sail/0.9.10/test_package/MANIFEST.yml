# test_package/MANIFEST.yml — sail 0.9.10
package: sail/0.9.10
homepage: "https://sail.software"

# Upstream tests are registered via CTest (tests/CMakeLists.txt). The suite is
# codec-aware: tests/images/acceptance/test-images.h.in only includes images
# guarded by #ifdef SAIL_HAVE_BUILTIN_<CODEC>, so on this build (PNG/JPEG/GIF/
# TIFF + self-contained codecs) the suite exercises exactly the enabled formats.
# SAIL_BUILD_BINDINGS=ON (the upstream default) registers the 16 tests/bindings/c++
# tests as well, giving the full official registration count of 48:
#   tests/sail (12 incl. custom-io) + tests/sail-common (15) + tests/sail-manip (5)
#   + tests/bindings/c++ (16) = 48 (ctest_entries).
upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_test_total: 48
upstream_test_count_method: ctest_entries

upstream_tests:
  - file: tests/CMakeLists.txt
    source: sail-0.9.10/tests/CMakeLists.txt
    description: "CTest suite (sail, sail-common, sail-manip test binaries) run with ctest --output-on-failure; counts parsed from real ctest output and persisted to res/upstream_test_summary.json"
    command: "ctest --output-on-failure"

test_package_tests:
  - file: test_sail.cpp
    description: "Consumer test: enumerate codecs, look up PNG codec, decode a hardcoded 2x2 BMP via sail_load_from_memory and verify dimensions"
    command: "./test_sail"

assertion_count: 3
