software: sheenbidi
version: "3.0.0"
status: built
build_date: "2026-09-20"
build_system: cmake
conan_ref: "sheenbidi/3.0.0"

source:
  url: "https://deb.debian.org/debian/pool/main/s/sheenbidi/sheenbidi_3.0.0.orig.tar.xz"
  sha256: "c009ee6153991998f4fa42af7ca3b1494cb716522d85cf8ebd7b869f6a459301"
  tar_format: tar.xz

build:
  system: cmake
  build_command: "cmake -DSB_CONFIG_UNITY=OFF -DBUILD_TESTING=ON -DBUILD_SHARED_LIBS=ON && cmake --build && ctest --output-on-failure --timeout 600"
  dependencies: []
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "自定义 STANDALONE_TESTING 套件（16 个测试可执行文件，经 ctest 驱动；失败由 FAIL_REGULAR_EXPRESSION 捕获）"
  upstream_discovered: 16
  upstream_passed: 16
  upstream_failed: 0
  upstream_note: "在真机通过 ctest 运行全部 16 个测试；每个可执行文件以 Tools/Unicode 数据目录为参数"
  test_package_passed: 12
  test_package_failed: 0
  test_package_assertions: 12
  execution: "conan create rc=0 + 上游 ctest 16/16 + 消费者 12 条断言"

test_passed: 28
test_failed: 0

patches_applied: []

knowledge_gained:
  - "sheenbidi 是纯 C（仅依赖标准 C 库），无平台相关内建，OHOS clang 直接构建即可"
  - "上游测试仅在非 unity 模式构建：BUILD_TESTS = BUILD_TESTING && !SB_CONFIG_UNITY → 需 -DSB_CONFIG_UNITY=OFF -DBUILD_TESTING=ON"
  - "测试可执行文件的 main 恒返回 0，失败靠 ctest 的 FAIL_REGULAR_EXPRESSION '[1-9][0-9]* error' 判定；每个测试以 Tools/Unicode 数据目录为 argv[1]"
  - "共享设备上 60s 的默认测试超时偏紧 → 用 ctest --timeout 600 放宽"
  - "CMake 目标为 SheenBidi::SheenBidi（安装导出命名空间 SheenBidi::），包信息据此设置 cmake 目标名"
