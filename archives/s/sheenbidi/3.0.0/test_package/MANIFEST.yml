# test_package/MANIFEST.yml
# sheenbidi 3.0.0.

package: sheenbidi/3.0.0
homepage: https://github.com/Tehreer/SheenBidi

upstream_tests_exist: true
upstream_test_audit: "custom STANDALONE_TESTING suite: CMakeLists.txt registers 16 test executables (AlgorithmTests .. ThreadLocalStorageTests); each is run with the Tools/Unicode data directory and failures are matched by FAIL_REGULAR_EXPRESSION \"[1-9][0-9]* error\""
upstream_check_command: "ctest --output-on-failure  (discovered: 16)"
upstream_test_in_build: true
upstream_test_command: "ctest"

upstream_tests:
  - name: "AlgorithmTests"
    path: "Tests/AlgorithmTests.cpp"
    description: "Unicode BidiTest/BidiCharacterTest conformance, mirroring, bracket pairs"
  - name: "the other 15 STANDALONE_TESTING suites"
    path: "Tests/*Tests.cpp"
    description: "allocator, atomic, bidi-type/general-category/mirror/bracket lookups, codepoint, queues, script, thread-local storage, ..."

test_package_tests:
  - file: test_sheenbidi.c
    description: "mixed Arabic/Latin paragraph: length, 3 level runs with exact offsets/lengths/levels, 2 mirrored parentheses; plus pure LTR and pure RTL single runs"
    command: "./sheenbidi_consumer"

test_files:
  - path: "test_package/test_sheenbidi.c"
    test_type: "R34"
    assertion_count: 12

test_package_test_count: 1
consumer_assertion_count: 12
assertion_count: 12
