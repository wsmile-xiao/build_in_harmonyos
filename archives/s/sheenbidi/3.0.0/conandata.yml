patches:
  - patch_file: "patches/0001-raise-test-timeout.patch"
    patch_description: "Raise the per-test ctest TIMEOUT from 60 s to 600 s: on the loaded shared OHOS device the thread-heavy AtomicTests (20000 thread create/join pairs) needs ~107 s, and ctest's --timeout does not override an explicit test property."
    patch_type: "portability"
