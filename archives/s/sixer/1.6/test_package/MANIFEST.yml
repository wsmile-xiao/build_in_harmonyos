package: sixer/1.6
homepage: "https://github.com/haypo/sixer"
upstream_check_command: "python3 -Werror::SyntaxWarning -m py_compile sixer.py && python3 tests.py"
upstream_test_in_build: true
upstream_test_command: "python3 -Werror::SyntaxWarning -m py_compile sixer.py && python3 tests.py"
upstream_tests:
  - file: tests.py
    source: "上游源码包 tests.py"
    description: "设备实跑由配方的 sys.executable 先严格编译模块，再运行 unittest 测试套件；以下为等价 python3 命令，不包含 tox 中的 README 文档转换检查。"
    command: "python3 -Werror::SyntaxWarning -m py_compile sixer.py && python3 tests.py"
test_package_tests:
  - file: test_sixer.py
    description: "消费者视角验证包内模块路径、命令文件权限、sixer 的帮助输出与失败退出码传递。"
    command: "python3 test_sixer.py <包目录>"
assertion_count: 7
