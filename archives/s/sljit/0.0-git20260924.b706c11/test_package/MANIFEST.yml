# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本强制要求存在（L0e）
#
# sljit 上游测试套件是 GNUmakefile 的 TARGET 变量注册的两个测试二进制
# （bin/sljit_test + bin/regex_test），在 build() 内真实编译并执行。
# 单一自定义 make 框架，注册单位可解析（GNUmakefile TARGET 行）→ auto。

package: sljit/0.0-git20260924.b706c11
homepage: "https://github.com/zherczeg/sljit"

upstream_check_command: "make -j1 CC=<Conan compiler>"
upstream_test_in_build: true
upstream_test_command: "make -j1 CC=<Conan compiler> && ./bin/sljit_test && ./bin/regex_test"

# ── 上游是否存在测试 ────────────────────────────────────────────────
upstream_tests_exist: true
upstream_test_framework: "make (custom GNUmakefile TARGET)"

# ── 分母（与官方一致）───────────────────────────────────────────────
# 口径：auto —— GNUmakefile 首部 `TARGET = $(BINDIR)/sljit_test
# $(BINDIR)/regex_test` 注册 2 个测试二进制（b706c11, 2026-09-24）。
# sljit_test 内部另有 138 个 LIR 子用例（test_src/sljitTest.c 尾部
# `# define TEST_COUNT 138`，成功时打印 `SLJIT tests: all tests PASSED`
# 且返回 0），regex_test 内部为 regex 用例表（成功时打印
# `REGEX tests: all tests PASSED`）；内层计数不作为 ctest/autotools
# 注册口径，官方注册单位即 2 个二进制。
upstream_test_total: 2
upstream_test_count_method: auto

upstream_test_audit: >
  audited zherczeg/sljit @ b706c11ca471c3da773ee595164acb6efd2c5574
  (2026-09-24, tarball sha256
  fe9e38173aaab65e509babf96ef9b904cde75b6ae628018690f4c89e312920a5):
  GNUmakefile defines TARGET = $(BINDIR)/sljit_test $(BINDIR)/regex_test;
  test_src/sljitMain.c drives sljit_test() (138 internal cases, TEST_COUNT
  138, prints `SLJIT tests: all tests PASSED` and returns
  TEST_COUNT-successful_tests); regex_src/regexMain.c drives run_tests()
  over the regex case table (prints `REGEX tests: all tests PASSED`).
  The `make -j1` run and both binaries are executed inside conanfile.py
  build() with per-binary log + exit-code verdict.

# 上游实际运行的测试程序
upstream_tests:
  - file: test_src/sljitMain.c
    source: sljit-b706c11/test_src/sljitMain.c
    description: "LIR JIT 主测试二进制：138 个内部用例（算术/分支/浮点/SIMD/序列化），成功打印 SLJIT tests: all tests PASSED"
    command: "./bin/sljit_test"
  - file: regex_src/regexMain.c
    source: sljit-b706c11/regex_src/regexMain.c
    description: "正则 JIT 测试二进制：regex 用例表 + DFA 溢出回归，成功打印 REGEX tests: all tests PASSED"
    command: "./bin/regex_test"

# test_package 中自带的测试 (消费者视角验证；同一 conan create 内执行)
# 实测结果待真机预检回填（首轮仅完成工作树）。
test_package_tests:
  - file: test_sljit.c
    description: "JIT 消费者：运行时编译三参数整数加法并执行 5 项断言（15/0/-6/600/-25）"
    command: "./test_sljit"
    result: "待真机预检回填（设计 5 项断言，末尾打印 ok 行）"

# 测试断言总数（test_package 自带消费者测试）
# test_sljit.c: 5 项 JIT 代码生成并执行断言
assertion_count: 5

test_counting:
  upstream_independent_total: 2
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 1
harmony_specific_test_count: 0
