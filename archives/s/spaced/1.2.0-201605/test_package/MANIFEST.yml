# test_package/MANIFEST.yml
# Upstream test declaration file (spaced 1.2.0-201605)
# CI script (build_and_test.sh L0e) requires this file to exist.

package: spaced/1.2.0-201605
homepage: "http://spaced.gobics.de/"

# What upstream offers as the canonical test entry point.
# The 1.2.0-201605 release has none at all - see the inventory below.
upstream_check_command: ""

# Nothing is wired into build(), because upstream has no tests to wire.
upstream_test_in_build: false
upstream_test_command: ""

# ---------------------------------------------------------------------------
# Upstream test inventory (R51), taken from the release archive
# spaced_1.2.0-201605+dfsg.orig.tar.xz
# (sha256 c539e92072b3ca2c79f3841616525ff75366fe1a84b7ff12209b25e788e9979d).
# The archive holds nine files:
#
#   COPYING  Makefile  README
#   src/patternset.cpp  src/patternset.h
#   src/sort.h  src/spaced.cc  src/variance.cpp  src/variance.h
#
# 1. `make check` -> the Makefile's entire target set is `all` (100 bytes, one
#    recipe, `g++ -O3 -fopenmp -std=c++11 src/spaced.cc src/variance.cpp
#    src/patternset.cpp -o spaced`). There is no check/test/install/clean
#    target, so `make check` stops with "No rule to make target 'check'".
# 2. `find . -iname '*test*' -o -iname '*spec*' -o -iname '*example*'` over the
#    archive returns nothing - there is no test directory, no test data and no
#    example input.
# 3. No test framework of any kind is referenced: the only non-standard include
#    in the tree is <omp.h>, and there is no assert()/EXPECT_/TEST( macro
#    anywhere (`grep -rn 'assert(\|EXPECT_\|TEST(' src/` is empty).
# 4. The README documents the command line and nothing else - "to compile type:
#    make / run with: ./spaced [options] <sequence file>".
#
# Counted upstream test programs: 0.  Counted runnable upstream test programs on
# HarmonyOS: 0.  Nothing was skipped for lack of environment: the two checks
# that do exist (make check has no target; no test files exist) were both
# executed and both are reported above.  Therefore there is no upstream test
# executable to call from conanfile.py build(); writing `make check` there would
# only produce a red build (same conclusion and same evidence shape as
# archives/s/sarg/2.4.0/test_package/MANIFEST.yml).
# ---------------------------------------------------------------------------
upstream_tests: []

# Consumer-side substitute for the missing upstream suite (R34: the test has to
# actually drive the packaged binary, and it does - spaced is executed on real
# FASTA input with a real spaced-seed pattern file and the distance matrix it
# writes is asserted on).
test_package_tests:
  - file: test_spaced.sh
    description: >-
      Runs the packaged bin/spaced five times: `-h`, `--version`, a DNA FASTA
      (3 sequences) run, a protein FASTA (3 sequences) run, and the DNA run
      repeated with -t 1 and -t 4. Asserts: the binary is executable; `-h`
      exits 0 and prints the usage block; the help text advertises `-f <file>`;
      `--version` exits 0; all four data runs exit 0; stderr carries no
      "FORMAT-ERROR"/"is an empty file", i.e. the -f pattern file was really
      consumed (this is the aarch64 plain-char-unsigned regression guard); the
      FASTA parser counted "3 DNA sequences read" and "3 protein sequences
      read", so both the DNA and the protein code path were taken; both matrix
      files exist and are non-empty; the matrix header is 3; each matrix has
      exactly one row per sequence; rows carry the FASTA record labels in input
      order; both matrices have an all-zero diagonal; the DNA matrix is
      symmetric; off-diagonal distances are present and non-zero in both the DNA
      and the protein matrix; and the -t 1 / -t 2 / -t 4 matrices are
      byte-identical, which also pins the OpenMP reduction as deterministic.
    command: "sh test_spaced.sh <package>/bin/spaced <workdir (temp dir, outside the archive)>"

assertion_count: 18
