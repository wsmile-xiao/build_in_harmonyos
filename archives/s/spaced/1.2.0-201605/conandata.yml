# conandata.yml - spaced 1.2.0-201605
#
# R39 (source provenance): the declared upstream URL is the project's own site,
# http://spaced.gobics.de/content/spaced.tar.gz, and that URL no longer resolves
# (the Goettingen group retired the page, and the tarball it served was a
# prebuilt x86 binary plus sources rather than a clean release archive).  The
# archive below is the pristine upstream 1.2.0-201605 source repacked by Debian
# as `+dfsg`: debian/get-orig-source only renames the tarball directory and
# drops the prebuilt `spaced` binary (Files-Excluded in debian/copyright), so
# every source file is byte-identical to what upstream shipped.  The Debian
# pool is the authoritative distribution mirror for this package (it carries
# the full 1.0.2 -> 1.2.0-201605 source history), and the exact same
# `+dfsg.orig.tar.xz` is what Ubuntu carries, so the bytes are cross-verified
# against a second distribution.
#
# Version string provenance: the "+dfsg" tarball's directory name is
# `spaced-1.2.0-201605+dfsg`, derived by Debian's get-orig-source from
# `@version: 1.2.0 05/2016` in src/variance.h.  That is the same 1.2.0-201605
# version the platform task and the Debian source package name use.
sources:
  url: "https://deb.debian.org/debian/pool/main/s/spaced/spaced_1.2.0-201605+dfsg.orig.tar.xz"
  sha256: "c539e92072b3ca2c79f3841616525ff75366fe1a84b7ff12209b25e788e9979d"

patches:
  - patch_file: "patches/0001-libcxx-portability.patch"
    patch_description: "Portability: drop the unused libstdc++-only <tr1/unordered_map> include (libc++ specific), include <random> explicitly for std::default_random_engine (neither libc++ nor libstdc++ 11 includes it transitively), and remove the three unreachable `if (x < 0)` blocks whose std::abs() on uint32_t members is ambiguous (C's int abs(int) and the C++ long/long long/float/double overloads are all plain conversions from unsigned int, and the signed-representability tiebreaker does not apply to an unsigned argument - reproduced identically with g++ 11.4 + glibc, so this part is toolchain-independent). All three branches are unreachable because the members are uint32_t."
    patch_type: "portability"
  - patch_file: "patches/0002-aarch64-char-signedness-eof.patch"
    patch_description: "patternset::ReadPattern keeps ifstream::get()'s int_type instead of narrowing it to plain char: AAPCS64 makes plain char unsigned, so the EOF (-1) sentinel becomes 0xff, `-1 == (int)c` stops matching and every `spaced -f <pattern>` file is rejected with 'Pattern containes illegal characters!' before a random seed set is silently substituted. Must be applied after 0001 (the series is applied in conandata order, which is also how Debian's quilt series behaves)."
    patch_type: "portability"
