# 版本级 manifest
# 文件位置: archives/s/siscone/3.0.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.5"

# 软件名
software: "siscone"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://siscone.hepforge.org/downloads/siscone-3.0.5.tar.gz"

  # 源码校验和
  sha256: "08c63ad96516970c0ef5c030de2e626d6760efda8ece20dee410a515b7acf1e8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-static (shared=True) / --enable-static --disable-shared (shared=False, default)"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "siscone 3.0.5 上游唯一测试为 examples/test.cpp（构建产物 examples/test，rule4 实测 N=1）；顶层无 TESTS 注册，make check 为 no-op，必须显式运行该二进制并由 test_package 重编译执行输出 discovered=1 标记"
  - "2012 年 config.guess/config.sub 不识别 HarmonyOS，需内联 ohos triplet 映射（config.guess HarmonyOS 分支 + config.sub ohos-linux 分支）"
  - "config.status 临时目录在 HMDFS 上需 umask 000（沿用 scamp 经验），configure 文件内 umask 077 需替换"
