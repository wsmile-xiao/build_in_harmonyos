# test_package/MANIFEST.yml — siscone/3.0.5 上游测试声明
#
# 上游测试：单个上游测试程序 examples/test.cpp（随 tarball 发布，
# 经 autotools 构建为 examples/test；`make check` 本身无 TESTS 注册
# 为 no-op，因此配方 build() 在 make 之后显式运行该二进制，
# test_package 将其源码（由主包 share/siscone_upstream_test/test.cpp
# 提供）重新编译链接已安装的 libsiscone + libsiscone_spherical 并
# 真实执行，HMBS_UPSTREAM_TEST_RESULT 由该次真实运行产生
#（discovered=1，executed/passed/failed 来自退出码与输出）。
# 精确通过情况以真机预检日志标记为准，此处不预填猜测数字。

package: siscone/3.0.5
homepage: "https://siscone.hepforge.org/"

# 上游测试套件存在性（经审计存在 1 个上游测试程序）
upstream_tests_exist: true
upstream_test_audit:
  - source: "siscone-3.0.5 upstream tarball: examples/test.cpp + examples/Makefile build"
    reason: "tarball 内 examples/ 目录含 test.cpp（随包发布的唯一测试程序，构建产物为 examples/test）；顶层无 TESTS/check_PROGRAMS 注册，故 make check 为 no-op，但该程序即审查实测 N=1 所指对象。"
  - source: "Debian siscone 3.0.5-3 packaging (siscone-examples file list)"
    reason: "siscone-examples 包文件清单含 examples/test.cpp、area.cpp、sample.cpp、spherical.cpp、times.cpp 等，其中 test.cpp 为测试程序，其余为示例；无独立 tests/ 目录与 ctest/gtest 入口。"
  - source: "Gentoo sci-physics/siscone ebuild (3.0.5 era)"
    reason: "ebuild 仅执行 econf/make/make install，examples 仅作为 doc 安装；测试即 examples/test 程序本身，不在 check 阶段单独注册。"
  - conclusion: "上游 3.0.5 提供 1 个上游测试（examples/test.cpp）；配方 build() 显式运行构建产物，test_package 重新编译执行并输出 discovered=1 的真实标记，不再使用 no_tests。"

# 分母（与审方口径一致）：上游注册测试总数 = 1（单个测试程序）
upstream_test_total: 1
upstream_test_count_method: auto

upstream_check_command: "make check + ./examples/test (build() 内显式运行构建产物）"
upstream_test_in_build: true
upstream_test_command: "compile share/siscone_upstream_test/test.cpp against installed libs and run ./upstream_test"

upstream_tests:
  - suite: upstream example test
    cases: 1
    delivered_config: compiled
    source: "examples/test.cpp (built as examples/test)"
    command: "./upstream_test (test_package recompiled from share/siscone_upstream_test/test.cpp)"

test_package_tests:
  - file: test_package/test_siscone.cpp
    description: "消费者测试：调用 siscone::siscone_version/package_name，柱坐标 Csiscone::compute_jets 与球坐标 CSphsiscone::compute_jets 双路径，共 4 条 CHECK-OK 断言"
    command: "./test_siscone"

assertion_count: 4
