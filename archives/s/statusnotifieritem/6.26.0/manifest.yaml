knowledge_gained:
  - "statusnotifieritem (KDE tarball name kstatusnotifieritem) 6.26.0 declares KF_DEP_VERSION=6.26.0 and requires find_package(KF6WindowSystem 6.26.0); ohpcd publishes kwindowsystem up to 6.18.0. Patch 0001 lowers KF_DEP_VERSION 6.26.0->6.18.0 (ECM 6.26.0 is the exact upstream requirement and already published, no lowering needed)."
  - "Upstream tarball name is kstatusnotifieritem-6.26.0.tar.xz (download.kde.org/stable/frameworks/6.26/) even though the invent.kde.org repo is statusnotifieritem; conan package name kstatusnotifieritem matches upstream project/library name."
  - "Upstream tests/ ships a single manual QApplication demo (kstatusnotifieritemtest) with no add_test registration on any platform; ctest reports 0 tests upstream. The recipe executes the demo headless with a 25s timeout from the tests/ cwd: reaching the Qt event loop proves the library loads and links on the OHOS runtime."
  - "The demo binary links the build-tree library by the relative DT_NEEDED ../bin/libKF6StatusNotifierItem.so (build-tree libraries carry no SONAME); the musl loader does not resolve relative NEEDED paths via LD_LIBRARY_PATH, so the demo must run with cwd=build/tests for the relative path to resolve."
  - "CRITICAL recipe pitfall: iterating over self.dependencies.values() when writing conan_cmakedeps_paths.cmake also prepends build-context packages to CMAKE_PREFIX_PATH - the transitive qtbase/6.11.1 (via qttools, tool_requires of qt6linguisttools) then lands ahead of the host qtbase/6.11.1.1 in the search path, find_package(Qt6) resolves against the FEATURE_dbus=OFF package and Qt6DBus is not found. Fix: append only explicitly chosen host dependencies (kdbusaddons 6.29.0 recipe structure)."
  - "USE_DBUS must be set ON explicitly in cross builds: the upstream default is ON only for UNIX AND NOT APPLE AND NOT ANDROID AND NOT HAIKU; leaving the option at its cross-build default builds the library silently without the DBus adaptors (its core value)."
  - "BUILD_PYTHON_BINDINGS=OFF is mandatory: the option defaults ON and find_package(Shiboken6 REQUIRED) fails hard when Shiboken6/PySide6 are not on the prefix path (not published on ohpcd)."
