# test_package/MANIFEST.yml - shush 1.2.3
package: shush/1.2.3
homepage: "https://web.taranis.org/shush/"

# R51 upstream test inventory: the release ships no test suite.
#   - no tests/ directory; Makefile.in and src/Makefile.in define no
#     check/test target (targets: shush, pure, ifparser_test, depend, clean,
#     distclean, install), no ctest/pytest registration;
#   - src/ifparser_test.c is a developer stub: empty tests[] array, one
#     hard-coded expression, prints "= <result> (<rc>)" with no assertion,
#     and its `make ifparser_test` rule does not even link (undefined
#     error/myassert/variable_get).  Not counted as a test.
upstream_check_command: "none (no check/test target; src/ifparser_test.c is an assertion-free stub whose make rule does not link)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# One consumer program, test_shush.c, built with the OHOS toolchain by this
# test_package and run by test() as:
#   test_shush run <pkg>/bin/shush <test_shush> <workdir>
# It writes shush configurations, lets the packaged shush supervise its own
# "job" role and deliver reports to its "sendmail -t -i" role, then checks
# exit status, delivered messages, kept logs and diagnostics.
test_package_tests:
  - file: test_shush.c
    case: C1
    description: >-
      `shush -V` exits 0 and reports "(PCRE version 10.x ...)": the PCRE2
      port (patches 0004/0006/0009/0011) is compiled in and links the
      static libpcre2-8 of pcre2/10.45.
    command: "test_shush run <pkg>/bin/shush <test_shush> <workdir>"
    assertion_count: 1
  - file: test_shush.c
    case: C2
    description: >-
      Main report flow with the default syslog facility: job exits 3; the
      "#pcre" stdout rules use PCRE2-only syntax ((?i), \s, \d) and the
      stderr rule is POSIX ERE (libc regcomp); the counters drive
      `if=$exit == 3 && E == 1 && I == 1 && W == 1 && $outlines == 3`;
      exactly one report is delivered through "sendmail -t -i" with the
      expected To/Subject (%n)/X-Shush-Report-Name/X-Shush-Exit-Status/
      Content-Type headers and both capture groups rendered in <b></b>;
      the `if=$exit == 0` report is not sent.
    command: "test_shush run <pkg>/bin/shush <test_shush> <workdir>"
    assertion_count: 1

# HarmonyOS PC specific consumer cases (rule12: N = 6).  Same program and
# command as above; each case targets an adaptation point or a HarmonyOS
# platform difference.
harmonyos_specific_tests:
  - file: test_shush.c
    case: C3
    description: >-
      /tmp is read-only on HarmonyOS: with -k the command's output logs are
      created and kept in $TMPDIR (shush-report.stdout.* / .stderr.*) and
      hold the job's exact stdout/stderr lines.
    command: "test_shush run <pkg>/bin/shush <test_shush> <workdir>"
    assertion_count: 1
  - file: test_shush.c
    case: C4
    description: >-
      HarmonyOS PC ships no MTA: a configuration without a "sendmail"
      parameter delivers through the program named by SHUSH_SENDMAIL
      (To/X-Shush-Exit-Status/body checked).
    command: "test_shush run <pkg>/bin/shush <test_shush> <workdir>"
    assertion_count: 1
  - file: test_shush.c
    case: C5
    description: >-
      Without any transport shush falls back to the compiled-in default the
      recipe pins (ac_cv_path_SENDMAIL=NOSENDMAIL): no report is delivered
      and stderr reports execv(NOSENDMAIL); an unpinned cross build bakes
      the build machine's sendmail path instead (/usr/lib/sendmail on the
      x86_64 runner, reverse-checked).
    command: "test_shush run <pkg>/bin/shush <test_shush> <workdir>"
    assertion_count: 1
  - file: test_shush.c
    case: C6
    description: >-
      timeout=2s,SIGTERM: the signal name is resolved from the table that
      patch 0005 generates from the target <signal.h>; the job is stopped
      after about 2 s and the `if=$exit == -15` report is delivered.  With
      the upstream build-host table (empty) the name is rejected and the
      job runs its full 60 s (reverse-checked).
    command: "test_shush run <pkg>/bin/shush <test_shush> <workdir>"
    assertion_count: 1
  - file: test_shush.c
    case: C7
    description: >-
      HMDFS projects file ownership and forces group write: (a) a group
      writable configuration is accepted and runs; (b) a world writable
      one is still refused with "must not be world writable" (patches
      0007/0010, --enable-relaxed-ownership).  Each half first stat()s the
      file; if the file system does not keep the requested bits the half
      is reported NOT RUN, never PASS.
    command: "test_shush run <pkg>/bin/shush <test_shush> <workdir>"
    assertion_count: 2
  - file: test_shush.c
    case: C8
    description: >-
      Scheduling is unavailable on HarmonyOS PC (no crontab/crond; CRONTAB
      pinned to NOCRONTAB; OHOS musl tmpfile() uses /data/local/tmp):
      `shush -u` exits 1 within 30 s with a diagnostic naming NOCRONTAB or
      the temporary file, instead of hanging or reporting success.
    command: "test_shush run <pkg>/bin/shush <test_shush> <workdir>"
    assertion_count: 1

# Execution: the delivered binaries are dynamically linked against
# /lib/ld-musl-aarch64.so.1 and run on the aarch64 CI worker.  On the x86_64
# runner test() only checks the artifacts and reports the runtime cases as
# SKIP; the same test_shush.c was run there under qemu-aarch64 against
# static relinks of the same objects (9/9 checks, notes.md).
test_package_test_count: 2
harmonyos_specific_test_count: 6
assertion_count: 9
count_method: "consumer cases C1-C8; C7 counts two independent checks"
