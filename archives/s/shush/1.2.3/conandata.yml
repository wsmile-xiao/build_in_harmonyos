sources:
  "1.2.3":
    url: "https://web.taranis.org/shush/dist/shush-1.2.3.tgz"
    sha256: "44ff5d74f38772bdd51ce5b9f2f75b260f030d54fd0358e95f35b94c0bc78972"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Teach the 2004 config.guess to report aarch64 Linux and HarmonyOS (uname -s = HarmonyOS) build machines"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Teach the 2004 config.sub to accept the aarch64 CPU and the linux-ohos kernel-os pair"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure regenerated with the original Autoconf 2.59 from patches 0004 (PCRE2 probe, --enable-relaxed-ownership); config.status scratch dir created with mkdir under umask 000 so it stays writable under HMDFS UID projection"
    patch_type: "portability"
  - patch_file: "patches/0004-configure.ac.patch"
    patch_description: "Probe PCRE2 (pcre2_compile_8 in -lpcre2-8, <pcre2.h> with PCRE2_CODE_UNIT_WIDTH=8) instead of the end-of-life PCRE library; add --enable-relaxed-ownership"
    patch_type: "portability"
  - patch_file: "patches/0005-src-Makefile.in.patch"
    patch_description: "Generate signals.h from the target compiler's <signal.h> (cc -E -dM) instead of the build host's /usr/include, and fail on an empty table"
    patch_type: "portability"
  - patch_file: "patches/0006-src-analyzer.c.patch"
    patch_description: "Port output analysis to the PCRE2 API (Debian 03_port_to_pcre2.diff) plus fixes: free match data on the match path and skip unset capture groups instead of looping forever"
    patch_type: "portability"
  - patch_file: "patches/0007-src-cf.c.patch"
    patch_description: "With RELAXED_OWNERSHIP only reject world writable configuration files (HMDFS projects ownership and forces the group write bit)"
    patch_type: "portability"
  - patch_file: "patches/0008-src-check.c.patch"
    patch_description: "Include <time.h> for localtime()/strftime() (clang 15 rejects implicit declarations; Debian 02_fix_implicit_declaration_strftime.diff)"
    patch_type: "portability"
  - patch_file: "patches/0009-src-config.h.in.patch"
    patch_description: "config.h.in templates for HAVE_PCRE2_H/HAVE_PCRE_H and RELAXED_OWNERSHIP (autoheader 2.59 output of patch 0004)"
    patch_type: "portability"
  - patch_file: "patches/0010-src-crontab.c.patch"
    patch_description: "With RELAXED_OWNERSHIP only reject a world writable configuration directory when managing crontab entries"
    patch_type: "portability"
  - patch_file: "patches/0011-src-shush.c.patch"
    patch_description: "Report the PCRE2 version via pcre2_config(PCRE2_CONFIG_VERSION) in -V (Debian 03_port_to_pcre2.diff, declaration moved into a block)"
    patch_type: "portability"
  - patch_file: "patches/0012-src-units.h.patch"
    patch_description: "Include <sys/types.h> for u_int, which musl only declares through it"
    patch_type: "portability"
