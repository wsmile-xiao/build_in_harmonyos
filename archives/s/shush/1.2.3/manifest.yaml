version: "1.2.3"
software: "shush"
status: published
build_date: "2026-09-29"
build_system: "autotools"

source:
  url: "https://web.taranis.org/shush/dist/shush-1.2.3.tgz"
  sha256: "44ff5d74f38772bdd51ce5b9f2f75b260f030d54fd0358e95f35b94c0bc78972"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-pcre=<pcre2 package folder>"
    - "ac_cv_path_SENDMAIL=NOSENDMAIL"
    - "ac_cv_path_CRONTAB=NOCRONTAB"
    - "--host=aarch64-linux-ohos  # OHOS only"
    - "--enable-relaxed-ownership  # OHOS only"
  dependencies:
    - pcre2/10.45
  make_flags: "-j1  # no GNU make jobserver FIFO on HMDFS (E074)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-configure.ac.patch"
  - "0005-src-Makefile.in.patch"
  - "0006-src-analyzer.c.patch"
  - "0007-src-cf.c.patch"
  - "0008-src-check.c.patch"
  - "0009-src-config.h.in.patch"
  - "0010-src-crontab.c.patch"
  - "0011-src-shush.c.patch"
  - "0012-src-units.h.patch"

knowledge_gained:
  - "src/Makefile.in 生成 signals.h 时 cat 的是构建机 /usr/include/{signal.h,bits/signum.h}：交叉编译或 multiarch glibc（bits/signum.h 不在 /usr/include/bits）下得到空表且不报错，timeout=...,SIGTERM 被判非法、作业跑满全程；改为目标编译器 cc -E -dM <signal.h> 生成并对空表报错。 ref: knowledge/drafts/E544-draft-31E6（本 PR 新增草稿）"
  - "AC_PATH_PROG(SENDMAIL/CRONTAB) 在交叉构建时探测的是构建机：x86_64 runner 上烙进 /usr/lib/sendmail，鸿蒙真机上则是 NOSENDMAIL/NOCRONTAB；用 ac_cv_path_* 缓存变量钉死为目标机结果，传输程序运行期由 sendmail 参数或 SHUSH_SENDMAIL 指定。 ref: knowledge/drafts/E544-draft-31E6「同包的同族现象」节"
  - "shush 拒绝属主≠euid 或组可写的配置文件；HMDFS 把属主投影为共享身份并强制组写位，默认构建在鸿蒙 PC 上无法运行任何作业；新增 --enable-relaxed-ownership（仅拒绝全局可写）。 ref: E011, E453, knowledge/drafts/e665-hmdfs-maildir-portability（第 3 条 owner-only 检查）"
  - "config.guess/config.sub(2004) 不认 aarch64 与 HarmonyOS，conan OHOS profile 两侧同构不注入三元组；补两份辅助脚本并仅传 --host。 ref: E007, knowledge/drafts/E543-draft-419E"
  - "OHOS musl 的 tmpfile() 固定使用 /data/local/tmp/tmpfile_XXXXXX，不看 TMPDIR；shush -i/-u/-r 在鸿蒙 PC 上本就不可用（无 crontab/crond）。 ref: E272（tmpfile 忽略 TMPDIR）"

homepage: "https://web.taranis.org/shush/"
license: "BSD-4-Clause"

tests:
