    command: "none"
    cases: 0
    note: "无 tests/ 目录、无 check/test 目标、无 ctest/pytest 注册；src/ifparser_test.c 为无断言开发桩且 make 规则链接不全，不计入。"
  adapted:
    command: "test_package: test_shush run <pkg>/bin/shush <test_shush> <workdir>"
    cases: 8
    checks: 9
    harmonyos_specific_cases: 6
    local: "x86_64 runner: 交付动态产物无法执行，test_package 运行期用例 SKIP；同源 .o 静态重链副本 + 静态 test_shush 在 qemu-aarch64 下 9/9 通过"
    ci: "aarch64 CI worker 上执行交付产物（本地未实跑交付产物，由 CI 执行）"

