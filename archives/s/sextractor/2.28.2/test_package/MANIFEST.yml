package: sextractor/2.28.2
homepage: "https://www.astromatic.net/software/sextractor"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - name: tests/（modelfit.test——make check 自动化测试：galaxies.fits 源提取）
    count: 1
    description: "上游有 make check 自动化测试（tests/Makefile.am TESTS=modelfit.test——用 galaxies.fits + galaxies.weight.fits 跑 sex 源提取）——**实测**：R34 用上游 galaxies.fits 真实源提取（同 modelfit.test 流程）验证通过（catalog 生成非空）——1/1 实测（R34 真实 CLI，非 N/A、非跳过）"

test_package_tests:
  - file: test_sextractor.py
    description: "R34 真实 CLI：sex 处理上游 galaxies.fits 源提取（同 make check modelfit.test 流程）"
    command: "python3 test_sextractor.py <bindir>"
  - file: test_sextractor.py 内联下载
    description: "上游测试数据（galaxies.fits/galaxies.weight.fits/default.psf 二进制不放包——运行时从 GitHub raw URL 下载；CI checkout-pr 的 git apply 无法应用二进制 diff——missing binary patch data 实测，同 swarp）"

assertion_count: 2
