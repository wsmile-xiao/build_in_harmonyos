software: sdl_ttf
display: "SDL_ttf"
description: "TrueType font rendering library for SDL 1.2"
category: multimedia
homepage: "https://www.libsdl.org/projects/SDL_ttf/"
license: Zlib
build_system: autotools
status: built

ohos_adaptation:
  key_points:
    - "Uses published sdl12-compat/1.2.68 through a build-folder sdl-config wrapper for legacy AM_PATH_SDL."
    - "Uses a matching freetype-config wrapper for the published freetype/2.14.3 dependency."
    - "Uses an HMDFS umask 022 configure patch and GNU build/host tuples accepted by the legacy config.sub."
  common_dependencies:
    - sdl12-compat/1.2.68
    - freetype/2.14.3

versions:
  "2.0.11":
    status: built
    build_date: "2026-09-15"
