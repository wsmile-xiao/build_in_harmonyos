# test_ohos/MANIFEST.yml — HarmonyOS PC 专项验证
package: sili/0.3.0
homepage: https://github.com/EimaMei/sili

# OpenHarmony PC 平台专项测试（独立于 test_package 的库 API 验证）
# 运行: conan test archives/s/sili/0.3.0/test_ohos sili/0.3.0 \
#       -pr:h ci/conan/profiles/ohos-aarch64 -pr:b ci/conan/profiles/ohos-aarch64
test_ohos_tests:
  - file: ohos_test.c
    description: |
      鸿蒙专项验证（CMakeDeps 消费者构建 test_ohos_sili 链接 sili::sili，目标机运行）:
      H1 线程创建/运行/join（si_threadMake/Run/Join，线程内验证字符串相等）;
      H2 时间 API（si_timeNowUTC/Local 非零、si_sleep 5ms）;
      H3 环境变量读写回环（si_envVarSet/GetLength/GetData/Unset）;
      H4 系统信息（si_cpuProcessorCount > 0）;
      H5 字符串 API（si_stringFromCStr/si_stringTrim 转换与裁剪断言）
    command: "conan test archives/s/sili/0.3.0/test_ohos sili/0.3.0 -pr:h ci/conan/profiles/ohos-aarch64 -pr:b ci/conan/profiles/ohos-aarch64"
    count: 5

assertion_count: 5
