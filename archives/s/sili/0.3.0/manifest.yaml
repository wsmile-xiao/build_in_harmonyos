# 版本级 manifest — sili 0.3.0
# 文件位置: archives/s/sili/0.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.0"

# 软件名
software: "sili"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 codeload tag tarball，与 conandata.yml 一致）
  url: "https://codeload.github.com/EimaMei/sili/tar.gz/refs/tags/v0.3.0"

  # 源码校验和（官方归档实测）
  sha256: "3c50399542e19e0bf2eb1788542277d63978da9e71466a83b512360c938b10dc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（本轮候选全部 exact_duplicate，无新增草稿）
knowledge_gained:
  - "codeload tar.gz URL basename 无扩展名，get() 需显式 filename= 防 BadZipFile（E276）"
  - "GitHub 直连超时用 ghfast 镜像，conandata 保留官方 URL（E017）"
  - "零提交新库分支 W3 用 JUNK_PR_DIFF 走 prdiff 模式避免 full 模式误伤其他库基线文件（既有草稿覆盖）"
