# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sili/0.3.0
homepage: "https://github.com/EimaMei/sili"

# 上游测试命令 (Makefile compile_tests: for f in tests/*.c; make SRC=$f)
upstream_check_command: "make compile_tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（OHOS 交叉编译后逐个运行，全部 exit 0）
upstream_tests:
  - file: tests/bit.c
    source: sili-0.3.0/tests/bit.c
    description: "bit operations (test_bit, test_overflow)"
    command: "./bit"
  - file: tests/char.c
    source: sili-0.3.0/tests/char.c
    description: "character classification/case functions"
    command: "./char"
  - file: tests/general.c
    source: sili-0.3.0/tests/general.c
    description: "general library checks (7 numbered blocks)"
    command: "./general"
  - file: tests/print.c
    source: sili-0.3.0/tests/print.c
    description: "print/format API checks"
    command: "./print"
  - file: tests/str.c
    source: sili-0.3.0/tests/str.c
    description: "string/builder/conv (test_string, test_builder, test_conv)"
    command: "./str"
  - file: tests/system.c
    source: sili-0.3.0/tests/system.c
    description: "environment vars, DE detection, CPU count"
    command: "./system"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libsili.a 并调用公开 API（si_stringEqual / si_stringFromCStr / si_stringTrim / si_stringUpper / si_stringLower / si_printfLn）"
    command: "./test_sili"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 56
