# 版本级 manifest — sexpect 2.4.0（ARCHIVE-SPEC v3.0）

version: "2.4.0"
software: "sexpect"
status: built
conan_ref: "sexpect/2.4.0"
build_date: "2026-09-26"
build_system: "cmake"

source:
  url: "https://codeload.github.com/clarkwang/sexpect/tar.gz/refs/tags/v2.4.0"
  sha256: "8f7a989ecf67f4ff6eb167d29a8e2e54db85143ebf3e8f904ea16ee5576a4b0d"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_BUILD_TYPE=Release (Conan 默认，cmake_layout)"
    - "CMake >= 3.17（上游要求）"
  dependencies: []
  cc: clang
  cxx: ""

patches_applied:
  - "0001-common.c.patch"
  - "0002-common.h.patch"
  - "0003-server.c.patch"
  - "0004-tests-chdir-after-logfile.sh.patch"
  - "0005-tests-send-128k.sh.patch"
  - "0006-tests-send-null.sh.patch"

knowledge_gained:
  - "HarmonyOS 对普通用户态进程拒绝在任何可写文件系统创建 AF_UNIX 路径名 socket（bind(2)=EPERM；/tmp 只读、/dev/shm EACCES），仅抽象命名空间可用；sexpect 的 sockfile 会合点因此改为「路径 bind 失败 → 按路径 FNV-1a 哈希派生抽象名」的可移植回退（server/client 同源推导，无平台宏）"
  - "`sexpect wait` 的退出码 = 被 spawn 子进程的退出码：上游测试用 `ls -l /` 产生输出，而 OHOS 沙箱拒绝列目录（EACCES），子进程非零退出把平台差异伪装成 sexpect 功能失败——适配需区分「被测行为失败」与「测试夹具依赖的平台能力缺失」"
  - "上游测试对 /tmp 的两处硬编码（send-null/send-128k）在只读 /tmp 平台全部失败；${TMPDIR:-/tmp} + 配方 build() 内导出 TMPDIR 是可移植修法（E002/E052 家族变更体）"
  - "OHOS sysroot（musl）自带 posix_openpt/grantpt/unlockpt/ptsname 与 TIOCSCTTY，sexpect 的 PTY 层源码零修改即编译运行，25 个上游用例（含 pts EIO/僵尸回收/TTL）在设备内核 1.12 全部通过"

# 补丁分类（AI 填写；guard 为 none = 不含平台宏，POSIX 兼容回退）
patch_classification:
  - file: 0001-common.c.patch
    type: portability
    platform_only: false
    guard: 'none'
  - file: 0002-common.h.patch
    type: portability
    platform_only: false
