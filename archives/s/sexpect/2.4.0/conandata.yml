# conandata.yml — sexpect 2.4.0
#
# 官方源码：clarkwang/sexpect tag v2.4.0。源码 URL 取 GitHub 官方 tar 入口
# codeload.github.com（github.com/.../archive/... 的官方 302 目标，字节一致；
# 仓库内多个既有配方同源，jattach 2.2 先例）。
# 设备实测下载并核对 sha256：8f7a989ecf67f4ff6eb167d29a8e2e54db85143ebf3e8f904ea16ee5576a4b0d

sources:
  url: "https://codeload.github.com/clarkwang/sexpect/tar.gz/refs/tags/v2.4.0"
  # codeload URL 末段是 tag 名（无扩展名），get() 会误判为 zip（BadZipFile）；
  # 显式 filename 让解压器按 tar.gz 选择（abbtr/accel-config 同款先例）
  filename: "sexpect-2.4.0.tar.gz"
  sha256: "8f7a989ecf67f4ff6eb167d29a8e2e54db85143ebf3e8f904ea16ee5576a4b0d"

patches:
  - patch_file: "patches/0001-common.c.patch"
    patch_description: "sock_connect()/sock_bind(): fall back to the AF_UNIX abstract namespace when pathname sockets cannot be created (HarmonyOS denies bind(2) with EPERM); abstract name is a deterministic FNV-1a hash of the sockfile path so server and clients agree"
    patch_type: "portability"
    patch_source: "本地移植（POSIX 兼容回退：路径 socket 可用的平台行为不变）"
  - patch_file: "patches/0002-common.h.patch"
    patch_description: "declare the new sock_bind() helper"
    patch_type: "portability"
    patch_source: "本地移植（与 0001 配套）"
  - patch_file: "patches/0003-server.c.patch"
    patch_description: "server: use sock_bind() for pathname/abstract binding; skip realpath() when the abstract namespace is used (no filesystem node exists to canonicalize)"
    patch_type: "portability"
    patch_source: "本地移植（与 0001 配套）"
  - patch_file: "patches/0004-tests-chdir-after-logfile.sh.patch"
    patch_description: "test: spawn `ls -l $tmpfile` instead of `ls -l /` — the OHOS sandbox denies listing / (EACCES), the child exits non-zero and `sexpect wait` propagates that status, failing the test although the behaviour under test (logfile cwd order) is correct; assertion logic unchanged"
    patch_type: "test-adaptation"
    patch_source: "本地适配（设备实测：ls: /: Permission denied 使 wait 返回非零）"
  - patch_file: "patches/0005-tests-send-128k.sh.patch"
    patch_description: "test: temp file /tmp/data -> ${TMPDIR:-/tmp}/data (OHOS /tmp is read-only; default /tmp behaviour preserved elsewhere); no assertion change"
    patch_type: "test-adaptation"
    patch_source: "本地适配（设备实测：touch /tmp/... -> Read-only file system）"
  - patch_file: "patches/0006-tests-send-null.sh.patch"
    patch_description: "test: temp file /tmp/file-with-nulls -> ${TMPDIR:-/tmp}/file-with-nulls (OHOS /tmp is read-only; default /tmp behaviour preserved elsewhere); no assertion change"
    patch_type: "test-adaptation"
    patch_source: "本地适配（设备实测：touch /tmp/... -> Read-only file system）"
