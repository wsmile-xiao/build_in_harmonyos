# test_package/MANIFEST.yml — sexpect 2.4.0
# 上游官方测试声明（CI build_and_test.sh L0e 要求此文件存在）

package: sexpect/2.4.0
homepage: "https://github.com/clarkwang/sexpect"

# 上游测试清点（R51 第一步的证据，tar v2.4.0 实点）：
#   - tests/ 目录 32 个文件（含 CMakeLists.txt 与 common.sh）；tests/CMakeLists.txt
#     经 add_test() 注册 26 个用例 + glob2re 直跑 1 个 = 25 个在 OHOS 运行
#     （另外 spawn-nowait、still-open-after-exit 由上游 `if (CMAKE_SYSTEM MATCHES
#     "Linux.*")` 守卫，HarmonyOS 上按上游设计不注册，非本次裁剪）。
#   - 上游 CTest 汇总（设备实测）：25/25 PASS。
#   - 测试命令：ctest --output-on-failure --parallel 1（配方在 build() 内执行，
#     R51 第二步）。
upstream_check_command: "ctest --output-on-failure --parallel 1"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --parallel 1"
upstream_tests:
  - name: glob2re
    note: "直跑可执行文件（common.c/proto.c 内的 glob2re() 单元级比对）"
  - name: version
  - name: spawn-ttl
  - name: chkerr
  - name: cstring
  - name: chdir-after-exec
  - name: chdir-after-logfile
  - name: cloexit
  - name: close
  - name: eof-before-exit
  - name: expbuf-overflow
  - name: expect_out
  - name: expect-eof
  - name: expect-nocase
  - name: expect-pattern
  - name: get-expbuf
  - name: interact-re-helper
    note: "无 tty 环境（ctest/CI）时按上游设计 exit 0（脚本首行 `[[ -t 0 ]] || exit 0`）"
  - name: kill
  - name: send-128k
  - name: send-null
  - name: spawn-nohup
  - name: spawn-nonblock
  - name: spawn-zombie-idle
  - name: spawn-zombie-idle_02
  - name: still-data-after-exit
  - name: spawn-nowait
    note: "上游 `if (CMAKE_SYSTEM MATCHES \"Linux.*\")` 守卫；HarmonyOS 上不注册（上游设计）"
  - name: still-open-after-exit
    note: "上游 `if (CMAKE_SYSTEM MATCHES \"Linux.*\")` 守卫；HarmonyOS 上不注册（上游设计）"

# test_package 自带的消费者视角断言（真实执行已打包的 bin/sexpect）
test_package_tests:
  - file: test.sh
    description: "version 版本串 + spawn/send/expect/wait 端到端（含 /tmp sockfile 平台能力路径）+ 超时分类/无服务拒绝 负向对照"
    command: "bash test.sh"

# 断言总数（test.sh 实际计数：1 + 3 + 3 + 3）
assertion_count: 10
