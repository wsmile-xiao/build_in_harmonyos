# 软件级 manifest — sexpect（ARCHIVE-SPEC v3.0）
# 文件位置: archives/s/sexpect/manifest.yaml

software: sexpect
display: "sexpect"
description: "Expect for shells: drive interactive programs over a PTY from shell scripts"
category: build-tool
homepage: "https://github.com/clarkwang/sexpect"
license: GPL-3.0-only
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "HarmonyOS 拒绝非应用进程创建 AF_UNIX 路径名 socket（bind(2)=EPERM）且 /tmp 只读：sexpect 的 SEXPECT_SOCKFILE 会合点需回退到抽象命名空间（按路径确定性哈希取名，server/client 同源），路径 socket 可用的平台行为不变"
    - "OHOS sysroot 的 pty 接口（posix_openpt/grantpt/unlockpt/ptsname、TIOCSCTTY/TIOCSWINSZ）完整，PTY 层零修改"
    - "上游 CTest 由 bash 驱动，27 个注册用例中 2 个有 Linux 守卫（CMAKE_SYSTEM），OHOS 运行其余 25 个；测试临时文件不得依赖 /tmp"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "2.4.0":
    status: built
    build_date: "2026-09-26"
    conan_ref: "sexpect/2.4.0"
