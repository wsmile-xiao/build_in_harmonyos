# test_package/MANIFEST.yml — sexpp-cli 0.9.2
# CI L0e 需要本文件存在且非空。
#
# 计数口径：上游套件用例总数 82（7 个测试源文件逐项列于 upstream_tests，
# 源码宏清点与 ctest 实跑双口径一致）；assertion_count 仅为 test_package
# 消费者断言数（test.sh 3 项），与 PR 正文「鸿蒙特有测试」行同源。

package: sexpp-cli/0.9.2
homepage: "https://github.com/rnpgp/sexpp"

# 上游测试在配方 build() 内经 ctest 真跑（WITH_SEXP_TESTS=ON + DOWNLOAD_GTEST=OFF）
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "./bin/sexpp-tests"

# 上游测试程序枚举（源码宏清点 3+24+26+1+9+7+12 = 82；traits 需补丁纳入）
upstream_tests:
  - file: tests/src/baseline-tests.cpp
    source: sexpp-0.9.2/tests/src/baseline-tests.cpp
    description: "Baseline scan/parse/printer tests (3 TEST_F)"
    command: "./bin/sexpp-tests --gtest_filter=BaselineTests.*"
  - file: tests/src/exception-tests.cpp
    source: sexpp-0.9.2/tests/src/exception-tests.cpp
    description: "Parser exception tests (24 TEST_F; SexpWarning 用 CaptureStdout，TMPDIR 修后复活)"
    command: "./bin/sexpp-tests --gtest_filter=ExceptionTests.*"
  - file: tests/src/primitives-tests.cpp
    source: sexpp-0.9.2/tests/src/primitives-tests.cpp
    description: "Primitive type tests (26 TEST_F)"
    command: "./bin/sexpp-tests --gtest_filter=PrimitivesTests.*"
  - file: tests/src/g10-compat-tests.cpp
    source: sexpp-0.9.2/tests/src/g10-compat-tests.cpp
    description: "G10 compatibility tests (1 TEST_F)"
    command: "./bin/sexpp-tests --gtest_filter=G10CompatTests.*"
  - file: tests/src/g23-compat-tests.cpp
    source: sexpp-0.9.2/tests/src/g23-compat-tests.cpp
    description: "G23 compatibility tests (9 TEST_F)"
    command: "./bin/sexpp-tests --gtest_filter=G23CompatTests.*"
  - file: tests/src/g23-exception-tests.cpp
    source: sexpp-0.9.2/tests/src/g23-exception-tests.cpp
    description: "G23 exception tests (7 TEST_F; G23Warning 用 CaptureStdout，TMPDIR 修后复活)"
    command: "./bin/sexpp-tests --gtest_filter=G23ExceptionTests.*"
  - file: tests/src/traits-tests.cpp
    source: sexpp-0.9.2/tests/src/traits-tests.cpp
    description: "Octet traits tests (12 TEST; 上游 CMake 遗漏该文件，补丁纳入后全量实例化)"
    command: "./bin/sexpp-tests --gtest_filter=OctetTraitsTest.*"

# test_package 自带测试（消费者视角）
test_package_tests:
  - file: test.sh
    description: "消费者测试：sexpp -h 帮助 + canonical/advanced 解析回打（3 项断言）"
    command: "bash test.sh"

# 消费者断言总数（test_package 口径；上游 82 见上方 upstream_tests 合计）
assertion_count: 3
