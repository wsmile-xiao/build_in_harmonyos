# 版本级 manifest — sexpp-cli 0.9.2
# 文件位置: archives/s/sexpp-cli/0.9.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.2"

# 软件名
software: "sexpp-cli"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码仓库地址
  url: "https://github.com/rnpgp/sexpp"

  # 源码校验和（v0.9.2 tag 归档，W0 双源 sha256 全等实证）
  sha256: "00c47b56a4dd5e80aba6b15df4e86d276a2a369737c6b467be1f51a9c29af31e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（实测 cmake，init-build 按 URL 猜 autotools 为误判）
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（配方 generate() 实测下发值）
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DWITH_SEXP_TESTS=ON"
    - "-DWITH_SEXP_CLI=ON"
    - "-DDOWNLOAD_GTEST=OFF"
    - "-DGTest_DIR=<gtest/1.17.0 package>/lib/cmake/GTest"

  # 编译依赖列表（格式: name/version）
  # 库制品归父包（archives/s/sexpp 在档 0.8.7、0.9.1；0.9.2 缺席不 requires，判据入 notes.md）
  # gtest 仅为上游单元测试所需，以 test_requires 声明，不进消费方依赖闭包
  dependencies: []
  test_dependencies:
    - gtest/1.17.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch（portability：上游 add_executable(sexpp-tests) 遗漏 traits-tests.cpp，12 个 TEST 宏未实例化，最小补丁恢复全量枚举）"
  - "0002-CMakeLists-gtest-imported-targets.patch（portability：GTest 目标名双拼写条件兼容——conan 工具链 PREFER_CONFIG=ON 走 config 模式只有 GTest::gtest/gtest_main，模块模式才有 GTest::Main/GTest::GTest；父包 0.8.7 同款）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "父包 sexpp/0.9.2 不在制品仓（同族 0.8.7、0.9.1 在档）→ CLI 子包不 requires 父包，按目标版本源码整编（BUILD_SHARED_LIBS=OFF 静态内嵌），package() 只交 bin/sexpp、包内不出现 lib/include；归属判据=制品归属而非版本可得性，详 notes.md"  # knowledge_ref: E720
  - "CMakeDeps 只导出 gtest::gtest 命名，而上游 DOWNLOAD_GTEST=OFF 的 else 分支写死 FindGTest 模块式目标 GTest::Main/GTest::GTest ⇒ generate() 必须把 GTest_DIR 钉到 gtest 包内 lib/cmake/GTest 的上游 GTestConfig.cmake（W0 探针 configure+build rc=0；父包 0.8.7 同法）"  # knowledge_ref: E720
  - "gtest/1.17.0（制品仓版含 0001-tmpdir-ohos-sandbox.patch）的 CaptureStdout scratch 只认 TMPDIR：build() 跑 ctest 前导出 TMPDIR=<build>/gtest-tmp 可写目录，父包卡死的 2 个捕获流用例复活（W0 preview 70/70、TMP/TEMP 均无效）"  # knowledge_ref: E720
  - "上游 v0.9.2 的 add_executable(sexpp-tests) 仍遗漏 traits-tests.cpp（12 个 TEST 宏）：双口径清点取源码宏最大值 N=82，最小补丁纳入后 ctest 全量 82/82，按 ctest 70 口径申报即被判少报"  # knowledge_ref: E720
  - "conan 工具链无条件设 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON：find_package(GTest) 因此走 config 模式直载 GTest_DIR 处的上游 GTestConfig（只导出 GTest::gtest/gtest_main），绕过 FindGTest 模块的 GTest::Main/GTest::GTest 兼容别名——裸 cmake 探针无此开关走模块模式，即「探针绿/配方红」的分叉根因（GTest_DIR 本身已进 CMakeCache）；0.9.2 按父包 0.8.7 先例加 if(TARGET) 双拼写条件补丁"  # knowledge_ref: DRAFT-memtailor-1.4-subdir-ctest-false-pass-install-static-and-conan-gtest-targets

knowledge_ref:
  - E720
