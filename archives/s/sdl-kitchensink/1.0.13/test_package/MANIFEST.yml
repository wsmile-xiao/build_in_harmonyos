# test_package/MANIFEST.yml
# 上游官方测试声明文件
#
# 经核验：SDL_kitchensink 1.0.13 上游无自动化测试目标
#  - CMakeLists.txt 无 enable_testing()/add_test()/ctest 目标（全文件核对）
#  - .github/workflows/ci.yml 只有 cmake build + make -j2，无 test 步骤
# 故上游测试清单为空（0/0），L1 消费者验证由 test_package 承担。

package: sdl-kitchensink/1.0.13
homepage: "https://github.com/katajakasa/SDL_kitchensink"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""
# 上游无 any test target：CMake 未 enable_testing，make check 无对应目标

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：官方 CI 仅编译验证）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：Kit_GetVersion 版本断言 + SDL 像素/音频格式字符串 + Kit_Init/Kit_Quit 生命周期（SDL_VIDEODRIVER=dummy 无头运行）"
    command: "./test_sdl_kitchensink"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 0 + test_package 4 个断言（版本三元组 + 两个格式字符串非空 + init 返回 0）
assertion_count: 4