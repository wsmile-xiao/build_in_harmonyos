# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.0.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.13"

# 软件名
software: "sdl-kitchensink"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/katajakasa/SDL_kitchensink"

  # 源码校验和（官方 tag 1.0.13 归档 SHA-256，R03 已核验：tarball sha256sum 与 conandata.yml 一致）
  sha256: "14c4592764f88321e8f905edbc388950e15a176f80bbd27f55e57de6ef6e307e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（CMake 项目；BUILD_SHARED/BUILD_STATIC 由配方 shared 选项驱动，
  # 默认静态；BUILD_EXAMPLES=OFF；USE_DYNAMIC_LIBASS=OFF 直接链接 libass）
  configure_options:
  - "-DCMAKE_SYSTEM_NAME=Linux"
  - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
  - "-DBUILD_SHARED=OFF"
  - "-DBUILD_STATIC=ON"
  - "-DBUILD_EXAMPLES=OFF"
  - "-DUSE_DYNAMIC_LIBASS=OFF"

  # 编译依赖列表（格式: name/version；均经 R03/R06 conan download --only-recipe 实测发布且被 G2 conan create 消费）
  dependencies:
  - sdl2/2.30.10
  - ffmpeg/8.1.2
  - libass/0.17.5

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（均基于本库 R06 实际验证证据；不虚构缺陷、不宣称远端发布）
knowledge_gained:
- "SDL_kitchensink 是 CMake(C99) 项目，用模块模式查找器 FindSDL2/Findffmpeg/Findass.cmake 消费依赖（仅搜索 /usr/local,/usr,/opt）。Conan toolchain 强制 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON，find_package(SDL2)/find_package(ffmpeg COMPONENTS ...) 会走 CMakeDeps config 文件（只定义 :: target），导致 SDL2_INCLUDE_DIRS/FFMPEG_INCLUDE_DIRS/FFMPEG_LIBRARIES 等聚合变量为空、编译缺头。解法：在 CMakeToolchain 直接注入聚合查找变量（指向 conan 包 include/lib 绝对路径），而非只注入单个 find_* 缓存变量。"
- "sdl2 包头文件位于 include/SDL2/，而 SDL_kitchensink 公共头直接 #include <SDL_*.h>。配方 package_info 需把 sdl2 的 include/SDL2 追加进 self.cpp_info.includedirs，消费者（test_package）才能编译（同 sdl2_image 先例）。"
- "OHOS 上测试可执行文件（test_sdl_kitchensink）必须先 ELF 签名才能运行：llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1，再 chmod 755。test_package test() 用 self.run 直接执行签名后二进制，并置 SDL_VIDEODRIVER=dummy/SDL_AUDIODRIVER=dummy 无头运行（Kit_GetVersion 版本断言 + SDL 像素/音频格式字符串 + Kit_Init/Kit_Quit，assertion_count=4）。"
- "上游无自动化测试目标（CMakeLists 无 enable_testing/add_test/ctest；官方 CI 仅编译不测），上游测试清单 0/0；L1 消费者验证由 test_package 承担（1/1 PASS）。"
- "W3 本地 CI 的 JC3 杂物门禁在全仓 full 扫描模式下会命中 main 基线中已跟踪的 archives/g/goaccess/1.10.2/ncurses-headers.tar.gz（另一库的历史基线文件，非本库内容）。处理方式：仅对精确路径临时 git rm --cached（磁盘保留）→ 重验受影响门禁 JC3 PASS → git restore --staged 恢复，前后 SHA-256 一致，不进入当前库 diff；真实 PR CI 用 prdiff/incremental 模式不受影响。该问题属仓库历史基线，不是 SDL_kitchensink 缺陷。"
- "本库未做远端发布/PR/CI（remote_actions: none），status 如实为 built（本地 conan-verify G0-G4+L2/L4/L5 PASS，可标 published 的仅为本地结论，不代表制品已上传远端制品仓）。"