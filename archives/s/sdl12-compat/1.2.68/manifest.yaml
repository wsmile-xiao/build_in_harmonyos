software: sdl12-compat
version: "1.2.68"
status: built
build_date: "2026-08-15"
build_system: cmake

source:
  url: "https://github.com/libsdl-org/sdl12-compat/archive/refs/tags/release-1.2.68.tar.gz"
  sha256: "63c6e4dcc1154299e6f363c872900be7f3dcb3e42b9f8f57e05442ec3d89d02d"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "SDL12TESTS=ON"
    - "SDL12DEVEL=ON"
    - "STATICDEVEL=OFF"
  dependencies:
    - "sdl2/2.30.10#9a6fd1dbbc0ac1eef2a42639df48e3b4:4b977264131a1c74e82bd6bb51b63cc9aadc4cfa#96027f33d6086703ce6fe4e4502533b3"
  bundled_runtime:
    name: SDL2
    version: "2.30.10"
    form: "PIC static archive relinked as private libSDL2-2.0.so.0"
    license_file: "licenses/SDL2-LICENSE.txt"
  cc: clang
  cxx: clang++

patches_applied:
  - patches/0001-use-conan-sdl2.patch

knowledge_gained:
  - "sdl12-compat only needs SDL2 headers at build time because it resolves the SDL2 runtime dynamically; the recipe injects the include directory from the declared Conan SDL2 package (ref: notes.md)."
  - "The upstream 1.2.68 release builds 32 test executables but does not register CTest cases; unattended validation explicitly invokes 14 programs that terminate without physical devices or human input (ref: evidence/upstream-test-matrix.md)."
  - "HarmonyOS PC can execute SDL 1.2 surface and event APIs headlessly through SDL2 dummy video/audio drivers (ref: evidence/upstream-test-matrix.md)."
  - "HarmonyOS CMake does not populate the Unix SONAME linker flag for this project; the compatibility library needs an explicit relative linker SONAME and matching package symlink (ref: reports/l5-evidence.md)."

patch_classification:
  - file: 0001-use-conan-sdl2.patch
    type: portability
    platform_only: true
    guard: "Use the declared Conan SDL2 dependency instead of host filesystem discovery"
