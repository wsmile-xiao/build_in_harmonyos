package: sdl12-compat/1.2.68
homepage: "https://github.com/libsdl-org/sdl12-compat"

upstream_check_command: "Run the 14 commands listed under upstream_tests with SDL_VIDEODRIVER=dummy and SDL_AUDIODRIVER=dummy"
upstream_test_in_build: true
upstream_test_command: "Explicitly run all 14 unattended upstream programs after building all 32 test executables"
upstream_total_programs: 32
upstream_built_count: 32
upstream_case_count: 14
upstream_pass_count: 14
upstream_skipped_count: 18
upstream_test_note: "The release has no CTest registration. Fourteen programs terminate deterministically without physical devices or human input and are executed; reports/test-report.md gives a per-program technical reason for the remaining eighteen."

upstream_tests:
  - {file: test/testver.c, command: "./testver", description: "Compile-time and runtime SDL 1.2 versions"}
  - {file: test/testplatform.c, command: "./testplatform", description: "Platform, byte-order and CPU APIs"}
  - {file: test/testerror.c, command: "./testerror", description: "Threaded error state behavior"}
  - {file: test/testiconv.c, command: "./testiconv", description: "SDL iconv conversion paths"}
  - {file: test/testfile.c, command: "./testfile", description: "RWops read, write, seek, append and error paths"}
  - {file: test/testkeys.c, command: "./testkeys", description: "SDL 1.2 keysym name table"}
  - {file: test/testloadso.c, command: "./testloadso --hello libc.so", description: "Load libc and resolve/call puts"}
  - {file: test/torturethread.c, command: "./torturethread", description: "Nested thread creation and destruction"}
  - {file: test/testvidinfo.c, command: "./testvidinfo", description: "Dummy video driver and display format query"}
  - {file: test/testblitspeed.c, command: "./testblitspeed --seconds 1", description: "Surface conversion and software blit"}
  - {file: test/testsem.c, command: "./testsem 2", description: "Semaphore contention and timeout"}
  - {file: test/testthread.c, command: "./testthread", description: "Thread wait, kill compatibility and signal paths"}
  - {file: test/testtimer.c, command: "./testtimer 10", description: "Single/multiple timer and removal paths"}
  - {file: test/testjoystick.c, command: "./testjoystick", description: "Joystick subsystem initialization and enumeration"}

unattended_exclusions:
  interactive_window_input: [checkkeys, graywin, testalpha, testbitmap, testcursor, testoverlay, testoverlay2, testpalette, testsprite, testwin, testwm, threadwin]
  real_audio_or_cdrom: [loopwave, testcdrom]
  opengl_gpu_and_interaction: [testdyngl, testgl]
  unsupported_dummy_gamma: [testgamma]
  externally_terminated_stress_loop: [testlock]

test_package_tests:
  - file: test_sdl12_compat.c
    description: "Link the packaged SDL 1.2 API, verify the bundled SDL2 runtime through /proc/self/maps, and test versioning, dummy video surface drawing, event round trip and timer behavior"
    command: "./test_sdl12_compat"

assertion_count: 9
