# test_package/MANIFEST.yml — snek 1.13 upstream test declaration.
package: snek/1.13
homepage: "https://sneklang.org"

# Upstream registers its suite in test/Makefile (no ctest/gtest/autotools
# harness): SUCCESS_TESTS lists 35 pass-*.py, FAIL_TESTS lists 13 fail-*.py
# plus $(SYNTAX_TESTS) with 3 fail-syntax-*.py — 51 script files total.
# test/generate-chain-op.py is a code generator helper, not a test case.
upstream_check_command: "make check (test/ dir, posix leg)"
upstream_test_in_build: true
upstream_test_command: "ports/posix/snek test/<each of 51 scripts> (35 pass expect rc 0, 16 fail expect rc 1)"
upstream_tests_exist: true
upstream_tests:
  - "test/pass-*.py — 35 success scripts, exit 0 expected (arith/str/list/dict/loops/math/random/slice/scoping/interpolation)"
  - "test/fail-*.py — 13 failure scripts, exit 1 expected (scoping/range/args/assert/interpolate/dict-mutable)"
  - "test/fail-syntax-*.py — 3 syntax-error scripts, exit 1 expected (lex-bang/list-named/tuple-named)"
upstream_test_notes: "The qemu-arm/qemu-riscv legs of upstream make check need foreign-architecture firmware that cannot be built or executed on OHOS aarch64; the python3 leg only oracles the test files under CPython, not this product. All 51 files run with the built posix snek binary. The 16 fail-* cases double as negative controls: a stub binary that always exits 0 would fail all of them."

# Official registration total and counting method. Single parseable
# framework (test/Makefile variable lists), parsed by the recipe as the
# single counting source; per-run results come from one JSON results file.
upstream_test_total: 51
upstream_test_count_method: auto

test_package_tests:
  - file: test_snek.py
    description: "6 consumer checks via the packaged snek binary (arith/str/list/dict/func-loop/math), each printing one CHECK-OK line; plus snek --version smoke check."
    command: "snek test_snek.py && snek --version"

assertion_count: 7
