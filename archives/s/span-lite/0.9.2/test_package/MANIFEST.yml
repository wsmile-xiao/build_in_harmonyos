package: span-lite/0.9.2
homepage: "https://github.com/martinmoene/span-lite"
upstream_check_command: "clang++ -std=c++11 -Iinclude -Itest/lest -Dlest_FEATURE_AUTO_REGISTER=1 test/span-main.t.cpp test/span.t.cpp -o span_tests && ./span_tests"
upstream_test_in_build: true
upstream_test_command: "./span_lite_tests"
upstream_tests:
  - file: span.t.cpp
    source: span-lite-0.9.2/test/span.t.cpp
    description: "Main lest-based test suite for span-lite."
    command: "./span_lite_tests"
test_package_tests:
  - file: test.cpp
    description: "Consumer-side API validation: span construction, indexing, subspan."
    command: "./test_span_lite"
assertion_count: 5
