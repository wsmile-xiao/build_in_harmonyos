# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 上游测试三步法）

package: sse2neon/1.9.1
homepage: "https://github.com/DLTcollab/sse2neon"

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# sse2neon 为 header-only（无 build()），上游测试在本地/CI 由 make 独立校验
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（aarch64 OHOS 本机实测，双口径台账见 notes.md）
upstream_tests:
  - file: tests/main.cpp
    source: sse2neon-1.9.1/tests/main.cpp
    description: "主测试套件：SSE2NEON::InstructionTest 注册表驱动，525 项指令测试全部通过（525/525，aarch64 本机实测）"
    command: "./tests/main"
  - file: tests/ieee754.cpp
    source: sse2neon-1.9.1/tests/ieee754.cpp
    description: "IEEE-754 边界测试（50 个 TEST_CASE，独立 RUN_TEST 注册 49 项）：-O0 49/49 通过；-O2 下 ftz_output_flush/daz_input_flush 2 项因 clang 常量折叠绕过运行时 FPCR.FZ（平台 FZ 经裸 asm 验证有效，见 notes.md）"
    command: "./tests/ieee754"
  - file: tests/nan.cpp
    source: sse2neon-1.9.1/tests/nan.cpp
    description: "NaN 传播测试（132 个 TEST_CASE，注册 131 项）：-O0 131/131 通过；-O2 下 cvtss_si64_nan 1 项因 float→int64 NaN 转换 UB 代码生成返回垃圾值（-O0 返回 0，符合上游允许值）"
    command: "./tests/nan"
  - file: tests/aes.cpp
    source: sse2neon-1.9.1/tests/aes.cpp
    description: "AES-NI 验证测试（21 个 TEST_CASE，注册 20 项）：20/20 全部通过"
    command: "./tests/aes"
  - file: tests/differential.cpp
    source: sse2neon-1.9.1/tests/differential.cpp
    description: "(R05 已闭环) 差分测试：x86 golden（132 .golden，经 8080 /artifacts/sse2neon 下载，sha256 0a055220…87c758e）在 ARM verify；-ffp-contract=off 编译下 132 passed / 0 failed / 27 skipped（exit 0）"
    command: "sh archives/s/sse2neon/1.9.1/test/fetch_golden.sh <dir> && make check-differential GOLDEN_DIR=<dir>  # R06: golden 经制品端点下载（SHA-256 0a055220…87c758e 核验），不再随 PR 提交二进制"
    source: sse2neon-1.9.1/tests/differential.cpp
    description: "差分测试：需 x86 主机 generate-golden 生成黄金数据后在 ARM verify；本机（aarch64）无黄金数据，未实例化（0 TEST_CASE 注册，上游设计约束）"
    command: "./tests/differential --verify golden"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：include <sse2neon.h> 调用公开 SIMD API（_mm_set1_ps/_mm_add_ps/_mm_mul_ps/_mm_cvtss_f32/_mm_add_epi32/_mm_cvtsi128_si32）校验数值结果"
    command: "./test_sse2neon"

# HarmonyOS 专项测试（aarch64 本机实跑，编译命令见 notes.md）
ohos_specific_tests:
  - file: test/ohos_sse2neon_test.cpp
    description: "OHOS 专项测试：静态断言 SSE2NEON_ARCH_AARCH64 + 浮点/整数/置换 SIMD 结果校验（8 项 CHECK 全过）"
    command: "clang++ -O2 -I<src> -march=armv8-a+fp+simd -std=gnu++14 test/ohos_sse2neon_test.cpp -lm -o /tmp/ohos-sse2neon && /tmp/ohos-sse2neon"

# 断言总数 (近似值: 上游 525+49+131+20 + 消费者 4 项 + OHOS 专项 8 项)
assertion_count: 737