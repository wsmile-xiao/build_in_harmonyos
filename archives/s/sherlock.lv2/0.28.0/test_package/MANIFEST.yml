# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sherlock.lv2/0.28.0
homepage: "https://www.ventosus.ch/sherlock.lv2/"

# 上游测试命令 (meson 项目的 ninja test——Arch PKGBUILD check() 确认)
upstream_check_command: "ninja -C build test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# meson test：LV2 validate（lv2_validate + sord_validate 工具，验证
# manifest.ttl/sherlock.ttl 等）+ LV2 lint（lv2lint 工具）；工具在 OHOS
# 环境缺失时测试跳过（meson 的 required:false）
upstream_tests:
  - file: "LV2 validate"
    source: "meson.build test('LV2 validate', lv2_validate, ...)"
    description: "用 lv2_validate + sord_validate 验证插件 bundle（manifest.ttl/sherlock.ttl/sherlock_ui.ttl）"
    command: "ninja -C build test"
  - file: "LV2 lint"
    source: "meson.build test('LV2 lint', lv2lint, ...)"
    description: "用 lv2lint 检查插件"
    command: "ninja -C build test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/test_sherlock.c
    description: "编译运行 test_sherlock.c：验证 LV2 插件 bundle（manifest.ttl 含插件声明 + sherlock.so 存在，非空壳）"
    command: "cc test_sherlock.c && ./test_sherlock <package>/lib/lv2/sherlock.lv2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
