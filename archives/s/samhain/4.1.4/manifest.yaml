# 版本级 manifest
# 文件位置: archives/{letter}/{name}/4.1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.1.4"

# 软件名
software: "samhain"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方发行容器：内含 samhain-4.1.4.tar.gz + PGP 签名）
  url: "https://www.la-samhna.de/archive/samhain_signed-4.1.4.tar.gz"

  # 源码校验和（外层容器；内层 tarball 与 Debian pristine 同源：326 文件逐字节一致）
  sha256: "32ee7477af11d9f2f64f30b9cb316c351897c1c994c7b98b0ef17fc0ca5e1d1a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（逐项取值与理由见 notes.md「configure 旗标台账」）
  configure_options:
    - "--disable-mail"             # 禁内置 SMTP 邮件外发
    - "--enable-network=no"        # 不编译 client/server（守护+网络根源）
    - "--enable-udp=no"            # 不编译 514/udp 监听
    - "--enable-port-check=no"     # 端口检查=网络探测；OHOS /proc/net 不可读
    - "--disable-ipv6"             # 禁 IPv6 栈
    - "--disable-encrypt"          # 禁 client/server 传输加密（网络功能）
    - "--disable-srp"              # 禁 SRP 网络认证
    - "--enable-db-reload=no"      # 禁 SIGHUP 重载（守护行为）
    - "--disable-message-queue"    # 禁 SysV 消息队列（守护 IPC；OHOS seccomp 另禁 msgget）
    - "--disable-external-scripts" # 禁外部脚本接口
    - "--disable-shellexpand"      # 禁配置文件 shell 展开
    - "--without-gpg"              # 禁 GnuPG 外部程序（设备未装 gpg）
    - "--without-prelude"          # 禁 Prelude IDS（网络日志外发组件）
    - "--without-libwrap"          # 禁 TCP Wrappers（网络访问控制编译面）
    - "--disable-dnmalloc"         # dnmalloc 在 OHOS 运行期断言崩溃 → 系统分配器
    - "--with-trusted=0,2,1000,1006,20001006,20020085"  # HMDFS 共享属主 uid 20001006 + 组可写路径成员 uid 1006（GID 1006）+ 沙箱 euid 20020085；上游默认 [0]，非 root 下所有配置/状态路径判 untrusted
    # --without-database 故意不传：上游 AC_ARG_WITH(database) 的 action-if-given
    # 先于 withval!=no 判定，传 --without-database 会误触发
    #   "With --with-database, --enable-xml-log is required as well."（致命）
    # 默认即无数据库后端（configure 输出无 mysql/postgresql/oracle/odbc 探测）

  # 编译依赖列表（格式: name/version）
  # 硬依赖集为 ∅：configure.ac 全部 AC_CHECK_LIB 均为条件探测且消费方全关（W0 证据见 notes.md）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

