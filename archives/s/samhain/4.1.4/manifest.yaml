# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS NDK 无 pthread cancellation API（pthread_cancel/pthread_testcancel/pthread_setcanceltype 在 libc.so 与 libpthread.a 均无符号）→ samhain 链接失败；在 sh_pthread.c 头部集中补 shim（cancel 返回 ESRCH 走 cancel_all 安全分支，不挂死）" # knowledge_ref: DRAFT-E680
  - "dnmalloc 分配器在 OHOS 运行期断言 hashval < AMOUNTHASH（samhain -v 即崩）→ --disable-dnmalloc 用系统分配器（上游 testhash.sh 同款旗标）" # knowledge_ref: DRAFT-E681
  - "c_random.sh 依赖设备缺失的 sum(1) → my_key_*/POS_TF 替换为空 → #if (POS_TF == 1) invalid token 编译失败；补 sum 缺失 od/awk 回退" # knowledge_ref: DRAFT-E681
  - "config.guess/config.sub 不识别 HarmonyOS（E007 族）：2014 老版脚本需手修（HarmonyOS 分支改 echo/exit 直出、config.sub OS 表加 linux-ohos），patch-autotools-ohos.pl 对老版锚点失配仅打 1/5" # knowledge_ref: E007
  - "OHOS seccomp 拒绝 SysV IPC：msgget 直接 Bad system call rc=159（SIGSYS31）→ 上游 --enable-message-queue 变体运行即崩；testhash 变体摘除该旗标（PR 已声明）" # knowledge_ref: DRAFT-E681
  - "hmmac 下 mktemp -d 目录权限坏 → config.status 写 subs*.awk Permission denied；mktemp wrapper exit 1 强制 autoconf AS_TMPDIR mkdir 回退（acct 同款）" # knowledge_ref: DRAFT-E681
