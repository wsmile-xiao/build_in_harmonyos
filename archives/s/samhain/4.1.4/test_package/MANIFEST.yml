# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: samhain/4.1.4
homepage: https://www.la-samhna.de/samhain/

# 上游测试命令（设备侧逐测执行；矩阵与统计见 notes.md 与 PR 正文）
upstream_check_command: "sh test/test.sh <N>  # N in 1-13,20-27, run per-suite on device"

# conanfile.py build() 方法中是否已集成上游测试
# false：上游套件自带守护/网络形态用例（6/10/20-27）与重型编译矩阵（1），
# 按任务「无网络无守护」口径在设备验证阶段单独执行并留档，不进 CI build()。
upstream_test_in_build: false
upstream_test_command: "sh test/test.sh 2 3 4 5 7 8 9 11 12 13  # device run matrix"

# make check 实际运行的测试套件
upstream_tests:
  - name: "shell test suite (per-suite entry test/test.sh N)"
    source: samhain-4.1.4/test/
    description: "上游自带 shell 测试：hash/standalone/microstealth/external/gpg-gate/suidcheck/process-check/CL 系列 + 编译矩阵 test1"

# 新增/鸿蒙特有测试
added_tests:
  - name: "test_package integrity chain (5 assertions)"
    source: test_package/test_samhain.sh
    description: "免配置本地 file: 完整性链：版本 4.1.4 / TIGER hash 确定性与公布向量 / --create-database / 正向 verify rc=0 / 篡改检出 rc!=0（无守护无网络）"
