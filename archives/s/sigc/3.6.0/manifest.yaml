software: sigc
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/3.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.6.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GNOME 官方发布目录）
  url: "https://download.gnome.org/sources/libsigc++/3.6/libsigc++-3.6.0.tar.xz"

  # 源码校验和（官方 tarball 实测，991392 字节）
  sha256: "c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "-Ddefault_library=shared"
    - "-Dmaintainer-mode=false"
    - "-Dbuild-documentation=false"
    - "-Dvalidation=false"
    - "-Dbuild-pdf=false"
    - "-Dbuild-examples=false"
    - "-Dbenchmark=false"
    - "-Dwrap_mode=nodownload"

  # 编译依赖列表（格式: name/version）
  # 运行时无第三方依赖；构建期仅需 meson（制品仓已发布 meson/1.11.0）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libsigc++ 3.x 的 sigc::signal/sigc::slot 使用函数类型模板语法（signal<int(int)> / slot<int()>），2.x 的 signal<int,int>/slot<int> 形态仅有前向声明无定义，消费者需按 3.x 语法适配"
  - "官方 tarball 由 meson dist 生成，无 configure 脚本，只有 meson 构建路径可用"
  - "sigc++config.h 安装在 lib/sigc++-3.0/include，必须与 include/sigc++-3.0 一并声明为 includedir，否则消费者找不到配置头"
  - "Meson 交叉构建下 Conan 生成的 machine file 缺省不含 archiver，需要把 llvm-ar/llvm-ranlib 注入 [binaries]"
