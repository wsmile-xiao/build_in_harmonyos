package: sigc/3.6.0
homepage: "https://github.com/libsigcplusplus/libsigcplusplus"

upstream_check_command: "meson test -C build"
upstream_test_in_build: true
upstream_test_command: "41 libsigc++ 3.6.0 upstream test targets"
upstream_tests:
  - file: tests/test_accum_iter.cc
    description: "Iterator-based signal accumulation"
  - file: tests/test_accumulated.cc
    description: "Signal accumulator behavior"
  - file: tests/test_bind.cc
    description: "Bound-argument adaptor behavior"
  - file: tests/test_bind_as_slot.cc
    description: "Bound functors used as slots"
  - file: tests/test_bind_ref.cc
    description: "Reference binding behavior"
  - file: tests/test_bind_refptr.cc
    description: "Reference-pointer binding behavior"
  - file: tests/test_bind_return.cc
    description: "Bound return-value behavior"
  - file: tests/test_compose.cc
    description: "Functor composition behavior"
  - file: tests/test_connection.cc
    description: "Connection lifecycle behavior"
  - file: tests/test_copy_invalid_slot.cc
    description: "Copying invalid slots"
  - file: tests/test_cpp11_lambda.cc
    description: "C++ lambda slots"
  - file: tests/test_custom.cc
    description: "Custom functor integration"
  - file: tests/test_disconnect.cc
    description: "Connection disconnection semantics"
  - file: tests/test_disconnect_during_emit.cc
    description: "Disconnecting slots during signal emission"
  - file: tests/test_exception_catch.cc
    description: "Exception propagation and catching"
  - file: tests/test_hide.cc
    description: "Hidden-argument adaptor behavior"
  - file: tests/test_limit_reference.cc
    description: "Limited-reference lifetime behavior"
  - file: tests/test_member_method_trait.cc
    description: "Member-method trait detection"
  - file: tests/test_mem_fun.cc
    description: "Member-function adaptor behavior"
  - file: tests/test_ptr_fun.cc
    description: "Free-function adaptor behavior"
  - file: tests/test_retype.cc
    description: "Argument retype adaptor behavior"
  - file: tests/test_retype_return.cc
    description: "Return-value retype adaptor behavior"
  - file: tests/test_rvalue_ref.cc
    description: "Rvalue-reference argument handling"
  - file: tests/test_scoped_connection.cc
    description: "Scoped connection RAII behavior"
  - file: tests/test_signal.cc
    description: "Signal connection, emission, and slot-list behavior"
  - file: tests/test_signal_move.cc
    description: "Signal move construction and assignment"
  - file: tests/test_size.cc
    description: "Signal slot-count reporting"
  - file: tests/test_slot.cc
    description: "Slot construction, copying, and invocation"
  - file: tests/test_slot_disconnect.cc
    description: "Slot-driven disconnection semantics"
  - file: tests/test_slot_move.cc
    description: "Slot move construction and assignment"
  - file: tests/test_trackable.cc
    description: "Automatic slot disconnection when a trackable is destroyed"
  - file: tests/test_trackable_move.cc
    description: "Trackable move semantics"
  - file: tests/test_track_obj.cc
    description: "Tracked object lifetime behavior"
  - file: tests/test_tuple_cdr.cc
    description: "Tuple cdr helper behavior"
  - file: tests/test_tuple_end.cc
    description: "Tuple end helper behavior"
  - file: tests/test_tuple_for_each.cc
    description: "Tuple for-each traversal"
  - file: tests/test_tuple_start.cc
    description: "Tuple start helper behavior"
  - file: tests/test_tuple_transform_each.cc
    description: "Tuple transform-each traversal"
  - file: tests/test_visit_each.cc
    description: "Functor traversal with visit_each"
  - file: tests/test_visit_each_trackable.cc
    description: "visit_each over trackable objects"
  - file: tests/test_weak_raw_ptr.cc
    description: "Weak raw-pointer behavior"

test_package_tests:
  - file: sigc_consumer_case.cpp
    description: "End-to-end typed signal/slot consumer workflow: dispatch, disconnect, RAII, bind, and payload delivery"
    command: "./test_sigc_consumer"

assertion_count: 7
