software: slop
display: "slop"
description: "Interactive X11 screen region selection utility and library"
category: gfx
homepage: "https://github.com/naelstrof/slop"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use the upstream XShape backend because HarmonyOS PC has no GLX display stack"
    - "Resolve X11, Xext, and GLM exclusively through Conan dependencies"
  common_dependencies:
    - libx11
    - libxext
    - glm

versions:
  "7.7":
    status: built
    build_date: "2026-09-29"
    conan_ref: "slop/7.7"
