version: "7.7"
software: slop
status: built
build_date: "2026-09-29"
conan_ref: "slop/7.7"
build_system: cmake

source:
  url: "https://github.com/naelstrof/slop/archive/refs/tags/v7.7.tar.gz"
  sha256: "a69a6e5c41d7fff1c6aa35b367a5c5a6dc98e621fa9a1908808d6308c2b40f4e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DSLOP_OPENGL=OFF"
    - "-DSLOP_UNICODE=OFF"
  dependencies:
    - libx11/6.4.0
    - libxext/6.4.0.1
    - glm/1.0.3
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-resource.cpp.patch"
  - "0002-cmake-use-conan-dependency-targets.patch"

knowledge_gained:
  - "slop 7.7 has no upstream test directory or registered CTest targets"
  - "The XShape backend builds without GLX and preserves the core selection API"
  - "Non-interactive CLI paths execute before opening an X display"
  - "HarmonyOS can return no passwd entry, so user configuration lookup needs a safe fallback"

patch_classification:
  - file: 0001-src-resource.cpp.patch
    type: portability
    platform_only: false
    guard: "POSIX defensive fallback"
  - file: 0002-cmake-use-conan-dependency-targets.patch
    type: build
    platform_only: false
    guard: "Conan dependency target wiring"
