package: slop/7.7
homepage: "https://github.com/naelstrof/slop"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_test_census:
  denominator: 0
  usable: 0
  tests_directories: 0
  test_named_files: 0
  registered_tests: 0
  cmake_enable_testing: false
  cmake_add_test: false

upstream_tests: []

test_package_tests:
  - file: test_slop_api.cpp
    description: "调用公开 C API 并验证九项默认参数"
    command: "./test_slop_api"
  - file: test_cli.py
    description: "执行打包后的 slop --version 并校验 v7.7"
    command: "slop --version"
  - file: test_cli.py
    description: "执行打包后的 slop --help 并校验帮助文本"
    command: "slop --help"
  - file: test_cli.py
    description: "HarmonyOS 特有测试：无 passwd/HOME/DISPLAY 时安全进入确定性错误路径"
    command: "env -u DISPLAY -u XAUTHORITY -u HOME -u XDG_CONFIG_HOME slop"
  - file: conanfile.py
    description: "HarmonyOS 特有测试：AArch64 ELF 且不含 GL/GLX/GLEW 动态依赖"
    command: "readelf -h -d bin/slop"

assertion_count: 20
max_rss_mb: 512
build_mem_budget_mb: 1000
