software: svt-av1
display: "SVT-AV1"
description: "AV1 video encoder - Scalable Video Technology for AV1"
category: video
homepage: "https://gitlab.com/AOMediaCodec/SVT-AV1"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake-based build, requires cmake >= 3.5 and NASM assembler"
    - "NEON optimization automatically enabled on ARM64 platform"
    - "Includes NEON_DOTPROD and NEON_I8MM advanced optimizations"
    - "GitLab source download requires SSL certificate bypass"
    - "Shared library (libSvtAv1Enc.so) with executable frontend (SvtAv1EncApp)"
    - "RPATH must be set to $ORIGIN/../lib for portability"
  common_dependencies:
    - cmake >= 3.5
    - nasm >= 2.14
    - clang compiler

versions:
  "4.1.0":
    status: built
    build_date: "2026-05-27"
    notes: "Successfully compiled with NEON optimization, test passed"