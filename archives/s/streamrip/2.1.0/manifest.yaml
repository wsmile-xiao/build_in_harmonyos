software: streamrip
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://pypi.tuna.tsinghua.edu.cn/packages/b8/c9/6997772e0217f3081e4e692c7b8b104aaa564c008f2593341e81bbbd2396/streamrip-2.1.0.tar.gz"

  # 源码校验和
  sha256: "e59b4b406f9ac77eb59c927a1a082644e0902152ffeb6212b6b24af7fbef5540"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: python

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | python
  system: python

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "aiohttp/3.14.1"
    - "requests/2.34.2"
    - "pycryptodomex/3.23.0"
    - "cffi/2.0.0"
    - "rich/14.1.0"
    - "mutagen/1.47.0"
    - "tomlkit/0.13.3"
    - "click/8.2.1"
    - "aiofiles/24.1.0"
    - "aiolimiter/1.2.1"
    - "appdirs/1.4.4"
    - "Pillow/12.1.1"

  # 编译器
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python 包在鸿蒙平台上需要使用 musllinux cp314 aarch64 wheel"
  - "pip 在此平台不可用，需手动下载 wheel 并用 zipfile 解压"
  - ".so 文件必须使用 sign-elf 工具签名才能加载"
  - "Pillow musllinux wheel 段错误，需将 PIL 改为延迟导入"
  - "ctypes 导入会挂起，需先签名 _cffi_backend.so"
  - "manylinux wheel 需替换为 musllinux 版本"
