# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: seqwish/0.7.11
homepage: "https://github.com/ekg/seqwish"

# 上游测试入口：test/Makefile 的 test 目标（prove -v t），主用例 test/t/01_seqwish.t。
# 该脚本是 bash-tap 用例（BASH_TAP_ROOT=bash-tap），上游 CI 的 aarch64 作业也是
# `cd test && make test`，与本次实跑口径一致。
upstream_check_command: "cd test && make test   # 等价于 prove -v t"

# conanfile.py build() 中未集成上游测试：上游用例需要 test/ 下的 HLA 数据与
# bash-tap 框架、并依赖 ../bin/seqwish 相对路径，放进 build() 会污染构建树。
# 本次在源码树内、以本包产物为 ../bin/seqwish 真机实跑；原始输出留档于本地
# reports/upstream-test.log（reports/ 为本地验证证据目录，按仓库 .gitignore 不入库）。
upstream_test_in_build: false
upstream_test_command: "cd test && prove -v t"

# 2026-10-01 真机实跑（源码树 + 本包二进制）：Ok 30 / Fail 0，Result: PASS。
upstream_suite_count: 1
upstream_assertion_count: 30

upstream_tests:
  - file: test/t/01_seqwish.t
    source: seqwish-0.7.11/test/t/01_seqwish.t
    description: "30 条 bash-tap 断言：seqwish -h 打印标语 1 条；其余 29 条用 HLA 数据（A-3105/B-3106/C-3107…V-352962、含 masked 小写序列用例）跑 seqwish -s <fa.gz> -p <paf.gz> -b HLA -g <out.gfa>，把产物 md5 与上游预先记录的 .gfa.md5 逐条比对，等于对完整构图流程做端到端等价性校验。真机实测 30/30 PASS。"
    command: "cd test && prove -v t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_seqwish.sh
    description: "25 条消费者断言（2026-10-01 真机 sh 口径实测 PASS 25 / FAIL 0），其中 8 条为鸿蒙特有场景。①交付物：bin/seqwish 可执行非空、包内不夹带 .a/.so、licenses/LICENSE 交付；②上游语义真跑：-h 标语、合成 16M 自比对构图产出 3 行 GFA（H/S/P）且序列段与输入一致、同输入两次输出字节一致、空 PAF 不崩仍产出合法 GFA、gzip 形态输入与明文结果一致、未知选项必须非零退出（负向对照防假绿）；③[OHOS] 宿主为 musl（/proc/self/maps 含 ld-musl）、产物为 64 位小端 AArch64 PIE ELF、不引用 glibc（无 libc.so.6）而按 musl 命名引用 libc.so、链接 OHOS libc++ 运行时与平台 libomp.so。"
    command: "sh test_seqwish.sh <package bin dir> <package folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 25
