patches:
  "0.7.11":
    - patch_file: "patches/0001-bump-cmake-minimum-version.patch"
      patch_description: "cmake_minimum_required 3.1 -> 3.10: CMake 4 已移除 <3.5 兼容层，否则 configure 直接失败"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-sdsl-lite-make-tests-optional.patch"
      patch_description: "sdsl-lite 自带测试与 googletest 依赖改为可选 (SDSL_BUILD_TESTS, 默认 OFF): seqwish 只链接其 libsdsl/libdivsufsort，且测试集需在构建期联网下载"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0003-portable-current-dir-name.patch"
      patch_description: "get_current_dir_name() 是 GNU 扩展而非 POSIX 接口，并非所有 libc 都声明；改为在 tempfile.hpp 中提供基于 getcwd() 的可移植等价实现"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0004-optional-libatomic.patch"
      patch_description: "-latomic 改为能力探测（find_library）：原子内建函数由编译器运行时提供的工具链并不附带 libatomic，无条件 -latomic 会导致链接失败"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0005-jemalloc-optional.patch"
      patch_description: "jemalloc 链接改为 SEQWISH_USE_JEMALLOC 可选开关（默认 ON）：本平台 jemalloc 静态库会让链接它的可执行文件启动即 SIGSEGV，配方侧关闭"
      patch_type: "portability"
      strip: 1
