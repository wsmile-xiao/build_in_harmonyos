# 版本级 manifest — seqwish 0.7.11
# 文件位置: archives/s/seqwish/0.7.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.7.11"

# 软件名
software: "seqwish"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游 ekg/seqwish v0.7.11 tag 归档）
  url: "https://github.com/ekg/seqwish/archive/refs/tags/v0.7.11.tar.gz"

  # 源码校验和
  sha256: "9d9359faa4ca6c0d565d664100658b5872693d507d457dedc947ff10f425b255"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 生成器与缓存变量（ConanToolchain cache_variables）
  configure_options:
    - "CMAKE_GENERATOR=Unix Makefiles"        # Ninja 对 sdsl-lite 全路径库文件报 no-known-rule（见 notes.md）
    - "EXTRA_FLAGS=-march=armv8-a"            # 上游默认 -march=native，交叉/设备环境不可用；取上游 aarch64 CI 的取值
    - "SEQWISH_USE_JEMALLOC=OFF"              # 本平台 jemalloc 静态库启动 SIGSEGV（见 notes.md），上游默认 ON 由 0005 补丁变成可关
    - "CMAKE_ARGS=-DCMAKE_POLICY_VERSION_MINIMUM=3.5;-DSDSL_BUILD_TESTS=OFF"  # 透传给 sdsl-lite 子构建（CMake 4 已移除其 2.8 兼容层，且其测试子目录联网下载测试集）

  # 运行时依赖（格式: name/version）
  dependencies:
    - "zlib/1.3.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-bump-cmake-minimum-version.patch"      # cmake_minimum_required 3.1 → 3.10（CMake 4 拒收）
  - "0002-sdsl-lite-make-tests-optional.patch"   # 关闭 sdsl-lite 自带 test 子目录（其测试联网下载数据）
  - "0003-portable-current-dir-name.patch"       # get_current_dir_name() 为 glibc 专有 → POSIX getcwd
  - "0004-optional-libatomic.patch"              # -latomic 改为 find_library 能力探测
  - "0005-jemalloc-optional.patch"               # jemalloc 链接改为 SEQWISH_USE_JEMALLOC 可选开关（默认 ON）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "制品仓 jemalloc/5.3.0 的静态库在本平台会让『任何』链接它的 C++ 可执行文件启动即 SIGSEGV（隔离复现：空 main + std::string/std::unordered_map 静态初始化，仅加 -ljemalloc 即 139，去掉即 0；-lpthread、libjemalloc_pic.a 同样崩）。该库本身无 glibc 专有符号（llvm-nm 扫描 __libc_*/_IO_* 命中 0），故不是 libc 归属错配，属依赖实现与平台运行时的兼容缺陷——配方侧改用平台自带分配器，并把上游硬编码的 jemalloc 链接改成可关开关（0005，默认 ON 保持上游行为）。（knowledge_ref: DRAFT-SEQWISH-0711-JEMALLOC-STATIC-RUNTIME-SIGSEGV）"
  - "上游 release tarball 里 deps/ 下 11 个 submodule 目录全空（GitHub 源码归档不含 submodule），且 mmmulti 自身还有 6 个嵌套 submodule（含 deps/mmmulti/deps/mio）、sdsl-lite 还引用 external/libdivsufsort——必须按 .gitmodules 的固定 commit 逐个取源（conandata 的 sources.submodules 共声明 13 条 = 11 个顶层 + mmmulti 的 mio + sdsl-lite 的 libdivsufsort；本机摸底台账另记 20 条，含未被构建引用的嵌套项），缺一个就在 configure 阶段以空目录/缺头文件失败。（knowledge_ref: DRAFT-SEQWISH-0711-SUBMODULE-CMAKE-OHOS-BUNDLE）"
  - "get_current_dir_name() 是 glibc 扩展，OHOS musl 不提供（编译期报隐式声明、链接期报未定义）——POSIX getcwd 版本等价替换即可，无需平台条件编译宏。（knowledge_ref: DRAFT-SEQWISH-0711-SUBMODULE-CMAKE-OHOS-BUNDLE）"
  - "CMake 4 已移除 cmake_minimum_required(<3.5) 的兼容层：上游 3.1 与 sdsl-lite 的 2.8 都会直接 configure 失败，前者抬版本号（0001），后者由父工程透传 CMAKE_POLICY_VERSION_MINIMUM=3.5 给 ExternalProject 子构建。（knowledge_ref: DRAFT-SEQWISH-0711-SUBMODULE-CMAKE-OHOS-BUNDLE）"
  - "上游 CMakeLists 把 sdsl-lite 的库文件按『全路径』写进 target_link_libraries，Ninja 生成器会判 no-known-rule 直接失败（ExternalProject 产物对生成器不可见）；换成 Unix Makefiles 即可（上游 CI 也是 Make）。（knowledge_ref: DRAFT-SEQWISH-0711-SUBMODULE-CMAKE-OHOS-BUNDLE）"
  - "父工程的 CMAKE_C_FLAGS/CMAKE_CXX_FLAGS/CMAKE_ARGS 会被 ExternalProject_Add 的 CMAKE_ARGS 继承（上游 sdsl-lite 子构建直接取父级同名变量），因此 -fopenmp、-I/-L 依赖路径、策略变量都能一次性透传，无需改上游子工程文件。（knowledge_ref: DRAFT-SEQWISH-0711-SUBMODULE-CMAKE-OHOS-BUNDLE）"
  - "上游只对 Darwin/Linux 分支配置 OpenMP，OHOS 的 CMAKE_SYSTEM_NAME=HarmonyOS 两个分支都不命中——交叉编译时需由配方显式提供 -fopenmp 编译与链接标志（平台提供的 libomp.so 在 sysroot/usr/lib/aarch64-linux-ohos/ 下）。（knowledge_ref: DRAFT-SEQWISH-0711-SUBMODULE-CMAKE-OHOS-BUNDLE）"

patch_generation:
  method: manual
  patches_count: 5
