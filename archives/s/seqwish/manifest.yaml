software: seqwish
display: "seqwish"
description: "seqwish — induce a variation graph from a set of sequences and their alignments (GFA/PAF↔FASTA toolkit)"
category: bio
homepage: "https://github.com/ekg/seqwish"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 tarball 的 deps/ 下 11 个 git submodule 全为空，需按 .gitmodules 固定 commit 取源（含 mmmulti 嵌套 mio 与 sdsl-lite 的 external/libdivsufsort）"
    - "jemalloc/5.3.0 静态库在 OHOS 上任何链接它的 C++ 可执行文件启动即 SIGSEGV，本包配方关闭 jemalloc（补丁 0005 将其改为可选开关）"
    - "上游仅 Darwin/Linux 分支配 OpenMP，OHOS 下需配方显式提供 -fopenmp"
    - "glibc 扩展 get_current_dir_name() 需替换为 POSIX getcwd（补丁 0003）"
  common_dependencies:
    - zlib

versions:
  "0.7.11":
    status: built
    build_date: "2026-10-01"
