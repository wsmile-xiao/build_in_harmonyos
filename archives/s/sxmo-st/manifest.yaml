software: sxmo-st
display: "sxmo-st"
description: "St terminal emulator for the Simple X Mobile (Sxmo) environment"
category: terminal
homepage: "https://git.sr.ht/~mil/sxmo-st"
license: MIT
build_system: posix-makefile

ohos_adaptation:
  key_points:
    - "POSIX Makefile recipe: config.mk rewritten at build time to inject conan dependency include/lib paths; CC=clang overrides the hardcoded c99."
    - "X11 headers are split across libx11/xorgproto/libxrender and freetype installs ft2build.h under include/freetype2/, so the recipe aggregates explicit -I/-L flags."
    - "Upstream has no automated tests; test_package verifies the binary (ELF hardening, linkage) and compiles plus links a non-assertion OHOS consumer test against real X11/Xft/fontconfig APIs; all 5 consumer API symbols statically verified as exported, real execution skipped by sandbox ACL (E011-class)."
  common_dependencies:
    - "libx11/1.8.13"
    - "libxft/2.3.9"
    - "fontconfig/2.18.3"
    - "freetype/2.14.3"
    - "xorgproto/2025.1"
    - "libxrender/0.9.12"
    - "pkgconf/3.0.6 (tool)"

versions:
  "0.8.4.1":
    status: built
    build_date: "2026-09-29"
    conan_ref: "sxmo-st/0.8.4.1@ohpcd/stable"

last_updated: "2026-09-29"
