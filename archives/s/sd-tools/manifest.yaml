software: sd-tools
display: "sd-tools"
description: "systemd 项目的一部分，提供 sysusers 和 tmpfiles 工具"
category: system
homepage: "https://github.com/systemd/systemd"
license: LGPL-2.1+
build_system: meson

ohos_adaptation:
  key_points:
    - "musl libc 不支持 glibc 扩展函数(fgetpwent/fgetgrent/putpwent等)，需要实现替代版本"
    - "libcap.pc 文件中的 libdir 路径需要修复"
    - "需要禁用 ACL 支持（musl 不支持）"
  common_dependencies:
    - libcap

versions:
  "0.99.0":
    status: published
    build_date: "2026-06-08"