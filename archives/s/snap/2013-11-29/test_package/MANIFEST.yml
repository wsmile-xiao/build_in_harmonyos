# test_package/MANIFEST.yml
# 上游官方测试声明文件
# snap 2013-11-29 上游测试清点（R51 三步法第一步）：
#   - 源码树无 tests/ 目录、无 check/test make 目标（Makefile 仅 default/gcc/
#     clean/depend/tar 五个目标）、无 ctest/pytest/meson 注册；
#   - 唯一的"测试性"资产是示例文件 example.zff（ZFF 格式样例标注）与
#     DNA/ 下的示例序列，供人工验证，不构成可执行测试；
#   - 结论：上游无成体系测试（0 个可执行用例），消费者测试由 test_package
#     自行设计（嵌入式确定性 fasta + stock minimal.hmm 真实预测断言）。

package: snap/2013-11-29
homepage: "https://github.com/KorfLab/SNAP"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无成体系测试，见顶部清点说明）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — --version 横幅、-help/--help 一致性、stock minimal.hmm 对嵌入式 1500bp 拟南芥样本的真实基因预测（逐字 GFF 行断言）、hmm-info 回读"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
