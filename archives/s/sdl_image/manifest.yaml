software: sdl_image
display: "SDL_image"
description: "Image loading library for SDL 1.2"
category: multimedia
homepage: "https://www.libsdl.org/projects/SDL_image/"
license: Zlib
build_system: autotools
status: built

ohos_adaptation:
  key_points:
    - "Uses published sdl12-compat/1.2.68 through a build-folder sdl-config wrapper for legacy AM_PATH_SDL."
    - "Keeps PNG, JPEG, TIFF and WebP codec support through published Conan dependencies."
    - "Uses an HMDFS umask 022 configure patch and GNU build/host tuples accepted by the legacy config.sub."
  common_dependencies:
    - sdl12-compat/1.2.68
    - libpng/1.6.39
    - libjpeg-turbo/3.2.0
    - libtiff/4.7.2
    - libwebp/1.6.0

versions:
  "1.2.12":
    status: built
    build_date: "2026-09-15"
