# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []
  note: |
    **零运行时依赖**。setuptools 把全部三方依赖 vendored 在
    setuptools/_vendor/ 内（实测目录内容）：packaging 26.0、wheel 0.46.3、
    more_itertools 10.8.0、platformdirs 4.4.0、tomli 2.4.0、zipp 3.23.0、
    importlib_metadata 8.7.1、jaraco.text 4.0.0、jaraco_context 6.1.0、
    jaraco_functools 4.4.0、autocommand 2.2.2、backports.tarfile 1.2.0。
    消费者只需 PYTHONPATH（由 package_info 的 runenv_info 声明）。

    上游 **test extra** 依赖较多且**未发布到 ohpcd**（实测 conan search：
    pytest / virtualenv / wheel-build / filelock / ini2toml / pytest-xdist /
    pytest-timeout 均 0 个），按 PF4 不得写成 test_requires → 构建期从平台
    pip 镜像取到独立目录后运行（见 conanfile.py UPSTREAM_TEST_REQUIRES）。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Python，无二进制产物；不产生 bindirs，
    故无需 commands.json，R38 不适用）。

    构建：get(源码) → build() 内 `python3 setup.py install --root=<stage>
    --prefix=/usr --single-version-externally-managed` → 运行上游 pytest →
    package() 按登台树原样 copy 到 lib/python3.12/site-packages。

    ⚠️ 两个实测要点：
    ① **自举，不需要宿主预装 setuptools**：setup.py 首行 `import setuptools`，
       而构建 cwd 就在解包根 → 解析到源码树自身的 setuptools（实测
       __file__ 指向解包目录、__version__=84.0.0）。这正是不走宿主借用的原因。
    ② **dist-info 是必需而非装饰**：setuptools/version.py 经
       `importlib.metadata.version('setuptools')` 取版本，纯手工 copy 的树会使
       `setuptools.__version__` 取不到值，故必须经 setup.py 装配元数据。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues: []
  notes: |
    纯 Python、无 C/C++ 扩展、无平台相关代码。**未修改任何上游文件**。
    对 OHOS 的唯一适配点是测试运行：新建文件/目录的属主被文件系统强制显示为
    挂载属主（20001006），与进程 uid 不一致，pytest 默认 <tmp>/pytest-of-<user>
    属主检查必然 INTERNALERROR → 传 --basetemp 绕过（meson 1.11.0.1 先例）。
    该适配只影响 build() 内的测试调用，不影响产物。

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  total: 1012
  passed: 928
  failed: 0
  skipped: 17
  note: |
    上游 pytest 套件（setuptools/tests）在 build() 内真实运行（R51），
    2026-09-19 设备实测（profile: ci/conan/profiles/ohos-aarch64）：
      **1 failed, 928 passed, 17 skipped, 51 deselected, 12 xfailed, 3 xpassed**
    - 1 failed = `test_wheel_mode`（test_wheel.py:689，
      `assert oct(...) == "0o777"` 实得 `0o770`）——**OHOS hmdfs 不忠实保存
      POSIX mode 位**（实测 chmod 0o777→0o770，others 位被整体丢弃），该断言
      在 OHOS 上不可能通过，已列入 ALLOWED_TEST_FAILURES 并逐条给出根因。
    - 51 deselected = 用**上游自带的** `uses_network` 标记排除（`-m "not
      uses_network"`）：构建沙箱无外网，这些用例经 urlopen 取 github raw，
      两次实测结果不稳定（一次通过一次失败），属网络可用性抖动而非适配缺陷。
    - 17 skipped + 12 xfailed + 3 xpassed 均为上游自身的版本/平台/预期失败标记。
    **清单外失败一律抛 ConanException 使 conan create 失败**，不做豁免、
    不静默降级；实测最终 `conan create` exit=0、Package created。
    test_package 消费者测试：**19/19 passed**（PEP 517 真实构建 wheel+sdist）。
    - 2026-09-20 修复：首轮 CI（#52255）在 pytest **配置期**中止
      （`PytestConfigWarning: Failed to import filter module 'coverage': ...`，
      输出无 FAILED 行 → 配方按 R9 报"运行器异常退出"）。根因是
      `UPSTREAM_TEST_REQUIRES` 只对齐了上游 **test** extra，漏掉两处上游隐含
      要求的依赖：① `pytest.ini:91` 引用的 `coverage.exceptions.CoverageWarning`
      （上游把 coverage 放在 **cover** extra，test extra 不含）；②
      `setuptools/tests/compat/py39.py` 顶层 import 的 `jaraco.test`（上游 test
      extra 里有，本清单曾漏列）。本地宿主恰好装了 coverage/pytest_cov/jaraco.test
      故本地通过、CI 失败。已把 `coverage` 与 `jaraco.test>=5.5` 补入清单；
      修复后本地按配方同款调用形态复验：配置期与收集期均通过
      （收集 961 项 / **0 errors**），逐文件跑完全部 36 个顶层 + 5 个 config 测试文件，
      唯一失败仍是清单内的 `test_wheel_mode`。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "setuptools 自举安装：其 setup.py 首行 import setuptools，只要构建 cwd 位于解包根即解析到源码树自身，因此构建**不需要**宿主预装 setuptools——这正是 greenlet CI #10488 报 No module named 'setuptools' 的根因所在（该配方当时只能借用宿主路径）(ref: DRAFT-ohos-setuptools-bootstrap-and-dist-info)"
  - "setuptools 的 dist-info 不是装饰而是必需：setuptools/version.py 经 importlib.metadata.version('setuptools') 取版本，纯手工 copy 的包目录树会让 setuptools.__version__ 取不到值，必须经 setup.py 装配元数据 (ref: DRAFT-ohos-setuptools-bootstrap-and-dist-info)"
  - "OHOS 上 pytest 默认 basetemp（<tmp>/pytest-of-<user>）会因文件系统把新建目录属主强制显示为挂载属主（20001006）而 INTERNALERROR: not owned by the current user；传 --basetemp 走 _given_basetemp 分支即可绕过（meson 1.11.0.1 / setuptools 84 均适用）(ref: E543-draft-DF80)"

references:
  - https://github.com/pypa/setuptools
  - https://setuptools.pypa.io/
