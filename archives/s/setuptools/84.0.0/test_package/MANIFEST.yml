# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: setuptools/84.0.0
homepage: "https://github.com/pypa/setuptools"

# 上游测试命令 — 上游为 pytest 套件（setuptools/tests，含 pytest.ini 配置
# --doctest-modules --import-mode importlib）
upstream_check_command: "python3 -m pytest setuptools/tests -q"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest setuptools/tests -q --no-header -p no:cacheprovider --basetemp=<build_folder>/pytest-basetemp（cwd=源码根；测试依赖自平台 pip 镜像取到 <build_folder>/test-deps 后置于 PYTHONPATH）"

# 上游实际运行的测试程序
upstream_tests:
  - file: setuptools/tests/
    source: setuptools-84.0.0/setuptools/tests/
    description: >-
      上游 pytest 套件（test_build_meta / test_build_py / test_config /
      test_dist / test_egg_info / test_installer / test_setuptools 等，
      含 --doctest-modules 的模块 doctest）；实测收集 1012 项
    command: "python3 -m pytest setuptools/tests -q"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_setuptools.py
    description: >-
      消费者视角真实 API（R34）：导入与版本、distutils 被 _distutils_hack
      劫持到包内 setuptools._distutils、build_meta 的 PEP 517 入口可调用，
      并**真实构建**一个最小 wheel 与 sdist（二者均在项目目录内构建，sdist
      断言收紧了包名-版本前缀以排除 UNKNOWN-0.0.0 退化产物）、生成
      METADATA，另核 vendored 依赖自足性（wheel/packaging 不应独立出现在
      site-packages）
    command: "python3 test_setuptools.py <site-packages-dir>"

# 测试断言总数（实测计数，非近似值）
#   实测 `setuptools 84.0.0 consumer API: 19/19 passed`（运行时打印的硬失败点
#   总数，任一条失败即 sys.exit(1)）。其中 PEP 517 入口可调用性一项在运行时
#   按 4 个入口展开，故运行时计数（19）高于源码静态 check() 调用点（16）。
assertion_count: 19

# 上游测试实测结果（R51 如实申报）
upstream_test_note: >-
  上游 pytest 套件在 build() 内真实运行，实测收集 1012 项；逐项通过/失败
  计数以 build/upstream-pytest-report.txt 为准。
  **未设允许失败清单**：suite 退出码非 0（含超时 2400s）时 conan create
  直接抛 ConanException 失败，不做豁免、不静默降级 —— 避免出现
  「测试没跑通但构建成功」的状态脱节。
  测试依赖（pytest>=6 / virtualenv / wheel / jaraco.* / ini2toml /
  pytest-xdist / pytest-timeout / pytest-home / pytest-subprocess 等）未发布
  到 ohpcd（PF4 禁止写成 test_requires），故构建期从平台 pip 镜像取到
  <build_folder>/test-deps 后作为 PYTHONPATH 运行；取依赖失败则显式抛错
  并附 pip 尾部输出，不以"跳过"冒充通过。
