# test_package/MANIFEST.yml — scrub 2.6.1-git20240819.9b4267e
package: scrub/2.6.1-git20240819.9b4267e
homepage: "https://github.com/chaos/scrub"

# 上游测试命令（test/Makefile.am 注册 TESTS=t01..t22 + 无 libgcrypt 时 t00，
# 共 23 项；由配方 build() 内 make check 集成运行，见 conanfile.py _run_make_check）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游实际运行的测试程序（test/ 目录 23 个 tNN 脚本 + 8 个辅助程序）
upstream_tests:
  - file: test/t01
    source: scrub-2.6.1-git20240819.9b4267e/test/t01
    description: "5G 稀疏文件默认 pattern 擦写 + -T/--test-sparse 大文件支持"
    command: "make check（TESTS=t01..t22）"
  - file: test/t13
    source: scrub-2.6.1-git20240819.9b4267e/test/t13
    description: "目录擦写/-X/不存在文件路径（unset TMPDIR 强制 /tmp，真机只读 ⇒ 环境性 FAIL）"
    command: "make check（TESTS=t01..t22）"
  - file: test/Makefile.am
    source: scrub-2.6.1-git20240819.9b4267e/test/Makefile.am
    description: "N=23 清点权威来源：TESTS=t01..t22 无条件注册，LIBGCRYPT 为假时条件追加 t00"
    command: "grep TESTS test/Makefile.am"

# test_package 中自带的测试（消费者视角验证，真跑包内 bin/scrub）
test_package_tests:
  - file: test.sh
    description: "顶层判定 5 项：A1 --version 与包版本一致；A2 fillff 擦写 64KiB 后逐字节 0xff；A3 --dry-run 不落盘；A4 默认 pattern + -r 擦写后 unlink；E2E-1 完整安全擦除端到端消费者用例（6 步：种子载荷+默认 NNSA 多 pass 擦写横幅/擦写行 → random×2/0x00/verify 四 pass 行齐全 → 载荷区 12B 清零+文件头 SCRUB_MAGIC 逐字节 → 二次擦写被签名拦截 rc=1 → -f 强制重擦后 -r unlink → -S 不写签名对照可重复擦写）。设计依据：README.md Examples L91-L102、man/scrub.1.in EXAMPLES L213-L224 与 -r/-f/-S 选项条目 L46-L71、src/sig.c:28 SCRUB_MAGIC"
    command: "sh test.sh（经 conanrun env）"

# 测试断言/用例总数（A1-A4 四项断言 + E2E-1 端到端消费者用例 1 项 = 5；E2E-1 内含 6 步真判定，全部由最终设备日志复算）
assertion_count: 5
