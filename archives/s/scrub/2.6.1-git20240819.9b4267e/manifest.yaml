knowledge_gained:
  - "musl 对已 join 的线程句柄二次 pthread_join 是确定性 SIGSEGV（glibc 容忍），join 后必须清句柄、清理路径只 join 非零句柄" # knowledge_ref: E657
  - "musl 对管道 stdout 逐行刷新而 glibc 全缓冲，2>&1 与检入 .exp 比较的测试套会因交错顺序 FAIL，main 入口 setvbuf(stdout, _IOFBF) 统一" # knowledge_ref: E658
  - "git 快照形态 tarball（AC_INIT 用 m4_esyscmd(git describe)）无 .git 时版本取空，需字面量化；musl 下 config.guess 需 *:HarmonyOS:*:* 识别块（uname -s == HarmonyOS）" # knowledge_ref: E657

test_package:
  assertion_count: 5
  description: "真跑包内 scrub 二进制，顶层判定 5 项 = A1–A4 四项断言（--version 与包版本一致、fillff 擦写 64KiB 逐字节 0xff、--dry-run 不落盘、默认 pattern 擦写后 unlink）+ E2E-1 完整安全擦除端到端消费者用例（6 步真判定：默认 NNSA 多 pass 擦写横幅/进度 → random×2/0x00/verify 四 pass 行齐全 → 载荷区清零与文件头 SCRUB_MAGIC 签名逐字节 → 二次擦写被签名拦截 rc=1 → -f 强制重擦 + -r 删除 → -S 不写签名对照）。设计依据：README.md Examples、man/scrub.1.in（EXAMPLES 与 -r/-f/-S 条目）。"
