# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 软件名
software: "ska"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/simonrharris/SKA/archive/refs/tags/v1.0.tar.gz"

  # 源码校验和
  sha256: "fc6110c22c756158b190f50dc11d596265f9b0d09c28725b2b23ed22e2e4fbff"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - zlib/1.3.1
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "纯 Makefile 项目（硬编码 g++/-lz）通过 make 变量覆盖 CXX/CXXFLAGS/LDFLAGS 即可适配 OHOS，零补丁"  # ref: E174
- "上游 googletest 内嵌式测试（tests/googletest）可改链制品仓 gtest/1.17.0 预编译包，测试编译需 -std=c++17"  # ref: E342
- "GitHub tarball 在 Python urllib 下超时可用 curl 预下载到 $TMPDIR/builds/，init-build 检测已存在自动跳过"  # ref: E347
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
