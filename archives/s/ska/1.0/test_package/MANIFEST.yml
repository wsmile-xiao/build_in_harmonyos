# test_package/MANIFEST.yml — ska 1.0
# CI L0e requires this file to exist.

package: ska/1.0
homepage: "https://github.com/simonrharris/SKA"

# Upstream test suite: 3 googletest programs under tests/ (general, kmers, DNA),
# built via tests/Makefile. Run during adaptation on OHOS aarch64 (see notes.md):
# 27/27 passed, 0 failed, 0 skipped.
upstream_check_command: "make -C tests"
upstream_test_in_build: false
upstream_test_command: "tests/general_unittest && tests/kmers_unittest && tests/DNA_unittest"
upstream_tests:
  - file: tests/general_unittest.cpp
    cases: 6
    names: "splitFileNameTest.OneSlash, splitFileNameTest.MultipleSlashes, openFileStreamTest.FileExists, openFileStreamTest.FileDoesNotExist, openFileStreamTest.FileStreamAlreadyOpen, openFileStreamTest.Verbosity"
  - file: tests/DNA_unittest.cpp
    cases: 15
    names: "complementTest.bases, complementTest.IUPAC, reverseComplementIsMinTest.reverseIsMin, reverseComplementIsMinTest.reverseIsNotMin, reverseComplementIsMinTest.palindrome, lowqualitytoNTest.belowMinQuality, lowqualitytoNTest.aboveMinQuality, lowqualitytoNTest.noLowQuality, IUPACToNTest.allACGT, IUPACToNTest.withN, IUPACToNTest.withIUPAC, IUPACToNTest.nonIUPAC, ascii_codonsTest.codonsToAscii, codons_from_asciiTest.codonsFromAscii, circulariseSequenceTest.circulariseSequence"
  - file: tests/kmers_unittest.cpp
    cases: 6
    names: "ascii_bitstringTest.divisibleBy6, ascii_bitstringTest.notDivisibleBy6, vectorbool_from_asciiTest.allFalse, vectorbool_from_asciiTest.allTrue, extractMiddleBaseTest.oddBases, extractMiddleBaseTest.evenBases"

# test_package tests (consumer perspective, OHOS)
test_package_tests:
  - file: test.sh
    description: "OHOS consumer end-to-end case: ska version, fasta->split kmer file, info readback, gzip-compressed fasta input (zlib linkage), distance matrix generation"
    command: "bash test.sh"

assertion_count: 5
