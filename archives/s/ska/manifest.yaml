# 软件级 manifest — ska
# 遵循 ARCHIVE-SPEC v2.0

software: ska
display: "SKA"
description: "SKA (Split Kmer Analysis) — 基于 split kmer 的原核（小型单倍体）基因组比较分析工具箱，用于细菌基因组流行病学与疫情调查"
category: bioinformatics
homepage: "https://github.com/simonrharris/SKA"
license: MIT
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游纯 Makefile 项目：硬编码 CXX=g++、LDFLAGS=-lz，配方通过 make 变量覆盖（CXX/CXXFLAGS/LDFLAGS），无需补丁"
    - "上游 tests/Makefile 期望 tests/googletest/ 内嵌 gtest 源码，改为链接制品仓 gtest/1.17.0 预编译包，避免向仓库混入依赖库源码"
    - "gtest 1.17 需 C++14+，测试编译用 -std=c++17；被测库本体保持 -std=c++0x (C++11)"
    - "zlib 为系统同名库，使用制品仓静态包 libz.a（R26）"
  common_dependencies:
    - zlib/1.3.1

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0":
    status: published
    build_date: "2026-09-21"
