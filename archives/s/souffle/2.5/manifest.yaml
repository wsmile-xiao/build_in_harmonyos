software: souffle
build_system: cmake
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/souffle-lang/souffle/archive/refs/tags/2.5.tar.gz"

  # 源码校验和
  sha256: "5d009ad6c74ccec10207d865c059716afac625759bff7c8070e529bd80385067"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DSOUFFLE_USE_CURSES=OFF"
    - "-DSOUFFLE_USE_ZLIB=OFF"
    - "-DSOUFFLE_USE_SQLITE=OFF"
    - "-DSOUFFLE_USE_OPENMP=OFF"
    - "-DSOUFFLE_USE_LIBFFI=OFF"
    - "-DSOUFFLE_GIT=OFF"
    - "-DSOUFFLE_ENABLE_TESTING=OFF"
    - "-DCMAKE_CXX_COMPILER=clang++"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cmake FindCurses在HarmonyOS平台无法识别ncursesw静态库，需SOUFFLE_USE_CURSES=OFF绕过"
  - "souffle默认需要mcpp/gcc预处理器，本平台缺少这些工具，用户需用--no-preprocessor运行"
  - "souffle编译输出模式(-o)在HarmonyOS因libc++ ABI不兼容导致链接失败"
  - "tarball构建souffle时需禁用SOUFFLE_GIT=OFF，否则cmake因无git仓库而报错"
  - "init-build脚本会从URL格式猜测构建系统，cmake项目可能被误判为autotools"
