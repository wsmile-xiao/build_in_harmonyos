# test_package/MANIFEST.yml for sgc 3.6.0
# Upstream official test declaration. CI script (build_and_test.sh L0e)
# requires this file to exist.

package: sgc/3.6.0
homepage: "https://github.com/libsigcplusplus/libsigcplusplus"

upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test"

