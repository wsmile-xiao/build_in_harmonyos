# conandata.yml for sgc 3.6.0
# Upstream libsigc++ release tarball (GitHub release).
# NOTE: the URL path uses the literal `++`, not percent-encoded `%2B%2B`.
# Conan get() percent-decodes file:// paths; with `%2B%2B` the decoded
# filename (libsigc++-...) does not match the predownload cache filename
# (libsigc%2B%2B-...), causing FileNotFoundError in source().

sources:
  "3.6.0":
    url: "https://github.com/libsigcplusplus/libsigcplusplus/releases/download/3.6.0/libsigc++-3.6.0.tar.xz"
    sha256: "c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17"

patches: {}
