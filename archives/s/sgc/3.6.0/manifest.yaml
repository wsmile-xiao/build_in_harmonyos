software: sgc
version: "3.6.0"
status: built
build_date: "2026-09-19"
build_system: meson

source:
  url: "https://github.com/libsigcplusplus/libsigcplusplus/releases/download/3.6.0/libsigc++-3.6.0.tar.xz"
  sha256: "c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17"
  tar_format: tar.xz

build:
  system: meson

  configure_options:
    - "-Ddefault_library=static"
    - "-Dwrap_mode=nofallback"
    - "-Dbenchmark=false"
    - "-Dcpp_std=c++17"

  dependencies: []

  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Meson is the only supported build system for 3.6.0 release tarball (no pre-generated configure script)"
  - "Meson native file needs absolute llvm-ar pin on OHOS CI workers (E481 pattern)"
  - "Upstream build-tests option builds 40 test executables run via meson test in build()"
