software: streamlink
# 软件级 manifest（版本索引）
# 文件位置: archives/s/streamlink/manifest.yaml

description: "命令行流媒体提取工具，支持数百个流媒体网站"

# 软件分类
category: multimedia

# 官方网站
homepage: https://streamlink.github.io/

# 源码仓库
source_repo: https://github.com/streamlink/streamlink

# 构建系统类型
build_system: python

# 最新编译版本（自动更新）
latest_version: 8.4.0

# 版本索引（所有已编译版本）
versions:
  - version: "8.4.0"
    status: published
    build_date: "2026-05-21"
    tarball: streamlink-8.4.0-ohos-aarch64.tar.gz

# 编译依赖
dependencies:
  required:
    - libxml2 >= 2.15.3
    - libxslt >= 1.1.45
  optional: []

# 注意事项
notes:
  - "Python 项目，需先编译 C 扩展依赖"
  - "lxml 需要 libxml2/libxslt 系统库"