software: streamlink
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/8.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.4.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（PyPI）
  url: "https://files.pythonhosted.org/packages/source/s/streamlink/streamlink-8.4.0.tar.gz"

  # 源码校验和（待填写）
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（Python 项目）
  # cmake | autotools | makefile | meson | custom | python
  system: python

  # 配置选项列表
  configure_options: []
  # Python 项目使用 pip install --prefix=~/usr/local

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libxml2/2.15.3"
    - "libxslt/1.1.45"
    # Python 包依赖（pip 安装）：
    # - lxml/6.1.1
    # - pycryptodome/3.23.0
    # - PySocks/1.7.1
    # - trio/0.33.0
    # - trio-websocket/0.12.2

  # 编译器（Python 项目不使用）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# Python 项目无需补丁

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python 项目需要先编译 C 扩展依赖（如 lxml 需要 libxml2/libxslt）"
  - "使用 pip install --prefix=~/usr/local 安装 Python 包"
  - "Python 依赖包可使用 pip 直接安装，但 C 扩展包需要预先安装系统库"
