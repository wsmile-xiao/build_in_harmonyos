package: shml/1.1.0
homepage: "https://github.com/odb/shml"

# Upstream `make test`: 2 shell-source smoke checks (bash, zsh) + the shunt suite
# (test/*_tests.sh: 9 files, 142 assert_equal call sites, 172 runtime assertions).
# shunt is downloaded by upstream with curl|bash at test time; the recipe pins shunt v0.3.1
# (sha256 in conandata.yml) and runs the 9 unmodified files inside build().
upstream_check_command: "bash shunt/shunt.sh --plain --verbose test/*_tests.sh"
upstream_test_in_build: true
upstream_test_command: "bash shunt/shunt.sh --plain --verbose test/*_tests.sh (172/172 assertions pass)"

upstream_tests: 172

test_package_tests:
  - file: consumer.c
    description: "Harmony-specific consumer flow (1 case): conanfile.py sources the packaged shml.sh with bash and calls fgcolor/bgcolor/attribute/hr/icon; the output is embedded in a header, an OHOS aarch64 static C program is compiled with the profile clang and executed (qemu-aarch64 on x86 hosts), parsing 6 SGR codes and the plain text against ECMA-48 oracles. test() also runs 'bash $SHML_SCRIPT -v' via the package runenv."
    command: "conan create archives/s/shml/1.1.0 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 (run from the repo root)"

assertion_count: 6
