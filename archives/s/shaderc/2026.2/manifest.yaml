software: shaderc
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2026.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2026.2"

# 构建系统类型（顶层字段，verify-build 依赖）
build_system: cmake

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/google/shaderc/archive/refs/tags/v2026.2.tar.gz"

  # 源码校验和
  sha256: "f924178e75e3293082481b25ed64d5e48a795b479dac3bd3c83d23070855df42"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DSHADERC_SKIP_TESTS=ON"
    - "-DSHADERC_SKIP_EXAMPLES=ON"
    - "-DSHADERC_SKIP_COPYRIGHT_CHECK=ON"
    - "-DSHADERC_ENABLE_WERROR_COMPILE=OFF"
    - "-DSPIRV_SKIP_TESTS=ON"
    - "-DENABLE_RTTI=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
