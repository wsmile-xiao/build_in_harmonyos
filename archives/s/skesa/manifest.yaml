software: skesa
display: "SKESA"
description: "NCBI SKESA - Strategic K-mer Extension for Scrupulous Assemblies（De novo 序列组装工具）"
category: utility
homepage: "https://github.com/ncbi/SKESA"
license: Public Domain
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile.nongs 通过覆盖 make 变量（CC/CFLAGS/LIBS）驱动，移除 x86 专属的 -msse4.2 标志"
    - "仅链接 SKESA 实际使用的 4 个 Boost 编译库（program_options/iostreams/regex/timer）；chrono/system 在 Boost 1.84 为 header-only 不链接"
    - "OHOS C++ 可执行文件需签名（llvm-objcopy --remove-section .codesign + binary-sign-tool --selfSign）并以 libc++_shared.so 运行"
  common_dependencies:
    - boost
    - zlib

versions:
  "2.4.0":
    status: built
    build_date: "2026-09-19"
