# conandata.yml — SKESA 2.4.0
# Official upstream (NCBI / SRA Toolkit project):
#   source   : GitHub tag tarball (ncbi/SKESA @ 2.4.0)
#   testdata : official release asset example.tar.gz (sample reads + run.test)

sources:
  url:
    # Mirror-first via gh-proxy.com (matches the repo's GitHub mirror mapping
    # in ci/conan/build_and_test.sh and the committed convention in e.g.
    # sonic / sml).  gh-proxy.com only mirrors the exact same upstream archive
    # bytes; conan get() falls back to the official GitHub URL last, and the
    # sha256 below still hard-validates the content either way.
    - "https://gh-proxy.com/https://github.com/ncbi/SKESA/archive/refs/tags/2.4.0.tar.gz"
    - "https://github.com/ncbi/SKESA/archive/refs/tags/2.4.0.tar.gz"
  sha256: "c07b56dfa394c013e519d5a246b7dee03db41d8ac912ab9ca02cf4d20bf13b15"

# Official upstream functional test data (NCBI release asset).  Contains
# paired-end reads SRR5449060_1.fasta / SRR5449060_2.fasta, the reference
# assembly SRR5449060.skesa.fa/log, and the run.test launcher script.
testdata:
  url:
    # Mirror-first via gh-proxy.com for the same reason as sources above:
    # the device's direct github.com connection to this release asset timed
    # out in preflight; the mirror carries the identical archive and the
    # sha256 still validates it.  Official GitHub URL kept last as fallback.
    - "https://gh-proxy.com/https://github.com/ncbi/SKESA/releases/download/2.4.0/example.tar.gz"
    - "https://github.com/ncbi/SKESA/releases/download/2.4.0/example.tar.gz"
  sha256: "efac638b931a7ef6cddf7f11c072601953bea63fc5bee278f78db83d5306c1d8"

patches:
  # OHOS libc++ portability: on libc++ std::vector<char>::const_iterator and
  # std::string::const_iterator are both std::__wrap_iter<const char*>, so
  # SKESA's two iterator constructors (Integer.hpp) would be a redeclaration
  # ("constructor cannot be redeclared").  Feature/type-based SFINAE guard: the
  # vector<char> constructor is only provided when the two iterator types
  # actually differ (libstdc++/MSVC); on libc++ the string constructor already
  # covers vector<char> iterators (same type).  R8-compliant (no platform macro).
  - patch_file: "patches/0001-integer-libcxx-iterator-collision.patch"
    patch_description: "Guard IntegerTemplate's std::vector<char>::const_iterator constructor behind SFINAE so it is only defined when it does not alias std::string::const_iterator (libc++ aliases both to __wrap_iter<const char*>)."
    patch_type: "portability"
