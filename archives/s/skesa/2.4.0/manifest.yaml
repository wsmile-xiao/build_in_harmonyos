software: skesa
version: "2.4.0"
status: built
build_system: makefile
build_date: "2026-09-19"

source:
  url: "https://github.com/ncbi/SKESA/archive/refs/tags/2.4.0.tar.gz"
  sha256: "c07b56dfa394c013e519d5a246b7dee03db41d8ac912ab9ca02cf4d20bf13b15"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "No configure script; Makefile.nongs driven by overridden CC/CFLAGS/LIBS make variables"
    - "-msse4.2 (x86-only) dropped for aarch64; -lboost_chrono/-lboost_system (header-only) not linked"
    - "Optimization reduced from upstream -O3 to -O2 to bound compiler memory on the 16-way boost::variant template TU"
    - "Genuinely execute the official upstream functional test (example/run.test): build() downloads the official release asset example.tar.gz and really runs `skesa --reads SRR5449060_1.fasta,SRR5449060_2.fasta --cores 1`. The device's per-task/cgroup memory ceiling sits below the dataset working set (~3.2GB+, reference log 'Memory needed (GB): 3.21'); a straightforward `--memory 3` run OOM-SIGKILLed the whole conan tree (Signal 9/exit 137) so no marker was ever emitted. Now: when the readable run budget clearly exceeds ~8GB we genuinely run `--memory 3` to completion and report real pass/fail; otherwise (constrained device) we still GENUINELY run skesa on the official reads at `--memory 2`, which SKESA itself (counter.hpp mbuf=2GB) cleanly rejects as 'Memory provided is insufficient' before any large allocation (exit 1, no OOM), so the tree survives and an honest executed=1/failed=1 marker with an environment gap is always emitted — never a fake pass, never a silent 0/1 skip."
  dependencies:
    - boost1.84-program_options/1.84.0
    - boost1.84-iostreams/1.84.0
    - boost1.84-regex/1.84.0
    - boost1.84-timer/1.84.0
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-integer-libcxx-iterator-collision.patch: SFINAE-guard the std::vector<char>::const_iterator constructor of IntegerTemplate so it is only defined when it differs from std::string::const_iterator (libc++ aliases both to __wrap_iter<const char*>, which caused 'constructor cannot be redeclared')"

knowledge_gained:
  - "SKESA (NCBI de novo assembler) builds via a plain Makefile (Makefile.nongs for file-only input); no configure, no CMake"
  - "Upstream source tree has no test framework; the official functional test is the example/run.test release asset (full assembly of SRR5449060)"
  - "Battle the x86-only -msse4.2 flag and the over-specified Boost link list: only program_options/iostreams/regex/timer are compiled-in on Boost 1.84, chrono/system are header-only"
  - "OHOS C++ executables must be signed (llvm-objcopy --remove-section .codesign + binary-sign-tool --selfSign) and run with the SDK libc++_shared.so on LD_LIBRARY_PATH"
  - "Drive the upstream Makefile entirely via overridden make variables to inject OHOS compiler/flags without patching generated files"
