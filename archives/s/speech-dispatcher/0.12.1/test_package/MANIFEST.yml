# test_package/MANIFEST.yml — speech-dispatcher 0.12.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: speech-dispatcher/0.12.1
homepage: "https://freebsoft.org/speechd"

# 上游测试：src/tests 是 automake testsuite（check_PROGRAMS + testsuite.at），
# 依赖运行中的 speech-dispatcher 守护进程、D-Bus 与声音设备——OHOS 沙箱无，
# 按 rule 1.2 如实声明平台限制（非跳过）；make check 尝试执行并记录结果。
upstream_check_command: "make check -C src/tests"
upstream_test_in_build: true
upstream_test_command: "make check -C src/tests"

upstream_tests:
  - file: src/tests/
    source: speech-dispatcher-0.12.1/src/tests/*.at
    description: "speech-dispatcher automake testsuite（check_PROGRAMS + testsuite.at）——依赖运行中的 daemon + D-Bus + 声音设备，OHOS 无，按 rule 1.2 平台限制声明"
    command: "make check -C src/tests"

# test_package 消费者测试（R34 真实产物校验：libspeechd.so + libspeechd.h）
test_package_tests:
  - file: test_speech_dispatcher.py
    description: "Verifies lib/libspeechd.so exists + is valid aarch64 ELF shared object (ET_DYN); include/libspeechd.h present"
    command: "python3 test_speech_dispatcher.py"

# 断言总数：3（libspeechd.so 存在 + ELF + libspeechd.h 存在）
assertion_count: 3
