# 版本级 manifest — speech-dispatcher 0.12.1
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "0.12.1"

# 软件名
software: speech-dispatcher

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游 brailcom/speechd 官方 release tarball，gh-proxy 镜像）
  url: "https://gh-proxy.com/https://github.com/brailcom/speechd/releases/download/0.12.1/speech-dispatcher-0.12.1.tar.gz"

  # 源码校验和（sha256，实测）
  sha256: "b14a5238d287d2dcce4dd42bbd66ca65fa228e7e683708267f7b34036f7ba4b4"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "speech-dispatcher-0.12.1"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "glib/2.84.0"
    - "libdotconf/1.4.1"
    - "libsndfile/1.2.2"
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: "autotools 构建；关闭可选 TTS/音频后端（--without-espeak/flite/pulse/alsa 等，OHOS 沙箱无实际声卡/合成器）；依赖注入沿用 polkit 模式（私有 .pc + prefix 改写 + PKG_CONFIG_PATH）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: medium
  issues: []
  notes: "speech-dispatcher 守护进程依赖运行中的语音合成后端与声音设备——OHOS 无，daemon 运行类功能按平台限制声明；libspeechd 客户端库编译可用"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 0
  failed: 0
  note: |
    上游测试：src/tests 是 automake testsuite（check_PROGRAMS + testsuite.at），
    依赖运行中的 speech-dispatcher 守护进程、D-Bus 与声音设备——OHOS 沙箱无；
    实测 make check -C src/tests 在链接 test 二进制时失败（libspeechd.so 的
    gettext 符号 bindtextdomain/dgettext/gettext 等在 OHOS libintl 空 stub 下
    无定义，且 testsuite 需运行中的 daemon）——按 rule 1.2 如实声明平台限制
    （非跳过），make check 已尝试执行并记录结果。
    本地验证：conan create 通过，libspeechd 客户端库与头文件编译链接成功。
    适配后：test_package R34 真实产物校验——libspeechd.so 存在 + ELF shared
    object + libspeechd.h 存在（1/1 = 100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "speech-dispatcher 是语音合成接口（brailcom/speechd）：libspeechd 客户端库 + daemon + 多个 TTS 后端模块；autotools 构建，硬依赖 glib/dotconf/sndfile（ohpcd 均可用）；可选后端用 --without-* 关闭"
  - "audio/TTS 后端（espeak/flite/pulse/alsa）在 OHOS 沙箱无实际设备——daemon 运行类测试按 rule 1.2 平台限制声明，libspeechd 客户端库可编译打包"

references:
  - https://freebsoft.org/speechd
  - https://github.com/brailcom/speechd
