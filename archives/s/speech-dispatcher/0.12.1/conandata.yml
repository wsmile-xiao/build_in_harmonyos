# conandata.yml — speech-dispatcher 0.12.1
sources:
  # 上游为 brailcom/speechd（freebsoft.org 项目）。官方发布 tarball 直链
  # github.com 在 OHOS 沙箱 404，用 gh-proxy 镜像（sha256 实测）。
  url:
    - "https://gh-proxy.com/https://github.com/brailcom/speechd/releases/download/0.12.1/speech-dispatcher-0.12.1.tar.gz"
