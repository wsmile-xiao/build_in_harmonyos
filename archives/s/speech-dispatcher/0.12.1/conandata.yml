patches:
  "0.12.1":
    - patch_file: "patches/0001-common-sndfile-cflags.patch"
      patch_description: "src/common/Makefile.in：libcommon_la_CPPFLAGS 漏 $(SNDFILE_CFLAGS)——speak_queue.c 用 sndfile.h 但编译参数无头文件路径（configure 已检测 sndfile，src/modules 已正确引用）。补 Makefile.in（非 .am）避免 make 触发 automake 重新生成"
      patch_type: "portability"
    - patch_file: "patches/0002-modules-dotconf-cflags.patch"
      patch_description: "src/modules/Makefile.in：AM_CPPFLAGS 漏 $(DOTCONF_CFLAGS)——module_utils.h 用 dotconf.h 但多数模块 target 编译时无 dotconf 头路径（仅部分 target 的 CPPFLAGS 显式带）"
      patch_type: "portability"
