# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: sbc/2.1
homepage: "https://www.kernel.org/pub/linux/bluetooth/"

# 上游**没有**自动化测试套件：tarball 内 src/ 仅 sbcenc/sbcdec/sbcinfo
# 三个工具源码，无 tests/ 目录、无 check 目标、无 *test* 源文件
# （2026-09-16 对 sbc-2.1.tar.xz 实测）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_sbc.c
    description: >-
      消费者功能测试：配置 44.1kHz 立体声 SBC 流（8 blocks / 8 subbands /
      bitpool 53），sbc_encode 编码一帧确定性 PCM（断言产出非空），sbc_decode
      解回（断言帧数 ≥1 且解码字节数与编码输入严格一致——帧结构契约），失败
      即非零退出。
