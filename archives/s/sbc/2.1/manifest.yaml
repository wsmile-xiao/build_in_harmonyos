# 版本级 manifest —— sbc 2.1
# 遵循 ARCHIVE-SPEC v2.0

version: "2.1"
software: sbc

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-16"
build_system: autotools

source:
  url: "https://mirrors.edge.kernel.org/pub/linux/bluetooth/sbc-2.1.tar.xz"
  sha256: "426633cabd7c798236443516dfa8335b47e004b0ef37ff107e0c7ead3299fcc2"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl --host=aarch64-unknown-linux-gnu（显式三元组保持 cross 模式，同 libcdaudio 先例）"
    - "--prefix=/"
    - "configure/make 以 < /dev/null 供给 stdin（任务环境 fd0 关闭时 autoconf 的 exec 7<&0 会失败）"
    - "configure 脚本 umask 077→022 改写（hmdfs 不保留权限位）"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash（toybox sh 无 IFS 词分割）"
    - "CC 从 profile 的 tools.build:compiler_executables 显式导出"
    - "构建环境显式清空 LD_LIBRARY_PATH（部分 CI worker 的 ambient 指向不兼容 libxml2 会破坏 SDK lld——同 libodfgen/libabw 根因）"
    - "--disable-tester：上游自测工具 sbctester 硬依赖 libsndfile（平台无此依赖），用上游自带开关排除（库与 sbcenc/sbcdec/sbcinfo 工具不受影响）"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "kernel.org 直发的蓝牙栈小库（sbc）为自包含 autotools 工程：configure 预生成、零外部依赖、src/ 含三个命令行工具——交付库+工具双形态"
