# 软件级 manifest：snpomatic
software: snpomatic
display: "SNP-o-matic"
description: "严格型短序列比对与 SNP 检出套件（findknownsnps / reassemble / variety / mapcontigs）"
category: data
homepage: "https://github.com/magnusmanske/snpomatic"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "裸 Makefile 无 all/install 目标：默认目标只是 Makefile:13 的 findknownsnps，配方必须显式枚举构建目标并手工 copy 产物"
    - "零第三方编译依赖（Makefile:4 LIBS=-lm），故无 requires、无 R36 依赖发布门槛"
    - "目标 ungap 在 tag v1.0 源码不自洽（4 实参调 5 参函数），属上游缺陷：不构建、不改源码，完整披露"
  common_dependencies: []

versions:
  "1.0":
    status: built
    build_date: 2026-09-25
