# test_package/MANIFEST.yml
# 上游官方测试声明（CI L0e 读此件；口径见 docs/TEST_QUALITY_SPEC.md）
#
# 六形取证（2026-09-25 在解包后的官方 tag 归档里逐形实测，全部为 0）：
#   1) tar 清单：15 个文件，无 tests/ 目录、无 t/tc 用例文件
#      （find . -iname "*test*" -o -iname "*.vcf" -o -iname "*.sam" -o -iname "*.fa" ⇒ 0 命中）
#   2) Makefile 目标：findknownsnps/reassemble/variety/mapcontigs/ungap/.cpp.o/clean，
#      无 check、无 test（grep -cE "^(test|check)" Makefile = 0），亦无 TESTS 变量
#   3) CI 文件：归档内无 .github/ 与任何流水线定义
#   4) 语料：包内无参考数据/期望输出件（唯一数据样件是 doc/Manual.doc，44032 B，文档）
#   5) 源码自测：src/ 内无 assert 驱动、无 main 自带自检路径
#   6) 自带测试脚本：无 run_test*/test.sh*
#   ⇒ 上游自动化测试分母 = 0（不是"没找"，是六形都空）。
#   注意：Debian 侧另有 autopkgtest（debian/tests/test-example + ref.fasta，
#   依赖 wgsim/samtools），那是**下游打包件**，不在本 upstream tag 内，
#   故不计入上游分母；其思路（喂 reads 再断言 out.gff 非空）被本棒
#   test_package 用自造冻结语料复现，且不依赖 samtools。

package: snpomatic/1.0
homepage: "https://github.com/magnusmanske/snpomatic"

# 上游无 check/test 目标 ⇒ 无测试命令可枚举
upstream_check_command: "make -n check  # 上游无该目标：Nothing to be done / No rule to make target"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_package/test.sh
    description: "从 conanrun PATH 真跑四个已安装程序：产物可见性 4 条、缺参路径 2 条、功能输出逐字对照 4 条（含 5 reads/2 matched 结果行）、--gffout 输出件 2 条、另三程序各自 rc+首行 6 条"
    command: "bash test.sh"

# 真跑断言数：test.sh 内 ok 计数，末行有防漂移自检 [ "$n" = 18 ]
assertion_count: 18
