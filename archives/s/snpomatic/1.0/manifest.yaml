# 版本级 manifest：snpomatic/1.0
version: "1.0"
software: "snpomatic"
status: built
build_date: "2026-09-25"
build_system: "makefile"

source:
  url: "https://github.com/magnusmanske/snpomatic/archive/refs/tags/v1.0.tar.gz"
  sha256: "b90123226e24edfa5c2ca296f9414b5aa005d3da77ad80b5c576adddbb38a094"
  tar_format: tar.gz
  # 取源复验：与 Debian snpomatic_1.0.orig.tar.gz 逐字节相同
  # （66546 B / 同一 sha256 / cmp 0 差异），故用官方 tag，哈希未改动。

build:
  system: makefile
  configure_options: []          # 上游无 configure 脚本
  # 显式目标（上游无 all）：CXX 由 tools.build:compiler_executables 提供
  make_targets:
    - findknownsnps
    - reassemble
    - variety
    - mapcontigs
  not_built:
    - target: ungap
      reason: "上游缺陷：src/ungap.cpp:261 以 4 个实参调用 5 参 align_solexa_paired（src/snpomatic.h:179 无默认实参），任何标准 C++ 编译器都拒绝；不打补丁、不改源码"
  dependencies: []               # 零依赖：Makefile:4 仅 LIBS=-lm
  cc: clang
  cxx: clang++

patches_applied: []              # 本包无补丁

knowledge_gained:
  - "裸 Makefile 无 all/install 目标时：make 命令行覆盖 CXX（命令行变量优先于 Makefile 内赋值），产物手工 copy 进 bin/"
  - "上游 tag 归档 == Debian .orig 时，PF7 用官方 tag、sha256 一字不动"
  - "上游非默认目标的源码缺陷属家族问题（上游缺陷≠平台缺陷，池内已有 ≥5 条同族零散条目）：披露可复算证据 + 不构建该目标 + 不吞 make 错误；处置机制按家族归入通用池，本 PR 不占第二知识位"

assertion_count: 18              # 与 test_package/MANIFEST.yml、test.sh 自检同源
