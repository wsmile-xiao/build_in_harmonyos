# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求此文件存在）
package: swish-e/2.4.7
homepage: "http://swish-e.org/"

# 上游 tests/ 目录共 16 文件：HTML/XML fixture 文档 + Makefile.am +
# check_metasearch 辅助脚本。测试模式为「CLI 实测」——用 perl 驱动
# swish-e 对 fixture 建索引/检索（tests/Makefile.am 挂在 make check 下，
# 但依赖 perl + swish-e 已安装 + 下载助手，无独立离线测试框架）。
upstream_check_command: "make check (requires perl, built tree)"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_test_executed: true
upstream_test_env: "perl 5.42 (aarch64) + local built tree, 2026-10-02"
upstream_test_result: "4/4 PASS — check_index, check_search, check_metasearch, check_fuzzy; make check output: 'All 4 tests passed'; covers all 16 tests/ assets"

upstream_tests:
  - file: tests/Makefile.am
    source: tests/
    description: "CLI 实测套件：16 文件（fixture HTML/XML + check_metasearch），依赖 perl 与已安装树，不可离线直接执行"
    command: "make check"
  - file: tests/test_phrase.html
    source: tests/
    description: "fixture：短语检索用 HTML 文档（另有 test_xml.html、test.fuzzy.config 等）"
    command: "make check"
  - file: tests/check_metasearch
    source: tests/
    description: "metasearch 辅助检查脚本（perl）"
    command: "make check"

# test_package 自带测试（鸿蒙独有消费者用例，N=1）：
# test_swishe.py 驱动完整生产链路——
#   1. 产物断言：ELF64/AArch64 + musl 加载器 + 版本自报；
#   2. 真实消费：fixture 文档 -> swish-e -c conf -i -f index 建索引
#      （真实文件产物 >=1KB）-> swish-e -f index -w query 检索命中断言
#      （2 组查询 + 1 组公共词检索），全走生产 CLI 契约。
test_package_tests:
  - file: test_swishe.py
    description: "实质测试：真实 CLI 链路（fixture 建索引 -> 检索命中断言），7 项检查，非纯断言"
    command: "python3 test_swishe.py --package <pkg>"

assertion_count: 7
