    executed_env: "local OHOS device-native shell (perl 5.42 aarch64), built tree swish-debtest, 2026-10-02"
    executed_command: "make check (tests/)"
    result: "4/4 check scripts PASS (check_index, check_search, check_metasearch, check_fuzzy) — 'All 4 tests passed'; covers all 16 test assets"
