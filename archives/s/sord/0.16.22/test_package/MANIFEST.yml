# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sord/0.16.22
homepage: "https://drobilla.net/software/sord"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_sord.c
    source: sord-0.16.22/test/test_sord.c
    description: "Sord 单元测试 (C API: world/model 创建)"
    command: "./test_sord"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sord.c
    description: "消费者 C API 编译/链接/运行冒烟测试"
    command: "./test_sord"
  - file: conanfile.py
    description: "sordi 端到端转换验证 (Turtle -> N-Triples)"
    command: "sordi -i turtle -o ntriples sample.ttl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
