# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sord/0.16.22-git
homepage: "https://drobilla.net/software/sord"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序（meson test 自动发现，3 个单元测试全过）
upstream_tests:
  - file: test/test_sord.c
    description: "RDF 内存存储单元测试（quad 存取、迭代、序列化）"
    command: "meson test"
  - file: test/headers/test_headers.c
    description: "头文件自包含测试"
    command: "meson test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_sord.sh
    description: "真实消费验证：①sordi -h 可执行性（仅沙箱 EPERM 时 SKIP，其余失败 FAIL）②解析合法 N-Triples 三元组 ③断言输出非空、不含错误特征、包含预期 IRI（4 个断言）"
    command: "bash test_sord.sh <sordi> <libdir>"
  - file: conanfile.py
    description: "验证 sord.h 头文件与 sord-0.pc 存在（2 个断言）"
    command: "conan test"

# 测试断言总数：上游 meson test 3 个全过，test_package 3 个断言
#（sordi 运行 + 产物存在性）
assertion_count: 6
