software: sdl-image

# 软件级 manifest
# 文件位置: archives/s/sdl-image/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: sdl-image

# 软件描述（简短）
description: SDL 1.2 图像加载扩展库（支持PNG/JPEG/TIFF/WebP/BMP/GIF等）

# 软件分类
# library-tool | gui-app | cli-app | header-only | data-package
category: library-tool

# 项目主页
homepage: https://www.libsdl.org/projects/SDL_image/

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "1.2.12"
    status: published
    build_date: "2026-09-13"
    dependencies:
      - sdl12-compat/1.2.68
      - libpng/1.6.58
      - libjpeg-turbo/3.2.0
      - libtiff/4.7.2
      - libwebp/1.6.0

# 当前推荐版本
latest: "1.2.12"
