tests:
  upstream_tests: 0
  upstream_test_pass_rate: "N/A (上游无正式测试套件)"
  added_consumer_scenarios: 2
  added_consumer_assertions: 13
  harmonyos_specific_tests: 1
  result: "test_sdl_image 8/8 + harmonyos_specific_test 5/5 passed"
