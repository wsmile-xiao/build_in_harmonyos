# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.12"

# 软件名
software: "sdl-image"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-13"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.libsdl.org/projects/SDL_image/release/SDL_image-1.2.12.tar.gz"

  # 源码校验和
  sha256: "0b90722984561004de84847744d566809dbb9daf732a9e503b91a1b5a84e5699"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=x86_64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sdl12-compat/1.2.68
    - libpng/1.6.58
    - libjpeg-turbo/3.2.0
    - libtiff/4.7.2
    - libwebp/1.6.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.sub.patch"
  - "0002-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "2012 版 config.sub 不识别 aarch64/-linux-ohos，需补 CPU 段与 OS 段；config.guess 保持原始以最小化补丁 — knowledge_ref: knowledge/drafts/sdl-image-1.2.12-autotools-cross-ohos.kv"
  - "显式双三元组 --build=x86_64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos 可强制 autoconf 交叉模式，绕开 config.guess 探测与不可运行的 conftest 检查 — reference: knowledge/drafts/sdl-image-1.2.12-autotools-cross-ohos.kv"
  - "已发布依赖可能导出空 include 目录（sdl12-compat/1.2.68 头文件在 include/SDL 但 INCLUDE_DIRS 为空），消费者侧用 dependencies[...].package_folder 定位，不在被测包内越界声明 — ref: knowledge/drafts/sdl-image-1.2.12-autotools-cross-ohos.kv"
  - "HMDFS 平台上 autoconf 的 config.status 以 (umask 077 && mktemp -d ./confXXXXXX) 建临时目录，0700 目录 owner 映射为 uid 20001006 且对构建进程不可写 → configure 表面成功但 Makefile 从未生成；解法是把 configure 中 umask 077 改为 umask 022（configure 会将此文本写入 config.status，一处补丁修两段）— ref: knowledge/graph/E011.kv + knowledge/drafts/sdl-image-1.2.12-autotools-cross-ohos.kv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/sdl-image-1.2.12.orig
  source_work_dir: /storage/Users/currentUser/builds/sdl-image-1.2.12.work
  source_orig_hash: 198fdf1040839ba2
  source_work_hash: ae05fa3e347f7d6a
  generated_at: '2026-09-13T16:48:59'
  patches_count: 2

patch_classification:
  - file: 0001-config.sub.patch
    type: auto
    platform_only: True
    guard: 'yes'    # explicit add_os guard branch keeps -linux-ohos out of the linux-gnu rewrite
  - file: 0002-configure.patch
    type: auto
    platform_only: False
    guard: 'none'   # pure portability fix (umask 077 -> 022), no platform-specific logic

# ============================================================
# 测试统计
