# test_package/MANIFEST.yml
# 上游测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sdl-image/1.2.12
homepage: "https://www.libsdl.org/projects/SDL_image/"

# 上游测试声明：SDL_image 1.2.12 上游没有任何测试套件（0 个测试用例）。
# Makefile.am 中只有 noinst_PROGRAMS = showimage，即一个手工演示程序，
# 既不是自动化测试也没有断言；版本级清单记录 upstream_tests: 0，
# 不修改 CI 白名单文件；由消费者测试和鸿蒙特有消费者测试承担适配验证。
upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests: []

# 适配补齐的消费者测试（真实调用被测库公开 API，非空壳）
test_package_tests:
  - file: test.c
    description: "消费者测试：链接打包出的 libSDL_image.a，通过 IMG_Linked_Version/IMG_Init/IMG_isPNG/IMG_Load_RW/IMG_Load 解码内存中的 PNG（libpng 外部编解码路径）与 BMP（内置编解码路径），并覆盖文件不存在的负向路径"
    command: "./test_sdl_image"
    assertions: 8
  - file: harmonyos_specific_test.c
    description: "鸿蒙特有消费者测试：验证 SDL 1.2 在 HarmonyOS 无头环境初始化、SDL_VIDEODRIVER=dummy 运行时及 SDL_image PNG 编解码器初始化"
    command: "SDL_VIDEODRIVER=dummy ./harmonyos_specific_test"
    assertions: 5

assertion_count: 13
harmonyos_specific_tests: 1
