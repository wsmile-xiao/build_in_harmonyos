package: spirv-headers/vulkan-sdk-1.3.290.0
homepage: https://github.com/KhronosGroup/SPIRV-Headers
upstream_check_command: "build the in-tree, find_package, and pkg-config integration targets"
upstream_test_in_build: true
upstream_test_command: "cmake --build build && cmake --build upstream-find-package && cmake --build upstream-pkg-config"
upstream_tests:
  - file: tests/example.cpp
    source: SPIRV-Headers-vulkan-sdk-1.3.290.0.tar.gz/tests/example.cpp
    description: "Compile the upstream in-tree CMake integration target"
    command: "cmake --build build"
  - file: tests/find_package/CMakeLists.txt
    source: SPIRV-Headers-vulkan-sdk-1.3.290.0.tar.gz/tests/find_package/CMakeLists.txt
    description: "Compile the upstream installed CMake package consumer"
    command: "cmake --build upstream-find-package"
  - file: tests/pkg_config/CMakeLists.txt
    source: SPIRV-Headers-vulkan-sdk-1.3.290.0.tar.gz/tests/pkg_config/CMakeLists.txt
    description: "Compile the upstream installed pkg-config consumer"
    command: "cmake --build upstream-pkg-config"
test_package_tests:
  - file: test_package.cpp
    description: "Validate SPIR-V magic, version, C opcode, and C++ opcode constants"
    command: "spirv_headers_test"
assertion_count: 4
