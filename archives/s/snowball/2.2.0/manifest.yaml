# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 C + 单 GNUmakefile 自举构建：先编 snowball 编译器（host 工具，本机 aarch64 原生可运行），再由它从 algorithms/*.sbl 生成 29 语言算法 C 源；algorithms.mk 由 libstemmer/*.perl 生成（env shebang，profile PATH 已含 perl）"
  - "makefile 无 CC 默认定义，CC/AR/RANLIB 必须命令行注入且取自 Conan conf（R33）；CFLAGS/LDFLAGS/INCLUDES 由 makefile 固定（-O2 -W -Wall -Wmissing-prototypes -Wmissing-declarations -Iinclude），无需平台 flag，零补丁零平台差异"
  - "上游 make check = 自包含 check_stemtest（tests/stemtest.c 内嵌 8 用例）+ 48 个数据驱动目标（check_utf8×29 / check_iso_8859_1×16 / check_iso_8859_2×2 / check_koi8r×1），后者依赖外部 snowball-data 仓（~500MB，无 tag、main 随算法演进持续重生成）"
  - "数据仓版本错配实测：main HEAD 数据对 v2.2.0 算法产生 28/48 目标 diff 假失败（如 danish bbc's/bbc 撇号规则差异）——必须锁定发布日（2021-11-10）前最后提交 0703f1d6a21802c3ff00c2c8b31bd255b74b2aec 作为数据快照，48/48 全过（exit 0）"
  - "数据仓获取通道经验：git clone/tarball 整包下载在低速通道必断连；raw.githubusercontent.com 逐文件下载最稳（纯文本优先、仅 .gz 变体回退、按行数与 gzip -t 校验防截断——截断的期望文件会产生尾部整段缺失型 diff 假失败）"

