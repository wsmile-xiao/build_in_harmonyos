# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: snowball/2.2.0
homepage: "https://snowballstem.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
# CI 内执行的自包含子集（不依赖外部数据仓）：
upstream_test_command: "make check_stemtest"
# 适配机上执行的全量数据驱动测试（需外部 snowball-data 快照，见 notes.md）：
additional_upstream_test_command: "STEMMING_DATA=<snowball-data@0703f1d6a218 snapshot> make check"

# 上游实际运行的测试
upstream_tests:
  # 自包含回归套件：1 个注册目标，内嵌 8 个用例（tests/stemtest.c）
  # —— emoji 变位 / 私有区 U+40079 / 数字损伤回归 #66 #81（后 6 例遍历全部 29 算法）
  - file: tests/stemtest.c
    source: snowball-2.2.0/tests/stemtest.c
    description: "Self-contained regression suite (8 embedded cases)"
    command: "make check_stemtest"
  # 数据驱动词干验证：48 个注册目标（make check 展开），每目标做全词表 diff
  # UTF-8: 29 语言 | ISO-8859-1: 16 语言 | ISO-8859-2: 2 语言 | KOI8-R: 1 语言
  - file: GNUmakefile:524-560 (check_utf8_% / check_iso_8859_1_% / check_iso_8859_2_% / check_koi8r_%)
    source: snowball-2.2.0/GNUmakefile + snowball-data@0703f1d6a218 (release-date snapshot)
    description: "Data-driven stemmer output verification (48 registered targets, full-vocabulary diff)"
    command: "STEMMING_DATA=<snapshot> make check"

# 消费者测试（test_package/）
consumer_tests:
  - file: test_package/test.c
    description: "libstemmer API consumer test: 29-algorithm inventory + 16 key members + alias resolution + 23 stem expectations across 13 languages + emoji/U+40079/numeric regressions mirrored from upstream stemtest + KOI8-R encoding availability"
    command: "test_snowball"
  - file: test_package/fixture_english_voc.txt + fixture_english_expected.txt
    description: "stemwords CLI end-to-end roundtrip on a fixture word list"
    command: "stemwords -c UTF_8 -l english -i fixture_english_voc.txt -o out && cmp expected out"
