# 软件级 manifest
# 文件位置: archives/s/snowball/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: snowball
display: "Snowball"
description: "Snowball 词干算法 C 库（libstemmer，29 种语言）+ stemwords 命令行工具"
category: library
homepage: "https://snowballstem.org/"
license: BSD-3-Clause

# 常用构建系统（可被版本级覆盖）
build_system: makefile

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "零补丁零平台 flag：纯 C 单 GNUmakefile，CC/AR/RANLIB 命令行注入即可（R33）"
    - "构建期需 perl（libstemmer/*.pl 生成算法清单，env shebang，profile PATH 已含）"
    - "上游 make check 依赖外部 snowball-data 仓（无 tag、main 随算法演进重生成）——验证必须锁定发布日前的数据快照，否则产生系统性假失败"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "2.2.0":
    status: built
    build_date: "2026-10-03"
    conan_ref: "snowball/2.2.0"
