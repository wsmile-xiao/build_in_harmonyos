# test_package/MANIFEST.yml
# Upstream test declaration for spawn 1.6.6 (upstream spawn-fcgi 1.6.6).

package: spawn/1.6.6
homepage: "https://www.lighttpd.net/"

# Audit of the official spawn-fcgi-1.6.6.tar.gz.
upstream_tests_exist: false
upstream_test_audit:
  source_tarball: "spawn-fcgi-1.6.6.tar.gz"
  source_sha256: "4ffe2e9763cf71ca52c3d642a7bfe20d6be292ba0f2ec07a5900c3110d0e5a85"
  top_level_files:
    - meson.build
    - meson_options.txt
    - src/meson.build
    - src/spawn-fcgi.c
    - spawn-fcgi.1
  scanned_for:
    - "meson test() registrations"
    - "tests/ or test/ directories"
    - "ctest, pytest, and shell test files"
    - "check/test targets"
  scan_result: "0 matches: the tarball contains no test directory or test program; meson.build only configures the executable and installs the man page"
  reason: "spawn-fcgi 1.6.6 has no upstream automated test suite, so no upstream test case can truthfully be counted as run"

upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: fcgi_backend.c
    description: "Minimal real FastCGI responder executed by the installed spawn-fcgi through its inherited listening socket"
    command: "./fcgi_backend (spawned by spawn-fcgi -n)"
  - file: test_spawn_fcgi.py
    description: "Runs -v, -h, loopback TCP listen, FCGI_BEGIN_REQUEST/PARAMS/STDIN, and FCGI_STDOUT/END_REQUEST checks"
    command: "python3 test_spawn_fcgi.py --spawn-fcgi <package>/bin/spawn-fcgi --backend <build>/fcgi_backend"
  - file: conanfile.py
    description: "Conan consumer entry point; compiles the backend, runs the installed binary, and emits HMBS evidence markers"
    command: "conan test test_package"

# Seven real assertions: version, help, TCP listen, begin-request role,
# params, stdin terminator, and backend exit status.
assertion_count: 7
