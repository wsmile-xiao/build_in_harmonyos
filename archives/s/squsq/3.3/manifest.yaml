# 版本级 manifest — squsq 3.3 (OpenHarmony PC / OHOS aarch64)
# 文件位置: archives/s/squsq/3.3/manifest.yaml

version: "3.3"
software: "squsq"
status: built
build_date: "2026-09-24"
build_system: custom

source:
  url: "https://cdn.netbsd.org/pub/pkgsrc/distfiles/t20-squsq-3.3.tar.gz"
  sha256: "aeafff976c18ffc178871be25b9bf403cb25414773ed4e8157813f98b8f3fb37"
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  # 上游 tarball 内没有构建系统（无 Makefile/configure/CMakeLists/meson.build），
  # 只有 TOPS-20 MIC 专用脚本 makesq.mic / makeusq.mic，Unix 侧无法使用；
  # 配方按发行版 port（FreeBSD archivers/squsq 的 files/Makefile）的目标映射直接调用
  # profile 编译器：sq = sq.c tr1.c tr2.c sqio.c，usq = usq.c utr.c。
  compiler_flags:
    - "-O2"
    - "-Wall"
    - "-Wno-error=return-type"
    - "-Wno-error=int-conversion"
  dependencies: []
  cc: clang
  cxx: ""

patches_applied: []

knowledge_gained:
  - "knowledge_ref: E097 — 目标库无构建系统：t20-squsq-3.3.tar.gz 内只有 K&R C 源码 + TOPS-20 MIC 脚本（makesq.mic/makeusq.mic 里的 `@cc -DTOPS20` 与 `@load ...,c:libt20/se` 只在 TOPS-20 上可用），Unix 侧的 Makefile 由发行版 port 提供（FreeBSD `MAKEFILE= ${FILESDIR}/Makefile`、NetBSD `MAKE_FILE= ${FILESDIR}/Makefile`），仓库里没有可复用的上游构建文件"
  - "knowledge_ref: E063 — K&R 老源码在 ISO C99+ 编译器下有两类『硬错误』（不是 warning）：①`return;` 出现在隐式 int 函数里 → `error: non-void function 'obey' should return a value [-Wreturn-type]`；②`return (NULL)` 出现在 int 函数里 → `error: incompatible pointer to integer conversion returning 'void *' from a function with result type 'int' [-Wint-conversion]`（tr2.c:350/367）。发行版 port 的既有解法就是两个 -Wno-error 开关（FreeBSD：`CFLAGS+= -Wno-error=return-type`，FreeBSD 上再加 `-Wno-error=int-conversion`），因此源码保持零补丁"
  - "knowledge_ref: E077 — OHOS SDK 的 clang 驱动默认让 lld 自签名（`ld.lld --code-sign`），新链接出的 ELF 天然带 `.codesign` 段与 `.note.ohos.ident`，无需再跑 binary-sign-tool；本配方只在签名**缺失**时才补签（E077 的四步流程用于『改过 ELF 之后必须重签』的场景，本包不做任何 link 后 ELF 改写）"
  - "knowledge_ref: notes.md#注意事项 — 非 TOPS20 分支下 `sq` 的输出命名遵循 CP/M 3.0 约定：替换原扩展名（data.bin → data.SQ），无扩展名则直接追加（plain → plain.SQ）；名字长度按 sq.c 的 `FNM_LEN 14` 截断（abcdefghijklmnop.txt → abcdefghijk.SQ）。注意 sqcom.h 里 `UNIX` 宏是注释掉的，所以走的是『删除 . 之后内容』分支而不是 UNIX 的『直接追加』分支——这与 FreeBSD/NetBSD 发行版构建保持一致"
  - "knowledge_ref: notes.md#注意事项 — usq 的输出文件名来自被压缩文件头部（sq 写入的原始文件名），不是 .SQ 文件名；解压会直接覆盖同名文件，改名后的 .SQ 仍还原出原名"
  - "knowledge_ref: notes.md#上游测试账目（R51 申报表） — 上游无自动化测试入口：tarball 无 test 目录/测试文件，发行版 Makefile 无 check/test 目标，NetBSD pkgsrc Makefile 无 TEST_TARGET，`make check` 无处可跑（详见 reports/upstream-test-entry.md）；用例改由 readme 的『Changes to SQ/USQ』与源码行为派生，27 例全部实跑（reports/upstream-test-cases.md）"

verification:
  conan_create: pass
  conan_verify: pass
  upstream_cases_total: 24
  upstream_cases_passed: 24
  ohos_cases_total: 3
  ohos_cases_passed: 3
  test_package_assertions: 27
