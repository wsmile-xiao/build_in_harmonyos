# 软件级 manifest — squsq
# 遵循 ARCHIVE-SPEC v3.0

software: squsq
description: CP/M "Squeeze" 压缩格式的压缩/解压命令行工具（sq、usq）
category: archivers
license: NONE
homepage: https://cdn.netbsd.org/pub/pkgsrc/current/pkgsrc/archivers/squsq/
repository: https://cdn.netbsd.org/pub/pkgsrc/current/pkgsrc/archivers/squsq/
keywords:
  - squeeze
  - cp-m
  - compression
  - huffman
  - archiver

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游无 git 仓库、无构建系统：distfile t20-squsq-3.3.tar.gz 只有 K&R C 源码（sq.c/sqio.c/tr1.c/tr2.c/usq.c/utr.c）+ TOPS-20 MIC 脚本 + 1988 年的 lusq.exe；Unix 侧 Makefile 由发行版 port 提供（FreeBSD/NetBSD 都是 files/Makefile），因此配方按该映射直接调用 profile 编译器"
    - "K&R 老源码在 ISO C99+ 下有两处硬错误（不是 warning）：int 函数里裸 `return;`（-Wreturn-type）与 `return (NULL)`（-Wint-conversion）；发行版 port 的既有解法就是 `-Wno-error=return-type` + `-Wno-error=int-conversion`，源码可保持零补丁"
    - "`#ifdef C70 | TOPS20`（usq.c:218/242）是非法但语义确定的写法，两个宏都未定义 → 走 getw16；FreeBSD port 有同名补丁但只在 Unix 下消除一条 -Wextra-tokens 警告，不改变行为，按最小改动原则可不打"
    - "输出命名由 sqcom.h 的 UNIX 宏决定：宏被注释掉时走 `#ifndef UNIX` 分支（删除原扩展名再追加 .SQ），与发行版构建一致；名字按 sq.c 的 FNM_LEN 14 截断"
    - "usq 的输出文件名来自压缩文件头部记录的原始名（不是 .SQ 的文件名），会直接覆盖同名文件"
    - "OHOS SDK clang 驱动默认 `ld.lld --code-sign`，新链接 ELF 天然带 .codesign 与 .note.ohos.ident，无需 binary-sign-tool；E077 的四步重签流程只适用于『改动过 ELF』的场景"
    - "上游无自动化测试（无构建系统、无 check/test 目标、发行版无 TEST_TARGET），用例需从 readme 的 Changes to SQ/USQ 与源码行为派生；禁止把 test_package 当作上游测试统计"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  3.3:
    status: built
    build_date: "2026-09-24"
    patches: 0
