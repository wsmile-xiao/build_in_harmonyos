# test_package/MANIFEST.yml — stdlib-shims 0.3.0

package: stdlib-shims/0.3.0
homepage: "https://github.com/ocaml/stdlib-shims"

upstream_check_command: "dune runtest -p stdlib-shims"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/test.ml
    source: stdlib-shims-0.3.0/test/test.ml
    description: "Tests Stdlib.(+) and Stdlib.List.map are accessible via stdlib-shims"
    command: "dune runtest -p stdlib-shims"

test_package_tests:
  - file: test_stdlib_shims.ml
    description: "Consumer test: compile and run OCaml code using Stdlib module via stdlib-shims"
    command: "./test_stdlib_shims"

assertion_count: 2
