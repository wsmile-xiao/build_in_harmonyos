# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游测试：Test/RUNTEST.sh（单脚本，未注册进构建系统；原始形态依赖
# /bin/bash、gzcat、python2 语义，HarmonyOS 上不可直接执行）。
# 补丁 0001 做可移植性修改（/bin/sh、zcat、python3、iteritems→items、
# 补建输出目录），测试语义不变；修改逐项说明见 PR 正文。

package: seqprep/1.3.2
homepage: "https://github.com/jstjohn/SeqPrep"

upstream_official_tests:
  - file: Test/RUNTEST.sh
    source: SeqPrep-1.3.2/Test/RUNTEST.sh
    description: "官方测试脚本：对内置 gz FASTQ 数据跑两次真实合并/修剪任务（-6 多路复用数据 + 接头 -A/-B），并用 seqlens.py 生成读长直方图"
    command: "sh Test/RUNTEST.sh（经 conanfile.py build() 真实执行）"

upstream_check_command: "sh Test/RUNTEST.sh"
upstream_test_in_build: true
upstream_test_command: "sh Test/RUNTEST.sh（补丁 0001 可移植化后）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    origin: ohos-adaptation (self-authored consumer test, synthetic data)
    description: "消费者测试：合成 4 对带接头的重叠 FASTQ 读对 → 运行打包的 SeqPrep 二进制 → 断言退出码 0、R1/R2 输出非空、merged 输出非空（重叠合并真实发生）、修剪不丢读对（输入=输出读对数）"
    command: "bash test.sh（经 test() 直接执行，断言退出码）"

# 测试断言总数 (test.sh 中 check() 调用 + 退出码断言)
assertion_count: 7
