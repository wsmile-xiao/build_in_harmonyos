# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sgmllib3k/1.0.0
homepage: "https://pypi.org/project/sgmllib3k/"

# 上游 sdist 无测试套件（已核验：仅 sgmllib.py + setup 元数据，无 tests/）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_sgmllib3k.py
    description: "消费者测试（R34）：SGMLParser 子类化、start_title/do_br 标签
      事件、handle_data 数据事件、实体（&amp;）解码——feedparser 依赖的使用模式
      同款，全离线。"
    command: "python3 test_sgmllib3k.py <site-packages>"

assertion_count: 6
