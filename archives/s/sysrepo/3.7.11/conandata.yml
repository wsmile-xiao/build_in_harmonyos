sources:
  url: "https://github.com/sysrepo/sysrepo/archive/refs/tags/v3.7.11.tar.gz"
  sha256: "c897206797427c79c4646baa1d8abe539bbc70af884ac869e827ff9f09d7fcc8"

patches:
  "3.7.11":
    - patch_file: "patches/0001-ohos-robust-mutex-fallback.patch"
      patch_description: "OHOS musl libc does not implement POSIX robust mutex functions; fall back to plain process-shared mutexes"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-synthetic-passwd-fallback.patch"
      patch_description: "OHOS app UIDs have no passwd entries; synthesize stable user names so the JSON datastore works"
      patch_type: "portability"
    - patch_file: "patches/0003-ohos-tests-clear-shm-envdir.patch"
      patch_description: "tests cleanup fixture scans /dev/shm, which OHOS cannot list; honour SYSREPO_SHM_DIR"
      patch_type: "portability"
