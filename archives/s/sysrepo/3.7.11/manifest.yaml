# 版本级 manifest — sysrepo/3.7.11（主理-40, 2026-09-25, 构建机 B）
# 遵循 ARCHIVE-SPEC v2.0

version: "3.7.11"
software: "sysrepo"
status: built
build_date: "2026-09-25"
build_system: "cmake"

source:
  url: "https://github.com/sysrepo/sysrepo/archive/refs/tags/v3.7.11.tar.gz"
  sha256: "c897206797427c79c4646baa1d8abe539bbc70af884ac869e827ff9f09d7fcc8"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_TESTS=ON"
    - "-DENABLE_VALGRIND_TESTS=OFF"
    - "-DENABLE_PERF_TESTS=OFF"
    - "-DREPO_PATH=etc/sysrepo"
    - "-DYANG_MODULE_PATH=sysrepo-yang"
  dependencies:
    - libyang/3.13.6
  test_dependencies:
    - cmocka/2.0.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-robust-mutex-fallback.patch"
  - "0002-ohos-synthetic-passwd-fallback.patch"
  - "0003-ohos-tests-clear-shm-envdir.patch"

knowledge_gained:
  - "OHOS musl 的 libc.so 与 libpthread.a 均不导出 pthread_mutex_consistent/pthread_mutexattr_setrobust：robust mutex 平台缺失，条件编译降级为普通进程共享锁（知识库 E192）（ref: notes.md#遇到的问题与解决方案 / #源码修改 / #注意事项）"
  - "OHOS 动态加载器拒绝未签名 .so（未签名可执行文件可跑，dlopen 加载被拒）：必须在 package() 末尾对包目录就地签名；build 树签名不随 cmake.install 存活（ref: notes.md#编译步骤 / #遇到的问题与解决方案）"
  - "/dev/shm 是只写虚拟目录（可创建文件，opendir/mkdir 返回 EACCES）：sysrepo 需经 SYSREPO_SHM_DIR 指向可列目录（ref: notes.md#遇到的问题与解决方案 / #注意事项）"
  - "OHOS 应用 UID 在 /etc/passwd 无条目：getpwuid/getpwnam 需做 uid<->uid<N> 合成名双向映射，否则 datastore 初始化失败（ref: notes.md#遇到的问题与解决方案 / #源码修改 / #注意事项）"
  - "OHOS 沙箱禁止 mkfifo（HMDFS 主目录与 /dev/shm 均 EPERM/EACCES）：sysrepo 订阅事件管道 evpipe 无法创建，依赖订阅的功能与测试不可用（平台缺口，如实记录）（ref: notes.md#遇到的问题与解决方案 / #注意事项）"
  - "in-tree FindCMocka/上游门禁检查全大写 CMOCKA_FOUND；conan Config 模式只设 cmocka_FOUND，需显式种 CMOCKA_FOUND=1，否则 20 个 cmocka 套件被静默关闭（ref: notes.md#遇到的问题与解决方案 / #编译步骤）"
  - "CMake cache 会把相对 REPO_PATH 绝对化到 CMAKE_BINARY_DIR；fresh repo 的内部模块初始化须经 YANG_MODULE_PATH 烤定路径并由 build() 从源码 modules/ 填充（ref: notes.md#遇到的问题与解决方案 / #编译步骤）"
