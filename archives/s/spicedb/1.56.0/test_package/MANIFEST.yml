# test_package MANIFEST.yml — spicedb 1.56.0
consumer_tests:
  - name: "spicedb --version"
    kind: "binary"
    asserts_version: "v1.56.0"
  - name: "spicedb version"
    kind: "binary"
  - name: "spicedb --help"
    kind: "binary"
    checks_contains: "serve"
  - name: "spicedb serve (in-memory datastore, gRPC port probe)"
    kind: "service"
    details: "Starts spicedb serve with --datastore-engine=memory and verifies the gRPC port opens before terminating the process."
test_command: "conan test test_package spicedb/1.56.0@"