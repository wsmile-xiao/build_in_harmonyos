# manifest.yaml — spicedb 1.56.0 (HarmonyOS PC)
version: "1.56.0"
software: "spicedb"
status: "built"
arch:
  - "armv8"
  - "x86_64"
build_system:
  - "conan2"
  - "go1.26.5"
toolchain:
  go: "1.26.5"
  cgo: false
source:
  upstream: "https://github.com/authzed/spicedb"
  tag: "v1.56.0"
  url: "https://github.com/authzed/spicedb/archive/refs/tags/v1.56.0.tar.gz"
  sha256: "e8c15ecc241e3f50feeab0c63062c961e4558608f25376623ce38e44ec3897b1"
  license: "Apache-2.0"
build:
  entry: "go build -trimpath ./cmd/spicedb"
  output_binary: "spicedb"
  ldflags: "-s -w -X github.com/jzelinskie/cobrautil/v2.Version=1.56.0"
patches_applied: []
knowledge_gained:
  - "spicedb is a pure-Go CLI/service; CGO disabled, GOOS=linux, static binary for OHOS/arm64 and x86_64."
  - "go.mod requires go 1.26.5, so the Go SDK must be at least 1.26.5 (GOTOOLCHAIN=local)."
  - "Go linker mmap fails on HMDFS/tmpfs (E051/E046): link output must be placed on an ext2-like writable workspace (OHOS_GO_WORKDIR)."
  - "On OHOS every executed ELF (the spicedb binary and go test *.test binaries) must carry a .codesign section; sign with binary-sign-tool and use a `go test -exec` wrapper for upstream tests."
  - "Version metadata is injected through github.com/jzelinskie/cobrautil/v2.Version (same as upstream packaging)."