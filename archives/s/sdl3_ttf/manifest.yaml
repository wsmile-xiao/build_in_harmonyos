software: sdl3_ttf
display: "SDL3_ttf"
description: "SDL3 TrueType font rendering library - renders TrueType fonts using SDL3"
category: gfx
homepage: "https://github.com/libsdl-org/SDL_ttf"
license: Zlib
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "需要依赖 SDL3、Freetype、HarfBuzz"
    - "CMake 需设置 CMAKE_PREFIX_PATH=$HOME/usr/local"
    - "禁用 vendored 依赖（网络问题无法下载）"
    - "禁用示例程序（-DSDLTTF_SAMPLES=OFF）"
  common_dependencies:
    - SDL3
    - freetype
    - harfbuzz

# 版本索引（所有已归档版本，含状态）
versions:
  "3.2.2":
    status: published
    build_date: "2026-05-25"