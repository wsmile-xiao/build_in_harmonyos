package: sfml/2.6.1.1
homepage: "https://www.sfml-dev.org/"

upstream_check_command: "SFML_BUILD_TEST_SUITE=ON ctest -N on the upstream 2.6.1 source tree"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> -R 'test-sfml-(system|network)' --output-on-failure"

upstream_tests:
  - path: test/src/System/Vector2.cpp
    target: test-sfml-system
    type: upstream System module unit test
    case_count: 1
    status: enabled
  - path: test/src/System/Vector3.cpp
    target: test-sfml-system
    type: upstream System module unit test
    case_count: 1
    status: enabled
  - path: test/src/Network/Packet.cpp
    target: test-sfml-network
    type: upstream Network module unit test
    case_count: 1
    status: enabled
  - path: test/src/Graphics/Rect.cpp
    target: test-sfml-graphics
    type: upstream Graphics module unit test
    case_count: 1
    status: excluded

excluded_upstream_tests:
  - path: test/src/Graphics/Rect.cpp
    target: test-sfml-graphics
    reason: "The current path-A package explicitly disables SFML Graphics together with Window/OpenGL support. This source file tests sf::Rect through the Graphics test target and cannot be built without enabling the disabled Graphics module."

upstream_test_notes:
  - "SFML 2.6.1 test/ contains exactly 4 test source files: System/Vector2.cpp, System/Vector3.cpp, Network/Packet.cpp, and Graphics/Rect.cpp."
  - "Window and Audio have no standalone test source files in the upstream test/ tree, so no additional runnable upstream cases are omitted."
  - "Count baseline: 4 = upstream test source file count; the 3 enabled source files map to 2 CTest targets (test-sfml-system and test-sfml-network)."

coverage:
  enabled: false
  reason: "The OHOS cross package job does not provide stable coverage collection for this C++ library package."

test_package_tests:
  - file: test_sfml.cpp
    description: "Compiles and links a consumer executable against SFML::System and SFML::Network."
    command: "cmake --build ."
  - file: test_sfml.cpp
    description: "Exercises sf::String::getSize()."
    command: "./test_sfml"
  - file: test_sfml.cpp
    description: "Exercises sf::milliseconds().asMilliseconds()."
    command: "./test_sfml"
  - file: test_sfml.cpp
    description: "Exercises sf::seconds().asMicroseconds()."
    command: "./test_sfml"
  - file: test_sfml.cpp
    description: "Exercises sf::IpAddress::toString()."
    command: "./test_sfml"

upstream_total_case_count: 4
upstream_ctest_target_count: 2
upstream_enabled_case_count: 3
upstream_excluded_case_count: 1
upstream_manual_case_count: 0
assertion_count: 4
