software: sfml
version: "2.6.1.1"
status: partial
build_date: "2026-07-19"

source:
  url: "https://github.com/SFML/SFML/archive/refs/tags/2.6.1.tar.gz"
  sha256: "82535db9e57105d4f3a8aedabd138631defaedc593cab589c924b7d7a11ffb9d"
  tar_format: tar.gz

build:
  build_system: cmake
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DSFML_BUILD_AUDIO=OFF"
    - "-DSFML_BUILD_WINDOW=OFF"
    - "-DSFML_BUILD_GRAPHICS=OFF"
    - "-DSFML_BUILD_EXAMPLES=OFF"
    - "-DSFML_BUILD_DOC=OFF"
    - "-DSFML_BUILD_TEST_SUITE=ON"
  dependencies: []
  cc: clang
  cxx: clang++

modules_available:
  - system
  - network
modules_disabled:
  - name: window
    reason: "HarmonyOS CI image does not provide X11/DRM/UDev windowing backend required by SFML 2.x."
  - name: graphics
    reason: "SFML graphics depends on the disabled window module and an OpenGL context provider."
  - name: audio
    reason: "OpenAL is not available as a published dependency in the current baseline."

patches_applied:
  - "0001-cmake-Config.cmake.patch"
  - "0002-src-SFML-System-Unix-ThreadImpl.cpp.patch"
  - "0003-test-CMakeLists-enabled-targets.patch"

knowledge_gained:
  - "SFML 2.6.1.1 can provide System and Network modules on OHOS without external dependencies."
  - "SFML 2.x Window/Graphics/Audio should remain disabled until platform windowing and OpenAL dependencies are available."
  - "Upstream System and Network tests are enabled with SFML_BUILD_TEST_SUITE=ON and run via ctest -R test-sfml-(system|network)."
  - "Graphics tests remain excluded because the Graphics module is disabled together with Window/OpenGL support."
  - "Upstream 2.6.1 test/ has 4 test source files; System/Network cover 3 and Graphics/Rect.cpp is excluded. Window and Audio have no standalone test source in test/."

test_package:
  framework: cmake
  tests:
    - "Compile and link a consumer executable against SFML::System and SFML::Network."
    - "Run sf::String, sf::Time, and sf::IpAddress smoke checks."
  assertion_count: 4
