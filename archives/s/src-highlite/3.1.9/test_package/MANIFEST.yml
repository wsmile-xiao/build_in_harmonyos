# test_package/MANIFEST.yml
# 上游官方测试声明文件（src-highlite 3.1.9，DS-12 实测 2026-09-21）

package: src-highlite/3.1.9
homepage: "https://www.gnu.org/software/src-highlite/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C tests check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C tests check -j1"

# 上游实际运行的测试程序
# tests/Makefile.am 的 check 目标 = check-produced-output（98 个 check_*
# 子目标），执行时展开为 168 组"生成文件 vs 期望输出"的 diff 对比；
# output_dir 子目标额外处理 2 个文件并做 2 组 test -f 断言。
upstream_tests:
  - file: tests/Makefile.am
    source: src-highlite-3.1.9/tests/Makefile.am
    description: "上游自定义 check 套件：对 java/c++/python/perl/php/ruby/lua/changelog/flex/bison 等 60+ 语言跑 source-highlight 生成 HTML/LaTeX/Texinfo 等输出并与随包期望文件逐组 diff（168 组对比，CHECK_RC=0 全过）"
    command: "make -C tests check -j1"
  - file: tests/output_dir/Makefile.am
    source: src-highlite-3.1.9/tests/output_dir/Makefile.am
    description: "--output-dir 模式：批量处理 test.java/test.h 到指定输出目录并断言产物存在（2 组）"
    command: "make -C tests check -j1（check-output-dir 子目标）"

# 未执行子集（上游条件注册或无断言，逐项说明）：
# 1) check_wrong / check_missing / check_wrong_lineranges /
#    check_wrong_regexranges / check_wrong_syntaxmode：MAINTAINER_MODE
#    条件注册（tests/Makefile.am `if MAINTAINER_MODE`），上游默认
#    make check 同样不执行；非本适配删减。
# 2) src/Makefile.am 的 check 目标：对 ~25 个 .lang/.outlang 定义文件跑
#    --check-lang/--check-outlang 合法性校验（无输出断言），属语言定义
#    自检，其覆盖面已被 tests/ 套件的端到端 diff 覆盖。
# 3) doc/Makefile.am 的 check 目标：11 个 BUILD_HELLO 示例文档生成
#    （无断言，依赖文档工具链）。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：以库使用者身份链接 srchilite 静态库，调用 SourceHighlight::highlight() 将 C++ 源码高亮为 HTML，并对产物断言（含 main/comment 正文与 <span> 高亮标记，缺一退出码非 0）"
    command: "./consumer_test <数据目录>（经 conanrun 环境执行）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 174
# 口径: 上游 168 组 diff 对比 + output_dir 2 组存在性断言 + 消费者测试 4 项
# (产物文件可读 + main + comment + <span> 标记)
