# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: strong-type/15
homepage: "https://github.com/rollbear/strong_type"

# 上游测试（test/ 目录，Catch2 3 框架；无包时上游自带 catch.hpp v2 下载回退）
upstream_test_command: "cmake -S . -B build -DSTRONG_TYPE_UNIT_TEST=on -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2 && ./build/test/self_test"

upstream_tests:
  - file: test/test.cpp（等 32 个 test 源文件聚合的 self_test 程序）
    source: strong_type-15/test/
    description: "Catch2 主套件 self_test：99 个 TEST_CASE 静态声明（equality/ordered/arithmetic/difference/semiregular/regular/iterator/range/hashable 等全部修饰符族）"
    command: "cmake -S . -B build -DSTRONG_TYPE_UNIT_TEST=on -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2 && ./build/test/self_test"

test_package_tests:
  - file: test_strong_type.cpp
    description: "消费者测试: arithmetic 四则、ordered 比较、difference 差类型、incrementable 自增（9 项断言，按上游单修饰符模式）"
    command: "./test_strong_type"

assertion_count: 9
