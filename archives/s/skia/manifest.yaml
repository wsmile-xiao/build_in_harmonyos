software: skia
display: "Skia"
description: "Google 的 2D 图形引擎（Chrome/Android/Flutter 的底层图形库）：CPU 光栅化 + Ganesh GPU 后端"
category: graphics
homepage: "https://skia.org"
license: BSD-3-Clause
build_system: gn

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "构建系统是 GN（generate-ninja）+ Ninja，非 CMake/autotools；skia 的 bin/fetch-gn 抓 chrome-infra-packages（x86 预编译、OHOS 不可达）→ 须用 OHOS clang 从 gn 源码自举，并放到源码树 bin/gn"
    - "OHOS 无 X11 → skia 的 GL 原生接口只能走 EGL（skia_use_egl=true）；glx 分支需要 X11 头，不可用"
    - "CPU 光栅化核心面零裁剪；第三方源码（freetype/harfbuzz/libpng/libjpeg-turbo/libwebp/zlib/expat/dng_sdk/piex/libgifcodec/…）全部 GitCode 不可达源改 GitHub 镜像 + sha256 pin"
    - "OHOS sysroot 的 ICU 头是公共 C API 子集（UText 内部结构体与 C++ 头被裁掉）→ 需补齐完整 ICU 头（与 sysroot libicu.so 同版本）"
    - "musl 差异面：无 __WORDSIZE（glibc <bits/wordsize.h> 专有）；harfbuzz 新版删除了 skia 仍在用的 hb_subset 旧 API"
  common_dependencies: []

# 版本索引
versions:
  "2.88.9":
    status: built
    build_date: "2026-10-04"
    conan_ref: "skia/2.88.9"
