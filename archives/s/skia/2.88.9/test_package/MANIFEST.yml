# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: skia/2.88.9
homepage: "https://skia.org/"

# 上游测试：skia 自带 DM（dm）+ 单元测试（tests），均以 GN 目标形式提供。
# 本配方在 build() 中可选构建（-o "&:with_tests=True"）这两个二进制；默认不建/不跑，
# 运行记录见 notes.md 的上游测试实测（宿主侧全量）。
upstream_check_command: "ninja -C out/ohos dm tests && out/ohos/dm --nogpu --config 8888 && out/ohos/tests"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: dm/
    source: skia-4bed689c/dm
    description: "skia 自带 DM（Diamond Master）图形测试驱动（gm + 单元测试用例的统一 runner，CPU 配置 8888）"
    command: "out/ohos/dm --nogpu --config 8888 --src gm --src tests"
  - file: tests/
    source: skia-4bed689c/tests
    description: "skia 自带单元测试套件（gtest，编译为单一 tests 二进制）"
    command: "out/ohos/tests"

test_package_tests:
  - file: consumer.cpp
    description: "消费者测试：编译并链接 libskia.a 的最小消费者程序（CPU 光栅化 + libpng 编解码）"
    command: "./consumer"
  - file: test.sh
    description: "消费者用例：对已安装库的功能断言（光栅 surface/绘制/回读/编解码，10 断言）"
    command: "bash test.sh"
  - file: test_ohos.sh
    description: "鸿蒙平台特有校验：AArch64 ELF + .codesign 段 + musl 解释器 + TMPDIR 约定（5 断言）"
    command: "bash test_ohos.sh"

assertion_count: 15
