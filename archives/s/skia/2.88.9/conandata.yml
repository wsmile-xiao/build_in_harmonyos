patches:
  - patch_file: "patches/0001-skia-pdf-harfbuzz-subset-modern-api.patch"
    patch_description: "SkPDFSubsetFont: use harfbuzz 7.3's flag-based subset API (HB_SUBSET_FLAGS_*/hb_subset_or_fail) — the *_set_retain_gids/*_set_drop_hints/hb_subset entry points were removed upstream"
    patch_type: "portability"
  - patch_file: "patches/0002-icu-system-headers-ohos.patch"
    patch_description: "skia_use_system_icu: take the full ICU 72.1 headers (shipped under third_party/icu-headers) and disable symbol renaming, because the OHOS sysroot headers hide the internal UText body / C++ API"
    patch_type: "portability"
  - patch_file: "patches/0003-tests-ctest-duplicate-declaration.patch"
    patch_description: "tests/CTest.cpp: drop a duplicated 'sk_paint_t* paint' declaration (upstream bug in this snapshot — breaks the tests target)"
    patch_type: "portability"
  - patch_file: "patches/0004-harfbuzz-icu-script-bridge.patch"
    patch_description: "harfbuzz: compile hb-icu.cc with HAVE_ICU (SkiaSharp fork calls hb_icu_script_to_script() from modules/skshaper, which is otherwise undefined at link time)"
    patch_type: "portability"
  - patch_file: "patches/0005-gn-toolchain-python-path.patch"
    patch_description: "gn/toolchain: use the configured interpreter ($python_path) instead of a hard-coded bare `python` in the copy/alink actions — CI workers ship only python3, so the bare name fails with rc=127 (command not found)"
    patch_type: "portability"
