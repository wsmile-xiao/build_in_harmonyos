# conandata.yml — skia 2.88.9 (HarmonyOS PC / OHOS aarch64)
#
# 版本口径
# --------
# skia 本体没有语义版本号。任务版本 2.88.9 = SkiaSharp binding 版本
# (github mono/SkiaSharp tag v2.88.9 = commit 9699cdf046a989423a5e5eca68e7fd813486d81c)；
# 其 externals/skia submodule（skia-native 快照，指向 fork github.com/mono/skia，
# 分支 xamarin-mobile-bindings）pin 到 commit 4bed689c9c9eb77a120c6a9d54af6a572c85d1c2。
#
# 依赖口径
# --------
# skia 上游 standalone 构建依赖 DEPS + depot_tools(gclient tools/git-sync-deps) 从
# *.googlesource.com / android.googlesource.com / chromium.googlesource.com 抓取第三方源码。
# OHOS 侧 googlesource 全系不可达，故改为 GitHub 镜像并逐条核对「同一 commit SHA」
# （AOSP 系仓库不在 aosp-mirror 的改用 msft-mirror-aosp，同名 SHA 全部命中）。
# skia 自建仓（libgifcodec）在 GitHub 无官方仓 → 社区镜像 GoogleDepends/libgifcodec（同一 commit SHA）。
# 每个包都记录 sha256，供供应链校验。
# 注：各 externals 条目的 `upstream:` 为**溯源记录**（原始 googlesource 地址，仅供核对镜像映射，
#     配方本身不读取该字段；实际下载一律走 `url:` 的 codeload.github.com，即主仓高频可达域）。
# 域名可达性（铁律8）：本包全部下载 URL 均落在 codeload.github.com
# （主仓已合入配方 conandata 域名计数 top 域之一 = 实证可达）。
#
# 构建期宏（非补丁）
# ------------------
# 平台差异通过 gn args 的 extra_cflags 注入 -D，不写进 patches/（R8：补丁禁止引入平台宏）：
#   -D__WORDSIZE=64                     musl 无 __WORDSIZE（glibc 专有）
#   -DSK_FONT_FILE_PREFIX="/system/fonts/"  OHOS 系统字体目录（源文件有 #ifndef 守卫直接接住）

sources:
  url: "https://codeload.github.com/mono/skia/tar.gz/4bed689c9c9eb77a120c6a9d54af6a572c85d1c2"
  filename: "skia-4bed689c.tar.gz"
  sha256: "4dee89bef1406efd0f0c35ef24ec801a8f18ad37d6033d4360c2120eb858da0e"
  tar_format: "tar.gz"

# GN 构建工具链：skia 的 bin/fetch-gn 从 chrome-infra-packages 抓 x86 预编译 gn（OHOS 不可达/不可执行），
# 故用 OHOS clang 从 gn 源码自举（复用 perfetto 先例的同一 revision，便于跨库一致）。
# 来源说明（R39）：gn 无官方 GitHub 仓（github.com/google/gn 不存在），其官方托管 gn.googlesource.com
# 在 OHOS 全系不可达；此处 pin 的 0725d78 为 **上游 gn 提交**（在独立镜像 timniederhausen/gn
# 与 JiauZhang/gn 中 tarball 逐字节一致：sha256 均为 c802a3c5…），属 R39「权威镜像源」替代，
# 且以 commit + sha256 双源锁定。（JiauZhang/gn 与 perfetto 适配使用同一 revision。）
build_tools:
  gn:
    url: "https://codeload.github.com/JiauZhang/gn/tar.gz/0725d7827575b239594fbc8fd5192873a1d62f44"
    sha256: "c802a3c5ffcec6e4395794c43ef713f2b0cbb36468b21e20b89cfa15ef33f181"
    tar_format: "tar.gz"
    strip_root: true

# OHOS sysroot 自带的 ICU 头是「公共 C API 子集」（U_HIDE_INTERNAL_API：UText 内部结构体与
# 全部 C++ 头被裁掉），而 skia 的 skshaper 需要完整 UText、sfntly/PDF 子集需要 C++ 头。
# sysroot 的 libicu.so = ICU 72.1，故取 unicode-org/icu release-72-1 的同一版本头补齐
# （见 patches/0002），并关闭符号重命名以匹配系统库导出的 u_* 符号。
icu_headers:
  url: "https://codeload.github.com/unicode-org/icu/tar.gz/refs/tags/release-72-1"
  filename: "icu-release-72-1.tar.gz"
  sha256: "43cbad628d98f37a3f95f6c34579f9144ef4bde60248fa6004a4f006d7487e69"
  tar_format: "tar.gz"
  strip_root: true
  # tarball 内的 icu4c/source/{common,i18n}/unicode -> <src>/third_party/icu-headers/{common,i18n}/unicode
  common_dir: "icu4c/source/common/unicode"
  i18n_dir: "icu4c/source/i18n/unicode"

