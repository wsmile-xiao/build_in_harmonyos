version: "2.88.9"
status: built
build_date: "2026-10-04"
conan_ref: "skia/2.88.9"

# 版本口径：skia 本体无语义版本号；2.88.9 = SkiaSharp binding 版本（mono/SkiaSharp tag v2.88.9），
# 其 externals/skia submodule（mono/skia fork，分支 xamarin-mobile-bindings）pin 到下述 commit。
source:
  url: "https://codeload.github.com/mono/skia/tar.gz/4bed689c9c9eb77a120c6a9d54af6a572c85d1c2"
  sha256: "4dee89bef1406efd0f0c35ef24ec801a8f18ad37d6033d4360c2120eb858da0e"
  tar_format: tar.gz
  upstream_repo: "https://github.com/mono/skia"
  skia_native_pin: "4bed689c9c9eb77a120c6a9d54af6a572c85d1c2"
  skia_native_branch: "xamarin-mobile-bindings"

build:
  system: gn
  configure_options:
    - "is_debug=false"
    - "is_official_build=false"
    - "cc=\"clang\""
    - "cxx=\"clang++\""
    - "ar=\"ar\""
    - "skia_enable_gpu=true"
    - "skia_use_gl=true"
    - "skia_use_egl=true"
    - "skia_use_x11=false"
    - "skia_use_fontconfig=false"
    - "skia_pdf_subset_harfbuzz=true"
    - "skia_use_system_freetype2=false"
    - "skia_use_system_zlib=false"
    - "skia_use_system_libpng=false"
    - "skia_use_system_libjpeg_turbo=false"
    - "skia_use_system_libwebp=false"
    - "skia_use_system_harfbuzz=false"
    - "skia_use_system_expat=false"
    - "skia_use_system_icu=true"
    - "extra_cflags=[\"-D__WORDSIZE=64\", \"-DSK_FONT_FILE_PREFIX=\\\"/system/fonts/\\\"\"]"
  # 上游 standalone 构建所需的第三方源码（DEPS），由配方 source() 从 GitHub 镜像供给，逐条 sha256 pin
  vendored_sources:
    - dng_sdk@c8d0c9b1d16bfda56f15165d39e0ffa360a11123
    - expat@624da0f593bb8d7e146b9f42b06d8e6c80d032a3
    - freetype@40c5681ab92e7db1298273ccf3c816e6a1498260
    - harfbuzz@4584bcdc326564829d3cee3572386c90e4fd1974
    - libjpeg-turbo@9b894306ec3b28cea46e84c32b56773a98c483da
    - libpng@f135775ad4e5d4408d2e12ffcc71bb36e6b48551
    - libwebp@ca332209cb5567c9b249c86788cb2dbf8847e760
    - zlib@3ca9f16f02950edffa391ec19cea856090158e9e
    - piex@bb217acdca1cc0c16b704669dd6f91a1b509c406
    - libgifcodec@d06d2a6d42baf6c0c91cacc28df2542a911d05fe
    - imgui@9418dcb69355558f70de260483424412c5ca2fce
    - lua@e354c6355e7f48e087678ec49e340ca0696725b1
    - sfntly@b55ff303ea2f9e26702b514cf6a3196a2e3e2974
  # ICU 头补齐（sysroot 只带公共 C API 子集）
  extra_sources:
    - "icu-release-72-1（unicode-org/icu；仅取 icu4c/source/{common,i18n}/unicode -> third_party/icu-headers）"
  build_tools:
    - "gn@0725d7827575b239594fbc8fd5192873a1d62f44（源码自举，OHOS clang；并拷贝为源码树 bin/gn）"
    - "ninja/1.13.2（conan tool_requires）"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-skia-pdf-harfbuzz-subset-modern-api.patch"
  - "0002-icu-system-headers-ohos.patch"
  - "0003-tests-ctest-duplicate-declaration.patch"
  - "0004-harfbuzz-icu-script-bridge.patch"
  - "0005-gn-toolchain-python-path.patch"

knowledge_gained:
  - "skia 无语义版本号；绑定版本（SkiaSharp tag）→ externals/skia submodule pin 才是真正的源码 pin（注意路径是 externals 不是 external，且指向 mono/skia fork）"
  - "GN（generate-ninja）在 OHOS 可自举：skia 的 bin/fetch-gn 走 chrome-infra-packages（x86 预编译、不可达），须用 OHOS clang 从 gn 源码编译，并放到源码树 bin/gn（gen/skia.h action 会调用它）"
  - "OHOS 无 X11：skia 的 GL 原生接口只有 EGL 一条路（skia_use_egl=true）；glx 分支需要 X11 头，不可用"
  - "OHOS sysroot 的 ICU 头是公共 C API 子集（UText 内部结构体/C++ 头被裁掉），skshaper 需补齐完整 ICU 头"
  - "musl 无 __WORDSIZE（glibc 专有），dng_sdk / libjpeg-turbo 用它做 64 位判定"
  - "OHOS clang 链接期 -s（strip）不破坏 .codesign（独立 strip 工具才会）——比 perfetto 结论更精确"
  - "skia 的 -Weverything 无 -Werror，无需 perfetto 式 is_hermetic_clang 处置"
  - "gn 的 exec_script 默认执行裸名 python（非 python3）；OHOS 宿主 python3 的 sys.platform=='ohos' → 需 --platform=linux（build/gen.py）+ --script-executable=python3（gn gen），否则本机绿、CI 红"
  - "上游字体目录可用构建期 -DSK_FONT_FILE_PREFIX=\"/system/fonts/\" 注入（源文件有 #ifndef 守卫），无需在 patches/ 引入平台宏（R8）"
  - "OHOS 上 ninja 并发过高会 `fatal: posix_spawn: Resource temporarily unavailable`（资源型 EAGAIN，CI 实测于 gn 自举步）——两处 ninja 调用（gn 自举 / 产品构建）都必须显式 -j 封顶"
  - "skia 的 gn/toolchain 在 copy/alink 工具里硬编码裸名 `python`（tool 命令不受 gn --script-executable 影响，仅 exec_script/action 受影响）→ CI 只有 python3 时链接静态库即 rc=127；改用 gn 内置变量 `$python_path`（文档：'Normally used in toolchain definitions'）即由 --script-executable 驱动"
