# 软件级 manifest — socket
# 文件位置: archives/s/socket/manifest.yaml
# 字段规范: knowledge/ARCHIVE-SPEC.md §4.1

software: socket
display: "socket"
description: "从 shell 建立 TCP 连接的小工具：客户端或服务端，连接直接接到 stdio 或某个程序"
category: network
homepage: "https://tracker.debian.org/pkg/socket"
license: GPL-1.0-or-later
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  notes:
    - "1992 年的 BSD 代码：OHOS libc 定义了 SIG_SETMASK 但没有 struct sigvec，BSD 分支被选中即编译失败，须改 POSIX sigaction"
    - "globals.h 的 `extern int errno` 在 errno 为线程局部宏的 libc 上没有对应符号，须改 #include <errno.h>"
    - "上游 Makefile 的 shapeTools `+all` 包装会把 makefile 内的 CC/CFLAGS/LDFLAGS 以命令行变量形式传给子 make，外部注入的编译参数会被整体吞掉"
  dependencies: []

# 版本索引
versions:
  "1.1":
    status: built
    build_date: "2026-09-21"
    conan_ref: "socket/1.1"

latest: "1.1"
