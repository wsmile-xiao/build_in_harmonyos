# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS libc 定义 SIG_SETMASK 但不提供 BSD struct sigvec/sigvec()，`#ifdef SIG_SETMASK` 这类 BSD 信号探测会选错分支并报 incomplete type（本次新增草稿 socket-1.1-bsd-sigvec-probe-sig-setmask）"
  - "`extern int errno` 在 errno 为线程局部宏的 libc 上不产生可链接符号，须改 #include <errno.h>"
  - "shapeTools 风格 Makefile 的 `+all` 包装用命令行变量把 CC/CFLAGS/LDFLAGS 传给子 make，命令行变量优先级最高，外部注入的 flags 会被整体吞掉"
  - "init-build 的 .work 与 .orig 是硬链接，原地写回的编辑器会同时改 .orig，refresh-patch 生成空补丁（已有草稿 E543，本次复现）"
  - "qemu-aarch64 + binfmt_misc 可直接跑静态链接的 OHOS 产物；动态产物缺 /lib/ld-musl-aarch64.so.1 无法在 x86 runner 上执行（已有草稿 E544）"

