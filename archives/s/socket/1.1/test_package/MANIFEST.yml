# test_package/MANIFEST.yml — upstream test declaration (R51)

package: socket/1.1
homepage: "https://tracker.debian.org/pkg/socket"

# 上游 tarball（socket_1.1.orig.tar.gz）共 18 个文件：BLURB / CHANGES / COPYRIGHT /
# Dependencies / INSTALL / Makefile / README / patchlevel.h / globals.h /
# socket.1 / socket.c / socketp.c / io.c / utils.c / siglist.c / so_release.c /
# fingerd.sh / rfinger.sh —— 无 tests/ 目录、无 configure、无 ctest/pytest 注册。
# Makefile 的全部 target：all / targets / tags / TAGS / installtargets /
# installmanuals / doclean / subsystems / install / clean / +all / +install / +clean，
# 没有 check 或 test；`make -n check` → "No rule to make target 'check'. Stop."
# Debian 打包层（socket 1.1-10.1）同样没有 autopkgtest：debian/ 下只有
# changelog / compat / control / copyright / patches / rules / source。
upstream_check_command: "make check  # 不存在：Makefile 无 check/test target"
upstream_test_count: 0

# conanfile.py build() 中未集成上游测试（上游确无测试可跑）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 自带的功能测试（消费者视角）。上游与 Debian 均无测试可移植，
# 断言依据 socket(1) man page 的语义编写，覆盖程序的全部源文件。
test_package_tests:
  - file: test_socket.py
    description: "artifact 校验：产物存在、aarch64 ELF、可执行位"
    command: "python3 test_socket.py <bindir>"
  - file: test_socket.py
    description: "无参数时打印 usage 行（socket.c 选项解析 + utils.c usage）"
    command: "socket"
  - file: test_socket.py
    description: "未知主机名如实报错而非崩溃（socketp.c 名字解析）"
    command: "socket -q nosuchhost.invalid 12345"
  - file: test_socket.py
    description: "客户端模式双向传输：脚本作服务端，校验收发两个方向（io.c 传输循环）"
    command: "socket -q 127.0.0.1 <port>"
  - file: test_socket.py
    description: "服务端模式（-s）双向传输：脚本作客户端，校验收发两个方向"
    command: "socket -q -s <port>"
  - file: test_socket.py
    description: "-c 将发出的 LF 转成 CRLF（io.c add_crs 路径）"
    command: "socket -q -c 127.0.0.1 <port>"
  - file: test_socket.py
    description: "-p 把程序 stdio 接到连接上（utils.c open_pipes/fork/exec 路径）"
    command: "socket -q -s -p '/bin/echo HELLO-FROM-PROG' <port>"
  - file: test_socket.py
    description: "SIGTERM 走补丁后的 sigaction 处理器：打印信号名并以 exit(-SIGTERM)=241 退出（覆盖 utils.c 补丁 + siglist.c 信号名表）"
    command: "kill -TERM <socket -q -s pid>"

# 断言总数：1 条 artifact 校验 + 7 条运行时功能断言
assertion_count: 8
