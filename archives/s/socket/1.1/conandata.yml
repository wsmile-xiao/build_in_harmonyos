# conandata.yml — socket 1.1
#
# Source: the original upstream tarball as distributed by the Debian archive
# (`socket_1.1.orig.tar.gz`, i.e. Juergen Nickelsen's Socket-1.1 release, not a
# Debian repack: no `+dfsg`, no debian/ directory inside).  The 1992 upstream
# site (ftp.cs.tu-berlin.de, see README) has been gone for decades and the
# package has no VCS repository on salsa, so the Debian archive is the
# authoritative mirror that still serves the untouched tarball over HTTPS.
# sha256 verified by downloading twice from the archive.

sources:
  "1.1":
    url: "https://ftp.debian.org/debian/pool/main/s/socket/socket_1.1.orig.tar.gz"
    sha256: "7df3eae9f23d13984f15b3b292ed1c79ca8624977c6ea46710c659a7c65ae77a"

patches:
  "1.1":
    - patch_file: "patches/0001-Makefile.patch"
      patch_description: "Honour external CC/CFLAGS/LDFLAGS instead of overwriting them (shapeTools +all re-exports these to the sub-make)"
      patch_type: "portability"
    - patch_file: "patches/0002-globals.h.patch"
      patch_description: "Include <errno.h> instead of declaring `extern int errno`, which links to nothing on a libc with per-thread errno"
      patch_type: "portability"
    - patch_file: "patches/0003-utils.c.patch"
      patch_description: "Replace the BSD sigvec() signal setup with POSIX sigaction(); OHOS libc defines SIG_SETMASK but has no struct sigvec"
      patch_type: "portability"
