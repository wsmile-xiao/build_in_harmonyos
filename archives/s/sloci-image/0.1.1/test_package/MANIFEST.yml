# test_package/MANIFEST.yml — sloci-image 0.1.1
# CI L0e requires this file to exist.

package: sloci-image/0.1.1
homepage: "https://github.com/jirutka/sloci-image"

# sloci-image has no upstream test suite (shell script tool, no `make check` target)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs sloci-image --version, --help, and OCI image creation smoke test"
    command: "bash test.sh"

# Approximate assertion count (--version + --help + image creation)
assertion_count: 3
