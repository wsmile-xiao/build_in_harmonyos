# 软件级 manifest — archives/s/simhash/manifest.yaml

software: simhash
display: "simhash"
description: "文件相似度哈希工具（近似重复检测）"
category: utility
homepage: "https://github.com/BartMassey/simhash"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 的 CC=gcc / -O4 / -ansi 与 install 到 /usr/local 均不适用于 OHOS：配方直接用 Conan 的 clang 编译 4 个 .c（-O3 -Wall -lm）并自行安装"
    - "命令行工具：软件级 commands.json（R38/L0k）"
    - "上游 test.sh 为手工相似度矩阵（无断言）：R51 申报 not_applicable，覆盖由 test_package 的 Python harness 提供"
    - "man 页源文件名 simhash.man，安装为 share/man/man1/simhash.1"
  common_dependencies: []

versions:
  "0.0.20161225":
    status: built
    build_date: "2026-09-18"
    conan_ref: "simhash/0.0.20161225"
