# test_package/MANIFEST.yml
# simhash 0.0.20161225.
#
# Upstream ships only `test.sh`, a manual script that expects the user to
# create files named `a` and `b` by hand and prints a similarity matrix; it
# asserts nothing itself.  It is therefore reported as not-applicable for the
# upstream step of R51, and the workflow it describes (hash several files, then
# compare) is reproduced deterministically by the test_package harness.

package: simhash/0.0.20161225
homepage: https://github.com/BartMassey/simhash

upstream_tests_exist: false
upstream_test_audit: "Makefile has no check/test target; test.sh is a manual similarity matrix requiring hand made files a and b"
upstream_check_command: "n/a (no check target)"
upstream_test_in_build: false
upstream_test_command: "n/a (manual test.sh only)"

test_package_tests:
  - file: test_simhash.py
    description: "CLI harness: hash generation (-f/-s), identical compare == 1.0, one-word-edit compare > 0.5, unrelated compare == 0.0, exit code 0 for comparisons, parameters change the hash, man page installed"
    command: "python3 test_simhash.py <installed simhash> <package folder> <workdir> <result json>"

test_files:
  - path: "test_package/test_simhash.py"
    test_type: "R34/R51(补全)"
    assertion_count: 9

test_package_test_count: 1
consumer_assertion_count: 9
assertion_count: 9
