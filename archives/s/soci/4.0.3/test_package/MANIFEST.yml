# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 数据来源: 上游 tag v4.0.3 源码清点 + 2026-09-23 实跑
# (conan-verify G2: ctest 2/2 + Catch 汇总, 详见 notes.md 五维账本)

package: soci/4.0.3
homepage: "https://github.com/SOCI/soci"

# 上游测试入口: 上游无 autotools make check; 测试由 CMake 注册、ctest 执行
# (cmake/SociBackend.cmake 的 soci_backend_test() -> add_test, 连接串与
#  --invisibles 由其注入; 我们以 --no-tests=error 防 0 注册静默过)
upstream_check_command: "ctest --output-on-failure --no-tests=error"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest（配方 build() 内, env 注入 TERM 相关由上游 add_test 自带）"

# 源码静态清点 (TEST_CASE): 150 = common-tests.h 共享 61(62 行含 1 注释) + 后端自有 89
# 本配置启用 sqlite3 + empty 后端; 其余后端需真实数据库服务端(见 notes §12.72 说明)
upstream_tests:
  - file: tests/sqlite3/test-sqlite3.cpp
    source: "soci-4.0.3/tests/sqlite3（+ common-tests.h 共享 61）"
    description: "SQLite3 后端: 10 个自有用例 + 55 个共享用例实际注册执行; 实跑 65 用例/1715 断言全过 (Catch: All tests passed)"
    command: "soci_sqlite3_test（ctest 注册, :memory: 连接串）"
  - file: tests/empty/test-empty.cpp
    source: "soci-4.0.3/tests/empty"
    description: "empty 后端冒烟: 1 用例, ctest 以 dummy 连接串 + --invisibles 执行, 1/1 过"
    command: "soci_empty_test dummy --invisibles（ctest 注册）"
  - file: tests/{postgresql,oracle,mysql,firebird,odbc,db2}/
    source: "soci-4.0.3/tests/<backend>"
    description: "未启用后端（需真实数据库服务端, WITH_*=OFF 未编译未执行): 78 个自有用例 — postgresql 24 / oracle 19 / mysql 14 / firebird 13 / odbc 5 / db2 3"
    command: "（本配置不构建）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者真调 soci API: session(sqlite3, :memory:) 建表/插值/into 取回（往返值 42 的单点断言）, 异常路径非零退出; 经 test() 的 ctest 实跑 1/1 过, 同时验证包内共享库可加载"
    command: "test_soci（ctest 注册）"

# 测试断言总数 (实跑口径, 与 notes/PR 同源):
#   上游静态 150 用例; 本配置实跑 66 用例 / 1715 断言 (sqlite3: 65 用例 1715 断言
#   + empty: 1 用例); 未跑 84 = 禁用后端(6 个)自有 78 + common 门控 6; 消费者 +1 程序
assertion_count: 1715
