version: "4.1.4"
software: soci
status: built
build_date: "2026-09-22"
build_system: cmake

source:
  url: "https://github.com/SOCI/soci/archive/refs/tags/v4.1.4.tar.gz"
  sha256: "144f017cccc2e2d806badb3313d6ab3c67a1925bccaa747a46fb3907108a615d"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "SOCI_SQLITE3=ON / SOCI_EMPTY=ON，其余后端全部 OFF（需要专有客户端库或活数据库服务器）"
    - "SOCI_FMT_BUILTIN=OFF —— 强制使用外部 fmt，避免静默回退到（归档里不存在的）vendored 副本"
    - "SOCI_TESTS=ON / SOCI_INSTALL=ON"
  dependencies:
    - "sqlite3/3.53.4"
    - "fmt/11.1.3"

patches_applied: []

knowledge_gained:
  - "soci 的后端由 SOCI_<NAME> 缓存变量控制（ON/OFF/AUTO，默认 AUTO=依赖满足即启用）。只想要无服务器的后端就显式把 DB2/Firebird/MySQL/ODBC/Oracle/PostgreSQL 设为 OFF，保留 SQLite3 与 Empty"
  - "soci 把 fmt 作为 git submodule 放在 3rdparty/fmt —— **GitHub 的 archive tarball 不含 submodule**，因此直接构建会报 'fmt library submodule not found'。上游支持外部 fmt（find_package(fmt) 成功即用），故配方 requires fmt 并设 SOCI_FMT_BUILTIN=OFF，宁可显式失败也不静默回退"
  - "⚠️ soci 的用例总数只能以 Catch2 运行时的自报为准：源码里 TEST_CASE 行有 112 处，实际编译进 sqlite3 测试二进制并执行的只有 84 个 —— tests/common/test-boost.cpp 整个文件在 #ifdef SOCI_HAVE_BOOST 内，本配置没有 Boost。把源码声明数当 case total 会虚报 33%"
  - "soci::use() 显式删除了右值重载（use(T&&,...) = delete），必须传左值变量；写 soci::use(1) 会编译失败"
  - "soci 导出 SOCI::Core / SOCI::Empty / SOCI::SQLite3 等 CMake target（由自带的 soci-config.cmake 提供）；Conan 侧则用 cpp_info.components 生成 soci::core / soci::sqlite3 / soci::empty，test_package 用 find_package(soci) + soci::sqlite3 即可自动带出 core 与 sqlite3::sqlite3"
  - "soci 只安装库与头文件（无 bin/），故纯库包不需要 commands.json（R38）"

patch_generation:
  method: none
  patches_count: 0

test_results:
  type: upstream
  total: 84
  passed: null
  failed: null
  skipped: 0
  note: "WSL 本地实测 ctest 2/2 通过；sqlite3 后端 Catch2 2242 断言 / 84 用例全过；消费者 9/9；HarmonyOS 真机 conan create 结果待回填"
