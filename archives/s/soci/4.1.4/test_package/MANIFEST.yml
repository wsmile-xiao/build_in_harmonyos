# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# 上游测试清点（soci 4.1.4，源码 + 实测）：
#
#   upstream_test_targets = 2
#       每个启用的后端注册 1 个 ctest 测试：
#         tests/empty/CMakeLists.txt   → soci_empty_test
#         tests/sqlite3/CMakeLists.txt → soci_sqlite3_test   （命令带 ":memory:"）
#       其余后端（DB2/Firebird/MySQL/ODBC/Oracle/PostgreSQL）本配方显式关闭：
#       它们需要专有客户端库或活数据库服务器。
#
#   upstream_test_files   = 11
#       tests/common/ 的 10 个 .cpp（soci_tests_common 静态库，被各后端测试共用）
#       + tests/sqlite3/test-sqlite3.cpp
#       （tests/common/test-main.cpp 是 Catch2 的 main，不算用例文件）
#
#   upstream_case_total   = 84   （**运行时实测，非源码行数**）
#       ⚠️ 源码里 common+sqlite3 合计有 112 处 TEST_CASE 行，但**真正被编译进
#          sqlite3 测试二进制并执行的只有 84 个** —— 差额来自条件编译，
#          例如 tests/common/test-boost.cpp 整个文件包在 #ifdef SOCI_HAVE_BOOST 内
#          （本配置没有 Boost，4 条全部不参与）。
#       判定依据取 Catch2 自己的总结行（直接运行二进制得到）：
#          "All tests passed (2242 assertions in 84 test cases)"
#       这正是「不能把测试文件数/源码声明数当作 case total」的典型例子。
#
#   WSL 侧本地实测：ctest 100% tests passed, 0 tests failed out of 2；
#   soci_sqlite3_test（:memory:）2242 断言 / 84 用例全过。

package: soci/4.1.4
homepage: "https://github.com/SOCI/soci"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: tests/sqlite3/test-sqlite3.cpp
    source: "tests/sqlite3/CMakeLists.txt:8-12（add_test NAME soci_sqlite3_test，连接串默认 :memory:）"
    description: >-
      SQLite3 后端测试二进制：链接 soci_tests_common + SOCI::SQLite3，
      Catch2 实测 84 个用例 / 2242 条断言，覆盖连接与会话、DDL/DML、
      use()/into() 绑定、rowset 迭代、LOB、unicode、类型转换、异常路径等
    command: "ctest -R soci_sqlite3_test"
  - file: tests/empty/test-empty.cpp
    source: "tests/empty/CMakeLists.txt"
    description: "Empty 后端（无实际操作）测试，用于验证 core 本身"
    command: "ctest -R soci_empty_test"

test_package_tests:
  - file: src/test_soci.cpp
    description: >-
      C++17 消费者链接安装后的 soci（core + sqlite3 组件）并在 :memory: 上跑完整
      用户面：开会话、CREATE TABLE、两条 use() 参数化插入、into() 绑定读取、
      rowset 有序遍历两行、预备语句复用（改绑定值后再 execute，行数变 4）。
      另有 2 项**负向**断言：非法 SQL 必须抛 soci_error、查询不存在的列必须抛
      soci_error（R34 真实 API 调用）
    command: "./test_soci"

assertion_count: 9
