# 版本级 manifest
# 文件位置: archives/s/sems-dsm/2.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.0"

# 软件名
software: sems-dsm

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://github.com/sems-server/sems/archive/refs/tags/2.1.0.tar.gz"

  # 源码校验和（与 conandata.yml 一致）
  sha256: "f16c28917f1b92e9ec963ca28abd4612282f610276a67fa4e6346d07cffb8756"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_TOOLCHAIN_FILE=<conan_toolchain.cmake>（由 Conan CMakeToolchain 注入）"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libevent/2.1.12

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-ohos-musl-pthread-cancel.patch"
  - "0002-inject-libevent-dirs.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS musl libc 无 pthread_cancel：AmThread::cancel() 须改走协作停止（DBG + _stopped.set），否则链接期符号缺失"
  - "SEMS 插件由 -rdynamic 宿主加载：dsm.so 引用 420 个 core 符号（llvm-nm 实测），测试宿主须以 -Wl,--whole-archive 收录随包 libsems_core.a/libsems_sip.a 与静态 libevent2"
  - "resample.cpp 被上游 target_sources 只挂到 sems/sems_tests 目标（不在 sems_core 内），须随包分发源码供宿主编译，补齐 ResampleFactory 符号"
  - "上游 tarball 含 CodeQL 自引用软链 _codeql_detected_source_root（符号链接循环），打包时须剔除"
