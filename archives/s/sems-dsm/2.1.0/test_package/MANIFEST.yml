# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
# 口径：R51 三步法 —— ①清点 ②真实执行 ③如实回填（本文件即第 ③ 步产物）
package: sems-dsm/2.1.0
homepage: "https://github.com/sems-server/sems"

# ── ① 清点（R51 第一步） ──────────────────────────────────────────
# 上游 2.1.0 已全量迁移 CMake；测试位于 core/tests/：
#   · sems_tests.cpp —— fct.h 测试入口，FCT_BGN() 内以 FCTMF_SUITE_CALL() 注册 11 个 suite
#   · test_*.cpp × 11 —— 各 suite 源文件（每个配同名 .h）
#   · fct.h —— 上游自带 fct 测试框架（单头文件实现）
# 上游 CMake 将该目录编译为**单体可执行程序** sems_tests（ctest 注册 1 项），
# 11 个 suite 共 204 个 FCT_TEST_BGN 用例。各 suite 用例数（源文件静态计数）：
#   rfc3261_musts=88, rfc3261_parser=25, uriparser=15, amconfig=14, jsonarg=13,
#   parser=13, auth=11, headers=10, extensions=8, replaces=5, sdp=2  →  合计 204
upstream_check_command: "ctest（core/tests 注册 1 项：单体 sems_tests，内部 204 个 FCT_TEST_BGN 用例）"

# ── ② 真实执行（R51 第二步）已集成进配方 ─────────────────────────
# 配方 build() 构建 sems_tests 目标，package() 将产物收进 bin/；
# test_package/conanfile.py 的 test() 第一步真实运行它 ——
# 即 conan create（本地 W3 与 CI 同源）每次都会真实执行上游 204 项用例。
upstream_test_in_build: true
upstream_test_command: "cmake --build <build_folder> --target sems_tests && <package_folder>/bin/sems_tests"
upstream_tests_exist: true

# ── ② 真实执行记录（2026-09-30，HarmonyOS PC aarch64） ────────────
# 执行环境：OHOS SDK 26.0.0.18 clang 15，aarch64-linux-ohos 交叉编译产物（musl）。
# 执行路径：conan create → test_package test() → 包内 bin/sems_tests（CI 与本地 W3 同源）。
# 实测输出：`PASSED (204/204 tests in 0.016430s)`，退出码 0，日志内 FAILED/ERROR 命中 0。
upstream_test_audit:
  run_env: "HarmonyOS PC aarch64 + OHOS SDK 26.0.0.18 clang 15（aarch64-linux-ohos）；conan create → test_package 运行包内 bin/sems_tests"
  run_date: "2026-09-30"
  discovered: 11
  executed: 11
  passed: 11
  failed: 0

# 上游实际运行的测试程序（11 个 suite 编译进同一单体可执行程序 sems_tests）
upstream_tests:
