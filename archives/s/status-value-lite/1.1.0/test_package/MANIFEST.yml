# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: status-value-lite/1.1.0
homepage: "https://github.com/nonstd-lite/status-value-lite"

upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: lest 框架, C++11 版 17 用例 + C++98 头文件版 16 用例
upstream_tests:
  - file: test/status_value.t.cpp
    source: status-value-lite-1.1.0/test/status_value.t.cpp
    description: "status_value 核心单元测试 (17 个 lest 用例: 构造/状态/取值/swap/移动)"
    command: "ctest -R test-cpp11"
  - file: test/status_value_cpp98.t.cpp
    source: status-value-lite-1.1.0/test/status_value_cpp98.t.cpp
    description: "status_value C++98 头文件版单元测试 (16 个 lest 用例)"
    command: "ctest -R test98-cpp98"

test_package_tests:
  - file: test_status_value.cpp
    description: "消费者测试: 验证 status-value-lite 库链接、status_value 构造/status()/value()/移动/swap API"
    command: "./test_status_value"

assertion_count: 6