software: serf
display: "Apache Serf"
description: "High-performance C-based HTTP client library built upon APR"
category: network
homepage: "https://serf.apache.org/"
license: Apache-2.0
build_system: scons

ohos_adaptation:
  key_points:
    - "SCons 构建：registry 无 scons 配方时用隔离 pip 安装（gpsd 同款模式）"
    - "SCons POSIX SHELL 指向 /system/bin/sh（OHOS 无 /bin/sh）"
    - "zlib 路径经 CPPFLAGS/LINKFLAGS 从依赖闭包补齐（SConstruct 只处理 OPENSSL）"
    - "1.3.10 已原生兼容 Python3 与 OpenSSL 3，无需源码补丁"
  common_dependencies:
    - apr
    - apr-util
    - zlib
    - openssl

versions:
  "1.3.10":
    status: built
    build_date: "2026-09-20"
