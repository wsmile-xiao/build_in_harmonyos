# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: serf/1.3.10
homepage: "https://serf.apache.org/"

# 上游测试命令 (SCons check 目标: 先构建 6 个测试程序,
# 再执行 build/check.py: 5 个 fixture 用例经 serf_response 运行,
# 随后运行 CuTest test_all 二进制)
upstream_check_command: "python3 -m SCons check"

# conanfile.py build() 方法中已集成上游测试 (_run_upstream_tests)
upstream_test_in_build: true
upstream_test_command: "python3 -m SCons check"

# 上游测试存在性审计（hmbs 硬门禁要求）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 serf 1.3.10 存在完整测试套件，已接入并在真机完整执行。
  1. test/testcases/ 下 5 个 .response fixture 文件（simple、chunked、
     chunked-empty、chunked-trailers、deflate），由 build/check.py 逐个经
     test/serf_response 可执行文件运行，任一失败即整体退出非零。
  2. test/test_all.c 聚合 4 个 CuTest 套件：context（test_context.c，
     31 个 SUITE_ADD_TEST）、buckets（test_buckets.c，26 个）、ssl
     （test_ssl.c，6 个）、auth（test_auth.c，9 个），合计 72 个单元用例；
     输出以每用例一个 ./F 字符 + OK (N tests) / Runs/Passes/Fails 汇总。
  3. 运行方式为上游原生 `python3 -m SCons check`，无在线数据集与外部服务
     依赖，全部用例可在 HarmonyOS aarch64 真机离线执行。
  计数方式：fixture 执行数取 check.py 输出的 "== Testing ..." 行数并与
  磁盘 fixture 文件数交叉核对（防空文件假通过）；单元数取 CuTest 进度
  字符数并与 OK (N tests) 交叉核对；discovered/executed/passed/failed
  全部取自框架输出，非静态统计。

# 上游实际运行的测试程序
upstream_tests:
  - file: test/testcases/*.response
    source: serf-1.3.10/test/testcases/
    description: "上游 HTTP 响应解析 fixture 用例（5 个，经 serf_response 运行）"
    command: "python3 -m SCons check"
  - file: test/test_all.c
    source: serf-1.3.10/test/test_all.c
    description: "上游 CuTest 单元测试入口（context/buckets/ssl/auth 4 套件）"
    command: "python3 -m SCons check"
  - file: test/test_context.c
    source: serf-1.3.10/test/test_context.c
    description: "serf 上下文与连接管理单元测试（31 个 SUITE_ADD_TEST）"
    command: "python3 -m SCons check"
  - file: test/test_buckets.c
    source: serf-1.3.10/test/test_buckets.c
    description: "bucket 读写与转换单元测试（26 个 SUITE_ADD_TEST）"
    command: "python3 -m SCons check"
  - file: test/test_ssl.c
    source: serf-1.3.10/test/test_ssl.c
    description: "TLS/证书单元测试（6 个 SUITE_ADD_TEST）"
    command: "python3 -m SCons check"
  - file: test/test_auth.c
    source: serf-1.3.10/test/test_auth.c
    description: "认证单元测试（9 个 SUITE_ADD_TEST）"
    command: "python3 -m SCons check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_serf.c
    description: "消费者冒烟测试：APR 初始化、context/bucket allocator 创建、错误串、版本三元组（8 项检查）"
    command: "./test_serf"

# 测试断言总数（test_package 8 项 + 上游 fixture 5 项 + 上游单元 72 项）
assertion_count: 85
