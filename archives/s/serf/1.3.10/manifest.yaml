software: serf
package: serf/1.3.10
version: "1.3.10"
homepage: "https://serf.apache.org/"
license: "Apache-2.0"
status: built
build_date: "2026-09-20"
build_system: scons

source:
  url: "https://archive.apache.org/dist/serf/serf-1.3.10.tar.bz2"
  sha256: "be81ef08baa2516ecda76a77adf7def7bc3227eeb578b9a33b45f7b41dc064e6"
  tar_format: tar.bz2

build:
  system: scons
  configure_options:
    - "APR=<apr package> APU=<private apr-util prefix in build folder> OPENSSL=<openssl package> ZLIB=<zlib package>"
    - "PREFIX=<package> LIBDIR=<package>/lib DEBUG=False APR_STATIC=True"
    - "CC=clang CFLAGS=-fPIC -O2 LINKFLAGS/CPPFLAGS/LIBS 取自依赖闭包"
    - "scons check 运行上游完整测试套件（fixture + CuTest）"
  dependencies:
    - "apr/1.7.6"
    - "expat/2.8.2"
    - "zlib/1.3.1"
    - "openssl/3.5.6"
    - "apr-util/1.6.3 (vendored: private static sub-build from official sources, not from remote)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "serf 1.3.10 已原生兼容 Python3 与 OpenSSL 3（USE_OPENSSL_1_1_API 自动覆盖 3.x），无需源码补丁"
  - "SCons 构建：registry 无 scons 配方时沿用 gpsd 隔离 pip 安装模式（_scons_env + PYTHONPATH），并将 SCons POSIX SHELL 指向 /system/bin/sh"
  - "SConstruct 仅把 OPENSSL/lib 加入 LIBPATH，zlib 的 include/lib 必须经 CPPFLAGS/LINKFLAGS 从依赖闭包补齐"
  - "scons check 输出解析：fixture 取 '== Testing' 行并与磁盘 .response 文件数交叉核对；单元取 CuTest 进度字符并与 OK (N tests) 交叉核对"
