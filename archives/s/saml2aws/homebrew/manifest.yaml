software: saml2aws
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/homebrew/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "homebrew"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Versent/saml2aws/archive/refs/tags/v2.36.19.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: go

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags='-s -w -X main.Version=2.36.19' -o saml2aws ./cmd/saml2aws/"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.26.3

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-cmd-saml2aws-main.go.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CGO_ENABLED=0 avoid bearsh/hid sockaddr_storage redefinition conflict"
  - "Go ldflags -X needs go clean -cache or direct source edit"
  - "Version injection: cmd/saml2aws/main.go Version='1.0.0' -> '2.36.19'"
  - "TMPDIR=/data/storage/el2/base/cache (R10)"

