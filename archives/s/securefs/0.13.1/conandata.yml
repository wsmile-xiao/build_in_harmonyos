sources:
  url: "https://github.com/netheril96/securefs/archive/refs/tags/0.13.1.tar.gz"
  sha256: "7251a285830e0e132165ffcb3551e555c8236425c093c911b00627f9cf5d5d9c"

# 上游 release/archive 包只含 gitlink（mode 160000），external/ 下三个子模块目录
# 在包里是空的 → add_subdirectory 必失败（fatal error: 'cryptopp/secblock.h' file
# not found）。此处按父仓库 tag 0.13.1 上的**固定 commit** 逐一补齐：
#   git ls-tree 0.13.1 external/   （父仓库 git 树的 gitlink 值）
# commit 与内容哈希绑定，上游即使移动/删除 tag 也不影响可复现性。
submodules:
  cryptopp:
    destination: "external/cryptopp"
    url: "https://github.com/weidai11/cryptopp/archive/69bf6b53052b59ccb57ce068ce741988ae087317.tar.gz"
    sha256: "5a4a4aaa427a5b018faeeab8a1a395c0440a849b166b6f4a50d46d31ff6e608a"
  argon2:
    destination: "external/argon2"
    url: "https://github.com/netheril96/phc-winner-argon2/archive/29e8b21543fdf6266cbfb8712dcabda1fefdff07.tar.gz"
    sha256: "08354832c4b616acdbcfd78967716c51c57b470b0a0fa9bc9959553c4a7d4c76"
  utf8proc:
    destination: "external/utf8proc"
    url: "https://github.com/JuliaStrings/utf8proc/archive/8ca6144c85c165987cb1c5d8395c7314e13d4cd7.tar.gz"
    sha256: "b9eea86f1501a31043f1c74f9aed9cfb9caf1b25353c47fe82c389e81106d03c"

patches:
  - patch_file: "patches/0001-cmake-minimum-version-3.10.patch"
    patch_description: "Raise cmake_minimum_required from 3.0 to 3.10 (CMake >= 4.0 rejects < 3.5 outright)"
    patch_type: "portability"
  - patch_file: "patches/0002-fuse-discovery-posix-branch.patch"
    patch_description: "Take the POSIX FUSE branch on every non-Windows system and stop probing hard-coded /usr/local paths. With CMAKE_SYSTEM_NAME=OHOS the CMake UNIX variable is not defined, so upstream if(UNIX) selected the Windows/WinFsp branch (fuse.h missing, 'C:/Program Files (x86)/WinFsp/lib/winfsp-x64.lib' split by spaces on the clang command line). The dependency prefix injected by the recipe is honoured instead"
    patch_type: "portability"
  - patch_file: "patches/0003-libfuse-version-without-dlsym.patch"
    patch_description: "Call fuse_version() directly instead of dlsym(RTLD_DEFAULT, ...) which returns NULL with a statically linked libfuse and makes 'securefs version' crash"
    patch_type: "portability"
  - patch_file: "patches/0004-cryptopp-cmake-cxxflags-forwarding.patch"
    patch_description: "Drop the CMAKE_CXX_FLAGS forwarding in the vendored cmake-cryptopp glue: CMake does not split an unquoted variable on spaces, so forwarding it to add_compile_options/add_definitions hands clang the whole flag list as one invalid argument (-fPIC -O2 -stdlib=libc++). Global CMAKE_CXX_FLAGS is applied by CMake itself, the forwarding is redundant"
    patch_type: "portability"
  - patch_file: "patches/0005-catch-rng-result-type.patch"
    patch_description: "Catch v1's RandomNumberGenerator declares result_type as std::ptrdiff_t; libc++ (libcxx-ohos from the OHOS 26 SDK) enforces the <random> URBG requirements and static_asserts on a signed result_type as soon as std::shuffle is instantiated, which breaks the securefs_test target. Declare it unsigned int (test-only header, no behaviour change: operator() still returns std::rand() % n)"
    patch_type: "compatibility"
