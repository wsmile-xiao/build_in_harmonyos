# 版本级 manifest
# 文件位置: archives/s/securefs/0.13.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.13.1"
software: "securefs"

# published | built | failed | archived
status: published

build_date: "2026-09-28"
build_system: "cmake"

source:
  url: "https://github.com/netheril96/securefs/archive/refs/tags/0.13.1.tar.gz"
  sha256: "7251a285830e0e132165ffcb3551e555c8236425c093c911b00627f9cf5d5d9c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DFUSE_INCLUDE_DIR=<libfuse/2.9.9 包私有 include 目录>"
    - "-DFUSE_LIBRARIES=<libfuse.a;libulockmgr.a;libohos_pthread_stub.a>"
  dependencies:
    - libfuse/2.9.9
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-minimum-version-3.10.patch"
  - "0002-fuse-discovery-posix-branch.patch"
  - "0003-libfuse-version-without-dlsym.patch"
  - "0004-cryptopp-cmake-cxxflags-forwarding.patch"
  - "0005-catch-rng-result-type.patch"

knowledge_gained:
  - "CMake 4.x 硬拒绝 cmake_minimum_required(<3.5)：上游主 CMakeLists 抬版本号后，vendored 子模块（argon2/utf8proc）仍需 recipe 侧注入 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 统一放行"
  - "OHOS 中 if(UNIX) 为假：上游把非 UNIX 一律当 Windows，导致误走 WinFsp 分支；平台判断必须改成 if(NOT WIN32)"
  - "静态 libfuse.a 下上游的 dlsym 版本探测返回 NULL → 启动即崩溃；静态链接场景应改用编译期版本宏"
  - "cryptopp-cmake 旧版把带空格的 CMAKE_CXX_FLAGS 当单个编译参数转发（unknown argument: '-fPIC -O2 -stdlib=libc++'）；删掉转发项即可，CMake 未加引号的变量展开不会按空格切分"
  - "OHOS libc 无 pthread_cancel/pthread_setcancelstate/pthread_setcanceltype：静态 libfuse.a 的 fuse.o、fuse_loop_mt.o 引用它们 → 链接期 undefined symbol；需 no-op stub（E085 的直调场景，区别于该条目的 weak-symbol 检测场景）"
  - "libc++ 对 Catch::RandomNumberGenerator 触发 static_assert(__libcpp_random_is_valid_urng)：vendored catch.hpp 的 RNG 接口需按 libc++ 要求修正"
  - "Conan 的 cmake.test(cli_args=[...]) 把参数追加给 cmake --build 而非 ctest（cmake 报 Unknown argument -E）；需要带参 ctest 时应直接 self.run('ctest --test-dir ...')"
  - "conan 2.29 的 ConanFile.run(env=...) 需 list 形式且实测不透传给子进程；跨进程传值改用 argv 更可靠"
  - "上游 MountCommand::execute() 先打开 /dev/fuse 再校验凭据：无可用 FUSE 设备时 mount 到不了口令校验，鉴权断言须走免挂载命令 chpass"
