# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: securefs/0.13.1
homepage: "https://github.com/netheril96/securefs"

# 上游测试命令（清点用；ctest -N 在本机列为 4 项）
upstream_check_command: "ctest --test-dir <build> -N"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> -E simple_test --output-on-failure --no-tests=error"

# 上游实际运行的测试程序（与 ctest -N 实测清单一致）
upstream_tests:
  - file: sources/test/main.cpp
    source: securefs-0.13.1/sources/test/main.cpp
    description: "sec_test：Catch2 主程序驱动 btree/crypto/files/streams/utils 单元测试（实测 Passed 1.50s）"
    command: "ctest --test-dir <build> -R '^sec_test$' --output-on-failure"
  - file: external/cryptopp（子模块，固定 commit 69bf6b53）
    source: securefs-0.13.1/external/cryptopp
    description: "cryptest：Crypto++ 自带测试套件（由 vendored 子模块的 CMake 注册；实测 Passed 5.02s）"
    command: "ctest --test-dir <build> -R '^cryptest$' --output-on-failure"
  - file: external/argon2（子模块，固定 commit 29e8b215）
    source: securefs-0.13.1/external/argon2
    description: "argon2_test：Argon2 参考实现测试（由 vendored 子模块的 CMake 注册；实测 Passed 12.76s）"
    command: "ctest --test-dir <build> -R '^argon2_test$' --output-on-failure"
  - file: sources/test/simple_test.py
    source: securefs-0.13.1/sources/test/simple_test.py
    description: "simple_test：真实 FUSE 挂载端到端；需 /dev/fuse（鸿蒙 PC 现状不可用），配方以 -E 排除并在 test_package 用'无 /dev/fuse 优雅失败'用例覆盖该环境行为"
    command: "ctest --test-dir <build> -R '^simple_test$' --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_securefs_e2e.py
    description: "消费者端到端：version / create(加密卷+元数据) / info(免挂载读回) / chpass(错误旧口令被拒) / mount(无 /dev/fuse 优雅失败)"
    command: "python3 test_securefs_e2e.py <已安装包中的 securefs 可执行文件>"

# 测试断言总数 (本包为消费者视角用例数)
assertion_count: 5
