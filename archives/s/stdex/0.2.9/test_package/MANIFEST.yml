# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: stdex/0.2.9
homepage: "https://github.com/oktonion/stdex"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# R51 清点证据: 官方标签 stdex-v0.2.9---build-0.0.94 归档内无 tests/ 目录、
# 无 ctest/pytest 注册、无任何测试源文件（全文件清单: 仅 stdex/include/*.hpp、
# stdex/src/{chrono,mutex,thread}.cpp、build_lib*.sh 与 README/LICENSE）。
# 上游 CI 测试位于独立 tests 分支，不随 0.2.9 发布标签分发，无法在本库归档内运行。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（标签归档内无测试程序，故为空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：stdex::thread 双线程 + stdex::mutex 保护计数器，断言 2x100 增量与 join 后不可再 join"
    command: "./test_stdex"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
