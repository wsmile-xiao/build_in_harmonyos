# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.2.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.9"

# 软件名
software: "stdex"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/oktonion/stdex/archive/refs/tags/stdex-v0.2.9---build-0.0.94.tar.gz"

  # 源码校验和
  sha256: "2fedfb5c3d8f93bba91eef5064eaba699e8e319f3e20e22b1893ab4f92ed8a7f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "stdex 是无构建系统的 C++98 库，需自定义 build() 直接用工具链编译器编译 src/*.cpp 并用 llvm-ar 打包 libstdex.a（R33：编译器取自 tools.build:compiler_executables）"
  - "stdex include/ 下的无扩展名包装头（chrono/mutex/thread/type_traits 等）与标准库同名，若整目录加入 -I 会遮蔽标准库头导致 libc++ 解析失败（std::decay 未定义）；打包时必须安装到 include/stdex/ 子目录"
  - "-std=c++98 与 OHOS libc++ 头不兼容（libc++ 自身头需要 C++11+），需按 profile cppstd=17 编译"
