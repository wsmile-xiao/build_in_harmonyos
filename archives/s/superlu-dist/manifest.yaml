software: superlu-dist
display: "SuperLU_DIST"
description: "Distributed memory, MPI based library for solving large sparse systems of linear equations"
category: math
homepage: "https://github.com/xiaoyeli/superlu_dist"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "MPI 实现须与 parmetis 一致：parmetis/4.0.3 硬绑 open-mpi/5.0.10，本配方同用 open-mpi（混用 mpich 会在依赖图上冲突）"
    - "conan 不生成 FindMPI，故显式给 MPI_C_COMPILER/MPI_CXX_COMPILER/MPIEXEC_EXECUTABLE 指向依赖包 wrapper，让 CMake 从 wrapper 反解"
    - "BLAS 用制品仓 openblas（TPL_ENABLE_INTERNAL_BLASLIB=OFF + TPL_BLAS_LIBRARIES），不透发通用 libblas.a 污染生态"
    - "ParMETIS 经 TPL_PARMETIS_INCLUDE_DIRS / TPL_PARMETIS_LIBRARIES 给绝对路径，跳过上游目录搜索"
    - "Fortran 关闭（XSDK_ENABLE_Fortran=OFF）：设备无 gfortran，C 接口已完整"
  common_dependencies:
    - cmake
    - open-mpi
    - parmetis
    - openblas

versions:
  "9.0.0":
    status: built
    build_date: "2026-09-25"
