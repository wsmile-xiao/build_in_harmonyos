# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 实测申报）

package: superlu-dist/9.0.0
homepage: "https://github.com/xiaoyeli/superlu_dist"

# 上游测试命令：CMake 构建后 ctest 注册（TEST/ 目录下 pdtest/ztest 等驱动）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py 的 build() 中是否已集成上游测试
# 上游 TEST/ 的驱动需要外部矩阵数据文件（Harwell-Boeing .rua / .cua），
# conan create 内不便携带，故 enable_tests=False 保持包构建精简；
# 适配阶段的验证走 test_package 的真实 API 求解（消费者视角）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（TEST/ 下按精度分列的驱动）
upstream_tests:
  - file: TEST/pdtest.c
    source: superlu_dist-9.0.0/TEST/pdtest.c
    description: "双精度分布式求解测试驱动（需 .rua 矩阵数据文件）"
    command: "mpiexec -n 2 ./pdtest -r 1 -c 2 <matrix>.rua"
  - file: TEST/pztest.c
    source: superlu_dist-9.0.0/TEST/pztest.c
    description: "双精度复数分布式求解测试驱动（需 .cua 矩阵数据文件）"
    command: "mpiexec -n 2 ./pztest -r 1 -c 2 <matrix>.cua"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: >
      真实调用分布式 API pdgssvx_ABglobal 求解 5x5 三对角稀疏方程组，
      断言解向量与精确解的误差 < 1e-8，并独立重算残差 ||Ax-b||inf < 1e-8。
      矩阵在内存中按全局 CSC(SLU_NC) 组装，无需外部数据文件。
    command: "./test_superlu_dist"

# 测试断言总数（test_package：解误差 1 项 + 残差 1 项 + info==0 1 项）
assertion_count: 3
