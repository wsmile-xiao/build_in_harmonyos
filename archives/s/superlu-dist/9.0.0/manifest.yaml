# 版本级 manifest — superlu-dist 9.0.0
# 遵循 ARCHIVE-SPEC

version: "9.0.0"
software: superlu-dist
status: built
build_date: "2026-09-25"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/xiaoyeli/superlu_dist/archive/refs/tags/v9.0.0.tar.gz"
  sha256: "aa43d33d4b1b0f5f7b5ad7685e9a6bc25088832c6c74d2ab8f75a2c9f4e9e955"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  package_type: library

  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DXSDK_ENABLE_Fortran=OFF"
    - "-Denable_fortran=OFF"
    - "-Denable_doc=OFF"
    - "-Denable_examples=OFF"
    - "-Denable_tests=OFF"
    - "-DTPL_ENABLE_INTERNAL_BLASLIB=OFF"
    - "-DTPL_BLAS_LIBRARIES=<openblas>/lib/libopenblas.a"
    - "-DTPL_ENABLE_PARMETISLIB=ON"
    - "-DTPL_PARMETIS_INCLUDE_DIRS=<parmetis>/include"
    - "-DTPL_PARMETIS_LIBRARIES=<parmetis>/lib/libparmetis.a;<parmetis>/lib/libmetis.a"
    - "-DMPI_C_COMPILER=<open-mpi>/bin/mpicc"
    - "-DMPI_CXX_COMPILER=<open-mpi>/bin/mpicxx"
    - "-DMPIEXEC_EXECUTABLE=<open-mpi>/bin/mpiexec"

  dependencies:
    - open-mpi/5.0.10
    - parmetis/4.0.3
    - openblas/0.3.33

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "SuperLU_DIST 与仓内 superlu 是两个包：前者分布式 MPI 版，后者串行版，不可互替"
  - "parmetis/4.0.3 硬绑 open-mpi/5.0.10 —— 下游必须同用 open-mpi，否则依赖图冲突"
  - "上游 pdgssvx 要求 A 为 SLU_NR_loc（局部行块）；pdgssvx_ABglobal 接受全局 SLU_NC，适合自包含测试"
  - "v9 头文件移到 SRC/include/（v8 在 SRC/），TriBITS 侧的 FindTPLSuperLUDist 同时接受 superlu_defs.h 与 superludefs.h"
