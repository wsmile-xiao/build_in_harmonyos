software: sentry-native
build_system: cmake
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.13.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.13.3"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/getsentry/sentry-native/archive/refs/tags/0.13.3.tar.gz"

  # 源码校验和
  sha256: "9c830c208fe4d0972ac32b347de0f3aad97c0dce4c0ae8a9e1453850dfd0a9be"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_C_FLAGS=-fuse-ld=/data/service/hnp/bin/ld.bfd"
    - "-DCMAKE_CXX_FLAGS=-fuse-ld=/data/service/hnp/bin/ld.bfd"
    - "-DSENTRY_TRANSPORT=none"
    - "-DSENTRY_BACKEND=inproc"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "sentry-native 在缺少 curl 开发库时需设置 SENTRY_TRANSPORT=none 禁用 HTTP 传输"
  - "cmake 构建 CMAKE_SYSTEM_NAME=Linux 时必须显式设置 CMAKE_SYSTEM_PROCESSOR=aarch64，否则 vendored libunwind 架构检测失败"
  - "G0 clean-verify 脚本（ohc-run.py）当前不支持 cmake 构建系统，只支持 autotools/makefile，需手动验证"
  - "sentry-native 使用 inproc backend 在 OpenHarmony/musl 上运行稳定，module_finder 和 process_spawn 测试因平台差异失败但不阻塞核心功能"
