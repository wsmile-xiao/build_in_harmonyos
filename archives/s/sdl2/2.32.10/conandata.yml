sources:
  url: "https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz"
  sha256: "5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165"

patches:
  "2.32.10":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Declare and integrate the capability-gated native backends"
      patch_type: "portability"
    - patch_file: "patches/0002-cmake-sdlchecks.cmake.patch"
      patch_description: "Probe the complete OHAudio and NativeWindow EGL/GLES2 contracts"
      patch_type: "portability"
    - patch_file: "patches/0003-include-SDL_config.h.cmake.patch"
      patch_description: "Expose capability results in the generated SDL configuration"
      patch_type: "portability"
    - patch_file: "patches/0004-src-audio-SDL_audio.c.patch"
      patch_description: "Register the OHAudio driver when its capability is available"
      patch_type: "portability"
    - patch_file: "patches/0005-src-thread-pthread-SDL_systhread.c.patch"
      patch_description: "Guard asynchronous cancellation with its detected capability"
      patch_type: "portability"
    - patch_file: "patches/0006-src-video-SDL_video.c.patch"
      patch_description: "Register NativeWindow and preserve explicit driver errors"
      patch_type: "portability"
    - patch_file: "patches/0007-include-SDL_hints.h.patch"
      patch_description: "Document the external NativeWindow surface tuple"
      patch_type: "portability"
    - patch_file: "patches/0008-src-audio-SDL_sysaudio.h.patch"
      patch_description: "Declare the OHAudio bootstrap"
      patch_type: "portability"
    - patch_file: "patches/0009-src-video-SDL_sysvideo.h.patch"
      patch_description: "Declare the NativeWindow bootstrap"
      patch_type: "portability"
    - patch_file: "patches/0010-src-audio-ohaudio-SDL_ohaudio.c.patch"
      base_path: "src/audio/ohaudio"
      patch_description: "Implement callback-safe OHAudio native output"
      patch_type: "portability"
    - patch_file: "patches/0011-src-audio-ohaudio-SDL_ohaudio.h.patch"
      base_path: "src/audio/ohaudio"
      patch_description: "Define OHAudio backend state and lifecycle accounting"
      patch_type: "portability"
    - patch_file: "patches/0012-src-video-nativewindow-SDL_nativewindowopengles.c.patch"
      base_path: "src/video/nativewindow"
      patch_description: "Bridge NativeWindow to SDL EGL and GLES2 helpers"
      patch_type: "portability"
    - patch_file: "patches/0013-src-video-nativewindow-SDL_nativewindowvideo.c.patch"
      base_path: "src/video/nativewindow"
      patch_description: "Implement NativeWindow video output with exact EGL visual format negotiation"
      patch_type: "portability"
    - patch_file: "patches/0014-src-video-nativewindow-SDL_nativewindowopengles.h.patch"
      base_path: "src/video/nativewindow"
      patch_description: "Declare NativeWindow EGL and GLES2 helpers"
      patch_type: "portability"
    - patch_file: "patches/0015-src-video-nativewindow-SDL_nativewindowvideo.h.patch"
      base_path: "src/video/nativewindow"
      patch_description: "Define NativeWindow video state and entrypoints"
      patch_type: "portability"
    - patch_file: "patches/0016-src-video-SDL_egl.c.patch"
      base_path: "src/video"
      patch_description: "Use the unversioned EGL and GLES provider names exposed by NativeWindow targets"
      patch_type: "portability"
    - patch_file: "patches/0017-CMakeLists-virtual-joystick.patch"
      patch_description: "Keep the virtual joystick test backend independent of HIDAPI"
      patch_type: "portability"
