# test_package/MANIFEST.yml — 上游测试声明（shine 3.1.1）
package: shine/3.1.1
homepage: "https://github.com/toots/shine"

# 上游测试命令分析：autotools 包，执行 make check 得到的实际注册目标为空
upstream_check_command: "make check"

# conanfile.py 的 build() 中未集成上游测试（上游 release tarball 无独立测试套件）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无独立上游测试入口
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，实测调用公开 API 并校验 MP3 输出）
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 shine 公开 API（config 校验/initialise/encode/flush），对 4 段正弦波 PCM 编码并校验 MP3 0xFFE 帧同步字"
    command: "./test_shine"

# 测试断言总数（test.c 中 10 个可观察断言分支 + 输出字节量校验）
assertion_count: 11