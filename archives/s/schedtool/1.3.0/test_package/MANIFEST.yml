package: schedtool/1.3.0
homepage: "https://github.com/freequaos/schedtool"

# The 1.3.0 source archive contains no upstream test suite or check/test target.
# Evidence: upstream tag's Makefile, README and INSTALL; the Makefile
# has only build, clean, installation, affinity_hack and release targets.
# This is an absence declaration, not a claim that upstream tests passed.
upstream_check_command: "not available: upstream 1.3.0 has no test/check target"
upstream_test_in_build: false
upstream_test_command: "not available: no upstream test suite"
upstream_tests: []

test_package_tests:
  - file: test_schedtool.py
    description: >-
      Seventeen native functional cases plus one prerequisite check. Verifies
      short/long help and exact version output, no-argument usage, policy range queries, real self-query
      output, invalid options, missing execution parameters, SCHED_OTHER exec
      with argument and exit-status preservation, nice 19, CPU affinity list
      and hexadecimal forms, combined settings, and both named/raw policy
      rejection diagnostics. Independent Python os scheduling APIs read back
      the resulting state. All setters affect only newly launched processes;
      no realtime policies, privilege escalation, or external PID changes.
      Missing native APIs, command timeouts, and failed readbacks are failures.
    command: "python3 test_schedtool.py --binary /absolute/path/to/package/bin/schedtool --report schedtool-tests.json"

# Approximate successful-path count; the JSON report records the exact count.
assertion_count: 103

# Runtime prerequisites: native Python 3 with os.sched_getscheduler,
# os.sched_getparam, os.sched_get_priority_min/max, os.getpriority and
# os.sched_getaffinity; an ordinary SCHED_OTHER calling process; CPU IDs <1024.
# Actual OHOS execution is required. Linux execution is auxiliary evidence only.
# Successful -r output does not prove that every reported policy can be set.
