# 官方简体中文词典（上游发布件；源码包不含词典，PHP 测试脚本
# phpext/scws_test.php 的 17 条用例即以此词典为准）
dict:
  url:
    - "https://www.xunsearch.com/scws/down/scws-dict-chs-utf8.tar.bz2"
  sha256: "0f43956721561b1f5f0102b529dbe24a1aa15b9fb6c05446367db2717f462af3"

patches:
  - patch_file: "patches/0001-config.guess-harmonyos.patch"
    patch_description: "HarmonyOS 平台识别：config.guess 新增 *:HarmonyOS:*:* 分支，映射到 <machine>-unknown-linux-ohos（OHOS CI worker 原生构建时 config.guess 无法猜测系统类型）"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-linux-ohos.patch"
    patch_description: "config.sub 接受 linux-ohos* 作为合法 kernel-OS 组合与 -linux-ohos* 目标 OS 后缀（2014 年版不认识 ohos）"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask-022.patch"
    patch_description: "config.status 临时目录改用 umask 022（OHOS worker 的 HMDFS 给新目录强制 setgid 位，umask 077 得到 drwx--S--- 连 owner 都无法进入，config.status 报 'could not setup config files machinery'）"
    patch_type: "portability"
  - patch_file: "patches/0004-cli-makefile-vpath-libscws.patch"
    patch_description: "cli/Makefile.in 的 scws_LDADD/scws_gen_dict_LDADD 改用 $(top_builddir)/libscws/libscws.la（上游写死 $(top_srcdir)，VPATH 构建时源码树里不存在 libscws.la，cli 链接报 'No rule to make target'）；只改 Makefile.in 不动 Makefile.am，避免触发旧版 automake 重生成"
    patch_type: "portability"
