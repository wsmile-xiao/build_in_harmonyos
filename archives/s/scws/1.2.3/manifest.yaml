# 版本级 manifest
# 文件位置: archives/s/scws/1.2.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.3"

# 软件名
software: "scws"

# 编译状态
# published | built | failed | archived
# 本地 macOS 交叉验证（ohos-local）通过后由 finish/CI 更新为 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（scws 官网 xunsearch 官方发布）
  url: "https://www.xunsearch.com/scws/down/scws-1.2.3.tar.bz2"

  # 源码校验和
  sha256: "60d50ac3dc42cff3c0b16cb1cfee47d8cb8c8baa142a58bc62854477b81f1af5"

  # 压缩格式
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--host=aarch64-unknown-linux-ohos"

  # 编译依赖列表（无外部依赖，仅需 libm）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-config.guess-harmonyos.patch"
  - "patches/0002-config.sub-linux-ohos.patch"
  - "patches/0003-configure-umask-022.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ref: E122/E268/E072 — autotools config.guess/config.sub 增加 linux-ohos 识别（同型复用）"
  - "ref: DRAFT-scws-1.2.3-libtool-cross-ld-empty-archive-cmds — 交叉构建 libtool 经编译器驱动探测到宿主 /usr/bin/ld → archive_cmds 为空 → .so 静默缺失；固定 LD=ld.lld 解决（本次新增草稿）"
  - "ref: archives/l/libopendbx/1.4.6 — libtool host_os 陷阱：host 三元组必须保留 vendor 位（aarch64-unknown-linux-ohos），否则 host_os=ohos 不匹配 libtool linux* 分支"
  - "ref: archives/l/libidl2/0.8.14 — config.status 临时目录 umask 077→022（HMDFS setgid 位）同型处理"
