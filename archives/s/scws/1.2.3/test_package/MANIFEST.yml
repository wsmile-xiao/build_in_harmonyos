# test_package/MANIFEST.yml
# 上游官方测试 + 适配后测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 计数口径（统一口径，贯穿 MANIFEST / notes / 测试日志 / PR 表格）：
#   「测试用例数量」——上游按其测试脚本原生的用例数计；适配后新增测试
#   按独立检查项计（每个可单独判定成败的检查项计 1）。
#
# 上游测试清点证据（scws-1.2.3.tar.bz2 官方源码包）：
#   - 源码包无 tests/ / test/ 目录，4 个 Makefile.am 均无 TESTS /
#     check_PROGRAMS / check-local（`make check` 为空操作）；
#   - 上游唯一测试脚本: phpext/scws_test.php（"SCWS auto test"），
#     内含 $TEST_DATA 17 条用例 = 输入文本 + 选项 + 期望分词结果；
#   - 其余目录（phpext/win32 的 .zip/.vcpj、win32/ MSVC 工程）不含测试。
#   → 上游用例数 N = 17。

package: scws/1.2.3
homepage: "http://www.xunsearch.com/scws/"

upstream_check_command: "php phpext/scws_test.php（需 php-scws 扩展；CI 无 PHP 工具链，见下）"
upstream_test_in_build: false
upstream_test_command: "test_package/upstream_test.c 逐条复刻 phpext/scws_test.php 的 17 条用例"

# 上游测试用例（17 条，来源 phpext/scws_test.php，逐条复刻执行）
upstream_tests:
  - file: "phpext/scws_test.php"
    source: "scws-1.2.3/phpext/scws_test.php"
    description: "SCWS 官方自动测试脚本，$TEST_DATA 共 17 条中文分词用例（含 multi/ignore/duality 选项组合与人名识别用例）；由 test_package/upstream_test.c 以 C API 逐条复刻同样的输入/选项/期望输出"
    command: "./upstream_test <pkg>/share/scws/dict.utf8.xdb <pkg>/etc/rules.utf8.ini"

# 适配后新增测试（独立检查项）
test_package_tests:
  - file: upstream_test.c
    description: "上游 17 条用例复刻执行（T01-T17），使用官方词典 dict.utf8.xdb + 包内 rules.utf8.ini；构建开启 --enable-namerule 以复现人名用例"
    command: "./upstream_test <dict> <rules>"
  - file: test.c
    description: "T1 SCWS_VERSION 宏校验；T2 公共 xdb API 造词典（写路径 flock）；T3 mmap 模式 xdb 词典分词；T4 文本词典 MEM 模式分词；T5 包内 rules.utf8.ini 规则集分词"
    command: "./test_scws <workdir> <rules>"
  - file: test.c
    description: "T6 [鸿蒙特有] OHOS 上 mmap() 映射 xdb 并校验 XDB 头标签（libscws/xdb.c HAVE_MMAP 读路径依赖）；T7 [鸿蒙特有] OHOS 上 flock(LOCK_EX|LOCK_NB)/LOCK_UN（libscws/lock.c 词典写锁依赖）"
    command: "./test_scws <workdir> <rules> （仅 OHOS 编译时启用）"
  - file: test.sh
    description: "C1 scws-gen-dict 文本词典转 xdb；C2 scws CLI 用生成的 xdb 分词"
    command: "SCWS_PKG=<pkg> TEST_SRC=<src> TEST_WORK=<work> bash test.sh"

# 用例/检查项统计（统一口径）
#   上游用例: 17（phpext/scws_test.php $TEST_DATA）
#   适配后新增独立检查项: T1-T5（5）+ T6-T7（鸿蒙特有 2）+ C1-C2（2）= 9
#   适配后合计: 17 + 9 = 26
upstream_case_count: 17
adaptation_assertion_count: 9
assertion_count: 26
