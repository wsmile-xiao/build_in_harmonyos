knowledge_gained:
  - "OHOS libc/NDK 只提供经典（非重入）解析器 API（res_init/res_query/res_search/res_send/res_mkquery + dn_expand/dn_skipname），没有 glibc 的 res_ninit/res_nquery/res_nclose（NDK resolv.h 无声明，nm -D /system/lib64/libc.so 也无符号）——glibc 移植的 DNS 客户端需改用 res_query + 全局 h_errno（E516 同族）"
  - "OHOS nameser.h 完整提供 HEADER/T_A/T_MX/T_AAAA/C_IN/HFIXEDSZ/QFIXEDSZ/INT16SZ/INT32SZ/MAXDNAME/GETSHORT，dn_expand 在 libc 中为弱符号（W）但运行可用——响应解析代码可原样保留，只需替换查询入口"
  - "res_query 在 OHOS 真机实测可用：halon.io MX 返回 2 条答案（type=15）且 dn_expand/dn_skipname 解析正确；localhost 的 MX 返回 NO_DATA 时按上游语义回退 A/AAAA"
  - "上游 cmake_minimum_required(VERSION 2.8) 被 CMake 4.x 拒绝（<3.5 兼容已移除）；上游 v1.1.5 的修法（PR #13）即提升 policy 版本——本配方用 CMAKE_POLICY_VERSION_MINIMUM=3.5 达成同样效果，零补丁"
  - "OHOS 上 CMAKE_SYSTEM_NAME=OHOS 使上游的 `IF (CMAKE_SYSTEM_NAME STREQUAL \"Linux\")` 分支不生效，不会链接 resolv；res_query 来自 libc.so，无需额外链接库；-lpthread 解析到 NDK 的 libpthread.a"
  - "上游无自动化测试（无 tests/ 目录、CMakeLists 无 enable_testing()/add_test()）；test_package 以 mock SMTP 服务器回环 E2E 补全 15 条消费者断言"

