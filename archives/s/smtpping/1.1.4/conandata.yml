  sha256: "beca8c44133b91ebe9fdfd044d8dee0947aa7683cba7b0e509ce15cda8fef74a"

patches:
  # OHOS libc/NDK provide only the classic (non-reentrant) resolver API:
  # res_init/res_query/res_search/res_send/res_mkquery + dn_expand/dn_skipname.
  # res_ninit/res_nquery/res_nclose are absent from <resolv.h> and libc.so
  # (verified on device: nm -D /system/lib64/libc.so). Port the POSIX branch of
  # Resolver to res_query() + the global h_errno; smtpping is single-threaded
  # per process (parallelism uses fork), so global state is safe.
  - patch_file: "patches/0001-resolver.cpp.patch"
    patch_description: "Port DNS lookups from res_ninit/res_nquery/res_nclose to res_query() + global h_errno (OHOS lacks the glibc reentrant resolver API)"
    patch_type: "portability"
  # Drop the glibc-only struct __res_state member and include <netdb.h> for
  # h_errno/NO_DATA; keep GetLastError() working via the global h_errno.
  - patch_file: "patches/0002-resolver.hpp.patch"
    patch_description: "Remove the struct __res_state member and use the global h_errno; add <netdb.h> include"
    patch_type: "portability"
