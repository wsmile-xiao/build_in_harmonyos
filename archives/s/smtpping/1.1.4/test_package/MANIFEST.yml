# test_package/MANIFEST.yml — smtpping 1.1.4
# R34/R51: test_package must exercise the packaged binary

package: smtpping/1.1.4
homepage: "https://github.com/halon/smtpping"

# R51 上游测试三步法:
# 1. 清点: 源包共 9 个文件（CMakeLists.txt/LICENSE/README.md/resolver.cpp/
#    resolver.hpp/smtpping.1/smtpping.cpp/smtpping.dev/.gitignore），无
#    tests/、test/、unittests/ 目录；CMakeLists.txt 无 enable_testing()/
#    include(CTest)/add_test()，无任何测试框架依赖；上游仅安装二进制与 man
#    手册（smtpping.dev 为 Windows Dev-C++ 工程文件，非测试）。
# 2. 实测: 无测试目标可运行（`cmake --build . --target test` 无注册用例）。
# 3. 结论: 上游真实可运行测试数 = 0，PR 声明 0，不多报不少报。

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "none  # 无 check/test 目标，无 enable_testing()/add_test()"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (0 个)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 15 条断言)
test_package_tests:
  - file: test.sh
    description: >-
      A1 二进制可执行; A2 -v 输出 1.1.4; A3 无参数退出码 2 + stderr usage;
      A4 -h 退出码 0 + stdout usage; A5 mock SMTP 服务器就绪; A6 对 mock
      服务器的完整 SMTP 事务探测退出码 0; A7 统计输出 "1 e-mail messages
      transmitted"; A8 统计头 "SMTP ping statistics"; A9-A12 transcript 含
      HELO/MAIL FROM/RCPT TO/QUIT; A13 mock 服务器完成会话退出码 0;
      A14 关闭端口负路径 connect() failed + no pings sent; A15 MX->A/AAAA
      解析回退路径不崩溃（退出码 0）
    command: "bash test.sh"

# 测试断言总数 (15: CLI 契约 4 + 回环 E2E 9 + 负路径 2)
assertion_count: 15
