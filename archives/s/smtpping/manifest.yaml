# 软件级 manifest — smtpping
# 文件位置: archives/s/smtpping/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: smtpping
display: "SMTP Ping"
description: "SMTP server delay/variation/throughput measurement tool (ping for SMTP)"
category: utility
homepage: "https://github.com/halon/smtpping"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS libc/NDK 缺少 glibc 重入解析器 API（res_ninit/res_nquery/res_nclose 无声明无符号），补丁将 Resolver 移植到经典 res_query() + 全局 h_errno（smtpping 每进程单线程、fork 并发，全局态安全）"
    - "OHOS nameser.h 提供全部响应解析原语（HEADER/T_A/T_MX/T_AAAA/C_IN/HFIXEDSZ/QFIXEDSZ/INT16SZ/INT32SZ/MAXDNAME/GETSHORT），dn_expand 为 libc 弱符号且运行可用，解析逻辑零改动"
    - "上游 cmake_minimum_required(VERSION 2.8) 被 CMake ≥4.0 拒绝；配方注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（上游 v1.1.5 同款修法），源码零改动"
    - "OHOS 下 CMAKE_SYSTEM_NAME=OHOS 使上游的 resolv 链接分支不生效；res_query 由 libc.so 导出，无需 -lresolv；-lpthread 解析到 NDK libpthread.a"
    - "上游无测试套件；test_package 以 mock SMTP 服务器回环 E2E 补全 15 条消费者断言（CLI 契约 4 + 全事务 E2E 9 + 负路径 2）"
  common_dependencies: []

versions:
  "1.1.4":
    status: built
    build_date: "2026-09-20"
    conan_ref: "smtpping/1.1.4"
