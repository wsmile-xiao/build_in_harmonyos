software: squashfs-tools
display: "SquashFS Tools"
description: "Tools for creating and extracting SquashFS compressed filesystem images"
category: system
homepage: "https://github.com/plougher/squashfs-tools"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "musl libc 缺少 pthread_cancel，需添加 pthread_compat.c 存根文件"
    - "使用 Makefile 构建，无 configure 脚本"
    - "依赖 zlib"
  common_dependencies:
    - zlib

versions:
  "4.6.1":
    status: built
    build_date: "2026-04-24"
