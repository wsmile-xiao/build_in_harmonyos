# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点证据 (R51)：
#   1. 上游 GitHub 官方源包 v1.1.5（serialDV-1.1.5.tar.gz，sha256
#      9ff90d85ff613e81659a2d661515e01d3c1f3ad1cade58908838b97fdd7ab5d2）
#      顶层文件清单仅 17 项，无 tests/、test/、unittests/ 目录；
#   2. CMakeLists.txt 无 enable_testing()/include(CTest)/add_test()，
#      未注册任何 ctest 用例（上游无自动化测试套件）；
#   3. 唯一带测试性质的文件是 dvtest.cpp（install 到 bin/ 的工具），运行需要
#      真实 AMBE3000 设备（ThumbDV 串口）或 AMBE-over-UDP 服务器；
#      samples/*.raw 仅为测试音频输入样本，非断言型用例；
#   4. CI 环境无 DV 硬件与 AMBE 服务端，dvtest 端到端用例不可运行。
#   因此上游自动化用例数 = 0，适配后按赛道底线补全消费者测试（见下）。

package: serialdv/1.1.5
homepage: "https://github.com/f4exb/serialDV"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (上游无自动化测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，不替代上游测试统计)
test_package_tests:
  - file: test_serialdv.cpp
    description: >-
      消费者 API 回归：协议常量与 MBE 帧长/位数全速率矩阵（含上游表格空缺
      的 DVRate7100x4400/DVRate2400 返回 0 的行为断言）、关闭态控制器拒绝
      encode/decode、非 TTY 串口路径/UDP 非本地对端/UDP 非法入参的错误路径、
      DummyDataController 契约
    command: "./test_serialdv"

# 测试断言总数 (精确值): 59
assertion_count: 59
