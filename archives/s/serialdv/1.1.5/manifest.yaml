knowledge_gained:
  - "OHOS 的 CMake 平台模块（Platform/OHOS.cmake -> Platform/Linux）不支持 SONAME：VERSION/SOVERSION 不生成 DT_SONAME 与版本化符号链接；需在 generate() 注入 -Wl,-soname,<实际文件名>（CI L5a 硬性门禁） (ref: E274)"
  - "OHOS CMake 构建不写 RPATH：包内工具（bin/dvtest）直接执行需 LD_LIBRARY_PATH；CI L2 为非阻塞项，库消费者由 Conan 生成器接管链接参数 (ref: E019)"
