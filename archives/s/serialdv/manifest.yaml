# 软件级 manifest — serialdv
# 文件位置: archives/s/serialdv/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: serialdv
display: "SerialDV"
description: "C++ interface to encode/decode audio with AMBE3000 based devices in packet mode"
category: library
homepage: "https://github.com/f4exb/serialDV"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "零补丁适配：OHOS SDK sysroot 已提供 linux/serial.h（struct serial_struct）、TIOCGSERIAL/TIOCSSERIAL（aarch64-linux-ohos/bits/ioctl.h）、ASYNC_LOW_LATENCY（linux/tty_flags.h）与 B230400/B460800（bits/termios.h）"
    - "上游按 CMakeLists 固定构建 SHARED；OHOS CMake 平台不生成版本化文件名/SONAME（VERSION/SOVERSION 无效），配方 generate() 注入 -Wl,-soname,libserialdv.so（与安装文件一致，CI L5a 要求）；非系统同名库，由 Conan 管理依赖链（R26）"
    - "BUILD_TOOL 默认 ON（与上游一致），dvtest 工具随包安装到 bin/，由软件级 commands.json 声明（R38）"
    - "运行期需要 AMBE3000 硬件（串口 ThumbDV）或 AMBE-over-UDP 服务端；CI 不含硬件，验证以消费者 API 测试 + 设备侧 UDP 回环联调为准"
  common_dependencies: []

versions:
  "1.1.5":
    status: built
    build_date: "2026-09-19"
    conan_ref: "serialdv/1.1.5"
