software: sdl3_image
version: "3.4.4"
status: built
build_date: "2026-05-25"
build_system: cmake

source:
  url: "https://github.com/libsdl-org/SDL_image/archive/refs/tags/release-3.4.4.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DSDL3_DIR=/storage/Users/currentUser/usr/local/lib/cmake/SDL3"
    - "-DSDLIMAGE_SAMPLES=OFF"
    - "-DSDLIMAGE_TESTS=OFF"
    - "-DSDLIMAGE_STRICT=OFF"
    - "-DSDLIMAGE_AVIF=OFF"
    - "-DSDLIMAGE_JXL=OFF"
    - "-DSDLIMAGE_WEBP=OFF"
    - "-DSDLIMAGE_TIF=OFF"
    - "-DSDLIMAGE_PNG=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies:
    - "sdl3/3.4.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "SDL3_image uses cmake build system (not autotools)"
  - "SDL3 dependency required (>= 3.4.0), built from source due to no prebuilt available"
  - "OpenHarmony platform not recognized by SDL cmake, need CMAKE_SYSTEM_NAME=Linux"
  - "SDL3 shared library fails on OpenHarmony due to missing pthread_setcanceltype"
  - "SDL3 static library builds successfully on OpenHarmony"
  - "SDL3_IMAGE builds as static library only due to SDL3 only available as static"