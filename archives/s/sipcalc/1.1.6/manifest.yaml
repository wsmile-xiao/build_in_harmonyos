software: sipcalc
build_system: autotools
# 文件位置: archives/{letter}/{name}/1.1.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.6"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/s/sipcalc/sipcalc_1.1.6.orig.tar.gz"

  # 源码校验和
  sha256: "cfd476c667f7a119e49eb5fe8adcfb9d2339bc2e0d4d01a1d64b7c229be56357"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 环境变量
  env:
    LD_LIBRARY_PATH: "/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/lib:/storage/Users/currentUser/usr/local/lib"
    TMPDIR: "$HOME/tmp"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - E011: "HMDFS umask 077 权限问题 — configure/config.status tmp 目录不可写，解决方案：使用 TMPDIR 路径并去掉 umask 077"
  - "OHOS SDK lld 链接器依赖 libxml2.so.16，LD_LIBRARY_PATH 需包含 SDK llvm/lib 路径"
  - "sipcalc 原始下载URL不可达，需使用 Debian 镜像"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/sipcalc-1.1.6.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/sipcalc-1.1.6.work
  source_orig_hash: 99514dd970ba99a7
  source_work_hash: d6f19aa26a6f473a
  generated_at: '2026-06-03T18:36:55'
  patches_count: 1

patch_classification:
  - file: 0001-configure.patch
    type: platform_hmdfs
    platform_only: True
    guard: "test -d /storage/Users/currentUser/tmp && ! chmod 777 $(mktemp -d ./confXXXXXX) 2>/dev/null"
