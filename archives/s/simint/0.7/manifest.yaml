# 版本级 manifest — simint 0.7

version: "0.7"
software: "simint"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 bennyp.org）
  url: "https://www.bennyp.org/research/simint/download/simint-v0.7.tar.bz2"

  # 源码校验和（SHA-256，来自 FreeBSD ports）
  sha256: "9851fa2323924d4732dd611b366219f4408c8561556abb5e4fa6dbb64a8f919c"

  # 压缩格式
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（OHOS aarch64 适配）
  configure_options:
  - "-DSIMINT_VECTOR=scalar"
  - "-DSIMINT_MAXAM=3"
  - "-DENABLE_TESTS=ON"
  - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（无运行时依赖，纯 C/C++，OpenMP 由编译器提供）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（OHOS aarch64 通过 scalar 适配，无需额外补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "simint 为 CMake 项目，必须指定 SIMINT_VECTOR；OHOS aarch64 无 x86 SSE/AVX 指令，强制 scalar 保证可移植"
- "SIMINT_MAXAM 默认为 7（g 函数），OHOS 预设 3（f 函数，AM=3）以平衡功能与真机 OOM：真机 1GB 内存下 AM=4 会触发 /bin/sh: Out of memory，降至 3 后单 job 编译内存 <600MB"
- "上游测试通过 ENABLE_TESTS 构建 4 个可执行文件（test_eri / test_eri_deriv1 / benchmark_eri / screentest），通过 ctest 统一调度"
- "校区 clang 15 在 OHOS 上无需额外 -fopenmp，对标 DefaultFlags.cmake 中 GNU 需 -fopenmp、Clang 默认不加"
- "cmake.build(cli_args=['-j1']) 强制单并发，避免 make -j$(nproc) 在小内存真机上 fork 风暴导致 ENOMEM"
