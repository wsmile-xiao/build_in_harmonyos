# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: simint/0.7
homepage: "https://www.bennyp.org/research/simint/"

# 上游测试命令 (用于 ctest 统计)
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试审计
# 上游 simint 0.7 通过 ENABLE_TESTS=ON 构建 4 个测试可执行文件
# (test_eri / test_eri_deriv1 / screentest / benchmark_eri，见 simint-v0.7/test/CMakeLists.txt
# 中的 ADDTEST(...) 宏调用，均需一个 test/dat/*.mol 基组文件作为参数)。
# 但上游未调用 enable_testing()/add_test()，因此默认无任何 ctest 条目
# (ctest -N 为 0)。本配方在构建时对上游 test/CMakeLists.txt 与顶层 CMakeLists.txt
# 做最小适配：enable_testing() + add_test() 注册上述 4 个可执行文件为 ctest 条目
# (输入采用 test/dat/water.sto-3g.mol，S/P 壳，满足 SIMINT_MAXAM=3)。
# 同时让 test_eri / test_eri_deriv1 在任意 AM 分组超过精度阈值(>1e-14 且 >1e-8)时
# 以非零退出码失败，使 ctest 能真实反映精度验证结果。
# 故 upstream_test_total=4、upstream_test_count_method=ctest_entries 为合法口径，
# 计数来源为真机 ctest --output-on-failure 输出（单一来源，无推算）。

# 上游实际运行的测试程序 (ENABLE_TESTS=ON 时构建 4 项，经适配注册为 ctest 条目)
upstream_tests:
  - file: test/test_eri.cpp
    source: simint-0.7/test/test_eri.cpp
    description: "精度验证: 对比 Valeev 参考值（多 AM 分组，超阈值分组经适配以非零退出码失败）"
    command: "ctest -R test_eri --output-on-failure"
  - file: test/test_eri_deriv1.cpp
    source: simint-0.7/test/test_eri_deriv1.cpp
    description: "一阶导数精度验证（同 test_eri，超阈值以非零退出码失败）"
    command: "ctest -R test_eri_deriv1 --output-on-failure"
  - file: test/screentest.cpp
    source: simint-0.7/test/screentest.cpp
    description: "屏蔽 (screening) 测试（内部逻辑不一致时抛异常而非零退出）"
    command: "ctest -R screentest --output-on-failure"
  - file: test/benchmark_eri.cpp
    source: simint-0.7/test/benchmark_eri.cpp
    description: "性能基准测试（烟测：可正确读取分子文件并完成积分基准运行）"
    command: "ctest -R benchmark_eri --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 simint_init / shell 初始化/分配/归一化 / finalize (s+p 壳)"
    command: "./test_simint"

# 测试断言总数 (上游 4 个 ctest 项 + 消费者 1 项)
assertion_count: 4

# 上游测试审计结论
upstream_tests_exist: true
upstream_test_audit: |
  已审计上游官方发布包 simint-v0.7.tar.bz2（sha256=9851fa2323924d4732dd611b366219f4408c8561556abb5e4fa6dbb64a8f919c）：
  - test/ 存在 4 个测试可执行文件源（test_eri.cpp / test_eri_deriv1.cpp / screentest.cpp / benchmark_eri.cpp）及 test/dat/*.mol 数据。
  - 上游缺省不注册任何 ctest 条目（无 enable_testing()/add_test()），亦未提供自动测试调度。
  - 本配方做最小适配：注册 4 个可执行文件为 ctest 条目并让精度测试真实返回退出码，接入真机 ctest 执行。
  upstream_test_total=4（ctest_entries 口径），非 no_tests。
upstream_test_total: 4
upstream_test_count_method: ctest_entries
