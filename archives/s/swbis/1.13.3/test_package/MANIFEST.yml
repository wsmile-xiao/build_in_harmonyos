# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: swbis/1.13.3
homepage: "https://www.gnu.org/software/swbis/"

# 上游测试命令 (make check = testsuite1 5 项 + shell_lib 2 项，共 7 项)
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游实际运行的测试程序（testsuite1 5 项 + shell_lib 2 项；顶层 make check 会递归进 swsupplib/shell_lib）
# 上游全口径 N=39：回归脚本 test001–test035（35）+ testdig/testdig2（2）+ shell_lib harness（test_write、test_isc_01）；
# 运行 7（通过 6 + tartest1/test030 在 OHOS UID 溢出下 skip），32 项不在 make check 默认路径内
# （A组缺 rpm 输入集 18：test001–007、test010–020；B组无 make target 孤儿 8：test021–023、test031–035；
#  C组需 GPG 交互 6：test024–029 swign 系列）。发布 tarball 内实测 0 个 .rpm 文件。
upstream_tests:
  - file: swsupplib/tests/testdig.sh
    source: swbis-1.13.3/swsupplib/tests/testdig.sh
    description: "shorttest：md5/sha1 摘要代码短测试"
    command: "make shorttest"
  - file: swsupplib/tests/testdig2.sh
    source: swbis-1.13.3/swsupplib/tests/testdig2.sh
    description: "shorttest2：md5/sha1 摘要代码短测试（第二组）"
    command: "make shorttest2"
  - file: tests/regression/Makefile
    source: swbis-1.13.3/tests/regression/Makefile
    description: "parsertest：parser 回归 test008"
    command: "make parsertest"
  - file: tests/regression/Makefile
    source: swbis-1.13.3/tests/regression/Makefile
    description: "parsertest2：parser 回归 test009"
    command: "make parsertest2"
  - file: tests/regression/Makefile
    source: swbis-1.13.3/tests/regression/Makefile
    description: "tartest1：swpackage/tar 回归 test030（高 UID 设备上以 gnu+uid/gid/uname/gname/chksum 掩码方式真实比对，其余系统走原始 ustar；仅无 GNU tar 时上游跳过）"
    command: "make tartest1"
  - file: swsupplib/shell_lib/test_write.c
    source: swbis-1.13.3/swsupplib/shell_lib/test_write.c
    description: "shell_lib 自检：test_write 输出与 shell_lib.sh 一致性比对"
    command: "make check (swsupplib/shell_lib)"
  - file: swsupplib/shell_lib/test_isc_01.sh
    source: swbis-1.13.3/swsupplib/shell_lib/test_isc_01.sh
    description: "shell_lib 目录选择测试：installed_software unpack + catalog 选择"
    command: "make check (swsupplib/shell_lib)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_swbis.sh
    description: "消费者冒烟测试（独立 shell，与 conanfile.py 内联逻辑一致）：swpackage/swlist 版本断言 + 打包小载荷非空/catalog 断言；同时满足 CI L0c 测试源文件门禁"
    command: "sh test_swbis.sh [bindir]"
  - file: hellopkg.psf
    description: "消费者功能测试：swpackage --version 断言 1.13.3、swlist --version 断言 1.13.3、swpackage -s PSF 打包小载荷并断言 tar 非空且含 catalog"
    command: "swpackage --version + swlist --version + swpackage -s hellopkg.psf"

# 测试断言总数
# test_package 断言: swpackage 版本匹配 1 + swlist 版本匹配 1 + 预览解析 1 + tar 非空 1 + catalog 断言 1 = 5，标记按 3 个用例口径统计
assertion_count: 5
