software: swbis
version: "1.13.3"
status: built
compile_date: "2026-09-16"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/swbis/swbis-1.13.3.tar.gz"
  sha256: "b88930826066d70798f42dad6480ebd89d7f5d6d3209234af520358adcda697a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--with-no-flex"
    - "--with-no-bison"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "swbis 是纯 Autotools 命令行工具集，无外部 Conan 依赖，零依赖即合规（R36 前置检查为空）"
  - "configure 含 umask 077 临时目录逻辑，HMDFS 下需放宽为 022（E011 同类）"
  - "上游 make check = testsuite1 共 5 项；tartest1 无 GNU tar 时上游静默跳过，配方如实计 skipped"
  - "swpackage 为 filter 模式（PSF 经 stdin、tar 经 stdout），test_package 用真实 PSF 打包断言 tar 非空且含 catalog"
  - "tartest1 在 OHOS 高 UID 下以 gnu+uid/gid/chksum 掩码方式真实运行（HMBS-TAR-UIDMASK），不跳过；仅无 GNU tar 时计 skipped"

conan_verify: "pending HMBS preflight"
ci_build_and_test: "pending HMBS preflight"
