software: swbis
display: "GNU swbis"
description: "POSIX software administration utilities (swpackage/swverify/swcopy/swinstall/swlist/swremove/swconfig/swign)"
category: system
homepage: "https://www.gnu.org/software/swbis/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 Autotools 命令行工具集，零外部依赖"
    - "configure umask 077 放宽为 022 适配 HMDFS"
    - "config.guess 不识别 OHOS，以 --build/--host=aarch64-unknown-linux-gnu 跳过探测"
    - "以上游随包生成的 parser/lexer 构建（--with-no-flex/--with-no-bison），无需 flex/bison 工具依赖"
    - "make check（testsuite1 共 5 项）全量运行，无 GNU tar 时 tartest1 如实计 skipped"
  common_dependencies: []

versions:
  "1.13.3":
    status: built
    build_date: "2026-09-16"
    compile_date: "2026-09-16"
    patches_count: 0
