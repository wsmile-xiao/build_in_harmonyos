    ci_result: "pending HMBS preflight"
    dependencies: []
    artifacts:
      - "bin/swpackage (tar archive packager)"
      - "bin/swverify (package verifier)"
      - "bin/swcopy/swinstall/swlist/swremove/swconfig/swign"
