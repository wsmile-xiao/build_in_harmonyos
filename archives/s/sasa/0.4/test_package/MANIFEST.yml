# test_package/MANIFEST.yml — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sasa/0.4
homepage: "https://git.devuan.org/leepen/standalone-socket-activate"

# 上游测试总数与统计口径（rule4 强制要求）
# sasa 使用 make check 运行 tests/ 下的 5 个 shell 脚本，每个脚本一个用例，
# 与 autotools 测试套件等价，故采用 autotools_tests 口径
upstream_test_total: 5
upstream_test_count_method: autotools_tests

# 上游测试命令 (上游 Makefile 的 check 目标运行 tests/ 下 5 个脚本)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
# 真机实现：OHOS 无 nc、无支持进程替换的 bash、/tmp 只读、AF_UNIX 路径限长、
# 且运行时 tmp 挂载禁止 chmod/hardlink 并可能拒绝创建 AF_UNIX socket 文件
# （bind() 报 Operation not permitted）。因此配方：
#   - 用 python netcat 站替（连接带短有界重试，容忍启动竞态、绝不掩盖真实失败）
#     替换 nc，把进程替换改为临时文件、jobs -p 改为 $!，再用 /bin/sh 逐脚本运行；
#   - 预先探测多个短可写根目录（hmbs TMPDIR、$HOME、conan 区等）中哪一个的
#     文件系统真正支持 AF_UNIX bind()，把 tests/ 复制到该目录运行，从而规避
#     运行时 tmp 挂载对 socket 的限制，让 5 个上游脚本都在真实 socket 上执行；
#   - 若平台在所有候选根都拒绝 AF_UNIX bind（全局沙箱限制），则 basic/options/
#     unix 三个 AF_UNIX 用例如实计为平台受限（不运行、不冒充通过），cmdline/inet
#     仍真实执行。失败脚本输出单独打印到 conan 日志。
upstream_test_command: "SOCKET_ACTIVATE=<built>/src/socket-activate /bin/sh <socket-capable-workdir>/tests/<script>  # basic, options, cmdline, unix, inet (POSIX sh 适配)"

# 上游实际运行的测试程序 (tests/ 下 5 个脚本，断言不变，仅 shell 语法做 POSIX 移植)
upstream_tests:
  - file: tests/basic
    source: sasa-0.4/tests/basic
    description: "UNIX socket 激活：验证 LISTEN_FDS/LISTEN_PID/LISTEN_FDNAMES 环境变量"
    command: "./tests/basic"
  - file: tests/options
    source: sasa-0.4/tests/options
    description: "socket 选项：验证 mode 选项应用到生成的 UNIX socket"
    command: "./tests/options"
  - file: tests/cmdline
    source: sasa-0.4/tests/cmdline
    description: "命令行：--help / --version / --features 输出与退出码"
    command: "./tests/cmdline"
  - file: tests/unix
    source: sasa-0.4/tests/unix
    description: "UNIX socket 双 socket 激活 (test_python.py 消费者), mellon/friend"
    command: "./tests/unix"
  - file: tests/inet
    source: sasa-0.4/tests/inet
    description: "TCP/UDP socket 激活 (test_python.py 消费者), tcp mellon / udp friend"
    command: "./tests/inet"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "socket-activate --version / --help 可执行验证 (2 检查)"
    command: "./test_sasa"

# 测试断言总数 (上游 5 个脚本 + test_package 2 检查)
assertion_count: 7
