# conandata.yml — sasa 0.4
# 源码 URL + SHA256。使用上游 0.4 官方发布归档（Debian archive 权威镜像，
# 内容为纯上游源码，无 Debian 打包文件）。
sources:
  # 有序镜像列表：TUNA Debian 镜像（实测 HTTP 200、与官方归档逐字节一致、sha256 相同）在前，
  # 官方 deb.debian.org 放在最后作为回退。Conan 2.x get() 会逐个尝试直到成功。
  # 注：官方 CI 的 build_and_test.sh get_mirrors() 不覆盖 deb.debian.org 域名，
  # 故在 conandata.yml 内直接声明回退镜像，避免该单点下载源成为唯一入口。
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/s/sasa/sasa_0.4.orig.tar.gz"
    - "https://deb.debian.org/debian/pool/main/s/sasa/sasa_0.4.orig.tar.gz"
  sha256: "adbfbcd2aea5ff6951707f04b26f5cbca850ed5801d2bfee45470b75313ced7c"

patches:
  - patch_file: "patches/abstract-unix-socket.patch"
    patch_description: "Add Linux abstract AF_UNIX namespace support (address starting with '@') so the AF_UNIX socket-activation tests can bind real sockets on HarmonyOS PC, whose writable filesystems refuse pathname socket bind() with EPERM (knowledge/E461)"
    patch_type: "portability"
