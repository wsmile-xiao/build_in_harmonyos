knowledge_gained:
  - "纯 Makefile 项目，无 configure/cmake；仅构建 src/socket-activate 二进制目标可避免 pandoc 依赖（man 页目标需要 pandoc）"
  - "package_type = application，package_info 需声明 cpp_info.bindirs = ['bin']，软件级目录需提供 commands.json（R38）"
  - "上游 make check 运行 5 个 bash 脚本测试（basic/options/cmdline/unix/inet），各自 set -e、内部断言失败即非零退出，逐脚本统计通过/失败"
