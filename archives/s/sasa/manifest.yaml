software: sasa
display: "sasa (standalone socket-activate)"
description: "standalone systemd-style socket-activation implementation for Unix-based systems without systemd"
category: system
homepage: "https://git.devuan.org/leepen/standalone-socket-activate"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
