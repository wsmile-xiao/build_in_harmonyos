# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: snakeviz/2.2.2
homepage: "https://jiffyclub.github.io/snakeviz/"

# 上游测试命令：pytest（tests/ 下 2 个文件，12 个用例）
upstream_check_command: "python3 -m pytest tests/"

# conanfile.py build() 方法中是否已集成上游测试
# 是: build() 末尾调用 pytest（wheel 先装入 build-local prefix），失败用例在下方豁免声明
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest tests/"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_snakeviz.py
    source: snakeviz-2.2.2/tests/test_snakeviz.py
    description: "5 例：真实起 `snakeviz -s` HTTP 服务器并经 tornado 客户端验证 profile/目录渲染与版本号"
    command: "python3 -m pytest tests/test_snakeviz.py"
  - file: tests/test_ipymagic.py
    source: snakeviz-2.2.2/tests/test_ipymagic.py
    description: "7 例：IPython magic（%%snakeviz）配置解析与浏览器默认行为（mock shell）"
    command: "python3 -m pytest tests/test_ipymagic.py"

# 豁免声明 (TEST_QUALITY_SPEC.md 3.3 / 平台限制)
# 实测: 12 passed in 35.43s（2026-09-26, 设备原生, pytest 9.1.1）。
# 注意: pytest 默认 basetemp (/storage/Users/currentUser/pytest-of-<uid>) 在本设备
# 上因属主检查报 OSError——配方以 --basetemp 指向构建目录内可写路径规避，
# 不属用例失败。
exemptions:
  - rule: "pytest_basetemp_ownership"
    reason: "沙箱 TMPDIR 属主与 pytest 期望不符（非代码问题）；--basetemp 重定向后 12/12 全通过"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "① wheel 包树可导入 + 版本断言；② 真实 `snakeviz -s` 服务器端到端：cProfile 落盘 → 起服 → /vis?datasource=... 回环请求 → 断言 HTML 响应"
    command: "conan create . (test_package)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
