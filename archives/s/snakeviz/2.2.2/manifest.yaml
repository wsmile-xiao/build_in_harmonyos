# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2.2"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: pip

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/source/s/snakeviz/snakeviz-2.2.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "conan 2 test_package 只看直接 require——消费传递依赖（tornado）的 conf_info 时必须在 test_package/conanfile.py 显式 self.requires(\"tornado/6.5.2\")，否则 KeyError"
  - "pytest 在本设备默认 basetemp /storage/Users/currentUser/pytest-of-<uid> 因属主检查报 OSError，用 --basetemp 指到构建目录内可写路径规避"
  - "wheel 应用的上游测试若驱动 CLI（snakeviz -s），用 pip install --prefix <build>/prefix + PATH/PYTHONPATH 注入，让测试跑的是被测 wheel 而非环境残留"
  - "snakeviz 服务路由为 /snakeviz/<profile路径>（非 /vis），消费者测试经 urllib 回环请求 /snakeviz/<quoted-path> 断言 viz.html 渲染"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
