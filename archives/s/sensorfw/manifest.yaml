software: sensorfw
display: "sensorfw (sensord)"
description: "Sailfish OS 传感器框架：守护进程 sensorfwd、D-Bus 客户端库，以及运行期可加载的 adaptor / chain / filter / sensor 插件"
category: system
homepage: "https://github.com/sailfishos/sensorfw"
license: LGPL-2.1-or-later
build_system: qmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "构建系统是 qmake 递归工程（TEMPLATE=subdirs）；须用含 mkspecs/harmonyos-clang 的 qt/5.15.19.1，其它 Qt5 包 mkspecs 不可搬迁或缺少 QtDBus"
    - "插件（adaptor/chain/filter/sensor）必须自带 DT_NEEDED libsensorfw-qt5：HarmonyOS/musl 的 dlopen 只在对象自身 DT_NEEDED 闭包内解析未定义符号，上游依赖宿主进程提供框架库符号的做法在 musl 上必然失败"
    - "插件链接框架库要求 core 子工程先于 adaptors 构建（上游 SUBDIRS 顺序相反）"
    - "libudev 由 libudev-zero 静态提供；iioadaptor.pro 的 pkg-config 查找在交叉环境下失效，改为环境变量优先"
    - "systemd 集成（libsystemd + sd_notify 就绪通知）必须可关闭，OHOS 无 systemd"
    - "运行期插件目录被编译期烘焙为 $$[QT_INSTALL_LIBS]/sensord-qt5，是非可重定位绝对路径；消费者用 SENSORFW_LIBRARY_PATH（前缀语义）覆盖，或把 lib/sensord-qt5/ 放到该烘焙位置"
    - "以包目录为 LD_LIBRARY_PATH 直接运行动态产物会失败：OHOS 加载器对 .so 版本化符号链接返回 Permission denied，须先解引用复制为实体文件"
  common_dependencies:
    - qt
    - libudev-zero

# 版本索引
versions:
  "0.15.2":
    status: published
    build_date: "2026-09-27"
    conan_ref: "sensorfw/0.15.2"
