# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (ci/conan/build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# =============================================================================
# sensorfw 0.15.2 上游测试摘要
# =============================================================================
# 上游**有** make check 入口（qmake 为 TEMPLATE = subdirs 自动生成）：
#   顶层 Makefile 的 check: 递归 10 个子工程，其中 **51 条为空操作**
#   ("Nothing to be done for 'check'")，只有 tests/<suite>/Makefile 的规则有实际动作：
#       <dir>/target_wrapper.sh ./<test-binary>
#   即不是 ctest 注册，而是直接运行 QtTest 二进制。
#
# 本包**已真实执行**上游入口 `make check`，并额外逐二进制执行以获得完整画像。
# 随 PR 提交的证据为**报告类文件**：reports/test-report.md（含逐二进制用例级/断言级明细、
#   make check 两次执行原文、失败断言与 Loc、复现命令）、reports/conan-verify-report.md。
# 原始日志为**本地复现产物，按仓内惯例不随 PR 提交**（全仓 12287 个包中仅 2 个提交 reports/logs/）：
#   reports/upstream-make-check.log         make check 原样执行（EXIT=2）
#   reports/upstream-make-check-env.log     make check 补足运行环境后执行（套件真实运行）
#   reports/upstream-tests-stdout.log       9 个二进制逐一执行的 harness stdout（含 GRAND TOTAL）
#   reports/upstream-test-summary.tsv       harness 汇总（用例级 + 断言级两组列）
#   reports/tests_<suite>.log               每个二进制的完整 -v1 输出
#   reports/tests_<suite>.functions.log     每个二进制 -functions 声明的用例清单
#   reports/run-upstream-tests.sh           harness 本体（含逐项平台约束说明）
# 下文 upstream_tests[].result 中的 reports/... 路径均为上述本地复现路径（证据指针，非死链）。
#
# 统计单位：QtTest 的 "Totals:" 行**混用两种单位**（passed 计「完整通过的测试函数」、
#   failed 计「失败的断言」），直接引用会把断言数当用例数（例：sensorfilters-test
#   声明 6 个用例却打印 "Totals: 4 passed, 14 failed"）。故下表按**用例级**
#   （-functions 声明的函数名归并 PASS/FAIL! 行）与**断言级**（PASS/FAIL! 行本身）分列。
#
# 为什么 upstream_test_in_build 为 false（逐项理由，非省略）：
#   1. tests/filters 的 4 个方向语义用例在**任何平台**都失败（上游测试期望与实现
#      符号相反，与 OHOS 无关，见 notes.md「根因 2」），写进 build() 即确定性失败；
#   2. make check 是 -check_ordered：首个失败套件即整链中止（实测 "Error 14"），
#      拿不到全量结果；改用 -k 则 tests/deadclient 会阻塞等运行中的 sensord
#      （实测 90 s 超时后 exit 124），有拖垮 CI（3600 s）的风险；
#   3. 其余失败/未执行用例源于沙箱无 D-Bus daemon 与传感器硬件（见 notes.md「根因 1」）。
#   按 docs/TEST_QUALITY_SPEC.md §3.3 第 3 条「无法修复（平台限制）时在 MANIFEST.yml
#   声明豁免并说明原因」处理。仓内 upstream_test_in_build: false 有大量先例。
# =============================================================================

package: sensorfw/0.15.2
homepage: "https://github.com/sailfishos/sensorfw"

# 上游测试命令（存在，已实测；不是 automake 的 check）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# make check 的实测输出（两种执行方式）
make_check_output: >-
  (a) as-is `make check` -> EXIT=2; 6x "Error loading shared library" (qmake 生成的
  tests/<suite>/target_wrapper.sh 把构建期 Qt 包的 lib/ 前置进 LD_LIBRARY_PATH，而该目录里
  libQt5*.so.5 是符号链接，本机加载器在启动期解析 DT_NEEDED 名字时不接受符号链接条目);
  51x "Nothing to be done for 'check'" -> reports/upstream-make-check.log.
  (b) with runtime accommodation `make check TESTRUNNER="env LD_LIBRARY_PATH=<deref libs>"`
  + SENSORFW_SOCKET_PATH/SENSORFW_LIBRARY_PATH -> 套件真实运行: FilterApiTest
  "Totals: 4 passed, 14 failed", 随后 `*** [Makefile:346: check] Error 14` 因
  -check_ordered 中止整链 -> reports/upstream-make-check-env.log.
  (c) 完整逐套件结果由 reports/run-upstream-tests.sh 逐二进制执行得到:
  9 个二进制 / 51 个声明用例 / 15 通过 / 4 失败 / 0 跳过 / 32 未执行; 断言 26 通过 / 17 失败。

# 上游实际运行的测试程序（9 个测试二进制，对应 tests/tests.xml.in 的 case）
upstream_tests:
  - file: tests/filters/sensorfilters-test
    source: sensorfw-0.15.2/tests/filters/filtertests.cpp
    description: "QtTest FilterApiTest — 6 用例；2 通过 / 4 失败（上游测试期望与实现方向语义相反，与平台无关）"
    command: "./sensorfilters-test -v1"
    result: "exit 14；用例 6 declared / 2 pass / 4 fail；断言 4 passed, 14 failed；reports/tests_filters_sensorfilters-test.log"
  - file: tests/dataflow/sensordataflow-test
    source: sensorfw-0.15.2/tests/dataflow/dataflowtests.cpp
    description: "QtTest DataFlowTest — 2 用例（testAdaptorSharing / testChainSharing），插件加载与链路共享"
    command: "./sensordataflow-test -v1"
    result: "exit 0；用例 2/2 通过；断言 4 passed, 0 failed；reports/tests_dataflow_sensordataflow-test.log"
  - file: tests/adaptors/sensoradaptors-test
    source: sensorfw-0.15.2/tests/adaptors/adaptortests.cpp
    description: "QtTest AdaptorApiTest — 9 个 adaptor 用例（accelerometer/magnetometer/ALS/tap/keyboard-slider/proximity/touch/gyroscope/lid）"
    command: "./sensoradaptors-test -v1"
    result: "exit 0；用例 9/9 通过；断言 11 passed, 0 failed；补丁 0004 的直接回归（修复前 100% 插件加载失败）；reports/tests_adaptors_sensoradaptors-test.log"
  - file: tests/chains/sensorchains-test
    source: sensorfw-0.15.2/tests/chains/chainstest.cpp
    description: "QtTest ChainTest — 2 用例（testCompassChain / testAccelerometerChain）"
    command: "./sensorchains-test -v1"
    result: "exit 0；用例 2/2 通过；断言 4 passed, 0 failed；补丁 0004+0005 的直接回归（修复前 testCompassChain 因跨插件符号解析失败）；reports/tests_chains_sensorchains-test.log"
  - file: tests/client/sensorapi-test
    source: sensorfw-0.15.2/tests/client/clientapitest.cpp
    description: "QtTest ClientApiTest — 19 个 D-Bus 客户端用例"
    command: "./sensorapi-test -v1"
    result: "exit 1；用例 0/19 执行（19 not-run）；initTestCase() 失败 'remoteSensorManager.isValid()' returned FALSE（沙箱无 D-Bus daemon）；reports/tests_client_sensorapi-test.log"
  - file: tests/metadata/sensormetadata-test
    source: sensorfw-0.15.2/tests/metadata/metadatatest.cpp
    description: "QtTest MetaDataTest — 9 个元数据/量程/间隔用例"
    command: "./sensormetadata-test -v1"
    result: "exit 1；用例 0/9 执行（9 not-run）；initTestCase() 失败（同无 D-Bus）；reports/tests_metadata_sensormetadata-test.log"
  - file: tests/benchmark/benchmarktest/test.cpp
    source: sensorfw-0.15.2/tests/benchmark/benchmarktest/test.cpp
    description: "QtTest BenchmarkTest — 4 个内存/基准用例（tests.xml 的 Sensord_Memory_* / Sensord_Benchmark_*）"
    command: "./sensorbenchmark-test -v1"
    result: "exit 1；用例 0/4 执行（4 not-run）；initTestCase() 失败（同无 D-Bus）；reports/tests_benchmark_benchmarktest_sensorbenchmark-test.log"
  - file: tests/deadclient/sensord-deadclient
    source: sensorfw-0.15.2/tests/deadclient/sensord-deadclient.cpp
    description: "Dead_Client — 非 QtTest 驱动；tests.xml 的实际入口是 /usr/share/sensorfw-tests/sensord-deadclienttest.py，要求先 start sensord"
    command: "./sensord-deadclient（tests.xml 中由 testrunner-lite 以 hardware=true 驱动）"
    result: "exit 124（90 s 超时）；需运行中的 sensord + /run，沙箱不可满足；reports/tests_deadclient_sensord-deadclient.log"
  - file: tests/testapp/sensortestapp
    source: sensorfw-0.15.2/tests/testapp/sensortestapp.cpp
    description: "交互式示例程序（不在 tests.xml 中，无 -functions 声明）"
    command: "./sensortestapp（交互式，无人值守环境无法完成）"
    result: "exit 1；未跑完；reports/tests_testapp_sensortestapp.log"

# test_package 中自带的测试（消费者视角验证）
# 相对上游测试的增量交付：其中 consumer.ohos.dlopen 是鸿蒙特有用例，
# 在未打 0004/0005 的原始上游代码上必然失败，是这两个补丁的直接回归测试。
test_package_tests:
  - file: test_sensorfw.cpp
    description: "consumer.api.types — TimedXyzData / TimedUnsigned / CompassData 字段与时戳往返（9 项断言）"
    command: "./test_sensorfw <pkg>/lib/sensord-qt5"
  - file: test_sensorfw.cpp
    description: "consumer.api.qtmeta — XYZ QObject 门面：getter + QObject::property() 元对象系统 + metaObject()->className()（5 项断言）"
    command: "./test_sensorfw <pkg>/lib/sensord-qt5"
  - file: test_sensorfw.cpp
    description: "consumer.ohos.dlopen — **鸿蒙特有**：包内 47 个插件全部 dlopen(RTLD_NOW)，其中 46 个 Qt 插件 dlsym('qt_plugin_query_metadata')，1 个已记录的非 Qt 插件单独断言（4 项断言）"
    command: "./test_sensorfw <pkg>/lib/sensord-qt5"
  - file: test.sh
    description: "consumer.ohos.elfarch — bin/sensorfwd、消费者程序、库与插件均为 AArch64 ELF（1 项断言）"
    command: "bash test.sh ./test_sensorfw <pkg>"
  - file: test.sh
    description: "consumer.ohos.packaging — 0 个符号链接 + 三个库的版本化 SONAME 布局 + 47 插件齐备 + 头文件布局（datatypes/ 子目录、core 平铺、无 filters/ 与 core/ 子目录、无 moc_predefs.h）（9 项断言）"
    command: "bash test.sh ./test_sensorfw <pkg>"
  - file: test.sh
    description: "consumer.daemon.help — bin/sensorfwd --help 退出码 0 且输出 'Usage: sensord'（1 项断言，不需要 D-Bus/硬件）"
    command: "bash test.sh ./test_sensorfw <pkg>"

# 测试断言总数（test_package 消费者用例，实测 29/29 通过）
assertion_count: 29
