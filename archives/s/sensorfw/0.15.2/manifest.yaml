  - file: 0004-plugin-link-framework-library.patch
    type: portability
    description: "四类插件的 *-config.pri 各追加 -lsensorfw-qt5，使每个插件自带 DT_NEEDED libsensorfw-qt5.so.0；并把 core 提到 adaptors 之前"
  - file: 0005-plugin-cross-dependencies.patch
    type: portability
    description: "chains/compasschain.pro 追加对 avgaccfilter / downsamplefilter / declinationfilter / magcalibrationchain 四个插件模块的链接（跨插件 DT_NEEDED，同因同解）"

knowledge_gained:
  - "HarmonyOS/musl 的 dlopen 只在对象自身 DT_NEEDED 闭包内解析未定义符号：插件必须自带对宿主库的 DT_NEEDED，否则 Error relocating ...: symbol not found（本包以 20 行非 Qt 最小实验复现；先例 archives/l/libnfsidmap-ldap/2.6.4） (ref: DRAFT-ohos-dlopen-own-dt-needed-closure)"
  - "同一根因也适用于**插件与插件之间**：compasschain 直接实例化 AvgAccFilter/DownsampleFilter/DeclinationFilter/MagCalibrationChain，这些实现不在框架库里而在各自插件模块中，必须在 compasschain 上显式记录 DT_NEEDED（对 47 个插件做未定义符号闭包分析，跨插件引用仅此 1 处 4 个符号） (ref: sensorfw/0.15.2)"
  - "本平台加载器在**启动期解析 DT_NEEDED 名字**时把命中的 `.so` 版本化**符号链接**条目当成不存在（报 `Error loading shared library <name>: (needed by <bin>)`）；**对照实测**：同一批文件（可写目录、属主为当前用户）为符号链接时 aarch64 测试二进制启动失败，`cp -L` 解引用为实体后启动成功。**不是「禁用符号链接」**：同一符号链接用 dlopen(裸名) 与 dlopen(完整路径) 在独立进程中均成功，限制只在启动期路径；权限/属主/路径已排除。此前记录的「返回 Permission denied」在本场景未复现，观察到的是 not-found 形式 (ref: sensorfw/0.15.2)"
  - "qmake 生成的 `tests/*/target_wrapper.sh` 会把**构建期** Qt 包的 `lib/` 前置进 LD_LIBRARY_PATH，而该目录里 libQt5*.so.5 是符号链接 ⇒ 上游 `make check` 原样执行时测试二进制连加载都过不去（与 /run、D-Bus 无关）；需用 `TESTRUNNER=\"env LD_LIBRARY_PATH=<deref>\"` 覆盖才能真实运行 (ref: sensorfw/0.15.2)"
  - "qmake 的 `TEMPLATE = subdirs` 会生成顶层 `check:` 目标（`check: sub-<dir>-check_ordered …`），但除 `tests/` 外的 51 条规则全是空操作；且 `check` 是 `-check_ordered`：**首个失败套件即整链中止**，`-k` 又会因 tests/deadclient 阻塞等 sensord 而挂住 ⇒ 想拿全量逐套件结果必须逐二进制执行 (ref: sensorfw/0.15.2)"
  - "QtTest 的 `Totals:` 行**混用两种单位**：passed 计「完整通过的测试函数」、failed 计「失败的断言」。例：声明 6 个用例却打印 `Totals: 4 passed, 14 failed`。统计用例数必须按 `-functions` 声明的函数名归并 `PASS`/`FAIL!` 行，否则会把断言数当用例数 (ref: sensorfw/0.15.2)"
  - "CMakeDeps 生成的 `<pkg>-config.cmake` 里 `find_dependency(<dep>)` 的依赖名清单取**「消费者依赖 ∩ 本包直接依赖」的节点交集**，**与 `transitive_headers`/`transitive_libs` 标记无关**（两个仅差该标记的对照包输出逐字节相同）；当该依赖设了 `cmake_find_mode=\"none\"`（如 qt/5.15.19.1）时该行无法自行解析 ⇒ 消费者需自备桥接 config（`set_property(cmake_file_name)` 重映射也不可行，因 Qt5Config.cmake 拒绝无组件调用） (ref: sensorfw/0.15.2)"
  - "qmake 的公开头文件布局以生成的 Makefile 里 `install_publicheaders` 规则的 QINSTALL 行为权威（`INSTALLS += publicheaders` 来自 common-install.pri），**不等于源码树 glob**：`core/` 是平铺（`core.pro` 的 path 追加未生效）、`filters/` 因 `publicheaders.files = *.h` 零匹配而根本没有安装规则、条件编译头与 moc_predefs.h 不在清单中。照 glob 打包会同时「少 86 个、错放 core/、混入 3 个生成物」(ref: sensorfw/0.15.2)"
  - "OHOS 加载器对 .so 版本化符号链接的处理见上（启动期按 not-found 处理）；以 Conan 包目录作 LD_LIBRARY_PATH 时必须先解引用复制为实体文件 (ref: DRAFT-yasw-0.6-ohos-musl-versioned-symlink-runtime)"
  - "插件目录被上游编译期烘焙成 $$[QT_INSTALL_LIBS]/sensord-qt5（core.pro 的 PLUGIN_DIRECTORY），Conan 包搬运后必然悬空；上游已提供 SENSORFW_LIBRARY_PATH 前缀语义环境变量可重定位 (ref: sensorfw/0.15.2)"
  - "qmake 在 cross_compile 分支下 pkgConfigExecutable() 返回空，PKGCONFIG += 在干净构建环境失效；改用环境变量注入搜索路径，因为 qmake 不把命令行赋值转发给子工程 (ref: sensorfw/0.15.2)"
  - "qt/5.15.19 缺 QtDBus（配方硬编码 -no-dbus），sensorfw 必须用 qt/5.15.19.1 (ref: yasw/0.6)"
  - "qt/5.15.19.1 的 cpp_info 设 cmake_find_mode=none（自带可搬迁 Qt5<Module>Config.cmake 套件），CMakeDeps 对其不生成任何 config；CMake 消费者须自行把 <qt>/lib/cmake 加入 CMAKE_PREFIX_PATH (ref: sensorfw/0.15.2)"
  - "sensorfw 上游**有** `make check`（qmake 自动生成；`tests/<suite>/Makefile` 经 target_wrapper.sh 直接运行 QtTest 二进制）；同时 tests/tests.xml.in 把正式测试声明为 <hardware>true</hardware> 在**设备**上执行。debian/rules 与 rpm spec 均无 test/check 目标 ⇒ **发行包装流程从不运行测试**，不能据此判定上游有无测试入口 (ref: sensorfw/0.15.2)"
  - "sensormanager 的 socket 路径可用上游 SENSORFW_SOCKET_PATH（前缀语义）重定位；未设置时硬编码 /run/sensord.sock，在无 /run 的沙箱里 initTestCase 直接 QFATAL (ref: sensorfw/0.15.2)"
  - "test_package 的 `test()` **不要用 `CONFIG_SHELL` 选解释器**：该变量在 autoconf 与本仓门禁环境里本义是 `/bin/sh`（CI profile 与 scripts/ohc-run.py 都导出 `/bin/sh`，本机 /bin/sh 是 mksh），会让 bash 脚本被 mksh 执行 → 进程替换 `done < <(...)` 报 `syntax error: unexpected '< '` → G2 报 `Error in test() method` 而构建其实成功。用专用变量 + bash 候选路径探测；脚本本身也尽量写成 POSIX 并同时用 `bash -n` / `/bin/sh -n` 双校验 (ref: sensorfw/0.15.2)"
  - "sensorfw 的 tests/filters 有 4 个方向语义用例（testTopEdge/Face/Orientation InterpretationFilter、testRotationFilter）在**任何平台**都失败：实现输出的方向枚举与测试期望符号相反（如 orientationinterpreter.cpp 的 `(data.z_ <= 0) ? FaceDown : FaceUp` vs 测试期望 FaceUp）。属上游「测试期望↔实现」不一致，**不是移植缺陷**，不得改测试期望去迁就实现 (ref: sensorfw/0.15.2)"

