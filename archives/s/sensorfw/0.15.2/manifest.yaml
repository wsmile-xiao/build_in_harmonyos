#     套件真实运行后因 -check_ordered 于首个失败套件中止），并以逐二进制 harness
#     取得完整画像：9 个二进制 / 51 个声明用例 / 15 通过 / 4 失败 / 0 跳过 / 32 未执行；
#     断言 26 通过 / 17 失败。逐用例结果、统计单位说明与逐项根因见 notes.md
