#   并通过 test_package 消费者验证。
#   * 构建：qmake（harmonyos-clang spec）+ make -j1，EXIT=0（≈18m48s）；产物为 OHOS
#     arm64 musl ELF：394 个 .o、68 个 .so（**全部实体文件**，mkspec 的
#     QMAKE_LN_SHLIB = cp -f，符号链接 0 个）、47 个插件、180 个公开头文件；
#     9 个上游测试二进制一并构建成功。
