# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: soundtouch/2.0.0
homepage: "https://www.surina.net/soundtouch/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# soundtouch 2.0.0 上游 autotools 无注册的 make check 测试目标（Makefile.am
# 无 check/TESTS 目标）；bin/run_test 是需外部测试音频（~/dev/test_sounds）
# 的手动 shell 脚本，非注册测试。上游测试以本地手动实测 + test_package
# 消费者测试替代（见 notes.md「上游测试实测」节）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test.cpp"
    description: "链接 libSoundTouch：getVersionId() 版本核验 + 真实 WSOLA 变速管线（tempo=1.0 恒等变换）样本流通验证"
    command: "./test_soundtouch"
    result: "PASS 2/2 (100%)"

# 本地测试通过率
local_test_pass_rate: "2/2 (100%)"

# 测试断言总数 (近似值)
assertion_count: 2
