# 版本级 manifest — soundtouch 2.0.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.0.0"

software: "soundtouch"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://gitlab.com/soundtouch/soundtouch/-/archive/2.0.0/soundtouch-2.0.0.tar.gz"
  sha256: "efa1f63b1bb60cae4565307757234936b0a19e2fa7913651eba9b9f82eeeb915"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # 自举链：libtoolize → mv ltmain.sh config/ → autoreconf → configure
  # configure 为生成文件，umask 077→000 修复在 build() 内联完成（非源码补丁）
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-x86-optimizations"

  # 运行时依赖：无（纯 C++ + libm）
  dependencies: []

  # 构建工具依赖（build_requirements）
  tool_dependencies:
    - "automake/1.18"
    - "libtool/2.5.4"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# OHOS 适配修复全部针对构建时生成的文件（configure umask、ltmain.sh 位置），
# 在 conanfile.py build() 内联处理，不改上游源码 —— 无需 patch 文件

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libtoolize 先于 autoreconf，且 ltmain.sh 要移到 AC_CONFIG_AUX_DIR(config) 指定的 config/ 下"
  - "umask 077→000 confstat 修复（E100 同款）适用于所有 autoreconf 自举的老 autotools 包"
  - "E098 __powidf2 问题在 soundtouch 2.0.0 + clang 15 下未复现（代码只生成 exp/exp2/ldexp libm 调用）"
  - "2.0.0 无 NEON 代码路径（2.3.0 才引入），ARM 上纯标量 C++ 零适配"
