software: soundtouch
display: "SoundTouch Audio Tempo/Pitch/Rate DSP Library"
description: "SoundTouch 是开源音频处理 DSP 库（WSOLA 算法），可独立调整音频的节奏(Tempo)、音高(Pitch)和播放速率(Rate)，附带 soundstretch WAV 处理命令行工具"
category: multimedia
homepage: "https://www.surina.net/soundtouch/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "源码包不含 configure（1.6.0 起移除），需 libtoolize → autoreconf 自举；CI 缺 automake 用 tool_requires automake/1.18 + libtool/2.5.4"
    - "libtoolize 生成的 ltmain.sh 需移到 config/ 下（AC_CONFIG_AUX_DIR(config)）再 autoreconf"
    - "configure 的 config.status umask 077 在 HMDFS 上不可写，文本替换为 umask 000（E100 同款）"
    - "2.0.0 无 NEON 优化代码（2.3.0 才引入），ARM 路径纯标量 C++；--disable-x86-optimizations 关 x86 专用 MMX/SSE"
    - "clang 15 下无 __powidf2 问题（E098 在本版未复现），无需 -lclang_rt.builtins"
  common_dependencies: []

versions:
  - version: "2.0.0"
    status: published
    build_date: "2026-09-15"
    source_url: "https://gitlab.com/soundtouch/soundtouch/-/archive/2.0.0/soundtouch-2.0.0.tar.gz"
