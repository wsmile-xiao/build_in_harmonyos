  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "header-only CMake INTERFACE 库配方：package_type=header-library + CMakeToolchain + cpp_info.set_property(cmake_file_name/cmake_target_name)；ref: E321,E322,E470"
  - "OHOS 下 header-only 库 CMakeToolchain 置 CMAKE_SYSTEM_NAME=Linux；上游 gtest FetchContent 依赖 GitHub 时 ST_BUILD_TESTS=OFF，消费者验证由 test_package 承担；ref: E322,E470"
  - "W3/finish 本地 CI 的 junk_check 在分支零提交时退化 full 模式误扫共享基线噪声：生成仅含本 PR 文件的 pr.diff（JUNK_PR_DIFF/prdiff 模式）使门禁只校验本 PR 交付文件；knowledge_ref: DRAFT-dr_mp3-0.7.2-baseline-noise-isolation"
  - "上游 string_theory 3.9 char_buffer self-move（operator=(buffer&&) 缺 this==&move 保护）重叠 memcpy UB，Release -O2 下 SIGSEGV；属上游缺陷，台账记录不阻塞本包；ref: reports/upstream-test-ledger.md"
