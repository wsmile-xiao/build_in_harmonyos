# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.9"

# 软件名
software: "string_theory"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/zrax/string_theory/archive/refs/tags/3.9.tar.gz"

  # 源码校验和
  sha256: "9bb0a9697319964479f813d9c61e3c5a1f57f7e8a5bc6db14cba7489addc3f49"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
