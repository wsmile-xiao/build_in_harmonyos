# test_package/MANIFEST.yml — string_theory 3.9

package: string_theory/3.9
homepage: "https://github.com/zrax/string_theory"

# 上游测试命令（用于 ctest -N / 直接运行 st_gtests 分析）
# 上游 test/CMakeLists.txt 构建单一测试目标 st_gtests（gtest 框架，FetchContent googletest v1.15.2）
upstream_check_command: "cmake -DST_BUILD_TESTS=ON -B build && cmake --build build --target st_gtests && ./build/test/st_gtests"

# conanfile.py build() 中是否已集成上游测试
# 未集成：上游测试依赖 gtest FetchContent 从 GitHub clone，本环境 CI 禁连 GitHub；
# 独立构建运行结果见 reports/upstream-test-ledger.md（Debug 112/112, Release 111/112）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（独立用例 112 个，按套件列出）
upstream_tests:
  - file: test/test_buffer.cpp
    source: string_theory-3.9/test/test_buffer.cpp
    description: "char_buffer 套件 10 个 TEST（非 WIN32）"
    command: "./st_gtests --gtest_filter='char_buffer.*'"
  - file: test/test_codecs.cpp
    source: string_theory-3.9/test/test_codecs.cpp
    description: "codecs 套件 8 个 TEST"
    command: "./st_gtests --gtest_filter='*codec*'"
  - file: test/test_format.cpp
    source: string_theory-3.9/test/test_format.cpp
    description: "format 套件 20 个 TEST"
    command: "./st_gtests --gtest_filter='*format*'"
  - file: test/test_iostream.cpp
    source: string_theory-3.9/test/test_iostream.cpp
    description: "iostream 套件 4 个 TEST"
    command: "./st_gtests --gtest_filter='*iostream*'"
  - file: test/test_regress.cpp
    source: string_theory-3.9/test/test_regress.cpp
    description: "regress 套件 5 个 TEST"
    command: "./st_gtests --gtest_filter='regress.*'"
  - file: test/test_sstream.cpp
    source: string_theory-3.9/test/test_sstream.cpp
    description: "sstream 套件 10 个 TEST"
    command: "./st_gtests --gtest_filter='*sstream*'"
  - file: test/test_stdio.cpp
    source: string_theory-3.9/test/test_stdio.cpp
    description: "stdio 套件 1 个 TEST"
    command: "./st_gtests --gtest_filter='*stdio*'"
  - file: test/test_string.cpp
    source: string_theory-3.9/test/test_string.cpp
    description: "string 套件 54 个 TEST"
    command: "./st_gtests --gtest_filter='*string*'"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试 — 验证头文件包含和 API 调用（构造/拼接/格式化/转换/大小写）"
    command: "./test_string_theory"

# 测试断言总数（近似值，用于质量评估）
# 112 个上游 TEST + 鸿蒙专项测试 5 项断言 + test_package 消费者测试 4 项断言
assertion_count: ~1200