software: sfarklib
display: "sfArkLib"
description: "C++ library for decoding sfArk-compressed SoundFont files"
category: audio
homepage: "https://github.com/raboof/sfArkLib"
license: "GPL-3.0-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "Keep sfArk on-disk words fixed at 32 bits on LP64 systems."
    - "Use the zlib uLongf type for uncompress output lengths."
    - "Package a static archive and propagate zlib to consumers."
  common_dependencies:
    - zlib

versions:
  "2.24":
    status: built
    build_date: "2026-09-20"
    conan_ref: "sfarklib/2.24"
