package: skiplist/0.9.0
homepage: "https://github.com/silentbicycle/skiplist"

upstream_check_command: "make CC=/data/service/hnp/bin/clang test"
upstream_test_in_build: true
upstream_test_command: "make CC=/data/service/hnp/bin/clang test"

upstream_tests:
  - file: test_skiplist.c
    source: skiplist-0.9.0/test_skiplist.c
    description: "Greatest-based upstream suite covering insertion, ordering, lookup, deletion, iteration, pop, clear, and allocator behavior."
    command: "./test_skiplist"
    test_functions: 23
    assertion_failure_macros: 178

test_package_tests:
  - file: test.c
    description: "Consumer test creates a skiplist, adds/sets/gets ordered integer pairs, checks first/last, deletes, and frees all entries."
    command: "./test_skiplist"

assertion_count: 178
