# test_package/MANIFEST.yml
package: sysnews/0.9-ds.1
homepage: "https://tracker.debian.org/pkg/sysnews"

# 上游无任何测试（无 check/test 目标、无 tests 目录）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "鸿蒙特有测试/消费者用例: 安装包中的 news 二进制对真实文章目录的完整流程(-s/-n -l/-d/-a/$HOME/.news_time 读标记/-e 过期 unlink/退出码)"
    command: "bash test.sh <check_news>"
  - file: check_news.c
    description: "消费者 C 程序: 由 test_package build() 用 OHOS 工具链编译，校验 news 输出格式与条目"
    command: "check_news <count> <names...>"

assertion_count: 14
