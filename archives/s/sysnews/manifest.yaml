software: sysnews
display: "sysnews"
description: "登录时向用户显示系统新闻的 news 命令（文章目录默认 /var/sysnews，支持过期清理）"
category: utility
homepage: "https://tracker.debian.org/pkg/sysnews"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure；Makefile 硬编码 CC=gcc，需命令行覆盖 CC"
    - "Makefile install 目标使用 install -o bin -g bin（需 root），配方改为 package() 直接复制 news 与 news.1"
    - "news.c 缺 <time.h>，aarch64(LP64) 上 ctime/gmtime 隐式声明截断指针致段错误，补丁加入 #include <time.h>"
  common_dependencies: []

versions:
  - version: "0.9-ds.1"
    status: built
    build_date: "2026-09-30"
