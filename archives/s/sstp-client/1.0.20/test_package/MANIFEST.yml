# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: sstp-client/1.0.20
homepage: "https://sstp-client.sourceforge.net/"

# Upstream test command（如实申报：上游 make check 运行 5 个 utest_*）
upstream_check_command: "make check"

# Upstream test suite（规则 4 如实申报）：
# 上游 check_PROGRAMS/TESTS 5 个单元测试：
#   utest_task（sstp-task.c）/ utest_cmac（sstp-cmac.c）/
#   utest_chap（sstp-chap.c）/ utest_fcs（sstp-fcs.c）/
#   utest_utils（sstp-util.c）
# 本地实测（conan 构建环境编译运行 5 个 utest_*）：
#   3 通过（utest_cmac: EAP-TLS Compound MAC Succeeded / utest_fcs:
#   Frame decoded successfully / utest_utils），通过率 3/5；
#   2 失败（环境限制）：utest_task 需 test 命令（OHOS toybox 的 -n
#   差异）、utest_chap 需系统密码哈希/口令环境（OHOS 沙箱缺失）。
upstream_tests_total: 5
upstream_tests_passed: 3

# Upstream tests not run in build (2/5 fail due to OHOS sandbox limits:
# toybox test -n difference, password-hash environment missing)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_sstp_client.sh
    description: "Run sstpc --help to verify tool executes"

# Test assertion count
assertion_count: 1
