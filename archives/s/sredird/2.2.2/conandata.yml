# conandata.yml - sredird 2.2.2
# Source: the upstream release archive from the ibiblio Linux archive (the Source
# field of the Debian copyright file, and the directory the Debian watch file follows),
# fetched from the GWDG academic mirror of that archive. The ibiblio server itself
# answers .tar.gz requests with a Content-Encoding header, so an HTTP client that
# decodes it (Conan's requests) gets different bytes and fails the sha256 check;
# the mirror serves the published gzip bytes untouched.
# The six files of the upstream/2.2.2 tag in the Debian salsa repository are identical
# (per-file sha256) to this archive; the release archive is used because salsa archives
# are generated on demand. The author's old home page is gone (it answers every path
# with a 200 "page not found"). sha256 verified on independent downloads from both hosts.
# No http(s) URL in comments: the CI pre-download step extracts every URL in
# this file and string-replaces it, which would corrupt the real source URL.

sources:
  "2.2.2":
    url: "https://ftp.gwdg.de/pub/linux/metalab/system/serial/sredird-2.2.2.tar.gz"
    sha256: "640c47dcd84b3b90640165a38eb336a675fdab06c14c09cae2f4a604cae560d3"

patches:
  "2.2.2":
    - patch_file: "patches/0001-sredird.c.patch"
      patch_type: "portability"
      patch_description: "Portability fixes, no platform macro: (1) drop the unused glibc-only #include <termio.h> (OHOS musl has no such header: fatal error: 'termio.h' file not found; sredird.c uses only <termios.h>, never struct termio or TCGETA/TCSETA); (2) add <stdint.h> and carry the 4-byte RFC 2217 baud rate field as uint32_t instead of unsigned long (8 bytes on LP64 aarch64: the SET-BAUDRATE acknowledgement got 4 extra zero bytes)"
