# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sredird/2.2.2
homepage: "https://www.ibiblio.org/pub/linux/system/serial/"

# 上游测试命令（清点证据：源码归档共 6 个文件 COPYING / Makefile / README / sredird-2.2.2.lsm / sredird.8 / sredird.c，
# 无子目录；Makefile 目标只有 sredird / clean，`make -n check`、`make -n test`、`make -n tests` 均报
# "No rule to make target"；无 tests/ 目录、无测试脚本、无 ctest/pytest 注册。上游测试用例数为 0，故无上游测试命令）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：上游不含任何测试）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，适配后补全）
test_package_tests:
  - file: rfc2217_client.c
    description: "OHOS 消费者用例（鸿蒙特有测试，1 个）：用 OHOS 工具链经 CMake 编译 C 客户端，以 socketpair 作网络连接、posix_openpt 伪终端作串口，运行包内 bin/sredird 并逐项检查 T1 初始 Telnet 协商 18 字节逐字节一致；T2 HDB 锁文件内容为 sredird 的 pid；T3 网络→串口数据送达、IAC IAC 还原为 0xFF；T4 串口→网络数据送达、0xFF 转义为 IAC IAC；T5 SET-BAUDRATE 115200 应答逐字节一致且 pty 从端 cfgetospeed 为 B115200（LP64 类型补丁的判别点）；T6 SET-DATASIZE/STOPSIZE/CONTROL 应答并经 termios 生效（CS8、CSTOPB 置位再清除、IXON|IXOFF 置位再清除）；T7 关闭连接后 sredird 退出码 0 且删除锁文件。aarch64 CI worker 上必跑；异架构主机记 SKIPPED"
    command: "rfc2217_client <package_folder>/bin/sredird"

# 测试断言总数（rfc2217_client 内 T1-T7 共 7 项检查，1 个鸿蒙特有测试用例）
assertion_count: 7
