  url: "https://ftp.gwdg.de/pub/linux/metalab/system/serial/sredird-2.2.2.tar.gz"
  sha256: "640c47dcd84b3b90640165a38eb336a675fdab06c14c09cae2f4a604cae560d3"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  notes: "单文件 C + 两行裸 Makefile（CC=gcc、一条编译链接一步完成的规则），in-source 构建；CC 与 CFLAGS（上游默认标志 + 工具链 CPPFLAGS/CFLAGS/LDFLAGS）取自 AutotoolsToolchain 并放在 make 命令行（R33）；只构建 sredird 目标"

patches_applied:
  - "0001-sredird.c.patch"

knowledge_gained:
  - "LP64 下以 unsigned long 承载 32 位网络协议字段：htonl/ntohl 与 sizeof 逐字节序列化展开成 8 字节，协议帧畸形且无编译告警（新增草稿；ref: knowledge/drafts/E6511-draft-6CBB.kv）"
  - "musl 无 <termio.h>：未使用的 glibc 头 include 直接删除（已有草稿覆盖；ref: knowledge/drafts/DRAFT-E567-termio-ioctl-macro-capability-guard.kv）"

# refresh-patch（finish 第 1 步）会把本行起到文件末尾重置为 auto/pending，须放在最后
patch_classification:
  - file: 0001-sredird.c.patch
    type: portability
    platform_only: false
    guard: none
    hunks:
      - "删除未使用的 #include <termio.h>（glibc 头，OHOS musl 不提供；源码只用 <termios.h>）；无平台宏"
      - "新增 #include <stdint.h>；SendBaudRate 的 NBR 与 SET-BAUDRATE 解析处的 unsigned long 改为 uint32_t：RFC 2217 波特率是 4 字节线缆字段，LP64 下 unsigned long 为 8 字节会使应答帧畸形；无平台宏，ILP32/LP64 同一代码路径"
