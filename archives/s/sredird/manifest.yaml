software: sredird
display: "sredird"
description: "RFC 2217（Telnet Com Port Control Option）兼容的串口重定向服务端：由 inetd 类超级服务器启动，把本机串口经网络共享，并按客户端请求通过 termios 设置波特率、数据位、校验、停止位与流控（GPL-2.0-or-later；InfoTecna s.r.l. 1999-2003，Columbia University 2001-2002）"
homepage: "https://www.ibiblio.org/pub/linux/system/serial/"
license: "GPL-2.0-or-later"
category: network
language: c
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C（termios / select / socket / syslog）+ 两行 Makefile，写死 CC=gcc：make 命令行以 AutotoolsToolchain 给出的编译器与标志覆盖（R33）"
    - "musl 没有 glibc 的 <termio.h>（编译报 fatal error: 'termio.h' file not found），源码只用 <termios.h> API，补丁删除该未用 include，无平台宏"
    - "32 位的 RFC 2217 波特率字段被声明成 unsigned long：aarch64（LP64）上 8 字节，应答帧多 4 个 0x00，补丁改 uint32_t（知识草稿 E6511）"
    - "上游无 install 目标，package() 把二进制、man 页、COPYING、README 复制到 Conan 布局；commands.json 声明（R38）"
    - "test_package：C 消费者程序（OHOS 工具链编译）以 socketpair + pty 驱动包内 bin/sredird，逐项校验 Telnet 协商、锁文件、双向数据 IAC 转义与 termios 变更"
