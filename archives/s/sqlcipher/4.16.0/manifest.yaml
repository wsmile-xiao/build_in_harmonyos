software: sqlcipher
version: 4.16.0
status: built
build_date: 2026-05-20
build_system: autosetup
url: https://api.github.com/repos/sqlcipher/sqlcipher/tarball/v4.16.0
configure_options: --with-tempstore=yes
configure_env:
  INSTALL: "/usr/bin/install"
  CFLAGS: "-DSQLITE_HAS_CODEC -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown -I/storage/Users/currentUser/usr/local/include"
  LDFLAGS: "-L/storage/Users/currentUser/usr/local/lib -lcrypto -lssl"
dependencies:
  - name: openssl
    version: 3.5.6
knowledge_gained: |
  - SQLCipher 4.16.0+ 移除了对 OpenSSL < 3.0 的支持
  - 需要使用 OpenSSL 3.x（本编译使用 3.5.6）
  - 使用 autosetup 构建系统
  - 需要定义 SQLITE_HAS_CODEC, SQLITE_EXTRA_INIT, SQLITE_EXTRA_SHUTDOWN
  - 需要修复 autosetup-config.guess/config.sub 以支持 HarmonyOS
notes: |
  SQLCipher编译需要OpenSSL 3.x支持。
  使用autosetup构建系统。
  需要配置CFLAGS定义加密相关宏。
  需要修复config.guess/config.sub支持HarmonyOS平台。