sources:
  # 上游 tag 为 upstream/0.4.4（mattthias/slurm，ncurses 网络流量监控器）。
  # R39：只写上游官方源 URL，镜像回退由 CI 自动处理。
  url:
    - "https://github.com/mattthias/slurm/archive/refs/tags/upstream/0.4.4.tar.gz"
  sha256: "2f846c9aa16f86cc0d3832c5cd1122b9d322a189f9e6acf8e9646dee12f9ac02"

# vendored meson 构建工具源码：ohpcd 远端不存在 meson 工具包，真机与 CI
# worker 的 PATH 上亦无 meson 可执行文件（astroterm/1.0.9、libdvdnav/7.0.0
# 已验证结论）。沿用 vendored meson 方案：下载 meson 1.11.2 官方源码解压到
# source_folder/meson-vendor/，build() 时经 python3 进程内 sys.path 注入调用。
meson_source:
  # R39：只写官方源 URL，镜像回退由 CI 自动处理。
  url:
    - "https://github.com/mesonbuild/meson/releases/download/1.11.2/meson-1.11.2.tar.gz"
  sha256: "698feae069cef3ecd4d7aaf281d7df359bdfcf555a9a1564383d3b913fa8a736"

patches:
  - patch_file: "patches/0001-src-if_media.c.patch"
    patch_description: "用 (speed_hi<<16)|speed 直接计算替代 glibc 私有的 ethtool_cmd_speed() static inline（OHOS 内核 uapi 头不含该辅助函数，链接报 undefined symbol）"
    patch_type: "portability"

