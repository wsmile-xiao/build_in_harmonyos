# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: slurm/0.4.4
homepage: "https://github.com/mattthias/slurm"

# ── 上游测试清点（R51，2026-09-21，源码 tag upstream/0.4.4）──────────
# 1. meson.build 无任何 test() 条目：
#      grep -rn "test" meson.build  → 零命中 (exit 1)
# 2. 源码树无 tests/ 目录、无 *test* 文件：
#      find . -iname "*test*" -o -iname "*.suite*"  → 计数 0
# 结论：上游 slurm 0.4.4 无自动化测试入口（test_package 不替代上游测试统计，
# 此处如实申报为 0，不伪造计数）。
upstream_check_command: "grep -rn test meson.build; find . -iname '*test*'"
upstream_test_in_build: false
upstream_tests: []
upstream_test_count: 0
upstream_test_evidence:
  - "meson.build: 无 test() 条目（grep 'test' 零命中）"
  - "源码树: 无 tests/ 目录，find '*test*' 计数 0"
  - "上游仅提供 slurm.1 手册页与 themes/ 主题数据目录"

# test_package 中自带的测试（鸿蒙消费者可行性用例，≥1 满足要求）
test_package_tests:
  - file: test.c
    description: "真实执行打包出的 slurm 可执行文件：`slurm -h` 退出码 0 + usage 横幅文本校验（2 检查，无需 TTY；对应上游 slurm.c usage(0) 语义）"
    command: "./test_slurm <package_folder>/bin/slurm"

# 测试断言总数 (上游 0 + test_package 2)
assertion_count: 2
