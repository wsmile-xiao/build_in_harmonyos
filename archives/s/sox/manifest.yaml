# 软件级 manifest
# 文件位置: archives/s/sox/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: sox

# 显示名
display: "SoX - Sound eXchange"

# 一句话描述
description: "通用音频处理工具，支持多种音频格式转换、效果处理和播放"

# 分类标签
category: utility

# 官网 URL
homepage: "https://sox.sourceforge.net/"

# 开源许可证（SPDX 标识）
license: GPL-2.0+

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points: []

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "14.4.2":
    status: pending
    build_date: 2026-05-25