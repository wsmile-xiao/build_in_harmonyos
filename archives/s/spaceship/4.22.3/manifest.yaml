software: spaceship
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.22.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.22.3"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/spaceship-prompt/spaceship-prompt/tarball/v4.22.3"

  # 源码校验和
  sha256: "d75bae2ce4312dee66711d8788755cd4a89603d0ee7fe5e8ea3d19bc715d9f54"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: script

  # 配置选项列表
  configure_options: []
  # 脚本项目无需 configure

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zsh/5.9
  # Zsh 提示符主题依赖

  # 编译器
  cc: ""
  cxx: ""
  # 脚本项目无需编译器

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "spaceship 是纯 Zsh 脚本项目，无需传统 configure/make 流程"
  - "通过 zcompile 编译 .zwc 文件可提高加载速度"
  - "安装路径为 $PREFIX/share/spaceship-prompt，包含主文件、lib 和 sections"
  - "需要在用户 .zshrc 中 source spaceship.zsh 才能生效"
  - "鸿蒙系统 Zsh 缺少部分模块（zsh/mathfunc, zsh/zpty），但不影响基本功能"
