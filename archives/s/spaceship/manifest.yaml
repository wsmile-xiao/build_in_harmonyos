software: spaceship
# 软件级 manifest 模板
# 文件位置: archives/s/spaceship/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（英文，用于目录名）
name: spaceship

# 软件名称（中文/完整名称）
full_name: Spaceship Prompt

# 软件描述（一句话）
description: Minimalistic, powerful and extremely customizable Zsh prompt

# 软件分类
# shell | editor | library | tool | system | network | devel | misc
category: shell

# 官网/项目主页
homepage: https://spaceship-prompt.sh

# ============================================================
# 版本索引
# ============================================================

# 已编译的版本列表（按时间倒序）
versions:
  - version: "4.22.3"
    status: published
    build_date: "2026-06-10"
    notes: 最新稳定版，纯脚本安装

# ============================================================
# 依赖信息
# ============================================================

# 运行时依赖（软件级）
runtime_dependencies:
  - zsh

# 编译依赖（软件级，通常与版本级一致）
build_dependencies:
  - zsh

# ============================================================
# 特殊说明
# ============================================================

# 平台限制
platform_notes:
  - "纯 Zsh 脚本项目，无需编译器"
  - "部分 Zsh 模块缺失（zsh/mathfunc, zsh/zpty）"
  - "需要用户手动 source spaceship.zsh"

# 打包说明
packaging_notes:
  - "无 ELF 文件，无需签名"
  - "包含 .zwc 编译文件以提高加载速度"