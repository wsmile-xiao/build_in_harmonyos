# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: skkdic/20230109
homepage: "https://skk-dev.github.io/dict/"

# 上游测试命令 —— 逐字抄自上游 zipcode/Makefile.in:116-118 的 `test` 目标
# （顶层 Makefile 无 test/check 目标；上游唯一的测试入口就是这一条，
#  且必须在 zipcode/ 目录下执行，2 个用例都从当前目录读 ./SKK-JISYO.*.zipcode）
upstream_check_command: "cd zipcode && emacs --batch --quick --directory test --load test/all-tests.el --funcall ert-run-tests-batch-and-exit"

# conanfile.py build() 方法中是否已集成上游测试
# （纯数据包无 build()；上游测试改由 test_package 真实执行，见 upstream_tests_executed）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# zipcode/test/zipcode-test.el 含 2 个 ert-deftest：
#   jisyo-zipcode/test1        校验 SKK-JISYO.zipcode 邮编 6020033 的整条条目
#   jisyo-office-zipcode/test1 校验 SKK-JISYO.office.zipcode 邮编 1008926 的整条条目
upstream_tests:
  - file: zipcode/test/zipcode-test.el
    framework: emacs-ert
    cases:
      - jisyo-zipcode/test1
      - jisyo-office-zipcode/test1
    description: "Emacs ERT 测试：逐字节比对 zipcode 词典中特定邮编的整条条目内容"
    executed: true
    executed_by: "test_package/run_upstream_tests.sh（由 test_package/conanfile.py 的 test() 调用）"

# 上游用例数（实测：grep -c '(ert-deftest' zipcode/test/zipcode-test.el = 2）与真实执行数
upstream_test_cases: 2
upstream_tests_executed: 2
upstream_tests_passed: 2

# 跑上游用例所需的外部测试框架：Emacs ERT
# 由制品仓已发布的 emacs/29.1（OHOS aarch64 预编译包）提供，作为 test_package 的
# 测试期依赖引入（self.requires("emacs/29.1")），不污染 skkdic 自身的零依赖属性。
upstream_test_framework:
  name: "GNU Emacs / ERT"
  version: "29.1"
  provider: "conan 包 emacs/29.1（已发布到制品仓 ohpcd）"
  command: "emacs --batch --quick --directory <test dir> --load <test dir>/all-tests.el --funcall ert-run-tests-batch-and-exit"

# 上游测试源码的取得方式：与配方同一个发布 tarball，按 sha256 固定，
# 运行期现取现用、跑完即删，仓库内不内置任何上游测试代码。
upstream_test_source:
  url: "https://deb.debian.org/debian/pool/main/s/skkdic/skkdic_20230109.orig.tar.gz"
  sha256: "dc4f1550b84c80882a0db0b7e6db47a1baed7b40a2f821d0355464ed36d2ced4"
  vendored: false

# test_package 中自带的测试 (消费者视角验证词典文件完整性)
test_package_tests:
  - file: test_skkdic.py
    description: "验证 share/skk 下词典文件存在、可读、非空，且内容符合 SKK 词典格式"
    command: "python3 test_skkdic.py <datadir>"

# 测试断言总数
# test_package/conanfile.py：cpp_info 属性 skkdic_datadir 必须存在（1）
# test_package/test_skkdic.py：datadir 存在（1）
#                            20 个核心词典 isfile + 非空（20 × 2 = 40）
#                            SKK-JISYO.L / .zipcode / .assoc 行格式解析（3 × 3 = 9）+ 条目数阈值（3）
#                            安装词典数 >= 30（1）
#                            ChangeLog / unicode-license.txt 存在且非空（2 × 2 = 4）
#                            = 58
# test_package/run_upstream_tests.sh（上游用例执行器的自检，14 项）
#                            emacs 可执行（1）、已安装词典树存在（1）、
#                            zipcode / office.zipcode 两个用例输入存在（2）、
#                            upstream entry point / case file 存在（2）、
#                            EMACSLOADPATH 指向目录（1）、
#                            ert-deftest 计数 == 2（1）、emacs 退出码 == 0（1）、
#                            ERT 报告 Ran 2 tests（1）、0 unexpected（1）、
#                            2 条 passed（1）、逐个用例 passed（2）
# 合计 1 + 58 + 14 = 73；实测 73/73 通过，另加 2 个上游 ERT 用例 2/2 通过。
assertion_count: 73
upstream_harness_assertions: 14
consumer_assertion_count: 59
