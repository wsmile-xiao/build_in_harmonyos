knowledge_gained:
  - "skkdic 是纯数据包：归档（64 个条目）里只有 SKK-JISYO.* 文本词典 + Makefile + zipcode/，没有任何 C/C++ 源码；配方不需要 build()，package() 直接安装 share/skk/。仓库内既有先例为 archives/m/mecab-jumandic/7.0-20130310/ 与 archives/t/tzdata/2026.3/。"
  - "20230109 只能取 Debian 的 orig.tar.gz：上游 skk-dev/dict 的 GitHub API 对 /tags 与 /releases 均返回 0 条，tags/20230109 归档 HTTP 404；Debian 源码池里 20230109 已是最新版（另有 20210106）。"
  - "package_type 不能用 'data'（OHOS 适配版 conan 不支持该枚举）；纯数据包应留空 package_type，且不得设置非空 bindirs 或 dst=\"bin\"，否则 CI 的 L0k/R38 闸会要求 commands.json。"
  - "纯数据包同样不需要 commands.json：L0k 仅在 HAS_BINDIRS/HAS_BIN_INSTALL/HAS_EXECUTABLE>0 时才要求它，反过来给非 CLI 包加 commands.json 会被 PF8 判为 finding。"
  - "数据包的 package_info() 应当用 cpp_info.set_property() 把数据目录发布出去（例如本包的 skkdic_datadir=share/skk），否则消费者只能硬编码 <package_folder>/share/skk；属性缺失时 test_package 的 generate() 会直接失败，等于一条真断言。"
  - "纯数据包的 test_package 无库可链接时，可用纯 Python 脚本（test_skkdic.py）做消费者侧校验，避免引入 CMakeToolchain / CMakeLists.txt 等构建文件，消除构建产物污染（T035）。"
  - "校验数据完整性不能只 stat 文件大小：扫描词典行格式（reading<space>cand1/cand2//annotation/）才能证明内容真的没被截断或错误转码。"
  - "词典本体绝不能提交进 archives/：CI junk_check (JC2/JC3) 会拦截 PR diff 中的 .tar.* 等二进制/归档文件。归档目录只放配方与元数据。"
  - "本地 conan create 必须把 test_package 复制到 -tf 指定的目录：Conan 2 的 --test-folder 要求目标目录里已经有 conanfile.py，它不会自动从配方目录拷贝。直接 conan create . 还会把 source 落在配方目录里，污染 archives 树（T035）。"
  - "纯数据包的上游测试并非不可执行：上游 zipcode/test/zipcode-test.el 的 2 个 Emacs ERT 用例只需要「一个能跑 ERT 的 Emacs」—— 制品仓里已发布 emacs/29.1（OHOS aarch64 预编译包，它自身也是本仓库适配的），在 test_package 里 self.requires(\"emacs/29.1\") 即可拿到，用上游 Makefile 的原命令真实执行。凡是「上游用例需要 X 工具」的场景，先查 X 是否已在制品仓有包，再谈环境不具备。"
  - "上游 ERT 用例从当前目录读数据文件（本例读 ./SKK-JISYO.zipcode），所以执行器要 cd 到已安装的 share/skk 再跑 —— 被测数据就是包里那一份，不是另拷一份；反向破坏（删词典 / 改一个字节）必须真失败才算非空壳。"
  - "test_package 里拿上游 fixture 只能用 conan.tools.files.get() 按 sha256 现取（ConanFileInterface 没有 source_folder），跑完即删，仓库不内置上游测试代码。"
  - "本机到 deb.debian.org 实测 1.29 MB/s（2026-10-10，range 请求 1 MiB 用时 0.81s），11 MB 的 orig.tar.gz 可在 10s 内下完，不需要 download_cache 兜底。"