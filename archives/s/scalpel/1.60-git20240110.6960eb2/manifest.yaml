knowledge_gained:
  - "musl/OHOS 的 realpath() 要求路径每个分量都存在，glibc 会解析最长存在前缀——上游对『尚不存在的输出目录』调 realpath 并复制返回值缓冲区时，musl 返回 NULL 且不动缓冲区，未初始化栈垃圾进入路径导致 forensic-soundness 假告警；修法是判空保留原名"  # knowledge_ref: E648
  - "GNU make 对命令行变量忽略 makefile 内（含目标级）的 += 追加——raw Makefile 工程把平台宏放目标级 CC += 时，命令行 CC=clang 会静默丢掉平台定义，必须把 -D 宏显式并入命令行 CC"  # knowledge_ref: E649
