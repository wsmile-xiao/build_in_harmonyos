# test_package/MANIFEST.yml
# 上游官方测试声明文件
# scalpel 1.60-git20240110.6960eb2（nolaforensix/scalpel-1.60 commit 6960eb2 快照）
# 上游无测试套件：Makefile 仅 all/linux/bsd/win32/nice/clean 目标，无 check/test
# 目标；源码树无 tests/ 目录、无任何测试框架注册（19 个文件逐项核对）。

package: scalpel/1.60-git20240110.6960eb2
homepage: "https://github.com/nolaforensix/scalpel-1.60"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（上游 0 项）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证, 调用已安装二进制）
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 版本横幅 + 端到端雕刻（3 个 HTML 块）+ 产物内容逐字校验 + 审计日志 + 默认配置文件"
    command: "bash test.sh"

# 上游测试断言总数
assertion_count: 0
