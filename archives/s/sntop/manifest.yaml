software: sntop
display: "sntop"
description: "基于 ncurses 的终端网络主机连通性监视器（top 式界面轮询显示清单主机的 UP/DOWN 状态）"
category: network
homepage: "https://sntop.sourceforge.net/"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 configure 是 autoconf 2.13 生成物（仓内无 configure.ac），它把命令行 VAR=value 判成 host 三元组并 error 退出，依赖的头/库路径只能经环境变量注入"
    - "Makefile.in 的 CFLAGS 行不引用 @CFLAGS@/@LDFLAGS@，configure 探到的编译旗标进不了真正的编译命令：头文件路径改经上游本就使用的 -I$(INCLUDE) 钩子注入，库路径随 LIBS 进 @LIBS@"
    - "归档的 ncurses 只出宽字符静态库 libncursesw.a（无 libncurses.a），上游 AC_CHECK_LIB(ncurses, printw) 恒为 no，但该结论不被任何源码读取，属良性假阴"
    - "上游 install 不支持 DESTDIR，且 $(INSTDIR)/$(ETCDIR) 不存在时直接 false，须先建目录并装到私有 pkgroot 再搬进包目录"
    - "sntop.c 用了 time()/ctime() 却未包含 <time.h>，musl/OHOS 头文件划分下成为隐式声明，clang 以 -Wint-conversion 中断编译（补丁 0001）"
    - "运行时经 /bin/sh -c 调用 fping（默认）或 ping（-p）；本机 fping 缺位，故消费者测试走 -p"
    - "全部 curses 调用都被 !(flags & DAEMON) 包住，故 -d -o -w 路径可在无 tty 环境真跑完整判定链路"
  common_dependencies:
    - ncurses

versions:
  "1.4.3":
    status: built
    build_date: "2026-09-25"
    conan_ref: "sntop/1.4.3"
