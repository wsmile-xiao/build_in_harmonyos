# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sntop/1.4.3
homepage: "https://sntop.sourceforge.net/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# 一手实测：在解包后的源码目录执行 `make -n check` 得到
#   make: *** No rule to make target 'check'.  Stop.
# Makefile.in 定义的目标全集只有 all / proper / sntop / sntop.o / clean / install，
# 不存在 check / test 目标；源码树内也没有 tests/ 目录与任何 *.test / *.c 测试夹具
# （唯一的 .c 文件是 sntop.c 与被探测后才会启用的 getopt_long.c）。
# 故上游无可执行测试命令，此处留空。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（同上，清点证据 = Makefile.in 目标表 + make -n check 报错）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_sntop.c
    description: >-
      真实使用者程序：以绝对路径驱动被测包交付的 bin/sntop，断言三组互相独立的
      行为面 —— 版本面（--version 退出码 0 且输出上游版本串 sntop v1.4.3）、
      用法面（--help 退出码 0 且输出 Usage 与 -r, --refresh 选项行）、
      核心功能面（-d -o -w -p 走"守护+单次+HTML"这条全程不触碰 curses 的路径，
      在无 tty 的环境下真跑一遍 解析配置 → 经 /bin/sh 执行与 -p 拼出的完全相同的
      ping 命令行 → 判定 UP/DOWN → 渲染 HTML 报表，并用同机同命令的 ping 地面
      真值逐主机比对状态与计数）。
    command: "cc -o test_sntop src/test_sntop.c && ./test_sntop <pkg>/bin/sntop <work-dir>"

# 测试断言总数（本机无 ping 时走 SKIP 分支，少 1 条 up 计数比对）
assertion_count: 17
