# 版本级编译元数据 —— sntop 1.4.3
# 文件位置: archives/s/sntop/1.4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.4.3"
software: sntop
name: sntop
type: tool

# published | built | failed | archived
status: built

build_date: "2026-09-25"
# 上游 configure 是 autoconf 2.13 的生成物（仓库内不含 configure.ac /
# configure.in / Makefile.am），故 recipe 无法用 autoreconf 再生成，
# 只能按其既有形态驱动 —— 归入 autotools（configure + make）。
build_system: autotools

description: >-
  sntop (simple network top) —— 基于 ncurses 的终端网络主机连通性监视器：
  按配置清单轮询各主机的 UP/DOWN 状态，以 top 式界面显示，
  支持守护模式、报警脚本与 HTML 报表。

homepage: "https://sntop.sourceforge.net/"
license: GPL-2.0-only

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://downloads.sourceforge.net/project/sntop/sntop/1.4.3/sntop-1.4.3.tar.gz"
  sha256: "943a5af1905c3ae7ead064e531cde6e9b3dc82598bbda26ed4a43788d81d6d89"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  configure_options:
    - "--prefix=<build_folder>/pkgroot"
    - "--mandir=<build_folder>/pkgroot/share/man"

  dependencies:
    - ncurses/6.5

  cc: clang
  cxx: clang++

  make_invocations:
    - "make INCLUDE=<ncurses>/include SNTOPRC=<runtime prefix>/etc/sntoprc"
    - "make INCLUDE=<ncurses>/include SNTOPRC=<runtime prefix>/etc/sntoprc install"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-sntop.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "autoconf 2.13 的 configure 把命令行 VAR=value 判成 host 三元组并 error 退出（≥2.5x 才支持该写法），依赖路径只能经环境变量注入"
  - "上游 Makefile.in 的 CFLAGS 行不引用 @CFLAGS@/@LDFLAGS@，configure 探到的编译旗标进不了真正的编译命令；头文件路径改经它本就使用的 -I$(INCLUDE) 钩子注入，库路径随 LIBS 进 @LIBS@"
  - "归档的 ncurses 只出宽字符静态库 libncursesw.a，上游 AC_CHECK_LIB(ncurses, printw) 恒为 no；该结论不被任何源码读取，属良性假阴，真正链接用的 -lncursesw 由 LIBS 提供"
  - "上游 install 规则不支持 DESTDIR，且 $(INSTDIR)/$(ETCDIR) 不存在时直接 false，故需先建目录、装到私有 pkgroot 再由 package() 搬进包目录"
  - "sntop.c 调用 time()/ctime() 却只包含了 sys/time.h，musl/OHOS 的头文件划分使其成为隐式声明，clang 以 -Wint-conversion 中断编译（补丁 0001）"
  - "sntop 的所有 curses 调用都被 !(flags & DAEMON) 包住，因此 -d -o -w 这条路径可在无 tty 环境下真跑完整轮询判定链路，是 curses 类程序可用的消费者测试形态"

knowledge_ref: [DRAFT-sntop-1.4.3-autoconf213-configure-rejects-host-args-env-var-channel]

