# 版本级 manifest — apriltag 3.4.5
# 遵循 ARCHIVE-SPEC v2.0

version: "3.4.5"
software: apriltag

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/AprilRobotics/apriltag/archive/refs/tags/v3.4.5.tar.gz"
  sha256: "3749f48220db78c29c375a373861f4e1f4138e5dbae3c298584e96cfcc556515"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
  - "-DBUILD_TESTING=ON"             # 层1 上游官方测试（3 个 test_detection ctest）
  - "-DBUILD_EXAMPLES=OFF"
  - "-DBUILD_PYTHON_WRAPPER=OFF"
  - "-DBUILD_SHARED_LIBS=OFF"        # 默认静态（本仓惯例）
  - "cmake_system_name=OHOS, cmake_system_processor=aarch64 (generic_system)"

  # 零第三方依赖（threads + libm 为系统库）
  dependencies: []

  cc: clang
  cxx: clang

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
- "patches/0001-drop-werror.patch"
  # 上游把 -Werror 当卫生（CMake>=3.24 走 CMAKE_COMPILE_WARNING_AS_ERROR ON，
  # <3.24 走 add_compile_options(-Werror)），无 CACHE 覆盖不掉，补丁摘除；
  # clang-15 告警不致命。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "apriltag 为视觉基准系统（AprilTag tag36h11/tag25h9/...）C99 库：CMake 构建，仅依赖系统 threads+libm，零第三方依赖"
- "上游 install 把头以保目录形式装到 include/apriltag/{apriltag.h, common/*.h, tag*.h}（apriltag.h 相对 include common/*.h），消费者 includedirs 指 include/apriltag 即可 #include \"apriltag.h\""
- "上游把 -Werror 当静态库卫生：CMake>=3.24 走 set(CMAKE_COMPILE_WARNING_AS_ERROR ON)（无 CACHE，-D 覆盖不掉）、<3.24 走 add_compile_options(-Werror) → 只能打补丁摘除"
- "BUILD_TESTING=ON 时 test/ 注册 3 个 ctest（test_detection 对随包照片跑 tag36h11 全流程，与真值逐角点比对），可在 build() 内 cmake.test() 直接实跑（对比需 guile/submodule 的库）"
- "GitHub codeload tarball 在 Windows host 用 git archive 算 sha256 须 git -c core.autocrlf=false（否则 CRLF 污染整包哈希）；内容正确性可与 Debian/Ubuntu pool 的同源 orig.tar.gz diff 交叉验证"
