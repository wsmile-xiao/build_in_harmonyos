# test_package/MANIFEST.yml — apriltag 3.4.5
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: apriltag/3.4.5
homepage: "https://github.com/AprilRobotics/apriltag"

# 上游测试命令（手动复现：源码树顶层配置+构建+ctest）
upstream_check_command: "cmake -S . -B build -DBUILD_TESTING=ON -DBUILD_EXAMPLES=OFF -DBUILD_PYTHON_WRAPPER=OFF && cmake --build build && ctest --test-dir build"

# conanfile.py build() 中是否已集成上游测试（cmake.test()，层1）
upstream_test_in_build: true
upstream_test_command: "ctest (conanfile.py build() 末尾 cmake.test())"

upstream_test_count: 3
upstream_test_cases_skipped: 0

# 上游实际运行的 3 个测试（test/CMakeLists.txt 在 BUILD_TESTING=ON 下注册）
# 每个用例 = test_detection 程序对一张真实照片跑 tag36h11 全流程，
# 检测结果与 test/data/*.txt 真值逐角点比对（容差 0.1px，见 test_detection.c）。
upstream_tests:
  - file: test/test_detection.c
    source: apriltag-3.4.5/test/test_detection.c
    description: "照片 33369213973_9d9bb4cc96_c：tag36h11 检测与真值逐角点比对"
    command: "test_detection data/33369213973_9d9bb4cc96_c"
  - file: test/test_detection.c
    source: apriltag-3.4.5/test/test_detection.c
    description: "照片 34085369442_304b6bafd9_c：tag36h11 检测与真值逐角点比对"
    command: "test_detection data/34085369442_304b6bafd9_c"
  - file: test/test_detection.c
    source: apriltag-3.4.5/test/test_detection.c
    description: "照片 34139872896_defdb2f8d9_c：tag36h11 检测与真值逐角点比对"
    command: "test_detection data/34139872896_defdb2f8d9_c"

# test_package 自带的消费者测试（真实调用公开 API）
test_package_tests:
  - file: test_apriltag.c
    description: "消费者测试：matd 数值断言(3) + tag36h11 family 字段(4) + 检测器生命周期/全白图 0 检测(2)"
    command: "./test_apriltag"

# 测试断言总数（上游 3 程序各含多角点比对；消费者 ≈9 断言，粗估）
assertion_count: 30
