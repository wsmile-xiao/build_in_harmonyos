software: at-spi2-core
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.58.3-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.58.3-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-19"

# 构建系统类型
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/at-spi2-core/2.58/at-spi2-core-2.58.3.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--wrap-mode=nodownload"
    - "-Dx11=disabled"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "dbus-1/1.14.10"
    - "glib-2.0/2.82.4"
    - "gio-2.0/2.82.4"
    - "gobject-2.0/2.82.4"
    - "gmodule-2.0/2.82.4"
    - "libxml-2.0/2.15.3"
    - "zlib/2.3.3"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "at-spi2-core 使用 meson 构建系统（非 autotools）"
  - "需要 zlib pkg-config，路径在 harmonybrew/lib/pkgconfig"
  - "X11 扩展 xtst 缺失时可禁用 X11 支持（-Dx11=disabled）"
  - "meson wrap-mode=nodownload 避免下载子项目"
