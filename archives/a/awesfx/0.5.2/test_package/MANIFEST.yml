package: awesfx/0.5.2
homepage: "https://github.com/tiwai/awesfx"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_consumer.c
    description: "Compile, link, and execute packaged sf2text and text2sf with --help"
    command: "./test_consumer <sf2text> <text2sf>"
  - file: conanfile.py
    description: "Capture and assert usage output from sf2text and text2sf"
    command: "conan test (sf2text --help + text2sf --help)"

assertion_count: 3
