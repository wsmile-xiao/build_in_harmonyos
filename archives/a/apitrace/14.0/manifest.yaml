software: apitrace
version: "14.0"
status: published
build_date: "2026-08-27"
build_system: cmake

source:
  url: "https://github.com/apitrace/apitrace/archive/refs/tags/14.0.tar.gz"
  sha256: "53469052b28ca56dc0d28153d218dee6c2c128c53b2aa32d6e7f906f7a5c6c7a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DENABLE_GUI=OFF"
    - "-DENABLE_X11=OFF"
    - "-DENABLE_EGL=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake build system works natively for OHOS cross-compilation"
  - "Git submodules required: brotli, gtest, libbacktrace, libpng, snappy, zlib, zstd, directxmath"
  - "Source tarball from GitHub does not include submodules; must download them separately in source()"
