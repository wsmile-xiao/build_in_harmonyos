# test_package/MANIFEST.yml — asmjit 0.0-git20231115.1da9e4d
package: asmjit/0.0-git20231115.1da9e4d
homepage: "https://github.com/asmjit/asmjit"

# 上游测试命令（ASMJIT_TEST=ON 时通过 CTest 运行）
upstream_check_command: "ctest --test-dir build"
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游测试列表（ASMJIT_TEST=ON 时构建的测试程序）
upstream_tests:
  - file: asmjit_test_unit.cpp
    source: asmjit/test/asmjit_test_unit.cpp
    description: "asmjit 单元测试（嵌入模式，覆盖 core/arm/x86）"
    command: "./asmjit_test_unit"
  - file: asmjit_test_assembler.cpp
    source: asmjit/test/asmjit_test_assembler.cpp
    description: "汇编器功能测试（a64/x64/x86 后端）"
    command: "./asmjit_test_assembler"
  - file: asmjit_test_compiler.cpp
    source: asmjit/test/asmjit_test_compiler.cpp
    description: "编译器功能测试（寄存器分配、函数调用约定）"
    command: "./asmjit_test_compiler"
  - file: asmjit_test_emitters.cpp
    source: asmjit/test/asmjit_test_emitters.cpp
    description: "指令发射器测试"
    command: "./asmjit_test_emitters"
  - file: asmjit_test_instinfo.cpp
    source: asmjit/test/asmjit_test_instinfo.cpp
    description: "指令信息查询测试"
    command: "./asmjit_test_instinfo"

# test_package 消费者测试
test_package_tests:
  - file: test.cpp
    description: "JIT 核心流程断言（Compiler → JitRuntime → 调用验证）"
    command: "./test_asmjit"

assertion_count: 3
