software: asmjit
version: "0.0-git20231115.1da9e4d"
status: built
build_date: "2026-08-20"

source:
  url: "https://github.com/asmjit/asmjit/archive/1da9e4d957fc8c48d1eac68c76c1b139b3691a24.tar.gz"
  sha256: "19bd61c05dc583533d39f7443662024ca2172fe609acf4ff4b51af9c4d2fb64d"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DASMJIT_STATIC=ON"
    - "-DASMJIT_TEST=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake 3.5+ 项目，C++11，支持 AArch64"
  - "无外部 Conan 依赖（仅系统 pthread/rt）"
  - "OHOS/bionic 不需要显式链接 pthread（与 Android 同理）"
  - "上游 CMakeLists.txt 按 CMAKE_SYSTEM_NAME 判断是否链接 pthread/rt"
  - "提供 asmjit::asmjit CMake target，支持 find_package"
  - "OHOS 需要 CMAKE_SYSROOT 指向 ~/usr/local/sysroot，否则链接器找不到 crt/libc"
  - "OHOS 可执行文件需要代码签名（binary-sign-tool），否则 Permission denied"
  - "JIT 可执行内存分配（mmap PROT_EXEC）在 OHOS 上正常工作"
  - "test_package 需要显式链接 c++ c++abi（OHOS 不自动链接 C++ 运行时）"
