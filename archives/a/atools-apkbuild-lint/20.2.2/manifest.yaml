# 版本级 manifest
# 文件位置: archives/a/atools-apkbuild-lint/20.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "20.2.2"

# 软件名
software: atools-apkbuild-lint

# 编译状态
# published | built | failed | archived
status: pending

# 编译日期（YYYY-MM-DD）
build_date: ""
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  # 说明：web 归档端点挂在 gitlab goaway 反爬墙后（对 Conan UA 返回 HTTP 418），
  # 改用同一官方仓库的 GitLab REST API 归档端点；两者文件树经逐字节比对完全
  # 一致（66 个文件内容与可执行位相同），web 归档 sha512 与 Alpine aports
  # community/atools APKBUILD 的 sha512sums 一致。
  url: "https://gitlab.alpinelinux.org/api/v4/projects/Leo%2Fatools/repository/archive.tar.gz?sha=20.2.2"

  # 源码校验和
  sha256: "32e19ed3552c18adc44124b2697070bc173cdbaa1704407e05ddf6a6f97e9f01"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（纯 shell 脚本包，无编译；测试期为 secfixes-check 套件
  # 现构建 lua5.3 解释器，见 notes.md）
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）——无 Conan 依赖；
  # 测试期 lua-5.3.6 由 conandata.yml lua_source 从官方源码获取并本地构建，
  # 不进入制品依赖图
  dependencies: []

  # 编译器（仅测试期构建 lua 解释器使用）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "atools 是 Alpine 的 APKBUILD/aports 辅助工具集；Alpine 子包 atools-apkbuild-lint 只含 usr/bin/apkbuild-lint（纯 ash shell 脚本 linter），本包对齐该子包边界"
  - "gitlab.alpinelinux.org 的 web 归档端点有 goaway 反爬（Conan UA 返回 418，curl/wget 可过）；REST API 端点 /api/v4/projects/<id>/repository/archive.tar.gz 不受影响且字节稳定，可作为官方替代下载通道"
  - "上游测试为 bats 框架（tests/*.bats，224 用例）；OHOS 无 redo/bats，可用行级预处理的 @test→函数改写 + set -e 子 shell + run/skip/status/output/lines 内置实现最小兼容驱动"
  - "secfixes-check 是 Lua 5.3 脚本；其测试套件所需解释器可在真机上从官方 lua-5.3.6 源码快速现构建（仅 -lm -ldl），作为测试期 PATH 工具而不打包"
  - "toybox 缺 unexpand(1)；上游 retab() 用它把 4 空格 fixture 折叠成 tab，需要提供 --first-only/-tN 最小实现"
