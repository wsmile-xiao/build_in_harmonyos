# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: atools-apkbuild-lint/20.2.2
homepage: "https://gitlab.alpinelinux.org/Leo/atools"

# ── 上游测试入口 ─────────────────────────────────────────────────────────
# 上游 README：`redo check` -> bats --tap tests/*.bats（checkdepends=bats）。
# OHOS 工具链没有 redo / bats / scdoc，因此不声明独立 check 命令；
# 测试由 conanfile.py build() 内联驱动在真机完整执行
# （upstream_test_in_build: true）：内置最小 BATS 兼容驱动 bats-shim.sh
# 直接运行 5 个 .bats 文件（语义：@test 块独立子 shell + set -e、
# run/skip/status/output/lines、TAP 输出），结果持久化为包内
# res/upstream_test_result.json 与 res/upstream_test_files.json（per-suite 明细），
# 由 test_package test() 每轮复发 HMBS_UPSTREAM_TEST_RESULT 标记（缓存命中
# "Already installed!" 跳过 build() 时标记仍由 test_package 提供）。

upstream_tests_exist: true
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "bash bats-shim.sh tests/apkbuild-lint.bats tests/bad-version-regex.bats tests/aports-lint.bats tests/initd-lint.bats tests/secfixes-check.bats"

# ── 上游用例统计（来源：tests/*.bats 的 @test 块计数，注释掉的 XFAIL 不计）──
#   tests/apkbuild-lint.bats      111
#   tests/secfixes-check.bats     100
#   tests/bad-version-regex.bats    6
#   tests/initd-lint.bats           5
#   tests/aports-lint.bats          2
#   合计                          224
# 执行集 = 224 - 2（上游作者无条件 skip('false positive')、无可执行断言，
# 见 upstream_test_audit 第 1 条）= 222；全部真实执行。

upstream_tests:
  - file: tests/apkbuild-lint.bats
    description: "apkbuild-lint 全量行为测试（[ALxx] 规则逐条断言）"
    cases: 111
  - file: tests/secfixes-check.bats
    description: "secfixes-check 行为测试（CVE/GNUTLS-SA ID 解析与校验）"
    cases: 100
  - file: tests/bad-version-regex.bats
    description: "pkgver 坏版本正则 [AL61]（mesa/nginx 用例）"
    cases: 6
  - file: tests/initd-lint.bats
    description: "initd-lint openrc 服务脚本检查"
    cases: 5
  - file: tests/aports-lint.bats
    description: "aports-lint 本地补丁描述检查 [AL56]"
    cases: 2

# ── 审计记录 ─────────────────────────────────────────────────────────────
upstream_test_audit:
  - path: "tests/apkbuild-lint.bats（'quoted composed pkgname is fine'、'backticks in comments should be ignored'）"
    finding: "2 个用例被上游作者以无条件 skip('false positive') 禁用（分别位于第 209/302 行，skip 是用例体第一条语句），本身没有任何可执行断言——执行它们既不可能也不构成证据。按上游意图移出执行集并如实审计，不计入 discovered/passed；执行集 224→222。"
  - path: "tests/secfixes-check.bats"
    finding: "被测工具 secfixes-check 是 Lua 5.3 脚本（shebang #!/usr/bin/lua5.3），OHOS 无任何 Lua 运行时。按'低成本补齐'原则，配方从官方 lua-5.3.6.tar.gz（sha256 校验）在真机构建仅测试期使用的 lua5.3 解释器并前置到 PATH；脚本 shebang 平台适配为 '#!/bin/sh\\nexec lua5.3 \"$0\" \"$@\"'。100 个用例全部纳入执行集。"
  - path: "tests/apkbuild-lint.bats（retab 相关 fixture：第 949/961/974/985/997/1011 行附近的用例）"
    finding: "上游 retab() 辅助函数依赖 GNU/busybox unexpand 将 4 空格缩进 fixture 折叠为 tab；toybox 未提供 unexpand。配方在 tests-bin/ 提供最小实现（--first-only/-f + -tN 子集，运行时解析 python3），仅用于准备 fixture，不影响断言本体。"
  - path: "tests/apkbuild-lint.bats 'function keyword should not be used'"
    finding: "该用例带条件跳过 `is_travis && skip`（仅在 CI 环境禁用）；预检环境无 TRAVIS 变量，用例照常执行。"
  - path: "*.bats shebang 与运行框架"
    finding: "bats 文件由内置 bats-shim.sh 驱动（OHOS 无 bats）；被测脚本 shebang 平台适配 #!/usr/bin/env ash → #!/bin/sh。适配只涉及解释器定位，不改任何测试逻辑与断言。"

# ── test_package 自带消费者测试 ──────────────────────────────────────────
test_package_tests:
  - file: test.sh
    description: >
      对安装后的 apkbuild-lint 做真实 lint 验证：
      TC1 二进制存在且可执行；
      TC2 干净 APKBUILD（pkgver=21.0.1，同上游 mesa good version 形态）
      退出码 0 且零告警；
      TC3 默认 builddir 用例退出码 1 且首行命中 [AL1]
      （与上游 apkbuild-lint.bats 同一断言）;
      TC4 pkgver=21.0.0 命中 [AL61] 坏版本正则。
    command: "bash test.sh"

# 消费者测试断言总数
assertion_count: 4
