# conandata.yml — atools-apkbuild-lint 20.2.2
#
# 上游：atools（Alpine Linux APKBUILD/aports 辅助工具集）
# https://gitlab.alpinelinux.org/Leo/atools
#
# 本包对应 Alpine 官方 aports 的子包 `atools-apkbuild-lint`（APKBUILD shell
# linter，安装 usr/bin/apkbuild-lint），源码归档与 Alpine aports community/
# atools APKBUILD 的 source 完全一致。
#
# URL 说明：web 端点 /Leo/atools/-/archive/20.2.2/... 挂在 gitlab 的 goaway
# 反爬墙后，对 Conan 的 UA 返回 HTTP 418（实测 curl/wget 可过、Conan 被拒），
# 因此 source() 使用同一官方仓库的 GitLab REST API 归档端点。两者文件树经
# 逐字节比对完全一致（66 个文件内容 sha256 与可执行位均相同）；web 归档的
# sha512 与 Alpine APKBUILD sha512sums 一致（63c95e4b86d9...6580）。
#
# 下载可靠性（真机预检 R3 修复）：gitlab.alpinelinux.org 对构建网络存在长时
# 不可达窗口（TLS 握手被切断 / connect 停滞），conan create 曾在 Installing
# packages 阶段停滞到被 SIGTERM（退出码 5 = Conan ERROR_SIGTERM）。该归档为
# GitLab 动态生成，全网不存在逐字节相同的第三方镜像（gh-proxy 系代理仅支持
# GitHub 目标，实测 403；Wayback 无此 URL 快照），因此主源码保留官方 URL 并由
# 配方 vendor/ 内置逐字节相同的兜底副本（sha256 与下方记录值一致，解压前强制
# 校验）。sha256 为两次独立下载一致的结果，未作任何改动。

sources:
  url: "https://gitlab.alpinelinux.org/api/v4/projects/Leo%2Fatools/repository/archive.tar.gz?sha=20.2.2"
  sha256: "32e19ed3552c18adc44124b2697070bc173cdbaa1704407e05ddf6a6f97e9f01"
  filename: "atools-20.2.2.tar.gz"

# lua_source：上游 secfixes-check 是 Lua 5.3 脚本（shebang #!/usr/bin/lua5.3），
# 其 bats 测试套件 tests/secfixes-check.bats（100 用例）需要 lua5.3 解释器；
# OHOS 不提供 Lua。为完整接入上游测试套件，配方在真机上从官方源码构建一个
# 测试专用 lua5.3 解释器（不打包、仅测试期 PATH 使用）。
#
# url 为有序列表：aliyun 的 Debian 源码池镜像在前（权威发行版镜像，实测与
# www.lua.org 归档逐字节相同、下载稳定），官方原始 URL 收尾作回退；两者共用
# 同一 sha256（Lua 官方 tarball 校验值，实测两个来源均匹配，未改动）。
# 同样有 vendor/lua-5.3.6.tar.gz 兜底副本（见上）。
lua_source:
  url:
    - "https://mirrors.aliyun.com/debian/pool/main/l/lua5.3/lua5.3_5.3.6.orig.tar.gz"
    - "https://www.lua.org/ftp/lua-5.3.6.tar.gz"
  sha256: "fc5fd69bb8736323f026672b1b7235da613d7177e72558893a0bdcd320466d60"
  filename: "lua-5.3.6.tar.gz"

patches: []
