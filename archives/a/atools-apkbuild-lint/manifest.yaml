# 软件级 manifest
# 文件位置: archives/a/atools-apkbuild-lint/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: atools-apkbuild-lint

# 显示名
display: "atools-apkbuild-lint"

# 一句话描述
description: "Alpine atools 的 APKBUILD shell 脚本 linter (apkbuild-lint)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: build-tool

# 官网 URL
homepage: "https://gitlab.alpinelinux.org/Leo/atools"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 shell 脚本包，无编译产物；shebang #!/usr/bin/env ash 需改为 #!/bin/sh"
    - "上游测试为 bats 框架（tests/*.bats）；OHOS 无 bats/redo，用内置最小兼容驱动在真机执行"
    - "secfixes-check 相关测试依赖 Lua 5.3；真机上从官方 lua 源码现构建仅测试期使用的解释器"

  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "20.2.2":
    status: pending
    build_date: ""
    archive_path: "20.2.2"
    requires_manual_verification: true
