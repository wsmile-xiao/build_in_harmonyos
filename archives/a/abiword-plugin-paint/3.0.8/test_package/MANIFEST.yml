# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# ⚠️ 如实声明测试来源：上游 AbiWord 3.0.8 paint 插件【无任何官方测试】
# （plugins/paint/ 下仅 AbiGeneric.{cpp,h} + AbiPaint.{cpp,h} + unix/ut_UnixProcess.cpp
#   + Makefile.am，全树无 tests 目录）。本包测试均为 OHOS 适配自研。

package: abiword-plugin-paint/3.0.8
homepage: "https://www.abisource.com/"

# 上游官方测试：无（已核实：orig 纯净上游树无 tests 目录，
# plugins/paint 及全部插件均无官方测试程序）
upstream_official_tests: []

# 构建阶段执行的测试命令（make check，见 conanfile.py build()）
# 注意：该 make check 执行的是【适配自研】测试 tests/test_paint_plugin.cpp，
# 由 minimal Makefile.am 的 TESTS 引入，不是上游官方测试。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 适配补全测试（自研，非上游）：端到端驱动插件模块
adapted_tests:
  - file: tests/test_paint_plugin.cpp
    origin: ohos-adaptation (self-authored, based on plugin ABI xap_Module.h/xap_App.h/ev_EditMethod.h)
    description: "端到端插件测试：dlopen 插件模块 → abi_plugin_register → 校验 XAP_ModuleInfo 与 prefs scheme → 校验菜单项与 EditMethod 注册 → abi_plugin_unregister 注销清理 (23 项 CHECK 断言)"
    command: "./test_paint_plugin"

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: run_test.cpp
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：dlopen 安装的插件模块，驱动 abi_plugin_supports_version/register/unregister，校验 XAP_ModuleInfo"
    command: "./run_test <path-to-libabiword-plugin-paint.so>"

# 测试断言总数 (实际统计：23 项 CHECK 断言 + test_package 5 项，全部为适配自研断言)
assertion_count: 28
