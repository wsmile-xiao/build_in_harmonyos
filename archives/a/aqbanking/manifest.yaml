software: aqbanking
display: "AqBanking"
description: "A library for online banking functions and financial data import/export"
category: network
homepage: "https://www.aquamaniac.de/rdm/projects/aqbanking"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "依赖 gwenhywfar >= 5.14.0"
    - "需要 gmp >= 2.9.8（必须 PIC 编译）"
    - "使用 --with-backends 选择后端（禁用 EBICS 可避免 xmlsec1 依赖）"
    - "需要修复 E007 config.guess/config.sub 平台识别"
  common_dependencies:
    - gwenhywfar
    - gmp
    - gnutls
    - libgcrypt
    - libgpg-error

versions:
  "6.9.2":
    status: published
    build_date: "2026-05-26"
    published_as: aqbanking