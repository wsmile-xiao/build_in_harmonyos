software: aqbanking
version: "6.9.2"
status: published
build_date: "2026-05-26"

source:
  url: "https://www.aquamaniac.de/rdm/attachments/download/654/aqbanking-6.9.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-backends=aqhbci aqnone"
    - "--disable-ebics"
  dependencies:
    - gmp/6.3.0
    - gwenhywfar/5.14.1
    - gnutls/3.8.10
    - libgcrypt/1.11.0
    - libgpg-error/1.55
    - libtasn1/4.21.0
    - nettle/3.10.2
    - libiconv/1.17
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-config-guess.patch"
  - "0002-fix-umask.patch"

knowledge_gained:
  - "gmp 必须使用 CFLAGS=-fPIC 编译，否则 aqbanking 动态链接失败"
  - "使用 --with-backends 选择后端，禁用 EBICS 避免 xmlsec1 依赖"
  - "configure 中 umask 077 需改为 022 解决 HMDFS 权限问题"
  - "需要创建 gmp.pc 文件才能被 pkg-config 检测"