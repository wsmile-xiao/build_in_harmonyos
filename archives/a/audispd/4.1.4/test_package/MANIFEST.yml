# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 audit-userspace 4.1.4 自带测试套件（audisp/plugins 各插件 + 仓库 CI），
# 本次适配未迁移运行（依赖完整 Linux audit 运行环境）；test_package 为
# OHOS 适配自研的 L1 验证。

package: audispd/4.1.4
homepage: "https://github.com/linux-audit/audit-userspace"

# 上游官方测试：audisp 插件测试 + 仓库 CI 脚本
upstream_official_tests:
  - suite: "ci"
    count: 20
    kind: "unit"
    command: "make check"

# 构建阶段执行的测试命令：上游 make check（本次适配未运行）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

# 适配补全测试（自研，非上游）：无（未迁移 make check，消费者验证集中在
# test_package 的 L1 验证）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: conanfile.py
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：验证 audisp-af_unix（audit 事件分发插件）存在于 bin/ 且可执行，无参运行输出用法"
    command: "./test_audispd"

# 测试断言总数 (实际统计：2 项断言，全部为适配自研断言：
# audisp-af_unix 可执行存在、无参运行输出用法)
assertion_count: 2
