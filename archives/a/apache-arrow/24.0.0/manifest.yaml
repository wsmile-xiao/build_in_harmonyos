software: apache-arrow
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/24.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "24.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/downloads/apache-arrow-24.0.0-full.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DARROW_BUILD_TESTS=OFF"
    - "-DARROW_WITH_PYTHON=OFF"
    - "-DARROW_WITH_JAVA=OFF"
    - "-DARROW_BUILD_SHARED=ON"
    - "-DARROW_BUILD_STATIC=ON"
    - "-DARROW_IPC=ON"
    - "-DARROW_MIMALLOC=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - cmake/4.1.2
    - clang/15.0.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Apache Arrow C++ 需要设置 CMAKE_SYSTEM_PROCESSOR 才能正确识别架构"
  - "Arrow C++ 核心库包含 IPC、Compute 等模块"
  - "编译耗时约12分钟（725秒），需要耐心等待"
  - "Arrow 使用 mimalloc 作为内存分配器"
