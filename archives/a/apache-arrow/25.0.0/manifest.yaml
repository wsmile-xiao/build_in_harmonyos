software: apache-arrow

# 版本号
version: "25.0.0"

# 编译状态
status: built

# 编译日期
build_date: "2026-09-13"

# 构建系统
build_system: cmake

# 源码信息
source:
  url: "https://github.com/apache/arrow/archive/refs/tags/apache-arrow-25.0.0.tar.gz"
  sha256: "7ecdd404862c3d312601457861a11c30bb8f520328693e1323e3db1db985dbe5"
  tar_format: tar.gz

# 构建配置（最小核心：IPC + COMPUTE + CSV + FILESYSTEM）
build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_CXX_STANDARD=20"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DARROW_BUILD_SHARED=ON"
    - "-DARROW_BUILD_STATIC=OFF"
    - "-DARROW_IPC=ON"
    - "-DARROW_COMPUTE=ON"
    - "-DARROW_CSV=ON"
    - "-DARROW_FILESYSTEM=ON"
    - "-DARROW_JSON=OFF"
    - "-DARROW_FLIGHT=OFF"
    - "-DARROW_DATASET=OFF"
    - "-DARROW_PARQUET=OFF"
    - "-DARROW_ORC=OFF"
    - "-DARROW_GANDIVA=OFF"
    - "-DARROW_CUDA=OFF"
    - "-DARROW_MIMALLOC=OFF"
    - "-DARROW_JEMALLOC=OFF"
    - "-DARROW_SIMD_LEVEL=NONE"
    - "-DARROW_RUNTIME_SIMD_LEVEL=NONE"
    - "-DARROW_WITH_RE2=OFF"
    - "-DARROW_WITH_UTF8PROC=OFF"
    - "-DARROW_WITH_ZLIB=OFF"
    - "-DARROW_WITH_ZSTD=OFF"
    - "-DARROW_WITH_LZ4=OFF"
    - "-DARROW_WITH_SNAPPY=OFF"
    - "-DARROW_WITH_BROTLI=OFF"
    - "-DARROW_WITH_BZ2=OFF"
    - "-DARROW_BUILD_TESTS=OFF"
    - "-DFETCHCONTENT_SOURCE_DIR_XSIMD=<build>/_vendored/xsimd-14.2.0"
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied:
  - "0001-setupcxxflags-unknown-processor.patch"
  - "0002-buildutils-ohos-soname.patch"
  - "0003-ohos-file-io-edge-cases.patch"
  - "0004-vendored-date-tzdir.patch"

# 知识沉淀
knowledge_gained:
  - "25.0.0 起 xsimd 是**无条件强制依赖**（ThirdpartyToolchain.cmake:2848-2855，REQUIRED_VERSION 14.2.0），ARROW_SIMD_LEVEL=NONE 并不能跳过它——旧版本注释中『用 NONE 避免拉取 xsimd』的说法从未成立。xsimd 是 header-only，本配方把它随配方内置并配合 FETCHCONTENT_SOURCE_DIR_XSIMD 指向本地副本，构建期零网络"
  - "flatbuffers 在 25.0.0 中只以头文件形式内置（cpp/thirdparty/flatbuffers/include，17 个 .h，无 flatc、无 src/），且生成的 *_generated.h 已随源码提交——ARROW_IPC=ON 不需要 flatbuffers 编译器，也不需要 flatbuffers Conan 包"
  - "最小核心（IPC+COMPUTE+CSV+FILESYSTEM，tests OFF）不需要任何宿主代码生成器：所有会运行新构建二进制的 custom command 都落在 Flight/Substrait/Gandiva/ORC 等被关闭的模块内"
  - "ARROW_JSON=ON 会在 ThirdpartyToolchain.cmake:410-412 自动打开 ARROW_WITH_RAPIDJSON，并经 :2785-2799 FetchContent 下载 RapidJSON——第一阶段未启用 JSON"
  - "C++20 强制点移动到 SetupCxxFlags.cmake:173-180（低于 20 直接 FATAL_ERROR）"
  - "旧补丁 0002 的平台判断写的是 CMAKE_SYSTEM_NAME STREQUAL \"HarmonyOS\"，但 Conan OHOS profile 实际设置的是 \"OHOS\"，该条件不会命中、SONAME 不会生效；本版本把条件扩展为同时接受两种写法"
  - "ARROW_WITH_PYTHON / ARROW_WITH_JAVA 从来不是 Arrow 的 CMake 选项（全树 0 命中），旧配方里的这两个 -D 一直是 CMake 静默忽略的空操作"
