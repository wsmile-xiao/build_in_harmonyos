patches:
  - patch_file: "patches/0001-setupcxxflags-unknown-processor.patch"
    patch_description: "SetupCxxFlags: accept an unknown CMAKE_SYSTEM_PROCESSOR (OHOS toolchain reports one Arrow does not know)"
    patch_type: "portability"
  - patch_file: "patches/0002-buildutils-ohos-soname.patch"
    patch_description: "BuildUtils: emit -Wl,-soname for shared Arrow libs on OHOS — CMake has no Platform/OHOS module, so VERSION/SOVERSION alone produce no DT_SONAME and ld.lld records build-tree paths in DT_NEEDED"
    patch_type: "portability"
  # NOTE: the file-io edge-case change (formerly patch 0003) is applied by
  # conanfile.build() -> _apply_file_io_edge_cases() instead of a unified diff.
  # The OHOS host's Conan applies patches with patch-ng, which rejects that
  # hunk even though GNU patch and toybox patch apply it cleanly on a pristine
  # 25.0.0 tree (lands at file.cc:274, offset 6).  The conanfile performs the
  # identical, idempotent textual edit.  The file
  # 0003-ohos-file-io-edge-cases.patch is kept beside this one for reference
  # only, and is deliberately not listed under patches: below.
  - patch_file: "patches/0004-vendored-date-tzdir.patch"
    patch_description: "arrow/vendored/datetime/tz.cpp: resolve the vendored tz database directory on OHOS (no /usr/share/zoneinfo assumption)"
    patch_type: "portability"
