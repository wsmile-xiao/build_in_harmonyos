# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: apache-arrow/25.0.0
homepage: "https://arrow.apache.org/"

# 上游测试命令
upstream_check_command: "ctest --output-on-failure   # 目标 arrow-testing / arrow-*-test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试规模（实测 apache-arrow-25.0.0 源码树）：
#   - cpp/src/**/*_test.cc  : 320 个
#   - cpp/**/*test*.cc      : 360 个
#   - 框架                  : 自带 GoogleTest（cpp/thirdparty 或 GTest::gtest）
#   - 启用条件              : ARROW_BUILD_TESTS=ON（本配方 OFF）
upstream_tests:
  - file: cpp/src/**
    description: "Arrow C++ 单元测试（array/buffer/ipc/compute/filesystem …）"
    command: "./cpp/build/debug/arrow-array-test 等"
    count: 320
    executed: false
    not_run_reason: "本配方 ARROW_BUILD_TESTS=OFF（第一阶段最小核心库交付）；启用后会额外构建 300+ 测试 TU，单线程设备上不可行"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_arrow.cpp
    description: "Consumer test: Int32Builder 构建数组 → Schema → Table::Make + Validate → compute CallFunction(add) 端到端计算并校验取值"
    command: "./test_arrow"
    assertions: 16

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16
