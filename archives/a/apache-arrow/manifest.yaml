# Apache Arrow 软件级 manifest
# 文件位置: archives/a/apache-arrow/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: apache-arrow
category: data-processing

# 软件描述
description: "Apache Arrow 是一个跨语言的内存数据格式，用于高效的数据分析系统"

# 官网链接
homepage: https://arrow.apache.org/

# 版本索引（按编译时间排序）
versions:
  - version: "24.0.0"
    status: built
    build_date: "2026-05-26"
    build_system: cmake

# 关键特性
features:
  - 列式内存格式
  - IPC 数据交换
  - Compute API
  - Parquet 支持
  - 零拷贝数据共享

# 编译注意事项
notes:
  - "源码需从 GitHub 获取完整 Arrow C++（官方 tarball 仅含 Arrow GLib）"
  - "必须设置 CMAKE_SYSTEM_PROCESSOR 与目标架构匹配"
  - "编译耗时约 12 分钟"