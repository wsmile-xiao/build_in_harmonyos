# test_package/MANIFEST.yml
# Autobahn-C++ 17.5.1-git7cc5d37 has no upstream test/ directory or test target.
# The upstream CMake project only offers optional examples, which are not a
# deterministic library test and are disabled by this header-only recipe.

package: autobahn-cpp/17.5.1-git7cc5d37
homepage: "https://github.com/crossbario/autobahn-cpp"

upstream_check_command: "none (the upstream source has no test suite)"
upstream_test_in_build: false
upstream_test_command: "not run: no upstream test target in the source commit"

test_package_tests:
  - file: test.cpp
    description: "Exercises Base64/PBKDF2 auth helpers, WAMP message fields, call-options MessagePack conversion, io_context-backed sessions, and the WebSocket++ transport template"
    command: "./test_autobahn_cpp"

assertion_count: 9
