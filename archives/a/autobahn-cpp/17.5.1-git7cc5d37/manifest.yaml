# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/17.5.1-git7cc5d37/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

name: autobahn-cpp
software: autobahn-cpp
description: "Header-only C++ WAMP client library based on Boost.Asio"
homepage: "https://github.com/crossbario/autobahn-cpp"
category: network
version: "17.5.1-git7cc5d37"
status: built
build_date: "2026-08-31"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/crossbario/autobahn-cpp/archive/7cc5d37bb39bb1c682e1f6c020f62fefa75c0add.tar.gz"

  # 源码校验和
  sha256: "b0d2e4d8b2880f0038b1bb303fb46c67b18828fd48fea6091fe6a4df5700895b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: cmake
build:
  # 上游 CMake 只提供 INTERFACE 目标；配方直接复制头文件
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.90.0.4
    - openssl/3.5.6
    - msgpack-cxx/7.0.0
    - websocketpp/0.8.2.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-boost-asio-io-context-compat.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游没有独立 test/ 目录或测试目标，test_package 负责消费者视角的真实 API 验证"
  - "Boost.Asio 1.31 及更新版本移除了 io_service.hpp 和 io_service 类名；补丁按 BOOST_ASIO_VERSION 提供 io_context 别名"
  - "msgpack-cxx 7.0.0 移除了带 nullptr zone 指针的空 array/map 构造；补丁保留空容器语义并初始化 object 字段"
  - "该包是 CMake INTERFACE 头文件库，package() 复制 autobahn/*.hpp 与 *.ipp，不生成库文件"
  - "WebSocket++ 的现代 Asio 适配由 websocketpp/0.8.2.1 提供，Autobahn 仍需独立处理自身的 io_service 入口"
