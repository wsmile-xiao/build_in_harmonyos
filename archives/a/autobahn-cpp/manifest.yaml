software: autobahn-cpp
display: "autobahn-cpp"
description: "Header-only C++ WAMP client library based on Boost.Asio"
category: network
homepage: "https://github.com/crossbario/autobahn-cpp"
license: BSL-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游是 CMake INTERFACE 头文件库，不生成 Autobahn 二进制"
    - "使用 boost/1.90.0.4、openssl/3.5.6、msgpack-cxx/7.0.0 和 websocketpp/0.8.2.1"
    - "通过 Asio 版本门控把 io_service API 兼容到 io_context，不绑定 __OHOS__ 宏"
    - "上游无独立 test 目标，test_package 真实编译并运行 WAMP/认证/传输 API"
  common_dependencies:
    - boost/1.90.0.4
    - openssl/3.5.6
    - msgpack-cxx/7.0.0
    - websocketpp/0.8.2.1

versions:
  "17.5.1-git7cc5d37":
    status: built
    build_date: "2026-08-31"
