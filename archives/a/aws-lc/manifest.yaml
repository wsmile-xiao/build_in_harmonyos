software: aws-lc
display: "AWS LibCrypto"
description: "基于 BoringSSL 的加密库，支持 TLS 1.3、后量子密码学和 FIPS 140-3"
category: crypto
homepage: "https://github.com/aws/aws-lc"
license: OpenSSL-SSLeay
build_system: cmake

ohos_adaptation:
  key_points:
    - "需要 -DDISABLE_GO=ON 禁用 Go 依赖"
    - "需要 -DOPENSSL_NO_ASM=1 禁用汇编优化"
    - "无汇编优化性能下降约 20-30%"
    - "提供 bssl 和 openssl 命令行工具"
  common_dependencies: []

versions:
  "1.72.0":
    status: partial
    build_date: "2026-04-24"
