# test_package/MANIFEST.yml — aws-lc 5.5.0
# 上游官方测试声明文件（L0e 门禁要求）
package: aws-lc/5.5.0
homepage: "https://github.com/aws/aws-lc"

# 上游测试命令（aws-lc CMake 测试目标；本配方 BUILD_TESTING=OFF 纯库构建，
# 同 5.4.0 策略——鸿蒙 C++ 测试链接问题规避）
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试（消费者视角验证库可用）
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 SHA256(\"abc\") known-answer 校验（ba7816bf...）"
    command: "test_aws-lc"

# 测试断言总数
assertion_count: 1
