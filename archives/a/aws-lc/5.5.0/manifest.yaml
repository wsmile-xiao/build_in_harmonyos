# 适配路径（A/B/C）
adaptation_path: "A"
# 适配要点
adaptation_notes: |
  基于 5.4.0（main 已适配合入）升级，版本号 + sha256 更新：
  - R26: BUILD_SHARED_LIBS=OFF（system-name 库 libcrypto/libssl 必须静态，
    避免污染 /lib）；
  - DISABLE_GO=ON（鸿蒙无 Go 工具链，用 generated-src 预生成代码）；
  - BUILD_TESTING=OFF / BUILD_TOOL=OFF（纯库构建）；
  - OPENSSL_NO_ASM=ON（鸿蒙 CMake 报 CMAKE_SYSTEM_PROCESSOR=unknown →
    aws-lc 回退 generic 架构，需显式开纯 C fallback，否则汇编符号链接失败）；
  - package_info: libs=crypto/ssl + system_libs=pthread/dl/rt。

# 测试信息
test:
  upstream_tests: "0/0（BUILD_TESTING=OFF，库构建；5.4.0 同策略）"
  test_package: |
    test.c 调 SHA256("abc") known-answer（ba7816bf...），链接 aws-lc::aws-lc
