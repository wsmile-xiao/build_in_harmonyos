# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: afflib/3.7.22
homepage: "https://github.com/afflib/afflib"

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序（make check 注册 6 个：lib 1 + tools 5）
upstream_tests:
  - file: lib/aftest.cpp
    source: AFFLIBv3-3.7.22/lib/aftest.cpp
    description: "核心库综合测试：AFF 文件创建/读取/分段/签名/压缩（90+ 断言，-a 全量模式）"
    command: "./aftest -a"
  - file: tools/test_signing.sh
    source: AFFLIBv3-3.7.22/tools/test_signing.sh
    description: "签名测试：生成 X509 密钥并对 AFF 文件签名/验证（含链式保管链）"
    command: "./test_signing.sh"
  - file: tools/test_recovery.sh
    source: AFFLIBv3-3.7.22/tools/test_recovery.sh
    description: "恢复测试：签名 → 破坏文件 → affrecover 恢复 → MD5 校验（mktemp 模板缺 XXXXXX 且 /tmp 只读，已修复为 TMPDIR 下完整模板）"
    command: "./test_recovery.sh"
  - file: tools/test_passphrase.sh
    source: AFFLIBv3-3.7.22/tools/test_passphrase.sh
    description: "口令测试：创建加密 AFF，验证 affcrypto 加解密与口令字典匹配（mktemp 模板缺 XXXXXX 且 /tmp 只读，已修复为 TMPDIR 下完整模板）"
    command: "./test_passphrase.sh"
  - file: tools/test_afsegment.sh
    source: AFFLIBv3-3.7.22/tools/test_afsegment.sh
    description: "分段测试：affsegment 写入/读取自定义元数据分段（mktemp 模板缺 XXXXXX 且 /tmp 只读，已修复为 TMPDIR 下完整模板）"
    command: "./test_afsegment.sh"
  - file: tools/test_crypto.sh
    source: AFFLIBv3-3.7.22/tools/test_crypto.sh
    description: "加解密兼容测试：用内置加密 AFF 样本验证 affcompare 解密（环境变量/URL 两种口令传递方式）"
    command: "./test_crypto.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 af_version()/af_open()/af_close() 创建并关闭临时 AFF 文件"
    command: "./test_afflib"

# 上游测试实际执行结果（make check 实测）
upstream_test_results:
  total: 6
  passed: 6
  skipped: 0
  failed: 0

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 95
