# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "E058：Debian orig 源码包无预生成 configure（仅 configure.ac），需 bootstrap.sh（aclocal/libtoolize/autoheader/autoconf/automake）生成；aclocal/automake 无版本脚本为 1.17 缺 Automake/Config.pm 模块，须用版本化命令 aclocal-1.16/automake-1.16"
- "QEMU 镜像驱动引用 POSIX aio_*（aio_read/aio_error 等），OHOS libc 不提供，链接报 undefined reference（--no-allow-shlib-undefined）→ configure --disable-qemu 规避"
- "config.status 的 mktemp+umask 077 临时目录在 HMDFS 受限环境不可写（E112/E114）→ configure 改普通 mkdir；配方用 replace_in_file 使 clean-verify G0 判定为预期行为"
- "configure 的 conftest 运行期加载依赖 .so（libexpat.so）→ 配方 generate() 把依赖 libdir 注入 buildenv LD_LIBRARY_PATH"
- "C++ 静态库（libafflib.a）依赖 libc++ → package_info 声明 system_libs=['c++']，否则消费者链接报 std::__n1 符号未定义"
- "上游测试脚本问题：aftest.cpp 硬编码 /tmp/（E002 只读）、test_recovery.sh 的 mktemp -t recoveryXXXX 模板缺 XXXXXX → 均改为 TMPDIR 下可写路径"

