# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: aes-stream/20260924
homepage: "https://github.com/jedisct1/aes-stream"

# 上游无任何测试入口（源码树仅 src/aes-stream.c + src/aes-stream.h，
# 无 Makefile/CMakeLists/configure/meson/tests/脚本），见 notes.md 枚举台账
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，含 KAT/确定性/非全零/key-erasure 断言）
test_package_tests:
  - file: test.c
    description: "消费者测试：固定 seed 已知答案 + 确定性 + 非全零 + key-erasure 后继续"
    command: "./test_aes-stream"

# 测试断言总数（4 组断言块）
assertion_count: 4
