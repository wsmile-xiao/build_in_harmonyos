package: "allegro4.4/4.4.3.1.1"
homepage: "https://liballeg.org/"

# The upstream CMake project exposes sample/test programs but does not register
# them with CTest. The recipe disables those device-bound programs for the
# headless core package and validates the installed public API below.
upstream_test_in_build: false
upstream_tests: []

test_package_tests:
  - id: "core-api-contract"
    source: "core_contract.c"
    command: "allegro_core_contract"
    description: >-
      Initialize the SYSTEM_NONE backend, round-trip a 32-bit color through
      the installed Allegro API, emit a diagnostic, and shut down cleanly.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false
  upstream_examples_counted_as_tests: false

test_case_count: 1
assertion_count: 4
