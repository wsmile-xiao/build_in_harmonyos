# test_package/MANIFEST.yml — astronomy 2.1.9
# CI L0e requires this file to exist.

package: astronomy/2.1.9
homepage: "https://github.com/cosinekitty/astronomy"

# 上游 C 测试：generate/ctest.c（43 注册项，42 实例化）+ demo/c/demotest（11 黄金用例）+ gravsim
# 详见 reports/test-report.md 双口径台账
upstream_check_command: "ctest all"
upstream_test_in_build: false
upstream_test_command: "generate/ctest.c -> ctest all (54/55, configured 54/54)"

upstream_tests:
  - name: ctest
    file: generate/ctest.c
    description: "42/42 registered unit tests passed (43 declared, map gated by PERFORMANCE_TESTS=0)"
  - name: demotest
    file: demo/c/demotest
    description: "11/11 golden-output demos passed"
  - name: gravsim
    file: generate/gravsim/gravsim_test.c
    description: "Pluto orbit integration score 0.058326 arcmin (pass)"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package.c
    description: "Compiles + links installed libastronomy.a via public astronomy.h; verifies Earth heliocentric distance ~1 AU and BodyName"
    command: "conan create 内 test_package 阶段自动编译运行"

# Approximate assertion count (ELF check + distance range + status + body name)
assertion_count: 4
