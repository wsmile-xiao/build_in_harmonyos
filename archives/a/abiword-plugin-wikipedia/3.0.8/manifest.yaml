# 版本级 manifest — abiword-plugin-wikipedia 3.0.8
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.8"

# 软件名
software: "abiword-plugin-wikipedia"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-14"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GNOME GitLab AbiWord release-3.0.8）
  url: "https://gitlab.gnome.org/World/AbiWord/-/archive/release-3.0.8/AbiWord-release-3.0.8.tar.gz"

  # 源码校验和
  sha256: "7c490e46f0a6143f84d5c7e3fed246f34486ad70cd55f162c792827607cd7e9a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（minimal configure.ac：无 --enable/--disable 选项）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # dependency-free: AbiWord 运行时 API 由 compat/ shim 提供
  dependencies: []

  # 编译器（OHOS SDK，来自 conan profile）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（仅修改文件；compat/tests 走 export_sources）
patches_applied:
  - "patches/0001-Makefile.am.patch"
  - "patches/0002-configure.ac.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libtoolize 硬编码 SED 绝对路径不存在时，aux-dir 启发式向上走目录，把 ltmain.sh 放到父目录，automake 报 'required file ./ltmain.sh not found'；需在 autoreconf 前设 SED/AUTOCONF/AUTOHEADER/AUTOM4TE（E324 草稿）"
  - "toybox patch --dry-run 对 new-file 补丁会真实创建文件（E258 草稿），新增源码必须走 export_sources，补丁只保留修改文件"
  - "config.status 内 umask 077 在 HMDFS 上建 0700 临时目录不可写（E129/E114），生成 configure 后需去掉 umask 077"
  - "make 并行 jobserver FIFO 在鸿蒙被 SELinux 禁止（E074），必须 -j1"
  - "AbiWord 核心未发布到 OHOS 制品仓，用 compat shim 使插件 dependency-free；wikipedia 插件无 libgsf 引用，不需要 gsf shim"
  - "AbiWord wikipedia 插件仅依赖 XAP_App/XAP_Frame/FV_View/EV_EditMethod/XAP_Menu_Factory/UT_* 运行时 API，shim 面小（18 头文件 + abiword_shim.cpp）"

patch_generation:
  method: manual-diff (orig vs work, a/b labels)
  source_orig_dir: /storage/Users/currentUser/tmp/builds/abiword-plugin-wikipedia-3.0.8.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/abiword-plugin-wikipedia-3.0.8.work
  patches_count: 2

patch_classification:
  - file: 0001-Makefile.am.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-configure.ac.patch
    type: auto
    platform_only: True
    guard: 'pending'
