# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# ⚠️ 如实声明测试来源：上游 AbiWord 3.0.8 wikipedia 插件【无任何官方测试】
# （plugins/wikipedia/ 下仅 xp/AbiWikipedia.cpp + Makefile.am/plugin.m4，
#   全树无 tests 目录）。
# 本包测试均为 OHOS 适配自研（见下方 adapted_tests / test_package_tests）。

package: abiword-plugin-wikipedia/3.0.8
homepage: "https://www.abisource.com/"

# 上游官方测试：无（已核实：orig 纯净上游树无 tests 目录，
# plugins/wikipedia 及全部插件均无官方测试程序）
upstream_official_tests: []

# 构建阶段执行的测试命令（make check，见 conanfile.py build()）
# 注意：该 make check 执行的是【适配自研】测试 tests/test_wikipedia_plugin.cpp，
# 由 minimal Makefile.am 的 TESTS 引入，不是上游官方测试。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 适配补全测试（自研，非上游）：端到端驱动插件模块
# （dlopen → register → EditMethod 容器含 Wikipedia_invoke → 菜单标签
#  Wi&ki Encyclopedia → invoke 驱动 openURL → supports_version=1 → unregister 清理）
adapted_tests:
  - file: tests/test_wikipedia_plugin.cpp
    origin: ohos-adaptation (self-authored, based on plugin ABI xap_Module.h/xap_App.h/ev_EditMethod.h/xap_Menu_Layouts.h)
    description: "端到端插件测试：dlopen 插件模块 → abi_plugin_register → EV_EditMethodContainer 含 'Wikipedia_invoke' → XAP_Menu_Factory 含 'Wi&ki Encyclopedia' 标签且 ActionSet 绑定该方法 → 选中词 invoke 驱动 openURL(含 search=war&go=Go) → abi_plugin_supports_version=1 → unregister 后 EditMethod/菜单标签已移除 (36 项断言)"
    command: "./test_wikipedia_plugin"

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: run_test.cpp
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：dlopen 安装的插件模块，驱动 abi_plugin_supports_version/register/unregister，校验 XAP_ModuleInfo"
    command: "./run_test <path-to-libabiword-plugin-wikipedia.so>"

# 测试断言总数 (实际统计：make check 36 项 CHECK 断言 + test_package 8 项，全部为适配自研断言)
assertion_count: 44
