software: apg
# 软件级 manifest 模板
# 文件位置: archives/a/apg/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: "apg"

# 显示名称
display_name: "Automated Password Generator"

# 描述
description: "Tool for generating random passwords with configurable rules and algorithms"

# 主页
homepage: "https://github.com/wilx/apg"

# 许可证
license: "BSD-style"

# 分类
# utils | dev | system | network | security | multimedia | graphics | science
category: "security"

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "2.2.3"
    status: "built"
    date: "2026-06-18"

# 最新版本
latest_version: "2.2.3"
latest_stable: "2.2.3"

# ============================================================
# 软件元数据
# ============================================================

# 标签
tags:
  - "password"
  - "generator"
  - "security"
  - "utility"

# 二进制列表
binaries:
  - "apg"
  - "apgbfm"

# 依赖（编译时）
build_dependencies: []

# 运行时依赖
runtime_dependencies: []

# ============================================================
# 已知问题
# ============================================================

known_issues:
  - "HarmonyOS requires getpass() compatibility implementation"
  - "No automated test suite"
  - "Makefile-based build (no configure script)"