package: avahi-tools/0.9_rc5
homepage: "https://github.com/avahi/avahi"

upstream_check_command: "make -C avahi-common check"
upstream_test_in_build: true
upstream_test_command: "make -C avahi-common check"

upstream_tests:
  - file: strlst-test.c
    source: avahi-0.9-rc5/avahi-common/strlst-test.c
    description: "AvahiStringList TXT 记录编码/解码往返与边界校验"
    command: "./strlst-test"
  - file: domain-test.c
    source: avahi-0.9-rc5/avahi-common/domain-test.c
    description: "DNS 域名规范化、转义与通配符匹配校验"
    command: "./domain-test"
  - file: alternative-test.c
    source: avahi-0.9-rc5/avahi-common/alternative-test.c
    description: "主机名冲突时替代名（name-2）生成规则校验"
    command: "./alternative-test"
  - file: timeval-test.c
    source: avahi-0.9-rc5/avahi-common/timeval-test.c
    description: "timeval 比较与运算校验"
    command: "./timeval-test"
  - file: watch-test.c
    source: avahi-0.9-rc5/avahi-common/watch-test.c
    description: "AvahiSimplePoll watch/timeout 调度校验（单线程）"
    command: "./watch-test"
  - file: watch-test.c
    source: avahi-0.9-rc5/avahi-common/watch-test.c (thread-watch.c, -DUSE_THREAD)
    description: "AvahiThreadedPoll 线程模式 watch/timeout 调度校验"
    command: "./watch-test-thread"
  - file: utf8-test.c
    source: avahi-0.9-rc5/avahi-common/utf8-test.c
    description: "UTF-8 合法性校验函数测试"
    command: "./utf8-test"

upstream_tests_exist: true
upstream_test_audit:
  - path: "avahi-utils/Makefile.am"
    finding: "包主目录只声明 bin_PROGRAMS（HAVE_DBUS 下 4 个工具），未定义任何 TESTS 目标"
  - path: "avahi-common/Makefile.am"
    finding: "ENABLE_TESTS 下 TESTS 注册 7 个离线单元测试，已全量接入并在真机执行"
  - path: "avahi-client/Makefile.am"
    finding: "ENABLE_TESTS 下构建 client-test/srv-test/xdg-config-test/rr-test/check-nss-test 共 5 个 noinst 程序，但上游未将其注册进 TESTS；其语义需要运行中的 avahi-daemon 与 D-Bus system bus，无法离线执行，不计入通过率"
  - path: "examples/, tests/, avahi-core/, avahi-daemon/, avahi-compat-howl/, avahi-libevent/, avahi-glib/"
    finding: "同源码树其他子目录的测试不属于本拆包构建范围（本包只构建 avahi-common/avahi-client/avahi-utils），不接入"

test_package_tests:
  - file: test_avahi_tools.sh
    description: "对包内 4 个工具二进制执行 --help/--version 与参数校验共 10 条断言，输出 discovered/passed 计数"
    command: "sh test_avahi_tools.sh <pkg>/bin <result_file>"

assertion_count: 10
