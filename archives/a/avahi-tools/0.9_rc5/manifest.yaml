software: avahi-tools
version: "0.9_rc5"
status: built
build_date: "2026-08-26"
build_system: autotools

source:
  url: "https://github.com/avahi/avahi/archive/refs/tags/v0.9-rc5.tar.gz"
  sha256: "5b0a9d88110b0fc8aaafc5cc0a26e83e7d2a4aca3a36bc27c9b626db7ead27b0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-distro=none --with-xml=none --enable-tests"
    - "--disable-nls --disable-introspection --disable-glib --disable-gobject"
    - "--disable-compat-libdns_sd --disable-compat-howl"
    - "--disable-libevent --disable-qt3 --disable-qt4 --disable-qt5"
    - "--disable-gtk --disable-gtk3 --disable-python --disable-mono"
    - "--disable-autoipd --disable-doxygen-doc --disable-manpages"
    - "--disable-xmltoman --disable-gdbm --disable-libdaemon"
    - "--disable-libsystemd --with-systemdsystemunitdir=no"
    - "--disable-shared --enable-static"
  dependencies:
    - "dbus/1.14.10"
    - "expat/2.8.2.1 (override)"
  tool_requires:
    - "automake/1.18"
    - "libtool/2.5.4"
    - "gettext/0.22.5.1"

patches_applied: []

# 上游测试接入范围（真机实测数字由 HMBS 预检 evidence 回填，不在此预填）：
# 接入 avahi-common 的 7 个 automake TESTS（离线单元测试，无需 avahi-daemon）。
# avahi-utils 自身无 TESTS；avahi-client 的 5 个 noinst 测试程序未注册 TESTS
# 且需要运行中的 daemon/D-Bus 总线（详见 test_package/MANIFEST.yml audit）。
upstream_test_plan:
  command: "make -C avahi-common check"
  expected_discovered: 7

consumer_test_plan:
  harness: "test_package/test_avahi_tools.sh"
  assertions: 10
  scope: "4 个工具二进制的 --help/--version 退出码与输出、非法选项与缺参失败路径"

knowledge_ref:
  - "E337 (draft): OHOS 上 Autotools bootstrap 工具闭包（任务级启动器 + 数据路径重定位）"
  - "E011/E112/E118: AS_TMPDIR umask 077 临时目录 HMFS 拒写 → 文本 patch 生成的 configure"
  - "E182/E188: HMBS install shim 批量安装限制 → 应用包手动收集产物规避"

knowledge_gained:
  - "同源拆包第三例：avahi-tools 复用 avahi-glib/avahi-compat-libdns_sd 对同一 tag v0.9-rc5 归档的全部 OHOS 引导与 configure 规避方案，一次通过静态自检"
  - "应用型拆包不跑 make install：按 ELF 魔数从 libtool 输出（.libs/<name> 或顶层 wrapper）收集程序二进制，别名优先符号链接、失败退化为独立副本"
