# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: astroterm/1.0.9
homepage: "https://github.com/da-luce/astroterm"

# 上游测试命令 (meson 驱动 Unity 测试；真机通过 vendored meson 执行)
upstream_check_command: "vendored meson test --list (conanfile.py build() 内真机执行)"

# conanfile.py build() 方法中已集成上游测试 (vendored meson test, 真机执行)
upstream_test_in_build: true
upstream_test_command: "vendored meson test -v -C <build_folder> --timeout-multiplier=16 --no-rebuild --print-errorlogs"

# 上游 Unity 测试 (7 个测试可执行文件, test/meson.build)
upstream_tests:
  - file: test/coord_test.c
    source: astroterm-1.0.9/test/coord_test.c
    description: "坐标投影与极坐标换算 (12 断言)"
    command: "./coord_test"
  - file: test/astro_test.c
    source: astroterm-1.0.9/test/astro_test.c
    description: "天文计算/行星月球位置 (110 断言)"
    command: "./astro_test"
  - file: test/city_test.c
    source: astroterm-1.0.9/test/city_test.c
    description: "城市数据库查询 (27 断言)"
    command: "./city_test"
  - file: test/bit_test.c
    source: astroterm-1.0.9/test/bit_test.c
    description: "位运算工具 (17 断言)"
    command: "./bit_test"
  - file: test/core_test.c
    source: astroterm-1.0.9/test/core_test.c
    description: "核心数据解析与星表生成 (74 断言)"
    command: "./core_test"
  - file: test/stopwatch_test.c
    source: astroterm-1.0.9/test/stopwatch_test.c
    description: "计时器逻辑 (13 断言)"
    command: "./stopwatch_test"
  - file: test/drawing_test.c
    source: astroterm-1.0.9/test/drawing_test.c
    description: "终端 ASCII 绘制 (8 断言)"
    command: "./drawing_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "astroterm --version / --help 可执行验证 (2 检查)"
    command: "./test_astroterm"

# 测试断言总数 (上游 261 + test_package 2)
assertion_count: 263
