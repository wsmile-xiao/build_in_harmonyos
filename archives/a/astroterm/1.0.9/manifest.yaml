# 版本级 manifest — astroterm 1.0.9
version: "1.0.9"
software: "astroterm"
status: built
build_date: "2026-08-15"
build_system: meson

source:
  url: "https://github.com/da-luce/astroterm/archive/refs/tags/v1.0.9.tar.gz"
  sha256: "d96d70c644b258ed0adc3a700e6af122659ecabf3eed60d7cfb6810b5068f3eb"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "--prefix=/ (vendored meson setup, 配合 --destdir 安装)"
  dependencies:
    - "argtable3/3.3.1"
    - "ncurses/6.5"
    - "meson/1.11.2 (vendored 源码, source() 下载至 meson-vendor/, 无远端依赖)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-add-stddef.h-before-string.h.patch"
  - "0002-fix-embed-sh-for-toybox.patch"

testing:
  upstream_tests:
    - name: "coord"
      status: "integrated"
      command: "meson test (build() 内真机执行)"
    - name: "astro"
      status: "integrated"
      command: "meson test (build() 内真机执行)"
    - name: "city"
      status: "integrated"
      command: "meson test (build() 内真机执行)"
    - name: "bit"
      status: "integrated"
      command: "meson test (build() 内真机执行)"
    - name: "core"
      status: "integrated"
      command: "meson test (build() 内真机执行)"
    - name: "stopwatch"
      status: "integrated"
      command: "meson test (build() 内真机执行)"
    - name: "drawing"
      status: "integrated"
      command: "meson test (build() 内真机执行)"
  test_package_tests:
    - name: "astroterm --version"
      test_command: "astroterm --version"
      assertion_count: 1
    - name: "astroterm --help"
      test_command: "astroterm --help"
      assertion_count: 1

knowledge_gained:
  - "OHOS SDK fortify/string.h requires size_t to be defined before inclusion"
  - "Need to add #include <stddef.h> before <string.h> in headers"
  - "toybox xxd doesn't support -i option, need Python replacement in embed.sh"
  - "Upstream meson test suite: 7 Unity test executables (coord/astro/city/bit/core/stopwatch/drawing), 261 assertions"
