sources:
  # 真机 2026-08-18 实测 github.com 直连超时；复用 ci/conan/build_and_test.sh
  # 的 GitHub 镜像映射：gh-proxy.com 前置、官方 URL 兜底（sha256 不变）。
  url:
    - "https://gh-proxy.com/https://github.com/da-luce/astroterm/archive/refs/tags/v1.0.9.tar.gz"
    - "https://github.com/da-luce/astroterm/archive/refs/tags/v1.0.9.tar.gz"
  sha256: "d96d70c644b258ed0adc3a700e6af122659ecabf3eed60d7cfb6810b5068f3eb"

bsc5_source:
  url: "http://tdc-www.harvard.edu/catalogs/BSC5"
  sha256: "e471d02eaf4eecb61c12f879a1cb6432ba9d7b68a9a8c5654a1eb42a0c8cc340"

argtable3_source:
  # 真机 2026-08-18 预检失败点：github.com releases 下载超时，改用镜像优先。
  url:
    - "https://gh-proxy.com/https://github.com/argtable/argtable3/releases/download/v3.3.1/argtable-v3.3.1.tar.gz"
    - "https://github.com/argtable/argtable3/releases/download/v3.3.1/argtable-v3.3.1.tar.gz"
  sha256: "c08bca4b88ddb9234726b75455b3b1670d7c864d8daf198eaa7a3b4d41addf2c"

ncurses_ohos:
  url: "https://gitcode.com/OpenHarmonyPCDeveloper/cmd-pkgs/releases/download/pkgs/ncurses-6.4-ohos-aarch64.tar.gz"
  sha256: "e746bbe540e68c216493a00430e9047cc83f3d98f66fbe65f9e4cf1c8eb6cde8"

# vendored meson 构建工具源码：ohpcd 远端不存在 meson/1.11.0 工具包
# （连续多轮 conan create 报 "Unable to find 'meson/1.11.0' in remotes"），
# 真机 HMBS_PYTHON3 的 site-packages 亦无 mesonbuild。改用 libdvdnav/7.0.0
# 已验证的 vendored meson 方案：下载 meson 1.11.2 官方源码解压到
# source_folder/meson-vendor/，build() 时经 python3 进程内 sys.path 注入调用。
meson_source:
  # 同 GitHub 镜像映射：gh-proxy.com 前置、官方 URL 兜底（sha256 不变）。
  url:
    - "https://gh-proxy.com/https://github.com/mesonbuild/meson/releases/download/1.11.2/meson-1.11.2.tar.gz"
    - "https://github.com/mesonbuild/meson/releases/download/1.11.2/meson-1.11.2.tar.gz"
  sha256: "698feae069cef3ecd4d7aaf281d7df359bdfcf555a9a1564383d3b913fa8a736"

patches:
  - patch_file: "patches/0001-add-stddef.h-before-string.h.patch"
    patch_description: "Add stddef.h before string.h for OHOS size_t declarations"
    patch_type: "portability"
  - patch_file: "patches/0002-fix-embed-sh-for-toybox.patch"
    patch_description: "Use embed.py when toybox xxd does not support -i"
    patch_type: "portability"
