package: acpi-override/0.1+nmu2
checks:
  - name: hook-installed
    command: test -f "$ACPI_OVERRIDE_HOOK"
    purpose: Verify the initramfs hook is present in the package.
  - name: prereqs
    command: "$ACPI_OVERRIDE_HOOK prereqs"
    purpose: Verify the initramfs hook dependency phase exits successfully.
  - name: functional-hook
    command: sh test_hook.sh
    purpose: >-
      Execute the packaged hook with deterministic initramfs and cpio test
      doubles; assert an ACPI table is staged under kernel/firmware/acpi and
      an early-initramfs image is produced.
  - name: device-integration
    command: "$ACPI_OVERRIDE_HOOK"
    purpose: Run full hook integration on a device with initramfs-tools-core and cpio.
    status: pending-device
