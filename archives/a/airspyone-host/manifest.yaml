software: airspyone-host
display: "AirSpy Host"
description: "AirSpy user-mode driver and associated tools for Software Defined Radio"
category: system
homepage: "https://github.com/airspy/airspyone_host"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 在 HarmonyOS 上不设置 UNIX 变量，需将 if(${UNIX}) 改为 if(NOT WIN32)"
    - "CMAKE_SYSTEM_NAME=Linux 可解决 CMake 不识别 HarmonyOS 的问题"
    - "不要设置 LD_LIBRARY_PATH 包含 ~/usr/local/lib，会导致 lld 链接器找不到 libxml2.so.16"
  common_dependencies:
    - libusb

versions:
  "1.0.10":
    status: built
    build_date: "2026-06-29"
    conan_ref: "airspyone-host/1.0.10"
