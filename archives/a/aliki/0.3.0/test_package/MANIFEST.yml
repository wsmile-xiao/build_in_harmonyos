package: aliki/0.3.0
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"

upstream_check_command: "make -C source check"
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  The 0.3.0 tarball ships AUTHORS, COPYING, INSTALL, README, doc/ and
  source/: the source/Makefile defines only all, install, uninstall and clean
  targets. There is no test/check target and no test directory, so `make -C
  source check` fails with "No rule to make target 'check'". The tools are
  exercised instead by the packaged smoke test below.

test_package_tests:
  - file: test_aliki.sh
    description: >-
      Runs the two packaged tools against the staged runtime shared-library
      closure: aliki -h must print the "Aliki-0.3.0" version banner, and
      aliki-rt with no argument must return 1 (missing shared-memory
      argument) rather than 127 (loader failure). On OHOS the closure is
      copied and ELF-signed, mirroring the libxft/clxclient OHOS pattern.
    command: "test_aliki.sh"

test_case_count: 2
assertion_count: 3
