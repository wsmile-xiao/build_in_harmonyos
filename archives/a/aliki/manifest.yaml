software: aliki
display: "aliki"
description: "Impulse response measurement tool (sine sweep + deconvolution)"
category: system
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"
license: "GPL-3.0-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "Remove -march=native and the hardcoded /usr/include/freetype2 and /usr/X11R6 paths; include/lib paths come from the Conan profile and dependencies."
    - "Use $(CXX) from the Conan profile (no g++ on CI) and parameterize INSTALL for OHOS."
    - "Add a $(PCONFCFL) slot so dependency include paths can be injected without overriding -DVERSION/-DPREFIX."
    - "Both tools are GUI/real-time: packaged smoke test asserts the runtime shared-library closure loads and the tools reach their normal early-exit path."
  common_dependencies:
    - clxclient
    - clthreads
    - libsndfile
    - fftw3f
    - libxft
    - libx11
    - xorgproto
    - zita-alsa-pcmi
    - jack
    - alsa-lib

versions:
  "0.3.0":
    status: built
    build_date: "2026-08-31"
