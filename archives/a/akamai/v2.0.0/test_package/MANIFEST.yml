# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: akamai/v2.0.0
homepage: "https://github.com/akamai/cli"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "go test ./..."

# 上游实际运行的测试程序
upstream_tests:
  - file: cli/app/run_test.go
    source: akamai-v2.0.0/cli/app/run_test.go
    description: "CLI app run logic tests"
    command: "go test ./cli/app/"
  - file: pkg/app/cli_test.go
    source: akamai-v2.0.0/pkg/app/cli_test.go
    description: "CLI application tests"
    command: "go test ./pkg/app/"
  - file: pkg/commands/command_test.go
    source: akamai-v2.0.0/pkg/commands/command_test.go
    description: "Command implementation tests"
    command: "go test ./pkg/commands/"
  - file: pkg/config/config_test.go
    source: akamai-v2.0.0/pkg/config/config_test.go
    description: "Configuration tests"
    command: "go test ./pkg/config/"
  - file: pkg/log/log_test.go
    source: akamai-v2.0.0/pkg/log/log_test.go
    description: "Logging tests"
    command: "go test ./pkg/log/"
  - file: pkg/autocomplete/autocomplete_test.go
    source: akamai-v2.0.0/pkg/autocomplete/autocomplete_test.go
    description: "Autocomplete tests"
    command: "go test ./pkg/autocomplete/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify akamai --version"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 120
