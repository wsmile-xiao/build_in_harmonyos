# 软件级 manifest
# 文件位置: archives/a/akamai/manifest.yaml

software: akamai
display: "Akamai CLI"
description: "Akamai CLI - command-line interface for Akamai services"
category: utility
homepage: "https://github.com/akamai/cli"
license: Apache-2.0

build_system: go

ohos_adaptation:
  key_points:
    - "Go cross-compile with CGO_ENABLED=0 GOOS=linux GOARCH=arm64"
    - "Static binary (no buildmode=pie, PIE caused segfaults on OHOS HMDFS)"
    - "GOPROXY=goproxy.cn for reliable module downloads"
    - "ELF signing required for OHOS binaries"
  common_dependencies: []

versions:
  "v2.0.0":
    status: built
    build_date: 2026-08-05
