package: anubis/4.3
homepage: "https://www.gnu.org/software/anubis/"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - file: tests/parse.at
    source: anubis-4.3/tests/parse.at
    description: "configuration parser"
    command: "make -j1 check"
  - file: tests/empty.at
    source: anubis-4.3/tests/empty.at
    description: "send a message unchanged"
    command: "make -j1 check"
  - file: tests/mult.at
    source: anubis-4.3/tests/mult.at
    description: "send multiple messages unchanged"
    command: "make -j1 check"
  - file: tests/hadd00.at
    source: anubis-4.3/tests/hadd00.at
    description: "add a header field"
    command: "make -j1 check"
  - file: tests/hadd01.at
    source: anubis-4.3/tests/hadd01.at
    description: "add a header to several messages"
    command: "make -j1 check"
  - file: tests/hadd02.at
    source: anubis-4.3/tests/hadd02.at
    description: "add a header to selected messages"
    command: "make -j1 check"
  - file: tests/badd.at
    source: anubis-4.3/tests/badd.at
    description: "append text to the message body"
    command: "make -j1 check"
  - file: tests/fadd.at
    source: anubis-4.3/tests/fadd.at
    description: "add a text file to the message body"
    command: "make -j1 check"
  - file: tests/cond.at
    source: anubis-4.3/tests/cond.at
    description: "conditional statements"
    command: "make -j1 check"
  - file: tests/hmod.at
    source: anubis-4.3/tests/hmod.at
    description: "modify the message header"
    command: "make -j1 check"
  - file: tests/bmod.at
    source: anubis-4.3/tests/bmod.at
    description: "modify the message body"
    command: "make -j1 check"
  - file: tests/hdel00.at
    source: anubis-4.3/tests/hdel00.at
    description: "remove a message header"
    command: "make -j1 check"
  - file: tests/hdel01.at
    source: anubis-4.3/tests/hdel01.at
    description: "remove headers from all messages"
    command: "make -j1 check"
  - file: tests/hdel02.at
    source: anubis-4.3/tests/hdel02.at
    description: "remove headers from selected messages"
    command: "make -j1 check"
  - file: tests/hdel03.at
    source: anubis-4.3/tests/hdel03.at
    description: "remove all headers"
    command: "make -j1 check"
  - file: tests/trigger.at
    source: anubis-4.3/tests/trigger.at
    description: "trigger mechanism"
    command: "make -j1 check"
  - file: tests/gpgcrypt.at
    source: anubis-4.3/tests/gpgcrypt.at
    description: "GPG encryption (feature-gated)"
    command: "make -j1 check"
  - file: tests/gpgsign.at
    source: anubis-4.3/tests/gpgsign.at
    description: "GPG signing (feature-gated)"
    command: "make -j1 check"
  - file: tests/gpgse.at
    source: anubis-4.3/tests/gpgse.at
    description: "GPG sign and encrypt (feature-gated)"
    command: "make -j1 check"
  - file: tests/mime00.at
    source: anubis-4.3/tests/mime00.at
    description: "pass a MIME encoded message"
    command: "make -j1 check"
  - file: tests/mime01.at
    source: anubis-4.3/tests/mime01.at
    description: "pass a MIME encoded message with full-body read"
    command: "make -j1 check"
  - file: tests/tlsoneway.at
    source: anubis-4.3/tests/tlsoneway.at
    description: "one-way TLS encryption (feature-gated)"
    command: "make -j1 check"
  - file: tests/rot-13.at
    source: anubis-4.3/tests/rot-13.at
    description: "ROT-13 support (Guile feature-gated)"
    command: "make -j1 check"
  - file: tests/remailer.at
    source: anubis-4.3/tests/remailer.at
    description: "remailer support (Guile feature-gated)"
    command: "make -j1 check"
  - file: tests/anubisusr.at
    source: anubis-4.3/tests/anubisusr.at
    description: "configuration upload (TLS feature-gated)"
    command: "make -j1 check"
  - file: tests/paolo.at
    source: anubis-4.3/tests/paolo.at
    description: "remove substrings from the body"
    command: "make -j1 check"
  - file: tests/no-backref.at
    source: anubis-4.3/tests/no-backref.at
    description: "regular expressions without reference groups"
    command: "make -j1 check"

test_package_tests:
  - file: test.c
    description: "consumer invokes anubis --version and --show-config-options"
    command: "./test_anubis <installed-anubis-path>"

assertion_count: 2
