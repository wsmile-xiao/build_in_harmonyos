knowledge_gained:
- config.guess/config.sub from 2008 cannot recognize ohos platform, need to replace
  with newer version (E007)
- aumix configure checks for GTK+ 2.0 via pkg-config; use --without-gtk to skip
- aumix header files (curses.h, common.h, interactive.h) define global variables without
  extern, causing duplicate symbol errors with clang/LLD; fix with -fcommon flag
- 'HMDFS filesystem sets SGID bit on directories created with umask 077, preventing
  file creation inside; workaround: change umask to 022 in config.status'
- autoreconf -fi needed to regenerate configure script with newer autoconf for proper
  platform detection
