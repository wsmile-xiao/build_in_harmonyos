software: aumix
display: "aumix"
description: "Ncurses-based audio mixer for OSS sound systems"
category: utility
homepage: "http://www.jpj.net/~trevor/aumix.html"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub too old (2008), replaced with newer version supporting ohos platform (E007)"
    - "configure fails on GTK+ detection, use --without-gtk to build ncurses-only interface"
    - "Duplicate symbol errors with clang/LLD, need -fcommon flag for old-style global definitions in headers"
    - "config.status umask 077 creates directories with SGID bit on HMDFS, patched to umask 022"
    - "autoreconf -fi required to regenerate configure with newer autoconf 2.72"
  common_dependencies:
    - "ncurses (pre-installed at ~/usr/local)"

versions:
  "2.9.1":
    status: built
    build_date: "2026-06-22"
