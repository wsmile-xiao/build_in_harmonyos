# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OCaml/dune 项目在 HMDFS 上必须使用 monorepo workspace 方案（所有依赖源码同目录）绕过软链接问题"
  - "dune bootstrap 需 patch: threads→threads.posix, 添加 unix 到 external_libraries"
  - "dune env (flags ...) 在 bootstrap 编译的 dune 中可能不生效，需用 per-library ocamlc_flags"
  - "alcotest 子包 (async/lwt/mirage/js) 依赖不可满足，只编译核心包"
