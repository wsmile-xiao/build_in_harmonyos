package: alcotest/1.9.1
homepage: "https://github.com/mirage/alcotest"

upstream_check_command: "dune runtest"
upstream_test_in_build: true
upstream_test_command: "dune runtest --root ."

upstream_tests:
  - name: e2e-passing
    command: "test/e2e/alcotest/passing/*.exe"
    expected: "23 passing tests (22 direct + 1 with CLI args)"
  - name: e2e-failing
    command: "test/e2e/alcotest/failing/*.exe"
    expected: "14 tests exit non-zero (expected failures)"
  - name: examples
    command: "examples/simple.exe && examples/floats.exe"
    expected: "7 tests pass (4+3)"

test_package_tests:
  - file: test_alcotest.sh
    description: "Verify 12 key OCaml library artifacts (.cma/.cmxa/.a/.cmi/META/stubs)"
    command: "bash test_alcotest.sh <package_folder>"

assertion_count: 12
