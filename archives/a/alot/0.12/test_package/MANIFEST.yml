package: alot/0.12
homepage: "https://github.com/pazz/alot"

upstream_check_command: "python3 -m pytest tests/ -q"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

external_integration_note: "alot is a pure Python terminal MUA. Upstream pytest suite (22 test files) requires a notmuch2 database environment (libnotmuch.so) plus mail corpus; on OHOS the notmuch2/notmuch dependency chain is now adapted (PR !5342/!5346) but python-magic (libmagic.so dynamic lib) and gpg (python-gpgme bindings) are still environment-limited, so the full pytest suite is recorded runnable=0. The --help smoke test verifies the wrapper is installed and functional."

test_package_tests:
  - file: test_alot.py
    description: "Run bin/alot --help to verify the wrapper is installed and functional"
    command: "bin/alot --help"

assertion_count: 1
