# alot 0.12 适配清单
# 纯 Python 终端邮件客户端（pyproject.toml + setuptools），无 C/C++ 编译。
# 核心依赖 notmuch2（Python 绑定 libnotmuch）、urwid、urwidtrees、twisted、
# python-magic、configobj、gpg（python-gpgme）。
# CI worker 网络受限，源码 tar 随 export_sources 提供（参照 lv 先例）。

version: "0.12"
status: built

source:
  url: "https://github.com/pazz/alot/archive/refs/tags/v0.12.tar.gz"
  sha256: ""
  tar_format: tar.gz
  bundled: "alot-0.12-src.tar.gz（CI worker 无法稳定访问 GitHub，配方内自包含）"

build:
  system: custom
  notes: "纯 Python，pip wheel --no-deps 打包提取到 site-packages + bin/alot wrapper（check-jsonschema 先例）；依赖 notmuch/0.38.3 + notmuch2/0.34.3（conan 依赖，随本仓库 PR 适配）+ gpgme/file（conan 依赖）+ urwid/urwidtrees/twisted/configobj/python-magic/gpg（pip 依赖）"

patches_applied: []

test:
  upstream_cases: 22
  upstream_suite: "pytest tests/（22 个测试文件：addressbook/commands/db/settings/utils/widgets + test_account/test_completion/test_crypto/test_helper）"
  runnable: 0
  runnable_note: "alot 测试需 notmuch2 数据库环境（libnotmuch.so + notmuch 数据库），OHOS 构建环境 notmuch 无 remote 制品、系统无 libnotmuch.so，notmuch 自包含构建链（gmime→glib→pcre2）在本地验证受阻——待 notmuch 制品就绪后可运行 pytest"
  pass_rate: "0/22（notmuch2 依赖 libnotmuch.so，环境缺失）"
  consumer_test: "test_package 验证 bin/alot 安装 + 模块导入（import alot）+ wrapper 可执行"

knowledge_gained:
  - "alot 是纯 Python 终端 MUA，核心依赖 notmuch2（Python cffi 绑定 libnotmuch.so）"
  - "项目内 notmuch 0.38.3 为 built 状态但 remote 无制品、系统无 libnotmuch.so → notmuch 需自包含构建或先发布制品"
  - "notmuch 自包含构建链：xapian-core（remote 有 1.4.26 制品）+ gmime（remote 无制品，需自包含构建，依赖 glib remote 有）+ talloc（remote 有）+ zlib"
  - "gmime 构建依赖 glib 的 pkg-config 组件（gobject/gio/gmodule/gthread/libffi/pcre2），conan pcre2 制品 .la libdir='//lib' 损坏需修复"
  - "CI worker 无法稳定访问 GitHub，源码用 v0.12 tag tar 打进配方自包含"

knowledge_ref:
  - "E318-draft-python-cffi-binding-gap（路径 B 知识草稿，随本 PR 提交：Python cffi/ctypes 绑定依赖的底层 C 库在 OHOS 无制品时的判定与处置流程——查制品仓→查系统库→评估自包含链→无法适配走路径 B 如实记录 runnable=0）"
