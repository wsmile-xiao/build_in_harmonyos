# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: adplay/1.9
homepage: "https://github.com/adplug/adplay-unix"

# 上游测试命令（CLI 播放器无独立测试框架——0/0 如实；OHOS CI 执行本
# test_package 消费测试：bin/adplay 存在 + --help 真实运行 + 无参数
# 真实运行，L0c 要求 test_package 含测试源文件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: 0

test_package_tests:
  - file: test_adplay.py
    description: "消费测试：验证 bin/adplay 可执行存在 + --help 真实运行（rc=0）+ 无参数真实运行（rc 属预期）"
    command: "python3 test_adplay.py <package_folder>"

assertion_count: 3
