software: adacgi
display: "AdaCGI"
description: "Ada 95 interface to the Common Gateway Interface (CGI)"
category: web
homepage: "http://www.dwheeler.com/adacgi"
license: "LGPL-2.1-or-later"
build_system: gnatmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "AdaCGI 是纯 Ada 95 源码库（CGI + Ustrings 两个单元），无 C/C++ 依赖"
    - "构建工具链为 gcc-ada/9.5.0（GNAT），提供 gnatmake/gnatbind/gnatlink"
    - "下游消费者用 gnatmake -I<adainclude> 现场编译库单元"
    - "生成的可执行文件需用 binary-sign-tool 签名后才能在 OHOS 上运行"
  common_dependencies:
    - "gcc-ada/9.5.0 (build toolchain)"

# 版本索引
versions:
  "1.6":
    status: pending
    build_date: ""
    conan_ref: "adacgi/1.6@ohpcd/stable"
