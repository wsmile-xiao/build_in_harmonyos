package: adacgi/1.6
homepage: "http://www.dwheeler.com/adacgi"

upstream_test_in_build: true
upstream_test_command: "build() compiles the unmodified CGI and Ustrings units with the packaged gcc-ada GNAT toolchain; test_package compiles, signs and executes a nine-assertion downstream consumer"

test_tool_dependencies:
  - "gcc-ada/9.5.0"

test_package_tests:
  - file: test_adacgi.adb
    description: "Downstream Ada consumer covering CGI method parsing, duplicate keys, URL encoding/decoding and HTML escaping"
    command: "gnatmake -q -gnata -O2 -gnat95 -I<adainclude> test_adacgi.adb -o test_adacgi && binary-sign-tool sign ... && REQUEST_METHOD=GET QUERY_STRING='name=HarmonyOS&name=Ada%20CGI' ./test_adacgi"
  - file: verify_adacgi.py
    description: "Run the signed AdaCGI executable with deterministic CGI environment input and require the exact success marker"
    command: "python3 verify_adacgi.py <signed-adacgi-consumer>"

consumer_assertion_count: 9
assertion_count: 9
