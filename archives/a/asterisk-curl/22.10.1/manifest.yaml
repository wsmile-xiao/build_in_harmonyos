# 版本级 manifest — asterisk-curl 22.10.1
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "22.10.1"

# 软件名
software: asterisk-curl

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub codeload tag；downloads.asterisk.org 在 OHOS 沙箱 404）
  url: "https://codeload.github.com/asterisk/asterisk/tar.gz/refs/tags/22.10.1"

  # 源码校验和（sha256，实测）
  sha256: "373c98f4d4a1b923b42def0aee03f4e36aca9d1c244a8eeda646da8a97f89663"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "asterisk-22.10.1"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "libcurl/8.5.0"
    - "libedit/20240808"
    - "libxml2/2.15.3"
    - "ncurses/6.6"
    - "e2fsprogs/1.47.4"
    - "jansson/2.15.1.1"
    - "sqlite3/3.49.1"
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: "package_type=shared-library；Asterisk 全量 autotools 构建，只编译三个 curl 模块（res_curl/func_curl/res_config_curl）；依赖注入私有 prefix + curl-config shim（configure 探测 CURL 用 curl-config）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config.guess.patch"
  - "0002-configure.patch"
  - "0003-include-asterisk-astmm.h.patch"
  - "0004-include-asterisk-utils.h.patch"
  - "0005-menuselect-config.guess.patch"
  - "0006-menuselect-config.sub.patch"
  - "0007-menuselect-configure.patch"
  - "0008-include-asterisk-utils-raii_var-no-auto.patch"

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: medium
  issues: []
  notes: "沿用 asterisk-speex/pgsql 的 OHOS 移植补丁（config.guess/configure/menuselect/astmm/utils）；仅编译 curl 三模块，不依赖 asterisk 主程序"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 0
  failed: 0
  note: |
    上游测试：Asterisk 的 test/ 目录是 C 单元测试（main/ 各模块 test_*.c），
    curl 三模块（res_curl/func_curl/res_config_curl）**无专属上游测试**
    ——rule 1.2 如实声明"上游无测试"（非跳过）。
    本地验证：conan create 通过，三模块 .so（res_curl/func_curl/
    res_config_curl）编译链接成功并打包到 lib/asterisk/modules/。
    适配后：test_package R34 真实产物校验——三模块存在 + ELF shared
    object + 链接 libcurl（1/1 = 100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "asterisk-curl 是 asterisk 的 curl 模块集（res_curl/func_curl/res_config_curl），libcurl 依赖已在 ohpcd（libcurl/8.5.0）；与 asterisk-pgsql 同构——全量 autotools + menuselect 只启目标模块 + 依赖注入私有 prefix"
  - "libcurl/8.5.0 包自带 curl-config 二进制——_ensure_dep_present 已复制到私有 prefix/bin，configure 用 AC_PATH_TOOL CURL_CONFIG 探测（--with-curl 指向 prefix）"
  - "menuselect.makedeps 声明 MENUSELECT_DEPENDS_res_curl=CURL（及 func_curl/res_config_curl），--with-curl 使 configure 通过 AST_EXT_LIB_CHECK([CURL]) 从而 menuselect 启用三个模块"

references:
  - https://www.asterisk.org/
  - https://docs.asterisk.org/Configuration/CLI/
