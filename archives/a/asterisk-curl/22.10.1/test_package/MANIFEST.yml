# test_package/MANIFEST.yml — asterisk-curl 22.10.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: asterisk-curl/22.10.1
homepage: "https://www.asterisk.org/"

# 上游测试：Asterisk 的 C 单元测试在 test/ 目录（main/ 各模块 test_*.c）。
# curl 三模块（res_curl/func_curl/res_config_curl）无专属 .c 测试——
# 上游无对应单测（rule 1.2：如实声明，非跳过）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（如实声明：curl 模块无专属上游测试）
upstream_tests:
  - file: test/
    source: asterisk-22.10.1/test/*.c
    description: "Asterisk 主程序 C 单测（test/），curl 三模块无专属测试（rule 1.2 如实记录）"
    command: ""

# test_package 消费者测试（R34 真实产物校验：三模块存在 + ELF shared object + 链接 libcurl）
test_package_tests:
  - file: test_asterisk_curl.py
    description: "Verifies res_curl.so/func_curl.so/res_config_curl.so exist under lib/asterisk/modules/, are valid aarch64 ELF shared objects, and link libcurl"
    command: "python3 test_asterisk_curl.py"

# 断言总数：5（3 模块存在 + ELF 校验 + libcurl 链接）
assertion_count: 5
