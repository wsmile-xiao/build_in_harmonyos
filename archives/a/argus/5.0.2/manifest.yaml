software: argus
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.0.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gh-proxy.com/https://github.com/openargus/argus/archive/refs/tags/v5.0.2.tar.gz"

  # 源码校验和
  sha256: "1718454ac717fe5f500d00ff608097e3c5483f4e138aa789e67e306feb52bafb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-argus-ArgusEvents.c.patch"
  - "0002-argus-argus.c.patch"
  - "0003-config-config.guess.patch"
  - "0004-config-config.sub.patch"
  - "0005-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "鸿蒙不支持 mkfifo jobserver, make 必须用 -j1"
  - "静态链接 musl libc 中 _exit() 和 syscall() 被拦截, 需用 aarch64 内联汇编 exit_group 绕过"
  - "GNU config.guess/config.sub 不含 HarmonyOS 检测分支, 需替换为支持 OHOS 的版本"
  - "argus make install 不安装头文件和静态库, 需在 Conan package() 中手动复制"
  - "鸿蒙无 Perl 解释器, 需从 package 中移除 Perl/shell 脚本"

