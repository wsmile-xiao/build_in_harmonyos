# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: alex/3.5.4.2
homepage: "https://hackage.haskell.org/package/alex"

# 上游测试命令 (Haskell: 无独立测试套件，上游主要验证为回归测试 tests/ 目录)
upstream_check_command: "cabal test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# alex 上游无 cabal 测试套件声明（tests/ 目录为回归脚本，需先构建 alex 本体）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_alex.sh
    description: "验证 alex 二进制：存在性 + --version 含 3.5.4.2 + 用最小 .x 词法规范实际生成 lexer（功能性验证，--template 指向包内模板）"
    command: "sh test_alex.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 1 存在性 + 1 版本 + 1 功能性 = 3
# （--help 不作断言：OHOS 上 GHC RTS 间歇性挂死，见 test_alex.sh 注释）
assertion_count: 3
