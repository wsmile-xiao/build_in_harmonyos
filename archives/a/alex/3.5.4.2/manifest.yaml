patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "Haskell 工具链（GHC）经 harmonybrew `brew install ghc` 提供（同 aiken/rust 方案）；GHC 9.14.1"
  - "动态链接的 GHC 二进制在 OHOS 运行时缺 libgmp.so.10/libffi.so.8（系统 loader 找不到）→ 必须 configure --enable-executable-static 静态链接"
  - "`runghc Setup.hs copy` 默认剥离符号，被剥的 GHC ELF 在 OHOS 无法执行（EPERM/Permission denied）→ package() 直接复制未剥的 dist/build/alex/alex 二进制"
  - "alex 运行时模板（AlexTemplate.hs/AlexWrappers.hs）按编译期烤入的绝对 datadir 路径查找 → 打包到 share/alex-3.5.4.2/ 并用 --template=DIR 覆盖（test_package 即如此调用）"
  - "alex --help 在 OHOS 上 GHC RTS 间歇性挂死（do_rt_sigsuspend 等信号），test_package 不以 --help 作断言（保留 --version + 功能性 .x 词法生成）"
