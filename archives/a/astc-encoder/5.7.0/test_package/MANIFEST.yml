package: astc-encoder/5.7.0
homepage: "https://github.com/ARM-software/astc-encoder"

upstream_check_command: "cmake -DASTCENC_UNITTEST=ON .. && ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"

upstream_tests:
  - file: Source/UnitTest/test_decode.cpp
    source: astc-encoder-5.7.0/Source/UnitTest/test_decode.cpp
    description: "GoogleTest: ASTC decode correctness tests"
    command: "ctest --output-on-failure -j1"
  - file: Source/UnitTest/test_encode.cpp
    source: astc-encoder-5.7.0/Source/UnitTest/test_encode.cpp
    description: "GoogleTest: ASTC encode correctness tests"
    command: "ctest --output-on-failure -j1"
  - file: Source/UnitTest/test_simd.cpp
    source: astc-encoder-5.7.0/Source/UnitTest/test_simd.cpp
    description: "GoogleTest: SIMD abstraction layer tests"
    command: "ctest --output-on-failure -j1"
  - file: Source/UnitTest/test_softfloat.cpp
    source: astc-encoder-5.7.0/Source/UnitTest/test_softfloat.cpp
    description: "GoogleTest: softfloat implementation tests"
    command: "ctest --output-on-failure -j1"

test_package_tests:
  - file: test_astcenc.cpp
    description: "Consumer test: version check, config init, context alloc, compress+decompress round-trip on 4x4 RGBA image"
    command: "./test_astcenc"

assertion_count: 5
