software: astc-encoder
version: "5.7.0"
status: built
build_system: cmake
build_date: "2026-08-25"

source:
  url: "https://github.com/ARM-software/astc-encoder/archive/refs/tags/5.7.0.tar.gz"
  sha256: "7c1b28ece59c9c2737e297123a9910c1c548676c7aed87a09d5734e2fa7bdaf0"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "ASTCENC_ISA_NEON=ON"
    - "ASTCENC_CLI=ON"
    - "ASTCENC_SHAREDLIB=OFF"
    - "ASTCENC_UNITTEST=ON"
    - "ASTCENC_WERROR=OFF"
    - "ASTCENC_INVARIANCE=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  type: manual-cmake-build
  note: "CMake build succeeded on OHOS aarch64. Static lib 372,126 bytes, CLI 662,016 bytes. ctest passed (1/1 tests)."

knowledge_gained:
  - "astc-encoder 5.7.0 is a self-contained C++14 ARM ASTC texture compression library with no external dependencies."
  - "The build system is CMake (>=3.15); ISA selection must be explicit for cross/native builds."
  - "On OHOS/aarch64, ASTCENC_ISA_NEON must be set to ON."
  - "GoogleTest is a git submodule; fetched manually (v1.14.0) in conanfile source() method."
  - "The static library name is ISA-suffixed: astcenc-neon-static on aarch64."
  - "The CLI tool is named astcenc-neon (ISA-suffixed)."
  - "LLVM lld requires libxml2.so.16; set LD_LIBRARY_PATH to include the OHOS SDK lib directory."
  - "LTO is enabled by upstream CMake for CLI targets; lld handles it natively."

install_paths:
  include: include
  lib: lib/astcenc-neon-static
  bin: bin/astcenc-neon
