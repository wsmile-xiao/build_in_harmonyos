software: astc-encoder
version: "5.3.0"
status: built
build_system: cmake
build_date: "2026-08-20"

source:
  url: "https://github.com/ARM-software/astc-encoder/archive/refs/tags/5.3.0.tar.gz"
  sha256: "6bd248f460b90576f90a5499c0f6b8d785b3af3837bcab82607d9a3b5bba77e2"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "ASTCENC_ISA_NEON=ON"
    - "ASTCENC_CLI=ON"
    - "ASTCENC_SHAREDLIB=OFF"
    - "ASTCENC_UNITTEST=OFF"
    - "ASTCENC_WERROR=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  type: manual-cmake-build
  note: "CMake build succeeded on OHOS device (frp-tip.com:56267). Static lib 375,962 bytes, CLI 675,160 bytes. Conan create pending (GitHub network intermittent)."

knowledge_gained:
  - "astc-encoder 5.3.0 is a self-contained C++14 ARM ASTC texture compression library with no external dependencies."
  - "The build system is CMake (>=3.15); ISA selection must be explicit for cross/native builds."
  - "On OHOS/aarch64, ASTCENC_ISA_NEON must be set to ON."
  - "GoogleTest is a git submodule, not reliably available in CI; unit tests are skipped in the recipe."
  - "The static library name is ISA-suffixed: astcenc-neon-static on aarch64."
  - "The CLI tool is named astcenc-neon (ISA-suffixed)."

install_paths:
  include: include
  lib: lib/astcenc-neon-static
  bin: bin/astcenc-neon
