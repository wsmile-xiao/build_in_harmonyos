package: ali/0.8.0
homepage: "https://github.com/nakabonne/ali"

upstream_check_command: "go test -v -count=1 ./..."
upstream_test_in_build: true
upstream_test_command: "go test -v -count=1 ./..."

upstream_tests:
  - file: main_test.go
    source: ali-0.8.0/main_test.go
    description: "CLI 解析与参数校验单元测试 (TestValidateMethod/TestParseFlags/TestRun/TestMakeAttackerOptions/TestSetDebug)"
    command: "go test -v -run TestValidateMethod ./..."
  - file: attacker/attacker_test.go
    source: ali-0.8.0/attacker/attacker_test.go
    description: "attacker 构造与攻击流程测试"
    command: "go test -v ./attacker -run TestNewAttacker"
  - file: attacker/resolver_test.go
    source: ali-0.8.0/attacker/resolver_test.go
    description: "自定义 DNS resolver 测试"
    command: "go test -v ./attacker -run TestNewResolver"
  - file: export/export_test.go
    source: ali-0.8.0/export/export_test.go
    description: "export 文件导出与 CSV/JSON 黄金文件对比测试"
    command: "go test -v ./export"
  - file: gui/drawer_test.go
    source: ali-0.8.0/gui/drawer_test.go
    description: "GUI drawer 图表与指标刷新测试"
    command: "go test -v ./gui -run TestRedraw"
  - file: gui/gui_test.go
    source: ali-0.8.0/gui/gui_test.go
    description: "GUI 运行与终端容器集成测试"
    command: "go test -v ./gui -run TestRun"
  - file: gui/keybinds_test.go
    source: ali-0.8.0/gui/keybinds_test.go
    description: "GUI 快捷键与导航测试"
    command: "go test -v ./gui -run TestKeybinds"
  - file: export_golden_test.go
    source: ali-0.8.0/export_golden_test.go
    description: "导出结果 CSV/JSON 黄金文件一致性测试"
    command: "go test -v -run TestExportGolden"
  - file: export_pending_test.go
    source: ali-0.8.0/export_pending_test.go
    description: "CLI export 目录创建与 attacker 集成测试"
    command: "go test -v -run TestExportCLI"

test_package_tests:
  - file: test.sh
    description: "消费者视角冒烟测试：验证 ali --version / --help / 无参数用法"
    command: "bash test.sh"

assertion_count: 28
