version: "2024.10.16"
software: autoconf-archive
build_system: autotools
status: built
build_date: "2026-08-09"

source:
  url: "https://ftp.gnu.org/gnu/autoconf-archive/autoconf-archive-2024.10.16.tar.xz"
  sha256: "7bcd5d001916f3a50ed7436f4f700e3d2b1bade3ed803219c592d62502a57363"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--prefix=$PREFIX"
  dependencies:
    - autoconf (system, for configure)
  cc: clang (ohos-sdk)

patches_applied:
  - "0001-configure.patch: HMDFS umask fix"

conan:
  recipe: conanfile.py
  data: conandata.yml
  test_package: test_package/
  package_type: build-scripts
  no_libs: true

knowledge_gained:
  - "autoconf-archive is a pure M4 macro collection, no C code to compile"
  - "makeinfo (texinfo) not available on OHOS; dummy makeinfo stub created in build()"
  - "586 ax_*.m4 macro files installed to share/aclocal/"
