software: autoconf-archive
display: "GNU Autoconf Archive"
description: "GNU Autoconf 宏集合，提供大量可复用的 M4 宏用于 autotools 项目配置"
category: build-tool
homepage: "https://www.gnu.org/software/autoconf-archive/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools 项目，标准 configure → make → make install 流程"
    - "纯 M4 宏集合，无 C 代码编译"
    - "makeinfo (texinfo) 不可用，使用 dummy makeinfo stub 跳过 doc 构建"
  common_dependencies:
    - autoconf

versions:
  "2024.10.16":
    status: built
    build_date: "2026-08-09"
    source_url: "https://ftp.gnu.org/gnu/autoconf-archive/autoconf-archive-2024.10.16.tar.xz"
    conan_recipe: true
