# 软件级 manifest
# 文件位置: archives/a/axel/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: axel
display: "Axel"
description: "Lightweight CLI download accelerator"
category: network
homepage: "https://github.com/axel-download-accelerator/axel"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub need OHOS triplet support"
    - "compat-android.h needs __OHOS__ guard for musl pthread_cancel"
    - "configure umask 077→022 for HMDFS permission compatibility"
  common_dependencies:
    - openssl

versions:
  "2.17.14":
    status: built
    build_date: 2026-08-05
