# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: aiosignal/1.4.0
homepage: "https://github.com/aio-libs/aiosignal"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest test_signals.py"

# 上游实际运行的测试程序（aiosignal 上游 tests/ 下 pytest 套件）
upstream_tests:
  - file: tests/test_signals.py
    source: aiosignal-1.4.0/tests/test_signals.py
    description: "上游 pytest 套件（Signal 生命周期/回调触发测试，依赖 pytest）"
    command: "python3 -m pytest tests/test_signals.py"

# test_package 中自带的测试 (消费者视角验证, 纯 Python 库用 Python 脚本)
test_package_tests:
  - file: test_aiosignal.py
    description: "消费者测试：import aiosignal 并校验 Signal API 存在且从包路径导入"
    command: "python3 test_aiosignal.py <site-packages>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
