knowledge_gained:
  - "libadql 是 C++17 库，waf 构建，依赖 boost::spirit 解析 ADQL 查询"
  - "制品仓 boost/1.90.0 为完整头文件树版（含 spirit/fusion/variant/phoenix 等 header-only 库）——可直接 requires，无需 minimal 组件集 + overlay 方案（1.90.0.1.1 才是不含 spirit 的 minimal 版）"
  - "waf configure 通过 ctx.check_cxx 检查 boost/spirit/include/qi.hpp + 链接 boost_system——--boost-dir/--boost-incdir/--boost-libdir 指向制品仓 boost 包即可真实通过"
