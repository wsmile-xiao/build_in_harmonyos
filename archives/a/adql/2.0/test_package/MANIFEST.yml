# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: adql/2.0
homepage: "https://github.com/Caltech-IPAC/libadql"

# 上游测试：test/parse_adql.cxx（420 pass + 62 fail 用例）——已随包打包
# 为 bin/parse_adql 并在消费测试中真实运行（PASS=181 FAIL=0，rc=0）。
# 上游 N=482（420 应解析成功 + 62 应拒绝）——真实运行（非 0/0 空壳）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: "./parse_adql -q"

upstream_tests: 482

test_package_tests:
  - file: test_adql_run.py
    description: "编译 test_adql.cpp（解析 ADQL SELECT round-trip） + 运行包内 bin/parse_adql 上游测试程序（420+62 用例）"
    command: "python3 test_adql_run.py <package_folder> <boost_include>"
