knowledge_gained:
  - category: L1
    content: "PyPI sdist 缺 test/__init__.py 与 test/monkeypatching.py（上游 git v1.0.0 tag 有），缺失时上游测试模块无法 import——monkeypatching.py 用补丁按上游原文补回，空 __init__.py 由 build() 创建（conan 解析器拒绝空文件零行 hunk），补齐后 pytest collection 恢复 48 个用例"
    reason: "sdist 打包遗漏测试辅助文件，属上游发布缺陷而非平台问题"
  - category: L1
    content: "advocate 1.0.0 只能用 urllib3 1.x（poolmanager.py 引用 urllib3.poolmanager._default_key_normalizer，2.x 已删除），制品仓 urllib3 为 2.x 不可直接依赖——pip 按 requests==2.32.3/urllib3==1.26.20/six 定版 vendor；netifaces 为仅 determine_local_addresses 使用的 C 扩展，在 HarmonyOS musl 上因缺 libintl 无法链接，改由补丁改为可选导入后不再 vendor"
    reason: "urllib3 大版本不兼容导致 import advocate 直接失败"
  - category: L1
    content: "setup.py 列出的 pyasn1/pyopenssl/ndg-httpsclient 在 advocate 源码中无任何 import（全库 import 扫描确认），运行时不安装，避免 cryptography 等重型轮子在 OHOS 上的构建风险"
    reason: "历史遗留的 setup.py 依赖声明，实际未使用"
