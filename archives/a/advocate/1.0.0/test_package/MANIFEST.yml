# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: advocate/1.0.0
homepage: "https://github.com/JordanMilne/Advocate"

# 上游测试命令 — 上游 unittest 风格套件（test/test_advocate.py，48 个 test_* 方法，7 个 TestCase 类）
upstream_check_command: "python -m pytest test/ -q"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python -m pytest test/ -q"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_advocate.py
    source: advocate-1.0.0/test/test_advocate.py
    description: "上游 pytest 套件（48 个用例：ValidateIP/AddrInfo/Hostname/ConnectionPooling/Wrapper/Futures；上游自带的 2 个 skip 已在 build() 内移除装饰器以实现 48/48 真实执行）"
    command: "python -m pytest test/ -q"

# test_package 中自带的测试（消费者视角验证，离线）
test_package_tests:
  - file: test_advocate_consumer.py
    description: "消费者测试：真实 API（R34）——版本/IDNA/回环拦截/公网放行/黑白名单优先级/Wrapper 与 mount 禁用（6 项，离线）"
    command: "python test_advocate_consumer.py <site-packages>"

# 测试断言总数（实际 assert 计数）
assertion_count: 9
