# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试情况说明:
#   avimetaedit 上游 (MediaArea/AVIMetaEdit 或 usnationalarchives/AVI-MetaEdit)
#   源码发行包不包含自动化测试 (make check 为空目标, 无 tests 目录,
#   无 autopkgtest)。上游唯一的官方测试数据是 MediaArea 组织下的
#   MediaArea-RegressionTestingFiles 仓库 (Public regression testing files
#   for MediaArea), 其中 AVI/ 目录提供 AVC / AC-3 / AAC 三种编码的 AVI
#   样本。
#
#   注意: GitCode PR diff 无法携带二进制文件 (binary patch data 缺失),
#   所以三个官方 AVI 样本中较小的两个 (AAC / AC-3, 均为官方原文件) 以
#   base64 形式内嵌在 test.sh 中, 运行时解码还原; 较大的 AVC/H.264 样本
#   在 CI 有网络时从上游仓库下载 (离线时跳过 AVC 专属断言)。功能断言
#   全部基于真实官方样本, 覆盖解析、XMP/aXML/INFO 编辑、MD5 嵌入、
#   --simulate 等完整 CLI 功能。

package: avimetaedit/1.0.2
homepage: "https://mediaarea.net/AVIMetaEdit"

# 上游测试命令: 源码包未提供自动化测试, make check 为空目标
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的回归测试资源 (官方 RegressionTestingFiles AVI 样本)
# 注: 上游没有可执行测试程序, 这里以官方 AVI 样本作为测试输入,
#      由 test_package 中的函数测试脚本来执行完整功能断言。
upstream_tests:
  - file: AAC_file1.avi
    source: https://github.com/MediaArea/MediaArea-RegressionTestingFiles/AVI/AAC/file1.avi
    description: "Official AVI sample — AAC audio 48000Hz 1ch (embedded as base64)"
    command: "avimetaedit --out-tech"
  - file: AC-3_file1.avi
    source: https://github.com/MediaArea/MediaArea-RegressionTestingFiles/AVI/AC-3/file1.avi
    description: "Official AVI sample — AC-3 audio 48000Hz 1ch (embedded as base64)"
    command: "avimetaedit --out-tech"
  - file: AVC_file1.avi
    source: https://github.com/MediaArea/MediaArea-RegressionTestingFiles/AVI/AVC/file1.avi
    description: "Official AVI sample — H.264 720x576 25fps (downloaded at runtime)"
    command: "avimetaedit --out-tech"

# test_package 中自带的完整功能测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: |
      Functional test suite: --Version; parse official AVI samples
      (AC-3/AAC embedded base64, AVC downloaded); XMP insert + export
      round-trip; aXML insert; INFO editing (--ISFT); MD5 generate +
      embed; --simulate no-write semantics; media data preserved.
    command: "./test.sh"

# 测试断言总数 (8 组功能断言, 覆盖解析/编辑/导出/模拟)
assertion_count: 12