software: activity-log
display: "Activity Log Manager"
description: "GTK desktop application for reviewing and controlling Zeitgeist activity data"
category: utility
homepage: "https://launchpad.net/activity-log-manager"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Recognize the HarmonyOS linux-ohos target triplet."
    - "Use HMDFS-compatible configure temporary-directory permissions."
    - "Build the standalone GTK application without optional desktop-shell integrations."
    - "Generate desktop entries without invoking the unavailable legacy intltool merge command."
  common_dependencies:
    - libgee
    - libzeitgeist
    - gtk
    - glib

versions:
  "0.9.7":
    status: pending_ci
    build_date: "2026-08-29"
    conan_ref: "activity-log/0.9.7"
