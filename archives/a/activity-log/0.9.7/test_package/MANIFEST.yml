package: activity-log-manager/0.9.7
homepage: "https://launchpad.net/activity-log-manager"

# The release has no unit-test directory.  Its upstream check target validates
# generated desktop files; the consumer test checks installed files and the
# GApplication help path when the target profile is runnable.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []

test_package_tests:
  - file: test_activity_log_manager.sh
    description: "Check the installed executable, desktop entry, icon, and runnable GApplication help path"
    command: "bash test_activity_log_manager.sh"

assertion_count: 6
