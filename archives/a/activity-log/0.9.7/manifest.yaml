software: activity-log-manager
version: "0.9.7"
status: pending_ci
build_system: autotools
build_date: "2026-08-29"

source:
  url: "https://launchpad.net/activity-log-manager/0.9/0.9.7/+download/activity-log-manager-0.9.7.tar.xz"
  sha256: "53014a08056168171579c210a8e5cfd949a0efe3bd23f6d38cd0ce0b0168841f"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--disable-nls"
    - "--with-whoopsie=no"
    - "--with-ccpanel=no"
    - "--with-switchboard=no"
  dependencies:
    - libgee/0.6.8
    - libzeitgeist/1.0.4
    - gtk/3.24.43
    - glib/2.84.0.1
    - pcre2/10.45
    - libffi/3.4.4
    - graphite2/1.3.14
    - xz/5.6.2
  tool_requires:
    - vala/0.56.18
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-umask.patch"
  - "0004-data-desktop-rule.patch"
  - "0005-configure-skip-unused-intltool-xml-check.patch"

test_results:
  type: pending_ci
  total: 0
  passed: 0
  failed: 0
  note: "W3 is pending: the pre-staging run failed on a relocated libpcre2-8.la; the corrected staging recipe reached configure, then the worker exhausted process/memory resources before the corrected compiler-environment rerun."

knowledge_gained:
  - "The release tarball contains Vala sources, generated C files, and Automake Vala stamp files; vala remains a build tool requirement."
  - "The standalone OHOS build disables Whoopsie, control-center, and Switchboard integrations."
  - "The generated configure script probes intltool unconditionally; the package-local desktop rule avoids intltool-merge while probe shims keep configure reproducible."
  - "The generated configure script also probes msgmerge despite --disable-nls; a version-only package-local probe is safe only because this release ships no translation catalogs."
  - "The generated configure script checks XML::Parser for the unused intltool path; the standalone build skips that check because desktop metadata is generated by the patched sed rule."
  - "The upstream check target validates generated desktop files; target-side availability of desktop-file-validate remains part of W3 verification."
  - "E236 applies to this dependency graph: stage libraries only from package directories containing .la metadata, rewrite only their generated pkg-config libdir values, and preserve separate package directories with duplicate library names."
  - "OHOS compiler paths must be inherited from tools.build:compiler_executables; a bare clang fallback is not reliable in non-interactive SSH builds."

knowledge_ref:
  - E236
  - E340
