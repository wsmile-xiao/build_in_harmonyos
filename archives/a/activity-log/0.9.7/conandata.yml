sources:
  url: "https://launchpad.net/activity-log-manager/0.9/0.9.7/+download/activity-log-manager-0.9.7.tar.xz"
  sha256: "53014a08056168171579c210a8e5cfd949a0efe3bd23f6d38cd0ce0b0168841f"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Recognize HarmonyOS and emit the linux-ohos target triplet."
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Accept linux-ohos in the canonical target triplet parser."
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask.patch"
    patch_description: "Use HMDFS-compatible permissions for configure temporary files."
    patch_type: "portability"
  - patch_file: "patches/0004-data-desktop-rule.patch"
    patch_description: "Generate desktop files without the unavailable intltool-merge command."
    patch_type: "portability"
  - patch_file: "patches/0005-configure-skip-unused-intltool-xml-check.patch"
    patch_description: "Skip the unused intltool XML parser probe for the standalone desktop build."
    patch_type: "portability"
  - patch_file: "patches/0006-vala-liststore-disambiguation.patch"
    patch_description: "Qualify ListStore as Gtk.ListStore for Vala >= 0.50 where GLib.ListStore makes the bare name ambiguous."
    patch_type: "portability"
