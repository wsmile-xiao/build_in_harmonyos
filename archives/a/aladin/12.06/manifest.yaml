# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - ref: notes.md "aladin 是纯 Java 应用（CDS Aladin Sky Atlas），ant build.xml 编译，无 C/C++ native 层，无需 configure/make"
  - ref: notes.md "依赖的 Java 库（adql/jsamp/kxml2/cdshealpix/Moc）捆绑在源码 lib/ 目录，无需外部依赖"
  - ref: notes.md "构建环境需 bishengjdk 17（cmd-pkgs install-jdk.sh）与 JDK 自带 javac/jar 即可完成构建，无需安装 ant"
  - ref: notes.md "conanfile.py build() 用 javac+jar 复刻 build.xml 逻辑（javac -encoding Cp1252 + jar cfe），避免 ant 依赖"
  - ref: notes.md "CI L0p 门禁要求 settings 含全部四项 os/compiler/build_type/arch，即使 JVM 应用也需声明"
  - ref: notes.md "测试类 cds.astro.Test/cds.astro.TestRegion 被编译进 Aladin.jar，test_package 直接运行验证"
  - ref: notes.md "TestGaia 需要上游未随源码附带的 Gaia 数据文件（data/sample1000-gaia_source-final.csv），无法运行，跳过"
  - ref: notes.md "环境无 unzip 命令，解压 jar 需用 Python zipfile 或 JDK jar 工具，不能用 unzip"
