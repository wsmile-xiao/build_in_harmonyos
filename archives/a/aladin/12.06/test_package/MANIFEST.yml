# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aladin/12.06
homepage: "https://aladin.cds.unistra.fr"

# 上游测试命令: aladin 是 Java 应用, 无 make check; 上游测试类位于
# src/cds/astro/Test*.java, 由 build.xml 编译进 Aladin.jar, 以 main() 直接运行
upstream_check_command: "java -cp Aladin.jar cds.astro.Test; java -cp Aladin.jar cds.astro.TestRegion"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "java -cp Aladin.jar cds.astro.Test && java -cp Aladin.jar cds.astro.TestRegion"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/cds/astro/Test.java
    source: aladin-master/src/cds/astro/Test.java
    description: "天文坐标 ICRS/FK5 转换、历元传播、自行(PM)设置与复制语义断言 (test5)"
    command: "java -cp Aladin.jar cds.astro.Test"
  - file: src/cds/astro/TestRegion.java
    source: aladin-master/src/cds/astro/TestRegion.java
    description: "Region.box 构建与 centroid 计算断言 (expect 123+34 → got 123.0+34.0)"
    command: "java -cp Aladin.jar cds.astro.TestRegion"
  - file: src/cds/astro/TestGaia.java
    source: aladin-master/src/cds/astro/TestGaia.java
    description: "Gaia 源表坐标/误差椭圆转换（需 data/sample1000-gaia_source-final.csv，上游未附带，跳过）"
    command: "java -cp Aladin.jar cds.astro.TestGaia"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 Aladin.jar 内打包的上游测试类 (cds.astro.Test + cds.astro.TestRegion)，校验 Main-Class 与启动脚本"
    command: "bash test.sh <package_dir>"

# 测试断言总数 (近似值, 用于质量评估): Test 内含坐标转换/PM/历元多组断言,
# TestRegion 含 centroid 断言, 合计 ~10
assertion_count: 10
