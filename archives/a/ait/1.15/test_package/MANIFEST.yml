# test_package/MANIFEST.yml — ait 1.15
# CI L0e requires this file to exist.

package: ait/1.15
homepage: "https://notabug.org/nuclearkev/ait/"

# ait has no upstream test suite (plain Makefile project, no check target)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: conanfile.py
    description: "Runs ait -v and asserts version output contains 'Ait 1.15'"
    command: "conan test"

# Approximate assertion count
assertion_count: 2
