version: "2.5"
software: aspectc
status: built
build_date: "2026-09-06"
build_system: custom (make; FRONTEND=Clang)

source:
  url: "https://www.aspectc.org/releases/2.5/ac-2.5.tar.gz"
  sha256: "cddb0f60b16e12a4518ed0201852577447b0cc6e308539d483663b9a4ad554cc"
  tar_format: bzip2 (misnamed .tar.gz)

build:
  system: make
  configure_options: ["FRONTEND=Clang", "Puma MINI=1"]
  dependencies:
    - "Alpine clang18-static 18.1.8 (aarch64 musl static libs: libclang*.a, libLLVM*.a)"
    - "Alpine llvm18-static 18.1.8"
    - "Alpine libstdc++-dev 14.2.0 (static libstdc++.a, headers)"
    - "Alpine zstd-static 1.5.6"
    - "Alpine libxml2-dev 2.13.9 (headers only; runtime uses OHOS libxml2 2.11.9)"
  compiler: "OHOS clang 15.0.4, libstdc++ ABI (not SDK default libc++)"

patches_applied:
  - "patches/0001-vars-mk-cxx11-only.patch"

test_passed: 196
test_failed: 0
test_differences: 4
test_differences_detail:
  - "Float128Basic [C]: aarch64 has no __float128 (upstream also excludes Darwin)"
  - "ExecAdviceNewDelete [D]: weaving works; output line-order differs from ref"
  - "RepoVersion [D]: stale repo format triggers expected version warning text"
  - "STLString [D]: std::basic_string call pointcut not matched under clang 15 backend"

knowledge_gained:
  - "AspectC++ FRONTEND=Clang only needs libMiniPuma (Puma MINI=1, no aspect weaving), breaking the ac++/ag++ bootstrap deadlock"
  - "The OHOS SDK lacks clang 18+ static libraries (only clang 15.0.4 + libclang.so); Alpine 3.21 aarch64 musl clang18-static/llvm18-static provide the full 283-archive set"
  - "Alpine LLVM objects are built against libstdc++; compiling aspectc against them requires -stdlib=libstdc++ (headers + static lib), not the SDK's libc++, else std::__cxx11 vs std::__n1 symbol mangling mismatch"
  - "OHOS musl lacks glibc's secure_getenv; a one-line stub is needed"
  - "lemon (Puma tool) is C but inherits -std=gnu++11 via CPPFLAGS; clang rejects the flag on C files (GCC silently ignores)"
  - "ag++ spawns a backend compiler named g++; OHOS has no g++, so package ships g++/gcc shims pointing at clang++"
  - "ac++/ag++ are OHOS ELF tools: need .codesign (sign after patchelf RUNPATH) to exec"
