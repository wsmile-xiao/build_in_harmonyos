# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aspectc/2.5
homepage: "https://www.aspectc.org/"

# 上游测试命令 (AspectC++ 织入回归测试套件)
# 真实运行环境: FRONTEND=Clang, 约 200 个织入回归用例 (编译+织入+diff 与 .ref 对比)
upstream_check_command: "make -C AspectC++ test FRONTEND=Clang"

# conanfile.py build() 方法中未集成上游测试 (上游 test 需独立运行)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (织入回归测试, 196 通过 + 4 项已定性差异, 非功能回退)
upstream_tests:
  - file: tests/Advice
    source: ac-2.5/AspectC++/tests/Advice
    description: "织入回归: advice 匹配与执行 (diff 与 .ref 对比)"
    command: "make -C tests Advice FRONTEND=Clang"
  - file: tests/ArrayWrapper
    source: ac-2.5/AspectC++/tests/ArrayWrapper
    description: "织入回归: 数组包装器 aspect"
    command: "make -C tests ArrayWrapper FRONTEND=Clang"
  - file: tests/ExecAdviceNewDelete
    source: ac-2.5/AspectC++/tests/ExecAdviceNewDelete
    description: "织入回归: new/delete 执行 advice (输出行序与 .ref 不同, 已定性)"
    command: "make -C tests ExecAdviceNewDelete FRONTEND=Clang"
  - file: tests/STLString
    source: ac-2.5/AspectC++/tests/STLString
    description: "织入回归: std::basic_string call pointcut (clang 15 后端匹配差异, 已定性)"
    command: "make -C tests STLString FRONTEND=Clang"

# test_package 中自带的测试 (消费者视角验证: ac++/ag++ 版本断言)
test_package_tests:
  - file: test_aspectc.py
    description: "校验 ac++/ag++ --version 均包含 2.5 (织入端到端验证在 conanfile.py test() 中)"
    command: "python3 test_aspectc.py <package>/bin/ac++ <package>/bin/ag++"

# 测试断言总数 (上游 196 通过 + 4 项定性差异 + test_package 2 项版本断言)
assertion_count: 202
