test_type: explicit
upstream_test_framework: make-check-unsupported
assertion_count: 5

# AFL++ upstream test suite (test/test-all.sh) requires:
#   LLVM (for afl-cc + instrumentation tests)
#   GCC plugin (for gcc_mode tests)
#   QEMU (for qemu_mode tests)
#   Frida (for frida_mode tests)
#   UniCorn (for unicorn_mode tests)
# None of these are available in OHOS CI.
# The test_package verifies core header type definitions and the
# VERSION/MAP_SIZE constants that define AFL++'s ABI contract.
#
# If full upstream tests are needed for scoring, run manually on
# the HarmonyOS PC dev machine:
#   cd $BUILD_DIR && make -f GNUmakefile tests NO_PYTHON=1
# Expected: test-unittests.sh + test-basic.sh pass; LLVM/GCC/QEMU/
# Frida tests skip or fail due to missing deps.
