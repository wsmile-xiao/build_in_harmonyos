software: afl-tools
version: 4.40c
status: built
build_system: makefile
compile_date: 2026-08-25
dependencies:
  required: []
  optional:
    - llvm      # OHOS SDK 自带 LLVM 15.0.4 + llvm-config，用于 afl-cc + 插桩 pass（系统组件，非 Conan 包）
    - python3   # Python 绑定（可选，NO_PYTHON=1 禁用）
    - zlib      # OHOS SDK 系统库，Makefile 自动检测（[+] ZLIB detected）
    - cmocka    # 上游单元测试框架（ohpcd 已有预编译包，仅测试时用，不进 requirements）
patches_applied:
  - 0001-include-forkserver.h.patch           # add <sys/types.h> for uid_t/pid_t/mode_t on OHOS（4.40c 重打版）
  - 0002-include-sharedmem.h.patch            # add <sys/types.h> for mode_t on OHOS（4.40c 重打版）
  - 0005-afl-cmin-py-fork-start-method.patch  # force fork start method（OHOS Python 3.12 spawn 死锁；4.33c 的 0003/0004 上游已修，删除）
build_flags:
  - TEST_MMAP=1  # OHOS 沙箱拦截 SysV shmget(SIGSYS)，强制 mmap 共享内存（-DUSEMMAP=1）；4.40c 自动 shmget 检测是编译期测试，测不出运行时拦截，必须显式传
test_results:
  type: pending
  note: >
    待鸿蒙 PC 实机验证后填写（不伪造数据）。
    预期执行：cmocka 5 个 unit_*.c（14 断言）+ test-basic.sh + test-llvm.sh +
    test_package 5 断言（VERSION=++4.40c / MAP_SIZE / u8/u32/u64）。
    注意：4.40c PROGS 新增 afl-cmin（make 目标 = cp afl-cmin.py），0005 fork 补丁
    保证 afl-cmin.py 的 multiprocessing.Pool 不死锁。
