# 版本级 manifest — ascon-c 1.3.0

version: "1.3.0"
software: ascon-c
status: built
build_date: "2026-09-19"
build_system: cmake

source:
  url: "https://github.com/ascon/ascon-c"
  sha256: "274720793bcf74bc11ebc7c1212bc5acf1d8043b0d164eff5bd05db51c08918b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DREL_FLAGS=-std=c99;-O2"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ascon-c 上游默认 REL_FLAGS 含 -march=native/-mtune=native，在 OHOS 交叉工具链下必须覆盖为 -std=c99 -O2，否则产物按构建机 CPU 编译"
  - "CMake 对 crypto_aead_hash/ 组合目录按 crypto_aead_* 与 crypto_hash_* 双命名生成库（内容相同、符号全集），conanfile components 需用 crypto_aead_<alg>_ref 名链接"
  - "上游 CMakeLists 无 install() 规则，需在 package() 手动安装 eBACS 声明头与各 ref 静态库"