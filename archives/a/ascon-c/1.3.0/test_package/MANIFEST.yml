# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ascon-c/1.3.0
homepage: "https://ascon.iaik.tugraz.at/"

# 上游测试命令 (cmake/ctest 驱动)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake --build . && ctest"

# 上游实际运行的测试程序 (199 个 genkat 用例, KAT 逐字节比对)
upstream_tests:
  - file: tests/genkat_aead.c
    source: ascon-c-1.3.0/tests/genkat_aead.c
    description: "AEAD 已知答案测试 (ascon128/ascon128a/ascon80pq 各实现, 与 LWC_AEAD_KAT_*.txt 比对)"
    command: "ctest -R genkat_crypto_aead"
  - file: tests/genkat_hash.c
    source: ascon-c-1.3.0/tests/genkat_hash.c
    description: "HASH/XOF 已知答案测试 (asconhash/asconhasha/asconxof/asconxofa 各实现, 与 LWC_HASH_KAT_256.txt 比对)"
    command: "ctest -R genkat_crypto_hash"
  - file: tests/genkat_auth.c
    source: ascon-c-1.3.0/tests/genkat_auth.c
    description: "AUTH/MAC/PRF 已知答案测试 (asconmac/asconprf/asconprfs 各实现, 与 LWC_AUTH_KAT_128_128.txt 比对)"
    command: "ctest -R genkat_crypto_auth"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 通过已安装公开头文件/API 验证 AEAD 加解密往返、篡改检测与 HASH KAT"
    command: "./test_ascon-c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 199