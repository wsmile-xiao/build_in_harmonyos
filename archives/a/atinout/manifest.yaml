software: atinout
display: "atinout"
description: "AT commands as input are sent to modem and responses given as output"
category: system
homepage: "https://atinout.sourceforge.net/"
license: GPL-3.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 使用 CC=gcc，需通过 make CC=$CC 覆盖为 clang"
    - "不能用 make -e，否则环境 CFLAGS 覆盖 Makefile 的 CFLAGS（丢失 -DVERSION 定义）"
    - "SourceForge 下载 URL 需在 conandata.yml 中添加 filename 字段才能被 Conan 正确识别"
    - "无 configure 脚本，仅简单 Makefile，不属于 autotools 项目"
    - "Makefile 无 check 目标，不包含测试套件"
  common_dependencies: []

versions:
  "0.9.1":
    status: published
    build_date: "2026-06-29"
    conan_ref: "atinout/0.9.1"
