software: atinout
# 版本级 manifest — 交叉校验元数据
# 文件位置: archives/a/atinout/0.9.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# Conan 引用
conan_ref: "atinout/0.9.1@ohpcd/stable"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sourceforge.net/projects/atinout/files/v0.9.1/atinout-0.9.1.tar.gz/download"

  # 源码校验和
  sha256: "4d15c8288aca414e11cd304686b172696104c5e42bf776300311c005634854a2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Makefile 使用 CC=gcc，需通过 make CC=$CC 覆盖为 clang"
  - "不能用 make -e，否则环境 CFLAGS 覆盖 Makefile 的 CFLAGS（丢失 -DVERSION 定义）"
  - "SourceForge 下载 URL 需在 conandata.yml 中添加 filename 字段才能被 Conan 正确识别"
  - "Conan 2.x 中 ConanInvalidConfiguration 在 conan.errors 模块"
  - "OpenHarmony 未签名二进制从某些目录执行会报 Operation not permitted"
