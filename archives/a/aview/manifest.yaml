# 软件级 manifest — aview
# 遵循 ARCHIVE-SPEC v2.0

software: aview
display: "aview"
description: "ASCII-art 图像查看器与 FLI/FLC 动画播放器 — PGM/PPM/PNG/BMP 在终端的 ASCII 艺术渲染"
category: utility
homepage: "https://aa-project.sourceforge.net/aview/"
license: GPL-2.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "autoconf 2.13 老式脚本（2001 年），configure 已预生成，依赖 AM_PATH_AALIB 宏（需 aalib-config）"
    - "上游无任何测试套件（make check 为空），test_package 自建完整功能测试集（8 断言）"
    - "OHOS SELinux 下默认 /system/bin/sh 无法 exec configure 脚本，配方用 CONFIG_SHELL=bash 显式驱动（abcm2ps 同款模式）"
    - "make install 并行 jobserver 需 mkfifo 被 SELinux 拦截，package() 直接复制产物（非 make install）"
  common_dependencies:
    - "aalib/1.4p5"

# ============================================================
# 版本索引
# ============================================================

versions:
  - "1.3.0rc1"