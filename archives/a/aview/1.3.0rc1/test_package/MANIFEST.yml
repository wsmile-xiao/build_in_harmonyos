# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: aview/1.3.0rc1
homepage: "https://aa-project.sourceforge.net/aview/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# aview 1.3.0rc1 (2001年发布) 上游未提供任何测试套件：
#   - Makefile.am 无 TESTS / check_PROGRAMS 目标
#   - `make check` 直接成功但无实际测试
#   - 源码包中不存在 tests/ 目录或单元测试文件
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 功能完整覆盖)
# 因上游无测试, 本 test_package 提供了完整的 aview 功能测试集
# (aview/aaflip/asciiview 三个产物的功能验证), 见 test.sh:
#   1. aview 输出 Usage
#   2. aview 用 stdout driver 将真实 PPM 图像渲染为 ASCII 艺术 (断言输出
#      "Calculating" 标记 + ASCII 字符 + 多行渲染结果)
#   3. aview 对不存在的图像路径报错
#   4. aaflip 输出使用说明
#   5. asciiview 脚本已安装且在 PATH
test_package_tests:
  - file: test.sh
    description: "aview 功能测试集：aview 渲染真实PPM图像为ASCII艺术、错误处理、aaflip 与 asciiview 产物验证"
    command: "bash test.sh"

assertion_count: 8