software: addlicense
# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.1.1"
status: published
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://goproxy.cn/github.com/google/addlicense/@v/v1.1.1.zip"
  sha256: ""
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0 go build -ldflags=\"-s -w\" -o addlicense ."
  dependencies:
    - go/1.26.4
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Go项目使用GOPROXY=https://goproxy.cn,direct下载源码和依赖"
  - "CGO_ENABLED=0编译纯静态二进制，无需ELF签名可直接执行"
  - "v1.1.2不存在，使用v1.1.1（最新1.1.x系列版本）"