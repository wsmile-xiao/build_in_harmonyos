# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: adb-enhanced/2.8.0
homepage: "https://github.com/ashishb/adb-enhanced"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# PyPI sdist 不包含 tests/ 目录，无法运行上游测试
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# PyPI sdist 不包含 tests/，无上游测试可运行
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 adbe --version 输出版本号"
    command: "adbe --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
