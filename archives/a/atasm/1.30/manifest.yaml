# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "verify.c 中 read() 函数名与 POSIX read() 系统调用冲突，导致 fread() 内部调用被劫持引发 SIGSEGV；修复方式：重命名为 read_file()"
  - "平台无 zlib 库，通过 Makefile 中 USEZ/ZLIB 设为空禁用 zlib 支持（可选功能）"
  - "atasm 项目为纯 Makefile 构建（非 autotools），Makefile 位于 src/ 子目录，无 configure 脚本"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
