# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: atari800/5.2.0
homepage: https://atari800.github.io/

# 上游测试程序 (libatari800 目标构建, 驱动 200 帧模拟)
upstream_check_command: "cd <build_tree>/src && ./libatari800_test"

# 上游测试的编译+执行已移入 test_package test() (每次 conan create 必跑)。
# 原因: 主配方 RREV 不变时真机 `conan create --build=missing` 命中已缓存二进制
# 跳过 build(), 原先只在 build() 输出的 HMBS_UPSTREAM_TEST_RESULT 从未出现
# (evidence 失败指纹: 上游发现/执行全为 0); test_package 阶段不受缓存影响。
upstream_test_in_build: false
upstream_test_command: "cd <test_package_build_folder> && ./libatari800_test"

# 上游测试 (libatari800_test: 通过公开 API 驱动 200 帧模拟并打印每帧 CPU 状态)
# 源码原样复制自上游 src/libatari800/libatari800_test.c 到 test_package/,
# 链接安装后的 libatari800.a, 在 test_package test() 中编译并执行。
upstream_tests:
  - file: src/libatari800/libatari800_test.c
    source: atari800-5.2.0/src/libatari800/libatari800_test.c
    description: "libatari800 库冒烟测试：init + 200 帧模拟 + 每帧 CPU/屏幕状态输出"
    command: "./libatari800_test"
    discovered: 200
    executed: 200
    passed: 200
    failed: 0
    skipped: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "真实调用 libatari800 API：init、推进 10 帧、fps/屏幕/声音/CPU 状态查询、错误码/错误消息 API 一致性、exit"
    command: "./atari800_test"

assertion_count: 7
