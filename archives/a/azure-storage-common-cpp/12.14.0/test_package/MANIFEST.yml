# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: azure-storage-common-cpp/12.14.0
homepage: "https://github.com/Azure/azure-sdk-for-cpp/tree/main/sdk/storage/azure-storage-common"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -C Release --output-on-failure"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 注意: 上游测试二进制 azure-storage-common-test 需要 3 个测试专用链接依赖
# (azure-storage-blobs, azure-identity, azure-core-test-fw) 不在 ohpcd 仓中。
# 无法在 conan create 中构建/执行。见 test-report.md 详细说明。
upstream_tests:
  - file: crypt_functions_test.cpp
    source: sdk/storage/azure-storage-common/test/ut/crypt_functions_test.cpp
    description: "Cryptographic functions (HmacSha256, Crc64Hash)"
    command: "N/A — 依赖未发布 (R36), 见 test-report.md"
  - file: metadata_test.cpp
    source: sdk/storage/azure-storage-common/test/ut/metadata_test.cpp
    description: "Metadata case-insensitive map"
    command: "N/A — 依赖未发布 (R36), 见 test-report.md"
  - file: storage_credential_test.cpp
    source: sdk/storage/azure-storage-common/test/ut/storage_credential_test.cpp
    description: "Storage credential connection string parsing"
    command: "N/A — 依赖未发布 (R36), 见 test-report.md"
  - file: structured_message_test.cpp
    source: sdk/storage/azure-storage-common/test/ut/structured_message_test.cpp
    description: "Structured message encoding/decoding (38 test cases)"
    command: "N/A — 依赖未发布 (R36), 见 test-report.md"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证: 头文件包含 + API 链接 (storage_credential, storage_common)"
    command: "./test_azure-storage-common-cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 43