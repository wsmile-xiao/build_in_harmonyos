# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试来源: tests/CMakeLists.txt + tests/unit/CMakeLists.txt
#   - add_test(cppcheck ...)                -> 静态分析（cppcheck）
#   - add_test_by_name(rotation-lock-test)  -> tests/unit/rotation-lock-test.cpp
# 上游单测依赖 Qt5Test/Qt5DBus/libqtdbtest-1/libqtdbusmock-1/GMock，
# OHOS 环境不可用（制品仓无 Qt5/qtdbtest/qtdbusmock），故本配方
# ENABLE_TESTS=OFF，不在 conan create 中运行上游测试（MANIFEST 如实声明）。

package: ayatana-indicator-display/26.6.0
homepage: "https://github.com/AyatanaIndicators/ayatana-indicator-display"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/unit/rotation-lock-test.cpp
    source: ayatana-indicator-display-26.6.0/tests/unit/rotation-lock-test.cpp
    description: "GTest/GMock 单元测试：旋转锁定（rotation lock）与颜色温度（colour temp）相关 Indicator 逻辑（依赖 Qt5Test/Qt5DBus/libqtdbtest-1/libqtdbusmock-1）"
    command: "./rotation-lock-test"
  - file: tests/CMakeLists.txt
    source: ayatana-indicator-display-26.6.0/tests/CMakeLists.txt
    description: "cppcheck 静态分析（--enable=all --error-exitcode=2，覆盖 src/ 与 tests/）"
    command: "cppcheck --enable=all -USCHEMA_DIR --check-level=exhaustive --error-exitcode=2 --inline-suppr --library=qt --library=tests/ayatana.cfg -Isrc -itests/utils/qmain.cpp tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试：启动 ayatana-indicator-display-service，验证安装产物可执行、依赖库/符号可解析（conanrun 注入 LD_LIBRARY_PATH）"
    command: "timeout 3 ayatana-indicator-display-service"

# 测试断言总数 (近似值, 用于质量评估)
# rotation-lock-test.cpp: 单测数量以 GTest 运行输出为准（上游未在 CMake 声明
# 断言数；本清单如实记录测试程序入口）
assertion_count: 1
