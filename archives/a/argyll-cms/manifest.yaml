# 软件级 manifest — argyll-cms
# 遵循 ARCHIVE-SPEC v2.0

software: argyll-cms
display: "ArgyllCMS"
description: "ICC 兼容色彩管理系统（显示器/扫描仪/相机/打印机的校色与 ICC profile 制作工具集）"
category: gfx
homepage: "https://www.argyllcms.com/"
license: AGPL-3.0-or-later
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "构建系统是 Perforce Jam：发布包只带 Jambase/Jamfile/Jamtop，不带 jam 本体，必须 tool_requires jam/ajam-2.5.2-1.3.4（FT-Jam 2.5.2 + ArgyllCMS V1.3.3 Jambase）"
    - "Jamtop 用 FHS 硬编码路径 GLOB 查找 X11 头/库，找不到直接 EXIT；补丁 0001 让它接受 X11HDRDIR/X11LIBDIR 两个 jam 变量，配方用上游自带的 JamExtra 钩子注入 Conan 依赖路径"
    - "内置 zlib/jpeg/png/tiff（以及 ccast 的 axTLS）必须用 BUILTIN_*=true 强制使用源码内版本，避免 Jamtop 的 CheckForLibrary 探到宿主机的 /usr/include + /usr/lib*"
    - "内置 jpeg(2011)/tiff(2008) 的 config.guess/config.sub 不认识 HarmonyOS，补丁 0002/0003 补 *:HarmonyOS:*:* 分支与 linux-ohos 三元组（E007）"
    - "两个内置 configure 的私有临时目录用 umask 077，在 HMDFS 上 config.status 报 can't create ./confXXXXXX/subs1.awk: Permission denied，补丁放宽为 022（E011）"
    - "USB 仪器支持不需要额外的库：Linux 后端 spectro/usbio_lx.c 直接走 <linux/usbdevice_fs.h>，OHOS sysroot 已提供该头"
    - "GUI 工具（dispwin/dispcal/viewgam 等）动态链接 Conan 的 libX11 等，配方按依赖 libdir 注入 -Wl,-rpath；无显示服务时优雅报 Unable to open the default display"
  common_dependencies:
    - libx11
    - libxext
    - libxxf86vm
    - libxinerama
    - libxrandr
    - libxscrnsaver
    - libxau
    - libxdmcp

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.5.0":
    status: built
    build_date: "2026-09-27"
