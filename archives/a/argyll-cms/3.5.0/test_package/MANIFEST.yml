# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在
# R51 上游测试三步法：清点 -> 运行 -> 如实回填

package: argyll-cms/3.5.0
homepage: "https://www.argyllcms.com/"

# ── 上游测试清点结论（R51 第一步）─────────────────────────────
# ArgyllCMS **没有**统一自动化测试入口：
#   * 顶层 Makefile 只有 all / clean / install（`all: jam -q -fJambase -j 3`）；
#   * Jambase 的 NotFile 伪目标只有 all/first/shell/files/lib/exe/obj/dirs/
#     clean/install/uninstall，没有 check/test；
#   * 发布 zip 内无 tests/ 或 test/ 顶层目录、无 ctest/pytest 注册；
#   * doc/Compiling.html 未提及任何测试命令。
# 上游实际的“测试入口”是各子模块内置的自检/回归程序（jam 默认目标即产出）：
#   numlib/ (LUtest dnsqtest qptest soboltest svdtest tconjgrad tdhsx tpowell
#            tvarmet zbrenttest)、icc/ (icctest lutest iccrw)、
#   rspl/ (sm1 sm2 sm3 c1 cw1 cw3 t2d t2ddf t3d t3ddf tnd trnd revbench)、
#   gamut/ (maptest smthtest surftest)、imdi/ (itest ctest)、
#   xml/testmxml、jcnf/test、cgats/pars。
# 本次适配在真机上逐个执行并如实统计（见 reports/test-report.md）。
upstream_check_command: "grep -n 'NotFile' Jambase（无 check/test）；ls */Jamfile 各测试程序 Main 声明"
upstream_test_in_build: false
upstream_test_command: "手工逐个执行 jam 默认目标产出的自检程序（无统一命令）"
upstream_tests:
  - name: "numlib/LUtest"
    result: pass
  - name: "numlib/dnsqtest"
    result: pass
  - name: "numlib/qptest"
    result: pass
  - name: "numlib/soboltest"
    result: pass
  - name: "numlib/svdtest"
    result: pass
  - name: "numlib/tconjgrad"
    result: pass
  - name: "numlib/tdhsx"
    result: "fail (上游自检程序自身返回 'Return code 1'，-O0/-O2 结果一致，与平台适配无关)"
  - name: "numlib/tpowell"
    result: pass
  - name: "numlib/tvarmet"
    result: pass
  - name: "numlib/zbrenttest"
    result: pass
  - name: "icc/icctest"
    result: "fail (NamedColor 往返校验，-O0/-O2/-fsigned-char 一致，与平台适配无关)"
  - name: "icc/lutest"
    result: pass
  - name: "rspl/sm1"
    result: pass
  - name: "rspl/sm2"
    result: pass
  - name: "rspl/t2d"
    result: pass
  - name: "rspl/t2ddf"
    result: pass
  - name: "rspl/t3d"
    result: pass
  - name: "rspl/t3ddf"
    result: pass
  - name: "rspl/trnd"
    result: pass
  - name: "gamut/surftest"
    result: pass
  - name: "imdi/itest"
    result: pass
  - name: "imdi/ctest"
    result: pass
  - name: "cgats/pars"
    result: pass
  - name: "rspl/sm3"
    result: "skip (单次运行超过 900s 预算，长时基准程序)"
  - name: "rspl/tnd"
    result: "skip (单次运行超过 420s 预算，长时基准程序)"
  - name: "rspl/c1"
    result: "skip (需要 X 显示服务，绘制图形窗口)"
  - name: "rspl/cw1"
    result: "skip (需要 X 显示服务)"
  - name: "rspl/cw3"
    result: "skip (需要 X 显示服务)"
  - name: "icc/iccrw"
    result: "skip (需 readprofile/writeprofile 两个参数)"
  - name: "gamut/maptest"
    result: "skip (需 2~3 个 .gam 输入参数)"
  - name: "gamut/smthtest"
    result: "skip (需 3 个输入参数)"
  - name: "xml/testmxml"
    result: "skip (需 XML 输入文件参数)"
  - name: "jcnf/test"
    result: "skip (需预先存在 testo.jcnf 且交互式回车)"

# ── test_package 自带测试（消费者视角，均真实执行包内二进制）──
test_package_tests:
  - file: test.sh
    description: "功能测试（8 条断言）: iccdump 解析 sRGB.icm(3004 bytes) 与 ClayRGB1998.icm、icclu 正向 RGB→Lab、反向 Lab→RGB、三组颜色 RGB→Lab→RGB 往返一致、iccgamut 产出 CGATS .gam、targen 产出 .ti1 图表、X11 GUI 二进制 dispwin 可加载运行"
    command: "bash test.sh <pkg>/bin <pkg>/ref"
    assertions: 8
  - file: test_ohos.sh
    description: "鸿蒙特有测试（14 条断言）: 平台身份(HarmonyOS/aarch64)、47+ 工具均为 ELF64/AArch64/PIE、musl 解释器 /lib/ld-musl-aarch64.so.1、无 glibc 专有 NEEDED、.note.ohos.ident 与 .codesign 段、RUNPATH 不指向系统库目录(R26)、dispwin 的 8 个 X 库 NEEDED、dispwin --version 真实运行、无显示服务时优雅退出(rc=1)、ref/ 参考数据随包、任意 cwd 可运行、包载荷完整"
    command: "bash test_ohos.sh <pkg>"
    assertions: 14

# 测试断言总数 = 功能 8 + 鸿蒙特有 14
assertion_count: 22

# 其中鸿蒙平台特有测试用例数（ELF/ABI、musl/OHOS 标记、X11 运行期加载、平台能力缺口等）
ohos_specific_assertions: 14
