# conandata.yml — argyll-cms 3.5.0
# 官方源码：ArgyllCMS 作者 Graeme Gill 的官方发布页
#   https://www.argyllcms.com/downloadsrc.html → Argyll_V3.5.0_src.zip
sources:
  url: "https://www.argyllcms.com/Argyll_V3.5.0_src.zip"
  sha256: "f8576ce5589fd15620abb73ff049ea31f55ddbd1bba6d1ffa87452658e7bc85f"

patches:
  - patch_file: "patches/0001-Jamtop.patch"
    patch_description: "Jamtop: let the X11 header/library search paths come from the X11HDRDIR / X11LIBDIR jam variables (falling back to the original FHS globs), so a Conan-provided X11 installation can be used instead of only the hardcoded /usr/X11R6, /usr/include, /usr/lib64 locations. Generic, no platform macro: the recipe's generate() supplies both variables through upstream's own JamExtra hook."
    patch_type: "portability"
  - patch_file: "patches/0002-jpeg-config.guess.patch"
    patch_description: "Bundled jpeg: teach the 2011-era config.guess the HarmonyOS system type (aarch64-unknown-linux-ohos); the branch needs the trailing 'echo \"$GUESS\" ; exit' because this vintage only assigns GUESS."
    patch_type: "portability"
  - patch_file: "patches/0003-jpeg-config.sub.patch"
    patch_description: "Bundled jpeg: add linux-ohos* to config.sub's maybe_os list and to the 'each alternative MUST END IN *' list so aarch64-unknown-linux-ohos canonicalises instead of being rejected."
    patch_type: "portability"
  - patch_file: "patches/0004-jpeg-configure.patch"
    patch_description: "Bundled jpeg: relax configure's private temp-directory umask 077 to 022 (HMDFS UID mapping makes 0700 temp dirs unwritable, E011)."
    patch_type: "portability"
  - patch_file: "patches/0005-tiff-config-config.guess.patch"
    patch_description: "Bundled tiff: same HarmonyOS system-type branch for the 2008-era config.guess (echo/exit included)."
    patch_type: "portability"
  - patch_file: "patches/0006-tiff-config-config.sub.patch"
    patch_description: "Bundled tiff: same linux-ohos* entries in config.sub."
    patch_type: "portability"
  - patch_file: "patches/0007-tiff-configure.patch"
    patch_description: "Bundled tiff: same umask 077 -> 022 relaxation in configure."
    patch_type: "portability"
