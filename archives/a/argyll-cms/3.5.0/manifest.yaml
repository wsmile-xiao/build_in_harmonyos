# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Jam 构建的项目可以通过上游 Jamtop 自带的 JamExtra 钩子（`if [ GLOB $(TOP) : JamExtra ] { include ... }`）在构建期注入覆盖变量，不必给 recipe 打补丁改 Jamfile（E007/E011 之外的通用手段）"
  - "Jambase 的 CC/C++ 默认是 cc/c++（?= 语义），JamExtra 里必须用 `=` 覆盖，否则 cc/c++ 不存在时静默用错编译器（R33）"
  - "2008/2011 年代的内置 config.guess 的 case 分支以 `;;` 结尾但没有 echo/exit，只补 GUESS= 赋值不会生效——必须补 `echo \"$GUESS\" ; exit ;;`（E007 变体）"
  - "config.sub 的 ohos 支持要看版本：老版本没有 `android-linux)` 锚点，需要手工在 maybe_os 列表和 MUST END IN * 列表各加一条 `linux-ohos*`/`-linux-ohos*`"
  - "内置 configure 的 `umask 077` 私有临时目录在 HMDFS 上不可写（E011）；config.guess 的 dummy.c 回退路径同样会因 umask 077 失败，修好系统识别分支后就不会走到那里"
  - "OHOS sysroot 提供 <linux/usbdevice_fs.h> 与 librt.a/libdl.a/libpthread.a 空壳，因此 Argyll 的 -ldl -lrt 与 USB 后端无需任何改动"

