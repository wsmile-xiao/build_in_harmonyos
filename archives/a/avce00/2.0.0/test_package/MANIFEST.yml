# test_package/MANIFEST.yml — avce00 2.0.0
# CI L0e requires this file to exist.

package: avce00/2.0.0
homepage: "http://avce00.maptools.org/"

# The upstream GNUmakefile has no `make check` target.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs in the release tarball (avctest requires
# actual binary coverage data files which are not distributed).
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Links libavce00, verifies AVC_VERSION macro starts with '2.', exercises AVCE00ReadOpen/WriteOpen error paths for nonexistent files"
    command: "./test"

assertion_count: 3
