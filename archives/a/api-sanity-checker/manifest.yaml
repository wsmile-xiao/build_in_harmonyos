software: api-sanity-checker
display: "API Sanity Checker"
description: "C/C++ 库 API 单元测试自动生成工具"
category: development-tool
homepage: "https://github.com/lvc/api-sanity-checker"
license: LGPL-2.1-or-GPL-2.0
build_system: perl

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Perl 路径需要修改为 ~/usr/local/bin/perl"
    - "依赖 abi-compliance-checker 需要先安装"
  common_dependencies:
    - abi-compliance-checker

# 版本索引（所有已归档版本，含状态）
versions:
  "1.98.7":
    status: published
    build_date: "2026-06-18"