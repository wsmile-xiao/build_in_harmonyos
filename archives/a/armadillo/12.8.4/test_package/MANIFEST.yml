package: armadillo/12.8.4
homepage: "https://arma.sourceforge.net/"

upstream_check_command: "cmake -S . -B build && cmake --build build && ctest --test-dir build -N"
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_exemption: "Armadillo does not ship a CTest suite; core operations verified via consumer test."

upstream_tests: []

test_package_tests:
  - file: test.cpp
    description: >-
      Consumer-side C++14 test exercising matrix creation, arithmetic,
      transposition, element access, special matrices (zeros/ones/eye),
      vector operations (sum/norm/min/max/dot), accumulation, and
      LAPACK-dependent functions: solve() (linear system solve),
      inv() (matrix inverse), svd() (singular value decomposition),
      eig_sym() (symmetric eigenvalue decomposition).
      LAPACK is provided by OpenBLAS dependency.
    command: "./test_armadillo"

assertion_count: 20
