software: armadillo
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/12.8.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "12.8.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"

# 构建系统类型（扁平结构，质量检查需要）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sourceforge.net/projects/arma/files/armadillo-12.8.4.tar.xz/download"

  # 源码校验和
  sha256: "558fe526b990a1663678eff3af6ec93f79ee128c81a4c8aef27ad328fae61138"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DOPENBLAS_PROVIDES_LAPACK=ON"
    - "-DALLOW_FLEXIBLAS_LINUX=OFF"
    - "-DDETECT_HDF5=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - name: "openblas"
      version: "0.3.34"
      required: true

  # 可选依赖（影响功能）
  optional_dependencies: []

  # openblas provides both BLAS and LAPACK for full linear algebra
  # functionality: solve(), inv(), eig_sym(), svd(), etc.

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "armadillo使用CMake构建系统，configure脚本只是wrapper"
  - "需要使用BUILD_SHARED_LIBS=ON来编译共享库(.so)，否则默认只编译静态库(.a)"
  - "CMAKE_INSTALL_PREFIX设置运行时路径，DESTDIR用于staging隔离安装"
  - "OpenBLAS提供BLAS和LAPACK，使armadillo支持solve/inv/eig_sym/svd等高级功能"
  - "设置OPENBLAS_PROVIDES_LAPACK=ON让CMake使用OpenBLAS的LAPACK接口"
  - "设置ALLOW_FLEXIBLAS_LINUX=OFF避免在OHOS/musl上检测FlexBLAS"
  - "DESTDIR模式验证流程：先staging安装验证，再本地安装"
