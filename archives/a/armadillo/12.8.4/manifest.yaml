software: armadillo
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/12.8.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "12.8.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# 构建系统类型（扁平结构，质量检查需要）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sourceforge.net/projects/arma/files/armadillo-12.8.4.tar.gz/download"

  # 源码校验和
  sha256: "e7fb72951d6efe557e7aaf1298b5b0513d60f0aeff2176abca62722f90c7aabd"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
    - "-DBUILD_SHARED_LIBS=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 可选依赖（影响功能）
  optional_dependencies:
    - name: "blas"
      version: "any"
      impact: "矩阵运算性能优化"
      required: false
    - name: "lapack"
      version: "any"
      impact: "solve(), eig_sym(), inv() 等高级线性代数功能"
      required: false

  # 无强制依赖，armadillo可独立编译
  # 注意：无BLAS/LAPACK时，高级功能受限

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "armadillo使用CMake构建系统，configure脚本只是wrapper"
  - "需要使用BUILD_SHARED_LIBS=ON来编译共享库(.so)，否则默认只编译静态库(.a)"
  - "CMAKE_INSTALL_PREFIX设置运行时路径，DESTDIR用于staging隔离安装"
  - "编译产物：libarmadillo.so (18K)，armadillo.pc (pkgconfig文件)"
  - "无外部BLAS/LAPACK依赖时，armadillo功能受限但可成功编译"
  - "DESTDIR模式验证流程：先staging安装验证，再本地安装"
