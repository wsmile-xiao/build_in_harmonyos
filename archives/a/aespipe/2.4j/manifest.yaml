# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS ACL 与 umask 077 冲突：umask 077 剥夺目录组权限后，HMDFS ACL 阻止 owner 写入子目录中创建的文件；修复方式为去掉 configure 中 mktemp 创建临时目录时的 umask 077"
  - "aespipe 不提供 make check 测试套，需手动功能验证"
  - "toybox sh (/bin/sh) 不支持 autotools configure 中的 bash heredoc 和复杂引用，clean-verify 需使用 bash 运行 configure"
  - "aespipe 检测到 output architecture: unknown，不使用任何优化的汇编 AES 代码（仅纯 C 实现）"

