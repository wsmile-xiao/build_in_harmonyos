# 版本级 manifest — arduinojson 7.4.2
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.4.2"

# 软件名
software: "arduinojson"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/bblanchon/ArduinoJson/archive/refs/tags/v7.4.2.tar.gz"

  # 源码校验和
  sha256: "681f703dd237f5b7f1dc1d7009a9cf246e88676b349572e73eae9154e8994a55"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ArduinoJson 7.4.2 是 header-only CMake INTERFACE 库，conan 配方用 CMakeToolchain + BUILD_TESTING=OFF 避免 conan create 触发 extras/fuzzing 链接 libclang_rt.fuzzer.a（与 OHOS libc++ 符号不匹配）(knowledge_ref: DRAFT-arduinojson-7.4.2-fuzzing-build-testing-off)"
  - "上游测试在 extras/tests（Catch 框架），cmake -DBUILD_TESTING=ON 构建后 ctest -E fuzzer 全量通过；test_package 需用 C++ 源（.cpp）否则 CMake 无法判定链接语言 (knowledge_ref: DRAFT-arduinojson-7.4.2-fuzzing-build-testing-off)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
