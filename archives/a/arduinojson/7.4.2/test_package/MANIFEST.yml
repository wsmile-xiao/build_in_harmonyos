# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: arduinojson/7.4.2
homepage: "https://arduinojson.org"

# 上游测试命令 (cmake + ctest，来自上游 extras/tests，Catch 框架)
upstream_check_command: "cmake -S . -B build -DBUILD_TESTING=ON && cmake --build build && ctest --test-dir build -E fuzzer"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (本机实测：27/27 通过)
upstream_tests:
  - file: extras/tests/JsonDocument
    source: arduinojson-7.4.2/extras/tests/JsonDocument
    description: "JsonDocument 序列化/反序列化与文档操作测试"
    command: "./JsonDocumentTests"
  - file: extras/tests/JsonDeserializer
    source: arduinojson-7.4.2/extras/tests/JsonDeserializer
    description: "JSON 反序列化测试"
    command: "./JsonDeserializerTests"
  - file: extras/tests/JsonSerializer
    source: arduinojson-7.4.2/extras/tests/JsonSerializer
    description: "JSON 序列化测试"
    command: "./JsonSerializerTests"
  - file: extras/tests/IntegrationTests
    source: arduinojson-7.4.2/extras/tests/IntegrationTests
    description: "集成测试"
    command: "./IntegrationTests"

# test_package 中自带的测试 (消费者视角验证，真实调用 ArduinoJson API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：serializeJson/deserializeJson/JsonVariant/containsKey/ARDUINOJSON_VERSION_MAJOR"
    command: "./test_arduinojson"

# 测试断言总数 (近似值；上游 Catch 测试套件包含上千条断言，此处为代表性计数)
assertion_count: 6
