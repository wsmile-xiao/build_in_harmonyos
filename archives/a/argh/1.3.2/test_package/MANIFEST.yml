# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: argh/1.3.2
homepage: "https://github.com/adishavit/argh"

# 上游测试命令
upstream_check_command: "make test"

# 上游测试集成状态
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: argh_tests.cpp
    source: argh-1.3.2/argh_tests.cpp
    description: "doctest-based unit tests (29 test cases, 367 assertions)"
    command: "./argh_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：解析命令行参数（flags/params/positionals）并验证结果"
    command: "./test_argh"

# 测试断言总数
assertion_count: 13
