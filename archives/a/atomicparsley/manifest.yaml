software: atomicparsley
# 软件级 manifest
# 文件位置: archives/a/atomicparsley/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件信息
# ============================================================

name: atomicparsley
description: "MPEG-4 文件元数据编辑器，支持 iTunes 风格元数据、3GPP 资产和 ISO 版权通知"

# 软件分类
category: multimedia

# 官方主页
homepage: https://github.com/wez/atomicparsley

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（按时间倒序）
versions:
  - version: "20240608.083822.1ed9031"
    build_date: "2026-05-21"
    status: published
    archive_path: "archives/a/atomicparsley/20240608.083822.1ed9031"
    package: "atomicparsley-20240608.083822.1ed9031-ohos-aarch64.tar.gz"
    notes: "首次编译，CMake构建系统，所有测试通过"

# ============================================================
# 构建系统信息
# ============================================================

# 支持的构建系统
build_systems:
  - cmake

# 默认构建参数
default_build_params:
  cmake:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - zlib/1.3.1

# 编译依赖
build_dependencies:
  - cmake/4.1.2
  - clang/15.0.4