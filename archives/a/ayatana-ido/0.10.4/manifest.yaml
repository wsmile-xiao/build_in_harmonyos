# 版本级 manifest — ayatana-ido 0.10.4
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10.4"

# 软件名
software: ayatana-ido

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 GitHub tag, R39)
  url: "https://codeload.github.com/AyatanaIndicators/ayatana-ido/tar.gz/refs/tags/0.10.4"

  # 源码校验和 (官方 tarball 实测 sha256, 2026-09-03)
  sha256: "bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型 (实际为 CMake; conan-init 的 autotools 自动检测不适用)
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DENABLE_TESTS=OFF"
    - "-DENABLE_WERROR=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）— 对齐 gtk/3.24.43 依赖图 (R36)
  dependencies:
    - glib/2.84.0.1
    - gtk/3.24.43
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表 (本轮无源码补丁; 适配在配方 generate()/test_package 内完成)
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake pkg_check_modules 只链接 ${PROJECT_DEPS_LIBRARIES} 时传递 -L 丢失: conanfile generate() 遍历 self.dependencies 注入全部 <package_folder>/lib 到 CMAKE_SHARED/EXE_LINKER_FLAGS (E429 草稿)"
  - "find_program 缓存断链符号链接: CMakeToolchain 显式注入 GLIB_MKENUMS 指向 glib 包内真实脚本, 绕过 /data/service/hnp/bin 的断链阐库 (E543 草稿)"
  - "glib 包 glib-2.0.pc 缺 -lintl: test_package generate() 对 PkgConfigDeps 生成的 .pc 追加 -lintl"
  - "无窗口环境 GTK 测试: 启动 gtk 包自带 broadwayd + GDK_BACKEND=broadway 无头运行 (复用 E463/E471/E527)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
