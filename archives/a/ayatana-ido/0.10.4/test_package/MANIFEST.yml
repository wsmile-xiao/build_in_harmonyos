# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ayatana-ido/0.10.4
homepage: "https://github.com/AyatanaIndicators/ayatana-ido"

# 上游测试命令: CMake 工程, ENABLE_TESTS=ON 时注册 ctest 目标 gtest-menuitems
upstream_check_command: "ctest --test-dir build -N"

# conanfile.py build() 方法中是否已集成上游测试
# (配方 ENABLE_TESTS=OFF 构建库; 上游测试在本轮适配期单独构建运行, 见下)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (gtest-menuitems, 4 个 TEST_F 独立用例)
# 本轮适配期实际运行: ENABLE_TESTS=ON 单独构建, broadway 无头后端,
# 运行输出: [ PASSED ] 4 tests (4/4 = 100%), exit 0
# 产物/日志: <build_dir>/build-ohos/tests/gtest-menuitems (r02 复验 SHA 见最终报告)
upstream_tests:
  - file: tests/gtest-menuitems.cpp
    source: ayatana-ido-0.10.4/tests/gtest-menuitems.cpp
    description: "GTK3 菜单项构件单元测试: BuildCalendar/BuildEntry/BuildScaleDefault/BuildScaleSmall (4 用例, 适配期实测 4/4 PASS)"
    command: "./gtest-menuitems --gtest_color=no"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: ido_init + ido_calendar_menu_item_new + ido_entry_menu_item_new 类型判定"
    command: "./test_ayatana-ido"

# 测试断言总数 (上游 4 用例 × 6 断言 + 消费者 2 项检查 ≈ 26)
assertion_count: 26
