# conandata.yml — ayatana-ido 0.10.4-v2
# Official upstream: https://github.com/AyatanaIndicators/ayatana-ido (tag 0.10.4)
# Same upstream revision as 0.10.4; sha256 re-verified by download 2026-09-09:
#   bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38
# filename: codeload URL has no .tar.gz suffix, conan get() cannot detect the
#           format; an explicit filename keeps tar.gz extraction (otherwise it
#           mis-detects zip and fails with BadZipFile)

sources:
  url: "https://codeload.github.com/AyatanaIndicators/ayatana-ido/tar.gz/refs/tags/0.10.4"
  filename: "ayatana-ido-0.10.4.tar.gz"
  sha256: "bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38"

patches: {}

# Vendored GTest (6th round, 2026-09-10; mirror fallback 2026-09-10):
# upstream tests need find_package(GTest REQUIRED) but no conan gtest node
# may enter the graph (CCI recipe's tool_requires pulls cmake/4.4.2 ->
# KeyError 'OHOS'). URL/sha256 reused verbatim from
# archives/g/gtest/1.17.0.1/conandata.yml (upstream googletest tag v1.17.0);
# fetched in source() into <source_folder>/googletest and built in-recipe.
# Mirror list follows ci/conan/build_and_test.sh GitHub mapping
# (gh-proxy.com first, official URL last as fallback); same sha256 for all
# entries. Preflight 2026-09-10 showed two connect-timeout retries on the
# official URL before success, so the ordered list removes the flake.
gtest_source:
  url:
    - "https://gh-proxy.com/https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz"
    - "https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz"
  filename: "googletest-v1.17.0.tar.gz"
  sha256: "65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c"
