# Version-level manifest — ayatana-ido 0.10.4-v2
# Follows ARCHIVE-SPEC v2.0

# ============================================================
# Required fields
# ============================================================

# Version
version: "0.10.4-v2"

# Software name
software: ayatana-ido

# Build status
# published | built | failed | archived
# (pending preflight confirmation; backend updates after real-device gates pass)
status: built

# Build date (YYYY-MM-DD)
build_date: "2026-09-09"
build_system: cmake

# ============================================================
# Source info
# ============================================================

source:
  # Source download URL (official GitHub tag, R39)
  url: "https://codeload.github.com/AyatanaIndicators/ayatana-ido/tar.gz/refs/tags/0.10.4"

  # Source checksum (official tarball, re-verified by download 2026-09-09)
  sha256: "bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38"

  # Archive format
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# Build configuration
# ============================================================

build:
  # Build system type
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # Configure option list
  configure_options:
    - "-DENABLE_TESTS=ON"
    - "-DENABLE_WERROR=OFF"
  # e.g.:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # Build dependency list (format: name/version) — aligned with the published
  # gtk/3.24.43 dependency graph (R36). GTest is NOT a conan dependency:
  # upstream googletest v1.17.0 source is vendored (conandata gtest_source,
  # URL/sha256 verbatim from the gtest/1.17.0.1 recipe) and built in-recipe,
  # so no external tool edge can enter the graph.
  dependencies:
    - glib/2.84.0.1
    - gtk/3.24.43
    # 以下为传递对齐 override（与 cairo/1.18.4 OHOS 闭包同版本，原子对齐防冲突；
    # 2026-09-10 起 pixman/freetype/libpng 改为 ohpcd 实测 RREV pin：
    # 三者裸版本在 conancenter 同版本共存（CCI master config.yml 实测），
    # 预检 conancenter 优先即落 CCI meson/cmake 配方（ninja/1.13.2 工具边，
    # 真机 CMakeToolchain 报 System unknown）；RREV 取自 ohpcd v2 API
    # revisions 接口实测值，非本地复算）：
    - pixman/0.46.4#09f648ede446f6abf85a98da455c7562
    - fontconfig/2.18.1.1
    - freetype/2.14.3#7e95a2b2401fd12dcbdd2bf748f56b19
    - zlib/1.3.1.1
    - libpng/1.6.58#d25df07aba0399181f60ee377e83d701
    - expat/2.8.2.1
    # CCI 工具边消除：libepoxy/1.5.10#92f7e70c459ed2e6a96cd82549e82391
    #（ohpcd 实测 RREV；gtk 直连的裸版本在双远端共存，CCI 配方经
    # tool_requires meson/1.3.1 → meson 依赖 ninja/[>=1.10.2 <2] 拉入
    # ninja/1.13.2 源码构建即本轮失败点；本仓配方零 tool_requires 且
    # 禁用 glx/egl/x11，pin 后整枝移出依赖图）
    - libepoxy/1.5.10#92f7e70c459ed2e6a96cd82549e82391
    # 子树消除已回退（第 16 轮）：gdk-pixbuf 恢复 gtk 所 pin 的 2.44.6.1
    #（发布 identity；.1.1 的版本切换迫使 gtk 源码构建并在签名处硬失败，
    # 见 conanfile 注释；libtiff 经既有 jpeg 选项对齐＋同版本 RREV 闭包处理）
    - gdk-pixbuf/2.44.6.1
    # CCI 叶子替换（第 15 轮修订）：libffi/3.4.4#ca8b0eb4102edbca48730e504e3afbdc
    #（ohpcd 实测现行 RREV，2026-07-17，与 libgsf 已验证值一致；第 9 轮的
    # 3.5.2 版本切换虽清除了 libffi 自身失败，却使 glib 依赖集偏离发布 identity
    # 致其 shared 二进制 miss 而回退源码构建，改回 glib 原生声明版本并以 RREV
    # 锁定 ohpcd 硬化配方，CCI 防护保持不变）
    - libffi/3.4.4#ca8b0eb4102edbca48730e504e3afbdc
    # CCI 竞争修复：libjpeg-turbo/3.2.0#5ed08e7ff848da8fdf6b7bca74354560
    #（ohpcd 实测 RREV，2026-07-11 发布；强制命中本仓硬化配方，避开 CCI；
    # 同 atracdenc/0.2.3 的 RREV pin 先例）
    - libjpeg-turbo/3.2.0#5ed08e7ff848da8fdf6b7bca74354560
    # CCI 子树消除：cairo/1.18.4#3894814f2279392f808090c9f3d8f200
    #（ohpcd 实测 RREV，2026-08-20；本仓配方 lzo=disabled 且对齐本图闭包，
    # 替代被 CCI 劫持的 cairo（with_lzo=True 拉入 lzo/2.10＋meson 工具边），
    # lzo 随整枝移出依赖图）
    - cairo/1.18.4#3894814f2279392f808090c9f3d8f200
    # TIFF 子树同版本 RREV 闭包（第 17 轮；版本与 libtiff 要求一致，
    # gdk-pixbuf/gtk 的 package_id 不变；RREV 均为 ohpcd 当日实测单值）：
    - libtiff/4.7.2#f386d7b671befab127228dbcfc6fe1bf
    - libdeflate/1.25#2346ca4f797e19d8d553b6f698dd8982
    - zstd/1.5.7#83364ff4f4ab63fae26fbfb89f89fefe
    - libwebp/1.6.0#8b273a5128ee70c508671933b61288ec
    - lerc/4.1.1#9c8297567326e560407157395590b2f8
    - jbigkit/2.1#872f3b26b5921c9156cb3aa4675b20c5
    - xz/5.6.2#66ce4bbd966830b5a11768474be4b259
  # e.g.:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # Compiler
  cc: clang
  cxx: clang++

# ============================================================
# Patch info
# ============================================================

# Applied patch list (no source patches this round; all adaptation lives in
# recipe generate()/build()/test_package)
patches_applied: []
# e.g.:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# Knowledge gained
# ============================================================

# Lessons learned while building
knowledge_gained:
  - "CMake pkg_check_modules links only ${PROJECT_DEPS_LIBRARIES} and drops transitive -L: conanfile generate() injects every <package_folder>/lib from self.dependencies into CMAKE_SHARED/EXE_LINKER_FLAGS (reuses E429 draft merged with 0.10.4)"
  - "find_program caching a broken symlink: CMakeToolchain injects GLIB_MKENUMS pointing at the real script inside the glib package, bypassing stale symlinks on PATH (reuses E543 draft merged with 0.10.4)"
  - "glib package glib-2.0.pc lacks -lintl: test_package generate() appends -lintl to the PkgConfigDeps-generated .pc Libs"
  - "Headless GTK tests: serve the broadway backend with broadwayd from the gtk package + GDK_BACKEND=broadway (reuses E463/E471/E527)"
  - "v2: upstream gtest suite runs inside recipe build() (ENABLE_TESTS=ON + vendored googletest built/installed in-recipe, CMAKE_PREFIX_PATH wired to the local prefix), summary parsed, HMBS_UPSTREAM_TEST_RESULT emitted; build fails on any test failure"
  - "v2: gdk-pixbuf 用 override 锁 2.44.6.1.1（关 tiff Revision，替代 gtk 所 pin 的开 tiff 版 2.44.6.1），libtiff 及其 tiff-only 伴随依赖移出依赖图"
  - "v2: test_package captures the consumer binary stdout and counts per-check OK lines for HMBS_TEST_PACKAGE_RESULT (exit-0-alone is not proof)"
