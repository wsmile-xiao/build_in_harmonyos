# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) mandates this file

package: ayatana-ido/0.10.4-v2
homepage: "https://github.com/AyatanaIndicators/ayatana-ido"

# Upstream test command: CMake project, ENABLE_TESTS=ON registers the ctest
# target gtest-menuitems (tests/CMakeLists.txt: find_package(GTest REQUIRED))
upstream_check_command: "ctest --test-dir build -N"

# Whether conanfile.py build() integrates upstream tests
# (v2: yes — build() configures ENABLE_TESTS=ON, runs tests/gtest-menuitems
# headless on broadway, parses the gtest summary and emits
# HMBS_UPSTREAM_TEST_RESULT; any failure raises and fails the build)
upstream_test_in_build: true
upstream_test_command: "./tests/gtest-menuitems --gtest_color=no (GDK_BACKEND=broadway, broadwayd :5)"

# Upstream test programs actually run (gtest-menuitems, 4 independent TEST_F)
# Source audit 2026-09-09: tests/gtest-menuitems.cpp defines BuildCalendar,
# BuildEntry, BuildScaleDefault, BuildScaleSmall (4 TEST_F, gtest framework)
upstream_tests:
  - file: tests/gtest-menuitems.cpp
    source: ayatana-ido-0.10.4/tests/gtest-menuitems.cpp
    description: "GTK3 menu item widget unit tests: BuildCalendar/BuildEntry/BuildScaleDefault/BuildScaleSmall (4 cases, run in-recipe via broadway)"
    command: "./gtest-menuitems --gtest_color=no"

# test_package bundled tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Consumer test: ido_init + ido_calendar_menu_item_new + ido_entry_menu_item_new type checks (2 checks)"
    command: "./test_ayatana-ido"

# Total test assertions (upstream 4 cases x 6 assertions + 2 consumer checks = 26)
assertion_count: 26
