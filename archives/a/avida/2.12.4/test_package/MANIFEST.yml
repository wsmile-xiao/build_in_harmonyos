package: avida/2.12.4
homepage: "https://avida.devosoft.org/"
upstream_check_command: "python3 <py3 revision of avida-core/tests/_testrunner/testrunner.py> --builddir=<build> --scm=none --testdir=<tests>"
upstream_test_in_build: false
upstream_test_command: "cmake -S <src> -B <build> -DAVD_UNIT_TESTS=ON -DAPTO_UNIT_TESTS=ON -DAVD_ENABLE_TCMALLOC=OFF -DAVD_GUI_NCURSES=OFF -DCMAKE_CXX_STANDARD=17 && cmake --build <build> -j --target unit-tests apto-test avida && <build>/bin/unit-tests && <build>/bin/apto-test && python3 <py3 revision of avida-core/tests/_testrunner/testrunner.py> --builddir=<build> --scm=none --testdir=<tests> -j4"
upstream_tests:
  - name: "avida-core unit tests"
    location: "avida-core/source/targets/unit-tests"
    build_option: "-DAVD_UNIT_TESTS=ON"
    command: "<build>/bin/unit-tests"
    cases: 47
    passed: 47
    failed: 0
  - name: "apto unit tests (GoogleTest)"
    location: "libs/apto/unittests"
    build_option: "-DAPTO_UNIT_TESTS=ON"
    command: "<build>/bin/apto-test"
    cases: 122
    passed: 122
    failed: 0
  - name: "consistency regression suite"
    location: "avida-core/tests"
    command: "python3 <py3 revision of _testrunner/testrunner.py> --builddir=<build> --scm=none --testdir=<tests> -j4"
    runner_note: "2.12.4 ships a Python-2-only runner; upstream's later Python 3 revision of the same runner reads the 2.12.4 test assets unchanged and was used as-is (plus a 2-line shim for the removed dircache module). No test case was modified."
    cases: 70
    executed: 64
    passed: 56
    failed: 1
    skipped: 7
    skipped_note: "7 cases carry 'long = yes' upstream and only run with --long-tests."
    not_run: 6
    not_run_note: "Inventoried upstream but not runnable as shipped, excluded from numerator and denominator: 4 ship no usable config, 2 are performance tests with [performance] enabled = no."
    failures:
      - test: "analyze_resize_max_batches"
        cause: "Upstream 2.12.4 test-config defect, platform independent: test_list sets 'nonzeroexit = disallow' while config/analyze_max_batches.cfg ends with 'SET_BATCH 50000', which intentionally makes avida exit(1). Upstream master changed the same test to 'nonzeroexit = require'."
upstream_tests_total:
  cases: 239
  executed: 233
  passed: 225
  failed: 1
  skipped: 7
  pass_rate: "225/226 (99.6%)"
test_package_tests:
  - file: "test.sh"
    description: "Verifies avida executes, completes a minimal simulation, and ships an AArch64 ELF on OHOS armv8."
    command: "bash test.sh"
assertion_count: 3
