# Avida minimal config for test_package consumer-case

# Basic configuration for running Avida in test mode
# These are minimal settings sufficient for a smoke test

# World dimensions
WORLD-X 50
WORLD-Y 50

# Initial population
COPY-MUT 0.0
THRESHOLD 3

# Resources
ENERGY-GRID-FLAG 0

# Maximum number of organisms
SLICING-MAX 5000

# Updates to run (minimal for testing)
END-UP 100

# Random seed
RANDOM-SEED 42
