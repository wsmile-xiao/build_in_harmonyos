sources:
  url: "https://sourceforge.net/projects/avida/files/avida-stable/2.12.4/avida-2.12.4-src.tar.gz"
  sha256: "70b4953cd7ab60c3331e7e5eb5d3c6953a72eec99ec6cb529bf638727ce39483"

patches:
  - patch_file: "patches/0001-bump-cmake-minimum-version.patch"
    patch_description: "Bump CMAKE_MINIMUM_REQUIRED from 2.6 to 3.5 in the four CMakeLists.txt (CMake 4.x rejects a minimum below 3.5)"
    patch_type: "portability"
  - patch_file: "patches/0002-disable-tcmalloc-on-ohos.patch"
    patch_description: "Skip bundled tcmalloc-1.4 on OHOS/aarch64 (its atomicops-internals-x86.h uses x86-only inline asm)"
    patch_type: "portability"
  - patch_file: "patches/0003-disable-fp-contraction-on-ohos.patch"
    patch_description: "Apply -ffp-contract=off so aarch64 does not contract a*b+c into a single-rounding fma. Upstream tries to prevent this with -mno-fused-madd, but clang rejects that flag so the upstream probe always fails and no guard is ever applied."
    patch_type: "portability"
