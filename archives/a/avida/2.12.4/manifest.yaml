version: "2.12.4"
software: "avida"
status: "built"
build_date: "2026-09-24"
build_system: "cmake"

source:
  url: "https://sourceforge.net/projects/avida/files/avida-stable/2.12.4/avida-2.12.4-src.tar.gz"
  sha256: "70b4953cd7ab60c3331e7e5eb5d3c6953a72eec99ec6cb529bf638727ce39483"
  tar_format: "tar.gz"

build:
  system: "cmake"
  cmake_options:
    - "-DAVD_ENABLE_TCMALLOC=OFF"
    - "-DAVD_GUI_NCURSES=OFF"
    - "-DAVD_UNIT_TESTS=OFF"
    - "-DAVD_TASK_EVENT_GEN=OFF"
    - "-DAVD_GUI_PROTOTYPE_TEXT=OFF"
    - "-DAPTO_UNIT_TESTS=OFF"
  dependencies:
    - "ncurses/6.5 (optional, disabled by default)"
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "0001-bump-cmake-minimum-version.patch"
  - "0002-disable-tcmalloc-on-ohos.patch"
  - "0003-disable-fp-contraction-on-ohos.patch"
  - "in-recipe source edits via conanfile.py build(): cRandom.h std::iota removal + avida_random_shuffle helper, tArray.h cstdlib, random_shuffle call sites, std::abs→llabs, apto Atomic.h __sync for aarch64, pthread_cancel removal, cString→std::string"

knowledge_gained:
  - "Avida 2.12.4 uses CMake 2.6-style build; bumped minimum to 3.5 (the lowest value CMake 4.x still accepts) for OHOS compatibility."
  - "tcmalloc-1.4 bundled with avida uses x86-only inline asm in atomicops; must skip on aarch64."
  - "On the OHOS toolchain CMake reports CMAKE_SYSTEM_NAME=HarmonyOS, so the UNIX variable is NOT set. Every upstream block guarded by IF(UNIX) is silently skipped — including the compiler-flag block in avida-core/CMakeLists.txt that would have applied -mno-fused-madd. Portability flags must therefore be injected outside IF(UNIX)."
  - "clang rejects GCC's -mno-fused-madd, so upstream's HAVE_FUSED_MADD probe can never succeed under clang. Without a guard, aarch64 contracts a*b+c into a single-rounding fma and floating-point results diverge from the x86 builds that upstream's expected files were produced with. -ffp-contract=off is clang's equivalent."
  - "C++17 removed std::random_shuffle, but std::shuffle is not a drop-in replacement: it draws through uniform_int_distribution (with rejection sampling), consuming a different number of values from avida's RNG. Because avida seeds one RNG from RANDOM_SEED, every later draw shifts and the simulation desynchronises from the expected output. Reimplementing the pre-C++17 draw pattern keeps the stream — and the expected files — valid."
  - "avida-core/tests/_testrunner/testrunner.py is Python 2 only; upstream's later revision of the same runner is Python 3 and reads the same test assets, so it can drive the 2.12.4 test tree (needs a two-line shim for the removed dircache module)."
  - "std::abs with long long int fails on newer compilers; llabs is the portable alternative."

homepage: "https://avida.devosoft.org/"
license: "GPL-3.0-only"

tests:
  upstream:
    # Full upstream inventory, then what was actually executed on OHOS aarch64
    # with the OHOS clang toolchain at C++17 (matching
    # ci/conan/profiles/ohos-aarch64).  See notes.md, "Upstream Testing".
    cases: 239
    executed: 233
    passed: 225
    failed: 1
    skipped: 7
    pass_rate: "225/226 (99.6%)"
    suites:
      - name: "avida-core unit tests"
        location: "avida-core/source/targets/unit-tests"
        build_option: "-DAVD_UNIT_TESTS=ON"
        command: "bin/unit-tests"
        cases: 47
        passed: 47
        failed: 0
      - name: "apto unit tests (GoogleTest)"
        location: "libs/apto/unittests"
        build_option: "-DAPTO_UNIT_TESTS=ON"
        command: "bin/apto-test"
        cases: 122
        passed: 122
        failed: 0
      - name: "consistency regression suite"
        location: "avida-core/tests"
        command: "python3 <py3 revision of avida-core/tests/_testrunner/testrunner.py> --builddir=<build> --scm=none --testdir=<tests> -j4"
        runner_note: "avida 2.12.4 ships a Python-2-only runner; upstream's later revision of the same runner is Python 3 and reads the 2.12.4 test assets unchanged, so it was used to drive the suite (2-line shim for the removed dircache module). No test case was modified."
        cases: 70
        executed: 64
        passed: 56
        failed: 1
        skipped: 7
        skipped_note: "7 cases carry 'long = yes' upstream and only run with --long-tests."
        not_run: 6
        not_run_note: "Inventoried by upstream but not runnable as shipped, so excluded from both numerator and denominator: bgs_dyn_mutrates_births / bgs_dyn_mutrates_fit / bgs_dyn_mutrates_rank / default_transsmt_100u ship no usable config; heads_perf_1000u / heads_perf_1000u_rate are performance tests with [performance] enabled = no."
        failures:
          - test: "analyze_resize_max_batches"
            cause: "Upstream 2.12.4 test bug, platform independent: test_list declares 'nonzeroexit = disallow', while config/analyze_max_batches.cfg deliberately ends with 'SET_BATCH 50000', which makes avida print 'Error: max batches is 50000' and exit(1). Upstream master later changed this same test to 'nonzeroexit = require' and dropped the extra arguments, confirming it is a test-configuration defect."
    reproducibility: "consistency-suite results verified identical over 3 consecutive runs."
  adapted:
    command: "test_package/test.sh"
    cases: 3
    passed: 3
    pass_rate: "3/3 (100%)"

notes:
  - "Avida 2.12.4 是数字进化平台，包含 apto 库、tcmalloc-1.4 和 avida-core 三部分。"
  - "OHOS 适配关闭了 tcmalloc（x86 专属内联汇编）和 ncurses 图形界面，仅保留命令行 avida 可执行文件；上游单元测试目标同样默认关闭，不随包分发。"
  - "上游一致性套件（avida-core/tests）并非不可运行：在 OHOS aarch64 上实跑 64 例，56 通过、7 例因标记 long 跳过、1 例失败。唯一失败项 analyze_resize_max_batches 是上游 2.12.4 自身的测试配置缺陷（详见 tests.upstream.suites[2].failures）。"
  - "上游单元测试需以 -DAVD_UNIT_TESTS=ON / -DAPTO_UNIT_TESTS=ON 单独构建后执行，已实跑 47/47 与 122/122 全部通过；这两个目标不随包分发，故 manifest 的 cmake_options 保持 OFF。"
