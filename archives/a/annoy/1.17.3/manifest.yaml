build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.15"
  dependencies: []
  test_dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

code_adaptations:
  - "package_type: header-library（上游 CMakeLists.txt 本身即 INTERFACE 目标），上游安装规则原样安装 include/annoy/{annoylib.h,kissrandom.h,mman.h} 并导出 Annoy::Annoy"
  - "package_info 声明系统库 m 与 pthread：annoylib.h 在 ANNOYLIB_MULTITHREADED_BUILD 下使用 std::thread/std::shared_mutex，且 sqrt/log 需要 libm"
  - "configure() 固定 cppstd=14，与上游 setup.py 的 -std=c++14 一致"
  - "CMAKE_POLICY_VERSION_MINIMUM=3.15 与上游 cmake_minimum_required(3.15...3.25) 对齐"
  - "build() 中编译并执行上游 C++ 示例 examples/precision_test.cpp 作为上游测试（上游无 CTest 套件）"

test_results:
  profile: "ohos-aarch64-run"
  upstream_framework: "上游 C++ 示例 examples/precision_test.cpp（无 CTest 套件）"
  upstream_command: "annoy_precision_test 8 2000"
  upstream_query_iterations: 1000
  upstream_passed: true
  upstream_exit_code: 0
  upstream_precision_limit10: "95.93%"
  upstream_precision_limit100: "100.00%"
  upstream_precision_limit1000: "100.00%"
  upstream_precision_limit10000: "100.00%"
  test_package_passed: 3025
  test_package_failed: 0

test_passed: 3025
test_failed: 0

verified:
  target: "OpenHarmony 6.0 aarch64"
  sdk: "6.0"
  compiler: "OHOS Clang 15.0.4"
  date: "2026-10-01"
  evidence: "conan create -pr:h=ohos-aarch64-local rc=0（多 token emulator：qemu-aarch64-static;-L;<runroot>，修复前会被整体加引号而 not found）；上游示例 examples/precision_test 8 2000 rc=0；消费者用例经同一 emulator 显式执行：annoy_consumer_angular 1012 checks/0 failed、annoy_consumer_ondisk 2013 checks/0 failed（合计 3025 checks；ELF aarch64 static，经 qemu+OHOS runroot 执行）"

knowledge_gained:
  - "annoy 是纯头文件库（annoylib.h），上游 CMakeLists.txt 即 INTERFACE 目标，无编译库产物"
  - "上游 test/*.py 的 107 个 pytest 用例全部驱动 CPython 扩展模块 annoymodule.cc，不适用于 C++ 包；C++ 侧上游验证入口是 examples/precision_test.cpp"
  - "annoylib.h 的落盘索引使用 POSIX <sys/mman.h>，OHOS musl sysroot 直接提供，无需补丁"
  - "AnnoyIndexMultiThreadedBuildPolicy 仅在定义 ANNOYLIB_MULTITHREADED_BUILD 时可见，消费者需自行定义并链接 pthread"
  - "零依赖、零补丁 —— 头文件库最简迁移场景"
