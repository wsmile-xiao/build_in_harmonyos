# test_package/MANIFEST.yml — annoy/1.17.3
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md

package: annoy/1.17.3
homepage: "https://github.com/spotify/annoy"

# annoy is a header-only C++ template library: the whole search implementation
# is src/annoylib.h. Upstream ships no CTest suite. Its 107 pytest functions in
# test/*.py all drive the CPython extension module (src/annoymodule.cc), which
# is a Python binding and not part of the C++ library surface, so they cannot
# run against this package. The upstream C++ entry point that exercises
# annoylib.h is examples/precision_test.cpp; it is compiled with the OHOS
# toolchain and executed through the profile emulator.
upstream_check_command: "N/A (header-only; upstream has no CTest suite)"
upstream_test_in_build: true
upstream_test_command: "examples/precision_test 8 2000"

upstream_tests:
  - "examples/precision_test.cpp (upstream C++ example: build index + 1000 precision queries over 4 search_k limits)"

test_package_tests:
  - file: test_angular.cpp
    description: "Consumer e2e: Annoy::Angular build, item/vector queries vs. brute-force ground truth, metric and item round-trip invariants"
    command: "./annoy_consumer_angular"
  - file: test_ondisk.cpp
    description: "Consumer e2e: multithreaded build policy, save()/load() mmap on-disk round-trip returning identical neighbours"
    command: "./annoy_consumer_ondisk"

# The upstream example runs 1000 query iterations x 4 search_k limits.
upstream_test_count: 1
upstream_query_iterations: 1000
test_package_test_count: 2
assertion_count: 3025  # angular 1012 + ondisk 2013 (measured under qemu)
