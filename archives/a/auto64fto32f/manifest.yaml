software: auto64fto32f
display: "Auto64Fto32F"
description: >-
  A minimalist library for converting double (64-bit) numerical Java code
  into float (32-bit) source code
category: build-tool
homepage: "https://github.com/lessthanoptimal/Auto64Fto32F"
license: "Unlicense OR MIT"
build_system: gradle

ohos_adaptation:
  key_points:
    - "纯 Java 源码，绕开 Gradle 直接用 bishengjdk javac 编译打包 JAR"
    - "上游 JUnit 4 测试（4 个 @Test）在 build() 中经 JUnitCore 实际运行"
    - "junit/hamcrest 从 Maven Central 下载并做 sha256 校验"
    - "运行时需要 JDK 17+（bishengjdk17）"
  common_dependencies:
    - junit
    - hamcrest

versions:
  "2.1":
    status: built
    build_date: "2026-08-25"
    conan_ref: "auto64fto32f/2.1"
