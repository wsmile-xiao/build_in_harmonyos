# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: auto64fto32f/2.1
homepage: "https://github.com/lessthanoptimal/Auto64Fto32F"

# 上游测试在 conanfile.py build() 中运行：
# javac 编译 test/com/peterabeles/auto64fto32f/TestAugmentJavaFiles.java 后，
# 用 org.junit.runner.JUnitCore 执行（junit-4.12 + hamcrest-core-1.3，Maven Central）
upstream_check_command: "$JAVA_HOME/bin/java -cp <classes:test-classes:junit-4.12.jar:hamcrest-core-1.3.jar> org.junit.runner.JUnitCore com.peterabeles.auto64fto32f.TestAugmentJavaFiles"
upstream_test_in_build: true
upstream_test_command: "$JAVA_HOME/bin/java -cp <classes:test-classes:junit-4.12.jar:hamcrest-core-1.3.jar> org.junit.runner.JUnitCore com.peterabeles.auto64fto32f.TestAugmentJavaFiles"

# 上游 JUnit 4 测试用例（在 build() 中运行）
# 统计来源：test/com/peterabeles/auto64fto32f/TestAugmentJavaFiles.java
# 1 个测试 .java 文件，4 个 @Test 方法（standardClass / standardInterface /
# alreadyGenerated / withoutImport）
upstream_tests:
  - file: test/com/peterabeles/auto64fto32f/TestAugmentJavaFiles.java
    source: Auto64Fto32F-2.1.tar.gz/test/com/peterabeles/auto64fto32f/
    description: "上游 JUnit 4 测试套件（4 个 @Test 方法），build() 中经 JUnitCore 实际执行"
    command: "java org.junit.runner.JUnitCore com.peterabeles.auto64fto32f.TestAugmentJavaFiles"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "编译并运行 TestAuto64Fto32F.java，调用 AugmentJavaFiles/ConvertFile32From64/RecursiveConvert API (R34 实质性验证)"
    command: "bash test.sh"

# 测试断言总数
# 上游：4 个 @Test 方法（在 build() 中经 JUnitCore 运行）
# test_package：6 个功能检查（@Generated 注入 / 幂等 / 默认替换 / CUSTOM ignore /
# RecursiveConvert 端到端 / Language 后缀）+ 1 PASS 汇总
assertion_count: 10
