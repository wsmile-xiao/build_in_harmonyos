version: "2.1"
software: "auto64fto32f"
status: built
build_date: "2026-08-25"
conan_ref: "auto64fto32f/2.1"

source:
  url: "https://github.com/lessthanoptimal/Auto64Fto32F/archive/refs/tags/v2.1.tar.gz"
  sha256: "de506eb7a29d9d54b5ec1f0ec97937e34200b616d3a908cb48d0004f80935de3"
  tar_format: tar.gz

build:
  system: javac (custom; upstream Gradle 6.4.1 绕开)
  configure_options: []
  dependencies:
    - "BiSheng JDK 17 (javac/java/jar, cmd-pkgs install-jdk.sh 可自动安装)"
    - "junit 4.12 (测试期, Maven Central)"
    - "hamcrest-core 1.3 (测试期, Maven Central)"
  cc: ""
  cxx: ""

patches_applied: []

upstream_tests:
  framework: "JUnit 4 (org.junit.runner.JUnitCore)"
  test_files: 1
  test_methods: 4
  test_command: "$JAVA_HOME/bin/java -cp <classes:test-classes:junit:hamcrest> org.junit.runner.JUnitCore com.peterabeles.auto64fto32f.TestAugmentJavaFiles"
  run_in_build: true

knowledge_gained:
  - "纯 Java 库绕开 Gradle：上游 build.gradle 只是普通 java 插件 + jar 任务，用 bishengjdk 的 javac --release 11 直接编译 src/ 等价且更快更稳"
  - "上游 JUnit 测试不经构建系统也能跑：javac 单文件编译 test/ 后用 org.junit.runner.JUnitCore 运行，junit/hamcrest 从 Maven Central 下载（conandata.yml 自定义 test_dependencies 键 + sha256 校验 + 阿里云镜像回退）"
  - "HMBS 门禁数字取自 JUnitCore 自身输出：成功 'OK (N tests)'，失败 'Tests run: N,  Failures: M'；汇总行缺失即拒绝放行，杜绝静默跳过"
  - "auto64fto32f 上游无 main class，产物是被构建脚本引用的代码生成库 JAR，不需要 commands.json (R38)"
  - "R32: validate() 检查 settings.os in (Linux, OHOS)；R34: test_package 实际调用 AugmentJavaFiles/ConvertFile32From64/RecursiveConvert API"
