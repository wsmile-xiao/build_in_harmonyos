software: aircrack-ng
# 版本级 manifest
# 文件位置: archives/a/aircrack-ng/1.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.7"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.aircrack-ng.org/aircrack-ng-1.7.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "-DSTATIC_BUILD"
    - "-DCACHELINE_SIZE=64"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "openssl/3.0"
    - "zlib/1.3"

  # 编译器
  cc: gcc
  cxx: g++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-version-h.patch"
  - "0002-static-build.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "STATIC_BUILD选项：禁用动态加载，直接链接静态函数"
  - "autotools依赖：automake perl模块缺失导致无法运行autogen.sh"
  - "手动编译方案：创建简化Makefile编译核心库"
  - "HarmonyOS SDK问题：sockaddr_storage重复定义，使用dummy.c替代linux.c"
  - "版本宏定义：需要手动创建version.h定义_MAJ/_MIN/_REVISION等宏"
  - "CACHELINE_SIZE：需定义为64（CPU L1 cache-line size）"
  - "OpenSSL API变更：SHA1_Init/Update/Final已废弃（OpenSSL 3.0）"

# ============================================================
# 编译结果
# ============================================================

compiled_tools:
  - name: "aircrack-ng"
    status: "success"
    description: "WEP/WPA-PSK密钥破解工具"
    size: "232064 bytes"
  - name: "kstats"
    status: "success"
    description: "显示IVS文件中的密钥统计信息"
    size: "27008 bytes"
  - name: "makeivs-ng"
    status: "success"
    description: "生成测试用的IVS文件"
    size: "35264 bytes"