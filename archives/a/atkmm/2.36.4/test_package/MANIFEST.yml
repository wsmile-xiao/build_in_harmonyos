# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: atkmm/2.36.4
homepage: "https://gitlab.gnome.org/GNOME/atkmm"

# 上游测试命令 (meson test)
# atkmm 2.36.4 的 meson 未注册 test()：tarball 无 tests/ 目录，
# 无 meson.build 入口，无上游 meson 测试可执行（与 pangomm 2.50.1 同款）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (atkmm 2.36.4 meson 无注册测试；0 个)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：Atk::init + Object role/name 访问器 + StateSet + Relation + 版本宏（真实编译链接运行）"
    command: "./test_probe"

# 测试断言总数（test.cpp 中 check 调用：版本宏 3 项 + wrap 非空 1 项 +
# set/get_name 1 项 + role 1 项 + StateSet 6 项 + Relation 2 项 = 14 项；
# 实测运行输出 13 checks（check() 计数 g_checks 输出为准））
assertion_count: 13
