# test_package/MANIFEST.yml
# 上游官方测试声明文件
# atomix 0.0-git7c75a1602e — header-only 库，上游无构建系统
# （无 CMakeLists / Makefile / Autotools，仅有单文件 atomix.h + 示例 test.c）

package: atomix/0.0-git7c75a1602e
homepage: "https://github.com/BareRose/atomix"

# 上游无任何构建系统 → 无 make check / ctest -N / meson test --list
upstream_check_command: "none (no build system; upstream compiles example with 'gcc -O2 test.c -o test.exe')"

# conanfile.py build() 中未集成上游测试（header-only，无编译阶段）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：唯一入口为 test.c（CLI 示例/基准，依赖 mu.ogg/so.ogg
# 与 libs/miniaudio.h、libs/stb_vorbis.h 聚合头，无断言框架、无自动判定）
upstream_tests:
  - file: test.c
    source: atomix-0.0-git7c75a1602e/test.c
    description: "上游 CLI 示例/基准（benchmark demo，非断言型单元测试；编译运行依赖 .ogg 素材与可选聚合头，属上游示例，不作为独立用例计入）"
    command: "gcc -O2 test.c -o test.exe (示例，不计入上游用例数)"

# test_package 中自带的测试 (消费者视角验证，真实调用公开 API)
test_package_tests:
  - file: test.c
    description: "消费者测试：atomixSoundNew/atomixSoundLength/atomixMixerNew/atomixMixerPlay/atomixMixerMix/atomixMixerStopAll/atomixMixerSetGainPan 公开 API 调用与可观察输出断言"
    command: "./test_atomix"

# 测试断言总数 (近似值, 用于质量评估)：消费者测试 7 项 CHECK 断言
assertion_count: 7
