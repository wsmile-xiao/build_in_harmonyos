# test_ohos/MANIFEST.yml — atomix 0.0-git7c75a1602e HarmonyOS PC 专项验证
# 五项独立鸿蒙检查（run_ohos_test.py，任一失败非零退出）：
#   T1_aarch64_elf    ELF64 AArch64（readelf -h）
#   T2_musl_no_glibc  musl libc, 无 GLIBC 符号版本, 无 ld-linux
#   T3_codesign       .codesign 段存在（OHOS 签名管线）
#   T4_no_host_paths  无宿主绝对路径 / 无 RPATH-RUNPATH
#   T5_real_mixing    真实混音计算：构建声道数据 -> 播放 -> 混音可听 -> 停止淡出后全静音
checks:
  - id: T1_aarch64_elf
    desc: ELF64 AArch64 (readelf -h)
  - id: T2_musl_no_glibc
    desc: musl libc, no GLIBC symbol versions, no ld-linux
  - id: T3_codesign
    desc: .codesign section present (OHOS signing pipeline)
  - id: T4_no_host_paths
    desc: no absolute host paths, no RPATH/RUNPATH
  - id: T5_real_mixing
    desc: real mixing computation (sound->play->mix audible->stop fade silence)
assertion_count: 9
assertion_count_note: 5 machine checks + 4 in-program assertions (T5: sound/play/mix-audible/stop-silence)
test_language: c
test_framework: bare
framework_flavor: bare