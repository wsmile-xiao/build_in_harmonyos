# 知识沉淀
# ============================================================

knowledge_gained:
  - "header-only 库 conanfile 必须用 package_type=header-library，否则 conan create 报 no shared option"
  - "header-only 库 package() 复制头文件时 dst 必须显式 join(package_folder, 'include')，相对路径会落入 build 目录导致消费者找不到 include"
  - "atomix (BareRose) 混音库在 aarch64 上必须定义 ATOMIX_NO_SSE：xmmintrin.h 仅 x86/x64；上游文档化选项，功能不受影响"
  - "atomixMixerStopAll 触发自动淡出（fade 帧内音量渐弱），断言静音须先耗尽 fade 窗口再检查输出"
  - "atomixMixerMix 的 fnum 是帧数，双声道每帧 2 个 float，512 帧需 1024 float 输出缓冲"