# 版本级 manifest — asciitex 0.32
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.32"

# 软件名
software: "asciitex"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-24"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/larseggert/asciiTeX/archive/refs/tags/asciiTeX-0.32.tar.gz"

  # 源码校验和
  sha256: "89b96405d413278bee287690dc3aff345a14c03d2fc2f4f4f4ff3a60c6a0a837"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DDISABLE_TESTING=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMakeLists.txt uses cmake_minimum_required(VERSION 3.0) which fails with CMake 4.x; needs CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "CMake POST_BUILD commands execute the binary during build, which fails on OHOS due to unsigned ELF; set DISABLE_TESTING=ON"
  - "Default lld linker has broken libxml2.so.16 dependency on OHOS; fall back to GNU ld via -fuse-ld flag"
  - "asciitex is a pure C application with no external dependencies (W0 trivially satisfied)"
