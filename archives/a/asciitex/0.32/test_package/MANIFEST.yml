# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file
#
package: asciitex/0.32
homepage: "http://asciitex.sourceforge.net/"

# Upstream test command (from CMakeLists.txt: ctest compares output)
upstream_check_command: "ctest"

# conanfile.py build() method integrates upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (CMakeLists.txt ctest: compares asciitex output on .tex files)
upstream_tests:
  - file: examples/eq1.tex
    source: asciiTeX-0.32/examples/eq1.tex
    description: "Render eq1.tex and compare with expected eq1.txt"
    command: "asciitex -f examples/eq1.tex"
  - file: examples/eq2.tex
    source: asciiTeX-0.32/examples/eq2.tex
    description: "Render eq2.tex and compare with expected eq2.txt"
    command: "asciitex -f examples/eq2.tex"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_asciitex.sh
    description: "Execute asciitex -v to verify binary is installed and functional"
    command: "sh test_asciitex.sh"

# Approximate assertion count
assertion_count: 2
