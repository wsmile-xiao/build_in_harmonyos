software: asciitex
display: "asciiTeX"
description: "ASCII方程渲染器，将LaTeX数学公式转换为ASCII艺术文本"
category: math
homepage: "http://asciitex.sourceforge.net/"
license: GPL-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMakeLists.txt使用cmake_minimum_required(VERSION 3.0)，CMake 4.x需设置CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "CMake POST_BUILD命令在构建时执行二进制，OHOS上未签名ELF无法执行，需设置DISABLE_TESTING=ON"
    - "默认lld链接器有libxml2.so.16依赖问题，需回退到GNU ld"
    - "纯C项目，无外部依赖（W0 trivially satisfied）"
  common_dependencies: []

versions:
  - version: "0.32"
    status: built
    build_date: "2026-08-24"
