software: asciitex
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.21/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.21"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/asciitex/asciiTeX-0.21.tar.gz"

  # 源码校验和
  sha256: "abf964818833d8b256815eb107fb0de391d808fe131040fb13005988ff92a48d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-gtk"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-src-asciiTeX.c.patch"
  - "0002-src-asciiTeX_struct.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "SYNTAX_ERR_FLAG 在头文件中定义为全局变量，多文件包含导致重复符号，需改为 extern 声明 (ref: software-specific)"
  - "configure 默认启用 GTK GUI 模式，需 --disable-gtk 跳过 GTK2 依赖 (ref: software-specific)"
  - "HMDFS 文件系统下 umask 077 导致文件不可读，需修改为 umask 022 (ref: E081)"
  - "终端工具无库文件，cpp_info.libs 应为空，使用 bindirs 暴露二进制路径 (ref: software-specific)"

patch_generation:
  method: per-file-difflib
