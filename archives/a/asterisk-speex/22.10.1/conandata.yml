sources:
  "22.10.1":
    url: "https://downloads.asterisk.org/pub/telephony/asterisk/asterisk-22.10.1.tar.gz"
    sha256: "0953564c44fa49827f3c9d70ca6e80db83828c9848440852c6be44c961855353"

patches:
  "22.10.1":
    - patch_file: "patches/0001-config.guess.patch"
      patch_description: "config.guess: umask 022 temp dirs + recognize HarmonyOS (aarch64-unknown-linux-ohos)"
      patch_type: "portability"
    - patch_file: "patches/0002-configure.patch"
      patch_description: "configure: umask 022 temp dirs (HMDFS rejects 0600) + disable BlocksRuntime requirement on OHOS clang"
      patch_type: "portability"
    - patch_file: "patches/0003-include-asterisk-astmm.h.patch"
      patch_description: "Default ASTMM_LIBC to ASTMM_IGNORE so astmm.h never poisons libc allocator names (portable, no platform macros)"
      patch_type: "portability"
    - patch_file: "patches/0004-include-asterisk-utils.h.patch"
      patch_description: "RAII_VAR blocks branch only under __BLOCKS__ (no blocks on OHOS)"
      patch_type: "portability"
    - patch_file: "patches/0005-menuselect-config.guess.patch"
      patch_description: "menuselect config.guess: umask 022 temp dirs + recognize HarmonyOS"
      patch_type: "portability"
    - patch_file: "patches/0006-menuselect-config.sub.patch"
      patch_description: "menuselect config.sub recognize ohos-linux triplet"
      patch_type: "portability"
    - patch_file: "patches/0007-menuselect-configure.patch"
      patch_description: "menuselect configure: umask 022 temp dirs (HMDFS rejects 0600)"
      patch_type: "portability"
