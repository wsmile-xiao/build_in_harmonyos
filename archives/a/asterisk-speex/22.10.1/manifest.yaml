software: asterisk-speex
version: "22.10.1"
status: published
build_date: "2026-08-23"
build_system: autotools
source:
  url: "https://downloads.asterisk.org/pub/telephony/asterisk/asterisk-22.10.1.tar.gz"
  sha256: "0953564c44fa49827f3c9d70ca6e80db83828c9848440852c6be44c961855353"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--build=x86_64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--without-pjproject"
    - "--with-pjproject-bundled=no"
    - "--with-speex=<private prefix>"
    - "--with-speexdsp=<private prefix>"
  dependencies:
    required:
      - speex/1.2.1        # libspeex — via ohpcd
      - speexdsp/1.2.1     # libspeexdsp (speex_preprocess_ctl) — via ohpcd
      - libedit/20240808   # Asterisk configure 硬依赖（pkg-config 探测）
      - libxml2/2.15.3     # menuselect 子 configure 硬依赖
      - ncurses/6.6        # libedit.pc Libs.private=-ltinfo
      - e2fsprogs/1.47.4   # libuuid（Asterisk configure 硬依赖 uuid_generate_random）
      - jansson/2.15.1.1   # Asterisk configure 硬依赖（>= 2.11）
      - sqlite3/3.49.1     # Asterisk configure 硬依赖（内部数据库）
patches_applied:
  - "0001-config.guess.patch"             # config.guess 识别 HarmonyOS triplet
  - "0002-configure.patch"                # configure umask 022 + BlocksRuntime 禁用（OHOS clang 无 blocks runtime）
  - "0003-include-asterisk-astmm.h.patch" # ASTMM_LIBC 默认改 IGNORE（astmm.h 不再毒化 libc 分配器名）
  - "0004-include-asterisk-utils.h.patch" # RAII_VAR blocks 分支仅在 __BLOCKS__ 下启用
  - "0005-menuselect-config.guess.patch"  # menuselect config.guess 识别 HarmonyOS triplet
  - "0006-menuselect-config.sub.patch"    # config.sub 识别 ohos-linux triplet
  - "0007-menuselect-configure.patch"     # menuselect configure umask 022
notes: >
  仅打包 codecs/codec_speex.so 模块（Speex 编解码器）。构建在 build_folder/worktree
  工作目录进行（规避 HMDFS 对 conan 进程树 config.status 临时文件的 MAC 限制，
  E052/E060）；configure/menuselect configure 运行时把 umask 077 改为 022（HMDFS
  拒绝 0600 临时文件）；speex+speexdsp 通过 --with-speex/--with-speexdsp 注入私有
  prefix（AST_EXT_LIB_CHECK 直接 -I/-L，不走 pkg-config）；libedit/libuuid/jansson/
  sqlite3 为 Asterisk configure 硬依赖，libxml2 为 menuselect 子 configure 硬依赖，
  均从 ohpcd 依赖包复制 include/lib/pkgconfig 到私有 prefix 并改写 .pc 的 prefix。
  format_ogg_speex 被 menuselect.makeopts 排除（需 <ogg/ogg.h>/libogg）；func_speex
  不在构建范围（仅编译 codecs/ 子目录）。产物拷回 source_folder 后打包。

