software: affiche
version: "0.6.0"
status: adapted
build_date: "2026-09-06"
build_system: gnustep-make

source:
  url: "https://deb.debian.org/debian/pool/main/a/affiche/affiche_0.6.0.orig.tar.gz"
  sha256: "4bb170c4c33cc84cc5ecb87c02395154426f4dd9d9e3a97d45782317b70e1de4"
  tar_format: tar.gz
  source_note: "Debian copyright says the source is only available from Debian."

build:
  system: gnustep-make
  configure_options: []
  dependencies:
    required:
      - "gnustep-make/2.9.2"
      - "gnustep-gui/0.31.1"
    transitive:
      - "gnustep-base/1.31.1"
      - "libobjc2/2.2.1"
    optional:
      - "imagemagick/7.1.2.29 (Debian icon conversion helper; not required for upstream app build)"
  cc: clang
  cxx: clang++

patches_applied: []

tests:
  upstream_test_present: false
  consumer_test: "Bundle-layout smoke test in test_package"

validation:
  static:
    status: passed
    checks:
      - "Downloaded and verified the Debian source tarball against the dsc sha256."
      - "Confirmed upstream is a GNUstep Make application with a top-level GNUmakefile."
      - "Confirmed there is no configure/CMake/Meson front-end and no upstream check target."
      - "Confirmed gnustep-gui 0.31.1 is visible in the Conan registry and satisfies the Affiche 0.6.0 GNUstep GUI build."
  local_build:
    status: passed
    command: "conan create archives/a/affiche/0.6.0 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 --build=missing"
    result: "Passed on HarmonyOS device 10.62.220.52 with test_package bundle smoke test."
  ci:
    status: passed
    command: "TMPDIR=/storage/Users/currentUser/tmp TMP=/storage/Users/currentUser/tmp TEMP=/storage/Users/currentUser/tmp TMPPREFIX=/storage/Users/currentUser/tmp/zsh CI_PACKAGES=\"archives/a/affiche/0.6.0\" zsh ci/conan/build_and_test.sh"
    result: "L0/L1/L4/L5 passed; L2 skipped because Affiche is a GUI app without --version/--help."

notes:
  - "Affiche installs as a GNUstep bundle under share/GNUstep/Affiche.app."
  - "The recipe keeps the package scoped to archives/a/affiche/0.6.0/ only."
  - "ImageMagick is a Debian packaging helper for icon conversion, not part of the upstream build path."
  - "test_package verifies bin/Affiche plus the bundle tree and representative resources instead of launching the GUI headlessly."
