software: acme-tiny
# 版本级 manifest
# 文件位置: archives/a/acme-tiny/5.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.0.1"

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-22"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/acme-tiny-5.0.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型：Python 包使用 setuptools
  system: setuptools
  build_system: setuptools

  # Python 包安装命令
  configure_options:
    - "python3 setup.py install --prefix=$DEFAULT_PREFIX"

  # 运行时依赖
  dependencies:
    - "python3/3.12.8"
    - "openssl/3.5.6"

  # 不需要编译器（纯 Python）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# Python 脚本不需要补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 Python 脚本使用 setuptools 安装，不需要传统编译"
  - "需要 openssl 命令行工具作为运行时依赖"