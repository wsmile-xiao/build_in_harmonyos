software: aamath
display: "aamath"
description: "ASCII 艺术数学表达式渲染器，将数学公式以纯文本 ASCII 字符绘制"
category: math
homepage: ""
license: GPLv2
build_system: makefile

ohos_adaptation:
  key_points:
    - "无 configure 脚本，纯 Makefile 项目，需手动修改 Makefile.good"
    - "需用 -lncurses 替代 -ltermcap"
    - "需添加 -I$DEFAULT_PREFIX/include 以找到 readline 头文件"
    - "bison 3.8+ 生成文件名与旧 Makefile 规则不兼容，需适配"
    - "原始 Makefile 无 install target，需添加 DESTDIR/PREFIX 支持"
  common_dependencies:
    - readline
    - ncurses

versions:
  - version: "0.3.1"
    status: built
    build_date: "2026-08-05"
