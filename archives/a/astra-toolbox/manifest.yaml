software: astra-toolbox
display: "ASTRA Toolbox"
description: "High-performance GPU primitives for 2D/3D tomography (FBP, SIRT, SART, CGLS)"
category: library
homepage: "https://www.astra-toolbox.com/"
license: GPL-3.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools 构建位于 build/linux，需先 autogen.sh 生成 configure"
    - "CUDA/MATLAB/Python 均为可选，OHOS 默认 --with-cuda=no --without-matlab --without-python 仅构建 libastra"
    - "无外部 Conan 依赖，零依赖库"
  common_dependencies: []

versions:
  "2.3.0":
    status: pending
    build_date: "TBD"
    source_url: "https://github.com/astra-toolbox/astra-toolbox/archive/refs/tags/v2.3.0.tar.gz"
