software: acme-client
name: acme-client
version: 0.1.16
category: network
description: ACME client for Let's Encrypt certificate management (acme-client-portable master branch)
license: ISC
url: https://github.com/kristapsdz/acme-client-portable
dependencies:
  - libressl (>= 3.9.2)
configure_options: "STATIC=1 PREFIX=/storage/Users/currentUser/usr/local"
build_system: make
status: built
compiled_at: "2026-05-22"
compiled_by: "AI Agent"
notes: |
  针对OpenHarmony (musl libc)的适配:

  LibreSSL 3.9.2依赖:
  - 使用静态链接（动态库在OpenHarmony上加载问题）
  - 需要LibreSSL静态库: libtls.a, libssl.a, libcrypto.a

  API适配修改（LibreSSL 3.x/OpenSSL 3.x兼容）:
  - acctproc.c: RSA_get0_key()替代直接访问RSA结构体成员
  - certproc.c: BIO_number_written()替代bio->num_write
  - keyproc.c: EVP_PKEY_base_id()替代pkey->type
  - rsa.c: EVP_PKEY_base_id()适配
  - revokeproc.c: X509_get_ext_count(), BIO_number_written()适配
  - config.h: getprogname()实现（musl libc使用__progname）
  - extern.h/main.c: extern变量声明修正

  编译参数:
  - CFLAGS="-I/storage/Users/currentUser/usr/local/include -DMUSL_LIBC"
  - LDFLAGS="-L/storage/Users/currentUser/usr/local/lib"
  - STATIC=1 静态链接LibreSSL