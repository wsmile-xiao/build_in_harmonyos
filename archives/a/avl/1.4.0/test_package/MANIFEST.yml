# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: avl/1.4.0
homepage: "https://www.gnu.org/software/avl/"

# 上游测试命令 (make check)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (TESTS = avl-test avlt-test avltr-test thread-test rb-test)
# 实测: make check → "All 5 tests passed" (PASS: avl-test / avlt-test / avltr-test / thread-test / rb-test)
upstream_tests:
  - file: avl-test.c
    source: avl-1.4.0/avl-test.c (BUILT_SOURCES, 由 avl.texinfo 生成)
    description: "AVL 树基础功能测试 (create/insert/delete/walk, 1024 轮随机种子)"
    command: "./avl-test"
  - file: avlt-test.c
    source: avl-1.4.0/avlt-test.c (BUILT_SOURCES)
    description: "AVL 树线程安全变体 (avltr) 基础功能测试"
    command: "./avlt-test"
  - file: avltr-test.c
    source: avl-1.4.0/avltr-test.c (BUILT_SOURCES)
    description: "AVL 树可重入变体 (avltr) 基础功能测试"
    command: "./avltr-test"
  - file: thread-test.c
    source: avl-1.4.0/thread-test.c
    description: "线索化 AVL 树 (avltr) 遍历测试"
    command: "./thread-test"
  - file: rb-test.c
    source: avl-1.4.0/rb-test.c (BUILT_SOURCES)
    description: "红黑树 (rb) 基础功能测试 (1024 轮随机种子)"
    command: "./rb-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: create/insert/count/find/delete/destroy 断言"
    command: "./test_avl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16
