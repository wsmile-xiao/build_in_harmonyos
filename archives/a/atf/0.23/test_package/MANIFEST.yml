# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: atf/0.23
homepage: https://github.com/freebsd/atf

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 行为说明:
# atf 的 make check 只编译和链接 bootstrap 测试程序 (EXIT_CODE=0)，不执行测试用例。
# 实际执行需要手动运行各测试程序或通过 kyua 运行。
# 手动执行结果记录在 reports/test-execution.log 中。

# make check 编译的 bootstrap 测试程序
upstream_tests:
  - name: "h_tp_basic_c"
    source: atf-0.23/bootstrap/h_tp_basic_c.c
    description: "Bootstrap C 测试程序 (4 用例: pass/fail/skip/default)"
    command: "bootstrap/h_tp_basic_c"
  - name: "h_tp_basic_cpp"
    source: atf-0.23/bootstrap/h_tp_basic_cpp.cpp
    description: "Bootstrap C++ 测试程序 (4 用例: pass/fail/skip/default)"
    command: "bootstrap/h_tp_basic_cpp"
  - name: "h_tp_basic_sh"
    source: atf-0.23/bootstrap/h_tp_basic_sh.sh
    description: "Bootstrap Shell 测试程序 (4 用例: pass/fail/skip/default)"
    command: "bootstrap/h_tp_basic_sh"
  - name: "h_tp_atf_check_sh"
    source: atf-0.23/bootstrap/h_tp_atf_check_sh.sh
    description: "Bootstrap atf-check 测试程序 (21 用例: 退出码/stdout/stderr 验证)"
    command: "bootstrap/h_tp_atf_check_sh"
  - name: "h_tp_pass"
    source: atf-0.23/bootstrap/h_tp_pass.cpp
    description: "通过测试程序 (1 用例)"
    command: "bootstrap/h_tp_pass"
  - name: "h_tp_fail"
    source: atf-0.23/bootstrap/h_tp_fail.cpp
    description: "失败测试程序 (1 用例，验证失败检测机制)"
    command: "bootstrap/h_tp_fail"

# 手动执行的额外测试套件 (非 make check 自动编译，需单独运行)
additional_upstream_tests:
  - name: "error_test"
    source: atf-0.23/atf-c/error_test.c
    description: "错误处理测试 (10 用例)"
    result: "10/10 通过"
  - name: "detail/sanity_test"
    source: atf-0.23/atf-c/detail/sanity_test.c
    description: "健全性测试 (4 用例)"
    result: "4/4 跳过 (NDEBUG 构建禁用断言检查，预期行为)"
  - name: "detail/text_test"
    source: atf-0.23/atf-c/detail/text_test.c
    description: "文本工具测试 (7 用例)"
    result: "7/7 通过"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "atf-c API 功能验证 (pass_test + str_compare_test + math_test)"
    command: "./test_atf pass_test && ./test_atf str_compare_test && ./test_atf math_test"

# 测试断言总数 (近似值，用于质量评估)
# 上游: 56 用例 (bootstrap 36 + error 10 + sanity 4 + text 7 - h_tp_pass/fail 模板问题 2)
# test_package: 3 用例
# 总计: 59
assertion_count: 59
