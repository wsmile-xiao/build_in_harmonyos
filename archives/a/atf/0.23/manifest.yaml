  - "atf 0.23 官方下载源已失效，使用 GitHub mirror: https://github.com/freebsd/atf/releases/download/atf-0.23/atf-0.23.tar.gz"
  - "make -j2 会触发 config.status --recheck，需确保 configure 中的 umask 补丁已应用"

