software: atf
display: "ATF (Automated Testing Framework)"
description: "ATF 提供 C、C++ 和 shell 测试框架，用于编写测试程序"
category: testing
homepage: "https://github.com/freebsd/atf"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.sub/config.guess 需添加 ohos/linux-ohos 规则以识别 HarmonyOS 平台"
    - "configure 中 umask 077 需改为 umask 022 以兼容 HarmonyOS 文件系统权限"
    - "atf-sh 不支持 --version/--help，L2 smoke test 需特殊处理"
  common_dependencies: []

versions:
  "0.23":
    status: built
    build_date: "2026-06-29"
    source_url: "https://github.com/freebsd/atf/releases/download/atf-0.23/atf-0.23.tar.gz"
