software: aylet
display: "aylet"
description: "Sinclair ZX Spectrum AY 音乐文件命令行播放器"
category: utility
homepage: "https://www.worldofspectrum.org/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "OHOS 上使用 stdout PCM 后端替代 OSS 音频设备后端"
    - "stdout 模式移除 curses UI，避免 OHOS SDK 缺少 ncurses 开发头/库"
    - "使用 OHOS aarch64 Clang 工具链完成真实交叉编译"
    - "当前不提供 OHOS 原生音频设备播放"
  common_dependencies: []

versions:
  "0.5":
    status: built
    build_date: "2026-08-24"
    conan_ref: "aylet/0.5"
