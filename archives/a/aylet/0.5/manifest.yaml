version: "0.5"
software: "aylet"
status: built
build_date: "2026-08-24"
build_system: "makefile"

source:
  url: "https://deb.debian.org/debian/pool/main/a/aylet/aylet_0.5.orig.tar.gz"
  sha256: "c8c428a63abe5087b0345709a9a8034c2e6873b6071d9f7b05578aae0f3a4f72"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make aylet OBJS=main.o sound.o ui-stdout.o z80.o drv-stdout.o"
    - "CFLAGS=-include stdlib.h -O2 -Wall"
    - "OHOS profile: tools.build:compiler_executables:c; recipe adds -static"
    - "CURSES_LIB=''"
  dependencies: []
  cc: clang
  cxx: clang++

test_passed: 2
test_failed: 0
test_skipped: 0

patches_applied:
  - "0001-drv-stdout.c.patch"
  - "0002-headless-ui.patch"

knowledge_gained:
  - "OHOS aarch64 使用 stdout PCM 后端替代 OSS 音频设备后端"
  - "OHOS 上移除 curses UI，保留 aylet 的无 UI 播放循环，避免依赖不存在的 ncurses 头/库"
  - "WSL 使用 OHOS aarch64 Clang 工具链完成真实交叉编译验证"

patch_classification:
  - file: 0001-drv-stdout.c.patch
    type: auto
    platform_only: true
    guard: none
  - file: 0002-headless-ui.patch
    type: auto
    platform_only: true
    guard: none
