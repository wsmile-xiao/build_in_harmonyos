software: audtty
display: "audtty"
description: "ncurses based frontend to audacious"
category: utility
homepage: "http://audtty.alioth.debian.org"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Vendor stub audclient (audacious dbus interface) because audacious not in registry"
    - "Apply Debian DESTDIR/LDADD/glib patches for correct staged install and DSO linking"
    - "Guard g_type_init for modern glib"
    - "HMDFS umask fix (077 -> 022) for config.status tmp dirs"
  common_dependencies:
    - glib
    - dbus
    - dbus-glib
    - ncurses

versions:
  "0.1.12":
    status: built
    build_date: "2026-08-31"
    conan_ref: "audtty/0.1.12"
