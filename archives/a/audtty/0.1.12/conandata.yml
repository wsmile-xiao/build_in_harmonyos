patches:
  "0.1.12":
    - patch_file: "patches/0001-Makefile-destdir.patch"
      patch_description: "Fix DESTDIR handling for staged installs (Debian 00-Makefile)"
      patch_type: "portability"
    - patch_file: "patches/0002-Makefile-ldadd.patch"
      patch_description: "Fix DSO linking: use LDADD with dbus-glib and glib libs (Debian 01-ftbfs_dso_linking)"
      patch_type: "portability"
    - patch_file: "patches/0003-glib-include.patch"
      patch_description: "Add GLIB_CFLAGS via pkg-config for glib headers (Debian 02-glib_include_link)"
      patch_type: "portability"
    - patch_file: "patches/0004-audclient-pkg.patch"
      patch_description: "Change PKG_CHECK_MODULES from audacious to audclient (Debian 03_audclient)"
      patch_type: "portability"
