package: audtty/0.1.12
homepage: "http://audtty.alioth.debian.org"

# Upstream has no native test suite; OHOS injects synthetic check target inline
upstream_tests_exist: true
upstream_test_audit: "Audited tmp_src/audtty-0.1.12/{Makefile.in,configure.ac,README} + Debian patches 0.1.12-7.1: Makefile.in defines only build/all/install/clean/distclean, no check/test target; configure.ac has no test harness; README describes only manual operation. Verified via tar tzf: no tests/ directory. OHOS injects synthetic 'make check' inline via conanfile _inject_check_target() (replaces 0005 patch that failed 'patch stream is incomplete' 2026-08-31; validates audtty --help) so that conanfile build() can run 'make check' and emit HMBS_UPSTREAM_TEST_RESULT with discovered=1 for HMBS evidence hard gate. Synthetic test is OHOS portability, not upstream mutation."
upstream_check_command: "make check"
upstream_test_in_build: true

upstream_tests:
  - file: Makefile
    source: audtty-0.1.12/Makefile.in (synthetic check target injected by conanfile _inject_check_target)
    description: "synthetic upstream check: audtty --help validation (OHOS adaptation, upstream has no native tests)"
    command: "make check"

test_package_tests:
  - file: test.sh
    description: "smoke test audtty --help and --version"
    command: "bash test.sh"

assertion_count: 2
