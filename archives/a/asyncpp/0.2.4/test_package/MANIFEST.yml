# test_package/MANIFEST.yml — asyncpp/0.2.4
# CI 脚本 (ci/conan/build_and_test.sh L0e) 要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md
#
# ── 上游用例数口径（候选数法取最大值；四口径不混用）─────────────────────
#   口径① 源码宏数   grep -rhoE '^\s*(TEST_CASE|TEMPLATE_(LIST_)?TEST_CASE)\(' test --include='*.cpp' | wc -l
#                     → 136（118 个 TEST_CASE + 18 个 TEMPLATE_TEST_CASE）
#   口径② 框架注册数 <build>/bin/test --list-tests → 154（Catch2 运行期注册；
#                     118 个普通用例 + 18 个 TEMPLATE_TEST_CASE 各展开 2 类型 = 154）
#   口径③ assertion 数（另一口径，不与用例数混用）
#                     Catch2 汇总行 → `All tests passed (N assertions in 154 test cases)`
#                     N=断言数随并发调度逐轮波动（非稳定口径，不在本文件写死具体值）；
#                     用例数恒为 154，故 N（用例总数）一律取口径②的 154
#   口径④ 消费者断言数（不进上游分母）
#                     本目录 test_asyncpp.cpp 自报 → 25
#   N = 154（取最大值：框架注册数 154 > 源码宏 136）
#   差额归因：154 − 136 = 18 = 18 个 TEMPLATE_TEST_CASE 各多展开 1 个类型
#             （test_event.cpp 6 条 ×1 + test_task.cpp 等 12 条 ×1）
#   上游当前 HEAD（287d1a00，与 tag v0.2.4 同一提交）同一命令读数相同，无差额。
# 全部数字来自 2026-09-28 设备端（HarmonyOS PC aarch64 / clang 15.0.4 / libc++ 15004 /
# C++20）实测日志，原始日志见 ../reports/test-report.md「原始证据」段。

package: asyncpp/0.2.4
homepage: "https://github.com/petiaccja/asyncpp"

# 上游测试入口：CMake -DASYNCPP_BUILD_TESTS=ON → make → 直跑 Catch2 二进制
upstream_check_command: "cmake -S <src> -B <build> -DCMAKE_BUILD_TYPE=Release -DASYNCPP_BUILD_TESTS=ON -DASYNCPP_BUILD_BENCHMARKS=OFF && cmake --build <build> && <build>/bin/test"

# conanfile.py build() 已集成上游测试（ASYNCPP_BUILD_TESTS=ON）
upstream_test_in_build: true
upstream_test_command: "conan create 内 build(): \"<build>/bin/test\" --durations yes"

# 上游用例总数（口径② 框架注册数，取候选数法最大值）
upstream_test_count: 154
upstream_test_count_command: "\"<build>/bin/test\" --list-tests   # 154 个注册用例（118 普通 + 18 模板 ×2 类型）；源码宏 136"

# 设备端实际执行并全部通过的用例数
upstream_test_executed: 154
upstream_test_executed_command: "\"<build>/bin/test\"   # 输出 `All tests passed (N assertions in 154 test cases)`；N 随并发调度逐轮波动（非稳定口径），用例数恒 154"

# 未执行 = 0（上游全部测试入口都在 build() 内执行）
upstream_test_unexecuted: 0
upstream_test_unexecuted_reason: "无：17 个测试翻译单元、154 个注册用例全部执行并通过（断言数为运行期自报、逐轮波动，具体值只记 reports/test-report.md）"

# ── 计数单位与口径 ─────────────────────────────────────────────────────
# 单位 = 上游 Catch2 测试用例（注册数 154）。上游 CMakeLists 未调用
# enable_testing() ⇒ ctest 恒以 `No tests were found!!!` + rc=0 假绿
# （device-facts §二.22），故判据只用 Catch2 二进制直跑的汇总行，不用 ctest。
# ohpcd 的 catch2/3.8.1 提供完整 CMakeDeps 配置，test/CMakeLists.txt 的
# find_package(Catch2 3 REQUIRED) 原样可用（不注入 stub、不改上游测试注册面）。

upstream_tests:
  - file: test/
    source: asyncpp-0.2.4/test/
    description: "上游全部测试源（17 个 .cpp，136 条声明宏 → 注册 154 个用例）"
    command: "\"<build>/bin/test\" --durations yes"
  - file: test_package/test_asyncpp.cpp
    source: test_package/test_asyncpp.cpp
    description: "鸿蒙特有消费者测试：23 个公开头单 TU 自包含 + 25 条运行期断言"
    command: "\"<build>/bin/test_asyncpp\""
