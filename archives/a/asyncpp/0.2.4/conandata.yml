sources:
  "0.2.4":
    url: "https://github.com/petiaccja/asyncpp/archive/refs/tags/v0.2.4.tar.gz"
    sha256: "58138ff5801d3a547eaad9adc2c30fe7a0d506c0e41dc56071ceaad5747210b5"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "新增 ASYNCPP_LIBCXX_EXPERIMENTAL 选项（默认 OFF）：OHOS 的 clang 15 / libc++ 15004 默认不暴露 std::ranges 算法、ranges 视图与 <format>，须定义 _LIBCPP_ENABLE_EXPERIMENTAL 才可用，std::format 的运行时符号另需链接 libc++experimental.a；配方在 OHOS 上显式开启"
    patch_type: "portability"
  - patch_file: "patches/0002-include-asyncpp-shared_mutex.hpp.patch"
    patch_description: "shared_mutex 的两个 awaitable 派生类用括号初始化基类子对象（C++20 括号聚合初始化 P0960），clang 15 不支持 ⇒ 改为花括号，聚合初始化语义等价"
    patch_type: "portability"
  - patch_file: "patches/0003-include-asyncpp-sleep.hpp.patch"
    patch_description: "libc++ 15 没有 std::chrono::clock_cast ⇒ sleep_until 改为：目标钟与源钟相同时恒等返回，否则按 now()+相对时刻 换算；并补 <type_traits>"
    patch_type: "portability"
  - patch_file: "patches/0004-include-asyncpp-testing-interleaver.hpp.patch"
    patch_description: "libc++ 15 的 std::vector 没有 operator<=>，swarm_state 的默认 operator<=> 被隐式删除（std::map<swarm_state> 的 less 随之失效）⇒ 补显式构造函数（同时解决 clang 15 无 P0960 的 swarm_state(vector) 调用形态）与逐字典序的 <=>/==；THREAD 宏的括号聚合初始化改花括号；std::jthread/stop_token 改 std::thread + content 析构 join"
    patch_type: "portability"
  - patch_file: "patches/0005-include-asyncpp-thread_pool.hpp.patch"
    patch_description: "libc++ 15 没有 std::jthread ⇒ worker::m_thread 改 std::thread（停止语义由 cancel() + 析构 join 承担，见 0007）"
    patch_type: "portability"
  - patch_file: "patches/0006-src-sleep.cpp.patch"
    patch_description: "sleep_scheduler 的 std::jthread/std::stop_token 改为 std::thread + std::atomic<bool> m_stop：析构置位并 notify_all 后 join，awake 循环条件由 token.stop_requested() 改读 m_stop，语义等价"
    patch_type: "portability"
  - patch_file: "patches/0007-src-thread_pool.cpp.patch"
    patch_description: "thread_pool 构造函数的 m_pack(...) 括号聚合初始化改花括号（clang 15 无 P0960）；worker::start 的 std::jthread 改 std::thread，worker 析构在 cancel() 后显式 join（等价于 jthread 析构的 join）"
    patch_type: "portability"
  - patch_file: "patches/0008-test-test_mutex.cpp.patch"
    patch_description: "测试辅助 RAII 结构 mtx_scope_clear 补显式构造函数：clang 15 无 P0960，既有 `mtx_scope_clear guard(mtx);` 直接初始化无法用于聚合体；用例与断言零改动"
    patch_type: "portability"
  - patch_file: "patches/0009-test-test_semaphore.cpp.patch"
    patch_description: "测试辅助 RAII 结构 sema_scope_clear 补显式构造函数（同 0008 的 P0960 成因）；用例与断言零改动"
    patch_type: "portability"
  - patch_file: "patches/0010-test-test_shared_mutex.cpp.patch"
    patch_description: "测试辅助 RAII 结构 shmtx_scope_clear 补显式构造函数（同 0008 的 P0960 成因）；用例与断言零改动"
    patch_type: "portability"
