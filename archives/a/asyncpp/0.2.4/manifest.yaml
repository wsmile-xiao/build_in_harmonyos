# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS clang 15 不支持 C++20 括号聚合初始化（P0960）：基类/成员/变量的 `Type(args)` 聚合初始化形态必须改花括号或补显式构造函数（asyncpp 4 类形态实测）"
  - "OHOS libc++ 15004 缺 std::jthread/std::stop_token/std::chrono::clock_cast 与 std::vector::operator<=>，可用 std::thread+atomic 停止标志与手写逐元素 <=> 等价改写"
  - "libc++ 15 的 std::ranges 算法/视图与 <format> 默认关闭：需 _LIBCPP_ENABLE_EXPERIMENTAL 编译宏 + 链接 libc++experimental.a（std::format 运行时）"
  - "clang 15 只把「默认成员 operator<=>」重写成 operator==，用户提供的 operator<=> 不参与 == 重写，须显式补 operator=="
  - "上游 CMake 未调用 enable_testing() ⇒ ctest 恒 `No tests were found!!!`+rc=0 假绿，上游测试判据只能读 Catch2 二进制汇总行"

