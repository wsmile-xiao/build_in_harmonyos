# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: arduinospritzcipher/1.2.0
homepage: "https://github.com/abderraouf-adjal/ArduinoSpritzCipher"

# 上游无 configure/make/ctest 注册；测试载体为 Arduino 样例(.ino)，
# 内含 Spritz 论文 RS14 测试向量。官方 tag 无独立 TEST_CASE 注册。
upstream_check_command: "none (no test framework in official tag)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游样例（计入台账，不作为独立用例；向量已移植到 test_package 与鸿蒙专项测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：spritz_hash(RS14向量)/crypt roundtrip/mac 确定性/PRNG 确定性"
    command: "./test_package"

# 测试断言总数（近似值）
assertion_count: 4
