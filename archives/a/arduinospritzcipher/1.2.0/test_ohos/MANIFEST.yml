# test_ohos/MANIFEST.yml — arduinospritzcipher 1.2.0 HarmonyOS PC 专项验证声明

package: arduinospritzcipher/1.2.0
purpose: "HarmonyOS PC 平台专项验证：ELF/musl/签名段/路径泄漏 + 真实密码学测试向量"

checks:
  - id: T1
    name: "aarch64 ELF 验证"
    command: "readelf -h <exe>"
  - id: T2
    name: "musl libc（无 glibc/ld-linux）"
    command: "readelf -d <exe>"
  - id: T3
    name: ".codesign 段存在"
    command: "readelf -S <exe>"
  - id: T4
    name: "无宿主绝对路径泄漏"
    command: "strings <exe>"
  - id: T5
    name: "真实密码学验证（RS14 测试向量/roundtrip/mac/prng）"
    command: "<exe>"

run_command: "python3 run_ohos_test.py <conan_package_folder>"
