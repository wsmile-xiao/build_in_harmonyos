# 软件级 manifest — ayatana-indicator-power
# 遵循 ARCHIVE-SPEC v2.0

software: ayatana-indicator-power
display: "Ayatana Power Indicator"
description: "Ayatana 电源状态指示服务（D-Bus session service），监听电池/亮度状态并发布桌面通知"
category: system
homepage: "https://github.com/AyatanaIndicators/ayatana-indicator-power"
license: GPL-3.0

build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，PkgConfigDeps 需合成 gio-unix-2.0.pc 并给 glib 系 .pc 追加 -lintl（proxy-libintl）"
    - "OHOS 无 intltool -> SKIP_PO 选项跳过 po/ 子目录"
    - "XDG_AUTOSTART_DIR 绝对路径改 prefix 相对，避免写出 package 目录"
    - "main.c 增加 --version/--help 以便 smoke test（OHOS PC 无 session bus）"
    - "RDA（librda）未发布到制品仓 -> ENABLE_RDA=OFF（R36 记录）"
    - "已知依赖缺陷：libnotify/0.8.3 配方 meson install 会把构建 rpath 以 'X' 覆盖，导致产物 .so 被 OHOS loader 以 EACCES 拒绝；本地已修复（package() 恢复原始 .so），需随 libnotify 配方发布"
  common_dependencies:
    - glib
    - libayatana-common
    - libnotify
    - cmake-extras

versions:
  "26.6.0":
    status: built
    build_date: 2026-09-05
    conan_ref: "ayatana-indicator-power/26.6.0"
    notes: "conan-verify G1-G4 全通过；3 个补丁（0001-CMakeLists.txt.patch / 0002-data-CMakeLists.txt.patch / 0003-src-main.c.patch）；依赖切到制品仓已发布的 libayatana-common/0.9.13（glib/2.88.0.1），libnotify 依赖本地修复后 smoke test 通过；路径B 重新验证：R36 依赖发布检查通过，但 libnotify 子树硬编码 glib/2.84.0.1/zlib/1.3.1.1 与 glib/2.88 生态冲突，conan-verify G2 与 W3 阻塞（见 notes.md）"
