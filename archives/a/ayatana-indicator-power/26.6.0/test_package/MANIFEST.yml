# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ayatana-indicator-power/26.6.0
homepage: "https://github.com/AyatanaIndicators/ayatana-indicator-power"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游测试需 GMock/dbustest-1/GTest，OHOS PC 无这些依赖且需运行 D-Bus
# session，故 ENABLE_TESTS=OFF 不纳入 conan 构建；功能覆盖由
# test_package 的端到端消费者用例承担。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (仅作声明，OHOS 不构建)
upstream_tests:
  - file: tests/test-device.cc
    source: ayatana-indicator-power-26.6.0/tests/test-device.cc
    description: "设备 (电池/亮度) 对象单元测试 — 需 GMock/dbustest，OHOS 不构建"
    command: "./test-device"
  - file: tests/test-notify.cc
    source: ayatana-indicator-power-26.6.0/tests/test-notify.cc
    description: "通知器单元测试 — 需 GMock/dbustest，OHOS 不构建"
    command: "./test-notify"

# test_package 中自带的测试 (消费者视角端到端验证)
# R34: 真实调用被测包二进制 (ayatana-indicator-power-service)
# R12: 完整消费者用例 (test_consumer.c) 而非冒烟断言
test_package_tests:
  - file: test_consumer.c
    description: "真实消费者程序：GDBusServer 私有 peer-bus 拉起服务，经真实 D-Bus 属性驱动 Testing mock 电池 80%，断言 Battery.PowerPercentage=80 / IsDischarging=true / PowerLevel=ok（8 处断言，含连接建立/回读/属性读取）"
    command: "由 conanfile.py 编译并端到端运行 (self.run)"
  - file: conanfile.py
    description: "定位包内服务二进制 + 编译 GSettings schema (glib-compile-schemas) + 编译 test_consumer + 端到端运行断言；全程真实进程间通信 (unix:abstract= peer-bus，避开 OHOS 沙箱 EPERM)"
    command: "conan create 时自动执行 (conanrun_test 环境)"
  - file: test.sh
    description: "双模式脚本：冒烟 (--version 含 26.6.0 / --help) + 端到端消费者用例 (consumer + compiled schema)"
    command: "sh test.sh <service-binary> [<test_consumer> <schema-dir>]"

# 测试断言总数 (消费者 8 处 + 冒烟 2 处, 用于质量评估)
assertion_count: 10
