# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake pkg_check_modules 需要 gio-unix-2.0.pc，glib 配方未导出时需从包目录合成（Version 从 glib ref 动态取值）"
  - "glib proxy-libintl 提供 g_libintl_* 符号，glib-2.0.pc 等需追加 -lintl"
  - "OHOS 无 intltool 可执行，po/ 子目录需用 SKIP_PO 选项跳过"
  - "XDG_AUTOSTART_DIR 绝对路径会写出 package 目录，需改为 prefix 相对"
  - "libnotify/0.8.3 产物 .so 被 meson install depfixer 以 'X' 覆盖构建 rpath -> OHOS loader EACCES；libnotify/0.8.3.1 配方 package() 恢复原始 .so 已修复"
  - "LDFLAGS/CFLAGS 泄漏系统静态 glib 2.88 会导致 pcre2/g_libintl 未定义符号，build() 需显式清空（R33）"
  - "依赖切到制品仓已发布的 libayatana-common/0.9.13（依赖链 glib/2.88.0.1）；旧 libnotify/0.8.3 硬编码 glib/2.84.0.1/zlib/1.3.1.1 导致 conan 图版本冲突，已随 libnotify/0.8.3.1 配方（glib/2.88.0.1 对齐）解决"

