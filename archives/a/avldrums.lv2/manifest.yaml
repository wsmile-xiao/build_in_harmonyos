software: avldrums.lv2
display: "AVLDrumS"
description: "LV2 drum sample player plugin - AVLinux Drumkits (鼓采样播放器插件)"
category: multimedia
homepage: "https://x42-plugins.com/x42/x42-avldrums"
license: GPL-3.0
build_system: make

ohos_adaptation:
  key_points:
    - "LV2 鼓采样播放器插件（DSP + 内置 SF2 鼓采样音源）"
    - "BUILDOPENGL=no 禁用 OpenGL GUI（OHOS 无 GL/X11）"
    - "依赖 lv2/1.18.11-git + glib/2.84.0（本仓库已有适配）"
    - "上游无独立测试套件（Makefile 无 make test），构建期校验依赖与 ttl 生成"
  common_dependencies:
    - "lv2/1.18.11-git"
    - "glib/2.84.0"

versions:
  "0.7.4":
    status: in-progress
    build_date: "2026-08-23"
    source_url: "https://github.com/x42/avldrums.lv2/archive/refs/tags/v0.7.4.tar.gz"
    packaging: "packaging/"
