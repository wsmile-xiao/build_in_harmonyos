# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: avldrums.lv2/0.7.4
homepage: "https://x42-plugins.com/x42/x42-avldrums"

# 上游测试命令：avldrums.lv2 上游无独立测试套件（Makefile 无 make test
# / check 目标，仅 submodule_check 子模块校验）。构建即验证：Makefile
# 生成 manifest.ttl/avldrums.ttl 并编译插件共享库，pkg-config 校验
# lv2/glib 依赖存在。
upstream_check_command: "make BUILDOPENGL=no"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序（无独立测试套件，构建期校验依赖与 ttl 生成）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_avldrums.sh
    description: "验证 LV2 插件 bundle 完整（manifest.ttl/avldrums.ttl/avldrums.so/SF2 采样文件存在，4 个断言）"
    command: "bash test_avldrums.sh <bundle_dir>"
  - file: conanfile.py
    description: "验证 lib/lv2/avldrums.lv2 bundle 目录存在（1 个断言）"
    command: "conan test"

# 测试断言总数：上游无独立测试用例（0），test_package 5 个断言
assertion_count: 5
