# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 本库上游为 Boost.Build（Jamfile）微型项目：仅 1 个测试源 test.cpp，
# Jamfile 声明 `exe test : test.cpp`（上游 README release 输出 test / 52: 1）。
# 枚举结果：上游独立测试声明总数 = 1（test.cpp），已实际编译运行通过。

package: access_profiler/20260924
homepage: "https://github.com/arvidn/access_profiler"

# 上游测试命令 (本项目无 make check / ctest / meson test，由 Jamfile 构建 test 可执行)
upstream_check_command: "bjam 由 Jamfile 构建 exe test（本地等价: clang++ test.cpp libaccess_profiler.a -o test && ./test）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（枚举台账：全量 1 个独立上游用例）
upstream_tests:
  - file: test.cpp
    source: access_profiler-20260924.jamfile-exe-test
    description: "上游唯一测试：instrument_type<test> 字段访问热区记录（release 输出 test / 52: 1，stdout=55）"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者验证：仅用公开头文件 + libaccess_profiler.a + 公开 API instrument_type，断言聚合字段值"
    command: "./test_access_profiler"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2