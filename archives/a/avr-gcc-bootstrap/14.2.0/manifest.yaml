software: avr-gcc-bootstrap
version: 14.2.0
status: success
build_date: "2026-08-19"
build_system: autotools
category: embedded-toolchain
description: Bootstrap AVR C compiler hosted on OHOS
source:
  url: https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz
  sha256: a7b39bc69cbf9e25826c5a60ab26477001f7c08d85cec04bc0e29cabed6f3cc9
  tar_format: tar.xz
build:
  target: ohos-armv8
  format: conan
  dependencies:
    - avr-binutils/2.43.1
  vendored_build_sources:
    - gmp/6.2.1
    - mpfr/4.1.0
    - mpc/1.2.1
  configure_options:
    - --target=avr
    - --enable-languages=c
    - --with-multilib-list=avr5
    - --with-double=32
    - --with-long-double=32
    - --with-libf7=no
    - --disable-bootstrap
    - --enable-host-pie
    - --disable-shared
    - --disable-threads
    - --disable-fixed-point
    - --with-newlib
    - --without-headers
    - --without-isl
patches_applied:
  - 0001-configure-hmdfs-umask.patch
  - 0002-build-hmdfs-shell-scripts.patch
  - 0003-libgcc-mkheader-shell.patch
  - 0004-libgcc-honor-disable-fixed-point.patch
knowledge_gained:
  - "This package is a stage-1 C compiler plus AVR libgcc; it intentionally does not contain avr-libc."
  - "The OHOS host is configured with GCC's native aarch64-linux-musl model while Clang emits OHOS binaries."
  - "The official prerequisite versions are built in-tree without symlinks or undeclared Conan dependencies."
  - "Generated host tools and installed compiler programs must be signed for OHOS execution."
verification:
  upstream_tests: passed
  package_tests: passed
  official_ci: passed
  shadow_commit: 19bb09c0ce7c7c45a78d08c89f2e9e27b8d1d7d7
  shadow_run: codex-avr-gcc-bootstrap-shadow-ci-r18-2245-20260819-181549-8619
