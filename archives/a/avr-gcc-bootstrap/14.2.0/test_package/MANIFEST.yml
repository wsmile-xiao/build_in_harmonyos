package: avr-gcc-bootstrap/14.2.0
homepage: https://gcc.gnu.org/
upstream_check_command: "make -C gcc selftest"
upstream_test_in_build: true
upstream_test_command: "make -C gcc selftest plus 8 torture sources at -O0/-O2"
upstream_tests:
  - file: gcc/selftest-run-tests.cc
    source: gcc-14.2.0/gcc/selftest-run-tests.cc
    description: "GCC internal compiler selftests"
    command: "make -C gcc selftest"
  - file: gcc/testsuite/gcc.c-torture/execute/20000113-1.c
    source: gcc-14.2.0/gcc/testsuite/gcc.c-torture/execute
    description: "Eight official no-header sources compiled at two optimization levels"
    command: "fresh xgcc compile-only subset (16 compilations)"
test_package_tests:
  - file: smoke.c
    description: "Compile and link AVR code with packaged libgcc, then inspect architecture and symbols"
    command: "avr-gcc -mmcu=atmega328p -nostdlib smoke.c -lgcc"
assertion_count: 7
