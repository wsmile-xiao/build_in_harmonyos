# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ausweisapp/2.5.4
homepage: "https://www.ausweisapp.bund.de/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure -j1"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir ${build_folder} --output-on-failure -j1"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/antest
    source: ausweisapp-2.5.4/test/antest
    description: "QML 自动测试（QtQuickTest，QT_QPA_PLATFORM=offscreen）"
    command: "./antest"

# test_package 中自带的测试 (消费者视角验证)
# 注: 不走 CMakeDeps/find_package(ausweisapp) — AusweisApp 的 Qt 依赖均为
# cmake_find_mode=none, find_dependency 链无法解析, 故编译宿主测试程序
# test_ausweisapp, 由它 popen 真实执行打包产物 AusweisApp --version 并
# 校验退出码/版本输出 (R34 实质测试, 鸿蒙特有: 验证 OHOS aarch64 上可启动)。
# 真实断言点 (与 test.c 一致, 共 4 个):
#   1. popen 成功 — 二进制存在且可加载执行
#   2. --version 有非空输出 — Qt6 运行库加载成功、主流程可运行
#   3. 退出码为 0 — 程序正常完成参数处理
#   4. 输出含版本号数字 (如 2.5.4) — 真实版本号被打印
test_package_tests:
  - file: test.c
    source: ausweisapp-2.5.4/test_package/test.c
    description: "鸿蒙特有测试：真实执行打包产物 AusweisApp --version，验证在 OHOS aarch64 上可启动且输出版本号；断言：popen 成功、输出非空、退出码 0、输出含版本号数字 (共 4 个断言点)"
    command: "./test_ausweisapp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
