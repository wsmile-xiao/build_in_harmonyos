# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: argp-standalone/1.4.1
homepage: "https://github.com/ericonr/argp-standalone"

# 上游测试命令 (testsuite/Makefile.am: check 目标调 run-tests)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序（探索阶段实测：2/2 全过）
upstream_tests:
  - file: testsuite/ex1-test
    source: argp-standalone-1.4.1/testsuite/ex1-test
    description: "ex1 基本行为：无参成功/带参失败/--help 输出 Usage/非 long-only 模式 -help 失败"
    command: "./ex1-test"
  - file: testsuite/permute-test
    source: argp-standalone-1.4.1/testsuite/permute-test
    description: "参数排列：6 组 -v 与位置参数排列组合下 ex3 输出与期望 diff 一致"
    command: "./permute-test"

# test_package 中自带的测试 (消费者视角验证，R34：真实调用 argp_parse)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：argp_parse 命令行解析往返（长/短选项、取值、位置参数、未知选项拒绝、版本钩子）"
    command: "./test_probe"

# 测试断言总数（上游 2 项 + test_package 8 项 CHECK 断言）
assertion_count: 10
