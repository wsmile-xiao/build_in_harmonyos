# 版本级 manifest — argp-standalone 1.4.1 (ericonr fork)
# 遵循 ARCHIVE-SPEC v2.0

version: "1.4.1"

software: "argp-standalone"
display: "argp-standalone"
description: "glibc argp 命令行解析 API 的独立实现（musl/OHOS 无 argp，本包补齐）"
category: system

# 编译状态
# published | built | failed | archived
status: built
build_date: "2026-09-04"
build_system: autotools

# 源码信息
source:
  url: "https://github.com/ericonr/argp-standalone/archive/refs/tags/1.4.1.tar.gz"
  sha256: "879d76374424dce051b812f16f43c6d16de8dbaddd76002f83fd1b6e57d39e0b"
  tar_format: tar.gz

# 构建配置
build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl"
    - "--host=aarch64-unknown-linux-musl"
    - "ac_cv_header_libintl_h=no"
  dependencies: []
  tool_dependencies:
    - automake/1.18
    - libtool/2.5.4
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied: []
# configure 的 umask 077→022 修补在 build() 运行期完成（autoreconf 后 glob 替换），
# 不落 .patch 文件（configure 生成物 9014 行，patch 不可维护）

# 知识沉淀
knowledge_gained:
  - "HMDFS mktemp+umask 陷阱：configure 内嵌 umask 077 && mktemp -d 在 HMDFS 上建出缺组执行位的目录（drwx--S---），目录内写文件 Permission denied 且 chmod 修正无效；umask 022（保 g+x）可写——须在 autoreconf 之后修补 configure (knowledge_ref: E011)"
  - "OHOS musl libintl.h 空壳（宏在符号不在）：ac_cv_header_libintl_h=no 走 dgettext 直通分支，避免 __dcgettext 链接失败 (knowledge_ref: E015)"
  - "上游 noinst_* 设计：make install 空操作，package() 手工装 argp.h + libargp.a"
  - "C++ test_package 在 OHOS 上建议 -static-libstdc++（libc++_shared.so 搜索路径不可靠）"
  - "argp-standalone 是 musl/OHOS 补齐 glibc 独有 API 家族（同 musl-fts/musl-obstack）的模式样本，下游用 self.requires() 消费（elfutils/0.195 实证）(knowledge_ref: DRAFT-argp-musl-gap-bridge)"
