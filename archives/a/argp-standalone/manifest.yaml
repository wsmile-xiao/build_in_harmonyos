software: argp-standalone
display: "argp-standalone"
description: "独立的 GNU argp 命令行参数解析库，提供从 glibc 中提取的 argp 接口（musl/OHOS 无 argp，用本库补齐）"
category: system
homepage: "https://github.com/ericonr/argp-standalone"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 autoreconf 自举生成 configure（GitHub archive tarball 无 configure 脚本）；设备/CI 无 automake 时 tool_requires automake + libtool"
    - "configure/config.status 内嵌 umask 077 在 HMDFS 上导致 mktemp 目录不可写（缺组执行位），须改为 umask 022（autoreconf 之后修补）"
    - "OHOS musl 的 libintl.h 是空壳：ac_cv_header_libintl_h=no 走 dgettext 直通分支，无需 gettext 依赖"
    - "上游 noinst 静态库设计，package() 手工安装 argp.h + libargp.a"
    - "C++ 下游测试建议 -static-libstdc++（OHOS libc++_shared.so 搜索路径不可靠）"
  common_dependencies: []

versions:
  "1.5.0":
    status: built
    build_date: "2026-04-21"
    source_url: "https://github.com/argp-standalone/argp-standalone/archive/refs/tags/1.5.0.tar.gz"
    note: "argp-standalone org 上游"
