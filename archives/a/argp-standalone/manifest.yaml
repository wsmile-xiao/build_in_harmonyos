software: argp-standalone
display: "argp-standalone"
description: "独立的 GNU argp 命令行参数解析库，提供从 glibc 中提取的 argp 接口"
category: system
homepage: "https://github.com/argp-standalone/argp-standalone"
license: LGPL-2.1
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 autoreconf -fi 生成 configure（原始 tarball 无 configure 脚本）"
    - "configure 中 umask 077 需改为 umask 022（HMDFS 兼容）"
    - "需传 LIBS=-lintl 链接 gettext"
    - "argp-standalone 是 noinst 静态库，需手动安装 argp.h, argp-fmtstream.h, libargp.a"
  common_dependencies:
    - gettext

versions:
  "1.5.0":
    status: built
    build_date: "2026-04-21"
    source_url: "https://github.com/argp-standalone/argp-standalone/archive/refs/tags/1.5.0.tar.gz"
