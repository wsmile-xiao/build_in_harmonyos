# test_package/MANIFEST.yml
package: astlib/0.13.2
homepage: "https://astlib.readthedocs.io"

upstream_check_command: "pytest tests/test_all.py -v"
upstream_test_in_build: true
upstream_test_command: "pytest tests/test_all.py -v"

upstream_tests:
  - file: tests/test_all.py
    source: astlib-0.13.2/tests/test_all.py
    description: "upstream pytest single test (test_dl checks luminosity distance)"
    command: "pytest tests/test_all.py -v"

test_package_tests:
  - file: test_astlib.py
    description: "consumer test — astCalc.dl, astStats, astCoords and PyWCSTools import"
    command: 'python3 test_astlib.py "<site-packages>"'

assertion_count: 4
