# test_package/MANIFEST.yml
# Upstream test declaration for astlib/0.9.0

package: astlib/0.9.0
homepage: "https://github.com/mkrivos/astlib"

# Upstream test command (for make -n check / ctest -N analysis)
upstream_check_command: "make check"

# conanfile.py build() method does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (GTest-based, optional, not built in this adaptation)
upstream_tests: []

# test_package self-contained tests (consumer perspective verification)
test_package_tests:
  - file: test_astlib.cpp
    description: "Verifies astlib CodecRegister API: initializeCodecs() and codec lookup"
    command: "./test_astlib"

# Approximate assertion count for quality assessment
assertion_count: 3
