software: alloy-analyzer
display: "Alloy Analyzer"
description: "Alloy 建模语言分析器，支持关系逻辑建模、SAT 求解与反例查找，含 CLI 与 LSP"
category: utility
homepage: "https://alloytools.org"
license: MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "JVM 应用源码构建：bnd/Gradle 工作区，gradle build 一次完成编译+上游 JUnit 测试(25/25)+dist jar 产出"
    - "构建需 JDK 17+（bishengjdk 17，conanfile 自动探测/安装）；wrapper 自动探测 JAVA_HOME 并设置 -Dos.name=Linux 绕过 HarmonyOS 平台识别"
    - "Gradle wrapper 默认 services.gradle.org 不可达，需改 mirrors.cloud.tencent.com 镜像；OHOS toybox 无法运行 gradlew 脚本，直接用 java 调用 wrapper jar"
    - "Kodkod 原生 SAT 求解器无 aarch64-Linux（HarmonyOS）预编译库，自动回退到纯 Java SAT4J 求解器，功能不受影响"
  common_dependencies:
    - bishengjdk

versions:
  "6.2.0":
    status: built
    build_date: "2026-08-30"
    conan_ref: "alloy-analyzer/6.2.0"
    notes: "源码构建（Gradle 7.2 + bishengjdk 17），上游 JUnit 测试 25/25 通过；conan create 本地验证通过"
