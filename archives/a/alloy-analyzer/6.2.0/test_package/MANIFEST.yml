# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: alloy-analyzer/6.2.0
homepage: "https://alloytools.org"

# 上游测试命令
# Alloy 源码仓库（org.alloytools.alloy）为 bnd/Gradle 工作区；构建时执行
# `gradle build` 即会编译并运行上游 JUnit 测试套件（25 个用例，全部通过）。
upstream_check_command: "gradle build (内含 upstream test 任务)"
upstream_test_in_build: true
upstream_test_command: "gradle build"

upstream_test_audit: |
  测试类型      上游用例数    说明
  单元测试      25           来源：org.alloytools.alloy 源码 `src/test/java`（application 2 个套件 + core 4 个套件）
  集成测试      0            —
  合计          25           实测：gradle build 运行 25 个 JUnit 用例，25/25 通过（0 失败 0 错误 0 跳过）

upstream_tests:
  - file: "org.alloytools.alloy.application/src/test/java/edu/mit/csail/sdg/alloy4whole/"
    source: "org.alloytools.alloy-6.2.0.tar.gz"
    description: "application 模块 JUnit 测试（FindReplaceTest 1 + InternalTest 6）"
    command: "gradle build"
  - file: "org.alloytools.alloy.core/src/test/java/"
    source: "org.alloytools.alloy-6.2.0.tar.gz"
    description: "core 模块 JUnit 测试（PosTest 3 + AlloyModelsTest 3 + CanvasTest 5 + TableTest 7）"
    command: "gradle build"

test_package_tests:
  - file: "test.sh"
    description: "L1 冒烟测试：结构断言（wrapper/JAR/os.name）+ 真实 JVM 执行 alloy version/commands/exec 求解，共 6 项断言"
    command: "sh test.sh <alloy_bin> <work_dir>"

assertion_count: 6
