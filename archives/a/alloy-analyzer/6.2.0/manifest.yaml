# manifest.yaml — alloy-analyzer 6.2.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.2.0"
software: "alloy-analyzer"

# 编译状态: built (本地 conan create 验证通过；CI 发布流水线通过后改 published)
status: built

# 编译日期
build_date: "2026-08-30"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/AlloyTools/org.alloytools.alloy/archive/refs/tags/v6.2.0.tar.gz"
  sha256: "59ef434a54a0f8ab82fdc18ad2287f2ffbce2a7c29b84208a5e73be40e926246"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: custom (bnd/Gradle 工作区，gradle build)
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表
  dependencies:
    - "bishengjdk/17.0.13"
    - "gradle/7.2"

  # 编译器: 无 (JVM 应用，使用 java/gradle)
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Alloy Analyzer 是 bnd/Gradle 工作区，gradle build 一次完成编译+上游 JUnit 测试(25/25)+dist jar 产出"
  - "Gradle wrapper 默认 services.gradle.org 不可达，需改 mirrors.cloud.tencent.com 镜像（ktfmt 先例）"
  - "OHOS /bin/sh 为 toybox 无法运行 gradlew 脚本，直接用 java -cp gradle-wrapper.jar 调用 GradleWrapperMain"
  - "Gradle/kodkod 不识别 HarmonyOS os.name，需设置 JAVA_TOOL_OPTIONS=-Dos.name=Linux（对所有 JVM 进程生效）"
  - "/tmp 在 OHOS 上只读（E002），GRADLE_USER_HOME/TMPDIR 须指向可写目录"
  - "上游 JUnit 测试报告位于各模块 target/test-reports/test/*.xml（bnd 输出目录为 target 非 build）"
  - "JVM 应用 conan 配方理论上只需 os+arch+package_type=application；但本仓库 CI L0p 门禁要求 settings 四项齐全（os/compiler/build_type/arch），故本配方声明全部四项（构建不使用 compiler，仅满足门禁）"
