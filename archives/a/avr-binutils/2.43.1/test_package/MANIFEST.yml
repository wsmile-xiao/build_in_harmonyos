package: avr-binutils/2.43.1
homepage: https://www.gnu.org/software/binutils/
upstream_check_command: "make -C libiberty check"
upstream_test_in_build: true
upstream_test_command: "make -C libiberty check (6 official checks)"
upstream_tests:
  - file: libiberty/testsuite/Makefile.in
    source: binutils-2.43.1/libiberty/testsuite/Makefile.in
    description: "Six official demangler, pexecute, expandargv, and strtol checks"
    command: "make -C libiberty check"
test_package_tests:
  - file: smoke.S
    description: "Assemble and link ATmega328P code, convert it to Intel HEX, and inspect the AVR ELF"
    command: "avr-as + avr-ld + avr-objcopy + avr-objdump + avr-nm + avr-readelf + avr-size"
  - file: smoke.sh
    description: "Execute the packaged assembler, linker, and object converter for the AVR smoke artifact"
assertion_count: 7
