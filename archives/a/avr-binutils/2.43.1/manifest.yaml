software: avr-binutils
version: 2.43.1
status: success
build_date: "2026-08-17"
build_system: autotools
category: embedded-toolchain
description: GNU Binutils hosted on OHOS and targeting AVR
source:
  url: https://ftp.gnu.org/gnu/binutils/binutils-2.43.1.tar.xz
  sha256: 13f74202a3c4c51118b797a39ea4200d3f6cfbe224da6d1d95bb938480132dfd
  tar_format: tar.xz
build:
  target: ohos-armv8
  format: conan
  dependencies: []
  configure_options:
    - --target=avr
    - --disable-gprofng
    - --disable-gold
    - --disable-plugins
    - --disable-shared
    - --without-debuginfod
    - --without-guile
    - --without-zstd
patches_applied:
  - 0001-configure-ohos-triplet.patch
  - 0002-configure-hmdfs-umask.patch
knowledge_gained:
  - "The packaged programs run on OHOS/AArch64 but emit AVR objects and executables."
  - "Generated host executables must be signed before OHOS can execute them during the build."
  - "HMDFS scripts must be invoked through a shell even when their execute bits are set."
  - "Pre-generated Info documents avoid an undeclared Texinfo build dependency."
  - "GNU configure private umask 077 is incompatible with the shared HMDFS build location."
  - "The libiberty checks run without DejaGNU; target testsuites require the unpublished DejaGNU runner."
verification:
  upstream_tests: passed
  package_tests: passed
  official_ci: passed
  shadow_commit: 66a185f1b5dfc310b5a6ba52b891201a9c70a88a
  shadow_run: codex-avr-binutils-shadow-ci-r5-2244-20260817-134800-3191
