software: achilles
display: "Achilles"
description: "人工生命与进化模拟器：虚拟生物通过 Hebbian 神经网络在简化世界中打斗、交配、觅食并学习"
category: science
homepage: "https://mrd.github.io/achilles/"
license: GPL-2.0-or-later
build_system: autotools
ohos_adaptation:
  key_points:
    - "鸿蒙 PC 无窗口系统也无窗口 GL：窗口 GL 上下文（SDL_SetVideoMode(SDL_OPENGL)）替换为 OSMesa 离屏上下文，渲染完成的帧拷贝到 SDL 软件表面"
    - "运行需 SDL_VIDEODRIVER=dummy（使用 SDL dummy 软件视频驱动）"
    - "2001 年版 config.sub 需补 aarch64 与 linux-ohos 以接受鸿蒙三元组"
    - "config.status 临时目录需 umask 022（setgid hmdfs 上 0700 目录连创建者都不可写）"
    - "configure 的 AC_CHECK_LIB 会重建 LIBS，完整链接集需在 make 命令行显式覆盖（含 -lOSMesa）"
  common_dependencies:
    - sdl
    - glu
    - libpng
    - alsa-lib
versions:
  "3":
    status: built
    build_date: "2026-10-08"
    conan_ref: "achilles/v3"
    upstream_version: "v3"
