# 版本级 manifest — achilles 3
# 遵循 ARCHIVE-SPEC v3.0

version: "3"
software: "achilles"
upstream_version: "v3"
status: built
build_date: "2026-10-08"
build_system: "autotools"
conan_ref: "achilles/v3"

source:
  url: "https://github.com/mrd/achilles/archive/refs/tags/v3.tar.gz"
  sha256: "2d97e68c61a7fca47153d9ac1d5f387b7165fe71f9fcdee10362959a8c73b9f5"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--host=aarch64-unknown-linux-ohos"
    - "ac_cv_prog_cc_works=yes"
    - "ac_cv_prog_cc_cross=yes"
    - "CXXFLAGS=-O2 -DOSMESA_RENDER"
    - "make LIBS=\"-lSDL -lasound -lGLU -lOSMesa -lpng -lz -lm -ldl -lpthread\""
  dependencies:
    - sdl/1.2.15
    - glu/9.0.3
    - libpng/1.6.58.3
    - alsa-lib/1.2.16
  cc: clang
  cxx: clang++
  outputs:
    - "bin/achilles"
    - "licenses/COPYING"
    - "licenses/README"

# 上游测试清点（R51）：上游零用例，但 check 目标在 build() 中被驱动以留痕
upstream_tests:
  command: "make check (driven from conanfile.py build())"
  test_count: 0
  notes: >
    achilles 3 不附带任何测试套件，三处清点一致：①tar 内 0 个含 test 的路径；
    ②Makefile.in 中 TESTS/check_PROGRAMS 命中 0 处，check-am/check 规则体为空；
    ③make -n check 只输出普通编译/链接命令，不构建也不运行任何测试程序。
    因此上游用例数为 0，无用例需要豁免或跳过；conanfile.py 仍在 build() 末尾执行
    make check，使 conan/CI 日志保留上游测试入口的执行痕迹（L1c）。

# 适配后补全的测试（上游无用例，按交付要求自行补全）
test_package:
  file: "test_package/test_cli.py, test_package/test_simulation.py, test_package/test_gl_stack.c"
  assertion_count: 49
  description: >
    上游无测试，故补全三组消费者测试，全部真实依赖被测产物（R34）：
    ①test_cli.py（19 断言）— 运行已安装的 bin/achilles，校验 -v/--version 与
    -h/--help 两种写法（退出码、"Achilles version 3"、GPL 免责声明、世界/启动
    选项与交互按键说明、长选项与短选项输出逐字节一致），并校验未知选项被如实
    报告、且无视频后端时干净失败；
    ②test_simulation.py（12 断言）— 以 SDL_VIDEODRIVER=dummy 真实无头运行仿真
    ~16s（4x4 世界、固定种群、--fps 10）：主循环存活、无 SDL/OSMesa 初始化错误
    （OpenGLClass 构造失败即 exit(2)，故打印出帧率报告即证明离屏上下文创建并
    置为当前）、周期性 "Frames per second:" 证明逐帧渲染、帧率节拍符合目标值、
    终止不产生 SIGSEGV/SIGABRT/SIGBUS；
    ③test_gl_stack.c（18 断言）— C 消费者探针驱动仿真所依赖的 GL/GLU/SDL 栈：
    创建 OSMesa 离屏上下文并置为当前、上报 GL_VERSION/GL_RENDERER、用 gluPerspective
    渲染固定管线四边形并断言 GL_NO_ERROR、glReadPixels 回读并断言清屏底色与
    光栅化几何同时存在，随后校验 SDL 软件表面、事件队列、键盘状态与毫秒时基。
  verified_result: "test_cli: 19 executed, 0 failed; test_simulation: 12 executed, 0 failed; test_gl_stack: 18 executed, 0 failed"

patches_applied:
  - "0001-config-sub-ohos.patch"
  - "0002-configure-umask-022.patch"
  - "0003-opengl-osmesa-offscreen.patch"
  - "0004-long-options.patch"

knowledge_gained:
  - "★ 鸿蒙 PC 无窗口系统（X11/Wayland/EGL）也无窗口 GL；制品仓的 mesa 是 OSMesa-only（只导出 libOSMesa.so，无 libGL/libEGL），glu 亦针对 OSMesa 构建 → 桌面 OpenGL 固定管线程序须把窗口 GL 上下文替换为 OSMesa 离屏上下文，并把渲出的帧拷贝到 SDL 软件表面（SDL_VIDEODRIVER=dummy 即可），而不是 stub 掉 GL 调用"
  - "GLU 包只导出 GL/glu.h，GL/gl.h 与 GL/osmesa.h 都在 mesa 包内；consumer 的 CMakeDeps 对**传递依赖**生成的 *_INCLUDE_DIRS 为空（如 gl/glu 传递的 mesa、libpng 传递的 zlib），需把 mesa 若为头文件来源则声明为直接 requires"
  - "configure 的 AC_CHECK_LIB 探测会重建 LIBS：configure 期传入的 -lGLU/-lOSMesa 会在链接期丢失，须在 make 命令行显式覆盖 LIBS（同 sdl/lbreakout2 系的 E004 类经验）"
  - "2001 年版 config.sub 既不认 aarch64 也不认 linux-ohos；configure.ac 未调用 AC_CANONICAL，故 --host 主要由 config.sub 校验，补 config.sub 两处即可，无需补 config.guess"
  - "config.status 以 umask 077 创建 ./confXXXXXX 临时目录；setgid hmdfs 上目录属主非构建 UID，0700 目录连创建者都不可写（can't create ./confXXXXXX/...: Permission denied），改 umask 022 即解（同 sdl 1.2.15 补丁 E011 类）"
  - "tarball 内 configure.ac/configure/aclocal.m4/Makefile.in 的 mtime 完全相同（同秒）；因 make 只判「严格更新」，conan 的 source 拷贝（保留 mtime）后不会触发 aclocal/autoconf 重生，CI 无 automake 也不受影响。反之若源码被失去 mtime 的方式复制（如 cp -r 不加 -p），configure.ac 可能比 aclocal.m4 更新 → make 调用 aclocal-1.16 → CI 报 inaccessible or not found"
  - "Conan 2.x 拒绝单字符版本号（RecipeReference 正则要求 ≥2 字符），用 set_version() 可让目录保持任务卡的 '3' 而制品为 achilles/v3（先例 cronic/3、cutmp3/4、rapidhash/3）"
  - "被测进程 stdout 为块缓冲：用 SIGKILL 结束会丢掉尚未 flush 的输出（如 printf 的未知选项提示），断言前应让进程自行 exit() 或改用 SIGTERM"
  - "musl loader 支持 DT_RUNPATH（readelf 显示 RUNPATH 生效），据此把依赖 lib 目录写入 rpath 可使安装后的二进制在未设 LD_LIBRARY_PATH 时也可运行"
