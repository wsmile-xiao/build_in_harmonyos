sources:
  url: "https://github.com/mrd/achilles/archive/refs/tags/v3.tar.gz"
  sha256: "2d97e68c61a7fca47153d9ac1d5f387b7165fe71f9fcdee10362959a8c73b9f5"

patches:
  - patch_file: "patches/0001-config-sub-ohos.patch"
    patch_description: "Teach the bundled 2001-vintage config.sub the aarch64 CPU and the linux-ohos kernel-OS pair (aarch64-unknown-linux-ohos)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-configure-umask-022.patch"
    patch_description: "Create the config.status scratch directory with umask 022 (setgid hmdfs makes the 0700 directory created by umask 077 unwritable even for its creator)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-opengl-osmesa-offscreen.patch"
    patch_description: "Add an OSMesa offscreen GL backend selected by the OSMESA_RENDER build macro: no window-system GL on HarmonyOS PC, so the frame rendered by softpipe is blitted onto the SDL software surface"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-long-options.patch"
    patch_description: "Accept --help/--version alongside the existing -h/-v long-form spellings so the installed binary can be smoke-tested without starting the simulation"
    patch_type: "portability"
    strip: 1
