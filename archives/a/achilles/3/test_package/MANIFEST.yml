package: achilles/3
homepage: "https://github.com/mrd/achilles"

# Upstream test entry point.  The generated Makefile does provide a `check`
# target, but it registers zero cases; conanfile.py build() still drives it so
# the conan/CI log carries the execution trace (L1c) instead of silently
# skipping the upstream entry point.
upstream_check_command: "make check (driven from conanfile.py build())"
upstream_test_in_build: true
upstream_test_command: "make check (executed from conanfile.py build() via self.run)"

# achilles 3 ships NO upstream test suite.  Counting method (all agree):
#   1. tar tzf achilles-v3.tar.gz | grep -ic test            -> 0 paths
#   2. grep -cE '^TESTS|check_PROGRAMS' Makefile.in          -> 0 hits
#      (the generated check-am/check rule bodies are empty)
#   3. make -n check                                          -> only the
#      ordinary compile/link commands, no test program is built or run
# There is consequently no upstream case to exclude or skip.
upstream_tests: []

# Layer-2 consumer validation (executed by conan create's test_package step).
# Upstream has no tests, so these consumer tests were complemented here.
test_package_tests:
  - file: test_cli.py
    description: >
      Runs the installed bin/achilles command-line interface: -v/--version and
      -h/--help in both spellings (exit status, the "Achilles version 3"
      string, the GPL warranty notice, the documented world/startup options
      and interactive keys, and that the long form matches the short form
      byte for byte), plus the unknown-option path, which must be reported to
      the user and must fail cleanly when no video backend is available.
    command: "python3 test_cli.py <package>/bin"
  - file: test_simulation.py
    description: >
      Runs the real simulator headlessly (SDL_VIDEODRIVER=dummy) for ~16s in a
      4x4 world with a fixed population and --fps 10: asserts the MainLoop
      stays alive, that no SDL/OSMesa initialization error occurs (the OpenGL
      class exits(2) on failure, so reaching the frame report proves the
      offscreen context was created and made current), that frames are
      actually rendered (the periodic "Frames per second:" reports), that
      frame pacing honours the requested target, and that termination raises
      no SIGSEGV/SIGABRT/SIGBUS.
    command: "python3 test_simulation.py <package>/bin/achilles"
  - file: test_gl_stack.c
    description: >
      C++ consumer probe of the GL/GLU/SDL stack the simulator renders
      through: creates an OSMesa offscreen context and makes it current,
      reports GL_VERSION/GL_RENDERER, renders a fixed-function quad with a
      gluPerspective projection and asserts GL_NO_ERROR, reads the frame back
      with glReadPixels and asserts both the cleared background and the
      rasterised geometry are present, then exercises the SDL video surface,
      event queue, keyboard state and millisecond timebase.
    command: "./test_gl_stack"

# Number of assertions actually executed by the three consumer tests
# (observed: 19 + 12 + 18 = 49 executed, 0 failed).
assertion_count: 49
