# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: appdirs/1.4.4
homepage: "https://github.com/ActiveState/appdirs"

# 上游测试命令 — 唯一测试源 test/test_api.py（unittest 风格，Test_AppDir 3 用例）
upstream_check_command: "python3 -m unittest -v test.test_api"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTHONPATH=<src> python3 -m unittest -v test.test_api"

# 上游实际运行的测试程序（2026-09-20 实测记录）：
# - test/test_api.py（unittest，Test_AppDir 类 3 个用例：test_metadata /
#   test_helpers / test_dirs）
# - 实测结果：**3 passed**（无失败、无跳过）→ 3/3 = 100%
# - 兼容性核验：appdirs.py 仅用 sys/os stdlib，py3.12 无 import 障碍，
#   无需源码补丁
upstream_tests:
  - file: test/test_api.py
    source: appdirs-1.4.4/test/test_api.py
    description: "上游 unittest 套件（Test_AppDir 类 3 用例；实测 3 passed = 100%）"
    command: "PYTHONPATH=<src> python3 -m unittest -v test.test_api"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_appdirs.py
    description: "消费者测试：真实 API（R34）——5 个函数式 helper + AppDirs 类 5 属性 + 版本元数据 + version 三元组，断言全部返回非空 str"
    command: "python3 test_appdirs.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 15
