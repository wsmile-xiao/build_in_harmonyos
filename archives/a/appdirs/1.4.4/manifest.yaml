knowledge_gained:
  - "appdirs 1.4.4 为纯 Python 单模块库（appdirs.py，仅依赖 sys/os stdlib），无 C/C++ 编译、零运行时依赖；HarmonyOS PC 适配只需拷贝模块到 site-packages（同 python-magic/rich/pathspec 纯 Python noarch 模式），无需任何源码补丁。"
  - "上游测试仅 1 个文件 test/test_api.py（unittest，Test_AppDir 类 3 个用例：test_metadata/test_helpers/test_dirs），源码声明总数=3，当前配置全部实例化并执行通过：3/3 = 100%。目录 API 在无 HOME/XDG 环境下仍返回 str 类型（函数式 API 与 AppDirs 类属性 API 双入口均覆盖）。"
  - "R38 判定：setup.py 无 scripts= 也无 entry_points=（无 console_scripts），py_modules=[\"appdirs\"] 纯库包，无 bin/ 产物 → 不需要 commands.json（纯库包不应伪造）。"

