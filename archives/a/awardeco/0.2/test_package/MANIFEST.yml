# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: awardeco/0.2
homepage: "https://salsa.debian.org/debian/awardeco"

# 上游测试命令 — awardeco 上游无独立 CI 单元测试套件（BIOS 反编译工具，
# 验证 = make 构建 + 运行）
upstream_check_command: "make"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-21 实测记录）：
# - 上游无独立测试套件（无 make test 入口；源码含 awardeco.c/Makefile）
# - 构建验证：make（CC=clang）分步编译 awardfnc.o/kernel.o/awardeco ——
#   实测通过
# - 消费者验证（test_package）：二进制存在 + 可执行 + ELF + usage 输出
#   （R34 降级——反编译需输入 BIOS flash 固件文件，上游无样例随包分发，
#   如实说明）
upstream_tests: []
