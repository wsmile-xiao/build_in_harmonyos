# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: arb/2.9.0
homepage: "https://arblib.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 全量 667 个独立测试入口见 reports/upstream-tests-ledger.md,
# 此处仅登记代表性抽样(全量均已在执行端逐项运行: 通过 662/667)。
upstream_tests:
  - file: arb/test/t-add.c
    source: arb-2.9.0/arb/test/t-add.c
    description: "arb_add 区间加法一致性测试"
    command: "./build/arb/test/t-add"
  - file: arb_poly/test/t-evaluate.c
    source: arb-2.9.0/arb_poly/test/t-evaluate.c
    description: "arb_poly 多项式求值测试"
    command: "./build/arb_poly/test/t-evaluate"
  - file: arf/test/t-add.c
    source: arb-2.9.0/arf/test/t-add.c
    description: "arf 加法测试"
    command: "./build/arf/test/t-add"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者视角: 验证 sin(pi/6)=1/2 与 (sqrt(2))^2=2 区间包含"
    command: "./test_arb"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 667