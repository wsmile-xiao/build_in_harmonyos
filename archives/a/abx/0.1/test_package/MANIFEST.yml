package: abx/0.1
homepage: "https://phintsan.kapsi.fi/abx.html"

upstream_tests_exist: false
upstream_test_audit:
  - source: "abx-0.1 source tree"
    reason: "No tests/ or test/ directory is present."
  - source: "Makefile.am and src/Makefile.am"
    reason: "They define only SUBDIRS and bin_PROGRAMS; there is no TESTS, check_PROGRAMS, or meaningful check target."
  - source: "src/test.c"
    reason: "Despite its name, this file implements the application's ABX trial model and p-value calculation; it is linked into the abx executable and is not a test harness."
  - conclusion: "Upstream 0.1 provides no automated tests; the adaptation adds an installed-binary runtime self-test without presenting it as upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_abx.sh
    description: "Execute packaged abx --version and --help headlessly; validate package presence, exact version, usage, and four option lines."
    command: "sh test_abx.sh <package>/bin/abx"
  - file: generate_wavs.py
    description: "Generate two deterministic 800-frame stereo PCM WAV inputs plus a short negative fixture."
    command: "python3 generate_wavs.py <output-directory>"
  - file: test_abx.sh
    description: "Run the installed binary's production-code self-test over libsndfile metadata/PCM/seek, the ABX model and p-value, GTK3 object model, and PortAudio initialization."
    command: "abx --self-test sample-a.wav sample-b.wav"
  - file: test_abx.sh
    description: "Require mismatched-duration and malformed-audio inputs to fail closed with the expected diagnostics."
    command: "abx --self-test sample-a.wav <negative-fixture>"

test_scenario_count: 4
assertion_count: 37
assertion_count_basis:
  cli_and_package: 8
  soundfile_and_abx_model: 18
  gtk_and_portaudio_runtime: 7
  negative_paths: 4
hardware_playback_required: false
hardware_playback_note: "The current portaudio/19.7.0 package intentionally has no host API backend on HarmonyOS (host_apis=0, devices=0), so this deterministic gate proves initialization and inventory consistency but does not claim speaker playback."
