knowledge_gained:
  - "abx 0.1 is an Autotools GTK application; the original release targets GTK2, while Debian provides a focused GTK3 portability patch."
  - "The signed Debian source package records SHA256 3eed66f4b70e826b469f8e7fa28ee7ecd84036bf1e384980636c9c3e985a10bb for the pristine upstream orig tarball."
  - "Upstream 0.1 has no automated test suite; src/test.c is production ABX statistics code, not a test executable."
  - "Conan-cache automake and aclocal are Perl programs whose shebang launch is blocked on HMDFS; invoking their real entry points with the SDK Perl interpreter is reliable."
  - "Autoconf's config.status template must not create a 0700 temporary directory on HMDFS because the setgid permission combination makes its generated awk scripts inaccessible."
  - "The version and help paths must return before GTK option-group registration; on this device the GOption GTK help path waits indefinitely in a futex."
  - "The packaged OHOS executable is self-signed and contains exactly one .codesign section."
  - "The production ABX model previously accepted trial index ntrials and could access one element past its answer and guess arrays."
  - "seek_sound_file previously truncated fractional-second positions through sf_count_t; the runtime self-test exposed and now covers the fix."
  - "The current HarmonyOS PortAudio package initializes consistently but exposes zero host APIs and zero devices, so this result does not claim speaker playback."
