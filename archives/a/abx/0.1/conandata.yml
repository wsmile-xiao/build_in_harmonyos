# abx 0.1 upstream release. The author's historical archive currently rejects
# automated downloads; Debian's signed source package carries the pristine
# upstream orig tarball with this exact SHA256.
sources:
  url: "https://deb.debian.org/debian/pool/main/a/abx/abx_0.1.orig.tar.gz"
  sha256: "3eed66f4b70e826b469f8e7fa28ee7ecd84036bf1e384980636c9c3e985a10bb"

patches:
  - patch_file: "patches/0001-port-to-gtk3.patch"
    strip: 1
    patch_description: "Port abx 0.1 from GTK2 to GTK3 using Debian's reviewed portability patch"
    patch_type: "portability"
  - patch_file: "patches/0002-use-pkg-config-for-glib.patch"
    strip: 1
    patch_description: "Discover GLib threads through pkg-config so autoreconf does not depend on the obsolete glib.m4 macro"
    patch_type: "build"
  - patch_file: "patches/0003-add-version-option.patch"
    strip: 1
    patch_description: "Add a headless --version path required by the command-line smoke gate"
    patch_type: "portability"
  - patch_file: "patches/0004-defer-display-open.patch"
    strip: 1
    patch_description: "Defer GTK display opening so --version and --help remain headless"
    patch_type: "portability"
  - patch_file: "patches/0005-handle-headless-options-early.patch"
    strip: 1
    patch_description: "Handle version and help before registering GTK options"
    patch_type: "portability"
  - patch_file: "patches/0006-fix-trial-index-bounds.patch"
    strip: 0
    patch_description: "Reject trial index ntrials instead of reading or writing one element past the allocated arrays"
    patch_type: "bugfix"
  - patch_file: "patches/0007-add-runtime-self-test.patch"
    strip: 0
    patch_description: "Add a deterministic installed-binary self-test for sound files, ABX statistics, GTK3, and PortAudio"
    patch_type: "test"
  - patch_file: "patches/0008-preserve-seek-precision.patch"
    strip: 0
    patch_description: "Return fractional-second seek positions without truncating them through an integer frame type"
    patch_type: "bugfix"
