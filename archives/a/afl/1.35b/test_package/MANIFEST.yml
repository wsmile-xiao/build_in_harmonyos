test_type: explicit
upstream_test_framework: none
assertion_count: 3

# Classic afl 1.35b has no formal upstream test suite: the only built-in
# test is the `make all` test_build step (test-instr.c instrumentation
# smoke test), which cannot run on aarch64 because afl-as's injected
# assembly is x86-only (documented in notes.md).
#
# The test_package verifies the packaged tools actually run on OHOS:
#   1. afl-gotcpu exits 0 (CPU benchmark)
#   2. afl-showmap forks/execs a target via stdin and writes a map
#      (mmap-based shared memory works; map is empty without
#      instrumentation on aarch64)
#   3. afl-fuzz -n (dumb mode) starts and creates out/queue with the
#      initial seed
