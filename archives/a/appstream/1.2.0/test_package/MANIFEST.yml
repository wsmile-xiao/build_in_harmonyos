# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 测试枚举依据：
#   解压上游源码后 `meson test --list`（本 OHOS 配置 compose/docs/qt 关闭）→ 8 个
#   已注册可执行用例；完整枚举与运行结果见 reports/evidence/r02-upstream-test-ledger.md

package: appstream/1.2.0
homepage: "https://www.freedesktop.org/wiki/Distributions/AppStream/"

# 上游测试命令（本库为 Meson；列出注册入口）
upstream_check_command: "meson test -v --print-errorlogs"

# conanfile.py build() 中未集成上游测试（conan create 只编译；测试单独运行）
upstream_test_in_build: false
upstream_test_command: "meson test -v --print-errorlogs"

# 上游实际运行的测试程序（8 个配置可执行用例；4 通过 / 4 失败原因见 ledger）
upstream_tests:
  - file: tests/as-test_basic
    source: appstream-1.2.0/tests/test-basics.c
    description: "基础工具函数用例（27 套件断言；test_utils_untar 因 /tmp erofs 只读 FAIL）"
    command: "./as-test_basic <tests-dir>"
  - file: tests/as-test_xml
    source: appstream-1.2.0/tests/test-xmldata.c
    description: "XML 读写用例（39 断言，PASS）"
    command: "./as-test_xml <tests-dir>"
  - file: tests/as-test_yaml
    source: appstream-1.2.0/tests/test-yamldata.c
    description: "YAML 读写用例（34 断言，PASS）"
    command: "./as-test_yaml <tests-dir>"
  - file: tests/as-test_pool
    source: appstream-1.2.0/tests/test-pool.c
    description: "AsPool 用例（10 断言；FileMonitorDir 因 /tmp erofs 只读 FAIL）"
    command: "./as-test_pool <tests-dir>"
  - file: tests/as-test_validate
    source: appstream-1.2.0/tests/test-validate.c
    description: "校验器用例（7 断言；https URL 因 ohpcd libcurl 无 SSL FAIL）"
    command: "./as-test_validate <tests-dir>"
  - file: tests/as-test_perf
    source: appstream-1.2.0/tests/test-performance.c
    description: "性能用例（2 断言，PASS）"
    command: "./as-test_perf <tests-dir>"
  - file: tests/as-test_misc
    source: appstream-1.2.0/tests/test-misc.c
    description: "杂项用例（14 断言，PASS）"
    command: "./as-test_misc <tests-dir>"
  - file: data/as-validate_metainfo.cli
    source: appstream-1.2.0/data/meson.build
    description: "metainfo 校验（appstreamcli validate --pedantic --no-net；https URL 因 libcurl 无 SSL FAIL）"
    command: "./appstreamcli validate --pedantic --no-net <metainfo.xml>"

# test_package 中自带的测试（消费者视角验证，R34 实质调用公开 API）
test_package_tests:
  - file: test.c
    description: "消费者测试：as_metadata_parse_data 解析 metainfo 并校验 component id/内容"
    command: "./test_appstream"

# 测试断言总数（approximate；上游 g_test_add_func 套件用例 162 + 本 test_package 断言 5）
assertion_count: 170