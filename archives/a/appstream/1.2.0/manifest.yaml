# 版本级 manifest — appstream 1.2.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.0"

# 软件名
software: "appstream"

# 编译状态（conan-verify 通过；交付前由 finish/submit 维护）
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档）
  url: "https://github.com/ximion/appstream/archive/refs/tags/v1.2.0.tar.gz"

  # 源码校验和（官方 tarball 实测）
  sha256: "02f723cb1afa372d434896e138503163a44ad49e4a813d0d30713fc38ccb8d0c"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项（Conan MesonToolchain project_options）
  configure_options:
  - "-Ddefault_library=static"
  - "-Dstemming=true"
  - "-Dsystemd=false"
  - "-Dgir=false"
  - "-Dman=false"
  - "-Ddocs=false"
  - "-Dapidocs=false"
  - "-Dqt=false"
  - "-Dcompose=false"
  - "-Dvapi=false"
  - "-Dapt-support=false"
  - "-Ddisplay-detection=none"
  - "-Dbash-completion=false"

  # 编译依赖列表（格式: name/version，Conan requirements）
  dependencies:
  - glib/2.88.3
  - libcurl/8.5.0
  - libxml2/2.15.3.1
  - libfyaml/0.9.6
  - libstemmer/3.1.1
  - zstd/1.5.7.1
  - libxmlb/0.3.19

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（conandata.yml patches 一一对应）
patches_applied:
- "patches/0001-stemmer-include-dir.patch"
- "patches/0002-itstool-optional.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（知识候选台账见 notes.md / 知识库查重；ref: 指向 knowledge/drafts 草稿）
knowledge_gained:
- "meson 硬编码 /usr/include 的 include_directories 在 OHOS 无该目录会直接 configure 失败；由 Conan 依赖经 extra_cflags -I 提供头文件时需最小补丁移除硬编码路径" (ref: DRAFT-appstream-1.2.0-ohos-meson-usr-include-hardcode)
- "meson i18n.itstool_join 无条件要求 itstool 程序；OHOS 无 itstool 时改为 find_program(required:false) 回退未翻译 metainfo，测试仍可运行" (ref: DRAFT-appstream-1.2.0-ohos-meson-itstool-join-optional)
- "PkgConfigDeps 对根级 cpp_info.requires 的解析在组件式 package_info 下才稳定（libxmlb 同款）；组件 requires 保证生成的 .pc Requires 链完整，静态库消费者才能链接全部符号" (ref: DRAFT-appstream-1.2.0-ohos-pkgconfig-component-requires-pc)
- "glib 包内 host 工具（glib-compile-resources 等）从 conan 缓存路径直接 exec 会因 HMDFS 签名/权限失败；meson find_program 期已解析绝对路径，需在 machine file [binaries] 映射 wrapper 脚本注入 LD_LIBRARY_PATH" (ref: DRAFT-appstream-1.2.0-ohos-meson-glib-tool-binaries-wrapper)
- "glib 组件键跨版本命名差异（2.84.0.1 带 -2.0 后缀 vs 2.88.3 无后缀）致 PkgConfigDeps 组件 requires 解析 'Component not found'；force 固化版本 + 为依赖 cpp_info 注入无后缀别名组件键 + 手动调用 PkgConfigDeps（类级 generators 先于 generate() 运行失效）" (ref: DRAFT-appstream-1.2.0-r04-glib-component-key-version-matrix)
- "静态 glib（shared=False，pango 链强制）下可执行目标/消费者链接缺 libffi（ffi_type_void 等）与 g_libintl_gettext；按 shared 条件在 generate() 补 -L<libffi>/lib -lffi、消费者组件 libs 追加 intl" (ref: DRAFT-appstream-1.2.0-r04-static-glib-consumer-link-ffi-intl)
- "conan 2 override=True 的 require 不算 direct requirement（package_info 组件 requires 校验报 'not a direct requirement'）；覆盖依赖精确版本需改用 force=True（保留 direct 语义 + 强制版本）" (ref: DRAFT-appstream-1.2.0-r04-conan-override-force-direct)