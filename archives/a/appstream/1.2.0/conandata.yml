patches:
  - patch_file: "patches/0001-stemmer-include-dir.patch"
    patch_description: "Remove hardcoded /usr/include stemmer include dir (OHOS build machine has no /usr/include); libstemmer.h comes via Conan dep -I"
    patch_type: "portability"
  - patch_file: "patches/0002-itstool-optional.patch"
    patch_description: "Make metainfo i18n itstool_join optional (OHOS has no itstool); fall back to untranslated metainfo so as-validate_metainfo.cli still runs"
    patch_type: "portability"
  - patch_file: "patches/0003-tests-tmpdir-env.patch"
    patch_description: "Replace hardcoded /tmp paths in test sources with g_get_tmp_dir() so TMPDIR/TMP/TEMP (user-writable 0700 dir) is honored on OHOS where /tmp is erofs read-only"
    patch_type: "portability"
  - patch_file: "patches/0004-tar-no-xattrs-compat.patch"
    patch_description: "Drop --no-xattrs/--no-acls from tar invocation (OHOS toybox tar does not support them; it does not restore xattr/ACL anyway and --no-same-owner/--no-same-permissions plus secure umask remain)"
    patch_type: "portability"
  - patch_file: "patches/0005-filemonitor-changed-dedup.patch"
    patch_description: "AsFileMonitor: skip emitting 'changed' for files that will be emitted as 'added' in the same batch (event arrival order differs per filesystem; on OHOS ATTRIBUTE_CHANGED may precede CREATED)"
    patch_type: "portability"
  - patch_file: "patches/0006-curl-is-url-non-support-scheme.patch"
    patch_description: "as_curl_is_url: pass CURLU_NON_SUPPORT_SCHEME so URL format validation does not depend on libcurl being built with each scheme's protocol handler (ohpcd libcurl/8.5.0 has no SSL/https); reachability stays gated by check_urls"
    patch_type: "portability"
  - patch_file: "patches/0007-docs-daps-optional.patch"
    patch_description: "docs/meson.build: make daps (DocBook publishing tool) optional — as-validate_docs test runs with python + gen_doc_valsec only and must be included even when daps is absent"
    patch_type: "portability"
  - patch_file: "patches/0008-docs-validate-daps-skip.patch"
    patch_description: "doc-build-helper.py: skip the daps subprocess call when the daps binary is absent (valsec-gen already validates doc tag sections) so as-validate_docs stays runnable on platforms without DocBook tooling"
    patch_type: "portability"
  - patch_file: "patches/0009-qt-loadasync-glib-pump.patch"
    patch_description: "Qt Pool::loadAsync: OHOS qtbase has no QEventDispatcherGlib, so GTask completion callbacks on the default GMainContext never fire under a pure Qt event loop; pump g_main_context_iteration with a 0ms QTimer until loadFinished is emitted"
    patch_type: "portability"
  - patch_file: "patches/0010-asw-image-optional-codecs.patch"
    patch_description: "asw_image_backend_init: make PNG/JPEG the hard requirements and downgrade JPEG-XL/SVG to capability warnings — libvips builds without libjxl/librsvg (OHOS package matrix) can still process PNG/JPEG media, and format-specific operations report unsupported errors on demand"
    patch_type: "portability"
  - patch_file: "patches/0011-compose-worker-feature-detect.patch"
    patch_description: "test-compose-worker.c: feature-detect SVG (librsvg) and JPEG-XL (libjxl) loader availability instead of asserting unconditional support — sections using absent codecs are skipped with a reason, mirroring the existing Landlock/libvips-version skip pattern"
    patch_type: "portability"
  - patch_file: "patches/0012-asw-ipc-fd-stat-ohos.patch"
    patch_description: "asw-ipc.c asw_memfd_verify_sealed: OHOS denies fstat() on fds received via SCM_RIGHTS (EACCES) — treat that as the platform case, keep the F_GET_SEALS security gate, and derive the size via lseek when fstat is denied"
    patch_type: "portability"
  - patch_file: "patches/0013-asw-worker-fd-stat-ohos.patch"
    patch_description: "asw-worker.c: same OHOS SCM_RIGHTS fstat EACCES tolerance for asw_worker_get_readonly_file_fd / asw_worker_get_output_fd — the F_GETFL access-mode checks remain the effective gate"
    patch_type: "portability"
  - patch_file: "patches/0014-asc-media-tmpfile-linkat-probe.patch"
    patch_description: "asc-media.c asc_media_use_tmpfile: probe that an O_TMPFILE inode can actually be published via linkat(/proc/self/fd/N) — OHOS mounts /proc but denies the linkat with EACCES, so fall back to named temporary files + renameat (which works) instead of failing every rendition at commit time"
    patch_type: "portability"
  - patch_file: "patches/0015-asw-font-fd-map-ohos.patch"
    patch_description: "asw-font.c asw_font_new_from_fd: g_mapped_file_new_from_fd() fails internally on OHOS because fstat() is denied on SCM_RIGHTS-received fds — map the descriptor directly via lseek+mmap (same approach as asw_memfd_map_bytes), deriving the size by seek when fstat returns EACCES"
    patch_type: "portability"
  - patch_file: "patches/0016-asc-directory-unit-openat2-sigsys.patch"
    patch_description: "asc-directory-unit.c asc_openat2_usable: OHOS seccomp kills the process with SIGSYS when openat2() is blocked (instead of returning an error), so the capability probe dies — guard the probe with a SIGSYS handler + sigsetjmp and fall back to userspace path resolution"
    patch_type: "portability"
  - patch_file: "patches/0017-asc-media-image-formats.patch"
    patch_description: "asc-media.c: parse the image-formats list the media worker reports in its handshake and expose asc_media_supports_image_format() so callers can pick a format the underlying libvips build can actually save (JPEG-XL absent on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0017b-asc-media-h-image-formats.patch"
    patch_description: "asc-media.h: declare asc_media_supports_image_format() public accessor"
    patch_type: "portability"
  - patch_file: "patches/0018-test-compose-font-format.patch"
    patch_description: "test-compose.c test_compose_font: feature-detect JPEG-XL support via asc_media_supports_image_format() and fall back to PNG when libvips lacks libjxl (mirrors the vips feature-detection fixes in test-compose-worker.c)"
    patch_type: "portability"
