# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: apngasm/3.1.10
homepage: "https://github.com/apngasm/apngasm"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/cpp/apngasm-test.cpp
    source: apngasm-3.1.10/test/cpp/apngasm-test.cpp
    description: "C++ API test: assembles APNG from sample images and verifies output"
    command: "./apngasm-cpp-test ${PROJECT_SOURCE_DIR}/samples"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/main.cpp
    description: "Consumer test: links against apngasm library and calls version() API"
    command: "./test_apngasm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
