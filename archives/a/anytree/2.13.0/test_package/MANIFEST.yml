# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: anytree/2.13.0
homepage: "https://github.com/c0fec0de/anytree"

# 上游测试命令 — pytest（tests/ 目录，tests/__init__.py 存在故支持相对导入）
# 注意：4 个文件在**收集期** import test2ref（dev-group 工具，非运行时依赖，
# 且未发布到 ohpcd）→ 会使整个套件收集中断，故显式 --ignore 并输出理由（R51）。
upstream_check_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src python3 -m pytest tests -q --ignore=tests/test_dotexport.py --ignore=tests/test_dotexporter.py --ignore=tests/test_mermaidexporter.py --ignore=tests/test_uniquedotexporter.py"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src python3 -m pytest tests -q --assert=plain -p no:cacheprovider --ignore=tests/test_dotexport.py --ignore=tests/test_dotexporter.py --ignore=tests/test_mermaidexporter.py --ignore=tests/test_uniquedotexporter.py"

# 上游实际运行的测试程序（2026-09-16 实测记录）：
# - tests/ 下 26 个 .py 测试文件（总 45 个文件含 refdata/ 参照数据）
# - 其中 4 个（test_dotexport / test_dotexporter / test_mermaidexporter /
#   test_uniquedotexporter）在导入期 `import test2ref`；test2ref 属
#   [dependency-groups] dev 组（非运行时依赖），未发布到 ohpcd → 收集阶段即
#   ModuleNotFoundError，会中断整个套件，故按 R51 **显式排除并输出理由**
# - 其余 22 个文件：143 passed（实测）
# - 纯 Python 包（含 5 个子包 node/iterators/exporter/importer/util），无 C 扩展
upstream_tests:
  - file: tests/
    source: anytree-2.13.0/tests/
    description: "上游 pytest 套件（26 个测试文件）；排除 4 个收集期 import test2ref 的文件后 143 passed"
    command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src python3 -m pytest tests -q --assert=plain -p no:cacheprovider（+4 个 --ignore）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_anytree.py
    description: >-
      消费者测试：真实 API（R34）——构建真实树并逐项验证：is_root/parent/
      children/height/depth/path/descendants/leaves；三种遍历顺序
      （PreOrderIter root,a,a1,a2,b ／ LevelOrderIter root,a,b,a1,a2 ／
      PostOrderIter a1,a2,a,b,root）与 ZigZagGroupIter 分层；搜索
      （find/findall/find_by_attr/findall_by_attr）；Resolver 路径解析
      （a/a1、/b）；AnyNode 字典节点；DictExporter↔DictImporter 往返；
      RenderTree 渲染；LoopError 错误路径。
      另固化两个上游事实：__version__ 为陈旧值 "2.12.1"（发行版为 2.13.0）、
      __all__ 33 项；并跨 5 个子包导入（node/iterators/exporter/importer/util），
      子包缺失即失败。
    command: "python3 test_anytree.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 39
