# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md 与 references/iron-rules.md R51（上游测试三步法）

package: arg_router/1.3.0
homepage: "https://github.com/cmannett85/arg_router"

# ── 上游测试入口 ─────────────────────────────────────────────────────────
# 上游 tarball 自带 CMakeLists.txt：BUILD_UNIT_TESTS_AND_EXAMPLES=ON（默认值）时
# `enable_testing()` + add_subdirectory(test) → test/CMakeLists.txt 引入
# cmake/build_types/{unit_test,unit_test_coverage,death_test}.cmake，最终注册
# **1 个聚合可执行 arg_router_test**（Boost.Test，64 个 TU：63 个 *_test.cpp +
# test_helpers.cpp）。上游无 make check，CMake 项目的等价入口是 ctest。
upstream_check_command: "ctest --test-dir <build-dir> --output-on-failure -V"

# conanfile.py build() 中已集成上游测试（docs/TEST_QUALITY_SPEC.md §3.1 层 1 必做）
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure -V   # 配方 build() 内 configure + build + 三重反假绿断言（CTestTestfile 注册数==1、--list_content==354、ctest `0 tests failed out of 1` + 程序 `*** No errors detected`）；沙箱 HOME = <build>/test-home"

# 上游实际运行的测试（1 个 CTest 聚合项 = Boost.Test 354 个已注册用例）
upstream_tests:
  - file: arg_router_test
    source: test/*.cpp test/*/*.cpp（64 个 TU，unit_test.cmake 的 TEST_SRCS 清单）
    description: "上游唯一测试入口：Boost.Test 聚合可执行，`-fno-rtti -Werror -Wall -Wextra` 编译；含 44 处 death_test_compile（运行期重编译片段并断言编译失败与诊断文本），ctest 注册项 = 1"
    command: "./test/arg_router_test --list_content   # 框架注册数 354（反假绿断言面）"
  - file: CTestTestfile.cmake
    source: test/CMakeLists.txt
    description: "ctest 注册面（**程序口径，不作 N**）：`ctest -N` 只有 1 个注册项 arg_router_test；N 按候选数法取源码宏数 364（见文件末「N 的取数命令」）"
    command: "ctest --test-dir <build-dir> -N"

# ── test_package 中自带的测试（消费者视角验证，PR 正文「鸿蒙特有测试」行）──
test_package_tests:
  - file: test_arg_router.cpp
    description: "arg_router 消费者测试：经 CMakeDeps 的 arg_router::arg_router 链接**打包后的头文件**，真实调用 root/mode/flag/arg/default_value/validation 解析 argv —— 6 条断言（长选项取值 / 短选项 / 显式取值 / 默认值回落 / UTF-8 非 ASCII 取值往返「鸿蒙PC」/ 非法 int 走异常且 router 未被调用）；OHOS aarch64 + libc++ + C++20 实编译实运行，不计入上游分母"
    command: "./test_arg_router   # 末行 ARG-ROUTER-CONSUMER checks=6 failures=0"

# ── N 的取数命令（R51 候选数法：同一单位取最大值，差额逐项归因）──────────
#   1) 源码宏数（**N 口径·候选最大值**）:
#        grep -rnoE 'BOOST_(AUTO|FIXTURE|PARAMETER|TEMPLATE)_TEST_CASE' <source>/test/ | wc -l
#        → 364   （360 条 BOOST_AUTO_TEST_CASE + 4 条 BOOST_FIXTURE_TEST_CASE，62 个文件，116 个 SUITE 声明）
#   2) 框架注册数: ./test/arg_router_test --list_content | grep -cE '^\s*Case:'
#        → 354   （与 build() 内硬断言同值；差额 10 见下）
#   3) CTest 注册数（程序口径，不作 N）: ctest --test-dir <build> -N → Total Tests: 1
#        = 1 个聚合可执行 arg_router_test
#   4) 断言数（assertion 单位，单列不作 N）: grep -rhoE 'BOOST_(CHECK|REQUIRE|WARN)(_[A-Z]+)?\(' <source>/test/ | wc -l
#        → 749 源码静态；逐行预处理守卫跟踪显示 13 个未编译用例体内只有 static_assert、
#          无运行期断言宏 ⇒ 执行面仍为 749 条
#   5) 消费者断言数（鸿蒙特有，分栏不进上游分母）: ./test_arg_router → ARG-ROUTER-CONSUMER checks=6 → 6
#
# N = max(364, 354) = **364**（1)/2) 同为「测试用例数」单位；3) 是「测试程序数」单位、
# 4)/5) 单位不同，按「四口径不混用」单列）。
# N′ = 354（2) 口径下本平台实际注册并全量运行的用例，ctest 未带 --run_test 过滤），
#      TOTAL = PASS 354 + FAIL 0 + SKIP 0 + NOT_RUN 10 = 364 = N，通过率 354/364（97.3%）
#      （分母=源码宏数 N；分栏：框架口径 354/354 全过、CTest 程序口径 1/1 全过）
#
# 差额归因（严格合计，364 → 354 = −10）:
#   include/arg_router/config.hpp: `#if (__cplusplus >= 202002L) && !AR_DISABLE_CPP20_STRINGS`
#   → 定义 AR_ENABLE_CPP20_STRINGS。本配方走**上游默认形态**（配方钩子 unset 掉 conan
#     toolchain 强加的全局 CMAKE_CXX_STANDARD，unit_test.cmake 的 `if(NOT DEFINED …)` 成立
#     ⇒ 主测试树 `cxx_std_20`，与 death_test.cmake 无条件的 cxx_std_20 同标准）⇒ 该宏**已定义**，
#     于是上游自己用条件编译把「只在 C++17 存在」的用例排除（−10）：
#       · test/multi_lang/root_wrapper_test.cpp     −4（整文件 `#ifndef AR_ENABLE_CPP20_STRINGS`；
#         C++20 下 arg_router::multi_lang 命名空间本就不存在）
#       · test/multi_lang/string_selector_test.cpp  −1（同上）
#       · test/utility/compile_time_string_test.cpp −5（`#else` 分支的 C++17 `S_` 宏族用例；
#         `#ifdef` 分支的 7 例照常注册）
#   反向：`#ifdef AR_ENABLE_CPP20_STRINGS` 的 6 个 policy 文件的 string_literal_test（各 1 例）
#   在 C++20 下正常注册（已含在 364 内）。
#   取数法：逐行跟踪 `#ifdef/#ifndef/#else/#endif` 活跃态的脚本复算 364 → 354（inactive 10），
#   与 build() 内 `--list_content` 用例行硬断言互证。
#   （对照：若把全局标准钉成 C++17，主测试树 17 而 death 目标仍 20 —— 上游那 10 个
#     「仅 C++17」用例会编进主测试树、其 death 片段却由 C++20 编译，实测 4 个 death 用例
#     因期望 static_assert 文本未触发而假失败；这正是钩子要 unset 全局标准的原因。）
#
# 「上游条件编译排除」的 10 个用例：既不是 PASS 也不是 SKIP，按 §7.3 在本文件、notes.md 与
# reports/test-report.md 三处单列说明并给出守卫证据（config.hpp 的 #if 条件原文）。
assertion_count: 6   # = test_package/test_arg_router.cpp 消费者断言数（末行 ARG-ROUTER-CONSUMER checks=6）
