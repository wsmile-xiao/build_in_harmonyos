# 版本级 manifest
# 文件位置: archives/a/arg_router/1.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.0"

# 软件名
software: "arg_router"

# 编译状态
# published | built | failed | archived
# （O5：合并并确认 release upload 之前一律 built，不得写 published）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: "cmake"

# Conan 引用
conan_ref: "arg_router/1.3.0"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档，R39）
  url: "https://github.com/cmannett85/arg_router/archive/refs/tags/v1.3.0.tar.gz"

  # 源码校验和（2026-09-28 设备实测下载值 == 任务卡 CCI 记录 4ef2ec92…）
  sha256: "4ef2ec923046c26d65b19f06630b3180a81189362d8920a68113c7d921ca968b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

  # tag 与 tag 提交（git ls-remote --tags 实证，9 个 tag 全量命中）
  tag: "v1.3.0"
  tag_commit: "ea82e8c94c84b8df80b38a37b65162c70d10b276"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py generate() 的 cache_variables 一致）
  # DISABLE_VCPKG=ON：上游 external/vcpkg 子模块在 tag 归档里为空，
  #   不关会把不存在的 CMAKE_TOOLCHAIN_FILE 指给 CMake（configure 直接失败）
  # BUILD_UNIT_TESTS_AND_EXAMPLES=ON：上游默认值即 ON，此处显式钉住
  #   （层 1 上游测试 = test/ 下 1 个 Boost.Test 可执行 arg_router_test）
  configure_options:
    - "-DDISABLE_VCPKG=ON"
    - "-DBUILD_UNIT_TESTS_AND_EXAMPLES=ON"
    - "-DBUILD_CPP20_EXAMPLES=ON"
    - "-DENABLE_CLANG_FORMAT_CHECKS=OFF"

  # 编译依赖列表（格式: name/version）
  # W0-2 实查：ohpcd 远端存在 boost/*（15 个版本），binary 与本 profile
  #   （os=OHOS/clang15/armv8/libc++/cppstd=17/Release）同 id，conan install --build=never rc=0。
  #   选 boost/1.85.0：上游测试要 Boost.Process **v1** 顶层头（Boost ≥1.88 已挪进 v1/ 子目录，
  #   1.90/1.91 系列实测缺 boost/process/{io,search_path,system,child}.hpp）+ Boost::filesystem
  #   编译产物（1.90.0 裁剪版、.3/.4.1 选择性安装均不满足）+ 远端已有本 profile binary；
  #   其缺 Boost::boost 目标一项由配方 generate() 的 CMake 钩子补（零源码补丁）。
  #   span-lite：C++17 下 basic_types.hpp 取 <nonstd/span.hpp>；上游 vcpkg.json 明列该依赖、
  #   pr_checker.yml:155 以 CMAKE_CXX_STANDARD=17 跑测试 ⇒ 上游默认配置就是 C++17 + span-lite
  dependencies:
    - "boost/1.85.0"
    - "span-lite/0.11.0"

  # 编译器
  cc: clang
  cxx: clang++

# 供 finish 内嵌 G0 clean-verify 的 cmake configure 直接取用（该闸按本键解析）
build_options: "-DDISABLE_VCPKG=ON -DBUILD_UNIT_TESTS_AND_EXAMPLES=ON -DBUILD_CPP20_EXAMPLES=ON"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本轮零补丁：W0-3 ISA/printf/架构可移植性 grep 全零命中，
# 源码无需平台改动，见 notes.md）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（human 索引；知识草稿按官方机制由 engine 未命中才产生）
knowledge_gained:
  - "ohpcd 远端 boost 15 个版本形态不一，选型必须三条一起查：①上游 test/ 要 Boost.Process v1 顶层头 boost/process/{io,search_path,system,child}.hpp，而 Boost >=1.88 已把 v1 挪进 boost/process/v1/（1.90/1.91 全系实测缺）；②要 Boost::filesystem 编译产物（1.90.0 是裁剪版只导出 headers+unit_test_framework.a，1.90.0.3/.4.1 走 BOOST_INCLUDE_LIBRARIES 选择性安装且不含 process）；③远端要有本 profile 的 binary。三条全中的只有 boost/1.85.0"
  - "Conan 的 conan_toolchain.cmake 无条件 set(CMAKE_CXX_STANDARD <profile cppstd>)，命令行 -D 与 cache 传值都被盖掉（实测 -DCMAKE_CXX_STANDARD=20 无效）。当上游按 if(NOT DEFINED CMAKE_CXX_STANDARD) 分派、又有目标无条件 target_compile_features(cxx_std_20) 时，全局钉标准会造成两棵树标准错位——本包实测 4 个 death 用例假失败；解法是 CMAKE_PROJECT_INCLUDE 钩子里 unset(CMAKE_CXX_STANDARD)，回到上游默认分派"
  - "ohpcd 的 boost/1.85.0 导出的是 Boost::headers/Boost::filesystem/... 与小写根目标 boost::boost，而上游 library.cmake 无条件链 Boost::boost（CMake 目标名大小写敏感）⇒ 钩子补一个 INTERFACE 转发目标，零源码补丁"
  - "header-only 包的 G4/L2/L4/L5 门禁走跳过分支却并列打 ✅，按 device-facts §二 人工补测并写 reports/conan-verify-supplement.md"
  - "Boost 1.85 的 --list_content 是 HRF 树（<indent><name>*，* = RS_ENABLED，master suite 不打印、无 Case: 前缀）：用例数 = 总行数 - 名字以 _suite 结尾的套件行；直接数 Case: 恒为 0"
