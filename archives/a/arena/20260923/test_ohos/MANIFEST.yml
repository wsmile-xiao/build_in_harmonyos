# test_ohos/MANIFEST.yml
# arena 20260923 HarmonyOS 专项测试声明

package: arena/20260923

# 测试类型: 鸿蒙专项测试（真机 aarch64/musl 独立验证，自包含目录）
test_type: ohos_special

# 测试文件
test_files:
  - ohos_special_test.c
  - run_ohos_test.py

# 覆盖的公开 API（真实调用并可观察结果）
covered_apis:
  - arena_alloc
  - arena_realloc
  - arena_memdup
  - arena_sprintf
  - arena_mark
  - arena_rewind
  - arena_reset
  - arena_free
  - arena_trim
  - arena_sb_append_cstr
  - arena_sb_append_buf
  - arena_sb_append_null

# 运行方式
run_command: "python3 run_ohos_test.py <conan_package_folder>"

# 与上游测试 / 消费者测试的区别
distinct_from: "上游无测试；test_package 为 L1 消费者 smoke；本用例为鸿蒙专项语义压力验证（跨 Region、快照回退、压力循环）"
