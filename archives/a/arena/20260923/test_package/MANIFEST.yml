# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: arena/20260923
homepage: "https://github.com/tsoding/arena"

# arena 是无构建系统的 stb 风格单头文件 C 库（arena.h）。
# 上游无 configure/make/ctest 测试入口：仓库仅含 LICENSE/README/arena.h、
# examples/（001_basic_usage、010_universal_code_wasm_x86_64）与 thirdparty/。
# 无独立上游测试用例；examples/001_basic_usage 为演示程序（非 TEST_CASE）。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无独立测试，空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 真实调用 arena API: R34)
test_package_tests:
  - file: test.c
    description: "消费者测试: include arena.h (ARENA_IMPLEMENTATION) 并调用 arena_alloc/arena_sprintf/arena_reset/arena_free 验证可编译、链接、运行及输出"
    command: "./test_arena"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
