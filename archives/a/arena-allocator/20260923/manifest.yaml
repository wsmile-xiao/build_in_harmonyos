  - "单头文件 C 库（ARENA_IMPLEMENTATION 模式、无 configure/install 目标）适配 Conan 用 header-library 类型 + copy() 打包头文件，不用 library（会要求声明 shared 选项）"
  - "clang -Werror -Wnewline-eof：上游 C 源文件缺文件尾换行会导致编译失败，补换行符即可（无逻辑改动）"
  - "conanfile.py package() 的 copy() dst 必须用 os.path.join(package_folder, ...)，相对路径会把文件复制到错误位置"

