# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: arena-allocator/20260923
homepage: "https://github.com/ccgargantua/arena-allocator"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make tests && ./test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests.c 经 rktest 框架: 5 个 TEST 用例 / 4 个 suite)
upstream_tests:
  - file: tests.c
    source: arena-allocator-ddd313d14f6f07900a3173834024b1ca36587fc6/tests.c
    description: "rktest 框架单元测试: arena_init/arena_create/arena_alloc/arena_alloc_aligned（5 用例 4 suite）"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用公开 API（create/alloc/aligned/clear/destroy）并校验可观察结果"
    command: "./test_arena-allocator"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
