# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aws-c-http/0.11.0
homepage: "https://github.com/awslabs/aws-c-http"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/unit_test_http.c
    source: aws-c-http-0.11.0/tests/unit_test_http.c
    description: "AWS C HTTP unit tests"
    command: "./aws-c-http-tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：验证 aws_http_library_init/clean_up、aws_http_status_text、aws_http_method_get API"
    command: "./test_aws_c_http"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
