# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.11.0"

# 软件名
software: "aws-c-http"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-27"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/awslabs/aws-c-http/archive/refs/tags/v0.11.0.tar.gz"

  # 源码校验和
  sha256: "4ccbdd33c798b590288330dec9e93abe2ff6cfb198b7a4db036c9d362f2e6506"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "aws-c-common/0.14.3"
    - "aws-c-io/0.27.5"
    - "aws-c-compression/0.3.2"
    - "aws-c-cal/0.9.15"
    - "aws-lc/5.4.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists-add-threads-before-deps.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "aws-c-http delegates platform handling to aws-c-io, no platform patches needed"
    - "CMAKE_PREFIX_PATH must include all 5 dependency package folders (aws-c-common, aws-c-io, aws-c-compression, aws-c-cal, aws-lc)"
    - "aws-lc must be directly declared in requirements() even though it's transitive, so CMAKE_PREFIX_PATH includes it for crypto detection"
    - "CMAKE_SYSTEM_NAME=Linux needed for HarmonyOS to set UNIX variable and enable Threads detection"
