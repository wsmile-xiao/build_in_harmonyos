package: aws-c-http/0.10.14
homepage: https://github.com/awslabs/aws-c-http

upstream_test_in_build: false
upstream_test_command: ""

excluded_upstream_tests:
  - command: "ctest"
    reason: "aws-c-http upstream tests require the AWS CRT test harness, event-loop/socket runtime behavior, local mock servers, and integration-test dependencies that are not available in the isolated OHOS Conan CI worker; this adaptation keeps consumer smoke coverage for the packaged library."
  - command: "integration-testing/http_client_test.py"
    reason: "The integration test is Python/network driven and depends on local server orchestration outside the OHOS package smoke-test environment."

upstream_tests:
  - path: tests/
    type: upstream C unit and integration tests
  - path: tests/fuzz
    type: upstream fuzz test corpus and harnesses
  - path: tests/mock_server
    type: upstream HTTP mock server tests
  - path: integration-testing/http_client_test.py
    type: upstream Python integration test

test_package_tests:
  - file: test.c
    description: Consumer smoke test initializes aws-c-http and validates status-code text lookup.
    command: test_aws_c_http

assertion_count: 2
