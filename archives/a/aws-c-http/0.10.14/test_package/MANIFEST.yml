package: aws-c-http/0.10.14
homepage: https://github.com/awslabs/aws-c-http

upstream_check_command: ctest -N
upstream_test_in_build: false
upstream_test_command: not run in cross-build recipe

upstream_tests:
  - file: tests/
    source: aws-c-http-0.10.14/tests/
    description: Upstream CTest-based unit test suite.
    command: ctest

test_package_tests:
  - file: test.c
    description: Consumer smoke test initializes and cleans up aws-c-http.
    command: cmake --build . && ctest

assertion_count: 1
