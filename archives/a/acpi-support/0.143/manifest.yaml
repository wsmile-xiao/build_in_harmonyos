build:
  system: none
  configure_options: []
  dependencies: []
  cc: none (zero-compile shell/config package)

patches_applied: []
knowledge_gained:
  - "零编译 shell/配置包配方模式:build() 以 bash -n 全量语法校验 + 主配置 grep 断言 + events action= 键断言充当构建验证,防截断/损坏源进入 package;不引任何编译器与依赖"
  - "安装布局遵循 Debian:/etc/acpi(*.sh 处理脚本 0755 + acpi-support 主配置 0644)、/etc/acpi/events(事件定义)、/usr/share/acpi-support(key-constants/state-funcs 0644);tarball 内权限位不齐(644/755 混杂),package() 必须显式 os.chmod"
  - "acpi-support 是纯脚本包:唯一 C 程序 acpi_fakekey 为 Debian 下游 addons,不在上游 orig tarball;Debian control 的 Build-Depends(libsystemd-dev 等)属下游打包依赖,不等于上游源码依赖,conan 配方按上游事实零依赖"
