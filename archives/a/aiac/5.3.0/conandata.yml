# conandata.yml — aiac 5.3.0
# 源码 URL 使用官方 GitHub tag 归档（CI 构建时会自动加 gh-proxy 镜像回退）
# 注意：部分 CI Worker 的 Python 无 SSL 模块（conda/python 环境缺 libssl），
# conan get() 走 HTTPS 会报 'SSL module is not available'。
# pre-download 步骤用 curl（自带 TLS）下载并改写为 file:// 路径供 conan 使用。
# 同时追加 file:// 预缓存条目作为最终兜底（与 backward-cpp / meek 先例一致），
# 适用于 pre-download 也失败（curl 缺失）的极端情况。
sources:
  url:
    - "https://gh-proxy.com/https://github.com/gofireflyio/aiac/archive/refs/tags/v5.3.0.tar.gz"
    - "https://github.com/gofireflyio/aiac/archive/refs/tags/v5.3.0.tar.gz"
    - "file:///storage/Users/currentUser/builds/aiac-5.3.0.tar.gz"
  sha256: "45e48cd8958d835b402e0e68d7aa8b9642deb535464dad5d6b83fb8f8ed3d79e"

patches: {}
