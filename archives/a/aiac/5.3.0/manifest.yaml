# manifest.yaml — aiac 5.3.0 (HarmonyOS PC)
version: "5.3.0"
software: "aiac"
status: "built"
arch:
  - "armv8"
  - "x86_64"
build_system:
  - "conan2"
  - "go1.26.5"
toolchain:
  go: "1.26.5"
  cgo: false
source:
  upstream: "https://github.com/gofireflyio/aiac"
  tag: "v5.3.0"
  url: "https://github.com/gofireflyio/aiac/archive/refs/tags/v5.3.0.tar.gz"
  sha256: "45e48cd8958d835b402e0e68d7aa8b9642deb535464dad5d6b83fb8f8ed3d79e"
  license: "Apache-2.0"
build:
  entry: "go build -trimpath ."
  output_binary: "aiac"
  ldflags: "-s -w -X github.com/gofireflyio/aiac/v5/libaiac.Version=v5.3.0"
patches_applied: []
knowledge_gained:
  - "aiac is a pure-Go CLI (module github.com/gofireflyio/aiac/v5, main.go at repo root); CGO disabled, GOOS=linux, static binary for OHOS/arm64 and x86_64."
  - "go.mod declares go 1.19 (only requires >= 1.19), so the Go SDK needs no new version; 1.26.5 is used to match the worker toolchain."
  - "Go linker mmap fails on HMDFS/tmpfs (E051/E046): link output must be placed on an ext2-like writable workspace (/data/storage/el2/base/haps/entry/files)."
  - "On OHOS every executed ELF (the aiac binary and Go SDK tool binaries) must carry a .codesign section; sign with binary-sign-tool."
  - "Upstream 5.3.0 ships no *_test.go files and its CI is GoReleaser-only (no test job); upstream test count is 0 (no_tests)."
