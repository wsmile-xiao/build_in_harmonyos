# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aiac/5.3.0
homepage: "https://github.com/gofireflyio/aiac"

# 上游测试命令：空串。aiac 5.3.0 上游无任何 *_test.go / make check / ctest / pytest；
# upstream_check_command / upstream_test_command 留空以声明「上游未绑定测试入口」，
# 与已通过门禁的 aribb24 / augustus / xidle 配方对齐（这些配方同样把这两项置空、
# upstream_tests_exist: false、test_package 用裸 print() 输出 no_tests 证据）。
# build() 里跑 go test 仅为源码树审计留痕（conan create log 可查），不声称上游覆盖。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# aiac 5.3.0 上游无测试，build() 里的 go test 仅作源码审计留痕；证据标记
# 按 aribb24/augustus/xidle 先例移至 test_package 阶段用裸 print() 输出，
# 以通过 HMBS evidence 门禁（门禁从 test_package stdout 抓取，不走 conan 前缀包装）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# aiac 5.3.0 全模块无任何 *_test.go 文件；`go test ./...` 编译每个包均输出
# [no test files]，真实测试数 = 0。
upstream_tests: []

# ── 上游测试审计（upstream_tests_exist=false 的显式证据）──
upstream_tests_exist: false
upstream_test_audit:
  - source: "aiac-5.3.0 source tree (`find . -name '*_test.go'`)"
    reason: "全模块（根包 main.go、libaiac/ 全部后端）没有任何 *_test.go 文件，Test/Benchmark/Example 函数数为 0。"
  - source: ".github/workflows/ (release.yaml, codesee-arch-diagram.yml)"
    reason: "CI 仅含 GoReleaser 发布 job 和代码图 job，无任何测试 step；不存在 make check / ctest / pytest 等测试入口。"
  - source: "go.mod"
    reason: "无 google/go-cmp 等测试专用依赖的测试使用（go.mod 中 go-cmp v0.5.9 仅为间接依赖，模块内无测试引用）。"
  - conclusion: "上游 5.3.0 不提供任何自动化测试；`go test ./...` 实测每包输出 [no test files]。本适配新增二进制消费者冒烟测试（test.sh）作为鸿蒙特有测试，不冒充上游覆盖。"
upstream_test_count: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: aiac --version 断言 v5.3.0 + --help 核心标志 + 无默认后端时 --list-models 失败闭合诊断"
    command: "sh test.sh <bin/aiac>"

# test.sh 中的断言数:
#   1. `aiac --version` 退出码为 0
#   2. --version 输出包含 "aiac version v5.3.0"
#   3. --help 输出包含 "--list-models"
#   4. --help 输出包含 "--backend"
#   5. 无默认后端时 --list-models 退出码非 0
#   6. 无默认后端时错误输出包含 "backend not selected"/诊断
assertion_count: 6
