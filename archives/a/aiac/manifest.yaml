# 软件级 manifest — aiac
software: aiac
display: "aiac"
description: "Artificial Intelligence Infrastructure-as-Code Generator (纯 Go CLI)"
category: build-tool
homepage: "https://github.com/gofireflyio/aiac"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 静态编译（CGO_ENABLED=0，GOOS=linux，GOARCH=arm64）"
    - "Go linker mmap 在 HMDFS 上 permission denied，链接输出需放在 ext2 可写分区（/data/storage/el2/base/haps/entry/files）"
    - "OHOS 上每个被 fork/exec 的 ELF 必须用 binary-sign-tool 自签名（含 .codesign section）"
  common_dependencies: []

versions:
  "5.3.0":
    status: built
    build_date: "2026-09-03"
    conan_ref: "aiac/5.3.0"
