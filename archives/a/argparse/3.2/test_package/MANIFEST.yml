# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: argparse/3.2
homepage: "https://github.com/p-ranav/argparse"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-tests"

upstream_tests:
  - name: test/（doctest 单元测试——243 个 test cases / 896 assertions，直接运行 tests 可执行）
    count: "243"
    description: "上游测试实测（rule 4，分母=全部 243 用例）：243 passed / 0 failed / 1 skipped（896 assertions 全过）——test/ 自带 doctest.hpp 无需网络；argparse 测试未注册 ctest 用例（'No tests were found' 实测）——直接运行 tests 二进制（doctest 自带统计）"

test_package_tests:
  - file: test_argparse.py
    description: "R34：头文件存在 + 编译运行使用 argparse 的 smoke（argparse::ArgumentParser 解析）"
    command: "python3 test_argparse.py <package>"

assertion_count: 2
