# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: arename/4.1
homepage: "https://github.com/ft/arename"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
# arename uses `prove -Imodules tests/*.t` for testing, requires Audio::Scan
upstream_test_in_build: false
upstream_test_command: "prove -Imodules tests/*.t"

# 上游实际运行的测试程序
# arename tests require Audio::Scan and test audio data, not available on OHOS
upstream_tests:
  - file: "tests/*.t"
    source: "arename-4.1/tests/"
    description: "Perl test suite (requires Audio::Scan and test audio data)"
    command: "prove -Imodules tests/*.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "conanfile.py"
    description: "Verify arename and ataglist scripts installed with valid Perl shebang"
    command: "conan test test_package arename/4.1"

# 测试断言总数 (近似值)
assertion_count: 6
