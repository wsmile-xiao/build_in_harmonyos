software: augustus
display: "augustus"
description: "真核生物基因结构预测软件（隐马尔可夫模型），预测蛋白质编码基因的位置与结构"
category: bioinformatics
homepage: "https://github.com/Gaius-Augustus/Augustus"
license: Artistic-1.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile minimal 配置：ZIPINPUT=false（去 boost_iostreams）+ COMPGENEPRED=false（去 CGP 重依赖），零 conan 依赖"
    - "只构建核心 make augustus（src/ 下 5 个程序），不构建 auxprogs（需 bamtools/htslib）"
    - "no_copy_source=True 禁用 source→build 整树复制 + source() 裁剪 docs/auxprogs 等（763MB→145MB），规避真机 No space left on device"
    - "package() 直接打包 bin/ + config/（140MB 物种模型运行时数据必需），ELF 自签"
  common_dependencies: []

versions:
  "3.5.0":
    status: built
    build_date: "2026-08-30"