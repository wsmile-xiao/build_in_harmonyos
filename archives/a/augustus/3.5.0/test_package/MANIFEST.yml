# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: augustus/3.5.0
homepage: "https://github.com/Gaius-Augustus/Augustus"

# 上游源码审计（hmbs 硬门禁）：augustus 3.5.0 的 make test 依赖 Linux x86_64 +
# 完整 CGP 构建，无法在 OHOS minimal 配置下运行（见下方逐项审计结论）。
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile"
    reason: "test: 目标依赖 check-python3 + 完整 all（含 COMPGENEPRED=true 的 CGP 构建），然后执行 tests/short/execute_test.py --compare --html（仅 Linux x86_64 上带 --compare 对比预期输出）；OHOS aarch64 minimal 配置（ZIPINPUT=false COMPGENEPRED=false）无法运行。"
  - source: "src/Makefile"
    reason: "仅定义 OBJS/TOBJS 与程序目标（augustus/etraining/...），无 enable_testing/add_test 等价物；unittest 目标依赖 googletest 子模块，非发布功能测试。"
  - source: "tests/short"
    reason: "Python 驱动回归（execute_test.py），需完整 CGP 构建构建出的全部辅助程序 + 外部 py 脚本 + x86_64 才有 --compare 对照；OHOS 无该测试所需辅助环境。"
  - source: "config/species"
    reason: "166 个物种模型参数文件（pbl/cfg），运行时数据而非测试断言。"
  - conclusion: "上游 make test 仅限 x86_64 Linux + 全量 CGP 构建，minimal/OHOS 无法运行；由 test_package 对打包的 augustus 二进制做真实功能断言（--version 版本输出 + --species=human 真实基因预测输出 'Predicted genes'）。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 1. --version 抛 HelpException(GREETING) 正常 exit 0 输出 "AUGUSTUS (3.5.0)"
# 2. --species=human 真实运行基因预测，断言输出含 "Predicted genes"（Homebrew 官方 test 同款断言）
test_package_tests:
  - file: test.sh
    description: "消费者冒烟测试：运行包内 bin/augustus --version（断言版本输出），并以 --species=human examples/example.fa 运行真实基因预测（断言输出含 Predicted genes）"
    command: "./test.sh <augustus> <config_dir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4