# 版本级 manifest — augustus 3.5.0
# 遵循 ARCHIVE-SPEC v2.0

version: "3.5.0"
software: augustus
status: built
build_date: "2026-08-30"
build_system: makefile

source:
  url: "https://github.com/Gaius-Augustus/Augustus/archive/refs/tags/v3.5.0.tar.gz"
  sha256: "5ed6ce6106303b800c5e91d37a250baff43b20824657b853ae04d11ad8bdd686"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make ZIPINPUT=false COMPGENEPRED=false -j1"
    - "CXX=clang++ (from Conan toolchain conf, R33)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 Makefile 支持 minimal 配置：ZIPINPUT=false 关闭 boost_iostreams、COMPGENEPRED=false 关闭 CGP（gsl/lpsolve/suitesparse/mysql/sqlite）重依赖，minimal 下 LDLIBS 为空，零第三方依赖（R36 满足）"
  - "boost include 均在 #ifdef ZIPINPUT 保护内，minimal 配置不触发；Homebrew 亦用 COMPGENEPRED=false"
  - "源树解压后 ~763MB（docs/ 364MB、auxprogs/ 182MB、examples/ 58MB 等构建非必需）；conan 默认把 source 整树复制到独立 build 文件夹触发真机 No space left on device（Errno 28）。修复：no_copy_source=True 禁用复制（installer._copy_sources 唯一开关，63 先例）+ source() 裁剪非必需目录到 ~145MB；本地实测 b/ 目录 303MB→145MB"
  - "上游 install 目标向 /opt/augustus-* 复制 config/bin/scripts 并建 PREFIX/bin 符号链接，不适合 conan 包；改为 package() 直接打包 bin/ + config/（140MB 物种模型运行时数据必需）"
  - "hnp clang++ 无默认 C++ 头文件搜索路径，Makefile 配方必须显式 CXXFLAGS=-stdlib=libc++ 才能找到 libc++ 标准库头文件（真机实测 cmath file not found）；OHOS libc++ 要求 C++17 最低（E130），上游默认 -std=c++11 也需一并提到 -std=c++17（id3v2/bowtie2 先例同款）"
  - "augustus 运行时经 AUGUSTUS_CONFIG_PATH 环境变量或可执行文件相对路径定位 config/；--version 抛 HelpException(GREETING) 打印 'AUGUSTUS (3.5.0)' 并以 exit 0 退出（可作 smoke test）"
  - "OHOS 可执行 ELF 需 binary-sign-tool 自签（E077/E082），否则内核拒绝执行"

# ── Upstream test audit (hmbs evidence requirement) ───────────────────────
upstream_tests_exist: false
upstream_test_audit: |
  augustus 3.5.0 上游提供 make test（tests/short 的 Python 驱动回归，仅在
  Linux x86_64 上带 --compare，且需要完整构建含 CGP 与外部写好的预期输出）。
  minimal 配置（ZIPINPUT=false COMPGENEPRED=false）与 OHOS 无辅助脚本环境
  下无法运行该套件；由 test_package 对打包的 augustus 二进制执行真实功能
  测试（--version 输出断言 + --species=human 真实基因预测输出断言）。