version: "0.9.13"
status: published
build_date: "2026-04-24"

source:
  url: "https://github.com/awslabs/aws-c-cal/archive/refs/tags/v0.9.13.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_PREFIX_PATH=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
  dependencies:
    - aws-c-common 0.12.6
    - aws-lc 1.72.0
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
  - "aws-c-cal 依赖 aws-c-common 和 crypto 库"
  - "使用 AWS-LC 作为 crypto 后端"
  - "CMake 需设置 CMAKE_SYSTEM_NAME=Linux 以正确识别 HarmonyOS"
