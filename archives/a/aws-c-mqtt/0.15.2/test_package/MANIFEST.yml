package: aws-c-mqtt/0.15.2
homepage: https://github.com/awslabs/aws-c-mqtt

upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - path: tests/
    type: upstream C MQTT unit and integration tests
  - path: tests/request-response
    type: upstream request-response MQTT tests
  - path: tests/v3
    type: upstream MQTT v3 tests
  - path: tests/v3-client
    type: upstream MQTT v3 client tests

excluded_upstream_tests:
  - command: "tests/"
    reason: "MQTT network and event-loop tests depend on runtime behavior that is unstable on the isolated OHOS CI worker; this adaptation uses consumer smoke coverage instead."

coverage:
  enabled: false
  reason: "The contest OHOS Conan profile executes test_package but does not enable compiler coverage instrumentation or provide a stable gcov/lcov collection step."

test_package_tests:
  - file: test.c
    description: Consumer smoke test proves aws_mqtt_library_init has the 0.15.2 void API contract, initializes aws-c-mqtt, and validates topic syntax helpers.
    command: test_aws_c_mqtt

assertion_count: 5
