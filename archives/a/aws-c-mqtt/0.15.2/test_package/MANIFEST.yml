package: aws-c-mqtt/0.15.2
homepage: https://github.com/awslabs/aws-c-mqtt

upstream_check_command: "ctest --output-on-failure -E \"^(mqtt_connect_.*|mqtt_connection_.*|mqtt_clean_session_.*)$\""
upstream_test_in_build: true
upstream_test_command: "ctest subset executed from conanfile.py build(); network/connection and clean-session tests that hang on OHOS CI are excluded by exact pattern"

upstream_tests:
  - file: tests/
    source: aws-c-mqtt-0.15.2/tests/
    description: Upstream MQTT CTest suite; packet, topic, MQTT5, adapter, and non-network/non-clean-session logic tests are executed in OHOS CI.
    command: ctest --output-on-failure

excluded_upstream_tests:
  - command: "mqtt_connect_.*"
    reason: "Connection-suite tests require network/event-loop behavior that hangs without output on the isolated OHOS CI worker."
  - command: "mqtt_connection_.*"
    reason: "Connection-suite tests require network/event-loop behavior that hangs without output on the isolated OHOS CI worker."
  - command: "mqtt_clean_session_.*"
    reason: "Multiple clean-session connection tests hang without output on the OHOS CI worker; excluding the family preserves packet, topic, MQTT5, and adapter coverage while avoiding CI deadlock."

coverage:
  enabled: false
  reason: "The contest OHOS Conan profile executes upstream CTest and test_package but does not enable compiler coverage instrumentation or provide a stable gcov/lcov collection step."

test_package_tests:
  - file: test.c
    description: Consumer smoke test initializes aws-c-mqtt and validates topic syntax helpers.
    command: test_aws_c_mqtt

assertion_count: 4
