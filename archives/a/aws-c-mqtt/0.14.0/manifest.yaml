version: "0.14.0"
software: "aws-c-mqtt"
status: built
build_date: "2026-08-27"
build_system: cmake

source:
  url: "https://github.com/awslabs/aws-c-mqtt/archive/refs/tags/v0.14.0.tar.gz"
  sha256: "d7b881f3154a4d7282aca1aab9926b2ff9a67de3a07b2eee3c229629520e492d"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - aws-c-common/0.12.6 (private source, fat package)
    - aws-c-http/0.10.14 (private source, fat package)
    - aws-c-io/0.26.3 (private source, fat package)
    - aws-c-cal/0.9.13 (private source, fat package)
    - aws-c-compression/0.3.2 (private source, fat package)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "aws-c-mqtt uses fat package pattern (same as aws-c-http/0.10.14) to bundle all AWS CRT deps"
  - "aws-c-common/0.12.6 and aws-c-io/0.26.3 are not published as standalone conan packages in the registry"
  - "aws-c-http/0.10.14 in registry is itself a fat package that bundles all AWS CRT libs with BYO_CRYPTO"
  - "BYO_CRYPTO=ON strips s2n-tls and openssl dependencies from aws-c-io and aws-c-cal"
  - "HarmonyOS platform detection patches: CMAKE_SYSTEM_NAME HarmonyOS/OHOS in aws-c-common and aws-c-io"
  - "Threads::Threads fallback injection needed before find_package(aws-c-common) on OHOS"
