version: "1.9.2"
status: published
build_date: "2026-08-20"

source:
  url: "https://github.com/max0x7ba/atomic_queue/archive/refs/tags/v1.9.2.tar.gz"
  sha256: "7c3606f23cea69d39c3872996ffb83587bd4ab08da3c0c4c45aba7aa15eea9f8"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DATOMIC_QUEUE_BUILD_TESTS=OFF"
    - "-DATOMIC_QUEUE_BUILD_EXAMPLES=OFF"
    - "-DATOMIC_QUEUE_ENABLE_INSTALL=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "header-only INTERFACE 库, 无需编译产物, Conan 只打包 include/atomic_queue/ 头文件"
  - "上游 CMake tag 为 v1.9.2 (带 v 前缀), 不是 1.9.2"
  - "defs.h 已原生支持 __aarch64__ 架构 (yield 指令), 无需额外 patch"
  - "上游测试依赖 Boost.Test, test_package 改用自写 C++ 测试覆盖核心 API"
  - "ATOMIC_QUEUE_FULL_THROTTLE 在非 x86 上默认为 0, 使用 atomic 而非 asm barrier"
  - "assert(element != NIL) 禁止 push NIL 值; 多线程测试不能用 NIL 做终止信号, 改用 count-based 终止"
  - "多线程 SPSC 测试: CAPACITY 必须 > N_MSG 避免死锁 (生产者填满队列后阻塞)"
  - "OHOS 真机 /tmp 只读; TMPDIR 必须设到可写目录 (如 $HOME/tmp-build)"
