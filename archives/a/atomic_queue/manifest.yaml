software: atomic_queue
display: "atomic_queue"
description: "C++ 高性能 lock-free 并发队列库 (header-only)"
category: library
homepage: "https://github.com/max0x7ba/atomic_queue"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only INTERFACE 库：无 .so/.a 产物，package 仅含 include/atomic_queue/ 头文件"
    - "defs.h 已原生支持 __aarch64__ (yield 指令) 和 __arm__ 架构，无需 OHOS 特定 patch"
    - "ATOMIC_QUEUE_FULL_THROTTLE 在非 x86 上默认为 0，使用 atomic 而非 asm barrier"
    - "上游测试依赖 Boost.Test，test_package 自写 C++ 测试覆盖核心 API（无外部依赖）"
    - "CMake 无 HarmonyOS 平台模块，generate() 设 CMAKE_SYSTEM_NAME=Linux"
  common_dependencies: []

versions:
  "1.9.2":
    status: published
    build_date: "2026-08-20"
    source_url: "https://github.com/max0x7ba/atomic_queue/archive/refs/tags/v1.9.2.tar.gz"
    verification:
      platform: "OHOS 6.0 aarch64"
      compiler: "clang 15.0.4"
      conan_create: "PASS (exit 0)"
      test_package: "4/4 passed in 0.02s"
