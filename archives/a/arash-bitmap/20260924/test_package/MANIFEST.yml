# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: arash-bitmap/20260924
homepage: "http://partow.net/programming/bitmap/index.html"

# 上游测试命令 (本机上以 clang++ 直编 + 库 API 生成 image.bmp 夹具后运行)
upstream_check_command: "clang++ -ansi -pedantic-errors -Wall -Werror -Wextra -o bitmap_test bitmap_test.cpp -L/usr/lib -lstdc++ -lm && (用 bitmap_image API 生成 image.bmp 夹具) && ./bitmap_test"

# conanfile.py build() 方法中是否已集成上游测试 (header-only 库: 上游测试单独编译运行)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (bitmap_test.cpp 内 20 个独立 test 函数)
upstream_tests:
  - file: bitmap_test.cpp
    source: arash-bitmap-20260924/bitmap_test.cpp
    description: "bitmap_image 库完整测试程序 (test01..test20: 读写/翻转/缩放/色彩通道/YCbCr/纹理/绘图/分形)"
    command: "./bitmap_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: include 公共头文件并实际调用 bitmap_image API (创建/写像素/保存 BMP/重载校验)"
    command: "./test_arash-bitmap"

# 测试断言总数 (上游 20 个独立 test 函数)
assertion_count: 20
