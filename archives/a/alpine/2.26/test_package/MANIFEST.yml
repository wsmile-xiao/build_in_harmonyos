# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: alpine/2.26
homepage: "https://alpineapp.email/alpine/release/src/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# alpine 上游无 make check 测试目标（configure.ac 无测试目标），故为空
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# alpine 上游无正式测试套件：alpine-2.26.tar.xz 源码树实测无 tests/ 目录、
# 无 *.test 文件、configure.ac 无测试目标（AC_MSG_CHECKING 仅为 configure 检查）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/test_alpine.c
    description: "编译运行 test_alpine.c：alpine --version 输出含 'Alpine' 关键字检查（popen 验证二进制可运行，避免二进制名子串假阳性）"
    command: "cc test_alpine.c && ./test_alpine <package>/bin/alpine"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
