software: autotrace
display: "AutoTrace"
description: "Bitmap to vector graphics converter - converts images to scalable vector paths"
category: gfx
homepage: "https://github.com/autotrace/autotrace"
license: GPL-2.0
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "原始 tarball 没有 configure，使用 hints/bootstrap.sh + autotools-files"
    - "需要设置 LDFLAGS 链接 libintl.a（glib 静态库依赖）"
    - "禁用可选功能 --without-magick --without-pstoedit --without-png"
  common_dependencies:
    - glib
    - gettext
    - intltool

# 版本索引
versions:
  "0.31.10":
    status: built
    build_date: "2026-05-26"
    published_as: autotrace
    notes: "G0 通过，基础功能可用（禁用 Magick/PNG）"