software: autotrace
# 版本级 manifest
# 文件位置: archives/a/autotrace/0.31.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.31.10"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"
compile_date: "2026-05-26"

# 构建系统
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/autotrace/autotrace/tarball/0.31.10"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--without-magick"
    - "--without-pstoedit"
    - "--without-png"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "glib/2.88.0"
    - "gettext/0.22.5"
    - "intltool/0.51.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码补丁，使用 hints/bootstrap.sh + autotools-files 预生成配置）
patches_applied: []
# 注：原始 tarball 没有 configure，使用 hints/bootstrap.sh 复制预生成的 autotools 文件
# hints/autotools-files/ 包含 configure、Makefile.in、config.h.in 等构建文件

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autotrace 原始 tarball 没有 configure 脚本，需要 bootstrap"
  - "autoreconf 失败（configure.ac 有语法问题），使用预生成的 configure"
  - "需要设置 LDFLAGS 链接 libintl.a（glib 静态库依赖）"
  - "禁用可选功能：--without-magick --without-pstoedit --without-png"