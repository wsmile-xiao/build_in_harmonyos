# 软件级 manifest — astromatic
software: astromatic
display: "AstrOmatic"
description: "AstrOmatic 天文图像流水线软件集合元包（Debian 原生元包，聚合套件工具）"
category: science
homepage: "https://www.astromatic.net/software/"
license: "public-domain"
build_system: metapackage

ohos_adaptation:
  key_points:
    - "requirements-only 聚合元包：conanfile.py 仅声明 requires，无 build/source/package"
    - "package_type=unknown（Conan 2.29 无 meta-package 枚举）；settings 含 L0p 四项"
    - "依赖闭包 7 工具均适配并发布；source-extractor 2.28.2 与本元包同批适配"
  common_dependencies:
    - missfits
    - psfex
    - scamp
    - source-extractor
    - stiff
    - swarp
    - weightwatcher

versions:
  "1.3":
    status: built
    build_date: "2026-08-24"
    conan_ref: "astromatic/1.3"
