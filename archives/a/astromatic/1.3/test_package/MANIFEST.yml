# test_package/MANIFEST.yml — astromatic 1.3
# 上游测试声明文件（CI L0e 强制存在；详见 docs/TEST_QUALITY_SPEC.md）

package: astromatic/1.3
homepage: "https://www.astromatic.net/software/"

# 元包无上游测试（无 autopkgtest / make check / ctest）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游零测试（Debian 原生元包，仅 debian/ 打包目录，可核验：salsa tag
# debian/1.3 文件树 + debian/rules 仅 dh $@ + 无 autopkgtest）
upstream_tests: []

# test_package 冒烟：7 个依赖工具二进制真实执行
test_package_tests:
  - file: test_astromatic.py
    description: "消费者冒烟：missfits/psfex/scamp/sex/stiff/swarp/ww 逐一 --version / -v / --help 真实调用"
    command: "python3 test_astromatic.py"

# 测试断言总数（test_package 冒烟 7 个二进制）
assertion_count: 7
