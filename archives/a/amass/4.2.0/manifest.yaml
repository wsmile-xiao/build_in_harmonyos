software: amass
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.2.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/owasp-amass/amass/archive/refs/tags/v4.2.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags=-s -w"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "go/1.26.4"

  # 编译器
  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
