# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ankerl-unordered-dense/4.5.0
homepage: "https://github.com/martinus/unordered_dense"

# 上游测试命令 (meson 驱动; 上游测试入口为 meson test)
upstream_check_command: "meson test --list (test/meson.build)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/unit/erase.cpp
    source: unordered_dense-4.5.0/test/unit/erase.cpp
    description: "unit tests covering map/set semantics incl. backward shift deletion (doctest)"
    command: "meson test (unittests target)"
  - file: test/unit/rehash.cpp
    source: unordered_dense-4.5.0/test/unit/rehash.cpp
    description: "unit tests for rehash/load-factor behavior (doctest)"
    command: "meson test (unittests target)"
  - file: test/unit/insert.cpp
    source: unordered_dense-4.5.0/test/unit/insert.cpp
    description: "unit tests for insert/emplace paths (doctest)"
    command: "meson test (unittests target)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：map/set 插入/查找/删除(robin-hood backward shift)/emplace/迭代 22 项断言"
    command: "./test_ankerl_unordered_dense"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 22
