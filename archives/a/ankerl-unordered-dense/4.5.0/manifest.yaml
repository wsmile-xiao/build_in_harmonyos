  - "上游 CMake 包名为 unordered_dense（cmake_file_name 与 conan 包名 ankerl-unordered-dense 不同），cmake_file_name/cmake_target_name 已显式声明以对齐 find_package(unordered_dense)"
  - "上游测试为 meson 驱动（test/meson.build + test/unit/*.cpp），header-only 包 conan 侧以 test_package 消费者编译+运行验证替代"
