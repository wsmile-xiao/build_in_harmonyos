version: "2.0.3"

software: alive

# published | built | failed | archived
# R29: 本地 create 通过前标 built，不伪造 published
status: built

build_date: "2026-09-15"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/alive/alive-2.0.3.tar.xz"
  sha256: "8bf41150ade07b86a806ce40ce99509713e2abcc92c4182a8d961aa3cf757014"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-dependency-tracking"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "alive_cv_nice_ping=yes"
  dependencies:
    - "guile/2.2.7.1"
  system_dependencies:
    - "ping(1) with -n -c COUNT support (runtime, e.g. iputils/inetutils)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "alive 是纯 Guile Scheme 脚本工具（src/body.scm -> bin/alive），无编译型库、无 make check"
  - "configure 仅需 SNUGGLE_PROGS（guile/guile-config），不需要 Guile CFLAGS/LDFLAGS"
  - "ping 能力探针可用 alive_cv_nice_ping=yes 预置跳过（Guix 同款），运行时仍需 ping -n -c"
  - "OHOS 无 makeinfo，需 fake makeinfo 触碰输出跳过 doc 重建（与 akku 同模式）"
  - "bin/alive 的绝对 guile shebang 需在 package() 改写为 /usr/bin/env guile 以便可重定位"

upstream_tests_exist: false
upstream_test_audit: "Audited alive-2.0.3 source archive (30 files): configure.ac, Makefile.am, src/Makefile.am, src/body.scm, doc/. No test/, tests/, check-TESTS, TESTS, make check target, gtest/pytest/criterion bindings. Gentoo ebuild applies only an external ping-test patch; upstream tarball ships no test harness."
reason: "alive 2.0.3 ships no upstream test framework: no test directory, no make check target, no gtest/pytest bindings."
