# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: alive/2.0.3
homepage: "https://www.gnu.org/software/alive/"

upstream_check_command: ""
upstream_tests_exist: false
upstream_test_audit: "Audited alive-2.0.3 source archive (30 files: configure.ac, Makefile.am, src/Makefile.am, src/body.scm, doc/): no test/tests directory, no TESTS/check-TESTS, no make check target, no gtest/pytest/criterion bindings. Gentoo ping-test patch is external distro patch, not upstream harness."
reason: "alive 2.0.3 ships no upstream test framework: no test directory, no make check target, no gtest/pytest bindings."

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "离线验证 alive --version 包含 2.0.3 且 alive --help 包含 Usage；不执行真实 ping，不联网"
    command: "sh test.sh"

assertion_count: 2
