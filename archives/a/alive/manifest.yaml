# 软件级 manifest
# 文件位置: archives/a/alive/manifest.yaml
# 版本级细节见 2.0.3/manifest.yaml

software: alive
display: "alive"
description: "GNU Alive periodic ping keep-alive program"
category: tool
homepage: "https://www.gnu.org/software/alive/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 Guile Scheme 脚本工具，configure 仅需 guile/guile-config"
    - "构建期用 alive_cv_nice_ping=yes 跳过 ping 联网探针，运行时仍需 ping -n -c"
    - "fake makeinfo 跳过 texinfo 文档重建"
    - "package() 将绝对 guile shebang 改写为 /usr/bin/env guile 以便可重定位"
  common_dependencies:
    - guile

versions:
  "2.0.3":
    status: built
    build_date: "2026-09-15"
