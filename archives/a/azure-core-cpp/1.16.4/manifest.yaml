# 版本级 manifest 模板
# 文件位置: archives/a/azure-core-cpp/1.16.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.16.4"

# 软件名
software: "azure-core-cpp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-22"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/Azure/azure-sdk-for-cpp/tar.gz/refs/tags/azure-core_1.16.4"

  # 源码校验和
  sha256: "25f8badf23c66ae82debd95e0d074d6269b276e5fa2ce5d4d3cff38fda9ab8c2"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统
# cmake | meson | autotools | conan-center | others
build_system: cmake

# Conan host settings
conan_host:
  os: "OHOS"
  arch: "armv8"
  compiler: "clang"
  compiler.version: 15
  compiler.libcxx: "libc++"
  compiler.cppstd: 17
  build_type: "Release"

# CMake 选项
cmake_options:
  BUILD_SHARED_LIBS: "ON"
  BUILD_TESTING: "OFF"
  BUILD_TRANSPORT_CURL: "ON"
  BUILD_WINHTTP: "OFF"
  DISABLE_RUST_IN_BUILD: "ON"
  DISABLE_AMQP: "ON"
  DISABLE_AZURE_CORE_OPENTELEMETRY: "ON"
  WARNINGS_AS_ERRORS: "OFF"

# 依赖
dependencies:
  openssl: "3.5.6"
  curl: "8.5.0"
  zlib: "1.3.1"
  threads: "system"

# 是否跨平台构建
cross_compiled: true

# 构建平台
build_platform: "linux/x86_64"
target_platform: "OHOS/armv8"

# OHOS 特定
ohos:
  compiler: "clang15"
  libcxx: "libc++"
  cppstd: 17
  clang_profile: "ohos-armv8-clang-15"