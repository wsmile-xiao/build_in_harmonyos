# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: azure-core-cpp/1.16.4
homepage: "https://github.com/Azure/azure-sdk-for-cpp/tree/main/sdk/core/azure-core"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (gtest 1.17.0, 25 套件 140 用例)
# Azure 网络/凭据/云服务测试 (http_test, bearer_token, curl_session, transport_adapter 等)
# 因离线环境无法访问 Azure 端点而被排除；以 test_package 消费者验证 + 纯单元测试替代
upstream_tests:
  - file: sdk/core/azure-core/test/ut/
    source: azure-sdk-for-cpp-azure-core_1.16.4/sdk/core/azure-core/test/ut/
    description: "azure-core upstream gtest suite: assert, base64, base64url, case_insensitive_containers, client_options, context, etag, exception, extendable_enumeration, http_method, json, logger, match_conditions, md5, modified_conditions, nullable, operation_status, resource_identifier, response_t, sha, simplified_header, string, uuid (140 tests, 25 suites, 140/140 PASS)"
    command: "./azure-core-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Verify azure-core API from consumer view: UUID creation/ToString, DateTime Rfc3339 parse/format, URL scheme/host parse, Context deadline — linked against Azure::azure-core via CMakeDeps"
    command: "./test_azure-core-cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 144