package: alberta/3.1.1
homepage: "http://www.alberta-fem.de/"

# Upstream tests run inside conanfile.py build() via `make -k check`
# (automake parallel-tests harness, one test-suite.log per directory).
upstream_test_in_build: true
upstream_test_command: "make -k check"

# Official registered TESTS with the recipe configure flags
# (--disable-graphics --disable-debug, FEM toolbox enabled, dims 1-3).
# Method: count of TESTS entries in the upstream Makefile.am files.
upstream_test_total: 28
upstream_test_count_method: "autotools_tests"
upstream_tests_exist: true
upstream_tests:
  - file: alberta/tests/Makefile.am
    source: alberta_3.1.1/alberta/tests/Makefile.am
    description: "read_mesh 1d/2d/3d mesh I/O tests (3, all XFAIL upstream: grid file missing)"
    command: "make -k check"
  - file: alberta/tests/book-demo/1d/Makefile.am
    source: alberta_3.1.1/alberta/tests/book-demo/1d/Makefile.am
    description: "1d book demos run as tests: ellipt1d, heat1d, ellipt-periodic1d (3)"
    command: "make -k check"
  - file: alberta/tests/book-demo/2d/Makefile.am
    source: alberta_3.1.1/alberta/tests/book-demo/2d/Makefile.am
    description: "2d book demos (6 incl. 3 XFAIL) + stokes2d trio gated on HAVE_LIBLTDL (3)"
    command: "make -k check"
  - file: alberta/tests/book-demo/3d/Makefile.am
    source: alberta_3.1.1/alberta/tests/book-demo/3d/Makefile.am
    description: "3d book demos incl. stokes3d set (9, 5 of them XFAIL upstream)"
    command: "make -k check"
  - file: add_ons/libalbas/tests/Makefile.am
    source: alberta_3.1.1/add_ons/libalbas/tests/Makefile.am
    description: "Stokes bubble tests 2d/3d variants (4, all XFAIL upstream)"
    command: "make -k check"

test_package_tests:
  - file: test.c
    description: "generate_filename deterministic name check"
    command: "./test_alberta"
  - file: test.c
    description: "MEM_ALLOC/MEM_FREE allocator check with content verification"
    command: "./test_alberta"
  - file: test.c
    description: "add_parameter/get_parameter database round-trip check"
    command: "./test_alberta"

test_package_test_count: 3
assertion_count: 3
