version: "3.1.1"
software: "alberta"
status: "built"
build_date: "2026-09-27"
build_system: "autotools"

source:
  url: "https://deb.debian.org/debian/pool/main/a/alberta/alberta_3.1.1.orig.tar.bz2"
  sha256: "423033dc8af1db82fc6f51febc6b6a3f4bb69e3f50754a2114b4522494c93fe5"
  tar_format: "tar.bz2"

build:
  system: "autotools"
  configure_options:
    - "--disable-graphics"
    - "--disable-debug"
    - "--disable-waiting-in-tests"
    - "--disable-nls"
    - "--disable-dependency-tracking"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - "libtirpc/1.3.7#ffaa36790004ab5a69233aef6f108319"
  build_requirements:
    - "automake/1.18"
    - "libtool/2.5.4.1"
    - "pkgconf/3.0.5"
    # NOTE: no autoconf/m4/perl edge by design (see conanfile header);
    # m4 1.4.19 + autoconf 2.72 are vendored at build time from official
    # GNU tarballs (sha256 pinned in conanfile).
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "patches/0001-tmpdir-aware-cpp-tempfile.patch"
knowledge_gained:
  - "Upstream ships no configure: bootstrap with generate-alberta-automakefiles.sh + autoreconf."
  - "OHOS needs explicit linux-ohos build/host triplets (uname reports HarmonyOS)."
  - "Graphics and debug flavours disabled; upstream TESTS total is 28 incl. XFAIL entries."

homepage: "http://www.alberta-fem.de/"
license: "GPL-2.0-or-later"

tests:
  upstream:
    command: "make -k check"
    cases: 28
    passed: 0
    note: "28 cases from upstream TESTS audit; real pass counts await first HarmonyOS preflight."
  adapted:
    command: "test_package/test_alberta"
    cases: 3
    passed: 0
    pass_rate: "pending HarmonyOS preflight"
