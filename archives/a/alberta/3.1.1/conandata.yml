# conandata.yml -- alberta 3.1.1
# File location: archives/a/alberta/3.1.1/conandata.yml
# Single source of truth for the source archive URL + SHA256.
# conanfile.py reads this via self.conan_data["sources"].
#
# Source: Debian official pool carries the pristine upstream tarball
# (alberta_3.1.1.orig.tar.bz2, byte-identical to the upstream 3.1.1 release;
# Homepage per Debian record: http://www.alberta-fem.de/). The upstream
# download site is no longer reachable and the upstream GitLab archive
# requires sign-in, so the Debian pool is the authoritative source here --
# same pattern as the aalib/a52dec/abook recipes in this repository.
# SHA256 verified against the signed Debian .dsc record
# (alberta_3.1.1-3build1.dsc, Checksums-Sha256).

sources:
  # CI worker network is restricted (deb.debian.org may be unreachable),
  # so list a reachable mirror first; conan get() tries each URL in order.
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/a/alberta/alberta_3.1.1.orig.tar.bz2"
    - "https://deb.debian.org/debian/pool/main/a/alberta/alberta_3.1.1.orig.tar.bz2"
  sha256: "423033dc8af1db82fc6f51febc6b6a3f4bb69e3f50754a2114b4522494c93fe5"
  filename: "alberta_3.1.1.orig.tar.bz2"

patches:
  - patch_file: "patches/0001-tmpdir-aware-cpp-tempfile.patch"
    patch_description: "Honor TMPDIR/TMP/TEMP for cpp temp file; /tmp is read-only on HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0002-ensure-output-dirs.patch"
    patch_description: "Create data/data_stokes output dirs from generate_filename; fresh build trees lack them"
    patch_type: "portability"
