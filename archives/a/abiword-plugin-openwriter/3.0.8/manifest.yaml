# abiword-plugin-openwriter 3.0.8 version-level manifest
# File location: archives/a/abiword-plugin-openwriter/3.0.8/manifest.yaml
# Schema: templates/manifest-version.yaml (ARCHIVE-SPEC v2.0)
# ============================================================
# 必须字段（模板 version-level）
# ============================================================

version: "3.0.8"
software: abiword-plugin-openwriter
status: built
build_date: "2026-08-10"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  upstream: "https://gitlab.gnome.org/World/AbiWord"
  release_tag: "release-3.0.8"
  url: "https://gitlab.gnome.org/World/AbiWord/-/archive/release-3.0.8/AbiWord-release-3.0.8.tar.bz2"
  sha256: "ef2fdc2cb66a54a58185e7008bd349ce858e59648e18571913d5a3e2b43abf37"
  tar_format: tar.bz2
  # 注意:abiword-plugin-openwriter 不是独立仓库
  # openwriter 是 AbiWord 主源码 plugins/ 下的一个子目录
  subpath: "plugins/openwriter"

# ============================================================
# 构建配置（模板标准）
# ============================================================

build:
  system: autotools
  notes: |
    abiword-plugin-openwriter 作为 AbiWord 整体构建的一部分产出。
    适配时通常需要先移植 abiword 主库,再移植插件。

    OHOS PC 移植策略:
    - 阶段 1: 适配 abiword 主库（libabiword / libAbiWord-x.y）
    - 阶段 2: 适配 plugins/openwriter（OpenDocument .odt 读写）
    - 阶段 3: conan 打包 openwriter 为独立配方

  configure_options:
    - "--host=aarch64-linux-gnu"
    - "--build=x86_64-linux-gnu"
    # openwriter 通常不开独立 --enable-*，跟随 abiword 主 configure

# ============================================================
# 依赖（暂定）
# ============================================================

dependencies:
  # 强依赖（openwriter 编译时必须）
  runtime:
    - abiword            # abiword 主库（必须先移植）
    - glib
    - libxml2
    - pango
    - fribidi
    - libgsf/1.14.53     # ODT 内嵌图片/资源依赖，详见 notes.md "libgsf 版本选择说明"
  build:
    - autoconf
    - automake
    - libtool
    - pkg-config

# ============================================================
# 已知上游信息
# ============================================================

upstream_metadata:
  description: "OpenDocument Text (.odt) import/export plugin for AbiWord"
  license: "GPL-2.0-or-later"
  homepage: "https://gitlab.gnome.org/World/AbiWord"
  upstream_version: "3.0.8"
  upstream_release_date: "2026-02-18"
  reference_packaging:
    - name: "Alpine Linux abiword-plugin-openwriter"
      version: "3.0.8-r0"
      url: "https://pkgs.alpinelinux.org/package/v3.24/community/x86_64/abiword-plugin-openwriter"

