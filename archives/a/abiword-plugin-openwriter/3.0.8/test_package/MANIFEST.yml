# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# ⚠️ 如实声明测试来源：上游 AbiWord 3.0.8 openwriter 插件【无任何官方测试】
# （plugins/openwriter/ 下仅 Makefile.am + xp/Makefile.am + 5 xp/*.cpp/h，全树无 tests 目录）。
# 本包测试均为 OHOS 适配自研（见下方 adapted_tests / test_package_tests）。

package: abiword-plugin-openwriter/3.0.8
homepage: "https://gitlab.gnome.org/World/AbiWord"

# 上游官方测试：无（已核实：orig 纯净上游树 plugins/openwriter/ 子目录无 tests 目录，
# Makefile.am 无 TESTS / check_PROGRAMS 定义）
upstream_official_tests: []

# 构建阶段不执行 upstream 测试命令（上游无 make check 等价物）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 适配补全测试（自研，非上游）：R34 ABI surface 验证
# 验证 openwriter 实际调用的 11 个 libgsf symbol 全部能 link，
# 并跨 4 阶段验证 read chain + write chain 两个 ODT 处理路径
adapted_tests:
  - file: test_package/test_openwriter.c
    origin: ohos-adaptation (self-authored, based on R34 ABI surface extraction from openwriter xp/*.cpp)
    description: "libgsf R34 ABI surface test：gsf_infile_zip_new（reject non-zip /dev/null）+ gsf_infile_child_by_name + gsf_input_size（39 bytes mimetype）+ gsf_outfile_zip_new + gsf_outfile_new_child + gsf_output_write + gsf_output_close，共覆盖 11 个 openwriter 实际调用的 libgsf symbol"
    command: "./test_openwriter"

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test_package/test_openwriter.c
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：编译链接 libgsf-1 + glib 后，运行 test_openwriter 二进制验证 11 个 ABI symbol 通过 link-time + runtime 双重验证"
    command: "./test_openwriter"

# 测试断言总数（test_openwriter.c 关键断言：3 个核心 check + 11 个 link-time symbol 验证）
assertion_count: 14