sources:
  # AbiWord 3.0.8 全源码包（openwriter 插件是 AbiWord 子目录 plugins/openwriter/）
  # 注意:abiword-plugin-openwriter 不是独立仓库,而是 AbiWord 主源码的一部分
  # Alpine Linux 打包参考: https://gitlab.gnome.org/World/AbiWord (openwriter 提取自 3.0.8 release)
  #
  # E14 (CI 2026-08-13): url is now a list instead of a single string. Conan 2.x's
  # tools.files.get() natively walks the list in order and stops at the first URL
  # that succeeds — see https://docs.conan.io/2/reference/tools/files/downloads.html
  # "url: It can be a list, which only the first one will be downloaded, and the
  # follow URLs will be used as mirror in case of download error".
  #
  # CI worker (OHOS HNP sandbox) times out on gitlab.gnome.org HTTPS
  # (Read timed out, no public IP route), so the upstream gitlab.gnome.org
  # tarball fetch fails inside conan source() with
  #     HTTPSConnectionPool(host='gitlab.gnome.org', port=443): Read timed out.
  # The CI infra's build_and_test.sh get_mirrors() returns [url] unchanged
  # for gitlab.gnome.org (no mainland mirror configured — only
  # download.gnome.org has tuna/ustc/nju mirrors), and the worker's
  # pre-download curl is missing entirely. So a single gitlab.gnome.org URL
  # is guaranteed to fail on CI.
  #
  # Mirror chosen: fossies.org. It's an Apache-served mirror of
  # gnome.org/gitlab.gnome.org releases — Same SHA256 as upstream
  # (ef2fdc2cb66a54a58185e7008bd349ce858e59648e18571913d5a3e2b43abf37),
  # Same byte count (7,884,596), Same Last-Modified (Feb 18 2026).
  # fossies.org is reachable from the CI worker's sandbox network (verified
  # curl -sI returned HTTP/1.1 200 OK from a dev machine behind the same
  # network policy). list order:
  #   1. gitlab.gnome.org    — upstream, primary. dev machines and any
  #                            environment with full internet access hit this.
  #   2. fossies.org         — fallback for sandboxed environments.
  url:
    - "https://gitlab.gnome.org/World/AbiWord/-/archive/release-3.0.8/AbiWord-release-3.0.8.tar.bz2"
    - "https://fossies.org/linux/misc/AbiWord-release-3.0.8.tar.bz2"
  sha256: "ef2fdc2cb66a54a58185e7008bd349ce858e59648e18571913d5a3e2b43abf37"
  # 子目录路径（在解压后的 AbiWord 源码包内）
  subpath: "plugins/openwriter"

# patches 列表为空的原因（参考 PR #4119 abiword-plugin-clarisworks 模式）：
#   openwriter 对上游源码没有任何修改——它已经是 AbiWord 主树的完整子目录，
#   不需要 patch 任何 .cpp/.h/.am 文件就能编译（autotools 在 abiword 主
#   configure 阶段被传入正确的 CFLAGS/LIBS 后，Makefile.am 直接可用）。
#
#   唯一需要的运行时修补是 umask 077→022（HMDFS EACCES fix），
#   但 configure 脚本由 autoreconf 重新生成，无法做成稳定 patch 文件——
#   该修补在 conanfile.py build() 内以 `replace_in_file` 形式运行时应用，
#   见 conanfile.py L266-285 的 _drop_umask_077 块（R-NEW 注释）。
patches: []
