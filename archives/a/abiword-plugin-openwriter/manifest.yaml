software: abiword-plugin-openwriter
display: "AbiWord OpenWriter Plugin"
description: "AbiWord 文字处理器的 OpenDocument Text (.odt) 读写插件（AbiWord 主仓库 plugins/openwriter/ 子目录）"
category: productivity
homepage: "https://www.abisource.com/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "source-recipe 模式：从 AbiWord 3.0.8 release-3.0.8.tar.bz2 抽 plugins/openwriter/ 子目录"
    - "强依赖 libgsf/1.14.53（Oasis .odt zip 容器 + 元数据解析）"
    - "显式 requires glib/2.84.0（GObject 类型 gsf_off_t / GsfInput* 必需）"
    - "build() 手动 make -C xp libxp.la + make openwriter.la 跳过 abiword parent configure"
    - "OHOS --build/--host = aarch64-unknown-linux-ohos（config.guess bypass）"
    - "_drop_umask_077_in_place() 模块化替换 configure 内的 umask 077 && mktemp -d（HMDFS E114）"
    - "OHOS 强制 make -j1（HMDFS E074 jobserver fifo EPERM）"
    - "package() 复制 .deps/ 目录（libtool transitive dep stubs 必需）"
    - "tool_requires automake/1.18 + libtool/2.5.4（OHOS HNP image 仅含 autoconf suite）"
    - "R34 ABI surface 测试覆盖 11 个 openwriter 实际调用的 libgsf symbol"
  common_dependencies:
    - libgsf
    - glib

versions:
  "3.0.8":
    status: built
    build_date: "2026-08-10"
    note: "abiword-plugin-openwriter 3.0.8 OHOS PC 基础适配完成 — libgsf/1.14.53 强依赖，R34 ABI surface 测试 11 symbol link-time 验证通过，qemu-aarch64 L2 smoke OK（2/2）；真机 .odt 业务依赖 libabiword 主库（Path B 下一阶段）"