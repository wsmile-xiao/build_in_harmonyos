# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试来源: tests/CMakeLists.txt
#   - add_test(test-gactionmuxer) -> tests/test-gactionmuxer.cpp
#   - add_test(indicator-test)    -> tests/indicator-test.cpp
#   - add_test(test-client)       -> tests/test-client.py
#   - cppcheck                    -> 静态分析 target
#
# 真实执行情况（本轮修复，审查要求"测试必须真实运行"）：
#   test-gactionmuxer（6 TEST）：test_package build() 阶段真实编译运行，
#   6/6 PASSED（gtest-run.log 证据，test() 探针断言）；
#   indicator-test（4 TEST_F）：依赖 dbustest-1，OHOS 制品仓无配方且上游
#   源码不可得 → 不可真实执行，适配方案见该条目 description；
#   test-client（2 方法）：依赖 libmessaging-menu 的 GI typelib（需
#   ENABLE_INTROSPECTION=ON + gobject-introspection 工具链），适配方案见该
#   条目 description。

package: ayatana-indicator-messages/24.5.2
homepage: "https://github.com/AyatanaIndicators/ayatana-indicator-messages"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "test_package build(): get() 拉上游 24.5.2 源码，clang/clang++ 编译 tests/test-gactionmuxer.cpp + src/gactionmuxer.c（-DG_LOG_DOMAIN=Ayatana-Indicator-Messages），链接 gtest_main/gtest/gmock + glib 静态链，运行 6 TEST 输出 gtest-run.log"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test-gactionmuxer.cpp
    source: ayatana-indicator-messages-24.5.2/tests/test-gactionmuxer.cpp
    description: "GTest 单元测试：src/gactionmuxer.c 的 g_action_muxer 纯逻辑（6 个 TEST：Sanity/Empty/AddAndRemove/ActionAttributes/Signals/ActivateAction）。OHOS 真实执行：test_package build() 用制品仓 gtest/1.17.0+gmock/1.17.0 编译运行，6/6 PASSED（gtest-run.log，探针断言）"
    command: "./test-gactionmuxer"
  - file: tests/indicator-test.cpp
    source: ayatana-indicator-messages-24.5.2/tests/indicator-test.cpp
    description: "GTest 端到端集成测试（4 个 TEST_F：RootAction/SingleMessage/MessageReply/IconNotification）：spawn 真实 service 进程 + dbustest 的 DBus mock，依赖 dbustest-1/GTEST/GMOCK。OHOS 适配方案：dbustest-1 为上游测试专用 D-Bus mock 框架，制品仓无配方、上游（AyatanaIndicators/libdbustest）源码不可得（仓库 404）→ 不可真实执行；后续引入自制 libdbustest 包（依赖 gtest/gmock/dbus-glib，制品仓均有）后可执行"
    command: "./indicator-test"
  - file: tests/test-client.py
    source: ayatana-indicator-messages-24.5.2/tests/test-client.py
    description: "Python 客户端测试（2 个测试方法：test_registration/test_status），经 GI typelib 调用 libmessaging-menu，依赖 GObjectIntrospection。OHOS 适配方案：typelib 需 ENABLE_INTROSPECTION=ON + gobject-introspection 工具链生成（制品仓有 gobject-introspection/1.78.1，主配方当前 ENABLE_INTROSPECTION=OFF 裁剪桌面绑定）；后续启用 introspection 并重建 libmessaging-menu 后可执行"
    command: "python3 test-client.py"
  - file: tests/CMakeLists.txt
    source: ayatana-indicator-messages-24.5.2/tests/CMakeLists.txt
    description: "cppcheck 静态分析（--enable=all --error-exitcode=2，覆盖 src/ 与 tests/）"
    command: "cppcheck --enable=all --error-exitcode=2 --inline-suppr src tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ayatana-indicator-messages.py
    description: "消费者冒烟测试：① 启动 ayatana-indicator-messages-service，验证安装产物可执行、依赖库/符号可解析（conanrun 注入 LD_LIBRARY_PATH，exit ≠ 127 即通过）；② 断言 build() 阶段上游 test-gactionmuxer 真实运行日志 gtest-run.log：6 个 TEST 全部 OK 且 PASSED 6 tests"
    command: "python3 test_ayatana-indicator-messages.py <service-exe> <build-folder>"
  - file: conanfile.py
    description: "build() 真实编译运行上游 test-gactionmuxer（6/6 PASSED，失败即 build 失败）；test() 调用探针（L0c/L0d 入口）"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 12 个测试入口：6 个（test-gactionmuxer）OHOS 真实执行且 6/6 通过；
# 6 个（indicator-test 4 + test-client 2）因 dbustest-1/GI 工具链不可得，
# 提供 OHOS 适配方案（见 upstream_tests 条目 description）
assertion_count: 12
