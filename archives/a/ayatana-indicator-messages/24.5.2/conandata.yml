# conandata.yml — ayatana-indicator-messages 24.5.2
# Ayatana System Indicator — Messages（消息菜单系统指示器服务）
#
# 说明：上游 GitHub 仓库无 24.5.2 git tag（最新 tag 24.5.1）；24.5.2 为
# Debian/Ubuntu/Kali 已打包的上游发布，此处取 Ubuntu archive 官方 orig tarball
# （与上游 ChangeLog 24.5.2 对应，PROJECT_VERSION 24.5.2，构建系统一致）。

sources:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/a/ayatana-indicator-messages/ayatana-indicator-messages_24.5.2.orig.tar.gz"
  sha256: "a1304d2d28fde2912a91741856b2b6b2242d3b508f2666412b37a35005b3664b"

patches:
  - patch_file: "patches/0001-skip-data-po-doc-optional-accountsservice.patch"
    patch_description: "CMakeLists: 新增 ENABLE_ACCOUNTS_SERVICE/SKIP_DATA_PO/SKIP_DOC 选项 — HarmonyOS 无 accountsservice（REQUIRED 降级为可选）、无 GSettings/Intltool/gtk-doc CMake 模块，跳过 data//po//doc/"
    patch_type: "cmake"
  - patch_file: "patches/0002-accountsservice-stub.patch"
    patch_description: "src/im-accounts-service.c: 以 HAVE_ACCOUNTS_SERVICE 编译开关包裹 act/act.h 实现；OFF 时编译 stub（draws-attention no-op、show-on-greeter 恒 FALSE），保证符号齐全"
    patch_type: "cmake"
  - patch_file: "patches/0003-optional-introspection.patch"
    patch_description: "libmessaging-menu/CMakeLists.txt: 新增 ENABLE_INTROSPECTION 选项 — HarmonyOS 无 GObjectIntrospection/Vala 时跳过 gir/typelib/vapi 生成"
    patch_type: "cmake"
  - patch_file: "patches/0004-link-deps-library-dirs.patch"
    patch_description: "src/ + libmessaging-menu/ CMakeLists.txt: 补 target_link_directories(${PROJECT_DEPS_LIBRARY_DIRS}) — pkg_check_modules 只把 -l 放进 *_LIBRARIES，-L 目录在 *_LIBRARY_DIRS，缺 -L 导致 ld.lld unable to find library -lgio-2.0/-lglib-2.0 等"
    patch_type: "cmake"
  - patch_file: "patches/0005-intl-ffi-absolute-path.patch"
    patch_description: "CMakeLists: PROJECT_DEPS_LIBRARIES 移除 -lintl/-lffi 改 glib 包内绝对路径（INTL_LIB_ABS/FFI_LIB_ABS，generate() 注入）— OHOS 工具链系统同名库抢占导致 ld.lld undefined symbol: g_libintl_*（与 libkylin-ai-system-private 同根因）"
    patch_type: "cmake"
