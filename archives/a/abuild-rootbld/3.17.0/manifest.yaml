# 版本级 manifest
# 文件位置: archives/a/abuild-rootbld/3.17.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "3.17.0"

# 软件名
software: abuild-rootbld

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-10"

# 构建系统类型
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（abuild tarball：rootbld 是 abuild.in 内的函数）
  url: "https://gitlab.alpinelinux.org/alpine/abuild/-/archive/3.17.0/abuild-3.17.0.tar.gz"

  # 源码校验和
  sha256: "3c9f84622de901727bbe9b331e8c58c122f18a2680744e6c79fa39ba8165b99d"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - abuild/3.17.0
    - bubblewrap/0.11.0
    - gettext/0.22.5.1

  # 编译器（noarch 元包，无编译）
  cc: "N/A"
  cxx: "N/A"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "abuild-rootbld 是 Alpine abuild 的 noarch 元包子包：仅声明 rootbld 运行时依赖（abuild + bubblewrap + envsubst），无独立编译产物"
  - "rootbld 命令是 abuild.in 内的 shell 函数（rootbld()/rootbld_actions()），由 abuild 主包提供，abuild-rootbld 包本身无独立测试目标"
  - "本配方以 custom 构建安装 bin/rootbld 薄包装脚本（委托 abuild rootbld），并打包 abuild.in 源码摘录供参考"
  - "bubblewrap/gettext 依赖在本地 conan 缓存已验证（conan create 通过），尚未发布到 ohpcd 制品仓（本地工作流状态）"
