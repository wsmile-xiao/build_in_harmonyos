# 版本级 manifest
# 文件位置: archives/a/abuild-rootbld/3.18.0_rc3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "3.18.0_rc3"

# 软件名
software: abuild-rootbld

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"

# 构建系统类型
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（abuild tarball：rootbld 是 abuild.in 内的函数）
  url: "https://gitlab.alpinelinux.org/alpine/abuild/-/archive/3.18.0_rc3/abuild-3.18.0_rc3.tar.gz"

  # 源码校验和
  sha256: "cade1711e32323d77f385a07c2228affc862af186489bc9e2e3a6555aaea35f2"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - abuild/3.17.0.1
    - bubblewrap/0.11.0
    - gettext/0.22.5.1

  # 编译器（noarch 元包，无编译）
  cc: "N/A"
  cxx: "N/A"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "abuild-rootbld 是 Alpine abuild 的 noarch 元包子包：仅声明 rootbld 运行时依赖（abuild + bubblewrap + envsubst），无独立编译产物 (ref: 复用 3.17.0 先例模式)"
  - "rootbld 命令是 abuild.in 内的 shell 函数（rootbld()/rootbld_actions()），由 abuild 主包提供，abuild-rootbld 包本身无独立测试目标 (ref: 复用 3.17.0 先例模式)"
  - "本配方以 custom 构建安装 bin/rootbld 薄包装脚本（委托 abuild rootbld），并打包 abuild.in 源码摘录供参考 (ref: 复用 3.17.0 先例模式)"
  - "3.17.0→3.18.0_rc3 diff：rootbld()/rootbld_actions() 依赖契约不变（bwrap+envsubst 检查一致），内部改进（mktemp umask 0077、git -C $startdir、ROOTBLD_APK 用户态 apk、ABUILD_PACKAGE_CACHE），先例配方结构完全沿用 (ref: 本次实测 diff 结论)"
  - "三依赖（abuild/3.17.0.1、bubblewrap/0.11.0、gettext/0.22.5.1）已实测发布 ohpcd 制品仓（conan download + conan install 双验证） (ref: W0 实测记录 notes.md)"
