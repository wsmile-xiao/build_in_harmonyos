# 软件级 manifest
# 文件位置: archives/a/abuild-rootbld/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: abuild-rootbld

# 显示名
display: "abuild-rootbld"

# 一句话描述
description: "Build packages in chroot (Alpine abuild rootbld meta-package)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: build-tool

# 官网 URL
homepage: "https://gitlab.alpinelinux.org/alpine/abuild/"

# 开源许可证（SPDX 标识）
license: GPL-2.0-only

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "noarch 元包：仅声明 rootbld 运行时依赖（abuild + bubblewrap + envsubst），无编译产物"
    - "rootbld 命令由 abuild 主包提供（abuild.in 内 shell 函数），本包安装 PATH 委托包装脚本"

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.17.0":
    status: built
    build_date: "2026-08-10"
    archive_path: "3.17.0"
    requires_manual_verification: false
  "3.18.0_rc3":
    status: built
    build_date: "2026-09-02"
    archive_path: "3.18.0_rc3"
    requires_manual_verification: false
