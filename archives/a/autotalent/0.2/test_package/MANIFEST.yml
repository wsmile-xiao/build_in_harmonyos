# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: autotalent/0.2
homepage: "http://tombaran.info/autotalent.html"

# Upstream test command（如实申报：上游无测试套件）
upstream_check_command: "make check"

# Upstream test suite（规则 4 如实申报）：
# 上游 autotalent 0.2 无测试套件——tarball 无 tests/ 目录、Makefile
# 无测试目标（all: autotalent.so 仅构建插件）、README 无测试相关、
# 全文件无 test/check 相关文件（已逐项核实）——N=0，如实申报。
upstream_tests_total: 0
upstream_tests_passed: 0
upstream_tests_skipped_reason: "上游 autotalent 0.2 无测试套件（tarball 无 tests/、Makefile 无测试目标，已核实）"

# Upstream tests not run in build (none exist upstream; consumer-side test
# covers autotalent.so LADSPA plugin artifact check)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_autotalent.sh
    description: "Check autotalent.so LADSPA plugin artifact (descriptor symbol)"

# Test assertion count
assertion_count: 1
