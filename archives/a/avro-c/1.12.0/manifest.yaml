version: "1.12.0"
status: published
build_date: "2026-04-25"

source:
  url: "https://github.com/apache/avro"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "CMAKE_BUILD_TYPE=Release"
    - "CMAKE_EXE_LINKER_FLAGS=-lc++"
  dependencies:
    - jansson 2.14
    - zlib 1.3.1
    - snappy 1.1.10
    - liblzma 5.6.2
  cc: clang
  cxx: clang++

patches_applied:
  - 0001-version.sh.patch
  - 0002-src-CMakeLists.txt.patch
knowledge_gained:
  - "OpenHarmony bash 位于非标准路径，需使用 #!/usr/bin/env bash"
  - "CMake 在 HarmonyOS 上可能无法正确获取 SOVERSION，需设置默认值"
  - "snappy 是 C++ 库，链接到 C 项目需添加 -lc++ 链接参数"
  - "使用完整 Apache Avro tarball 可保留 share 目录，避免测试路径问题"
