software: avro-c
version: 1.12.0
status: success
build_system: cmake
created_at: 2026-04-24
updated_at: 2026-04-25
knowledge_gained:
  - OpenHarmony bash 位于非标准路径 /data/service/hnp/bin/bash，需使用 #!/usr/bin/env bash
  - CMake 在 HarmonyOS 上可能无法正确获取 SOVERSION，需设置默认值
  - snappy 是 C++ 库，链接到 C 项目需添加 -lc++ 链接参数
  - 使用完整 Apache Avro tarball 可保留 share 目录，避免测试路径问题
patches_applied:
  - 0001-version.sh.patch
  - 0002-src-CMakeLists.txt.patch
build_log: logs/build.log
source_url: file:///storage/Users/currentUser/tmp/downloads/avro-1.12.0.tar.gz
source_structure: full_tarball_with_share
dependencies:
  - jansson 2.14 (required)
  - zlib 1.3.1 (codec: deflate)
  - snappy 1.1.10 (codec: snappy)
  - liblzma 5.6.2 (codec: lzma)
configure_options:
  - CMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX
  - CMAKE_BUILD_TYPE=Release
  - CMAKE_EXE_LINKER_FLAGS=-lc++
codecs_enabled:
  - deflate
  - snappy
  - lzma
test_data_location: ~/tmp/share/test/data/schemas/

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/avro-c-1.12.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/avro-c-1.12.0.work
  patches_count: 2