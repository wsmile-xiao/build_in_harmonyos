sources:
  "1.12.0":
    url: "https://github.com/apache/avro/archive/refs/tags/release-1.12.0.tar.gz"
    sha256: "51832f9c2e81fa95addb74be627dac27b4883ec2c8627ec8471d99cfea787555"

patches:
  "1.12.0":
    - patch_file: patches/0001-lang-c-CMakeLists.txt.patch
      patch_type: compatibility
      patch_source: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos"
      patch_description: |
        Replace pkg_check_modules with find_package(CONFIG) for jansson,
        liblzma, and Snappy to work with Conan CMakeDeps generator.
        The upstream CMakeLists.txt uses pkg-config for jansson and liblzma,
        and a custom FindSnappy.cmake module for Snappy. Conan's CMakeDeps
        generates CMake config files, not pkg-config files, so the
        find_package calls are updated to use CONFIG mode and the old-style
        variables are set from the imported targets.
    - patch_file: patches/0002-lang-c-version.sh.patch
      patch_type: portability
      patch_source: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos"
      patch_description: |
        OpenHarmony bash is at a non-standard path (/data/service/hnp/bin/bash).
        Change shebang from #!/bin/bash to #!/usr/bin/env bash for portability.
    - patch_file: patches/0003-lang-c-src-CMakeLists.txt.patch
      patch_type: portability
      patch_source: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos"
      patch_description: |
        CMake on HarmonyOS may return empty SOVERSION from version.sh.
        Add a fallback to set SOVERSION to 22 when empty.
        Also add AVRO_BUILD_SHARED/AVRO_BUILD_STATIC options to control
        which library variants are built, and set POSITION_INDEPENDENT_CODE
        on the static target for correct linking.
