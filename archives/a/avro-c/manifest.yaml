software: avro-c
display: "Apache Avro C"
description: "Apache Avro 数据序列化系统的 C 语言实现，支持多种压缩 Codec"
category: data
homepage: "https://avro.apache.org"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，使用完整 Apache Avro tarball 保留 share 目录（测试数据）"
    - "OpenHarmony bash 位于非标准路径，需使用 #!/usr/bin/env bash"
    - "CMake 可能无法正确获取 SOVERSION，需手动设置默认值"
    - "snappy 是 C++ 库，链接到 C 项目需添加 -lc++ 链接参数"
  common_dependencies:
    - jansson
    - zlib
    - snappy
    - liblzma

versions:
  "1.12.0":
    status: published
    build_date: "2026-04-25"
    published_as: avro-c
    source_url: "https://github.com/apache/avro"
