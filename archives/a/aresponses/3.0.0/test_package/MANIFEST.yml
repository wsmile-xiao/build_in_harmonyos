# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aresponses/3.0.0
homepage: "https://github.com/CircleUp/aresponses"

# 上游测试命令
upstream_check_command: "python3 -m pytest tests/ -v"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests/ -v"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_examples.py
    source: aresponses-3.0.0/tests/test_examples.py
    description: "Example tests for aresponses mocking"
    command: "python3 -m pytest tests/test_examples.py -v"
  - file: tests/test_server.py
    source: aresponses-3.0.0/tests/test_server.py
    description: "Server mocking tests"
    command: "python3 -m pytest tests/test_server.py -v"
  - file: tests/test_with_aiohttp_client.py
    source: aresponses-3.0.0/tests/test_with_aiohttp_client.py
    description: "Integration tests with aiohttp client"
    command: "python3 -m pytest tests/test_with_aiohttp_client.py -v"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_aresponses.py
    description: "Import and API verification test"
    command: "python3 test_aresponses.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
