  source_work_dir: /storage/Users/currentUser/tmp/builds/argtable3-3.3.1.work
  source_orig_hash: e08d57aa4e87e2d9
  source_work_hash: 54ef2d781add3a11
  generated_at: '2026-06-01T16:51:02'
  patches_count: 2

patch_classification:
