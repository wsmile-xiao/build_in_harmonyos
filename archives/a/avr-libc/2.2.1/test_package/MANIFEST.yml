package: avr-libc/2.2.1
homepage: "https://github.com/avrdudes/avr-libc"

upstream_check_command: "cd tests/simulate && ./run-avrtest.sh"
upstream_test_in_build: true
upstream_test_command: "cd tests/simulate && MCU_LIST=at90s8515 MCU_LIST_FULL=at90s8515 ./runtest.sh -c -a <build-dir> time/*.c regression/*.c stdlib/*.c string/*.c pmstring/*.c printf/*.c scanf/*.c fplib/*.c math/*.c other/*.c avr/*.[cS] util/*.c pgmread/*.c pgmread-near/*.c pgmread-far/*.c"

upstream_tests:
  - file: tests/simulate
    source: avr-libc_2.2.1/tests/simulate
    source_count: 409
    description: "Compile/link all 406 C and 3 assembly sources supported by the bootstrap C toolchain"
    result: "409/409 passed (100%); 53 C++ sources blocked because avr-g++ and cc1plus are absent"
    command: "MCU_LIST=at90s8515 MCU_LIST_FULL=at90s8515 ./runtest.sh -c -a <build-dir> <409 C/assembly sources>"

test_package_tests:
  - file: test_avr_libc.c
    description: "Compile/link ATmega328P ELF with packaged CRT/libc/libm and verify AVR architecture plus memcpy=T, strlen=T and sin=W"
    command: "avr-gcc -mmcu=atmega328p ... && avr-objdump -f test_avr_libc.elf && avr-nm -g test_avr_libc.elf"

# Three version assertions, four required package artifacts, AVR architecture,
# and three linked API symbols with their expected binding types. The upstream
# compile/link suite contributes 409 source-level checks.
assertion_count: 11
