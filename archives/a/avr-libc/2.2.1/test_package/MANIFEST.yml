package: avr-libc/2.2.1
homepage: "https://github.com/avrdudes/avr-libc"

upstream_check_command: "cd tests/simulate && ./run-avrtest.sh"
upstream_test_in_build: true
upstream_test_command: "cd tests/simulate && ./runtest.sh -c -a <build-dir> string/strcmp.c stdlib/atoi-1.c math/cos-01.c"

upstream_tests:
  - file: tests/simulate/string/strcmp.c
    source: avr-libc_2.2.1/tests/simulate/string/strcmp.c
    description: "Compile/link upstream strcmp coverage against the freshly built AVR libc"
    command: "./runtest.sh -c -a <build-dir> string/strcmp.c"
  - file: tests/simulate/stdlib/atoi-1.c
    source: avr-libc_2.2.1/tests/simulate/stdlib/atoi-1.c
    description: "Compile/link upstream atoi coverage against the freshly built AVR libc"
    command: "./runtest.sh -c -a <build-dir> stdlib/atoi-1.c"
  - file: tests/simulate/math/cos-01.c
    source: avr-libc_2.2.1/tests/simulate/math/cos-01.c
    description: "Compile/link upstream libm coverage against the freshly built AVR libm"
    command: "./runtest.sh -c -a <build-dir> math/cos-01.c"

test_package_tests:
  - file: test_avr_libc.c
    description: "Compile/link ATmega328P ELF with packaged CRT/libc/libm and verify AVR architecture plus memcpy/strlen/sin symbols"
    command: "avr-gcc -mmcu=atmega328p ... && avr-objdump -f test_avr_libc.elf && avr-nm -g test_avr_libc.elf"

# Three version assertions, four required package artifacts, AVR architecture,
# and three linked API symbols.
assertion_count: 11
