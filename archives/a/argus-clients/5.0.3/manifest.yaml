software: argus-clients
# 版本级 manifest
# 文件位置: archives/a/argus-clients/5.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.0.3"

# 编译状态
status: published

# 编译日期
build_date: "2026-06-15"

# 构建系统类型（顶级字段）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码来自 Git 克隆
  url: "git://gitcode.com/argus-clients"
  sha256: ""
  tar_format: git

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖
  dependencies:
    - "curl/8.19.0"
    - "zlib/1.3.1"

  # 编译器
  cc: cc
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess-harmonyos.patch"
  - "0002-configure-tmpdir.patch"
  - "0003-makefile-fixes.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007 variant: HarmonyOS config.guess 需添加 HarmonyOS 分支"
  - "HMDFS tmpdir restriction: 需使用 $HOME/tmp 替代 /tmp"
  - "PKG_CHECK_MODULES 占位符缺失：需手动删除 @LIBMAXMINDDB_LIBS@ 等"
  - "config.status 临时目录需使用绝对路径"

notes: |
  需修改 config/config.guess 添加 HarmonyOS 支持
  需修改 configure 临时目录创建逻辑
  需修改 clients/Makefile 删除占位符并添加 curl include 路径
