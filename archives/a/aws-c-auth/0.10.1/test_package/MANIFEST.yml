package: aws-c-auth/0.10.1
homepage: https://github.com/awslabs/aws-c-auth

upstream_check_command: ctest -N
upstream_test_in_build: false
upstream_test_command: not run in cross-build recipe

upstream_tests:
  - file: tests/
    source: aws-c-auth-0.10.1/tests/
    description: Upstream CTest-based auth unit tests.
    command: ctest

test_package_tests:
  - file: test.c
    description: Consumer smoke test initializes and cleans up aws-c-auth.
    command: cmake --build . && ctest

assertion_count: 1
