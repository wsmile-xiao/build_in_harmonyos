package: aws-c-auth/0.10.1
homepage: https://github.com/awslabs/aws-c-auth

upstream_test_in_build: true
upstream_test_command: "cmake -DBUILD_TESTING=ON -DENABLE_NET_TESTS=OFF; ctest --output-on-failure --timeout 300 --parallel 8"
upstream_tests:
  - path: tests/
    type: upstream C auth/credentials/signing ctest suite (198 add_test_case registrations plus 98 add_net_test_case registrations; ENABLE_NET_TESTS=OFF keeps the offline/local deterministic subset)

excluded_upstream_tests:
  - command: "ENABLE_NET_TESTS=OFF (98 add_net_test_case registrations)"
    reason: "The upstream suite labels 98 cases as requiring a working internet connection (default provider, ECS, STS Web Identity, STS direct, IMDS proxy routing). OHOS CI workers are isolated from public AWS endpoints, so these cases are not registered for the CI gate. The upstream tests are not modified; the exclusion uses the upstream AwsTestHarness option."
  - command: "AWS_BUILDING_ON_EC2 / AWS_BUILDING_ON_ECS real-service cases"
    reason: "credentials_provider_imds_real_success and credentials_provider_ecs_real_success are guarded by upstream host-detection flags and are not built on the OHOS worker."

coverage:
  enabled: false
  reason: "The contest OHOS Conan profile executes test_package but does not enable compiler coverage instrumentation or provide a stable gcov/lcov collection step."

test_package_tests:
  - file: test.c
    description: Consumer tests run two offline modes: library init/cleanup and static credentials creation/getter validation, covering a portable subset of upstream credentials behavior without network or external credential providers.
    command: "test_aws_c_auth --init; test_aws_c_auth --credentials; ctest --output-on-failure"

assertion_count: 6
