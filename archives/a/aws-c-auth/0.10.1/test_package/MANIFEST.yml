package: aws-c-auth/0.10.1
homepage: https://github.com/awslabs/aws-c-auth

upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - path: tests/
    type: upstream C auth unit and integration tests
  - path: tests/aws-signing-test-suite
    type: upstream AWS signing compatibility test suite
  - path: tests/CMakeLists.txt
    type: upstream CTest test registration

excluded_upstream_tests:
  - command: "tests/"
    reason: "Authentication and signing integration tests depend on network/runtime behavior that is unstable on the isolated OHOS CI worker; this adaptation uses consumer smoke coverage instead."

coverage:
  enabled: false
  reason: "The contest OHOS Conan profile executes test_package but does not enable compiler coverage instrumentation or provide a stable gcov/lcov collection step."

test_package_tests:
  - file: test.c
    description: Consumer smoke test initializes aws-c-auth and verifies link-time dependency closure.
    command: test_aws_c_auth

assertion_count: 3
