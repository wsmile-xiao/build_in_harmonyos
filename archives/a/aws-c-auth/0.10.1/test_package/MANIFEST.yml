package: aws-c-auth/0.10.1
homepage: https://github.com/awslabs/aws-c-auth

upstream_test_in_build: false
upstream_test_command: "not run in this path-A base recipe; upstream CTest suite requires the full AWS CRT test dependency graph and runtime services"
upstream_tests:
  - path: tests/
    type: upstream C auth unit and integration tests
  - path: tests/aws-signing-test-suite
    type: upstream AWS signing compatibility test suite
  - path: tests/CMakeLists.txt
    type: upstream CTest test registration

excluded_upstream_tests:
  - command: "ctest / tests/"
    reason: "The upstream suite is not a standalone aws-c-auth-only test set. It expects the full AWS CRT dependency graph, generated test fixtures, credentials/signing suites, event-loop/runtime behavior, and selected network/crypto provider configuration. This path-A OpenHarmony PC adaptation privately builds the dependency graph only to package aws-c-auth and deliberately disables BUILD_TESTING for deterministic cross-build CI."
  - command: "tests/aws-signing-test-suite"
    reason: "The signing corpus is recorded as upstream coverage, but enabling it in CI requires wiring the upstream CTest harness and fixture discovery across private dependencies. This PR keeps it documented and validates link/init behavior; portable signing corpus enablement should be handled as a follow-up full-test issue."

coverage:
  enabled: false
  reason: "The contest OHOS Conan profile executes test_package but does not enable compiler coverage instrumentation or provide a stable gcov/lcov collection step."

test_package_tests:
  - file: test.c
    description: Consumer smoke test initializes aws_common_library_init and aws_auth_library_init through type-compatible C11 generic selection, treats void init APIs as AWS_OP_SUCCESS, checks int init APIs when present, asserts aws-common initialized state, and verifies link-time dependency closure.
    command: test_aws_c_auth

assertion_count: 2
