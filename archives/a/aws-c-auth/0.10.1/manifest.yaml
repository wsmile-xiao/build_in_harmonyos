version: "0.10.1"
status: published
build_date: "2026-04-24"

source:
  url: "https://github.com/awslabs/aws-c-auth/archive/refs/tags/v0.10.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - aws-c-common
    - aws-c-io
    - aws-c-http
    - aws-c-cal
    - aws-c-sdkutils
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
  - "从 0.7.7 升级到 0.10.1 以兼容 aws-crt-cpp 0.38.5 (需 >= 0.10.0)"
  - "添加了新的凭证提供者 API"
  - "改进了 SigV4 签名性能"
