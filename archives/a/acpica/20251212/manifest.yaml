software: acpica
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/20251212/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "20251212"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/acpica/acpica/releases/download/20251212/acpica-unix2-20251212.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型（verify脚本要求顶级字段）
build_system: makefile

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（make参数）
  configure_options:
    - "NOWERROR=TRUE"
    - "ACPI_HOST=_LINUX"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "acpica使用自定义Makefile，不是autotools项目，无configure脚本"
  - "clang不支持GCC-only警告标志(-Wlogical-op, -Wmissing-parameter-type, -Wold-style-declaration)，需NOWERROR=TRUE禁用-Werror"
  - "acpica的make install支持DESTDIR和PREFIX参数"
  - "acpica无标准测试套件(make check/test不可用)"
