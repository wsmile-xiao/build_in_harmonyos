  - "SDL2/OpenAL 不可用, 仅构建 IO 库和工具 (部分适配)"
  - "CMAKE_SYSTEM_NAME=Linux 绕过 OHOS 不被 CMake 识别的问题"
  - "USE_NATIVE_FS=ON 使用 POSIX 文件系统, 避免 boost::filesystem 依赖"

