# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file to exist

package: arx-libertatis/1.2.1
homepage: "https://arx-libertatis.org/"

# Upstream test command
upstream_check_command: "make check"

# conanfile.py build() — upstream tests not integrated in build
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: tests/src/UnitTest.cpp
    source: arx-libertatis-1.2.1/tests/src/UnitTest.cpp
    description: "Arx unit tests (requires BUILD_TESTS=ON, disabled for OHOS)"
    command: "./arxtest"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test_arx.cpp
    description: "Consumer test: calls ArxIO_init(), ArxIO_getError(), ArxIO_getLogLine(), ArxIO_unpack_alloc() API"
    command: "./test_arx"

# Approximate assertion count
assertion_count: 4
