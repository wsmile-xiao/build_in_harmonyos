# 软件级 manifest — arx-libertatis
# 遵循 ARCHIVE-SPEC v2.0

software: arx-libertatis
display: "Arx Libertatis"
description: "Arx Fatalis 跨平台移植版 — 第一人称 3D RPG 游戏引擎 (IO 库和工具)"
category: game
homepage: "https://arx-libertatis.org/"
license: GPL-3.0
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "CMake 项目，CMAKE_SYSTEM_NAME 需设为 Linux（CMake 不识别 HarmonyOS/OHOS）"
    - "SDL2 和 OpenAL 不可用 → 仅构建 IO 库 (libArxIO.so) 和工具 (arxtool)，主游戏二进制不构建"
    - "OHOS 不支持 pthread_setcancelstate → 需要 ohos_stubs.h 提供 no-op stub（影响 boost smart_ptr 头文件）"
    - "Conan CMakeDeps 变量作用域问题 → 不使用 conan 工具链，直接设置 CMAKE_PREFIX_PATH 让自定义 Find 模块搜索"
    - "Arx 自定义 Find 模块 (FindEpoxy.cmake, FindGLM.cmake) 使用大写变量，CMakeDeps 设置小写 → 需变量映射"
    - "USE_NATIVE_FS=ON 使用 POSIX 文件系统后端，避免 boost::filesystem 依赖"
    - "ICON_TYPE=none 跳过 Inkscape 依赖"
    - "check_link_library (try_compile) 与 Conan imported targets 不兼容 → 需注释"
  common_dependencies:
    - "zlib"
    - "freetype"
    - "boost"
    - "glm"
    - "libepoxy"

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2.1":
    status: built
