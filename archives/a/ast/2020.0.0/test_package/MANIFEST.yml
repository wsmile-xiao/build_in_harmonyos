# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: ast/2020.0.0
homepage: "https://github.com/att/ast"

# Upstream test command
upstream_check_command: "meson test"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: test_ksh.sh
    source: ast-2020.0.0/test_package/test_ksh.sh
    description: "ksh functional test: arithmetic, strings, arrays"
    command: "ksh test_ksh.sh"

# Test package tests (consumer-side verification)
test_package_tests:
  - file: test_ksh.sh
    description: "Execute ksh binary and run functional tests"
    command: "ksh test_ksh.sh"

# Number of test assertions
assertion_count: 4
