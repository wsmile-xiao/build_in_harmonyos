  # 配置选项列表
  configure_options:
  - "--prefix=/storage/Users/currentUser/usr/local"
  - "--enable-curses=ncurses"
  - "--build=x86_64-unknown-linux-gnu"
  - "--host=aarch64-linux-ohos"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "ncurses/6.6"

  # 编译器
  cc: clang
  cxx: clang++

  # 额外编译标志
  ldflags:
  - "-fuse-ld=bfd"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS: lld linker has broken libxml2.so.16 runtime dependency — use -fuse-ld=bfd to workaround"
  - "OHOS: autoconf 2.69 config.status uses umask 077 for temp dirs, which causes Permission denied on HMDFS — patch to umask 022"
  - "OHOS: cross-compile mode needed (--build differs from --host) because newly compiled binaries cannot be executed (OHOS security model)"
  - "aspell config.guess/sub from 2014 don't recognize aarch64-linux-ohos — patch to 2022 versions"
  - "aspell --enable-curses=ncurses sets CURSES_LIB=-lncurses without runtime tests, works in cross-compile"
  - "make -j1 required: HMDFS FIFO jobserver fails with -j2 (Operation not permitted)"
  - "manual/ subdir needs makeinfo (texinfo) — non-critical, can be skipped"

