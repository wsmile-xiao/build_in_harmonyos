# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: aurpublish/20231227.3b978be
homepage: "https://github.com/eli-schwartz/aurpublish"

# 上游为纯 bash 脚本项目，Makefile 无 check/test 目标
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（无）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_aurpublish.sh 实际执行安装后的 aurpublish 脚本（--help 冒烟 + git 仓库内 setup 安装 hooks）"
    command: "conan create (test_package: bash test_aurpublish.sh <bin_dir>)"
  - file: test_aurpublish.sh
    description: "真实冒烟测试: 脚本存在且可执行; bash -n 语法检查; --help 退出码 0 且输出 usage 文本; 临时 git 仓库内 setup 成功安装 3 个 hooks（验证渲染脚本运行时 HOOKSDIR 解析）"
    command: "bash test_aurpublish.sh <package bin dir>"

assertion_count: 8
