# Upstream and consumer test declaration for adapt-parser 1.0.0.
package: adapt/1.0.0
homepage: "https://github.com/MycroftAI/adapt"

upstream_check_command: "./run_tests.sh test"
upstream_test_in_build: false
upstream_test_command: "./run_tests.sh test"

upstream_tests:
  - file: test/ContextManagerIntegrationTest.py
    source: adapt-1.0.0/test/ContextManagerIntegrationTest.py
    description: "Upstream context manager integration tests"
    command: "pytest test/ContextManagerIntegrationTest.py"
  - file: test/ContextManagerTest.py
    source: adapt-1.0.0/test/ContextManagerTest.py
    description: "Upstream context manager unit tests"
    command: "pytest test/ContextManagerTest.py"
  - file: test/DomainIntentEngineTest.py
    source: adapt-1.0.0/test/DomainIntentEngineTest.py
    description: "Upstream domain intent engine tests"
    command: "pytest test/DomainIntentEngineTest.py"
  - file: test/EntityExpanderTest.py
    source: adapt-1.0.0/test/EntityExpanderTest.py
    description: "Upstream entity expansion tests"
    command: "pytest test/EntityExpanderTest.py"
  - file: test/EntityTaggerTest.py
    source: adapt-1.0.0/test/EntityTaggerTest.py
    description: "Upstream entity tagging tests"
    command: "pytest test/EntityTaggerTest.py"
  - file: test/IntentEngineTest.py
    source: adapt-1.0.0/test/IntentEngineTest.py
    description: "Upstream intent registration and determination tests"
    command: "pytest test/IntentEngineTest.py"
  - file: test/IntentTest.py
    source: adapt-1.0.0/test/IntentTest.py
    description: "Upstream intent model tests"
    command: "pytest test/IntentTest.py"
  - file: test/TrieTest.py
    source: adapt-1.0.0/test/TrieTest.py
    description: "Upstream trie matching tests"
    command: "pytest test/TrieTest.py"

test_package_tests:
  - file: test_adapt.py
    description: "Consumer imports the packaged module and resolves a registered intent"
    command: "python test_adapt.py"

assertion_count: 4
