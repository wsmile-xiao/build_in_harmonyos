software: alsa-utils
version: "1.2.14"
build_system: autotools
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.alsa-project.org/files/pub/utils/alsa-utils-1.2.14.tar.bz2"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-udev-rules-dir=no"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - alsa-lib/1.2.14
    - ncurses/6.4.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-bat-Makefile.am.patch"
  - "0002-bat-Makefile.in.patch"
  - "0003-config.guess.patch"
  - "0004-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "musl libc 不实现 POSIX 线程取消 API (pthread_cancel 等)，需要创建 stub 文件"
  - "alsa-utils 需要 alsa-lib >= 1.2.13"
  - "配置需要禁用 udev 规则 (--with-udev-rules-dir=no)，因为 /lib 是只读"
  - "VPATH 构建方式解决 HMDFS 临时文件权限问题"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

