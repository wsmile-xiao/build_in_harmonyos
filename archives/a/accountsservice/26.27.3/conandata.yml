sources:
  "26.27.3":
    # gitlab.freedesktop.org official archive (GitHub sandbox unreachable; gitlab source verified)
    url: "https://gitlab.freedesktop.org/accountsservice/accountsservice/-/archive/26.27.3/accountsservice-26.27.3.tar.gz"
    sha256: "11de07bcd499c2277f78a6fc830d1437654f3397cc7bbed19c28b3818435ba38"
    tar_format: tar.gz
patches:
  "26.27.3":
    - patch_file: "patches/0001-fix-version-26.27.3.patch"
      patch_type: "portability"
      patch_description: "Pin generate-version.sh to the 26.27.3 release tag (OHOS conan source dir is renamed and sits under a git work tree, upstream would emit 26.34.1 or Version unknown)"
      patch_source: "https://gitlab.freedesktop.org/accountsservice/accountsservice"
    - patch_file: "patches/0002-crypt-util-ohos.patch"
      patch_type: "portability"
      patch_description: "Neutral feature-macro portability: meson.build gains cc.has_function/has_header_symbol probes (HAVE_EXPLICIT_BZERO/HAVE_DECL_CRYPT/HAVE_GETSPNAM/HAVE_FGETSPENT/HAVE_UTMPX*) that generate neutral HAVE_* config.h macros; crypt-util declares crypt(3) when libc exports it without a header declaration and implements a volatile-wipe explicit_bzero fallback for libcs lacking it (no platform ifdefs, same code path verifiable on Linux)"
      patch_source: "https://gitlab.freedesktop.org/accountsservice/accountsservice"
    - patch_file: "patches/0003-wtmp-helper-ohos.patch"
      patch_type: "portability"
      patch_description: "Neutral feature-macro portability: utmpx/wtmp API fallbacks gated by !HAVE_UTMPXNAME/!HAVE_GETUTXENT etc. (probed in meson.build); on libcs without the API login accounting yields no records (documented runtime limitation, R40 sign-off note inline)"
      patch_source: "https://gitlab.freedesktop.org/accountsservice/accountsservice"
    - patch_file: "patches/0004-daemon-ohos.patch"
      patch_type: "portability"
      patch_description: "Neutral feature-macro portability: shadow-password fallbacks gated by !HAVE_GETSPNAM/!HAVE_FGETSPENT (probed in meson.build); on libcs without the API every account is treated as having no shadow entry (documented runtime limitation, R40 sign-off note inline)"
      patch_source: "https://gitlab.freedesktop.org/accountsservice/accountsservice"
    - patch_file: "patches/0005-data-policy-ohos.patch"
      patch_type: "portability"
      patch_description: "gettext ITS rules absent in the OHOS toolchain - install the .policy file untranslated via configure_file(copy:) instead of i18n.merge_file()"
      patch_source: "https://gitlab.freedesktop.org/accountsservice/accountsservice"
