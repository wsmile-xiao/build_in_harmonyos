# 版本级 manifest — accountsservice 26.27.3
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "26.27.3"

# 软件名
software: accountsservice

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（gitlab.freedesktop.org 官方源；GitHub 沙箱不可达，
  # 本环境实测 gitlab 官方 archive 可达，sha256 已实测）
  url: "https://gitlab.freedesktop.org/accountsservice/accountsservice/-/archive/26.27.3/accountsservice-26.27.3.tar.gz"
  upstream_url: "https://gitlab.freedesktop.org/accountsservice/accountsservice/-/archive/26.27.3/accountsservice-26.27.3.tar.gz"

  # 源码校验和（实测下载 sha256）
  sha256: "11de07bcd499c2277f78a6fc830d1437654f3397cc7bbed19c28b3818435ba38"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dsystemdsystemunitdir=no"
    - "-Dwtmpfile=/var/log/wtmp"
    - "-Dtests=false"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Ddocbook=false"
    - "-Dgtk_doc=false"
    - "-Dcreate_homed=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0.1
    - json-c/0.18
    - dbus/1.14.10
    - polkit/127

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-fix-version-26.27.3.patch"
  - "patches/0002-crypt-util-ohos.patch"
  - "patches/0003-wtmp-helper-ohos.patch"
  - "patches/0004-daemon-ohos.patch"
  - "patches/0005-data-policy-ohos.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "accountsservice 26.27.3（Meson）daemon 硬性 REQUIRED polkit-gobject-1（meson.build:161 无 required:false、meson_options.txt 无可关闭开关）；polkit/127 提供 libpolkit-gobject-1 客户端库（配方回退复制其包内 .pc 并改写 prefix），回迁 finish 成功 -> built"
  - "systemd/logind 为可选依赖：-Dsystemdsystemunitdir=no 关闭 systemd units；libelogind/libsystemd 依赖以配方内置 logind stub（C 实现最小接口）替代，OHOS 无 systemd"
  - "accountsservice 26.27.3 源码 generate-version.sh 依赖目录名/外层 git 判定版本：在 $HOME 为 git worktree 的环境（如本机）运行会误派生 26.34.1（date+%y.%V），配方需按发布 tag 26.27.3 固定版本（0001-fix-version patch）"
  - "dbus/1.14.10 配方 pkg-config 名生成 dbus.pc 而非 meson 查找的 dbus-1.pc，meson dependency('dbus-1') 需 pkg_config_name=dbus-1 或 pc 别名处理（_create_dbus_pc_alias）"
  - "OHOS libc 缺 utmpx/wtmp 与 shadow-account API（SDK 头文件仅含 struct 定义、libc.so 不导出函数）：0002 补丁在 meson.check_functions 框架增设 cc.has_function/has_header_symbol 特性探测（HAVE_EXPLICIT_BZERO/HAVE_DECL_CRYPT/HAVE_GETSPNAM/HAVE_FGETSPENT/HAVE_UTMPX*），源码以中性 #ifndef HAVE_* 守卫回退实现（R8 合规，无平台 ifdef，Linux 同路径可验证）；登录记账/影子密码为运行期限制（无口令/无记录，R40 人工确认标注见 notes.md）"
