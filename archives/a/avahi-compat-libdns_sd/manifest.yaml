# 软件级 manifest — avahi-compat-libdns_sd
# 遵循 ARCHIVE-SPEC v2.0 / v3.0
software: avahi-compat-libdns_sd
display: "Avahi Bonjour 兼容层 (libdns_sd)"
description: "基于 Avahi 的 Bonjour 兼容 DNS Service Discovery 库，提供 dns_sd.h 兼容 API（DNSService*/TXTRecord*）"
category: network
homepage: "https://github.com/avahi/avahi"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tag 源码包不含预生成 configure，需 autogen.sh（autoreconf）引导构建"
    - "avahi-client 通过 D-Bus 与 avahi 守护进程通信，编译期依赖 dbus"
    - "仅构建 avahi-common/avahi-client/avahi-compat-libdns_sd 三个子目录，产出 libdns_sd"
  common_dependencies:
    - dbus

versions:
  "0.9_rc5":
    status: built
    build_date: "2026-08-22"
    conan_ref: "avahi-compat-libdns_sd/0.9_rc5"
