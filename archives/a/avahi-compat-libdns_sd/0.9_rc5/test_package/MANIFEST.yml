# test_package/MANIFEST.yml — avahi-compat-libdns_sd 0.9_rc5
# 上游测试声明（CI L0e 强制要求）
package: avahi-compat-libdns_sd/0.9_rc5
homepage: "https://github.com/avahi/avahi"

# 上游测试命令（avahi-compat-libdns_sd 子目录的 automake TESTS）
upstream_check_command: "make -C avahi-compat-libdns_sd check"
upstream_test_in_build: true
upstream_test_command: "make -C avahi-compat-libdns_sd check"

# 上游实际运行的测试程序（TESTS = txt-test null-test，无需守护进程）
upstream_tests:
  - file: txt-test.c
    source: avahi-0.9-rc5/avahi-compat-libdns_sd/txt-test.c
    description: "TXT 记录编码/解码往返测试（TXTRecordCreate/SetValue/ContainsKey/GetValuePtr）"
    command: "./txt-test"
  - file: null-test.c
    source: avahi-0.9-rc5/avahi-compat-libdns_sd/null-test.c
    description: "DNSServiceRegister/Browse 空引用与非法 regtype 输入校验"
    command: "./null-test"

upstream_tests_exist: true
upstream_test_audit:
  - path: "avahi-compat-libdns_sd/Makefile.am"
    finding: "TESTS = txt-test null-test（ENABLE_TESTS 下构建），两个用例均为纯输入/编码测试，不依赖 avahi 守护进程即可在真机运行"
  - path: "avahi-common/Makefile.am, avahi-client/Makefile.am"
    finding: "其余子目录（avahi-core/daemon/utils 等）测试依赖运行中的 avahi-daemon 或系统组件，本配方仅构建 compat 层所需的 avahi-common/avahi-client 子目录，故只接入 avahi-compat-libdns_sd 自身的 2 个上游用例"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：TXTRecord* 编码 API + DNSServiceRegister 非法 regtype 校验（10 个真实断言）"
    command: "ctest --output-on-failure -R test_dns_sd"

assertion_count: 10
