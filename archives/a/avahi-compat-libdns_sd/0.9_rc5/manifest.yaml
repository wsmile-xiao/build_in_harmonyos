software: avahi-compat-libdns_sd
version: "0.9_rc5"
status: built
build_date: "2026-08-22"
conan_ref: "avahi-compat-libdns_sd/0.9_rc5"
build_system: autotools

source:
  url: "https://github.com/avahi/avahi/archive/refs/tags/v0.9-rc5.tar.gz"
  sha256: "5b0a9d88110b0fc8aaafc5cc0a26e83e7d2a4aca3a36bc27c9b626db7ead27b0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-distro=none"
    - "--enable-compat-libdns_sd"
    - "--enable-tests"
    - "--disable-glib --disable-gobject --disable-libevent"
    - "--disable-qt3 --disable-qt4 --disable-qt5"
    - "--disable-gtk --disable-gtk3 --disable-python --disable-mono"
    - "--disable-manpages --disable-xmltoman --disable-gdbm --disable-libdaemon"
  dependencies:
    - "dbus/1.14.10"
    - "expat/2.8.2.1 (override: dbus 传递的 expat/2.8.2 若解析到 conancenter 上游配方,其 tool_require cmake/4.4.2 在 OHOS 构建报 KeyError 'OHOS';override 到仓库独有已发布版本 2.8.2.1,自动落 ohpcd 适配配方)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GitHub tag 源码包不含预生成 configure，需 autogen.sh（autoreconf）引导，依赖 automake/libtool/gettext 工具"
  - "avahi-client 通过 D-Bus 与 avahi 守护进程通信，编译期需要 dbus 头文件与 dbus-1.pc"
  - "avahi-compat-libdns_sd 的 TESTS 只有 txt-test 与 null-test，均为纯输入/编码测试，无需运行中的 avahi-daemon"
  - "仅构建 avahi-common/avahi-client/avahi-compat-libdns_sd 三个子目录即可产出 libdns_sd，避免引入 libdaemon/expat 等守护进程依赖"
  - "gettextize 0.22.5 的 gettext_datadir 与 m4 宏源路径在 gettext 构建期硬编码为绝对路径，Conan 制品重定位后失效（*** Stop.）；通过 gettext_datadir 环境变量覆盖 + ACLOCAL_PATH 指向工具包 share/aclocal 修复"
