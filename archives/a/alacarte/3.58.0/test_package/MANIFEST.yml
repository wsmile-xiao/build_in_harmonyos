# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: alacarte/3.58.0
homepage: "https://gitlab.gnome.org/GNOME/alacarte"

# 上游无任何测试框架/测试用例（CI 仅跑 make distcheck，无 test/ 目录，
# 无 ctest/meson test/unitest 等）。故 upstream_tests 为空。
upstream_check_command: "make distcheck"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34 实质调用被测包)
test_package_tests:
  - file: test_alacarte.py
    description: "Python 级验证：语法编译 / mock-gi 加载被测包核心纯逻辑（唯一文件名、KeyFile 填充）/ 包结构断言"
    command: "python3 test_alacarte.py <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
