# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aiohttp/3.14.3
homepage: "https://github.com/aio-libs/aiohttp"

# 上游测试命令 — aiohttp 上游 pytest 套件（tests/ 81 个文件）
upstream_check_command: "python3 -m pytest tests/ -o addopts=""" ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-18 实测记录）：
# - tests/ 目录：81 个测试文件（client/web/server 等）
# - 实测：**核心子集 test_client_functional.py：289 passed / 13 skipped /
#   15 xfailed / 0 errors（17.59s）**——通过率 100%（tmp_path fixture
#   权限问题用 --basetemp 指定当前用户可写基目录解决——pytest-asyncio
#   在 OHOS 的 pytest-of-<uid> 临时目录 owner 异常环境限制，已规避）；
#   **完整套件（81 文件）运行超时**（OHOS 纯 Python 回退环境 >280s
#   中断在 ~95%）——**如实记录不臆造**；测试依赖（pytest/pytest-asyncio/
#   pytest-timeout/pytest-mock/freezegun）按"依赖可装则装"补齐
upstream_tests:
  - file: tests/
    source: aiohttp-3.14.3/tests/
    description: "上游 pytest 套件（81 文件；核心子集实测 289 passed/13 skipped/15 xfailed/0 errors（100%）——完整套件超时如实记录）"
    command: "python3 -m pytest tests/ -o addopts=""" " --basetemp=<可写目录>"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_aiohttp.py
    description: "消费者测试：真实 API（R34）——aiohttp.web 本地服务器 + ClientSession GET 请求（无需外网）"
    command: "python3 test_aiohttp.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
