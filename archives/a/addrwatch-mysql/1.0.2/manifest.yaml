software: addrwatch-mysql
version: "1.0.2"

# 编译状态
status: building
build_date: "2026-08-25"

# 源码信息
source:
  url: "https://github.com/fln/addrwatch/releases/download/v1.0.2/addrwatch-1.0.2.tar.gz"
  sha256: "f04e143da881cd63c299125b592cfb85e4812abbd146f419a1894c00f2ae6208"
  tar_format: tar.gz

# 构建配置
build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--enable-mysql"
  dependencies:
    - "mariadb-connector-c/3.4.8"
    - "libpcap/1.10.6"
    - "libevent/2.1.12"
    - "argp-standalone/1.5.0"
  cc: clang
  cxx: clang++

# 补丁信息 (复用 addrwatch 1.0.2 补丁，同源)
patches_applied:
  - file: "0001-Makefile.in.patch"
    description: "Update Makefile.in from automake 1.16.1 to 1.16.5 for OHOS compatibility"
    type: portability
  - file: "0002-aclocal.m4.patch"
    description: "Update aclocal.m4 from automake 1.16.1 to 1.16.5 for OHOS compatibility"
    type: portability
  - file: "0003-configure.patch"
    description: "Fix configure: umask 077→000 for HMDFS compatibility, make config.guess/config.sub optional (E007/E078)"
    type: portability
  - file: "0004-doc-Makefile.in.patch"
    description: "Update doc/Makefile.in from automake 1.16.1 to 1.16.5 for OHOS compatibility"
    type: portability
  - file: "0005-missing.patch"
    description: "Replace missing script with no-op to prevent autotools regeneration on OHOS"
    type: portability
  - file: "0006-src-Makefile.in.patch"
    description: "Update src/Makefile.in from automake 1.16.1 to 1.16.5 for OHOS compatibility"
    type: portability

# 知识沉淀
knowledge_gained:
  - "addrwatch-mysql 是 addrwatch 的 --enable-mysql 变体，产出独立二进制 addrwatch_mysql"
  - "mariadb-connector-c 提供 libmariadb 而非 libmysqlclient，需要创建符号链接兼容 AC_CHECK_LIB([mysqlclient])"
  - "addrwatch_mysql 源码 #include <mysql/mysql.h>，mariadb-connector-c 头文件在 include/mariadb/，需创建 include/mysql -> include/mariadb 符号链接"
  - "addrwatch_mysql 使用 argp 解析命令行参数，与 addrwatch 共享相同的 argp-standalone 依赖"
  - "所有 6 个 portability 补丁复用自 addrwatch 1.0.2（同源码版本）"
  - "R26: addrwatch_mysql 终端工具静态链接"

# 与 addrwatch 的关系
relation_to_addrwatch:
  description: "同一上游源码 v1.0.2，configure 加 --enable-mysql 额外编译 addrwatch_mysql 二进制"
  base_recipe: "archives/a/addrwatch/1.0.2/"
  extra_deps: "mariadb-connector-c/3.4.8"
  extra_configure: "--enable-mysql"
  extra_binaries: "bin/addrwatch_mysql"
