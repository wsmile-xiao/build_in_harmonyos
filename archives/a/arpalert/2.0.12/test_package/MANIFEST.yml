upstream_has_tests: false
upstream_test_framework: ""
upstream_test_files: []
upstream_test_command: ""
test_adaptation_notes: >
  arpalert does not ship with a test suite. The upstream Makefile has no 'check'
  target. This test_package runs the actual arpalert binary with the -h flag
  to verify it was compiled and linked correctly (R34: real dependency on
  the tested package, not a stub that only prints a string).
