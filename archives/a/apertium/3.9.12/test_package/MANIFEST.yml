package: apertium/3.9.12
homepage: "https://github.com/apertium/apertium"

# Upstream test suite runs inside the main recipe build() via `make check`
# (TESTS driven; tagger C++ check_PROGRAM always runs). The recipe detects
# shellcheck/zip/unzip/zipcmp at build time and overrides TESTS to the
# runnable subset when a tool is unavailable on OHOS; exclusions are
# recorded in the HMBS_UPSTREAM_TEST_RESULT marker reason + notes.md.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check TESTS='./run_tests.py deshtml-alt/run deslatex/run [sh/run] [odt/run]'"

upstream_tests:
  - file: tests/run_tests.py
    source: apertium-3.9.12/tests/
    description: "Python unittest driver over 8 modules (tagger, pretransfer, transfer, interchunk, postchunk, adaptdocx, cleanstream, capitalization)"
    command: "make check"
  - file: tests/deshtml-alt/run
    source: apertium-3.9.12/tests/deshtml-alt/
    description: "Shell test: apertium-deshtml-alt output diffed against expected stream markup"
    command: "make check"
  - file: tests/deslatex/run
    source: apertium-3.9.12/tests/deslatex/
    description: "Shell test: apertium-deslatex output diffed against expected stream markup"
    command: "make check"
  - file: tests/odt/run
    source: apertium-3.9.12/tests/odt/
    description: "Shell test: full ODT pipeline via apertium driver (needs zip/unzip/zipcmp); zipcmp compares out.odt vs expected.odt"
    command: "make check"
  - file: tests/sh/run
    source: apertium-3.9.12/tests/sh/
    description: "Shell test: shellcheck lint over driver scripts (needs shellcheck binary; skipped records honest reason when absent)"
    command: "make check"
  - file: tests/tagger/test_find_similar_ambiguity_classes.cc
    source: apertium-3.9.12/tests/tagger/
    description: "C++ check_PROGRAM exercising tagger ambiguity-class similarity"
    command: "make check"

test_package_tests:
  - file: test_apertium.sh
    description: "Consumer smoke test: 1) apertium -V version, 2) apertium-deshtml stream markup, 3) deshtml|rehtml round-trip"
    command: "bash test_apertium.sh <package bin>"

assertion_count: 3
