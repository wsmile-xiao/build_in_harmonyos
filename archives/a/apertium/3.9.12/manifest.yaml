version: "3.9.12"
software: apertium
status: built
build_date: "2026-09-12"
build_system: autotools

source:
  url: "https://github.com/apertium/apertium/releases/download/v3.9.12/apertium-3.9.12.tar.bz2"
  sha256: "34a1756d33e4d968bcf3ddbbf7f2315da88893ad7b7ad041d7595a2c4178b302"
  tar_format: tar.bz2

build:
  system: autotools
  configure_args:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-python-bindings"
  dependencies:
    - lttoolbox/3.7.6
    - libxml2/2.15.3.1
    - icu4c/77
    - utf8cpp/4.1.1
  build_tools:
    - flex/2.6.4
    - libxml2/2.15.3 (xmllint, pinned to match libxslt/1.1.45.2 pin)
    - libxslt/1.1.45.2 (xsltproc)
    - automake/1.18 (aclocal, E178: worker has autoconf only)
    - autoconf/2.72 (autoreconf)
    - libtool/2.5.4 (libtoolize for LT_INIT)

patches_applied: []

knowledge_gained:
  - "release tarball ships NO pre-generated configure (true-machine proof: autoreconf branch taken); provide automake/autoconf/libtool via tool_requires (E178 pattern)"
  - "configure hard-requires flex/xmllint/xsltproc via AC_PATH_PROG; provide via tool_requires"
  - "apertium driver aborts without UTF-8 locale; OHOS minimal rootfs needs locale-tolerance fix"
  - "upstream make check: run_tests.py (8 python modules) + 4 shell runs + tagger C++ check_PROGRAM"
  - "sh/run needs shellcheck, odt/run needs zip/unzip/zipcmp; build() gates TESTS on tool detection"
