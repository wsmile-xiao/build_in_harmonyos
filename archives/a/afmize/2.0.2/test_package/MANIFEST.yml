schema_version: 1
package: afmize
version: 2.0.2
homepage: https://github.com/ToruNiina/afmize
upstream_test_in_build: true
upstream_tests:
  - file: test/test_collision.cpp
    description: collision geometry
    command: test_collision
  - file: test/test_read_as_angstrom.cpp
    description: unit conversion
    command: test_read_as_angstrom
  - file: test/test_aabb.cpp
    description: axis-aligned bounding box
    command: test_aabb
test_package_tests:
  - file: conanfile.py
    description: run afmize against a PDB fixture and verify generated files
    command: afmize config.toml
assertion_count: 3
build_files:
  - conanfile.py
  - test.sh
  - config.toml
  - tiny.pdb
outputs:
  - afmize-test.ppm
  - afmize-test.tsv
  - afmize-test.json
require_nonempty: true
