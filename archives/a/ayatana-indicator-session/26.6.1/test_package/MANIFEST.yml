# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试来源: tests/CMakeLists.txt
#   - add_test(test-service test-service) -> tests/test-service.cc
#     （GTest + GTestDBusFixture，需 D-Bus 会话与 GSettings schema 后端）
# 本配方 ENABLE_TESTS=OFF：OHOS 无 GTest/D-Bus 会话，上游测试不在 conan create 中
# 运行（MANIFEST 如实声明）。

package: ayatana-indicator-session/26.6.1
homepage: "https://github.com/AyatanaIndicators/ayatana-indicator-session"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test-service.cc
    source: ayatana-indicator-session-26.6.1/tests/test-service.cc
    description: "GTest 单元/集成测试：indicator_session_service_new 初始化、bus 名获取、action 组注册（需 D-Bus 会话与 GSettings schema）"
    command: "./test-service"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: smoke.sh
    description: "消费者冒烟：运行打包的可执行文件 ayatana-indicator-session-service --version（断言输出 ayatana-indicator-session 26.6.1）与 --help（断言 Usage）"
    command: "bash smoke.sh <bin>/ayatana-indicator-session-service"

# 测试断言总数 (近似值, 用于质量评估)
# test_package 断言: --version 输出匹配 1 + --help Usage 匹配 1 = 2
# 上游 test-service 未运行（OHOS 无 GTest/D-Bus），不计入。
assertion_count: 2
