package: acpica-unix/20260408
homepage: "https://github.com/acpica/acpica"

upstream_check_command: "iasl -T DSDT && iasl dsdt.asl"
upstream_test_in_build: true
upstream_test_command: "iasl -T DSDT && iasl dsdt.asl"

upstream_tests:
  - file: tests/templates/templates.sh
    source: acpica-unix-20260408/tests/templates/templates.sh
    description: "Generates and compiles ACPICA table templates; recipe runs the DSDT subset"
    command: "iasl -T DSDT && iasl dsdt.asl"

test_package_tests:
  - file: test_iasl.sh
    description: "Compiles, disassembles, inspects, and recompiles a minimal ACPI table"
    command: "sh test_iasl.sh <package>/bin/iasl"

assertion_count: 5
