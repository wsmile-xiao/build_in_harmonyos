software: astap
display: "ASTAP Astrometric Stacking Program"
description: "Command-line astrometric plate solver"
category: astronomy
homepage: "https://www.hnsky.org/astap.htm"
license: MPL-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "Builds the upstream Object Pascal CLI with the official static AArch64 FPC 3.2.2 distribution"
    - "Signs FPC build tools and the packaged ELF for HarmonyOS execution"
    - "Packages the command-line solver only; GUI and external star databases are intentionally excluded"
    - "Synchronizes the stale upstream CLI version constant with release tag v2026.07.16"
  common_dependencies: []

versions:
  "2026.07.16":
    status: built
    build_date: "2026-08-23"
    conan_ref: "astap/2026.07.16"
