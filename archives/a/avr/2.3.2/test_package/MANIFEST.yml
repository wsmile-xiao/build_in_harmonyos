package: avr/2.3.2
homepage: "https://github.com/avrdudes/avr-libc"

upstream_check_command: "cd tests/simulate && ./run-avrtest.sh"
upstream_test_in_build: true
upstream_test_command: "cd tests/simulate && MCU_LIST=at90s8515 MCU_LIST_FULL=at90s8515 ./runtest.sh -c -a <build-dir> time/*.c regression/*.c stdlib/*.c string/*.c pmstring/*.c printf/*.c scanf/*.c fplib/*.c math/*.c other/*.c avr/*.[cS] util/*.c pgmread/*.c pgmread-near/*.c pgmread-far/*.c"

upstream_tests:
  - file: tests/simulate
    source: avr-libc-2.3.2/tests/simulate
    source_count: 467
    description: "Compile/link the proven C and assembly test categories supported by the bootstrap C toolchain"
    result: "Pending true-device run; expected scope follows the proven avr-libc 2.2.1 flow"
    command: "MCU_LIST=at90s8515 MCU_LIST_FULL=at90s8515 ./runtest.sh -c -a <build-dir> <467 C/assembly sources>"

test_package_tests:
  - file: test_avr.c
    description: "Compile/link ATmega328P ELF with packaged CRT/libc/libm and verify AVR architecture plus memcpy=T, strlen=T and sin=W"
    command: "avr-gcc -mmcu=atmega328p ... && avr-objdump -f test_avr.elf && avr-nm -g test_avr.elf"

assertion_count: 11
