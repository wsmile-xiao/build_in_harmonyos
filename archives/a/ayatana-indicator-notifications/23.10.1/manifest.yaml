# 版本级 manifest
# 文件位置: archives/{letter}/{name}/23.10.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "23.10.1"

# 软件名
software: "ayatana-indicator-notifications"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/AyatanaIndicators/ayatana-indicator-notifications/archive/refs/tags/23.10.1.tar.gz"

  # 源码校验和
  sha256: "7afd83b8669548075466d5514894789af8ceb661279a91326e0c5397ba61a6db"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DSKIP_PO=ON"
  - "-DGSETTINGS_LOCALINSTALL=ON"
  - "-DENABLE_WERROR=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - glib/2.88.0.1
  - libayatana-common/0.9.13
  - cmake-extras/1.9

  # 构建工具依赖（tool_requires，注入构建机 PATH/CMAKE_PROGRAM_PATH）
  tool_dependencies:
  - gettext/0.22.5.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-CMakeLists.txt.patch"
- "0002-data-CMakeLists.txt.patch"
- "0003-src-main.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "Ayatana CMake 项目：PkgConfigDeps 生成 .pc 后需从 glib 包目录合成 gio-unix-2.0.pc，并给 glib-2.0.pc 追加 -lintl（proxy-libintl 符号）"
- "OHOS 无 intltool → SKIP_PO=ON 跳过 po/ 子目录"
- "data/CMakeLists.txt 的 XDG_AUTOSTART_DIR 绝对路径 /etc/xdg/autostart 需改为 ${CMAKE_INSTALL_PREFIX}/etc/xdg/autostart"
- "D-Bus session service 在 OHOS 无 session bus，main.c 加 --version/--help 便于 smoke test"
