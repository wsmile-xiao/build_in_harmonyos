# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ayatana-indicator-notifications/23.10.1
homepage: "https://github.com/AyatanaIndicators/ayatana-indicator-notifications"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游源码无 tests/ 目录，无 ctest 注册；服务是 D-Bus session service，
# OHOS PC 无 session bus，功能覆盖由 test_package 的 smoke test 承担。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (上游无独立测试套件，仅作声明)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 真实调用被测包二进制 (ayatana-indicator-notifications-service)
test_package_tests:
  - file: conanfile.py
    description: "self.run() 定位并运行包内服务二进制 --version/--help，校验输出含 23.10.1"
    command: "conan create 时自动执行 (conanrun 环境)"
  - file: test.sh
    description: "冒烟脚本：执行服务二进制 --version（断言含 23.10.1）与 --help"
    command: "sh test.sh <service-binary>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
