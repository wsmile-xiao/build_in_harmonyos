# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS libc++ (clang 15.0.4) 缺少 C++20 std::ranges 算法（含 binary_search/lower_bound 投影重载），需要 polyfill"
  - "CMake 不识别 OHOS 平台，需要显式 -lc++ -lpthread 链接 C++ 标准库"
  - "make -jN 在 OHOS HMDFS 上失败 (mkfifo Operation not permitted)，需用 -j1"
  - "WHATWG 默认端口（https:443）被归一化移除，get_port() 返回空串"

