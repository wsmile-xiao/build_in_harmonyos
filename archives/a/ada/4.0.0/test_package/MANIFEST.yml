# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ada/4.0.0
homepage: "https://github.com/ada-url/ada"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/basic_tests.cpp
    source: ada-4.0.0/tests/basic_tests.cpp
    description: "URL parse/serialize core gtest suite"
    command: "./basic_tests"
  - file: tests/wpt_url_tests.cpp
    source: ada-4.0.0/tests/wpt_url_tests.cpp
    description: "WPT URL data-driven tests"
    command: "./wpt_url_tests"
  - file: tests/wpt_urlpattern_tests.cpp
    source: ada-4.0.0/tests/wpt_urlpattern_tests.cpp
    description: "WPT URLPattern data-driven tests"
    command: "./wpt_urlpattern_tests"
  - file: tests/url_components.cpp
    source: ada-4.0.0/tests/url_components.cpp
    description: "URL components getter/setter tests"
    command: "./url_components"
  - file: tests/url_search_params.cpp
    source: ada-4.0.0/tests/url_search_params.cpp
    description: "URLSearchParams tests"
    command: "./url_search_params"
  - file: tests/max_input_length.cpp
    source: ada-4.0.0/tests/max_input_length.cpp
    description: "Max input length guard tests"
    command: "./max_input_length"
  - file: tests/from_file_tests.cpp
    source: ada-4.0.0/tests/from_file_tests.cpp
    description: "From-file parse tests"
    command: "./from_file_tests"
  - file: tests/ada_c.cpp
    source: ada-4.0.0/tests/ada_c.cpp
    description: "C API tests"
    command: "./ada_c"
  - file: tests/basic_fuzzer.cpp
    source: ada-4.0.0/tests/basic_fuzzer.cpp
    description: "Basic fuzzer harness (not an independent TEST_CASE)"
    command: "./basic_fuzzer"
  - file: tests/max_length_fuzzer.cpp
    source: ada-4.0.0/tests/max_length_fuzzer.cpp
    description: "Max-length fuzzer harness (not an independent TEST_CASE)"
    command: "./max_length_fuzzer"
  - file: tests/ohos_special_test.cpp
    source: ada-4.0.0/tests/ohos_special_test.cpp
    description: "HarmonyOS special test: ranges polyfill + URL parse (project-local, not upstream)"
    command: "./ohos_special_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试（调用 ada C API 解析 URL，验证 hostname/protocol 与非法输入拒绝）"
    command: "./test_ada"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 317