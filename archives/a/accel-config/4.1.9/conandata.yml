sources:
  url:
    - "https://codeload.github.com/intel/idxd-config/tar.gz/refs/tags/accel-config-v4.1.9"
    - "https://github.com/intel/idxd-config/archive/refs/tags/accel-config-v4.1.9.tar.gz"
  sha256: "abac58ac1ad6738f20d512c55787426915f7c2dd05ca9d9b3ccd196af235e0b9"
  filename: "accel-config-v4.1.9.tar.gz"

patches:
  - patch_file: "patches/0001-libaccfg-sysfs-root-inject.patch"
    patch_description: "Add ACCFG_SYSFS_ROOT env injection for sysfs root (default /sys) to libaccfg.c so read-only enumeration can be tested against a mock sysfs without touching real hardware"
    patch_type: "portability"
  - patch_file: "patches/0002-accel-config-sysfs-module-path.patch"
    patch_description: "Route /sys/module/idxd existence check in accel-config CLI through ACCFG_SYSFS_ROOT (default /sys) for device-free testing"
    patch_type: "portability"
  - patch_file: "patches/0003-git-version-sh-portable.patch"
    patch_description: "Replace bash-only git-version helper with a POSIX sh version so autogen.sh works on hosts without /bin/bash (HarmonyOS)"
    patch_type: "portability"
  - patch_file: "patches/0004-autogen-sh-use-cc.patch"
    patch_description: "Use ${CC:-gcc} in autogen.sh libdir() instead of hardcoded gcc, so the bootstrap script works on hosts (e.g. OHOS CI) where gcc is absent and the Conan toolchain CC/clang is provided"
    patch_type: "portability"
