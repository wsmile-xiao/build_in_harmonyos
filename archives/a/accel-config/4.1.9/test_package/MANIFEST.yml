# MANIFEST.yml — accel-config 4.1.9 test_package 声明
# 上游测试入口盘点（真实，未伪造）

upstream_tests:
  entries: 4
  list:
    - libaccfg                  # check_PROGRAMS/TESTS: 需真实 DSA 设备（含 immintrin.h x86 头）
    - dsa_user_test_runner.sh   # TESTS: 需真实 DSA + pasid_enabled=1 + kernel>=5.6
    - iaa_user_test_runner.sh   # TESTS: 需真实 IAA 硬件
    - dsa_config_test_runner.sh # TESTS: 会写真实设备配置（sysfs），禁止无硬件运行
  test_all_sh_cases: 16         # test_all.sh 参数化用例（全部需真实 DSA）
  hardware_unrunnable: 4        # 本机无 /sys/bus/dsa、/dev/dsa，如实记录，不伪造 passed

consumer_tests:
  test_consumer.c: 1            # 编译链接 + 只读 API 调用（accfg_new/get/set_log_priority/unref）
  assertions: 2                 # 1) accfg_new 成功 2) set_log_priority 生效
  read_only_entries:
    - "accel-config --help"     # 已证明无设备写操作
    - "accel-config --version"  # 输出 4.1.9

mock_sysfs_tests:
  ACCFG_SYSFS_ROOT: "<repo-external mock dir>"
  cases:
    - "枚举 dsa0 设备（devices_found=1）"
    - "空设备树返回 []"
    - "无 module 报 'idxd kernel module not loaded'"
  forbidden: "bind/unbind 成功模拟、真实 DMA 模拟"
