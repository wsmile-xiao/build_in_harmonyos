software: abpoa
# 版本级 manifest — abpoa 1.5.6
# 文件位置: archives/a/abpoa/1.5.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.6"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/yangao07/abPOA/releases/download/v1.5.6/abPOA-v1.5.6.tar.gz"

  # 源码获取方式
  # GitHub HTTPS 下载超时，通过 git clone --depth 1 --branch v1.5.6 获取后打包
  fetch_method: "git clone --depth 1 --branch v1.5.6 https://github.com/yangao07/abPOA.git"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: makefile
build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（abPOA 无 configure 脚本，通过 make PREFIX= 指定）
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"

  # 编译依赖列表
  dependencies:
    - "simde/header-only (git submodule: https://github.com/simd-everywhere/simde.git)"
    - "zlib/system"
    - "pthread/system"
    - "math/system (-lm)"

  # 编译器
  cc: clang
  cxx: clang++
  cc_version: "clang 15.0.4"
  arch: "aarch64"
  simd_flags: "-march=armv8-a+simd -D__AVX2__"
  extra_cflags: "-DUSE_SIMDE -DSIMDE_ENABLE_NATIVE_ALIASES"

  # 产物
  artifacts:
    - "bin/abpoa (ELF PIE, 211KB, 动态链接 musl)"
    - "lib/libabpoa.a (静态库, 264KB)"
    - "include/abpoa.h"
    - "include/simd_instruction.h"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "abPOA 使用纯 Makefile 构建系统，无 configure/install/check 目标，需手动 staging"
  - "SIMDE 是 git 子模块（header-only），--depth 1 clone 不会自动初始化，需手动 git clone"
  - "aarch64 平台 Makefile 自动选择 -march=armv8-a+simd -D__AVX2__，通过 SIMDE 实现 AVX2 可移植性"
  - "GitHub HTTPS 端口 443 在本平台 TCP 不可达（ICMP 可达），可通过 git clone 替代 release tar.gz 下载"
  - "G4 门禁检查 manifest 中 build_system: 字面量字段，init-build 默认生成 build.system: 嵌套格式不匹配"
  - "make -j2 在 HMDFS 上出现 mkfifo 警告（非致命），实际编译正常完成"
  - "15 项功能测试全部通过：共识序列、MSA、GFA图、FASTQ输入、局部比对、评分矩阵、多共识输出、库链接"
