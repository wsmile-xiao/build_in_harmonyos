# 软件级 manifest — abpoa
# 文件位置: archives/a/abpoa/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: abpoa
description: "adaptive Banded Partial Order Alignment — 快速多序列共识序列和多重序列比对工具"
category: bioinformatics
homepage: https://github.com/yangao07/abPOA
license: MIT

# 版本索引
versions:
  - version: "1.5.6"
    status: published
    build_date: "2026-06-18"
    build_system: makefile
    compiler: clang 15.0.4
    platform: aarch64-ohos
    configure_options:
      - "PREFIX=$DEFAULT_PREFIX"
    dependencies:
      - simde/header-only
      - zlib/system
      - pthread/system
    notes: |
      纯 Makefile 构建，无 configure/install/check 目标。
      SIMDE 子模块需手动 git clone 获取。
      零源码修改，15 项功能测试全部通过。
