# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: arpackpp/2.4.0
homepage: "https://github.com/m-reuter/arpackpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# arpackpp provides example programs as tests (ENABLE_TESTS option)
upstream_tests:
  - file: examples/product/sym/symreg.cc
    source: arpackpp-2.4.0/examples/product/sym/symreg.cc
    description: "Real symmetric standard eigenvalue problem (regular mode)"
    command: "./symreg"
  - file: examples/band/sym/bsymreg.cc
    source: arpackpp-2.4.0/examples/band/sym/bsymreg.cc
    description: "Real symmetric banded standard eigenvalue problem (regular mode)"
    command: "./bsymreg"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/test.cpp
    description: "Substantive test: solves a symmetric eigenvalue problem using ARPACK++ API"
    command: "./test_arpackpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
