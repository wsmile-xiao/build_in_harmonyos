version: "12.18.0"
software: "azure-storage-blobs-cpp"
status: built
build_date: "2026-08-25"
build_system: "cmake"

source:
  url: "https://github.com/Azure/azure-sdk-for-cpp/archive/refs/tags/azure-storage-blobs_12.18.0.tar.gz"
  sha256: "0f266f91cf00b79bb6c7c6f99e44942b43a7141db565556a4298f6ebe3a86fcc"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DAZ_ALL_LIBRARIES=OFF"
    - "-DWARNINGS_AS_ERRORS=OFF"
    - "-DCMAKE_CXX_STANDARD=17"
  dependencies:
    - azure-storage-common-cpp/12.14.0
    - azure-core-cpp/1.16.4
    - azure-identity-cpp/1.13.3
    - openssl/3.5.6
    - libcurl/8.5.0
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-modules-AzureTransportAdapters.cmake.patch"
  - "0002-sdk-storage-azure-storage-blobs-CMakeLists.txt.patch"

knowledge_gained:
  - "CMake 平台三分支检测: if(WIN32)/elseif(UNIX)/else() 不识别 HarmonyOS，需扩展为 elseif(UNIX OR CMAKE_SYSTEM_NAME STREQUAL \"HarmonyOS\")"
  - "Conan RUN 环境: test() 需用 env=\"conanrun\" 激活运行时库路径"
  - "CI L0d 门禁: test_package/conanfile.py 的 test() 必须含 self.run() 调用"
