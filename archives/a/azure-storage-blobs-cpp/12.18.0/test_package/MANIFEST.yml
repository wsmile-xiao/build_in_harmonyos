# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: azure-storage-blobs-cpp/12.18.0
homepage: "https://github.com/Azure/azure-sdk-for-cpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (azure-storage-blobs-cpp 上游测试需联网访问 Azure 服务，不纳入离线构建)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接 azure-storage-blobs 库并实例化 BlobClientOptions"
    command: "./test_azure-storage-blobs-cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
