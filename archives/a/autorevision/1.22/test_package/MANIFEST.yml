# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: autorevision/1.22
homepage: "https://github.com/Autorevision/autorevision"

# Upstream test command（如实申报：上游无测试套件）
upstream_check_command: "make test"

# Upstream test suite（规则 4 如实申报）：
# 上游 autorevision 1.22 无测试套件——tarball 无 tests/ 目录、Makefile
# 无测试目标（test/check）、全源码树无 test/check 相关文件（contribs/
# 仅为集成文件非测试——已逐项核实）——N=0，如实申报。
upstream_tests_total: 0
upstream_tests_passed: 0
upstream_tests_skipped_reason: "上游 autorevision 1.22 无测试套件（tarball 无 tests/、Makefile 无测试目标，已核实）"

# Upstream tests not run in build (none exist upstream; consumer-side test
# covers real execution of autorevision)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_autorevision.sh
    description: "Run autorevision -s VCS_TYPE to verify tool executes"

# Test assertion count
assertion_count: 1
