# algotutor 0.8.6 适配清单
# 纯 Perl 脚本程序（算法动画演示工具），无编译：主脚本 algotutor + utilalgo/basic.pl
# + 算法模块（BST/Graph/Heap/RBTree/Vector 等 *.pm）+ dp/graph/cgeom 数据目录。
# 依赖 perl-Tk（GUI，上游已适配 804.036 built）；CI worker 网络受限，源码文本
# 目录（src/，42 个文本文件）随 export_sources 提供（参照 lv 先例；不能用 tar.gz
# 二进制——gitcode PR diff 无法传输新增二进制补丁数据）。

version: "0.8.6"
status: built

source:
  url: "https://deb.debian.org/debian/pool/main/a/algotutor/algotutor_0.8.6.orig.tar.gz"
  sha256: "abcae18a50c964c522b7daf70710a7fe8f03bc61bfa84fada3c323490cde6d1c"
  tar_format: tar.gz
  bundled: "src/ 文本目录（42 个文件，CI worker 无法访问 people.ofset.org，配方内自包含；非 tar.gz 二进制）"

build:
  system: none
  notes: "纯 Perl 脚本，无编译；主脚本 BEGIN 块按 $0 所在目录 push @INC，脚本与全部 .pm/.pl/dp/graph/data 同放 package bin/（与上游 make dist 结构一致）"

patches_applied: []

test:
  upstream_cases: 12
  upstream_suite: "make test：rbt/graham/dom/heap/bst/rbt/sbs/prim/dijk/flwa/lcs/matc 12 个用例（algotutor -a <algo> [-d out.ps] data/*.gr）"
  runnable: 0
  runnable_note: "algotutor 主脚本无条件 MainWindow->new（Tk GUI）→ 需要 X11 display server；OHOS headless 构建环境无 X server，无法运行（与 perl-tk 804.036 适配 notes 同因，GUI toolkit 无法 headless 测试）"
  pass_rate: "0/12（GUI/X display 依赖，headless 环境无法运行）"
  consumer_test: "test_package 验证安装布局 + perl -c 语法检查不依赖 Tk 的算法模块（basic.pl/Graph.pm 等）+ data/*.gr 数据文件存在"

knowledge_gained:
  - "algotutor 是纯 Perl/Tk GUI 程序，脚本 BEGIN 块按 $0 目录 push @INC，主脚本与模块同目录即可 require 解析"
  - "上游 12 个测试全部调用主脚本（无条件 MainWindow->new），headless 环境无法运行（与 perl-tk 804.036 同因），如实记录 runnable=0"
  - "CI worker 无法访问 people.ofset.org，源码用文本 src/ 目录打进配方自包含（tar.gz 二进制会导致 gitcode PR diff missing binary patch data）"
