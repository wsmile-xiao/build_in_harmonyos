package: algotutor/0.8.6
homepage: "https://people.ofset.org/~ckhung/a/algotutor.en.html"

# algotutor 是纯 Perl/Tk GUI 脚本程序（算法动画演示），无编译：
# 主脚本 algotutor + utilalgo/basic.pl + 算法模块（BST/Graph/Heap/RBTree/Vector 等 *.pm）
# + dp/graph/cgeom/data 数据目录，同放 package bin/（脚本 BEGIN 块按 $0 目录 push @INC）。
# 依赖 perl-Tk（GUI，上游已适配 804.036 built）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游 make test 共 12 个用例（rbt/graham/dom/heap/bst/rbt/sbs/prim/dijk/flwa/lcs/matc），
# 全部调用 algotutor 主脚本，脚本无条件 MainWindow->new（Tk GUI）→ 需要 X11 display server；
# OHOS headless 构建环境无 X server，无法运行（与 perl-tk 804.036 适配 notes 同因）。
upstream_tests:
  - name: "make test (12 cases: rbt/graham/dom/heap/bst/rbt/sbs/prim/dijk/flwa/lcs/matc)"
    count: 12
    runnable: 0
    note: "全部用例调用 algotutor 主脚本（无条件 Tk MainWindow->new），需 X11 display server；OHOS headless 构建环境无 X server，无法运行（GUI toolkit headless 不可测，与 perl-tk 804.036 同因）"

test_package_tests:
  - file: test_package/conanfile.py
    description: "消费测试：bin/algotutor 及算法模块安装完整（dp/graph/cgeom/data）+ perl -c 语法检查不依赖 Tk 的算法模块（basic.pl/Graph.pm/BST.pm/Heap.pm/Vector2.pm/Configurable.pm）+ data/*.gr 数据文件存在"
    command: "conan test (install layout + perl -c syntax check)"

assertion_count: 6
