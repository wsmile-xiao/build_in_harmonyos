software: agensgraph
display: "AgensGraph"
description: "Multi-model graph database based on PostgreSQL"
category: database
homepage: "https://bitnine-oss.github.io/agensgraph/"
license: Apache-2.0
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "需要替换 config.guess 和 config.sub 以支持 OHOS (E072)"
    - "需要修改 configure 中的 umask 077 为 022 (E011)"
    - "HMDFS 不支持 mkfifo，需使用单线程编译 (make -j1)"
    - "HMDFS ustar 路径长度限制，使用 zip 格式打包预编译包"
  common_dependencies:
    - readline/8.2

# 版本索引
versions:
  "2.13.0":
    status: built
    build_date: "2026-06-03"