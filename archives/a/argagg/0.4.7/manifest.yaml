# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.4.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.7"

# 软件名
software: "argagg"

# 编译状态
# published | built | failed | archived
status: "built"

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-10"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/vietjtnguyen/argagg/archive/refs/tags/0.4.7.tar.gz"

  # 源码校验和
  sha256: "5e740b904128eb2716750c72f19d33da49d904d34f1734f7e9113e9943cf3f7c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DARGAGG_BUILD_DOCS=OFF"
    - "-DARGAGG_BUILD_EXAMPLES=ON"
    - "-DARGAGG_BUILD_TESTS=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMakeLists.txt uses cmake_minimum_required(VERSION 2.8), incompatible with CMake 4.x — needs CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "argagg is a header-only C++11 library (INTERFACE target), no .a/.so produced"
  - "Upstream tests use doctest framework (vendored doctest.h), all tests pass"
