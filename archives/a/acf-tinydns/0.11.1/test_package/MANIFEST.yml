package: acf-tinydns/0.11.1
homepage: "https://gitlab.alpinelinux.org/acf/acf-tinydns"

# 上游测试命令 — acf-tinydns 是纯 Lua 脚本包,无上游测试套件
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  acf-tinydns 是纯 Lua/LSP 脚本包,上游无 test/ 目录、无 Makefile check target、
  无 pytest/unittest 套件。验证方式: luac -p 对所有 tinydns*.lua 执行语法检查 +
  文件完整性检查 (controller/model/menu/roles/template) + 符号链接保留检查。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tinydns.sh
    description: "Smoke test: 验证 ACF app 模块文件安装完整 + Lua 语法正确 + 符号链接保留"
    command: "bash test_tinydns.sh <package-folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
