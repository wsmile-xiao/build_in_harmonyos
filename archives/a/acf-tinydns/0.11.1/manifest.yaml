package: acf-tinydns
version: "0.11.1"
homepage: "https://gitlab.alpinelinux.org/acf/acf-tinydns"
license: "GPL-2.0-only"
description: >-
  Alpine Configuration Framework (ACF) web-based administration interface
  for tinydns (djbdns). Pure Lua/LSP script package — no compilation.

conan:
  user: ohpcd
  channel: stable
  profile: ohos-aarch64

build_system: none
build_toolchain: not_applicable

patches_applied: []

dependencies:
  - acf-core/0.24.1
  - acf-lib-lua5.3/0.11.1

upstream_tests:
  - file: tinydns.lua
    source: acf-tinydns-v0.11.1/tinydns.lua
    description: "tinydns ACF app module (controller/model)"
    command: "luac -p tinydns.lua"

test_package:
  entry: test_package/conanfile.py
  test_type: explicit

knowledge_gained:
  - "acf-tinydns 是纯 Lua/LSP 脚本包,无编译,package_type=application"
  - "ACF app 模块安装到 share/acf/app/tinydns/,acf-core 框架自动发现"
  - "上游 Makefile 使用 cp -a tinydns* → appdir/tinydns,需保留符号链接"
  - "tinydns-editfile-html.lsp 是悬空符号链接 → ../filedetails-html.lsp (acf-core 提供)"
