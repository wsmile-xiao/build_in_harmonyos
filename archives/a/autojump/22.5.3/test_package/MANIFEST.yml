# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: autojump/22.5.3
homepage: "https://github.com/wting/autojump"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (autojump uses tox for testing)
upstream_tests:
  - file: tests/autojump_match_test.py
    source: autojump-22.5.3/tests/autojump_match_test.py
    description: "autojump match pattern unit tests"
    command: "python3 -m pytest tests/autojump_match_test.py"
  - file: tests/autojump_utils_test.py
    source: autojump-22.5.3/tests/autojump_utils_test.py
    description: "autojump utility function unit tests"
    command: "python3 -m pytest tests/autojump_utils_test.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 验证 autojump --version 可执行"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
