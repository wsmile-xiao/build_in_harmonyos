software: autojump
version: "22.5.3"
status: built
build_date: "2026-09-17"
build_system: python
conan_ref: autojump/22.5.3

source:
  url: "https://github.com/wting/autojump/archive/refs/tags/release-v22.5.3.tar.gz"
  sha256: "00daf3698e17ac3ac788d529877c03ee80c3790472a85d0ed063ac3a354c37b1"
  tar_format: tar.gz

build:
  system: python
  configure_options:
    - "python3 install.py -d $BUILD_FOLDER/staging -p usr/local --force"
  dependencies: []
  cc: N/A
  cxx: N/A

patches_applied:
  - "0001-bin-autojump.sh.patch"
  - "0002-bin-autojump-shebang.patch"

knowledge_gained:
  - "autojump is a pure Python/bash script project, no C compilation needed; ref: E120"
  - "install.py -d is DESTDIR, -p must be relative for os.path.join to work; ref: E120"
  - "autojump.sh hardcoded /usr/local must be replaced; conan uses AUTOJUMP_SHARE_DIR env var; ref: E165"
  - "Shebang #!/usr/bin/env python must be patched to python3 for OpenHarmony; ref: E165"
  - "No ELF signing needed for script projects; ref: E080"

conan:
  recipe: conanfile.py
  data: conandata.yml
  test_package: test_package/
  verified: true
  ci_passed: true
