software: autojump
display: "autojump"
description: "A cd command that learns - easily navigate directories from the command line"
category: shell-tool
homepage: "https://github.com/wting/autojump"
license: GPL-3.0-or-later
build_system: python

ohos_adaptation:
  key_points:
    - "纯 Python/bash 脚本项目，无 C 编译；install.py -p 必须用相对路径（os.path.join 行为）"
    - "install.py 会把 DESTDIR 绝对路径追加进 autojump.sh，配方需剥离该块（构建机路径不可带入包内）"
    - "shell 集成通过 AUTOJUMP_SHARE_DIR 环境变量（runenv_info 注入，消费端求值）"
    - "shebang #!/usr/bin/env python 需改为 python3"
  common_dependencies: []

versions:
  "22.5.3":
    status: built
    build_date: "2026-09-17"
    conan_ref: "autojump/22.5.3"
