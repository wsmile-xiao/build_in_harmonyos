patches:
  "0.12.4":
    - patch_file: "patches/0001-vfs-gcr-optional.patch"
      patch_description: "vfs.c 的 gcr 安全内存调用与 include 包进 HAVE_GCR 守卫（上游注释已声明 malloc fallback 语义，补丁仅使 gcr 可选化）"
      patch_type: "portability"
    - patch_file: "patches/0002-meson-gcr-feature.patch"
      patch_description: "meson.build 新增 gcr feature 选项（auto/disabled），禁用时跳过 gcr 依赖注入"
      patch_type: "portability"
    - patch_file: "patches/0003-data-i18n-conditional.patch"
      patch_description: "data/meson.build 桌面元数据 i18n.merge_file 挂 translations 选项（gettext ITS 规则宿主数据不全时失败，OHOS 无桌面集成）"
      patch_type: "portability"
    - patch_file: "patches/0004-meson-options.patch"
      patch_description: "meson_options.txt 注册 gcr/translations feature 选项"
      patch_type: "portability"
