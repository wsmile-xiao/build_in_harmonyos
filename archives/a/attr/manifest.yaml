software: attr
display: "attr"
description: "Extended attribute utilities (getfattr, setfattr, attr) for filesystem extended attributes"
category: system
homepage: "https://savannah.nongnu.org/projects/attr/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需要添加 HarmonyOS 识别 (E007/E072)"
    - "configure 中 umask 077 需修改为 022 (HMDFS UID 映射兼容)"
    - "系统同名库 (libattr)，按 R26 使用 --disable-shared 静态编译"
    - "make check 部分测试因 HarmonyOS xattr 支持不完整而失败 (平台限制)"
  common_dependencies: []

versions:
  "2.5.2":
    status: built
    build_date: "2026-06-29"
    conan_ref: "attr/2.5.2@ohpcd/stable"
