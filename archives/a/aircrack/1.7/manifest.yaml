version: "1.7"
status: built
build_date: "2026-08-20"
conan_ref: "aircrack/1.7"

source:
  url: "https://download.aircrack-ng.org/aircrack-ng-1.7.tar.gz"
  sha256: "05a704e3c8f7792a17315080a21214a4448fd2452c1b0dd5226a3a55f90b58c3"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-libnl"
  dependencies:
    - "openssl/3.5.6.1"
    - "zlib/1.3.1.1"
  build_dependencies:
    - "automake/1.18"
    - "libtool/2.5.4"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-lib-osdep-linux.c.patch"
  - "0002-lib-osdep-linux_tap.c.patch"

knowledge_gained:
  - "官方 release tarball 是 git 快照，不含 configure，需 autoreconf -fiv 生成（不能跑 autogen.sh：真机缺 libtoolize/aclocal/autoconf/autoheader/automake）"
  - "autotools 经 tool_requires('automake/1.18') + tool_requires('libtool/2.5.4') 提供，不硬编码路径"
  - "autoconf 生成的 configure 用 ./confXXXXXX + umask 077 建临时目录，在 HMDFS/只读 /tmp 上失败；替换为 ${TMPDIR:-/tmp} 并去掉 umask 077"
  - "config.guess/config.sub 需补 HarmonyOS 识别（aarch64-unknown-linux-ohos）"
  - "sockaddr_storage 与 linux/socket.h 重复定义，用 _UAPI_LINUX_SOCKET_H 守卫修复"
  - "OHOS 无 libnl，configure 需 --disable-libnl（AC_ARG_ENABLE 形式）"
  - "上游 make check：test/Makefile.inc 注册 30 个测试脚本，automake 输出 PASS/FAIL/SKIP 行，按真实计数输出 HMBS_UPSTREAM_TEST_RESULT"
  - "HMFS 平台无 chmod（install_shim=true, chmod=0）：install shim 拒绝 `install -c -m 644`（EX_USAGE 64）导致 install-man1 失败；package() 用配方内 install shim 覆盖 make 命令行 INSTALL/INSTALL_DATA，忽略模式位、文件走 cp、目录走 mkdir -p"
  - "libtool --mode=install 只把首参数当安装程序，仅当首词为 $SHELL 或字面 /bin/sh 时才支持 'sh <脚本>' 形式（ltmain.sh func_mode_install 特判）；裸 sh 会把 shim 路径与后续参数全当文件列表导致 `sh -c <dest>/lib/-c` 报 127，INSTALL 首词必须用 /bin/sh"
