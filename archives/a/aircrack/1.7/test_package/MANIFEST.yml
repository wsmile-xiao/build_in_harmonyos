# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: aircrack/1.7
homepage: https://www.aircrack-ng.org/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试程序（代表性用例）
upstream_tests:
  - file: test-aircrack-ng-0001.sh
    source: aircrack-ng-1.7/test/test-aircrack-ng-0001.sh
    description: "WPA2 EAPOL 握手破解（KEY FOUND! [ 12345678 ]）"
    command: "make check"
  - file: test-aircrack-ng-0019.sh
    source: aircrack-ng-1.7/test/test-aircrack-ng-0019.sh
    description: "MOM1.cap WEP 数据包破解（KEY FOUND! [ MOM12345 ]）"
    command: "make check"
  - file: test-airdecap-ng-0001.sh
    source: aircrack-ng-1.7/test/test-airdecap-ng-0001.sh
    description: "WEP 数据包解密"
    command: "make check"
  - file: test-hex_string_to_array.sh
    source: aircrack-ng-1.7/test/test-hex_string_to_array.sh
    description: "hex_string_to_array 单元测试"
    command: "make check"
  - file: test-alltools.sh
    source: aircrack-ng-1.7/test/test-alltools.sh
    description: "全部工具 --help 冒烟验证"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "WPA2 握手包真实破解（aircrack-ng -w password.lst -a 2 -e Harkonen -q wpa2.eapol.cap）"
    command: "sh test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 33
