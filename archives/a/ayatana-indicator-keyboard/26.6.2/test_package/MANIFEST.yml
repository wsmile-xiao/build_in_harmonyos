# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试审计结论：上游确无测试（upstream_tests_exist: false）。
# 审计证据（upstream_test_audit）：
#   1. 源码包顶层无 tests/ 目录（tar -tf 全量清单核对：仅 contrib/ data/
#      debian/ po/ src/ + 文档脚本，无 tests/ 或 test/ 目录）。
#   2. 顶层 CMakeLists.txt 无 enable_testing()/include(CTest)/add_test()/
#      add_subdirectory(tests) 接线；src/CMakeLists.txt 仅定义
#      ayatana-keyboard-x11 / ayatana-keyboard-lomiri / service 静态库 /
#      ayatana-indicator-keyboard-service 四个构建目标，无测试目标。
#   3. INSTALL.md 提及 gtest/gcovr/lcov 系陈旧文档残留（同族
#      ayatana-indicator-session 上游亦然），构建文件中无对应查找与使用。
#   4. data/CMakeLists.txt 仅做 install（systemd/autostart/icons/schema），
#      无测试逻辑。
# 因此 conanfile.py build() 不调用 cmake.test()（无测试可调），覆盖由下述
# test_package 消费者冒烟补全（assertion_count=2）。

package: ayatana-indicator-keyboard/26.6.2
homepage: "https://github.com/AyatanaIndicators/ayatana-indicator-keyboard"

# 上游确无测试：显式声明 + 审计证据（HMBS 真机门禁要求两者同时存在）
upstream_tests_exist: false
upstream_test_audit: "26.6.2 源码包无 tests/ 目录；顶层与 src/CMakeLists.txt 无 enable_testing/include(CTest)/add_test/add_subdirectory(tests)；INSTALL.md 的 gtest 提及为未接线的陈旧文档"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试，此表为空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: smoke.sh
    description: "消费者冒烟：运行打包的可执行文件 ayatana-indicator-keyboard-service --version（断言输出 ayatana-indicator-keyboard 26.6.2）与 --help（断言 Usage）"
    command: "sh smoke.sh <bin>/ayatana-indicator-keyboard-service"

# 测试断言总数 (近似值, 用于质量评估)
# test_package 断言: --version 输出匹配 1 + --help Usage 匹配 1 = 2
# 上游测试不存在，不计入。
assertion_count: 2
