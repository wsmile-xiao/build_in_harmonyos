# conandata.yml — ayatana-indicator-keyboard 26.6.2

sources:
  url:
    - "https://gh-proxy.com/https://github.com/AyatanaIndicators/ayatana-indicator-keyboard/archive/refs/tags/26.6.2.tar.gz"
    - "https://github.com/AyatanaIndicators/ayatana-indicator-keyboard/archive/refs/tags/26.6.2.tar.gz"
  sha256: "a2024775a238da875dcb875ab43f1a06768e69d3838654fa54d78c54b048f15f"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "0001 新增 SKIP_DATA_PO 选项并 guard add_subdirectory(data/po)（OHOS 无 GSettings/Intltool CMake 模块，同族 session 同款处理）"
    patch_type: "portability"
  - patch_file: "patches/0002-src-main.c.patch"
    patch_description: "0002 main() 增加 --version/--help 命令行选项（服务型守护进程标准 CLI；--version 输出 ayatana-indicator-keyboard 26.6.2，供 L2 冒烟/hicmd）"
    patch_type: "portability"
  - patch_file: "patches/0003-CMakeLists-disable-accountsservice.patch"
    patch_description: "0003 新增 ENABLE_ACCOUNTSSERVICE 选项（默认 ON）：OFF 时 pkg_check 去掉 accountsservice 并定义 DISABLE_ACCOUNTSSERVICE（OHOS 无 lightdm greeter/AccountsService，上游 Ubuntu 行为不变）"
    patch_type: "portability"
  - patch_file: "patches/0004-x11-disable-accountsservice.patch"
    patch_description: "0004 keyboard-x11.c 用 DISABLE_ACCOUNTSSERVICE 守卫 act/act.h 引用与 greeter 分支并显式补 gio/gio.h（上游 GDBus 符号靠 act.h 间接引入，裁掉后 SetLayout/keyboard_init 的 G_DBUS_CALL_FLAGS_NONE/G_BUS_TYPE_SESSION 不可见；gio-2.0 常在 SERVICE_DEPS 中）"
    patch_type: "portability"
  - patch_file: "patches/0005-lomiri-disable-accountsservice.patch"
    patch_description: "0005 keyboard-lomiri.c 用 DISABLE_ACCOUNTSSERVICE 守卫 act/act.h 引用与 greeter 分支并显式补 gio/gio.h（同 0004，非 greeter 硬件布局路径仍用 GDBus；gio-2.0 常在 SERVICE_DEPS 中）"
    patch_type: "portability"
  - patch_file: "patches/0006-getlayout-fallback.patch"
    patch_description: "0006 keyboard_GetLayout 在 lLayouts 查表 miss 时回退（language 取 lookupLanguage(sId)，description 取 sId），防 vendored-xkbregistry 无 xkeyboard-config XML 数据时 NULL 解引用崩溃；查表命中路径逐字不变"
    patch_type: "portability"
  - patch_file: "patches/0008-src-link-dirs.patch"
    patch_description: "0008 src/CMakeLists 前置 link_directories(SERVICE_DEPS/X11_DEPS_LIBRARY_DIRS)：上游仅在文件后部声明 SERVICE_DEPS 目录，两个后端 SHARED 建在声明之前，Ubuntu 默认 /usr/lib 下可链接，conan 包库需 -L 配合否则 ld 报 unable to find library；仅补库搜索路径，不改目标与链接库列表"
    patch_type: "portability"

