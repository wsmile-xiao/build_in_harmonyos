# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 avisynthplus 3.7.5 自带官方测试套件（tests/ 目录 + CI 脚本），
# 本次适配未迁移运行（依赖完整视频处理环境）；test_package 为 OHOS 适配
# 自研的 L1 验证。

package: avisynthplus/3.7.5
homepage: "http://avs-plus.net/"

# 上游官方测试：tests/ 目录 + GitHub Actions CI（跨平台脚本）
upstream_official_tests:
  - suite: "ci"
    count: 30
    kind: "unit"
    command: "ctest"

# 构建阶段执行的测试命令：上游 ctest（本次适配未运行）
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: "ctest"

# 适配补全测试（自研，非上游）：无（未迁移 ctest，消费者验证集中在
# test_package 的 L1 验证）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test.cpp
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：链接 libavisynth 并引用 AVISYNTH_INTERFACE_VERSION 宏，验证头文件/库可用；检查 libavisynth.so 存在"
    command: "./test_avisynthplus"

# 测试断言总数 (实际统计：2 项断言，全部为适配自研断言：
# test.cpp 编译链接成功并运行、libavisynth.so 存在)
assertion_count: 2
