# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: async_simple/1.4
homepage: "https://github.com/alibaba/async_simple"

# 上游测试命令 (ctest)
upstream_check_command: "ctest --output-on-failure -j2"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/CMakeLists.txt
    source: async_simple-1.4/test/CMakeLists.txt
    description: "async_simple test suite (5 tests: core, util, coro, executor, uthread)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/main.cpp
    description: "消费者测试: coroutine compute sum(1..100)=5050 via syncAwait"
    command: "./test_async_simple"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
