software: async_simple
build_system: cmake
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/alibaba/async_simple/archive/refs/tags/1.4.tar.gz"

  # 源码校验和
  sha256: "6188f7a5f4211754fee758dfebf73759b74ce78c208719b5cc37d5ab4775d550"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DASYNC_SIMPLE_ENABLE_TESTS=ON"
    - "-DASYNC_SIMPLE_ENABLE_ASAN=OFF"
    - "-DASYNC_SIMPLE_DISABLE_AIO=ON"
    - "-DASYNC_SIMPLE_BUILD_DEMO_EXAMPLE=OFF"
    - "-DASYNC_SIMPLE_BUILD_MODULES=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - pthread
    - googletest/1.15.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "async_simple是C++20异步框架，需要clang++编译（支持协程）"
    - "OHOS CMAKE_SYSTEM_NAME需设为Linux以启用uthread [E092]"
    - "CMakeLists.txt含-Werror需在CXX_FLAGS中覆盖为-Wno-error"
    - "libaio在OHOS不可用需ASYNC_SIMPLE_DISABLE_AIO=ON"
    - "async_simple tag格式不带v前缀：1.4而非v1.4"
    - "uthread组件检测仅支持Linux/Darwin [E052-draft]"
    - "C++20协程库CMake编译器特性检测需显式设置标准 [E096]"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
