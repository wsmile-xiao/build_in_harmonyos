package: atracdenc
version: "0.2.3"
homepage: "https://github.com/dcherednik/atracdenc"
license: LGPL-2.1-or-later
status: built
build_system: cmake
build_date: "2026-08-21"

source:
  url: "https://github.com/dcherednik/atracdenc/releases/download/0.2.3/atracdenc-0.2.3.tar.xz"
  sha256: "c2668c2cefb20722341f4a03370f4c7e8fe196c6b0e0c5ef7ab13fc5ffe6ae1a"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies:
    - libsndfile/1.2.2#cf6ded313ae8c9c830e5ec3d3a8ce497
    - gtest/1.17.0#ab1bc3bf51522490eef07a83c2dbd203
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-man-page-gzip.patch"

upstream_tests:
  command: "ctest --output-on-failure -V -j1"
  test_count: 80
  notes: "上游 gtest 套件：atracdenc_ut / at3plus_pqf_ut / at3plus_bitstream_ut / at3plus_gha_ut / at3plus_mdct_ut / bs_encode_ut，共 80 个 TEST 用例，在 build() 内于真机执行并输出 HMBS_UPSTREAM_TEST_RESULT。"

test_package:
  assertion_count: 2
  description: "atracdenc -h 帮助输出 + 生成 44100Hz WAV 编码为 ATRAC3 OMA 并校验产物非空"

knowledge_gained:
  - "E092: CMake 无 HarmonyOS 平台模块，需设 CMAKE_SYSTEM_NAME=Linux 触发上游 UNIX 分支（find_package(GTest) + test/ + ctest）"
  - "OHOS toybox gzip 仅支持短选项且可能缺失，man page 生成需 find_program(gzip) 保护并使用 -c"
  - "上游 release tarball 已包含 libgha 子模块内容，无需单独拉取"
  - "上游测试依赖 GTest::gtest_main，gtest/1.17.0 配方提供该 CMake target"
