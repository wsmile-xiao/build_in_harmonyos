# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: atracdenc/0.2.3
homepage: https://github.com/dcherednik/atracdenc

# 上游测试命令 — gtest 套件经 ctest 注册并执行
upstream_check_command: "ctest --output-on-failure -V -j1"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -V -j1"

# 上游 gtest 测试 (6 个可执行文件, 共 80 个 TEST 用例)
# 来源: src/ 下 *_ut.cpp 审计 (atrac3denc_ut 6, atracdenc_ut 2,
#   transient_detector_ut 1, util_ut 3, bitstream_ut 6, encode_ut 3,
#   mdct_ut 10, atrac_scale_ut 1, at3p_bitstream_ut 6, at3p_gha_ut 28,
#   at3p_mdct_ut 5, ipqf_ut 9)
upstream_tests:
  - file: test/CMakeLists.txt
    source: atracdenc-0.2.3/test/CMakeLists.txt
    description: "atracdenc_ut — MDCT/bitstream/util/编码核心单元测试 (29 用例)"
    command: "./atracdenc_ut"
  - file: src/atrac/atrac3plus_pqf/ut/ipqf_ut.cpp
    source: atracdenc-0.2.3/src/atrac/atrac3plus_pqf/ut/ipqf_ut.cpp
    description: "at3plus_pqf_ut — ATRAC3PLUS PQF 测试 (9 用例, 依赖 tarball 内 test_data)"
    command: "./at3plus_pqf_ut"
  - file: src/atrac/at3p/at3p_bitstream_ut.cpp
    source: atracdenc-0.2.3/src/atrac/at3p/at3p_bitstream_ut.cpp
    description: "at3plus_bitstream_ut — ATRAC3PLUS 比特流测试 (6 用例)"
    command: "./at3plus_bitstream_ut"
  - file: src/atrac/at3p/at3p_gha_ut.cpp
    source: atracdenc-0.2.3/src/atrac/at3p/at3p_gha_ut.cpp
    description: "at3plus_gha_ut — GHA 频谱处理测试 (28 用例)"
    command: "./at3plus_gha_ut"
  - file: src/atrac/at3p/at3p_mdct_ut.cpp
    source: atracdenc-0.2.3/src/atrac/at3p/at3p_mdct_ut.cpp
    description: "at3plus_mdct_ut — ATRAC3PLUS MDCT 测试 (5 用例)"
    command: "./at3plus_mdct_ut"
  - file: src/lib/bs_encode/encode_ut.cpp
    source: atracdenc-0.2.3/src/lib/bs_encode/encode_ut.cpp
    description: "bs_encode_ut — 比特流编码测试 (3 用例)"
    command: "./bs_encode_ut"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "atracdenc -h 帮助退出码 + 生成 44100Hz WAV 编码 ATRAC3 OMA 并校验产物非空"
    command: "bash test.sh"

# 测试断言总数 (上游 80 个 TEST 用例 + test_package 2 项)
assertion_count: 82
