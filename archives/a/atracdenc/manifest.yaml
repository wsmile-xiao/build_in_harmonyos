software: atracdenc
display: "atracdenc"
description: "ATRAC1/ATRAC3/ATRAC3PLUS 兼容音频编码命令行工具"
category: audio
homepage: "https://github.com/dcherednik/atracdenc"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 无 HarmonyOS 平台模块（E092），generate() 需设 CMAKE_SYSTEM_NAME=Linux 触发上游 UNIX 分支（test/ + ctest）"
    - "上游 gtest 测试套件（6 个可执行文件、80 个 TEST 用例）在 build() 内通过 ctest 执行并输出 HMBS_UPSTREAM_TEST_RESULT"
    - "man page 生成依赖 gzip；OHOS 的 toybox gzip 仅支持短选项，已补丁改为 find_program + -c 且可跳过"
  common_dependencies:
    - libsndfile

versions:
  "0.2.3":
    status: built
    build_date: "2026-08-21"
    conan_ref: "atracdenc/0.2.3"
