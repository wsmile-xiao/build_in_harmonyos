# test_package/MANIFEST.yml — accel-ppp 1.14.0 上游测试声明

package: accel-ppp/1.14.0
homepage: "https://accel-ppp.io/"

# 上游测试来自 tag 1.14.0/tests，共 17 个 pytest 用例。
# 已在当前 OHOS 环境安装 pytest 9.1.1 并实际执行（模块链接修复后）：
# 7 通过、2 失败、1 跳过、7 环境错误。
upstream_check_command: "python3 -m pytest -q tests --accel_pppd <path> --accel_cmd <path>"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest -q tests --accel_pppd <path> --accel_cmd <path> --pppd <path> --dhclient <path>"

upstream_tests:
  total: 17
  collected: 17
  executed: 17
  passed: 7
  failed: 2
  skipped: 1
  errors: 7
  passed_cases:
    - "test_accel_cmd_version"
    - "test_accel_cmd_non_existent_host"
    - "test_accel_cmd_mcast_host"
    - "test_accel_cmd_commands"
    - "test_accel_pppd_version"
    - "test_load_all_modules (模块链接修复后通过：triton/connlimit/openssl/radius 显式 DT_NEEDED)"
    - "test_pcre_negative_cases (同上)"
  skipped_cases:
    - "test_pppoe_pado_delay (环境缺 pppoe-discovery -a/-t，上游自行 skip)"
  failed_cases:
    - "test_vlan_mon_kernel_module_loaded: /sys/module/vlan_mon 不存在（OHOS 内核无该模块）"
    - "test_ipoe_kernel_module_loaded: /sys/module/ipoe 不存在（OHOS 内核无该模块）"
  blocked_errors:
    - "test_pppoe_discovery / test_pppoe_vlan_mon: FileNotFoundError 'ip'（OHOS 无 ip 命令）"
    - "test_pppoe_session_wo_auth / test_pppoe_session_chap_secrets: 缺 pppd 客户端与特权网络（veth/netns/CAP_NET_ADMIN）"
    - "test_ipoe_shared_session_wo_auth / test_ipoe_shared_session_chap_secrets / test_ipoe_shared_session_lua_chap_secrets: 缺 dhclient、IPoE 内核模块与特权网络"
  blocked_categories:
    - category: "OHOS 内核缺失"
      cases: "test_vlan_mon_kernel_module_loaded, test_ipoe_kernel_module_loaded"
      evidence: "/sys/module/vlan_mon、/sys/module/ipoe 均不存在，无法通过用户态修复"
    - category: "特权网络/工具缺失"
      cases: "test_pppoe_discovery, test_pppoe_vlan_mon, test_pppoe_session_wo_auth, test_pppoe_session_chap_secrets, test_ipoe_shared_session_wo_auth, test_ipoe_shared_session_chap_secrets, test_ipoe_shared_session_lua_chap_secrets"
      evidence: "无 ip/pppd/dhclient/pppoe-discovery，无 root/CAP_NET_ADMIN，无 veth/netns，无 PPPoE 对端"

test_package_tests:
  - file: smoke_test.py
    description: "消费者等效测试（固化上游可运行的 7 个用例逻辑 + 全模块加载完整性）：accel-pppd/accel-cmd --version、错误主机/组播失败、空模块配置启动 accel-pppd 并经 CLI 查询 show stat/help、缺失配置失败关闭、全模块配置启动 0 加载失败（内核模块用例的用户态等效）"
    command: "python3 smoke_test.py <package>/bin/accel-pppd <package>/bin/accel-cmd"

assertion_count: 10

