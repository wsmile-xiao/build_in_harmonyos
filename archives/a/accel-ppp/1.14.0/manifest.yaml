  - "E330: accel-ppp PPP 服务端依赖 /dev/ppp + PPPIOC ioctls 与 Linux netlink/raw packet，公开 OHOS 应用 SDK 无等价能力；官方替代为 VPN Extension（vpn-tun fd），适配走客户端重构"
