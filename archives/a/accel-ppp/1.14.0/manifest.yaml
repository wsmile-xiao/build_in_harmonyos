    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_PPTP_DRIVER=OFF"
    - "-DBUILD_IPOE_DRIVER=OFF"
    - "-DBUILD_VLAN_MON_DRIVER=OFF"
    - "-DLOG_PGSQL=OFF"
    - "-DSHAPER=OFF"
    - "-DRADIUS=OFF"
    - "-DNETSNMP=OFF"
    - "-DLUA=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
