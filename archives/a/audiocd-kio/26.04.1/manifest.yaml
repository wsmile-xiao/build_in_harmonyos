  - "KCMUtils改为OPTIONAL，缺少kcmutils_generate_desktop_file命令导致kcmaudiocd模块被禁用"
  - "lame编码器不可用，需在plugins/CMakeLists.txt中注释禁用"
  - "Opus库不可用，需条件编译find_package(Opus)"
  - "DocTools的kdoctools_create_handbook不可用，需注释禁用doc子目录"
  - "kconfig_compiler_kf6签名后可用，kconfig_add_kcfg_files在flac/vorbis encoder中正常工作"
  - "cdparanoia使用stub库（dummy符号实现）替代真实cdparanoia"

