software: audiocd
version: "26.04.3"
status: built
package_type: library
build_system: cmake
created_at: 2026-09-15
build_date: 2026-09-15
language: cpp
description: "KDE audio CD ripping stack - audiocdplugins encoder library with wav/flac/vorbis/lame/opus encoder plugins (KIO worker and KCM module trimmed on OHOS)"
homepage: https://invent.kde.org/multimedia/audiocd
upstream_source: https://download.kde.org/stable/release-service/26.04.3/src/audiocd-kio-26.04.3.tar.xz
source_sha256: ba8a6f27311ca14f8d1e1c2135fa925e1075c43c6463ea2f641b1af3de670430
license: "GPL-2.0-or-later AND GFDL-1.2-or-later"

dependencies:
  required:
    - qtbase/6.11.1
    - kconfig/6.26.0
    - kcoreaddons/6.26.0
    - ki18n/6.26.0
    - kwidgetsaddons/6.26.0
    - libkcddb/26.04.3
    - flac/1.5.0
    - libvorbis/1.3.7
    - lame/3.100
    - opus/1.5.2
  build:
    - ecm/6.26.0
  forced:
    - libogg/1.3.6 (override=True: flac/1.5.0 pins 1.3.5 while libvorbis/1.3.7 pins 1.3.6; stable C ABI)

patches_applied:
  - patches/0001-ohos-adaptation.patch

test_results:
  type: no_upstream_tests_consumer_verified
  upstream: "No upstream test suite: the 26.04.3 tarball contains no tests/, autotests/ or test/ directory and no add_test()/enable_testing() call in any CMakeLists.txt (grep -rn 'add_test|enable_testing' over the extracted sources returns nothing). Upstream QA for this module happens via KDE CI source builds."
  test_package: "passed: 35/35 assertions (ALL PASS) - AudioCDEncoder/AudioCDDataSink base interfaces, wav plugin create_audiocd_encoders symbol resolution via QLibrary (the findAllPlugins discovery mechanism), EncoderWav RIFF/WAVE header emission through the sink (magic, little-endian size fields), EncoderWav::size/type()/mimeType()/fileType(), EncoderCda raw frame pass-through read() == CD_FRAMESIZE_RAW, EncoderCda::size(1s) == 176400, FLAC encoder construction + FLAC__stream_encoder_new round trip, Vorbis encoder construction + vorbis_info_init round trip, Opus encoder construction, KCDDB::CDInfo fillSongInfo plumbing against the published libkcddb, CD-DA frame constants"
  package_id: "08149eb3890c4b1d2687a38b0ed16edb39e899dd"

platform_adaptations:
  - "KIO worker (audiocd.cpp) and KCM module (kcmaudiocd/) trimmed: KF6::KIO/KCMUtils/Solid unpublished on ohpcd; the worker's ripping core requires raw /dev/sr0-style optical device access (cdparanoia cdda_*) which does not exist on HarmonyOS PC"
  - "Delivered artifacts: audiocdplugins shared library + wav/flac/vorbis/lame/opus encoder plugins"
  - "Encoder plugin ABI keeps create_audiocd_encoders but the sink type changes from KIO::WorkerBase to a self-contained AudioCDDataSink abstract interface (only data() is ever called upstream)"
  - "KProcess -> QProcess port in lame/opus encoder wrappers (explicit program/argument lists, setProcessChannelMode)"
  - "cdparanoia dependency dropped: audiocdcdio.h provides the two fixed Red Book frame-size constants"
  - "KCDDB include form <KCDDB/CDInfo> -> <kcddb/CDInfo> (published package installs CamelCase forwarders under kcddb/)"
  - "HAVE_LIBVORBISENC2 pinned to 1: the upstream check_library_exists cross-link fails resolving transitive libogg, not because vorbis_bitrate_addblock is missing (nm -D verified in libvorbis 1.3.7)"
  - "Linker flags -Wl,-z,max-page-size=0x1000: default lld 0x10000 page size can place .dynsym/.dynstr into separate high-address RW LOAD segments which the OHOS musl loader refuses to mmap (dlopen 'Permission denied'); the 4K layout loads fine"
  - "No post-install patchelf sweep: OHOS patchelf --replace-needed rewrites program headers into the same rejected multi-RW-LOAD layout (4-LOAD 27KB -> 7-LOAD 198KB, dlopen fails); absolute-path DT_NEEDED entries kept instead (libkcddb 26.04.3 precedent)"
  - "Encoder plugins link against libaudiocdplugins via -L/-l so DT_NEEDED is a bare soname instead of the build-tree relative '../../bin/libaudiocdplugins.so'; add_dependencies preserves build order"
  - "Ogg::ogg imported target defined via find_package(Ogg CONFIG) before FindOggVorbis, with OGG_LIBRARY/OGG_INCLUDE_DIR restored after (OggConfig shadows the plain variables with the target name)"

known_issues:
  - "The kio_audiocd KIO worker and the kcmaudiocd settings module are not built on this platform (see platform_adaptations); consumers needing the audiocd:// virtual filesystem require a KIO-enabled stack"
  - "opus/lame encoder wrappers spawn the external opusenc/lame binaries at runtime (upstream design); the tools are looked up via QStandardPaths at runtime and the plugins degrade gracefully when absent"
