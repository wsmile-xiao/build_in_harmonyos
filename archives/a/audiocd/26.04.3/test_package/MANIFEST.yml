# test_package/MANIFEST.yml
# Upstream and consumer test declaration for audiocd/26.04.3.

package: audiocd/26.04.3
homepage: https://invent.kde.org/multimedia/audiocd

upstream_check_command: "grep -rc 'add_test' . || true"
upstream_test_in_build: false
upstream_test_command: "n/a - upstream registers no test suite (no tests/, autotests/ or add_test() in the 26.04.3 tarball)"

upstream_tests:
  - file: "(none)"
    source: audiocd-kio-26.04.3.tar.xz
    description: "No upstream test suite: the tarball contains no tests/, autotests/ or test/ directory and no add_test()/enable_testing() call in any CMakeLists.txt (verified by grep -rn 'add_test|enable_testing' over the extracted sources). Upstream quality assurance for this module happens via the KDE CI source builds."
    command: "n/a"

test_package_tests:
  - file: test_package/test_package.cpp
    description: "Consumer smoke: AudioCDEncoder/AudioCDDataSink base interfaces, EncoderWav RIFF/WAVE 44-byte header emission through the sink (RIFF/WAVE magic, wavSize and dataSize fields), EncoderWav::size()/type()/mimeType()/fileType(), EncoderCda raw frame pass-through read() == CD_FRAMESIZE_RAW with the audiocdcdio.h constants, KCDDB::CDInfo fillSongInfo plumbing against the published libkcddb, and create_audiocd_encoders symbol resolution on the installed libaudiocd_encoder_wav.so via QLibrary (the AudioCDEncoder::findAllPlugins discovery mechanism)."
    command: "conan create (test_package builds and runs test_package)"

assertion_count: 35
