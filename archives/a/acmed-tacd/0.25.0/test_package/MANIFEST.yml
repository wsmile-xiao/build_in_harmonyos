package: acmed-tacd/0.25.0
homepage: "https://github.com/breard-r/acmed"
upstream_check_command: "cargo test --release --workspace --lib --bins --no-default-features --features openssl_vendored"
upstream_test_in_build: true
upstream_test_command: "cargo test --release --workspace --lib --bins --no-default-features --features openssl_vendored"
upstream_tests:
  - file: .github/workflows/ci.yml
    source: acmed-0.25.0/.github/workflows/ci.yml
    description: "Upstream Rust workspace library and binary unit tests"
    command: "cargo test --release --workspace --lib --bins --no-default-features --features openssl_vendored"
test_package_tests:
  - file: test.sh
    description: "Verify tacd version and ACME CLI help output"
    command: "bash test.sh"
assertion_count: 3
