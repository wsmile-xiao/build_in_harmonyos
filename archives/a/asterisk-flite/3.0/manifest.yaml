software: asterisk-flite
version: "3.0"
status: built
build_date: "2026-08-25"
build_system: autotools
source:
  url: "https://github.com/zaf/Asterisk-Flite/archive/refs/tags/v3.0.tar.gz"
  sha256: "57f0a86716af6a6704de003b3779c44d55ac9747cb696430d88d3f93cd7e2399"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--build=x86_64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--prefix=<private prefix>（flite）"
    - "--with-pic（flite，静态库以 PIC 编译供 .so 链接）"
    - "--with-audio=none（flite，OHOS 无 ALSA/OSS）"
    - "--without-pjproject（Asterisk 头文件树 configure）"
    - "--with-pjproject-bundled=no"
  dependencies:
    required:
      - libedit/20240808   # Asterisk configure 硬依赖（pkg-config 探测）
      - libxml2/2.15.3.1   # menuselect 子 configure 硬依赖（仓库独有版本，规避 conancenter cmake/4.4.2 KeyError 'OHOS'）
      - ncurses/6.6        # libedit.pc Libs.private=-ltinfo
      - e2fsprogs/1.47.4   # libuuid（Asterisk configure 硬依赖 uuid_generate_random）
      - jansson/2.15.1.1   # Asterisk configure 硬依赖（>= 2.11）
      - sqlite3/3.49.1     # Asterisk configure 硬依赖（内部数据库）
  additional_sources:
    - name: asterisk-22.10.1   # Asterisk 头文件树（configure 生成 autoconfig.h 等派生头，不构建模块）
      url: "https://downloads.asterisk.org/pub/telephony/asterisk/asterisk-22.10.1.tar.gz"
      sha256: "0953564c44fa49827f3c9d70ca6e80db83828c9848440852c6be44c961855353"
    - name: flite-2.2          # 模块静态链接的 CMU Flite TTS 引擎（官方 GitHub v2.2 tag）
      url: "https://github.com/festvox/flite/archive/refs/tags/v2.2.tar.gz"
      sha256: "ab1555fe5adc3f99f1d4a1a0eb1596d329fd6d74f1464a0097c81f53c0cf9e5c"
patches_applied:
  - "0001-configure.patch"                              # BlocksRuntime 缺失时禁用 blocks 而非报错（OHOS clang）
  - "0002-include-asterisk-astmm.h.patch"               # ASTMM_LIBC 默认 IGNORE，astmm.h 不毒化 libc 分配器名
  - "0003-include-asterisk-utils.h.patch"               # RAII_VAR blocks 分支仅在 __BLOCKS__ 下启用
  - "0004-menuselect-config.guess.patch"                # menuselect config.guess 识别 HarmonyOS triplet
  - "0005-menuselect-config.sub.patch"                  # menuselect config.sub 识别 ohos-linux triplet
  - "0006-app-flite-drop-register-file.patch"           # 删除已废弃的 ASTERISK_REGISTER_FILE() 调用（现代 Asterisk 头文件已移除该宏；与上游 master 相同修复）
  - "0007-flite-config-sub-ohos-triplet.patch"          # flite 内置 config.sub(2011) 接受 linux-ohos 三元组
notes: >
  打包 app_flite.so（zaf/Asterisk-Flite v3.0 的 Flite TTS 拨号计划应用模块）。
  构建分三步：(1) 官方 asterisk-22.10.1 源码树打 OHOS 补丁后 configure，
  生成模块编译所需的派生头文件（autoconfig.h + buildopts.h/build.h/defaults.h，
  经 build_tools/make_*_h 生成器），不构建任何 Asterisk 模块；(2) 官方 festvox/flite
  v2.2 以 --with-pic --with-audio=none 配置、按上游链接需求裁剪 VOXES/LANGS/LEXES
  后 make，静态库与头文件注入私有 prefix；(3) app_flite.c 按上游 Makefile 的
  完整参数（含 -DAST_MODULE_SELF_SYM=__internal_app_flite_self 与
  -lflite_cmu_us_* 链接顺序）用 clang 直接编译并 -shared 链接，flite 五个声音
  引擎静态链入产物。构建在 build_folder/worktree 进行（HMDFS MAC 限制 E052/E060），
  configure 脚本 umask 077 改 022 并带重试。上游 Makefile 硬编码 gcc 且探测
  /etc/asterisk/asterisk.conf，无法在 OHOS 使用，故按其规则等价参数化执行。

patch_generation:
  method: manual-difflib + reuse-from-asterisk-srtp
  notes: >
    0001~0005 与 asterisk-srtp 22.10.1 同一源码包的补丁逐字节一致（本地 git apply
    --check 全部通过）；0006/0007 为本配方新增，difflib 生成并对原始源码验证应用。
