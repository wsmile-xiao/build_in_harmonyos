sources:
  # 上游官方 tag 归档：zaf/Asterisk-Flite v3.0（sha256 本机下载校验）
  "3.0":
    url:
      - "https://gh-proxy.com/https://github.com/zaf/Asterisk-Flite/archive/refs/tags/v3.0.tar.gz"
      - "https://github.com/zaf/Asterisk-Flite/archive/refs/tags/v3.0.tar.gz"
    sha256: "57f0a86716af6a6704de003b3779c44d55ac9747cb696430d88d3f93cd7e2399"

# app_flite.c 编译所需的 Asterisk 头文件树（与 asterisk-srtp / asterisk-speex
# 同一官方源码包；configure 生成 autoconfig.h 等派生头，不构建任何 Asterisk 模块）
asterisk_headers:
  url:
    - "https://downloads.asterisk.org/pub/telephony/asterisk/releases/asterisk-22.10.1.tar.gz"
    - "https://github.com/asterisk/asterisk/releases/download/22.10.1/asterisk-22.10.1.tar.gz"
    - "https://gh-proxy.com/https://github.com/asterisk/asterisk/releases/download/22.10.1/asterisk-22.10.1.tar.gz"
    - "https://downloads.asterisk.org/pub/telephony/asterisk/asterisk-22.10.1.tar.gz"
  sha256: "0953564c44fa49827f3c9d70ca6e80db83828c9848440852c6be44c961855353"

# 模块静态链接的 flite TTS 引擎（CMU 官方 GitHub 仓库 v2.2 tag，
# festvox.org 官方页面声明 "Latest source is available through github.com/festvox/flite"）
flite_lib:
  url:
    - "https://gh-proxy.com/https://github.com/festvox/flite/archive/refs/tags/v2.2.tar.gz"
    - "https://github.com/festvox/flite/archive/refs/tags/v2.2.tar.gz"
  sha256: "ab1555fe5adc3f99f1d4a1a0eb1596d329fd6d74f1464a0097c81f53c0cf9e5c"

patches:
  # 应用于主源码（Asterisk-Flite）根目录
  "3.0":
    - patch_file: "patches/0006-app-flite-drop-register-file.patch"
      patch_description: "Drop obsolete ASTERISK_REGISTER_FILE() call (macro removed in modern Asterisk; same fix as upstream master)"
      patch_type: "portability"

# 应用于 deps 内 asterisk-22.10.1 源码树的补丁（与 asterisk-srtp 22.10.1 同源码包完全一致的补丁集）
asterisk_patches:
  "3.0":
    - patch_file: "patches/0001-configure.patch"
      patch_description: "OHOS clang does not need BlocksRuntime; disable blocks instead of erroring"
      patch_type: "portability"
    - patch_file: "patches/0002-include-asterisk-astmm.h.patch"
      patch_description: "Default ASTMM_LIBC to ASTMM_IGNORE so astmm.h never poisons libc allocator names"
      patch_type: "portability"
    - patch_file: "patches/0003-include-asterisk-utils.h.patch"
      patch_description: "RAII_VAR blocks branch only under __BLOCKS__ (no blocks on OHOS)"
      patch_type: "portability"
    - patch_file: "patches/0004-menuselect-config.guess.patch"
      patch_description: "menuselect config.guess recognize HarmonyOS (aarch64-unknown-linux-ohos)"
      patch_type: "portability"
    - patch_file: "patches/0005-menuselect-config.sub.patch"
      patch_description: "menuselect config.sub recognize ohos-linux triplet"
      patch_type: "portability"

flite_patches:
  "3.0":
    - patch_file: "patches/0007-flite-config-sub-ohos-triplet.patch"
      patch_description: "flite bundled config.sub (2011) does not know the linux-ohos os name; accept the OHOS triplet"
      patch_type: "portability"
