# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: asterisk-flite/3
homepage: "https://github.com/zaf/Asterisk-Flite"

# 上游测试命令: 上游（zaf/Asterisk-Flite v3.0）不存在任何测试目标，
# 故无独立 check 命令可声明（审计见 upstream_test_audit）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件审计结论:
# asterisk-flite 3（zaf/Asterisk-Flite v3.0 tag，commit 2bdc757）源码包仅含
# app_flite.c、Makefile、flite.conf.sample、README、ChangeLog、authors、COPYING
# 七个文件：Makefile 仅定义 all/install/samples/clean 目标（无 check/TESTS/
# check_PROGRAMS），仓库无 tests/ 或 test* 目录，无任何测试框架配置
# （无 .github/workflows、无 CI 配置）；上游 GitHub 仓库亦未配置 Actions 测试。
# 结论：上游确实没有任何自动化测试，status=no_tests 如实上报。
# 模块的功能行为依赖 asterisk 进程内的 dialplan 调用与音频通道，
# 消费者视角验证由 test_package 对安装产物做实质检查覆盖。
upstream_tests_exist: false
upstream_test_audit:
  - path: "Makefile"
    finding: "上游 Makefile 仅包含 all / install / samples / clean 四个目标；grep 确认无 check、test、TESTS、check_PROGRAMS 等测试目标，make -n check 返回 'No rule to make target'。"
  - path: "app_flite.c"
    finding: "上游唯一功能源码（Asterisk 拨号计划应用模块）；上游未为其编写任何自动化测试。其编译正确性与产物完整性由本配方构建过程及 test_package 实质检查覆盖：ELF/aarch64 头校验、load_module/unload_module 模块入口符号校验、flite 引擎符号（flite_init/flite_text_to_wave/cst_wave_resample/cst_wave_save_raw_fd）静态链接校验、五个上游声音注册符号存在性校验。"
  - path: "仓库整体（v3.0 tag 归档 7 个文件）"
    finding: "无 tests/ 目录、无测试脚本、无 CI 配置（.github/workflows 等）、无 configure/meson 等可挂接测试的构建体系（上游为纯 Makefile 工程）。"

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: check_app_flite.py
    description: "对安装产物 app_flite.so 做实质检查（10 项断言）：ELF 魔数/ELF64/小端/aarch64(e_machine=183)/DT_NEEDED 含 libc.so/load_module+unload_module 已定义/flite 引擎符号静态链入/五个声音注册符号齐全/产物体积>1MB（证明声音数据已链入）；另附进程外 dlopen 预期失败的诚实说明"
    command: "python3 check_app_flite.py（由 test_package/conanfile.py test() 经 self.run 实际执行）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
