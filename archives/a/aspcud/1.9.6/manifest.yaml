patches_applied:
  - name: "0001-CMakeLists.txt.patch"
    type: "compatibility"
    description: "更新 CMake 最低版本要求 3.1 → 3.5"
    guard: "cmake_minimum_required(VERSION 3.5)"
  - name: "0002-app-CMakeLists.txt.patch"
    type: "platform"
    description: "链接 libc++ 以解决 HarmonyOS musl undefined symbol"
    guard: "target_link_libraries(... \"-lc++\")"
  - name: "0003-libcudf-tests-CMakeLists.txt.patch"
    type: "platform"
    description: "链接 libc++ 以解决 HarmonyOS musl undefined symbol"
    guard: "target_link_libraries(... \"-lc++\")"

