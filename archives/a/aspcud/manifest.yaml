# 软件级 manifest
# 文件位置: archives/a/aspcud/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: aspcud

# 软件描述
description: "ASP-based solver for package dependency problems"

# 软件主页
homepage: "https://potassco.org/aspcud/"

# ============================================================
# 版本索引
# ============================================================

# 可用版本列表
versions:
  - version: "1.9.6"
    status: published
    build_date: "2026-06-18"
    publish_date: "2026-06-18"
    note: "编译成功，所有质量门禁通过，运行时依赖已满足"

# ============================================================
# 依赖信息
# ============================================================

# 构建依赖
build_dependencies:
  - "boost >= 1.84.0"
  - "cmake >= 3.5"
  - "re2c >= 4.3.1"

# 运行时依赖
runtime_dependencies:
  - name: clingo
    version: ">=5.4.0"
    note: "provides gringo and clasp binaries"