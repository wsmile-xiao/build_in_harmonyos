# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: aube/1.32.0
homepage: "https://github.com/jdx/aube"

# 上游测试命令
upstream_check_command: "cargo test --workspace"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.sh
    source: aube-1.32.0/test_package/test.sh
    description: "Smoke test: verify aube binary runs and reports version/help"
    command: "bash test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 验证 aube --version 与 --help"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
