# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: asahi-scripts/20250713
homepage: "https://github.com/AsahiLinux/asahi-scripts"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# asahi-scripts is a pure shell-script project with no upstream test suite
upstream_check_command: "make -n check 2>&1 || echo 'no check target'"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# asahi-scripts has no formal test suite; scripts are validated by running them
upstream_tests:
  - file: asahi-diagnose
    source: asahi-scripts-20250713/asahi-diagnose
    description: "System diagnostic script — runs and produces diagnostic output"
    command: "./asahi-diagnose"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Runs asahi-diagnose and verifies output contains expected diagnostic markers"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
