# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "argbash 是纯 shell 脚本工具，使用 autom4te 从 m4 宏生成脚本"
  - "构建系统为自定义 Makefile（resources/Makefile），非传统 autotools configure/make"
  - "make bootstrap 使用 autom4te 生成 bin/argbash 脚本"
  - "OHOS 平台 chmod +x 不生效（E046, SELinux 限制），需通过 bash 调用脚本"
  - "OHOS 平台 chmod --reference 不被支持（影响 argbash-1to2，非关键功能）"
  - "make bootstrap 后 touch src/argbash.m4 导致 make 尝试重建 argbash，需避免"
