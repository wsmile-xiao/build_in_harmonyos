# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: argbash/2.11.0
homepage: "https://argbash.dev"

# 上游测试命令 (make check runs unit tests + regression tests)
upstream_check_command: "cd resources && make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (argbash regression tests)
upstream_tests:
  - file: basic.m4
    source: argbash-2.11.0/tests/regressiontests/basic.m4
    description: "Basic argument parsing regression test"
    command: "argbash basic.m4 -o basic.sh && basic.sh LOO"
  - file: check-arguments.m4
    source: argbash-2.11.0/tests/unittests/check-arguments.m4
    description: "Unit test for argument parsing macros"
    command: "autom4te -l m4sugar -I src check-arguments.m4"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Consumer test: run package argbash binary --version, generate script, verify output"
    command: "bash test.sh <package_bin_dir>"
  - file: conanfile.py
    description: "Consumer test: run test.sh against package argbash binary"
    command: "conan test test_package argbash/2.11.0"

# 测试断言总数
assertion_count: 5
