# 版本级 manifest — abuild-sudo 3.18.0_rc3
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "3.18.0_rc3"

# 软件名
software: "abuild-sudo"

# 编译状态
# published | built | failed | archived
status: pending

# 编译日期（YYYY-MM-DD）
build_date: ""
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitLab Alpine 源，与 APKBUILD 一致）
  url: "https://gitlab.alpinelinux.org/alpine/abuild/-/archive/3.18.0_rc3/abuild-3.18.0_rc3.tar.gz"

  # 源码校验和
  sha256: "cade1711e32323d77f385a07c2228affc862af186489bc9e2e3a6555aaea35f2"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表
  configure_options:
    - "make -j1 CC=<clang> CFLAGS=-O2 -Wall abuild-tar abuild-gzsplit abuild-sudo abuild-fetch"
    - "make abuild abuild-keygen abuild-sign newapkbuild abump apkgrel checkapk"
    - "make functions.sh && make abuild.conf"

  # 编译依赖列表（格式: name/version）
  # openssl/3.5.6 固定到 ohpcd 已发布的 OHOS 兼容 recipe revision
  # （748fc4de...，OHOS/armv8 预编译包 6b129b06...）；conancenter 的 CCI
  # recipe（rev 13f8f301...）validate() 拒绝 OHOS/armv8/clang，未固定会
  # 先命中 conancenter 导致 "Invalid configuration: Unsupported configuration"
  dependencies:
    - openssl/3.5.6#748fc4deb56588d6f8ce900b21e8eb0a
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-gzsplit-init-zstream.patch（abuild-gzsplit z_stream 初始化，修复真机 SIGSEGV 139）"
  - "patches/0003-abuild-tar-pax-header.patch（abuild-tar --hash 在纯 ustar 输入下合成合法 pax 'x' 头，修复 abuild_tar_hash）"
  - "注：0002-fetch-lock-race.patch（fetch 锁 1ms→200ms 竞态补丁）经真机两轮实测无效，已删除；abuild_fetch_locking 根因为平台 FIFO 限制（OHOS SELinux 禁止 mkfifo），用例移出执行集并审计（见 test_package/MANIFEST.yml）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "abuild-sudo 是 Alpine abuild 项目的 setuid 提权子包，单 C 文件（abuild-sudo.c），纯 Makefile 构建，产物本身仅依赖 libc"
  - "3.18.0_rc3 Makefile 无 abuild-rm 构建规则（USR_BIN_FILES 仅用于 install），abuild-rmtemp 已移除；测试套件不引用，跳过"
  - "上游测试套件 tests/（ATF/kyua 框架，10 个测试程序、111 个 *_body() 用例）依赖 kyua + atf-sh，OHOS 缺失；用 atf-shim.sh（abuild 3.17.0.1 同方案，真机已验证）直接运行全部 *_test 程序，注入 mock apk/fakeroot 与可写 TMPDIR"
  - "安装需创建 abuild-adduser/abuild-addgroup/abuild-apk 符号链接指向 abuild-sudo（程序按 argv[0] 分发子命令）"
  - "Makefile 默认 CFLAGS=-Wall -Werror -g -pedantic 对 clang 15 有 -Werror 硬失败风险，显式传 -O2 -Wall"
