# conandata.yml — abuild-sudo 3.18.0_rc3
# abuild-sudo 是 Alpine abuild（Alpine build tools）项目的 setuid 提权子包，
# 上游源码与 abuild 主项目同源（单一 tag 归档）。

sources:
  url: "https://gitlab.alpinelinux.org/alpine/abuild/-/archive/3.18.0_rc3/abuild-3.18.0_rc3.tar.gz"
  sha256: "cade1711e32323d77f385a07c2228affc862af186489bc9e2e3a6555aaea35f2"
  filename: "abuild-3.18.0_rc3.tar.gz"

patches:
  - patch_file: "patches/0001-gzsplit-init-zstream.patch"
    patch_description: "abuild-gzsplit: zero z_stream before inflateInit2 (uninitialized zalloc made zlib call a garbage allocator -> SIGSEGV on OHOS, upstream tests abuild_gzsplit_*_package exit 139)"
    patch_type: "bugfix"
  - patch_file: "patches/0003-abuild-tar-pax-header.patch"
    patch_description: "abuild-tar --hash: synthesize a proper pax 'x' extended header (typeflag 'x', name from the entry) when the input stream carried none.  Plain ustar input (toybox tar lacks --format=posix, which the mock tar filters) left paxhdr with typeflag 0 + empty name, read by tar as end-of-archive, so the APK-TOOLS.checksum header vanished and abuild_tar_hash produced an unreadable archive (upstream abuild_tar_hash failed: tar -tvf empty)"
    patch_type: "bugfix"
