# 软件级 manifest — abuild-sudo
# 遵循 ARCHIVE-SPEC v3.0

# 软件名称（小写，与目录名一致）
software: abuild-sudo

# 显示名
display: "abuild-sudo"

# 一句话描述
description: "Alpine abuild setuid 提权辅助工具：允许 abuild 组成员以受限方式执行 adduser/addgroup/apk"

# 分类标签
category: build-tool

# 官网 URL
homepage: "https://gitlab.alpinelinux.org/alpine/abuild/"

# 开源许可证（SPDX 标识）
license: GPL-2.0-only

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "abuild-sudo 是 Alpine abuild 项目的子包（abuild-sudo.c 单文件），纯 Makefile 构建，产物本身仅依赖 libc"
    - "构建上游测试套件所需的 C 工具需 openssl（abuild-tar）与 zlib（abuild-gzsplit），flags 从 conan 依赖获取绕过 pkg-config"
    - "安装时需创建 abuild-adduser/abuild-addgroup/abuild-apk 三个符号链接指向 abuild-sudo（程序按 argv[0] 分发子命令）"
    - "上游测试套件（tests/，ATF/kyua 框架，10 程序 111 用例）依赖 kyua + atf-sh，OHOS 缺失；用 atf-shim.sh（abuild 3.17.0.1 同方案，真机已验证）直接运行各 *_test 程序"
  common_dependencies:
    - openssl
    - zlib

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.18.0_rc3":
    status: pending
    build_date: ""
    requires_manual_verification: true
