software: adr-tools
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/npryce/adr-tools/archive/refs/tags/3.0.0.tar.gz"

  # 源码校验和
  sha256: "9490f31a457c253c4113313ed6352efcbf8f924970a309a08488833b9c325d7c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Shell 脚本项目: shebang #!/bin/bash 需改为 #!/usr/bin/env bash (OHOS 无 /bin/bash)"
  - "GNU coreutils cat 在 OHOS 上从 heredoc stdin 读取时返回非零退出码 (Broken pipe)"
  - "Makefile 硬编码 /tmp 在 OHOS 上只读，需改用 $TMPDIR"
