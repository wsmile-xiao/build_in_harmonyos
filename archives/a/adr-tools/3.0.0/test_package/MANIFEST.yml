# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: adr-tools/3.0.0
homepage: "https://github.com/npryce/adr-tools"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make BUILDDIR=$TMPDIR/adr-tools-build DEFAULT_PREFIX=$DEFAULT_PREFIX check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/alternative-adr-directory.sh
    source: adr-tools-3.0.0/tests/alternative-adr-directory.sh
    description: "Test adr init and adr new with alternative ADR directory"
    command: "make check (alternative-adr-directory)"
  - file: tests/create-first-record.sh
    source: adr-tools-3.0.0/tests/create-first-record.sh
    description: "Test creating the first ADR record"
    command: "make check (create-first-record)"
  - file: tests/generate-contents-with-header-and-footer.sh
    source: adr-tools-3.0.0/tests/generate-contents-with-header-and-footer.sh
    description: "Test generating table of contents with header and footer"
    command: "make check (generate-contents-with-header-and-footer)"
  - file: tests/supercede-existing-adr.sh
    source: adr-tools-3.0.0/tests/supercede-existing-adr.sh
    description: "Test superceding an existing ADR"
    command: "make check (supercede-existing-adr)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: adr help, adr init, adr new + 文件验证"
    command: "bash test.sh"
  - file: conanfile.py (inline Shell test)
    description: "消费者测试: adr help, adr init, adr new 功能验证 (env-aware)"
    command: "conan test (adr help + adr init + adr new + file verification)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 22
