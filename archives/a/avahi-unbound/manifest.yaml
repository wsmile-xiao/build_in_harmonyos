# 软件级 manifest — avahi-unbound
# 遵循 ARCHIVE-SPEC v2.0 / v3.0
software: avahi-unbound
display: "Avahi Unbound 集成配置"
description: "为 unbound DNS 解析器提供 avahi mDNS 集成配置文件，将 .local 区域查询转发至 avahi-daemon DNS 代理"
category: network
homepage: "https://github.com/avahi/avahi"
license: LGPL-2.1-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "纯配置包，无编译步骤，不产出二进制或库文件"
    - "配置文件内容源自 Alpine Linux aports 仓库（main/avahi/unbound.conf）"
    - "使用 avahi v0.9-rc5 源码 tarball 做版本一致性校验（与 avahi-compat-libdns_sd / avahi-glib 同源）"
    - "安装 etc/unbound/unbound.conf.d/avahi.conf，配置 unbound 将 .local 区域转发至 127.0.0.1:5354"
  common_dependencies:
    - unbound

versions:
  "0.9_rc5":
    status: published
    build_date: "2026-08-27"
    conan_ref: "avahi-unbound/0.9_rc5"
