# test_package/MANIFEST.yml — avahi-unbound 0.9_rc5
# 上游测试声明（CI L0e 强制要求）
package: avahi-unbound/0.9_rc5
homepage: "https://github.com/avahi/avahi"

# 上游测试命令
# avahi-unbound 是纯配置包（unbound 配置文件），avahi 源码树中无 avahi-unbound
# 子目录，配置文件内容由 Alpine Linux aports 仓库维护（main/avahi/unbound.conf）。
# 上游无针对此子包的测试用例。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 无上游测试（纯配置包）
upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "avahi source tree"
    finding: "avahi 源码树中无 avahi-unbound 子目录。avahi-unbound 是 Alpine Linux "
              "打包层面的子包，配置文件（unbound.conf）由 aports 仓库维护，不在 "
              "avahi 上游源码中。Alpine APKBUILD 的 check() 运行 make check 针对整个 "
              "avahi 项目（daemon/libs），不针对此配置子包。"
  - path: "Alpine aports main/avahi/APKBUILD"
    finding: "APKBUILD 的 unbound() 子包函数仅安装 etc/unbound/unbound.conf.d/avahi.conf "
              "一个文件，无测试逻辑。"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_avahi_unbound.sh
    description: "配置文件完整性验证：文件存在性 + forward-zone/name/forward-addr + "
                 "server/do-not-query-localhost/domain-insecure（7 个断言）"
    command: "test_avahi_unbound.sh"

assertion_count: 7
