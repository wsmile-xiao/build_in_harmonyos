package: alex4/1.1
homepage: "https://sourceforge.net/projects/allegator/"

# alex4 是 Allegro 4 图形游戏（Allegro gfx 模式，需 X/图形环境），
# OHOS headless 构建环境无图形后端，上游无自动化测试套件（make test 不存在）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试套件：alex4 1.1 上游仅提供源码（alex4src_data.zip），无 make test/ctest。
upstream_tests: []

test_package_tests:
  - file: test_alex4.sh
    description: "消费测试：bin/alex4 存在且为 ELF 可执行文件（od 读 magic 0x7f454c46）+ 数据文件（alex4.ini/data.dat/maps.dat）存在"
    command: "test_alex4.sh <bin dir> <share dir>"

assertion_count: 3
