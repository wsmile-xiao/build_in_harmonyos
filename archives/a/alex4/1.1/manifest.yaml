# alex4 1.1 适配清单
# Alex the Allegator 4：2003 年经典平台游戏（C 语言），无 Makefile（上游 readme
# 说明 "just compile all the source files"）。依赖 allegro4.4（已合入，
# ohpcd remote 4.4.3.1）+ DUMB（音频库，项目未适配 → 配方内自包含构建 dumb-0.9.3）。
# CI worker 网络受限（SourceForge 下载不稳定）→ 源码 zip + dumb 源码打进配方。

version: "1.1"
status: built

source:
  url: "https://downloads.sourceforge.net/project/allegator/Alex4/source%20and%20data/alex4src_data.zip"
  sha256: ""
  tar_format: zip
  bundled: "alex4src_data.zip + dumb-0.9.3.tar.gz（CI worker 无法稳定访问 SourceForge，配方内自包含）"

build:
  system: custom
  cc: clang
  configure_options: []
  notes: "无 Makefile，配方内 clang 编译全部 src/*.c；必须应用 extras/alex4_unix.diff.gz（DIGI_DIRECTX 仅 Windows，Unix 编译失败）；dumb 自包含构建 libdumb.a + libaldmb.a（aegean 自包含 genometools 先例）"

patches_applied:
  - "extras/alex4_unix.diff.gz（官方 Unix 补丁：音频驱动条件编译）"

test:
  upstream_cases: 0
  upstream_suite: "上游无测试套件（2003 年平台游戏，readme 仅编译说明，无 test 目标）"
  runnable: 0
  runnable_note: "游戏需显示/音频驱动（Allegro gfx 模式），OHOS headless 构建环境无法实跑"
  pass_rate: "0/0（上游无测试）"
  consumer_test: "test_package 验证 bin/alex4 存在 + ELF 类型 + 依赖库（liballeg/libaldmb/libdumb）可解析"

knowledge_gained:
  - "alex4 上游源码包无 Makefile，需配方内自写编译（clang 编译全部 src/*.c）"
  - "alex4 原代码音频驱动选择 case 2/3 用 DIGI_DIRECTX/DIGI_DIRECTAMX（仅 Windows 定义），Unix 编译失败，必须应用官方 extras/alex4_unix.diff.gz"
  - "alex4 硬依赖 DUMB（aldumb.h + libaldmb/libdumb），项目未适配 → 配方内自包含构建 dumb-0.9.3"
  - "游戏需显示驱动，headless 环境无法实跑，消费测试验证二进制与依赖解析"
