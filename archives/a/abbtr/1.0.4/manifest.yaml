software: abbtr
version: "1.0.4"
status: published
build_date: "2026-08-12"
build_system: go

source:
  url: "https://codeload.github.com/manuwarfare/abbtr/tar.gz/refs/tags/v1.0.4"
  sha256: "22746190c644070d2e3550d4b10c53c57a617febc2196e030cf7391adca9fe29"
  tar_format: tar.gz

build:
  system: go
  dependencies: []
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"

patches_applied: []

knowledge_gained:
  - "abbtr 为纯 Go CLI，源码仅使用 Go 标准库，无第三方 Go module 依赖"
  - "HarmonyOS PC 下使用 GOOS=linux、GOARCH=arm64、CGO_ENABLED=0 构建"
  - "Go 链接阶段避开 HMDFS，在可写本地文件系统完成链接后复制产物"
  - "HarmonyOS PC 上 Go SDK 和最终 ELF 需要使用 binary-sign-tool 签名"
  - "abbtr 在处理 -v/-h 前会检查 HOME/.local/bin，因此测试需预置 HOME 和 PATH 避免交互"
