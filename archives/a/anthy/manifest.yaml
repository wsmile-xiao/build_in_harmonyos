# 软件级 manifest
# 文件位置: archives/a/anthy/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: anthy

# 显示名
display: "Anthy Japanese Input Method"

# 一句话描述
description: "Hiragana text to Kana Kanji mixed text Japanese input method engine"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://osdn.net/projects/anthy/"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later AND LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "需要修改config.guess和config.sub添加HarmonyOS支持"
    - "需要修改configure中的umask 077为umask 022（E011）"
    - "使用旧版config.guess时需将GUESS=改为echo+exit"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.4":
    status: built
    build_date: 2026-06-18