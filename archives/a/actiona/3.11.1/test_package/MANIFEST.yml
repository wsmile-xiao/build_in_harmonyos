# 上游测试来源声明（CI L0e 门禁要求）
# actiona 是 X11 深度集成的可执行程序（Qt GUI 自动化），上游无正式测试框架；
# 鸿蒙 musl namespace 无法运行其 X11 依赖链——本 test_package 以链接验证
# （libactiontools.so）+ 产物完整性校验（bin/actiona + actiontools.so）代替运行测试。
package: actiona
version: 3.11.1
upstream: https://github.com/Jmgr/actiona
upstream_tests: 无正式测试框架（仅示例代码，依赖 Qt/X11 环境）
harmonyos_tests:
  - test_package/test.c: 链接 libactiontools.so 产物验证（CMake 构建）
  - test_package/conanfile.py: bin/actiona + lib/actiona/actiontools.so 存在性校验 + self.run 调用
