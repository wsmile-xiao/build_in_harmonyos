software: asmc-linux
display: "Asmc"
version: "v2.39"
upstream_name: asmc
upstream_version: "v2.39"
status: built
build_system: make
compile_date: 2026-08-27
target_platform: aarch64-unknown-linux-ohos
issue: TBD

source:
  # ARM64 原生移植源码，随 conanfile.py exports_sources 打包（本地导出，无远端下载）
  local_export: true
  files:
    - "asmc_asm.c"
    - "asmc_elf.c"
    - "asmc_io.c"
    - "asmc_globals.c"
    - "asmc_entry.s"
    - "asmc_runtime.s"
    - "asmc_data.h"
    - "Makefile"

build:
  system: make
  cc: clang
  cxx: clang++
  target: "aarch64-unknown-linux-ohos"
  options:
    - "make rebuild"
  dependencies: []

capabilities:
  host: "ARM64 OHOS 原生运行 Asmc host（asmc_native 静态 ELF）"
  target: "Asmc 输出 x86/x86-64 目标（.o ELF64 x86-64 与 .bin 原始 x86 指令）"
  link: "x86-64 可执行 ELF 可由本地 ld.lld 15.0.4 生成"

test:
  entry: "run_manifest.sh（固定 635-source manifest）；独立上游测试子集 105 用例；鸿蒙特有测试 smoke（ARM64 原生运行 + 目标产物）"
  discovered: 635
  note: "ARM64 host 原生运行；x86/x86-64 目标产物；ld.lld 链接 x86-64 可执行 ELF"
  ohos_specific: "smoke test: 原生运行 asmc_native 汇编 x86-64 源并链接可执行 ELF"
