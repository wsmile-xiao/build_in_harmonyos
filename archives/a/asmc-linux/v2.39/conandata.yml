# asmc-linux v2.39 — ARM64 OHOS 原生移植源码
# 本版本使用 source/ 目录中真实可维护的 ARM64 原生移植源码（非 x86 自举）。
# conanfile.py exports_sources = "source/*" 打包下列文件，无需远端下载/补丁。
sources:
  local_export:
    dir: "source"
    files:
      - "asmc_asm.c"
      - "asmc_elf.c"
      - "asmc_io.c"
      - "asmc_globals.c"
      - "asmc_entry.s"
      - "asmc_runtime.s"
      - "asmc_data.h"
      - "Makefile"
  note: >
    ARM64 native port of Asmc v2.39. Host binary asmc_native targets
    aarch64-unknown-linux-ohos; it assembles x86/x86-64 target code and
    can be linked into an x86-64 executable ELF by the local ld.lld.
