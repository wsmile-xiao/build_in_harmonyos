knowledge_gained:
  - "libayatana-common uses pkg_check_modules(glib-2.0 gio-2.0); needs glib package exposing per-module .pc (glib/2.84.0.1 components), base glib/2.84.0 only emits one merged glib-2.0.pc"
  - "GSettings/Intltool CMake modules come from Ubuntu cmake-extras (not on OHOS); provide a minimal FindGSettings.cmake in cmake/ and make po/ optional"
  - "pkg_check_modules(DEPS ...) only puts -l flags into DEPS_LIBRARIES and drops -L dirs (DEPS_LIBRARY_DIRS/DEPS_LDFLAGS); upstream links only ${DEPS_LIBRARIES}, so the linker cannot find glib unless the lib dir is in the default search path — fix with link_directories(${DEPS_LIBRARY_DIRS}) (0003)"
  - "upstream add_library(ayatana-common SHARED) always builds a shared lib regardless of BUILD_SHARED_LIBS"

