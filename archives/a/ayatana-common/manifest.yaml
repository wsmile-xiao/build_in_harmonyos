software: ayatana-common
display: "Ayatana Common"
description: "Ayatana System Indicators common library (libayatana-common): desktop-session detection, program lookup, command/URL helpers and the org.ayatana.common GSettings schema"
category: system
homepage: "https://github.com/AyatanaIndicators/libayatana-common"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "提供 cmake/FindGSettings.cmake 替代 Ubuntu cmake-extras 的 GSettings 模块以安装 gschema"
    - "po/ 翻译在缺少 Intltool 模块时自动跳过"
    - "依赖 glib/2.84.0.1（模块化 .pc：glib-2.0/gio-2.0/gobject-2.0）"
  common_dependencies:
    - glib

versions:
  "0.9.11":
    status: built
    build_date: "2026-09-03"
    conan_ref: "ayatana-common/0.9.11"
