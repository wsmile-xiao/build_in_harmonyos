sources:
  ats2-lang:
    url: "https://deb.debian.org/debian/pool/main/a/ats2-lang/ats2-lang_0.4.2.orig.tar.gz"
    sha256: "51b8e75e62321f5e3e97d7996d605c46a90c6721b568b9b52fe00c19944134d3"

patches:
  - patch_file: "patches/0001-umask-077.patch"
    patch_description: "E011: configure 的 config.status 用 (umask 077 && mktemp -d) 建 700 临时目录——HMDFS/el2 当前进程不可写（subs1.awk Permission denied 实测，同 neon 先例）——改 umask 000"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-works.patch"
    patch_description: "configure: 跳过 'C compiler works' 链接测试（CI el2 沙箱无法创建 conftest 可执行文件——'C compiler cannot create executables' 实测，同 #6257；旧版 autoconf 无 ac_cv_prog_cc_works 缓存机制——cross.cache 预置无效——patch 检查代码 if true 跳过）"
    patch_type: "portability"
