# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: aspell-compat/0.60.8.2
homepage: http://aspell.net

# aspell-compat 是纯脚本子包（ispell/spell 兼容脚本），无编译产物。
# 上游测试属于 aspell 主包（make check），本子包不重复声明。
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试：OHOS 安全模型下未签名二进制不可执行，
# 故以实质校验脚本本身（存在/可执行/sh -n 语法/引用 aspell CLI）验证被测包。
test_package_tests:
  - file: test_compat.sh
    description: "校验 bin/ispell、bin/spell 存在且可执行，sh -n 语法校验，内容引用 aspell CLI"
    command: "sh test_compat.sh <bin_dir>"
  - file: conanfile.py
    description: "test() 委托 test_compat.sh 执行实质校验（conan create . 时运行）"
    command: "conan create ."

assertion_count: 6
