# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake 4.x requires cmake_minimum_required >= 3.5; set CMAKE_POLICY_VERSION_MINIMUM=3.5 in CMakeToolchain"
  - "CMAKE_SYSTEM_NAME is 'HarmonyOS' on OHOS (not 'OHOS' or 'Linux'); platform checks must match 'HarmonyOS'"
  - "OHOS clang defines __linux__ so asplib_os.h TARGET_LINUX fallback works without cmake define"
  - "ASPLIB_NEON must be defined on aarch64 to use arm_neon.h instead of NEON_2_SSE.h (x86 translation layer)"
  - "NEON2SSE git clone at configure time breaks Conan builds; skip on aarch64 where NEON is native"
  - "ComputeDeviceInfo module is x86-only (uses CPUID instruction); must be excluded on aarch64"
  - "SSE3/AVX ComplexVector source files include x86-only intrinsics headers; guard with architecture check"
  - "C++ bug: NativeFloat operator*(float) returned reference to temporary; clang 15 rejects this"

