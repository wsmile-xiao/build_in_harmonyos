# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: asplib/1.0
homepage: "https://github.com/AchimTuran/asplib"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# asplib does not ship automated tests in the repository
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Creates a Biquad filter via CBiquadFactory, processes a sample, verifies finite output"
    command: "./test_asplib"

# 测试断言总数
assertion_count: 4
