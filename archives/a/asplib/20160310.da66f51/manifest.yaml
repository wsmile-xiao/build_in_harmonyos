# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake 4.x requires cmake_minimum_required >= 3.5; set CMAKE_POLICY_VERSION_MINIMUM=3.5 in CMakeToolchain (knowledge_ref: E103)"
  - "CMAKE_SYSTEM_NAME is 'HarmonyOS' on OHOS (not 'Linux'), so the 'if(CMAKE_SYSTEM_NAME MATCHES Linux)' TARGET_LINUX define in CMakeLists is skipped; OHOS clang defines __linux__ so asplib_base_os.h TARGET_LINUX fallback works without the cmake define (knowledge_ref: E092)"
  - "da66f51 (2016-03-10) is the pre-module-refactor version: a single add_library(asplib) static lib from Biquads/ sources, no asplib_modules/ tree, no SSE/AVX code in the compiled path (x86 SIMD only lives in un-built computeDeviceInfo/buffers) (knowledge_ref: notes.md)"
  - "Upstream bug: CBiquad_Native::resetState() has `for (uint32_t kk=0; kk<4; ii++)` — inner loop never advances kk → infinite loop. Fixed to kk++ in recipe patch 0001 (ref: patches/0001-Biquads-Biquad_Native-asplib_Biquad_Native.cpp.patch)"
  - "asplib headers install under include/asplib/{Biquads,interfaces,asplib_utils}; consumers need -I include/asplib (cpp_info.includedirs must include it) (reference: conanfile.py)"
  - "Conan create from GitHub is impossible (network); ghfast.top proxy URL for the official archive/da66f51.tar.gz works and sha256 is stable (GitHub archives are deterministic per commit) (knowledge_ref: E017)"
  - "conan-verify G4 package-ID regex \w+/\w+@\w+/\w+ fails to match dotted versions (20160310.da66f51) so L2/L4/L5 are skipped with PASS; manual artifact verification required (knowledge_ref: E338)"

