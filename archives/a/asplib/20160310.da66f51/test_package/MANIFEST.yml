# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: asplib/20160310.da66f51
homepage: "https://github.com/AchimTuran/asplib"

# 上游测试命令 (make check / ctest -N 分析)
# asplib da66f51 的 CMakeLists.txt 没有 test/check 目标（已确认，无 add_test）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# asplib 本仓库未自带自动化测试
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Creates 2 chained native Biquads via CBiquadFactory, sets coefficients, processes 8 samples and verifies finite non-zero output (out[0]≈0.05); also exercises CBiquad_Native directly and resetState() (upstream infinite-loop bug fixed by recipe patch)"
    command: "./test_asplib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
