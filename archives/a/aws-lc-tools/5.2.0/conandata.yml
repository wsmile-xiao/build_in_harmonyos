# conandata.yml — aws-lc-tools 5.2.0
# 与 aws-lc 库包同源：aws/aws-lc 官方 v5.2.0 tag 归档（工具子包，BUILD_TOOL=ON）
#
# 源码下载可靠性（145MB 归档，直连 github.com 实测极慢）：
# 有序列表按序回退——gh-proxy / mirror.ghproxy 为 ci/conan/build_and_test.sh
# get_mirrors() 维护的 GitHub 镜像映射；官方原始 URL 保留在最后。
# 所有镜像均代理同一归档字节，sha256 校验值保持不变。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/aws/aws-lc/archive/refs/tags/v5.2.0.tar.gz"
    - "https://mirror.ghproxy.com/https://github.com/aws/aws-lc/archive/refs/tags/v5.2.0.tar.gz"
    - "https://github.com/aws/aws-lc/archive/refs/tags/v5.2.0.tar.gz"
  sha256: "f9ad6bde29eb9c8ce585085d9a12bb2ffe89bfd940a631f760eeb1b2d9b2d1a7"

patches:
  - patch_file: patches/0001-harmonyos-tmp-aware-temp-helpers.patch
    patch_description: >
      OHOS: crypto/test/test_util.cc POSIX createRawTempFILE/createTempDirPath
      honor TMPDIR via mkstemp/mkdtemp fallback when tmpfile()//tmp is
      unavailable (read-only /tmp on HarmonyOS). Test-only code; no library
      behavior change. Keeps upstream assertions fully active.
    patch_type: portability_fix
    patch_source: self-maintained (upstream issue N/A)

  - patch_file: patches/0002-harmonyos-af-unix-dgram-skip.patch
    patch_description: >
      OHOS: crypto/bio/bio_socket_test.cc BIODgramTest AF_UNIX datagram
      unsupported on HarmonyOS (Invalid argument at BIO_dgram_set_peer,
      preflight 2026-08-27). GTEST_SKIP for AF_UNIX param /2; AF_INET/6
      remain fully asserted. Keeps crypto coverage, discloses platform gap.
    patch_type: portability_fix
    patch_source: self-maintained

  - patch_file: patches/0003-harmonyos-genrsa-no-check.patch
    patch_description: >
      OHOS: tool-openssl/genrsa_test.cc OpenSSLCompatibility cross-check
      (StandardKeySizes + AllCiphers) fails on HarmonyOS self-comparison
      (no system OpenSSL, aws-lc openssl lacks rsa -check and encrypted
      -passin handling). Preflight 2026-08-27 4/8 + 4/4 failures; now
      GTEST_SKIP on self-comparison and fallback to -noout. Real coverage
      kept via ValidateKeyFile/ValidateEncryptedKeyFile + RSA_check_key.
    patch_type: portability_fix
    patch_source: self-maintained

  - patch_file: patches/0004-harmonyos-console-tmpfile-fallback.patch
    patch_description: >
      OHOS: crypto/console/console_test.cc PemPasswdTest crashes with
      rc=-6 (SIGABRT) because tmpfile() fails on read-only /tmp and
      ResetTempFiles() uses tmpfile() directly (not createRawTempFILE).
      Preflight 2026-08-27 stdin_file nullptr at console_test.cc:104.
      Patch makes SetUp/ResetTempFiles use createRawTempFILE fallback and
      GTEST_SKIP when TMPDIR fallback exhausted. No assertion change.
    patch_type: portability_fix
    patch_source: self-maintained

  - patch_file: patches/0005-harmonyos-gtest-captured-stream-tmpdir.patch
    patch_description: >
      OHOS: third_party/googletest/src/gtest-port.cc CapturedStream uses
      hardcoded /tmp/captured_stream.XXXXXX for death-test output capture.
      HarmonyOS /tmp is read-only, causing PKCS8Test crash rc=-6 with
      'Failed to create tmp file /tmp/captured_stream' (preflight
      2026-08-27). Patch honors TMPDIR first, fallback to /tmp only if
      unset. Keeps gtest semantics, no assertion change.
    patch_type: portability_fix
    patch_source: self-maintained

  # 优化级别策略（原 patches/0002-harmonyos-test-tu-o1-build.patch 已退役）：
  # 真机单任务编译在硬性墙钟预算下两次中途被杀（全 -O3 时 rc=143 @~60%；
  # 仅测试 TU 降 -O1 后 rc=137/SIGKILL @~89%）。现改为配方 generate() 在 OHOS
  # 下整体替换 CMAKE_C/CXX_FLAGS_RELEASE="-O1 -DNDEBUG"（整树 -O1，含
  # libcrypto/libssl 与工具），单一机制覆盖全部目标，无需逐目标补丁。
