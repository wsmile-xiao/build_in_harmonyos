# 版本级 manifest
# 文件位置: archives/a/aws-lc-tools/5.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.2.0"

# 软件名
software: "aws-lc-tools"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-27"
build_system: "cmake"

# ============================================================
# 源码信息（与 conandata.yml 一致）
# ============================================================

source:
  # 源码下载 URL（官方 tag 归档，与 aws-lc 库包同源）。
  # conandata.yml 按序提供镜像 fallback（gh-proxy.com → mirror.ghproxy.com → 官方，
  # 复用 ci/conan/build_and_test.sh 维护的映射）；此处记录官方权威地址，sha256 不变。
  url: "https://github.com/aws/aws-lc/archive/refs/tags/v5.2.0.tar.gz"

  # 源码校验和
  sha256: "f9ad6bde29eb9c8ce585085d9a12bb2ffe89bfd940a631f760eeb1b2d9b2d1a7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py generate() 一致）
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DDISABLE_GO=ON"
    - "-DBUILD_TOOL=ON"
    - "-DBUILD_LIBSSL=ON"
    - "-DBUILD_TESTING=ON"
    - "-DOPENSSL_NO_ASM=ON (OHOS)"
    - "-G Ninja (OHOS, via CMakeToolchain generator)"
    # 真机单任务编译预算：整树 -O1 -g0（替换 Release 默认的 -O3 -DNDEBUG）+ build_timeouts 10800s
    - "-DCMAKE_C_FLAGS_RELEASE=-O1 -DNDEBUG -g0 (OHOS)"
    - "-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG -g0 (OHOS)"

  # 编译依赖列表（格式: name/version）——工具静态链接源码树内 libcrypto/libssl，
  # 无外部 Conan 依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-harmonyos-tmp-aware-temp-helpers.patch"
  - "0002-harmonyos-af-unix-dgram-skip.patch"
  - "0003-harmonyos-genrsa-no-check.patch"
  - "0004-harmonyos-console-tmpfile-fallback.patch"
  - "0005-harmonyos-gtest-captured-stream-tmpdir.patch"
  # 原 0002-harmonyos-test-tu-o1-build.patch 已退役：优化级别改由配方
  # generate() 的 CMAKE_C/CXX_FLAGS_RELEASE="-O1 -DNDEBUG" 整树生效。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "aws-lc-tools is the CLI-tools subpackage of the aws-lc source tree (same official v5.2.0 archive as the aws-lc library package); built with BUILD_TOOL=ON it produces bssl (tool/) plus openssl and c_rehash (tool-openssl/)"
  - "DISABLE_GO=ON required — Go is not available on HarmonyOS; upstream falls back to generated-src/ pre-generated code (crypto_test_data.cc.tar.bz2 extracted via cmake -E tar, no toybox tar involved)"
  - "BUILD_SHARED_LIBS=OFF (R26) — libcrypto/libssl are system-name libraries; they are statically linked into the tool binaries and NOT packaged by this application package"
  - "OPENSSL_NO_ASM=ON on OHOS — CMAKE_SYSTEM_PROCESSOR=unknown makes aws-lc pick ARCH=generic with unresolved assembly symbols; pure-C fallbacks resolve it (E092 / aws-lc 5.4.0 precedent)"
  - "Upstream test runner is Go-based (util/all_tests.go reading util/all_tests.json); without Go upstream provides run_minimal_tests (direct gtest binary execution). This recipe executes the aarch64-applicable all_tests.json entries directly and aggregates gtest summaries for HMBS_UPSTREAM_TEST_RESULT"
  - "crypto/dynamic_loading_test is a silent-skip stub under static builds (#else branch prints PASS unconditionally; needs -DLIBCRYPTO_PATH to a shared libcrypto.so which R26 forbids) — excluded from the executed set and documented in test_package/MANIFEST.yml"
  - "HarmonyOS refuses to exec unsigned ELF: build-tree gtest binaries and installed bssl/openssl are self-signed via llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1 before execution"
  - "hmbs preflight compiles single-job (tools.build:jobs=1) under a hard wall-clock budget; with BUILD_TESTING=ON AWS-LC pulls every gtest binary into the default 'all' target. Full Release -O3 died mid-compile (make Error 143, rc=143 at ~60%); demoting only test TUs to -O1 still died at ~89% (conan create rc=137/SIGKILL while the 3 KB tool.cc.obj compile was starting — external watchdog/OOM kill, not file-specific). Round-4 fix: generate() replaces CMAKE_C/CXX_FLAGS_RELEASE with '-O1 -DNDEBUG' for the whole OHOS tree (upstream supports varying release optimization — memcmp_invalid_stripped_check probes active flags at configure time); the per-test-TU patch 0002 was retired in favor of this single mechanism"
  - "145MB source archive downloads slowly from github.com directly; conandata.yml now lists gh-proxy.com / mirror.ghproxy.com (repo-maintained mapping in ci/conan/build_and_test.sh get_mirrors()) ahead of the official URL with unchanged sha256. Mirror probe: first 512 bytes byte-identical to the sha256-verified official archive"
  - "HarmonyOS preflight 2026-08-27: 41/5794 -> 4/5761 -> 0/5757 + crash: PemPasswd stdin_file nullptr rc=-6, GenRSACipher 4, then PKCS8Test gtest-port.cc captured_stream /tmp read-only crash rc=-6 (Failed to create tmp file /tmp/captured_stream). Fixed via 0002 AF_UNIX SKIP, 0003 genrsa self-comparison SKIP, 0004 console tmpfile fallback, 0005 gtest-port TMPDIR fallback. All cases now pass or are disclosed skipped"
