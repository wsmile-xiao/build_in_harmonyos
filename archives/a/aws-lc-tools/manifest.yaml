software: aws-lc-tools
display: "AWS-LC Tools"
description: "AWS-LC 命令行工具子包：bssl 多功能工具与 OpenSSL 兼容的 openssl/c_rehash"
category: crypto
homepage: "https://github.com/aws/aws-lc"
license: Apache-2.0 OR ISC
build_system: cmake

ohos_adaptation:
  key_points:
    - "与 aws-lc 库包同源码树（aws/aws-lc 官方 tag 归档），BUILD_TOOL=ON 构建工具"
    - "DISABLE_GO=ON 使用上游 generated-src/ 预生成代码"
    - "OPENSSL_NO_ASM=ON 规避 OHOS CMAKE_SYSTEM_PROCESSOR=unknown 的汇编符号问题"
    - "真机单任务编译预算下整树 -O1（CMAKE_C/CXX_FLAGS_RELEASE=-O1 -DNDEBUG，OHOS），保障编译+全量上游测试在墙钟预算内完成"
    - "源码下载按序回退 gh-proxy/mirror.ghproxy 镜像（sha256 不变），官方 URL 兜底"
    - "libcrypto/libssl 静态链接进工具二进制（R26），本包只交付 bin/"
    - "工具与测试二进制需 binary-sign-tool 自签名后才能在鸿蒙上执行"
  common_dependencies: []

versions:
  "5.2.0":
    status: built
    build_date: "2026-08-25"
    conan_ref: "aws-lc-tools/5.2.0"
