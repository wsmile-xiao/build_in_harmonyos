sources:
  url: "https://www.xm1math.net/algobox/algobox-1.1.1.tar.bz2"
  sha256: "b5db2479360d5efa00c1856466e98481571d22064ed63272706ff0d5098f0e5e"
patches:
  - patch_file: "patches/0001-ohos-qmake-and-cli-smoke.patch"
    patch_description: "Add non-GUI smoke-test options and disable Qt PrintSupport for the OHOS qmake build."
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-webengine-fallback.patch"
    patch_description: "Replace the WebEngine view with a QWidget/TextBrowser fallback and drop the direct qtwebengine/qtwebchannel dependencies."
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-qtextcodec-compat-wrapper.patch"
    patch_description: "Add a local QTextCodec compatibility fallback that works even when QtCore5Compat headers are absent."
    patch_type: "portability"
  - patch_file: "patches/0004-ohos-drop-unused-webchannel.patch"
    patch_description: "Drop unused QWebChannel hooks after the OHOS QTextBrowser fallback removes WebEngine JavaScript execution."
    patch_type: "portability"
  - patch_file: "patches/0005-ohos-fix-algowebpage-newline-split.patch"
    patch_description: "Keep the QTextBrowser fallback newline split as an escaped C++ string literal."
    patch_type: "portability"
  - patch_file: "patches/0006-ohos-drop-qtcore5compat-probe.patch"
    patch_description: "Skip probing QtCore5Compat so the fallback stays on the local QTextCodec shim."
    patch_type: "portability"
  - patch_file: "patches/0007-ohos-drop-core5compat-module.patch"
    patch_description: "Remove the qmake core5compat module from algobox.pro so OHOS qmake stops looking for an unavailable Qt module."
    patch_type: "portability"
