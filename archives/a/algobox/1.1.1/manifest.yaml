knowledge_gained:
  - "AlgoBox 1.1.1 is a qmake Qt Widgets application, not a CMake/Autotools library."
  - "The package now uses a QTextBrowser-based fallback for the browser/help pane and no longer depends on qtwebengine or qtwebchannel."
  - "Current qtbase/6.11.1 disables Qt PrintSupport; the AlgoBox package patch disables the system-printer action and keeps a PDF export fallback through QtGui."
  - "AlgoBox uses a local Qt 6 QTextCodec shim backed by QStringDecoder/QStringEncoder for UTF-8 and Latin-1 file conversions, so the package does not depend on qtcore5compat."
  - "The qmake core5compat module is not available from the OHOS Qt package path, so algobox.pro removes it and keeps QTextCodec compatibility local."
  - "Patch text must preserve escaped C++ string literals; the AlgoWebPage fallback keeps msg.split(\"\\n\") as a single source line."
  - "The OHOS-target qtbase/6.11.1 package exports qmake6 as an OHOS binary; Windows-host local validation cannot execute that tool and must defer the full qmake build to an OHOS-compatible runner."
  - "CI #40723 on OpenHarmonyPCDeveloper-CI-031 completed the Conan build, test_package smoke, L0 gate, and L1 gate for feat/algobox-1.1.1."
  - "Knowledge draft DRAFT-algobox-ohos-target-qmake-windows-host documents the host-tool boundary: graph resolution can succeed while qmake6 remains non-runnable on Windows host (knowledge/drafts/DRAFT-algobox-ohos-target-qmake-windows-host.kv)."

verification:
