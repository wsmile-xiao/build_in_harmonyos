# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ayatana-indicator-a11y 25.4.0 CMake 构建硬性 REQUIRED accountsservice 与 xrandr（src/service.c 无条件调用 act_* 与 XRR* API），二者未发布到 ohpcd -> dependency_missing（W0/R36）"
  - "任务依赖清单中 gtk3 并非本包构建依赖；真实硬依赖为 accountsservice + libxrandr"
  - "glib 必须用 2.84.0.1（与 ayatana-common 0.9.11 requires 一致），require glib/2.84.0 会版本冲突"
  - "libxrandr 实际发布版本为 1.5.5.1（libx11/6.4.0 track），a11y 需随 track 使用 libx11/6.4.0 + libxrandr/1.5.5.1"
  - "data/CMakeLists.txt 的 find_package(GSettings REQUIRED) 依赖 Ubuntu cmake-extras：新增 cmake/FindGSettings.cmake shim 补丁（新建文件补丁首行 --- /dev/null）"
  - "po/ 依赖 Intltool CMake 模块：find_package(Intltool QUIET) 可选化，未找到时跳过 po 子目录"
  - "data/CMakeLists.txt 硬编码 DESTINATION \"/etc/xdg/autostart\"（绝对路径）：改为 ${CMAKE_INSTALL_FULL_SYSCONFDIR}/xdg/autostart，避免安装逃逸 package 目录"
  - "产物为守护进程二进制（libexec 下）+ 数据文件，无公共库：package_type=application，test_package 做安装产物完整性检查，需 commands.json（R38）"
