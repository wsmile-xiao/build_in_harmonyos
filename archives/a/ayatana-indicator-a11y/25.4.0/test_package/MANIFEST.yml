# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ayatana-indicator-a11y/25.4.0
homepage: "https://github.com/AyatanaIndicators/ayatana-indicator-a11y"

# 上游测试命令 — 上游 CMake 无 test/check 目标
# (CMakeLists.txt 只构建 src/ayatana-indicator-a11y-service 守护进程,
#  无 CTEST 注册测试)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无上游自动化测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的二进制
test_package_tests:
  - file: test.sh
    description: "守护进程冒烟测试: ELF 可执行性 + 启动行为 (干净退出/存活均通过, 崩溃失败) + GSettings schema/indicator 描述/D-Bus XML/图标/autostart 数据完整性"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
