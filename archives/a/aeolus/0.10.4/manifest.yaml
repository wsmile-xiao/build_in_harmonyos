knowledge_gained:
  - "纯 Makefile 项目（无 configure）：Makefile 硬编码 -march=native，须经 refresh-patch --auto 生成 portability 补丁移除（R33 编译器由 conan profile tools.build:compiler_executables 提供）"
  - "aeolus 主程序只构建 aeolus + aeolus_txt.so，跳过 aeolus_x11.so：X11/Xft/clxclient 在制品仓与 OHOS SDK 均不存在，属平台限制（R40 评估结论）"
  - "make 传参要点：CPPFLAGS/LDFLAGS 走环境变量而非 make 命令行变量，否则会覆盖 Makefile 的 `+=` 追加（-DVERSION/-DLIBDIR/-shared 丢失）"
  - "readline 配方为静态库，aeolus_txt.so 链接 readline 需补 -lncursesw（tputs/tgetent 等 termcap 符号）"
  - "OHOS 无裸 install/ldconfig；用 INSTALL ?= /bin/install（toybox）参数化并去掉 ldconfig"
  - "Makefile install 目标用 $(DESTDIR)/$(BINDIR)（带斜杠）才能正确落在 DESTDIR 下"

