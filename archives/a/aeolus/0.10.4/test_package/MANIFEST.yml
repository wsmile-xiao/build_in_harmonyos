# test_package/MANIFEST.yml
# aeolus 0.10.4 — 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: aeolus/0.10.4
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"

# 上游无测试套件（已确认）：source/Makefile 只有 all/install/uninstall/clean 目标，
# 无 check/test 目标。实测 `make check` 输出 "No rule to make target 'check'"。
# 因此 upstream_test_in_build=false，conanfile.py build() 中不执行上游测试，
# 消费者验证由 test_package/ 完成。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试用例数（准确整数）：0（上游无任何 check/test 目标，实测 make check 报 No rule）
upstream_test_cases: 0
# 适配后测试通过率（准确整数）：test_package 2 个断言全部通过 = 2/2 (100%)
pass_rate: "2/2 (100%)"

test_package_tests:
  - file: test_aeolus.cpp
    description: "Runs the packaged aeolus binary with `-h` and greps the output for the 'Aeolus 0.10.4' banner (upstream help() exits 1, so the assertion is on the printed banner), then dlopens the packaged aeolus_txt.so plugin and resolves its create_iface entry point — verifying the text-mode interface plugin is loadable in the OHOS runtime."
    command: "./test_aeolus <package>/lib/aeolus_txt.so"

assertion_count: 2
