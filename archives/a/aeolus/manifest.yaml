# 软件级 manifest — aeolus
# 遵循 ARCHIVE-SPEC v2.0

software: aeolus
display: "aeolus (Synthesised Pipe Organ)"
description: "Aeolus — 合成（非采样）管风琴合成器，支持 JACK/ALSA 音频输出，含文字模式（aeolus_txt）与 X11 图形界面插件"
category: audio
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"
license: GPL-3.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建（无 configure），Makefile 硬编码 -march=native 由 portability 补丁移除，编译器取自 conan profile（R33）"
    - "仅构建 aeolus 主程序 + aeolus_txt.so，跳过 aeolus_x11.so：X11/Xft/clxclient 制品仓无配方、OHOS SDK 无头文件（R40 平台限制）"
    - "CPPFLAGS/LDFLAGS 经环境变量传入 make（命令行传参会覆盖 Makefile 的 `+=`，丢失 -DVERSION/-DLIBDIR/-shared）"
    - "readline 为静态库，aeolus_txt.so 需补 -lncursesw 提供 termcap 符号"
  common_dependencies:
    - zita-alsa-pcmi
    - clthreads
    - jack
    - alsa-lib
    - readline
    - ncurses

versions:
  "0.10.4":
    status: built
    build_date: 2026-08-25
    notes: "conan-verify G0-G4 全通过；1 个 portability 补丁（source/Makefile）；aeolus_x11.so 因平台无 X11 跳过"
