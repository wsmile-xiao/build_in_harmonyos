# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 asterisk-espeak 5.0-1 无独立测试套件（单模块项目，无 tests/）；
# test_package 为 OHOS 适配自研的 L1 验证。

package: asterisk-espeak/5.0-1
homepage: "https://github.com/zaf/Asterisk-eSpeak"

# 上游官方测试：无独立测试套件（单 C 模块项目）
upstream_official_tests: []

# 构建阶段执行的测试命令：无
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 适配补全测试（自研，非上游）：无（消费者验证集中在 test_package）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: conanfile.py
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：验证 app_espeak.so 存在于 lib/asterisk/modules/ 且为有效 ELF DYN 共享库，espeak-ng 依赖可解析"
    command: "./test_asterisk_espeak"

# 测试断言总数 (实际统计：2 项断言，全部为适配自研断言：
# app_espeak.so 存在、ELF DYN 类型有效)
assertion_count: 2
