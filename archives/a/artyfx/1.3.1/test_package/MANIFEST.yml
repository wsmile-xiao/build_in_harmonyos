# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: artyfx/1.3.1
homepage: "https://github.com/openAVproductions/openAV-ArtyFX"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ArtyFX 上游无标准测试套件 (make check 无实际测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "dlopen artyfx.so, verify lv2_descriptor symbol and plugin URI"
    command: "./test_artyfx"

# 测试断言总数
assertion_count: 5
