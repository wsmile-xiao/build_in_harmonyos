software: absl

# 版本号
version: "20260526.0"

# 编译状态
status: built

# 编译日期
build_date: "2026-09-13"

# 构建系统
build_system: cmake

# 源码信息
source:
  url: "https://github.com/abseil/abseil-cpp/archive/refs/tags/20260526.0.tar.gz"
  sha256: "6e1aee535473414164bf83e4ebc40240dec71a4701f8a642d906e95bea1aea0c"
  tar_format: tar.gz

# 构建配置
build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DABSL_ENABLE_INSTALL=ON"
    - "-DABSL_PROPAGATE_CXX_STD=ON"
    - "-DABSL_BUILD_TESTING=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "absl 20260526.0 最低 CMake 3.16（CMakeLists.txt:19），C++17 起步；farm profile 的 cppstd=17 满足"
  - "ABSL_ENABLE_INSTALL 在非顶层构建时默认 OFF（CMakeLists.txt:39/41），必须显式置 ON，否则不会安装 lib/cmake/absl/abslConfig.cmake——下游 gRPC 的 find_package(absl CONFIG) 就找不到按组件命名的 absl::<component> target"
  - "测试开关是双重的：需要同时满足 BUILD_TESTING 与 ABSL_BUILD_TESTING（CMakeLists.txt:136），仅关其一不足"
  - "OHOS SDK 的 lld 链接期需要 libxml2.so.16（在 SDK llvm/lib 下），必须通过 LD_LIBRARY_PATH 注入，否则 cmake 的编译器链接测试失败"
  - "制品仓同时存在 abseil（20260526）与 abseil-cpp（20260107.1）两个不同包名：protobuf/33.6 与 grpc 1.70/1.84 走 abseil-cpp（lts_20260107 ABI）；absl 这一名称保留给以 absl/<ver> 引用的历史消费者"
