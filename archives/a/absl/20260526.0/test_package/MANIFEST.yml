# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: absl/20260526.0
homepage: "https://abseil.io"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试（未运行，如实申报）
# 实测规模（abseil-cpp-20260526.0 源码树，find absl -name "*_test.cc"）：
#   - *_test.cc 总数 : 252
#   - *_benchmark.cc : 49（基准测试，非自动套件）
#   - 分布（部分）：strings 53、random 37、base 31、container 29、log 21、
#                   time 12、debugging 11、flags 11、synchronization 10、
#                   status 5、hash 4、numeric 3
#   - 框架：GoogleTest
upstream_tests:
  - name: "absl 各组件 *_test.cc（gtest）"
    count: 252
    command: "ctest  # 需 ABSL_BUILD_TESTING=ON + BUILD_TESTING=ON"
    executed: false
    not_run_reason: "见 notes.md §4：absl 的 CMake 测试目标需要外部 GoogleTest（ABSL_USE_EXTERNAL_GOOGLETEST 指向 /usr/src/googletest，或从 GitHub 拉取）；farm 构建机上没有该依赖，且 252 个测试文件在单线程构建约束下属不可行量级"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_absl.cpp
    description: "冒烟测试：真实调用 absl::StrCat（header-only）+ absl::SimpleAtoi（strings 库）+ 组件库链接验证"
    command: "clang++ test_absl.cpp -std=c++17 -I<include> -L<lib> -Wl,--start-group <libabsl_*.a> -Wl,--end-group && ./test_absl"
    assertions: 2

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
