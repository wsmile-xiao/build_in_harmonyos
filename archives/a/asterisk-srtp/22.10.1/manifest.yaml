build_system: autotools
source:
  url: "https://downloads.asterisk.org/pub/telephony/asterisk/asterisk-22.10.1.tar.gz"
  sha256: "0953564c44fa49827f3c9d70ca6e80db83828c9848440852c6be44c961855353"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--without-pjproject"
    - "--with-pjproject-bundled=no"
  dependencies:
    required:
      - srtp/2.8.0      # libsrtp2 (SRTP) — via ohpcd
      - openssl/3.5.6.1 # PBX_OPENSSL 检测 — via ohpcd
patches_applied:
  - "0001-configure.patch"                # BlocksRuntime 禁用（OHOS clang 无 blocks runtime）
  - "0002-include-asterisk-astmm.h.patch" # ASTMM_LIBC 默认改 IGNORE（astmm.h 不再毒化 libc 分配器名，无平台宏）
  - "0003-include-asterisk-utils.h.patch" # RAII_VAR blocks 分支仅在 __BLOCKS__ 下启用
  - "0004-menuselect-config.guess.patch"  # config.guess 识别 HarmonyOS triplet
  - "0005-menuselect-config.sub.patch"    # config.sub 识别 ohos-linux triplet
notes: >
  仅打包 res_srtp.so 模块。构建在 $TMPDIR 工作目录进行（规避 HMDFS 对 conan
  进程树 config.status 临时文件的 MAC 限制，E052/E060）；menuselect 工具被
  手动 menuselect.makeopts/makedeps 绕过；产物拷回 source_folder 打包。

