sources:
  "22.10.1":
    url: "https://downloads.asterisk.org/pub/telephony/asterisk/asterisk-22.10.1.tar.gz"
    sha256: "0953564c44fa49827f3c9d70ca6e80db83828c9848440852c6be44c961855353"

patches:
  "22.10.1":
    - patch_file: "patches/0001-configure.patch"
      patch_description: "OHOS clang does not need BlocksRuntime; disable blocks instead of erroring"
      patch_type: "portability"
    - patch_file: "patches/0002-include-asterisk-astmm.h.patch"
      patch_description: "Default ASTMM_LIBC to ASTMM_IGNORE so astmm.h never poisons libc allocator names (portable, no platform macros)"
      patch_type: "portability"
    - patch_file: "patches/0003-include-asterisk-utils.h.patch"
      patch_description: "RAII_VAR blocks branch only under __BLOCKS__ (no blocks on OHOS)"
      patch_type: "portability"
    - patch_file: "patches/0004-menuselect-config.guess.patch"
      patch_description: "config.guess recognize HarmonyOS (aarch64-unknown-linux-ohos)"
      patch_type: "portability"
    - patch_file: "patches/0005-menuselect-config.sub.patch"
      patch_description: "config.sub recognize ohos-linux triplet"
      patch_type: "portability"
