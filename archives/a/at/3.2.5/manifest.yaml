software: at
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.2.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.2.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/a/at/at_3.2.5.orig.tar.gz"

  # 源码校验和
  sha256: "bb066b389d7c9bb9d84a35738032b85c30cba7d949f758192adc72c9477fd3b8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-jobdir=/var/spool/atjobs"
    - "--with-atspool=/var/spool/atspool"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess 需要手动添加 HarmonyOS case (旧版 2011)"
  - "E064: configure conftest 无法执行需修补为 cross_compile warning"
  - "HMDFS mktemp -d 创建目录有 setgid 位，需用 mkdir+PID 替代"
  - "HMDFS 不支持 mkfifo，make jobserver 失败，需 -j1"
  - "atd.c 编译时需要 SENDMAIL 宏，通过环境变量设置"
  - "chown/chgrp 不可用 (E046)，需创建 no-op wrapper"
  - "at 不支持 out-of-source build，conanfile 需设置 folders.build='.'"
  - "纯可执行包 cpp_info.libs=[] 避免 CMakeDeps 找不到库"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/at-3.2.5.orig
  source_work_dir: /storage/Users/currentUser/builds/at-3.2.5.work
  source_orig_hash: 0a3529408c677188
  source_work_hash: c84b92d4d4b8b42e
  generated_at: '2026-06-29T16:03:00'
  patches_count: 3

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
