version: "0.2.1"
software: "alpaca"
status: built
build_date: "2026-09-02"
build_system: cmake
source:
  url: "https://github.com/p-ranav/alpaca/archive/refs/tags/v0.2.1.tar.gz"
  sha256: "05d49a2dc9c6a9e07c0cbc4e26caec273a8666270c82d7c3f0ede4f3a9258f4e"
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
    - "-DALPACA_BUILD_TESTS=ON when can_run(self)"
    - "-DALPACA_BUILD_BENCHMARKS=OFF"
    - "-DALPACA_BUILD_SAMPLES=OFF"
    - "-DALPACA_BUILD_PYTHON_LIB=OFF"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-support-long-long-duration-rep-on-ohos.patch"
  - "0002-serialize-vector-bool-values.patch"
knowledge_gained:
  - "OHOS libc++ 的 std::chrono::duration::rep 可能是 long long；仅按 int64_t 名称匹配的序列化重载会在上游测试编译阶段失配。设备实测上游为 349 个 test cases。"
  - "vector<bool> 的迭代器元素是代理引用，必须先转成 bool 再进入标量序列化路由。"
  - "上游 CMake install 仅安装 detail 顶层头文件；header-only 包需显式核对并发布 detail/types 子目录。"
