# test_package/MANIFEST.yml
# apk-tools 2.14.4 upstream test declaration

package: apk-tools/2.14.4
homepage: "https://gitlab.alpinelinux.org/alpine/apk-tools"

# Upstream test command (make check needs real apk database/network, Alpine-only)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package/test.c
    description: "Call apk_pkg_parse_name() to split 'zlib-1.3.1' into name/version blobs — verify libapk links and pure parsing API works at runtime (no apk database/network/device needed)"
    command: "./test_apk"

# Test assertion count
assertion_count: 2
