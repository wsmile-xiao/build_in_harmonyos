# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: args-parser/6.3.6
homepage: "https://github.com/igormironchik/args-parser"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/auto/arg/main.cpp
    source: args-parser-6.3.6/tests/auto/arg/main.cpp
    description: "Arg 基础参数解析测试"
    command: "./test.arg"
  - file: tests/auto/command/main.cpp
    source: args-parser-6.3.6/tests/auto/command/main.cpp
    description: "Command 子命令解析测试"
    command: "./test.command"
  - file: tests/auto/context/main.cpp
    source: args-parser-6.3.6/tests/auto/context/main.cpp
    description: "Context 上下文解析测试"
    command: "./test.context"
  - file: tests/auto/flag_and_name/main.cpp
    source: args-parser-6.3.6/tests/auto/flag_and_name/main.cpp
    description: "flag 与 name 解析测试"
    command: "./test.flag_and_name"
  - file: tests/auto/groups/main.cpp
    source: args-parser-6.3.6/tests/auto/groups/main.cpp
    description: "参数组解析测试"
    command: "./test.groups"
  - file: tests/auto/multi_arg/main.cpp
    source: args-parser-6.3.6/tests/auto/multi_arg/main.cpp
    description: "多值参数解析测试"
    command: "./test.multi_arg"
  - file: tests/auto/help/main.cpp
    source: args-parser-6.3.6/tests/auto/help/main.cpp
    description: "Help 输出测试"
    command: "./test.help"
  - file: tests/auto/api/main.cpp
    source: args-parser-6.3.6/tests/auto/api/main.cpp
    description: "API 集成测试"
    command: "./test.api"
  - file: tests/auto/exceptions/main.cpp
    source: args-parser-6.3.6/tests/auto/exceptions/main.cpp
    description: "异常处理测试"
    command: "./test.exceptions"
  - file: tests/auto/stuff/main.cpp
    source: args-parser-6.3.6/tests/auto/stuff/main.cpp
    description: "Stuff 辅助功能测试"
    command: "./test.stuff"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：创建 CmdLine、注册 Arg、parse 并验证 HelpHasNoArgument 异常路径"
    command: "./test_args-parser"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 100