# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: airthings-ble/1.2.0
homepage: "https://github.com/Airthings/airthings-ble"

# 上游测试命令 — airthings-ble 上游使用 pytest 套件
upstream_check_command: "python3 -m pytest tests/"

# 上游测试在 test_package/conanfile.py 的 test() 中执行并输出
# HMBS_UPSTREAM_TEST_RESULT 标记（真机预检每轮必跑 test_package）。
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest test_package/tests/ -q --no-header -o addopts="

# 上游实际运行的测试程序（2026-08-20 实测记录）：
# PyPI sdist 不含 tests/ 目录，GitHub 官方 tag archive 含 tests/（12 个文件、
# 30 个 TEST 函数，纯 hex 数据解码逻辑、无需真实 BLE 硬件）。源码选择
# GitHub 官方 tag archive（sha256 已核验）。上游 tests/ 原样复制进
# test_package/tests/，由 test_package 的 test() 运行。
upstream_tests:
  - file: tests/test_device_type.py
    source: airthings-ble-1.2.0/tests/test_device_type.py
    description: "设备类型枚举与电池电量计算测试"
    command: "python3 -m pytest test_package/tests/test_device_type.py"
  - file: tests/test_wave_mini.py
    source: airthings-ble-1.2.0/tests/test_wave_mini.py
    description: "Wave Mini/Plus 传感器 hex 数据解码测试"
    command: "python3 -m pytest test_package/tests/test_wave_mini.py"
  - file: tests/test_atom_request.py
    source: airthings-ble-1.2.0/tests/test_atom_request.py
    description: "ATOM 请求序列化测试"
    command: "python3 -m pytest test_package/tests/test_atom_request.py"
  - file: tests/test_radon_level.py
    source: airthings-ble-1.2.0/tests/test_radon_level.py
    description: "氡气水平分级测试"
    command: "python3 -m pytest test_package/tests/test_radon_level.py"

# test_package 中自带的测试（消费者视角验证, 纯 Python 库用 Python 脚本）
test_package_tests:
  - file: test_airthings_ble.py
    description: "消费者测试（L0c）：真实 API（R34）——设备类型枚举/传感器 hex 解码/氡气分级/ATOM 请求序列化，全部使用上游测试同款 hex 数据，无需 BLE 硬件"
    command: "python3 test_airthings_ble.py <site-packages-dir>"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 12
