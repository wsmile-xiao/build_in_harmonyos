# 版本级 manifest — airthings-ble 1.2.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2.0"
software: "airthings-ble"

# 编译状态（R29：conan_verify 通过后才可标 published；当前为未提交工作树，标 built）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-20"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方 tag archive，含上游 tests/ 目录；PyPI sdist 不含测试）
  url: "https://github.com/Airthings/airthings-ble/archive/refs/tags/1.2.0.tar.gz"
  # 源码校验和
  sha256: "f03bfeb64acf611fdc538acf8e371e9075d8d643a0d0b073b1c944cea52857e5"
  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  # 运行时 Python 依赖 bleak/bleak-retry-connector/async-interrupt/cbor2
  # 未发布为 conan 配方，由 pip 从配置的 pypi.cnb.cool 镜像解析（同 aiven-client 惯例）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PyPI sdist 不含 tests/ 目录，为接入上游 pytest 套件须使用 GitHub 官方 tag archive 作为源码"
  - "纯 Python 库运行时依赖未发布为 conan 配方时，由 pip install . 从 pypi.cnb.cool 镜像自动解析（aiven-client 先例）"
