software: abyss
display: "ABySS"
description: "De novo sequence assembler intended for short paired-end reads and genomes of all sizes"
category: bioinformatics
homepage: "https://github.com/BirolLab/abyss"
license: GPL-3.0
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "HMDFS 文件系统对 autotools configure 临时文件创建有特殊权限限制"
    - "鸿蒙系统不支持 POSIX 信号量（sem_t），需要使用 pthread 实现"
    - "鸿蒙系统中 fopen64 被定义为 fopen，需要条件编译处理"
    - "C++17 编译需移除已弃用的 API（std::iterator、std::random_shuffle）"
  common_dependencies:
    - boost
    - openmpi
    - sparsehash
    - btllib

# 版本索引（所有已归档版本，含状态）
versions:
  "2.3.10":
    status: built
    build_date: "2026-06-15"