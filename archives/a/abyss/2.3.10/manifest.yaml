version: "2.3.10"
status: built
build_date: "2026-06-15"

source:
  url: "https://github.com/BirolLab/abyss/archive/refs/tags/2.3.10.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies:
    - btllib/1.4.1
    - sparsehash/2.0.4
    - boost/system
    - openmpi/4.1.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "HMDFS 文件系统对 autotools configure 脚本的临时文件创建限制，需修改 config.status 使用 ./tmp_files"
  - "鸿蒙系统不支持 POSIX 信号量（sem_t），需要使用 pthread 条件变量替代"
  - "鸿蒙系统中 fopen64 与 fopen 的宏定义冲突，需添加条件编译 #ifndef fopen64"
  - "C++17 编译需要注意移除已弃用的 API（std::iterator、std::random_shuffle），移除 -Werror 选项"