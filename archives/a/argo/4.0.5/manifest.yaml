software: argo
version: "4.0.5"
status: built
build_date: "2026-08-05"

source:
  url: "https://github.com/argoproj/argo-workflows/archive/refs/tags/v4.0.5.tar.gz"
  sha256: "3db7ad86ddf7a3bb2802cd97ea2dbe9c455a74dfc91675426641e794ae78a9db"
  tar_format: tar.gz

build_system: go
build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOPROXY=https://goproxy.cn,direct"
    - "GOTOOLCHAIN=local"
  dependencies:
    - "go/1.26.5"
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Go linker mmap在HMDFS上permission denied，需要输出到ext2分区(/data/storage/el2/base/haps/entry/files)"
  - "go.mod要求go≥1.25.7时，使用~/sdk/go1.26.3/bin/go替代本地Go 1.24.2"
  - "argo CLI构建需要UI placeholder(ui/dist/app/index.html)满足go:embed指令"
  - "GitHub不可达时可通过GOPROXY(goproxy.cn)用go mod download获取源码"
