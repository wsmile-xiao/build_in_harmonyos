# 软件级 manifest — arttime
# 遵循 ARCHIVE-SPEC v2.0

software: arttime
display: "arttime"
description: "CLI application that blends beauty of ASCII/text art with functionality of clock/timer/pattern-based time manager in terminal"
category: utility
homepage: "https://github.com/poetaman/arttime"
license: "Custom (LICENSE_CODE, LICENSE_ART, LICENSE_ADDENDUM_CFLA)"
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 zsh 脚本应用，无需编译，使用 install.sh 安装文件"
    - "OHOS zsh 5.9 缺少 is-at-least autoload 函数，需手动创建到 fpath"
    - "install.sh 的 --prefix=VALUE 格式会导致路径前缀 '='，应使用 -p VALUE"
    - "Conan recipe 的 package() 直接使用 copy() 复制文件，不运行 install.sh"
    - "test_package 需创建 is-at-least 函数以使 arttime 可启动"
  common_dependencies:
    - "zsh >= 5.7 (系统级依赖，非 Conan 包)"

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.5.0":
    status: built
    build_date: "2026-08-18"
