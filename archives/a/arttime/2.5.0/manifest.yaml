# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "arttime 是纯 zsh 脚本应用，无需编译，使用 install.sh 安装"
  - "OHOS zsh 5.9 缺少 is-at-least autoload 函数，需手动创建到 fpath"
  - "install.sh 的 --prefix=VALUE 格式会导致路径前缀 '='，应使用 -p VALUE"
  - "Conan get() 对无扩展名 URL 报 BadZipFile，需添加 filename 参数"
  - "GitHub API URL 和 codeload URL 返回不同 sha256 的文件（65字节差异）"
  - "test_package 的 test.sh 需创建 is-at-least 函数以使 arttime 可启动"
