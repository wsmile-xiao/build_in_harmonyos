# test_package/MANIFEST.yml — arttime 2.5.0
# CI L0e requires this file to exist.

package: arttime/2.5.0
homepage: "https://github.com/poetaman/arttime"

# arttime is a shell script project with no upstream test suite
# (no make check / ctest / meson test targets exist)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Creates missing is-at-least zsh function and runs arttime --version to verify the packaged executable works on OHOS"
    command: "bash test.sh"

# Approximate assertion count (version output check)
assertion_count: 1
