# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: awf-gtk/4.2.0
homepage: "https://github.com/luigifab/awf-extended"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# awf-extended 是主题预览 GUI 应用，无上游测试套件（configure.ac/Makefile.am
# 无 check/TESTS 定义；唯一可执行的测试路径是 CLI 查询）。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# awf-gtk4 是 GUI 应用，无显示环境下完整渲染不可验证（R40/E252 边界）；
# 可验证的消费者契约是 `awf-gtk4 --version` 输出 4.2.0（配方已补丁为
# fflush+_exit(0) 干净退出，headless 可用）。
test_package_tests:
  - file: test.sh
    description: "运行 awf-gtk4 --version 并断言输出含 4.2.0（LD_LIBRARY_PATH 含系统 GTK4 前缀 lib/external + lib）"
    command: "bash test.sh <package_folder>/bin/awf-gtk4"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
