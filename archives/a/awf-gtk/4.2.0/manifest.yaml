# 版本级 manifest — awf-gtk 4.2.0
# 文件位置: archives/a/awf-gtk/4.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "4.2.0"
software: awf-gtk

# 编译状态: published | built | failed | archived
# 本轮按要求标记 built（conan-verify 通过，未 upload）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-23"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方源：upstream 以源码归档形式发布（不含预生成 configure，需 autoreconf）
  url: "https://github.com/luigifab/awf-extended/archive/v4.2.0/awf-extended-4.2.0.tar.gz"
  sha256: "17d8374e33e0c520177a87a06551a041d9b7fa926fe054a42e3e9abef694f80f"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools

  # 仅启用 GTK4 前端（GTK2/3/5 与 Qt5/6/7 前端在 OHOS 无对应依赖栈）
  configure_options:
    - "--enable-only-gtk4"

  # 编译依赖
  # gtk4 使用系统前缀（GTK 4.22.4，同 gtkdatabox 对 gtk+-3.0 的消费方式）；
  # cairo/graphene/libnotify 头部由制品仓 conan 包提供（系统前缀缺这些 .pc 与头文件）
  dependencies:
    - gtk4/4.22.4 (system prefix /storage/Users/currentUser/usr/local)
    - cairo/1.18.4 (conan, headers)
    - graphene/1.10.8 (conan, headers + static lib)
    - libnotify/0.8.3 (conan, headers + lib)
    - glib/2.88.0 (system prefix)
    - pango/1.50.14 (system prefix)
    - gdk-pixbuf/2.42.12 (system prefix)
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
# 1) E114: 生成的 configure 中 config.status 临时目录改用固定目录（HMDFS 兼容）
# 2) awf-gtk4.c: --version/--list 输出后 fflush+_exit(0)，跳过 GTK teardown，
#    使无显示环境下 --version 干净退出（headless CLI 查询路径，L2 smoke 依赖）
patches_applied: []
# 实际补丁由 finish step [1/10] refresh-patch --auto 从 orig/work 差异生成

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "awf-extended 是 A widget factory 的多前端主题预览应用，官方 release 以源码归档发布（configure.ac + build.sh，无预生成 configure），autotools 构建必须先在配方 build() 中执行 autoreconf -fi (knowledge_ref: conanfile.py build)"
  - "GTK4 前端经 --enable-only-gtk4 单独启用；GTK2/3/5 与 Qt5/6/7 前端在 OHOS 无依赖栈，默认不构建 (knowledge_ref: conanfile.py generate/configure_args)"
  - "系统前缀 /storage/Users/currentUser/usr/local 部署 GTK 4.22.4 完整栈，但 gtk4.pc 的 Requires 含 cairo-gobject.pc，而系统前缀与制品仓均无该 .pc 文件；配方生成 pkg-config overlay：复制系统 gtk4.pc 并去掉 cairo-gobject 依赖，同时补 cairo/graphene-gobject/libnotify/libpng .pc（指向 conan 包与系统 lib）(knowledge_ref: conanfile.py _pkg_config_overlay)"
  - "conan 包 cairo/1.18.4、graphene/1.10.8、libnotify/0.8.3 在 ohpcd 制品仓均有配方与二进制；其包内 .pc 为 prefix=/ 的占位形式，直接进 PKG_CONFIG_PATH 会解析到 /include /lib，必须用配方自生成的绝对路径 overlay .pc 覆盖 (knowledge_ref: conanfile.py _pkg_config_overlay)"
  - "无显示环境下 GTK 应用在 main 返回后 teardown 会 SIGTRAP/SIGSEGV 崩（Signal 5 / Signal 11）；对 --version/--list 这类纯 CLI 查询路径改用 fflush(stdout)+_exit(0) 干净退出，属合法适配（E252 边界：版本/列表查询可用，GUI 渲染仍需显示会话）(knowledge_ref: conanfile.py build 源码补丁)"
  - "本配方为 application 包（bin/awf-gtk4 + share/ 数据），无 lib/ 输出，G3 系统同名库隔离天然通过；R38 需在软件级目录提供 commands.json（可执行文件）"
  - "--enable-only-gtk4 同时使 configure.ac 中其它前端（gtk5/gtk3/gtk2/qt*/libnotify 可选探测）被条件跳过，减少无谓的 pkg-config 探测失败"

