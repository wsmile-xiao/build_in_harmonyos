# 软件级 manifest — awf-gtk
# 文件位置: archives/a/awf-gtk/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: awf-gtk
display: "AWF GTK (A widget factory)"
description: "GTK4 主题预览工具：预览当前桌面主题下各 GUI 控件外观（A widget factory GTK4 前端）"
category: gui
homepage: "https://github.com/luigifab/awf-extended"
license: GPL-3.0-or-later

# 常用构建系统（可被版本级覆盖）
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 release 为源码归档（configure.ac + build.sh），无预生成 configure，构建前需 autoreconf -fi"
    - "GTK4 前端通过 --enable-only-gtk4 单独启用；GTK2/3/5 与 Qt5/6/7 前端在 OHOS 无依赖栈"
    - "系统前缀 /storage/Users/currentUser/usr/local 部署 GTK 4.22.4，但缺 cairo-gobject.pc 与 cairo/graphene/libnotify 头文件；需生成 pkg-config overlay 并用 conan 包补齐"
    - "无显示环境 GTK teardown 崩溃（Signal 5/11）：--version/--list 纯 CLI 查询路径用 fflush+_exit(0) 干净退出"
    - "application 包（bin/awf-gtk4 + share/ 数据），需在软件级目录提供 commands.json（R38）"
  common_dependencies:
    - gtk4
    - glib
    - pango
    - gdk-pixbuf
    - cairo
    - graphene
    - libnotify

versions:
  "4.2.0":
    status: built
    build_date: 2026-08-23
