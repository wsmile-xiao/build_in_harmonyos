package: ada-bar-codes/005
homepage: "https://ada-bar-codes.sourceforge.io/"

# 上游测试：test/bar_codes_test.adb 为 Code 128 / MSI / EAN-13 / UPC-A /
# Data Matrix / QR 生成 82 张条码 PNG（6 个 MSI 样本复用同一文件名，
# 磁盘上实际为 77 个非空 PNG）。由 conanfile.py build() 中 Fast 模式
# 构建出 bar_codes_test 并运行，任一编码失败即抛异常、退出码非零。
upstream_check_command: "gprbuild -P ada_bar_codes -XABC_Build_Mode=Fast && ./bar_codes_test"
upstream_test_in_build: true
upstream_test_command: "./bar_codes_test"

upstream_tests:
  - file: "test/bar_codes_test.adb"
    source: "abc/test/bar_codes_test.adb"
    description: "上游官方测试程序：为 Code 128 / MSI / EAN-13 / UPC-A / Data Matrix / QR 生成 82 个条码 PNG（MSI 样本复用文件名，磁盘 77 个非空 PNG），任一编码失败即异常退出"
    command: "./bar_codes_test"

test_package_tests:
  - file: "bar_codes_smoke.adb"
    description: "消费者冒烟测试：调用 Bar_Codes.Fitting（Code 128 / QR 模块尺寸）与 Bar_Codes_Media.SVG_Bar_Code（QR SVG 输出）真实 API，3 项断言"
    command: "./bar_codes_smoke"

assertion_count: 3
