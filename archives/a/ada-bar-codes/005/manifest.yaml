patches_applied: []

knowledge_gained:
  - "纯 Ada 2012 库，无 configure/CMake，用 GNAT 工程文件构建静态库（gprbuild -XABC_Build_Mode=static）。"
  - "OHOS 基础工具链无 Ada 编译器；经克隆核验 Harmonybrew core tap（4733 个 formula）不含 gnat/gprbuild 配方，且设备 curl 无 CA bundle，harmonybrew 安装路径在真机不可用（SSL 失败 + formula not found 双重死路）。"
  - "改用 Alpine aarch64 musl gcc-gnat 13.2.1 官方 apk 直接引导（同 argc/1.24.0 的 bottle 下载先例）：Python urllib 下载（SSL_CERT_FILE 指向系统 CA store，无则 unverified 兜底）+ sha256 校验 + tarfile 解包到 ~/gnat-toolchain/13.2.1；GCC_EXEC_PREFIX/ADA_INCLUDE_PATH/ADA_OBJECTS_PATH/LIBRARY_PATH/LD_LIBRARY_PATH 重定位；OHOS 为 musl libc，与 Alpine 同族，musl 二进制可直接运行。"
  - "GPR 头注释确认 gnatmake -P ada_bar_codes 与 gprbuild 等效，无 gprbuild 时用 gnatmake 回退路径即可。"
  - "OHOS /tmp 只读：build/test_package 统一用 HMBS 注入的 TMPDIR/TMP/TEMP（HMBS_TMPDIR/TMPDIR 优先，兜底 ~/tmp/ada-bar-codes）。"
  - "HMDFS 忽略 chmod()（E046/E087，chmod 能力=0）：tarfile 解包 Alpine apk 无法恢复执行位，二进制为 0600，gnatmake 报 Permission denied（Error 126）；且 HMDFS 上 os.access(X_OK) 不可靠。修复：os.open 创建时给 0o755（HMDFS 认 open mode，aribb24 先例），原子替换无执行位文件，工具链复用/新建两条路径都执行。"
  - "第二轮同指纹失败教训：HMDFS 进程 umask 077 会把 os.open 的 0o755 剥成 0700（仅 owner 执行位），而 HMDFS 把文件 owner 映射成与进程不同的 UID（E011），owner 位永远匹配不上，execve 仍 EACCES；stat 的 & 0o111 会把 0700 误判为已修复而跳过。正确做法：os.umask(0) 强制 0o755（o+x 全用户位）+ 跳过条件用 & 0o001 + 真实执行 gnatmake --version 探针验证（os.access/stat 均不可靠）。"
  - "第三轮同指纹失败教训（决定性）：修复后 mode=0o755（o+x 齐全）探针仍 [Errno 13] Permission denied，证明是位置问题而非 mode 问题——home 根 ~/gnat-toolchain 位于 OHOS noexec 存储（E257/djstub 草稿：用户可写位置拒绝直接 exec，仅 /data/service/hnp 可执行）；conan build_folder 可执行（argc/1.24.0 rust-toolchain 在 self.build_folder 解包运行成功）。修复：工具链迁到 self.build_folder/gnat-toolchain（_gnat_root() 实例方法），apk 缓存走共享 ~/.cache/ada-gnat-apks，test_package 镜像引导。"
  - "第四轮同指纹失败教训（推翻第三轮位置结论）：工具链已在 build_folder 且 0o755 仍 EACCES——本地解包 gcc-gnat apk 实证 gnatmake 是 aarch64 ELF，PT_INTERP=/lib/ld-musl-aarch64.so.1，OHOS 无此 loader，直接 execve 必 EACCES（与 mode/位置无关；djstub 证实的'用户存储可执行 OHOS 原生 ELF'不适用于 Alpine musl 二进制）。修复：换执行路线——新增 _find_loader()（解析 /proc/self/exe、/data/service/hnp/bin/bash 的 PT_INTERP 定位真机 musl loader，[loader, gnatmake, --version] 实测验证）+ _install_wrappers()（OHOS clang 编译原生 ELF 启动器，复制为 wrappers/<tool> 覆盖 usr/bin 与 libexec 全部可执行名，execv(loader, [loader, real, args])，PATH 前置 + GCC_EXEC_PREFIX=wrappers，子进程链全部经 loader 运行）；新增 Alpine musl-1.2.5-r3 apk（libc.musl-aarch64.so.1，sha256 e455c49c... 本地实测）进 LD_LIBRARY_PATH；上游 bar_codes_test 与 test_package 冒烟二进制统一 [loader, exe] 启动；build() 去 env=\"conanbuild\" 防 env 快照丢失工具链变量。测试口径与计数不变。"

homepage: "https://ada-bar-codes.sourceforge.io/"
