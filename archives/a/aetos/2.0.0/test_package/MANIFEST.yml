# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aetos/2.0.0
homepage: "https://www.openstack.org/"

# 上游测试命令 — 官方 stestr 套件经 pytest 真实执行
# (run_upstream.py: pip 隔离安装 14 项 Requires-Dist + stestr/testtools/
# oslotest/WebTest/pytest 到 TMPDIR --target，下载官方 sdist 并 pytest
# aetos/tests；R36 安全：不声明未发布 Conan requires)
upstream_check_command: "python3 run_upstream.py (pytest aetos/tests -v)"
upstream_tests_exist: true

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试（sdist 2.0.0 tag 实测审计）：
# - aetos/tests/unit/test_base_controller.py：8 个 def test_（pytest 执行 8）
# - aetos/tests/functional/test_admin_endpoints.py：9 个 def test_
#   （含 AdminEndpointsErrorCommonTests mixin 3，被 3 个 TestCase 继承，
#   pytest 实际执行 15）
# - aetos/tests/functional/test_core_endpoints.py：27 个 def test_
#   （含 CoreEndpointsErrorCommonTests mixin 6，被 3 个 TestCase 继承，
#   pytest 实际执行 39）
# - def 总数 44；pytest 实际收集 62（8+15+39），框架 pytest（兼容
#   testtools/unittest TestCase，无需 stestr 服务端）
# - 运行依赖：14 项 Requires-Dist + test-requirements
#   （coverage/oslotest/stestr/testtools/WebTest）+ pytest/fixtures，
#   全部经 pip --target 隔离补齐（含 lxml：middleware.py 顶层 import 必需）
upstream_tests:
  - file: aetos/tests/unit/test_base_controller.py
    source: aetos-2.0.0/aetos/tests/unit/test_base_controller.py
    description: "上游单元测试 8 用例（Prometheus client 创建分支，pytest 实测）"
    command: "python3 -m pytest aetos/tests -v --tb=short -p no:cacheprovider"
  - file: aetos/tests/functional/test_admin_endpoints.py
    source: aetos-2.0.0/aetos/tests/functional/test_admin_endpoints.py
    description: "上游功能测试 admin TSDB 端点（def 9，pytest 实际执行 15 含错误矩阵）"
    command: "python3 -m pytest aetos/tests -v --tb=short -p no:cacheprovider"
  - file: aetos/tests/functional/test_core_endpoints.py
    source: aetos-2.0.0/aetos/tests/functional/test_core_endpoints.py
    description: "上游功能测试 core 查询/series/labels/status/targets（def 27，pytest 实际执行 39 含错误矩阵）"
    command: "python3 -m pytest aetos/tests -v --tb=short -p no:cacheprovider"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_aetos.py
    description: "消费者测试 5 检查：import aetos + 包结构 18 文件 + PKG-INFO 版本/14 依赖元数据 + api-paste.ini WSGI 接线 + 重依赖受控降级"
    command: "python3 test_aetos.py <site-packages-dir>"
  - file: run_upstream.py
    description: "上游证据执行器：pip 隔离链 + 官方 sdist + pytest 真实运行并输出 HMBS_UPSTREAM_TEST_RESULT"
    command: "python3 run_upstream.py"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 5
