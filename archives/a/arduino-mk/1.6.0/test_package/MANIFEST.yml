# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: arduino-mk/1.6.0
homepage: "https://github.com/sudar/Arduino-Makefile"

# 上游测试命令分析
# 上游使用 tests/script/runtests.sh 运行测试，需要 Arduino IDE + avr-gcc 工具链
# 无法在 HarmonyOS PC (aarch64) 平台运行
upstream_check_command: "tests/script/runtests.sh"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试无法在 OHOS 平台执行的原因：
# - tests/script/runtests.sh 调用 make TEST=1 编译 Arduino 草图
# - 编译需要 Arduino IDE (avr-gcc 编译器 + Arduino 核心库)
# - 需要 pySerial Python 包
# - 这些是 Arduino 硬件开发工具链，不属于通用 PC 软件包
# - 本软件本质是 .mk 文件和脚本，无 C/C++ 代码需在 OHOS 上编译

upstream_tests:
  - file: tests/script/runtests.sh
    source: arduino-mk-1.6.0/tests/script/runtests.sh
    description: "编译并测试 Arduino 示例草图，需要 Arduino IDE + avr-gcc"
    command: "tests/script/runtests.sh"

# test_package 中自带的测试 (消费者视角验证)
# 验证 .mk 文件、Python 脚本和 man pages 正确安装
test_package_tests:
  - file: test_arduino_mk.py
    description: "验证 .mk 文件内容、脚本可执行性和 man pages 安装"
    command: "python3 test_arduino_mk.py <package_root>"

# 测试断言总数 (验证 6 个 mk 文件 + 2 个脚本 + 2 个 man pages + 内容检查)
assertion_count: 12
