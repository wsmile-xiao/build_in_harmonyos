  - "Waf 2.0.14 bundled with aubio uses imp module (removed in Python 3.12); replace with types/importlib {ref:E098}"
  - "Waf 'rU' file mode removed in Python 3.12; strip 'U' from mode in Utils.readf {ref:E099}"
  - "aubio uses waf build system; configure with --prefix, --disable-jack, --disable-avcodec, --disable-samplerate {ref:E098}"
  - "aubio's built-in ooura FFT works without external fftw3 dependency {ref:E098}"
