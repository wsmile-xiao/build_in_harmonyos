package: avahi-glib/0.9_rc5
homepage: "https://github.com/avahi/avahi"

upstream_check_command: "make -C avahi-glib check"
upstream_test_in_build: true
upstream_test_command: "make -C avahi-glib check"

upstream_tests:
  - file: glib-watch-test.c
    source: avahi-0.9-rc5/avahi-glib/glib-watch-test.c
    description: "Exercises GLib watch and timeout integration without an Avahi daemon"
    command: "./glib-watch-test"

upstream_tests_exist: true
upstream_test_audit:
  - path: "avahi-glib/Makefile.am"
    finding: "TESTS contains one program, glib-watch-test, when tests and GLib support are enabled"
  - path: "avahi-gobject/Makefile.am"
    finding: "Builds libavahi-gobject and generated enum/marshal sources but declares no upstream TESTS target"

test_package_tests:
  - file: test.c
    description: "Consumer test for AvahiGLibPoll timeout dispatch and GaClient GObject type registration"
    command: "ctest --output-on-failure -R test_avahi_glib"

assertion_count: 8
