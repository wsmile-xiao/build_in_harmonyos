software: any-lite
# 版本级 manifest
# 文件位置: archives/a/any-lite/0.3.0.2/manifest.yaml

version: "0.3.0.2"
upstream_version: "0.3.0"
status: published
build_date: "2026-09-24"
build_system: cmake

source:
  url: "https://github.com/martinmoene/any-lite/archive/refs/tags/v0.3.0.tar.gz"
  sha256: "fa7087ef7b4455c00b4b715649eb7176d6d0806c3a57cd4734845611ebe9888e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DANY_LITE_OPT_BUILD_TESTS=ON"
    - "-DANY_LITE_OPT_BUILD_EXAMPLES=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cpp98-algorithm-swap.patch"

# 上游测试四类数字（口径见 notes.md「上游测试统计」节）
# 1) 上游源码静态声明: 46 个 lest CASE（any.t.cpp 40 功能 + any-main.t.cpp 6 诊断）
# 2) 官方套件实际执行: ctest 4 变体 (cpp98/cpp11/cpp14/cpp17) × 每变体 40 个默认选中用例,
#    全部通过（All 40 selected tests passed × 4; ctest 100% tests passed, 0 failed out of 4）
# 3) 未执行/跳过: 每变体 6 个 [.tag] 隐藏诊断用例（上游 lest 有意默认不选, 非平台原因）
# 4) 新增 test_package 消费者测试: 2 个程序 10 个断言, 全部通过

