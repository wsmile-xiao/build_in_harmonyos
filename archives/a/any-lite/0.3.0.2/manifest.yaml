knowledge_gained:
  - "R37 版本冲突：制品仓已发布 0.3.0（bootstrap 草稿配方）与 0.3.0.1（8-31 归档），cnb.cool 不支持同版本多 revision，适配修复须递增版本号后缀至 0.3.0.2"
  - "R40 分支名门禁：分支名须以不含 v 的 包名-版本号 结尾（如 feat/any-lite-0.3.0.2），认领时任务平台的提示分支名带 v 前缀（feat/any-lite-v0.3.0）会触发 L0n 拦截"
  - "any-lite 0.3.0 是 header-only 库（CMake INTERFACE library），无任何依赖，仅头文件 include/nonstd/any.hpp"
  - "上游仓库 martinmoene/any-lite 已跳转到 nonstd-lite/any-lite 组织（301 永久重定向）"
  - "CMake 命名空间：nonstd::any-lite；C++17 下默认 any_CONFIG_SELECT_ANY=any_ANY_DEFAULT 自动选 std::any"
  - "上游测试使用 lest 框架（内置于 test/lest_cpp03.hpp，无需网络）：46 个静态 CASE，其中 6 个带 [.tag] 隐藏标签默认不执行，每变体默认执行 40 个"
  - "clang 下 CTest 构建 4 个变体: cpp98/cpp11/cpp14/cpp17，40 个功能用例无条件注册于全部变体（C++11-only 断言体内部条件编译）"
  - "E092: CMake 不识别 OHOS，需 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=armv8"
  - "上游 any.hpp 仅 C++17 分支 include <utility>，cpp98 变体在新工具链上因 std::swap 未声明而编译失败；C++98 中 std::swap 声明于 <algorithm>，补丁补该头文件"
  - "上游 CMake install 不安装 LICENSE.txt，配方 package() 显式 copy 到 licenses/"
