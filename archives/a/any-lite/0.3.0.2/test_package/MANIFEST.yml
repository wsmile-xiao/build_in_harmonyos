# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: any-lite/0.3.0.2
homepage: "https://github.com/martinmoene/any-lite"

upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: lest 框架（内置于 test/lest_cpp03.hpp）, 4 个 CTest 可执行文件 (cpp98/cpp11/cpp14/cpp17)。
# conanfile.py build() 中的 cmake.test() 会在可运行的 profile 上一次执行全部四项。
upstream_test_count: 4
upstream_ctest_variants:
  - name: test-cpp98
    command: "ctest -R '^test-cpp98$'"
  - name: test-cpp11
    command: "ctest -R '^test-cpp11$'"
  - name: test-cpp14
    command: "ctest -R '^test-cpp14$'"
  - name: test-cpp17
    command: "ctest -R '^test-cpp17$'"

upstream_tests:
  - file: test/any.t.cpp
    source: any-lite-0.3.0/test/any.t.cpp
    description: "any 核心单元测试 (40 个 lest 功能用例: 构造/赋值/emplace/swap/any_cast/bad_any_cast/tweak header), 无条件注册于全部 4 个变体"
    command: "ctest --output-on-failure -R '^test-cpp(98|11|14|17)$'"
  - file: test/any-main.t.cpp
    source: any-lite-0.3.0/test/any-main.t.cpp
    description: "6 个 [.tag] 隐藏诊断用例 (版本/配置/编译器特性报告, lest 默认不选中) + lest 主函数入口"
    command: "ctest --output-on-failure -R '^test-cpp(98|11|14|17)$'"

consumer_test_count: 2
test_package_tests:
  - file: test_any_lite.cpp
    description: "C++17 消费者测试 (默认 std::any 模式): 4 个断言 — any 构造/any_cast/has_value API"
    command: "./test_any_lite"
  - file: test_any_lite_cpp11.cpp
    description: "C++11 消费者测试 (nonstd 回移实现): 6 个断言 — any_cast 值/指针、type()、has_value()、bad_any_cast 异常路径"
    command: "./test_any_lite_cpp11"

assertion_count: 10
