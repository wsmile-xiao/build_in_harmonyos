software: acl
display: "ACL"
description: "Access Control Lists - Extended file permissions for Linux"
category: system
homepage: "https://savannah.nongnu.org/projects/acl"
license: LGPL-2.1
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 attr 库支持（Extended Attributes）"
    - "HMDFS 文件系统限制：需要设置 TMPDIR=$HOME/tmp"
    - "需要最新版 config.sub 支持 ohos 操作系统"
    - "需要设置 LDFLAGS 和 CFLAGS 指向本地安装路径"
  common_dependencies:
    - attr

versions:
  "2.3.2":
    status: published
    build_date: "2026-06-09"