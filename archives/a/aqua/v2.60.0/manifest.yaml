software: aqua
# 版本级 manifest
# 文件位置: archives/a/aqua/v2.60.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "v2.60.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-09"

# 编译日期（submit 自检要求字段）
compile_date: "2026-08-09"

# 构建系统类型（验证脚本必检字段）
build_system: go

# ============================================================
# 源码信息
# ============================================================

source:
  # 预编译二进制下载 URL (aquaproj 官方 GitHub releases)
  url: "https://github.com/aquaproj/aqua/releases/download/v2.60.0/aqua_linux_arm64.tar.gz"

  # 源码校验和
  sha256: "695e04849161feced95cda06f37f8032287168b19b6eebf2c75c8fe0069e23d1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GOPROXY=https://goproxy.cn,direct"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 备注：Go linker在HarmonyOS上因mmap权限问题无法工作
  # 使用aquaproj官方预编译二进制(GitHub releases)
  build_method: prebuilt-binary

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表 (conan recipe 不应用补丁，使用预编译二进制)
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go linker在HarmonyOS上因mmap权限问题无法工作，使用预编译二进制替代"
  - "aqua官方提供linux_arm64预编译二进制，可ELF签名后在OHOS上运行"
