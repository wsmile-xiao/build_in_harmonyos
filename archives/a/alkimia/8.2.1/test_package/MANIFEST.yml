# test_package/MANIFEST.yml
# Upstream and consumer test declaration for alkimia/8.2.1.

package: alkimia/8.2.1
homepage: https://invent.kde.org/office/alkimia

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E <network-dependent tests>"

upstream_tests:
  - file: autotests/
    source: alkimia-8.2.1/autotests/
    description: "Alkimia upstream CTest/autotests suite (12 registered targets with BUILD_TESTING=ON default shape)"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON; 3 network-dependent targets (alkonlinequotestest / alkdownloadengine-qt-test / alknewstuffenginetest) are exempted from the offline sandbox run via ctest -E because they fetch https://kmymoney.org/onlinequotestest.php and https://autoconfig.kde.org/ocs/providers.xml; TZ=UTC is injected because upstream testParseQuoteJson feeds UTC-day-boundary timestamps"

test_package_tests:
  - file: test_package/test_package.cpp
    description: "Consumer smoke verifies AlkValue arithmetic (int ctor, operator+, toString), the GMP mpq_class conversion path (convertDenominator) and the double ctor path."
    command: "conan create (test_package builds and runs test_package)"

assertion_count: 3
