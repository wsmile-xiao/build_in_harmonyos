package: alkimia
version: 8.2.1
status: built
build_system: cmake
language: cpp
description: "KDE financial library - common financial data services (online quotes, GMP-backed AlkValue, KNewStuff store) for applications like KMyMoney"
homepage: https://invent.kde.org/office/alkimia
upstream_source: https://download.kde.org/stable/alkimia/8.2.1/alkimia-8.2.1.tar.xz
license: LGPL-2.1-or-later

dependencies:
  - qtbase-sql-dbus/6.11.1
  - qtdeclarative/6.11.1
  - gmp/6.3.0.1
  - knewstuff/6.29.0.1
  - kcompletion/6.18.0
  - kiconthemes/6.18.0
  - kxmlgui/6.18.0
  - kconfigwidgets/6.18.0
  - kguiaddons/6.18.0
  - kcolorscheme/6.18.0
  - kitemviews/6.18.0
  - kconfig/6.18.0
  - kcoreaddons/6.18.0
  - ki18n/6.18.0
  - kcodecs/6.18.0
  - kwidgetsaddons/6.18.0
  - ecm/6.26.0 (tool)

build_tools:
  - cmake
  - ecm/6.26.0

test_results:
  upstream: "9/12 passed locally (3 network-dependent tests exempted: alkonlinequotestest / alkdownloadengine-qt-test / alknewstuffenginetest; see notes.md)"
  test_package: "1/1 passed (AlkValue arithmetic + GMP mpq convertDenominator + double ctor paths)"

platform_adaptations:
  - "BUILD_WITH_QT6=ON, BUILD_APPLETS=OFF (plasma unpublished), ENABLE_FINANCEQUOTE=OFF (perl)"
  - "0001-ohos-remove-ktextwidgets-dep.patch: KTextEdit->QTextEdit downgrade (ktextwidgets unpublished in compatible version), FindGMP gmpxx support, E537 relocatable bare -l linking + SONAME"

known_issues:
  - "Upstream testParseQuoteJson is timezone-dependent (UTC-day-boundary timestamps); TZ=UTC injected in test env -> 9/9 passed"
