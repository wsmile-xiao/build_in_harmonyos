software: angelscript
display: "AngelScript"
description: "AngelCode Scripting Library — flexible cross-platform scripting engine for game applications"
category: devel
homepage: "https://www.angelcode.com/angelscript/"
license: Zlib
build_system: custom

ohos_adaptation:
  key_points:
    - "官方 SDK zip 直链可作 conan 源（zip 格式，strip_root 去 sdk/ 顶层）"
    - "直编路径：33 通用编译单元 + arm64 专属 as_callfunc_arm64.cpp/.S，llvm-ar 归档，零补丁"
    - "as_config.h 原生识别 OHOS clang（__linux__ 非 __ANDROID__ 分支），AS_ARM64 原生调用约定激活"
    - "零外部依赖（pthread 已并入 OHOS musl libc）"
  common_dependencies: []

versions:
  "2.37.0":
    status: built
    build_date: "2026-10-05"
    format: conan
    conan_ref: "angelscript/2.37.0"
    note: "直编配方；静态库；上游无随包测试（N=0），test_package 消费者测试 5/5"
