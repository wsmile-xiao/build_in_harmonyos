# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: angelscript/2.37.0
homepage: "https://www.angelcode.com/angelscript/"

# 上游测试命令
# 上游 SDK（官方 zip 归档）不含测试套件：
#   - sdk/ 下无 test/ 或 tests/ 目录
#   - 上游 CMakeLists（projects/cmake）无 enable_testing()/add_test()
#   - add_on/ 与 samples/ 为示例代码（asrun 等 sample main），非断言型测试
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（N=0，无随包自动化测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test_engine.cpp"
    description: "引擎创建/释放往返断言：asCreateScriptEngine(ANGELSCRIPT_VERSION=23700) 非空 + asGetLibraryVersion() 含 2.37.0 + 脚本模块编译与执行返回 42（as_callfunc_arm64 原生调用约定实跑）+ Release 无崩溃 + 二次创建/释放往返"
    command: "./test_engine"

# 测试断言总数 (test_engine.cpp 内 PASS 断言计数)
assertion_count: 5
