# 版本级 manifest — angelscript 2.37.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.37.0"
software: "angelscript"
status: built
build_date: "2026-10-05"
build_system: custom              # 直编（direct compile + llvm-ar 归档），非上游 cmake/autotools 路径

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.angelcode.com/angelscript/sdk/files/angelscript_2.37.0.zip"
  sha256: "0c52d1688016a0b2484e9ca549471c4e295df060770c57840144c64815f54f10"
  tar_format: zip                 # 官方 SDK 归档为 zip（非 tar.gz）

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom
  configure_options: []
  dependencies: []                # 零外部依赖（pthread 已并入 OHOS musl libc）
  cc: clang
  cxx: clang++
  notes: |
    直编路径（smaz/pqclean/abc/aklomp-base64 先例）：
    33 个通用编译单元 + arm64 专属 as_callfunc_arm64.cpp/.S（-x assembler-with-cpp）
    = 35 编译单元，clang++ -std=c++17 -O2 -fPIC -DANGELSCRIPT_EXPORT -D_LIB，
    llvm-ar rcs 归档 + llvm-ranlib。c++17（profile 编译器标准），无补丁。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []               # 零补丁：OHOS 无需任何源码改动（as_config.h 原生识别 OHOS clang）

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: consumer
  total: 5
  passed: 5
  failed: 0
  note: |
    上游 SDK 无随包测试套件（N=0：无 test/ 目录、CMakeLists 无 add_test、
    add_on//samples/ 为示例非断言测试）。test_package 消费者测试 5/5 PASS：
    引擎创建（版本 23700 匹配）+ 版本串 2.37.0 + 脚本编译执行返回 42
    （原生 arm64 调用约定实跑）+ Release 无崩溃 + 二次创建/释放往返。

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues: []
  notes: |
    - as_config.h 原生走 __linux__ 分支（__ANDROID__ 未定义）+ AS_ARM64 +
      AS_POSIX_THREADS，原生调用约定激活（非 AS_MAX_PORTABILITY 降级）
    - x86/x64_msvc/mingw/mips/ppc/sh4/xenon/riscv64 文件有宏守卫，非目标
      平台编译为空目标（上游 CMakeLists 同样全编）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游官方 SDK zip 直链（angelcode.com）可直接作为 conan 源（get() 支持 zip，strip_root 去 sdk/ 顶层）"
  - "as_config.h 以 __linux__&&!__ANDROID__ 识别 OHOS（clang 定义 __linux__ 不定义 __ANDROID__），无需补丁"
  - "arm64 原生调用约定依赖 as_callfunc_arm64_gcc.S 汇编（-x assembler-with-cpp 编译），符号 CallARM64*/GetHFAReturn* 由 as_callfunc_arm64.cpp extern 引用"

references:
  - https://www.angelcode.com/angelscript/
  - https://gitlab.com/angelcode/angelscript
