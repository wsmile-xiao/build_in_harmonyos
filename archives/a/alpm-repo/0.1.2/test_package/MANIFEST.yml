package: alpm-repo/0.1.2
homepage: "https://alpm.archlinux.page"

upstream_check_command: "cargo test --release --locked --features cli --no-fail-fast --lib --bins --tests"
upstream_test_in_build: true
upstream_test_command: "cargo test --release --locked --features cli --no-fail-fast --lib --bins --tests"

upstream_tests:
  - file: src/desc
    description: "alpm-repo-desc parser, formatter, and schema tests"
    command: "cargo test --release --locked --features cli --no-fail-fast --lib --bins --tests"
  - file: src/files
    description: "alpm-repo-files parser, formatter, and path validation tests"
    command: "cargo test --release --locked --features cli --no-fail-fast --lib --bins --tests"
  - file: tests/files_cli.rs
    description: "alpm-repo-files CLI integration tests"
    command: "cargo test --release --locked --features cli --no-fail-fast --lib --bins --tests"
  - file: tests/integration.rs
    description: "alpm-repo-desc CLI integration tests"
    command: "cargo test --release --locked --features cli --no-fail-fast --lib --bins --tests"
  - file: tests/parse_errors.rs
    description: "parse error fixture tests for desc and files formats"
    command: "cargo test --release --locked --features cli --no-fail-fast --lib --bins --tests"

test_package_tests:
  - file: conanfile.py
    description: "CLI smoke tests for alpm-repo-desc and alpm-repo-files help paths"
    command: "conan test test_package alpm-repo/0.1.2"
  - file: test_cli.py
    description: "Shared CLI test data and executable magic assertions for packaged binaries"
    command: "conan test test_package alpm-repo/0.1.2"

assertion_count: 4
