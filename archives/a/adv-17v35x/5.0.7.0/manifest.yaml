knowledge_gained:
  - "adv-17v35x 为 Advantech ACOM 系列（EXAR 芯片组）PCIe 多串口卡 Linux 驱动，核心为内核驱动模块（adv17v35x.c + 顶层 Makefile，需 KERNEL_SRC 内核头文件树），鸿蒙 PC 无内核构建环境，无法构建内核模块"
  - "包内 getconfig 为纯 C 用户态工具（查询串口模式），仅依赖标准 C 头 + linux/serial.h + asm/ioctls.h（OHOS sysroot 提供），已用 `/data/service/hnp/bin/clang` 裸编译验证通过（arm64 OHOS ELF）"
  - "本归档按 application 包交付用户态工具 getconfig；内核驱动模块部分作为真实外部限制在 notes 与 PR 正文中如实说明，不做伪造"