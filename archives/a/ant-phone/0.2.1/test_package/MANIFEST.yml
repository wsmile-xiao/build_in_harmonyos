# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ant-phone/0.2.1
homepage: "http://www.nongnu.org/ant-phone/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 该上古 Autotools 项目无 make check / TESTS / check_PROGRAM / test 目录
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (本项目无自动化测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# ant-phone 是 GTK2 GUI 应用，无显示环境下仅 --version 可无头冒烟
# （patches/0002 在 gtk_init() 前处理 --version）；--help 需显示环境，不纳入
test_package_tests:
  - file: test.sh
    description: "消费者冒烟：--version 无头打印版本"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
