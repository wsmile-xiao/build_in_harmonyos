# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/ant-phone/ant-phone-0.2.1.tar.gz"

  # 源码校验和（本地核验）
