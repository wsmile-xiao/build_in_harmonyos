# conandata.yml — aghermann 1.1.2
# 官方源: johnhommer.com (上游官网, R39)
# sha256 为下载 tarball 实测值

sources:
  url: "https://johnhommer.com/academic/code/aghermann/source/aghermann-1.1.2.tar.xz"
  sha256: "1d69487581abd80fe414c4165b790be9e6b33660cc674016a55fa10d4435ffa4"

patches:
  - patch_file: "patches/0003-acinclude.m4.patch"
    patch_description: "补 AX_PATH_GSL 宏实现（现代 autoconf-archive 已移除，configure.ac:69 级联失败）"
    patch_type: "portability"
  - patch_file: "patches/0006-config.guess.patch"
    patch_description: "config.guess OHOS 平台识别（2013 版无法识别 aarch64-*-ohos；最小补丁：__OHOS__ libc 探针 + HarmonyOS 平台分支）"
    patch_type: "portability"
  - patch_file: "patches/0008-config.sub.patch"
    patch_description: "config.sub OHOS 系统类型"
    patch_type: "portability"
  - patch_file: "patches/0011-data-ui-Makefile.am.patch"
    patch_description: "gresource 规则加 --sourcedir/--target（上游为 in-tree 假设，conan out-of-tree 构建找不到 xml）"
    patch_type: "portability"
  - patch_file: "patches/0027-src-aghermann-expdesign-expdesign.cc.patch"
    patch_description: "canonicalize_file_name -> realpath(path,NULL)（musl 无 glibc 私有函数）"
    patch_type: "portability"
  - patch_file: "patches/0029-src-common-log-facility.hh.patch"
    patch_description: "补 #include <sys/time.h>（musl 下 timeval 未声明）"
    patch_type: "portability"
  - patch_file: "patches/0031-src-libmetrics-mc-artifacts.cc.patch"
    patch_description: "detect_artifacts 显式实例化移到 estimate_E 特化之后（clang 15 特化顺序）"
    patch_type: "portability"
  - patch_file: "patches/0033-src-libsigfile-edf.cc.patch"
    patch_description: "写构造器 mmap MAP_PRIVATE -> MAP_SHARED（上游 bug：prune 输出全零）"
    patch_type: "bugfix"
  - patch_file: "patches/0034-src-libsigfile-edf.hh.patch"
    patch_description: "移除 C++17 已废弃的动态异常规范 throw(TStatus)（clang15 报错）"
    patch_type: "portability"
  - patch_file: "patches/0035-src-libsigfile-page.cc.patch"
    patch_description: "mem_fun_ref 在 C++17 已移除 -> std::mem_fn（4 处）"
    patch_type: "portability"
  - patch_file: "patches/0038-src-tools-edfcat.cc.patch"
    patch_description: "移除 C++17 已废弃的动态异常规范 throw(invalid_argument)（7 处）"
    patch_type: "portability"
  - patch_file: "patches/0039-src-tools-edfhed.cc.patch"
    patch_description: "canonicalize_file_name -> realpath(path,NULL)（musl）"
    patch_type: "portability"
  - patch_file: "patches/0041-data-ui-Makefile.in.patch"
    patch_description: "gresource 规则加 --sourcedir/--target 直接修正 data/ui/Makefile.in（CI 无 automake，不能依赖 autoreconf 重生成；与 0011 Makefile.am 补丁对应）"
    patch_type: "portability"
