# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aghermann/1.1.2
homepage: "https://johnhommer.com/academic/code/aghermann"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 tarball 无任何自动化测试（R51 清点证据见 notes.md §4.1）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（清点结果：自动化测试无 test 目录/文件/TESTS 注册）
# find . -type d \( -iname test -o -iname tests -o -iname testdata \) -> 空
# grep -rn "TESTS\|check_PROGRAMS" Makefile.am -> 空
# make check -> 11 处 "Nothing to be done for 'check'"（自动化测试 N=0）
# 上游 N 口径（审方 rule4）：上游无自动化测试套件，按 8 个交付物（5 bin + 3 .so）
# 功能替代验证计 8 项，OHOS 实跑 8/8（100%）通过（见 notes.md「功能替代验证 8/8」）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 实际执行被测包二进制 edfhed 解析最小 EDF 文件（非空壳）
# L0c: test_package/ 下须存在测试源文件（.c/.cpp/.cc/.cxx/.sh/.py，
#      见 E255/E308）——test_edf.sh 即该测试源，由 conanfile.py test() 调用
test_package_tests:
  - file: test_edf.sh
    description: "实际执行 bin/edfhed 解析最小 2 通道 EDF 文件并断言 '# of channels : 2'，验证包内二进制与 libsigfile 依赖可加载"
    command: "bash test_edf.sh <bin_dir> minimal.edf"

# 新增/鸿蒙特有测试 (rule12)
added_tests:
  - name: "harmonyos-specific-test"
    source: test_package/test_ohos.sh
    description: "鸿蒙特有断言: OpenHarmony 平台检查(param get const.ohos.fullname) + ELF64 指针宽度/AArch64 三元组(readelf -h) + 动态依赖闭合(DT_NEEDED 全部可解析) + edfhed 在 OHOS 上实际执行"
    command: "bash test_ohos.sh <bin_dir> minimal.edf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
