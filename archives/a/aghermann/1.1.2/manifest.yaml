# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "musl 无 glibc 私有函数 canonicalize_file_name，用 realpath(path,NULL) 替代"
  - "musl 下 timeval 需显式 #include <sys/time.h>（glibc 恰好可用）"
  - "clang 15 对显式实例化在特化之前的顺序报错，需调整声明位置"
  - "CEDFFile 写构造器 mmap 用 MAP_PRIVATE 导致输出全零，须 MAP_SHARED（上游 bug）"
  - "OHOS 无 glibc argp，edfhed/agh-profile-gen 需 argp-standalone"
  - "gtk 二进制依赖图解析为 glib/2.84.0.1 + cairo/1.18.4，勿显式指定冲突版本"

