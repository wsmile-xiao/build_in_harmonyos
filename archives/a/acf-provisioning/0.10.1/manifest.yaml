# 版本级 manifest — acf-provisioning 0.10.1
# 遵循 ARCHIVE-SPEC v2.0

version: "0.10.1"
software: "acf-provisioning"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-16"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方源：Alpine ACF 上游仓库（gitlab.alpinelinux.org）
  # 注：gitlab.alpinelinux.org 对 Conan 默认 UA 返回 418，conanfile.py source()
  #     使用 curl 风格 UA 获取官方源码（R39 保持官方 URL）
  url: "https://gitlab.alpinelinux.org/acf/acf-provisioning/-/archive/v0.10.1/acf-provisioning-v0.10.1.tar.gz"
  sha256: "822706952ac63ea37a6cbd7be82f9380856fe7281b93f2a05281cec70fbe28dd"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型：单一递归 Makefile（pure-Lua，无 C 编译）
  system: makefile
  configure_options: []
  # 编译依赖列表（格式: name/version）
  dependencies:
    - acf-core/0.24.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "acf-provisioning 是纯 Lua ACF 模块（provisioning-controller.lua/model.lua/scripts.lua + 30 个 lsp 视图 + cgi-bin），make all 为空操作，make install DESTDIR 将文件复制到 usr/share/acf/app/provisioning、etc/provisioning、var/www/provisioning/htdocs/cgi-bin 与 etc/logrotate.d"
  - "Makefile 仅用 cp -a/mkdir -p/chmod（无 coreutils install），OHOS 上无需补丁"
  - "gitlab.alpinelinux.org 对 Conan 默认 UA 返回 HTTP 418（反爬），curl UA 正常；conanfile.py source() 用 get(headers={'User-Agent': 'curl/8.5.0'}) 保持官方 URL（R39）"
  - "运行时依赖 acf-core/0.24.1（mvc.lua 分发），conanfile requirements() 声明之；与本系列 acf-db/acf-nsd 配方一致"
  - "上游无测试套件（aports 未声明 test），test_package 以文件存在性 + Lua 语法校验（luac -p）验证包装完整性（R34：实质验证而非空壳）"
