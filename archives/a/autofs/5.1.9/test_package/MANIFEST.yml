# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: autofs/5.1.9
homepage: "https://www.kernel.org/pub/linux/daemons/autofs/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 经全面搜索确认：autofs 5.1.9 上游无任何测试用例
# （无 test/tests/regress 目录，Makefile.am 无 check/test 目标，README/CHANGELOG 无测试说明）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证打包产物完整性：automount 二进制、libautofs.so 可 dlopen、核心模块可加载"
    command: "./test_autofs <package_root>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6