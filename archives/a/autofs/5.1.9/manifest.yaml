software: autofs
version: 5.1.9
status: built
build_date: 2026-08-23
build_system: autotools

configure_options:
  - --build=aarch64-unknown-linux-ohos
  - --with-libtirpc
  - --with-path=/data/service/hnp/bin:/storage/Users/currentUser/usr/local/bin:/usr/bin:/bin
  - --disable-gssapi
  - --disable-ldap
  - --disable-sasl
  - --disable-nisplus
  - --without-hesiod
  - --without-systemd

dependencies:
  - libtirpc/1.3.7

build_artifacts:
  - sbin/automount
  - lib/libautofs.so
  - lib/autofs/*.so (16 modules)

install_prefix: /storage/Users/currentUser/usr/local

notes: |
  autofs 5.1.9 在 OHOS 上的适配：
  1. /proc 检测：HarmonyOS ostype 导致 HAVE_LINUX_PROCFS 未定义，automount.h 加 __OHOS__ 豁免
  2. HMDFS：config.status 的 umask 077 导致 Permission denied，build() 内 Python 改为 000
  3. pthread 线程取消 API：OHOS SDK libc 缺 pthread_cancel 等，新增 ohos_pthread_shim.c（TLS+注册表延迟取消）
  4. 链接顺序：-lautofs 需在 -lpthread 之前
  5. toybox patch 对修改现有文件不可靠，适配逻辑集中在 conanfile.build() Python 实现
  依赖 libtirpc 1.3.7 已适配（PR #6158），发布后本配方切换为制品仓版本

knowledge_gained:
  - HarmonyOS /proc ostype 为 "HarmonyOS"，autotools 检测需豁免
  - HMDFS umask 077 临时目录权限问题
  - OHOS SDK sysroot libc 缺 POSIX 线程取消 API
  - toybox patch 修改现有文件 hunk 不可靠（静默失败）

patch_generation:
  method: per-file-difflib
  patches_count: 1
  patch_classification:
    - file: 0004-lib-ohos_pthread_shim.c.patch
      type: auto
      platform_only: True
      guard: 'ohos'