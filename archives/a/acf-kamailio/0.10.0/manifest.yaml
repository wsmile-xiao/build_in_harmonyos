# 版本级 manifest — acf-kamailio 0.10.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.10.0"
software: "acf-kamailio"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-19"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方源：Alpine distfiles 正式分发镜像（gitlab.alpinelinux.org 在构建网络被 418 拦截）
  url: "https://distfiles.alpinelinux.org/distfiles/v3.24/acf-kamailio-v0.10.0.tar.gz"
  sha256: "74dfbf80554b195f188dd71a240cb9aa48c8384738a9e17bc13343fb2b8a4a37"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型：单一递归 Makefile（pure-Lua，无 C 编译）
  system: makefile
  configure_options: []
  # 编译依赖列表（格式: name/version）
  dependencies:
    - acf-core/0.24.1
    - acf-db/0.2.1
    - acf-lib-lua5.4/0.11.1
    - luaposix/36.3.1.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "acf-kamailio 是纯 Lua ACF 模块（kamailio-controller.lua/kamailio-model.lua + .menu/.roles + .lsp 视图），make all 为空操作"
  - "上游 Makefile 的 install 目标枚举 $(acflibdir)/db-*.lsp 创建 symlink，且 tarball 含两个悬空相对 symlink（kamailio-edit-html.lsp -> ../filedetails-html.lsp、kamailio-status-html.lsp -> ../status-html.lsp）；recipe 绕过 make install 手动打包"
  - "跨 Conan 包无法用相对 symlink 解析 acf-core 的共享视图；改为从 acf-core 的 share/acf/app/ 复制 filedetails-html.lsp / status-html.lsp 并重命名为 kamailio-*.lsp（功能等价）"
  - "运行时依赖 acf-core/0.24.1（mvc.lua + modelfunctions）、acf-db/0.2.1（dbcontrollerfunctions.lua/dbmodelfunctions.lua）、acf-lib-lua5.4/0.11.1（acf.fs/acf.format/acf.validator/acf.db）、luaposix/36.3.1.1（posix）"
  - "acf.fs/acf.format/acf.validator/acf.db 归属 acf-lib-lua5.4 而非 acf-core（易错点）"
  - "上游无测试套件，test_package 以文件存在性 + Lua 语法校验（luac -p）验证包装完整性"
