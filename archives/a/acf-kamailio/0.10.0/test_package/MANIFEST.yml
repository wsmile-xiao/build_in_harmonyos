# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: acf-kamailio/0.10.0
homepage: "https://gitlab.alpinelinux.org/acf/acf-kamailio"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 Makefile 无 check/test 目标；aports APKBUILD 未声明 test
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# acf-kamailio 0.10.0 上游无测试套件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_acf_kamailio.sh
    description: "验证 acf-kamailio 纯 Lua 模块包装完整性：必需文件存在（app/kamailio/）、视图文件存在、Lua 语法有效、控制器/模型内容正确引用 acf-db 依赖"
    command: "sh test_acf_kamailio.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 4 必需文件 + 5 视图文件 + 2 Lua 语法检查 + 3 内容检查 = 14
assertion_count: 14
