sources:
  "1.2.12":
    url: "https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.12.tar.bz2"
    sha256: "4868cd908627279da5a634f468701625be8cc251d84262c7e5b6a218391ad0d2"
patches:
  "1.2.12":
    - patch_file: "patches/0001-config-guess-ohos.patch"
      patch_description: "0001 config guess: recognize HarmonyOS and emit aarch64-linux-ohos"
      patch_type: "portability"
    - patch_file: "patches/0002-config-sub-ohos.patch"
      patch_description: "0002 config sub: accept linux-ohos kernel-os tuple"
      patch_type: "portability"
    - patch_file: "patches/0003-src-conf-glibc-guard.patch"
      patch_description: "0003 src/conf.c: use alphasort64 on non-glibc libc (OHOS musl has no versionsort64)"
      patch_type: "portability"
    - patch_file: "patches/0004-src-ucm-parser-glibc-guard.patch"
      patch_description: "0004 src/ucm/parser.c: use alphasort64 on non-glibc libc (OHOS musl has no versionsort64)"
      patch_type: "portability"
    - patch_file: "patches/0005-test-pcm-multi-thread-ohos.patch"
      patch_description: "0005 test/pcm-multi-thread.c: guard pthread_cancel availability (OHOS musl lacks it)"
      patch_type: "portability"
    - patch_file: "patches/0006-pcm-null-capture-ohos.patch"
      patch_description: "0006 src/pcm/pcm_null.c: fall back to /dev/zero when /dev/full is unavailable"
      patch_type: "portability"
    - patch_file: "patches/0007-libtool-version-override.patch"
      patch_description: "0007 libtool version override: allow OHOS shared libraries to build unversioned"
      patch_type: "portability"
    - patch_file: "patches/0008-materialized-include-alias-ohos.patch"
      patch_description: "0008 configure: on OHOS expect the materialized include/alsa directory instead of recreating the symlink (HMDFS remove-then-create safe strategy)"
      patch_type: "portability"
    - patch_file: "patches/0009-config-status-hmdfs-umask.patch"
      patch_description: "0009 configure config.status: create temp dirs with umask 022 instead of 077 (HMDFS permission semantics)"
      patch_type: "portability"