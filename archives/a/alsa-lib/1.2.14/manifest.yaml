knowledge_used:
  - "E007 (config.guess cannot recognise HarmonyOS) -> patches/0001-config-guess-ohos.patch"
  - "E072 (config.sub rejects the ohos triplet) -> patches/0002-config-sub-ohos.patch"
  - "E127 (HarmonyOS has no pthread_cancel) -> patches/0004-pcm-multi-thread-ohos.patch"
  - "E050 (HMDFS cannot track symlinks) -> patches/0005-materialized-include-alias-ohos.patch"
  - "E129 (umask 077 breaks config.status temporary directories on HMDFS) -> patches/0006-config-status-hmdfs-umask.patch"
  - "E136 (config.status could not setup config files machinery) -> patches/0006-config-status-hmdfs-umask.patch"
  - "E330/E331 (versioned shared-library symlinks fail on OHOS) -> patches/0003-libtool-version-override.patch"
  - "E228 (Libtool wrapper on HMDFS) -> patches/0003-libtool-version-override.patch"

knowledge_gained:
  - "OHOS libc declares scandir64, alphasort64 and struct dirent64 but not versionsort64, so the _GNU_SOURCE branch of the Autotools SORTFUNC selection must be skipped. Upstream alsa-lib fixes this with !defined(__OHOS__) from 1.2.15 onwards; 1.2.14 predates it. Evidence: probes/dirent64_symbols.c. (reference: probes/dirent64_symbols.c, patches/0008-dirent64-sortfunc-guard-ohos.patch)"
  - "OHOS exposes /dev/full as an unreadable node (open(O_RDONLY) returns EACCES), so the ALSA null capture plug-in needs a /dev/zero fallback before snd_pcm_open(\"null\") can be used for capture. (reference: notes.md#遇到的问题与解决方案, patches/0007-pcm-null-capture-ohos.patch)"
