sources:
  "1.2.14":
    url: "https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.14.tar.bz2"
    sha256: "be9c88a0b3604367dd74167a2b754a35e142f670292ae47a2fdef27a2ee97a32"
patches:
  "1.2.14":
    - patch_file: "patches/0001-config-guess-ohos.patch"
      patch_description: "0001 recognize the HarmonyOS kernel in config.guess"
      patch_type: "portability"
    - patch_file: "patches/0002-config-sub-ohos.patch"
      patch_description: "0002 accept the aarch64 linux-ohos triple in config.sub"
      patch_type: "portability"
    - patch_file: "patches/0003-libtool-version-override.patch"
      patch_description: "0003 override the libtool version-info flag from the make command line"
      patch_type: "portability"
    - patch_file: "patches/0004-pcm-multi-thread-ohos.patch"
      patch_description: "0004 detect pthread_cancel before using it in pcm-multi-thread"
      patch_type: "portability"
    - patch_file: "patches/0005-materialized-include-alias-ohos.patch"
      patch_description: "0005 retain the materialized include alias on OHOS"
      patch_type: "portability"
    - patch_file: "patches/0006-config-status-hmdfs-umask.patch"
      patch_description: "0006 keep config.status temporary directories writable on HMDFS"
      patch_type: "portability"
    - patch_file: "patches/0007-pcm-null-capture-ohos.patch"
      patch_description: "0007 fall back to the readable zero device when /dev/full is unavailable"
      patch_type: "portability"
    - patch_file: "patches/0008-dirent64-sortfunc-guard-ohos.patch"
      patch_description: "0008 skip the GNU versionsort64 branch on OHOS where the symbol is absent"
      patch_type: "portability"
