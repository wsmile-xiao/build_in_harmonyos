version: "1.2.0"
status: built
build_date: "2026-07-02"
conan_ref: "avfs/1.2.0@ohpcd/stable"

source:
  url: "https://downloads.sourceforge.net/project/avf/avfs/1.2.0/avfs-1.2.0.tar.bz2"
  sha256: "a25a8ec43c1ee172624e1a4c79ce66a1b930841cdb545b725f1ec64bcabe889c"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--prefix=${PREFIX}"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-mktemp-fix.patch"

knowledge_gained:
  - "E001: OHOS 上无 cc/c++ 软链接，需设置 CC=clang CXX=clang++"
  - "E007: config.guess/config.sub 不识别 HarmonyOS，需打补丁"
  - "E125: HMDFS 上 mktemp 不可用，configure 中需替换为 TMPDIR 路径"
  - "E002: /tmp 只读，测试需使用 $TMPDIR"
  - "test_package 需手动设置 LD_LIBRARY_PATH 解析共享库"
