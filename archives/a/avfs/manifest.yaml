# avfs — 软件级 manifest
# 文件位置: archives/a/avfs/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: avfs
display: "AVFS"
description: "A Virtual File System - transparent access to archive files as directories"
category: system
homepage: "https://savannah.nongnu.org/projects/avfs/"
license: "LGPL-2.0 (library), GPL-2.0 (tools)"
build_system: autotools

ohos_adaptation:
  key_points:
    - "E001: OHOS 上无 cc/c++ 软链接，需设置 CC=clang CXX=clang++"
    - "E007: config.guess/config.sub 不识别 HarmonyOS，需打补丁添加 OHOS 检测"
    - "E125: HMDFS 上 mktemp 不可用，configure 中需替换为 TMPDIR 路径"
    - "E002: /tmp 只读，功能测试需使用 $TMPDIR"
  common_dependencies:
    - "pthread"
    - "dl"

versions:
  "1.2.0":
    status: built
    build_date: "2026-07-02"
    conan_ref: "avfs/1.2.0@ohpcd/stable"
