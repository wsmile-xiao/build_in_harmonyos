# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS临时文件兼容性：autotools使用mktemp -d './confXXXXXX'在HMDFS上会失败，需要使用源码内.tmp目录并去掉umask 077"
  - "config.guess/config.sub替换策略：当补丁脚本失败时，可直接替换为已工作的版本"
  - "pthread_cancel平台限制：HarmonyOS不支持pthread_cancel，需要添加#ifndef __OHOS__条件编译"
  - "sbindir硬编码问题：apcupsd的variables.mak将sbindir硬编码为/sbin，需要修改为${exec_prefix}/sbin"

