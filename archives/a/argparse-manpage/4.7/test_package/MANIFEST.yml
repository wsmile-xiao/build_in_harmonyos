# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: argparse-manpage/4.7
homepage: "https://github.com/praiskup/argparse-manpage"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "python3 -m pytest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_basic.py
    source: argparse-manpage-4.7/tests/test_basic.py
    description: "Basic functionality tests for manpage generation"
    command: "python3 -m pytest tests/test_basic.py"
  - file: tests/test_script.py
    source: argparse-manpage-4.7/tests/test_script.py
    description: "Script execution tests"
    command: "python3 -m pytest tests/test_script.py"
  - file: tests/test_examples.py
    source: argparse-manpage-4.7/tests/test_examples.py
    description: "Example-based tests"
    command: "python3 -m pytest tests/test_examples.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_argparse_manpage.py
    description: "Generate manpage from argparse parser and verify output sections"
    command: "python3 test_argparse_manpage.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
