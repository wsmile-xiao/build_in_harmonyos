# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: arpack-ng/3.9.1
homepage: "https://github.com/opencollab/arpack-ng"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -V"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: TESTS/dnsimp.f
    source: arpack-ng-3.9.1/TESTS/dnsimp.f
    description: "ARPACK non-symmetric eigenvalue test (dnsimp)"
    command: "./TESTS/dnsimp"
  - file: TESTS/bug_1323.f
    source: arpack-ng-3.9.1/TESTS/bug_1323.f
    description: "ARPACK bug regression test 1323"
    command: "./TESTS/bug_1323"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Solve symmetric eigenvalue problem via dsaupd_c/dseupd_c ICB C API and verify results"
    command: "./test_arpack"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
