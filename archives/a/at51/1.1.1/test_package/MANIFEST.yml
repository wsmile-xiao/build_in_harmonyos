package: at51/1.1.1
homepage: "https://github.com/8051Enthusiast/at51"

upstream_check_command: "cargo test --release --locked --no-fail-fast --bins --tests"
upstream_test_in_build: true
upstream_test_command: "cargo test --release --locked --no-fail-fast --bins --tests"

upstream_tests:
  - file: src/kinit.rs
    description: "初始化数据解析相关 Rust 单元测试"
    command: "cargo test --release --locked --no-fail-fast --bins --tests"
  - file: src/libfind/aslink3.rs
    description: "ASxxxx/ASLINK3 格式解析相关 Rust 单元测试"
    command: "cargo test --release --locked --no-fail-fast --bins --tests"
  - file: src/libfind/mod.rs
    description: "库匹配与引用合并相关 Rust 单元测试"
    command: "cargo test --release --locked --no-fail-fast --bins --tests"
  - file: src/libfind/omf51.rs
    description: "OMF51 记录解析相关 Rust 单元测试"
    command: "cargo test --release --locked --no-fail-fast --bins --tests"

test_package_tests:
  - file: conanfile.py
    description: "CLI 冒烟测试：验证 at51 主帮助和 stat/base/kinit/libfind 子命令帮助"
    command: "conan test test_package at51/1.1.1"
  - file: test_cli.py
    description: "CLI 冒烟测试命令清单与不可运行场景的可执行文件 magic 校验"
    command: "conan test test_package at51/1.1.1"

assertion_count: 5
