software: at51
version: "1.1.1"
status: built
build_date: "2026-08-15"
build_system: cargo

source:
  url: "https://github.com/8051Enthusiast/at51/archive/refs/tags/1.1.1.tar.gz"
  sha256: "3dbe15970fe0fda5f4bfc7a15526ab4437126f3475c273d43407d2e336c7cb31"
  tar_format: tar.gz

build:
  system: cargo
  dependencies: []
  configure_options:
    - "cargo build --release --locked"
    - "cargo test --release --locked --no-fail-fast --bins --tests"
  cc: clang
  cxx: clang++

patches_applied: []

test_result:
  total: 38
  passed: 38
  failed: 0
  ignored: 0
  method: "Cargo upstream unit tests"
  framework: "cargo test"
  command: "cargo test --release --locked --no-fail-fast --bins --tests"
  upstream_sources:
    - "src/kinit.rs"
    - "src/libfind/aslink3.rs"
    - "src/libfind/mod.rs"
    - "src/libfind/omf51.rs"

knowledge_gained:
  - "at51 1.1.1 是 Rust 2021 binary crate，最终产物为 at51 CLI"
  - "上游 Cargo.lock 固定了 clap、rustfft、nom、ar、bitflags、serde_json、dirs 等依赖"
  - "上游提供 stat、base、libfind、kinit 四个子命令"
  - "上游源码包含 38 个 #[test] 单元测试，均可通过 cargo test --release --locked --bins --tests 执行"
  - "OHOS 真机验证需要将 TMP/TEMP/TMPDIR 指向构建目录下的可写路径，避免只读 /tmp"
  - "旧端口环境无 curl/Harmonybrew/Rust 时，可用 Python urllib 下载 Harmonybrew Rust/OpenSSL/zlib bottle 并在构建目录内引导 Rust 工具链"
  - "旧端口 clang wrapper 不可直接作为 Cargo linker，需解析到可执行 clang-15 并显式传入 sysroot/code-sign/linker 参数"
