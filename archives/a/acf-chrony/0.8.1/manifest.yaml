# 版本级 manifest — acf-chrony 0.8.1
# 遵循 ARCHIVE-SPEC v2.0

version: "0.8.1"
software: "acf-chrony"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-16"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL（官方源：Alpine aports acf-chrony APKBUILD 使用的正式源码地址）
  url: "https://gitlab.alpinelinux.org/acf/acf-chrony/-/archive/v0.8.1/acf-chrony-v0.8.1.tar.gz"
  # 源码校验和（与官方 tarball 一致）
  sha256: "45bcb1f41fb1955cb04fafe9de3281f7239ec2a808f72ddfcb5af214a0608bc1"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型：扁平 Makefile（app/bin/lib/lua/www 风格，纯 Lua 应用插件包）
  system: makefile
  configure_options: []
  # 编译依赖列表（格式: name/version）
  dependencies:
    - acf-core/0.24.1
    - chrony/4.8
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "acf-chrony 是纯 Lua ACF 应用插件包，与 acf-core 同模式：扁平 Makefile 的 make all 为空，make install DESTDIR 仅 cp -a chrony* 到 usr/share/acf/app/chrony/"
  - "3 个 .lsp 模板（expert/logfile/status-html.lsp）是符号链接，指向 acf-core 共享模板，运行时由 acf-core 依赖解析"
  - "上游无测试套件（aports options='!check' # no test suite），无 make check/test 目标"
  - "R38 判定：本包不新增独立 CLI 命令（CLI 入口由 acf-core 的 acf-cli 统一提供），无需单独 commands.json"
  - "init-build 把归档误放到 SKILL 树（find_project_dir 定位到 SKILL.md 所在目录），需用 OHC_PROJECT_DIR 或 --project-dir 显式指定项目根"
  - "HMDFS 不支持硬链接，init-build dual-track 复制失败时需手动 cp -a（保留符号链接）重建 .work 目录"
