# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
#
# 上游无测试套件：Alpine aports main/acf-chrony/APKBUILD 声明
# `options="!check" # no test suite`；源码仅 Lua/.lsp 模板，无 test/ 目录、
# 无 make check/test 目标。

package: acf-chrony/0.8.1
homepage: "https://gitlab.alpinelinux.org/acf/acf-chrony"

# 上游测试命令（源码中不存在 make check/test 目标）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试（上游无测试，故为 false）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角实质验证，R34）
test_package_tests:
  - file: test_app.lua
    description: "加载 chrony-controller.lua + 验证 default_action/status/details/startstop/config/keyfile/enablekeyfile/expert/logfile 全 8 函数 + controller→model mock dispatch（status/details/config/keyfile/expert/logfile/startstop/enablekeyfile）+ 解析 chrony.menu/.roles 声明"
    command: "lua-runner test_app.lua <pkg>"
  - file: test_model.lua
    description: "加载 chrony-model.lua（真实被测包）验证 model 层全部 13 个公开函数：getstatus/getdetails/get_startstop/startstop_service/get_config/update_config/get_keyfiledetails/update_keyfiledetails/get_enable_keyfile/enable_keyfile/get_filedetails/update_filedetails/get_logfile + validate_config 校验规则（非法 server/allow/driftfile/commandkey）+ 配置写回路径 + chronyc 密码查找"
    command: "lua-runner test_model.lua <pkg>"
  - file: test_app.sh
    description: "测试入口：串联运行 test_app.lua + test_model.lua（包布局检查 + controller 全 8 函数调用链 + model 层全函数功能测试）"
    command: "bash test_app.sh <pkg>"

# 测试断言总数（test_app.lua 34 + test_model.lua 58 = 92）
assertion_count: 92
