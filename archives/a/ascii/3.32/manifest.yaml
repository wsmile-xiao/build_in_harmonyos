software: ascii
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.32/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.32"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: makefile

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.com/esr/ascii/-/archive/3.32/ascii-3.32.tar.bz2"

  # 源码校验和
  sha256: "cde70847d7e91b14cd855addceb1c7a07470a192cb7d178168fa421c1c21c826"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Plain Makefile project: no configure script needed, build directly with make"
  - "ascii uses -v for version (not --version)"
  - "asciidoctor needed for man page generation; create minimal man page when unavailable"
  - "make check target only runs cppcheck static analysis; skip when cppcheck unavailable"
