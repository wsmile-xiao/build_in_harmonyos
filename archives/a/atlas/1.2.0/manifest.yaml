software: atlas
version: 1.2.0
source_url: https://github.com/ariga/atlas/archive/refs/tags/v1.2.0.tar.gz
build_system: go
status: built
build_date: 2026-05-28
configure_options: ""
build_cleanliness: clean
dependencies:
  - name: go
    version: ">=1.25"
    type: build
    source: manual
    notes: "需要 Go 1.25.10 工具链，手动下载并签名"
build_notes: |
  - Go 项目，使用 go build 编译
  - 需要 Go 1.25 或更高版本（依赖 golang.org/x/sys@v0.42.0）
  - Go 1.22.10 系统预装，但需要 Go 1.25.10 工具链
  - 手动下载并签名 Go 1.25.10 到 ~/sdk/go1.25.10
  - 编译命令: go build -ldflags="-s -w -X ariga.io/atlas/cmd/atlas/internal/cmdapi.version=v1.2.0" -o atlas .
  - atlas 是动态链接到 musl libc 的可执行文件
  - 预编译包已制作：atlas-1.2.0-ohos-aarch64.tar.gz
  - 安装验证通过：atlas version 输出正确