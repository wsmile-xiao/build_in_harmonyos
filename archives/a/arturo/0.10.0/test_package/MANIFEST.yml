# test_package/MANIFEST.yml
# Arturo 0.10.0 test_package manifest

package: arturo/0.10.0
homepage: "https://arturo-lang.io"

# Upstream test command
upstream_check_command: "./bin/arturo ./tools/tester.art"

# conanfile.py build() method has integrated upstream test
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: tools/tester.art
    source: arturo-0.10.0/tools/tester.art
    description: "Arturo unit test suite"
    command: "./bin/arturo ./tools/tester.art"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Execute arturo binary and verify version output"
    command: "./test_arturo"

# Approximate assertion count
assertion_count: 24
