# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aws-c-s3/0.12.2
homepage: "https://github.com/awslabs/aws-c-s3"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 tests/ 需要预配置的 mock server 与 cmake test framework，交叉编译环境不可运行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/
    source: aws-c-s3-0.12.2/tests/
    description: "AWS C S3 unit tests (require pre-configured mock server, not runnable in cross-compile CI)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 aws_s3_library_init/aws_s3_get_current_platform_info/aws_s3_library_clean_up 验证库可加载且API可调用"
    command: "./test_aws_c_s3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
