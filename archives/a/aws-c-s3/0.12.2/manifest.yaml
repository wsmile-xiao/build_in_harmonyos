version: "0.12.2"
status: built
build_date: "2026-09-18"

source:
  url: "https://github.com/awslabs/aws-c-s3/archive/refs/tags/v0.12.2.tar.gz"
  sha256: "76348249b4bc305c1a40d089270a5a419f58c03c231b757de0a49a7a234eec76"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - aws-c-common/0.14.3
    - aws-c-io/0.27.5
    - aws-c-http/0.11.0
    - aws-c-cal/0.9.15
    - aws-c-auth/0.10.4
    - aws-checksums/0.2.10
    - aws-c-sdkutils/0.2.7
    - aws-lc/5.4.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists-find-package-Threads.patch: 在 aws_use_package 前补 find_package(Threads REQUIRED)，确保 Threads::Threads 目标存在"

knowledge_gained:
  - "aws-c-common cmake config 创建 AWS:: 目标并把 Aws*.cmake 模块加入 CMAKE_MODULE_PATH，CMakeDeps 会覆盖目标名导致构建失败，须用 CMAKE_PREFIX_PATH 方式"
  - "上游 aws CRT 共享库未设置 SOVERSION/SONAME，消费方 NEEDED 记录为绝对路径，跨机器运行需在测试中做 symlink 映射"
