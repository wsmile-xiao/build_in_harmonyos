package: acf-ppp/0.5.0
homepage: "https://gitlab.alpinelinux.org/acf/acf-ppp"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
external_integration_note: "Alpine APKBUILD declares options='!check' because upstream has no test suite. Full pppd and /etc/ppp integration requires an isolated OHOS device with PPP support."

test_package_tests:
  - file: mini_lua.c
    description: "Build a test-only Lua runner against the published lua/5.4.8 headers and static library."
    command: "clang mini_lua.c <lua include/lib> -ldl -lm"
  - file: test_acf_ppp.sh
    description: "Verify six installed files, four shared views copied byte-for-byte from acf-core, four regular-file checks, and four non-link checks; then run the packaged Lua controller/model with isolated ACF service stubs."
    command: "sh test_acf_ppp.sh <package-root> <acf-core-root>"
  - file: test_acf_ppp.lua
    description: "Exercise status, peer listing, PAP/CHAP paths, the default action, and controller-to-model dispatch."
    command: "./lua-runner test_acf_ppp.lua <package-app-dir>"

assertion_count: 28
