# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ataqv/1.3.1
homepage: "https://github.com/ParkerLab/ataqv"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/cpp/run_ataqv_tests.cpp
    source: ataqv-1.3.1/src/cpp/run_ataqv_tests.cpp
    description: "ataqv单元测试（使用catch.hpp框架）"
    command: "./run_ataqv_tests -i"

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "运行ataqv --version和--help验证二进制可用"
    command: "ataqv --version"

# 测试断言总数
assertion_count: 2
