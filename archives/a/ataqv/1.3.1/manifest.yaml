# 知识沉淀
# ============================================================

knowledge_gained:
  - "Conan boost 1.91.0.1.1 的 iostreams 库未包含 zlib 支持，需要从 boost 源码单独编译 iostreams 的 zlib.cpp 和 gzip.cpp"
  - "Conan ncurses 包提供 libncursesw.a 而非 libncurses.a，需要创建符号链接"
  - "Makefile 构建系统，非 CMake/autotools，使用环境变量 BOOST_ROOT/HTSLIB_ROOT 定位依赖"
