# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: airthings-cloud/0.3.0
homepage: "https://github.com/Danielhiversen/pyAirthings"

# 上游测试命令 — airthings-cloud 上游无测试套件（如实记录）
upstream_check_command: "pytest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-18 实测记录）：
# - **上游无测试套件（如实记录）**：PyPI sdist 全量核验 **0 个测试文件**
#   （airthings_cloud-0.3.0.tar.gz 仅 LICENSE/PKG-INFO/README/airthings/__init__.py
#   + egg-info——无 tests/ 无 test_*.py）——上游 GitHub 仓库
#   （Danielhiversen/pyAirthings）根目录核验：无 tests/ 目录、无测试文件
#   （仅 .github/.gitignore/LICENSE/README/airthings/setup.py）——**上游官方
#   发布不含测试套件（非跳过——上游确实没有）**
upstream_tests:
  - file: none
    source: airthings_cloud-0.3.0/
    description: "上游无测试套件（如实记录）——PyPI sdist 0 个测试文件 + GitHub 仓库根无 tests/——上游官方发布不含测试"
    command: "pytest"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_airthings.py
    description: "消费者测试（L0c）：真实 API（R34）——构造 Airthings 客户端（aiohttp ClientSession——不需要网络）——验证依赖 aiohttp 可导入（已发布 ohpcd）"
    command: "python3 test_airthings.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
