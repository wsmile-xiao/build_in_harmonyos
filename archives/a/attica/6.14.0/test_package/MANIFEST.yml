version: 1
package: attica/6.14.0
homepage: https://invent.kde.org/frameworks/attica

tests:
  upstream:
    status: passed
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E \"^providertest$\""
    source: "attica-6.14.0/autotests/"
    result: "2/2 passed (configtest, persontest)"
    expected:
      - configtest
      - persontest
      - providertest
    excluded:
      - name: providertest
        reason: "requires live external OCS network endpoints (autoconfig.kde.org / invalid-url.org) that hang on the OHOS runner"
  package:
    status: passed
    source: test.cpp
    command: "ctest && ./test_attica"
    result: "1/1 passed (PASS: Attica value objects OK)"
    description: "Constructs Attica value objects and verifies accessors."

notes:
  - "tests/projecttest is a manual Qt Widgets executable marked with ecm_mark_as_test and is not registered as a CTest test."
