software: attica
display: "Attica"
description: "KDE Frameworks 6 - Open Collaboration Services client library"
category: network
homepage: "https://invent.kde.org/frameworks/attica"
license: LGPL-2.1-only OR LGPL-3.0-only OR LicenseRef-KDE-Accepted-LGPL
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE: OHOS is not in the KDE platform list"
    - "qtbase uses cmake_find_mode=none; generate() writes conan_cmakedeps_paths.cmake to bridge CMAKE_PREFIX_PATH to the qtbase package's lib/cmake"
    - "ECM_MODULE_PATH must be set manually: CMakeDeps-generated ECMConfig.cmake does not propagate it"
    - "providertest requires live external OCS endpoints and is excluded from CTest (can hang on the OHOS runner)"
  common_dependencies:
    - qtbase
    - ecm

versions:
  "6.14.0":
    status: built
    build_date: "2026-09-03"
    conan_ref: "attica/6.14.0"
  "6.18.0":
    status: built
    build_date: "2026-08-20"
    conan_ref: "attica/6.18.0"
  "6.28.0":
    status: built
    build_date: "2026-08-22"
    conan_ref: "attica/6.28.0"
