software: avogadrolibs
display: "Avogadro Libraries"
description: "Reusable C++ chemistry and molecular data libraries from Avogadro"
category: library
homepage: "https://github.com/OpenChemistry/avogadrolibs"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "Builds the headless C++ Core, Calc, IO, and QuantumIO libraries."
    - "Qt, OpenGL, Python, and optional system integrations are disabled to keep the OHOS dependency closure portable."
    - "Bundled format/parser dependencies are retained; Eigen is supplied as a Conan dependency."
  common_dependencies:
    - eigen

versions:
  "2.0.0":
    status: candidate
    build_date: "2026-08-23"
    published_as: "avogadrolibs/2.0.0"
