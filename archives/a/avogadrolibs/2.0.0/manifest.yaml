version: "2.0.0"
software: "avogadrolibs"
status: candidate
build_date: "2026-08-24"
build_system: cmake
source:
  ref: "2.0.0"
  oid: "d41dbf36dd92fcf275f25bb5f3ad4063a838ed3a"
  url: "https://github.com/OpenChemistry/avogadrolibs/archive/refs/tags/2.0.0.tar.gz"
  sha256: "08adefeb8122cf018587fc12872ed470bbf92b72fb73f0af1861ab58031cadfd"
  tar_format: tar.gz
build:
  system: cmake
  scope: "headless C++ Core, Calc, IO, and QuantumIO"
  configure_options:
    - "-DBUILD_SHARED_LIBS=<option>"
    - "-DENABLE_TESTING=OFF"
    - "-DUSE_QT=OFF"
    - "-DUSE_OPENGL=OFF"
    - "-DUSE_PYTHON=OFF"
    - "-DUSE_LIBARCHIVE=OFF"
    - "-DUSE_LIBMSYM=OFF"
    - "-DUSE_SPGLIB=OFF"
    - "-DUSE_PLOTTER=OFF"
    - "-DUSE_HDF5=OFF"
    - "-DUSE_MMTF=OFF"
  dependencies:
    - "eigen/3.4.0"
  testing_dependencies:
    - "gtest/1.17.0 (opt-in test_requires)"
upstream_tests:
  entrypoint: "cmake -DENABLE_TESTING=ON; ctest"
  static_add_test_sites: 18
  authoritative_total: "NOT_RUN"
  recipe_policy: "ENABLE_TESTING=OFF for default headless package; testing=True is diagnostic only"
  diagnostic_boundary: "OHOS toolchain, Eigen3_DIR, and GTest discovery pass; upstream tests stop at unconditional Qt6 Core/Widgets/Network/Concurrent REQUIRED"
  alternative_validation: "real OHOS configure/compile/link probe, explicit-profile Eigen/GTest discovery, authoritative package/test_package/consumer9/9"
  residual_risk: "upstream CTest and Qt-coupled test targets are not compiled or executed; OHOS Qt6 closure remains unavailable"
source_adjustments:
  - "source() adds bundled struct and pugixml to AvogadroLibsTargets export set"
