package: avogadrolibs/2.0.0
homepage: https://github.com/OpenChemistry/avogadrolibs

upstream_check_command: "cmake -DENABLE_TESTING=ON; ctest"
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  static_add_test_sites: 18
  configured_headless_total: "NOT_RUN (recipe configures ENABLE_TESTING=OFF)"
  excluded_feature_groups:
    - "QtGui and QtOpenGL tests (USE_QT=OFF, USE_OPENGL=OFF)"
    - "Rendering tests (USE_OPENGL=OFF)"

test_package_tests:
