# 软件级 manifest — autotiling
# 遵循 ARCHIVE-SPEC v2.0

software: autotiling
display: "autotiling"
description: "自动切换 sway/i3 窗口分割方向的 Python 脚本（水平/垂直 split 自动选择）"
category: utility
homepage: "https://github.com/nwg-piotr/autotiling"
license: GPL-3.0-or-later
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Python 无 C/C++ 编译：pip install --prefix 装入 staging，site-packages 经 runenv_info PYTHONPATH 暴露"
    - "运行依赖 i3ipc（python-i3ipc）未发布为 conan 配方，由 pip 从 pypi.cnb.cool 镜像一并装入 site-packages（airthings-ble 同模式）"
    - "--version/--help 在 argparse 阶段即退出，无需 sway/i3 窗口管理器即可冒烟验证"
    - "工具类型：软件级目录需 commands.json 声明（R38）"
  common_dependencies:
    - i3ipc

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.9.3":
    status: built
    build_date: "2026-08-21"
    conan_ref: "autotiling/1.9.3"
