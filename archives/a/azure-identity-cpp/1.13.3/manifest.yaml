# 版本级 manifest 模板
# 文件位置: archives/a/azure-identity-cpp/1.13.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.13.3"

# 软件名
software: "azure-identity-cpp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/Azure/azure-sdk-for-cpp/tar.gz/refs/tags/azure-identity_1.13.3"

  # 源码校验和
  sha256: "4e83559e53b475e25f6a142604a477609b271111982bd2c88c8a4fe371338fcc"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统
# cmake | meson | autotools | conan-center | others
build_system: cmake

# Conan host settings
conan_host:
  os: "OHOS"
  arch: "armv8"
  compiler: "clang"
  compiler.version: 15
  compiler.libcxx: "libc++"
  compiler.cppstd: 17
  build_type: "Release"

# CMake 选项
cmake_options:
  BUILD_SHARED_LIBS: "OFF"
  BUILD_TESTING: "OFF"
  AZ_ALL_LIBRARIES: "OFF"
  WARNINGS_AS_ERRORS: "OFF"

# 依赖
dependencies:
  azure-core-cpp: "1.16.4"
  openssl: "3.5.6"

# 是否跨平台构建
cross_compiled: true

# 构建平台
build_platform: "linux/x86_64"
target_platform: "OHOS/armv8"

# OHOS 特定
ohos:
  compiler: "clang15"
  libcxx: "libc++"
  cppstd: 17
  clang_profile: "ohos-armv8-clang-15"