# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: azure-identity-cpp/1.13.3
homepage: "https://github.com/Azure/azure-sdk-for-cpp/tree/main/sdk/identity/azure-identity"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (gtest, 多个测试套件)
# Azure Identity 网络/凭据测试 (client_secret, chained_token, default_azure 等)
# 因离线环境无法访问 Azure 端点/真实租户而被排除；以 test_package 消费者验证替代
upstream_tests:
  - file: sdk/identity/azure-identity/test/ut/
    source: azure-sdk-for-cpp-azure-identity_1.13.3/sdk/identity/azure-identity/test/ut/
    description: "azure-identity upstream gtest suite: credential tests (chained_token, client_secret, default_azure, environment, cli, etc.)"
    command: "./azure-identity-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Verify azure-identity API from consumer view: ClientSecretCredential, EnvironmentCredential, ChainedTokenCredential, DefaultAzureCredential construction — linked against Azure::azure-identity via CMakeDeps"
    command: "./test_azure-identity-cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5