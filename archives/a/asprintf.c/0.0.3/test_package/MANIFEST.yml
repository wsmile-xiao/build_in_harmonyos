# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求）
#
# 上游 asprintf.c 0.0.3 的测试面完整枚举：
#   - 测试入口: Makefile `test` 目标（`make test` = 编译 test.c+asprintf.c 为 test
#     可执行文件并运行；.travis.yml script: make test 即官方 CI 测试入口）
#   - 独立上游用例: test.c 中 main() 内 3 组断言块（%s / 多参数 / 长字符串）
#   - 无独立测试框架（无 ctest/gcheck/SECTION），无独立测试源文件
package: asprintf.c/0.0.3
homepage: "https://github.com/jwerle/asprintf.c"

# 上游测试命令 (make -n check / ctest -N / meson test --list 分析)
# 上游无 check 目标，官方测试目标为 test（.travis.yml: script: make test）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make CC=<cc> AR=<ar> RANLIB=<ranlib> CFLAGS=\"-std=c99 -Wall -Wextra -fPIC\" test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: asprintf.c-0.0.3.tar.gz/test.c
    description: "上游 main() 内 3 组 asprintf 断言块（%s 16 字节 / 多参数 9 字节 / 长字符串 56 字节），make test 编译并执行"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "OHOS 专项消费者测试：仅用公开头 asprintf.h 与静态库 libasprintf.a，4 个场景（%s 格式化/多参数/vasprintf 透传/返回值长度语义），每个场景含内容+长度双断言"
    command: "./test_consume"
    note: "可执行文件命名 test_consume：CI L1d 启发式按 self.run 行 (echo|print|true) 子串判假测试，含 'asprintf' 的程序名会因子串 'print' 误判"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
