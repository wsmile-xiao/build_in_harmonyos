# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: audio-resampler/0.7
homepage: "https://github.com/dbry/audio-resampler"

# 上游测试命令: 本项目无 ctest/meson/autotools 测试注册，
# 唯一测试入口是 artest.c（artest/artest64 两个数据路径变体）
upstream_check_command: "make artest artest64"

# conanfile.py build() 方法中已集成上游测试（artest/artest64 实际运行第 3 步）
upstream_test_in_build: true
upstream_test_command: "artest -s44k -d48k -n3 -i -m -h && artest64 -s44k -d48k -n3 -i -m -h (32/64-bit round-trip inverse-resample verification)"

# 上游实际运行的测试程序
upstream_tests:
  - file: artest.c
    source: audio-resampler-0.7/artest.c
    description: "ARTEST 往返验证工具（32-bit 数据路径）：前向重采样+反向重采样对比合成 1kHz 正弦，diff RMS ~-147dB 无 fatal error 即通过"
    command: "artest -s44k -d48k -n3 -i -m -h"
  - file: artest.c
    source: audio-resampler-0.7/artest.c
    description: "ARTEST 往返验证工具（64-bit 数据路径，-DPATH_WIDTH=64），同上验证 64 位变体"
    command: "artest64 -s44k -d48k -n3 -i -m -h"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_consumer.c
    description: "消费者用例：仅用公开头文件与 libaudio-resampler.a 调用 resampleFixedRatioInit/resampleProcess 做 44.1k->48k 重采样，断言输出帧数与峰值（真实公开 API 调用，非空壳）"
    command: "test_consumer"
  - file: test_ohos.c
    description: "鸿蒙专项测试：以 RESAMPLE_MULTITHREADED 多线程模式经公开 API 运行 44.1k->48k 固定比率重采样，断言输出帧数等于 resampleGetExpectedOutput 期望值且峰值正常（验证 OHOS pthread workers 路径）"
    command: "test_ohos"

# 测试断言总数 (artest 主流程含多组统计与 fatal error 检查；三个实跑入口)
assertion_count: 3