# 版本级 manifest — audio-resampler 0.7
# 遵循 ARCHIVE-SPEC v2.0

version: "0.7"

software: "audio-resampler"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag tarball）
  url: "https://github.com/dbry/audio-resampler/archive/refs/tags/0.7.tar.gz"

  # 源码校验和（实测 sha256sum）
  sha256: "a7f3ff38f4cc29e0604b622d4a268f3f65efc94e9d1cee30025893eefa14b1a1"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: 纯 Makefile（无 configure/install/check 目标，配方直接编译）
  system: makefile

  # 配置选项列表
  configure_options:
  - "CC=clang（上游 Makefile 硬编码 gcc + -mavx2，aarch64 需移除 -mavx2）"
  - "-DENABLE_THREADS -DENABLE_EXTRAPOLATION（保持上游默认功能宏）"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用/说明的补丁列表: 未生成补丁文件（配方内直接以 clang 编译，
# 等价于上游 Makefile 去除 x86 专用 -mavx2 标志的适配）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "E429-draft: 上游 Makefile 硬编码 gcc + -mavx2（Intel 专用）OHOS aarch64 clang 不识别，纯 Makefile 项目配方直接编译并移除架构专用标志（保留功能宏）"
- "E430-draft: 32-bit float WAV 头 wFormatTag 必须为 3 (IEEE_FLOAT)，BlockAlign=channels*4；格式码 1 + 32bit 被判 unsupported"
- "artest 为纯选项驱动（合成信号），调用: artest -s44k -d48k -n3 -i -m -h（前向+反向往返验证，diff RMS ~-147dB）— 库特有观察，见 knowledge-candidate-ledger.md"
