  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: "package_type=shared-library；Asterisk 全量 autotools 构建，只编译两个 FreeTDS 模块（cdr_tds/cel_tds）；依赖注入私有 prefix（freetds 包含 sybdb.h + libsybdb.a，无 .pc/工具，靠 CPPFLAGS/LDFLAGS 探测）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config.guess.patch"
  - "0002-configure.patch"
  - "0003-include-asterisk-astmm.h.patch"
  - "0004-include-asterisk-utils.h.patch"
  - "0005-menuselect-config.guess.patch"
  - "0006-menuselect-config.sub.patch"
  - "0007-menuselect-configure.patch"

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: medium
  issues: []
  notes: "沿用 asterisk-speex/pgsql 的 OHOS 移植补丁（config.guess/configure/menuselect/astmm/utils）；仅编译 tds 两模块，不依赖 asterisk 主程序"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 0
  failed: 0
  note: |
    上游测试：Asterisk 的 test/ 目录是 C 单元测试（main/ 各模块 test_*.c），
    tds 两模块（cdr_tds/cel_tds）**无专属上游测试**
    ——rule 1.2 如实声明"上游无测试"（非跳过）。
    本地验证：conan create 通过，两模块 .so（cdr_tds/cel_tds）
    编译链接成功并打包到 lib/asterisk/modules/。
    适配后：test_package R34 真实产物校验——两模块存在 + ELF shared
    object + 链接 FreeTDS/libsybdb（1/1 = 100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "asterisk-tds 是 asterisk 的 FreeTDS 模块集（cdr_tds/cel_tds），freetds 依赖已在 ohpcd（freetds/1.4.23）；与 asterisk-pgsql 同构——全量 autotools + menuselect 只启目标模块 + 依赖注入私有 prefix"
  - "freetds/1.4.23 包含 sybdb.h + libsybdb.a（静态，无 .pc/工具）——asterisk configure 用 AST_EXT_LIB_CHECK([FREETDS], [sybdb], [dbinit], [sybdb.h]) 探测，靠 CPPFLAGS/LDFLAGS/PKG_CONFIG_PATH 即可命中，无需工具 shim"
  - "menuselect.makedeps 声明 MENUSELECT_DEPENDS_cdr_tds=FREETDS（及 cel_tds），configure 检测到 FREETDS 后 menuselect 启用两模块"

references:
  - https://www.asterisk.org/
  - https://docs.asterisk.org/Configuration/CDR/CdrTDS/
