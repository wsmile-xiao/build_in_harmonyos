# 版本级 manifest — asterisk-tds 22.10.1
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "22.10.1"

# 软件名
software: asterisk-tds

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub codeload tag；downloads.asterisk.org 在 OHOS 沙箱 404）
  url: "https://codeload.github.com/asterisk/asterisk/tar.gz/refs/tags/22.10.1"

  # 源码校验和（sha256，实测）
  sha256: "373c98f4d4a1b923b42def0aee03f4e36aca9d1c244a8eeda646da8a97f89663"

  # 压缩格式
  compression: tar.gz

