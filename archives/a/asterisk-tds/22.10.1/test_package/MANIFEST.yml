# test_package/MANIFEST.yml — asterisk-tds 22.10.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: asterisk-tds/22.10.1
homepage: "https://www.asterisk.org/"

# 上游测试：Asterisk 的 C 单元测试在 test/ 目录（main/ 各模块 test_*.c）。
# TDS 两模块（cdr_tds/cel_tds）无专属 .c 测试——上游无对应单测
# （rule 1.2：如实声明，非跳过）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（如实声明：TDS 模块无专属上游测试）
upstream_tests:
  - file: test/
    source: asterisk-22.10.1/test/*.c
    description: "Asterisk 主程序 C 单测（test/），TDS 两模块无专属测试（rule 1.2 如实记录）"
    command: ""

# test_package 消费者测试（R34 真实产物校验：两模块存在 + ELF shared object + 链接 FreeTDS/libsybdb）
test_package_tests:
  - file: test_asterisk_tds.py
    description: "Verifies cdr_tds.so/cel_tds.so exist under lib/asterisk/modules/, are valid aarch64 ELF shared objects, and link libsybdb (FreeTDS)"
    command: "python3 test_asterisk_tds.py"

# 断言总数：4（2 模块存在 + ELF 校验 + FreeTDS 链接）
assertion_count: 4
