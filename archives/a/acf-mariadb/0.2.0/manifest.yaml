build:
  # 构建系统类型：单一递归 Makefile（pure-Lua，无 C 编译）
  system: makefile
  configure_options: []
  # 编译依赖列表（格式: name/version）
  dependencies:
    - acf-core/0.24.1
    - acf-db/0.2.1
