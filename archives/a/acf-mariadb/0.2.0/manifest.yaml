  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "acf-mariadb 是纯 Lua ACF 模块（mysql-controller.lua/mysql-model.lua + .menu/.roles + .lsp 视图），make all 为空操作"
  - "上游 Makefile 的 install 目标创建 symlinks 引用 acflibdir（/usr/share/acf/lib），在 Conan 隔离构建环境中该路径不存在；recipe 绕过 make install 手动打包"
  - "跨 Conan 包无法使用相对 symlink（acf-mariadb 和 acf-core 的 package_folder 路径不同）；改为从 acf-core 的 share/acf/app/ 直接复制基础视图模板（expert-html.lsp/logfile-html.lsp/status-html.lsp）并重命名为 mysql-*.lsp（功能等价）"
  - "真机验证发现 acf-core 0.24.1 的 share/acf/lib/ 中没有 db-*.lsp 文件；共享视图实际位于 share/acf/app/（无 db- 前缀）"
  - "package() 方法先复制文件、再做 usr/ 规范化、最后从 acf-core 复制共享视图（顺序不能颠倒）"
  - "tarball 中已含 symlink（-> ../expert-html.lsp 等），在 Linux 构建环境中 cp -a 保留；Windows 提取可能失败但不影响 OHOS 构建"
  - "运行时依赖 acf-core/0.24.1（mvc.lua 分发 + acf.db/acf.fs/acf.format）和 acf-db/0.2.1（dbcontrollerfunctions.lua/dbmodelfunctions.lua Lua 数据库编辑工具）"
  - "mysql-model.lua 中 require('acf.db') 使用 acf.db.engine.mysql 引擎连接 MariaDB，需要运行环境有 mysql 客户端库"
  - "上游无测试套件（aports APKBUILD 未声明 test），test_package 以文件存在性 + Lua 语法校验（luac -p）验证包装完整性"
