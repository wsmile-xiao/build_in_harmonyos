# 版本级 manifest — acf-mariadb 0.2.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.2.0"
software: "acf-mariadb"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-19"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方源：Alpine distfiles 正式分发镜像（gitlab.alpinelinux.org 在构建网络被 418 拦截）
  url: "https://distfiles.alpinelinux.org/distfiles/v3.24/acf-mariadb-v0.2.0.tar.gz"
  sha256: "1db5dc9a9adc81e32fea335b037d6bdfcef966bbb70d37eee1944dfb8dab941d"
