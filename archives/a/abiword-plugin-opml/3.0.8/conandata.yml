# conandata.yml — abiword-plugin-opml 3.0.8
# 源码 = AbiWord release-3.0.8 上游源码（Debian 官方 pool 权威镜像）。
#   gitlab.gnome.org 官方 git archive 在本构建环境网络不可达（TCP 超时），
#   改用 Debian pool 的 abiword_3.0.8+ds.orig.tar.xz（同一 release-3.0.8 源码树，
#   顶层目录同为 AbiWord-release-3.0.8；已用 clarisworks 补丁 dry-run 验证文件一致）。
# 构建 = minimal configure.ac 只构建 opml 插件 + compat shim（无 libxml2 依赖）。
# 补丁策略：仅保留 2 个修改文件补丁（Makefile.am/configure.ac）。
#   compat/（AbiWord shim + 自研 SAX XML 解析器）与 tests/ 通过 conanfile.py
#   export_sources 传递，不生成 new-file 补丁（toybox patch --dry-run 会真实应用
#   new-file 补丁，污染 orig 目录导致补丁管线损坏，E258）。

sources:
  url: "https://mirrors.huaweicloud.com/debian/pool/main/a/abiword/abiword_3.0.8+ds.orig.tar.xz"
  sha256: "a600ed11c8e5f1ae0c0f09993664429c7da0f7b02a4484bc23fb8dea1eaa059e"

patches:
  - patch_file: "patches/0001-Makefile.am.patch"
    patch_description: "Replace the full AbiWord Makefile.am with a minimal build of libabiword-plugin-opml.so + end-to-end test (check-local runs the real ELF test binary; OHOS blocks shebang script exec)"
    patch_type: "platform"
  - patch_file: "patches/0002-configure.ac.patch"
    patch_description: "Replace the full AbiWord configure.ac with a minimal one that only builds the OPML plugin"
    patch_type: "platform"
