# 版本级 manifest — abiword-plugin-opml 3.0.8
# 遵循 ARCHIVE-SPEC v2.0

version: "3.0.8"
software: "abiword-plugin-opml"
# published | built | failed | archived
# 本机 CI 流水线实构建验证通过（conan create + make check + test_package），标记 built
status: built
build_date: "2026-08-14"
build_system: autotools

source:
  url: "https://mirrors.huaweicloud.com/debian/pool/main/a/abiword/abiword_3.0.8+ds.orig.tar.xz"
  sha256: "a600ed11c8e5f1ae0c0f09993664429c7da0f7b02a4484bc23fb8dea1eaa059e"
  tar_format: tar.xz
  source_note: "gitlab.gnome.org 官方 git archive 在本机网络不可达（TCP 超时），改用 Debian pool 权威镜像（同一 release-3.0.8 源码树，顶层目录 AbiWord-release-3.0.8，已用 clarisworks 补丁 dry-run 验证文件一致）。conandata.yml 已记录说明。"

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies: []          # dependency-free：AbiWord 核心 API 由 compat/ shim 提供
  dependencies_note: "OPML 插件不依赖 libxml2（plugin.m4 仅引用 ${PLUGIN_CFLAGS}/${PLUGIN_LIBS}，XML 解析用 AbiWord 自研 IE_Imp_XML）；AbiWord 核心未发布到 OHOS 制品仓，由 compat/ shim 提供（与 abiword-plugin-clarisworks 同方案）。"
  cc: clang
  cxx: clang++
  build_notes:
    - "git archive 无 configure，build() 中 autoreconf -fi 生成（参考 clarisworks）"
    - "E114: 生成 configure 后移除 umask 077（HMDFS setgid 临时目录不可写）"
    - "E074: make 全部 -j1（SELinux 禁止 jobserver FIFO）"
    - "toybox patch --dry-run 会真实应用 new-file 补丁（E258），compat/tests 走 export_sources 不生成 new-file 补丁"
    - "conan 在本机须以 normal_hap 域运行（python3 -m conans.conan），ELF conan 包装器落入 adhoc_bin 域导致 clang-15 无法执行；本机验证使用 direct python3 方式，CI 流水线不受此限"

patches_applied:
  - "0001-Makefile.am.patch"
  - "0002-configure.ac.patch"

test_results:
  type: conan-verify
  total: 5
  passed: 5
  failed: 0
  note: "本机 conan create 全绿（make check 端到端测试 26 项断言 + test_package dlopen 测试 PASS）；conan-verify 工具入口因本机 SELinux adhoc_bin 域限制无法直接跑 ELF conan（clang-15 不可执行），改用 direct python3 -m conans.conan 等价验证，见 notes.md"

knowledge_gained:
  - "AbiWord 3.0.8 OPML 插件（plugins/opml/）导入解析不依赖 libxml2，AbiWord 自研 IE_Imp_XML 处理 XML；适配可完全依赖 compat shim，dependency-free"
  - "OPML 导入器核心：ie_imp_OPML.cpp 实现 IE_Imp 子类，_parse_xml 自研最小 SAX 解析器驱动回调；opml plugin.m4 无额外库依赖"
  - "OHOS SELinux 域：ELF 包装器（dev_adhoc_bin_file/hmdfs 标签）exec python3 后落入 adhoc_bin 域，clang-15 在该域无法执行；直接 python3 -m（normal_hap 域）正常"
