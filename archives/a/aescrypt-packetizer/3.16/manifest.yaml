software: aescrypt-packetizer
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.16/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.16"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.mirrorservice.org/sites/distfiles.gentoo.org/distfiles/13/aescrypt-3.16.tgz"

  # 源码校验和
  sha256: "e2e192d0b45eab9748efe59e97b656cc55f1faeb595a2f77ab84d44b0ec084d2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "CFLAGS=-fPIC -O2 -Wall -Wextra -pedantic -std=c11 -D_FILE_OFFSET_BITS=64"
    - "LDLIBS="
    - "LDFLAGS=-static"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS uname -s 返回 HarmonyOS 而非 Linux，Makefile 的 ifeq 判断会错误添加 -liconv，需覆盖 LDLIBS= 为空"
  - "Makefile 默认 CC=gcc，需命令行覆盖 CC=clang"
  - "Makefile install 目标使用硬编码路径不支持 DESTDIR，conanfile.py 需用 copy() 手动安装"
  - "R26: 终端工具需 LDFLAGS=-static 静态链接"
  - "make test 包含 SHA-256 验证、AES Monte Carlo、文件加密/解密、密码长度边界 4 类测试"
