  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "acf-heimdal 是纯 Lua ACF 模块（heimdal-controller.lua/heimdal-model.lua + .menu/.roles + .lsp 视图），make all 为空操作"
  - "上游 Makefile install 目标为 mkdir + cp -a heimdal*，简单可用（不同于 acf-mariadb 引用 acflibdir 导致失败）"
  - "tarball 含两个悬空相对 symlink（heimdal-expert/status-html.lsp -> ../expert/status-html.lsp），跨 Conan 包相对路径无法解析，改为从 acf-core 的 share/acf/app/ 复制物化为常规文件（功能等价）"
  - "运行时依赖 acf-core/0.24.1（mvc.lua 分发 + modelfunctions/htmlviewfunctions/cfe + 共享视图）和 acf-lib-lua5.4/0.11.1（acf.fs/acf.html）"
  - "heimdal-model.lua 用 modelfunctions.run_executable 调用 kinit/klist/kdestroy（Heimdal Kerberos 客户端），需运行环境有 heimdal 二进制（archives/h/heimdal/7.8.0）"
  - "上游无测试套件（aports APKBUILD 未声明 test），test_package 以文件存在性 + 物化视图 + Lua 语法校验（luac -p）+ 依赖引用校验验证包装完整性"
