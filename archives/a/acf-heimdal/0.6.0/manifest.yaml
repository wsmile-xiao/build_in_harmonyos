# 版本级 manifest — acf-heimdal 0.6.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.6.0"
software: "acf-heimdal"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-19"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方源：Alpine distfiles 正式分发镜像（gitlab.alpinelinux.org 在构建网络被 418 拦截）
