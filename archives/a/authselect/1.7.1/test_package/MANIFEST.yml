package: authselect/1.7.1
homepage: "https://github.com/authselect/authselect"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check; pytest"

upstream_tests:
  - name: test_util_string_array
    description: "cmocka unit test for string array utilities"
    command: "make check"
  - name: test_util_evaluator
    description: "cmocka unit test for evaluator"
    command: "make check"
  - name: test_util_template
    description: "cmocka unit test for template"
    command: "make check"

test_package_tests:
  - file: test_authselect.c
    description: "Verify authselect consumer link and library presence"
    command: "./test_authselect"

assertion_count: 1