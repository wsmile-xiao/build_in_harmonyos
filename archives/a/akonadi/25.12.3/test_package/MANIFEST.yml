# 上游测试来源声明（CI L0e 门禁要求）
package: akonadi
version: 25.12.3
upstream: https://invent.kde.org/pim/akonadi
upstream_tests: autotests/ and tests/ require an isolated Akonadi server plus DBus runtime; the initial HarmonyOS recipe disables BUILD_TESTING and uses a focused consumer smoke test.
harmonyos_tests:
  - test_package/test_akonadi.cpp: constructs Akonadi::Collection, Akonadi::Item and Akonadi::Tag and checks Qt6 Sql/DBus availability
  - test_package/conanfile.py: CMake find_package(KPim6Akonadi) build plus CTest/runtime execution
