# cfitsio：仓库无 conan recipe（预编译包 manifest 形式，ohpcd remote 无
# cfitsio/4.6.4 recipe），故配方内自包含构建上游源码（固定 commit 可复现）。
# 本地已验证 cfitsio master commit 316e9500 cmake 静态构建成功。
cfitsio:
  url: "https://codeload.github.com/healpy/cfitsio/tar.gz/316e95008492b597b3cbcf84168df22996fe2b6f"
  filename: "cfitsio-316e9500.tar.gz"
  sha256: "c8d5b3da8d26bc679579732668aae1b63d985d76b6b430eff787020ec44ee57c"

patches:
  - patch_file: "patches/0001-iargc-flang.patch"
    patch_description: "gfortran 扩展 IARGC() 在 flang 下不存在，改用标准 Fortran 2008 的 command_argument_count()（commandline.f90 / continuum_new.f90 两处）。"
    patch_type: "portability"
  - patch_file: "patches/0002-cfitsio-cmake-minimum.patch"
    patch_description: "cfitsio CMakeLists 要求 CMake >= 3.1，新 CMake 已移除 <3.5 兼容，提升至 3.5。"
    patch_type: "portability"
