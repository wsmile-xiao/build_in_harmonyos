# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: alfa/2.2
homepage: "https://github.com/rwesson/ALFA"

# 上游测试命令（alfa 官方：对 test/ 数据运行 alfa 拟合）
upstream_check_command: "alfa -cl test/1d.ascii"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试执行说明（规则 4）：
# 上游测试 = 对 test/ 目录 4 个数据文件（1d.ascii/1d.fits/2d_small.fits/
# 3dspec_2x2.fits）运行 alfa 拟合。本地实测（OHOS 环境，linelists 就绪）：
# - 1d.ascii / 1d.fits / 3dspec_2x2.fits 完整运行通过（3/3，产出 *_fit.fits）
# - 2d_small.fits（11MB，200 行光谱）：分段运行（4 段各 50 行）完整跑完，
#   200 行全部成功产出 row fits（200/200），2D 拟合路径实测通过
upstream_tests:
  - file: test/1d.ascii
    source: ALFA-2.2/test/1d.ascii
    description: "1D 文本光谱拟合（实测 PASS，产出 1d.ascii_fit.fits）"
    command: "alfa -cl test/1d.ascii"
  - file: test/1d.fits
    source: ALFA-2.2/test/1d.fits
    description: "1D FITS 光谱拟合（实测 PASS，产出 1d.fits_fit.fits）"
    command: "alfa -cl test/1d.fits"
  - file: test/3dspec_2x2.fits
    source: ALFA-2.2/test/3dspec_2x2.fits
    description: "3D 光谱拟合（2x2 空间像素 × 3641 波长，实测 PASS，4 像素全部产出 _fit.fits）"
    command: "alfa -cl test/3dspec_2x2.fits"
  - file: test/2d_small.fits
    source: ALFA-2.2/test/2d_small.fits
    description: "2D 光谱拟合（200 行，分段 4×50 行完整运行，200/200 行全部产出 row fits，实测 PASS）"
    command: "alfa -cl test/2d_small.fits"

# test_package 自带测试（消费者视角验证）
test_package_tests:
  - file: test_package/test.sh
    description: "消费者测试：--citation 版本断言 + 上游 1d.ascii 真实拟合断言（产出 fits）"
    command: "./test.sh <alfa-binary> <workdir>"

assertion_count: 2
