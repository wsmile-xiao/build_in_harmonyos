software: abiword-plugin-gdict
version: "3.0.8"
status: built
build_system: autotools
build_date: "2026-08-22"

source:
  url: "https://gitlab.gnome.org/World/AbiWord/-/archive/release-3.0.8/AbiWord-release-3.0.8.tar.gz"
  sha256: "7c490e46f0a6143f84d5c7e3fed246f34486ad70cd55f162c792827607cd7e9a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-plugins=gdict"
    - "--disable-default-plugins"
    - "--with-gtk2=no"
    - "--build=aarch64-linux"
    - "--host=aarch64-linux"
  dependencies:
    - "boost/1.90.0.3"
    - "glib/2.84.0.1.1"
    - "libgsf/1.14.58"
    - "wv/1.2.9"
    - "libxslt/1.1.45.2"
    - "libpng/1.6.58"
    - "libjpeg/10"
    - "zlib/1.3.1.1"
    - "libxml2/2.15.3.1 (override)"
    - "fribidi/1.0.16"
    - "automake/1.18 (build)"
    - "libtool/2.5.4 (build)"
  runtime_contract:
    - "AbiWord 3.0.8 host ABI (resolved by the host process at dlopen time)"
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  type: conan-verify
  total: 5
  passed: 5
  failed: 0
  note: "Shadow r20 passed conan create and the ELF ABI smoke test; L0/L1/L4/L5 passed and L2 skipped because the library package has no bin directory."

knowledge_gained:
  - "gdict is a UNIX/GTK plugin in the AbiWord 3.0.8 source tree, not a standalone upstream project."
  - "AbiWord host ABI symbols are resolved by the host process at plugin load time and are not packaged as a Conan build dependency."
  - "AbiWord's generated configure files and Autoconf Archive/libgcrypt macros are supplied by the recipe export_sources."
  - "OHOS compilation needs FriBidi's nested include directory and both GLib generated-header include directories."
  - "The POSIX smoke test must select an available device shell instead of inheriting CONFIG_SHELL=bash."
  - "The package test validates the ELF module and the three exported AbiWord plugin ABI symbols."
  - "A host-loaded plugin can intentionally retain host ABI imports when the package validates the module format and stable plugin entry points instead of treating the artifact as a normal consumer library."

knowledge_ref:
  - "E337-draft-abiword-plugin-host-abi-module"
