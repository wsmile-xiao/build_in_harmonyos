package: abiword-plugin-gdict/3.0.8
homepage: "https://gitlab.gnome.org/World/AbiWord"

# The AbiWord tarball has no plugin-specific test suite.  The package test
# below validates the actual module artifact and all three public plugin ABI
# entry points.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check (not run: full AbiWord host/UI suite)"
upstream_tests: []

test_package_tests:
  - file: test_gdict.sh
    description: "验证 gdict.so ELF 以及 AbiWord 插件 ABI 导出符号"
    command: "./test_gdict.sh <package-folder>"

assertion_count: 5
