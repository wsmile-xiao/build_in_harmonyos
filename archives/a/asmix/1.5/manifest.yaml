# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5"

# 软件名
software: asmix

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-22"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/a/asmix/asmix_1.5.orig.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "libxpm 未发布 ohpcd 时 asmix 可用纯 Xlib XCreatePixmap 替代 XpmCreatePixmapFromData（XPM 图标剔除补丁），X11 依赖链 libx11/libxext/libxau 已发布"
- "旧 autoconf（2004）生成的 Makefile 无 VPATH：conan 的 build-release 目录 make 找不到上级源码，需 in-source 构建（cwd=source_folder）"
- "Makefile 链接用 $(LIBRARIES)=$(LIBS_X) $(LIBS_XEXTS)：库名必须放进变量值，不能作为 make 裸参数（否则 ld.lld undefined symbol）"
- "conan copy() 在 in-source 布局下复制不到 build 根产物（No files in this package），用 shutil.copy2 直接复制可靠"
- "xorgproto 头未定义 Pixel typedef，X11 应用需补 typedef unsigned long Pixel" 
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/asmix-1.5.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/asmix-1.5.work
  source_orig_hash: 9b852011ad2ce706
  source_work_hash: 5f8257c747ee13d6
  generated_at: '2026-08-22T18:25:52'
  patches_count: 1

patch_classification:
  - file: 0001-asmix.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
