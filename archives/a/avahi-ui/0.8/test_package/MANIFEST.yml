package: avahi-ui/0.8
homepage: "https://github.com/avahi/avahi"

upstream_check_command: "make -C avahi-common && make -C avahi-glib"
upstream_test_in_build: true
upstream_test_command: "./strlst-test; ./domain-test; ./alternative-test; ./timeval-test; ./utf8-test; ./glib-watch-test"

upstream_tests:
  - file: strlst-test.c
    source: avahi-0.8/avahi-common/strlst-test.c
    description: "String list helpers unit test"
    command: "./strlst-test"
  - file: domain-test.c
    source: avahi-0.8/avahi-common/domain-test.c
    description: "Domain-name encoding/decoding unit test"
    command: "./domain-test"
  - file: alternative-test.c
    source: avahi-0.8/avahi-common/alternative-test.c
    description: "Alternative host-name generation unit test"
    command: "./alternative-test"
  - file: timeval-test.c
    source: avahi-0.8/avahi-common/timeval-test.c
    description: "timeval arithmetic unit test"
    command: "./timeval-test"
  - file: utf8-test.c
    source: avahi-0.8/avahi-common/utf8-test.c
    description: "UTF-8 validation unit test"
    command: "./utf8-test"
  - file: glib-watch-test.c
    source: avahi-0.8/avahi-glib/glib-watch-test.c
    description: "GLib watch/timeout integration test (no daemon required)"
    command: "./glib-watch-test"

upstream_tests_exist: true
upstream_test_audit:
  - path: "avahi-ui/Makefile.am"
    finding: "Declares no TESTS target; the avahi-ui library itself has no standalone upstream test binary"
  - path: "avahi-common/Makefile.am"
    finding: "noinst_PROGRAMS under ENABLE_TESTS: strlst-test, domain-test, alternative-test, timeval-test, watch-test, watch-test-thread, utf8-test"
  - path: "avahi-glib/Makefile.am"
    finding: "noinst_PROGRAMS under ENABLE_TESTS: glib-watch-test"
  - path: "avahi-client/Makefile.am"
    finding: "noinst_PROGRAMS: client-test, srv-test, xdg-config-test, rr-test, check-nss-test — all require a running avahi-daemon, not runnable in CI sandbox"

test_package_tests:
  - file: test.c
    description: "Consumer test: AuiServiceDialog GType registration, GtkDialog inheritance and published GObject properties"
    command: "ctest --output-on-failure -R test_avahi_ui"

assertion_count: 7