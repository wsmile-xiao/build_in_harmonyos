source:
  url: "https://deb.debian.org/debian/pool/main/a/autotools-dev/autotools-dev_20240727.1+nmu1.tar.xz"
  sha256: "7aca74cad91197e752dfc4b8d8d03b97bc1bdd0f7b1a6a2b646ba151ad3a1a85"
  tar_format: tar.xz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-config-guess-set-e-robust.patch (config.guess libc 探测管道加 || true，兼容严格管道语义，生产行为不变)"
  - "patches/0002-config-guess-case-alternation.patch (config.guess 首个 case 的 Linux|GNU|GNU/* 交替模式拆为单模式+标志变量，兼容 OHOS toybox sh 不支持 case 模式 | 交替的缺陷，POSIX 语义等价)"
  - "patches/0003-config-guess-heredoc-robust.patch (config.guess libc 探测 dummy.c 的 <<- 制表符剥离 heredoc 重写为列0正文+普通 <<EOF（输出逐字节一致），消除 toybox sh 对 <<- 的解析风险；set_cc_for_build 回退分支 $RANDOM 改 ${RANDOM-}，消除 sh -eu nounset 地雷)"

knowledge_gained:
  - "config.sub 20240727 已原生支持 aarch64-linux-ohos 三元组，无需补丁"
  - "autotools-dev 为 Debian-native 纯脚本包，构建即运行上游 testsuite（make check）"
  - "testsuite Makefile 以裸 bash 调脚本，但 HNP bash 在 HMFS/HMDFS 上 getcwd 失败；用 bash -> /bin/sh 符号链接 shim 前置 PATH（HMBS_CAP_SYMLINK=1），不使用 /data/service/hnp/bin/bash"
  - "真机根因（第 5 轮确认，推翻第 3/4 轮 case 交替与 pipefail 假设）：0001+0002 均已应用真机仍报同样 38 失败（全部 system=Linux/GNU 元组）。arm|FreeBSD 元组同样调用 set_cc_for_build 且真机通过，排除临时目录机制；Linux|GNU 元组独有构造仅剩 libc 探测块内 'cat <<-EOF'（制表符剥离 heredoc）。toybox sh 源码 heredoc/set -e 均为部分实现（TODO 注释），<<- 终止符匹配失效会使 heredoc 吞掉脚本余部并以非零退出（dash 模拟 rc=2 空输出，与真机 'unable to guess' 一致）。0003 补丁将该 heredoc 重写为列0正文+普通 <<EOF（输出逐字节一致），并修 set_cc_for_build 回退分支 $RANDOM 的 nounset 地雷（${RANDOM-}）。本地 LF+dash 严格 shell 验证 153 元组全过 0 失败"
