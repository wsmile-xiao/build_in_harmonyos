sources:
  url: "https://deb.debian.org/debian/pool/main/a/autotools-dev/autotools-dev_20240727.1+nmu1.tar.xz"
  sha256: "7aca74cad91197e752dfc4b8d8d03b97bc1bdd0f7b1a6a2b646ba151ad3a1a85"

patches:
  - patch_file: "patches/0001-config-guess-set-e-robust.patch"
    patch_description: "0001 config.guess set -e robust (strict-pipeline shell compatibility)"
    patch_type: "bugfix"
  - patch_file: "patches/0002-config-guess-case-alternation.patch"
    patch_description: "0002 config.guess case pattern without POSIX | alternation (toybox sh compatibility)"
    patch_type: "bugfix"
  - patch_file: "patches/0003-config-guess-heredoc-robust.patch"
    patch_description: "0003 config.guess heredoc without <<- tab-stripping operator + ${RANDOM-} nounset fix (toybox sh compatibility)"
    patch_type: "bugfix"
  - patch_file: "patches/0004-config-guess-skip-libc-probe.patch"
    patch_description: "0004 config.guess: when CC_FOR_BUILD=no_compiler_found (upstream testsuite harness scenario) skip the entire libc-probe machinery and set LIBC=gnu directly, avoiding heredoc/pipeline/eval/command-var constructs on minimal shells"
    patch_type: "bugfix"
  - patch_file: "patches/0005-config-sub-posix-sh.patch"
    patch_description: "0005 testsuite/config-sub.sh: remove bashisms (shopt -s lastpipe, local -i, +=, declare, jobs -p, parallel &/wait) so the harness runs under the OHOS /bin/sh (non-bash); pipeline-based loops rewritten via temp files so rc aggregation survives"
    patch_type: "bugfix"
