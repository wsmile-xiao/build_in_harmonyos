software: activity-aware-firefox
display: "Activity-aware Firefox"
description: "Firefox profile wrapper with a portable activity context provider"
category: desktop
homepage: "https://gitlab.com/hook/activity-aware-firefox"
license: MIT-0
build_system: custom

ohos_adaptation:
  key_points:
    - "Keep the KDE Activities provider when a Plasma activity CLI exists."
    - "Add explicit ID/name input for OpenHarmony and non-KDE desktops."
    - "Make xdpyinfo, kdialog and notify-send optional."
    - "Expose --probe-context for side-effect-free provider verification."
  common_dependencies: []

versions:
  "0.4.2+git20250816.c6082f37":
    status: built
    build_date: "2026-08-12"
