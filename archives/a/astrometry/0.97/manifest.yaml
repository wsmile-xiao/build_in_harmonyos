# 版本级 manifest
# 文件位置: archives/a/astrometry/0.97/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.97"

# 软件名
software: astrometry

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/dstndstn/astrometry.net/releases/download/0.97/astrometry.net-0.97.tar.gz"

  # 源码校验和
  sha256: "e4eef1b658ba5ad462282b661c0ca3a5c538ba1716e853f7970b7b9fa4a33459"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（configure 为占位脚本，直接由顶层 Makefile 驱动构建）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
  - cfitsio/4.6.4
  - zlib/1.3.1.1
  - bzip2/1.0.8
  - wcslib/8.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（gsl-an config.guess/config.sub 的 OHOS 识别由
# conanfile.py build() 内联修补，无独立 patch 文件）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "astrometry 顶层 configure 仅为占位脚本（echo Ok），实际由 Makefile 驱动构建"
- "自带 gsl-an 子树的 config.guess（2016 版）无法识别 HarmonyOS，需在 build() 内联修补 config.guess/config.sub 加入 ohos triplet"
- "autoconf 生成的 configure/config.status 用 umask 077 创建临时目录，在 HMDFS 上权限异常导致 config.h 生成失败，需改为 umask 000"
- "wcslib 无 pkg-config 文件，astrometry 通过 WCSLIB_INC/WCSLIB_LIB 环境变量检测 wcslib 支持（makefile.wcslib）"
- "bzip2 无 pkg-config 文件，catalogs/ucac*tofits 需要 bzlib.h，通过 C_INCLUDE_PATH/LIBRARY_PATH 环境变量提供"
- "test 硬编码 /tmp 临时路径（get_tmpfile），本地环境 /tmp 只读，需设置 TMP 指向可写目录"
- "上游 util 测试 125 断言全过；solver 测试 7 断言中 test_tweak_2 因 aarch64 平台浮点精度差异失败（期望 -0.000010 实得 -0.000011，差异 1e-6 超出容差 3e-7）"
