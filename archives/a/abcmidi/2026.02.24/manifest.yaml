# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS SGID + umask 077 导致临时目录 drwx--S--- 不可写入，chmod 无法修复（E046 SELinux 限制）；解决方案: umask 022 替代 umask 077"
  - "Savannah 下载不稳定（重定向到 fosszone 镜像超时），可从 SourceForge 或 GitHub 获取源码"
  - "bash (GNU 5.3.0) 无法执行 /usr/bin 下 toybox symlink，需用 zsh 运行 configure/config.status"
  - "abc2abc/yaps/mftext 不支持 --version 标志，以 abc2midi 版本号确认软件版本"

