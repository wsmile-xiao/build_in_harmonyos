software: apparmor
# 软件级 manifest 模板
# 文件位置: archives/a/apparmor/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件基本信息
# ============================================================

name: apparmor
description: "AppArmor - Linux 安全模块用户空间工具"
category: security
license: GPL-2.0+ (libapparmor LGPL-2.0+)

# ============================================================
# 版本索引
# ============================================================

versions:
  "4.1.0":
    status: built
    build_date: "2026-06-18"
    notes: "核心组件编译成功，parser/utils待完成"

# ============================================================
# 软件特性
# ============================================================

features:
  multi_component: true
  build_order:
    - libapparmor
    - binutils
    - parser
    - utils
    - profiles
  kernel_dependent: true

# ============================================================
# 平台兼容性
# ============================================================

compatibility:
  ohos:
    status: partial
    notes: "核心库和工具可编译，内核 LSM 功能受限"
  linux:
    status: full