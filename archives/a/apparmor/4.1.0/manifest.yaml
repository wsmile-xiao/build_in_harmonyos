software: apparmor
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.com/apparmor/apparmor/-/archive/v4.1.0/apparmor-v4.1.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型 - AppArmor 是多组件项目
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: custom

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 多组件构建顺序
  components:
    - name: libapparmor
      system: autotools
      status: built
      artifacts:
        - lib/libapparmor.so.1.24.2
        - lib/libapparmor.a
    - name: binutils
      system: makefile
      status: built
      artifacts:
        - bin/aa-enabled
        - bin/aa-exec
        - bin/aa-features-abi
        - bin/aa-load
        - bin/aa-status
    - name: parser
      system: makefile
      status: failed
      reason: "Linux 内核头文件缺失 (linux/capability.h)、gettext 库不兼容、GCC 扩展头文件缺失 (ext/stdio_filebuf.h)"
    - name: utils
      system: python
      status: skipped
      reason: "Python 工具依赖 parser，parser 编译失败"
    - name: profiles
      system: makefile
      status: skipped
      reason: "配置文件需要 parser 验证，parser 编译失败"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gettext/0.22.5

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# 源码修改（非补丁形式）
source_modifications:
  - file: libraries/libapparmor/configure.ac
    change: "移除 AX_CHECK_COMPILE_FLAG 检查，简化 EXTRA_CFLAGS"
  - file: libraries/libapparmor/configure
    change: "修改 TMPDIR 使用，修改 umask 从 077 到 000"
  - file: libraries/libapparmor/src/af_protos.h
    change: "重新生成，使用正确的 IPPROTO_* 常量"
  - file: binutils/aa_enabled.c
    change: "禁用 gettext 功能，注释 bindtextdomain/textdomain 调用"
  - file: binutils/aa_exec.c
    change: "禁用 gettext 功能"
  - file: binutils/aa_features_abi.c
    change: "禁用 gettext 功能"
  - file: binutils/aa_load.c
    change: "添加 limits.h 头文件，禁用 gettext"

# ============================================================
# 产物信息
# ============================================================

artifacts:
  libraries:
    - libapparmor.so.1.24.2
    - libapparmor.a
  binaries:
    - aa-enabled
    - aa-exec
    - aa-features-abi
    - aa-load
    - aa-status

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "AppArmor 是多组件项目，需要按顺序编译"
  - "gettext 预编译库符号不兼容，需要禁用"
  - "lld 链接器缺少 libxml2，需要使用 GNU ld"
  - "HMDFS 文件系统有 umask 限制"
  - "parser 需要手动生成 generated_af_names.h 和 generated_cap_names.h"
