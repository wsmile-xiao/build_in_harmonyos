software: assimp-5
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/5.4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.4.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-22"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/assimp/assimp/archive/refs/tags/v5.4.3.tar.gz"

  # 源码校验和
  sha256: "66dfbaee288f2bc43172440a55d0235dfc7bf885dda6435c038e8000e79582cb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=$OHOS_NDK_HOME/build/cmake/ohos.toolchain.cmake"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DASSIMP_BUILD_TESTS=ON"
    - "-DASSIMP_RUN_INTEGRATION_TESTS=ON"
    - "-DASSIMP_BUILD_ASSIMP_TOOLS=OFF"
    - "-DASSIMP_BUILD_SAMPLES=OFF"
    - "-DASSIMP_WARNINGS_AS_ERRORS=OFF"
    - "-DASSIMP_BUILD_ZLIB=OFF"
    - "-DASSIMP_BUILD_USE_CCACHE=OFF"
    - "-DASSIMP_BUILD_DRACO=OFF"
    - "-DASSIMP_BUILD_USD_IMPORTER=OFF"
    - "-DASSIMP_BUILD_PBRT_IMPORTER=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-ohos-tmp-path.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "5.4.3 上游 gtest 在 OHOS toolchain 下可编可跑，577 个用例全过；唯一需要 patch 的是 TMP_PATH（/tmp 在 OHOS 6.0 只读）"
  - "assimp 5.4.3 真认 ASSIMP_BUILD_3MF_IMPORTER=OFF（CMake 输出 'Disabled importer formats: 3MF'），导致 utD3MFImporterExporter.import3MFFromFileTest 失败；3MF 在 5.4.3 是内置实现（GLTF2-based）不需外部依赖，应当 enable"
  - "assimp 测试可执行文件 target 名是 unit 不是 unittest（6.0.5 改名过，5.4.3 还是 unit）"
  - "llvm-ranlib 缺失仍是造 .a 时的隐形杀手：cmake 调 <AR> qc 后无 ranlib 报错，但产物损坏，须用 shutil.which('llvm-ranlib') 兜底"
  - "鸿蒙 XPM 真机 dlopen 必须要求 libassimp.so 已 binary-sign-tool 签名；conan install 复制会破坏链接器自签，须在 _sign_binaries() 重新签一次"
