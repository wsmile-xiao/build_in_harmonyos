package: assimp-5/5.4.3
homepage: "https://github.com/assimp/assimp"

upstream_check_command: "./unit"
upstream_test_in_build: true
upstream_test_command: "cmake --build build-ohos --target unit && ./build-ohos/bin/unit"

upstream_tests:
  - file: test/unit/Main.cpp
    source: assimp-5.4.3/test/unit/
    description: "上游 googletest 套件（ASSIMP_BUILD_TESTS=ON），可执行文件 target 名为 unit；OHOS 下实测 577 tests / 115 suites"
    command: "./unit"

test_package_tests:
  - file: test.cpp
    description: "解析最小 OBJ 模型 + 版本断言 + dlopen libassimp.so 真机加载验证"
    command: "./test_probe"

assertion_count: 21
