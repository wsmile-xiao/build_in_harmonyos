software: aml
display: "aml"
description: "aml - Another Main Loop: a small main-loop/event-loop library for C"
category: foundation
homepage: "https://github.com/any1/aml"
license: ISC
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 构建（meson.build → libaml.so/libaml.a），公共头文件安装到 include/aml1/aml.h，pkg-config 名 aml1，consumer 需 -I include/aml1"
    - "OHOS libc 不提供 pthread_setcancelstate（头文件无声明、库中无符号），须 meson cc.has_function 特性检测 + 宏守卫，勿硬编码平台宏"
    - "epoll 后端自动探测：sys/epoll.h 存在即选 epoll（OHOS 支持），kqueue 分支仅在 BSD 生效"

versions:
  "1.0.0":
    status: published
    build_date: "2026-09-24"
    notes: "首次适配；2 个补丁（meson 特性检测 + thread-pool 守卫）；上游无测试用例（无 tests/ 目录、meson 无 test 注册）；消费者测试 test_package/test.c 真实运行事件循环通过"
