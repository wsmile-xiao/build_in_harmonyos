# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aml/1.0.0
homepage: "https://github.com/any1/aml"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# aml 1.0.0 上游不注册任何测试：meson test --list 输出 "No tests defined"，
# 源码树无 tests/ 目录、无 test 目标。examples/ 下的 ticker/nested-ticker/reader
# 是示例程序（默认 examples=false 不构建），不是测试用例，不计入上游用例数。
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# test.c 使用公共头文件 <aml1/aml.h> 的公开 API：aml_new/aml_set_default/
# aml_ticker_new/aml_start/aml_timer_new/aml_run/aml_exit/aml_version，
# 编译、链接 libaml 并实际运行事件循环，断言 ticker 回调触发（可观察结果）。
test_package_tests:
  - file: test.c
    description: "消费者测试：创建 aml 事件循环，运行 ticker 定时器，验证回调触发后正常退出"
    command: "./test_aml"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
