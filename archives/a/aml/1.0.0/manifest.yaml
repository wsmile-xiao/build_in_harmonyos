- "OHOS libc 不提供 pthread_setcancelstate（头文件无声明、库中无符号），须用 meson cc.has_function 特性检测加宏守卫，勿硬编码平台宏"
- "本机 meson/clang 子进程无法按 PATH 解析裸命令（posix_spawn 不搜索 PATH），须以绝对路径注入 CC/CXX/AR/RANLIB/NM/STRIP"

