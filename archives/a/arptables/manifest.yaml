# 软件级 manifest — arptables
# 文件位置: archives/a/arptables/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: arptables
display: "arptables"
description: "Userspace ARP packet filtering firewall tool"
category: network
homepage: "https://github.com/KVM-COLO/arptables"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "OHOS (musl libc) lacks u_int*_t types — add typedefs mapping to uint*_t"
    - "sockaddr_storage redefinition between <sys/socket.h> and <linux/socket.h> — predefine _UAPI_LINUX_SOCKET_H guard"
    - "OHOS lacks coreutils 'install' command — replace with cp+chmod in Makefile"
    - "Use COPT_FLAGS to pass extra CFLAGS; Makefile handles ARPTABLES_VERSION quoting"
  common_dependencies: []

versions:
  "0.0.4":
    status: built
    build_date: 2026-08-17
