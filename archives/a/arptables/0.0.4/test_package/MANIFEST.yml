# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: arptables/0.0.4
homepage: "https://github.com/KVM-COLO/arptables"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# arptables 无 make check 目标，跳过上游测试
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests_skip_reason: "arptables has no 'make check' target — upstream provides no test suite"

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: run arptables --version to verify binary executes and outputs version string"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
