# conandata.yml — anacron 2.3
# 源来自 Debian pool（anacron 上游 2.3 之后改由 Debian 打包维护，官方 tarball 只在此处发布）
# 协议用 https（审查 review-memory 第 12 条：URL 必须 HTTPS）——同一上游文件，sha256 不变

sources:
  url: "https://deb.debian.org/debian/pool/main/a/anacron/anacron_2.3.orig.tar.gz"
  sha256: "ceee7520bc49f861499f7eff4c7990d21d39d8a1d3e24449947a7ed5aa34761d"

# 源码级修复不在这里 —— 全部落在 conanfile.py 的 build() 内（_SOURCE_FIXES）。
# 依据 经验 §12.50⑤：`finish` Step1 的 refresh-patch --auto 会按探索树的
# edit-tracker 重新生成 patches/ 并把手写补丁挪进 patches/.patch-backup-<ts>，
# 该隐藏目录会被 CI junk 门禁拦下、conandata 引用同时失效（gnuspool #10775
# 两连败后统一为「构建系统级改写放 build() 内」口径）。
patches: {}
