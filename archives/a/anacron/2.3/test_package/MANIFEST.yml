# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: anacron/2.3
homepage: "https://packages.debian.org/source/sid/anacron"

# 上游 Makefile 只有 all / installdirs / install / clean / distclean / dist /
# release 目标，没有 check ⇒ 留空，免得 CI 去跑一个不存在的目标。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 实测口径 = §12.72 四类（2026-10-06 对 24085 B / sha256 ceee75…61d 的 orig
# tarball 全树清点，18 条目 = 1 目录 + 17 文件，tar tzf 实测）：
#   1) test*/ 框架源码      = 0（无 test* 目录，无 test*.c/sh、*_test.c、check*.c）
#   2) */res 语料目录        = 0
#   3) **/*RUNTEST* 脚本     = 0
#   4) src/demo|examples/*.c = 0
# ⇒ 上游测试资产总数 = 0（不是"未注册进构建系统"，是源码树里根本没有）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# test.sh 共 7 个正向断言：
#   1 anacron 可解析(conanrun PATH)   2 -V 版本串          3 anacrontab 解析+调度
#   4 job 经 fork/exec 真实执行       5 spool 时间戳文件     6 ANACRON_SPOOL 覆盖口
#   7 -u 只更新时间戳不执行
test_package_tests:
  - file: test.sh
    description: "消费者测试：版本 + anacrontab 解析 + spool 时间戳 + 真实执行 + 覆盖口"
    command: "bash test.sh"

# 测试断言总数 —— 上游 0 + 消费者 7 = 7（与 manifest.yaml / notes.md 同源）
assertion_count: 7
