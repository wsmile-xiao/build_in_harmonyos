# 版本级 manifest
# 文件位置: archives/a/anacron/2.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3"

# 软件名
software: "anacron"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-06"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # anacron 2.3 的官方发布物只在 Debian pool（上游 2.3 之后由 Debian 打包维护）
  url: "http://deb.debian.org/debian/pool/main/a/anacron/anacron_2.3.orig.tar.gz"

  # 源码校验和（本地 sha256sum 实测）
  sha256: "ceee7520bc49f861499f7eff4c7990d21d39d8a1d3e24449947a7ed5aa34761d"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: "makefile"

  # 配置选项列表 —— 上游无 configure，全部通过 make 变量注入
  # （PREFIX 必须留空：installdirs 用 $(PREFIX)$(SPOOLDIR) 双拼）
  configure_options:
    - "CC=<tools.build:compiler_executables.c 或 clang>"
    - "CPPFLAGS=-I."
    - "PREFIX="
    - "BINDIR=<package_folder>/bin"
    - "MANDIR=<package_folder>/share/man"
    - "SPOOLDIR=<package_folder>/var/spool/anacron"
    - "ANACRONTAB=<package_folder>/etc/anacrontab"
    - "INSTALL_DIR=mkdir -p"
    - "INSTALL_PROGRAM=cp"
    - "INSTALL_DATA=cp"

  # 编译依赖列表（格式: name/version）—— 零依赖，obstack 走 vendor
  dependencies: []

  # 编译器
  cc: "clang"
  cxx: "clang++"

# ============================================================
# 补丁信息
# ============================================================

# 本包无 patches/ 目录：六处源码级改写固化在 conanfile.py 的 _SOURCE_FIXES，
# 由 build() 幂等应用（§12.50⑤ 统一口径 —— refresh-patch 会重生成 patches/ 并留下
# .patch-backup-* 隐藏目录，CI junk 门禁会拦，gnuspool #10775 实证）。
patches_applied: []

# ============================================================
# 测试口径（★ 与 notes.md、交付说明三处同源，实测自数）
# ============================================================

tests:
  # §12.72 资产口径，四类逐项清点 24085 B / sha256 ceee75…61d 的 orig tarball
  # 全树（18 条目 = 1 目录 + 17 文件，tar tzf 实测）：
  #   1) test*/ 框架源码      = 0
  #   2) */res 语料目录        = 0
  #   3) **/*RUNTEST* 脚本     = 0
  #   4) src/demo|examples/*.c = 0
  upstream_asset_total: 0
  # 上游注册进构建系统的测试数（Makefile 无 check 目标）
  upstream_registered: 0
  # 消费者测试（test_package/test.sh 正向断言数）
  consumer_assertions: 7
  # 断言总数
  total: 7

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "编译期烧死的 SPOOLDIR/ANACRONTAB 宏 + 上游 installdirs 的 $(PREFIX)$(SPOOLDIR) 双拼 ⇒ PREFIX 必须留空并逐个传绝对路径"
  - "spool 目录无运行时覆盖口（-t 只覆盖 anacrontab）⇒ 加 ANACRON_SPOOL 环境变量覆盖口"
  - "tempnam(NULL,NULL)→P_tmpdir=/tmp 只读，且本平台 libc 忽略 $TMPDIR ⇒ 临时文件改用已 chdir 进入的 spool"
  - "musl/HarmonyOS 无 <obstack.h> ⇒ vendor GNU C Library obstack（经 gcc-mirror 取得，LGPL-2.1+；LGPL-2.1 §6 可重标注 GPL v2+）。⚠ 更正：制品仓有 musl-obstack/1.2.3（4 个配方 requires），初版只查 4 个精确名漏检它 —— 仍选 vendor 是为 application 包免 shared 依赖，非查无"
  - "getpwuid() 对本平台 app/sandbox uid 返回 NULL（uid 不在 /etc/passwd）⇒ 邮件头地址退回 $LOGNAME/$USER"
  - "上游 gregor.c 未初始化 const 自动变量后赋值，clang 拒绝"
  - "HarmonyOS 无 install(1)（coreutils 装成 ginstall）⇒ make 覆盖 INSTALL_DIR/PROGRAM/DATA"

# 无补丁集 ⇒ 同步清空 refresh-patch 的历史产物段（W4 P2-1）：
# 本包走 §12.50⑤「源码改写放 build() 内」口径，patches/ 实物为空、
# conandata patches: {}、patches_applied: []，三者必须一致，
# 不得再留 patches_count: 1 / 0001-gregor.c.patch 的陈旧读数。
patch_generation:
  method: none
  patches_count: 0

patch_classification: []
