# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "hnp node 自带 npm wrapper 损坏（Signal 5，V8 errno DCHECK）：必须定位 node 前缀下的 lib/node_modules/npm/bin/npm-cli.js 用 node 直接调用，并设 NODE_OPTIONS=--jitless"
  - "OHOS 上 npm --omit=dev / prune 会误删传递依赖（如 supports-color），Node.js 应用整树打包 node_modules 最可靠"
  - "Node v24 DEP0180 弃用警告会污染 stderr 破坏精确匹配断言 → 测试环境用 NODE_OPTIONS=--no-deprecation（仅测试环境，不改上游）"
  - "node 在 OHOS 上继承 AppSpawn/ALACRITTY/UBSAN 等环境变量时可能 Signal 5 → launcher 用 env -i 干净环境（PATH/HOME/TMPDIR）"
