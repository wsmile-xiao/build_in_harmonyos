# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: alexjs/11.0.1
homepage: "https://alexjs.com"

# 上游测试命令 (npm 包无 make check；测试入口为 test/index.js，tape 驱动)
upstream_check_command: "node test/index.js"

# conanfile.py build() 方法中是否已集成上游测试 (build() 内执行 npm install + node test/index.js)
upstream_test_in_build: true
upstream_test_command: "NODE_OPTIONS=--jitless --no-deprecation node test/index.js"

# 上游实际运行的测试程序 (alex 11.0.1 GitHub 仓库 test/ 目录: test/api.js + test/cli.js)
upstream_tests:
  - name: api-suite
    file: test/api.js
    source: get-alex/alex@11.0.1/test/api.js
    description: "alex() / markdown() / mdx() / text() / html() API 断言（insensitive 词检测、allow 配置、profanity）"
    command: "node test/index.js"
    count: 35
  - name: cli-suite
    file: test/cli.js
    source: get-alex/alex@11.0.1/test/cli.js
    description: "CLI 断言（--version/-v、--help、--stdin、glob、--quiet、--profanity-sureness、--reporter、deny/allow 配置）"
    command: "node test/index.js"
    count: 12

# test_package 中自带的测试 (消费者视角验证, 执行打包后的 bin/alex)
test_package_tests:
  - file: test.sh
    description: "消费者测试: bin/alex --version 断言 11.0.1；--stdin 敏感词检测（exit 1 + 警告行）；干净文本通过（exit 0）"
    command: "sh test.sh <alex-bin-path>"
    count: 3

# 测试断言总数 (上游 47 个 tape 断言 + test_package 3 项消费者断言)
upstream_case_count: 47
test_package_assertion_count: 3
assertion_count: 50
