package: acf-openssh/0.11.2
homepage: "https://gitlab.alpinelinux.org/acf/acf-openssh"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "Makefile"
    finding: "Only all/clean/dist/install/dist-install targets; no check or test target"
  - path: "source archive"
    finding: "Two Lua modules, eight LSP resources, menu and roles; no test directory or framework"
  - path: "Alpine aports"
    finding: "The package has no check function or upstream test invocation"

test_package_tests:
  - file: "test_layout.sh"
    description: "Verify all 12 resources and byte-compare the three no-link views with their real acf-core templates"
    command: "sh test_layout.sh <package-folder> <acf-core-package-folder>"
  - file: "test.lua"
    description: "Load packaged controller/model with real Conan ACF/Lua dependencies; read, reject, update, and persist a temporary sshd_config"
    command: "acf-openssh-test-runner test.lua <app-dir> <temporary-config>"

assertion_count: 48
