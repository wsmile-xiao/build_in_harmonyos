package: aiven-client/4.16.0
homepage: "https://github.com/aiven/aiven-client"

# 上游测试命令 — aiven-client 上游使用 pytest
upstream_check_command: "python3 -m pytest tests/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_cli.py
    source: aiven-client-4.16.0/tests/test_cli.py
    description: "上游 pytest 测试 — AivenCLI 命令行入口/服务/主题/OAuth2/连接池"
    command: "python3 -m pytest tests/test_cli.py"
  - file: tests/test_client.py
    source: aiven-client-4.16.0/tests/test_client.py
    description: "上游 pytest 测试 — AivenClient API 响应处理/重试/byoc_tags"
    command: "python3 -m pytest tests/test_client.py"
  - file: tests/test_pretty.py
    source: aiven-client-4.16.0/tests/test_pretty.py
    description: "上游 pytest 测试 — format_item/flatten_list/print_table/yield_table"
    command: "python3 -m pytest tests/test_pretty.py"
  - file: tests/test_session.py
    source: aiven-client-4.16.0/tests/test_session.py
    description: "上游 pytest 测试 — get_requests_session/AivenClientAdapter 参数"
    command: "python3 -m pytest tests/test_session.py"
  - file: tests/test_speller.py
    source: aiven-client-4.16.0/tests/test_speller.py
    description: "上游 pytest 测试 — speller.suggest 拼写建议"
    command: "python3 -m pytest tests/test_speller.py"
  - file: tests/test_argx.py
    source: aiven-client-4.16.0/tests/test_argx.py
    description: "上游 pytest 测试 — argx.CommandLineTool 命令行机制"
    command: "python3 -m pytest tests/test_argx.py"
  - file: tests/test_cliarg.py
    source: aiven-client-4.16.0/tests/test_cliarg.py
    description: "上游 pytest 测试 — cliarg arg 装饰器 user_config_json"
    command: "python3 -m pytest tests/test_cliarg.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: 模块导入 + 版本断言 + AivenClient 类 + argx.CommandLineTool + pretty.format_item + speller.suggest + cli.AivenCLI + session.get_requests_session"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
