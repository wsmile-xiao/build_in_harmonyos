software: "aiven-client"
version: "4.16.0"
status: built
build_date: "2026-08-10"
build_system: hatchling
source:
  # 官方 PyPI /packages/source/ 源码包 URL（避免 CI pre-download 正则截断哈希目录 URL，
  # 详见 notes.md "W3 阻塞修复" 一节）。sha256 与 PyPI 哈希目录 sdist 完全一致。
  url: "https://files.pythonhosted.org/packages/source/a/aiven-client/aiven_client-4.16.0.tar.gz"
  sha256: "469f9b9f73761dabe2ab7b8d70a593c6ace2a4a3c47fcf0a44a6e308cc813ccb"
  tar_format: tar.gz
build:
  system: hatchling
  configure_options:
    - "pip install . --prefix=$DEFAULT_PREFIX --no-deps"
  dependencies: []
  cc: ""
  cxx: ""
patches_applied: []
knowledge_gained:
  - "aiven-client (avn) 是 Aiven 官方命令行客户端，纯 Python 包（aiven/ layout），构建后端 hatchling + hatch-vcs"
  - "sdist 已含生成文件 aiven/client/version.py（固定 __version__='4.16.0'），无需 git tag 即可构建"
  - "运行时依赖 requests/requests-toolbelt/certifi 由设备端 pip 环境提供，不通过 Conan 管理（纯 Python 库惯例，同 pluggy/cfgv）"
  - "上游测试套件 223 tests 全部通过（pytest tests/ -v），100% 通过率"
  - "test_package 采用 7 项 smoke test（模块导入/版本/AivenClient/argx/pretty/speller/session），不依赖 pytest"
  - "CI L0p 门禁修复（#24383）：OHOS profile 强制要求 settings 四项齐全（os/compiler/build_type/arch），纯 Python 包亦不例外。对齐 arno-iptables-firewall 2.0.3（纯 shell 脚本包）/aribb24 1.0.3/kcrash 6.14.0 等已通过 CI 的非 C++ 包惯例，compiler/build_type 在 pip install 构建中不会被实际读取，仅满足门禁"
