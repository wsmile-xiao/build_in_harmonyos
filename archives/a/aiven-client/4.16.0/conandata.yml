sources:
  "4.16.0":
    # 官方 PyPI 源码包 URL（/packages/source/ 形式）。
    # 关键：CI build_and_test.sh 的 pre-download 正则 [^\s"'-]+ 会在 URL 的连字符 '-' 处截断
    # 文件名。若用哈希目录 URL（/packages/db/29/...），截断后的 .../aiven_client 会返回
    # 359 字节 NoSuchKey XML（size>100 被误判下载成功），改写 conandata.yml 为错误的
    # file:// 路径 → conan create FileNotFoundError。
    # 而 /packages/source/ 形式的截断 URL 返回 0 字节（判定失败），conan 直接用官方 URL
    # 下载成功（同 alabaster/carburetor 等已发布 Python 包的做法）。sha256 与哈希目录
    # URL 的 sdist 完全一致（469f9b9f...），已实测下载验证。
    url: "https://files.pythonhosted.org/packages/source/a/aiven-client/aiven_client-4.16.0.tar.gz"
    sha256: "469f9b9f73761dabe2ab7b8d70a593c6ace2a4a3c47fcf0a44a6e308cc813ccb"
patches: []
