# 版本级 manifest — asymptote 3.12
version: "3.12"
software: "asymptote"

# 编译状态: published | built | failed | archived
status: published
build_date: "2026-08-16"
build_system: autotools

source:
  url: "https://sourceforge.net/projects/asymptote/files/3.12/asymptote-3.12.src.tgz/download"
  sha256: "eaec1e97463ef213a393c388d466a73478b0818f9403c962b91240659c9b8f1b"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--disable-gl"
    - "--disable-vulkan"
    - "--enable-gsl"
    - "--enable-gc"
    - "--enable-readline"
  dependencies:
    - gsl/2.8
    - zlib/1.3.1.1
    - gc/8.2.12
    - readline/8.3
    - ncurses/6.6   # readline/8.3 传递依赖（静态）
  cc: clang
  cxx: clang++

patches_applied:
  - "001-makefile-gc-override-and-doc.patch"
  - "002-config-status-readable-temp.patch"
  - "003-skip-latex-doc.patch"
  - "004-gc-config-status-readable-temp.patch"

knowledge_gained:
  - "OHOS 的 python3 os.posix_spawn 不搜索 PATH，脚本子进程调用 clang++ 必须用完整路径（conan 环境由 toolchain 提供）"
  - "OHOS sysroot libc 缺少 pthread_setcancelstate/pthread_cancel 符号，bundled Boehm GC 8.2.8 链接失败，改用 conan gc/8.2.12（无此引用）"
  - "config.guess 无法识别 HarmonyOS，autotools 项目需 --build=aarch64-unknown-linux-gnu"
  - "configure/config.status 的 umask 077 临时目录在 HMDFS 上 Permission denied，需改为 022"
  - "GNU make 的 FIFO jobserver 在 OHOS 不可用，需 --jobserver-style=pipe"
  - "zlib 是 configure 硬性依赖（AC_CHECK_LIB z deflate），必须提供"
  - "ncurses 包仅提供 libncursesw，configure 检测 -lncurses 需 pkg-config 提供 ncurses.pc 映射"
  - "gsl 动态库需 -lgslcblas（通过 pkg-config gsl.pc 传递完整链接标志）"
  - "GNU make 中 `revision = \"\"` 是字面双引号导致 ifeq fallback 失效，tarball 构建时版本号为空"
  - "make check: errortests 因 GC PT_GNU_RELRO 警告污染 stderr 失败；deconstruct 需 latex；functional 104/104 通过；gs 需 Ghostscript"

