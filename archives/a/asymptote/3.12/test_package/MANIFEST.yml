# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: asymptote/3.12
homepage: "https://asymptote.sourceforge.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# （本次适配中 make check 已在探索阶段执行：functional 104/104 PASS，
#   errortests/deconstruct 因平台环境限制失败，见 notes.md）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: wce
    source: asymptote-3.12/wce
    description: "Asymptote 上游测试驱动：编译器错误测试(errortests) + deconstruct 交互输出验证"
    command: "./wce"

# test_package 中自带的测试 (消费者视角验证, R34 实质测试)
test_package_tests:
  - file: test_package.c
    description: "调用 asy --version 校验 'Asymptote 3.12'，并实际渲染 unitsquare 到 EPS 验证输出"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
