# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: alacritty/0.17.0
homepage: "https://github.com/alacritty/alacritty"

# 上游测试命令 (cargo test for Rust projects)
upstream_check_command: "cargo test --release --workspace --tests"

# 上游测试在 test_package 阶段执行（hmbs 预检只从 test_package 阶段
# stdout 采集 HMBS_UPSTREAM_TEST_RESULT 标记，tlsx/1.2.2 先例）
upstream_test_in_build: false
upstream_test_command: "cargo test --release -j2 --no-default-features --features wayland --workspace --tests -- --skip test_get_pw_entry"

# 上游测试存在性审计（hmbs 硬门禁要求）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 alacritty 0.17.0 存在完整测试套件，已接入并在真机完整执行。
  1. 注册口径 N=263（cargo workspace 6 个测试目标，真机 cargo test 框架
     "running N tests" 行对账）：
     - alacritty bin unittests（src/main.rs）：79 个 #[test]
     - alacritty_config lib unittests（src/lib.rs）：1 个 #[test]
     - alacritty_config_derive lib unittests（src/lib.rs）：0 个 #[test]
     - alacritty_config_derive tests/config.rs：7 个 #[test]
     - alacritty_terminal lib unittests（src/）：131 个 #[test]
     - alacritty_terminal tests/ref.rs：45 个 #[test]（含 ref/ 快照目录）
  2. 执行方式：cargo test --release --workspace --tests，全部离线纯逻辑
     测试，无网络/在线数据集依赖，可在 HarmonyOS aarch64 真机完整执行。
  3. doc-tests 说明：cargo test 默认的 doc-tests 阶段因 OHOS rust 工具链
     （Harmonybrew bottle）无可用 rustdoc 无法执行（cargo spawn rustdoc
     即 ENOENT，与同仓库已合入的 argc/1.24.0、martin/1.13.0、
     stylua/usage/gifski 先例一致，判定为平台限制）；alacritty 源码仅
     1 处 rust doctest 块（alacritty_terminal/src/term/mod.rs:2456），
     --tests 排除该阶段（0 个 doctest 用例受影响），不修改任何测试源。
  4. 平台豁免（1 例）：tty::unix::test_get_pw_entry 断言 getpwuid_r 对
     当前 uid 返回 passwd 条目；OHOS 应用沙盒 uid（真机实测 20020182）
     在 /etc/passwd 无条目（OHOS 应用用户模型，无传统 passwd 数据库，
     python3 pwd.getpwuid 复现 "uid not found"），属平台环境特性而非
     代码缺陷。用 cargo 原生过滤机制 -- --skip test_get_pw_entry 排除
     （框架报告 "1 filtered out"，不改测试源、不删断言），实测
     262 passed / 0 failed。
  5. 计数方式：以真机 cargo test 的 "test result:" 框架输出行为准
     （passed/failed/filtered 全部取自框架输出，非静态统计）。

# 上游实际运行的测试程序
upstream_tests:
  - file: alacritty/src/main.rs
    source: alacritty-0.17.0/alacritty/src/main.rs
    description: "alacritty bin 单元测试（79 个 #[test]）"
    command: "cargo test --release --workspace --tests"
  - file: alacritty_config/src/lib.rs
    source: alacritty-0.17.0/alacritty_config/src/lib.rs
    description: "alacritty_config 库单元测试（1 个 #[test]）"
    command: "cargo test --release --workspace --tests"
  - file: alacritty_config_derive/tests/config.rs
    source: alacritty-0.17.0/alacritty_config_derive/tests/config.rs
    description: "alacritty_config_derive 集成测试（7 个 #[test]）"
    command: "cargo test --release --workspace --tests"
  - file: alacritty_terminal/src/lib.rs
    source: alacritty-0.17.0/alacritty_terminal/src/lib.rs
    description: "alacritty_terminal 库单元测试（131 个 #[test]）"
    command: "cargo test --release --workspace --tests"
  - file: alacritty_terminal/tests/ref.rs
    source: alacritty-0.17.0/alacritty_terminal/tests/ref.rs
    description: "alacritty_terminal 集成测试（45 个 #[test]，含 ref/ 快照）"
    command: "cargo test --release --workspace --tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    source: test_package/test.sh
    description: "消费者冒烟测试 6 用例：--version 输出版本号 / --help 显示 Usage / msg 子命令路由 / 无效参数 clap 标准退出码 2 / migrate 子命令离线完成 YAML→TOML 迁移 / ELF arm64 架构核验"
    command: "/bin/sh test.sh"
