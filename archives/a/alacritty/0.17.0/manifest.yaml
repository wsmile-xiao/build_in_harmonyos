software: alacritty
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.17.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.17.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-08"

# 构建系统类型 (顶层字段)
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/alacritty/alacritty/archive/refs/tags/v0.17.0.tar.gz"

  # 源码校验和
  sha256: "38d6527d346cda5c6049332a1f3338a89ea66cd7981b54d4c3ce801b392496f8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | cargo | custom
  system: cargo

  # 配置选项列表
  configure_options:
  - "--no-default-features --features wayland"
  - "--locked -j 2"

  # 编译依赖列表（格式: name/version）
  # Rust crate 依赖由上游 Cargo.lock 管理（--locked 锁定）；Rust 工具链与
  # fontconfig 静态闭包在配方内从 Harmonybrew bottles 自举（非 conan 依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 0 源码补丁：OHOS 适配全部通过 feature 开关（--no-default-features
# --features wayland）完成，未修改上游任何源文件

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "alacritty 0.17.0 是 Rust workspace（4 crates），cargo build --release --locked --manifest-path alacritty/Cargo.toml 构建 bin"
  - "glutin 0.32.3 build.rs 的 free_unix cfg 别名排除 target_env=ohos（x11/wayland 平台模块均编出），winit 0.30.13 的 free_unix 不排除——默认 x11 feature 在 OHOS 上编译失败（E0432 glutin::platform::x11 / E0599 x11_visual），关闭 x11 feature 后全部编出，winit wayland 后端 + glutin egl backend 均不含 ohos 排除"
  - "cargo 工具链：Harmonybrew rust-1.98.1_1 r1 bottle（cargo.real 仅链 libc/libssl/libcrypto/libz，openssl3+zlib 3 瓶集闭包）；r2 版 cargo 动态链 libgit2/libssh2/libcurl/libsqlite3 需 12+ 瓶（libsignal-core 0.103.1 同款取舍）"
  - "设备 cargo 的 libcurl 无 HTTP/2：sparse 索引默认多路复用报 'failed to enable HTTP/2, is curl not built right?'，[http] multiplexing=false 强制 HTTP/1.1 后 rsproxy.cn sparse 镜像正常"
  - "fontconfig：conan 制品仓构建的 libfontconfig.so.1 在 hmdfs 上被 musl loader EACCES 拒绝加载（Harmonybrew 构建的同名 .so 正常；chmod 755/换目录均无效）——Rust GUI 件改用 Harmonybrew bottles 静态闭包（libfontconfig.a + expat/intl/freetype/z/bz2/png 传递归档）+ 合成自包含 fontconfig.pc（无 Requires）+ RUSTFLAGS -L 前置闭包目录，链接期全静态、运行期零 fontconfig 依赖"
  - "HMFS 上 cargo 并发链接偶发 'Text file busy (os error 26)'，-j 2 限并发规避（设备实测一次）"
  - "上游测试：cargo test --release --workspace --tests 在 test_package 阶段执行（hmbs 只采集 test_package 阶段 stdout 的 HMBS_UPSTREAM_TEST_RESULT，tlsx/1.2.2 先例）；--tests 排除 doc-tests 空阶段（Harmonybrew rust bottle 无 rustdoc，argc/martin/stylua/usage 先例一致）"
