software: audit
display: "Linux Audit Framework (Userspace)"
description: "Userspace tools and libraries for the Linux Audit System"
category: system
homepage: "https://github.com/linux-audit/audit-userspace"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "utmpx 函数不可用，需用 utmp 替代"
    - "secure_getenv 不可用，需 fallback 到 getenv"
    - "pthread_cancel 不可用，用 pthread_kill(t, 0) 替代"
    - "linux/socket.h 与 sys/socket.h 冲突，需定义 _UAPI_LINUX_SOCKET_H"
    - "config.guess 需添加 HarmonyOS 识别"
    - "configure 中 umask 077 会创建不可写目录"
  common_dependencies: []

versions:
  "4.1.2":
    status: built
    build_date: "2026-06-22"
