# test_package/MANIFEST.yml
# 上游官方测试声明文件
# argy 0.6.0 — header-only C++17 命令行参数解析库（零依赖）
# 上游测试：tests/test_argy.cpp（doctest 2.5.0 框架，CMake/CTest 注册）

package: argy/0.6.0
homepage: "https://github.com/mshenoda/argy"

# 上游测试命令 (ctest -N 实测)
upstream_check_command: "ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试 (header-only 无编译阶段)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_argy.cpp
    source: argy-0.6.0/tests/test_argy.cpp
    description: "上游 doctest 测试（单二进制，CTest 注册 1 项：argy_tests）"
    command: "./test_argy"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：透过公开头文件 argy.hpp 调用 CliParser/addInt/addString/addBool/parse/getInt/getString/getBool，验证默认值与解析结果"
    command: "./test_argy"

# 测试断言总数 (上游 doctest 实测: 94 test cases / 187 assertions，全部通过)
assertion_count: 187