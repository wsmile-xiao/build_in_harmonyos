knowledge_gained:
  - "akku 是 Scheme 包管理器（Autotools），configure 硬性依赖 guild 二进制与 guile-2.2.pc（GUILE_PKG/GUILE_PROGS）"
  - "guile 2.2 查找 .go 字节码用 GUILE_LOAD_COMPILED_PATH（GUILE_CCACHE_DIR 是 guile 3.0 变量，2.2 下无效）"
  - "OHOS 上 guile 自动编译（auto-compilation）失败，须设 GUILE_AUTO_COMPILE=0 让 guild 直接使用 ccache 字节码"
  - "guild 脚本用 ${GUILE:-//bin/guile} 回退，安装前缀 / 使回退路径无效，须显式指定 GUILE 环境变量"
  - "configure 运行 guile 二进制检查版本，须把 guile 包 lib 加入 LD_LIBRARY_PATH"
  - "akku 用 version 子命令输出版本（非 --version），CLI 基于 srfi-37 args-fold"
  - "akku 的 HTTP client 通过 Guile FFI dlopen libcurl.so.4，运行完整 install/update 需 curl 运行库"
  - "akku 的 git repository 流程会调用 git 命令；当前 test_package 只覆盖离线 CLI smoke，不访问网络"
  - "HMDFS umask 077 导致 config.status 临时文件 Permission denied（E011），configure 补丁 077→022"
  - "CI profile 可能把 CONFIG_SHELL/SHELL 指向当前真机不存在的 bash；configure 阶段需显式使用 /bin/sh"
  - "OHOS runner 不保证有 pkg-config；为 GUILE_PKG 生成最小 pkg-config wrapper，仅声明 guile-2.2 并返回 Guile flags"

