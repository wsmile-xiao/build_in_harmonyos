# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: akku/1.1.0
homepage: "https://akkuscm.org/"

# 上游发布包 akku-1.1.0.tar.gz 内无 test/tests/run-tests.sh/.gitlab-ci.yml，
# Makefile.am 也未声明 check-local/TESTS，因此无本地上游测试入口。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 冒烟测试：离线验证 CLI 与 Conan runenv。
test_package_tests:
  - file: test_package/test.sh
    count: 3
    description: >-
      运行 akku version、akku help，并检查 AKKU 环境变量指向可执行文件；
      不访问网络，不执行依赖远端仓库或 libcurl 传输的 install/update 流程。

assertion_count: 3
