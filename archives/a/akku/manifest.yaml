# 软件级 manifest
# 文件位置: archives/a/akku/manifest.yaml
# 版本级细节见 1.1.0/manifest.yaml

software: akku
display: "akku"
description: "Akku.scm Scheme package manager command-line tool"
category: tool
homepage: "https://akkuscm.org/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 构建，configure 依赖 guile/guild 与 guile-2.2.pc"
    - "运行时通过 Guile load path 加载 akku 自身 Scheme 模块和预编译 .go 字节码"
    - "HTTP 功能通过 Guile FFI 加载 libcurl，git 仓库流程调用 git 命令"
  common_dependencies:
    - guile
    - curl

versions:
  "1.1.0":
    status: built
    build_date: "2026-08-17"
