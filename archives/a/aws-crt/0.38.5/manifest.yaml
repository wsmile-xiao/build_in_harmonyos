version: "0.38.5"
software: "aws-crt"
status: built
build_date: "2026-08-25"
conan_ref: "aws-crt/0.38.5"

source:
  # 官方源；实际下载经 gh-proxy.com 镜像优先列表（见 conandata.yml，
  # 真机无法直连 github.com），官方 URL 为末位兜底
  url: "https://github.com/awslabs/aws-crt-cpp/archive/refs/tags/v0.38.5.tar.gz"
  sha256: "98ede8e39fe16d5327c3915613034d114e8304a2ec957510a6712b28d353d6d9"
  tar_format: tar.gz
  # 发布 tarball 不含子模块内容，13 个 crt/* 子模块按 v0.38.5 固定 commit
  # 单独下载（URL+sha256 见 conandata.yml，已对照 GitHub tag tree 核验）。

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
    - "-DBUILD_TESTING=ON"
    - "-DENABLE_NET_TESTS=OFF"
    - "-DENABLE_PROXY_INTEGRATION_TESTS=OFF"
    - "-DENFORCE_SUBMODULE_VERSIONS=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"   # OHOS 经 toolchain 映射为 HarmonyOS，aws-c-io 只认 Linux/Android
    - "-DBUILD_DEPS=ON"             # 上游默认：aws-lc/s2n/aws-c-* 全部随源码构建
  dependencies: []                  # 无外部 Conan 依赖，全部子模块源码内嵌编译
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-enable-perl-for-assembly.patch"
  - "0002-run-upstream-tests-under-cross-compiling.patch"
  - "0003-offline-test-registration.patch"

knowledge_gained:
  - "conan get() 无跨次缓存，13 个子模块归档串行重下使 source 阶段暴露过长曾被外部 SIGTERM 打断；改为 sha256 键持久缓存 + 4 线程镜像回退下载，重跑只剩顺序解压"
  - "aws-crt-cpp 发布包不含 git 子模块，需按 v0.38.5 tag 的 13 个 commit 单独下载展开到 crt/"
  - "OHOS toolchain 使 CMAKE_SYSTEM_NAME=HarmonyOS，aws-c-io 仅识别 Linux/Android，需强制 Linux"
  - "toolchain 构建下 CMAKE_CROSSCOMPILING 恒为 TRUE，上游测试目录被 if(NOT CMAKE_CROSSCOMPILING) 跳过，须补丁放开"
  - "AwsTestHarness 用 create_test_sourcelist 而非 gtest；ENABLE_NET_TESTS=OFF 即可在配置期剔除全部联网用例"
  - "BYO_CRYPTO 模式下 aws-c-cal 哈希/HMAC 默认实现为 abort()，不可用于常规功能与本地加密用例"
  - "上游 ctest 发现/执行/通过计数以真机输出为准并打包为 res/upstream_test_result.json 供 test_package 复发证据标记"
