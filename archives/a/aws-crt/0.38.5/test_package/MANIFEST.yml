# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
# 详见: docs/TEST_QUALITY_SPEC.md

package: aws-crt/0.38.5
homepage: "https://github.com/awslabs/aws-crt-cpp"

# ── 上游测试套件审计 ─────────────────────────────────────────────────────
# 上游测试审计（对照 awslabs/aws-crt-cpp v0.38.5 tag tarball tests/ 原文）：
# tests/ 共 35 个 *Test.cpp，使用 aws-c-common AwsTestHarness
# （create_test_sourcelist 生成统一驱动二进制，无 gtest 依赖），每个用例经
# add_test 注册为独立 ctest 条目。tests/CMakeLists.txt 合计 256 处注册：
#   - 140 处 add_net_test_case：需真实 AWS IoT/MQTT 端点或 AWS_TEST_* 环境；
#   - 116 处 add_test_case，其中 30 处位于真机不成立的条件下：
#       AWS_BUILDING_ON_EC2(2)、AWS_HAS_CI_ENVIRONMENT(2+2 嵌套 proxy)、
#       ENABLE_PROXY_INTEGRATION_TESTS(24)——前两者在 CMake 中无 option/set
#       定义、恒判 FALSE，后者由配方显式 -DENABLE_PROXY_INTEGRATION_TESTS=OFF。
# 离线注册口径：add_net_test_case 在 aws-c-common AwsTestHarness.cmake 内被
# `if(ENABLE_NET_TESTS)` 包裹，配方 -DENABLE_NET_TESTS=OFF 即在配置期剔除全部
# 联网用例；NOT BYO_CRYPTO 块（12 本地 + 全部 net）因默认全加密栈构建而生效，
# 本地计入 74(顶层)+12=86。补丁 0003 将依赖真实 IoT 端点、离线必自跳过
# （SKIP 103）的 Mqtt5to3AdapterNewClientFull 移入 net 注册，预期离线发现集
# 85 项；全部 85 项实现已逐例审计：无 AWS_OP_SKIP 路径、无 AWS_TEST_*/凭据
# 环境依赖（IMDS 两例仅做连接尝试且不对结果断言，Sigv4a 用 dummy 凭据本地
# 验签）。真实执行/通过数以真机 ctest 输出为准（HMBS_UPSTREAM_TEST_RESULT）。

upstream_check_command: "ctest -N --test-dir <build>"

# conanfile.py build() 中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --timeout 300"

# 上游实际运行的测试程序
upstream_tests:
  - file: "tests/"
    source: "aws-crt-cpp-0.38.5/tests/"
    description: "AWS CRT C++ 上游单元测试（aws-c-common 测试 harness，ctest 驱动）"
    command: "./aws-crt-cpp-tests <case-name>"

# test_package 自带的消费者测试
test_package_tests:
  - file: test.cpp
    description: "消费者视角：DateTime 时钟 / Base64 往返 / UUID 规范 8-4-4-4-12 格式与解析往返 / JsonObject 解析 / CRC32、CRC32C 标准校验值"
    command: "./test_aws_crt"

# 测试断言总数（近似值，用于质量评估）：上游 85 项离线用例 + 消费者 7 项断言
assertion_count: 92
