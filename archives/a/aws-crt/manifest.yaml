software: aws-crt
display: "AWS Common Runtime (C++)"
description: "AWS C 运行时的 C++ 发行版（上游仓库名 aws-crt-cpp），提供 MQTT5/MQTT311、HTTP、IoT、S3、Sigv4 签名等异步客户端运行时"
category: network
homepage: "https://github.com/awslabs/aws-crt-cpp"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 全栈源码构建（BUILD_DEPS=ON），aws-lc/s2n/aws-c-* 随主库一起编译"
    - "OHOS 经 toolchain 映射为 CMAKE_SYSTEM_NAME=HarmonyOS，需强制为 Linux 以启用 aws-c-io epoll 事件循环"
    - "toolchain 构建下 CMAKE_CROSSCOMPILING 恒为 TRUE，需补丁放开上游 tests/ 注册以执行完整测试套件"
  common_dependencies:
    - aws-lc（内嵌，libcrypto）
    - s2n-tls（内嵌）
    - aws-c-common / aws-c-io / aws-c-cal / aws-c-http / aws-c-mqtt / aws-c-s3 等（均按 v0.38.5 固定 commit 内嵌）

versions:
  "0.38.5":
    status: built
    build_date: "2026-08-25"
    conan_ref: "aws-crt/0.38.5"
