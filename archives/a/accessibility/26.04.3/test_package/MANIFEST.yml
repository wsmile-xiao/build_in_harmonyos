# test_package/MANIFEST.yml
# 上游官方测试声明文件 — accessibility 26.04.3（上游产品 accessibility-inspector）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: accessibility/26.04.3
homepage: "https://invent.kde.org/accessibility/accessibility-inspector"

# 上游唯一测试入口: src/autotests/（顶层 CMakeLists BUILD_TESTING →
# find_package(Qt6 COMPONENTS Test) + include(ECMAddTests)），注册 4 个
# QtTest 目标（add_test）：accessibletreewidgettest、
# accessibletreeviewtest、mainwidgettest、propertytreeviewtest。
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error --timeout 90 (QT_QPA_PLATFORM=offscreen)"

# 上游实际运行的测试程序。测试用例构造 MainWidget/TreeView 等 Qt Widgets
# 并经 QAccessibilityClient 浏览 AT-SPI 无障碍树；offscreen 平台下不依赖
# 显示服务，但需要活动 AT-SPI a11y session bus 的用例在无总线的 OHOS
# 构建机上受环境限制，结果按 karchive/kdbusaddons 先例记录、不阻塞。
upstream_tests:
  - name: mainwidgettest
    description: "主视图测试（MainWidget + 无障碍树模型交互）"
  - name: accessibletreeviewtest
    description: "无障碍树视图测试（AccessibleTreeView）"
  - name: accessibletreewidgettest
    description: "无障碍树控件测试（AccessibleTreeWidget）"
  - name: propertytreeviewtest
    description: "属性树视图测试（PropertyTreeView）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_app.sh
    description: "消费者测试：以 offscreen QPA 平台真实执行打包出的 bin/accessibilityinspector --version（QApplication + Qt6/KF6/QAccessibilityClient6 全链接闭包在目标机上加载），版本输出后退出码 0"
    command: "./test_app.sh <pkg>/bin/accessibilityinspector"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
