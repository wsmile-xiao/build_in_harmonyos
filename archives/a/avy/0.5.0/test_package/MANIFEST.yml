package: avy/0.5.0
homepage: "https://github.com/abo-abo/avy"

# 上游测试命令 - Emacs Lisp 包无独立测试套件
upstream_check_command: "make test (Emacs Lisp byte-compile test)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/avy-tests.el
    source: https://github.com/abo-abo/avy/blob/master/test/avy-tests.el
    description: "Emacs Lisp unit tests for avy"
    command: "emacs -batch -l test/avy-tests.el"

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "Verify avy.el exists in package folder"

# 测试断言总数
assertion_count: 1
