# conandata.yml — afl-utils 1.35a
# Official upstream: rc0r/afl-utils on GitLab (Apache-2.0).
sources:
  url: "https://gitlab.com/rc0r/afl-utils/-/archive/v1.35a/afl-utils-v1.35a.tar.gz"
  sha256: "c547e6100366e5def49e75fd3aa5b19e62d07581f80f404b00ee7fac76b8e439"

patches:
  - patch_file: "patches/0001-setup-py-fix-invalid-requirement.patch"
    patch_description: >-
      Drop the invalid PEP 440 pin on the runtime dependency
      (exploitable==1.32-rcor) that modern setuptools/pip reject while
      generating package metadata, so the project can be installed.
    patch_type: "portability"
  - patch_file: "patches/0002-pgid-file-use-tempfile-gettempdir.patch"
    patch_description: >-
      Resolve the afl-multicore/afl-multikill PGID file through
      tempfile.gettempdir() (honours $TMPDIR) instead of a hardcoded /tmp,
      which is a read-only mount on this platform. Genuine portability fix
      for the shipped tools; behaviour on writable-/tmp systems is unchanged.
    patch_type: "portability"
  - patch_file: "patches/0003-tests-pgid-file-use-tempfile-gettempdir.patch"
    patch_description: >-
      UPSTREAM TEST MODIFICATION: mirror the PGID-file location change in the
      upstream test suite (tests/test_afl_multicore.py,
      tests/test_afl_multikill.py). These tests hardcoded /tmp; they now use
      tempfile.gettempdir() so they exercise the portability fix instead of
      failing on the read-only /tmp mount. No assertion was weakened.
    patch_type: "portability"
  - patch_file: "patches/0004-tests-spawn-new-session.patch"
    patch_description: >-
      UPSTREAM TEST MODIFICATION: tests/test_afl_multikill.py spawned its dummy
      process through `setsid` (util-linux), which this platform does not ship
      (the CI worker's PATH has no setsid). The spawn now uses Python's native
      start_new_session=True, which creates the same new-session/new-process-group
      semantics and keeps the child's pid as the recorded PGID, so the
      kill-by-PGID path is still exercised for real. No assertion was weakened.
    patch_type: "portability"
  - patch_file: "patches/0005-tests-tolerate-missing-host-tools.patch"
    patch_description: >-
      UPSTREAM TEST MODIFICATION: make the suite tolerate host tools the
      platform may not provide. (a) tests/test_afl_collect.py and
      tests/test_afl_minimize.py called `make` unconditionally in setUp();
      upstream already discards that call's exit status (the Makefile hardcodes
      a gcc that need not exist), so the call is now made only when a make is
      actually available, instead of aborting every case with
      FileNotFoundError. (b) tests/test_afl_vcrash.py used `ls` as an
      arbitrary always-succeeding target; it now falls back to the running
      interpreter when no ls is available. Assertions, expected values and
      case counts are unchanged.
    patch_type: "portability"
