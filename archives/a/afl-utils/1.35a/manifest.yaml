# afl-utils 1.35a — version-level manifest (ARCHIVE-SPEC v3.0)
version: "1.35a"
software: "afl-utils"
status: built
build_date: "2026-09-12"
build_system: "custom"

source:
  url: "https://gitlab.com/rc0r/afl-utils/-/archive/v1.35a/afl-utils-v1.35a.tar.gz"
  sha256: "c547e6100366e5def49e75fd3aa5b19e62d07581f80f404b00ee7fac76b8e439"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "pip install --prefix=<private prefix> ."
  dependencies:
    - afl/1.35b
    - rsync/3.3.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-setup-py-fix-invalid-requirement.patch"        # PEP 440 非法 pin → 放宽（setuptools/pip 元数据阶段修复）
  - "0002-pgid-file-use-tempfile-gettempdir.patch"       # 产品代码：PGID 文件 /tmp 硬编码 → tempfile.gettempdir()（遵循 $TMPDIR）
  - "0003-tests-pgid-file-use-tempfile-gettempdir.patch" # 上游测试修改：同步 PGID 路径口径（tests/test_afl_multicore.py, tests/test_afl_multikill.py）
  - "0004-tests-spawn-new-session.patch"                 # 上游测试修改：setsid 外部命令 → Python 原生 start_new_session（tests/test_afl_multikill.py）
  - "0005-tests-tolerate-missing-host-tools.patch"       # 上游测试修改：make 调用加 which 守卫 / ls 目标回退（tests/test_afl_{collect,minimize,vcrash}.py）

tool_requirements:
  # 上游测试套件会 shell out 到 CI worker 不提供的命令，改由制品仓工具包提供
  - bmake/20200710      # 提供 make（每个用例 setUp 都会 `make -C testdata/crash_process`）
  - coreutils/9.10      # 提供 ls（afl-vcrash 用作"必然成功"的 trivial 目标）

test_results:
  type: explicit
  total: 92
  passed: 92
  failed: 0
  skipped: 0
  note: >
    鸿蒙 PC 实机验证（OHOS / HarmonyOS PC aarch64 / clang 15 / Python 3.12.8 /
    Conan 2.29.1，2026-09-12）。conan create 构建期真实运行上游整个 pytest 套件
    （tests/ 9 个文件 92 个 test）：
    `python3 -m pytest tests -q --no-header --timeout=240 --timeout-method=signal`
    实测原文汇总行：`92 passed, 1 warning in 89.33s (0:01:29)`（配方的
    UPSTREAM-PYTEST-SUMMARY 同值）。通过率 92/92 = 100%，0 skip、0 fail。
    唯一 warning 为上游 afl_utils/afl_collect.py:215 的 SyntaxWarning: invalid
    escape sequence '\ '（上游代码风格告警，非本适配引入）。
    本轮修复 3 类此前失败（均实测复现并修复）：
    1. PGID 文件 /tmp 只读（E002）：产品代码与上游测试均改用 tempfile.gettempdir()
       （遵循 $TMPDIR=$HOME/tmp），补丁 0002/0003；
    2. setsid 缺失：经 busybox applet 软链补齐（/data/service/hnp/bin/busybox，
       busybox 依 argv[0] 分派），构建期注入私有 shim 目录；
    3. afl_stats::test_main 的 Twitter 连接为 ~130s 后失败（URLError →
       sys.exit(1)），此前 60s 的 pytest --timeout 早于网络超时将其误杀为
       "挂起"，现提高到 240s，实测 130.5s 后走到 sys.exit(1) 断言通过。
    test_package 消费者测试 11/11 PASS（打印机器可读
    "ASSERTIONS: passed=11 failed=0 total=11"）。

knowledge_gained:
  - "现代 setuptools/pip 在生成元数据阶段即拒绝 setup.py 中非法的 PEP 440 版本 pin（exploitable==1.32-rcor），需打补丁放宽为 'exploitable'"
  - "simplejson 在社区镜像仅提供 abi 标签 ohos_aarch64 的 wheel，pip 需显式 --platform ohos_aarch64 --only-binary=:all:"
  - "exploitable 不在 PyPI，按上游 dependency_links 从官方 GitLab 归档获取"
  - "多平台移植：把 /tmp 硬编码改为 tempfile.gettempdir()（遵循 TMPDIR），同步修改上游测试用例"
  - "OHOS 无独立 setsid 可执行文件，可用 busybox applet 软链补齐（busybox 依 argv[0] 分派）"
  - "pytest --timeout 必须大于被测用例的网络连接超时（~130s），否则把『可失败复现』误判为『挂起』"
  - "conan basic_layout() 的 build_folder 位于 source_folder 之内，构建期复制源码会自递归，必须就地跑测试"
  - "PATH 上是存在但不可执行的同名工具桩时，exec 搜索最终报 FileNotFoundError（看起来像缺工具）；探针必须实际试跑候选而不是只判 isfile"
  - "平台上 make 仅以 bmake 等替代实现存在、且 fixture 的 Makefile 硬编码 gcc 时，上游测试的 make 调用应加 which 守卫（上游本就丢弃其退出码）"
