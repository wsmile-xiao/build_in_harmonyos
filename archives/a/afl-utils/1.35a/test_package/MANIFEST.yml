# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: afl-utils/1.35a
homepage: "https://gitlab.com/rc0r/afl-utils"

# 上游测试收集命令（tests/ 下 9 个 pytest 文件，共 92 个 test 函数）
upstream_check_command: "python3 -m pytest --collect-only -q tests/"

# conanfile.py build() 方法中已集成并真实运行上游 pytest 套件（R51）
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest tests/ -q --no-header --timeout=240 --timeout-method=signal"

# 上游实际运行的测试程序（tests/ pytest 套件）
upstream_tests:
  - file: tests/test_SampleIndex.py
    source: afl-utils-v1.35a/tests/test_SampleIndex.py
    description: "SampleIndex 解析/采集逻辑（14 个 test）"
    command: "python3 -m pytest tests/test_SampleIndex.py"
  - file: tests/test_afl_collect.py
    source: afl-utils-v1.35a/tests/test_afl_collect.py
    description: "afl-collect 崩溃样本采集与索引（13 个 test）"
    command: "python3 -m pytest tests/test_afl_collect.py"
  - file: tests/test_afl_cron.py
    source: afl-utils-v1.35a/tests/test_afl_cron.py
    description: "afl-cron 配置加载与守护线程（7 个 test）"
    command: "python3 -m pytest tests/test_afl_cron.py"
  - file: tests/test_afl_minimize.py
    source: afl-utils-v1.35a/tests/test_afl_minimize.py
    description: "afl-minimize 语料精简（7 个 test）"
    command: "python3 -m pytest tests/test_afl_minimize.py"
  - file: tests/test_afl_multicore.py
    source: afl-utils-v1.35a/tests/test_afl_multicore.py
    description: "afl-multicore 并行作业命令构造（18 个 test）"
    command: "python3 -m pytest tests/test_afl_multicore.py"
  - file: tests/test_afl_multikill.py
    source: afl-utils-v1.35a/tests/test_afl_multikill.py
    description: "afl-multikill 会话终止（2 个 test）"
    command: "python3 -m pytest tests/test_afl_multikill.py"
  - file: tests/test_afl_stats.py
    source: afl-utils-v1.35a/tests/test_afl_stats.py
    description: "afl-stats 统计解析/汇总/SQLite/twitter（13 个 test）"
    command: "python3 -m pytest tests/test_afl_stats.py"
  - file: tests/test_afl_sync.py
    source: afl-utils-v1.35a/tests/test_afl_sync.py
    description: "afl-sync rsync 同步命令构造（13 个 test）"
    command: "python3 -m pytest tests/test_afl_sync.py"
  - file: tests/test_afl_vcrash.py
    source: afl-utils-v1.35a/tests/test_afl_vcrash.py
    description: "afl-vcrash 崩溃样本验证（5 个 test）"
    command: "python3 -m pytest tests/test_afl_vcrash.py"

# 上游测试用例修改声明 (R51 / 诚实申报)：
#  patches/0003 同步了上游测试里硬编码的 /tmp PGID 路径口径为
#    tempfile.gettempdir()（遵循 $TMPDIR）；
#  patches/0004 把 tests/test_afl_multikill.py 的 spawn 由外部命令
#    `setsid`（本平台不提供）改为 Python 原生 start_new_session=True；
#  patches/0005 让套件容忍平台可能不提供的宿主工具：test_afl_collect/
#    test_afl_minimize 的 make 调用加 shutil.which 守卫（上游本就丢弃其
#    退出码，且 fixture 的 Makefile 硬编码 gcc，本平台从未构建成功）；
#    test_afl_vcrash 的 'ls' 目标在无 ls 时回退到运行中的解释器。
# 三者均未削弱任何断言（assert 计数 multicore 60→60、multikill 7→7；用例总数不变 92）。
upstream_test_modifications:
  - file: tests/test_afl_multicore.py
    patch: patches/0003-tests-pgid-file-use-tempfile-gettempdir.patch
    reason: "PGID 文件路径由硬编码 '/tmp/...' 改为 os.path.join(tempfile.gettempdir(), ...)，与产品代码补丁 0002 同口径"
  - file: tests/test_afl_multikill.py
    patch: patches/0003-tests-pgid-file-use-tempfile-gettempdir.patch
    reason: "setup_testprocess 写入的 PGID 文件路径同上口径（原硬编码 /tmp），使 afl-multikill 的 kill 路径可被真实测试"
  - file: tests/test_afl_multikill.py
    patch: patches/0004-tests-spawn-new-session.patch
    reason: "dummy 进程的 spawn 方式由外部命令 `setsid`（OHOS/CI worker 无该可执行文件）改为 subprocess.Popen(..., start_new_session=True)，语义等价且 Popen 返回的 pid 即新会话 PGID，kill-by-PGID 路径仍被真实执行"
  - file: tests/test_afl_collect.py
    patch: patches/0005-tests-tolerate-missing-host-tools.patch
    reason: "setUp 的 `make -C testdata/crash_process` 改为仅在 shutil.which('make') 可用时调用：上游本就丢弃该调用退出码，且该 fixture 的 Makefile 硬编码 CC=gcc（本平台无 gcc，fixture 从未真正构建成功，用例一直通过）；无 make 平台上该调用会直接抛 FileNotFoundError 使全部用例在 setUp 中止"
  - file: tests/test_afl_minimize.py
    patch: patches/0005-tests-tolerate-missing-host-tools.patch
    reason: "同上（同一处 make 调用）"
  - file: tests/test_afl_vcrash.py
    patch: patches/0005-tests-tolerate-missing-host-tools.patch
    reason: "两处目标命令按「实际可运行」挑选：非崩溃目标由硬编码 'ls' 改为（可 spawn 的 ls）否则 '<解释器> -c pass'；挂起目标由 'python ...' 改为用 sys.executable 执行同一脚本。断言（invalid/timeout 分类）不变"
  - file: tests/test_afl_collect.py, tests/test_afl_minimize.py, tests/test_afl_vcrash.py
    patch: patches/0005-tests-tolerate-missing-host-tools.patch
    reason: "新增 _runnable() 探针：PATH 命中不等于可 spawn（权限位可执行但受沙箱/挂载限制时 exec 返回 ENOENT → FileNotFoundError），故先试运行再决定是否使用工具"

# 构建期工具依赖（上游测试 shell out 到的命令，CI worker 不提供，改由制品仓工具包提供）
build_tool_requires:
  - bmake/20200710        # 提供 make（每个用例 setUp 都执行 make -C testdata/crash_process）
  - coreutils/9.10        # 提供 ls（afl-vcrash 作为"必然成功"的 trivial 目标）

# test_package 中自带的测试 (消费者视角验证，真实执行打包产物)
test_package_tests:
  - file: test_afl_utils.py
    description: >-
      消费者测试 — 逐个执行打包的 8 个命令行工具 (校验 usage 且退出码 0)、
      导入 afl_utils/db_connectors，并跑通 afl-stats -> SQLite 端到端数据落库。
    command: "test_afl_utils.py <pkg>/bin <pkg>/site-packages"

# 测试断言总数 (与 test_afl_utils.py 末尾机器可读汇总行 ASSERTIONS: total=<N> 一致)
# 组成：8 个命令行工具 -h 检查 + 2 个包导入检查 + 1 个 afl-stats→SQLite 端到端检查 = 11
assertion_count: 11
