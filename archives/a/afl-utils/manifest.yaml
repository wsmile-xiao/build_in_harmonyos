# afl-utils — software-level manifest (ARCHIVE-SPEC v3.0)
software: afl-utils
display: "afl-utils"
description: "afl-fuzz 自动化工具集：崩溃样本采集/验证、并行 fuzz 作业管理、语料精简与统计同步"
category: utility
homepage: "https://gitlab.com/rc0r/afl-utils"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Python 3 包（setuptools），无本地编译步骤"
    - "运行期依赖安装到构建目录内私有前缀，不注入共享 /usr/local（R49）"
    - "simplejson/twitter/exploitable/certifi 打入 site-packages，工具开箱即用"
    - "exploitable==1.32-rcor 不在 PyPI，走上游 setup.py dependency_links 的官方 GitLab 归档"
    - "simplejson 社区镜像仅提供 ohos_aarch64 wheel，需 --platform ohos_aarch64"
    - "afl-multicore/afl-multikill 依赖 afl-fuzz、afl-sync 依赖 rsync：由制品仓 afl/1.35b、rsync/3.3.0 提供"
    - "PGID 文件 /tmp 硬编码改为 tempfile.gettempdir()（遵循 TMPDIR）；上游测试用例同步修改"
    - "上游测试 shell out 到 make/ls，CI worker 的 PATH 二者皆无：由制品仓 bmake/20200710、coreutils/9.10 提供（tool_requires），构建期解析并注入测试 PATH"
    - "上游测试依赖 setsid（OHOS/CI worker 无此可执行文件）：tests/test_afl_multikill.py 改用 Python 原生 start_new_session=True（补丁 0004，未削弱断言）"
    - "上游测试在 setUp 无条件调 make：补丁 0005 加「先试运行再使用」守卫（上游已丢弃其退出码，fixture 的 Makefile 硬编码 gcc，本平台从未构建成功）；vcrash 的 ls/python 目标同样按实际可运行挑选（否则用 sys.executable）"
    - "工具候选必须实际可执行：PATH 命中不可执行的同名桩时内核报 FileNotFoundError，配方改为逐个候选试跑后再选用"
  common_dependencies:
    - afl
    - rsync

versions:
  "1.35a":
    status: built
    build_date: "2026-09-12"
    conan_ref: "afl-utils/1.35a"
