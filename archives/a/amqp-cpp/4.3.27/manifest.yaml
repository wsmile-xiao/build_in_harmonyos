  sha256: "af649ef8b14076325387e0a1d2d16dd8395ff3db75d79cc904eb6c179c1982fe"
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DAMQP-CPP_LINUX_TCP=OFF"
    - "-DAMQP-CPP_BUILD_EXAMPLES=OFF"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "AMQP-CPP 核心库为 IO 层无关的 C++17 客户端库，无外部依赖；可选 linux_tcp 模块才引入 OpenSSL，构建时保持 AMQP-CPP_LINUX_TCP=OFF 即可"
  - "上游 CMakeLists.txt 声明 cmake_minimum_required(3.4)，CMake >= 3.5 移除对 <3.5 的兼容，须以 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 配置；toolchain CACHE 变量对该检查不生效，需在 cmake.configure(variables=...) 传参"
  - "AMQP::Array::size() 返回 AMQP 线格式编码尺寸（含 4 字节头），元素个数应使用 count()"
