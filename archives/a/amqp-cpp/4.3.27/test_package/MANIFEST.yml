# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: amqp-cpp/4.3.27
homepage: "https://github.com/CopernicaMarketingSoftware/AMQP-CPP"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# AMQP-CPP 没有内置 ctest 套件；tests/ 目录提供独立编译的测试程序
# （tests/Makefile 链接 copernica 测试框架，核心库不含该框架）。
upstream_check_command: "make -C tests/table table_test && ./table_test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/table/table.cpp
    source: amqp-cpp-4.3.27/tests/table/table.cpp
    description: "AMQP::Array 字段构造与元素访问"
    command: "./table_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：AMQP::Array 构造/访问 + AMQP::Address URL 解析"
    command: "./test_amqp-cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
