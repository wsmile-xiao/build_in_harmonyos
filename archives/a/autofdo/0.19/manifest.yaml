package:
  name: autofdo
  version: "0.19"
  description: "AutoFDO - convert perf profiles to AutoFDO profiles for GCC/LLVM"
  homepage: "https://github.com/google/autofdo"
  license: "Apache-2.0"
  category: development

source:
  url: "https://codeload.github.com/google/autofdo/tar.gz/refs/tags/0.19"
  sha256: "2ab3a16a8966b6e9a877fddb15ee39e627646fcf8d0df17c19de013da36c27d0"

build:
  system: autotools
  configure_args:
    - "--host=aarch64-linux-ohos"
    - "--without-llvm"

test:
  upstream: "No upstream make check target is provided by the 0.19 release."
  test_package_functional: "create_gcov starts on the OHOS target and exposes its gflags command interface"
  assertion_count: 1
  limitation: "A successful perf.data-to-gcov conversion requires a target-generated perf.data fixture; no fixture is shipped in the upstream release."

conan:
  reference: "autofdo/0.19@ohpcd/stable"
  status: "built"

platform:
  os: "OHOS"
  arch: "armv8"
