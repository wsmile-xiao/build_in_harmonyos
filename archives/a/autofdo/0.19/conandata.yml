patches:
  - patch_file: "patches/0001-profile-creator-basename.patch"
    patch_description: "OHOS sysroot lacks GNU basename(const char*); use libgen.h + strdup"
    patch_type: portability
  - patch_file: "patches/0002-sample-reader-basename.patch"
    patch_description: "OHOS sysroot lacks GNU basename(const char*); use libgen.h + strdup"
    patch_type: portability
  - patch_file: "patches/0003-base-port-bswap.patch"
    patch_description: "Undef OHOS byteswap.h bswap_16/32/64 macros before defining own functions"
    patch_type: portability
  - patch_file: "patches/0004-protobuf-port-bswap.patch"
    patch_description: "Undef OHOS byteswap.h bswap_16/32/64 macros in vendored protobuf port.h"
    patch_type: portability
  - patch_file: "patches/0005-elf-reader-native-elf-arch.patch"
    patch_description: "Define NATIVE_ELF_ARCH=Elf64 on aarch64/LP64 (__WORDSIZE undefined on OHOS)"
    patch_type: portability
