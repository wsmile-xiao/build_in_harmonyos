# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: advai-cli/1.0.12
homepage: "https://github.com/Advai-X/advai-cli"

# 上游测试命令（上游无独立测试套件，CLI 工具自包含）
upstream_check_command: "python3 -c \"import advai\""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: advai/__init__.py
    source: advai_cli-1.0.12/advai/__init__.py
    description: "主模块（无独立测试套件）"
    command: "advai --help"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.py
    description: "Python 模块导入 + CLI --help 验证"
    command: "python3 test.py"

# 测试断言总数
assertion_count: 2
