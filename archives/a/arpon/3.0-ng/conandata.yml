# conandata.yml — arpon 3.0-ng
# Source: official SourceForge (R39)

sources:
  url: "https://sourceforge.net/projects/arpon/files/arpon/ArpON-3.0-ng.tar.gz/download"
  filename: "ArpON-3.0-ng.tar.gz"
  sha256: "ea55d1641b4573b19103ca596368e418aecd2a1409adbdce3a9f76dc8ebad590"

patches:
  - patch_file: patches/0001-CMakeLists.txt.patch
    patch_description: "Upgrade cmake_minimum_required from 2.6 to 3.5 for CMake 4.x compatibility"
    patch_type: "compatibility"
  - patch_file: patches/0002-cmake-modules-FindSystem.cmake.patch
    patch_description: "Add HarmonyOS platform recognition to FindSystem cmake module"
    patch_type: "portability"
  - patch_file: patches/0003-src-opt.c.patch
    patch_description: "Fix pointer-to-null-char comparison warning (-Wpointer-compare) in opt.c"
    patch_type: "bugfix"
  - patch_file: patches/0004-src-thd.c.patch
    patch_description: "Guard pthread cancellation calls with HAVE_PTHREAD_CANCEL feature detection"
    patch_type: "portability"
  - patch_file: patches/0005-cmake-modules-FindPthreads.cmake.patch
    patch_description: "Use check_include_file instead of find_path for pthread.h (HarmonyOS/musl)"
    patch_type: "portability"
  - patch_file: patches/0006-CMakeLists.txt.feature_detect.patch
    patch_description: "Add check_symbol_exists for pthread_cancel to define HAVE_PTHREAD_CANCEL"
    patch_type: "portability"
