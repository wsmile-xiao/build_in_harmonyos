# 软件级 manifest — asmotor
# 遵循 ARCHIVE-SPEC v2.0

software: asmotor
display: "ASMotor"
description: "便携通用汇编器引擎与开发系统：680x0/6502/MIPS32/Z80/Game Boy/DCPU-16/CHIP-8 汇编器（motor68k/motor6502/motorz80/motordcpu16/motormips/motorschip）+ 库管理器 xlib + 链接器 xlink"
category: development
homepage: "https://github.com/asmotor/asmotor"
license: GPL-3.0-or-later
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "CMake 项目（C99），官方 release tarball 不含 util/ git submodule，需按 tag 引用提交单独下载 asmotor-util 放入 util/（conanfile source() 双源）"
    - "ucm.cmake 内 cmake_minimum_required 低于 3.5，CMake 4.x 移除兼容：必须加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "K&R 风格无原型声明（str_Empty/expr_Pc 等）在 -Wall -Wextra -pedantic -Werror 下被 -Wstrict-prototypes 拦截：追加 -Wno-strict-prototypes（保持 C99 不降 gnu89），知识草稿 DRAFT-asmotor-1.0.0-knr-strict-prototypes-c99"
    - "z80 的 (ix+d)/(iy+d) 旋转/移位指令在 release/1.0.0 存在上游编码缺陷（DD CB 01 55 而非 16），tag 自带 test_rot/test_shift .answer 与汇编器行为不符，属上游问题，升级版本可解"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.0":
    status: published
    build_date: "2026-09-19"