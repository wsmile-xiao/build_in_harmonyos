# test_package/MANIFEST.yml — asmotor 1.0.0
# CI L0e requires this file to exist.

package: asmotor/1.0.0
homepage: "https://github.com/asmotor/asmotor"

# 上游测试入口: test/test.sh -> 各架构 test/<arch>/run.sh（基于 diff 对比 .answer）
upstream_check_command: "test/test.sh"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（shell 脚本驱动，逐架构 diff 校验汇编输出与 .answer 一致）
upstream_tests:
  - file: test/6502/run.sh
    source: asmotor-1.0.0/test/6502/run.sh
    description: "6502 汇编测试：motor6502 汇编 test.asm/undoc0.asm 并 diff .answer"
    command: "sh test/6502/run.sh"
  - file: test/680x0/run.sh
    source: asmotor-1.0.0/test/680x0/run.sh
    description: "680x0 汇编+链接测试：motor68k + xlink，diff amigaexe/amigaobj/test 输出"
    command: "sh test/680x0/run.sh"
  - file: test/common/run.sh
    source: asmotor-1.0.0/test/common/run.sh
    description: "公共宏/表达式/重复块测试（全部 CPU 汇编器跑同一组 asm）"
    command: "sh test/common/run.sh"
  - file: test/dcpu-16/run.sh
    source: asmotor-1.0.0/test/dcpu-16/run.sh
    description: "DCPU-16 汇编测试"
    command: "sh test/dcpu-16/run.sh"
  - file: test/gameboy/run.sh
    source: asmotor-1.0.0/test/gameboy/run.sh
    description: "Game Boy 汇编测试（motorz80 -mcg）"
    command: "sh test/gameboy/run.sh"
  - file: test/mips/run.sh
    source: asmotor-1.0.0/test/mips/run.sh
    description: "MIPS32 汇编测试"
    command: "sh test/mips/run.sh"
  - file: test/schip/run.sh
    source: asmotor-1.0.0/test/schip/run.sh
    description: "CHIP-8/SCHIP 汇编测试"
    command: "sh test/schip/run.sh"
  - file: test/z80/run.sh
    source: asmotor-1.0.0/test/z80/run.sh
    description: "Z80 汇编测试（含已确认的上游 tag 编码缺陷用例 test_rot/test_shift）"
    command: "sh test/z80/run.sh"

# test_package 自带的测试（消费者视角验证：真实调用安装的 motorz80 汇编并校验产物）
test_package_tests:
  - file: test.sh
    description: "运行安装的 motorz80 汇编真实 Z80 源码生成对象文件并校验产物存在"
    command: "sh test.sh"

# 测试断言总数（近似：上游 run.sh 对每个 asm 文件做一次 diff 断言 + test_package 3 项）
assertion_count: 20
