version: "4.9.39+dfsg.02"
software: "acedb"
status: built
build_date: "2026-08-18"
build_system: "makefile"

source:
  url: "https://ftp-nyc.osuosl.org/debian/pool/main/a/acedb/acedb_4.9.39%2Bdfsg.02.orig.tar.xz"
  sha256: "b909940e5292a149cd49eeb2f10b0d2f004193e0e685e81866339725d9ae72be"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "ACEDB_MACHINE=OHOS_4"
  dependencies:
    - "glib/2.88.0 (Conan and cmd-pkgs)"
    - "gettext/0.22.5 (Conan and cmd-pkgs)"
    - "ncurses/6.6 (Conan); ncurses/6.4 (cmd-pkgs static compatibility)"
    - "readline/8.3 (Conan); readline/8.2 (cmd-pkgs static compatibility)"
    - "pcre2/10.40 (cmd-pkgs)"
    - "flex/2.6.4 (OpenHarmony toolchain)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-w4-sigsubs.c.patch"
  - "0002-waql-aql_.h.patch"
  - "0003-wh-gex.h.patch"
  - "0004-wh-mystdlib.h.patch"
  - "0006-wtools-aceSetReleaseDir.patch"

knowledge_gained:
  - "acedb uses the custom wmake system and selects OHOS_4 through ACEDB_MACHINE."
  - "OHOS command-line targets require GTK-only gex declarations to be conditionally excluded."
  - "The OHOS sysroot conflicts with acedb's non-POSIX qsort declaration."
  - "OHOS provides bash and Perl under /data/service/hnp/bin rather than the usual host paths."
  - "Static libintl and compatibility names for curses and flex are required by the legacy linker inputs."

patch_generation:
  method: per-file-difflib
  patches_count: 5

patch_classification:
  - file: "0001-w4-sigsubs.c.patch"
    type: portability
    platform_only: true
    guard: "__OHOS__"
  - file: "0002-waql-aql_.h.patch"
    type: portability
    platform_only: true
    guard: "LINUX"
  - file: "0003-wh-gex.h.patch"
    type: portability
    platform_only: true
    guard: "ACEDB_NO_GTK"
  - file: "0004-wh-mystdlib.h.patch"
    type: portability
    platform_only: false
    guard: "legacy qsort declaration removed for this OHOS-compatible build"
  - file: "0006-wtools-aceSetReleaseDir.patch"
    type: portability
    platform_only: true
    guard: "OHOS Perl path"
