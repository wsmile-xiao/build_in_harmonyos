# conandata.yml — augustus-game 4.0.0

sources:
  url:
    # 仅官方原始 URL：CI 拉取时自动套镜像层，手写前缀会变成双镜像拼接；
    # 本地 verify 的 E017 机制也会在构建期自动临时注入镜像并恢复原文件
    - "https://github.com/Keriew/augustus/archive/refs/tags/v4.0.0.tar.gz"
  sha256: "d95957ccf7b66cec80d787692ff857a7a1558eccfa1927e22f717891b2dfb4a2"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Link SDL2_mixer before SDL2 so static libraries resolve in dependency order"
    patch_type: "portability"
  - patch_file: "patches/0002-src-platform-arguments.c.patch"
    patch_description: "Parse --version flag into augustus_args (headless support)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-platform-arguments.h.patch"
    patch_description: "Add print_version field to augustus_args struct"
    patch_type: "portability"
  - patch_file: "patches/0004-src-platform-augustus.c.patch"
    patch_description: "Headless --version exit before SDL/audio init (OHOS sandbox has no dsp audio device, SDL_Init fails)"
    patch_type: "portability"
  - patch_file: "patches/0005-CMakeLists.txt-use-bundled-expat-safely.patch"
    patch_description: "Fall back to bundled expat when an EXPATConfig package does not export uppercase variables"
    patch_type: "portability"
