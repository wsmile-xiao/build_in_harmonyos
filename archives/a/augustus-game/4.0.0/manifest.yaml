patches_applied:
  - "0001-CMakeLists.txt.patch — 静态链接顺序 SDL2_mixer 先于 SDL2（按依赖序解析符号）"
  - "0002-src-platform-arguments.c.patch — 解析 --version 参数（headless 支持）"
  - "0003-src-platform-arguments.h.patch — augustus_args 增加 print_version 字段"
  - "0004-src-platform-augustus.c.patch — 增加 SDL 初始化前的无头 --version 出口（沙箱无 dsp 音频设备，SDL_Init 失败属环境限制）"
  - "0005-CMakeLists.txt-use-bundled-expat-safely.patch — EXPATConfig 只导出小写变量时回退到上游内置 expat"

current_status:
  ported_at: "2026-09-05"
  revalidation: "direct_ohos_passed"
  issue: "none"
  note: "2026-09-05 low-memory direct Conan build and test_package passed on OHOS aarch64; software-level commands.json is included for R38, and final CI status is tracked in PR #8388."

knowledge_gained:
  - "上游自带 MODULE 模式 FindSDL2/FindSDL2_mixer，CMAKE_PREFIX_PATH 无效，需经 CMakeToolchain 注入模块读取的缓存变量（含 SDL2_LIBRARY_TEMP 防 FIND_LIBRARY 覆盖）(ref: DRAFT-augustus-module-findsdl2-cache-vars)"
  - "CI worker 预置的 LD_LIBRARY_PATH 会遮蔽 SDK lld 的 RUNPATH($ORIGIN/../lib)，使其加载不到 ABI 匹配的 libxml2.so.16（xmlFreeDoc symbol not found，编译器探测期即败）；配方的 build/package 环境须前置从实际编译器路径推导并校验存在的 SDK llvm/lib (ref: E120/E132/E266，先例 abseil/20260526)"
  - "GUI 游戏在无音频设备沙箱中 SDL_Init 失败退出，需补丁增加无头 --version 出口供 L2/test_package 验证 (ref: E285)"
  - "静态链接 SDL2 生态时链接顺序必须 mixer 在前，否则 undefined symbol (ref: E285)"
  - "设备用户前缀的 expat-config.cmake 可能只导出小写变量却设置 EXPAT_FOUND；上游读取大写变量时需校验完整，否则回退 bundled expat，避免误用不完整外部依赖"

