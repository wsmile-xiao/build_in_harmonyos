# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: augustus-game/4.0.0
homepage: "https://github.com/Keriew/augustus"

# 上游无集成进构建系统的自动化测试套件：
# 源码树含 test/ 目录（游戏数据、存档与翻译存根，非单元测试），
# 根 CMakeLists.txt 无 enable_testing/add_test；游戏功能验证依赖
# 真实显示与音频设备的人工测试，headless 环境无法执行。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 依赖补丁 0004 的无头 --version 出口（SDL 初始化前打印版本退出 0）
test_package_tests:
  - file: test.sh
    description: "消费者冒烟测试：运行包内 bin/augustus --version，断言退出码 0 且输出含 augustus 4.0.0"
    command: "./augustus --version"

# 测试断言总数 (近似值, 用于质量评估)
# ① 退出码为 0（set -e 保证）；② 输出匹配 "augustus ... 4.0.0"
assertion_count: 2
