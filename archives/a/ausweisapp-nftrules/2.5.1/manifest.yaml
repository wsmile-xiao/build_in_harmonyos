# 版本级 manifest — ausweisapp-nftrules 2.5.1
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "2.5.1"

# 软件名
software: ausweisapp-nftrules

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"
build_system: none

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Alpine aports 维护的规则文件——上游 AusweisApp tarball 内无此文件）
  url: "https://raw.githubusercontent.com/alpinelinux/aports/master/community/ausweisapp/ausweisapp.nft"

  # 源码校验和（sha256，实测）
  sha256: "a0a13201c55d0f63b478f54685177b68d94c2d2aeade6ec8bf7370d8f9ea59e6"

  # 压缩格式
  compression: none

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "ausweisapp.nft"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: "纯数据包（nftables 规则文件，无编译）；package_type=application（数据/配置包形态），source() 用 download() 下载单文件 ausweisapp.nft，package() 拷到 etc/nftables.d/"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: "纯数据包：AusweisApp2 nftables 防火墙规则集（放行 BundID AusweisApp2 端口 24727），无编译、无外部依赖；规则文件由 Alpine aports 维护，上游 AusweisApp 源码 tarball 内不含此文件"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 1
  failed: 0
  note: |
    上游无测试套件（纯数据包，无编译、无测试）。
    适配后：test_package R34 真实内容校验——验证打包的
    etc/nftables.d/ausweisapp.nft 存在且内容含预期 nft 规则
    （table inet filter / tcp dport 24727 accept）（1/1 = 100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ausweisapp-nftrules 是纯 nftables 规则数据包（AusweisApp2 防火墙规则，137B）：上游源码 tarball 内无规则文件，规则由 Alpine aports 维护——conandata 直接指向 raw 单文件 URL，source() 用 download() 下载单文件（非 get()），package() 拷到 etc/nftables.d/；纯数据包无编译，lang-preflight 用 OHPCD_LANG=other"

references:
  - https://www.ausweisapp.bund.de/
