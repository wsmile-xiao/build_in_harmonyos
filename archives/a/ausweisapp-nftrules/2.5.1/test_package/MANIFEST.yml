# test_package/MANIFEST.yml — ausweisapp-nftrules 2.5.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: ausweisapp-nftrules/2.5.1
homepage: "https://www.ausweisapp.bund.de/"

# 上游测试套件：无（纯数据包——单 nftables 规则文件，无编译、无测试套件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests: []

# test_package 消费者测试（R34 真实内容校验：验证打包的 nftables 规则集内容）
test_package_tests:
  - file: test_ausweisapp_nftrules.py
    description: "Verifies packaged etc/nftables.d/ausweisapp.nft exists and its content carries the expected nft rule (table inet filter / tcp dport 24727 accept)"
    command: "python3 test_ausweisapp_nftrules.py"

# 断言总数：1（规则集内容校验）
assertion_count: 1
