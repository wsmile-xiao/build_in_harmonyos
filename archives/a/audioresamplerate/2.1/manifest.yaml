# 版本级 manifest —— audioresamplerate 2.1
# 遵循 ARCHIVE-SPEC v2.0

version: "2.1"
software: audioresamplerate

# 编译状态：built（本地 conan create 通过；发布由 CI merge 后 upload 流水线完成）
status: built
build_date: "2026-09-24"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub codeload 端点）
  url: "https://codeload.github.com/AnSwErYWJ/AudioResamplerate/tar.gz/refs/tags/v2.1"
  # 官方 v2.1 tarball SHA-256（独立下载核验）
  sha256: "6800057700c52d6b696694f714ef4a0f11f3b28c84508edb9f70efd662fb808a"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  configure_options: []

  # 编译依赖列表：无（纯 C，仅 libc）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 Makefile 仓库若把预编译产物（x86-64 .so）提交进 tarball，配方 build() 必须先 clean+cleanso 再全量重建，避免 aarch64 链接 incompatible"
  - "codeload tar.gz 端点 URL 无扩展名时，conan get() 默认按 zip 解压报 BadZipFile；conandata.yml 需显式 filename 声明 tar.gz"
  - "纯 Makefile 项目（无 configure/autotools）conan-init 模板误判构建系统时，配方应手工重写为直接 make 驱动，并显式传 CC=clang（R33）"