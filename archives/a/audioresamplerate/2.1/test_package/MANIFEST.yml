# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: audioresamplerate/2.1
homepage: "https://github.com/AnSwErYWJ/AudioResamplerate"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 官方 v2.1 无任何测试目标（make check/test/verify 均无规则，见 reports/upstream-test-ledger.md）
upstream_check_command: "make -n check || true"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：官方 v2.1 无独立测试用例，source_declared_total=0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过公开 API src_simple() 将 16kHz 单声道缓冲重采样为 48kHz，校验输出帧数与输出非零"
    command: "./test_audioresamplerate"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
