package: autodocksuite/4.2.6
homepage: "https://ccsb.scripps.edu/autodock/"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "cd Tests && python3 test_autodock4.py -e <autodock4>"

upstream_tests:
  - name: Tests/test_autodock4.py（AutoDock4 自动化 unittest 套件——AutoDock4_1pgp_* 系列 84 个测试）
    count: 84
    description: "**84/84 全部通过**（unittest——Ran 84 tests, OK，0 failed / 0 errors）——上游 make test 自动化套件全量实测（需在 Tests/ 目录放置 AD4_parameters.dat 等运行时数据——make test 要求同目录；Python 2 脚本经 2to3 语法兼容转换后运行，测试逻辑未改）——测试数据文件（Tests/ 目录 155 个：1pgp.dpf/gpf/fpd 等）随包打包"

test_package_tests:
  - file: test.c
    description: "消费者验证：编译运行 test.c（L0c）+ 校验 bin/ 下 autodock4/autogrid4 存在可执行 + --help 输出 usage（R34）"
    command: "clang test.c -o test_autodocksuite && ./test_autodocksuite && test -x <bin>/autodock4 && test -x <bin>/autogrid4 && <bin>/autodock4 --help && <bin>/autogrid4 --help"

assertion_count: 4
