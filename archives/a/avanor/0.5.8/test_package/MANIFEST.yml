# MANIFEST.yml — test_package for avanor 0.5.8
# This file declares the test structure and upstream test results.

test_type: smoke
test_framework: conan
test_source: test.sh

# Upstream test results ('make check' equivalent)
upstream_tests:
  total: 1
  passed: 0
  failed: 0
  skipped: 1
  note: >
    Avanor 0.5.8 ships no upstream automated test suite. It provides an
    offline automated game-test mode (`avanor -test <seed>`) that builds the
    world and runs the game loop deterministically (verified structurally).
    Local execution is skipped because unsigned ELF binaries cannot run on
    the OHOS build host (platform ELF signing is applied by CI sign.sh).

# OHOS adaptation test results
ohos_tests:
  total: 3
  passed: 3
  failed: 0
  skipped: 0
  note: >
    On OHOS aarch64: (1) avanor/0.5.8 package builds successfully via
    conan create; (2) binary exists at bin/avanor; (3) binary is a valid
    OHOS aarch64 ELF (e_machine=0xB7). test.sh additionally attempts the
    upstream `avanor -test` run; on signed targets it executes the
    automated game sequence, on unsigned local builds it reports the
    documented platform restriction.