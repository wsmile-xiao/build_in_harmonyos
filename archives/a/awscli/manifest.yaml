software: awscli
display: "awscli"
description: "AWS Command Line Interface v2 — 管理 AWS 云服务的命令行工具（纯 Python，vendored botocore/s3transfer）"
category: python
homepage: "https://aws.amazon.com/cli/"
license: Apache-2.0
build_system: python

ohos_adaptation:
  key_points:
    - "纯 Python（flit_core 自定义后端），零 C/C++ 编译，python-require 模式打包"
    - "vendored botocore/s3transfer 顶层无条件 import awscrt（C 扩展，ohpcd 未发布）——0001/0003/0004 守护补丁使启动链降级，CRT 功能（SigV4a/CRC 校验/S3 CRT/签名/DPoP 等）如实报错"
    - "distro 未发布，clidriver 顶层 import 守护降级为 'unknown'"
    - "docutils/0.23 已发布且实测兼容并声明；`aws help` 渲染仍受 OHOS Python subprocess 无法解析裸命令名限制（groff/mandoc 管道不可用）"
    - "staging 使用 build_folder 子目录（WR-008），避免硬编码路径并发残留"
  common_dependencies:
    - "colorama/0.4.6, ruamel-yaml/0.19.1, ruamel-yaml-clib/0.2.15, jmespath/1.1.0, python-dateutil/2.9.0.post0, urllib3/2.7.0, six/1.17.0, docutils/0.23"

versions:
  "2.34.56":
    status: built
    build_date: "2026-08-27"
