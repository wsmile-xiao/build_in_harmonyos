software: awscli
version: "2.34.56"
status: built
build_date: "2026-08-27"
build_system: python

source:
  url: "https://github.com/aws/aws-cli/archive/refs/tags/2.34.56.tar.gz"
  sha256: "c4c0401cd650af25249035679cb949fcf559959ea8d9d9095e61b8a4449c9d63"
  tar_format: tar.gz

build:
  system: python
  configure_options:
    - "conan create (python-require, copytree site-packages + bin/aws 入口生成)"
  dependencies:
    # python/3.12 为平台提供（OHOS 预装解释器，ohpcd 发布为 python/3.12.9）。
    # python-require 包不在 conanfile requires 中声明解释器依赖，此处仅
    # 作描述性记录（WR-012）。
    - python/3.12
    - colorama/0.4.6
    - ruamel-yaml/0.19.1
    - ruamel-yaml-clib/0.2.15
    - jmespath/1.1.0
    - python-dateutil/2.9.0.post0
    - urllib3/2.7.0
    - six/1.17.0
  cc: ""
  cxx: ""

patches_applied:
  - "patches/0001-botocore-awscrt-guards.patch"
  - "patches/0002-awscli-startup-guards.patch"
  - "patches/0003-s3-crt-guards.patch"
  - "patches/0004-command-customization-awscrt-guards.patch"

knowledge_gained:
  - "round3 修复 WR-001/002：docutils/0.23 实际已在 ohpcd 发布（web-review 只读核验 + 本轮 conan download 实测），且实测与 awscli 2.34.56 help.py API 兼容（publish_string + manpage.Writer 正常产出 man 源）——round 3 声明入 requires 并移除 0002 中 docutils 守护 hunk（help.py/textwriter.py/topictags.py 恢复原样）"
  - "round3 实测：`aws help` 渲染管线（docutils -> groff/mandoc -> pager）在 OHOS 仍不可用——本平台 Python subprocess 无法通过 PATH 解析裸命令名（groff 在 /data/service/hnp/bin 上 Popen 仍 FileNotFoundError，pre-flight F5 坑），0002 以受控 RuntimeError 降级"
  - "round2 守护补丁：awscrt/distro 未发布时启动链可降级——vendored botocore 顶层 awscrt import 与 clidriver 顶层 distro import 改为 try/except ImportError + 使用处明确报错；aws --version 可运行；S3 传输回退 classic"
  - "awscli v2 内嵌 vendored botocore/s3transfer，awscli/__init__.py 的 TopLevelImportAliasFinder 将顶层 import botocore/s3transfer 映射到内嵌包（无需单独发布 botocore/s3transfer）"
  - "vendored botocore 的 credentials.py:30/utils.py:42/httpchecksum.py:28 顶层无条件 import awscrt → `aws --version` 在无 awscrt 环境无法启动（修正 scout『可无 CRT 运行』的乐观判断）"
  - "distro 在 awscli/clidriver.py 顶层 import，同为启动必需；当前未发布到 ohpcd"
  - "jmespath 1.1.0/python-dateutil 2.9.0.post0/urllib3 2.7.0 现有发布版本超出 awscli 2.34.56 声明范围（>=0.7.1,<1.1.0 / >=2.1,<=2.9.0 / >=1.25.4,<=2.6.3），按已发布版本声明；docutils 0.23 已声明（实测兼容，见 WR-001）"
