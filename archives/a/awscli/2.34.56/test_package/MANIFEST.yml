package: awscli/2.34.56
homepage: "https://aws.amazon.com/cli/"

# 上游测试入口：pytest（tests/unit + tests/functional，数千用例量级，
# 含需要真实 AWS 凭证/网络/integration 的用例）。CI 纯 conan 流程内不跑
# 全量上游测试（tests/ 约 34MB 不入包；不引入 pytest/测试依赖），以
# L2 冒烟 + test_package 真实调用子集为准（同 dateutil 口径）。
upstream_check_command: "python3 -m pytest tests/unit tests/functional"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests/unit tests/functional"

upstream_tests:
  - name: tests/unit + tests/functional（pytest 套件，数千用例量级）
    count: "N/A"
    description: "**本轮未在 OHOS 上全量运行（N/A）**——上游测试依赖网络/真实 AWS 凭证且 tests/ 约 34MB 不入包，纯 conan 流程不引入 pytest；如实标注未运行、不伪造通过数。等效验证以 test_package 对打包产物 bin/aws 的真实调用为准（R34）。count 用 N/A 而非 0，避免误读为『上游 0 个用例』（WR-006）。"

test_package_tests:
  - file: test_awscli.py
    description: "真实调用打包产物 bin/aws：aws --version（守护补丁后启动链可导入，必须成功）+ aws help sts 子集（docutils/0.23 已声明，但 help 渲染受 OHOS subprocess 裸命令名解析限制——groff/mandoc 管道不可用，渲染如实记录为受控错误，不伪造通过；非受控错误视为回归并返回非零，WR-007）。"
    command: "python3 test_awscli.py <site-packages>"

assertion_count: 2
