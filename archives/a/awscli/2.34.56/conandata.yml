# conandata.yml — awscli 2.34.56
# 纯 Python CLI（flit_core 自定义后端），v2 内嵌 vendored botocore/s3transfer。
# PyPI 无 v2（PyPI 上的 awscli 是 v1 系列）；源码取官方 GitHub tag 2.34.56
# （gitcode 镜像确认 commit 66e2eff912f4819ec8da38694b2708206720df9e）。
# sha256 为设备端实际下载（gh-proxy 代理官方 tarball）后计算，非编造；
# CI 会将 github.com URL 重写为 gh-proxy 镜像并预下载为 file://。
sources:
  awscli:
    url: "https://github.com/aws/aws-cli/archive/refs/tags/2.34.56.tar.gz"
    sha256: "c4c0401cd650af25249035679cb949fcf559959ea8d9d9095e61b8a4449c9d63"

# round 3 守护补丁：awscrt / distro 未发布到 ohpcd（声明会 R36 fail），
# docutils/0.23 已发布且实测与 help.py 兼容，round 3 起声明入 requires。
# 补丁使启动链可降级（aws --version 可用）；各 CRT 特性在无对应包时如实
# 报错；help 渲染受 OHOS Python subprocess 无法解析裸命令名限制（groff/
# mandoc 管道不可用）如实报错，不伪造数据。详见 README.md 与 round 报告。
patches:
  - patch_file: "patches/0001-botocore-awscrt-guards.patch"
    patch_description: "botocore 启动链 awscrt 守护：credentials/utils/httpchecksum/auth/crt.auth/useragent 顶层 awscrt import 改为 try/except ImportError + 降级（SigV4a/CRC/XXHash/DPoP/CRT 版本字段在无 CRT 时明确降级或报错）"
    patch_type: "portability"
  - patch_file: "patches/0002-awscli-startup-guards.patch"
    patch_description: "awscli 启动链守护：clidriver 顶层 import distro 降级为 'unknown'（不伪造平台数据）；logger 的 awscrt.io 日志通道降级为 no-op；help 的 groff/mandoc 渲染管道守护（docutils/0.23 已声明且实测兼容，但 OHOS Python subprocess 无法解析裸命令名，渲染如实报错）"
    patch_type: "portability"
  - patch_file: "patches/0003-s3-crt-guards.patch"
    patch_description: "S3 CRT 路径守护：factory 顶层 awscrt.s3/s3transfer.crt import 降级为 classic 传输客户端（auto 与显式 crt 均回退并告警）；s3transfer/checksums 的 FULL_OBJECT CRC 组合降级报错；s3transfer/crt 直接导入给出明确错误"
    patch_type: "portability"
  - patch_file: "patches/0004-command-customization-awscrt-guards.patch"
    patch_description: "命令级 awscrt 守护：cloudfront 签名/cloudtrail digest 校验/ec2 get-password 解密/ec2instanceconnect ssh+websocket 隧道/aws login DPoP 的 awscrt.crypto 使用处均降级为明确报错（命令可加载、功能边界如实标注）"
    patch_type: "portability"
