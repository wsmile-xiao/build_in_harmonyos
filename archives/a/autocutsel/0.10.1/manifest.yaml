software: autocutsel
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.10.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sigmike/autocutsel/releases/download/0.10.1/autocutsel-0.10.1.tar.gz"

  # 源码校验和
  sha256: "f17e06d42f7494436d4b26f4be0b6b0da39481c0400c96778e4b905b6341eb17"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libx11/6.4.0"
    - "libxext/6.4.0"
    - "libxau/6.0.0"
    - "xorgproto/2024.1"
    - "libXt/1.2.1 (source)"
    - "libXmu/1.1.4 (source)"
    - "libXpm/3.5.17 (source)"
    - "libXaw/1.0.14 (source)"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/config-guess-ohos.patch"
  - "patches/config-guess-tmpdir.patch"
  - "patches/config-sub-ohos.patch"
  - "patches/configure-tmpdir.patch"
  - "patches/version-help.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
