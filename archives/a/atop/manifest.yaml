software: atop
display: "atop"
description: "System and process monitor for Linux — interactive CPU/memory/disk/network monitoring"
category: system
homepage: "https://www.atoptool.nl/"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "linux/socket.h and sys/socket.h both define struct sockaddr_storage without guards — use _UAPI_LINUX_SOCKET_H to prevent re-inclusion"
    - "Replace linux/if.h with net/if.h, linux/in.h with netinet/in.h to avoid kernel header conflicts"
    - "HarmonyOS libc (musl-based) does not export qsort_r — need compat shim wrapping qsort"
    - "atop Makefile uses pkg-config for glib-2.0 only; ncurses and zlib paths passed via CFLAGS/LDFLAGS"
  common_dependencies:
    - glib/2.88.0.1
    - ncurses/6.6
    - zlib/1.3.1.1.1.1

versions:
  "2.13.0":
    status: built
    build_date: "2026-08-28"
