patches:
  "2.13.0":
    - patch_file: "patches/0001-Makefile.patch"
      patch_description: "Add qsort_r_compat.o to Makefile ALLMODS for HarmonyOS qsort_r compatibility"
      patch_type: "portability"
    - patch_file: "patches/0002-ifprop.c.patch"
      patch_description: "Fix linux/socket.h struct sockaddr_storage redefinition; replace linux/if.h with net/if.h, linux/in.h with netinet/in.h; guard linux/wireless.h re-inclusion"
      patch_type: "portability"
    - patch_file: "patches/0003-netlink.c.patch"
      patch_description: "Add __kernel_sa_family_t typedef and guard linux/socket.h re-inclusion for netlink.h"
      patch_type: "portability"
