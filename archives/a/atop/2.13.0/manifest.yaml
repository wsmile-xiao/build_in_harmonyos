# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS sysroot: linux/socket.h and sys/socket.h both define struct sockaddr_storage without guards — must use _UAPI_LINUX_SOCKET_H to prevent re-inclusion"
  - "OHOS sysroot: Replace linux/if.h with net/if.h, linux/in.h with netinet/in.h to avoid kernel header conflicts"
  - "HarmonyOS libc (musl-based) does not export qsort_r — need compat shim wrapping qsort"
  - "atop Makefile uses pkg-config for glib-2.0 only; ncurses and zlib paths must be passed via CFLAGS/LDFLAGS"

