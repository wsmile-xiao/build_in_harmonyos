package: alass/2.0.0
homepage: "https://github.com/kaegi/alass"

upstream_check_command: "cargo test --workspace --release --locked --tests"
upstream_test_in_build: true
upstream_test_command: "cargo test --workspace --release --locked --tests"
upstream_tests_exist: true
upstream_test_audit: |
  The v2.0.0 source contains three active #[test] unit tests. Two exercise
  randomized alignment internals in alass-core/src/alass.rs and one validates
  timespan normalization and index mapping in alass-core/src/timespan_ops.rs.
  A fourth #[test] occurrence is inside an upstream block comment and is not
  counted. The complete active suite is executed without exclusions.

upstream_tests:
  - file: alass-core/src/alass.rs
    source: alass-2.0.0/alass-core/src/alass.rs
    description: "Two randomized alignment and rating-buffer unit tests"
    command: "cargo test --workspace --release --locked --tests"
  - file: alass-core/src/timespan_ops.rs
    source: alass-2.0.0/alass-core/src/timespan_ops.rs
    description: "Timespan normalization and mapping unit test"
    command: "cargo test --workspace --release --locked --tests"

test_package_tests:
  - file: test.sh
    description: "CLI version/help plus real one-second SRT synchronization and output assertions"
    command: "sh test.sh <package>/bin/alass-cli"

assertion_count: 5
