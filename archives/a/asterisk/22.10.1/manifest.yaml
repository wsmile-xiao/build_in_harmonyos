# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "clang -fblocks 需要 BlocksRuntime，OHOS 无预编译，配方内编译垫片库并在 configure 前就位"
  - "musl 不实现 pthread_cancel 线程取消族（E085），需 libohosshim 存根库链入主程序"
  - "ASTMM_BLOCK 分配器陷阱宏污染 musl 系统头文件（sched.h），生成器代码文件改 ASTMM_IGNORE"
  - "musl 无 glibc _res 全局解析器状态，ast_dns_get_nameservers 返回空容器"
  - "asterisk configure/menuselect 依赖源码内相对路径（third-party/versions.mak），必须 in-source 构建"
  - "make install 的 sounds 步骤强制网络下载声音包（busybox wget 不兼容），加 DISABLE_SOUNDS 开关跳过"
  - "应用型包自包含交付：NEEDED 闭包分析 + 捆绑依赖 .so 进包内 lib/ 并全量 ELF 签名（E077）"
  - "HarmonyOS 工具链可能只提供 llvm-readobj；解析 ELF NEEDED 时应按 clang 绝对路径动态推导 runtime/sysroot 候选目录"
  - "stdtime 的 zoneinfo 路径通过非空 TZDIR 在运行时注入，并让加载和 watcher 使用同一目录"
  - "HarmonyOS HMDFS 不支持 voicemail 目录中的 link 硬链接锁，配方通过 AST_LOCK_TYPE_DEFAULT 将默认锁类型配置为 flock"
  - "当目标头文件提供的 PATH_MAX 小于 4096 时，必须提升 Asterisk 内部路径缓冲上限，否则 TMPDIR、配置和 media-cache 路径会被截断"
  - "HarmonyOS 可加载测试模块引用 BlocksRuntime 符号时，主程序导出列表必须显式包含三个 Blocks ABI 符号"
  - "Asterisk 的 in-tree 上游用例（tests/test_*.c，形如 `/main/...`、`/res/...`）全部声明 <depend>TEST_FRAMEWORK</depend>；未打开 TEST_FRAMEWORK 与 MENUSELECT_TESTS 时设备上不存在任何用例，上游测试通过率无从计算"
  - "TEST_FRAMEWORK 成员只在 build_tools/cflags-devmode.xml 中定义，而该文件仅当 configure --enable-dev-mode（AST_DEVMODE=yes）时才进入 menuselect-tree；测试构建必须先开 dev-mode，再在 menuselect 选择完成后把 AST_DEVMODE 从 makeopts/buildopts.h 去掉（并用 AST_DEVMODE= 覆盖主构建命令），否则 dev-mode 的 -Werror/-Wundef 严格告警会让 OHOS/clang 构建失败（如 tests/test_scope_trace.c 的 GCC 嵌套函数 SCOPE_TRACE）"
  - "menuselect --enable 只接受一个成员参数（long_options 为 required_argument），多成员必须重复 --enable X --enable Y；写成 --enable X Y Z 只会启用第一个"
  - "上游 CI 构建可测 Asterisk 的顺序是 make menuselect.makeopts → menuselect --enable DONT_OPTIMIZE --enable TEST_FRAMEWORK → --disable COMPILE_DOUBLE → --enable-category MENUSELECT_TESTS → --check-deps；配方以 with_test_framework 选项复用该顺序"
  - "OHOS 上不要跟随上游 CI 同时启用 MALLOC_DEBUG 与 DO_CRASH：设备实测该组合构建出的二进制在模块加载阶段死锁（停在 Asterisk Dynamic Loader Starting:，core waitfullybooted 永不返回、module show 阻塞、注册用例数停在 8），而不启用这两个选项的构建可正常 Asterisk Ready."
  - "musl 没有 PTHREAD_RECURSIVE_MUTEX_INITIALIZER_NP，Asterisk 的静态互斥量（AST_MUTEX_INIT_VALUE = PTHREAD_MUTEX_INITIALIZER）因此不是递归的；而 Asterisk 明确要求递归互斥量——load_modules() 先锁住 module_list，loader_builtin_init() 里的 ast_module_register() 再次加锁，于是自死锁、启动停在 Asterisk Dynamic Loader Starting:。配方通过 AST_USE_MUTEX_CONSTRUCTOR_INIT 能力开关让 lock.h 走构造函数初始化（上游 SOLARIS/BSD 路径），静态互斥量改由 ast_mutex_init() 按 PTHREAD_MUTEX_RECURSIVE 建立。"

