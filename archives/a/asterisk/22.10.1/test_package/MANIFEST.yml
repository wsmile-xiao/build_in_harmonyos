# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: asterisk/22.10.1
homepage: "https://www.asterisk.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 说明：Asterisk 的官方测试套件是独立仓库（https://github.com/asterisk/testsuite），
# 不随源码发布，且需要运行中的完整 PBX 实例（Asterisk TestSuite 框架），
# 无法在 conan 沙箱内执行，故以消费者视角的二进制验证替代。
#
# 另有随源码发布的上游 in-tree 用例：tests/test_*.c 等测试模块注册的
# `/main/...`、`/res/...` 用例。这些模块声明 <depend>TEST_FRAMEWORK</depend>，
# 需以 `-o asterisk/*:with_test_framework=True` 构建才存在于制品中，随后可在
# 设备上通过 `asterisk -rx "test execute category <cat>"` 执行。
upstream_tests:
  - file: "(独立仓库 asterisk/testsuite)"
    source: "https://github.com/asterisk/testsuite"
    description: "Asterisk TestSuite：依赖运行中 PBX 实例与模拟电话信道，不适用沙箱"
    command: "(不适用)"
  - file: "tests/test_*.c"
    source: "https://github.com/asterisk/asterisk/archive/refs/tags/22.10.1.tar.gz"
    description: "上游 in-tree 测试框架用例；模块声明 <depend>TEST_FRAMEWORK</depend>，需 with_test_framework=True 构建后执行"
    command: "./sbin/asterisk -rx \"test execute all\""

# test_package 中自带的测试 (消费者视角验证)
# 被测包为应用程序：断言产物存在并实际执行 `asterisk -V`（含输出校验）
test_package_tests:
  - file: test_package/conanfile.py::test()
    description: "断言 sbin/asterisk 与 lib/asterisk/modules/res_config_ldap.so 存在；can_run 时运行 asterisk -V 并校验退出码0且输出含 'Asterisk' 与 '22.10.1'"
    command: "./sbin/asterisk -V"
  - file: test_package/test.c
    description: "CTest 二进制通过 popen 执行真实 asterisk -V（优先 ASTERISK_BIN，fallback PATH/常见路径），校验输出含 'Asterisk' 与 '22.10.1'，失败返回非0"
    command: "ctest -R test_asterisk"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
