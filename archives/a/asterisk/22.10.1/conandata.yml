# conandata.yml — asterisk 22.10.1

sources:
  url: "https://github.com/asterisk/asterisk/archive/refs/tags/22.10.1.tar.gz"
  sha256: "373c98f4d4a1b923b42def0aee03f4e36aca9d1c244a8eeda646da8a97f89663"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "make install 增加 DISABLE_SOUNDS 开关：CI 沙箱无外网，跳过声音提示包网络下载"
    patch_type: "portability"
  - patch_file: "patches/0002-build_tools-make_xml_documentation.patch"
    patch_description: "XML 文档生成脚本 /tmp 只读（HMDFS），改用 TMPDIR"
    patch_type: "portability"
  - patch_file: "patches/0003-include-asterisk-astmm.h.patch"
    patch_description: "ASTMM_BLOCK 分配器陷阱宏污染 musl 系统头文件（sched.h），默认改 ASTMM_IGNORE"
    patch_type: "portability"
  - patch_file: "patches/0004-main-Makefile.patch"
    patch_description: "主链接行补 -luuid（conan 静态包）与 -lohosshim（musl pthread_cancel 存根，E085）"
    patch_type: "portability"
  - patch_file: "patches/0005-main-ast_expr2.c.patch"
    patch_description: "ASTMM_REDIRECT 宏污染 musl sched.h，改 ASTMM_IGNORE"
    patch_type: "portability"
  - patch_file: "patches/0006-main-ast_expr2f.c.patch"
    patch_description: "ASTMM_REDIRECT 宏污染 musl sched.h，改 ASTMM_IGNORE"
    patch_type: "portability"
  - patch_file: "patches/0007-main-dns.c.patch"
    patch_description: "无可用 resolver 状态时 ast_dns_get_nameservers 返回空容器，避免无配对解锁"
    patch_type: "portability"
  - patch_file: "patches/0008-menuselect-Makefile.patch"
    patch_description: "menuselect 编译行经 OHOS_XML2_INCDIR 环境变量注入 libxml2 头文件路径（R33 禁止硬编码）；链接行追加 OHOS_MENUSELECT_LDFLAGS（配方写入 makeopts 的 -Wl,-rpath，使 menuselect 内嵌 RUNPATH，CI #36928）"
    patch_type: "portability"
  - patch_file: "patches/0009-res-ael-ael.tab.c.patch"
    patch_description: "ASTMM_REDIRECT 宏污染 musl sched.h，改 ASTMM_IGNORE"
    patch_type: "portability"
  - patch_file: "patches/0010-res-ael-ael_lex.c.patch"
    patch_description: "ASTMM_REDIRECT 宏污染 musl sched.h，改 ASTMM_IGNORE"
    patch_type: "portability"
  - patch_file: "patches/0011-res-ael-pval.c.patch"
    patch_description: "ASTMM_REDIRECT 宏污染 musl sched.h，改 ASTMM_IGNORE"
    patch_type: "portability"
  - patch_file: "patches/0012-utils-db1-ast-include-db.h.patch"
    patch_description: "musl 无 glibc __P/__BEGIN_DECLS 宏，db1-ast db.h 补带回退定义"
    patch_type: "portability"
  - patch_file: "patches/0015-main-stdtime-tzdir-env.patch"
    patch_description: "stdtime 读取 TZDIR 环境变量，允许 OHOS runner 提供 IANA 时区数据目录"
    patch_type: "portability"
  - patch_file: "patches/0016-main-ast_expr2.y.patch"
    patch_description: "REBUILD_PARSERS 启用时保持 ast_expr2.y 生成器不污染 musl sched.h"
    patch_type: "portability"
  - patch_file: "patches/0023-main-app-ohos-flock-default.patch"
    patch_description: "通过 AST_LOCK_TYPE_DEFAULT 配置路径锁类型；OHOS 配置为 flock，避开 HMDFS 不支持 link 硬链接锁"
    patch_type: "portability"
  - patch_file: "patches/0025-build-ohos-runtime-module-libs.patch"
    patch_description: "为主程序和可加载模块显式链接 OHOS BlocksRuntime、pthread shim 与 uuid 运行库"
    patch_type: "portability"
  - patch_file: "patches/0026-main-ohos-abstract-control-socket.patch"
    patch_description: "通过 AST_USE_ABSTRACT_SOCKET 能力开关选择 abstract AF_UNIX 控制套接字，保留 pathname socket 回退"
    patch_type: "portability"
  - patch_file: "patches/0027-include-asterisk-ohos-path-max.patch"
    patch_description: "当 POSIX PATH_MAX 小于 4096 时提升 Asterisk 内部路径缓冲上限，避免路径截断"
    patch_type: "portability"
  - patch_file: "patches/0031-main-asterisk-exports-ohos-blocks.patch"
    patch_description: "导出 OHOS BlocksRuntime 符号，使链接时依赖 Blocks 的可加载测试模块可以解析主程序符号"
    patch_type: "portability"
  - patch_file: "patches/0034-include-asterisk-lock-mutex-constructor-init.patch"
    patch_description: "musl 没有可递归的静态互斥量初始值（无 PTHREAD_RECURSIVE_MUTEX_INITIALIZER_NP），Asterisk 静态互斥量因此不是递归的，loader 在 module_list 上自死锁、启动停在 Dynamic Loader Starting；增加 AST_USE_MUTEX_CONSTRUCTOR_INIT 能力开关，由配方注入后改用构造函数初始化（等价上游 SOLARIS/BSD 路径）"
    patch_type: "portability"
