# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: as31/1.0
homepage: "http://www.pjrc.com/tech/8051/"

# 上游测试命令
# as31 has no "make check" target; upstream uses manual assembly tests.
upstream_check_command: "make check"
upstream_check_note: "as31 Makefile has no check target; upstream tests are manual"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# as31 upstream has no automated test suite; testing is done by
# assembling example .asm files and verifying the output.
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# CLI 工具，通过 popen 执行 as31（无参数）验证输出包含 "Usage"
test_package_tests:
  - file: "test.c"
    description: "执行 as31 二进制验证输出包含 Usage 信息"
    command: "./test_as31"

# 测试断言总数 (近似值)
assertion_count: 1
