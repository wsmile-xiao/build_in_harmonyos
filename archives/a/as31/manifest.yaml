# 软件级 manifest
# 文件位置: archives/a/as31/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: as31

# 显示名
display: "AS31"

# 一句话描述
description: "Intel 8031/8051 Assembler"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "http://www.pjrc.com/tech/8051/"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "Override CC=gcc with clang from Conan conf (R33)"
    - "Build only 'as31' CLI target, not 'as31_gtk' (requires GTK)"
    - "Makefile chmod/strip may fail on OHOS; use make -k || true"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0":
    status: built
    build_date: "2026-08-19"
