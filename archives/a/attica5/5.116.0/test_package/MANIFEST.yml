version: 1
package: attica5/5.116.0
homepage: https://invent.kde.org/frameworks/attica

tests:
  upstream:
    status: planned
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E '^providertest$'"
    source: "attica-5.116.0/autotests/"
    expected:
      - configtest
      - persontest
      - providertest
  package:
    status: planned
    source: test.cpp
    command: "ctest && ./test_attica5"
    description: "Constructs Attica value objects (Person/Config) and verifies accessors."

notes:
  - "providertest is excluded from ctest: it contacts the external OCS provider endpoint over the network, which is unreachable in the build sandbox (QT_QPA_PLATFORM=offscreen, HOME=test-home)."
  - "tests/projecttest requires Qt5Widgets which qt5-qtbase/5.15.2 does not ship; the recipe patch guards the Widgets find_package and skips the manual projecttest app."
