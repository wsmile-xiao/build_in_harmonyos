knowledge_gained:
  - "attica5 5.116.0 (KF5) requires Qt5Core, Qt5Network and ECM; qt5-qtbase/5.15.2 provides Qt5Core/Qt5Network/Qt5Gui/Qt5Test/Qt5Concurrent but no Qt5Widgets."
  - "qt5-qtbase ships per-module cmake configs (Qt5Core, Qt5Network, ...) but no aggregated Qt5Config; CMakeDeps set_property('qt5-qtbase', 'cmake_file_name', 'Qt5') regenerates a clean Qt5Config that find_package(Qt5 COMPONENTS ...) can use."
  - "ecm is a tool_requires (build context); its share/ECM/cmake must be appended to CMAKE_PREFIX_PATH/CMAKE_MODULE_PATH in conan_cmakedeps_paths.cmake because CMakeDeps only wires host-context deps' builddirs."
  - "CMakeDeps does not export Qt5::moc / Qt5::rcc executable targets; CMAKE_AUTOMOC_EXECUTABLE / CMAKE_AUTORCC_EXECUTABLE must point at qt5-qtbase bin/moc and bin/rcc."
  - "tests/projecttest requires Qt5Widgets; with Widgets unavailable the find_package must be guarded (CONFIG QUIET + return()) so configtest/persontest still build and run."
  - "providertest depends on live OCS network endpoints; it is excluded from CTest (-E '^providertest$') and documented as not run."
  - "HarmonyOS is not mapped to the Linux CMake platform, so CMAKE_SHARED_LIBRARY_SONAME_<lang>_FLAG is undefined and produced .so files lack DT_SONAME; the expat-validated fix CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE + CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG='-Wl,-soname,' yields a relocatable unversioned SONAME and passes the W3 CI L5 soname gate."

