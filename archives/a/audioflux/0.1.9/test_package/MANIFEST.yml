# test_package/MANIFEST.yml
# Upstream test declaration — required by CI (build_and_test.sh L0e)
# See: docs/TEST_QUALITY_SPEC.md

package: audioflux/0.1.9
homepage: "https://github.com/libAudioFlux/audioFlux"

# 上游无独立测试套件（git tree 0 test 文件；仅 benchmark/ 脚本与 docs/examples.md 文档）
upstream_check_command: "true"

# conanfile.py build() 集成状态：上游无测试可接入，build() 内仅构建 C 核心
upstream_test_in_build: false
upstream_test_command: "true"

# 上游测试文件：官方 tag 无 tests/ 目录（枚举证据见 notes.md）
upstream_tests: []

# test_package 消费者侧测试（验证公开 API + 公开产物；E212 双保险）
test_package_tests:
  - file: test_audioflux.py
    description: "Consumer test: MelSpectrogram.spectrogram 真实计算 + ctypes 加载 libaudioflux.so + __version__（真机 3 checks）；沙箱 E212 下回退静态签名产物校验（ELF+.codesign+DT_SONAME，逐项计数）"
    command: "python3 test_audioflux.py"

# 近似断言数（真机路径 3 checks；沙箱路径静态检查 ≥6 项）
assertion_count: 3
