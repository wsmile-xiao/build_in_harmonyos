patches:
  - patch_file: "patches/0001-python-audioflux-fftlib.py.patch"
    patch_description: "fftlib.py get_fft_lib_name 支持 harmonyos（platform.system() 在 OHOS 返回 'HarmonyOS'，与 linux 同为 .so 动态库），否则 import audioflux 直接 ValueError"
    patch_type: "portability"
  - patch_file: "patches/0002-src-CMakeLists.txt.patch"
    patch_description: "新增 HarmonyOS|OHOS CMake 分支（编译器由 Conan Toolchain 提供，OpenMP 用 SDK libomp），原版无该分支导致 OHOS 下无目标生成"
    patch_type: "portability"
