# 软件级 manifest — ancient
# 遵循 ARCHIVE-SPEC v2.0

software: ancient
display: "ancient"
description: "老式平台（Amiga/DOS 等）文件格式解压库：RNC/ICE/StoneCracker/PackIce/DMS/LZX/PowerPacker/bzip2/gzip 等数百种格式，提供 ancient::Decompressor C++ API 与 ancient CLI 验证工具"
category: library
homepage: "https://github.com/temisu/ancient"
license: MIT
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "发布 tarball 无预生成 configure：配方内 libtoolize → aclocal → autoconf → automake --add-missing 生成 build-aux 与 configure（tool_requires automake/1.18 + libtool/2.5.4）"
    - "autoconf-archive/pkg m4 宏（AX_CXX_COMPILE_STDCXX 等）随 export_sources 携带并注入 ACLOCAL_PATH（CI 沙箱无 $HOME/.local/share/aclocal）"
    - "OHOS 不被 config.guess 识别：configure 显式 --build=aarch64-linux --host=aarch64-linux"
    - "上游 v2.3.0 testing/ 被 .gitattributes export-ignore 排除出 tarball：从官方 tag 拉取并编译 obj/test，201/201 通过"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.3.0":
    status: built
    build_date: "2026-09-24"
    url: "https://github.com/temisu/ancient/archive/refs/tags/v2.3.0.tar.gz"
    sha256: "5d1d71f0fb8c69955bb4ec01ed9ffd2b5bf546b10463030dda85d949ea422bc9"
    tests: "obj/test: 201/201 passed (100%)"