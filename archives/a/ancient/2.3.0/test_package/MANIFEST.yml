# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ancient/2.3.0
homepage: "https://github.com/temisu/ancient"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# autotools 的 make check 无注册用例（TESTS 为空）；
# 上游 CI 实际以 Makefile.unix 构建并运行 ./obj/test（testing/test.cpp）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# testing/test.cpp 由 Makefile.unix TESTBIN=obj/test 构建，201 个独立 verifyFile 用例
upstream_tests:
  - file: testing/test.cpp
    source: ancient-2.3.0/testing/test.cpp
    description: "上游格式解压回环测试：逐格式解压官方压缩样例并与 .raw 参照逐一比对（201 个独立用例，v2.3.0 tag 实测通过）"
    command: "./obj/test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "实质消费者测试：调用 ancient::Decompressor 公开 API 解压内嵌 ICE 样例，校验解压 SHA-256 与官方 test_neo.raw 一致"
    command: "./test_ancient"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 obj/test 201 例 + test_package 尺寸/哈希 3 项断言
assertion_count: 204