    runnable: 0
    note: "测试构建硬依赖 wxWidgets GUI 模块（std/stc/gl），已合入 wxWidgets 3.2.6 为 wxUSE_GUI=OFF 无 GUI 模块，OHOS 无 GUI 显示后端，无法编译运行"

test_package_tests:
  - file: test_aegisub.c
    description: "Verify archived LICENSE file exists (R34 anti-empty-shell check for difficult-library archive, status: failed)."
