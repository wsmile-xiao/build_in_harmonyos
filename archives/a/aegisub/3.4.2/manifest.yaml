failure_reason: "aegisub 3.4.2 是 wxWidgets GUI 字幕编辑器（meson + C++20 + gtest），libaegisub 核心库仅依赖 wxBase。适配要点：patch meson.build（wx_dep 改 wx-baseu-3.2 + 禁用 GUI 前端 + gl 依赖 OHOS 跳过 + luajit 子项目 harmonyos 平台映射 linux 分支），注入 conan 制品（wxwidgets 3.2.6 GUI=OFF / boost / icu / fontconfig / freetype / harfbuzz / fftw3 / gtest），并手工补全 boost 制品缺失的 interprocess/locale/asio/charconv 头文件与 libboost_locale.a——上游 gtest-main 成功编译并在 OHOS 运行：349 tests ran / 348 PASSED / 1 FAILED（lagi_iconv.Roundtrip，iconv 转换边界差异）。"

