knowledge_gained:
  - "aegisub 3.4.2 是 wxWidgets GUI 字幕编辑器（meson + C++20 + gtest），但 libaegisub 核心库仅依赖 wxBase（libaegisub/ 下仅 charset_conv.cpp 和 format.h 两处 wxString，wx GUI 头文件 144 处全在 src/ GUI 前端）——patch 掉 GUI 模块即可编译核心+测试"
  - "实测 patch 路径：meson.build wx_dep 从 modules ['std','stc','gl'] 改为 wx-baseu-3.2（wxBase pkg-config），aegisub executable 用 if false 禁用，gl 依赖在 harmonyos 上跳过；luajit 子项目 meson.build 的 host_machine.system() 在 OHOS 返回 'harmonyos'（非 linux/darwin/windows），需映射到 linux 分支（LUAJIT_OS_LINUX + elfasm）"
  - "依赖装配要点：注入 conan 制品（wxwidgets 3.2.6 GUI=OFF / boost / icu / fontconfig / freetype / harfbuzz / fftw3 / gtest），修正各制品 .pc 的 prefix=/ 错误；boost 制品缺失 interprocess/locale/asio/charconv 模块头文件需从 GitHub 补全，libboost_locale.a 需手动用 clang++ 编译（15 共享源 + ICU/STD 后端，定义 NO_POSIX/NO_WINAPI_BACKEND）"
  - "路径 A 适配成功：上游 gtest-main 编译并运行，349 tests / 348 PASSED / 1 FAILED（lagi_iconv.Roundtrip），status: built"
