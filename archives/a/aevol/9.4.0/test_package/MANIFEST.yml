package: aevol/9.4.0
homepage: "https://www.aevol.fr/"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest (executed after the CMake build; 71 gtest cases + 9 ctest test scripts)"
upstream_tests:
  - "71 gtest TEST/TEST_F cases across 16 test executables (CheckpointExplorerTest, DiscreteDoubleFuzzyTest, DnaTest, Dna_4bTest, EukIndividualTest, EukTest_mutations, EukTest_nornas, EukTest_withrnas, EvolutionRunnerTest, FastaTest, Folding4bTest, GFF3Test, JumpingMTTest, ParamReaderTest, SampleTest, SelectionTest)"
  - "9 ctest test scripts (test/ctest/test_aevol_*: run_init, extract, lineage, ancstats, ancestor_robustness, run_wt, run_reprod, extract_genomes, run_naught)"
upstream_case_count: 80
upstream_test_note: "Validated locally on aarch64-ohos with clang 15 + libcxx/17.0.6: 80 upstream test cases (71 gtest + 9 ctest scripts)."

test_package_tests:
  - file: "test_aevol.py"
    description: "Execute aevol_create_2b: verify version output and creation of an initial population from the bundled example param file."
    command: "python3 test_aevol.py <pkg>/bin <param.in>"

test_package_assertion_count: 2
assertion_count: 82
