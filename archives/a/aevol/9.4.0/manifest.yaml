version: "9.4.0"
software: aevol

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-30"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://gitlab.inria.fr/aevol/aevol/-/archive/9.4.0/aevol-9.4.0.tar.gz"
  sha256: "b34343c225ef5768405bbd24e93bd2cbf0b5ed828e1ea7e69b3873be200faffd"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_CXX_FLAGS=-nostdinc++ -isystem <libcxx17>/include -D_LIBCPP_PROVIDES_DEFAULT_RUNE_TABLE -include ohos_libc_compat.h"
    - "-DCMAKE_EXE_LINKER_FLAGS=<libcxx17>/lib/libc++.a <libcxx17>/lib/libc++abi.a"
    - "-DFETCHCONTENT_SOURCE_DIR_JSON=<json-3.12.0>"
    - "-DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=<googletest-1.14.0>"
  dependencies:
    - libcxx/17.0.6
    - zlib/1.3.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-fasta-emplace-back-string.patch"
  - "0002-region-handler-brace-init.patch"
  - "0003-cmake-relax-clang-version.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "aevol 9.4.0 依赖现代 C++20 标准库（std::format/std::views/std::from_chars(double)），OHOS SDK libc++15 缺失，需先适配 libcxx/17.0.6"
  - "clang 15 不支持 C++20 括号聚合初始化，libc++17 construct_at 需按 std::is_aggregate 分派（聚合→brace、非聚合→paren）"
  - "from_chars(double) 由 aevol 自带 strtod 兜底（utility.h，HAS_FROMCHARS_DOUBLE 未定义时生效）"
  - "json/googletest 通过 -DFETCHCONTENT_SOURCE_DIR_* 注入本地解压目录，避免构建期访问 GitHub"
