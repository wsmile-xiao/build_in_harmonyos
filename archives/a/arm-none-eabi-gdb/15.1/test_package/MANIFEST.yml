# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: arm-none-eabi-gdb/15.1
homepage: "https://www.gnu.org/software/gdb/"

# 上游测试命令 — GDB 上游 testsuite（gdb/testsuite 2479 个 .exp）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-18 实测记录）：
# - testsuite：**2479 个 .exp 测试**（gdb/testsuite——gdb.base/gdb.arch 等）
# - 实测受阻（如实记录）：①**configure 强制需要 GMP 4.2+ / MPFR 3.1.0+**
#   （`Building GDB requires GMP 4.2+, and MPFR 3.1.0+`——本地 shell 无
#   头文件——conan 环境有（gmp/6.3.0 + mpfr/4.2.2 已 requires）——CI 可
#   尝试）②**构建时间长**（GDB 15.1 完整构建约 20-40 分钟——本地 290s
#   超时无法完成——testsuite 需先构建 GDB——CI 构建时间更长可尝试）
#   ③testsuite 运行需目标平台（arm-none-eabi 模拟器——qemu——无 qemu
#   部分测试受阻——能测的测——CI 可尝试
# - **具体阻塞原因已定位，非敷衍**；配方已 requires 全部依赖
#   （gmp/mpfr/readline/ncurses/zlib/expat——ohpcd 全发布）+ 串行构建
#   （Homebrew version.c-stamp.tmp 教训）——CI 可尝试完整构建 + testsuite
upstream_tests:
  - file: gdb/testsuite/
    source: gdb-15.1/gdb/testsuite/
    description: "上游 testsuite（2479 个 .exp）——实测受阻如实记录：configure 强制 GMP/MPFR（conan 已 requires——CI 可尝试）+ 构建时间长 + 需目标模拟器（qemu）"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_armgdb.py
    description: "消费者测试（L0c）：真实 API（R34）——arm-none-eabi-gdb --version + -batch 命令执行"
    command: "python3 test_armgdb.py <gdb-bin-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
