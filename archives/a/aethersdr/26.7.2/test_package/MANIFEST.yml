# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: aethersdr/26.7.2
homepage: "https://github.com/aethersdr/AetherSDR"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
# 静态统计：tests/ 目录 118 个 *_test.cpp + 顶层 CMakeLists.txt 110 个 add_test
# 因 Qt6 缺失导致 cmake configure 失败，ctest 未实际执行
# 以下列出主要测试文件（tests/ 目录抽样）
upstream_tests:
  - file: CAT_Flex_test.cpp
    source: aethersdr-26.7.2/tests/CAT_Flex_test.cpp
    description: "FlexRadio CAT 控制协议测试"
    command: "ctest -R CAT_Flex_test"
  - file: adaptive_filter_test.cpp
    source: aethersdr-26.7.2/tests/adaptive_filter_test.cpp
    description: "自适应滤波器测试"
    command: "ctest -R adaptive_filter_test"
  - file: aetherd_amp_decode_test.cpp
    source: aethersdr-26.7.2/tests/aetherd_amp_decode_test.cpp
    description: "aetherd AM 解码测试"
    command: "ctest -R aetherd_amp_decode_test"
  - file: aprs_packet_test.cpp
    source: aethersdr-26.7.2/tests/aprs_packet_test.cpp
    description: "APRS 数据包测试"
    command: "ctest -R aprs_packet_test"
  - file: ax25_frame_formatter_test.cpp
    source: aethersdr-26.7.2/tests/ax25_frame_formatter_test.cpp
    description: "AX.25 帧格式化测试"
    command: "ctest -R ax25_frame_formatter_test"
  - file: dstar_modem_test.c
    source: aethersdr-26.7.2/tests/dstar_modem_test.c
    description: "D-STAR 调制解调器测试"
    command: "ctest -R dstar_modem_test"
  - file: digital_voice_protocol_test.c
    source: aethersdr-26.7.2/tests/digital_voice_protocol_test.c
    description: "数字语音协议测试"
    command: "ctest -R digital_voice_protocol_test"
  - file: vita_packet_admission_test.c
    source: aethersdr-26.7.2/tests/vita_packet_admission_test.c
    description: "VITA 数据包准入测试"
    command: "ctest -R vita_packet_admission_test"
  - file: thumbdv_queue_test.c
    source: aethersdr-26.7.2/tests/thumbdv_queue_test.c
    description: "ThumbDV 队列测试"
    command: "ctest -R thumbdv_queue_test"
  - file: client_eq_test.cpp
    source: aethersdr-26.7.2/tests/client_eq_test.cpp
    description: "客户端均衡器测试"
    command: "ctest -R client_eq_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    source: aethersdr-26.7.2/test_package/test.c
    description: "R34 实质测试：popen 执行 AetherSDR --version，验证被测包二进制可启动且输出含版本数字"
    command: "./test_aethersdr"

# 上游测试统计摘要
upstream_test_summary:
  total_test_files: 118
  total_add_test_targets: 110
  estimated_total_cases: 120
  actual_execution: "N/A — cmake configure 因 Qt6 缺失失败，ctest 未执行"
  pass_count: 0
  fail_count: 0
  skip_count: 0
  note: "Qt6 硬依赖缺失（W0b 选型即止 env_unsupported），上游测试未实际运行"
