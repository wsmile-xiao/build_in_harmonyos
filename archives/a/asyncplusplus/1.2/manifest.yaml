software: asyncplusplus
build_system: cmake

version: "1.2"
status: published
build_date: "2026-08-20"

source:
  url: "https://github.com/Amanieu/asyncplusplus/archive/refs/tags/v1.2.tar.gz"
  sha256: "0711c8db231bf3eb1066400f49ed73b5c3211a10eb3b8c3e64da3d5fdee8a4bf"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DUSE_CXX_EXCEPTIONS=ON"
  dependencies:
    - pthread
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "asyncplusplus 是纯 C++11 库，仅依赖 pthreads（系统内置），无外部依赖"
  - "上游仓库无测试套件（无 tests/ 目录、无 CTest targets），测试由 test_package 覆盖"
  - "CMakeLists.txt cmake_minimum_required(VERSION 3.1) 需要 bump 到 3.5 以兼容 CMake 4.x"
  - "库名输出为 libasync++.a（CMake target: Async++，Conan cmake_target_name: Async++）"
  - "编译选项含 -fno-rtti，OHOS 上 clang 支持此选项无需特殊处理"
  - "BUILD_SHARED_LIBS 默认 ON，Conan 配方强制设为 OFF（静态库）"
  - "cmake_minimum_required 需在 build() 中用 Python 替换（patch 上下文行号不一致导致 patch 失败）"
  - "OHOS 真机 CMake 报 'System is unknown to cmake, create Platform/HarmonyOS' 是正常警告，不影响构建"
  - "OHOS 真机 mkfifo 报 'Operation not permitted' 是 make jobserver 警告，构建正常完成"
