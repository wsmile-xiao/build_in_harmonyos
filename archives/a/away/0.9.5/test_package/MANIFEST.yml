# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: away/0.9.5
homepage: "https://web.archive.org/web/20050316212734/http://unbeatenpath.net/software/away/"

# 上游测试命令 — away 上游无独立 CI 单元测试套件（终端锁定工具，
# 验证 = make 构建 + 运行帮助）
upstream_check_command: "make"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-21 实测记录）：
# - 上游无独立测试套件（无 make test 入口；源码含 away.c/Makefile/man）
# - 构建验证：make（CC=clang + LIBS=-lpthread -lpam -lpam_misc）生成
#   away 二进制——实测通过
# - 消费者验证（test_package）：二进制存在 + 可执行 + ELF（R34 降级——
#   away 运行需 PAM 会话/终端锁定，OHOS 终端/PAM 会话模型差异 +
#   /etc/pam.d/away 配置需系统级安装，环境阻塞如实说明）
upstream_tests: []
