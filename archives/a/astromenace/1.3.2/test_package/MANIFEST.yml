# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# astromenace 1.3.2（HarmonyOS PC 适配）为图形游戏应用：
#   - 上游无独立 CTest/check 测试套件（CMake 无 ENABLE_TESTING 目标）
#   - 本地验证通过 test_package 编译 + 可执行文件链接成功 + 运行冒烟检测（R34）

package: astromenace/1.3.2
homepage: "https://viewizard.com/"

# 上游测试命令: 上游未提供 make check / ctest -N 可发现测试
upstream_check_command: "none (no check target in upstream CMake)"

# conanfile.py build() 方法中是否已集成上游测试: 否（上游无测试目标）
upstream_test_in_build: false
upstream_test_command: "none"

# 上游实际运行的测试程序: 无（留空，上游无测试二进制）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证):
# test_package.cpp 编译为 test_astromenace 消费者程序，链接 astromenace 包验证配方可消费，
# 并通过 conan create 阶段的可执行链接（AstroMenace 二进制 + test_astromenace）验证整链条。
test_package_tests:
  - file: test_package.cpp
    description: "Consumer smoke test: link against astromenace package and report build OK"
    command: "./test_astromenace"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1