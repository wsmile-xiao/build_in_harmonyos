# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 atlas 0.46.0 自带测试套件（hic/pluto/atlas_io 各 tests/ 目录 +
# 仓库 CI），本次适配未迁移运行（依赖完整 ECMWF 构建环境与 GPU/MPI）；
# test_package 为 OHOS 适配自研的 L1 验证。

package: atlas-ecmwf/0.46.0
homepage: "https://github.com/ecmwf/atlas"

# 上游官方测试：各子目录 tests/ + 仓库 CI
upstream_official_tests:
  - suite: "ci"
    count: 20
    kind: "unit"
    command: "ctest"

# 构建阶段执行的测试命令：上游 ctest（本次适配未运行）
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: "ctest"

# 适配补全测试（自研，非上游）：无（未迁移 ctest，消费者验证集中在
# test_package 的 L1 验证）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test.cpp
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：链接 libatlas 并调用 atlas::Library::instance().version() 获取版本，断言非空，验证库真实可用"
    command: "./test_atlas"

# 测试断言总数 (实际统计：1 项断言，全部为适配自研断言：
# atlas::Library::instance().version() 非空)
assertion_count: 1
