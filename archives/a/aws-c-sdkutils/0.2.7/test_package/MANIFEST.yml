# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: aws-c-sdkutils/0.2.7
homepage: "https://github.com/awslabs/aws-c-sdkutils"

# 上游测试命令 (CMake project uses BUILD_TESTING option)
upstream_check_command: "cmake --build build --target test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/sdkutils_test.c
    source: aws-c-sdkutils-0.2.7/tests/sdkutils_test.c
    description: "SDK utils unit tests"
    command: "ctest -R sdkutils"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 初始化库并调用 aws_partitions_get_supported_version API"
    command: "./test_aws_c_sdkutils"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
