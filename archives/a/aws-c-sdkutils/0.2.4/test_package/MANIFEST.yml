# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: aws-c-sdkutils/0.2.4
homepage: "https://github.com/awslabs/aws-c-sdkutils"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/sdkutils_test.c
    source: aws-c-sdkutils-0.2.4/tests/sdkutils_test.c
    description: "Library init/cleanup test (mirrors upstream sdkutils_library_test)"
    command: "./sdkutils_library_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 验证 aws_sdkutils_library_init/clean_up 可正常调用"
    command: "./test_aws_c_sdkutils"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
