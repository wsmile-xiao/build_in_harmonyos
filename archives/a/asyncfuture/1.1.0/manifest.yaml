patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "header-only Qt 库：requirements() 需 transitive_headers/transitive_libs 声明 qtbase/6.11.1，消费者才能找到 Qt 头/链接目标（qtbase 设 cmake_find_mode=none，CMakeDeps 无法生成可用 qtbase target，需包内自带 asyncfutureConfig.cmake INTERFACE IMPORTED）"
  - "W3/L1e 破坏性反测若误判 fake test（sabotage 后仍通过），先查 ~/.cmake/packages/<name> 用户包注册表残留（上游 export(PACKAGE) + 本机手工构建树），清除后复跑；与 E225 $TMP 布局组合双保险（知识草稿 DRAFT-asyncfuture-1.1.0-l1e-cmake-user-registry-pollution）"
  - "OHOS /tmp 只读：usr/local/bin/mktemp shim 默认模板硬编码 /tmp/tmpXXXXXX 忽略 TMPDIR，需 PATH 前置包装 + 注入 TMPDIR 后 W3 的 L0 门禁 mktemp 才能工作"
  - "上游测试套件（asyncfutureunittests）需 qtdeclarative/6.11.1（Qml/Quick/QuickTest 在 qtdeclarative 非 qtbase），test_package 额外 requires"
  - "conan create 用 -c tools.cmake.cmaketoolchain:generator=Ninja（或 global.conf）显著提速 test_package 30 目标构建，避免 Make 单线程超工具预算"