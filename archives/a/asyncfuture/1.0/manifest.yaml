# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1"
software: "asyncfuture"
status: built
build_date: "2026-09-12"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 活跃上游 fork（benlau 原仓 2023-12 已归档并指到此仓）
  # 上游 tag: v1.1.0（commit f95250c），平台任务版本号 "1" 对应该 tag
  url: "https://github.com/vpicaver/asyncfuture/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "63c95c9ae14b91c14b3c89ac3fe5d6b32e8290b851ecbde92e33120dfdded430"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # header-only 库：无编译步骤，CMake INTERFACE target（上游自带 CMakeLists.txt）
  system: cmake
  configure_options: []

  # 消费者编译/链接期依赖（asyncfuture.h 包含 QObject/QFuture 类型）
  dependencies:
    - qtbase/6.11.1

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "header-only Qt 库：cpp_info.requires 需传递 qtbase 组件（core/concurrent），否则消费者找不到 Qt 头"
  - "上游 v1.1.0 的 README 声明 Qt 5.15/6.2+，master 分支为 Qt 6.8+；本配方按 tag v1.1.0 适配"
  - "benlau/asyncfuture 已归档，活跃上游为 vpicaver fork，源 URL 必须用 fork 仓库"
