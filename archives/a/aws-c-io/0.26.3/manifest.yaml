version: "0.26.3"
status: partial
build_date: "2026-04-24"

source:
  url: "https://github.com/awslabs/aws-c-io/archive/refs/tags/v0.26.3.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DBYO_CRYPTO=ON"
  dependencies:
    - aws-c-common/0.12.6
    - aws-c-cal/0.9.13
    - aws-c-compression/0.3.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "BYO_CRYPTO=ON 可禁用 s2n TLS 依赖"
  - "CMake 不识别 HarmonyOS，需使用 CMAKE_SYSTEM_NAME=Linux"
