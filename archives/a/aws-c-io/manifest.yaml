software: aws-c-io
display: "AWS C IO"
description: "AWS C SDK 的 IO 和 TLS 抽象层，提供事件循环、Socket 通道和异步 IO"
category: network
homepage: "https://github.com/awslabs/aws-c-io"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "使用 BYO_CRYPTO=ON 禁用 s2n TLS 依赖"
    - "CMake 不识别 HarmonyOS，需用 CMAKE_SYSTEM_NAME=Linux"
  common_dependencies:
    - aws-c-common
    - aws-c-cal
    - aws-c-compression

versions:
  "0.26.3":
    status: partial
    build_date: "2026-04-24"
