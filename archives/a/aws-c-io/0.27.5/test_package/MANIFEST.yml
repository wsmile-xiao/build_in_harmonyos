# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: aws-c-io/0.27.5
homepage: "https://github.com/awslabs/aws-c-io"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# aws-c-io 上游测试依赖 s2n-tls，本 PR 使用 BYO_CRYPTO=ON 禁用了 TLS 后端，故无上游测试可运行
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 aws_io_library_init/clean_up 可正常调用"
    command: "./test_aws_c_io"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
