# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.27.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.27.5"

# 软件名
software: "aws-c-io"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-27"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/awslabs/aws-c-io/archive/refs/tags/v0.27.5.tar.gz"

  # 源码校验和
  sha256: "aa132d5a728f18ab8e0a6ea96d3d2f7e66bc8d3fe029d9ed1b05c06aa0c5b900"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_TESTING=OFF"
    - "-DBYO_CRYPTO=ON"
    - "-DBUILD_SHARED_LIBS=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "aws-c-common/0.14.3"
    - "aws-c-cal/0.9.15"
    - "aws-lc/5.4.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists-add-harmonyos-platform.patch"
  - "0002-CMakeLists-add-threads-before-cal.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 不识别 HarmonyOS 平台名，需在 CMakeLists.txt 平台检测分支中添加 HarmonyOS 复用 Linux/epoll 事件循环"
  - "find_package(Threads) 必须在 find_package(aws-c-cal) 之前调用，否则 aws-lc 的 crypto-config.cmake 引用 Threads::Threads 目标时不存在"
  - "使用 CMAKE_PREFIX_PATH 而非 CMakeDeps 以保留上游 AWS:: 目标名和 CMake 模块路径"
  - "BYO_CRYPTO=ON 禁用 s2n-tls TLS 后端，基础 IO 功能（事件循环、socket、DNS）仍可用"
