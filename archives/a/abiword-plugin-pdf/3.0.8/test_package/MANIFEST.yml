# abiword-plugin-pdf 3.0.8 test_package manifest
# 上游 AbiWord tarball 无独立测试套件(plugin 仅 ie_exp_PDF 相关源文件),
# 无上游 criterion/gtest 用例可运行。test_package 提供自增 smoke 测试:
#   test_pdf.sh — readelf 验证 pdf.so ELF + ABI 导出符号(3 项)+ FUNC 符号计数
# (ctypes.CDLL 独立加载判定在 conanfile.py test() 内,插件由 AbiWord 主进程
#  dlopen,独立加载失败是插件架构预期行为)
test_type: smoke
tests:
  - name: test_pdf
    source: test_pdf.sh
    description: readelf 验证 pdf.so ELF 有效性与 ABI 导出符号
