package: automake/1.19
homepage: "https://www.gnu.org/software/automake/"
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"
upstream_tests:
  - file: "t/list-of-tests.mk"
    source: "automake-1.19/t/list-of-tests.mk"
    description: "上游 automake 测试套件：t/ 目录 1304 个测试条目（按 list-of-tests.mk 唯一文件名清点：1259 个 .sh + 13 个 .pl + 32 个 .tap；XFAIL 冗余列出只计一次）"
    command: "make check"
upstream_tests_modified: false
upstream_tests_supplemented: false
supplement_reason: "上游 1304 条测试覆盖 aclocal/automake 全功能；适配层改动只在 conan 配方（可重定位包装脚本 + PERL5LIB/ACLOCAL_PATH 环境注入），不触碰上游测试语义，无需补全新测试"
test_package_tests:
  - file: test.sh
    description: "aclocal/automake --version 可执行 + aclocal 在最小 configure.ac 上产出 aclocal.m4（宏目录接对）+ automake --add-missing --copy 在真实 Makefile.am 上产出 Makefile.in（--libdir 可重定位接对）。真机 2026-09-26 实跑 4/4 通过（工具调用按设备 exec 策略走 sh 绝对路径前缀，详见 1.19/notes.md）"
    command: "test() 内 sh <source_folder>/test.sh <package>/bin"
  - file: test_e2e.sh
    description: "鸿蒙特有测试——完整消费者端到端用例：下游微型 autotools 工程 e2e-probe（fixture 含发布式随档 configure，真机无 autoconf），用包内 aclocal/automake 走通 aclocal→automake --add-missing --copy→sh ./configure→make→make check（并行 harness，LOG_COMPILER=sh）→make install（INSTALL='sh ./install-sh'）→运行已安装产物 probe 并核对输出 probe-ok 1.0"
    command: "test() 内 sh <source_folder>/test_e2e.sh <package>/bin"
assertion_count: 4
consumer_case_count: 1
