software: automake
version: "1.16.5"
status: success
build_system: autotools + gen-all.pl (manual)
compile_date: "2026-04-09"

dependencies:
  required:
    - perl    # 运行时必需（纯 Perl 项目）
    - autoconf  # 配合 autoreconf 使用
  optional:
    - gnu-make   # 构建 Autotools 项目时需要

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
  cflags: "-fPIC -O2"
  perl_path: /data/service/hnp/bin/perl

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: |
      HarmonyOS (OpenHarmony) 完整适配：
      - config.guess: HarmonyOS 内核检测 + aarch64-ohos 输出 + 同步上游新版改进
      - config.sub: linux-ohos kernel-OS 解码 + OS 识别列表 + kernel-OS 验证（共 3 处）
    lines_changed: ~110 (config.guess ~100 + config.sub ~10)
    scope: config.guess + config.sub

compatibility:
  level: high
  issues: []
  notes: |
    纯 Perl 项目，无 ELF 二进制。
    官方 make check / make install 因鸡生蛋问题不可用，
    使用 gen-all.pl 手动生成 + 手动安装替代。

test_results:
  type: manual
  method: 全链路功能测试（autoreconf → configure → make → run）
  official_suite: 不可用（鸡生蛋问题）
  details:
    - test: automake --version → PASS (GNU automake 1.16.5)
    - test: aclocal --version → PASS (GNU aclocal 1.16.5)
    - test: autoreconf --install --force → PASS
    - test: ./configure → PASS
    - test: make → PASS (clang 编译成功)
    - test: 运行产物 → PASS (输出正确)
    - test: Staging 隔离目录全链路 → PASS

knowledge_gained:
  - automake 是纯 Perl 项目，无需 C 编译器
  - 构建存在鸡生蛋问题：automake 脚本依赖 Config.pm，而 Config.pm 由 configure 生成
  - 解决方案：gen-all.pl 手动执行 @VAR@ 替换，绕过标准 make 流程
  - config.guess 和 config.sub 需要同时修改才能完整支持新 OS（原补丁遗漏了 config.sub）
  - 符号链接在某些文件系统上受限，版本化副本用 cp 替代 ln -sf

maintainer: OpenHarmony PC Developer社区
tags: [automake, autotools, gnu, perl, build-tool]

skipped_gates: []
