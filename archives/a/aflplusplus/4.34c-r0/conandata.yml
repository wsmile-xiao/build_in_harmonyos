sources:
  url: "https://github.com/AFLplusplus/AFLplusplus/archive/refs/tags/v4.34c.tar.gz"
  sha256: "b500b3d8012757ba6f3435814f7f36a474a1b722efce464216c87af0c515888c"

patches:
  - patch_file: "patches/0001-include-forkserver.h.patch"
    patch_description: "0001 include forkserver.h add sys/types.h for uid_t pid_t mode_t on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0002-include-sharedmem.h.patch"
    patch_description: "0002 include sharedmem.h add sys/types.h for mode_t on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0003-afl-cmin-py-multiprocessing.patch"
    patch_description: "0003 afl-cmin.py fix file_index_type_code None in spawned worker (multiprocessing spawn re-import resets global)"
    patch_type: "portability"
  - patch_file: "patches/0004-afl-cmin-py-module-globals.patch"
    patch_description: "0004 afl-cmin.py init logger + afl_showmap_bin at module level (survive multiprocessing spawn re-import)"
    patch_type: "portability"
  - patch_file: "patches/0005-afl-cmin-py-fork-start-method.patch"
    patch_description: "0005 afl-cmin.py force fork start method (OHOS Python 3.12 defaults to spawn whose worker re-import of the main module fails, deadlocking every multiprocessing.Pool)"
    patch_type: "portability"
