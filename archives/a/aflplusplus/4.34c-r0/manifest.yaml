software: aflplusplus
version: 4.34c-r0
status: built
build_system: makefile
compile_date: 2026-08-24
dependencies:
  required: []
  optional:
    - llvm      # OHOS SDK 自带 LLVM 15.0.4 + llvm-config，用于 afl-cc + 插桩 pass（系统组件，非 Conan 包）
    - python3   # Python 绑定（可选，NO_PYTHON=1 禁用）
    - zlib      # OHOS SDK 系统库，Makefile 自动检测（[+] ZLIB detected）
    - cmocka    # 上游单元测试框架（ohpcd 已有预编译包，仅测试时用，不进 requirements）
patches_applied:
  - 0001-include-forkserver.h.patch           # add <sys/types.h> for uid_t/pid_t/mode_t on OHOS（4.34c 重打版）
  - 0002-include-sharedmem.h.patch            # add <sys/types.h> for mode_t on OHOS（4.34c 重打版）
  - 0003-afl-cmin-py-multiprocessing.patch    # fix file_index_type_code None in spawned worker
  - 0004-afl-cmin-py-module-globals.patch     # init logger + afl_showmap_bin at module level (spawn-safe)
  - 0005-afl-cmin-py-fork-start-method.patch  # force fork start method (OHOS Python 3.12 defaults to spawn, whose worker re-import deadlocks Pool)
build_flags:
  - TEST_MMAP=1  # OHOS 沙箱拦截 SysV shmget(SIGSYS)，强制 mmap 共享内存（-DUSEMMAP=1，需作用于 core tools 与 LLVM runtime 两者）
