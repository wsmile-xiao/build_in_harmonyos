software: aflplusplus
version: 4.33c.1
status: built
build_system: makefile
compile_date: 2026-08-20
dependencies:
  required: []
  optional:
    - llvm      # OHOS SDK 自带 LLVM 15.0.4 + llvm-config，用于 afl-cc + 插桩 pass（系统组件，非 Conan 包）
    - python3   # Python 绑定（可选，NO_PYTHON=1 禁用）
    - zlib      # OHOS SDK 系统库，Makefile 自动检测（[+] ZLIB detected）
    - cmocka    # 上游单元测试框架（conan install --build=missing 源码构建，仅测试时用，不进 requirements）
patches_applied:
  - 0001-include-forkserver.h.patch           # add <sys/types.h> for uid_t/pid_t/mode_t on OHOS
  - 0002-include-sharedmem.h.patch            # add <sys/types.h> for mode_t on OHOS
  - 0003-afl-cmin-py-multiprocessing.patch    # fix file_index_type_code None in spawned worker
  - 0004-afl-cmin-py-module-globals.patch     # init logger + afl_showmap_bin at module level (spawn-safe)
  - 0005-afl-cmin-py-fork-start-method.patch  # force fork start method (OHOS Python 3.12 defaults to spawn, whose worker re-import deadlocks Pool)
  - 0006-test-llvm-grep-portable.patch        # portable grep -Eq (toybox grep lacks GNU --binary-files=text)
  - 0007-test-custom-mutators-cc-env.patch    # compile custom mutators with $CC (OHOS has no cc binary)
build_flags:
  - TEST_MMAP=1  # OHOS 沙箱拦截 SysV shmget(SIGSYS)，强制 mmap 共享内存（-DUSEMMAP=1，需作用于 core tools 与 LLVM runtime 两者）
test_results:
  type: explicit
  total: 14
  passed: 14
  failed: 0
  note: >
    上游测试实际执行（鸿蒙 PC 实机，clang 15.0.4 / OHOS aarch64，2026-08-21 复验；2026-09-24 本地 Conan 全链路复验）：
    - cmocka 单元测试：14/14 通过（unit_maybe_alloc 6 + unit_preallocable 2 +
      unit_list 3 + unit_rand 2 + unit_hash 1）
    - test-basic.sh：全部通过（afl-clang-fast 编译/插桩/运行、afl-fuzz、
      afl-cmin.py、afl-cmin.bash、afl-tmin、afl-showmap）
    - test-llvm.sh：全部通过（llvm_mode、threadsafe、test-dlopen、hardened、
      laf-intel/compcov、floatingpoint、instrumentlist、cmplog、persistent mode）
    - 验证方式：nm 确认 afl-showmap/afl-fuzz/afl-compiler-rt.o 均链接 shm_open
      （USEMMAP 已编入，而非 shmget）；afl-cmin.py 强制 fork 启动方式后
      multiprocessing.Pool 不再死锁。
    - 仅 test-gcc-plugin.sh / test-qemu-mode.sh / test-frida-mode.sh /
      test-nyx-mode.sh / test-unicorn-mode.sh 因依赖缺失（gcc/qemu/frida/
      unicorn/nyx 均 not found）未执行，属"无源码/二进制 fuzz 模式"可选功能。
