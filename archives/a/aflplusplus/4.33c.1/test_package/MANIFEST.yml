# test_package/MANIFEST.yml — aflplusplus/4.33c.1
# 上游官方测试声明文件（CI L0e 强制要求）— 详见 docs/TEST_QUALITY_SPEC.md

package: aflplusplus/4.33c.1
homepage: "https://github.com/AFLplusplus/AFLplusplus"

# 上游测试收集/执行命令
upstream_check_command: "make -f GNUmakefile tests NO_PYTHON=1"

# conanfile.py build() 未集成 make tests：test-all.sh 串联全部模式，
# 其中 gcc-plugin / qemu / frida / nyx / unicorn 五种模式依赖 OHOS 上
# 不存在的工具链，整体运行必然失败 → 属 TEST_QUALITY_SPEC §3.3
# 「平台限制豁免」。可运行子集的逐项清点与实测证据见
# ../notes.md「上游测试清点（R51 申报表）」。
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试实际执行清单（鸿蒙 PC 实机，clang 15.0.4 / OHOS aarch64）
upstream_tests:
  - file: test/test-unittests.sh
    source: AFLplusplus-4.33c/test/test-unittests.sh
    description: "cmocka 单元测试（unit_maybe_alloc/preallocable/list/rand/hash）"
    command: "make -f GNUmakefile unit && test/test-unittests.sh"
    expected: "pass 14/14"
  - file: test/test-basic.sh
    source: AFLplusplus-4.33c/test/test-basic.sh
    description: "afl-clang-fast 编译/插桩、afl-showmap、afl-fuzz、afl-cmin、afl-tmin"
    command: "test/test-basic.sh"
    expected: "pass（全部用例）"
  - file: test/test-llvm.sh
    source: AFLplusplus-4.33c/test/test-llvm.sh
    description: "llvm_mode/threadsafe/dlopen/hardened/laf-intel/floating/cmplog/persistent"
    command: "test/test-llvm.sh"
    expected: "pass（全部用例）"
  - file: test/test-llvm-lto.sh
    source: AFLplusplus-4.33c/test/test-llvm-lto.sh
    description: "LTO 插桩模式"
    command: "test/test-llvm-lto.sh"
    expected: "未执行：OHOS SDK 无 lld，LTO 无法链接（缺依赖，非失败）"
  - file: test/test-gcc-plugin.sh
    source: AFLplusplus-4.33c/test/test-gcc-plugin.sh
    description: "GCC plugin 插桩模式"
    command: "test/test-gcc-plugin.sh"
    expected: "未执行：OHOS 仅 clang 15，无 gcc-plugin-dev（缺依赖，非失败）"
  - file: test/test-qemu-mode.sh
    source: AFLplusplus-4.33c/test/test-qemu-mode.sh
    description: "QEMU 二进制翻译 fuzz 模式"
    command: "test/test-qemu-mode.sh"
    expected: "未执行：OHOS 无 QEMU（缺依赖，非失败）"
  - file: test/test-frida-mode.sh
    source: AFLplusplus-4.33c/test/test-frida-mode.sh
    description: "Frida 动态插桩 fuzz 模式"
    command: "test/test-frida-mode.sh"
    expected: "未执行：OHOS 无 frida dev 包（缺依赖，非失败）"
  - file: test/test-nyx-mode.sh
    source: AFLplusplus-4.33c/test/test-nyx-mode.sh
    description: "NYX 快照虚拟化 fuzz 模式"
    command: "test/test-nyx-mode.sh"
    expected: "未执行：OHOS 内核无 KVM，nyx_mode 无法构建（缺依赖，非失败）"
  - file: test/test-unicorn-mode.sh
    source: AFLplusplus-4.33c/test/test-unicorn-mode.sh
    description: "UniCorn CPU 模拟 fuzz 模式"
    command: "test/test-unicorn-mode.sh"
    expected: "未执行：OHOS 无 unicorn dev 包（缺依赖，非失败）"

# 上游测试用例修改声明（R51 如实申报）：patches 0001-0005 仅改产品代码
# include/forkserver.h、include/sharedmem.h、afl-cmin.py；0006/0007 修改上游
# 测试脚本的可移植性（不削弱任何断言）。
upstream_test_modifications:
  - file: test/test-llvm.sh
    patch: patches/0006-test-llvm-grep-portable.patch
    reason: >-
      grep --binary-files=text 为 GNU 扩展，OHOS toybox grep 不支持（报
      "Unknown option"）导致 laf-intel/compcov 断言误判失败。改为 POSIX 兼容的
      grep -Eq（test.out 是纯文本日志，--binary-files=text 语义为空操作），
      断言正则与判定逻辑不变。
  - file: test/test-custom-mutators.sh
    patch: patches/0007-test-custom-mutators-cc-env.patch
    reason: >-
      两处硬编码 cc 编译自定义 mutator（OHOS 仅有 clang、无 cc 二进制），改为
      ${CC:-cc}（遵循 CC 环境变量、无 CC 时保持上游默认），编译产物与断言不变。

# test_package 自带测试（消费者视角验证，真实调用/执行被测包产物 — R34）
test_package_tests:
  - file: test_afl.c
    description: "消费者代码 #include 打包头文件 config.h/types.h/common.h，断言 VERSION 含 4.33c、u8/u32/u64 尺寸、MAP_SIZE（6 断言）"
    command: "./test_afl"
  - file: test_target.c
    description: "真实 fuzz target（带输入相关稀有分支），被打包的 AFL++ 工具实际驱动"
    command: "target_instr / target_plain"
  - file: conanfile.py
    description: >-
      test() 真实执行打包二进制：afl-gotcpu 退出 0（1 断言）；
      afl-clang-fast 借打包 LLVM pass 插桩消费者源码（1 断言）；
      afl-showmap 对两个输入捕获覆盖图非空且互不相同（3 断言）；
      afl-fuzz dumb 模式限时跑并生成 out/queue（1 断言）。
    command: "afl-gotcpu / afl-clang-fast / afl-showmap / afl-fuzz"

# 测试断言总数（与 conanfile.py test() 末尾 ASSERTIONS: total=<N> 一致）
# 组成：test_afl 6 + afl-gotcpu 1 + afl-clang-fast 1 + afl-showmap 3 + afl-fuzz 1 = 12
assertion_count: 12
