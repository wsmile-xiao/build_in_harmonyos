# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: athena-jot/9.0
homepage: "https://packages.debian.org/source/sid/athena-jot"

# Upstream test command（如实申报：上游无测试套件）
upstream_check_command: "make check"

# Upstream test suite（规则 4 如实申报）：
# 上游 athena-jot 9.0 无测试套件——Makefile.in 的 check: 目标为空（无测试
# 命令）、tarball 无 tests/ 目录、configure.in 无测试配置（已逐项核实）——
# N=0，如实申报。
upstream_tests_total: 0
upstream_tests_passed: 0
upstream_tests_skipped_reason: "上游 athena-jot 9.0 无测试套件（Makefile.in 的 check: 目标为空、tarball 无 tests/，已核实）"

# Upstream tests not run in build (none exist upstream; consumer-side test
# covers real execution of jot)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_jot.sh
    description: "Run jot 3 to verify tool executes (sequence 1 2 3)"

# Test assertion count
assertion_count: 1
