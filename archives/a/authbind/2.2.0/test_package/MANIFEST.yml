# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: authbind/2.2.0
homepage: "https://tracker.debian.org/authbind"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# authbind 2.2.0 纯 Makefile 构建:
#   - Makefile 无 test/check/TESTS 目标 (grep 'test|check|TESTS' 无命中)
#   - 唯一测试入口为 Debian autopkgtest (debian/tests/socat, needs-root +
#     socat + chiark-really), 属 Debian 打包环境, 非上游构建内测试
#   结论: 上游自动化测试规模 0/0 (N/A); Makefile 无 check 目标
upstream_check_command: "make -j1 check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无自动化测试, 空列表 + 冒烟说明)
upstream_tests:
  - file: "debian/tests/socat"
    source: "work/debian/tests/socat"
    description: "Debian autopkgtest: authbind 包装 socat 监听 [::1]:7 回显 token (needs-root, 需 socat+chiark-really, 非本环境直接可运行)"
    command: "autopkgtest -U socat"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test_authbind.sh"
    description: "真实执行打包产物 authbind --help 断言 rc=0 且输出含 usage:; 编译 test_dlopen.c 对打包 libauthbind.so dlopen+dlsym(bind) 断言符号可解析; LD_PRELOAD 加载冒烟"
    command: "bash test_authbind.sh"
  - file: "test_dlopen.c"
    description: "dlopen(libauthbind.so.1.0) + dlsym(bind) 闭包探针 (libc/libdl)"
    command: "clang test_dlopen.c -ldl && ./a.out <libauthbind.so>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
