# authbind 软件级 manifest
# 文件位置: archives/a/authbind/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: authbind
display: "authbind"
description: "Allows non-root programs to bind() to low ports"
category: network
homepage: "https://tracker.debian.org/authbind"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建（无 configure），产物 authbind/helper/libauthbind.so.1.0"
    - "libauthbind.so 为 LD_PRELOAD 拦截库（dlsym(RTLD_NEXT) 拦截 bind()），需系统 libdl"
    - "helper 为 setuid 助手（安装时 chmod u+s），/etc/authbind/{byport,byaddr,byuid} 权限模型"
    - "无第三方依赖，仅系统 libc/libdl（Makefile LIBS=-ldl -lc）"
    - "上游 Makefile 无 test target；唯一 autopkgtest（debian/tests/socat）需 root+socat+chiark-really（Debian 环境）"
    - "OHOS 构建需 CONFIG_SHELL=/data/service/hnp/bin/bash，-j1，clang 注入"
  common_dependencies: []

versions:
  - version: "2.2.0"
    status: built
    build_date: "2026-08-20"
    patches: 0
    notes: "r01 依赖分析（无第三方依赖）→ r02 本地适配闭环；A/B/C 终判路径 A"
    conan_ref: "authbind/2.2.0"
