# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: erkir/2.1.1
homepage: "https://github.com/vahancho/erkir"

# 上游测试命令 (ctest -N / ctest --output-on-failure)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cpp
    source: erkir-2.1.1/test/test.cpp
    description: "上游唯一测试源：自写 verify* 断言框架的单个 unittest 二进制，test/CMakeLists.txt 用 add_test(NAME unittests) 注册为 1 个 ctest 条目；程序自报 \"Total tests: N, passed: P, failed: F\" 并在 F != 0 时退出码 1"
    command: "ctest --output-on-failure -R unittests"

# test_package 中自带的测试 (消费者视角验证, 仅依赖已安装的包)
test_package_tests:
  - file: test_erkir.cpp
    description: "消费者测试：链接安装后的 erkir::erkir 目标，覆盖球面(haversine/rhumb/多边形面积)、椭球(Vincenty 距离/方位角/datum 转换)、ECEF 往返、三维向量与坐标换算共 18 条断言；期望值与上游 test/test.cpp 断言的数值一致(同 0.001 容差)"
    command: "./test_erkir"

# 上游测试总数 N —— 计数单位 = 运行期断言执行数（程序汇总行 "Total tests: 325"）
# 四口径并列，避免混用（R51 / AGENTS §3.5）：
#   ① 测试框架宏数        ：不适用（上游不用 gtest/catch，自带 verify* 断言函数）
#   ② 源码断言调用点      ：106 处（grep: verifyDouble 52 + verifyString 25 + verifyPoint 14
#                          + verifyVector 12 + 三元 isValid 断言 3；其中 verifyVector 内部
#                          再展开 3 次 verifyDouble，且多处断言位于 for 循环内）
#   ③ 框架注册数 (ctest)  ：1（add_test(NAME unittests)）
#   ④ 运行期断言执行数    ：325（设备实测汇总行，0 失败）
upstream_test_total: 325
upstream_test_count_method: "auto"
upstream_test_audit: >-
  清点对象为 v2.1.1 原始 tarball（sha256 b314824c…）：tests 目录仅 test/test.cpp 一个源文件，
  test/CMakeLists.txt 仅 add_test(NAME unittests) 一条注册；源码级断言调用点 106 处（grep 可复算），
  其中循环内调用与 verifyVector 的三次展开使运行期执行数放大到 325。
  方法 auto：以程序自报的运行期断言执行数为 N（4 口径中的最大可执行口径），
  本地实测 `ctest --output-on-failure` 输出 "Total tests: 325, passed: 325, failed: 0"。

test_counting:
  upstream_independent_total: 325
  integration_independent_total: 18
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

# test_package 断言总数（消费者视角，独立于上游 N）
test_case_count: 1
assertion_count: 18
