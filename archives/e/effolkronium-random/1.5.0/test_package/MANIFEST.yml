# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: effolkronium-random/1.5.0
homepage: "https://github.com/effolkronium/random"

# 上游测试命令 (cmake 驱动，ctest 列出 3 个 Catch 单测)
upstream_check_command: "cmake -DRandom_BuildTests=ON .. && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游实际运行的测试程序 (header-only，无库编译；仅测试二进制)
upstream_tests:
  - file: test/random_test.cpp
    source: effolkronium-random-1.5.0/test/random_test.cpp
    description: "Catch 单测（random_static / thread_local / local 三变体，范围与分布断言）"
    command: "./random_static_test"
  - file: test/random_test.cpp
    source: effolkronium-random-1.5.0/test/random_test.cpp
    description: "Catch 单测（thread_local 变体）"
    command: "./random_thread_local_test"
  - file: test/random_test.cpp
    source: effolkronium-random-1.5.0/test/random_test.cpp
    description: "Catch 单测（local 变体）"
    command: "./random_local_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试（调用 get/shuffle/engine API 并断言取值范围）"
    command: "./test_effolkronium_random"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 300
