software: ekhtml
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/ekhtml/ekhtml/0.3.2/ekhtml-0.3.2.tar.gz"

  # 源码校验和
  sha256: "1ed1f0166cd56552253cd67abcfa51728ff6b88f39bab742dbf894b2974dc8d6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-testsuite-test_basic.sh.patch"
  - "0004-testsuite-test_bogus_feedsize.sh.patch"
  - "0005-testsuite-test_crazypage.sh.patch"
  - "0006-configure-umask-fix.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "旧版 config.guess(2001) 不支持 HarmonyOS，需从 automake-1.16 复制现代版本"
  - "configure 中 umask 077 创建 0700 目录在鸿蒙 HMDFS 上无法写入，需移除 umask 077"
  - "测试脚本 #!/bin/bash 在鸿蒙不存在，需改为 #!/data/service/hnp/bin/bash"
  - "pyparser.py 使用 Python 2 语法，Python 3 不兼容，导致 test_basic.sh 失败（非 C 库问题）"
  - "Conan Autotools out-of-source 构建导致 -I../include 相对路径失效，需用 in-source build"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/ekhtml-0.3.2.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/ekhtml-0.3.2.work
  source_orig_hash: 7b6b279e8c96f2a5
  source_work_hash: 9f3af6ac561de908
  generated_at: '2026-06-29T21:37:49'
  patches_count: 6

patch_classification:
  - file: 0001-config.guess.patch
    type: platform
    platform_only: True
    guard: 'always'
    description: "替换 2001 年旧版 config.guess 为 automake-1.16 现代版本，支持 HarmonyOS/aarch64 平台检测"
  - file: 0002-config.sub.patch
    type: platform
    platform_only: True
    guard: 'always'
    description: "替换 2001 年旧版 config.sub 为 automake-1.16 现代版本，支持 aarch64-unknown-linux-ohos 三元组"
  - file: 0003-testsuite-test_basic.sh.patch
    type: platform
    platform_only: True
    guard: 'always'
    description: "修复测试脚本 shebang: #!/bin/bash → #!/data/service/hnp/bin/bash（鸿蒙无 /bin/bash）"
  - file: 0004-testsuite-test_bogus_feedsize.sh.patch
    type: platform
    platform_only: True
    guard: 'always'
    description: "同上，修复 shebang"
  - file: 0005-testsuite-test_crazypage.sh.patch
    type: platform
    platform_only: True
    guard: 'always'
    description: "同上，修复 shebang"
  - file: 0006-configure-umask-fix.patch
    type: platform
    platform_only: True
    guard: 'always'
    description: "移除 configure 中 umask 077，修复鸿蒙 HMDFS 上 0700 目录无法写入问题"
