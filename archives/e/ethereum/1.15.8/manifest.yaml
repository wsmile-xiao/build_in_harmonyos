software: ethereum
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.15.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.15.8"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/go/pkg/mod/cache/download/github.com/ethereum/go-ethereum/@v/v1.15.8.zip"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统: go (Go语言项目)
  system: go
  build_system: go

  # Go编译选项
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "-ldflags=-s -w"

  # 编译依赖
  dependencies:
    - "go/1.26.4"

  # 编译器
  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
