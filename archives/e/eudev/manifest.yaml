software: eudev
# 软件级 manifest
# 文件位置: archives/e/eudev/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件基本信息
# ============================================================

# 软件描述
description: "eudev is a standalone version of systemd's device manager udev"

# 官方仓库
homepage: https://github.com/eudev-project/eudev

# 许可证
license: GPL-2.0+

# 软件类型
# system_tool | library | application | development_tool
category: system_tool

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "3.2.14"
    status: built
    build_date: "2026-05-26"
    patches_count: 16
    quality: PASS

# 当前推荐版本
recommended_version: "3.2.14"

# ============================================================
# 平台适配摘要
# ============================================================

platform_adaptations:
  - category: platform_detection
    description: "HarmonyOS system recognition"
    patches: 2

  - category: musl_compat
    description: "musl libc compatibility (program_invocation_short_name, get_current_dir_name)"
    patches: 10

  - category: header_conflict
    description: "sockaddr_storage definition conflict resolution"
    patches: 3

  - category: rules
    description: "udev rules files adaptation"
    patches: 1

# ============================================================
# 依赖关系
# ============================================================

# 编译依赖（无外部依赖）
build_dependencies: []

# 运行时依赖
runtime_dependencies:
  - musl-libc
  - linux-kernel (uevent support)

# ============================================================
# 使用限制
# ============================================================

limitations:
  - "udevd requires root privileges"
  - "Device identification tools require actual hardware"
  - "Test suite (udev-test.pl) not included in tarball"

# ============================================================
# 知识沉淀索引
# ============================================================

knowledge_entries:
  - id: "musl-program_invocation_short_name"
    description: "musl libc missing glibc-specific program_invocation_short_name variable"
    files: 15

  - id: "musl-get_current_dir_name"
    description: "musl libc missing glibc-specific get_current_dir_name function"
    files: 1

  - id: "sockaddr_storage-conflict"
    description: "sockaddr_storage redefinition between linux/socket.h and sys/socket.h"
    files: 3