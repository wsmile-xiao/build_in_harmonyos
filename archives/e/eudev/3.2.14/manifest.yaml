# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "musl libc 缺少 glibc 特有变量 program_invocation_short_name，需用宏定义替代"
  - "musl libc 缺少 glibc 特有函数 get_current_dir_name()，需提供替代实现"
  - "sockaddr_storage 在 linux/socket.h 和 sys/socket.h 中重复定义，需用 __OHOS__ 宏守卫包裹 linux/netlink.h"
  - "config.status 的 umask 077 在 HMDFS 上会导致临时文件权限问题"
  - "eudev 测试套件 udev-test.pl 未包含在 tarball 中，无法执行 make check"
  - "★ gperf 是 eudev 的硬构建依赖：configure 的 AC_PATH_TOOL(GPERF, gperf) 缺失即 AC_MSG_ERROR；其输入 keyboard-keys-from-name.gperf 由 Makefile 规则在构建期用 AWK 从 keyboard-keys.txt 生成、再由 gperf 生成 keyboard-keys-from-name.h（列入 BUILT_SOURCES）——无法从 tarball 绕过（官方 tarball 既不含 .gperf 也不含 .h）。ohpcd 尚无 gperf 包（main 仅有 3.1 的笔记、无 conanfile），本配方依赖构建环境 PATH 中存在 gperf"
  - "★ GitHub 三种 tarball 不可混用：release 资产 / codeload git-archive / api tarball 的内容、大小与 sha256 各不相同（本包分别为 2188254 / 2323748 / 2323865 字节）——写 conandata 前必须核对所取源与官方声明的大小/校验和一致"

# ============================================================
# 测试信息
# ============================================================

test_status: passed

test_note: "test_package 真实执行 4 项校验：① 定位 udevadm（bin/ 或 sbin/）；② udevadm --version 成功退出且输出 udev 协议版本 251 —— 该 251 是 udev 协议版本（对应 systemd 251），不是包版本 3.2.14，按包版本断言会误判为失败；③ udevadm --help 成功退出且输出用法（证明工具真能运行，而非仅 --version 短路）；④ 校验 libudev.so 已安装（apt 的 find_package(Udev) 需要它）。L0c 真实测试源文件 test_eudev.sh，运行需 env=conanrun（动态链接可执行文件需 LD_LIBRARY_PATH）。上游测试：eudev 的 udev-test.pl 未包含在官方 tarball 中，故无法执行 make check（上游 tarball 的实际情形，非本适配跳过）。"

