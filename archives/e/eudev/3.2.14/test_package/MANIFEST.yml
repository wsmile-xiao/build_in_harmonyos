# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: eudev/3.2.14

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_check_command: "make check（上游 TESTS = udev-test.pl rules-test.sh）"
upstream_test_command: "python3 test/rule-syntax-check.py rules/*.rules"

upstream_tests:
  - file: test/rule-syntax-check.py
    description: >-
      上游 TESTS 之一 rules-test.sh 的实际校验体（rule-syntax-check.py）：
      遍历 rules/*.rules，逐 **子句(clause)** 匹配 udev 规则语法
      （no_args_tests / args_tests / no_args_assign / args_assign 四个正则）。
      **已实测可跑、零特权**（2026-09-16）：27 个 rules 文件 / 357 条有效规则行 /
      **1010 个子句**，退出码 0 且无输出（= 全部合规）。
      脚本 shebang 为 #!/usr/bin/python、含一处 py2 专属语句
      （print >> sys.stderr），但实测 py3 可正常解析并执行，故无需改上游，
      配方中显式以 python3 调用。
    command: "python3 test/rule-syntax-check.py rules/*.rules"

# 上游测试说明（2026-09-16 实测口径）
# 上游 test/Makefile.am: TESTS = udev-test.pl rules-test.sh —— 两者**都在 tarball 里**
# （test/udev-test.pl 66993 B；此前 notes 误写为"未包含在 tarball 中"，已订正）。
#
# 只跑了一半，原因经实测而非推断：
#   ✅ rules-test.sh → rule-syntax-check.py：纯文本语法校验，无特权，实测 exit 0
#   ❌ udev-test.pl：它驱动 test-udev，后者 fake_filesystems() 用
#      mount(..., MS_BIND) 构造假 sysfs 树；该 syscall 在 OHOS 构建沙箱被禁用，
#      实测进程被 **SIGSYS（信号 31）** 杀死。其期望值还含 root:mail:0660 这类
#      需真机特权的属主断言。故如实申报不可跑，未用 skip 掩盖。
upstream_test_note: >-
  TESTS 两项均在 tarball 中。rules-test.sh（规则语法检查）已纳入 build() 实跑；
  udev-test.pl 不可跑——其 mount(MS_BIND) 构造假 sysfs 的路径在本沙箱被禁
  （实测 SIGSYS 信号 31），非"脚本缺失"、非权限位问题。

test_package_tests:
  - file: test_eudev.sh
    description: >-
      真实执行 4 项校验（R34 反空壳）：① 定位 udevadm（bin/ 或 sbin/）；
      ② `udevadm --version` 成功退出且输出 udev **协议版本 251**
      —— 注意这是 udev 协议版本（对应 systemd 251），**不是**包版本 3.2.14，
      按包版本断言会误判；③ `udevadm --help` 成功退出且输出用法
      （证明工具真能运行，而非仅 --version 短路）；
      ④ libudev.so 已安装（apt 的 find_package(Udev) 需要它）。
    command: "sh test_eudev.sh <pkg_dir>"

# 测试断言总数（近似值，用于质量评估）
# = 上游实跑的执行计数（rule-syntax-check.py 逐子句校验 1010 个 clause）
# + test_package 断言（4）
assertion_count: 1014
