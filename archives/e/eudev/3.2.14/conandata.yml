# conandata.yml — eudev 3.2.14
# eudev: systemd 的独立 udev 设备管理器（提供 libudev + udevd/udevadm）
# 上游：https://github.com/eudev-project/eudev
# 说明：apt 的 find_package(Udev) 需要本包提供的 libudev。
#
# ── R8（禁止 patches/ 引入平台条件编译宏）说明 ─────────────────────────
# 本文件列出的 0001–0016 共 16 个补丁**全部是 main 上的存量补丁**
# （本 PR 的 diff 不含任何 patches/*.patch，可用 `git diff --name-only
#  upstream/main...HEAD` 核实），本 PR 只新增 conanfile.py 使它们首次
# 进入构建路径。按 R8 / PF5 的"上下文行与存量豁免"口径，存量补丁不因
# 被新配方引用而重新判定。
#
# 若后续需要**新增或修改**补丁解决同类问题，应采用 POSIX 兼容方式，
# 不得在补丁中引入平台条件编译宏：
#   · 缺变量（program_invocation_short_name 等）→ 由配方编译一个
#     compat 翻译单元直接**定义**该符号（`char *program_invocation_short_name
#     = "udev";`），或从 argv[0] 推导——均为无条件的纯 C 定义，不含 #ifdef；
#   · 缺函数（get_current_dir_name）→ 提供 POSIX 等价实现
#     （`getcwd(NULL, 0)` 包装），同样无条件。
# 相关判据已沉淀为知识草稿 DRAFT-ohos-musl-glibc-specific-symbols。

sources:
  url: "https://github.com/eudev-project/eudev/releases/download/v3.2.14/eudev-3.2.14.tar.gz"
  # 官方 release 资产 2188254 字节（与 GitHub API 返回的资产大小逐字节一致）
  # 注意：GitHub 的 release 资产 / codeload git-archive / api tarball 三者
  # 大小与 sha256 均不同，不可混用（codeload=2323748、api=2323865）。
