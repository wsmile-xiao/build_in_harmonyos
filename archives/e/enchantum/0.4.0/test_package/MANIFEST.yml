# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: enchantum/0.4.0
homepage: "https://github.com/ZXShady/enchantum"

# 上游测试命令 (ctest -N 枚举, 见 reports/test-ledger.md)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (C++17 规范配置)
upstream_tests:
  - file: tests/enchantum.cpp
    source: enchantum-0.4.0/tests/enchantum.cpp
    description: "主 API 测试 (to_string/cast/entries 等)"
    command: "./tests"
  - file: tests/bitflags.cpp
    source: enchantum-0.4.0/tests/bitflags.cpp
    description: "位标志语义测试"
    command: "./tests"
  - file: tests/scoped.cpp
    source: enchantum-0.4.0/tests/scoped.cpp
    description: "scoped 枚举测试"
    command: "./tests"
  - file: tests/config_test/config.cpp
    source: enchantum-0.4.0/tests/config_test/config.cpp
    description: "自定义配置头测试 (tests_config 目标)"
    command: "./tests_config"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: to_string/cast/values_generator/enum_to_index"
    command: "./test_enchantum"

# 测试断言总数 (上游 362 个 CTest 用例全部通过的汇总口径)
assertion_count: 362