software: enchantum
display: "Enchantum"
description: "Fast macro-free enum reflection C++ library (compile-time enum values, names and bitflags, no macros or boilerplate)"
category: dev
homepage: "https://github.com/ZXShady/enchantum"
license: MIT
build_system: cmake

# HarmonyOS 适配要点
ohos_adaptation:
  key_points:
    - "Header-only C++17 库（CMake INTERFACE），无编译产物、无第三方运行时依赖"
    - "配方 package_type=header-library，cpp_info.libs 为空，package_id clear"
    - "OHOS SDK clang15 的 <format> 头为占位实现：std::format 不可用，C++17 规范配置下运行上游测试"
    - "上游测试依赖 Catch2 (FetchContent)，CI 需经镜像或本地 overlay 注入"
  common_dependencies: []

# 版本索引
versions:
  "0.4.0":
    status: published
    build_date: "2026-09-03"