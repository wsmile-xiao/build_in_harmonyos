version: "0.8.1"
software: "ext2fuse"
status: built
build_date: "2026-09-12"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/ext2fuse/ext2fuse/0.8.1/ext2fuse-src-0.8.1.tar.gz"
  sha256: "431035797b2783216ec74b6aad5c721b4bffb75d2174967266ee49f0a3466cd9"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - "libfuse/3.18.2"
  build_dependencies:
    - "autoconf/2.72"
    - "automake/1.18"
    - "pkgconf/3.0.5"
  cc: clang
  cxx: clang++
  jobs: 1

patches_applied:
  - "0001-configure-fuse3.patch"
  - "0002-src-fuse3-api.patch"
  - "0003-ohos-ssize-t.patch"
  - "0004-ohos-use-lseek.patch"
  - "0005-ohos-sys-types.patch"
  - "0006-fuse3-session-direntry.patch"

commands:
  - "archives/e/ext2fuse/commands.json declares the ext2fuse CLI entry (R38)"

knowledge_gained:
  - "上游自带 lib/ext2fs 和 lib/et 静态实现，不需要把 e2fsprogs 作为 ext2fuse 的运行时依赖。"
  - "旧代码使用 FUSE_USE_VERSION=25、fuse_mount 和 fuse_kern_chan_new；适配 libfuse 3.x 后改为 FUSE_USE_VERSION=31 与 fuse_session_mount。"
  - "FUSE3 的低层 rename 回调新增 flags；ext2fuse 未实现交换/不覆盖语义，收到非零 flags 时返回 EOPNOTSUPP。"
  - "上游 tests/pjd-fstest-20080412 实际盘点为 12 类、184 个 .t 文件；顶层 make check 未注册该 vendored suite，必须按 README 的 fstest + prove + 真实挂载点流程单独执行。"
  - "真机已完成源码解包、184 文件复盘、32 MiB ext2 镜像创建和 OHOS Clang fallback 编译 fstest；官方 make 因硬编码 gcc 返回 2，prove/perl 未安装，mount 返回 bad /etc/fstab，/dev/fuse 读写均 Permission denied。"
  - "旧版 ext2fs 的 extern inline 辅助函数在 OHOS Clang 下会与 inline.c 产生 duplicate symbol；统一追加 -DNO_INLINE_FUNCS 后恢复唯一外部实现。"
  - "平台兼容补丁使用 HAVE_SYS_TYPES_H、HAVE_LINUX_FD_H 和标准 POSIX 头文件能力判断，不在补丁中写入 __OHOS__ 平台宏。"
  - "HMDFS 上的 Autotools 构建需要 build-local TMPDIR、native shell、umask 022、生成文件时间戳固定和 make -j1，避免脚本执行、临时目录和 jobserver 限制。"
  - "Conan patch_ng 必须使用与 recipe 相同的源码快照和补丁顺序验证；git apply 或 toybox patch 单独通过不足以证明 Shadow CI 可用。"

