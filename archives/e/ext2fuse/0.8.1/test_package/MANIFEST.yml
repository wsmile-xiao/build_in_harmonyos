# Upstream and consumer test declaration for ext2fuse 0.8.1.
package: ext2fuse/0.8.1
homepage: "https://sourceforge.net/projects/ext2fuse/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "cd tests/pjd-fstest-20080412 && make && cd <ext2-mount-root> && prove -r /path/to/pjd-fstest-20080412"
upstream_test_reason: "顶层 make check 没有注册该 vendored suite；上游 README 要求先编译 fstest，再以 root 在真实文件系统挂载点下运行 prove。"

# 保留未执行的原始证据摘要，避免把环境阻塞误报为测试失败或通过。
upstream_unrunnable_evidence:
  - command: "make"
    result: "blocked: 上游 Makefile 硬编码 gcc，设备返回 gcc: Permission denied；改用 OHOS Clang wrapper 编译 fstest 已通过。"
  - command: "winget install --id StrawberryPerl.StrawberryPerl --source winget --silent"
    result: "local blocked: Windows 安装器下载阶段返回 0x80072efd，Strawberry Perl 未安装；随后使用 Git for Windows Perl，并在仓库外临时目录准备 Test-Harness 3.52。"
  - command: "aarch64-unknown-linux-ohos-clang -Wall fstest.c -o fstest-ohos-aarch64"
    result: "local pass: OHOS AArch64 ELF 交叉编译返回 0，生成 28384 字节；仅证明目标辅助程序可编译，Windows 主机不能执行该 ELF。"
  - command: "prove --dry -r tests/pjd-fstest-20080412/tests"
    result: "local pass: 使用 Test-Harness 3.52 的官方 prove 入口返回 0；dry-run 只证明运行器可启动和解析目录，不计入上游测试通过。"
  - command: "prove -v tests/pjd-fstest-20080412/tests/mkdir/00.t"
    result: "local fail: 36 个断言中 5 通过、31 失败；脚本引用的 ../../fstest 在 Windows 主机不存在，目标 OHOS ELF 不能直接运行。"
  - command: "prove -v tests/pjd-fstest-20080412/tests/open/00.t"
    result: "local fail: 47 个断言中 9 通过、38 失败；同样由 Windows 主机缺少可执行 fstest 导致。"
  - command: "prove -r tests/pjd-fstest-20080412/tests (timeout 120s)"
    result: "local blocked: 实际启动 41 个测试文件后超时返回 124；日志持续出现 ../../fstest: No such file or directory，宿主机结果不计入 OHOS 目标统计。"
  - command: "command -v prove perl"
    result: "blocked: 设备未安装 prove/perl，无法运行上游 TAP 递归测试器。"
  - command: "mount -t ext2 -o loop <image> <mountpoint>"
    result: "blocked: 设备 mount 返回 mount: bad /etc/fstab: No such file or directory。"
  - command: "dd if=/dev/fuse of=/dev/null bs=1 count=0; dd if=/dev/null of=/dev/fuse bs=1 count=0"
    result: "blocked: /dev/fuse 读写均为 Permission denied。"

# 消费者测试只验证 Conan 安装产物和 OHOS CLI 契约，不替代真实挂载和 pjd-fstest。
covered_by_consumer_test:
  - upstream_scope: "tests/pjd-fstest-20080412/tests/**/*.t"
    consumer_assertions: []
    status: "not_equivalent"
    reason: "消费者测试不覆盖 pjd-fstest 语义；本轮 184 个上游脚本已在真机普通 HMDFS 目录直跑并记录 111 通过、73 失败，真实 ext2/FUSE 挂载闭环仍需 prove/perl、挂载点和 /dev/fuse 权限。"
  - upstream_scope: "Conan 安装产物与 OHOS CLI 参数契约"
    consumer_assertions:
      - "安装的 bin/ext2fuse 可执行"
      - "--version 输出 0.8.1 且返回退出码 9"
      - "--help 输出用法且返回退出码 9"
      - "无参数输出用法并返回非零"
    status: "covered"
    reason: "由 test_ext2fuse.sh 在 OHOS armv8 Shadow CI 中执行，4/4 断言通过。"

