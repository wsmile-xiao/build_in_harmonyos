sources:
  url: "https://downloads.sourceforge.net/project/ext2fuse/ext2fuse/0.8.1/ext2fuse-src-0.8.1.tar.gz"
  sha256: "431035797b2783216ec74b6aad5c721b4bffb75d2174967266ee49f0a3466cd9"

patches:
  - patch_file: "patches/0001-configure-fuse3.patch"
    patch_description: "Use the fuse3 pkg-config module and Conan-provided FUSE flags"
    patch_type: "portability"
  - patch_file: "patches/0002-src-fuse3-api.patch"
    patch_description: "Port the low-level mount/session code and callbacks to libfuse 3.x"
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-ssize-t.patch"
    patch_description: "Use the configured sys/types.h capability for ssize_t"
    patch_type: "portability"
  - patch_file: "patches/0004-ohos-use-lseek.patch"
    patch_description: "Select the Linux llseek path only when configured and not disabled by the portable fallback"
    patch_type: "portability"
  - patch_file: "patches/0005-ohos-sys-types.patch"
    patch_description: "Make the public ext2fs header provide its POSIX type dependency"
    patch_type: "portability"
  - patch_file: "patches/0006-fuse3-session-direntry.patch"
    patch_description: "Use the libfuse 3 session and directory entry APIs"
    patch_type: "portability"
