software: envchain
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sorah/envchain/archive/refs/tags/v1.1.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # envchain 使用纯 Makefile，无 configure 脚本
  # 编译时使用: make LDFLAGS="-Wl,-rpath,$PREFIX/lib -Wl,--enable-new-dtags"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - readline/8.2
    - libsecret/0.21.7
    - glib/2.88.0
    - pcre2/10.40

  # 编译器
  cc: clang
  cxx: clang++

  # RPATH 设置方式
  rpath_method: "LDFLAGS 编译时指定 + patchelf 相对路径修正"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Makefile DESTDIR 非标准路径 $(DESTDIR)/./bin 需改为 $(DESTDIR)$(PREFIX)/bin"
  - "纯 Makefile 项目需添加 PREFIX 变量支持标准 DESTDIR 模式"
  - "pkg-config 子 shell 问题需在 Makefile 中 export PKG_CONFIG_PATH"
  - "RPATH 使用 $ORIGIN/../lib 相对路径确保预编译包可移植"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/envchain-1.1.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/envchain-1.1.0.work
  source_orig_hash: b536f0cab788db0b
  source_work_hash: 3d22646761083b28
  generated_at: '2026-06-05T19:43:15'
  patches_count: 1

patch_classification:
  - file: 0001-Makefile.patch
    type: auto
    platform_only: True
    guard: 'pending'
