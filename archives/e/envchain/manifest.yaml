software: envchain
# 软件级 manifest（版本索引）
# 文件位置: archives/e/envchain/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件信息
# ============================================================

name: envchain
description: "从 D-Bus Secret Service 安全存储和检索环境变量的命令行工具"
category: security
license: MIT

# ============================================================
# 上游信息
# ============================================================

upstream:
  repo: https://github.com/sorah/envchain
  author: sorah
  homepage: https://github.com/sorah/envchain

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "1.1.0"
    status: built
    build_date: "2026-06-05"
    archive_dir: "1.1.0"
    notes: "首次编译，修复 Makefile DESTDIR 问题，设置 RPATH"

# ============================================================
# 依赖关系
# ============================================================

dependencies:
  runtime:
    - readline
    - libsecret
    - glib
    - pcre2
  build:
    - pkg-config
    - clang

# ============================================================
# 使用说明
# ============================================================

usage:
  - "envchain --set NAMESPACE ENV_VAR1 ENV_VAR2"
  - "envchain --list"
  - "envchain NAMESPACE command [args...]"

# ============================================================
# 注意事项
# ============================================================

notes:
  - "需要 D-Bus Secret Service 后端（GNOME Keyring 或 KeePassXC）"
  - "不支持 --version/--help 选项，无参数运行显示版本"
  - "RPATH 使用 $ORIGIN/../lib 相对路径"
