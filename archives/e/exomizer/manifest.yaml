software: exomizer
display: "exomizer"
description: "File compressor optimized for decompression in 8-bit environments (6502/Z80/6809)"
category: tool
homepage: "https://bitbucket.org/magli143/exomizer/"
license: "Zlib AND GPL-3.0-or-later"
build_system: make

ohos_adaptation:
  key_points:
    - "纯 ANSI-C 控制台工具,无外部库依赖 (W0 依赖预检通过)"
    - "Makefile 含 bison/flex 规则,但源码自带预生成 asm.tab.c/lex.yy.c 且时间戳更新,构建无需 bison/flex"
    - "LDFLAGS -s 由 clang/lld 接受;src/ 内构建 exomizer + exobasic"
    - "上游 Makefile.test 16 个 roundtrip 用例可真机执行"
  common_dependencies: []
  status: in_progress

versions:
  "3.1.2":
    recipes:
      - "archives/e/exomizer/3.1.2"
    commands:
      - exomizer
      - exobasic
