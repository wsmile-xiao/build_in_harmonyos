# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 门禁要求)
#
# exomizer 3.1.2 上游自带测试集: src/Makefile.test
#   make -f Makefile.test test = 16 个 roundtrip 用例
#   (test_raw/test_rawb/test_rawr/test_rawbr/test_mem/test_memf/test_level/
#    test_levelf 及各自 -E 变体; 每例: exomizer 压缩 → 解压 → cmp 原文件)
#   纯 C、仅依赖 exomizer 二进制,可在 OHOS 真机执行。

package: exomizer/3.1.2
homepage: "https://bitbucket.org/magli143/exomizer/"

upstream_tests:
  framework: make
  note: "Makefile.test 16 个 roundtrip 用例(raw/mem/level × b/r/E 变体),真机执行结果以 notes.md 为准"

local_tests:
  - path: test_exomizer.c
    type: c_consumer
    description: "编译消费者并真实执行 exomizer 二进制(raw 压缩→解压→字节比对),R34 非空壳"
