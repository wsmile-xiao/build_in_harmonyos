# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# ee 3.2.2 为无构建系统、无测试框架的 STM32 单文件嵌入式库：
# 官方包 6 个文件（ee.c/ee.h/NimaLTD.I-CUBE-EE_conf.h/README/LICENSE/.github），
# 无 tests/、无 make check、无 ctest、无 pytest 入口（完整枚举见
# reports/upstream-test-ledger.md）。故 upstream_check_command 为空，
# upstream_tests 为空列表，以上游专项测试与 test_package 消费者测试承担门禁。

package: ee/3.2.2
homepage: "https://github.com/nimaltd/ee"

# 上游测试命令（官方包无任何测试/构建系统入口）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（官方包无，列表为空）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实调用 EE_* API）
test_package_tests:
  - file: test.c
    description: "EE_Init/EE_Capacity/EE_Read/EE_Write/EE_Format 全 API 消费者验证"
    command: "./test_ee"

# 测试断言总数（test.c 内 7 组断言）
assertion_count: 7