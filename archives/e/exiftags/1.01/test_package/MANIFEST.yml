# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: exiftags/1.01
homepage: "https://johnst.org/sw/exiftags/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# exiftags 上游 Makefile 没有 check 目标，无自动化测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 实质调用被测包的二进制
test_package_tests:
  - file: test.sh
    description: "调用 exiftags/exifcom/exiftime 三个二进制验证其功能"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
