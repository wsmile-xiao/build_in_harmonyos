# test_package/MANIFEST.yml
# 上游官方测试声明文件
#
# 依据: docs/ADAPTATION_GUIDE.md §6 模板
#
# 本文件的所有数字均来自下列可复现证据, 未做任何估算:
#   evidence/conan-create-ohos-aarch64-run.log  — 完整 conan create 日志
#   evidence/ctest-summary.txt                  — CTest 汇总行
#   evidence/consumer-e2e-output.txt            — 消费者端到端用例完整输出

package: evmc/12.1.0
homepage: "https://github.com/ipsilon/evmc"

# 上游测试入口: 纯 CMake 工程, 测试由 CTest 驱动
upstream_check_command: "ctest"

# conanfile.py 的 build() 方法中已集成并真实执行上游测试套件
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure -j1"
# 接入说明:
#   上游 EVMC_TESTING=ON 会注册完整 CTest 套件, 但其中 vmtester 与 examples
#   会在运行期 dlopen() 一个 VM 共享库, 因此"交叉编译成功"不等于"测试通过",
#   必须在目标架构上真正执行。配方在 build() 末尾直接调用 ctest
#   (而非 cmake.test(), 因为后者会把参数转发给 `cmake --build`, 其中的正则
#   竖线会被 /bin/sh 当管道吃掉), 经 ohos-aarch64-run profile 配置的
#   CMAKE_CROSSCOMPILING_EMULATOR (qemu-aarch64-static + OHOS musl run root)
#   执行。若未配置模拟器则 raise ConanException 拒绝静默通过
#   (仅 EVMC_ALLOW_UNTESTED=1 显式选择才降级为警告)。

# 上游实际运行的测试套件
# 上游 test/ 目录结构 (test/CMakeLists.txt 汇总):
#   unittests/     — GTest 单元测试, 真实断言 EVMC C/C++ API
#   vmtester/      — evmc-vmtester 驱动的 VM 一致性测试 (运行期 dlopen)
#   evmc-tool/     — CLI 工具 evmc 的黑盒命令行用例
#   cmake_packge/  — 消费者视角 find_package(evmc) 的 configure/build 用例
#   examples/      — 上游自带示例 (静态链接 + 动态加载两条链路)
#   compilation/   — 头文件独立性编译检查 (上游未注册进 CTest)
#   gomod/         — Go 绑定测试 (上游未注册进 CTest, 且需 Go 工具链)
upstream_tests:
  - name: "unittests (GTest)"
    type: "ctest"
    description: "上游 GTest 单元测试, 覆盖 EVMC C ABI 与 C++ 包装 (evmc::address/bytes32/Result/VM)、loader、instructions、mocked_host、filter_iterator、tooling、example_vm。已接入构建并真实执行: EVMC_TESTING=ON + ctest。"
    command: "ctest -R '^evmc/unittests/'"
    ran: true
    status: "已接入, 115/115 通过"
  - name: "vmtester"
    type: "ctest"
    description: "evmc-vmtester 对 VM 实现的一致性测试。运行期 dlopen() VM 共享库并真实执行 EVM 字节码, 必须能跑才能通过 (无法靠编译通过蒙混)。含 nonexistingvm 用例, 断言 dlerror() 文本。"
    command: "ctest -R '^evmc/vmtester/'"
    ran: true
    status: "已接入, 9/9 通过 (patches/0002 放宽 dlerror 正则以接受 musl 措辞 'No such file')"
  - name: "evmc-tool"
    type: "ctest"
    description: "CLI 工具 evmc 的黑盒命令行用例 (版本输出、hex 解析、输入/代码文件读取、VM 选项回退等)。"
    command: "ctest -R '^evmc/evmc-tool/'"
    ran: true
    status: "已接入, 14/14 通过"
  - name: "cmake_packge"
    type: "ctest"
    description: "消费者视角的 find_package(evmc CONFIG) 用例: configure/install 以及 use_evmc、use_instructions 两个下游工程的实际 configure + build。"
    command: "ctest -R '^evmc/cmake_packge/'"
    ran: true
    status: "已接入, 6/6 通过"
  - name: "examples"
    type: "ctest"
    description: "上游自带示例: example-static (静态链接 VM) 与 example-dynamic-load (运行期 dlopen 加载 VM 共享库)。"
    command: "ctest -R '^evmc/examples/'"
    ran: true
    status: "已接入, 2/2 通过"
  - name: "compilation"
    type: "ctest"
    description: "上游 test/compilation/ 的头文件独立编译检查 (compilation_test.c / compilation_test.cxx)。上游 test/CMakeLists.txt 未将其注册为 CTest 用例, 故不产生用例数; 其编译动作由构建阶段覆盖。"
    command: ""
    ran: false
    status: "未注册进 CTest (上游行为, 非本次裁剪)"
  - name: "gomod"
    type: "ctest"
    description: "上游 test/gomod/ 的 Go 绑定测试 (use_evmc_test.go)。上游未注册进 CTest, 且需要 Go 工具链, OHOS 交叉构建环境不提供。"
    command: ""
    ran: false
    status: "未注册进 CTest 且需 Go 工具链 (上游行为, 非本次裁剪)"

test_package_tests:
  - file: evmc_consumer_case.cpp
    description: "鸿蒙消费者端到端用例: 用打包的 evmc::mocked_host 建 host 并注入账户; 用打包的 evmc::loader (evmc_load_and_configure) 从磁盘 dlopen 真实 libexample-vm.so 并交给 evmc::VM 托管; 经 evmc::VM::execute() 执行真实 EVM 字节码 (PUSH1 0x2a PUSH1 0x00 MSTORE PUSH1 0x20 PUSH1 0x00 RETURN); 校验返回状态、gas 消耗、32 字节输出内容; 再用 evmc::instructions 校验 SHANGHAI 指令名/gas 表; 最后对同一 VM 实例复跑 SSTORE(0,1) 验证实例可复用且回调真的写进 host 存储。"
    command: "./evmc_consumer_case ./upstream_example_vm/libexample-vm.so"
    ran: true
    status: "16/16 通过 (CONSUMER_VERDICT PASS)"

# 测试断言总数
#   上游 CTest: 146 个注册用例, 实测执行 146, 通过 146 (100%), 失败 0
#               = 115 unittests + 9 vmtester + 14 evmc-tool + 6 cmake_packge + 2 examples
#   test_package: 16 个检查 (consumer-e2e-output.txt 中 [ok] 行数)
# 两类断言都真实执行过 (经 qemu + OHOS musl run root), 非仅编译。
assertion_count: 162
