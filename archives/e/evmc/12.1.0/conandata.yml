patches:
  "12.1.0":
    - patch_file: "patches/0001-cmake-decouple-tools-and-support-no-hunter.patch"
      patch_description: "Always include+call HunterGate() so HUNTER_ENABLED=OFF activates Hunter's disabled mode (empty hunter_add_package(), no network) and GTest/CLI11 resolve via find_package() from Conan's CMakeDeps packages; and declare EVMC_TOOLS/EVMC_EXAMPLES as plain options, because cmake_dependent_option resolves them to <force>=ON whenever EVMC_TESTING=ON, forcing them on and re-enabling Hunter's bootstrap"
      patch_type: "portability"
    - patch_file: "patches/0002-test-accept-musl-dlerror-wording.patch"
      patch_description: "Accept musl's dlerror() capitalisation ('No such file') in the evmc/vmtester/nonexistingvm expected regex; functional behaviour and exit codes unchanged"
      patch_type: "portability"
