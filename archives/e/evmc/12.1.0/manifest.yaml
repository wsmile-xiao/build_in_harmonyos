software: evmc
version: "12.1.0"
status: built
build_date: "2026-10-04"
build_system: cmake

source:
  url: "https://github.com/ipsilon/evmc/archive/refs/tags/v12.1.0.tar.gz"
  sha256: "0d5458015bf38a5358fad04cc290d21ec40122d1eb6420e0b33ae25546984bcd"
  tar_format: tar.gz

build:
  system: cmake
  cmake_options:
    - "HUNTER_ENABLED=OFF"
    - "EVMC_TESTING=ON"
    - "EVMC_TOOLS=ON"
    - "EVMC_EXAMPLES=ON"
    - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON"
  dependencies:
    - "gtest/1.17.0"
    - "cli11/2.7.2"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-decouple-tools-and-support-no-hunter.patch"
  - "0002-test-accept-musl-dlerror-wording.patch"

test_result:
  upstream_suite: ctest
  upstream_registered: 146
  upstream_executed: 146
  upstream_passed: 146
  upstream_failed: 0
  upstream_pass_rate: "146/146 (100%)"
  target_suite: test_package/evmc_consumer_case
  target_checks: 16
  target_passed: 16
  target_failed: 0
  target_verdict: PASS
  executor: "qemu-aarch64-static + /root/ohpc/sdk/ohos-runroot (ohos-aarch64-run profile)"

knowledge_gained:
  - "Hunter 是联网 bootstrap 的包管理器，交叉编译下必须保留 HunterGate() 调用并置 HUNTER_ENABLED=OFF 走 disabled 模式，hunter_add_package() 才会退化为 no-op 并让 find_package() 从 Conan 解析 GTest/CLI11"
  - "上游用 option() 声明的开关（EVMC_TESTING/EVMC_TOOLS/EVMC_EXAMPLES）必须用 Conan 的 tc.cache_variables 注入；tc.variables 生成普通 set()，会被 option() 丢弃并回落到默认值，静默关掉整个测试套件"
  - "上游 cmake_dependent_option(EVMC_TOOLS ... EVMC_TESTING OFF) 在 EVMC_TESTING=ON 时会强制把 EVMC_TOOLS 置 ON，而 test/vmtester 依赖 tools/ 下的 evmc::evmc-vmtester 目标，二者不一致会导致测试目录 FATAL_ERROR 无法 configure"
  - "musl 的 dlerror() 返回 'No such file'（glibc 为 'No such file or directory'），断言 dlerror 文本的上游用例需放宽正则"
  - "evmc 的 lib/tooling 是四个 add_library 中唯一没设 OUTPUT_NAME 的，装出来是 libtooling.a；Conan package_info 里写 evmc-tooling 会让 CMakeDeps 在消费者 configure 阶段报 Library not found"
  - "evmc 的 example-vm 共享库不在 install() 规则内，消费者要跑 dlopen 链路只能自行从同版本上游源码构建"
  - "Conan test_package 的 source_folder == recipe_folder，用 get(strip_root=True) 解压到该目录会把上游顶层 CMakeLists.txt 放到消费者 CMakeLists.txt 旁边，CMake 会转而 configure 上游工程"

conan_recipe:
  status: built
  dependencies_available: complete
