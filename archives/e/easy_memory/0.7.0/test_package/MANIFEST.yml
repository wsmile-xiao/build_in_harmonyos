# test_package/MANIFEST.yml
# 上游官方测试声明文件
# easy_memory 0.7.0 — header-only C 库, 上游测试以 Makefile `make tests` 运行

package: easy_memory/0.7.0
homepage: "https://github.com/EasyMem/easy_memory"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (7 个测试源文件, make tests 运行全部)
upstream_tests:
  - file: bump_alloc_test.c
    source: easy_memory-0.7.0/tests/bump_alloc_test.c
    description: "Bump allocator creation/trim/scratch 生命周期与边界测试"
    command: "./tests/bump_alloc_test_silent"
  - file: em_nested_test.c
    source: easy_memory-0.7.0/tests/em_nested_test.c
    description: "Nested arena 创建/释放/尾部空间回收测试"
    command: "./tests/em_nested_test_silent"
  - file: same_size_test.c
    source: easy_memory-0.7.0/tests/same_size_test.c
    description: "同尺寸块分配模式测试"
    command: "./tests/same_size_test_silent"
  - file: slab_alloc_test.c
    source: easy_memory-0.7.0/tests/slab_alloc_test.c
    description: "Slab 生命周期与分块分配测试"
    command: "./tests/slab_alloc_test_silent"
  - file: stack_alloc_test.c
    source: easy_memory-0.7.0/tests/stack_alloc_test.c
    description: "Stack allocator 生命周期测试"
    command: "./tests/stack_alloc_test_silent"
  - file: stress_test.c
    source: easy_memory-0.7.0/tests/stress_test.c
    description: "复杂分配模式压力测试"
    command: "./tests/stress_test_silent"
  - file: validation_test.c
    source: easy_memory-0.7.0/tests/validation_test.c
    description: "核心完整性/LLRB/分配器校验测试"
    command: "./tests/validation_test_silent"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: em_create/em_alloc/em_alloc_aligned/em_free/em_destroy"
    command: "./test_easy_memory"

# 测试断言总数 (近似值, 用于质量评估; 上游 make tests 实际 173/173 通过)
assertion_count: 173