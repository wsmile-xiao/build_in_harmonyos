# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点结论（R51 三步法）：
# 官方 v1.0 tag 源码仅含 EnumBitmask.hpp / README.md / LICENSE / example.cpp / EnumBitmask.png。
# 无 tests/ 目录、无 CMake/Make/Autotools/Meson 构建系统、无 CTest/Make check/GTest
# 注册，example.cpp 是单文件演示源码（非测试框架用例，不计入独立上游用例，
# 计入台账分类为“样例”）。因此上游独立测试用例声明总数 = 0。

package: enumbitmask/1.0
homepage: "https://github.com/Reputeless/EnumBitmask"

# 上游测试命令（无构建系统，无 make check / ctest -N）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试（header-only 无编译步骤，R34）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（官方 tag 无任何测试注册，example.cpp 为演示源码）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 + 鸿蒙专项)
test_package_tests:
  - file: test.cpp
    description: "消费者用例：仅通过公开头文件 <EnumBitmask.hpp> 与公开宏 DEFINE_BITMASK_OPERATORS，以业务上层组件（文件打开模式/权限位）方式编译、链接并实际运行位掩码运算，验证公开 API 可用"
    command: "./test_enumbitmask"
  - file: test_ohos.cpp
    description: "鸿蒙专项测试：覆盖 uint8/uint16/uint64 底层类型宽度、constexpr 编译期求值、复合赋值/异或翻转/高位掩码，实际编译并在 OHOS 环境运行"
    command: "./test_ohos_enumbitmask"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
