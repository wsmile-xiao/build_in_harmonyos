  - "EnumBitmask 1.0 为纯 header-only C++17 单头库（74 行 EnumBitmask.hpp，CC0-1.0），无构建系统、无测试框架；指令控 derby 误判为 autotools 生成错误配方，应按 headeronly 模板重写 conanfile.py 且不定义 build 编译步骤（R34 不得伪造编译日志）"
