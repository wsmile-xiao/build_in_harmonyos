# test_package/MANIFEST.yml — CI L0e 强制要求

package: es-shell/0.9.2
homepage: "https://github.com/wryun/es-shell"

# 上游测试: make test (trip.es 回归, 探针脚本已在本机验证通过 exit 0)
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - file: trip.es
    source: es-shell-0.9.2/trip.es
    description: "上游 trip 回归测试（管道式 `./es < trip.es`），本机实测通过"
    command: "make test"

test_package_tests:
  - file: test.sh
    description: "es-shell CLI 冒烟：实际执行 es 二进制（基本命令/算术/version 原语）"
    command: "bash test.sh"

assertion_count: 3
