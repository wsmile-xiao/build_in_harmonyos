knowledge_gained:
  - "etsh mkconfig 用 uname -s 探测系统，HarmonyOS 落入 unknown 分支导致 _XOPEN_SOURCE/_DEFAULT_SOURCE 未定义，musl libc 隐藏 sigaction/sigset_t/setenv 等"
  - "修复：在 mkconfig case 语句中将 HarmonyOS 加入 Linux 分支（Linux|HarmonyOS）"
  - "OHOS 无 /usr/bin/install，需传 INSTALL=/system/bin/install (toybox)"
  - "make clean 会删除 config.h + mkconfig.tmp，构建顺序须为 clean → configure → make"
  - "make check 在 aarch64 OHOS 兼容主机上通过 14 Test(s) Passed"

