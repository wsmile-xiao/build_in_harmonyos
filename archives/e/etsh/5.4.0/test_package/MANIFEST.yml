# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: etsh/5.4.0
homepage: "https://etsh.dev/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# make check 执行编译出的 OHOS 二进制 (etsh/tsh)，在 Linux host 上无法运行
# 但在本机构 (aarch64 OHOS 兼容) 上 make check 通过 14 Test(s) Passed
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
# etsh 5.4.0 ships a tests/ directory with shell-based test scripts.
# `make check` runs `cd tests && ../etsh run etsh tsh` which exercises
# 14 test cases covering shell parsing, pipelines, variables, etc.
upstream_tests:
  - file: tests/run
    source: etsh-5.4.0/tests/run
    description: "Main test harness runner script"
    command: "cd tests && ../etsh run etsh tsh"
  - file: tests/etsh.tests
    source: etsh-5.4.0/tests/etsh.tests
    description: "etsh test definitions"
    command: "./etsh run etsh"
  - file: tests/tsh.tests
    source: etsh-5.4.0/tests/tsh.tests
    description: "tsh test definitions"
    command: "./etsh run tsh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: etsh -c 'echo test', PID substitution, pipeline"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
