# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS filesystem restricts mktemp -d with umask 077; patch configure to use mkdir -p with TMPDIR"
  - "OHOS platform requires patched config.guess (add __OHOS__ libc detection) and config.sub (add ohos-linux/ohos* support)"
  - "HMDFS does not support FIFO (make jobserver mkfifo); must use make -j1"
  - "HMDFS /tmp file creation via shell redirect fails; use $TMPDIR (~/tmp/) instead"

knowledge_refs:
  - E002
  - E007

