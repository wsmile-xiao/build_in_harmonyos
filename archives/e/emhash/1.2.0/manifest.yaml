# emhash 1.2.0 — 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2.0"
software: "emhash"
status: published
build_date: "2026-09-22"
build_system: "cmake"

source:
  url: "https://github.com/ktprime/emhash"
  sha256: "dead6c7f83233eb0d1531353642728eba379a5bfbb2031dc01a11a923027c923"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_TESTS=OFF"
    - "-DWITH_BENCHMARKS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "emhash 1.2.0 (ktprime/emhash) 为 header-only C++17 库，官方 CMake 默认 WITH_EXAMPLES=ON 但 release tarball 按 .gitattributes export-ignore 不含 docs/examples/ 与 tests/，直接 cmake 配置必失败；配方必须 -DWITH_EXAMPLES=OFF -DWITH_TESTS=OFF -DWITH_BENCHMARKS=OFF"
  - "emilib 头文件在 aarch64/OHOS 上 include <sse2neon.h>（SSE2→NEON 转译），但官方 CMake install 明确 EXCLUDE sse2neon.h；header-only conan 配方必须单独拷贝 sse2neon.h 进 include/，否则消费者在 aarch64 编译失败"
  - "上游 tag v1.2.0 的 include/emhash/version.hpp 与 VERSION 文件仍自报 1.1.0（上游 tag 未同步 in-tree 版本号）；消费者测试不能硬断言 1.2.0，需按实际宏值如实记录"
  - "OHOS SDK (ohos-sdk_26.0.0.18) libcxx-ohos 头文件集缺 <memory_resource>/pmr，使用 std::pmr 的上游测试用例（test_allocator.cpp）无法编译，属平台限制；其余 doctest 用例正常构建运行"
  - "conan get() 下载 codeload GitHub tarball 时 URL 无扩展名会误判格式（BadZipFile），需显式 filename='emhash-1.2.0.tar.gz'"
