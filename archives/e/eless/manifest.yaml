# 软件级 manifest
# 文件位置: archives/e/eless/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: eless

# 显示名
display: "eless"

# 一句话描述
description: "用 Emacs 在 view-mode 下做分页器，替代 less/diff/man 的纯 bash 脚本工具"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://github.com/kaushalmodi/eless"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "纯 bash 脚本工具，无需 C/C++ 编译"
    - "build() 为空，package() 直接 copy 脚本到 bin/"
    - "package_type=application, settings 只需 os+arch"
    - "运行时依赖 emacs（打包时不需要）"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.7":
    status: built
    build_date: 2026-08-14
