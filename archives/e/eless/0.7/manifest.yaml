# 版本级 manifest
# 文件位置: archives/e/eless/0.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.7"

# 软件名
software: "eless"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-14"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/kaushalmodi/eless/archive/v0.7.tar.gz"

  # 源码校验和
  sha256: "de7a7891a20a5e7f25c0b5df812edaea87ab0d3336d41821a24e2d248aaf4abc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器 — N/A for pure bash script
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "eless 是纯 bash 脚本工具，无需 C/C++ 编译，build() 为空，package() 直接 copy 脚本到 bin/"
  - "Conan 配方 package_type=application, settings 只需 os+arch, cpp_info.bindirs=['bin'], 无 libs"
  - "上游 Makefile install 目标需要 emacs 重新 tangle，但发行版 tarball 已含生成好的脚本"
