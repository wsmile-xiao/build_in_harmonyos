# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: eless/0.7
homepage: "https://github.com/kaushalmodi/eless"

# 上游测试命令 (eless has no make check; test via test/run_tests.sh which needs emacs)
upstream_check_command: "bash test/run_tests.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (requires emacs runtime, not applicable for packaging test)
upstream_tests:
  - file: test/run_tests.sh
    source: eless-0.7/test/run_tests.sh
    description: "eless functional tests (requires emacs runtime)"
    command: "bash test/run_tests.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify eless -V prints version"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
