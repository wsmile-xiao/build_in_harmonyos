# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: eathread/0.0.0-f3c6c54
homepage: "https://github.com/electronicarts/EAThread"

# 上游测试命令 (EAThread 为 CMake 库，测试在 EATHREAD_BUILD_TESTS=ON 下构建)
upstream_check_command: "cmake .. -DEATHREAD_BUILD_TESTS=ON && cmake --build . && ./test/EAThreadTest && ./test/EAThreadInterprocessTest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（R03 双口径修订：21 源文件 / 19 AddTest 注册）
upstream_tests:
  - file: test/thread/source/TestThread.cpp
    source: EAThread-f3c6c54d19699639a5edcf5237ea8b71aca6842c/test/thread/source/TestThread.cpp
    description: "EAThread 单元测试注册表：18 个 AddTest 套件（Atomic/Barrier/Callstack/Condition/EnumerateThreads/Futex/Misc/Mutex/RWMutex/RWSemaphore/RWSpinLock/Semaphore/SmartPtr/SpinLock/Storage/Sync/Thread/ThreadPool），EAThreadTest 18/18 PASSED"
    command: "./test/EAThreadTest"
  - file: test/interprocess_test/source/TestThreadInterprocess.cpp
    source: EAThread-f3c6c54d19699639a5edcf5237ea8b71aca6842c/test/interprocess_test/source/TestThreadInterprocess.cpp
    description: "EAThread Interprocess 测试（自带 EAMain，L141 AddTest(\"RWMutex\", TestThreadRWMutex)）；R03 以最小补丁纳入独立 target EAThreadInterprocessTest，RWMutex 1/1 PASSED"
    command: "./test/EAThreadInterprocessTest"
  - file: test/interprocess_test/source/TestThreadInterprocessRWMutex.cpp
    source: EAThread-f3c6c54d19699639a5edcf5237ea8b71aca6842c/test/interprocess_test/source/TestThreadInterprocessRWMutex.cpp
    description: "定义 TestThreadRWMutex()（L186），为 EAThreadInterprocessTest 的注册用例组成源文件"
    command: "./test/EAThreadInterprocessTest"
  - file: test/dllsafety/source/TestDllSafety.cpp
    source: EAThread-f3c6c54d19699639a5edcf5237ea8b71aca6842c/test/dllsafety/source/TestDllSafety.cpp
    description: "DLL 加载专项（LoadLibrary/GetProcAddress，Windows 语义），无 AddTest 注册；上游无 DLL 构建目标与 CMakeLists，未实例化（非注册用例，不计入 19 AddTest 口径）"
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_eathread.cpp
  - file: test_eathread_ohos.cpp
