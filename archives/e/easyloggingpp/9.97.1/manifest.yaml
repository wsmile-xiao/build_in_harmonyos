software: easyloggingpp
# 版本级 manifest — easyloggingpp 9.97.1
# 遵循 ARCHIVE-SPEC v2.0

version: "9.97.1"
status: built
build_system: cmake
build_date: "2026-09-02"

source:
  url: "https://github.com/abumq/easyloggingpp/archive/refs/tags/v9.97.1.tar.gz"
  sha256: "ebe473e17b13f1d1f16d0009689576625796947a711e14aec29530f39560c7c2"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-Dbuild_static_lib=ON"
    - "-DCMAKE_CXX_STANDARD=14"
    - "-DCMAKE_CXX_STANDARD_REQUIRED=ON"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "easyloggingpp 自 issue #445 起为单头+单一源文件模式，必须链接 easylogging++.cc；ELPP_IMPLEMENTATION 宏不存在"
  - "OHOS 工具链 clang 15 需 compiler.libcxx=libc++，libstdc++11 会报 invalid library name"
  - "上游 cmake_minimum_required(2.8.7) 与 CMake 4.x 不兼容，须注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（cache_variables）"
  - "OHOS /tmp 只读（E002）：日志文件必须写入可写路径；日志配置需显式 ToFile=true 且 std::remove 须在 reconfigureLogger 之前"
