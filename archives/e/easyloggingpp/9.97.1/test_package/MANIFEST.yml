# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: easyloggingpp/9.97.1
homepage: "https://github.com/abumq/easyloggingpp"

# 上游测试入口: CMake option(test) 构建 gtest 单元测试 (test/main.cc 聚合 24 个 -test.h)
upstream_check_command: "cmake -Dtest=ON && ctest -N"

# conanfile.py build() 无构建步骤 (header-only)，上游测试单独运行
upstream_test_in_build: false

# 上游实际运行的测试: 79 个 gtest 独立用例 (26 个 suite)，本机实测 79/79 通过
upstream_tests:
  - file: test/main.cc
    source: easyloggingpp-9.97.1/test/main.cc
    description: "gtest 入口，聚合 24 个测试头 (79 个独立 TEST 用例，26 个 suite)"
    command: "./easyloggingpp-unit-tests -v"
  - file: test/write-all-test.h
    source: easyloggingpp-9.97.1/test/write-all-test.h
    description: "WriteAllTest 11 用例 (Entry + 6 级别 TEST_LEVEL 宏展开 + VERBOSE/EVERY_N/AFTER_N/N_TIMES)"
    command: "./easyloggingpp-test -v"
  - file: test/string-utils-test.h
    source: easyloggingpp-9.97.1/test/string-utils-test.h
    description: "StringUtilsTest 11 用例"
    command: "./easyloggingpp-test -v"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 日志级别/LOG_IF/LOG_EVERY_N 写入文件并断言内容"
    command: "./test_easyloggingpp"

# 测试断言总数 (实测, rule 4)
# 上游 gtest 独立用例 79 个 (26 suite)，实测 79/79 通过 (100%)
assertion_count: 79