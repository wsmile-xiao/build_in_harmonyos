software: easyloggingpp
display: "Easylogging++ logging library"
description: "C++ 单头高效日志库，支持级别过滤、条件/频次日志、多 logger、性能跟踪与自定义格式"
category: foundation
homepage: "https://github.com/abumq/easyloggingpp"
license: "MIT"
build_system: cmake

ohos_adaptation:
  key_points:
    - "单头 + 单一源文件模式（issue #445 起需链接 src/easylogging++.cc）"
    - "启用 build_static_lib=ON 构建静态库 libeasyloggingpp.a 供消费者链接"
    - "OHOS 下 CMake 不识别平台，注入 CMAKE_SYSTEM_NAME=Linux（E092）"
    - "OHOS /tmp 只读（E002）：日志文件须写入可写路径"
    - "OHOS 工具链 libcxx=libc++（非 libstdc++）"
    - "上游 cmake_minimum_required(2.8.7) 与 CMake 4.x 不兼容，注入 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  common_dependencies: []

versions:
  "9.97.1":
    status: built
    build_date: "2026-09-02"
    source_url: "https://github.com/abumq/easyloggingpp/archive/refs/tags/v9.97.1.tar.gz"
