knowledge_gained:
  - "Upstream publishes no release tags; master HEAD b1f19fab4aebe607805620d25a5e42566ce46a0e is the fixed commit"
  - "The library is pure C99 with zero third-party dependencies; SHA-512 and field/group/scalar arithmetic are all in-tree (src/ = 10 .c + 7 .h)"
  - "Upstream ships NO build system; the readme integration model is 'add all .c and .h files in the src/ folder to your project' — packaged as a thin static library instead"
  - "Private key handed to ed25519_sign/key_exchange is the 64-byte buffer produced by ed25519_create_keypair (expanded seed || public key), not the 32-byte seed"
  - "Upstream driver test.c always exits 0; correctness must be asserted on stdout output, not on the exit code"
  - "Windows prebuilt DLLs (ed25519_32.dll/ed25519_64.dll) ship in the tarball root and are excluded from packaging"
