# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: eamain/0.0.0-24ca8bf
homepage: "https://github.com/electronicarts/EAMain"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/source/Main/Main.cpp
    source: eamain-0.0.0-24ca8bf/test/source/Main/Main.cpp
    description: "EAMainTestRuns — EAMainTest -testargpassing（命令行解析/报告/init-fini 82 处宏断言）"
    command: "./test/EAMainTest -testargpassing"
  - file: test/source/Crash/Main.cpp
    source: eamain-0.0.0-24ca8bf/test/source/Crash/Main.cpp
    description: "崩溃演示入口（上游故意崩溃验证，非注册测试项）"
    command: ""
  - file: test/source/NoMain/Main.cpp
    source: eamain-0.0.0-24ca8bf/test/source/NoMain/Main.cpp
    description: "无 main 场景演示入口（非注册测试项）"
    command: ""
  - file: test/source/WinRT/Main.cpp
    source: eamain-0.0.0-24ca8bf/test/source/WinRT/Main.cpp
    description: "WinRT 平台专用入口（OHOS 不适用）"
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试 — 通过已安装公开头文件/库调用 EAMain CommandLine/Report/PlatformStartup"
    command: "./test_eamain"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
