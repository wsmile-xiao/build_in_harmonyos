software: embedded-log
display: "embedded-log"
description: "小巧漂亮的嵌入式日志库（彩色输出，支持串口/屏幕/FLASH/USB 输出，纯 C 实现）"
category: library
homepage: "https://github.com/to9/embedded-log"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "上游零构建系统（仅 src/log.c + log.h + log_cfg.h），配方用 package_type=static-library 直接 clang 编译 + llvm-ar 打包"
    - "conf 子键 tools.build:compiler_executables:<key> 在 OHOS 适配版 Conan 2.29.1 未注册，try/except 回退 PATH clang/llvm-ar（R33 合规）"
    - "LOG_ENABLE 由上游 log_cfg.h 默认开启；log.h 相对包含 log_cfg.h，头文件平铺安装到同一 include 目录"
    - "上游无独立测试用例（tests/、tools/ 仅空占位文件）；消费者用例 + 鸿蒙专项用例均由自编 test_package 提供"
  common_dependencies: []

versions:
  "1.0.1":
    status: published
    build_date: "2026-09-23"