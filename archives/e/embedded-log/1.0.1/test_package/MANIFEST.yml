# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）

package: embedded-log/1.0.1
homepage: "https://github.com/to9/embedded-log"

# 上游官方测试声明
# 枚举证据：官方 v1.0.1 源码仅含 src/log.c、src/log.h、src/log_cfg.h 与
# tests/readme.txt、tools/readme.txt 两个空占位说明文件；无 Makefile/CMake/
# 测试框架、无 TEST_CASE/ctest/pytest 注册项。上游未提供可独立运行的测试。
upstream_official_tests:
  - file: tests/readme.txt
    source: embedded-log-1.0.1/tests/readme.txt
    description: "空占位文件（0 字节说明），无测试内容，非独立上游用例"
    command: "（无测试命令——上游未提供测试入口）"
  - file: tools/readme.txt
    source: embedded-log-1.0.1/tools/readme.txt
    description: "空占位文件（0 字节说明），无测试内容，非独立上游用例"
    command: "（无测试命令——上游未提供测试入口）"

upstream_check_command: "（上游无 make check / ctest / pytest 入口）"
upstream_test_in_build: false
upstream_test_command: ""

# test_package 中自带的测试 (消费者视角验证, R34: 必须实质调用被测包 API)
test_package_tests:
  - file: test.c
    origin: ohos-adaptation (self-authored consumer test)
    description: "消费者测试：调用 log_init() 注册用户 hook 与缓冲区，经 LOG_INF 宏驱动 printk() 实际格式化并通过 hook 回调输出；断言 hook 恰好被调用 1 次且接收到的格式化负载包含 'hello-from-consumer 42'"
    command: "./test_embedded-log（经 test() 执行，断言退出码）"

# 测试断言总数 (test.c 中的断言点)
assertion_count: 2
