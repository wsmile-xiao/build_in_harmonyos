# test_package/MANIFEST.yml
# 上游官方测试声明文件
# esekeyd 1.2.7 上游**无任何自动化测试**：源码归档中不存在 tests/ 目录、
# Makefile 无 test/check 目标（automake check 目标为空实现）、无
# ctest/pytest 注册。README 仅提供配置示例。故上游可运行测试数 = 0，
# 本 test_package 采用消费者视角的确定性断言验证已安装二进制。

package: esekeyd/1.2.7
homepage: "https://github.com/burghardt/esekeyd"

# 上游测试命令探测结果
upstream_check_command: "make check（目标存在但为 automake 空实现，无任何测试程序）"

# conanfile.py build() 中未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试源文件
upstream_tests: []

# test_package 自带测试（消费者视角，调用已安装二进制）
test_package_tests:
  - file: test.sh
    description: >-
      消费者测试 — 覆盖 esekeyd 用法/缺配置/坏设备三条错误路径、
      keytest 版本横幅、keytest 对合成二进制 input_event 记录的
      parse() 键名映射（KEY_A 按下 + KEY_ENTER 退出）、
      learnkeys 用法提示与 /dev/null 设备下配置骨架写出
    command: "bash test.sh"

# test_package 断言总数（见 test.sh：3+2+2+3+2+2 = 14）
assertion_count: 14
