# conandata.yml — esekeyd 1.2.7
# 官方发布渠道为 SourceForge；此处采用 Debian/Ubuntu pool 的 orig tarball
# （与上游 1.2.7 发布包同源，内容完整：configure/Makefile.in 齐备、
# 含预生成的 src/parser.c，无单独 testsuite）。SHA-256 已本机核验。
# URL 以 .tar.gz 结尾，Conan 选用 gzip 解压器（规避无扩展名 codeload
# URL 的 BadZipFile 误选，见知识条目 E392）。

sources:
  url: "http://archive.ubuntu.com/ubuntu/pool/universe/e/esekeyd/esekeyd_1.2.7.orig.tar.gz"
  sha256: "58bdac994be805d9c11b21065427c8f53684d38a1b44bb02b175fc4ee594cc56"

patches:
  - patch_file: "patches/0001-makefile-vpath-and-no-parser-regen.patch"
    patch_description: >-
      删除 src/Makefile.am(.in) 中 "parser.c: mkparser /usr/include/linux/input.h"
      生成规则（tarball 已带预生成 parser.c；规则依赖构建机 /usr/include 且
      时间戳敏感，现代内核头总比 2010 年 tarball 新而触发用 host 工具重建），
      并把自定义 mkparser 规则的 $(mkparser_SOURCES) 改为 $<，
      使 VPATH（out-of-source）构建下编译器能定位源文件。
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-hmdfs.patch"
    patch_description: >-
      configure 内嵌的 config.status 主体用 "umask 077 && mktemp -d ./confXXXXXX"
      创建临时目录（E011/E052）：HMDFS 上 700 临时目录内的写入/改名全部
      Permission denied，config.status 生成 Makefile/config.h 失败。把两处
      umask 077 放宽为 000（rsyslog 8.2404.0 补丁 0001 同法，libestr/
      libfastjson CI 判例）。
    patch_type: "portability"
