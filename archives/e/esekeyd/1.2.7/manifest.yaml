# 版本级 manifest
# 文件位置: archives/e/esekeyd/1.2.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2.7"
software: esekeyd
status: built
build_date: "2026-09-29"
build_system: autotools
conan_ref: "esekeyd/1.2.7"
status_notes: >-
  真机 shadow CI（r5）通过：conan create 成功、test_package 14/14 断言 PASS、
  L0/L1/L4/L5 pass、L1e 破坏性反向验证确认、exit code 0。L2=skip（non-blocking）：
  上游 CLI 无 --version/--help 长选项（E503 同族，rotix r1 同判例）。
  r1-r4 迭代：PATH 缺 /data/service/hnp/bin（环境）、HMDFS 无执行位（E087，
  CONFIG_SHELL 显式调用）、build_folder 定位、config.status umask 077 临时目录
  （E011/E052，补丁 0002 umask 000）。详见 notes.md。

source:
  url: "http://archive.ubuntu.com/ubuntu/pool/universe/e/esekeyd/esekeyd_1.2.7.orig.tar.gz"
  sha256: "58bdac994be805d9c11b21065427c8f53684d38a1b44bb02b175fc4ee594cc56"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--sbindir=${pkg}/bin"  # 上游把 esekeyd 装 sbin，统一收进 bin
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-makefile-vpath-and-no-parser-regen.patch"
  - "0002-configure-umask-hmdfs.patch"

knowledge_gained:
  - 'esekeyd 的 parser.c 由 host 工具 mkparser 扫描构建机 /usr/include/linux/input.h 生成；tarball 已含预生成结果，Makefile 规则时间戳敏感（现代内核头总更新）且依赖构建机头文件，交叉/容器环境应直接移除该规则。'
  - 'automake 自定义规则用 $(SOURCES) 作编译输入在 VPATH 下失败（编译器不解析 VPATH），需改用 $<。'
  - 'configure.ac 无 AC_CANONICAL_HOST → 不触发 config.guess/sub 的 HarmonyOS 识别问题（E007 不适用），老 autotools 包在 OHOS 上更省事。'

validation:
  local_windows:
    sha256_check: passed
    patch_apply_check: passed
    python_syntax: passed
    shell_syntax: passed
    ohos_cross_compile: passed
    method: >-
      DevEco OHOS SDK (openharmony/native) clang，--target=aarch64-linux-ohos
      --sysroot=<sdk>/sysroot；手写最小 config.h 后 esekeyd.c/input.c/
      parser.c/keytest.c/learnkeys.c/mkparser.c 全部编译通过，三个程序
      链接为 AArch64 ELF，readelf NEEDED 仅 libc.so。
    conan_create: not_run
    reason: "本机（Windows）未安装 Conan，无 OHOS 运行时。"
  ohos:
    conan_create: passed
    method: >-
      真机 shadow CI（r5，2026-09-29）：隔离 job + 全局锁排队（wait_seconds=1），
      ci/conan/build_and_test.sh 全流程。conan create 成功（bash ./configure
      规避 E087 无执行位、补丁 0002 umask 000 规避 E011/E052 config.status
      临时目录、make -j1 三程序编译链接、DESTDIR 打包 bin/+man+examples）。
    gates: "L0=pass L1=pass(incl L1e genuine) L2=skip(non-blocking) L4=pass L5=pass"
    test_package: "14/14 assertions PASS"
    exit_code: 0

issue: "TBD"  # 任务下发未提供 issue 编号，仓库内亦无 esekeyd 相关记录，待补
