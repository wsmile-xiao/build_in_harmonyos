# 软件级 manifest
# 文件位置: archives/e/esekeyd/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: esekeyd
display: "esekeyd"
description: "ESE Key Daemon：多媒体键盘守护进程，监听 /dev/input 事件设备并执行配置的命令；附带 keytest/learnkeys 辅助工具"
category: utility
homepage: "https://github.com/burghardt/esekeyd"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - >-
      Makefile 的 parser.c 生成规则依赖构建机 /usr/include/linux/input.h 且
      时间戳敏感；tarball 已带预生成 parser.c，补丁 0001 直接移除该规则。
    - >-
      自定义 mkparser 规则以 $(mkparser_SOURCES) 作编译输入，VPATH 构建下
      编译器找不到源文件；补丁改为 $<（GNU make 自动变量会解析 VPATH）。
    - >-
      configure.ac 无 AC_CANONICAL_HOST，不涉及 config.guess/config.sub 的
      HarmonyOS 识别（E007 不适用）；仅依赖 musl libc 与 sysroot 自带的
      linux/input.h 内核 UAPI 头。
  common_dependencies: []

versions:
  "1.2.7":
    status: built
    build_date: "2026-09-29"
    path: archives/e/esekeyd/1.2.7
