# test_ohos/MANIFEST.yml — error-detection 2.1.1 HarmonyOS PC 专项验证
# 五项独立鸿蒙检查（run_ohos_test.py，任一失败非零退出）：
#   T1_aarch64_elf    ELF64 AArch64（readelf -h）
#   T2_musl_no_glibc  musl libc, 无 GLIBC 符号版本, 无 ld-linux
#   T3_codesign       .codesign 段存在（OHOS 签名管线）
#   T4_no_host_paths  无宿主绝对路径 / 无 RPATH-RUNPATH
#   T5_real_crc       真实校验计算：checkSum8/16/32 + CRC-8/16/32 标准校验向量（链最终静态库）
checks:
  - id: T1_aarch64_elf
    desc: ELF64 AArch64 (readelf -h)
  - id: T2_musl_no_glibc
    desc: musl libc, no GLIBC symbol versions, no ld-linux
  - id: T3_codesign
    desc: .codesign section present (OHOS signing pipeline)
  - id: T4_no_host_paths
    desc: no absolute host paths, no RPATH/RUNPATH
  - id: T5_real_crc
    desc: real checksum/CRC computation with standard check vectors, linked against final static lib
assertion_count: 11
assertion_count_note: 4 machine checks + 7 in-program assertions (T5: checkSum8/16/32 + CRC8/16/32 + PASS marker)
test_language: c
test_framework: bare
framework_flavor: bare
