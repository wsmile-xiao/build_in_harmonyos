# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: error-detection/2.1.1
homepage: "https://github.com/aKaReZa75/Error_Detection"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游仓库不提供任何测试套件/测试源文件（仅 Sources/err.c + err.h 与文档），
# 因此无上游测试命令可声明。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 无 — 上游未提供测试源、样例或 fixture。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 API 测试：checkSum8/16/32_Calc + CRC8/CRC16/CRC32_Calc 标准测试向量"
    command: "./test_error_detection"
    coverage: "覆盖全部 6 个公开 API：'123456789' 标准 CRC 校验值（CRC-8/MAXIM=0xA1、CRC-16/CCITT-FALSE=0x29B1、CRC-32/IEEE=0xCBF43926）与累加校验和"

# 测试断言总数
assertion_count: 6

# 测试统计
upstream_test_summary:
  total: 0  # 上游无独立测试用例
  run_count: 0
  passed: 0
  failed: 0
  skipped: 0
  coverage_percent: 0.0

notes: |
  error-detection 是纯 C 的错误检测库（8/16/32 位校验和 + 可配置 CRC-8/16/32），
  上游仅提供 Sources/err.c 与 err.h 两个源文件，无构建系统、无测试套件。
  本适配注入 CMakeLists.txt 构建静态库，并以 0001 补丁将 err.h 对上游外部
  aKaReZa.h 框架头文件的依赖替换为 stdint/stdbool + 所需的位操作宏。
  test_package 以 '123456789' 标准 CRC 校验向量覆盖全部 6 个公开 API。
