# conandata.yml — error-detection 2.1.1
# Source: official upstream aKaReZa75/Error_Detection (GitHub).
# Upstream publishes no tags and no release assets; source is pinned to the
# official main HEAD commit df775354e86caedf4b0a40e88a6332887238feda via the
# GitHub codeload archive endpoint (official HTTPS source host).

sources:
  url: "https://codeload.github.com/aKaReZa75/Error_Detection/tar.gz/df775354e86caedf4b0a40e88a6332887238feda"
  # codeload URL 末段为 commit hash 无扩展名；显式指定 filename 让 conan 按
  # tar.gz 解压（与 collections-c 2.3.3 先例一致）。
  filename: "error-detection-2.1.1.tar.gz"
  sha256: "e673163a38a0bdf139e66e55484ea96ee1ff50bf3fc37c272cde3179a261923b"

patches:
  - patch_file: "patches/0001-err-h-inline-bit-macros.patch"
    patch_description: "0001 replace external aKaReZa.h framework include with stdint/stdbool and the bit macros required by err.c (bitSet/bitClear/bitCheck/bitChange/bitCheckHigh/bitShiftLeft); upstream header is not shipped in the Error_Detection repo and its AVR variant is AVR-only"
    patch_type: "portability"
