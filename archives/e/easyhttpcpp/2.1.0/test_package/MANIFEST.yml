# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: easyhttpcpp/2.1.0
homepage: "https://github.com/sony/easyhttpcpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# easyhttpcpp 使用 GoogleTest 测试框架（ENABLE_TESTS=ON 时构建两个 runner）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 是：探明阶段在本机用 CMake ENABLE_TESTS=ON 构建并实际运行（见 notes.md）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（在 OHOS aarch64 工具链下实测）
upstream_tests:
  - file: "easyhttp-UnitTestRunner"
    source: "easyhttpcpp-2.1.0/tests/unittests/**"
    description: "上游单元测试（147 个 test suite / 1515 个用例）"
    command: "./easyhttp-UnitTestRunner"
  - file: "easyhttp-IntegrationTestRunner"
    source: "easyhttpcpp-2.1.0/tests/integrationtests/**"
    description: "上游集成测试（42 个 test suite / 596 个用例，本地 HTTP/HTTPS 测试服务器）"
    command: "./easyhttp-IntegrationTestRunner"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_easyhttpcpp.cpp
    description: "消费者测试：构造 EasyHttp/Request/Headers 并验证可观察值（R34 实质 API 调用）"
    command: "./test_easyhttpcpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2111