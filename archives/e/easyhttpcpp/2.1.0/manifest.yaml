    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies:
    - poco/1.15.3
    - openssl/3.5.6
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch: cmake_minimum_required 3.0→3.5；find_package(Poco/OpenSSL) 改 Conan CMakeDeps 目标"
  - "0002-cmake-DefineProjectMacros.cmake.patch: configure_file 模板路径用 CMAKE_CURRENT_SOURCE_DIR 定位（CMAKE_MODULE_PATH 列表化破坏）"
  - "0003-include-easyhttpcpp-executorservice-BlockingQueue.h.patch: 补 Poco/Mutex.h 头（FastMutex 自包含）"
  - "0004-tests-CMakeLists-integrationtests.txt.patch: GMock::main → GTest::gmock_main；Poco/OpenSSL 变量 → 目标"
  - "0005-tests-CMakeLists-unittests.txt.patch: 同上"
  - "0006-tests-CMakeLists.txt.patch: find_package(GMock) → find_package(GTest)；链接目标修正"
  - "0007-tests-unittests-common-CacheManagerUnitTest.cpp.patch: 补 gmock/gmock.h 与 using testing::DoAll"
  - "0008-tests-unittests-common-DefaultLogWriterUnitTest.cpp.patch: Poco 1.15 getChannel/getFormatter 返回 AutoPtr 需 .get()"
  - "0009-tests-unittests-db-ContentValuesUnitTest.cpp.patch: OHOS 下补 LLONG_MIN/LLONG_MAX/ULLONG_MAX 定义"

knowledge_gained:
  - "easyhttpcpp 是 CMake 静态库（LIBRARY_TARGET_NAME=easyhttp），cpp_info.libs=['easyhttp']"
  - "上游 CMakeLists 使用 FindPoco/FindOpenSSL 模块变量，Conan CMakeDeps 只提供 imported target，需替换链接目标"
  - "CMake 4.x 移除 <3.5 兼容，cmake_minimum_required 需 ≥3.5 或注入 CMAKE_POLICY_VERSION_MINIMUM"
  - "Poco 1.15 getChannel()/getFormatter()/getChannel() 返回 AutoPtr，static_cast 需 .get()"
  - "OHOS/HMDFS 忽略 chmod 写权限位（E046），无权限目录写测试断言不成立——上游 9+34 项失败均为平台限制"

