crt_solution:
  problem: "CRT 文件缺失导致无法编译 C 代码"
  root_cause: "clang 默认不搜索用户路径 + musl libc 需要 compiler-rt"
  solution: "手动指定 CRT 路径 + 添加 libclang_rt.builtins-aarch64.a"
  crt_files_location: "$HOME/usr/local/lib"
  compiler_rt_location: "$HOME/usr/local/lib/clang/18/lib/aarch64-linux-ohos"
  wrapper_script: "$HOME/usr/local/bin/ohos-cc"
  status: "**已完全解决**"
