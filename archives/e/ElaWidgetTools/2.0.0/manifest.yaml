software: ElaWidgetTools
version: "2.0.0"
status: published
build_date: "2026-06-24"
build_system: cmake

source:
  url: "https://github.com/Liniyous/ElaWidgetTools/archive/refs/heads/main.tar.gz"
  sha256: "4e01e0219f00b5146bb07d13258e113de3132ad1a14c7e64c2e91ddb6521f485"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_PREFIX_PATH=$HOME/usr/local/Qt5"
    - "-DCMAKE_CXX_FLAGS=-stdlib=libc++"
    - "-DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++"
    - "-DCMAKE_SHARED_LINKER_FLAGS=-stdlib=libc++"
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DELAWIDGETTOOLS_BUILD_STATIC_LIB=ON"
  dependencies:
    - "qt5-qtbase/5.15.2"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"

knowledge_gained:
  - "Qt5 在 HarmonyOS 上需修复 musl libc 的 pthread_cancel 不支持问题"
  - "Qt5 在 HarmonyOS 上需修复 socklen_t 类型定义（int vs unsigned int）"
  - "Qt5 qt_functions.prf 中需添加 HarmonyOS 到 QMAKE_HOST.os 支持列表"
  - "HarmonyOS 上 stripped 的 ELF 二进制无法执行，需使用非 stripped 版本"
  - "Qt5 和 ElaWidgetTools 都需使用 -stdlib=libc++ 编译标志"
  - "ElaWidgetTools 可单独编译库而跳过 Example 子目录"

