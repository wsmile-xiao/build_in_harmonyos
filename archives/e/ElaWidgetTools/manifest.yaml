software: ElaWidgetTools
display: "ElaWidgetTools"
description: "Fluent-UI for Qt-Widget，基于 Qt 的 Fluent Design 风格组件库"
category: gfx
homepage: "https://github.com/Liniyous/ElaWidgetTools"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "依赖 Qt5 Widgets 模块，需先编译安装 Qt5 qtbase 5.15.2"
    - "Qt5 在 HarmonyOS 上需修复 musl libc 不支持 pthread_cancel 的问题"
    - "Qt5 在 HarmonyOS 上需修复 socklen_t 类型定义（int vs unsigned int）"
    - "Qt5 在 HarmonyOS 上需在 qt_functions.prf 中添加 HarmonyOS 到支持的操作系统列表"
    - "HarmonyOS 上 stripped 的 ELF 二进制无法执行，需使用非 stripped 版本的 Qt5 工具和库"
    - "CMakeLists.txt 中 QT_SDK_DIR 需修改为本地 Qt5 安装路径"
    - "CMakeLists.txt 中 CMAKE_INSTALL_PREFIX 被硬编码，需修改为可覆盖"
    - "编译时需添加 -stdlib=libc++ 标志（Qt5 使用 libc++ 而非 libstdc++）"
    - "可跳过 ElaWidgetToolsExample 子目录构建（仅编译库）"
  common_dependencies:
    - qt5-qtbase/5.15.2

versions:
  "2.0.0":
    status: published
    build_date: "2026-06-24"
