# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: edlin/2.24
homepage: https://sourceforge.net/projects/freedos-edlin/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 edlin 2.24 无测试套件（无 tests/ 目录，Makefile.am 无 TESTS），
# make check 为空目标（退出码 0，不运行任何用例）。
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件
upstream_tests: []  # 上游无测试用例：源码包仅含 4 个 C 源文件 + 文档

# 新增/鸿蒙特有测试
added_tests:
  - name: "smoke-test-edlin-stdin"
    source: test_package/test.sh
    description: "通过 stdin 驱动安装后的 edlin：插入行(I/E)、无操作保存、列出缓冲区(L/Q)，共 8 个断言"
