# 版本级 manifest
# 文件位置: archives/e/edlin/2.24/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.24"

# 软件名
software: "edlin"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-11"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（SourceForge 官方发布包，含完整构建系统与文档）
  url: "https://downloads.sourceforge.net/freedos-edlin/freedos-edlin/2.24/edlin-2.24.tar.bz2"

  # 源码校验和
  sha256: "ce3e64083744923cc38ae9ffe712fcc97d9256c9d973786bcc8018528e158fe7"

  # 压缩格式
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 2002 年版 config.guess 无法识别现代系统，用显式 --build 三元组绕过，无需补丁（与 acct/6.6.4 同法）"
  - "Makefile.in 的 `edlin_MANS = edlin.1.gz` 引用 tarball 中不存在的 man 页，但 edlin_MANS 不是 automake 标准 primary（应为 man1_MANS），不生成安装规则，make install 不受影响"
  - "DOS/Windows 专有头（process.h/io.h/conio.h/dos.h/jctype.h）与 kitten/catgets 消息目录回退均被 config.h/USE_* 宏门控，Linux/OHOS 下不参与编译"
  - "上游无测试套件：无 tests/ 目录、Makefile.am 无 TESTS，make check 为空目标退出码 0；test_package 用 stdin 驱动编辑器覆盖 i/e/L/Q 命令（8 个断言）"
  - "conan-home HMDFS 深缓存路径：exec 脚本被拒（E087，用 sh 显式调用绕过）、config.status 新建临时目录写入被拒（复制到 ~/tmp 浅层目录构建，dominion 先例）；~/usr/local/bin 的真 GNU mktemp 会抢在失败型 wrapper 前建 setgid 坏目录，wrapper 必须 PATH 内联前置"
  - "上游 bug：命令 switch 用 tolower(*ip) 匹配大写 E，但分支内 *ip=='e' 原始字符判断使大写 E 保存后不退出，stdin 耗尽触发 main abort()（Signal 6）；测试用小写 e + Y 确认行规避，不打补丁"
  - "edlin 的 E/Q 均有 \"Really quit (Y/n)?\" 确认提示，管道驱动必须补 Y；L2 的 --version/--help 探测对交互式编辑器天然失败（non-blocking skip）"
