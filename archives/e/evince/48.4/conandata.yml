sources:
  url: "https://download.gnome.org/sources/evince/48/evince-48.4.tar.xz"
  sha256: "f296c5c662886635d4cd597e8ac0afcde7982be4486533c2b7f095b268be8668"
  filename: "evince-48.4.tar.xz"
patches:
  - patch_file: "patches/0001-ohos-portability.patch"
    patch_description: "OHOS portability: gmodule-no-export-2.0 -> gmodule-2.0, drop gdk_pixbuf_binary_version get_variable, zlib via dependency()"
    patch_type: "portability"
  - patch_file: "patches/0002-post-install.patch"
    patch_description: "Disable gtk-update-icon-cache and desktop-database post-install (no system icon/desktop db on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0003-metainfo.patch"
    patch_description: "Skip metainfo translation merge (msgfmt cannot locate ITS rules on OHOS, no itstool); install untranslated appstream file"
    patch_type: "portability"
  - patch_file: "patches/0004-data-metainfo.patch"
    patch_description: "Skip data/ org.gnome.Evince metainfo translation merge (same ITS-rules limitation as 0003)"
    patch_type: "portability"
