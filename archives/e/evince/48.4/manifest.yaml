version: "48.4"
software: evince
status: built
build_date: "2026-09-03"
build_system: meson

source:
  url: "https://download.gnome.org/sources/evince/48/evince-48.4.tar.xz"
  sha256: "f296c5c662886635d4cd597e8ac0afcde7982be4486533c2b7f095b268be8668"
  tar_format: tar.xz
  source_note: "上游官方 48.4 发布 tarball（GNOME 官方源，SHA-256 与官方一致）"

build:
  system: meson
  configure_options:
    - "-Ddbus=false"
    - "-Dgtk_doc=false"
    - "-Duser_doc=false"
    - "-Dintrospection=false"
    - "-Dnautilus=false"
    - "-Dcomics=disabled"
    - "-Ddjvu=disabled"
    - "-Ddvi=disabled"
    - "-Dps=disabled"
    - "-Dtiff=disabled"
    - "-Dxps=disabled"
    - "-Dkeyring=disabled"
    - "-Dgtk_unix_print=disabled"
    - "-Dthumbnail_cache=disabled"
    - "-Dmultimedia=disabled"
    - "-Dgspell=disabled"
    - "-Dsystemduserunitdir=no"
  dependencies:
    - "glib/2.84.0.1"
    - "gtk/3.24.43"
    - "libhandy/1.8.3"
    - "libxml2/2.15.3.1"
    - "gdk-pixbuf/2.44.6.1"
    - "cairo/1.18.4"
    - "zlib/1.3.1.1"
    - "poppler/25.12.0.2"
  compiler: "OHOS clang (armv8-a, OHOS SDK)"

patches_applied:
  - "patches/0001-ohos-portability.patch"

test_passed: 0
test_failed: 0

knowledge_gained:
  - "evince 48.4 依赖 glib 配方的 gmodule-2.0 组件代替 gmodule-no-export-2.0（PkgConfigDeps 不生成 gmodule-no-export-2.0.pc）"
  - "gdk-pixbuf 配方的 gdk-pixbuf-2.0.pc 缺 gdk_pixbuf_binary_version 变量，evince 顶层 meson.build 用它拼 EXTRA_GDK_PIXBUF_LOADERS_DIR，须移除该 get_variable 调用"
  - "evince 顶层 meson.build 用 cc.find_library('z') 探测 zlib，须改为 dependency('zlib') 走 PkgConfigDeps 生成的 zlib.pc"
  - "产物库名为 libevdocument3/libevview3（libtool 版本 4.0.0/3.0.0），pkg-config 名 evince-document-3.0/evince-view-3.0"
