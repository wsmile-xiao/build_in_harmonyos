# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: enhex-generic_serialization/1.0.0
homepage: "https://github.com/Enhex/generic_serialization"

# 上游测试清点（R51）:
# v1.0.0 官方标签源码无独立 tests/ 目录、无 ctest/pytest 注册；
# 唯一测试载体为官方 test_package/example.cpp（序列化→文件→读回→断言往返，
# 8 条断言: x/y/z[0]/z[1]/z[2]/vec3.x/vec3.y/vec3.z）。
upstream_check_command: "无（header-only，无构建系统，无 make check/ctest）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_package/example.cpp
    source: generic_serialization-1.0.0/test_package/example.cpp
    description: "官方示例：POD 结构体 gs::serializer 写入/读回往返 + 8 条断言"
    command: "./example"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：gs::serializer 序列化/反序列化往返，11 项无条件校验（r03 修复 Release/NDEBUG 空壳）"
    command: "./test_generic_serialization"
  - file: harmony_platform_test.cpp
    description: "鸿蒙特有测试：OHOS 平台语义（uname 标识字节完整、/tmp EROFS 回退、HMDFS 替换、字节完整性），11 项无条件校验"
    command: "./harmony_platform_test"

# 测试断言总数
assertion_count: 30
