# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ethash/1.1.0
homepage: "https://github.com/chfast/ethash"

# 上游测试命令：ethash 使用 CMake + GoogleTest（Hunter 拉取 GTest）。
# 完整上游测试枚举/台账见任务回报（test/unittests 8 个独立测试文件）。
upstream_check_command: "cmake -DETHASH_TESTING=ON .. && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（完整枚举台账见回报，这里登记主测试二进制）
upstream_tests:
  - file: test/unittests/test_ethash.cpp
    source: ethash-1.1.0/test/unittests/test_ethash.cpp
    description: "ethash 核心算法单元测试（GTest）"
    command: "./ethash-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 ethash_keccak256 已知向量、ethash_create_epoch_context/ethash_hash/ethash_verify_final_hash_against_difficulty"
    command: "./test_ethash"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
