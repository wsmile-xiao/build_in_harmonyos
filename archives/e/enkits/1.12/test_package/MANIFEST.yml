# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: enkits/1.12
homepage: "https://github.com/dougbinks/enkiTS"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# enkiTS ships examples (TestAll, ParallelSum, ...) but no formal ctest suite;
# examples are built with ENKITS_BUILD_EXAMPLES=OFF in the recipe.
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (example/ 目录, 非正式 ctest 套件)
upstream_tests:
  - file: TestAll.cpp
    source: enkiTS-1.12/example/TestAll.cpp
    description: "Comprehensive enkiTS C++ API smoke test (scheduler init + task scheduling)"
    command: "./TestAll"
  - file: ParallelSum_c.c
    source: enkiTS-1.12/example/ParallelSum_c.c
    description: "Parallel sum reduction using the C API with task dependencies"
    command: "./ParallelSum_c"

# test_package 中自带的测试 (消费者视角验证, R34 实质调用 enkiTS API)
test_package_tests:
  - file: test.c
    description: "消费者测试: 创建 TaskScheduler + Initialize, 调度并行 TaskSet 求和, 验证结果与串行一致"
    command: "./test_enkits"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
