# 版本级 manifest — exifprobe 2.0.1

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.1"

# 软件名
software: exifprobe

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/hfiguiere/exifprobe/archive/refs/tags/2.0.1.tar.gz"

  # 源码校验和
  sha256: "356e28f5930878a950095e2f8be1dda779d874c13930b7931dce7979d0424fe4"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（纯 Makefile 无 configure；Makefile 硬编码 CC=cc/CFLAGS，配方内显式覆盖）
  configure_options:
  - "make CC={cc} CFLAGS=-DCOLOR -O2"

  # 编译依赖列表（格式: name/version）——无外部依赖，仅系统 libm
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "Conan 2 conan.tools.files.copy 无 keep_perm 参数，传参抛 TypeError；直接 copy 即可，权限自动保留（知识草稿 DRAFT-exifprobe-2.0.1-conan2-copy-keep-perm）"
- "tools.build:compiler_executables 是字典，须整读后取 c 子键；切勿读 tools.build:compiler_executables:c 子键路径（E307 覆盖）"
- "纯 Makefile CLI 工具配方：显式 make CC={cc} 覆盖上游硬编码 CC=cc（R33），package_type=application 并配 commands.json（R38）"
- "本地 W3 单包口径：JUNK_PR_DIFF=pr.diff 规避 full 模式扫到 main 上其他库历史垃圾（cloog/kics .staging-verified）误拦"