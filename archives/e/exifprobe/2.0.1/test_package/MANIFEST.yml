# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: exifprobe/2.0.1
homepage: "https://github.com/hfiguiere/exifprobe"

# 上游测试命令 (本包为纯 Makefile 项目, 无 configure/CTest 注册)
upstream_check_command: "make -n check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (官方 tag 2.0.1 无独立测试源/无 check 目标)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "生成含 EXIF APP1/TIFF 的真实 JPEG, 调用已安装 exifprobe 二进制验证版本、-L 列表模式 Make 标签值(OHOS-TEST)、文件类型识别与 APP1 结构遍历"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
