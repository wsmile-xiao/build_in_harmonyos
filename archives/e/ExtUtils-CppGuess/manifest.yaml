software: extutils-cppguess
display: "ExtUtils::CppGuess"
description: "Guess C++ compiler and flags compatible with the C compiler that your Perl was built with"
category: build-tool
homepage: "https://metacpan.org/pod/ExtUtils::CppGuess"
license: Artistic-1.0-Perl OR GPL-1.0-or-later
build_system: makemaker

ohos_adaptation:
  key_points:
    - "Pure Perl module, no XS compilation required"
    - "Attempts to guess C++ compiler settings from Perl's C compiler configuration"
    - "Tests may fail due to C++ compiler detection issues on OHOS"
    - "Core functionality works without compilation tests"
  common_dependencies:
    - perl
    - Capture::Tiny
    - File::Temp
    - ExtUtils::ParseXS

versions:
  "0.27":
    status: published
    build_date: "2026-06-10"
    functional_test_date: "2026-06-11"
    functional_test_status: PASS