# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: epr-api/2.3
homepage: "https://github.com/bcdev/epr-api"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游为 CMake 构建，测试注册在 ctest 中
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试已在 Adapt 阶段实际运行（ctest 2/2 通过），配方 build() 不重复运行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test
    source: epr-api-2.3/src/test
    description: "TEST_EPR_03 — 基础 ENVISAT 产品读取测试 (ctest)"
    command: "ctest -R TEST_EPR_03"
  - file: src/test + bccunit
    source: epr-api-2.3/src/test
    description: "BCCUNIT_TEST_SUITE_01 — bccunit 单元测试套件 (ctest)"
    command: "ctest -R BCCUNIT_TEST_SUITE_01"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：epr_init_api/close_api/错误码/日志级别"
    command: "./test_epr-api"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
