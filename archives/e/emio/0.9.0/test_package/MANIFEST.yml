# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: emio/0.9.0
homepage: "https://github.com/Viatorus/emio"

# 上游测试命令 (ctest -N 分析；emio 用 CMake dev-mode + Catch2)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（emio_test 单测可执行，Catch2 v3 聚合 22 个测试源文件）
upstream_tests:
  - file: test/unit_test/test_format.cpp
    source: emio-0.9.0/test/unit_test/test_format.cpp
    description: "Catch2 单元测试: 格式化功能聚合可执行 emio_test"
    command: "./emio_test"

# test_package 中自带的测试 (消费者视角验证，调用真实 emio API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: format/static_buffer/writer/reader/scan API"
    command: "./test_emio"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 400