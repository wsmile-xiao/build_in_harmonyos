# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: enet/2.7.0
homepage: "https://github.com/zpl-c/enet"

# 上游测试命令 (CMake 构建，无 ctest 注册，测试为直接可执行目标)
upstream_check_command: "cmake --build . --target enet_test enet_test_unit enet_test_extra_peers enet_test_ipv4_only && ./enet_test && ./enet_test_unit"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（R51 台账摘要；完整双口径台账见 reports/test-report.md）
upstream_tests:
  - file: test/units/test_times.c
    source: enet-2.7.0/test/units/test_times.c
    description: "6 个独立 TEST_CASE（ENET_TIME_LESS/GREATER/LESS_EQUAL/GREATER_EQUAL/DIFFERENCE/enet_time_get），经 test/units/test_main.c run_all_tests() 注册，构建为 enet_test_unit"
    command: "./enet_test_unit"
  - file: test/build.c
    source: enet-2.7.0/test/build.c
    description: "client/server 集成用例（32 clients, 1000 轮收发包+断开），构建为 enet_test"
    command: "./enet_test"
  - file: test/build.c
    source: enet-2.7.0/test/build.c (ENET_USE_MORE_PEERS)
    description: "同一集成用例的 5000-peers 编译变体，构建为 enet_test_extra_peers"
    command: "./enet_test_extra_peers"
  - file: test/build.c
    source: enet-2.7.0/test/build.c (ENET_IPV4_ONLY)
    description: "同一集成用例的 IPv4-only 编译变体，构建为 enet_test_ipv4_only"
    command: "./enet_test_ipv4_only"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "HarmonyOS 专项回环测试：同进程 client/server 127.0.0.1 UDP 回环，可靠包双向内容校验 + 优雅断开握手，exit 0=PASS"
