# 版本级 manifest — enet 2.7.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.7.0"

# 软件名
software: "enet"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/zpl-c/enet/archive/refs/tags/v2.7.0.tar.gz"

  # 源码校验和
  sha256: "87aedd04b159e6f7405b1252a79ee7a6b617793347ae95a7eae556ede45e2f64"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DENET_STATIC=ON"
    - "-DENET_SHARED=OFF"
    - "-DENET_TEST=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # enet 为纯 C 网络库，无第三方运行时依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "enet 2.7.0 由 1.3.18 的 autotools 迁移为原生 CMake 构建（ENET_STATIC/ENET_SHARED/ENET_TEST 选项），无需 autoreconf/config.guess 补丁"
  - "enet 2.7.0 为单头实现库（include/enet.h 内含 ENET_IMPLEMENTATION 实现体），CMake 以 test/library.c 实例化编译 libenet.a"
  - "上游测试通过 CMake 目标构建（无 ctest 注册）：enet_test/enet_test_unit/enet_test_extra_peers/enet_test_ipv4_only"