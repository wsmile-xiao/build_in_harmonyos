# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: enet/1.3.18
homepage: "https://github.com/lsalzman/enet"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# enet 上游 (1.3.18) 无 test suite — `make check` outputs "Nothing to be done for 'check'".
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    source: enet-1.3.18/test_package/test.c
    description: "调用 enet_initialize/enet_host_create/enet_deinitialize 验证库可链接与初始化"
    command: "./test_enet"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
