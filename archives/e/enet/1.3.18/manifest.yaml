# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011/E129: HMDFS umask 077 导致 config.status 临时目录不可写，需 sed umask 077→022"
  - "E178: CI Worker 的 /data/service/hnp/bin autoconf 套件不含 aclocal/automake/libtoolize，系统 PATH 无可用 automake，需 build_requirements() 通过 build profile 拉入 automake/1.18 + libtool/2.5.4（afuse/aircrack-ng/adcli 同款模式）"
  - "R33-safe: 用 tool_requires 解析完整 autotools，build() 直接 autoreconf --install --verbose，不拼凑系统残缺工具、无硬编码路径"
  - "E007: automake/1.18 (tool_requires) ships unpatched config.guess/config.sub (2024-07-27, no HarmonyOS case); build() runs patch-autotools-ohos.pl after autoreconf --install to add OHOS recognition"
  - "enet GitHub archive 仅含 configure.ac，需 autoreconf --install 生成 configure"
  - "R15/E007: 原生编译禁用 --host/--build/--target，config.guess 正确返回 aarch64-unknown-linux-ohos"
