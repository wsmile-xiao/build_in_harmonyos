package:
  name: et
  version: 7.0.0
  license: Apache-2.0
  description: "EternalTerminal — reconnectable remote shell"
  homepage: "https://github.com/MisterTea/EternalTerminal"

build:
  system: cmake
  cxx_standard: 17
  options:
    with_sentry: false
    with_telemetry: false
    build_testing: false
  configure_args:
    - "-DDISABLE_VCPKG=ON"
    - "-DBUILD_TESTING=OFF"
    - "-DDISABLE_SENTRY=ON"
    - "-DDISABLE_TELEMETRY=ON"

dependencies:
  - zlib/1.3.1
  - openssl/1.1.1w
  - libsodium/1.0.22
  - protobuf/33.6.1
  - abseil-cpp/20260107.1
  - nlohmann_json/3.1.1

patches_applied: []

notes: |
  et 7.0.0 适配鸿蒙 PC (aarch64-linux-ohos)。

  EternalTerminal 是 CMake 项目（C++17, Apache-2.0），产物为 et/etserver/
  etterminal 三个可执行文件，以及 et_core/terminal/et_terminal_lib 三个库。

  关键适配点：
  1. -DDISABLE_VCPKG=ON：禁用 vcpkg 子模块，改用源码自带 external_imported/
     vendored 依赖（Catch2/cxxopts/cpp-httplib/json/simpleini/sole 等）。
  2. 重运行时依赖（zlib/openssl/libsodium/protobuf/nlohmann_json）从 conan
     requires 获取，均已在 archives 适配过。
  3. -DDISABLE_SENTRY=ON / -DDISABLE_TELEMETRY=ON：禁用 Sentry 崩溃上报，
     鸿蒙 PC 环境无 Sentry 后端。
  4. -DBUILD_TESTING=OFF：upstream 测试需 Catch2 全套，暂跳过。
