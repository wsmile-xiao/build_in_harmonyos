# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: et/7.0.0
homepage: "https://github.com/MisterTea/EternalTerminal"

# EternalTerminal 上游未提供独立测试框架（无 make check / ctest）。
# test_package 消费者测试验证 et 二进制产物存在并可启动。

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# EternalTerminal 上游无编译测试二进制
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: verifies et binary exists in package and can be launched with --version/--help (distinguishes signal-killed/cannot-execute from normal exit)"
    command: "./test_et"

# 测试断言总数 (近似值, 用于质量评估)
# 3 return-code branches in test.cpp (0=success, 1=not found, 2=abnormal)
assertion_count: 3
