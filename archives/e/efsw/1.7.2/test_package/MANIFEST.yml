# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: efsw/1.7.2
homepage: "https://github.com/SpartanJ/efsw"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: "cmake --build . --target efsw-test efsw-test-stdc && ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（src/unit_tests 独立单测 + 交互式 demo）
upstream_tests:
  - file: src/unit_tests/add.cpp
    source: efsw-1.7.2/src/unit_tests/add.cpp
    description: "文件新增事件单测（Add.*）"
    command: "./efsw-unit-tests"
  - file: src/unit_tests/cross_dir_and_watcher.cpp
    source: efsw-1.7.2/src/unit_tests/cross_dir_and_watcher.cpp
    description: "跨目录/多 watcher 单测"
    command: "./efsw-unit-tests"
  - file: src/unit_tests/delete.cpp
    source: efsw-1.7.2/src/unit_tests/delete.cpp
    description: "文件删除事件单测"
    command: "./efsw-unit-tests"
  - file: src/unit_tests/emoji.cpp
    source: efsw-1.7.2/src/unit_tests/emoji.cpp
    description: "emoji 文件名事件单测"
    command: "./efsw-unit-tests"
  - file: src/unit_tests/inotify_overlapping_watches.cpp
    source: efsw-1.7.2/src/unit_tests/inotify_overlapping_watches.cpp
    description: "inotify 重叠监视单测"
    command: "./efsw-unit-tests"
  - file: src/unit_tests/modified.cpp
    source: efsw-1.7.2/src/unit_tests/modified.cpp
    description: "文件修改事件单测"
    command: "./efsw-unit-tests"
  - file: src/unit_tests/moved.cpp
    source: efsw-1.7.2/src/unit_tests/moved.cpp
    description: "文件移动/重命名事件单测"
    command: "./efsw-unit-tests"
  - file: src/unit_tests/rename_and_local_move.cpp
    source: efsw-1.7.2/src/unit_tests/rename_and_local_move.cpp
    description: "重命名与本地移动单测"
    command: "./efsw-unit-tests"
  - file: src/unit_tests/symlink.cpp
    source: efsw-1.7.2/src/unit_tests/symlink.cpp
    description: "符号链接事件单测"
    command: "./efsw-unit-tests"
  - file: src/unit_tests/unwatched_to_watched.cpp
    source: efsw-1.7.2/src/unit_tests/unwatched_to_watched.cpp
    description: "未监视转监视目录单测"
    command: "./efsw-unit-tests"
  - file: src/test/efsw-test.cpp
    source: efsw-1.7.2/src/test/efsw-test.cpp
    description: "C++ API 交互式 demo（非自动化断言用例）"
    command: "./efsw-test"
  - file: src/test/efsw-test.c
    source: efsw-1.7.2/src/test/efsw-test.c
    description: "C API 交互式 demo（非自动化断言用例）"
    command: "./efsw-test-stdc"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试（inotify 后端）：创建 watcher、监视目录、写入文件触发 EFSW_ADD 回调"
    command: "./test_efsw"
  - file: test_generic.c
    description: "HarmonyOS 专项测试（generic 轮询后端）：验证 efsw_create(1) 轮询后端事件回调"
    command: "./test_efsw_generic"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 51
