# 版本级 manifest — edlib 1.2.7
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2.7"
software: edlib
status: published
build_system: cmake
build_date: "2026-09-03"

source:
  url: "https://github.com/Martinsos/edlib/archive/refs/tags/v1.2.7.tar.gz"
  sha256: "8767bc1b04a1a67282d57662e5702c4908996e96b1753b5520921ff189974621"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=armv8"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 cmake_minimum_required(3.2) 与 CMake 4.x 不兼容，须用 cache_variables 注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（同 easyloggingpp/DRAFT-E321 方案）"
  - "CMake 不识别 OHOS 平台（E092），须注入 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=armv8"
  - "conan-verify E017 镜像注入会残留 conandata.yml.ghfast-bak，迭代间可能回滚 conandata 修改（DRAFT-E323），finish 前须清理"
  - "lang-preflight 对带 bindings/python/setup.py 的 C++ 库可能误判 python（lang_detect.py 全树文件名集合），需按边界规则人工复核；根因在框架"
