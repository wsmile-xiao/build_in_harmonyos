# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: edlib/1.2.7
homepage: "https://github.com/Martinsos/edlib"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/runTests.cpp
    source: edlib-1.2.7/test/runTests.cpp
    description: "上游主测试源 runTests.cpp，19 个独立测试函数（test1-16 + testCigar + testCustomEqualityRelation + testEmptySequences），随机对比 + 具体断言，OHOS clang 实测 19/19 通过"
    command: "./runTests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: harmonyos_test.cpp
    description: "HarmonyOS 专项测试（非空壳）：平台宏识别 + edlib API 功能断言（编辑距离/对齐路径/自定义等价关系/CIGAR/k 限制），16 项断言 ALL PASS，退出码 0"
    command: "./test_edlib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 19