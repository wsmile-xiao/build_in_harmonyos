# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: easyflash/4.1.0
homepage: "https://github.com/armink/EasyFlash"

# 上游测试命令：上游 4.1.0 无构建系统（无 configure/make/cmake/meson）
# 也无任何测试目录/测试框架/测试脚本（已全量清点，见 notes.md 与最终回报台账）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无独立上游测试用例，如实留空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，全部实际编译运行)
test_package_tests:
  - file: test.c
    source: test_package/test.c
    description: "消费者测试：通过公共 easyflash.h API 完成 ENV 键值 set/get/del/save 全流程，RAM 模拟 flash 端口（ef_port_ram.c）"
    command: "./test_easyflash"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8