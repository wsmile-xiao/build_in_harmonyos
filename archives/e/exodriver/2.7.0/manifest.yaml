# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "exodriver 是裸 Makefile 项目，实际库代码在 liblabjackusb/ 子目录"
  - "源码 include 路径为 <libusb-1.0/libusb.h>，需要 libusb 的 include 路径"
