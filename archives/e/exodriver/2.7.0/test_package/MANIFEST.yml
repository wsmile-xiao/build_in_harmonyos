# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: exodriver/2.7.0
homepage: "https://github.com/labjack/exodriver"

# 上游测试命令 (exodriver 是裸 Makefile，无 make check 目标)
upstream_check_command: "make -n all"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# exodriver 无内置测试目标，examples/Modbus/testModbusFunctions 可作为协议级测试
upstream_tests:
  - file: examples/Modbus/testModbusFunctions.c
    source: exodriver-2.7.0/examples/Modbus/testModbusFunctions.c
    description: "Modbus 协议函数单元测试（无需硬件）"
    command: "./testModbusFunctions"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 LJUSB_GetLibraryVersion() 验证库可用性"
    command: "./test_exodriver"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
