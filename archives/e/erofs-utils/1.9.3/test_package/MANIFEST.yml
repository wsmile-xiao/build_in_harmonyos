# test_package/MANIFEST.yml
# Upstream test declaration (required by CI L0e)

package: erofs-utils/1.9.3
homepage: "https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git"

# Upstream test command — erofs-utils has no `make check` / TESTS target
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_erofs_utils.sh
    description: "Phase 1: --help smoke test for each installed EROFS utility (mkfs/fsck/dump/mount)"
    command: "bash test_erofs_utils.sh <package_folder>"
  - file: conanfile.py
    description: "Phase 2: functional integration test — mkfs.erofs creates image from source dir, fsck.erofs verifies integrity, dump.erofs confirms file entries"
    command: "conan test test_package erofs-utils/1.9.3"

# Assertion count:
#   Phase 1: 4 (one per utility --help)
#   Phase 2: 4 (mkfs image exists, fsck exit 0, dump output non-empty, hello.txt entry present)
assertion_count: 8
