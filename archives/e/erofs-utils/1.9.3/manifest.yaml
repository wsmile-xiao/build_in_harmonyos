# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--disable-multithreading"
    - "--disable-lz4"
    - "--disable-lzma"
    - "--without-zlib"
    - "--without-libdeflate"
    - "--without-libzstd"
    - "--without-qpl"
    - "--without-xxhash"
    - "--without-libcurl"
    - "--without-openssl"
    - "--without-libxml2"
    - "--without-json-c"
    - "--without-libnl3"
    - "--disable-ublk"
    - "--disable-s3"
    - "--disable-oci"
    - "--disable-fanotify"
    - "--disable-fuse"
    - "--without-uuid"
    - "--without-selinux"
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
    - "--target=aarch64-linux-ohos"
  dependencies: []
  cc: clang
  cxx: clang++

