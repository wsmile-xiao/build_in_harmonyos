patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "1.9.3 tarball 不含预生成 autotools 文件（与 1.9.2 不同），需 build() 中 autoreconf -fi 生成"
  - "通过 tool_requires automake/1.18 + libtool/2.5.4 提供自举工具链（同 adcli/afuse/audit 模式）"
  - "autoreconf 生成的 configure 仍含 umask 077 模式，需运行时 _drop_umask_077() 修补（E114 HMDFS）"
  - "不再提交 files/autotools-generated.tar.gz 二进制 blob——CI 通过 .diff 补丁应用 PR，二进制文件无法被 git apply 正确编码"
