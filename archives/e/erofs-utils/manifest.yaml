software: erofs-utils
display: "EROFS Utils"
description: "Userspace tools for the EROFS filesystem (mkfs.erofs, fsck.erofs, dump.erofs, mount.erofs)"
category: filesystem
homepage: "https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git"
license: GPL-2.0-or-later AND MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "1.9.3 tarball 不含预生成 autotools 文件，需 build() 中 autoreconf -fi 生成 configure/Makefile.in/aclocal.m4 等"
    - "通过 tool_requires automake/1.18 + libtool/2.5.4 提供自举工具链（不提交二进制 tarball，避免 CI diff 补丁无法应用二进制文件）"
    - "OHOS 下 configure 中 umask 077 需替换（E114 HMDFS），autoreconf 生成后运行时修补"
    - "禁用所有可选依赖（lz4/lzma/zlib/libdeflate/libzstd/qpl/xxhash/libcurl/openssl/libxml2/json-c/libnl3/ublk/s3/oci/fanotify/fuse/uuid/selinux）"
    - "OHOS 下加 --build/--host/--target=aarch64-linux-ohos 三元组"
    - "静态构建：--disable-shared --enable-static"
  common_dependencies: []

versions:
  "1.9.3":
    status: built
    build_date: "2026-08-21"
    published_as: erofs-utils
    source_url: "https://github.com/erofs/erofs-utils/archive/refs/tags/v1.9.3.tar.gz"
