# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: eventlog/a5c19163ba
homepage: "https://github.com/balabit/eventlog"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/evtrec.c
    source: eventlog-a5c19163ba/tests/evtrec.c
    description: "记录构造/释放冒烟测试（noinst_PROGRAMS，无 TESTS 注册，手动运行）"
    command: "./evtrec"
  - file: tests/evtfmt.c
    source: eventlog-a5c19163ba/tests/evtfmt.c
    description: "格式化输出验证：嵌入分隔符、XML 标签与 tag 值"
    command: "./evtfmt"
  - file: tests/evtsyslog.c
    source: eventlog-a5c19163ba/tests/evtsyslog.c
    description: "syslog 消息构造与输出"
    command: "./evtsyslog"
  - file: tests/evtsyslog.c
    source: eventlog-a5c19163ba/tests/evtsyslog.c
    description: "EVENTLOG_SYSLOG_MACROS 宏模式编译与运行"
    command: "./evtsyslog-macros"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "实质调用 libevtlog API：evt_ctx_init/evt_rec_init/evt_tag_str/evt_tag_int/evt_format 并断言输出内容"
    command: "./test_eventlog"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
