# 版本级 manifest
# 文件位置: archives/e/eventlog/a5c19163ba/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "a5c19163ba"

# 软件名
software: eventlog

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub commit archive）
  url: "https://github.com/balabit/eventlog/archive/a5c19163ba.tar.gz"

  # 源码校验和（GitHub 官方 archive SHA-256）
  sha256: "ddd8c19cf70adced542eeb067df275cb2c0d37a5efe1ba9123102eb9b4967c7b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--enable-static"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本版本无源码补丁，适配均在 conanfile.py 内处理）
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 git archive 不含生成的 configure（configure.in/Makefile.am 时代项目），配方 build() 须先 autoreconf -fi（tool_requires automake/1.18 + libtool/2.5.4）"
  - "config.guess 不识别 HarmonyOS（uname -s=HarmonyOS），generate() 显式 --build/--host=aarch64-unknown-linux-ohos 跳过 config.guess 探测"
  - "generate() 生成的 configure 中 config.status 临时目录创建保留 umask 077，HMDFS 强制 setgid 导致 drwx--S--- 目录不可写（E114），须在 build() 中替换该段为 mktemp 直建"
  - "make -jN 触发 HMDFS jobserver fifo EPERM（E074），须 -j1；test_package 由 CMakeDeps 默认 -j20 触发同类 fifo 报错但不影响结果"
  - "GitHub 官方 commit archive 的 SHA-256 与本地 git archive --prefix 打包不同，conandata.yml 必须以 GitHub 官方 archive 实测哈希为准（本地用 ghfast.top 镜像核验）"