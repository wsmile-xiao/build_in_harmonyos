# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: exif/0.6.22
homepage: "https://libexif.github.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（12 个，与源码 test/Makefile.am 的 check_SCRIPTS 全量一致）
# 实测 make check: 12/12 全部 PASS（0 FAIL / 0 ERROR），2026-08-30 重新编译验证
upstream_tests:
  - file: test/check-add-tags.sh
    source: exif-0.6.22/test/check-add-tags.sh
    description: "添加 tag 后 tag 内容/数量校验"
    command: "./check-add-tags.sh"
  - file: test/check-create-tags.sh
    source: exif-0.6.22/test/check-create-tags.sh
    description: "--create-exif 默认 11 tags、--no-fixup 0 tags"
    command: "./check-create-tags.sh"
  - file: test/check-help.sh
    source: exif-0.6.22/test/check-help.sh
    description: "--help/-?/无参数帮助文本与 C locale 匹配"
    command: "./check-help.sh"
  - file: test/check-init-mandatory-tags.sh
    source: exif-0.6.22/test/check-init-mandatory-tags.sh
    description: "初始化必需 tag 测试"
    command: "./check-init-mandatory-tags.sh"
  - file: test/check-no-seek.sh
    source: exif-0.6.22/test/check-no-seek.sh
    description: "无 seek 读取测试"
    command: "./check-no-seek.sh"
  - file: test/check-param-validity.sh
    source: exif-0.6.22/test/check-param-validity.sh
    description: "命令行参数合法性测试"
    command: "./check-param-validity.sh"
  - file: test/check-required-file.sh
    source: exif-0.6.22/test/check-required-file.sh
    description: "必需文件参数校验测试"
    command: "./check-required-file.sh"
  - file: test/check-show-description.sh
    source: exif-0.6.22/test/check-show-description.sh
    description: "tag 描述显示测试"
    command: "./check-show-description.sh"
  - file: test/check-show-tag.sh
    source: exif-0.6.22/test/check-show-tag.sh
    description: "显示 EXIF tag 功能测试"
    command: "./check-show-tag.sh"
  - file: test/check-tag-description.sh
    source: exif-0.6.22/test/check-tag-description.sh
    description: "tag 描述表测试"
    command: "./check-tag-description.sh"
  - file: test/check-thumbnail.sh
    source: exif-0.6.22/test/check-thumbnail.sh
    description: "缩略图处理测试"
    command: "./check-thumbnail.sh"
  - file: test/check-version.sh
    source: exif-0.6.22/test/check-version.sh
    description: "验证 exif --version 输出版本号"
    command: "./check-version.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：执行 exif --version 验证版本号 + 缺失文件参数错误处理（R34 实质调用被测二进制）"
    command: "./test_exif"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
