# 版本级 manifest — erhling-clibs 2.1.1

version: "2.1.1"
software: erhling-clibs

# 编译状态: published | built | failed | archived
# 本地 conan create + conan-verify 通过，未 upload（执行端不做 Conan 远端写入）
status: built

build_date: "2026-09-26"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游无 tag/release，钉住 master HEAD 289f980）
  url: "https://github.com/ennorehling/clibs/archive/289f980277e9a568042257e4f6b919960adb2eb7.tar.gz"
  # 源码校验和
  sha256: "6fa11a94070d82b29b99144113d92293a9df82512420506340301015409f530d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）— 本库无第三方依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表 — 无需补丁（上游 CMakeLists.txt 可直接构建）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 CMakeLists.txt 无 install() 规则，conanfile.py package() 需手动复制头文件与 libclibs.a"
  - "conan-init 按 URL 猜测 autotools 模板，实际构建系统为 CMake，需手动改用 CMake 配方模板"
