# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: erhling-clibs/2.1.1
homepage: "https://github.com/ennorehling/clibs"

# 上游测试命令 (ctest -N 列出)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ctest 1/1 clibs; 直接运行 test_clibs = 51 断言 OK)
upstream_tests:
  - file: tests.c
    source: erhling-clibs/tests.c
    description: "CuTest 单测集合：cmdline/strings/l10n/selist/strutil/format/critbit"
    command: "test_clibs"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 str_strlcpy/str_strlcat/str_hash/str_escape"
    command: "./test_erhling-clibs"

# 测试断言总数 (上游 51 断言 + 消费者 4 断言)
assertion_count: 55
