software: Encode
# 版本级 manifest
# 文件位置: archives/e/Encode/3.24/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.24"

# 编译状态
# published | built | failed | archived
status: archived

# 编译日期
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/D/DA/DANKOGAI/Encode-3.24.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"
    - "LIB=/storage/Users/currentUser/usr/local/lib/perl5/site_perl"
    - "INSTALLSITELIB=/storage/Users/currentUser/usr/local/lib/perl5/site_perl"
    - "INSTALLSITEARCH=/storage/Users/currentUser/usr/local/lib/perl5/site_perl/aarch64-linux"

  dependencies:
    - musl/1.2.5
    - perl/5.42.0

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-fix-compile-flags-for-ohos.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Perl XS 模块需要添加 musl 头文件路径到 CCFLAGS"
  - "链接时需要使用 -nostartfiles -nodefaultlibs 避免 CRT 文件找不到"
  - "HMDFS 上的 XS 模块无法加载，因 SELinux 限制"
  - "Encode 包含多个编码子模块（Byte/CN/EBCDIC/JP/KR/Symbol/TW/Unicode）"
  - "系统已预装 Encode 3.21 (hnp_file 类型)，功能完整可用"