# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e validation
# See: docs/TEST_QUALITY_SPEC.md

package: ems-flasher/0.03
homepage: "http://lacklustre.net/projects/ems-flasher/"

# Upstream has no test suite (no test target in Makefile, no tests/ directory)
upstream_check_command: "make check"

# conanfile.py build() method integration of upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests — NONE (no test suite in upstream source)
upstream_tests: []

# test_package tests (consumer perspective validation)
# R34: Tests execute the ems-flasher binary directly
test_package_tests:
  - file: conanfile.py
    description: "Execute ems-flasher --version to verify binary runs and links correctly (--help excluded: upstream usage() calls exit(1))"
    command: "ems-flasher --version"

# Approximate assertion count (1 command executed, verifying exit 0)
assertion_count: 1
