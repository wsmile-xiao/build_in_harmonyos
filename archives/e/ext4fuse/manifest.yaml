software: ext4fuse
display: "ext4fuse"
description: "Read-only EXT4 filesystem implementation for FUSE"
category: system
homepage: "https://github.com/gerard/ext4fuse"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目, 无 configure、无 install 目标, package() 手工 copy 二进制"
    - "依赖 libfuse/2.9.9 (fuse2 API, FUSE_USE_VERSION=26) + 工具依赖 pkgconf/3.0.6"
    - "Makefile 内 pkg-config fuse 改写为依赖包直取标志 (conan pc 文件不在 conanbuild PKG_CONFIG_PATH, 不查 pkgconf)"
    - "fuse-main.c 的 <execinfo.h> 仅 glibc 存在, 其他 libc 用 no-op stub (__GLIBC__ 守卫)"
    - "上游测试为 FUSE 挂载集成脚本, OHOS 无 mke2fs//dev/fuse, 预期全部 SKIPPED"
  common_dependencies:
    - libfuse

versions:
  "0.1.3":
    status: built
    build_date: "2026-09-09"
    conan_ref: "ext4fuse/0.1.3"
