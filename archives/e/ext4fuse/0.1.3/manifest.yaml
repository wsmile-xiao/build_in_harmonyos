# 版本级 manifest — ext4fuse 0.1.3
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.1.3"
software: "ext4fuse"
status: built
build_date: "2026-09-09"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/gerard/ext4fuse/archive/refs/tags/v0.1.3.tar.gz"
  sha256: "550f1e152c4de7d4ea517ee1c708f57bfebb0856281c508511419db45aa3ca9f"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "make -j1 (CC from conanbuild env, no configure step)"
  dependencies:
    - "libfuse/2.9.9"
  tool_dependencies:
    - "pkgconf/3.0.6"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无 patches/ 补丁文件；三处可移植性改动在 conanfile.py build() 中以
# replace_in_file 完成 (ed 1.20 / encfs 1.9.5 同款做法):
#   1. Makefile: which pkg-config -> which pkgconf (conan 只提供 pkgconf)
#   2. Makefile: $(shell pkg-config fuse --cflags/--libs) -> libfuse 依赖包
#      字面标志 (generators 目录不在 conanbuild PKG_CONFIG_PATH, 不查 pkgconf)
#   3. fuse-main.c: <execinfo.h> 仅 glibc, 否则 no-op stub (__GLIBC__ 守卫)
#   4. test/*.sh: #!/bin/bash -> HarmonyOS toolchain bash (E165)
patches_applied: []
runtime_modifications:
  - "Makefile which pkg-config check (build-time edit, no patch file)"
  - "Makefile fuse flags from libfuse package folder (build-time edit, no patch file)"
  - "fuse-main.c execinfo.h feature guard (build-time edit, no patch file)"
  - "test/*.sh shebang to toolchain bash (build-time edit, test-only files)"
  - "Makefile test loop runs scripts via absolute toolchain bash (no +x/shebang/PATH dependence, HMBS_CAP_CHMOD=0)"
  - "test/lib.sh mktemp temp root /tmp -> ${TMPDIR:-/tmp} (readonly_tmp, test itself untouched)"
  - "test/lib.sh mount-step facility gates: e4test_mount SKIPs without passwordless sudo, e4test_fuse_mount SKIPs without usable /dev/fuse (upstream gate style, assertions untouched)"
  - "build() exports HMBS TMPDIR/TMP/TEMP on the make test command line (env=conanbuild filters outer env)"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ext4fuse 是纯 Makefile 项目, 无 configure、无 install 目标: package() 手工 copy 二进制到 bin/"
  - "conan PkgConfigDeps 生成的 pc 文件不在 conanbuild PKG_CONFIG_PATH 上, pkgconf 查询落空: Makefile 侧把查询词换成 libfuse 依赖包字面标志, 只保留 which pkgconf 检查"
  - "OHOS bionic 无 <execinfo.h>/backtrace: __GLIBC__ 特性守卫 + no-op stub, 不引入 __OHOS__ 宏"
  - "R26 不适用: 产物只有 bin/ext4fuse 可执行文件, 无 .so, 不存在系统库污染"
  - "R38: application 类型, 软件级 commands.json 声明 tool"

# ============================================================
# 上游测试审计 (R51 三步法: 清点 -> 真机实跑 -> PR 回填)
# ============================================================

upstream_tests:
  present: true
  suites:
    - "make test (test/ 四位数字 glob 命中 12 个 FUSE 集成脚本, 0000/0001 为挂载冒烟用例)"
    - "make test-slow (test/[0-9]* 共 13 个脚本, 含 0011A ext2/1024 块大小变体等慢用例)"
  execution_result: "run_in_build_pending_evidence"
  notes: "声明口径覆盖 tag 内全部 13 个脚本: make test 的 12 个 + 0011A-ext2-1024-block-size.sh (不被四位数字 glob 覆盖, 仅 make test-slow 执行, conanfile.py build() 在 make test 后以同参数显式执行)。全部脚本依赖 mke2fs 制作循环镜像 + /dev/fuse 挂载 (sudo mount/fusermount)。OHOS 真机两者皆无时脚本经 lib.sh e4test_make_FS 门控报 SKIPPED 并退出 0；PASS/FAIL/SKIPPED 行保留在构建日志中。mount 能力缺失属平台限制, 豁免项见 notes.md。test_package 另以二进制 smoke 测试 (5 断言) 覆盖可用性。"
