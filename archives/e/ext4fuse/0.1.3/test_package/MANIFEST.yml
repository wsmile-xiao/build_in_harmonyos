# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ext4fuse/0.1.3
homepage: "https://github.com/gerard/ext4fuse"

# 上游测试命令 (conanfile.py build() 中已集成, 见 upstream_test_in_build)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序
# tag v0.1.3 的 test/ 下共 13 个 FUSE 集成脚本: `make test` 的四位数字加 `-`
# 前缀 glob 命中 12 个 (含 0000/0001 sanity 脚本); 0011A-ext2-1024-block-size.sh
# (第五字符为 `A`) 不被该 glob 覆盖, 仅 `make test-slow` 会执行, conanfile.py
# build() 在 `make test` 之后以同参数显式执行它, 声明口径覆盖全部 13 个。
# 每个脚本经 mke2fs 制作循环镜像后通过 /dev/fuse 挂载再比对数据；
# OHOS 既无 mke2fs 也无 FUSE 内核支持, 脚本经 lib.sh e4test_make_FS
# 门控直接 "SKIPPED (no mke2fs binary found)" 退出 0, 日志保留实测痕迹。
upstream_tests:
  - file: test/0000-sanity.sh
    source: ext4fuse-0.1.3/test/0000-sanity.sh
    description: "挂载冒烟测试 (FUSE 挂载后休眠再卸载)"
    command: "make test"
  - file: test/0001-sanity-small.sh
    source: ext4fuse-0.1.3/test/0001-sanity-small.sh
    description: "小镜像挂载冒烟测试"
    command: "make test"
  - file: test/0010-file-integrity.sh
    source: ext4fuse-0.1.3/test/0010-file-integrity.sh
    description: "文件数据完整性 (FUSE 挂载后 md5 比对)"
    command: "make test"
  - file: test/0011-file-integrity-large.sh
    source: ext4fuse-0.1.3/test/0011-file-integrity-large.sh
    description: "大文件数据完整性 (FUSE 挂载后 md5 比对)"
    command: "make test"
  - file: test/0011A-ext2-1024-block-size.sh
    source: ext4fuse-0.1.3/test/0011A-ext2-1024-block-size.sh
    description: "ext2 1024 字节块大小文件完整性 (0011-large 的 ext2/-b 1024 变体, 上游 make test 四位数字 glob 不含, build() 显式执行)"
    command: "make test 后显式执行"
  - file: test/0012-file-seek-torture.sh
    source: ext4fuse-0.1.3/test/0012-file-seek-torture.sh
    description: "文件 seek 压力测试"
    command: "make test"
  - file: test/0013-file-integrity-fragmented.sh
    source: ext4fuse-0.1.3/test/0013-file-integrity-fragmented.sh
    description: "碎片文件数据完整性"
    command: "make test"
  - file: test/0014-file-integrity-sparse.sh
    source: ext4fuse-0.1.3/test/0014-file-integrity-sparse.sh
    description: "稀疏文件数据完整性"
    command: "make test"
  - file: test/0015-small-files.sh
    source: ext4fuse-0.1.3/test/0015-small-files.sh
    description: "小文件读写测试"
    command: "make test"
  - file: test/0020-directory-integrity
    source: ext4fuse-0.1.3/test/0020-directory-integrity
    description: "目录结构完整性 (大量目录 md5 比对)"
    command: "make test"
  - file: test/0021-long-dirnames.sh
    source: ext4fuse-0.1.3/test/0021-long-dirnames.sh
    description: "长目录名测试"
    command: "make test"
  - file: test/0030-single-symlink.sh
    source: ext4fuse-0.1.3/test/0030-single-symlink.sh
    description: "单个符号链接测试"
    command: "make test"
  - file: test/0031-long-symlink.sh
    source: ext4fuse-0.1.3/test/0031-long-symlink.sh
    description: "长符号链接测试"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: 无参 Usage/Version 退出 1 + 坏镜像诚实报错 (R34 真实执行二进制)"
    command: "bash test.sh"

# 测试断言总数 (test.sh 内 5 处检查: 退出码1 + Usage + Version + 非零退出 + 报错文本)
assertion_count: 5
