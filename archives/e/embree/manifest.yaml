software: embree
display: "Embree"
description: "High-performance ray tracing kernels for Intel processors (HarmonyOS ARM64 port)"
category: gfx
homepage: "https://github.com/RenderKit/embree"
license: Apache-2.0
build_system: cmake

# HarmonyOS 适配要点
ohos_adaptation:
  key_points:
    - "必须使用静态库（-DEMBREE_STATIC_LIB=ON），动态库有 libc++ 链接问题"
    - "必须明确设置 ARM 架构和 NEON ISA，否则会编译 x86 SSE/AVX 代码"
    - "禁用 tutorials（-DEMBREE_TUTORIALS=OFF），glfw 不支持 HarmonyOS"
    - "使用 INTERNAL tasking system 避免依赖 TBB"
  common_dependencies: []

# 版本索引
versions:
  "4.4.1":
    status: published
    build_date: "2026-06-09"