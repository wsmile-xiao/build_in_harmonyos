# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: embedlog/0.7.2
homepage: "https://embedlog.bofc.pl"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（源码声明：6 个测试分组源文件注册 173 个 mt_run 测试函数，
# 展开为 30885 条 TAP 断言；可执行程序 1 个（tst/test），test_wrapper 仅为其 LD_PRELOAD
# libfaketime 包装脚本，非独立可执行用例）
upstream_tests:
  - file: tst/test-el-options.c
    source: embedlog-0.7.2/tst/test-el-options.c
    description: "选项 API 测试组（27 个 mt_run 注册项：init/cleanup/Option 枚举）"
    command: "./test"
  - file: tst/test-el-print.c
    source: embedlog-0.7.2/tst/test-el-print.c
    description: "打印/格式化测试组（31 个 mt_run 注册项：el_print/el_puts/颜色/时间戳）"
    command: "./test"
  - file: tst/test-el-file.c
    source: embedlog-0.7.2/tst/test-el-file.c
    description: "文件输出与轮转测试组（77 个 mt_run 注册项：EL_FPATH/rotate/date_rotate/权限）"
    command: "./test"
  - file: tst/test-el-perror.c
    source: embedlog-0.7.2/tst/test-el-perror.c
    description: "错误输出测试组（3 个 mt_run 注册项：el_perror）"
    command: "./test"
  - file: tst/test-el-pmemory.c
    source: embedlog-0.7.2/tst/test-el-pmemory.c
    description: "内存转储测试组（19 个 mt_run 注册项：el_pmemory/ascii 表格）"
    command: "./test"
  - file: tst/test-el-pbinary.c
    source: embedlog-0.7.2/tst/test-el-pbinary.c
    description: "二进制输出测试组（16 个 mt_run 注册项：el_pbinary）"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：el_init/el_puts/el_flush/el_cleanup 公开 API 实际调用"
    command: "./test_embedlog"

# 测试断言总数 (make check TAP 总计; 仅上游非无效枚举)
assertion_count: 30885