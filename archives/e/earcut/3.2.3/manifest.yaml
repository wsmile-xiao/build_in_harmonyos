# 版本级 manifest — earcut 3.2.3
# mapbox/earcut.hpp：单文件 header-only 多边形三角剖分库（earcut.js C++ 移植）
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: earcut
version: "3.2.3"
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源：github.com/mapbox/earcut.hpp tag v3.2.3）
  url: "https://github.com/mapbox/earcut.hpp/archive/refs/tags/v3.2.3.tar.gz"
  # 官方 tag tarball SHA-256（本地经 ghfast.top 镜像原样拉取官方 archive 后实测）
  sha256: "e40bac21c47fc8bb56779a1754e16b3cb692e03ff8dd1c4c87ac9c5113a22f72"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  configure_options:
    - "-DEARCUT_BUILD_TESTS=OFF"
    - "-DEARCUT_BUILD_BENCH=OFF"
    - "-DEARCUT_BUILD_VIZ=OFF"

  # 编译依赖列表（header-only 无第三方依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-guard-fixtures-fetchcontent.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "earcut 3.2.3 是 mapbox/earcut.hpp 单文件 header-only 库（include/mapbox/earcut.hpp，1207 行），无任何第三方运行时依赖（ref: README.md）"
  - "v3.2.3 API 已现代化：mapbox::earcut<N>(poly) 直接返回 std::vector<N> indices（旧版 2.x 为 earcut(indices, poly) 双参调用）；另有可选 mapbox::refine(triangles, coords) Delaunay 后处理（ref: notes.md）"
  - "上游 CMake 为 INTERFACE 库 earcut_hpp，install include/mapbox + earcut_hpp-config.cmake（命名空间 earcut_hpp::earcut_hpp）；配方 package_info 需对齐 cmake_file_name=earcut_hpp / cmake_target_name=earcut_hpp::earcut_hpp（ref: E322）"
  - "上游测试依赖 FetchContent 拉取 earcut.js v3.2.3 fixtures（59 个，运行时读 JSON）+ picojson v1.3.0 + googletest v1.15.2；本机 GitHub 直连不可达，可用 ghfast.top 镜像拉官方 tag tarball + FETCHCONTENT_SOURCE_DIR_* 本地化构建（knowledge_ref: knowledge/drafts/E345-draft-7657.kv）"
  - "上游测试注册 69 个用例（10 TEST + 1 TEST_P 套件 59 参数），全量通过率 69/69=100%（ref: reports/test-report.md）"
