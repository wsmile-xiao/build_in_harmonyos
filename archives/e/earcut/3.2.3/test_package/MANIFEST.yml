# test_package/MANIFEST.yml
# 上游官方测试声明文件（earcut 3.2.3）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: earcut/3.2.3
homepage: "https://github.com/mapbox/earcut.hpp"

# 上游测试命令（CMake + CTest / gtest）
upstream_check_command: "cmake -DEARCUT_BUILD_TESTS=ON -DEARCUT_BUILD_BENCH=OFF -DEARCUT_BUILD_VIZ=OFF . && make && ctest"

# conanfile.py build() 方法中是否已集成上游测试
# （库为 header-only INTERFACE 目标，无需编译；上游测试依赖 FetchContent 拉取
#   earcut.js fixtures / googletest，由 CI 在验证阶段独立执行）
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir <build> -R earcut_tests"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cpp
    source: earcut.hpp-3.2.3/test/test.cpp
    description: "gtest 全量套件：EarcutAreaTest.EarcutTriangulation(59 fixture 参数)、EarcutBasicTest.EmptyInput、EarcutTypedInput.Short/Int/Double、EarcutRefine.*x5、EarcutTiles.ZeroDeviation"
    command: "./tests"
  - file: test/bench.cpp
    source: earcut.hpp-3.2.3/test/bench.cpp
    description: "性能基准（google/benchmark，非正确性用例，本适配关闭 EARCUT_BUILD_BENCH）"
    command: "./bench"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_earcut.cpp
    description: "消费者冒烟：方形+洞三角剖分，8 三角形、面积守恒 84==84（R34 真实调用 earcut API）"
    command: "./test_earcut"
  - file: test_earcut_ohos.cpp
    description: "HarmonyOS 专项（3 用例）：瓦片级大坐标/共线退化/70000 顶点 uint32 索引"
    command: "./test_earcut_ohos"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 gtest：69 个已注册用例全部通过；test_package：2 个可执行程序共 4 组断言场景
assertion_count: 69
