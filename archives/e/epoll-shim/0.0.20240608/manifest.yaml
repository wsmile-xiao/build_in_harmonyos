knowledge_gained:
  - "OHOS 无 kqueue，epoll-shim 构建为 header-only INTERFACE 库（直接使用内核原生 epoll）"
  - "BUILD_TESTING=True 编译并运行上游 CTest（166 测试），32 个失败为 kqueue 语义与 OHOS 原生 epoll 行为差异（非编译问题）"
  - "signalfd 阻塞读取测试在 OHOS 上会挂起（信号传递机制差异），需 CTEST_TIMEOUT=30 + -E 排除"
  - "self.run(ctest, ignore_errors=True) 允许行为差异测试失败但不阻塞 conan create"
  - "CI build_and_test.sh 预下载正则在 URL 连字符处截断（gh-proxy.com → https://gh），需将 tarball 放置在截断路径"
