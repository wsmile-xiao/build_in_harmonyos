# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: epoll-shim/0.0.20240608
homepage: "https://github.com/jiixyj/epoll-shim"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --timeout 30"

# 上游实际运行的测试程序 (epoll-shim 使用 ATF/microatf 框架)
upstream_tests:
  - file: test/epoll-test.c
    source: epoll-shim-0.0.20240608/test/epoll-test.c
    description: "epoll API 功能测试 (ATF)"
    command: "./epoll-test"
  - file: test/tst-epoll.c
    source: epoll-shim-0.0.20240608/test/tst-epoll.c
    description: "epoll 操作系统验证测试"
    command: "./tst-epoll"
  - file: test/timerfd-test.c
    source: epoll-shim-0.0.20240608/test/timerfd-test.c
    description: "timerfd 功能测试 (ATF)"
    command: "./timerfd-test"
  - file: test/signalfd-test.c
    source: epoll-shim-0.0.20240608/test/signalfd-test.c
    description: "signalfd 功能测试 (ATF)"
    command: "./signalfd-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: epoll_create1 + epoll_ctl + epoll_wait 基本流程"
    command: "./test_epoll_shim"

# 测试断言总数 (近似值)
assertion_count: 10
