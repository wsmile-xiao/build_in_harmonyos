# test_package/MANIFEST.yml
package: exult/1.12.1
homepage: "https://exult.info/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Exult 1.12.1 declares no upstream tests directory, TESTS, or check_PROGRAMS.
# The upstream recursive check target was executed separately and recorded as a
# build-system check, not counted as an upstream test case.
upstream_tests: []
upstream_check:
  command: "make check"
  result: passed
  registered_test_count: 0

# Consumer-side test invokes all three installed executables and validates their documented behavior.
test_package_tests:
  - file: test.sh
    description: "Consumer smoke test for exult, expack, and ipack; ipack's documented exit code 1 is checked explicitly."
    command: "sh test.sh"

assertion_count: 3
