# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: etl/1.5.5
homepage: "http://synfig.org/"

# ETL is a header-only library; the upstream "make check" target
# is a no-op (no compiled test binaries in the source tree).
# The upstream test verification is done through the test_package
# consumer test which exercises the ETL handle template.

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# ETL has no compiled test binaries; testing is done via header inclusion
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: verifies ETL handle smart pointer template (creation, copy, reset, value access)"
    command: "./test_etl"

# 测试断言总数 (近似值, 用于质量评估)
# 4 assert() calls in test.cpp
assertion_count: 4
