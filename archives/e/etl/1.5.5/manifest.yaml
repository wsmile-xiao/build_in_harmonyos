# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.5.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.5.5"

software: "etl"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-21"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL — official GitHub release from synfig project
  url: "https://github.com/synfig/synfig/releases/download/v1.5.5/ETL-1.5.5.tar.gz"

  # 源码校验和
  sha256: "570c898f1c976fac3026866d718ea3f48f8bce1b232ed8cbedc65921c4e3cc25"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # ETL is header-only with no external dependencies
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
