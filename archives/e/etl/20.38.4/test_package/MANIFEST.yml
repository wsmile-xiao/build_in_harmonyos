# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: etl/20.38.4
homepage: "https://www.etlcpp.com"

# 上游测试命令 (etl header-only：上游自带 test/ 目录，用 make 编译运行；本版本不启用)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（etl 测试框架为自研 main，断言在编译期与运行期执行）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_etl.cpp
    description: "编译期断言 (etl::array/optional) + 运行期容器/optional/string 使用验证"
    command: "./test_etl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10