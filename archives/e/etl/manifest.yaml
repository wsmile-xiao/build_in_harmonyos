# 软件级 manifest — etl (Embedded Template Library)
# 遵循 ARCHIVE-SPEC v3.0

software: etl
display: "ETL (Embedded Template Library)"
description: "A C++ template library for embedded applications (containers, algorithms, and utilities compatible with C++ standards)"
category: library
homepage: "https://www.etlcpp.com"
license: MIT

build_system: cmake

# OHOS 适配知识（跨版本通用，本版本归档时补充）
ohos_adaptation:
  key_points:
    - "etl 为 header-only C++ 模板库（package_type=header-library），仅需拷贝 include/etl 头文件与 LICENSE"
    - "无编译步骤，无运行依赖，头文件为标准 C++（C++03 兼容子集），OHOS 上无平台差异"
  common_dependencies: []

# 版本索引
versions:
  "20.38.4":
    status: built
    build_date: "2026-08-30"
