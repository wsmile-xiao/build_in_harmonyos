# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ethtool/6.15
homepage: "https://mirrors.edge.kernel.org/pub/software/network/ethtool/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ethtool's make check runs test-cmdline (command-line parsing test)
# and test-features (when netlink is disabled)
upstream_tests:
  - file: test-cmdline.c
    source: ethtool-6.15/test-cmdline.c
    description: "Command-line parsing test"
    command: "make check"
  - file: test-features.c
    source: ethtool-6.15/test-features.c
    description: "Feature parsing test (only when netlink disabled)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "Consumer test: verify ethtool --version runs"
    command: "ethtool --version"

# 测试断言总数 (近似值)
assertion_count: 1
