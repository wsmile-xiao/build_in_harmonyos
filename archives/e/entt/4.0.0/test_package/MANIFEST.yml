# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: entt/4.0.0
homepage: "https://github.com/skypjack/entt"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试需 gtest 依赖，通过 ENTT_FIND_GTEST_PACKAGE=ON + conan gtest/1.17.0 运行
# conanfile.py 不内置上游测试（header-only 包），测试在独立构建目录运行
upstream_test_in_build: false
upstream_test_command: "cmake -DENTT_BUILD_TESTING=ON -DENTT_FIND_GTEST_PACKAGE=ON .. && make -j && ctest -j"
upstream_test_result:
  status: "PASS"
  total_suites: 15
  total_cases: 1541
  passed: 1541
  failed: 0
  disabled: 137
  note: "137 disabled tests use upstream DISABLED_ prefix (expected, not env limitation)"

# 上游测试套件（GoogleTest 框架，126 个 .cpp 源文件，15 个 ctest 套件）
