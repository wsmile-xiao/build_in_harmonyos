name: ExtUtils-Depends
description: |
  Easily build XS extensions that depend on XS extensions. This module tries
  to make it easy to build Perl extensions that use functions and typemaps
  provided by other perl extensions. It provides a mechanism for XS modules
  to share their headers, typemaps, and dependency information.

website: https://metacpan.org/pod/ExtUtils::Depends
source_url: https://cpan.metacpan.org/authors/id/E/ET/ETJ/ExtUtils-Depends-0.8002.tar.gz

category: perl

versions:
