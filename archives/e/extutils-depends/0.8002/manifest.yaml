name: ExtUtils-Depends
version: 0.8002
category: perl
description: |
  Easily build XS extensions that depend on XS extensions. This module tries
  to make it easy to build Perl extensions that use functions and typemaps
  provided by other perl extensions. It provides a mechanism for XS modules
  to share their headers, typemaps, and dependency information.

website: https://metacpan.org/pod/ExtUtils::Depends
source_url: https://cpan.metacpan.org/authors/id/E/ET/ETJ/ExtUtils-Depends-0.8002.tar.gz

# 编译信息
build:
  system: perl
  configure_options: []
  build_dependencies:
    - perl 5.42.0
    - ExtUtils::MakeMaker 7.44
  test_status: passed

# 预编译包信息
package:
  format: tar.gz
  platform: ohos-aarch64
  files:
    - lib/ExtUtils/Depends.pm (Perl 模块)
  notes: |
    纯 Perl 模块预编译包，无需 ELF 签名。

    安装方式：
    - 通过 cmd-pkgs 公共安装脚本部署到 ~/usr/local
    - 或手动复制到 Perl 的 lib 目录

# 状态
status: published

# 鸿蒙适配
ohos:
  adapted: true
  tested_features:
    - 模块加载
    - 依赖管理功能
    - typemap 合成
    - WriteMakefile 辅助
  known_issues: []

# 功能验证
verification:
  date: 2026-06-10
  status: passed
  conclusion: 可用于生产环境
  details:
    - 测试项: 模块加载
      status: passed
      note: 纯 Perl 模块，可直接加载
    - 测试项: 依赖管理
      status: passed
      note: 测试套全部通过（46 tests）
    - 测试项: save_config
      status: passed
      note: save/load 功能正常

# 编译历史
versions:
