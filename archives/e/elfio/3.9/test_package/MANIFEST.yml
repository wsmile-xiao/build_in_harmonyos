# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: elfio/3.9
homepage: "https://github.com/serge1/ELFIO"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游测试位于 git tag Release_3.9 tests/ 目录，使用 Boost unit_test_framework
upstream_check_command: "cmake --build build -DBUILD_TESTS=ON && ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 官方 release tarball (elfio-3.9.tar.gz) 不含 tests/ 目录（仅 examples/）。
# tests/ 仅存在于 git tag Release_3.9：ELFIOTest.cpp + ELFIOTest1.cpp + ELFIOTest2.cpp，
# 共 36 个独立上游用例 (BOOST_AUTO_TEST_CASE)，完整枚举台账见 docs/upstream-test-ledger.md（随 PR 交付）。
# 构建依赖 Boost unit_test_framework（本地无头文件、远端 registry 下载失败 → 硬阻塞，未运行）。
upstream_tests:
  - file: tests/ELFIOTest.cpp
    source: elfio-3.9/tests/ELFIOTest.cpp
    description: "13 independent test cases (load32/64, hello_*, test_ppc, test_dummy_out_*, test_dynamic_64_*)"
    command: "./ELFIOTest"
  - file: tests/ELFIOTest1.cpp
    source: elfio-3.9/tests/ELFIOTest1.cpp
    description: "16 independent test cases (write_obj, write_exe, elf_object_copy, section_header_address_update, elfio_copy, elf_exe_copy, get_symbol, null_section, invalid_file, rearrange_local_symbols, detect_mismatched, modinfo, array, init_array, test_hex)"
    command: "./ELFIOTest"
  - file: tests/ELFIOTest2.cpp
    source: elfio-3.9/tests/ELFIOTest2.cpp
    description: "7 independent test cases (elf_exe_loadsave_ppc32big3, elf_exe_copy_32/64, read_write_arm_elf32, modinfo, elf_object_copy variants)"
    command: "./ELFIOTest"

# 样例/基准（非独立上游用例，仅功能演示）
upstream_examples:
  - file: examples/writer/writer.cpp
    description: "Creates an ELF executable file, verifies ELFIO write API (sample)"
  - file: examples/elfdump/elfdump.cpp
    description: "Dumps ELF file contents, verifies ELFIO read API (sample)"
  - file: examples/anonymizer/anonymizer.cpp
    description: "ELF section anonymizer sample"
  - file: examples/add_section/add_section.cpp
    description: "Adds a section to an ELF file (sample)"

# 测试 fixture（非独立用例，供 ELFIOTest 读取的 ELF 样本文件）
upstream_fixtures:
  description: "54 files under tests/elf_examples/ (64bitLOAD.elf, arm_v7m_*, asm, crash.elf, ctors, hello_*, ls, main, ppc-*, mismatched_segments.elf, read_write_arm_elf32, ...)"
  count: 54

# 测试构建脚本与目标
upstream_scripts:
  - file: tests/CMakeLists.txt
    description: "CMake build for ELFIOTest (needs find_package(Boost REQUIRED COMPONENTS unit_test_framework))"
  - file: tests/Makefile.am
    description: "automake build for ELFIOTest; TESTS=runELFtests"
  - file: tests/configure.ac
    description: "autotools configure for ELFIOTest"
  - file: tests/runELFtests
    description: "shell wrapper: cd dir; ./ELFIOTest"

# test_package 中自带的测试 (消费者视角验证，实际编译运行通过)
test_package_tests:
  - file: test_elfio.cpp
    description: "Creates an ELF file, reads it back, and validates ELFIO API behavior (class, encoding, machine, sections)"
    command: "./test_elfio"

# 测试断言总数
assertion_count: 36