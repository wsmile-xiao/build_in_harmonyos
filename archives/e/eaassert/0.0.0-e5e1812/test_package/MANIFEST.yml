# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: eaassert/0.0.0-e5e1812
homepage: "https://github.com/electronicarts/EAAssert"

# 上游测试命令 (CMake 工程 EAASSERT_BUILD_TESTS=ON 提供)
upstream_check_command: "cmake -DEAASSERT_BUILD_TESTS=ON .. && cmake --build . && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (本地 OHOS 适配验证结果, 见 notes.md)
upstream_tests:
  - file: test/TestEAAssert.cpp
    source: EAAssert-e5e1812/test/TestEAAssert.cpp
    description: "EAAssert C++ 用户测试源: EAMain 注册的断言语义用例 (EA_ASSERT/EA_ASSERT_M/EA_ASSERT_MSG/EA_ASSERT_FORMATTED/EA_FAIL/EA_FAIL_MSG/EA_FAIL_FORMATTED/表达式副作用回归), 构建为 EAAssertTest 实际运行全部通过 (RETURNCODE=0)"
    command: "./EAAssertTest"
  - file: test/TestEAAssertC.c
    source: EAAssert-e5e1812/test/TestEAAssertC.c
    description: "EAAssert C 用户测试源 (宏编译证明): 上游 CMake 未将 C 文件纳入构建目标 (仅 glob TestEAAssert.cpp), 未实例化; 本地以 C 编译器编译通过验证宏可编译"
    command: "clang -c TestEAAssertC.c"
  - file: test/CEntryPoint.cpp
    source: EAAssert-e5e1812/test/CEntryPoint.cpp
    description: "入口点辅助文件 (仅 include EAMain/EAEntryPointMain.inl 与 EATest/EASTLNewOperatorGuard.inl), 非独立测试用例"
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 仅用 EAAssert 公开头文件/公开 API/链接目标 (eaassert.h + SetFailureCallback/GetFailureCallback + libEAAssert) 在 OHOS PC 编译链接运行, 12 项断言全过"
    command: "./test_eaassert"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12