# 版本号
version: "0.0.0-e5e1812"

# 软件名
software: "eaassert"

# 编译状态
# published | built | failed | archived
# built = conan-verify 通过、本地 W3 编译验证通过（未 upload，upload 由 CI 合并后 release 流水线执行）
