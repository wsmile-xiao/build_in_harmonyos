# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源首选，镜像仅作 CI fallback）
  url: "https://github.com/electronicarts/EAAssert/archive/e5e181255de2e883dd1f987c78ccc42ac81d3bca.tar.gz"

  # 源码校验和（与 conandata.yml 一致，官方 tarball 实测）
