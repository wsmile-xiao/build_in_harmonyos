- "0002-cmake-min-version-3.5-test.patch"
- "0003-guard-commoncppflags.patch"
- "0004-guard-commoncppflags-test.patch"
- "0005-eabase-target-link.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "EA 系列库（EABase/EAAssert 等）公开头文件互相 include 构成 header-only 依赖链：上游裸链接目标名（target_link_libraries(EAAssert EABase)）在干净 Conan 构建无效，须 find_package(eabase) + eabase::eabase 桥接（补丁 0005）"
  - "header-only 依赖经 CMakeDeps 生成的 INCLUDE_DIRS 可能为空：配方 package_info 须 self.cpp_info.requires + 显式把依赖包 includedirs 绝对路径追加进本包 includedirs，消费者只链接本包即可 resolve 依赖头文件"
  - "上游 include() 子模块内 .cmake（CommonCppFlags 位于 EASTL 子模块）在 tarball 干净构建缺失：用 if(EXISTS ...) include() endif() 守卫（补丁 0003/0004）"
  - "CMake >= 4.x 拒绝 cmake_minimum_required < 3.5：提升到 3.5（补丁 0001/0002），复用 E103"
  - "OHOS musl libc 无 pthread_setaffinity_np：测试框架子模块用 sched_setaffinity 替代，复用 E211"
  - "知识路径 B：new_draft DRAFT-EA-headeronly-dependency-chain（.kv/.md 配对）"