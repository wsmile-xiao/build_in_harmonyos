# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: epstool/3.09
homepage: "https://github.com/ArtifexSoftware/ghostpdl"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# epstool has an epstest target but src/epstest.c is missing from the release tarball
upstream_check_command: "make -n epstest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 1. make epstest: src/epstest.c referenced in common.mak:205 but NOT present in tarball
# 2. --test-eps: runtime command (epstool.c:2237 epstool_test()) requires Ghostscript
# 3. --dump/--copy/--extract-postscript: functional commands, manually verified
upstream_tests:
  - file: src/epstest.c
    source: epstool-3.09/src/epstest.c
    description: "Upstream test binary (src/epstest.c missing from release tarball, cannot build)"
    command: "./epstest"
    status: missing
  - file: src/epstool.c
    source: epstool-3.09/src/epstool.c
    description: "--test-eps 命令: EPS合规性测试(epstool_test函数), 需Ghostscript运行时"
    command: "epstool --test-eps input.eps"
    status: blocked
    block_reason: "Ghostscript (gs) not installed in build environment"

# 上游功能命令手动验证结果 (2026-08-21, 详见 reports/test-report.md)
# 使用最小EPS测试文件逐一验证:
upstream_functional_tests:
  - command: "epstool --version"
    expected: "输出版本字符串"
    result: pass
    evidence: "epstool 3.09 2015-03-13"
  - command: "epstool --help"
    expected: "输出用法帮助"
    result: pass
    evidence: "完整输出版本+版权+用法+命令列表"
  - command: "epstool --dump --quiet sample.eps"
    expected: "DSC结构转储"
    result: pass
    evidence: "正确解析EPSF版本/BoundingBox(0 0 100 100)/prolog/trailer偏移"
  - command: "epstool --copy --quiet --output copied.eps sample.eps"
    expected: "复制EPS文件"
    result: pass
    evidence: "复制后文件内容完整保留(ASCII text, EPS头部正确)"
  - command: "epstool --extract-postscript --output out.ps sample.eps"
    expected: "从DOS EPS提取PostScript"
    result: pass
    evidence: "正确报告'not a DOS EPS file'(预期行为,纯文本EPS非DOS封装)"
  - command: "epstool --test-eps sample.eps"
    expected: "EPS合规性测试通过"
    result: skip
    evidence: "Failed to execute ghostscript error=2 (gs未安装)"

# test_package 中自带的测试 (消费者视角验证)
# R34: test.sh invokes epstool --help and checks version string
test_package_tests:
  - file: test.sh
    description: "运行 epstool --help 验证版本输出"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 5项功能命令PASS + 1项test_package断言 = 6
assertion_count: 6
