# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.1"

# 软件名
software: "erfa"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-21"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/liberfa/erfa/archive/refs/tags/v2.0.1.tar.gz"

  # 源码校验和
  sha256: "d5469fbd0b212b3c7270c1da15c9bd82f37da9218fc89627f98283d27b416cbf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--default-library=static"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autotools 在 HMDFS 上 config.status 失败 (E081)，源码目录创建临时子目录 confXXXXXX/subs1.awk 时 Permission denied"
  - "改用 meson 构建成功，meson test 2/2 通过"
  - "ERFA 是纯 C 库，无外部依赖（仅 libm，由系统提供）"
