# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: erfa/2.0.1
homepage: "https://github.com/liberfa/erfa"

# 上游测试命令 (用于 meson test --list 分析)
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t_erfa_c.c
    source: erfa-2.0.1/src/t_erfa_c.c
    description: "ERFA core library test suite"
    command: "./t_erfa_c"
  - file: t_erfa_c_extra.c
    source: erfa-2.0.1/src/t_erfa_c_extra.c
    description: "ERFA extra functions test (version, leap seconds)"
    command: "./t_erfa_c_extra"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: eraEpb2jd, eraDat, eraEra00, eraVersion API 调用"
    command: "./test_erfa"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
