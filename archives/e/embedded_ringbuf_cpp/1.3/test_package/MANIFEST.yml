# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI (build_and_test.sh L0e) 强制要求此文件存在
# 详见 docs/TEST_QUALITY_SPEC.md / docs/ADAPTATION_GUIDE.md
#
# ── 上游测试清点（N = 上游测试总数）────────────────────────────────
# 取数命令（两个面独立清点，取最大值）：
#   ① git clone --depth 1 https://github.com/wizard97/Embedded_RingBuf_CPP
#      git ls-tree -r --name-only HEAD          # 8 个文件，无 tests/ 目录
#   ② 源码包解压后 find . -iname '*test*' -o -iname '*spec*'
#      → 仅 examples_no_arduino/test.cpp 一个文件
# 差额归因：上游没有测试框架、没有 make check / ctest / meson test 入口，
#   唯一含 "test" 的文件是示例程序，且 include 了 tag 1.3 中不存在的
#   "RingBuf.h"，实测：
#     clang++ -std=c++17 -I . examples_no_arduino/test.cpp
#     → fatal error: 'RingBuf.h' file not found（rc=1，编译都过不了）
#   故 N = 0（四个口径同为 0：源码宏数 / 框架注册数 / assertion 数均无）。
# tag 1.3 == 上游 HEAD（5cd8410 "Update library.properties"），两面同源。
package: embedded_ringbuf_cpp/1.3
homepage: "https://github.com/wizard97/Embedded_RingBuf_CPP"

# 上游测试命令：不存在（无构建系统、无测试框架）
upstream_check_command: "none（上游无任何测试入口：无 tests/ 无 make check/ctest/meson test）"

# conanfile.py build() 集成的是「头文件消费者编译+运行探针」，不是上游测试
# （上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: "none"

# 上游实际运行的测试程序：无（N=0，归因见文件头）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，计入「鸿蒙特有测试」行，不进上游分母）
test_package_tests:
  - file: test.cpp
    source: archives/e/embedded_ringbuf_cpp/1.3/test_package/test.cpp
    description: "真实消费者实例化：第一个 include 即交付的 <RingBufCPP.h>，实例化 RingBufCPP<T,N> 跑读写/边界/回绕/peek/深拷贝/静态分配/RB_ATOMIC 共 12 个用例"
    command: "./test_embedded_ringbuf_cpp"

# 测试断言总数（消费者断言数，与上游用例数分栏不混用）
assertion_count: 249
