package: ephemeralpg/3.4
homepage: https://github.com/eradman/ephemeralpg

upstream_check_command: "ruby ./test_getsocket.rb"
upstream_test_in_build: false
upstream_test_command: "ruby ./test_getsocket.rb"
upstream_tests:
  - file: test_getsocket.rb
    source: ephemeralpg-3.4/test_getsocket.rb
    description: "Fetch a random unused port and ensure a new port is picked each time"
    command: "ruby ./test_getsocket.rb"

test_package_tests:
  - file: test_getsocket.py
    description: "Run getsocket and assert it prints a valid TCP port number"
    command: "python3 test_getsocket.py <package>/bin/getsocket"

assertion_count: 2
