software: ephemeralpg
display: "ephemeralpg"
description: "Run tests on an isolated, temporary PostgreSQL database"
category: database
homepage: "https://github.com/eradman/ephemeralpg"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "Minimal Makefile build: getsocket (C binary) + pg_tmp (sed-generated shell script)."
    - "No Conan link dependencies; PostgreSQL is a runtime-only dependency."
    - "STRIP=true passed to make and make install to avoid OHOS MAC rejecting stripped binaries."
    - "getsocket.c uses standard POSIX socket API, no OHOS patch required."
    - "Consumer test runs getsocket and asserts a valid TCP port is printed."
  common_dependencies: []

versions:
  "3.4":
    status: built
    build_date: "2026-08-20"
