# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: emacs-clang-complete-async/0.5
homepage: "https://github.com/Golevka/emacs-clang-complete-async"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 本软件无自带测试套件，仅有编译验证
upstream_tests:
  - file: Makefile
    source: emacs-clang-complete-async-0.5/Makefile
    description: "编译验证: make 成功构建 clang-complete 二进制"
    command: "make"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "验证 clang-complete 二进制已安装且可执行（检查无参数时的预期错误输出）"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
