# 软件级 manifest
# 文件位置: archives/e/emacs-clang-complete-async/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: emacs-clang-complete-async
display: "emacs-clang-complete-async"
description: "Emacs clang 异步代码补全后端（clang-complete 二进制，使用 libclang 解析 C/C++ 源码提供补全候选）"
category: utility
homepage: "https://github.com/Golevka/emacs-clang-complete-async"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "completion.h 缺少 #include <stdio.h>，需添加修复 FILE 类型未定义"
    - "LINE_MAX 需 _POSIX_C_SOURCE 定义（musl libc 默认不暴露）"
    - "使用系统 SDK 的 llvm-config 获取 libclang 的 cflags/ldflags"
    - "Makefile install target 不支持 DESTDIR，需在 conanfile.py package() 中手动安装"
    - "二进制需签名才能在 OHOS 上执行"
  common_dependencies: []
  # libclang/llvm-config provided by system SDK, not a Conan package

versions:
  "0.5":
    status: published
    build_date: 2026-08-14
