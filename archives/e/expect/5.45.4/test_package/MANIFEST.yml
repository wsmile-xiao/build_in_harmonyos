# test_package/MANIFEST.yml
# CI 脚本强制要求 test_package 中存在 .c/.cpp/.cc/.cxx/.sh/.py 测试源文件
package: expect/5.45.4
homepage: "https://core.tcl-lang.org/expect/index"

test_package_tests:
  - file: test_expect.sh
    description: "Smoke test: binary exists, puts, spawn echo, EXP_STTY handling"
    command: "bash test_expect.sh"

assertion_count: 4
