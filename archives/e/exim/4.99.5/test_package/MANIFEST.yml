# test_package/MANIFEST.yml — exim 4.99.5
# 上游官方测试声明文件 (CI L0e 强制要求)

software: exim
version: "4.99.5"
build_system: makefile
package_type: application

upstream_tests:
  # exim 的发布 tarball 不含测试套件；完整测试套件位于独立的
  # exim-test Git 仓库 (https://github.com/Exim/exim-test)，基于 Perl
  # runtest 驱动，需要配置好的 exim 运行环境 + fixture 邮件，不适用
  # 于 OHOS CI 环境。因此本配方不接入上游 runtest。
  - name: "exim-test runtest suite (upstream separate repo)"
    framework: "perl runtest"
    location: "https://github.com/Exim/exim-test (not in release tarball)"
    ohos_applicable: false
    reason: "需要独立测试仓库 + Perl 驱动 + 运行态 exim 配置 + fixture，OHOS CI 不适用"

recipe_tests:
  # 本配方 test_package/test.sh 实际执行被测 exim 二进制 (R34)：
  #   - exim --version : 校验版本号 == 4.99.5
  #   - exim -bV       : 打印编译内建配置，断言 OpenSSL TLS / Berkeley DB
  #                      / DANE 支持以及内建 transports(smtp)/routers(dnslookup)
  - name: "exim --version 版本断言"
    file: "test.sh"
    assertions: ["version line 含 'Exim version 4.99.5'"]
  - name: "exim -bV 编译特性断言"
    file: "test.sh"
    assertions: ["含 OpenSSL", "含 Berkeley DB", "含 DANE", "含 smtp transport", "含 dnslookup router"]
