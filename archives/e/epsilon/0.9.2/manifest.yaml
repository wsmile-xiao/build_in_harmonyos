knowledge_gained:
  - "epsilon 0.9.2 uses ancient config.guess (2008) that cannot detect HarmonyOS — must replace with automake-1.16 versions (E007)"
  - "configure script uses umask 077 + mktemp in cwd (./confXXXXXX) which fails on HMDFS setgid directories — must change to umask 022 + $TMPDIR (E097)"
  - "epsilon requires popt >= 1.7 for command-line parsing; popt/1.16 from Conan registry works"
  - "epsilon builds both a static library (libepsilon.a) and a command-line tool (epsilon); configure with --disable-mpi --disable-cluster to avoid extra deps"
  - "epsilon test suite is Perl-based (.t files) and not run by make check (dist_noinst_DATA, not TESTS)"

