# 软件级 manifest — epsilon
# 文件位置: archives/e/epsilon/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: epsilon
display: "EPSILON"
description: "Wavelet-based open source image compression library with multi-threading and MPI support"
category: compress
homepage: "https://sourceforge.net/projects/epsilon-project/"
license: LGPL-3.0-or-later

# ============================================================
# 构建信息
# ============================================================

build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Ancient config.guess/config.sub (2008) must be replaced with automake-1.16 OHOS-aware versions (E007)"
    - "configure uses umask 077 + mktemp in cwd which fails on HMDFS — patch to umask 022 + $TMPDIR (E097)"
    - "Requires popt >= 1.7 for command-line parsing (popt/1.16 from Conan)"
    - "Builds both static library (libepsilon.a) and CLI tool (epsilon)"
    - "Use --disable-mpi --disable-cluster to avoid MPI/cluster dependencies"

  common_dependencies:
    - popt

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.9.2":
    status: published
    build_date: 2026-08-20
