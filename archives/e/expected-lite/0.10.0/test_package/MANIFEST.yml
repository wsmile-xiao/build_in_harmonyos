# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: expected-lite/0.10.0
homepage: "https://github.com/nonstd-lite/expected-lite"

# 上游测试命令 (CTest: cpp11/cpp14/cpp17/cpp20 四个变体)
upstream_check_command: "ctest"

# conanfile.py build() 方法中已集成上游测试 (cmake.test())
upstream_test_in_build: true
upstream_test_command: "cmake --build build && ctest"

# 上游实际运行的测试程序 (lest 框架)
upstream_tests:
  - file: expected.t.cpp
    source: expected-lite-0.10.0/test/expected.t.cpp
    description: "期待类型核心 API 测试 (151 处 CASE, lest 注册 137 个独立用例)"
    command: "./expected-lite-cpp11.t --pass"
  - file: expected-main.t.cpp
    source: expected-lite-0.10.0/test/expected-main.t.cpp
    description: "注册/配置类隐蔽用例 (版本/编译器探测, [.] 标记不参与计分)"
    command: "./expected-lite-cpp11.t --list-tests"
  - file: expected-noexcept.t.cpp
    source: expected-lite-0.10.0/test/expected-noexcept.t.cpp
    description: "noexcept 定义探针, 无 lest 用例宏, 未纳入 CTest"
    command: ""

# test_package 中自带的测试 (消费者视角验证, HarmonyOS 专项)
test_package_tests:
  - file: test_expected_lite_harmonyos.cpp
    description: "HarmonyOS 专项测试: aarch64 平台断言 + OHOS libc (sysconf/getuid) 集成 + monadic 链"
    command: "./test_expected_lite_harmonyos"

# 测试断言总数 (上游 lest 断言 + 鸿蒙专项断言, 近似值)
assertion_count: 340