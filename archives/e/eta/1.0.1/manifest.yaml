software: eta
version: "1.0.1"
status: prepared
build_date: "2026-09-27"
build_system: makefile
conan_ref: "eta/1.0.1"

source:
  url: "https://github.com/aioobe/eta/archive/refs/tags/v1.0.1.tar.gz"
  sha256: "ccd41559dc12527d925ef32e22cd2c1e79428f3ec7a620ac9a74ed6be028d2e6"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: "OHOS llvm clang (tools.build:compiler_executables:c)"
  cxx: N/A

patches_applied:
  - "inline replace_in_file in conanfile.py build(): add '#include <sys/wait.h>' to src/eta.c — POSIX owns WEXITSTATUS in sys/wait.h; glibc and the OHOS musl sysroot expose it transitively via stdlib.h, vanilla musl does not"

artifacts:
  executables:
    - bin/eta
  documentation:
    - share/man/man1/eta.1
    - share/eta/doc/README.md

knowledge_gained:
  - "eta v1.0.1 is a single-tag release (the only tag on the upstream repo) of a small GPL-3.0 C progress monitor; the Conan package version matches the upstream tag version exactly."
  - "The upstream Makefile hardcodes CC = gcc; a command-line make CC=<compiler> assignment overrides it without patching, and the cross command carries --target/--sysroot."
  - "WEXITSTATUS is used in src/eta.c without its POSIX owning header <sys/wait.h>; it compiles on glibc and on the OHOS musl sysroot only because both expose the macro transitively via stdlib.h — the include patch removes that libc-specific dependency (same 'missing owning header' pattern as knowledge E336)."
  - "Source URL/SHA256 are defined directly in conanfile.py (no conandata.yml) to avoid the CI conandata.yml pre-download BUILD_DIR defect, following the xmodem precedent."
  - "eta shells out via popen() (hardcoded /bin/sh in musl) at runtime; availability of /bin/sh on the target device must be confirmed in the device round."

test_summary:
  upstream_case_count: 0
  test_package_assertion_count: 16
  local_cross_compile: "source compiles and links cleanly with OHOS clang 15.0.4 against the aarch64-linux-ohos sysroot, with and without the sys/wait.h include; the include is kept for POSIX conformance on vanilla musl"
  device_shadow_ci: "exit code 0; L0/L1/L2/L4/L5 all pass (L2 executed the installed binary); consumer test 16/16 PASS; popen()/bin/sh path verified working on device"
