# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: eta/1.0.1
homepage: "https://github.com/aioobe/eta"

# 上游无测试套件: 仓库只有 src/、docs/、Makefile,没有 test/ 目录,
# Makefile 也没有 test/check 目标。验证由下方消费者测试与
# OHOS musl 交叉编译(编译期即验证 libc 兼容性)承担。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "消费者测试: --help、单样本完成(100%/Done)、-w/-d/-s/-i 选项、以及错误路径(exit 1/3)共 16 项断言"
    command: "bash test.sh"

upstream_case_count: 0
test_package_assertion_count: 16
assertion_count: 16
