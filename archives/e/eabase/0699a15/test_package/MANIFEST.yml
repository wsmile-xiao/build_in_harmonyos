# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: eabase/0699a15
homepage: "https://github.com/electronicarts/EABase"

# 上游测试命令 (header-only, 测试套件由 EABASE_BUILD_TESTS=ON 的 CMake 工程提供)
upstream_check_command: "cmake -DEABASE_BUILD_TESTS=ON .. && cmake --build . && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (本地 OHOS 适配验证结果, 见 notes.md)
upstream_tests:
  - file: test/source/TestEABase.cpp
    source: EABase-0699a15/test/source/TestEABase.cpp
    description: "EABase C++ 用户测试源: TestEABase/TestEAResult/TestEAPlatform/TestEACompiler/TestEACompilerTraits/TestNullPtr/TestEAHave/TestEAAlignment/TestEAStdarg/TestEAUnits/TestEAInt128_t 共 11 个测试函数, EAMain 注册, 实际运行全部通过"
    command: "./EABaseTest"
  - file: test/source/TestEABaseC.c
    source: EABase-0699a15/test/source/TestEABaseC.c
    description: "EABase C 用户测试源: TestEABase/TestEAPlatform/TestEACompiler/TestEACompilerTraits 4 个测试函数, 独立 EAMain, 手动链接 EAMain 库实际运行全部通过"
    command: "./TestEABaseC"
  - file: test/source/TestEABaseSeparate.cpp
    source: EABase-0699a15/test/source/TestEABaseSeparate.cpp
    description: "EABase 独立编译检查源 (无运行断言, 验证 EABase 类型定义在无系统头环境下成立), 编译通过"
    command: "clang++ -c TestEABaseSeparate.cpp"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 仅用 EABase 安装后的公开头文件/公开类型/公开 API (eabase.h/earesult.h/eaunits.h) 编译链接运行"
    command: "./test_eabase"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 19