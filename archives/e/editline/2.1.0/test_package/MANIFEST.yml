# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: editline/2.1.0
homepage: "https://github.com/troglobit/editline"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: basic.c
    source: editline-2.1.0/test/basic.c
    description: "ASCII 编辑基础用例：插入、光标移动、kill、词移动、transpose、方向键、补全"
    command: "./basic"
  - file: utf8-move.c
    source: editline-2.1.0/test/utf8-move.c
    description: "UTF-8 多字节字符光标移动"
    command: "./utf8-move"
  - file: utf8-delete.c
    source: editline-2.1.0/test/utf8-delete.c
    description: "UTF-8 多字节字符删除"
    command: "./utf8-delete"
  - file: utf8-word.c
    source: editline-2.1.0/test/utf8-word.c
    description: "UTF-8 词移动/词删除"
    command: "./utf8-word"
  - file: utf8-wrap.c
    source: editline-2.1.0/test/utf8-wrap.c
    description: "UTF-8 行折行"
    command: "./utf8-wrap"
  - file: history.c
    source: editline-2.1.0/test/history.c
    description: "历史记录文件 round-trip（read_history/write_history 字节保真、容量填满、el_hist_size 动态调整）"
    command: "./history"
  - file: homeend.c
    source: editline-2.1.0/test/homeend.c
    description: "Home/End 键行首行尾移动"
    command: "./homeend"
  - file: wrap-tmux.sh
    source: editline-2.1.0/test/wrap-tmux.sh
    description: "tmux 驱动的真实终端折行脚本（无 tmux 环境时 SKIP）"
    command: "./wrap-tmux.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者用例：通过已安装公开头文件/API 调用 rl_initialize/el_hist_size/add_history/read_history/write_history 验证历史 round-trip"
    command: "./test_editline"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 28
