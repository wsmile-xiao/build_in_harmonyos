# 版本级 manifest
# 文件位置: archives/e/enchive/3.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.5"

# 软件名
software: "enchive"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-19"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/skeeto/enchive/releases/download/3.5/enchive-3.5.tar.xz"

  # 源码校验和
  sha256: "cb867961149116443a85d3a64ef5963e3c399bdd377b326669bb566a3453bd06"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # enchive has no configure step; built directly with make

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # enchive has no external dependencies (pure C, only libc)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# No patches needed — enchive compiles cleanly on OHOS with no modifications

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "enchive 是纯 C 加密归档工具 (ChaCha20+Curve25519+HMAC-SHA256), 无外部依赖, Makefile 构建, package_type=application"
  - "enchive Makefile 默认 CFLAGS=-ansi -pedantic -O3 是 GCC 导向的, OHOS clang 用 -O2 即可"
  - "enchive Makefile install 目标用 install/gzip 命令, OHOS 缺 install, 需在 package() 中直接 copy 二进制"
  - "enchive keygen 默认密钥路径 ~/.enchive/ 需 /data 访问权限, 测试时用 -p/-s 显式指定路径"
  - "enchive 无 make check 目标, 验证用 keygen→archive→extract 加解密往返测试"
