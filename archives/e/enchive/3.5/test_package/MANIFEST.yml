# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: enchive/3.5
homepage: "https://github.com/skeeto/enchive"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# enchive 的 Makefile 仅有 enchive/clean/install/uninstall/amalgamation 目标，无 check 目标
# 上游测试方式为 README 描述的手动验证（keygen→archive→extract round-trip）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# enchive has no formal test suite; the README describes manual verification
# (keygen → encrypt → decrypt round-trip), but no executable test files exist upstream
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "enchive --version smoke + keygen/encrypt/decrypt round-trip + fingerprint"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
