version: "3.27.01"
software: "Electronic Arts Standard Template Library"
status: built
build_date: "2026-09-25"
build_system: cmake

source:
  url: "https://github.com/electronicarts/EASTL/archive/refs/tags/3.27.01.tar.gz"
  sha256: "fce43bf443f5569b00a8deae735394ea0b16f6c3f96867a17ded50775ffcdd12"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "EASTL_BUILD_TESTS=ON"
    - "EASTL_BUILD_BENCHMARK=OFF"
  dependencies:
    - eabase/0699a15
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-test-framework-ohos-libc-portability.patch (EAThread test framework only)"
  - "0002-atomic-128-bit-feature-gate.patch (OHOS disables unsupported EASTL 128-bit atomic RMW API)"
  - "0003-test-atomic-weak-cas-spurious-failure.patch (upstream test retries permitted weak-CAS spurious failures)"
knowledge_gained:
  - "EASTL 3.27.01 uses CMake and requires EABase 0699a15."
  - "The upstream CTest suite uses six pinned Electronic Arts test-framework projects, fetched as checksummed source archives."
test_type: official
description: "Build static EASTL and execute its upstream CTest suite."
