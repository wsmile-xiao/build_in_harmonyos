package: eastl/3.27.01
homepage: "https://github.com/electronicarts/EASTL"

upstream_check_command: "cmake -DEASTL_BUILD_TESTS=ON .. && cmake --build . && ctest --test-dir test --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir test --output-on-failure"
upstream_tests:
  - file: test/source
    source: "EASTL 3.27.01 official release archive"
    description: "Official EASTLTest executable, built from all upstream test/source/*.cpp files and run through CTest test EASTLTestRuns; its weak compare-exchange checks retry permitted spurious failures."
    command: "ctest --test-dir <build>/test --output-on-failure"

test_package_tests:
  - file: test.cpp
    description: "CTest runs the end-to-end consumer test and the packaged official EASTLTest upstream runner on the OHOS target."
    command: "ctest --test-dir <build> --output-on-failure"
