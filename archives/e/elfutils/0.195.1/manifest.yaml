software: elfutils
version: "0.195.1"
build_system: autotools
status: built
build_date: "2026-09-23"
language: cpp
description: "ELF/DWARF 工具与库集合；0.195.1 起 libdebuginfod 为真实客户端库（0.195 为 dummy 空壳）"
homepage: https://sourceware.org/elfutils/
license: "GPL-3.0-or-later AND LGPL-3.0-or-later"
source:
  url: "https://sourceware.org/elfutils/ftp/0.195/elfutils-0.195.tar.bz2"
  sha256: "37629fdf7f1f3dc2818e138fca2b8094177d6c2d0f701d3bb650a561218dc026"

dependencies:
  - zlib/1.3.1.1
  - zstd/1.5.7
  - bzip2/1.0.8
  - xz/5.6.2
  - argp-standalone/1.5.0
  - musl-fts/1.2.7
  - musl-obstack/1.2.3
  - curl/8.15.0
  - json-c/0.18

patches_applied:
  - "0001-threadlib-conditional-error-h.patch"
  - "0002-eu-config-musl-portability.patch"

test_results:
  upstream: "elfutils 自带 tests/ 套件需宿主机原生 make check（含 root/服务端/网络用例），本包只交付客户端库、不构建 debuginfod 服务端，故未在 build() 内执行；功能覆盖由 test_package 承担"
  test_package: "27/27 断言（libelf+libdw 15 项 + 真实 libdebuginfod 12 项）"

knowledge_gained:
  - "libdebuginfod 无独立上游，是 elfutils 源码树 debuginfod/ 子目录的产物（SONAME libdebuginfod.so.1）"
  - "--enable-libdebuginfod=dummy 与 =yes 产出的 .so 同名同 SONAME：dummy 的 DT_NEEDED 只有 libc.so、18880 字节，debuginfod_begin() 恒返回 NULL+ENOSYS"
  - "libdebuginfod 真实库的外部依赖由 configure 的 PKG_CHECK_MODULES 探测（libcurl>=7.29.0、json-c>=0.11），必须提供 PKG_CONFIG_PATH（AutotoolsDeps）"
