sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/sourceware/elfutils/0.195/elfutils-0.195.tar.bz2"
    - "https://mirror.nju.edu.cn/sourceware/elfutils/0.195/elfutils-0.195.tar.bz2"
    - "https://sourceware.org/elfutils/ftp/0.195/elfutils-0.195.tar.bz2"
  sha256: "37629fdf7f1f3dc2818e138fca2b8094177d6c2d0f701d3bb650a561218dc026"
patches:
  # ⚠️ 这里的键必须与 conanfile.py 的 version 完全一致。
  # apply_conandata_patches 按 self.version 查表，键不匹配时**静默不应用任何补丁**
  # （0.195 → 0.195.1 递增时踩过：configure 照样过，直到编译 lib/xasprintf.c
  #  才因 musl 的 libintl 空桩报 incompatible integer to pointer conversion）。
  "0.195.1":
    - patch_file: "patches/0001-threadlib-conditional-error-h.patch"
      patch_description: "src/threadlib.c 无条件 include error.h；musl 无该头，改走上游既有的条件分支"
      patch_type: "portability"
    - patch_file: "patches/0002-eu-config-musl-portability.patch"
      patch_description: "lib/eu-config.h：_() 按 ENABLE_NLS 分叉（musl 的 libintl.h 是空桩）；program_invocation_short_name 别名到 BSD 的 __progname"
      patch_type: "portability"
