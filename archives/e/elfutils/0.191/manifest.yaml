package:
  name: elfutils
  version: "0.191"
  description: "elfutils - libelf for ELF parsing (OHOS)"
  homepage: "https://sourceware.org/elfutils/"
  license: "GPL-2.0-or-later"
  category: development

source:
  url: "https://sourceware.org/elfutils/ftp/0.191/elfutils-0.191.tar.bz2"
  sha256: "df76db71366d1d708365fc7a6c60ca48398f14367eb2b8954efc8897147ad871"

build:
  system: autotools
  configure_args:
    - "--build=aarch64-linux-gnu"
    - "--host=aarch64-linux-ohos"
    - "--disable-nls"
    - "--disable-debuginfod"
    - "--disable-libdebuginfod"
    - "--disable-backends"

test:
  upstream: "Only libelf is built; elfutils upstream tests require components unavailable on OHOS."
  test_package_functional: "test_elf.c links libelf and verifies elf_version(EV_CURRENT)"
  assertion_count: 1

conan:
  reference: "elfutils/0.191@ohpcd/stable"
  status: "built"

platform:
  os: "OHOS"
  arch: "armv8"
