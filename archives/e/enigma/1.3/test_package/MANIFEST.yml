# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: enigma/1.3
homepage: "https://metacpan.org/dist/Crypt-Enigma"

# 上游测试命令 (Perl ExtUtils::MakeMaker 测试体系)
# 上游包内仅 t/01.t 一个测试文件（plan tests => 1，模块加载烟雾测试），
# 由配方 build() 阶段真实执行，计数见包内 res/upstream_test_result.json。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test TEST_VERBOSE=1"

# 上游实际运行的测试程序（源码包审计结论，见 notes.md）
upstream_tests:
  - file: t/01.t
    source: Crypt-Enigma-1.3/t/01.t
    description: "上游官方测试：use Crypt::Enigma 加载检查（plan tests => 1）"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证，R34 实质调用被测包 API)
test_package_tests:
  - file: test_crypt_enigma.pl
    description: "Crypt::Enigma 真实 API 测试 18 断言：VERSION/默认反射体/新鲜对象语义/精确反射向量/大小写归一/非字母丢弃/steckerboard 生效与往返/非法反射体回退/setRotor 返回约定"
    command: "perl test_enigma.py (PERL5LIB 指向包内 lib/perl5)"
  - file: test_enigma.py
    description: "测试驱动：在包目录下步行定位 Crypt/Enigma.pm（缺失即失败），执行 .pl 并透传 TAP 输出与退出码"
    command: "python3 test_enigma.py <package_folder>"

# 测试断言总数（test_crypt_enigma.pl 内 check() 调用数，静态可数）
assertion_count: 18
