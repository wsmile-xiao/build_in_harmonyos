software: enigma
# 版本级 manifest
# 文件位置: archives/e/enigma/1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.3"

# 编译状态
# published | built | failed | archived
# 首轮工作树尚未经过真机验证，诚实标记为 built（验证通过未发布）。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-09"

# 构建系统类型（顶级字段，verify 需要）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/A/AL/ALIZTA/Crypt-Enigma-1.3.tar.gz"
  sha256: "e6f343c268d0a54eb403f9d9000470c557a933183df3bba53036a3e9cc90c587"
  tar_format: tar.gz

# 版本说明：任务口径包名 enigma 1.3 对应上游 CPAN 分发 Crypt-Enigma 1.3
# （模块 Crypt::Enigma，$VERSION='1.3'，作者 Alistair Francis）。
# CPAN 上不存在其他名为 enigma 且版本为 1.3 的上游（见 notes.md 审计）。

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  configure_options:
    - "perl Makefile.PL（ExtUtils::MakeMaker，无参数，零依赖）"
    - "make -j1（纯 Perl：仅复制 .pm 到 blib，无编译）"
    - "make test TEST_VERBOSE=1（上游官方测试 t/01.t，经 Test::Harness）"
    - "make install DESTDIR=<build destdir> 后 glob 拾取 Crypt/Enigma.pm"

  dependencies: []  # 零依赖：纯 Perl 模块，仅需真机基础环境的 perl + make

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-fix-cipher-rotor-setup.patch：修复 cipher() 转子装配（去掉多余空参数，使起始字母/ring/转子号与 setRotor 约定对齐）并将 _rotorObjects 初始化为 []（新鲜对象 getters 返回空而非崩溃）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Crypt-Enigma 1.3 为纯 Perl 模块：Enigma.pm（含全部 Rotor/Reflector 包）+ Makefile.PL + t/01.t（1 个用例）+ 4 个 examples 脚本 + README/Changes/MANIFEST"
  - "上游 1.3（1.4 亦同）存在装配缺陷：cipher() 调用 setRotor($name, , $start, $ring, $count) 多传一个空洞，导致转子号实际取到 ring 值（默认 0，校验失败返回 0），_rotorObjects 保持 undef，后续 _getRotorObjects 解引用崩溃（真机 line 283）；补丁去掉空洞并初始化 [] 后默认转子正确装配为 RotorI/Z/0/1、RotorII/A/0/2、RotorIII/A/0/3"
  - "补丁后精确向量（perl 5.42 实测）：cipher('HELLO')='ZPEZR'、cipher('AAAAA')='UIZBM'、cipher('A B-1C')='UVW'、stecker[A,B] 下 cipher('A')='E'；每次 cipher 按 _settings 重建转子故往返成立"
  - "getRotorNames/getStartLetters/getRingSettings 在新鲜对象上返回空列表（补丁后不再崩溃）；cipher() 后返回 3 个默认转子；setRotor 须按号升序安装，单个 setRotor(...,2) 会在索引 0 留 undef 空洞，测试按 1,2 顺序安装"
  - "setSteckerBoard/setReflector 直接更新运行对象，cipher 立即生效；非法 reflector 名回退 ReflectorB"
