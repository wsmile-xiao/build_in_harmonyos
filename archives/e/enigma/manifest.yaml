software: enigma
display: "enigma"
description: "二战 Enigma 密码机的纯 Perl 实现（上游 CPAN 分发 Crypt-Enigma，模块 Crypt::Enigma），零依赖"
category: perl
homepage: "https://metacpan.org/dist/Crypt-Enigma"
license: Artistic-1.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Perl 模块（Enigma.pm + Makefile.PL），ExtUtils::MakeMaker 构建，无 C/XS 代码"
    - "package() 用临时 DESTDIR + glob 拾取 Crypt/Enigma.pm 到 lib/perl5/"
    - "package_info() 置空 cpp_info.libs，经 PERL5LIB（runenv/buildenv）暴露模块"
    - "generate() 注入 TMPDIR=<build_folder>，规避鸿蒙 /tmp 只读（E002）"
    - "build() 解析 make test 真实输出落盘 res/upstream_test_result.json，test 阶段原样重发"
    - "零外部依赖：仅需真机基础环境的 perl + make（R36/L0i 自动通过）"
    - "无平台相关代码，无补丁；R26/R38/R40 均不适用（无 .so、无二进制、无平台域交点）"
  common_dependencies: []

versions:
  "1.3":
    status: built
    build_date: "2026-09-09"
    source_url: "https://cpan.metacpan.org/authors/id/A/AL/ALIZTA/Crypt-Enigma-1.3.tar.gz"
