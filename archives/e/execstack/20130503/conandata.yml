# conandata.yml — execstack 20130503
# Source: prelink 20130503 tarball (execstack is part of prelink package)
# 官方源 people.redhat.com 在 CI worker 上连接超时（不可达）。
# 唯一可用公共镜像: ftp.lysator.liu.se (瑞典), sha256 与官方源字节一致。
# Conan 2.x get() 支持 url 列表逐个尝试, 网络错误时 fallback 到下一个 URL。
# 注: file:// 本地兜底已移除 — Conan 对不存在的 file:// 路径抛出未捕获的
# FileNotFoundError (非网络错误), 不会触发 fallback 而是直接崩溃构建。

sources:
  url:
    - "https://ftp.lysator.liu.se/pub/void-ppc-sources/prelink-20130503/prelink-20130503.tar.bz2"
    - "https://people.redhat.com/jakub/prelink/prelink-20130503.tar.bz2"
  sha256: "6339c7605e9b6f414d1be32530c9c8011f38820d36431c8a62e8674ca37140f0"

patches:
  - patch_file: "patches/add-error-h.patch"
    patch_description: "Add minimal error.h replacement for musl/OHOS (GNU error() function not in musl libc)"
    patch_type: "portability"
