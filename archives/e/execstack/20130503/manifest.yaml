# 版本级 manifest
# 文件位置: archives/e/execstack/20130503/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "20130503"
software: "execstack"
status: built
build_date: "2026-08-24"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url:
    - "https://ftp.lysator.liu.se/pub/void-ppc-sources/prelink-20130503/prelink-20130503.tar.bz2"
    - "https://people.redhat.com/jakub/prelink/prelink-20130503.tar.bz2"
  sha256: "6339c7605e9b6f414d1be32530c9c8011f38820d36431c8a62e8674ca37140f0"
  tar_format: tar.bz2
  # 官方源 people.redhat.com 在 CI worker 不可达（连接超时）。
  # 唯一可用公共镜像: ftp.lysator.liu.se, sha256 与官方源字节一致。
  # file:// 本地兜底已移除: Conan 对不存在的 file:// 抛出 FileNotFoundError
  # (非网络错误, 不触发 fallback), 导致构建直接崩溃。

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies:
    - "elfutils/0.195"
    - "argp-standalone/1.5.0"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "add-error-h"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "musl libc lacks error.h — need minimal replacement with error() function"
  - "musl libc lacks argp.h — use argp-standalone/1.5.0 from Conan registry"
  - "prelink's gather.c uses GLOB_BRACE (glibc-only) — only build execstack target"
  - "configure's config.sub from 2002 doesn't recognize aarch64 — use aarch64-unknown-linux-gnu triplet"
  - "OHOS filesystem blocks umask 077 dirs in config.status — patch to umask 022"
