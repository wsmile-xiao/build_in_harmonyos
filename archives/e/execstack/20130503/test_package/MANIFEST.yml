# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: execstack/20130503
homepage: "https://people.redhat.com/jakub/prelink/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# prelink package has a testsuite/ directory but it requires prelink binary
# (not just execstack), so upstream tests are not applicable for execstack-only build
upstream_tests:
  - file: N/A
    source: "prelink-20130503/testsuite/"
    description: "Upstream testsuite requires prelink binary (not built, only execstack)"
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Invoke execstack --version via popen() to verify binary is functional"
    command: "./test_execstack"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
