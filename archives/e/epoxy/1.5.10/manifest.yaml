# 版本级 manifest — epoxy 1.5.10
version: "1.5.10"
software: epoxy
status: built
build_date: "2026-08-20"
build_system: meson

source:
  url: "https://download.gnome.org/sources/libepoxy/1.5/libepoxy-1.5.10.tar.xz"
  sha256: "072cda4b59dd098bba8c2363a6247299db1fa89411dc221c8b81b8ee8192e623"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dx11=false"
    - "-Dglx=no"
    - "-Degl=auto"
    - "-Dtests=false"
    - "-Ddocs=false"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-dispatch_common.c.patch"

knowledge_gained:
  - "OHOS 真机只有无版本号的 libEGL.so/libGLESv2.so/libGLESv3.so，没有 libEGL.so.1/libGLESv2.so.2/libGL.so.1/libOpenGL.so.0；epoxy 运行时 dlopen 名称需按 POSIX fallback 分支替换"
  - "OHOS libGLESv2.so 的 gl* 动态符号是 stub（调用返回 NULL），GL/GLES 函数必须经 eglGetProcAddress 解析；epoxy 的 gl_dlsym/gles1_dlsym/gles2_dlsym/gles3_dlsym 需在 OHOS 路由到 epoxy_get_proc_address"
  - "OHOS SDK sysroot 自带 EGL/GLES3/KHR 头（khronos 头齐全），meson 的 egl=auto 在 harmonyos 系统名上自动启用 EGL，无需外部依赖"
  - "OHOS 无 X11/GLX，meson 需 -Dx11=false（连带 glx=false），否则生成 glx_generated_dispatch.c 缺 <GL/glx.h> 编译失败"
  - "epoxy 是纯 meson 无外部依赖库，test_package 用 CMakeDeps 找 epoxy::epoxy，测试经 epoxy 派发表做真实 EGL/GLES3 生命周期（pbuffer 1x1，ES3 context，epoxy_gl_version()==32）"
  - "官方源 download.gnome.org 的 tar.xz basename 带 .tar.xz 扩展名，conan get() 按扩展名正确解压，无需显式 filename（E276 仅针对 codeload 无扩展名场景）"
