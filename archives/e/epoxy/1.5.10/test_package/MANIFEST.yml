# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: epoxy/1.5.10
homepage: https://github.com/anholt/libepoxy

# 上游 meson 测试套件需要 X11/真机 GL 上下文，OHOS 无 X11；配方以 -Dtests=false
# 构建，测试职责由 test_package 承担（R34 真实 API 调用）。
upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "真机 GL/EGL 派发: epoxy_has_egl()→eglGetDisplay→eglInitialize→eglBindAPI(ES)→eglChooseConfig(ES3)→eglCreatePbufferSurface(1x1,OHOS真机EGL1.4拒>=2px)→eglCreateContext(ES3)→eglMakeCurrent→epoxy_gl_version()>=30(经libGLESv2.so)→epoxy_is_desktop_gl()==false→epoxy_egl_version()>=14→release→destroy/terminate"
    command: "./test_epoxy"

# 15 项 EGL/GL dispatch 检查
assertion_count: 15
