software: epoxy
name: libepoxy
description: Modern libepoxy — GL/EGL function-pointer dispatch library (gtk+ dependency)
category: gfx
license: MIT
website: https://github.com/anholt/libepoxy

build_system: meson

ohos_adaptation:
  key_points:
    - "OHOS 无 X11/GLX：meson 传 -Dx11=false -Dglx=no，EGL 头/库来自 OHOS SDK sysroot"
    - "运行时 dlopen 名称补丁（0001/0002）：OHOS 只有无版本号 libEGL.so/libGLESv2.so/libGLESv3.so，无桌面 libGL.so.1/libOpenGL.so.0"
    - "OHOS libGLESv2.so 的 gl* 动态符号是 stub（调用返回 NULL），GL/GLES 函数必须经 eglGetProcAddress 解析"
    - "共享库按 HarmonyOS 要求 codesign（binary-sign-tool）"
  common_dependencies: []

versions:
  - version: "1.5.10"
    status: built
    compiled_at: "2026-08-20"
    notes: |
      - OHOS/aarch64 适配（gtk+ 3.24.38 依赖）
      - meson 共享库 libepoxy.so，dlopen 转发系统 EGL/GLES
      - 无外部依赖
    dependencies: []
    provides:
      - libepoxy.so
