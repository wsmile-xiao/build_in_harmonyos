# 版本级 manifest
# 文件位置: archives/{letter}/{name}/3.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.3"

# 软件名
software: epic5

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-20"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.epicsol.org/pub/epic/EPIC5-PRODUCTION/epic5-3.0.3.tar.xz"

  # 源码校验和
  sha256: "63a411215c14040b65b5d728aff10f7523d55e170f6298fb01e1cf958d79d326"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-ssl=<openssl pkg>"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/3.5.6.1.1
    - ncurses/6.4
    - libxcrypt/4.5.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/configure-umask-hmdfs.patch"
  - "patches/fix-null-nickname-crash.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 文件系统拒绝写入 umask 077 创建的 0700 权限临时目录（SELinux/HMDFS 限制），autoconf 2.72 生成的 configure 用 umask 077 创建 config.status 临时目录导致 'Permission denied'，需打补丁改为 umask 022"
  - "OHOS ncurses 包提供 libncursesw.a（wide-char），但 epic5 configure 检测 -lncurses（无 w 后缀），需在 generate() 中创建 libncurses.a → libncursesw.a 软链接使 AC_CHECK_LIB 通过"
  - "configure 检测 term.h 用 CPPFLAGS，但 make 编译用 CFLAGS，两者必须同时设置 -I{ncurses}/include，否则编译期报 'term.h file not found'"
  - "epic5 是 application（命令行 IRC 客户端），非库；package_info() 中 cpp_info.libs 为空，cpp_info.bindirs=['bin']"
  - "epic5 源码树不含 config.guess/config.sub（无 AC_CANONICAL_HOST），E007 风险不适用，configure 仅依赖 --host/--build 参数而非 config.guess 猜测"
  - "OHOS 环境 getpwuid(getuid()) 返回 NULL（uid 不在 /etc/passwd），导致 epic5 parse_args 中 strlcpy(nickname, get_string_var(DEFAULT_USERNAME_VAR)) 解引用 NULL → SIGSEGV；修复：NULL 检查 + 回退默认昵称"
  - "OHOS ptrace 受限无法使用 gdb 调试，改用渐进式 fprintf(stderr) 代码插桩法逐函数定位崩溃行"
