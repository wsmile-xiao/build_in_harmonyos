# 软件级 manifest — eclib
# 遵循 ARCHIVE-SPEC v2.0

software: eclib
display: "eclib (mwrank)"
description: "有理数域上椭圆曲线的算术 — 导子/Tate 算法、mwrank 求 Mordell-Weil 秩、模符号"
category: math
homepage: "https://github.com/JohnCremona/eclib"
license: GPL-2.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "configure **不看 pkg-config**，只认 `--with-ntl/pari/flint=<前缀>`（sage 的 spkg 也是这么传的）"
    - "`fatal error: 'gmp.h' file not found`：头文件里直接 `#include <gmp.h>`，而 gmp 是 flint/ntl 的**传递依赖**、configure 又没有 `--with-gmp` 开关 → 把所有依赖（含传递）的 include 目录前置进 CPPFLAGS"
    - "gmp 版本冲突（flint 钉 6.3.0、其余钉 6.3.0.1）→ force 到 6.3.0.1，只重建 flint 一个"
  common_dependencies:
    - pari
    - ntl
    - flint
    - gmp

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "20250627"
    status: built
    build_date: "2026-08-17"
    notes: "首个鸿蒙 PC conan 配方；真机 conan create + test_package 断言全过"
