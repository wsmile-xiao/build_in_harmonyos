# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: esniper/2.35.0
homepage: "https://sourceforge.net/projects/esniper/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# esniper 是纯命令行工具，根 Makefile.in 无 check/test 目标
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# esniper 上游无测试套件 — 它是一个命令行拍卖工具，源码树无 test/ 目录，
# 根 Makefile.in 无 check/test 目标，configure 无 --enable-tests 选项。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 上游无测试用例，适配后补全 3 项断言测试 (R34: 实质执行二进制并校验退出码/输出)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 执行 esniper 三个子命令并校验退出码与输出"
    command: "test.sh <esniper_bin>"
    assertions:
      - "esniper -v -> exit 0, 输出含 'version 2.35.0' (esniper.c:727 printVersion+exit(0))"
      - "esniper -h -> exit 1, 输出含 'usage:' (esniper.c:571 usage(USAGE_LONG))"
      - "esniper (无参) -> exit 1, 输出含 'no auctions specified' (esniper.c:780)"

# 测试断言总数 (近似值, 用于质量评估)
# 上游: 0 | 补全: 3 | 合计: 3
assertion_count: 3
upstream_assertion_count: 0
test_package_assertion_count: 3
