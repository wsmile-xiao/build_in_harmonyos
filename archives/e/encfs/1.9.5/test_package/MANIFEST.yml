package: encfs/1.9.5
homepage: "https://vgough.github.io/encfs/"

# encfs 1.9.5 上游测试：test/（Cipher_test.cpp/MemoryPool_test.cpp
# 用 gtest，unittests 目标）——Cipher_test 依赖 encfs 内部头文件
# （encfs/BlockNameIO.h 等）需源码树内编译，归档内无法独立编译
# （如实记录不伪造通过率）。消费测试：test_encfs.py——bin/encfs
# 可执行 + --version 1.9.5（2 断言）。
upstream_tests: 2
upstream_test_command: "test/ unittests（gtest，依赖 encfs 内部头文件需源码树内编译）"

test_package_tests:
  - file: test_encfs.py
    description: "消费测试：bin/encfs 可执行 + --version 1.9.5（2 断言）"
    command: "python3 test_encfs.py <package_folder>"

assertion_count: 2
