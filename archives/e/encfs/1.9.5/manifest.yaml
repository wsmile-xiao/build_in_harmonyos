software: encfs
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.9.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游 tag v1.9.5——用户给 1.9.5 存在，按真实版）
version: "1.9.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"

# 构建系统标识（verify-build 要求）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（codeload 官方）
  url: "https://codeload.github.com/vgough/encfs/tar.gz/refs/tags/v1.9.5"

  # 源码校验和
  sha256: "4709f05395ccbad6c0a5b40a4619d60aafe3473b1a79bafb3aa700b1f756fd63"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 构建系统标识（verify-build 要求）
  build_system: cmake

  # 配置选项列表（内置 tinyxml；不装 libencfs 库）
  configure_options:
    - "-DUSE_INTERNAL_TINYXML=ON"
    - "-DINSTALL_LIBENCFS=OFF"

  # 编译依赖列表（格式: name/version）——libfuse/openssl 制品仓均有
  dependencies:
    - "libfuse/3.18.2"
    - "openssl/3.5.6"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "encfs（FUSE 加密文件系统）CMake 构建，依赖 libfuse/3.18.2 + OpenSSL（制品仓均有）；tinyxml 内置 USE_INTERNAL_TINYXML 默认 ON 可绕过"
    - "encfs 上游写死 FUSE_USE_VERSION=29（fuse2 API），制品仓只有 libfuse3（要求 API>=30）——配方 patch 改 31 + fuse_operations 回调签名适配（getattr/readdir/rename/chmod/chown/truncate/utimens 增参、init 增 fuse_config*、fuse_unmount 双参→umount2、filler 4 参→5 参）——encfs 1.9.x 同时支持 fuse2/3，可用 libfuse3 绕过 libfuse2 缺失"
    - "上游测试 test/ 用 gtest（unittests 目标，Cipher_test/MemoryPool_test 纯计算无 FUSE 环境依赖，build 阶段 make unittests + ctest 实跑）；消费测试验证 bin/encfs + --version"
