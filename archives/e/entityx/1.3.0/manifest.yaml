# 版本级 manifest
# 文件位置: archives/e/entityx/1.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.0"

# 软件名
software: "entityx"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-19"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/alecthomas/entityx/archive/refs/tags/1.3.0.tar.gz"

  # 源码校验和
  sha256: "2cd56d4fc5c553b786b8caf0b5bd9231434f21d43ca0e963d3bc5ee503a06222"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DENTITYX_BUILD_TESTING=OFF"
    - "-DENTITYX_BUILD_SHARED=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-bump-cmake-min-version.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x dropped compat for cmake_minimum_required < 3.5, patched to 3.10"
  - "std::iterator deprecated in C++17 (profile uses cppstd=17), -Werror causes build failure; patched to remove -Werror and add -Wno-error=deprecated-declarations"
  - "entityx builds static lib libentityx.a with -DENTITYX_BUILD_SHARED=OFF"
  - "No external dependencies, pure C++11 (std::functional/std::vector)"
