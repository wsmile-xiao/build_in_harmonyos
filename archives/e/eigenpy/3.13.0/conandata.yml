sources:
  url: "https://files.pythonhosted.org/packages/source/e/eigenpy/eigenpy-3.13.0.tar.gz"
  sha256: "49d3cb46b85696baf5445ac707b48aade07c21579c188dfc1c8ad2f92e05fab5"
# eigenpy keeps jrl-cmakemodules as the cmake/ git submodule. The PyPI
# sdist carries .gitmodules but not the submodule contents, so configure would
# otherwise FetchContent the helper at build time. Pin the exact submodule
# commit recorded by upstream v3.13.0 for a reproducible Conan source step.
cmake_submodule:
  url:
    - "https://gh-proxy.com/https://github.com/jrl-umi3218/jrl-cmakemodules/archive/f07de7952b35caf1c7a53a49138772cb9c534cf5.tar.gz"
    - "https://codeload.github.com/jrl-umi3218/jrl-cmakemodules/tar.gz/f07de7952b35caf1c7a53a49138772cb9c534cf5"
  sha256: "e428b43dd2379fa1af64f48fc99d867b1deaa2dc97a6f6d50759f06a21cc0902"
# Official CI workers can provide Python headers without an installed NumPy
# module. The build only needs NumPy's generated C headers, so source() extracts
# them from the Python 3.12 aarch64 wheel and uses a tiny build-time stub solely
# for CMake's numpy.get_include()/__version__ probes.
numpy_headers:
  url: "https://files.pythonhosted.org/packages/a9/4b/a2b32dd94ee9ffbeecb28152240042a3949db33b1c834d44090b80e1b3b8/numpy-2.5.1-cp312-cp312-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl"
  sha256: "61ac47e772e6b8ea489e1d2f441a34c5c3ac17327e7ce294cbdf535795ad4e75"
  version: "2.5.1"
patches: {}
