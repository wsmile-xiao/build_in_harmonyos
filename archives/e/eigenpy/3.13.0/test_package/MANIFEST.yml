package: eigenpy/3.13.0
homepage: "https://github.com/stack-of-tasks/eigenpy"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure (deferred until native package build is stable)"

upstream_tests:
  - file: unittest/CMakeLists.txt
    source: eigenpy-3.13.0/unittest/CMakeLists.txt
    description: "CTest registry for about 20 compiled/import tests and 52 Python tests; SciPy/CHOLMOD/Accelerate subsets are disabled for first OHOS pass."
    command: "ctest --output-on-failure"

test_package_tests:
  - file: test_version.cpp
    description: "C++ consumer links libeigenpy and checks version APIs."
    command: "./test_version"
  - file: test_import.py
    description: "Python consumer imports eigenpy, checks version API, and exercises NumPy is_approx binding."
    command: "python3 test_import.py"

assertion_count: 9
