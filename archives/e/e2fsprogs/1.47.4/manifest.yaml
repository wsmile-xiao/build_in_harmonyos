software: e2fsprogs
version: "1.47.4"
status: built
build_date: "2026-08-12"

source:
  url: "https://github.com/tytso/e2fsprogs/archive/refs/tags/v1.47.4.tar.gz"
  sha256: "9f82eaa7002673291629077b80ee005cadfcd49854907a22007fed70b0ef596e"
  tar_format: tar.gz

build:
  system: autotools
  configure_options: "--build=aarch64-unknown-linux-ohos --host=aarch64-unknown-linux-ohos"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0003-configure.patch"
  - "0004-misc-fsmap.h.patch"

knowledge_gained:
  - "1.47.4 自带 config.sub(2025-07-10) 已原生认 ohos triplet（0002 不再需要）；config.guess 仍不认 HarmonyOS，改在 generate() 显式 --build/--host=aarch64-unknown-linux-ohos 跳过 config.guess（0001 不再需要）"
  - "conan 的 patch-ng 不接受 GNU patch 式 offset/fuzz——0001 在 1.47.4 上被拦；且 GNU patch 干跑'成功'会把旧分支插成重复块污染验证用源码树，验补丁须对纯净树逐次重解压"
  - "configure 的 mktemp umask 077 在 HMDFS 上建的临时目录不可用，须放宽为 022（0003 补丁按 1.47.4 行号重生成）"
  - "HMDFS 不支持硬链接，Makefile 的 LN 定义改为 cp -a（conanfile build() 内 sed 处理）"
  - "OHOS sysroot 的 linux/fsmap.h 定义了 FS_IOC_GETFSMAP，misc/fsmap.h 的 inline 函数须移出条件编译块（0004）"

patch_classification:
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-misc-fsmap.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
