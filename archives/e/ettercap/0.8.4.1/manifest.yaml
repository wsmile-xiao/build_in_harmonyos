# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS CMAKE_SYSTEM_NAME=HarmonyOS 不被 EttercapOSTest.cmake 识别，需添加为 Linux 变体"
  - "Conan CMakeDeps 拦截 find_package(OpenSSL/ZLIB)，设置小写变量名，需兼容处理"
  - "OHOS libc.so 不导出 pthread_cancel/testcancel/setcancelstate/type，需从 libc.a 提取桩库"
  - "OHOS sysroot linux/netfilter_ipv4.h 与 sys/socket.h 的 sockaddr_storage 重定义冲突"
  - "Conan ncurses 提供宽字符版 libncursesw.a/libformw.a/libpanelw.a/libmenuw.a"
  - "libettercap 必须改为 STATIC，因 OHOS pthread 符号不在 libc.so 中"
  - "Conan bison 包未设置 BISON_PKGDATADIR，需手动设置"

