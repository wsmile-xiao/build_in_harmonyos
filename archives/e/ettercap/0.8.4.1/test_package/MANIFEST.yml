# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ettercap/0.8.4.1
homepage: "https://ettercap.github.io/"

# ettercap uses CMake ENABLE_TESTS option (OFF by default, requires libcheck)
# Upstream tests are unit tests for internal functions, not applicable to
# cross-compilation (require running on target).
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ENABLE_TESTS=ON 时)
upstream_tests:
  - file: tests/
    source: ettercap-0.8.4.1/tests/
    description: "Unit tests requiring libcheck (not enabled in OHOS build)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ettercap.sh
    description: "Smoke test: run ettercap/etterfilter/etterlog --version"
    command: "bash test_ettercap.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
