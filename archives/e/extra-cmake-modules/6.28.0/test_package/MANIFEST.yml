# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: extra-cmake-modules/6.28.0
homepage: "https://invent.kde.org/frameworks/extra-cmake-modules"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (87 个 ctest 测试，列出代表性测试)
upstream_tests:
  - file: tests/ECMSetupVersion/
    source: extra-cmake-modules-6.28.0/tests/ECMSetupVersion/
    description: "ECMSetupVersion 宏测试（版本号生成、头文件生成）"
    command: "ctest -R ecm_setup_version"
  - file: tests/ECMGeneratePkgConfigFile/
    source: extra-cmake-modules-6.28.0/tests/ECMGeneratePkgConfigFile/
    description: "ECMGeneratePkgConfigFile 宏测试（pkg-config 文件生成）"
    command: "ctest -R ecm_generate_pkgconfig"
  - file: tests/ECMGenerateExportHeader/
    source: extra-cmake-modules-6.28.0/tests/ECMGenerateExportHeader/
    description: "ECMGenerateExportHeader 宏测试（导出头文件生成）"
    command: "ctest -R ecm_generate_export_header"
  - file: modules/ECMSetupVersion.cmake
    source: extra-cmake-modules-6.28.0/modules/ECMSetupVersion.cmake
    description: "ExecuteCoreModules — 核心模块执行验证"
    command: "ctest -R ExecuteCoreModules"
  - file: find-modules/
    source: extra-cmake-modules-6.28.0/find-modules/
    description: "FindModules — 查找模块验证"
    command: "ctest -R FindModules"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/test_ecm.sh
    description: "消费者测试：验证 find_package(ECM) + ECMSetupVersion/ECMGenerateExportHeader 宏可用"
    command: "sh test_ecm.sh"

# 测试断言总数
assertion_count: 15
