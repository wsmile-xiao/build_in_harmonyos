# test_package MANIFEST for etcd-cpp-apiv3 0.15.4
# 遵循 L0c/R34：test 必须实质依赖被测包 API（禁止空壳）
software: etcd-cpp-apiv3
version: "0.15.4"

test_sources:
  - test_etcd.cpp

build_system: cmake

test_assertions:
  - "构造 etcd::SyncClient（验证 lazy gRPC channel 创建路径）"
  - "调用 SyncClient::put()（验证 protobuf 序列化 + gRPC KV 异步调用 + Response 解析全链路）"
  - "调用 SyncClient::get()（验证 Range 请求路径）"
  - "调用 SyncClient::head()（验证 status 端点路径）"
  - "无服务器环境下断言 put/get/head 优雅失败（error_code 非零且不崩溃），Response::error_code/error_message 错误路径正确"
