knowledge_gained:
  - "cpprestsdk 不在制品仓，上游完整构建（异步 Client）依赖之；BUILD_ETCD_CORE_ONLY=ON 是官方支持的纯同步模式，core-objects 的 GLOB_RECURSE src/**/*.cpp 不含 src 根下的 Client.cpp（CMake ** 至少匹配一层目录，实测验证），可完全避开 pplx 头"
  - "grpc/1.70.0 锁定 protobuf/33.6，下游配方必须用同版本引用否则依赖图版本冲突"
  - "OHOS toolchain 设 CMAKE_SYSTEM_NAME=HarmonyOS 而 host 为 Linux，CMAKE_CROSSCOMPILING=TRUE 会触发 etcd CMakeLists 的 find_program(protoc/grpc_cpp_plugin) REQUIRED 搜索——需在 toolchain 显式预置 Protobuf_PROTOC_EXECUTABLE/GRPC_CPP_PLUGIN 缓存变量"
  - "etcd 无服务器环境下 put/get 返回非零 error_code（UNAVAILABLE）而不抛异常（ParseResponse 映射 grpc::Status 到 Response::error_code），test_package 可据此设计优雅失败断言"

