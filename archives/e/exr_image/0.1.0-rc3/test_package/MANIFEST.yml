# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: exr_image/0.1.0-rc3
homepage: "https://github.com/bartwe/exr_image"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "bash scripts/check-release.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/smoke.c
    source: exr_image-0.1.0-rc3/tests/smoke.c
    description: "写入/加载 EXR 冒烟测试（硬编码 /tmp 路径，本机 /tmp 为只读 erofs 无法运行）"
    command: "./smoke"
  - file: tests/bounds.c
    source: exr_image-0.1.0-rc3/tests/bounds.c
    description: "边界条件测试"
    command: "./bounds"
  - file: tests/leak.c
    source: exr_image-0.1.0-rc3/tests/leak.c
    description: "内存泄漏探测测试"
    command: "./leak"
  - file: tests/safety.c
    source: exr_image-0.1.0-rc3/tests/safety.c
    description: "安全校验测试"
    command: "./safety"
  - file: tests/limits.c
    source: exr_image-0.1.0-rc3/tests/limits.c
    description: "极限参数测试"
    command: "./limits"
  - file: tests/negative.c
    source: exr_image-0.1.0-rc3/tests/negative.c
    description: "负向输入测试"
    command: "./negative"
  - file: tests/scrgb.c
    source: exr_image-0.1.0-rc3/tests/scrgb.c
    description: "scRGB 色彩测试"
    command: "./scrgb"
  - file: tests/spectral.c
    source: exr_image-0.1.0-rc3/tests/spectral.c
    description: "光谱图像测试（硬编码 /tmp 路径，本机 /tmp 为只读 erofs 无法运行）"
    command: "./spectral"
  - file: tests/callback_abi.c
    source: exr_image-0.1.0-rc3/tests/callback_abi.c
    description: "回调 ABI 测试"
    command: "./callback_abi"
  - file: tests/callback_stdcall_decl.c
    source: exr_image-0.1.0-rc3/tests/callback_stdcall_decl.c
    description: "回调 stdcall 声明测试"
    command: "./callback_stdcall_decl"
  - file: tests/compile_no_stdio.c
    source: exr_image-0.1.0-rc3/tests/compile_no_stdio.c
    description: "无 stdio 编译模式测试"
    command: "./compile_no_stdio"
  - file: tests/abi_probe.c
    source: exr_image-0.1.0-rc3/tests/abi_probe.c
    description: "ABI 探测测试（硬编码 /tmp 路径，本机 /tmp 为只读 erofs 无法运行）"
    command: "./abi_probe"
  - file: tests/write.c
    source: exr_image-0.1.0-rc3/tests/write.c
    description: "写入器全压缩算法测试（硬编码 /tmp 路径，本机 /tmp 为只读 erofs 无法运行）"
    command: "./write"
  - file: tests/write_fail.c
    source: exr_image-0.1.0-rc3/tests/write_fail.c
    description: "写入失败路径测试"
    command: "./write_fail"
  - file: tests/loadf_probe.c
    source: exr_image-0.1.0-rc3/tests/loadf_probe.c
    description: "EXR 语料加载探针（需要 EXRI_CORPUS_DIRS 外部 EXR 语料）"
    command: "./loadf_probe"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：内存版公开 ABI 写入/识别/读取/释放 EXR"
    command: "./test_exr_image"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
