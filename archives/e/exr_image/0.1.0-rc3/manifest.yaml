# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.1.0-rc3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.0-rc3"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "{BUILD_SYSTEM}"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/bartwe/exr_image/archive/refs/tags/v0.1.0-rc3.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lang-preflight 对全树任意 Cargo.toml 敏感，tests/ 下辅助差分门禁（Rust 参考工具）的 manifest 会把 C/C++ 主库误判为 mixed(cargo)；按 R47 D.4 边界规则以主库主体判定后继续适配（知识草稿 DRAFT-exr_image-0.1.0-rc3-lang-preflight-aux-manifest）"
  - "单头文件库（header-only）conan-verify G1 要求显式 build() 补丁通道（复用 E257 no-op-build-for-header-only）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
