# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: exceptions4c/3.0.5
homepage: "https://github.com/guillermocalvo/exceptions4c"

# 上游测试命令: test/ 目录下的手工 Makefile 构建 e4c_test 并运行
upstream_check_command: "make -C test CC=clang && ./test/e4c_test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "cd test && make CC=clang && ./e4c_test"

# 上游实际运行的测试程序（test/ 目录，独立统一测试二进制 e4c_test，
# 内部注册全部 9 个测试套件 A-H、Z；Z 为平台要求探测套件（PlatformRequirements），
# 12 项 requirement_z01~z12 在 suite_z.c/run_z.c 中注册、随 e4c_test 实际执行）
upstream_tests:
  - file: test/main.c
    source: exceptions4c-3.0.5/test/main.c
    description: "上游统一测试入口（测试框架 + 全部套件 A/B/C/D/E/F/G/H + 平台要求 Z，共 69 个独立用例）"
    command: "./test/e4c_test"
  - file: test/test_z01.c
    source: exceptions4c-3.0.5/test/test_z01.c
    description: "Z 套件（PlatformRequirements）12 项之一，随 e4c_test 实际执行（fulfilled/NOT FULFILLED）"
    command: "./test/e4c_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 通过 e4c.h 公开 API 使用 try/catch/finally 捕获并验证异常"
    command: "./test_exceptions4c"

# 上游测试用例声明总数（官方 tag 源码 test/test_*.c 共 69 个独立用例文件，
# 含 Z 套件 12 项；r02 返工重枚举修正 r01 的 N=57 少报）
assertion_count: 69