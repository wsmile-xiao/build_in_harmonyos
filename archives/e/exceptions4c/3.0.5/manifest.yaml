# 版本级 manifest
# 文件位置: archives/{letter}/{name}/3.0.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.5"

# 软件名
software: exceptions4c

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/guillermocalvo/exceptions4c"

  # 源码校验和（v3.0.5 tag tarball SHA-256）
  sha256: "98c72c8b771c193462dc983bafb21d9807d460a455ebe1b91fff156338cf71bc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "Makefile 内嵌 $(WGET) 失效外链回退规则时，用 tarball 已有文件软链补齐（ln -sf），不得等待 wget 失败或把失效 URL 写入 conandata（DRAFT-exceptions4c-3.0.5-makefile-wget-deadlink-symlink）"
- "Conan 2 tools.build:compiler_executables 为 dict conf，模板单项 :c 写法照抄即抛 conf 异常，须整体取 dict 后按 key 取（复用 DRAFT-commander-1.4.0-makefile-recipe-build-package-traps）"