# eastdc 0.0.0-fbcc34e — 版本级 manifest

# 版本号
version: "0.0.0-fbcc34e"

# 软件名
software: "eastdc"

# 编译状态
# published | built | failed | archived
# 注：本地全流程验证（构建/测试/消费者/专项）完成置 built；
# Conan 发布受 EAThread/EAAssert 未发布阻塞，不可标 published。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39；镜像回退由 CI 自动注入）
  url:
    - "https://github.com/electronicarts/EAStdC/archive/fbcc34e89c63636054334888f3a5bd7ac2fd4b76.tar.gz"

  # 源码校验和（本地实测）
  sha256: "857cf2bf88146bd41df128b1aa0a8c2db935a5a7cc3889b95e3100ddab774c79"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DEASTDC_BUILD_TESTS=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"   # OHOS 时由 recipe generate() 设置

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "eabase/0699a15"             # 已发布
    - "eaassert/0.0.0-e5e1812"     # 未发布（依赖阻塞，恢复条件见 notes.md）
    # - "eathread/a77e227"         # 未发布（库本体编译硬依赖，见 notes.md）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-cmake-min-version-3.5.patch"          # CMake 4.x 兼容
  - "patches/0002-guard-commoncppflags-include.patch"   # clean 源码树配置

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "EAStdC 公开头文件无条件 include <eathread/...>，EABase/EAAssert/EAThread 是库本体编译依赖而非仅测试依赖"
  - "上游 CMakeLists 用 plain-name 链接 EA 系库（无 CMake 目标传播），clean 源码树需在 recipe generate() 注入依赖 include 路径"
  - "EAStdC 要求 user-provided 调试 operator new/delete 六参形式（Config.h 契约），消费者侧须提供转发实现"