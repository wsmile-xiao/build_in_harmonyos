# test_package/MANIFEST.yml — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: execline/2.9.9.2
homepage: "https://skarnet.org/software/execline/"

# 上游测试命令 (skarnet 构建系统无 make check; execline 有自带测试但非标准套件)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序 (execline 是 C 库 + 命令行工具，上游源码无独立测试二进制)
upstream_tests:
  - file: src/libexecline/el_parse.c
    source: execline-2.9.9.2/src/libexecline/el_parse.c
    description: "execline 核心解析实现 (编译期验证)"
    command: "n/a (library, no standalone test binary)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "execline API 测试: el_semicolon (block parsing), el_getstrict, el_vardupl (env dedup), ELTRANSFORMINFO_ZERO, el_parse_from_string"
    command: "./test_execline"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
