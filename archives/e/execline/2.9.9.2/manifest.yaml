# 版本级 manifest
# 文件位置: archives/e/execline/2.9.9.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.9.9.2"

# 软件名
software: "execline"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-24"
build_system: "skarnet-configure-make"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/skarnet/execline/archive/refs/tags/v2.9.9.2.tar.gz"

  # 源码校验和
  sha256: "b856e1a0bc8113d7110627720b7ddab3b539bcd63d4bb901a6d88470ecbb2281"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "--prefix={package_folder}"
    - "--disable-shared"
    - "--with-sysdeps={skalibs_prefix}/lib/skalibs/sysdeps"
    - "--with-include={skalibs_prefix}/include"
    - "--with-lib={skalibs_prefix}/lib/skalibs"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "skalibs/2.15.1.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "skarnet --with-lib 指向 lib/skalibs 子目录（不是 lib/），configure 在该目录查找 libskarnet.a"
  - "skarnet 构建系统顺序敏感，make 必须用 -j1"
  - "execline configure 需要 --with-sysdeps 指向 skalibs 的平台检测结果目录"
