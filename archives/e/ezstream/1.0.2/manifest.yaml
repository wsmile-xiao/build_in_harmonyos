# ezstream 1.0.2 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.2"
software: "ezstream"
status: built
build_date: "2026-09-05"
build_system: "autotools"

source:
  url: "https://downloads.xiph.org/releases/ezstream/ezstream-1.0.2.tar.gz"
  sha256: "11de897f455a95ba58546bdcd40a95d3bda69866ec5f7879a83b024126c54c2a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--with-taglib-includes=<taglib_pkg>/include/taglib"
  dependencies:
    - libshout/2.4.6
    - libxml2/2.15.3
    - taglib/1.13.1
    - check/0.15.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess-sub-2023-08-22-for-ohos.patch"

knowledge_gained:
  - "上游 2016 版 config.guess/sub 不识别 aarch64-unknown-linux-ohos，替换为 2023-08-22/2023-09-19 版（补丁方式）ref: GNU config 官方 upstream"
  - "AX_CHECK_TAGLIB_C 探测 #include <tag_c.h> 而 ezstream 源码用 <taglib/tag_c.h>：需 TAGLIB_CPPFLAGS 指向 include 根 + --with-taglib-includes 指向 include/taglib 双路径 ref: 上游 configure.ac 宏语义"
  - "libshout/2.4.6 包内 libshout.la 的 dependency_libs 含构建期前缀 '/'（'//lib/libspeex.la'），configure 展开 pkg-config --static 时污染 libezstream.la 导致链接失败；解法：通过 LIBSHOUT_LIBS 环境变量（AC_ARG_VAR）显式传静态链接行 ref: 上游 AX_CHECK_LIBSHOUT AC_ARG_VAR"
  - "ezstream -c 加载有效 XML 会尝试连接配置的 Icecast 服务器（127.0.0.1:8000），CI 无服务器时以 'Couldn't connect' 失败——可作为 test_package 实质验证点（证明 parse->connect 管线贯通）ref: 上游 ezstream.c 行为"

knowledge_ref: []
