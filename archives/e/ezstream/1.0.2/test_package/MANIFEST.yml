# test_package/MANIFEST.yml — ezstream 1.0.2
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ezstream/1.0.2
homepage: "https://icecast.org/ezstream/"

# 上游测试命令 (make check: check framework, 14 test programs)
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试 (autotools.make(target="check"))
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (tests/Makefile.am, check >= 0.9.4 framework)
upstream_tests:
  - file: tests/check_util.c
    source: ezstream-1.0.2/tests/check_util.c
    description: "util 辅助函数单元测试"
    command: "./tests/check_util"
  - file: tests/check_xalloc.c
    source: ezstream-1.0.2/tests/check_xalloc.c
    description: "内存分配封装单元测试"
    command: "./tests/check_xalloc"
  - file: tests/check_cfg.c
    source: ezstream-1.0.2/tests/check_cfg.c
    description: "配置解析（libxml2 路径）单元测试"
    command: "./tests/check_cfg"
  - file: tests/check_cfg_decoder.c
    source: ezstream-1.0.2/tests/check_cfg_decoder.c
    description: "解码器配置单元测试"
    command: "./tests/check_cfg_decoder"
  - file: tests/check_cfg_encoder.c
    source: ezstream-1.0.2/tests/check_cfg_encoder.c
    description: "编码器配置单元测试"
    command: "./tests/check_cfg_encoder"
  - file: tests/check_cfg_intake.c
    source: ezstream-1.0.2/tests/check_cfg_intake.c
    description: "intake 配置单元测试"
    command: "./tests/check_cfg_intake"
  - file: tests/check_cfg_server.c
    source: ezstream-1.0.2/tests/check_cfg_server.c
    description: "服务器配置单元测试"
    command: "./tests/check_cfg_server"
  - file: tests/check_cfg_stream.c
    source: ezstream-1.0.2/tests/check_cfg_stream.c
    description: "流配置单元测试"
    command: "./tests/check_cfg_stream"
  - file: tests/check_mdata.c
    source: ezstream-1.0.2/tests/check_mdata.c
    description: "元数据处理（taglib 路径）单元测试"
    command: "./tests/check_mdata"
  - file: tests/check_playlist.c
    source: ezstream-1.0.2/tests/check_playlist.c
    description: "播放列表单元测试"
    command: "./tests/check_playlist"
  - file: tests/check_stream.c
    source: ezstream-1.0.2/tests/check_stream.c
    description: "流处理（libshout 路径）单元测试"
    command: "./tests/check_stream"
  - file: tests/check_strtbl.c
    source: ezstream-1.0.2/tests/check_strtbl.c
    description: "字符串表单元测试"
    command: "./tests/check_strtbl"
  - file: tests/check_util.c
    source: ezstream-1.0.2/tests/check_util.c
    description: "util 单元测试"
    command: "./tests/check_util"
  - file: tests/check_xalloc.c
    source: ezstream-1.0.2/tests/check_xalloc.c
    description: "xalloc 单元测试"
    command: "./tests/check_xalloc"

# test_package 中自带的测试 (消费者视角验证: 执行被测包二进制)
test_package_tests:
  - file: conanfile.py::test()
    description: "消费者测试：ezstream -V 版本横幅；-c 有效 XML 配置解析并尝试连接（预期失败信息）；-c 损坏 XML 触发 libxml2 parser error；ezstream-cfgmigrate -h 用法横幅"
    command: 'ezstream -V; ezstream -c ezstream-minimal.xml; ezstream -c bad.xml; ezstream-cfgmigrate -h'

# 测试断言总数 (4 个消费者断言 + 上游 14 程序)
assertion_count: 18
