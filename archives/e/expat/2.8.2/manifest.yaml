version: '2.8.2'
status: built
build_date: '2026-07-07'

source:
  url: 'https://github.com/libexpat/libexpat/archive/refs/tags/R_2_8_2.tar.gz'
  sha256: 'ca9d7c05560653cb977bfaa1ac54f717919cc0c68f6798b42fe55347c0b0ad52'
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - '-DEXPAT_BUILD_TOOLS=OFF'
    - '-DEXPAT_BUILD_EXAMPLES=OFF'
    - '-DEXPAT_BUILD_TESTS=OFF'
    - '-DEXPAT_BUILD_DOCS=OFF'
    - '-DEXPAT_SHARED_LIBS=ON'
    - '-DEXPAT_BUILD_PKGCONFIG=ON'
    - '-DEXPAT_WITH_GETRANDOM=ON'
  cc: clang

patches_applied: []

knowledge_gained:
  - 'git /archive/ 无预生成 configure → 用 CMake；源码在 expat/ 子目录（build_script_folder）'
  - 'OHOS libc 无 getrandom 符号但 cmake 能检出 → EXPAT_WITH_GETRANDOM=ON（勿手工 XML_DEV_URANDOM）'
  - 'GitHub /archive/ 校验和可能随 git 版本漂移，稳妥可换 Releases 的 expat-2.8.2.tar.gz'
