build:
  system: cmake
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
  - 'os=OHOS 下 conan 的 CMakeToolchain 使产物不带 SONAME、无版本软链（ML-0035）；须改用「自发现 ohos.toolchain + 裸 cmake」'
  - '被链库无 SONAME 时，链接器把该库的**路径**写进消费方 DT_NEEDED → 消费方二进制不可重定位；fontconfig 链 expat 2.8.2 后即烤死 expat 包目录哈希，换环境就 Error loading shared library'
  - '这类问题在路径恰好一致的机器上不显现，换机器/清 cache 后才暴露'
  - 'expat 新版的 CMake 把 EXPAT_WITH_GETRANDOM 熵源开关默认从 OFF（2.8.2 配方注释）翻成 AUTO（2.8.4：expat_shy_set default=AUTO 再 evaluate_detection_results）；配方仍显式 =ON，保持与已验证 2.8.2 线一致的确定性熵源行为，不随上游自动探测结果漂移'
