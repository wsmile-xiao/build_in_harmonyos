# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: expat/2.8.4
homepage: https://libexpat.github.io/

# 上游测试情况：配方 build() 里 EXPAT_BUILD_TESTS=ON，构建后对 tests/runtests
# 做去 .codesign + 自签，再直接运行（内置 minicheck，无外部测试框架）。
# runner 全量跑 402 个 START_TEST × 6 种 chunk 配置 × 2 种 reparse 模式；
# 非零退出即 fail conan create。2.8.4 实跑 check 数以 CI 输出为准（PR 验证段引用）。
upstream_test_in_build: true
upstream_check_command: "cmake --build build-ohos --target runtests && sign && run build-ohos/tests/runtests"
upstream_tests:
  - file: tests/runtests.c
    source: expat 2.8.4 (R_2_8_4) 上游 tests/runtests.c
    description: "Expat 完整 C 单测/回归 runner（runtests.c + internal minicheck）：全部 START_TEST 以 6 种 chunk-size 配置 × 2 种 reparse-deferral 模式执行。2.8.2 线实测 4824 checks/0 fail；2.8.4 实跑数以 CI 输出为准"
    command: "./runtests"

# test_package 自带测试（消费者视角：dlopen 运行期可加载 + 头闭包编译）
test_package_tests:
  - file: test.c
    description: "编译 #include 主公开头 + dlopen libexpat.so 运行期可加载"
    command: "./test_probe"

assertion_count: 1
