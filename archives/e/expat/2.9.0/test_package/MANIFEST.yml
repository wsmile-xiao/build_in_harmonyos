# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: expat/2.9.0
homepage: https://libexpat.github.io/

# 上游测试情况：配方 build() 里 EXPAT_BUILD_TESTS=ON，构建后对 tests/runtests
# 做去 .codesign + 自签，再直接运行（内置 minicheck，无外部测试框架）。
# runner 全量执行上游注册的测试；非零退出即 fail conan create。
# 2.9.0 的实际测试数与通过率只引用该候选的原始运行输出，不沿用旧版计数。
upstream_test_in_build: true
upstream_check_command: "cmake --build build-ohos --target runtests && sign && run build-ohos/tests/runtests"
upstream_tests:
  - file: tests/runtests.c
    source: expat 2.9.0 (R_2_9_0) 上游 tests/runtests.c
    description: "Expat 完整 C 单测/回归 runner（runtests.c + internal minicheck）；2.9.0 实跑数以本候选原始日志为准"
    command: "./runtests"

# test_package 自带测试（消费者视角：shared 走 dlopen，static 走直接链接；两者均解析 XML）
test_package_tests:
  - file: test.c
    description: "编译 #include 主公开头 + shared dlopen 或 static 直接链接，并解析 XML"
    command: "./test_probe"

assertion_count: 1
