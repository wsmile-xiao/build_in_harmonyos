  upstream: "14 tests registered in tests/Makefile TESTS; 11/11 runnable subset passed in build() (3 skipped: test.dmpstore.export/test.efivar.export/test.grubenv.var need grub2-editenv absent on OHOS)"
  test_package: "Consumer test test_efivar.c (5 assertions, all passed) + efivar CLI smoke (-L | grep grub OK) via self.run(bash -c + explicit LD_LIBRARY_PATH, env=conanrun)"
  real_device:
