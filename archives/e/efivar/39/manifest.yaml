  package_id: "01d92cf349a0dd98ff915f4bd99a04430171517f (shared=True)"
  local_upstream_test_targets_compiled: 14
  local_upstream_tests_passed: 11
  local_consumer_linked: true
  local_target_runtime_executed: true

