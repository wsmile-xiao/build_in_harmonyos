software: efivar
version: "39"
build_system: make
status: built
build_date: "2026-09-25"

source:
  url: "https://github.com/rhboot/efivar/archive/refs/tags/39.tar.gz"
  sha256: "c9edd15f2eeeea63232f3e669a48e992c7be9aff57ee22672ac31f5eca1609a6"
  tar_format: tar.gz

build:
  system: make
  configure_options:
    - 'CC/CCLD/HOSTCC/HOSTCCLD=clang 系工具链'
    - 'ERRORS="" (disable -Werror, musl/clang new warnings)'
    - 'WARNINGS="-Wall"'
    - 'ENABLE_DOCS=0 (avoid asciidoc/xmllint)'
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.patch"
  - "0002-defaults-mk.patch"
  - "0003-musl-shim-c.patch"
  - "0004-musl-shim-h.patch"

knowledge_used: []

knowledge_gained:
  - "musl libc (OHOS) 缺 qsort_r/secure_getenv/program_invocation_short_name → musl_shim.c/h 补齐（qsort_r 用 _Thread_local 上下文包装 qsort 保证线程安全，comparator 无嵌套 qsort_r 调用）"
  - "efivar Makefile 循环依赖：makeguids 生成 efivar-guids.h 但 makeguids.c 又 include efivar.h → make 丢弃依赖；build() 中先手动编译 makeguids.o + util-makeguids.o + musl_shim.o 再链接 makeguids，然后完整 make"
  - "efivar 上游 14 测试中 3 个依赖 grub2-editenv（造 512B env 输入文件）；其余 11 个用 efivar/efisecdb CLI 对 checked-in goal 文件往返比对 + thread-test 以本地 scratch 目录模拟 efivarfs（EFIVARFS_PATH 环境变量 + probe 的 getenv 豁免），普通文件系统可跑"

verification:
