sources:
  url: "https://github.com/rhboot/efivar/archive/refs/tags/39.tar.gz"
  sha256: "c9edd15f2eeeea63232f3e669a48e992c7be9aff57ee22672ac31f5eca1609a6"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "Add musl_shim.c to LIBEFIVAR_SOURCES and add musl_shim.o prerequisites to build targets"
    patch_type: "portability"
  - patch_file: "patches/0002-defaults-mk.patch"
    patch_description: "Add -include musl_shim.h to CPPFLAGS for GNU extension shims on musl libc"
    patch_type: "portability"
  - patch_file: "patches/0003-musl-shim-c.patch"
    patch_description: "Add musl_shim.c providing qsort_r, secure_getenv, program_invocation_short_name for musl libc"
    patch_type: "portability"
  - patch_file: "patches/0004-musl-shim-h.patch"
    patch_description: "Add musl_shim.h header declaring GNU extension shims for musl libc"
    patch_type: "portability"
