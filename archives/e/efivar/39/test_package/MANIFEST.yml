package: efivar/39
homepage: "https://github.com/rhboot/efivar"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make -C tests <target>"

upstream_tests:
  - file: tests/Makefile
    source: efivar-39/tests/Makefile TESTS 变量注册 14 个集成测试
    description: "14 upstream integration tests (test.dmpstore.export, test.efivar.export, test.grubenv.var, test.bootorder.var, test.conin.var, test.efivar.threading, test.parse.db, test.esl.annotation, test.esl.sha256.unsorted, test.esl.sha256.ascending, test.esl.sha256.removal.descending, test.esl.sha256.addition.unsorted, test.esl.cert.addition, test.esl.cert.removal)。3 个（dmpstore.export/efivar.export/grubenv.var）依赖 grub2-editenv 工具（OHOS 无 grub，环境缺失）；11 个在 build() 中真跑（efivar/efisecdb CLI 对 checked-in goal 文件做往返比对 + thread-test 本地 scratch 目录模拟 efivarfs）"
    command: "make -C tests <target>"

test_package_tests:
  - file: test_efivar.c
    description: "Consumer test linking libefivar: efi_get_libefivar_version, efi_str_to_guid, efi_guid_is_empty, efi_guid_to_str round-trip, efi_guid_cmp (5 assertions) + installed efivar CLI smoke (-L lists well-known GUIDs)"
    command: "./test_efivar"
    assertions: 5

assertion_count: 5
