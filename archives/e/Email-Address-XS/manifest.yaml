software: Email-Address-XS
display: "Email::Address::XS"
description: "Parse and format RFC 5322 email addresses and groups (XS implementation)"
category: doc
homepage: "https://metacpan.org/pod/Email::Address::XS"
license: Artistic-2.0
build_system: perl_xs

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "Perl XS 模块使用 Makefile.PL 而非 configure"
    - "需要显式添加 CCFLAGS 和 LDDLFLAGS 参数（系统头文件路径和链接器路径）"
    - "使用 -nostdlib 绕过 libunwind.a 缺失问题（musl libc）"
    - "SELinux HMDFS 限制阻止 XS 模块从用户目录加载，需安装到系统目录"
  common_dependencies:
    - perl/5.42.0
  selinux_limitation: "XS.so 位于 hmdfs:s0 无法加载，需安装到 hnp_file:s0 目录"

# 编译参数模板
build_template:
  configure: "perl Makefile.PL PREFIX=$DEFAULT_PREFIX"
  make: "make LDDLFLAGS='-shared -nostdlib -B$DEFAULT_PREFIX/lib -L$DEFAULT_PREFIX/lib -lc'"
  env_vars:
    CCFLAGS: "-D_GNU_SOURCE -fno-strict-aliasing -pipe -fstack-protector-strong -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64 -I$DEFAULT_PREFIX/include"
    LDFLAGS: "-L$DEFAULT_PREFIX/lib"

# 版本索引
versions:
  "1.05":
    status: built
    build_date: "2026-06-10"
    notes: "编译成功，SELinux HMDFS限制需管理员部署到系统目录"
    packages:
      - "Email-Address-XS-1.05-ohos-aarch64.tar.gz (74KB)"
      - "Email-Address-XS-1.05-ohos-aarch64.hnp (24KB)"