software: enchant
version: "2.8.2"
status: published
build_date: "2026-06-09"
build_system: autotools

source:
  url: "https://github.com/AbiWord/enchant/releases/download/v2.8.2/enchant-2.8.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options: "--prefix=/storage/Users/currentUser/usr/local --disable-static"
  dependencies:
    - glib/2.88.0
    - aspell/0.60.8.1
    - libintl/proxy
  cc: clang
  cxx: clang++
  valac_bypass: true
  glib_intl_shim: true

patches_applied:
  - "0001-glib_intl_shim.c.patch"
  - "0002-sigtrap-fix-enchant-lsmod.c.patch"
  - "0003-sigtrap-fix-enchant.c.patch"

knowledge_gained:
  - "✅ glib 2.88.0 debug_objects_atexit raises SIGTRAP on program exit; fix: signal(SIGTRAP, SIG_IGN) in main() — knowledge_ref: E092-sigtrap-glib-atexit"
  - "✅ valac pre-compiled package has broken dynamic deps; bypass by using VALAC=true + pre-generated .c files from orig tarball — knowledge_ref: E093-valac-bypass"
  - "✅ g_libintl_* symbols undefined when linking against libglib-2.0.a; shim glib_intl_shim.c provides wrappers — knowledge_ref: E094-glib-intl-shim"
  - "✅ PKG_CONFIG_PATH must include ~/usr/local/lib/pkgconfig for glib/gmodule/gobject/gio — knowledge_ref: E095-pkg-config-path"
  - "✅ UnitTest++ not available; test suite cannot compile/run — knowledge_ref: E096-unittest-missing"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /data/storage/el2/base/cache/builds/enchant-2.8.2.orig
  source_work_dir: /data/storage/el2/base/cache/builds/enchant-2.8.2.work
  patches_count: 3

patch_classification:
  - file: 0001-glib_intl_shim.c.patch
    type: source_new
    platform_only: true
    guard: "OHOS"
  - file: 0002-sigtrap-fix-enchant-lsmod.c.patch
    type: source_edit
    platform_only: true
    guard: "OHOS"
  - file: 0003-sigtrap-fix-enchant.c.patch
    type: source_edit
    platform_only: true
    guard: "OHOS"