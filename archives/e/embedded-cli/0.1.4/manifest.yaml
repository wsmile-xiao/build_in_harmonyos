# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.4"

# 软件名
software: embedded-cli

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/funbiscuit/embedded-cli/tar.gz/refs/tags/v0.1.4"

  # 源码校验和
  sha256: "618e961069b545563b4e494e8e34da913e44a4cb95b0f08c7139747e10dc0595"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "codeload 无扩展名 tag URL：conandata sources.filename 显式给 .tar.gz 修复 BadZipFile（E276/E483 复用）"
- "CMake add_subdirectory 静态库产物落 build 子目录：package() 用 os.walk 递归定位复制"
- "embedded-cli 消费者测试：先设 writeChar 输出回调，tokenizeArgs 参数用 embeddedCliGetToken 读取"
