# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: embedded-cli/0.1.4
homepage: "https://github.com/funbiscuit/embedded-cli"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 CMake: option(BUILD_TESTS) + include(CTest) + add_test(CliTests tests/embedded_cli_tests)
# 依赖 Catch2 子模块 (deps/catch2)，独立枚举台账见任务回报
upstream_check_command: "cmake -DBUILD_TESTS=ON .. && make && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/embedded_cli_tests.cpp
    source: embedded-cli-0.1.4/tests/embedded_cli_tests.cpp
    description: "Catch2 上游测试（autocomplete/base/help/history/print/static allocation/tokens）"
    command: "./embedded_cli_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证：创建 CLI、绑定 led 命令、注入 'led 1 1' 并断言 binding 回调与 tokenize 参数"
    command: "./test_embedded-cli"
  - file: ohos_static_alloc_test.c
    description: "鸿蒙专项测试：静态分配路径（无动态内存）+ 公开 tokenize API + binding 回调断言"
    command: "./ohos_static_alloc_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
