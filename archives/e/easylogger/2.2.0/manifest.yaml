# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2.0"

# 软件名
software: easylogger

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/armink/EasyLogger/archive/refs/tags/2.2.0.tar.gz"

  # 源码校验和
  sha256: "bfe9044ea8209958a8292bec37c5aacf1b0eaa5e78acfe7445d33d3fb0f4af44"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "嵌入式 C 库（仓库顶层无构建标记、库主体在子目录）init-build F068 会误把含 Makefile 的 demo 子目录提升为源码根，需手动重建 .orig/.work 以仓库根为根（E350 同类）"
  - "默认异步输出（pthread+sem）日志库的 test_package 必须在 log_* 后等待异步线程消费再校验捕获缓冲，否则 captured=0 假失败（DRAFT-easylogger-2.2.0-async-output-consumer-wait）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
