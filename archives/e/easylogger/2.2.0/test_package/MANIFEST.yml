# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: easylogger/2.2.0
homepage: "https://github.com/armink/EasyLogger"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# EasyLogger 2.2.0 官方源码无独立单元测试入口：无 tests/ 目录、无 ctest/gtest 注册，
# 无 make check 目标。唯一可运行验证载体是 demo/os/linux（示例程序，非测试套件）。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 官方 tag 源码中无独立上游测试用例（详见回报台账）；demo 仅用于运行验证。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：elog_init/elog_start/各级别日志输出与断言校验"
    command: "./test_easylogger"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
