# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: embedmq/1.0.1
homepage: "https://github.com/w4ysonch/embedmq"

# 上游测试命令 (ctest 注册项)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.ctest()  (构建 test_embedmq + test_embedmq_cpp 后执行 CTest，16 个独立用例)"

# 上游实际运行的测试程序（源码声明 16 项 = 2 个可执行 -> CTest 注册 2 项 -> 全部执行通过）
upstream_tests:
  - file: tests/test_embedmq.c
    source: embedmq-1.0.1/tests/test_embedmq.c
    description: "C 核心 API 测试：uuid 确定性/create_destroy/register_and_post/payload_received/post_id_hot_path/static_mode/queue_full/handler_table_full/post_exceeds_max_msg_size/concurrent_producers (10 个独立用例)"
    command: "./test_embedmq"
  - file: tests/test_embedmq_cpp.cpp
    source: embedmq-1.0.1/tests/test_embedmq_cpp.cpp
    description: "C++ wrapper 测试：subscribe_and_publish/lambda_capture/publish_id_hot_path/raii_destroy/move/multi_subscribe_no_uaf (6 个独立用例)"
    command: "./test_embedmq_cpp"

# test_package 中自带的测试 (消费者视角验证，调用公开 API：embedmq_create/register/post/destroy + 断言)
test_package_tests:
  - file: test.c
    description: "消费者测试：公开 API create/register/post/destroy，验证 handler 实际执行且 payload 正确"
    command: "./test_embedmq"

# 测试断言总数 (C 10 + C++ 6 独立用例，主测试内断言为主；消费者测试含 6 个 assert)
assertion_count: 16