# 版本级 manifest — embedmq 1.0.1
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.0.1"

# 软件名
software: "embedmq"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 HTTPS，R39）
  url: "https://github.com/w4ysonch/embedmq/archive/refs/tags/v1.0.1.tar.gz"

  # 源码校验和（官方 tarball 实测）
  sha256: "2f4526b8bae7fb318dadb9f60a3b0695bf346f2e8092ce97bf9ec1f02a4554d0"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游为 CMake 工程，非 autotools）
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DEMBEDMQ_BUILD_TESTS=ON"
  - "-DEMBEDMQ_BUILD_EXAMPLES=OFF"

  # 编译依赖列表（零外部依赖，仅链接 pthread）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零补丁适配）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（对应 knowledge/drafts/ 两个同 stem 草稿配对）
knowledge_gained:
- "Conan 2 配方手动打包：上游 CMake 工程无 install() 规则时 package() 必须用 conan.tools.files.copy 显式拷入 package_folder 绝对路径（self.copy 已移除、src/dst 同名字面量被拒、旧空包缓存须 conan remove 后重验）"
- "test_package/消费者测试不得用 assert 承载控制流前置检查：Release（-DNDEBUG）构建下 assert 编译为空导致 SIGSEGV 或假通过，必须改为显式错误码 + 非零退出码"
