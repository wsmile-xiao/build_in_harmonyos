build:
  system: none
  configure_options: []
  dependencies: []
  cc: n/a
  cxx: n/a

patches_applied: []

knowledge_gained:
  - "emojify 是纯 bash 脚本，无构建系统（无 configure/make/cmake），conanfile build() 仅需 apply_conandata_patches"
  - "上游 shebang #!/usr/bin/env bash 在 OHOS 上 /usr/bin/env 可能不可用，需 replace_in_file 改为 #!/data/service/hnp/bin/bash"
  - "脚本非 ELF 二进制，无需 ELF 签名（binary-sign-tool），仅 os.chmod 0o755 即可执行"
  - "emojify 需要 bash 4+，OHOS 提供 bash 5.3（/data/service/hnp/bin/bash），满足要求"
  - "纯脚本包 package_type=\"application\"，package_info 中 libs/includedirs/libdirs 均置空，bindirs=[\"bin\"]"
  - "init-build 误标 build_system=autotools，实际为 none，需在 manifest/notes 中修正"
