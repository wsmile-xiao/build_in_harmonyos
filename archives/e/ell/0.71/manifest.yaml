# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-maintainer-mode"   # openssl/xxd 检测与 cert_tests/examples 的开关，缺它 46 个 TESTS 只编出 43 个
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:  # 31 个，与 patch_classification / conandata.yml patches / 磁盘 patches/ 四处同源
  - "0001-build-aux-config.guess.patch"   # Recognise HarmonyOS (uname -s) in config.guess so it emits aarch64-unknown-linux-ohos
  - "0002-build-aux-config.sub.patch"   # Accept the ohos OS in config.sub incl. the linux-ohos kernel/OS combination (the bundled patch script's 2.3 guard never fires)
  - "0003-configure.patch"   # Use umask 002 instead of 077 for config.status temp dirs (umask 077 creates drwx--S--- dirs on hmdfs where file creation is denied)
  - "0004-ell-cert-crypto.c.patch"   # Guard the GCC-only -Wmaybe-uninitialized pragma on __GNUC__ && !__clang__ (clang: -Wunknown-warning-option)
  - "0005-ell-cipher.c.patch"   # Ignore -Wsign-compare for this translation unit: musl's CMSG_NXTHDR() macro compares size_t against ptrdiff_t inside the macro (whole-tree scan found only these sites)
  - "0006-ell-dbus-filter.c.patch"   # Guard the GCC-only -Wmaybe-uninitialized pragma on __GNUC__ && !__clang__ (clang: -Wunknown-warning-option)
  - "0007-ell-dbus.c.patch"   # Ignore -Wsign-compare for this translation unit: musl's CMSG_NXTHDR() macro compares size_t against ptrdiff_t inside the macro (whole-tree scan found only these sites)
  - "0008-ell-dhcp-transport.c.patch"   # Ignore -Wsign-compare for this translation unit: musl's CMSG_NXTHDR() macro compares size_t against ptrdiff_t inside the macro (whole-tree scan found only these sites)
  - "0009-ell-dhcp6-transport.c.patch"   # Ignore -Wsign-compare for this translation unit: musl's CMSG_NXTHDR() macro compares size_t against ptrdiff_t inside the macro (whole-tree scan found only these sites)
  - "0010-ell-dhcp6.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0011-ell-genl.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0012-ell-icmp6.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0013-ell-key.c.patch"   # Declare the upstream-shaped struct dh_params on OHOS: linux/keyctl.h reworks keyctl_dh_params into a union with no 'private' member
  - "0014-ell-missing.h.patch"   # Guard the GCC-only -Wstringop-overflow pragma on __GNUC__ && !__clang__: clang rejects it as -Wunknown-warning-option (fatal under -Werror)
  - "0015-ell-net.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0016-ell-netconfig.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0017-ell-netlink.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0018-ell-rtnl.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0019-ell-signal.c.patch"   # Provide sigisemptyset() when HAVE_SIGISEMPTYSET is absent (glibc 2.36+/POSIX.1-2024, not in musl)
  - "0020-examples-acd-client.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0021-examples-dhcp-client.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0022-examples-dhcp-server.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0023-examples-dhcp6-client.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0024-examples-netconfig-test.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0025-tools-gpio.c.patch"   # Fall back to __progname for program_invocation_short_name (glibc-only symbol, not in musl)
  - "0026-unit-test-dhcp.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0027-unit-test-dhcp6.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0028-unit-test-genl-msg.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0029-unit-test-key.c.patch"   # Cast KEY1_LEN to ssize_t in the assertion to satisfy -Wsign-compare (strlen returns size_t)
  - "0030-unit-test-netlink.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
  - "0031-unit-test-rtnl.c.patch"   # Redefine sockaddr_storage around linux/* headers (OHOS linux/socket.h defines it, colliding with musl sys/socket.h) - E091 define-guard
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "★ B=create: OHOS linux/keyctl.h 的 struct keyctl_dh_params 无 private 成员（改为 union {__linux_private, priv}），上游 .private 设计符编译失败 -> Issue #3791，草稿 DRAFT-ell-0.71-ohos-keyctl-dh-params-union-no-private-member.{kv,md}"
  - "hit E007/E160: config.guess 无 HarmonyOS 分支 -> patch-autotools-ohos.pl；发现该脚本 2.3 节守卫被 2.1 节产物自污染，内核校验列表需手工补"
  - "hit E129/E136/E206/E223/E011/E533: config.status 内置 umask 077 在 HMDFS 建出 drwx--S--- 目录且 chmod 不生效 -> 临时文件 Permission denied"
  - "hit E091: OHOS linux/socket.h 与 musl sys/socket.h 重定义 sockaddr_storage -> include 前后宏改名（覆盖 ell/unit/examples 17 文件）"
  - "hit E534: musl 缺 sigisemptyset (glibc 2.36+) -> 位图判空兼容实现"
  - "hit E493: musl 缺 program_invocation_short_name -> 改用 __progname"
  - "hit E051/E246: test-pem/test-key 运行期 SIGSYS (exit 159)，keyctl 被 seccomp 拦截"
  - "W0 B机实测: 仅 netlink proto 0 (ROUTE) 可用，proto 4/10/12/16 全 EACCES（与 A 机卡读数不同，以本机为准）"
  - "W0 B机实测: DBus 三处 socket 全 MISSING、dbus-daemon NOT FOUND => 3 个 dbus 测试无法执行"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"


