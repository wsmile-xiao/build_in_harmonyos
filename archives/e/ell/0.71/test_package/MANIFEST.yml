# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写依据: 上游 tag 源码树逐项实测（2026-10-06，B 机）
#   归档: ell-0.71.tar.xz 574408 B  sha256=850f79cc993791f00232fd31cbaf3e8212edcef25ca0515f98c6d48dfb5952d7

package: ell/0.71
homepage: "https://git.kernel.org/pub/scm/libs/ell/ell.git"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（automake TESTS 注册 46 项，make check 实测 TOTAL=46）
upstream_tests:
  - file: unit/test-*.c
    source: ell-0.71/unit/
    description: "ell 单元测试框架源码 46 个 .c；automake 注册 TESTS 46 = unit_tests 33 + dbus_tests 10 + cert_tests 3"
    command: "make -j1 check"
  - file: unit/settings.test
    source: ell-0.71/unit/
    description: "测试数据文件（unit_test_data_files，供 test-settings 读取）"
    command: "(输入文件，不单独执行)"
  - file: unit/dbus.conf
    source: ell-0.71/unit/
    description: "测试数据文件（unit_test_data_files，供 dbus 测试族读取）"
    command: "(输入文件，不单独执行)"
  - file: unit/gencerts.cnf
    source: ell-0.71/unit/
    description: "证书生成配置（供 test-pem/test-key/test-tls 族生成证书）"
    command: "(输入文件，不单独执行)"
  - file: unit/plaintext.txt
    source: ell-0.71/unit/
    description: "测试数据文件（供 test-pem 族读取）"
    command: "(输入文件，不单独执行)"
  - file: examples/*.c
    source: ell-0.71/examples/
    description: "示例程序 10 个 .c（上游 noinst_PROGRAMS，受 EXAMPLES + MAINTAINER_MODE 控制，不注册为 TESTS）"
    command: "make (examples/)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libell 并调用其 API 做冒烟验证"
    command: "./test_ell"

# 测试断言总数 (近似值, 用于质量评估)
# 口径: unit/test-*.c 中 assert( 出现数（2026-10-06 实测 grep -c 'assert(' unit/test-*.c = 2355）
assertion_count: 2355

# 测试数三处同源（与 notes.md 五维段、manifest.yaml tests: 段完全一致）
#   上游四类口径（§12.72）: 框架源码 46 + res 语料 0 + RUNTEST 0 + 示例 10 = 56
#                          含 unit 数据文件 4 个 => 申报 60
#   适配后可执行断言口径  : make check TOTAL=46 / PASS=39 / FAIL=7 / SKIP=0
#   ⚠ PR 正文不得拿 46 当 N_static —— 46 是 N_registered/N_executed，N_static=60
upstream_static_count: 60
adapted_executed_count: 46
adapted_passed_count: 39

# 五维测试账本（适配检查清单.md:150；字段名与 manifest.yaml tests: 段一致）
n_static: 60                      # 上游测试资产总数(四类口径含 unit 数据文件 4)
n_registered: 46                  # automake 注册 TESTS = unit 33 + dbus 10 + cert 3
n_executed: 46                    # make check 实际执行(# TOTAL: 46)
n_not_executed: 0                 # registered == executed => 0
n_consumer: 3                     # 消费者断言数(1 个程序 test.c)
failed_count: 7
skipped_count: 0
no_criterion_count: 0
consumer_program_count: 1
consumer_passed: 3
# 未执行/失败分类（执行了但失败的 7 项，均环境/平台限制、非本次适配引入）:
failed_breakdown: "test-dir-watch + test-path = /tmp 只读 erofs；test-dbus 族 3 项 = 无 DBus 运行期 + 总线地址 unix:path=/tmp/ell-test-bus 同在只读 /tmp(E002 叠加)；test-pem + test-key = SIGSYS seccomp 拦 keyctl(E051 exit 159)"
# PASS 含水项（不等于 100% 覆盖）
pass_caveat: "test-checksum 因 AF_ALG bind 全拒只跑 unsupported 一项；test-tls 报 Needed checksum missing, skipping 后判 PASS"
