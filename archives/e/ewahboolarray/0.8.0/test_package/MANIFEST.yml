# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: ewahboolarray/0.8.0
homepage: "https://github.com/lemire/EWAHBoolArray"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -B build && cmake --build build && ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/unit.cpp
    source: EWAHBoolArray-0.8.0/tests/unit.cpp
    description: "唯一上游 CTest 目标 unit；main() 展开调用 105 个可失败测试点，归属 37 个逻辑测试族，覆盖 16/32/64 位 word、压缩位图运算、序列化和 207 组真实数据回归"
    command: "./unit <build>/tests/data/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：实际链接 ewah::ewah，验证 EWAHBoolArray 的 set/get、union/intersection/difference/xor、intersects，以及 BoolArray API，共 8 个运行时检查"
    command: "./test_ewahboolarray"

# CMake/CTest target count is 1; the target's upstream main() has 105 expanded
# failing test points across 37 logical test families. The 207 bitmap inputs
# are nested data for testRealData(), not additional CTest targets.
upstream_ctest_count: 1
upstream_test_count: 105
upstream_test_family_count: 37
upstream_nested_data_count: 207
test_package_test_count: 1
test_package_assertion_count: 8
assertion_count: 8
