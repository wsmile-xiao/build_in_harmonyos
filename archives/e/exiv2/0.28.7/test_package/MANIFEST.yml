# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: exiv2/0.28.7
homepage: "https://github.com/Exiv2/exiv2"

# 上游测试命令 (cmake ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest"
# 接入说明: unitTests 已接入构建并运行。
# 通过 gtest/1.17.0 (test_requires) + EXIV2_BUILD_UNIT_TESTS=ON + cmake.test() 集成。
# exiv2 上游 unitTests/CMakeLists.txt 使用 find_package(GTest CONFIG) +
# target_link_libraries(... GTest::gmock_main), 但 gtest 配方未声明 gmock_main 组件
# (实际打包 libgtest.a/libgmock.a/libgtest_main.a), 导致 CMake Generate 失败。
# 修复: build() 中 apply_conandata_patches() 后用 replace_in_file 将
# GTest::gmock_main 替换为 GTest::gtest GTest::gmock GTest::gtest_main
# (patches/0001-fix-gtest-gmock-main-target.patch)。

# 上游实际运行的测试程序
# exiv2 v0.28.7 上游测试套件结构:
#   unitTests/     — 29 个 GTest C++ 单元测试文件, 313 个 TEST 宏
#   bash_tests/    — 11 个 pytest 测试文件 (需 Python3 + 样例数据, 不纳入)
#   bugfixes/      — bugfix 回归测试 (需 Python3 + 样例数据, 不纳入)
#   regression_tests/ — 回归测试 (需 Python3 + 样例数据, 不纳入)
#   lens_tests/    — 镜头配置测试 (需 Python3 + 样例数据, 不纳入)
#   tiff_test/     — tiff_test 程序测试 (需 Python3, 不纳入)
# 已接入: unitTests (GTest, 通过 EXIV2_BUILD_UNIT_TESTS=ON + cmake.test())
# 未接入: bash_tests/bugfixes/regression/lens/tiff (依赖 Python3 + 样例数据文件, OHOS CI 不适用)
upstream_tests:
  - name: "unitTests (GTest)"
    type: "ctest"
    description: "29 个 GTest 单元测试文件, 313 个 TEST 宏, 涵盖 basicio/datasets/types/enforce/safe_op/slice 等核心模块。已接入构建: gtest/1.17.0 (test_requires) + EXIV2_BUILD_UNIT_TESTS=ON + cmake.test()。ctest 运行结果: 100% tests passed, 0 tests failed out of 1 (unit_tests 可执行文件内含 313 个 TEST 宏全部通过)"
    command: "ctest -R unitTests"
    ran: true
    status: "已接入 (gtest/1.17.0 test_requires + EXIV2_BUILD_UNIT_TESTS=ON; build() 中 replace_in_file 将 GTest::gmock_main 替换为 GTest::gtest GTest::gmock GTest::gtest_main, 因 gtest 配方未声明 gmock_main 组件, 实际打包 libgtest.a/libgmock.a/libgtest_main.a; ctest 100% passed, 313/313 TEST 宏通过)"
  - name: "bashTests (pytest)"
    type: "python"
    description: "11 个 pytest 测试文件 (version_test/easyaccess/jpegparse 等), 需 Python3 + EXIV2_BUILD_SAMPLES"
    status: "未接入 (依赖 Python3 + 样例二进制, OHOS CI 不可用)"
  - name: "bugfixTests (pytest)"
    type: "python"
    description: "bugfix 回归测试套件, 需 Python3 + 样例数据"
    status: "未接入 (依赖 Python3 + 样例数据, OHOS CI 不可用)"
  - name: "regressionTests (pytest)"
    type: "python"
    description: "回归测试套件, 需 Python3 + 样例数据"
    status: "未接入 (依赖 Python3 + 样例数据, OHOS CI 不可用)"
  - name: "lensTests (pytest)"
    type: "python"
    description: "镜头配置测试, 需 Python3 + 样例数据"
    status: "未接入 (依赖 Python3 + 样例数据, OHOS CI 不可用)"
  - name: "tiffTests (pytest)"
    type: "python"
    description: "tiff_test 程序测试, 需 Python3 + 样例数据"
    status: "未接入 (依赖 Python3 + 样例数据, OHOS CI 不可用)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_exiv2.cpp
    description: "验证 exiv2 库链接与 EXIF 元数据读写 API (ExifData operator[] / Exiv2::version)"
    command: "./test_exiv2"

# 测试断言总数
# 上游 unitTests: 313 个 GTest TEST 宏 (已接入, ctest 100% passed, 313/313 通过)
# test_package: 3 个断言 (version 非空 + EXIF 写读匹配 + count=1)
assertion_count: 316
