# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ex-vi/050325
homepage: "https://ex-vi.sourceforge.net/"

# ex-vi is a traditional vi/ex editor (pure Makefile project, no test suite).
# There is no `make check` target in the upstream Makefile.
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ex-vi 050325 has no upstream test suite — it's a traditional editor.
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# test.sh drives `ex` end-to-end: runs --version, then edits a real file,
# prints the buffer and quits — asserting the editor genuinely works (R34).
test_package_tests:
  - file: test.sh
    description: "验证 ex 二进制可执行、--version 退出 0，并能读取/打印/退出真实文件"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
