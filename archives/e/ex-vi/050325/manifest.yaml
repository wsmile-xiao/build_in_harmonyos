# 编译中学到的知识
knowledge_gained:
  - "Makefile sub-make CFLAGS override: when passing CFLAGS=... to top-level make, it propagates to sub-makes via environment and overrides sub-Makefile CFLAGS. Fix: use 'override CFLAGS +=' in libterm/Makefile and libuxre/Makefile to preserve -I. and -D defines."
  - "HMDFS filesystem does not support make jobserver fifos (mkfifo: Operation not permitted). Use -j1 instead of -j2."
  - "INSTALL path /usr/ucb/install doesn't exist on OHOS; use 'install' from PATH."
  - "Interactive install check 'echo q | ex' must be removed for cross-compile/non-interactive builds."
  - "HMDFS symlinks: use 'rm -f && ln -s' pattern instead of bare 'ln -s' to avoid failures on existing targets."

