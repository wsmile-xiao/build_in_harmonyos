# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# endlessh 1.1 上游无任何测试套件：
#   - Makefile 无 test/check target
#   - 源码无测试文件
#   - 无 CI/CD (.github/workflows 不存在)
# 因此适配后补全了二进制级功能测试。

package: endlessh/1.1
homepage: "https://github.com/skeeto/endlessh"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -n"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无测试程序，此处为空
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 上游无测试套件，以下 5 项为适配后补全的二进制级功能测试
test_package_tests:
  - file: test_package/test.sh
    description: "endlessh -h prints usage to stdout and exits 0"
    command: "./test.sh (case 1: -h help output)"

  - file: test_package/test.sh
    description: "endlessh -V prints version containing '1.1' and exits 0"
    command: "./test.sh (case 2: -V version output)"

  - file: test_package/test.sh
    description: "endlessh -z (invalid option) exits non-zero"
    command: "./test.sh (case 3: invalid option rejection)"

  - file: test_package/test.sh
    description: "endlessh -d -1 (out-of-range delay) exits non-zero"
    command: "./test.sh (case 4: invalid argument rejection)"

  - file: test_package/test.sh
    description: "endlessh -v -p 65531 daemon binds port and logs diagnostics"
    command: "./test.sh (case 5: daemon mode diagnostics)"

# 测试断言总数 (近似值, 用于质量评估)
# 5 个测试用例，每个含 1-2 个断言，共约 7 个断言点
assertion_count: 7
