# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: exprtk/0.0.2
homepage: "https://github.com/ArashPartow/exprtk"

# 上游测试命令（上游无 make check 目标；测试程序为 exprtk_test.cpp，编译后直接运行）
upstream_check_command: "c++ exprtk_test.cpp -o exprtk_test && ./exprtk_test"

# conanfile.py build() 方法中是否已集成上游测试（-o run_upstream_tests=True 门控开启）
upstream_test_in_build: true
upstream_test_command: "conan build() 门控：CMake 编译 exprtk_test.cpp 并运行"

# 上游实际运行的测试程序
upstream_tests:
  - file: exprtk_test.cpp
    source: exprtk-0.0.2/exprtk_test.cpp
    description: "上游自写框架测试程序：main() 顺序执行 run_test00..run_test21 共 22 个测试函数（单一 numeric_type），静态注册数 N_static=22"
    command: "./exprtk_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：构造 symbol_table/expression/parser，编译表达式并对求值结果断言（6 项断言）"
    command: "./test_exprtk"

# 测试断言总数 (近似值, 用于质量评估)：此处按上游测试注册入口数计
assertion_count: 22
