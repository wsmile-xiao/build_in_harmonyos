# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: exprtk/0.0.3
homepage: "https://github.com/ArashPartow/exprtk"

# 上游测试命令（上游无 make check 目标；测试程序为 exprtk_test.cpp，编译后直接运行；
# 设备无 c++/cc 别名，实际使用 clang++；数据文件须置于进程 CWD）
upstream_check_command: "clang++ -O0 -std=c++14 exprtk_test.cpp -o exprtk_test && ./exprtk_test"

# conanfile.py build() 方法中是否已集成上游测试（-o run_upstream_tests=True 门控开启）
upstream_test_in_build: true
upstream_test_command: "conan build() 门控：CMake 编译 exprtk_test.cpp 并运行"

# 上游实际运行的测试程序
upstream_tests:
  - file: exprtk_test.cpp
    source: exprtk-0.0.3/exprtk_test.cpp
    description: "上游自写框架测试程序：main() 顺序执行 run_test00..run_test22 共 23 个测试函数（单一 numeric_type=double），静态声明数 N=23；R02 修复补丁后实测 23/23 全通过（run_test21 immutable 复合赋值修复，见 patches/0001）"
    command: "./exprtk_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：构造 symbol_table/expression/parser，编译表达式并对求值结果断言（6 项断言）"
    command: "./test_exprtk"
  - file: harmonyos_specific_test.cpp
    description: "鸿蒙专项测试：在 OHOS 运行时验证 IEEE-754/libm 一致性、向量求和/均值、循环控制流与表达式重绑定（9 项断言）"
    command: "./harmonyos_specific_test"

# 测试断言总数 (近似值, 用于质量评估)：此处按上游测试注册入口数计
assertion_count: 23
