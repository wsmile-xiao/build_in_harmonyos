# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁读取）

package: dnsdbq/2.6.8
homepage: "https://www.dnsdb.info/"

# 上游测试清点结论：dnsdbq 2.6.8 上游没有任何测试套件。
# 源码根目录无 tests/ test/ 目录，Makefile 无 check/test/tests 目标
#（纯命令行工具，仅发布 dnsdbq 二进制与 man 页）。逐字证据见下。
upstream_check_command: "make check"
# make check 实测输出：无此目标（"No rule to make target 'check'"），退出码 2
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试用例总数 = 0（无 tests/ 目录；Makefile grep -nE 'check|test' 无目标行）
upstream_tests: []
upstream_test_count: 0

upstream_evidence:
  - "发布 tar 包解包后 find . -maxdepth 2 -type d 仅顶层目录：无 tests/ test/ 目录"
  - "Makefile 全文 grep -nE '^(check|test|tests):' 无任何输出：无上游测试目标"
  - "Makefile 中 check/test 仅出现在 .man 说明文字，无可执行测试"

# test_package 消费者用例（R34：实际执行被测包 bin/dnsdbq，可失败；计入「鸿蒙特有测试」行）
test_package_tests:
  - file: test.sh
    description: "T1 dnsdbq -h 输出包含 usage 行（grep -qi usage，不匹配即失败）"
    command: "sh test.sh <pkg>/bin/dnsdbq"
  - file: test.sh
    description: "T2 dnsdbq -h 输出版本/选项表 -p dns|json|csv（grep -q，不匹配即失败）"
    command: "sh test.sh <pkg>/bin/dnsdbq"

assertion_count: 2
