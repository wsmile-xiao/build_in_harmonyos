# conandata.yml — dnsdbq 2.6.8
#
# 上游官方 tag 归档：https://github.com/dnsdb/dnsdbq/archive/refs/tags/v2.6.8.tar.gz
# sha256 由官方 tag 归档实测（codeload/github archive 两路一致）：
#   61e6dd22d258e67e6e87f2c7e4ba13a77ea519e7a6e521274016f17a2bc0f76e
# sources.url 只保留官方 URL；取源时若框架注入镜像由共享下载框架自行处理，
# 不在配方内写入手工镜像前缀。

sources:
  url:
    - "https://github.com/dnsdb/dnsdbq/archive/refs/tags/v2.6.8.tar.gz"
  sha256: "61e6dd22d258e67e6e87f2c7e4ba13a77ea519e7a6e521274016f17a2bc0f76e"

patches:
  - patch_file: "patches/0001-asinfo.c.patch"
    strip: 1
    patch_description: >
      asinfo.c 统一改用经典 POSIX 解析器接口 res_init()/res_query()，错误码经
      h_errno 暴露（配 hstrerror()）；删除 BIND 风格线程安全 res_n*() 族
      （res_ninit/res_nquery/res_nclose）与全局 _res 的依赖，不持有 per-call
      resolver 状态（无 static __res_state）。任何平台均走同一代码路径。
      dnsdbq 为单线程 CLI，进程级全局解析器状态语义等价。
    patch_type: "portability"
