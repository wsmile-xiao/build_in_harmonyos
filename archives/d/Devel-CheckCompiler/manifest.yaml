software: Devel-CheckCompiler
display: "Devel::CheckCompiler"
description: "Check the compiler's availability - detects C99 compiler support for Perl modules"
category: build-tool
homepage: "https://metacpan.org/pod/Devel::CheckCompiler"
license: Artistic-1.0-Perl OR GPL-1.0-or-later
build_system: perl-build

ohos_adaptation:
  key_points:
    - "Pure Perl module, no XS compilation required"
