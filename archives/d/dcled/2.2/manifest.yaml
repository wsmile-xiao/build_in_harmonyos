# dcled 2.2 — 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "2.2"
software: dcled
status: published
build_date: "2026-09-12"
build_system: makefile

source:
  url: "https://www.jeffrika.com/~malakai/dcled/dcled-2.2.tgz"
  sha256: "0da78c04e1aa42d16fa3df985cf54b0fbadf2d8ff338b9bf59bfe103c2a959c6"
  tar_format: tar.gz

build:
  system: makefile
  # 上游 makefile 直接 `all:` 出 dcled / cpuload 两个可执行文件，无 configure 步骤；
  # 只需要交付出正确变量（CC / FONTDIR / LIBUSB_CFLAGS / LIBUSB_LIBS）。
  configure_options: []
  make_options:
    - 'CC="clang"'
    - 'FONTDIR="\"<pkg>/share/dcled\""'
    - 'LIBUSB_CFLAGS="-I<libusb>/include/libusb-1.0"'
    - 'LIBUSB_LIBS="-L<libusb>/lib -lusb-1.0 -Wl,-rpath,<libusb>/lib"'
  dependencies:
    - libusb/1.0.27
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-init-ledscreen-maindisp.patch"

# 上游无自动化测试套件（makefile 无 check/test 目标），验证面为 README "EXAMPLES"
# 段的 9 条命令行 + `dcled --test` 自检模式；全部在 conanfile.py 的
# _run_upstream_checks() 中以 -n（nodev，免硬件）执行。
upstream_tests:
  framework: upstream-readme-examples
  discovered: 11
  executed: 11
  passed: 11
  failed: 0
  skipped: 0
  has_official_test: false

consumer_tests:
  file: test_package/test_dcled.py
  assertions: 15
  passed: 15

knowledge_gained:
  - ref: E###-maindisp
    description: "栈上 struct 未初始化 → 免硬件 (-n) 路径把垃圾 libusb handle 交给 close_usbdev() → libusb_release_interface() SIGSEGV (exit 139)；一处 memset 归零即修复"

# 编译中学到的可复用经验（每条均带 ref: 指向知识条目/证据）
knowledge_refs:
  - ref: "notes.md#问题与解决方案"
    description: "libusb 的头文件装在 include/libusb-1.0/ 子目录，dcled.c 写 #include <libusb.h>，-I 必须指到该子目录而非 <pkg>/include"
  - ref: "notes.md#编译步骤"
    description: "上游 makefile 硬编码 CC=gcc，交叉编译需用 tools.build:compiler_executables 显式覆盖为 clang（R33：不从 shell 环境裸取变量）"
  - ref: "notes.md#注意事项"
    description: "FONTDIR 经 -DFONTDIR='\\\"$(FONTDIR)\\\"' 进入二进制，make 变量必须自带双引号；上游默认 /usr/local/share/dcled 会指向宿主机"
