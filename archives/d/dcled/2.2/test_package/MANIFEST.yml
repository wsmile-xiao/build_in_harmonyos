# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# dcled 上游没有自动化测试套件：makefile 里没有 check/test 目标，
# 官方提供的验证面是 README "EXAMPLES" 段的命令行示例 + `dcled --test` 自检模式。
# 因此上游测试在 conanfile.py 的 _run_upstream_checks() 中全部执行
# （9 条 README 示例 + -h + cpuload，均以 -n 免硬件运行，无限模式按超时收口），
# 适配侧消费者测试在 test_package/test_dcled.py 中执行。

package: dcled/2.2
homepage: "https://www.jeffrika.com/~malakai/dcled"

# 上游没有 `make check`，可执行的自检入口是 `dcled --test`
upstream_check_command: "dcled --test"
upstream_test_in_build: true
upstream_test_command: "dcled -n -e <README EXAMPLES 全部 9 条> (+ dcled -h, cpuload 0.2)"
upstream_tests:
  - file: README
    source: README (README 的 "EXAMPLES" 段, 9 条命令)
    description: "上游 README EXAMPLES 段全部 9 条示例：-t / -m / stdin 管道 / 文件参数 / --clock --repeat / -p static / -p 2 / --test / syslog 管道；全部以 -n (nodev) 免硬件执行，-t、--test、--clock --repeat 为无限模式按 20s 超时收口并断言进程未提前崩溃"
    command: "dcled -n -e ... (见 conanfile.py _upstream_examples)"

test_package_tests:
  - file: test_dcled.py
    description: "消费者测试：运行已安装的 dcled/cpuload，覆盖产物可执行位、usage 横幅、命令行消息、stdin 管道、文件参数与顺序、前言按名称/编号、字体数据打包、FONTDIR 烘焙进包内路径、cpuload 数值范围，并守住 -n 路径的 SIGSEGV 回归"
    command: "python3 test_dcled.py <package>/bin/dcled <package>/bin/cpuload <package>/share/dcled [<libdir> ...]"

assertion_count: 15
