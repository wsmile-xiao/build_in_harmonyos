software: dcled
display: "dcled"
description: "Dream Cheeky USB LED 点阵信息板的用户态驱动（dcled 显示消息/时钟/测试图案，cpuload 输出 CPU 负载采样供仪表模式使用）"
category: tool
homepage: "https://www.jeffrika.com/~malakai/dcled"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 makefile 硬编码 CC=gcc，交叉编译须用 tools.build:compiler_executables 覆盖为 clang（R33，变量全部取自 Conan 而非 shell）。"
    - "libusb 头文件位于 include/libusb-1.0/ 子目录而源码写 #include <libusb.h>，LIBUSB_CFLAGS 必须指到该子目录。"
    - "FONTDIR 经 -DFONTDIR='$(FONTDIR)' 进入二进制，make 变量值需自带双引号；改为指向包内 share/dcled。"
    - "不执行 make install：上游把 /usr/local 绝对路径写入宿主构建机且只装 dcled；改由 package() 按 Conan 布局拷贝。"
    - "libusb-1.0.so 非 OHOS 系统同名库，保留动态链接并以 -Wl,-rpath 固定运行时搜索路径。"
  common_dependencies:
    - libusb/1.0.27

patches:
  - file: "0001-init-ledscreen-maindisp.patch"
    reason: "maindisp 为栈上未初始化的 struct ledscreen，免硬件 (-n) 路径下 close_usbdev() 把垃圾 handle 交给 libusb_release_interface() 导致 SIGSEGV (exit 139)"
    type: "upstream-bugfix"

upstream_tests:
  has_official_test: false
  framework: "upstream-readme-examples"
  note: "上游 makefile 无 check/test 目标；验证面为 README EXAMPLES 段 9 条命令 + dcled -h + cpuload，全部以 -n 免硬件执行"

versions:
  "2.2":
    status: published
    build_date: "2026-09-12"
