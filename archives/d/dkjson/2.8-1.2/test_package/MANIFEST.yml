# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dkjson/2.8-1.2
homepage: "https://dkolf.de/dkjson-lua/"
upstream_check_command: "lua jsontest.lua"
upstream_test_in_build: false
upstream_test_command: "lua jsontest.lua"

# 上游测试在 test_package 中执行（纯 Lua 包，无独立构建测试目标）
upstream_tests:
  - file: jsontest.lua
    source: dkjson-2.8/jsontest.lua
    description: "上游官方 JSON 回归/对比脚本：覆盖转义、稀疏数组、NaN/Inf 本地化等，OHOS 上以打包后的 dkjson.lua 为 LUA_PATH 首项执行"
    command: "lua jsontest.lua"

# 审计：上游存在测试（jsontest.lua 为官方回归脚本，非空 24736 字节，discovered=1）
upstream_tests_exist: true

# test_package 中自带的消费者测试（Lua C-API 冒烟）
test_package_tests:
  - file: test_dkjson.c
    description: "消费者冒烟：Lua C-API 加载 dkjson，校验 version/encode/decode/nested/indent 共 6 断言"
    command: "test_dkjson"
  - file: jsontest.lua
    description: "上游回归：jsontest.lua 以打包产物为首项执行，打印即失败"
    command: "lua jsontest.lua"

assertion_count: 7
