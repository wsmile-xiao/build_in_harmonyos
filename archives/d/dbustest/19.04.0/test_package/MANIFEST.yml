# test_package/MANIFEST.yml — dbustest 19.04.0
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: dbustest/19.04.0
homepage: "https://launchpad.net/dbus-test-runner"

# 上游测试：tests/ 目录基于 Makefile 的测试（需运行 dbus-daemon 隔离环境）；
# OHOS 无运行中的 D-Bus 会话，按 rule 1.2 如实声明平台限制（详见 notes.md）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# test_package 消费者测试（R34 真实产物 + 编译链接 + 构造/析构 API 校验）：
# 运行受 OHOS 沙箱无 D-Bus 会话平台限制（构造 DbusTestService Signal 11），
# 按 rule 1.2 如实声明（非跳过）；编译链接与产物校验覆盖。
test_package_tests:
  - file: test_dbus_test_runner.c
    description: "CMake 编译链接 libdbustest + glib + dbus-glib（dbus-glib::dbus-glib），编译链接成功即验证 dbus_test_task_new/dbus_test_service_new/dbus_test_process_new 等 API 可用；运行受 OHOS 无 D-Bus 会话平台限制（Signal 11，rule 1.2 声明）"
    command: "conan create 内自动执行（CMake build + test() 编译链接校验，运行按平台限制声明）"
