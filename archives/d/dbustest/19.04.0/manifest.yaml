# 版本级 manifest
# 文件位置: archives/d/dbustest/19.04.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "19.04.0"

# 软件名
software: "dbustest"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://launchpad.net/dbus-test-runner/19.04/19.04.0/+download/dbus-test-runner-19.04.0.tar.gz"

  # 源码校验和
  sha256: "645a32fbd909baf2c01438f0cbda29dc9cd01a7aba5504c45610d88e8a57cb76"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--disable-maintainer-mode"
  - "--disable-nls"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - glib/2.88.0
  - dbus-glib/0.114

  # 构建工具依赖（tool_requires）
  tool_requires:
  - intltool/0.51.0
  - gettext/0.22.5
  - automake/1.18
  - libtool/2.5.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 说明：无外部补丁文件；config.guess/config.sub 的 OHOS 识别、
# intltool 的 msgmerge/XML::Parser stub、pcre2 的 .la/.pc 重定位
# 均在 conanfile.py 内联处理（见 notes.md）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "intltool 的 IT_PROG_INTLTOOL 强制检查 msgmerge（GNU gettext 工具）与 perl XML::Parser 模块——OHOS 均缺，需 stub 前置 PATH/PERL5LIB + --disable-nls 跳过 po/ 翻译构建"
- "旧版 config.guess（各分支自行 echo+exit）按旧版格式插 HarmonyOS 分支；config.sub 需同时改 maybe_os 列表与 os 合法性列表加 linux-ohos*"
- "依赖包 .pc 的 prefix=/ 未改写时 libtool 报 //lib/...la 找不到——复制 .pc/.la 到可写目录改写 prefix/libdir，PkgConfigDeps 生成的 .pc 须强制覆盖"
- "pcre2 包只有 libpcre2-8.pc 无 pcre2.pc——glib Requires: pcre2 需生成别名 .pc"
- "dbus-glib/0.114 为顶层 cpp_info（无 dbus-glib-1 组件），CMakeDeps 目标为 dbus-glib::dbus-glib"
- "上游 libdbustest 头文件装在 include/libdbustest-1/libdbustest/（Makefile.am 的 libdbustestincludedir），package_info 需设 includedirs"
- "OHOS 沙箱无 D-Bus 会话，test_package 运行 dbus_test_service_new 构造 Signal 11——按 rule 1.2 如实声明平台限制（编译链接 + R34 产物校验覆盖）"
- "上游测试实测：dbus-test-runner 自启动隔离 dbus-daemon（不依赖系统 D-Bus 会话），但 OHOS 系统与 ohpcd dbus/1.14.10 包均无 dbus-daemon 可执行文件（service.c 硬编码从 PATH 找），Failed to execute child process 'dbus-daemon' → 无法运行上游测试，0/5 按 rule 1.2 声明"
