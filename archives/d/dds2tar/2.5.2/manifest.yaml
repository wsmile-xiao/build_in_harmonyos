# 版本级 manifest — dds2tar 2.5.2

version: "2.5.2"
software: "dds2tar"

status: built
build_date: "2026-09-10"
build_system: custom

source:
  # 上游站点在 CI worker 不可达；使用 Debian pool 的 orig.tar.gz（与上游一致）
  url: "https://deb.debian.org/debian/pool/main/d/dds2tar/dds2tar_2.5.2.orig.tar.gz"
  sha256: "5faebb922f7bb0a4313b1f13abd92910e0bff8bdc470adce7610ed469751e82c"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
  - "clang -O2 -Wall -c dds_index.c / dds_extract.c / dds_tape.c / dds_quote.c"
  - "clang -O2 -Wall -DPROGRAM=DDS2TAR -c dds2tar.c -o dds2tar.o"
  - "clang -O2 -Wall -DPROGRAM=DDS2INDEX -c dds2tar.c -o dds2index.o"
  - "clang -O2 -Wall dds2tar.o  <OBJ> -o dds2tar"
  - "clang -O2 -Wall dds2index.o <OBJ> -o dds2index"
  dependencies: []
  cc: clang
  cxx: N/A

patches_applied: []

knowledge_gained:
- "一份源文件 + 一个 -DPROGRAM 宏 → 多个可执行文件：dds2tar.c 用 -DPROGRAM=DDS2TAR/DDS2INDEX 分别编译后再各自与同一组公共 OBJ 链接，产出用途不同的两个工具。配方按宏分支逐个编译，不依赖 make 的 .c.o 隐式规则与自定义后缀规则（`$<`/`$@` 在跨平台 make 下易失效）。"
- "上游 Makefile 把 CC 写成 `CC=cc -g`（把编译选项塞进编译器变量），直接 `make CC=<clang>` 会把 -g 一并带入；配方直接驱动 clang 可完全绕开这一写法。"
- "dds2tar 的 CCOPT 里带 -O4，clang 会警告未知优化级别并降级处理，配方统一用 -O2 保证可复现。"
- "产物 dds2tar / dds2index 均为 ELF64/AArch64，NEEDED 仅 libc.so，零外部依赖。"
