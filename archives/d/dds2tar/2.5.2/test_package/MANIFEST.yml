# test_package/MANIFEST.yml — dds2tar 2.5.2
package: dds2tar/2.5.2
homepage: "https://www.gwdg.de/"

# 上游只提供一个手工测试脚本 dds2tar-test.sh：需要真实 DDS 磁带设备与 root 权限，
# 无法在 CI/容器环境执行，故不计入自动化测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: dds2tar-test.sh
    source: dds2tar-2.5.2
    description: "上游手工测试脚本：需真实磁带设备 + root，CI 不可执行"
    command: "./dds2tar-test.sh"

# test_package 自带消费者测试
test_package_tests:
  - file: test_dds2tar.c
    description: "消费者测试 10 条：dds2tar/dds2index/ddstool 存在+可执行；前两者 ELF64-AArch64；dds2tar 无参数与 -V 均能跑起来（未被信号杀死且非 126-127-255）；-V 输出含源码版本串"
    command: "test_dds2tar <dds2tar> <dds2index> <ddstool>"

# 测试断言总数：上游 0（不可自动化）+ test_package 10
assertion_count: 10
