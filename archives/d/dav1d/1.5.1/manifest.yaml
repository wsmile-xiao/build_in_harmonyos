software: dav1d
# 文件位置: archives/d/dav1d/1.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方镜像 videolan/dav1d，tag 1.5.1 无 v 前缀；tarball 与 code.videolan.org 字节级一致，GitLab 站点对 CI 出口 IP 触发 Anubis 反爬挑战页返回 7KB HTML，故走 GitHub 官方镜像——与 dav1d/1.5.0 入库形态一致）
  url: "https://github.com/videolan/dav1d/archive/refs/tags/1.5.1.tar.gz"

  # 源码校验和
  sha256: "fa635e2bdb25147b1384007c83e15de44c589582bb3b9a53fc1579cb9d74b695"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表（conan MesonToolchain 注入）
  configure_options:
    - "-Dwrap_mode=nodownload"
    - "-Dc_std=gnu99"
    - "-Denable_tools=false"
    - "-Denable_tests=true"
    - "-Denable_examples=false"
    - "-Denable_docs=false"
    - "-Dtestdata_tests=false"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "musl 严格 C99 不声明 POSIX clock_gettime，meson has_function 检测失败 → c_std=gnu99 方言解决（1.5.0 实证，1.5.1 沿用）"
  - "conan MesonToolchain 不注入 ar/ranlib 到 native file，需从编译器同目录推导 llvm-ar/llvm-ranlib 全路径注入（cairo/dav1d 1.5.0 实证）"
  - "鸿蒙 PC XPM 要求 .so 代码签名：llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1（conan install 复制会破坏链接器自签）"
  - "上游 meson test 注册口径：6 个头文件 API 测试（common/data/dav1d/headers/picture/version .h_test）+ checkasm（enable_asm 开启时注册）；testdata_tests 需独立数据仓"
  - "aarch64 asm 路径 OHOS 工具链可用：clang 集成汇编器直接编 .S，gas-preprocessor 仅 MSVC arm 需要；libdav1d 1.5.4 走 C-only，dav1d 1.5.0/1.5.1 走 asm 开启路线（1.5.0 CI 绿实证）"
  - "code.videolan.org GitLab 对 CI/脚本下载出口触发 Anubis 反爬（返回 7KB HTML 挑战页，sha256 校验必然失败）；VideoLAN 官方 GitHub 镜像 github.com/videolan/dav1d 的 archive tarball 与 GitLab 字节级一致（实测 sha256 相同），conandata URL 走 GitHub 官方镜像即可合规且 CI 可拉（CI 对 GitHub URL 另有镜像 fallback 链）"
