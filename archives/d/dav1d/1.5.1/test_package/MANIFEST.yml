# test_package/MANIFEST.yml
# Test declaration for Conan L1 consumer smoke test.

package: dav1d/1.5.1
homepage: "https://code.videolan.org/videolan/dav1d"

upstream_check_command: "meson test -v"
upstream_test_in_build: true
upstream_test_command: "meson test -v"

upstream_tests:
  - file: "tests/header_test.c"
    source: "dav1d-1.5.1/tests/header_test.c"
    description: "Meson header API tests: 6 registered targets (common.h_test, data.h_test, dav1d.h_test, headers.h_test, picture.h_test, version.h_test), each compiles header_test.c with -DDAV1D_TEST_HEADER against one public API header"
    command: "meson test -v"
  - file: "tests/checkasm/*"
    source: "dav1d-1.5.1/tests/checkasm"
    description: "checkasm suite (test('checkasm') in tests/meson.build): registered when enable_asm=true; aarch64 checkasm_64.S compiled by clang integrated assembler"
    command: "meson test -v"
  - file: "tests/dav1d-test-data"
    source: "external dav1d-test-data repository"
    description: "testdata corpus tests identified but not executed: testdata_tests=false, release archive does not bundle the data corpus (needs separate repository)"
    command: "meson test -v"
  - file: "tests/seek_stress.c"
    source: "dav1d-1.5.1/tests/seek_stress.c"
    description: "seek_stress tool identified but not registered as Meson test (requires enable_tools=true + enable_seek_stress=true; this package exports the decoder library only)"
    command: "meson test -v"

test_package_tests:
  - file: test.c
    description: "Consumer lifecycle test: links packaged libdav1d.so, asserts dav1d_version()==1.5.1, default settings sanity, dav1d_open/close/flush round-trip, invalid-arg rejection"
    command: "./test_probe"
assertion_count: 7
