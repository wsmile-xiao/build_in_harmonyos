# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "glib/2.88.0 OHOS 制品只有静态二进制：shared 消费者会把 glib 吞成第二份 GType 运行时，最终 dispose 在错误类型表取 class vfunc 触发 PC=0 SIGSEGV；配方必须默认 static 并加 glib 缺 .so 守卫（草稿 E257，先例 avahi-glib）"
- "鸿蒙可写文件系统均不可 bind AF_UNIX 文件 socket（/tmp EROFS、HMDFS EPERM、/dev/shm EACCES），abstract 命名空间可用：测试工具 socket 改 abstract 优先 + unix:tmpdir=$TMPDIR 回退（草稿 E340）"
- "ptrace 被 SELinux 内核级封锁（gdb/strace 不可用）且 NULL-call 崩溃 ASan 静默：用自装 SIGSEGV handler + ucontext(pc/regs[29]/regs[30]) + dladdr 基址分类 + llvm-addr2line 离线符号化定位（草稿 E341）"
- "E236 la-free：conan 依赖 .la 的 libdir 不可迁移，构建私有 .a 目录 + GLIB/DBUS cache 变量绕开；包内 .la 全部删除"
- "已发布 glib 二进制的 CMakeDeps 组件 include 元数据为空（E216 类），消费者/test_package 走 PkgConfigDeps/.pc 路径"

