# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "依赖库的 glib 快照分叉是跨包适配的硬约束：gtk/3.24.4x 精确 pin glib/2.84.0.1，dbus-glib/0.114 依赖 glib/2.88.0，conan 2 拒绝同图双 glib 版本（Version conflict: glib/2.88.0 vs glib/2.84.0.1）。仓内 6438 个配方无一同时 require gtk 与 dbus-glib —— 需要同时用到二者的包（如 libcryptui）只能靠依赖侧版本对齐解决"
- "消费者侧 override 不能替代依赖侧对齐：override glib->2.84.0.1 虽能解开图冲突，却把 dbus-glib 的 package_id 从已发布的 5073980f（按 glib/2.88.0 构建）改成 c1a87fd6，而 CI 只构建包本体（conan create --build=\"${pkg_name}/*\"），依赖缺二进制即红灯"
- "glib/2.84.0.1（GTK3 链的 glib）OHOS 制品为 shared-only（lib 下只有 .so，无 .a）：沿用 E236『构建私有 .a 目录 + GLIB_* cache 变量』策略时 glib 拷不到任何静态库，in-tree dbus-gmain 自检目标（复用 GLIB_LIBS 链接）报 unable to find library -lgio-2.0；GLIB_LIBS 需追加 -L<glib libdir>，且静态 glib 的 -lintl/-lffi/-lpcre2-*/-lz 不再是链接输入"
- "E236 la-free：conan 依赖 .la 的 libdir 不可迁移，构建私有 .a 目录 + GLIB/DBUS cache 变量绕开；包内 .la 全部删除（0.114.1 沿用，dbus/1.14.10 仍为 static-only，.a 走该目录）"
- "已发布 glib 二进制的 CMakeDeps 组件 include 元数据为空（E216 类），消费者/test_package 走 PkgConfigDeps/.pc 路径"

