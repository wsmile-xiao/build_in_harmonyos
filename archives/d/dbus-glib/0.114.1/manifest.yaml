  - "--disable-shared"
  - "--enable-static"

  # 编译依赖列表（格式: name/version）
  # 0.114.1 与 GTK3 链（gtk/3.24.4x）对齐，使同一张依赖图可同时容纳
  # gtk3 与 dbus-glib（0.114 的 glib/2.88.0 与 gtk3 的 glib/2.84.0.1
  # 在 conan 图中互斥）。expat 以 override 声明对齐（dbus/1.14.10 仍
  # pin expat/2.8.2）。zlib 不再显式声明：glib/2.84.0.1 为 shared-only，
  # zlib 只是 glib 的传递依赖，实测在图里被标 Skip
  # （Skipped binaries: libffi/3.4.4, zlib/1.3.1.1）。
  dependencies:
  - glib/2.84.0.1
  - dbus/1.14.10
  - expat/2.8.2.1
  - pcre2/10.45

  # 编译器
  cc: clang
  cxx: clang++

