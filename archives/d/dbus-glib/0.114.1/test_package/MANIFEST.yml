# test_package/MANIFEST.yml — upstream test declaration (CI gate L0e)
#
# 0.114.1 carries the identical upstream tarball (same sha256) and the
# same five patches as 0.114; only the dependency pins differ (glib/
# 2.84.0.1 line). The upstream suite listing and its per-program results
# below are inherited from the 0.114 device exploration of that same
# tarball (raw logs: ../notes.md, dbusglib-check-final.log and
# test-suite.logs); re-running the suite is blocked by the same missing
# D-Bus session bus tooling. The consumer layer (test_package) is
# re-executed for this revision by conan create.

package: dbus-glib/0.114.1
homepage: "https://dbus.freedesktop.org/doc/dbus-glib/"

# Upstream suite listing tool
upstream_check_command: "make -k check"

# conan create does not integrate upstream tests (no D-Bus session bus
# exists on OHOS devices/CI workers; the 3 bus-wrapped programs cannot
# run there). Upstream tests were executed once on device during the
# exploration build; results recorded here instead of in build().
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: dbus-gmain/tests/30574.c
    source: dbus-glib-0.114/dbus-gmain/tests/30574.c
    description: "GMainContext/dbus-gmain integration regression (bug 30574)"
    command: "make check"
    result: "blocked on OHOS: wrapped by LOG_COMPILER=dbus-run-session; device has no session bus tooling (exit 127, dbus-run-session not found)"
  - file: dbus/dbus-gtest.c
    source: dbus-glib-0.114/dbus/dbus-gtest.c
    description: "legacy in-library test program dbus-glib-test"
    command: "make check"
    result: "passed on OHOS"
  - file: test/specialized-types.c
    source: dbus-glib-0.114/test/specialized-types.c
    description: "specializable GType system (au/a{ss}/a{sv}/ao/as/suo, 6 cases)"
    command: "make check"
    result: "passed on OHOS (static build)"
  - file: test/errors.c
    source: dbus-glib-0.114/test/errors.c
    description: "DBusError <-> GError mapping"
    command: "make check"
    result: "passed on OHOS"
  - file: test/test-compile-nested.sh
    source: dbus-glib-0.114/test/test-compile-nested.sh
    description: "nested introspection XML compiles with dbus-binding-tool"
    command: "make check"
    result: "passed on OHOS"
  - file: test/core/run-peer-test.sh
    source: dbus-glib-0.114/test/core/run-peer-test.sh
    description: "peer-to-peer method call + signal round trip (Increment(42)==43, Frobnicate=42) without a bus daemon"
    command: "make check"
    result: "passed on OHOS after 0004/0005 socket portability patches (abstract namespace)"
  - file: test/core/run-test.sh
    source: dbus-glib-0.114/test/core/run-test.sh
    description: "core suite on a private session bus"
    command: "make check"
    result: "blocked on OHOS: spawns dbus-run-session --config-file (exit 127; no dbus-daemon in dbus conan package nor on device)"
  - file: test/interfaces/run-test.sh
    source: dbus-glib-0.114/test/interfaces/run-test.sh
    description: "interface marshalling suite on a private session bus"
    command: "make check"
    result: "blocked on OHOS: same session bus gap (exit 127)"

# What 0.114.1 changed (build-level, verified by local conan create):
#   * requirements follow the GTK3 stack: glib/2.84.0.1 (shared-only OHOS
#     binary), expat/2.8.2.1, zlib/1.3.1.1;
#   * GLIB_LIBS additionally points at glib's own libdir and drops the
#     static-glib inputs (-lintl -lffi -lpcre2-* -lz). Without this the
#     in-tree dbus-gmain check programs (which link through GLIB_LIBS)
#     failed with "unable to find library -lgio-2.0".

# Consumer-side tests executed by conan create (L1)
test_package_tests:
  - file: test.c
    description: "links libdbus-glib-1; GType collection/map specialization, typed append round-trip, DBUS_GERROR name mapping"
    command: "./test_dbus_glib"
  - file: conanfile.py
    description: "runs packaged dbus-binding-tool --mode=glib-client and content-checks generated glue"
    command: "dbus-binding-tool --mode=glib-client --output=sample-client-glue.h sample-interface.xml"

# Upstream test sources contain 357 g_assert* statements (measured by grep
# over test/ and dbus-gmain/tests of the same tarball); the executed OHOS
# subset passed fully, plus the explicit CHECK assertions in
# test_package/test.c.
assertion_count: 357
