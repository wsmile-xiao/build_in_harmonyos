# conandata.yml — dbus-glib 0.114.1
# Source: official freedesktop release (R39), sha256 verified on device 2026-08-28.
# Same upstream tarball as dbus-glib/0.114 (patches unchanged); the 0.114.1
# revision only re-pins dependencies so one graph can carry gtk3 + dbus-glib.

sources:
  url: "https://dbus.freedesktop.org/releases/dbus-glib/dbus-glib-0.114.tar.gz"
  sha256: "c09c5c085b2a0e391b8ee7d783a1d63fe444e96717cc1814d61b5e8fc2827a7c"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: "Recognize HarmonyOS: emit aarch64-unknown-linux-ohos (E007 autotools OHOS patch set)"
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    patch_description: "Accept linux-ohos kernel-OS combination in config.sub whitelist (E007 + manual one-liner)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: create private tmp dirs with umask 022; HMDFS rejects self-writes under umask 077"
    patch_type: "portability"
  - patch_file: "patches/0004-test-core-peer-server.c.patch"
    patch_description: "test peer-server: prefer abstract AF_UNIX socket, fall back to unix:tmpdir=$TMPDIR; HarmonyOS has no writable filesystem that admits AF_UNIX bind"
    patch_type: "portability"
  - patch_file: "patches/0005-test-core-proxy-peer.c.patch"
    patch_description: "test proxy-peer: honor $TMPDIR instead of hardcoded /tmp (read-only erofs on HarmonyOS)"
    patch_type: "portability"
