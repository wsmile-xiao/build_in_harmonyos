# test_package/MANIFEST.yml — detenc 2.0.0
# CI L0e requires this file to exist.
# 详见: docs/TEST_QUALITY_SPEC.md

package: detenc/2.0.0
homepage: "https://github.com/reevoo/detenc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "TMPDIR=<build folder> make check -j1 CC=<clang from conan conf> CFLAGS=\"-Wall -O2\""

# 上游实际运行的测试程序
upstream_tests:
  - file: "test/ (7 test_*.rb classes + test_helper.rb via Rakefile)"
    source: "detenc-2.0.0/test/"
    description: "Ruby minitest suite driving ../bin/detenc -q over Tempfile inputs; upstream result on device: 43 runs, 334 assertions, 0 failures, 0 errors, 0 skips (BOM detection, encoding detection, ISO-8859-15 vs WINDOWS-1252, US-ASCII, UTF-8 Kuhn stress suite, unknown encoding)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Runs detenc -v version check plus detection assertions on ASCII/ISO-8859-15/UTF-16BE/UTF-16LE/UTF-8-BOM samples (bytes replicate upstream test/inputs)"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估): 上游 minitest 334 assertions + test_package 6 项断言
assertion_count: 340
