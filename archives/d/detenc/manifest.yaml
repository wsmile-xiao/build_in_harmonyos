# Software-level manifest for detenc (ARCHIVE-SPEC v3.0)
software: detenc
display: "detenc"
description: "轻量级启发式字符编码检测工具，可识别 US-ASCII、UTF-8、UTF-16、ISO-8859-15、WINDOWS-1252 或报 UNKNOWN"
category: text
homepage: "https://github.com/reevoo/detenc"
license: MIT
build_system: make

ohos_adaptation:
  key_points:
    - "src/Makefile 硬编码 CC = gcc（Makefile 内赋值优先于环境变量），必须用 make 命令行变量 CC=clang 覆盖"
    - "上游 Ruby 测试使用旧拼写 MiniTest::Test，minitest 5.x 已移除该兼容常量，需大小写修正补丁（同 Alpine APKBUILD 思路）"
    - "make check 依赖 ruby/rake（/data/service/hnp/bin，profile buildenv PATH 已含）且 Tempfile 依赖 TMPDIR，构建时显式指向可写目录（E002）"
    - "usage.inc 由 sed 从 usage.txt 生成，toybox sed 语法兼容"
  common_dependencies: []

versions:
  "2.0.0":
    status: built
    build_date: "2026-09-10"
    conan_ref: "detenc/2.0.0"
