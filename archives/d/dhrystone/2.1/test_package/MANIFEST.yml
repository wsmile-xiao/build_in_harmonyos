package: dhrystone/2.1
homepage: "https://www.netlib.org/benchmark/"
upstream_tests_exist: false
upstream_test_audit: "Netlib dhry-c (sha256 038a7e9169787125c3451a6c941f3aca5db2d2f3863871afcdce154ef17f4e3e) has eight members: RATIONALE, README_C, VARIATIONS, dhry.h, dhry_1.c, dhry_2.c, dhry_c.dif, submit.frm. No build scripts, test directory, registered tests or automated assertions. dhry_1.c prints reference values for manual checking; the added consumer suite checks them automatically."
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
test_package_tests:
  - file: test_dhrystone.py
    description: "12 CLI cases: version, help, bad option, 1/10000/17 iterations, zero, negative, malformed, overflow, EOF and valid timed rate; exact final integers, strings and pointer equality are checked"
    command: "python3 test_dhrystone.py --binary <installed-bin>/dhrystone"
  - file: test_ohos_runtime.c
    description: "One HarmonyOS case combines actual libc loading, 64-bit time ABI, process CPU timing, ELF interpreter, and running the installed benchmark from a writable directory containing spaces and Unicode"
    command: "DHRYSTONE_TEST_OHOS=1 python3 test_dhrystone.py --binary <installed-bin>/dhrystone --probe <build>/test_ohos_runtime"
assertion_count: 45
