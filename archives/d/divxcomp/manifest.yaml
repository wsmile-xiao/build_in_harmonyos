software: divxcomp
display: "DivXComp"
description: "Bitrate calculator for DivX movies (Perl/Tk GUI script)"
category: utility
homepage: "https://salsa.debian.org/debian/divxcomp"
license: "GPL-2"
language: perl
build_system: custom

ohos_adaptation:
  status: built
  build_date: "2026-09-13"
  notes: |
    - 纯 Perl/Tk GUI 脚本（单文件 divxcomp.pl，104 行，上游 2003 年唯一版本），无 C/C++ 编译、无构建系统
    - 运行时依赖：目标环境 Perl 解释器（/data/service/hnp/bin/perl，OHOS 无 /usr/bin/perl，打包时按 E037 重写 shebang）
    - GUI 依赖 Perl::Tk + X11 display，headless OHOS/CI 无 GUI 栈，GUI 功能无法在设备上运行
    - 补丁新增 --version 入口（BEGIN 块，先于 use Tk 执行），供 headless 冒烟验证

versions:
  "0.1":
    status: built
    build_date: "2026-09-13"
    conan_ref: "divxcomp/0.1"
    notes: |
      - 上游无任何测试套件（源码归档仅含 README / GPL.txt / divxcomp.pl / ChangeLog）
      - test_package 提供 headless --version 冒烟（真实调用打包产物），不冒充上游测试
