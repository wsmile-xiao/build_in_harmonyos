# test_package/MANIFEST.yml — 上游测试声明（CI L0e 要求）
package: divxcomp/0.1
homepage: "https://salsa.debian.org/debian/divxcomp"

# 上游无任何测试套件（NO_UPSTREAM_TESTS，证据如下）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# NO_UPSTREAM_TESTS 证据（核验日期 2026-09-13）：
# - 官方源码归档 divxcomp_0.1.orig.tar.gz
#   (sha256 ff6a8cf33579c6590ee2cd82755542c3e070d417b7a231609a25b76e1f65cd62)
#   仅含 4 个文件：README / GPL.txt / divxcomp.pl / ChangeLog；
# - 无 make check / CTest / pytest / 测试脚本 / POD 自检等任何测试入口；
# - 无构建系统（单脚本分发），不存在可开启的测试开关；
# - 脚本为纯 GUI：无条件 MainWindow->new()，运行需要 Perl::Tk + X11 display；
#   headless 环境（CI 设备无 GUI 栈、无 Tk）连 `perl -c` 都会在编译期因
#   缺 Tk 而失败（环境原因，非代码缺陷）。
# 结论：不存在可执行的上游测试。下方 test_package_tests 为移植自建的
# headless 冒烟验证（真实调用打包产物），不冒充上游测试。
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Headless smoke test: divxcomp --version reports 0.1 (via the portability patch entry point, PATH-resolved packaged artifact)"
    command: "bash test.sh"
    assertions:
      - "divxcomp --version exits 0 and prints 'divxcomp 0.1'"

assertion_count: 1
