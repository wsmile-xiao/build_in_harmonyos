version: "0.1"
software: "divxcomp"
status: built
build_date: "2026-09-13"
build_system: custom

source:
  url: "https://deb.debian.org/debian/pool/main/d/divxcomp/divxcomp_0.1.orig.tar.gz"
  sha256: "ff6a8cf33579c6590ee2cd82755542c3e070d417b7a231609a25b76e1f65cd62"
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  dependencies:
    - "perl interpreter from the target environment (runtime dep, /data/service/hnp/bin/perl)"
    - "Perl::Tk + Tk::BrowseEntry + X11 display (GUI runtime dep, unavailable headless)"
  notes: "纯 Perl 单脚本，无编译；build() 仅应用补丁并校验脚本存在"

patches_applied:
  - file: "patches/0001-ohos-headless-version-flag.patch"
    description: "Handle --version in a BEGIN block before `use Tk` so headless environments can query the version"
    type: "portability"

install_files:
  - path: bin/divxcomp
    type: executable
    description: "divxcomp Perl/Tk GUI script (shebang rewritten to target perl per E037)"
  - path: licenses/GPL.txt
    type: license
    description: "GPLv2 full text shipped with the source"

test:
  upstream_test_in_build: false
  upstream_test_command: "n/a (NO_UPSTREAM_TESTS: no upstream test suite — archive contains only README/GPL.txt/divxcomp.pl/ChangeLog)"
  package_test: "divxcomp --version (headless smoke via portability patch)"
  assertions: 1

test_results:
  official_suite: "NOT_RUN (NO_UPSTREAM_TESTS: upstream has no test suite; evidence in test_package/MANIFEST.yml and notes.md)"
  version_check: "PASS (divxcomp --version -> divxcomp 0.1)"
