software: "dd_rescue"
display: "dd_rescue"
description: "数据恢复/复制工具（Kurt Garloff 版），支持坏块跳过与 libddr_* 插件体系"
category: system
homepage: "https://www.garloff.de/kurt/linux/ddrescue/"
license: "GPL-2.0-or-later"
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "上游 tarball 只带 configure.ac，须先 autoheader + autoconf 生成 configure"
    - "configure 内 umask 077 在 HMDFS 上导致 config.status 写临时文件失败（改为 022）"
    - "手写 Makefile 硬赋值 CC = gcc（非 ?=），须在 make 命令行覆盖为 clang 绝对路径"
    - "Makefile 以 OS=$(shell uname) 门控 fstrim.o；OHOS uname=HarmonyOS，须传 OS=Linux"
    - "OHOS 无 coreutils install，且 INSTASROOT = -o root -g root，故不调用 make install"
  common_dependencies: []

# 版本索引
versions:
  - version: "1.99.22"
    status: built
    build_date: "2026-09-12"
    notes: "conan create EXIT=0；真实产物 bin/dd_rescue + lib/libddr_{hash,null,crypt}.so"
