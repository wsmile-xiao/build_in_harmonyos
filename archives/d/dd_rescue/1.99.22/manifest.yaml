version: "1.99.22"
software: "dd_rescue"
status: "built"
build_date: "2026-09-12"
build_system: "autotools"

source:
  url: "https://www.garloff.de/kurt/linux/ddrescue/dd_rescue-1.99.22.tar.bz2"
  sha256: "c15fbfce24a2bf316b5ae795d891f84e7e5ddb583ba2886a55387f40ae767041"
  tar_format: "tar.bz2"

build:
  system: "autotools"
  # 上游只有 configure.ac（无预生成 configure），配方 source() 先 autoheader + autoconf
  configure_options:
    - "--prefix=<package_folder>"
  dependencies: []
  cc: "clang"
  cxx: "clang++"
  notes:
    - "无预生成 configure，须先 autoheader + autoconf（上游 autogen.sh 即此两步）"
    - "configure 内 umask 077 在 HMDFS 上导致 config.status 写临时文件失败，配方改为 umask 022"
    - "Makefile 硬赋值 CC=gcc，须在 make 命令行传 CC=<clang 绝对路径>"
    - "Makefile 以 OS=$(shell uname) 门控 fstrim.o；OHOS uname=HarmonyOS 不匹配 Linux，须传 OS=Linux"

patches_applied: []

knowledge_gained:
  - "OS=$(shell uname) + ifeq ($(OS), Linux) 门控源文件列表：OHOS 上 uname 返回 HarmonyOS，条件静默不成立 → 缺 fstrim.o → 链接期 undefined symbol: fstrim（编译期无感）。命令行传 OS=Linux 即可。"
  - "autoconf configure 的 (umask 077 && mktemp -d) 在 HMDFS 上会建出 drwx--S--- (2700) 的临时目录，因 uid 与文件 owner(20001006) 不同而不可写 → config.status 报 could not setup config headers machinery。把 configure 内 umask 077 改为 022 后 rc=0。"
  - "手写 Makefile 中 CC = gcc 为硬赋值（非 ?=），会覆盖环境变量，必须用 make CC=<abs path> 命令行覆盖。"
  - "OHOS 无 coreutils install 且上游 INSTASROOT = -o root -g root，故不调用 make install，改由配方按 upstream 布局自行落盘。"

homepage: "https://www.garloff.de/kurt/linux/ddrescue/"
license: "GPL-2.0-or-later"
