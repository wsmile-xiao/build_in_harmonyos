# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: delaunay-triangulation/2.1
homepage: "https://github.com/Bl4ckb0ne/delaunay-triangulation"

# 上游测试命令 (meson 构建系统, 测试依赖 catch2)
upstream_check_command: "./tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/tests.cpp, Catch2 3 个 TEST_CASE)
upstream_tests:
  - file: tests/tests.cpp
    source: delaunay-triangulation-2.1/tests/tests.cpp
    description: "Catch2 单元测试: 3 个 TEST_CASE (3点/重复点/10000点 Delaunay 三角剖分)"
    command: "./tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 调用 Delaunay::triangulate() 公开 API 验证三角剖分面积"
    command: "./test_delaunay-triangulation"

# 测试断言总数 (Catch2 3 个断言 + test_package 2 个断言)
assertion_count: 5