name: dhcp-probe
version: "1.3.1"
category: network
description: DHCP 网络探测工具，用于检测网络中的 DHCP 服务器响应
license: GPL-2.0-or-later
homepage: https://www.yellowdogis.com/software/dhcp_probe/
source_url: https://www.yellowdogis.com/software/dhcp_probe/dhcp_probe-1.3.1.tar.gz

build:
  system: autotools
  compiler: clang
  date: 2026-05-29
  platform: HarmonyOS
  arch: aarch64

  # 编译说明
  # 由于 HarmonyOS SELinux 限制，configure/config.status 无法执行
  # 采用手动生成 config.h + 手动编译方案

  steps:
    - description: 手动创建 config.h
      details: |
        根据源码分析和 HarmonyOS SDK 头文件，手动创建 config.h
        定义必要的宏和类型

    - description: 源码修复
      details: |
        修改 src/defaults.h 添加 __HARMONYOS__ 条件编译
        替换默认的 /var/run 和 /etc 路径

    - description: 手动编译
      details: |
        for f in src/*.c; do
          clang -DHAVE_CONFIG_H -I. -I./src -I./lib \
                -I~/usr/local/include \
                -Wno-deprecated-non-prototype -c "$f"
        done
        clang src/*.o lib/my_null_proc.o \
              -L~/usr/local/lib -lnet -lpcap \
              -o dhcp_probe

dependencies:
  runtime:
    - name: libnet
      version: "1.3"
      category: network
      notes: 手动编译安装到 ~/usr/local/

    - name: libpcap
      version: ">=1.0"
      category: network
      notes: 系统提供

patches:
  - name: 0001-harmonyos-default-paths.patch
    description: 添加 HarmonyOS 默认路径支持
    status: applied

packaging:
  format: tar.gz
  arch: aarch64
  platform: ohos

  contents:
    - path: bin/dhcp_probe
      type: binary
      size: 44KB (stripped)

    - path: bin/dhcp_probe_harmonyos
      type: script
      size: 2KB
      description: Wrapper 脚本，自动设置 LD_LIBRARY_PATH

  notes: |
    预编译包已通过 llvm-strip 剥离调试符号
    原始大小: 66KB，剥离后: 44KB

status: published
date: 2026-05-29

notes: |
  功能测试结果：
  - 基本功能正常，版本号正确显示
  - 配置文件自动读取成功（__HARMONYOS__ 条件编译生效）
  - 网络功能需要 root 权限或 CAP_NET_RAW 能力

  已知限制：
  - 需要 root 权限或 CAP_NET_RAW 才能执行网络探测
  - 默认路径使用用户 home 目录下的临时路径