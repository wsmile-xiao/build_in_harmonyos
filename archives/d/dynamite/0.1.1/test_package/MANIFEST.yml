# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dynamite/0.1.1
homepage: "https://github.com/twogood/dynamite"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# R51 清点结论：上游 0.1.1（commit ccf573ad71ce）无 tests/ 目录，
# Makefile.am 无 TESTS/check_PROGRAMS 声明，make check 为空操作（0 项测试）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 dynamite_explode，空输入流必须返回非成功错误码"
    command: "./test_dynamite"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
