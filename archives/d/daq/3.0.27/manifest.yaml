# 编译中学到的知识
knowledge_gained:
  - "autotools 需要 autoreconf -ivf 并添加 pkg.m4 到 m4/ 目录才能正确展开 PKG_CHECK_EXISTS 等宏"
  - "config.guess/config.sub 需要打 OHOS 补丁才能识别 aarch64-unknown-linux-ohos triplet"
  - "config.sub 需要在 kernel-os case 行添加 linux-ohos*- 才能验证 triplet"
  - "HMDFS 上 umask 077 会导致 mktemp 创建的临时目录权限不足，无法写入文件，需改为 umask 000"
  - "libpcap 预编译包(cmd-pkgs)下载文件为空壳/损坏，因此禁用 pcap/bpf/dump 模块编译"
  - "DAQ 3.0.27 可用模块: afpacket, fst, savefile, trace, gwlb（不含 pcap/bpf/dump）"
