# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dextractor/1.0.1
homepage: "https://github.com/thegenemyers/DEXTRACTOR"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# 上游无任何测试：Makefile 无 check 目标（已核实），源码包无 tests/ 目录、
# 无单元测试文件、无测试脚本、无 fixture、无样例数据。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 → 空列表）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "CLI 功能验证（bash 驱动）：T1 dexta 压缩 fasta → undexta 解压往返一致；T2 quiva 往返（无损流 + delTag 重建）；T3 错误路径；T4 dextract HDF5/zlib 运行时探针（鸿蒙特有）"
    command: "conan create (test() 内 bash test.sh, conanrun env)"
  - file: conanfile.py
    description: "test() 通过 VirtualRunEnv 以 bash 包裹执行 test.sh（OHOS mksh 不能直接执行 ELF）"
    command: "conan create (test() 内置)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10