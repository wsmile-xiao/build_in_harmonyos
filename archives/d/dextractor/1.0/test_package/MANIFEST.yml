    description: "T1 fasta→dexta→undexta 往返字节一致；T2 quiva→dexqv→undexqv 往返(无损流+delTag重建)；T3 错误路径；T4 dextract 目标平台运行时(HDF5 动态加载+zlib滤镜)"
    count: 4
    command: "bash test.sh"
test_package_test_count: 4
test_package_passed_count: 4
test_package_failed_count: 0
test_package_pass_rate: "100%"
# 脚本内实际断言数: T1(3) + T2(4: 压缩/解压/无损流/delTag) + T3(3×2) + T4(2)
assertion_count: 15
