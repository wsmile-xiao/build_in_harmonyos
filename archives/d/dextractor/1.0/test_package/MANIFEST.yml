package: dextractor/1.0
homepage: "https://github.com/thegenemyers/DEXTRACTOR"

# 上游无任何测试目标/测试目录（R51 清点证据见 notes.md「上游测试清点申报表」）
# Makefile 仅 all/clean/install/package 四个目标，源码树无 tests/ 目录
