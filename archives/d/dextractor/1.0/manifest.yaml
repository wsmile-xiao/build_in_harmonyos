version: "1.0"
software: "dextractor"
status: partial
build_date: "2026-09-10"
build_system: makefile

source:
  url: "https://github.com/thegenemyers/DEXTRACTOR/archive/V1.0.tar.gz"
  sha256: "5f45ab8944f857fc30b7a0e762fbdc63d9b61f3303412deee29d7580c53272bc"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - hdf5/1.14.6
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-makefile-portable-toolchain-and-install.patch"

knowledge_gained:
  - "上游 Makefile 规则体写死字面 gcc（非 $(CC)），make CC= 覆盖无效，必须打补丁改为 $(CC) 才能使用 Conan conf 编译器（R33）"
  - "PATH_HDF5 前缀被 Makefile 的 -I$(PATH_HDF5)/include -L$(PATH_HDF5)/lib 使用，可直接指向 Conan 依赖包 folder（hdf5/1.14.6 包内含 include/ 与 lib/）"
  - "dextract 入口先调 H5Zfilter_avail(H5Z_FILTER_DEFLATE)，可作目标平台运行时探针：libhdf5.so 动态加载 + zlib 滤镜可用性一步验证（rule12 鸿蒙特有测试）"
  - "dexqv/undexqv 的 delTag 流按上游设计以 2-bit 有损重建（非 ACGT → 'a'，run 位 → 'n'），仅 delQV/insQV/mergeQV/subQV 与头行无损"
  - "degenerate 输入（QV 流全部等于 run char）会使 Huffman 直方图清空导致上游段错误——上游限制，测试数据需保持值多样"
