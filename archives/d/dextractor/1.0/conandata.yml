# conandata.yml — DEXTRACTOR 1.0
# 官方源: GitHub 上游 tag V1.0（Debian 亦以 1.0 打包，homebrew-science 引用同一 tarball 与 SHA256）
sources:
  url: "https://github.com/thegenemyers/DEXTRACTOR/archive/V1.0.tar.gz"
  sha256: "5f45ab8944f857fc30b7a0e762fbdc63d9b61f3303412deee29d7580c53272bc"

patches:
  - patch_file: "patches/0001-makefile-portable-toolchain-and-install.patch"
    patch_description: "Makefile 可移植化：字面 gcc 改为 $(CC)（R33 由 Conan conf 提供编译器）；PATH_HDF5/DEST_DIR 改为可被 make 命令行覆盖；install 目标不再写死 ~/bin"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-db-c-rindex-to-strrchr.patch"
    patch_description: "DB.c 的 BSD 遗留函数 rindex() 替换为 POSIX 等价 strrchr()（OHOS libc 裁剪 rindex 符号，链接报 undefined symbol: rindex；对应知识草稿 DRAFT-cconv-0.6.3-rindex-strrchr）"
    patch_type: "portability"
    strip: 1
