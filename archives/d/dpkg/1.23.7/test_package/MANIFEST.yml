# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dpkg/1.23.7
homepage: "https://wiki.debian.org/Teams/Dpkg"

# 上游测试命令
# dpkg 上游测试在 tests/ 目录（t-lib-pkg-*.c 等 C 测试），依赖 Debian 完整
# 构建环境（rule 4 核验：tar tJf 确认 tests/ 存在）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# dpkg tests/ 需 Debian 构建环境——OHOS 沙箱无法运行（如实记录，rule 4）
upstream_tests:
  - file: tests/t-lib-pkg-*.c
    source: dpkg_1.23.7.tar.xz
    description: "上游测试套件需 Debian 完整构建环境，OHOS 沙箱未运行（tar tJf 核验存在）"
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_dpkg.py
    description: "R34：dpkg 二进制存在（bin/dpkg）"
    command: "python3 test_dpkg.py <package>"

assertion_count: 1
