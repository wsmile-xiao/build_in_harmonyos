# 版本级 manifest — dpkg 1.23.7
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.23.7"

# 软件名
software: dpkg

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-27"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/d/dpkg/dpkg_1.23.7.tar.xz"

  # 源码校验和
  sha256: "60fe2be7a965ca8794e903ec1a13f41bb0b6b6e8c85c8d53c7aee7c0dca3f2d1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-linux-gnu"
    - "--disable-shared"
    - "--enable-static"
    - "--without-start-stop-daemon"
    - "--without-dselect"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - bzip2/1.0.8
    - xz/5.6.2
    - lzma/5.6.2
    - ncurses/6.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - category: L1
    content: "OHOS 沙箱 /tmp 只读 + $HOME/.ci_logs 不可写——autotools config.status 的相对路径 mktemp（./confXXXXXX）创建临时目录被拒，需 TMPDIR 指可写目录并替换 ac_tmp 模板"
    reason: "dpkg configure→config.status 阶段 'Permission denied'（与 commoncpp2/libdebian-installer 同因），沉淀为 SKILL autotools-config-status-mktemp-sandbox"
  - category: L1
    content: "dpkg-architecture.pl 不识别 ohos triple——host 用 aarch64-linux-gnu + DEB_HOST_ARCH=arm64 环境变量使架构检测通过"
    reason: "实测 'cannot determine host dpkg architecture'，arm64 是 aarch64 的 Debian 架构名"
  - category: L1
    content: "鸿蒙环境仅有 toybox 的非 GNU patch/tar——configure 的 PATCH/TAR 检测失败，需 GNU wrapper 并以环境变量传入"
    reason: "实测 'cannot find a GNU patch program'"
  - category: L1
    content: "dpkg configure 检测 md5.h + MD5Init 链接（libmd5）与 curses（ncursesw）——沙箱缺系统库时生成 stub 或从 conan 依赖补路径"
    reason: "实测 'library containing MD5Init... no' / 'no curses library found'"
