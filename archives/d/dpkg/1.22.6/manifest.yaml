  test_environment: "OpenHarmony arm64-ohos"

  summary:
    total_tests: 21
    passed: 10
    failed: 11
    warnings: 1
    overall_status: "partial"  # full | partial | broken

  passed_tools:
    - name: dpkg
      function: "核心包管理工具"
      status: "正常工作"
    - name: dpkg-deb
      function: "包处理（查询/解压）"
      status: "正常工作"
    - name: dpkg-query
      function: "包查询"
      status: "正常工作"
    - name: dpkg-split
      function: "包分割/合并"
      status: "正常工作"
    - name: dpkg-divert
      function: "文件 diversion"
      status: "正常工作"
    - name: dpkg-statoverride
      function: "权限覆盖"
      status: "正常工作"
    - name: dpkg-trigger
      function: "触发器管理"
      status: "正常工作"
    - name: update-alternatives
      function: "替代品管理"
      status: "正常工作"
    - name: start-stop-daemon
      function: "守护进程管理"
      status: "正常工作"
      note: "位于 sbin/ 目录"

  failed_issues:
    - issue_id: "PERL001"
      severity: "high"
      description: "Perl 模块路径问题"
      affected_tools:
        - "dpkg-architecture"
        - "dpkg-buildpackage"
        - "dpkg-scanpackages"
        - "dpkg-scansources"
        - "dpkg-buildflags"
      root_cause: "Dpkg.pm 安装位置错误（~/usr/local/Dpkg.pm），Perl @INC 不包含用户本地路径"
      workaround: "设置 PERL5LIB=\"$HOME/usr/local/share/perl/5.42.0\""
      fix_suggestion: "重新安装时正确放置 Perl 模块到 share/perl 目录"

    - issue_id: "HMDFS001"
      severity: "medium"
      description: "HMDFS 文件系统权限限制"
      affected_functions:
        - "dpkg-deb --build（创建 .deb 包）"
        - "本地包仓库创建"
      root_cause: "HMDFS ACL 自动设置 setgid 位，目录权限为 2771，不满足 dpkg-deb 要求（0755-0775）"
      workaround: "使用现有 .deb 包进行查询/解压；在非 HMDFS 环境创建包"
      fix_suggestion: "评估是否可修改 dpkg 源码放宽权限检查（不推荐）"

# ============================================================
# 使用限制与注意事项
# ============================================================

limitations:
  - category: "perl_tools"
    description: "Perl 工具需配置环境变量"
    affected: 40%
    solution: "export PERL5LIB=\"$HOME/usr/local/share/perl/5.42.0\""

  - category: "package_creation"
    description: "无法在用户目录创建 .deb 包"
    affected: "包构建功能"
    solution: "使用下载的现有包或非 HMDFS 环境"

  - category: "dselect"
    description: "已禁用（ncursesw 兼容性问题）"
    affected: "图形化包管理界面"
    solution: "使用命令行工具替代"

