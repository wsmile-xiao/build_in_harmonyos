# test_package/MANIFEST.yml — datatype99 1.6.5
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: datatype99/1.6.5
homepage: "https://github.com/hirrolot/datatype99"

# 上游测试命令（手动复现：cmake -S . -B build -D... && ctest；注意上游
# CMakeLists.txt 用 FetchContent 现场下载 metalang99）
upstream_check_command: "cmake -S . -B build && cmake --build build && ctest --test-dir build"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内直接编译实跑 tests/ 5 个测试程序（tests/metalang99_compliant/derive/record_derive/version）"

# 上游 5 个测试程序：运行时 assert 共 50 条（tests.c 40 + metalang99_compliant.c 5
# + derive.c 4 + record_derive.c 1），version.c 为编译期 ML99_ASSERT_UNEVAL
#（编译成功即通过，与 metalang99 上游惯例一致）。metalang99 依赖不走 FetchContent，
#用本仓已适配的 metalang99/1.13.5（与上游 CMakeLists 钉的版本一致）；
#-fsanitize=address 省略（OHOS musl clang ASan 不在本配方保证范围），断言语义不变。
upstream_test_count: 50
upstream_test_cases_skipped: 0
