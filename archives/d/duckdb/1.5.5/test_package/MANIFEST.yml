# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: duckdb/1.5.5
homepage: "https://duckdb.org"

# 上游测试命令
upstream_check_command: "./build/release/test/unittest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 实测规模（duckdb-1.5.5 源码树）：
#   - test/**/*.test (sqllogictest 脚本) : 4087 个
#   - test/api/*.cpp (C++ API 测试)      : 73 个
#   - CMake 目标 `unittest`（test/CMakeLists.txt:50），
#     由 BUILD_UNITTESTS 控制（CMakeLists.txt:475，默认 TRUE）
#   - 需要 aarch64 目标机上存在源码树（DUCKDB_ROOT_DIRECTORY 编译期固定为
#     源码根目录，test/CMakeLists.txt:44-48），故本次 recipe 构建
#     BUILD_UNITTESTS=OFF，未运行上游套件（见 notes.md 的诚实申报）
upstream_tests:
  - file: test/unittest
    source: duckdb-1.5.5/test/unittest
    description: "DuckDB built-in unit test suite (sqllogictest + API tests); 4087 .test files + 73 test/api/*.cpp"
    command: "./build/release/test/unittest"
    count: 4087
    executed: false
    not_run_reason: "unittest 目标未构建（BUILD_UNITTESTS=OFF）；且其运行需要源码树位于 DUCKDB_ROOT_DIRECTORY 编译期绝对路径下"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test (C API): duckdb_open in-memory, connect, SELECT 1+1, CREATE TABLE, multi-row INSERT, COUNT(*), VARCHAR round-trip"
    command: "./test_duckdb"
    assertions: 6

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
