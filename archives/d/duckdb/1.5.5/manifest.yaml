software: duckdb

# 版本号
version: "1.5.5"

# 编译状态
status: built

# 编译日期
build_date: "2026-09-13"

# 构建系统
build_system: cmake

# 源码信息
source:
  url: "https://github.com/duckdb/duckdb/archive/refs/tags/v1.5.5.tar.gz"
  sha256: "f33155ff962e6e1e08fd1e9caffa487d4325aa60999e2eabc76feff534d6558b"
  tar_format: tar.gz

# 构建配置
build:
  system: cmake
  configure_options:
    - "-G Ninja"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"
    - "-DDUCKDB_EXPLICIT_PLATFORM=linux_arm64"
    - "-DBUILD_SHELL=OFF"
    - "-DBUILD_UNITTESTS=OFF"
    - "-DBUILD_BENCHMARKS=OFF"
    - "-DEXTENSION_STATIC_BUILD=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "1.5.5 新增跨编译硬阻塞：CMakeLists.txt:873-887 在未指定 DUCKDB_EXPLICIT_PLATFORM 时构建 duckdb_platform_binary 并在 custom command 中 *运行* 它来探测平台——aarch64 目标二进制无法在构建主机执行，交叉编译必然失败。设置 -DDUCKDB_EXPLICIT_PLATFORM=linux_arm64 走 else() 分支（仅 echo），同时定义 DUCKDB_CUSTOM_PLATFORM 绕过 platform.hpp:38-39 的 legacy C++ ABI #error"
  - "1.5.5 的 shared 库与 static 库在 src/CMakeLists.txt:96,107 是无条件构建的，没有 shared/static 开关——配方不再暴露 shared 选项，两个库都安装"
  - "上游 install(EXPORT) 没有 NAMESPACE（CMakeLists.txt:911），导出目标名是裸 duckdb / duckdb_static；duckdb::duckdb 只存在于 Conan CMakeDeps 生成的 config 中"
  - "third_party/ 仍完整内置（zstd/snappy/lz4/brotli/thrift/parquet/mbedtls/re2/fmt/utf8proc/miniz/yyjson/libpg_query），默认扩展集 core_functions+parquet 均在源码树内，configure 阶段无 FetchContent 下载"
  - "Use Ninja generator instead of Unix Makefiles to avoid try-compile detection issues on HarmonyOS"
  - "Set CMAKE_BUILD_WITH_INSTALL_RPATH=ON for proper RPATH handling"
