software: dazz_db
display: "DAZZ_DB"
description: "Dazzler 组装器的压缩读段数据库（FOO.db + 隐藏索引/序列/质量值文件）与 13 个命令行工具（官方 tag V1.0）"
category: db
homepage: "https://github.com/thegenemyers/DAZZ_DB"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 的 16 条规则（13 个 ALL + 3 个 DBupgrade 迁移工具）全部硬编码 gcc 且写死 -lm，需改为 $(CC)/$(CPPFLAGS)/$(LDFLAGS)/$(LDLIBS)（源文件列表逐条保留、不用 $^）才能用 clang 构建（0001）"
    - "OHOS libc 导出 index 但不导出 BSD 遗留别名 rindex，链接期 undefined symbol，需统一改写为 strchr/strrchr（DB.c 4 处 + DBshow.c 1 处，0002，与 E570 同源）"
    - "HIDE_FILES 隐藏辅助文件约定（PATHSEP=\"/.\"）下 Load_QVs 用 rindex+2 固定偏移还原可见 stub 会拼出 ./.<root>/<root>.db，导致 DBshow -q/-Q 无法读取质量值 DB；需按 root[1]=='.' 还原路径（0003，修复形态与上游 2025-02 快照一致）"
    - "V1.0 全部 16 条规则只链 -lm，无 zlib/arrow/ONE 工具，与 2025-02 快照版本（21 工具、-lz）不同；无第三方 Conan 依赖"
    - "上游没有测试套件（Makefile 无 check/test 目标），适配侧用 test_package 驱动全部 13 个工具做端到端验证（41/41），另附消费者用例（8/8）"

versions:
  "1.0":
    status: built
    build_date: "2026-09-22"
    conan_ref: "dazz_db/1.0"
