# 实跑命令的唯一权威副本（notes.md 只引用，不复制）
validation:
  adaptation_tests:
    command: "sh test_package/test.sh <package_folder>/bin <work-dir>   # test_package/conanfile.py 以 env=conanrun 调用"
  conan_create:
    command: "conan create archives/d/dazz_db/1.0 -pr:h=<abs>/ci/conan/profiles/ohos-aarch64 -pr:b=<abs>/ci/conan/profiles/ohos-aarch64 --build=missing --user=ohpcd --channel=stable"
  conan_verify:
    command: "python3 scripts/ohc-run.py conan-verify dazz_db 1.0 --project-dir <repo>"

knowledge_ref:
  - "knowledge/graph/E570.kv"   # 草稿状态，rindex → strrchr（同源，本包 0002）

knowledge_gained:
  - "上游 V1.0 的 Load_QVs 在 HIDE_FILES 下把可见 stub 拼成 ./.<root>/<root>.db 导致 DBshow -q/-Q 无法读取带质量值 DB；2025-02 快照已修复（按 root[1]=='.' 还原路径），本包以 0003 对齐该修复形态"  # reference: 本包 patches/0003
  - "OHOS libc 导出 index 但不导出 BSD 遗留别名 rindex（musl 一般两者都有），表现为链接期 undefined symbol: rindex；统一改写为 POSIX strchr/strrchr（本包 0002 与 E570 同源）"  # knowledge_ref: E570
  - "上游零测试套件时按『上游 0 用例 + 适配侧独立计数』申报，不把 0/0 写成 100%：先给出零入口证据（Makefile target 集合、测试文件计数、prescan has_tests）再做替代验证"  # reference: DRAFT-cute_files-1.0.0-upstream-zero-test-ohos-validation
  - "上游 Makefile 全部规则硬编码 gcc 且写死 -lm 时，0001 使 16 条规则尊重 CC/CPPFLAGS/CFLAGS/LDFLAGS/LDLIBS；V1.0 无 zlib 依赖（无 arrow2DB/DB2arrow，无 -lz 规则），与 2025 快照版本不同"  # reference: 本包 patches/0001