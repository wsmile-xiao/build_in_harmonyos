# test_package/MANIFEST.yml
# 上游测试声明与适配侧测试清单（CI L0e 强制要求存在）。

package: dazz_db/1.0
homepage: https://github.com/thegenemyers/DAZZ_DB

# ---------------------------------------------------------------------------
# 上游测试：本版本没有测试套件（0 用例，不是跳过、不是部分执行）
# ---------------------------------------------------------------------------
upstream_check_command: ""
upstream_test_in_build: false

# 上游零测试的证据（设备实测命令与结论，取数于 2026-09-22，官方 tag V1.0
# = commit 40bb7e4b2041cdfd3c50b22201301b8df06342fa）:
#   1. 唯一构建文件 Makefile 的 target 只有 all/clean/install/package 与 16 个
#      工具名（13 个 ALL + 3 个 DBupgrade.*/DUSTupgrade.*），没有 check/test 目标:
#      grep -cE '^(check|test|testall|unittest)' Makefile  ->  0
#   2. 源码树没有测试目录也没有测试脚本:
#      find <src> -maxdepth 2 -iname 'test*' -o -iname '*_test*'  ->  无输出
#      （顶层 *.c 是工具源码，不是测试入口）
#   3. prescan 报告的构建系统只有 make，has_tests: false
#      （python3 scripts/ohc-run.py prescan <src>: 有测试: False）
#
# ── 完整枚举台账（逐项分类，2026-09-22 实测）───────────────────────────
# | 类别 | 枚举结果 | 是否独立上游用例 | 实际运行 | 说明 |
# |------|---------|----------------|---------|------|
# | 用户测试源（test 目录/独立测试 .c） | 0 个 | — | — | find -maxdepth 2 无 test* 文件 |
# | 测试脚本/CI 测试任务 | 0 个 | — | — | Makefile 无 check/test/testall 目标 |
# | 单元测试框架引用（gtest/catch2/boost.test） | 0 个 | — | — | grep 无框架头引用 |
# | 样例/示例程序 | 0 个 | — | — | 无 examples/ 目录，README 流程块是文档非程序 |
# | 基准/benchmark | 0 个 | — | — | 无 bench* 文件 |
# | fixture/测试数据 | 0 个 | — | — | 无测试数据文件 |
# | 框架头/源码（DB.c/QV.c 等库文件） | 20 个 .c/.h | 否（构建源码） | 编译运行 | 工具实现源码，计入构建不列入测试 |
# | 构建目标（Makefile 16 个工具 target） | 16 个 | 否（构建目标） | 全部构建 | 全部为 CLI 工具产物，无测试 target |
# └───────────────────────────────────────────────────────────────────────
#
# 因此上游统计为 TOTAL=0 PASS=0 FAIL=0 SKIP=0 NOT_RUN=0，不参与通过率分母；
# 通过率只按适配侧用例计算（分子=分母）。
upstream_tests: []

# ---------------------------------------------------------------------------
# 适配侧测试（test_package/test.sh，全部真实执行 13 个 ALL 工具）
# ---------------------------------------------------------------------------
test_package_tests:
  - file: test.sh
    description: >-
      awk 确定性合成 5000 bp 参考基因组; fasta2DAM/DAM2fasta 往返逐字节一致;
      simulator 对 0.005 Mbp 基因组按固定种子合成 20x 读段并输出 -M map 文件;
      fasta2DB/DB2fasta 往返逐字节一致; DBstats -n/直方图与 DBshow/-w40 输出;
      DBsplit -s1 分区 + DBdust + Catrack 汇聚 dust 轨 + DBstats -mdust/DBshow -mdust;
      quiva2DB/DB2quiva 质量值流往返逐字节一致与 DBshow -q/-Q;
      DBrm 生命周期完整移除主库与索引。
    counting_rule: >-
      分母 TOTAL = PASS + FAIL；SKIP 单列、不计入分母（本设备预期 SKIP=0）。
      每条断言对应一次真实命令执行与真实输出核对（退出码 + 文件存在 +
      逐字节 cmp 或 grep 输出特征），无空壳断言。