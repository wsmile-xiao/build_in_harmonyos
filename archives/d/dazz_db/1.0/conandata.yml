  sha256: "ae7a71b71925dd5a1fd4026ca7462a70cb8ade9d3afd5cdeef0f1bd11b9c9105"

patches:
  "1.0":
    - patch_file: "patches/0001-Makefile-honour-toolchain-variables.patch"
      patch_type: "portability"
      patch_description: "Makefile 尊重 CC/CPPFLAGS/CFLAGS/LDFLAGS/LDLIBS 变量，不再硬编码 gcc（全部 16 条规则，含 13 个 ALL 工具与 3 个 DBupgrade 工具）"
    - patch_file: "patches/0002-replace-BSD-rindex-with-POSIX-strrchr.patch"
      patch_type: "portability"
      patch_description: "用 POSIX strrchr 替换 BSD 遗留 rindex（OHOS libc 不导出该符号；DB.c 4 处 + DBshow.c 1 处）"
    - patch_file: "patches/0003-fix-loadqvs-stub-path.patch"
      patch_type: "bugfix"
      patch_description: "Load_QVs 打开可见 stub 时按 HIDE_FILES 的 /. 前缀正确还原路径（上游 V1.0 bug：DBshow -q/-Q 对带质量值 DB 报 Cannot open ./.<root>/<root>.db；修复形态与上游 2025-02 快照一致）"