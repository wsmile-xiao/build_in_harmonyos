package: dr_flac/0.12.39
homepage: "https://github.com/mackron/dr_libs"

upstream_check_command: "n/a — upstream testvectors/flac/ ships empty (DO_NOT_DELETE.md only); no official FLAC sample exists in the 0.12.39 tree"
upstream_test_in_build: false
upstream_test_command: "n/a — upstream flac tests (dr_flac_decoding.c/dr_flac_seeking.c) require libFLAC + testvectors that are absent in the 0.12.39 release tree"
upstream_test_note: >
  mackron/dr_libs 0.12.39 (release commit 7d3638f) ships tests/flac/ with
  dr_flac_decoding.c, dr_flac_seeking.c, dr_flac_test_0.c but an EMPTY
  testvectors/flac/ directory (only DO_NOT_DELETE.md). dr_flac_decoding.c
  additionally #includes the external libFLAC reference decoder and
  miniaudio, which are git submodules (tests/external/) not populated in the
  archive tarball. So the official upstream test suite cannot be run against
  the archive source as-is. A deterministic, structurally-valid FLAC test
  vector is generated instead (gen_testvector.py -> flac_test_vector.h) and
  decoded through the public dr_flac API by test_dr_flac.c, exercising two
  subframe decoders + CRC-8/CRC-16 + multi-channel.

test_package_tests:
  - file: test_dr_flac.c
    description: >
      Consumer test consuming the real dr_flac package (DR_FLAC_IMPLEMENTATION
      in one TU). Opens a generated 2-channel FLAC vector in-memory and reads
      all 256 frames via drflac_read_pcm_frames_s16. Asserts: version==0.12.39;
      STREAMINFO recovered (2ch/44100Hz/16bps/256 frames); ch0 CONSTANT subframe
      decodes to the expected constant; ch1 VERBATIM subframe decodes to the
      exact sawtooth. 8 assertion groups.
    command: "./test_dr_flac"
  - file: flac_test_vector.h
    description: >
      Deterministic 566-byte FLAC stream generated by gen_testvector.py
      (fLaC + STREAMINFO[34B] + one frame: sync 0xFF3E, ch0 CONSTANT(12345)x256,
      ch1 VERBATIM sawtooth x256, 256 Hz-independent, 44100 Hz, 16 bps,
      CRC-8/CRC-16 computed exactly as dr_flac computes them).
    command: "n/a (data header)"

assertion_count: 8
