# dr_flac 0.12.39 编译档案
software: dr_flac
version: "0.12.39"
status: built
build_system: header-only
compile_date: 2026-08-30

dependencies:
  required: []
  optional: []

build_config:
  target: aarch64-linux-ohos
  configure_options: []
  cflags: "-fPIC -O2"
  env:
    CC: clang
    CXX: clang++

patches_applied: []

compatibility:
  level: high
  issues: []
  notes: |
    - single-header 库，dr_flac.h (~512 KB) 来自 mackron/dr_libs 多库集合，零外部依赖（仅 libc/libm）
    - 消费者 #include <dr_flac/dr_flac.h> 并在一个 TU 中定义 DR_FLAC_IMPLEMENTATION
    - 不产出 lib/ 制品；package_type=header-library，package_id 清理为 header-only
    - clang 15 (OHOS profile) 完全兼容，conan create 本地 W3 通过

source:
  url: "https://github.com/mackron/dr_libs/archive/7d3638f215599e4b576fe5d4be4f6820b9988e48.tar.gz"
  sha256: "3358845445ce36a2bc029b531b5183ada71be13a1285d4a381088e91d3171a09"
  tar_format: tar.gz
  revision_note: >
    0.12.39 无 git tag（flac-0.12.39 不存在，现有 flac tag 自 flac-0.12.43 起）且无
    GitHub Release。官方来源锁定为 release commit
    7d3638f215599e4b576fe5d4be4f6820b9988e48（commit message "dr_flac: Version
    0.12.39", committed 2022-09-17T07:11:14Z），与 dr_flac.h 头部
    "dr_flac - v0.12.39 - 2022-09-17" 及 DRFLAC_VERSION_* 宏 (0/12/39) 交叉核验一致。

test_results:
  type: consumer
  upstream:
    source_files: 0
    registered_targets: 0
    executed: 0
    passed: 0
    failed: 0
    skipped: 0
    skip_reason: "上游 mackron/dr_libs 0.12.39 (release commit 7d3638f) 的 tests/flac/ 附带 dr_flac_decoding.c / dr_flac_seeking.c / dr_flac_test_0.c，但 testvectors/flac/ 目录为空（仅 DO_NOT_DELETE.md），且 dr_flac_decoding.c 依赖外部 libFLAC 参考解码器与 miniaudio（tests/external/ 为未填充的 git submodule）。官方上游测试套件在归档源码上无法直接运行。"
  consumer:
    test_program: 1
    assertions: 8
    passed: 8
    failed: 0
  note: "上游测试向量目录为空，改用确定性生成的 566 字节合法 FLAC 测试向量（gen_testvector.py -> flac_test_vector.h），经真实 OHOS clang 编译的 dr_flac 0.12.39 通过公开 API 解码：覆盖 CONSTANT + VERBATIM 两种子帧解码器、多声道独立路径、帧 CRC-8/CRC-16 校验。conan create 本地 W3 全绿（8/8 断言通过）。"

knowledge_gained:
  - "dr_flac 是 single-header C 音频 FLAC 解码器，package_type=header-library，零运行时依赖（libc/libm）"
  - "dr_flac.h 安装到 include/dr_flac/dr_flac.h；消费者 #include <dr_flac/dr_flac.h> + 一个 TU 定义 DR_FLAC_IMPLEMENTATION"
  - "官方 0.12.39 无 tag/release，锁定 release commit 7d3638f215599e4b576fe5d4be4f6820b9988e48，归档 tarball sha256=3358845445ce36a2bc029b531b5183ada71be13a1285d4a381088e91d3171a09"
  - "上游 tests/flac/ 的 testvectors/flac/ 为空（仅 DO_NOT_DELETE.md），上游测试不可运行 → 用确定性生成向量替代"
  - "dr_flac 帧头：sync 0xFF + 6-bit 0x3E；帧头 CRC-8（poly 0x07, init 0）；帧 CRC-16（poly 0x8005, init 0, MSB-first）覆盖 sync→子帧数据、不含末尾 2 字节 CRC 字段"
  - "STREAMINFO 实际 34 字节（min/max block 16+16, min/max frame 24+24, sampleRate20|channels3|bps5|total36, MD5 16）；block header 长度字段须为 0x22"
  - "bitsPerSample 帧编码用 3 位表 {0,8,12,-1,16,20,24,-1}，16bps=code 4；sampleRate 表 44100=code 9；channelAssignment 1=independent 2ch；blockSize code 8=256"
  - "License：MIT-0 OR Unlicense（dr_flac.h 头声明 'Choice of public domain or MIT-0'）"

references:
  - https://github.com/mackron/dr_libs
  - https://github.com/mackron/dr_libs/commit/7d3638f215599e4b576fe5d4be4f6820b9988e48
