# conandata.yml — debianbuttons 2.3
# Debian "icedeb" (Debian queries) webextension — 官方 orig 源码包。
# 源：deb.debian.org 官方 pool（R39 合规：https 官方镜像，非 Debian 下游重打包 URL）。
# 权威仓库: salsa.debian.org/webext-team/debianbuttons（branch master，tag debian/2.3-2）
#
# sha256 核验方法（本地实测，两次独立下载一致）：
#   curl -fsSL -o debianbuttons_2.3.orig.tar.gz \
#     "https://deb.debian.org/debian/pool/main/d/debianbuttons/debianbuttons_2.3.orig.tar.gz"
#   sha256sum debianbuttons_2.3.orig.tar.gz
#   # -> d5e8fc7f3c38184e2a202fddedbd75b1825e38a1f8a6a2601458aca3af356dce
#   # 与 Debian sources.debian.org 官方页面列出的 sha256 一致

sources:
  url: "https://deb.debian.org/debian/pool/main/d/debianbuttons/debianbuttons_2.3.orig.tar.gz"
  sha256: "d5e8fc7f3c38184e2a202fddedbd75b1825e38a1f8a6a2601458aca3af356dce"

# 本包无补丁：JS/CSS/HTML webextension 源码，无 C/C++ 编译、无平台相关代码需要改动；
# build() 以纯 Python zipfile 复刻上游 Makefile 的 `all`（打包 icedeb.xpi），CI 无需 make/zip。
patches: {}
