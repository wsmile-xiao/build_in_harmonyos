# test_package/MANIFEST.yml — debianbuttons 2.3
# 上游测试声明（诚实申报：Debian "icedeb" webextension 无测试套件）
package: debianbuttons/2.3
homepage: "https://salsa.debian.org/webext-team/debianbuttons"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

upstream_test_evidence:
  find_tests: "find . -iname '*test*' -> 0 results (no tests/ directory)"
  test_framework: "no Jest/Mocha/QUnit/tape/ava/jasmine/ctest/pytest declarations (manifest.json permissions only: activeTab/storage/clipboardRead)"
  test_scripts: "find . -name '*.test.js' -o -name '*.spec.js' -o -name 'test-*.js' -o -name 'run-tests*' -> 0"
  makefile_targets: "Makefile only has `all` (zip 打包 icedeb.xpi), no check/test/install target"
  files_total: 15

# Harmony 特有 package/artifact 验证（非 upstream test；本机另以 node 版消费者套件
# test-icedeb-xpi-consumer.js 双跑 15/15 一致，见 reports/test-report.md）
test_package_tests:
  - file: test_debianbuttons.py
    description: >
      验证：打包布局（源码树 + build() 构建的 icedeb.xpi，且无 bin/ 目录、无
      .so/.a/.o/ELF 产物——诚实性检查）；manifest.json 元数据契约（manifest_version
      == 2、version == 2.3、name == 'Debian queries'、gecko 扩展 ID、权限集
      {activeTab,storage,clipboardRead}）；manifest 引用资源闭包（icons/browser_action
      /theme_icons 引用文件全部存在）；icedeb.xpi 归档完整性（合法 zip、条目 ==
      上游 Makefile ALL_FILES 12 项、无路径穿越、manifest.json/icedeb.js/
      icedeb-content.js/icedeb.html/icedeb.css 逐条目与打包源码字节一致）；
      icedeb.html 本地引用闭包；icedeb.js/icedeb-content.js 核心函数与
      onMessage 监听标记
    command: "python3 test_debianbuttons.py <package_folder>"

assertion_count: 30
