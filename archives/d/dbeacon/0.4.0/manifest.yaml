# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libc++ 下 C++ 源码内 using namespace std 后裸调用 POSIX bind() 会被 std::bind 模板抢占，编译期报 invalid operands to binary expression ('__bind<...>' and 'int')；把该调用限定为 ::bind 即可，对 glibc/libstdc++ 无损"  # knowledge_ref: E2175（第 5 类）；同类先例 knowledge/drafts/DRAFT-cloop-3.14.1.3-nmu1-ohos.md
  - "知识图谱引擎对 E2175 的 error_signature（含正则元字符、按字面包含匹配）无法命中本次真实错误，需人工按条目正文第 5 类比对；已在本任务反馈文件中留证"  # reference: notes.md「问题 1」与 feedback/pending/2026-09-10-dbeacon-0.4.0.md
  - "纯 Makefile 项目按 R33 从 tools.build:compiler_executables 取 clang++ 绝对路径并以命令行变量 CXX= 传入；上游 Makefile 的 -g -Wall -O2 与 Sun 编译器探测逻辑无需改动"  # reference: notes.md「编译步骤」
  - "OHOS sysroot 对 <sys/signal.h> 提供重定向到 <signal.h> 的 shim，本包只需编译警告（-W#warnings），无功能影响"  # reference: notes.md「问题 2」
  - "CI/W3 的 L2 冒烟探针只尝试 GNU 风格 --version/--help 且要求退出码 0；只有单横线长选项（-version/-help）或打印后返回 1 的上游工具会被判非阻塞 warn，此时以 test_package 与人工 L2 复核为准"  # reference: notes.md「W3 本地 CI 模拟」与 reports/w3-local-ci.log
