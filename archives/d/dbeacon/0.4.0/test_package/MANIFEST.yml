# test_package/MANIFEST.yml — dbeacon 0.4.0
# CI L0e 要求此文件存在，用于声明上游测试来源与消费者测试内容。

package: dbeacon/0.4.0
homepage: "https://github.com/uoaerg/dbeacon"

# ── 上游测试清点（R51 第 1 步）───────────────────────────────────────────────
# 官方 tarball 共 23 个文件，无测试目录、无测试程序；Makefile 目标只有
# all / dbeacon / 各 .o / install / install_mans / clean，没有 check 或 test。
# 清点命令与原始输出：
#   find . -type f | wc -l
#     -> 23
#   find . -iname '*test*' -o -iname 'check*'
#     -> contrib/checkmatrix.sh（cron 邮件通知部署脚本，非测试）
#   make -n check
#     -> make: *** No rule to make target 'check'.  Stop.
#   grep -nE '^[A-Za-z_.-]+:' Makefile
#     -> all / dbeacon / dbeacon.o / dbeacon.h / msocket.h / protocol.h /
#        dbeacon_posix.o / protocol.o / ssmping.o / install / install_mans / clean
upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试用例（0 个），故列表为空：既不是 PASS 也不是 skip。
upstream_tests: []

# ── 消费者测试（test_package）───────────────────────────────────────────────
test_package_tests:
  - file: test.sh
    description: "运行已安装的 dbeacon：断言 -V 版本横幅与制品自报版本指纹（0.3.9.2p1）、-h 用法行与 -b 组播组选项；随后真实启动 IPv4 组播 beacon（-b 239.192.0.1 -I 1 -d dump.xml）并校验产出的 dump.xml 中的版本指纹、beacon 名、管理邮箱与组地址"
    command: "bash test.sh"

assertion_count: 8
