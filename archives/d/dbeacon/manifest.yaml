# 软件级 manifest — dbeacon
# 位置: archives/d/dbeacon/manifest.yaml

software: dbeacon
display: "dbeacon"
description: "IPv4/IPv6 multicast connectivity beacon: announces itself on multicast groups and collects reachability, loss, delay and jitter statistics about the other beacons"
category: network
homepage: "https://github.com/uoaerg/dbeacon"
license: MIT
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Makefile 工程（无 configure）：从 profile 的 tools.build:compiler_executables 取 clang++ 绝对路径，make -j1 CXX=<clang++>，cwd 必须是 source_folder"
    - "C++ 源码内 using namespace std 后裸调用 POSIX bind() 会被 libc++ 的 std::bind 抢占，需限定为 ::bind"
    - "上游自报版本串长期停留在 0.3.9.2p1，版本号以官方 tag 与 Changelog 为准"
    - "运行时需要可加入组播组的网络接口；设备默认接口实测可用"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.4.0":
    status: built
    build_date: "2026-09-10"
    conan_ref: "dbeacon/0.4.0"
