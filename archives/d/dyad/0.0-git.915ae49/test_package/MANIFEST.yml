# test_package/MANIFEST.yml — dyad 0.0-git.915ae49
# CI L0e requires this file to exist.

package: dyad/0.0-git.915ae49
homepage: "https://github.com/rxi/dyad"

# Upstream ships no build system for the library and no test target
# (repository contains only src/dyad.c, src/dyad.h, examples and doc/).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs (examples/ are interactive demo servers, not tests).
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_dyad.c
    description: >-
      Links libdyad and drives the full TCP consumer path over 127.0.0.1
      loopback: version banner, listenEx with kernel-assigned ephemeral port,
      listening state, async connect, CONNECT/ACCEPT events, write + LINE
      event (newline stripped), DATA event payload match, peer address/port
      observability, bytesSent/bytesReceived counters, shutdown with
      zero leaked streams. 15 assertions total.
    command: "./test_dyad"

assertion_count: 15
