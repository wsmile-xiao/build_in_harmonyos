# 软件级 manifest — dyad
# 遵循 ARCHIVE-SPEC v3.0

software: dyad

display: "dyad"

description: "rxi 的轻量级 TCP socket C 库（单 select 事件循环，单 .c + 单 .h）"

category: network

homepage: "https://github.com/rxi/dyad"

license: MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "上游无构建系统（仓库仅 src/dyad.c+dyad.h+示例+doc）：配方直接编译 dyad.c 后 llvm-ar 归档 libdyad.a，无需补丁"
    - "非 Windows 路径纯 POSIX socket API（fcntl/getaddrinfo/select/gettimeofday），musl 全兼容，零补丁零依赖"
    - "编译器/归档器从 tools.build:compiler_executables 字典取（R33），不从裸 shell 变量取"
    - "源码用 ghfast.top 镜像（archive/refs/heads 格式，codeload 格式在 ghfast 返回 403）+ 官方源兜底的 URL 列表"
    - "上游无测试套件（0 用例）；test_package 用 127.0.0.1 socket 回环做消费者全链路验证（15 断言）"
    - "上游从未发布 release tag，版本号按 git 快照口径 0.0-git.915ae49（master tip 915ae49，2016-08-28 最后提交）"
  common_dependencies: []

versions:
  "0.0-git.915ae49":
    status: built
    build_date: "2026-10-03"
    conan_ref: "dyad/0.0-git.915ae49"
