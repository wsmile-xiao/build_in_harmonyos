# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: deb2targz/20100710
homepage: "https://www.miketaylor.org.uk/tech/deb/"

# 上游测试命令
# 上游为 2002 年的单个 Perl 脚本，**不带任何测试套件**（无 tests/、无 Makefile、
# 无 CI 配置），故无 upstream_check_command 可声明。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

upstream_test_note: |
  上游**确实没有测试套件**（非"未启用"）：该包是 Mike Taylor 个人站点上的单个
  Perl 脚本（1947 字节，68 行），仓库内无 tests/、无 Makefile、无任何测试目标。
  可取证的判据：
    · 上游交付物本身即单个脚本文件（非归档），不存在测试目录；
    · 脚本内只有 `Usage:` 提示与转换逻辑，无自检代码路径；
    · Gentoo/FreeBSD 的打包记录（app-arch/deb2targz、
      archivers/deb2targz）亦无测试阶段（portage 无 IUSE=test，FreeBSD 无
      do-test 目标）。

  由于上游无可实跑的测试，本配方改为**驱动该工具的真实职责**进行验证 ——
  `test_package/run_deb2targz_tests.py`（6 项）：
    1. bin/deb2targz 存在且可执行；
    2. shebang 已正确改写为 #!/usr/bin/env perl；
    3. shebang 未携带 -w（否则 env 会去找名为 "perl -w" 的程序而失败）；
    4. 负向：非 .deb 输入被正确忽略（打印 ignoring）且不产生输出文件；
    5. ★ 正向真实验证：Python 按 ar 格式**现场手工构造**一个含真实 tar 数据的
       .deb → 执行转换 → 输出与其中原始 data.tar.gz **逐字节一致**；
    6. 转换结果可被 tarfile 解开且含预期文件。

  > 第 5 项是该工具唯一职责的直接验证（"转换结果正确"，而非"命令能跑"），
  > 且不需要 ar / dpkg-deb ——该脚本本身按字节解析 ar 格式。
