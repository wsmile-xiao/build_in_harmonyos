version: "20100710"
software: "deb2targz"
status: "built"
build_date: "2026-09-12"
build_system: "none"

source:
  url: "https://www.miketaylor.org.uk/tech/deb/deb2targz"
  sha256: "f597319db098a9d6b5199e39b8a9ced0973d9ee84927286de4d5816d8e76a44b"
  format: "raw-file"          # ⚠️ 上游不是归档，而是单个 Perl 脚本
  version_note: >
    上游自身不带版本号；Gentoo(app-arch/deb2targz-1-r3) 与
    FreeBSD(archivers/deb2targz) 均以日期 20100710 作为发行版本号，本配方沿用。

build:
  system: "none"
  dependencies: []
  notes:
    - "无构建步骤：单文件 Perl 脚本，仅改写 shebang 后安装"
    - "shebang 由 #!/usr/bin/perl -w 改为 #!/usr/bin/env perl，并去掉 -w"

patches_applied: []

knowledge_gained:
  - "上游为裸脚本文件（非归档）→ 配方须用 download() 而非 get()（get() 会尝试解压）。"
  - "shebang 两处问题（沿用既有草稿 DRAFT-ohos-perl-script-package-conan-adaptation 的模式）：① OHOS 无 /usr/bin/perl → 改 /usr/bin/env perl；② 必须同时去掉 -w，因内核把 shebang 首空白之后的全部内容作为单个参数传给解释器，env 会去找名为 'perl -w' 的程序（实测 env: exec perl -w: No such file or directory）。"

runtime_dependencies:
  perl: "5.42.2"

homepage: "https://www.miketaylor.org.uk/tech/deb/"
license: "GPL-2.0-or-later"
