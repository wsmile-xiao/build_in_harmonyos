software: "deb2targz"
display: "deb2targz"
description: "把 Debian .deb 包转换为 .tar.gz 归档的单文件 Perl 转换工具"
category: system
homepage: "https://www.miketaylor.org.uk/tech/deb/"
license: "GPL-2.0-or-later"
build_system: none

# 跨版本通用说明
ohos_adaptation:
  key_points:
    - "上游是裸文件（单个 Perl 脚本）而非归档 → 配方用 download()，不能用 get()"
    - "OHOS 无 /usr/bin/perl → shebang 改为 #!/usr/bin/env perl 由 PATH 解析"
    - "★ 必须同时去掉 -w：内核把 shebang 首空白之后的全部内容当作单个参数传给解释器，env 会去找名为 'perl -w' 的程序而失败"
  common_dependencies:
    - perl

# 版本索引
versions:
  - version: "20100710"
    status: built
    build_date: "2026-09-12"
    notes: "单文件 Perl 脚本；conan create EXIT=0；test_package 6/6（含构造真实 .deb 验证转换结果逐字节一致）"
