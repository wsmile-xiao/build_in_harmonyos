software: docker-completion
display: "Docker Completion"
description: "Docker CLI 的 bash completion 脚本"
category: utilities
homepage: "https://github.com/docker/cli"
license: Apache-2.0
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 bash 脚本，无需编译，直接复制安装"
    - "需要 bash-completion 包才能生效"
    - "源码来自 Docker CLI 仓库的 contrib/completion/bash/docker"
  common_dependencies:
    - bash-completion

# 版本索引（所有已归档版本，含状态）
versions:
  "29.5.2":
    status: built
    build_date: "2026-05-26"