software: dazzdb
display: "DAZZ_DB"
description: "Dazzler 组装器的压缩读段数据库（FOO.db + 隐藏索引/序列/质量值文件）与 21 个命令行工具"
category: db
homepage: "https://github.com/thegenemyers/DAZZ_DB"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 的 21 条规则全部硬编码 gcc，其中 20 条还写死 -lm 或 -lz（实测 18 条带 -lm、2 条带 -lz，交集为空，rangen 两者皆无），需改为 $(CC)/$(CPPFLAGS)/$(LDFLAGS)/$(LDLIBS)（源文件列表逐条保留、不用 $^）才能用 clang 构建"
    - "OHOS libc 导出 index 但不导出 BSD 遗留别名 rindex，链接期 undefined symbol，需统一改写为 strchr/strrchr"
    - "ONElib 把模式临时文件硬编码到 /tmp，而设备 /tmp 是只读挂载，必须改为运行时探测可写目录（且路径缓冲区要有界）"
    - "上游 Makefile 为 arrow2DB/DB2arrow 链 -lz 但源码并不调用 zlib API：`-lz` 解析到包管理器的静态 libz.a 后产物零 libz 依赖（对照：直接链 sysroot 桩 libz.so 会多出一条 NEEDED libz.so）"
    - "DB2arrow 缺 Open_Arrow 调用、DBstats 掩码轨循环 use-after-free、DB2ONE 无参数越界写属上游缺陷，需补丁"
    - "上游没有测试套件（Makefile 无 check/test 目标），适配侧用 test_package 驱动全部 21 个工具做端到端验证"
  common_dependencies:
    - zlib

versions:
  "1.0-git20250217.a3eefd4":
    status: built
    build_date: "2026-09-11"
    conan_ref: "dazzdb/1.0-git20250217.a3eefd4"
