# test_package/MANIFEST.yml
# 上游测试声明与适配侧测试清单（CI L0e 强制要求存在）。

package: dazzdb/1.0-git20250217.a3eefd4
homepage: https://github.com/thegenemyers/DAZZ_DB

# ---------------------------------------------------------------------------
# 上游测试：本版本没有测试套件（0 用例，不是跳过、不是部分执行）
# ---------------------------------------------------------------------------
upstream_check_command: ""
upstream_test_in_build: false

# 上游零测试的证据（设备实测命令与结论，取数于 2026-09-11）:
#   1. 唯一构建文件 Makefile 的 target 只有 all/install/clean/package 与 21 个
#      工具名，没有 check/test 目标:
#      grep -cE '^(check|test|testall|unittest)' Makefile  ->  0
#   2. 源码树没有测试目录也没有测试脚本:
#      find <src> -maxdepth 2 -iname 'test*' -o -iname '*_test*'  ->  无输出
#      （顶层的 21 个二进制是构建 target 名称，不是测试入口）
#   3. gscan 报告的构建系统只有 make，has_tests: false
#      （python3 scripts/ohc-run.py prescan <src>: metadata.has_tests = false）
#   4. debian/rules 只有 dh_auto_build/install，无 override_dh_auto_test:
#      grep -c 'override_dh_auto_test' debian/rules  ->  0
#
# 旁证（不是上游测试，只是同源流程的独立参照）: Debian 源码包在
# debian/tests/run-unit-test 提供了一个打包侧 autopkgtest，跑的是同一套
# README 流程（rangen -> fasta2DAM -> simulator -> fasta2DB -> DBsplit ->
# DBdust -> Catrack -> DBstats -mdust）并以 md5 校验产物。它属于打包者编写的
# 集成测试、不是上游测试套件，因此不计入上游用例数；适配侧的 test_package
# 按同一流程驱动全部 21 个工具，并额外覆盖 quiva/arrow/ONE 与 DB 生命周期。
# 注: Debian 把 simulator 重命名为 dsimulator 以避免 /usr/bin 命名冲突，
# 本包安装到 Conan 包内独立 bin/ 目录，保留上游原名。
#
# 因此上游统计为 TOTAL=0 PASS=0 FAIL=0 SKIP=0 NOT_RUN=0，不参与通过率分母；
# 通过率只按适配侧用例计算（分子=分母）。
upstream_tests: []

# ---------------------------------------------------------------------------
# 适配侧测试（test_package/test.sh，全部真实执行 21 个打包产物）
# ---------------------------------------------------------------------------
test_package_tests:
  - file: test.sh
    description: >-
      rangen 生成随机参考基因组; fasta2DAM/DAM2fasta 往返逐字节一致;
      simulator 合成 20x 读段数据集; fasta2DB/DB2fasta 往返逐字节一致;
      DBstats/DBshow 输出与导入读段逐字节一致（忽略大小写）;
      DB2ONE 导出头/起源/嵌入 schema/载荷并拒绝缺 stream 的选项;
      DBsplit+DBdust+Catrack 建立掩码轨且 DBstats -mdust 读出统计;
      临时目录探测在 TMPDIR 缺失/不存在/存在但不可写（宿主真实只读挂载，现场 test -w 判定，
      不用 chmod 造目录——hmdfs 不执行权限位）/超长路径下都必须可用;
      注意「不可写」两例依赖宿主存在真实不可写的挂载点：本设备命中 /tmp（erofs ro）；
      宿主无此前提时该两条记 SKIP（不冒充 PASS、也不误报为产品缺陷），届时 TOTAL=91 SKIP=2;
      DBtrim/DBcp/DBmv/DBrm 生命周期; arrow2DB+DB2arrow 与 quiva2DB+DB2quiva
      往返逐字节一致; DBshow -a/-A/-q/-Q 与 DB2ONE -a/-q 读取对应 stream;
      DBwipe 抹除 quiver/arrow 数据后 DB2arrow 正确报错。
    command: "sh test.sh <package_folder>/bin <build_folder>"

# 统计单位: 断言（test.sh 的 ok/no 计数），取数命令:
#   sh test.sh <bin-dir> <work-dir> | tail -2
# 设备实测（2026-09-11）: PASS=93 FAIL=0 TOTAL=93 SKIP=0
# 分母口径 TOTAL = PASS + FAIL；SKIP 单列、不计入分母（仅当宿主缺少用例前提时出现）
assertion_count: 93
