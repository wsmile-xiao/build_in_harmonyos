knowledge_ref:
  - "knowledge/graph/E002.kv"
  - "knowledge/graph/E093.kv"

knowledge_gained:
  - "上游把 /tmp 硬编码进源码时 E002 的 TMPDIR 方案不成立：运行中的进程不会重读环境变量到字面路径上，必须用运行时探测（access(W_OK) 依次试 TMPDIR/tmp/HOME/cwd）改写；反证实测：TMPDIR 指向可写目录时未修版本仍 abort，目录内零文件"  # knowledge_ref: E002
  - "探测结果参与路径拼接后，上游原本安全的定长缓冲区会变成隐患：ONElib 的 static char template[64] 在长 TMPDIR 下 sprintf 溢出（本任务自己引入又由测试第 11 节抓出），改写时必须同时改为有界 snprintf + 长度校验"  # reference: 本包 patches/0003
  - "OHOS libc 导出 index 但不导出 BSD 遗留别名 rindex（musl 一般两者都有），表现为链接期 undefined symbol: rindex 且 lld 提示 did you mean: index；nm -D 核对 libc 后再统一改写为 POSIX strchr/strrchr"  # knowledge_ref: E093
  - "DB2arrow 只校验 allarr 的 DB_ARROW 位而不调用 Open_Arrow 打开轨对象，对带 arrow 数据的 DB 即以 Arrow data is not available 失败（实测 A-DB 上未修版本 3/3 exit 1、修复版 3/3 exit 0）；DBshow 的同名路径正确调用了 Open_Arrow，可作对照"  # reference: 本包 patches/0005
  - "DBstats 的掩码轨统计循环在 track->next 迭代中调用 Close_Track(db,track) 释放当前节点，形成 use-after-free（与 Debian debian/patches/use-after-free.patch、上游 issue 41 同源）；行为随堆布局而变而非必然崩溃，实测同一未修二进制在一个库上 5/5 SIGSEGV、在另一个库上 5/5 正常退出，修复是移除该调用"  # reference: 本包 patches/0006
  - "DB2ONE 在 argc==1 时按 argc>=1 分支访问 argv[1] 并把 6 字节写进按参数总长 Malloc 的小缓冲区，无参数调用越界（实测未修版本 5/5 以 139 段错误结束、修复版 5/5 打印用法并 exit 1）；守卫条件应为 argc > 1"  # reference: 本包 patches/0004
  - "上游零测试套件时按『上游 0 用例 + 适配侧独立计数』申报，不把 0/0 写成 100%：先给出零入口证据（Makefile target 集合、测试文件计数、prescan has_tests、Debian 无 override_dh_auto_test）再做替代验证"  # reference: DRAFT-cute_files-1.0.0-upstream-zero-test-ohos-validation
  - "上游 Makefile 写了 -lz 而源码并不调用 zlib API 时，保留依赖并让它解析到静态库可让产物零外部依赖；直接链 OHOS sysroot 的桩 libz.so 会给产物留下 NEEDED libz.so 条目（设备只有 libz.so.1 没有 libz.so）"  # reference: 本包 notes.md 依赖版本段
