software: dnscrypt-proxy
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.14"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/myagent2/build_in_harmonyos/dnscrypt-proxy-2.1.14.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | go | custom
  system: go

  # Go 版本要求
  go_version: "1.24"

  # 配置选项列表
  configure_options: []
  # Go 编译参数:
  # - CGO_ENABLED=0 (静态编译)
  # - GOPROXY=https://goproxy.cn,direct

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.26.1

  # 编译器
  cc: clang
  cxx: clang++

  # 构建产物
  build_product: dnscrypt-proxy

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
