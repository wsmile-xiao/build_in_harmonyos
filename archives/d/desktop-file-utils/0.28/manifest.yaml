software: desktop-file-utils
version: "0.28"
build_system: meson
status: built
source:
  url: "https://www.freedesktop.org/software/desktop-file-utils/releases/desktop-file-utils-0.28.tar.xz"
  sha256: "4401d4e231d842c2de8242395a74a395ca468cd96f5f610d822df33594898a70"
knowledge_gained:
  - "desktop-file-utils 为 .desktop 文件工具集（desktop-file-validate/install、update-desktop-database），纯 CLI 工具"
  - "唯一依赖 glib-2.0/gio-2.0（meson dependency >=2.26），由 conan glib/2.84.0 配方提供"
  - "meson 构建需注入 ar/ranlib 全路径到 native file（OHOS llvm-ar 不在默认 PATH，pango/cairo 同款方案）"
  - "纯 CLI 工具：bin/ 下可执行文件需代码签名（鸿蒙 XPM 要求）"
