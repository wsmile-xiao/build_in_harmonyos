# test_package/MANIFEST.yml — desktop-file-utils 0.28
# CI L0e requires this file to exist.

package: desktop-file-utils/0.28
homepage: "https://www.freedesktop.org/wiki/Software/desktop-file-utils"

# 上游无标准测试套件（纯 CLI 工具，meson 无 test 目标，无 tests/ 目录）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序（已完整枚举：meson.build 无 test()，上游 CI 仅跑空 ninja test）
upstream_tests: []

# test_package 自带的验证（消费者 + 鸿蒙专项，fork+exec 无 shell 注入）
test_package_verification:
  - command: "desktop-file-validate --version"
    expect: "0.28"
  - command: "test_desktop_file_utils <bin>  (valid .desktop -> exit 0, invalid -> exit 1)"
    expect: "OK-A/OK-B/OK-C 全部通过"
