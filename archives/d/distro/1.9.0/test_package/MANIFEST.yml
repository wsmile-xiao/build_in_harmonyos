# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md 与 docs/ADAPTATION_GUIDE.md §6

package: distro/1.9.0
homepage: "https://github.com/python-distro/distro"

# 上游测试命令 — distro 上游使用 pytest 测试套件 (tests/test_distro.py)
upstream_check_command: "pytest tests/"

# conanfile.py build() 方法中是否已集成上游测试 (distro 为纯 Python 包, 未在 build 中跑 pytest)
upstream_test_in_build: false
upstream_test_command: "pytest tests/"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_distro.py
    source: distro-1.9.0.tar.gz/tests/test_distro.py
    description: "上游 pytest 套件: OS-release/LSB-release/CLI/整体行为等 158 个测试"
    command: "pytest tests/test_distro.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试 — 验证 distro 模块可导入、版本为 1.9.0、能查询发行版信息"
    command: "./test_distro"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 160