# ============================================================
# 构建配置
# ============================================================

build:
  # meson 构建的 GNOME gsettings 后端 + dconf CLI
  system: meson

  configure_options:
    - "-Dsystemduserunitdir="
    - "-Dbash_completion=false"
    - "-Dman=false"
    - "-Dgtk_doc=false"
    - "-Dvapi=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0
    - dbus/1.14.10

  # 编译器
  cc: clang
  cxx: clang++

