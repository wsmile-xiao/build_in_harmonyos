# conandata.yml — dovecot 2.4.4 配方数据

sources:
  url: "https://dovecot.org/releases/2.4/dovecot-2.4.4.tar.gz"
  sha256: "670f98d55a29b02ae6a97281e51374e553b94496480ab0a07439571ab30ca8c3"

patches:
  - patch_file: "patches/0001-config.guess-ohos.patch"
    description: "config.guess 识别 aarch64 OHOS/HarmonyOS 为 linux-ohos"
  - patch_file: "patches/0002-configure-fd-passing-ohos.patch"
    description: "configure fd passing 探测：OHOS 交叉编译时 AC_RUN_IFELSE 被跳过误报 no，豁免为 yes；config.status 临时目录 umask 077 改 022（OHOS 沙箱 0700 目录不可写）"
  - patch_file: "patches/0003-test-framework-ohos.patch"
    description: "测试框架临时目录 mkdir 0700 改 0755（OHOS 沙箱 0700 目录不可写，8 个测试转绿）"
  - patch_file: "patches/0004-disable-libauthdb-imap-plugin.patch"
    description: "禁用 libauthdb_imap 插件（passdb-imap 远程 IMAP 认证后端，OHOS 不需要）：其 LDFLAGS 硬编码 -shared，纯静态构建下 libtool 仍强制建共享库报 'cannot build a shared library'（CI #42024），从 auth_module_LTLIBRARIES 移除"
  - patch_file: "patches/0005-remove-test-cpu-limit.patch"
    description: "从 src/lib 测试列表移除 test-cpu-limit：其 cpu_limit_exceeded() 忙循环依赖 SIGXCPU 信号，OHOS 沙箱不触发该信号 → 无限循环卡死 make check（CI #42024 超时被杀，test-suite.log 未汇总致 total=0）；该测试测的是 cpu-limit 信号机制，沙箱无法覆盖，从 am__EXEEXT_1/test_programs 移除"
