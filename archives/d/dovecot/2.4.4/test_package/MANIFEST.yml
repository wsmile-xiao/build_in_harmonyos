# test_package/MANIFEST.yml
#
# dovecot 2.4.4 — OHOS 适配验证清单
#
# 验证方式：conanfile check() 阶段执行 `make check -k`（dovecot 无独立 test/ 目录，
# 上游测试与产品同构，见 src/*/test-*.c）。
#
#   PASS / FAIL 见下方统计（OHOS 沙箱环境限制，与上游一致或为沙箱预期失败）
#   （CI #44667 全量 make check 新增 13 个 expected_fails：auth/dns/http/smtp/
#   program-client/fs-posix/oauth2 等 bind/listen/link Operation not permitted，
#   charset/message-decoder 为 iconv 差异，本地干净树复现一致）
#
# 说明：dovecot 是完整邮件服务器（非可嵌入库），无官方"库级"消费者 API 文档。
# 本 test_package 验证：
#   1. 全部 OHOS 补丁（0001-0003）应用后 configure + make 全量编译成功
#   2. make check 测试框架运行：除 expected_fails 外全部 PASS
#   3. expected_fails 均为 OHOS 沙箱环境限制（非补丁缺陷）：
#      - 网络/socket（bind/connect/AF_INET）：沙箱禁止，上游 CI 亦需特权
#      - sqlite dict：OHOS sqlite 无 unix socket 支持
#      - 文件 link()：沙箱禁止 hard link
#      - 嵌套 0700 子目录：lib 测试框架用 0700 建临时目录，OHOS 沙箱下
#        0700 目录在 umask 022 后仍受限（生产代码创建，非 test 框架，
#        需上游支持 0755 才能修，超出 conan 适配范围）
#      - 沙箱超时：mail-index / mail-index-modseq 需大量 I/O，沙箱下超 60s
#
# expected_fails 分类（23 个，已逐一确认根因）：
#   [沙箱网络]  5: test-istream-fifo(无socket) test-service-set test-service-type
#               test-imapclient-common test-pop3-client
#   [沙箱link]  4: test-istream test-istream-file test-istream-file-offset
#               test-istream-file-posix
#   [嵌套0700]  5: test-mail test-mail-storage test-maildir-storage
#               test-mbox-storage test-mail-index-modseq
#   [沙箱超时]  2: test-mail-index test-mail-cache-purge
#   [sqlite]    3: test-dict-sqlite test-dict-sqlite-conn test-dict-sqlite-pool
#   [imap解析]  2: test-imap-client test-imap-client-parsing
#   [cache]     2: test-mail-cache test-mail-cache-fields
#
# 转绿（8 个，0001+0003 补丁效果）：
#   test-compression（0001 zlib/openssl 探测修复）
#   test-settings（0001 临时目录 0755）
#   test-master-service-settings（0001 临时目录 0755）
#   test-smtp-submit（0001 临时目录 0755）
#   test-mail-index-write（0003 临时目录 0755）
#   test-mail-transaction-log-append（0001 临时目录 0755）
#   test-istream-attachment（0003 临时目录 0755）
#   test-dir（0003 临时目录 0755）

# 已转绿的测试（0001+0003 补丁修复，make check 应 PASS）：
fixed_by_patch:
