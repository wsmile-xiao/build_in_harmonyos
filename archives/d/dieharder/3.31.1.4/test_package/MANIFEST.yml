package: dieharder/3.31.1.4
# 上游没有 automake make check / ctest 目标（顶层与各子目录 Makefile.am 均无 check）。
# dieharder 本身就是随机数测试套件：官方测试入口 = dieharder CLI，
# 在 test_package test() 中真实执行；上游测试与包产物验证都在 conan create 的 test 阶段完成。
upstream_test_in_build: false
upstream_tests:
  - name: "dieharder -l"
    scope: "smoke：列出全部内置测试模块（上游 31 项：diehard_* 17 + marsaglia_tsang_gcd 1 + sts_* 3 + rgb_* 5 + dab_* 5）"
    executed_in: "test_package (conan create test 阶段)"
  - name: "dieharder -d 0 -p 3 -S 42"
    scope: "subset 1/31：Diehard_Birthday，固定种子真实运行"
    executed_in: "test_package (conan create test 阶段)"
  - name: "dieharder -d 2 -p 3 -S 42"
    scope: "subset 2/31：Diehard_Rank_32x32，固定种子真实运行"
    executed_in: "test_package (conan create test 阶段)"
  - name: "dieharder -d 13 -p 3 -S 42"
    scope: "subset 3/31：Diehard_Squeeze，固定种子真实运行"
    executed_in: "test_package (conan create test 阶段)"
  - name: "dieharder -a（全部 31 项，默认 psamples=100）"
    scope: "NOT_RUN in CI（窗口受限）；CI 后对同一构建产物在真机补跑全量"
    reason: "真机全量为小时级，超过 CI conan create 3600s 窗口；加长超时需改 ci/config/build_timeouts.txt（属 ci/**，写入硬边界禁止）。Builder 在 CI 通过后于真机对 conan cache 中的同一构建产物执行全量 -a 并留存日志（本机 run 目录与 run 报告上游测试章节）"
test_package_tests:
  - file: test.c
    description: "真实消费方探针：按上游契约（libdieharder.so 留空 CLI 全局状态由使用方提供，R 接口 embeddieharder 同款）在 test.c 定义 globals.c 全局符号块，#include <dieharder/libdieharder.h>（内部展开一串 gsl 头，验证 dieharder→gsl 头闭包）并链接 -ldieharder -lgsl -lgslcblas -lm（libdieharder_la_LIBADD 同款闭包）：binomial(5,2,0.5)=0.3125、Pearson 卡方独立重算 χ²=20.0 且 chisq_pearson 返回 p 值 Q(1.5,10)=1.69742e-4（df=kmax-1=3，chisq.c 实现闭式核对）、经 dh_rng_types 表驱动 gsl mt19937 同种子复现"
    command: "./test_probe"
assertion_count: 3
