software: dieharder
display: "dieharder"
description: "随机数发生器测试套件：George Marsaglia Diehard 电池 + RGB/STS/DAB 测试，产 libdieharder 与 dieharder CLI"
category: tool
homepage: "https://github.com/eddelbuettel/dieharder"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "tag 归档不含 config.guess/config.sub（上游靠维护者 autogen.sh，未入库）：patches vendor GNU config master 副本后，configure 显式传 --build/--host=aarch64-unknown-linux-musl 走原生路径"
    - "设备 HNP bash 的 getcwd() 在 spawn cwd 上不可靠：recipe generate() 显式导出与 build 目录一致的 PWD，configure/make/libtool 恢复可用"
    - "老 configure 的 (umask 077 && mktemp -d) 就地替换为 umask 022（gsl/2.8 同款手法），避免临时目录权限 0700 锁死"
    - "链接闭包：libdieharder_la_LIBADD=-lgsl -lgslcblas -lm，libgsl.so 把 CBLAS 符号留给消费方解析，必须同时链 -lgsl -lgslcblas"
    - "公共头 libdieharder.h 直接 #include 一串 gsl 头，gsl 必须作为普通 requires 传播"
  common_dependencies: ["gsl"]

versions:
  "3.31.1.4":
    status: built
    build_date: "2026-09-10"
    packaging: conan
    notes: "conan 配方（os=OHOS arch=armv8），真机 conan create 验证；产 libdieharder.so.3 与 dieharder CLI，test_package 跑链接探针 + dieharder -l 冒烟 + 固定种子 -d 子集。消费方须按上游 globals.c 提供全局符号（CLI 契约）"
