# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: dwz/0.16
homepage: "https://sourceware.org/dwz/"

# 上游测试（testsuite/ 需真实 DWARF 调试信息二进制 + 运行环境）——
# 本 PR 构建 dwz 工具，test_package 校验 dwz 存在 + --version 运行
upstream_check_command: "echo \"upstream testsuite needs real DWARF debug binaries + runtime env\""

# conanfile.py build() 中未运行上游测试（testsuite 环境依赖）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: conanfile.py
    description: "校验安装产物：dwz 二进制存在（bin/）+ dwz --version 运行"
    command: "test dwz 二进制存在 + --version 运行"

# 断言总数（test_package 1 个断言）
assertion_count: 1
