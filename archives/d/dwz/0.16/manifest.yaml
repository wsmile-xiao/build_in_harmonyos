software: dwz
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.16/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.16"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: custom (sh configure + Makefile)

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sourceware.org/pub/dwz/releases/dwz-0.16.tar.gz"

  # 源码校验和
  sha256: "475853e1b49e6ed8cc2d0a909c7a4fc1cc571ebccfc66278fd43342dbe27d50e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires:
  - "elfutils/0.195"
  - "libxxhash/0.8.3"

# 构建配置选项
build_options:
  - "自定义 sh configure + Makefile；直接注入 CC/CPPFLAGS/LDFLAGS（-L/-Wl,-rpath 指向 elfutils/libxxhash 包）；LIBS=-lelf -lxxhash"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | failed | skipped | not_run
test_status: passed

# 测试说明
test_note: "上游测试实跑（2026-09-11，第四轮——按知识库 E272/E354/E165 修复后）：runtest 完整跑通，**62 总测试 / 48 PASS / 6 FAIL / 8 UNSUPPORTED（48/62 ≈ 77.4%）**（从 0/62 提升到 48/62）；关键修复：① E007 config.guess OHOS patch（uname -s=HarmonyOS）② E272 DEJAGNU site-stty-fix.exp（spawn -nottyinit 消除 /bin/stty 噪）③ E165 scripts/smaller-than.sh shebang /bin/bash→/data/service/hnp/bin/bash ④ dwz 源码 patch make_temp_file 硬编码 /tmp/ → TMPDIR（OHOS /tmp 只读，修复 multifile 类 8 个用例）⑤ 测试输入编译器包装 cc-dwz4/cxx-dwz4：剔除 -g* 统一追加 -g -gdwarf-4 + -nostartfiles 改用剥离调试图的 crt（SDK crt 是 DWARF5，dwz 0.16 不支持 .debug_str_offsets/.debug_addr，修复 24+ 用例）⑥ 补全 TEST_EXECS（odr-*-ns/DWARF ASM 目标/gcc 与 clang 混合编译 dwz-for-test 自身改 DWARF4）⑦ 依赖链：tcl/8.6.14 二进制 + expect + dejagnu + gcc/9.5.0 + GNU readelf(binutils 2.45)+elfutils(eu-strip/eu-readelf)；剩余 6 FAIL 根因：hardlink 类 3 个（OHOS HMDFS 不支持硬链接 'ln: Operation not permitted'）、save-temps/illegal-option（dwz-for-test 的 usage/临时文件行为差异）、pr24174（objcopy LLVM 无 ZLIB 压缩支持）——均环境硬限制（rule 1.2）；test_package 校验 dwz 二进制存在 + dwz --version 运行（运行时真实执行）"
