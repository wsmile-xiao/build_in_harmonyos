# test_package/MANIFEST.yml — debian-electronics 0.3
# 上游测试声明（诚实申报：Debian Pure Blend 元包无测试套件）
package: debian-electronics/0.3
homepage: "https://salsa.debian.org/blends-team/electronics"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

upstream_test_evidence:
  find_tests: "find . -iname '*test*' -> 0 results (no tests/ directory)"
  ctest_registration: "find . -name 'CTestTestfile.cmake' -> 0"
  pytest_registration: "find . -name 'test_*.py' -o -name 'conftest.py' -> 0"
  source_files: "find . -name '*.c' -o -name '*.cpp' -o -name '*.h' -> 0 (metadata-only source)"
  files_total: 26

# Harmony 特有 package/data 验证（非 upstream test）
test_package_tests:
  - file: test_debian_electronics.py
    description: >
      验证：packaged layout（tasks/ 13 个任务文件 + tasksel desc + registry.json +
      官方依赖快照 0.2 + licenses/copyright）；tasks/ Deb822 结构（新 blends 1.1
      格式：每个文件带 Format: 头、Task/Description 非空、Install 全为 true、
      无文件级 Depends 字段）；tasksel desc 结构（14 段落、父任务 debian-electronics、
      13 个 electronics-* Key 且全部映射到已打包任务文件、子任务 Parent 一致）；
      registry.json 与打包文件重新派生的逐任务 title/recommends/suggests/install
      交叉复核；debian/control 15 个声明包全为 Architecture: all 且 electronics-*
      前缀、13 个 topic 元包 Depends: electronics-tasks (=0.3)、electronics-tasks
      Depends: tasksel、electronics-all Recommends 全部 13 个 topic 元包；
      官方快照 0.2 主题集合 == tasks/ 文件集合、109 条去重 OS 引用、命名规范；
      semantics 记录新格式映射（无 Depends 降级）+ genblends apt 可用性降级
      （9 个包，实测 analog 的 gwave/qucs 实例）+ conan_requires == none
    command: "python3 test_debian_electronics.py <package_folder>"

assertion_count: 40
