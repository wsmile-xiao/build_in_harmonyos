version: "3.6.5"
status: built
build_date: "2026-09-11"

source:
  url: "https://github.com/rpm-software-management/deltarpm/archive/refs/tags/3.6.5.tar.gz"
  tar_format: tar.gz

build:
  system: makefile
  cc: clang
  configure_options: []
  note: "无 configure; 顶层 Makefile 直接构建, 显式目标列表排除需 librpm 的 rpmdumpheader"

requirements:
  - "lzma/5.6.2"

vendored:
  - "bzip2 1.0.8 (官方 sourceware 源码, 树内直编 libbz2.a, 替代 Conan 依赖)"
  - "zstd 1.5.6 (官方 GitHub 源码, 树内直编 libzstd.a, 替代 Conan 依赖)"

patches_applied: []

knowledge_gained:
  - "rpmdumpheader 链接 -lrpm -lrpmio, rpm/6.0.2 未发布故整包不依赖 rpm, 其余 6 个工具仅用自带 rpmhead.c 解析 RPM 头"
  - "上游自带 rsyncable zlib (zlib-1.2.2.f-rsyncable), 树内静态构建 libz.a, 不引入外部 zlib 依赖"
  - "子 make 硬编码 CFLAGS 未透传 CC, 需在 build() 以 os.environ 注入 CC/CXX/AR/RANLIB (R33 合规来源为 conf)"
  - "上游无任何测试套件, test_package 用 2 个行为冒烟脚本对 6 个二进制做 usage/诊断断言"
  - "bzip2/1.0.8 与 zstd/1.5.6 在 conancenter 与 ohpcd 双远端同时存在, 预检按远端顺序取到 conancenter 的 CMake 配方, 在 OHOS 上无法配置 (CMake 不识别 HarmonyOS 平台); ohpcd 又无已发布的独有后缀版本可钉选, 故改从官方源码树内直编静态库, 仅保留 ohpcd 独有的 lzma/5.6.2 作为 Conan 依赖 (包名级独有, 比版本号钉选更稳; 其已发布二进制自带完整头文件与静态库)"
  - "xz/5.8.3.1 的已发布二进制经真机实证缺失 include/lzma.h (CPPFLAGS 已传入其 include 目录仍报 fatal error), 且该版本配方目录已不在树内, 故 liblzma 提供方改用 lzma/5.6.2 (dpkg/1.23.7 亦如此消费); deltarpm 仅用 lzma_code/auto_decoder/easy_encoder/alone_encoder 等稳定流式 API, 从不调用 index 系列 API, 故 5.8.3 才修复的 CVE-2026-34743 (lzma_index_append 空索引溢出, 上游称真实应用基本不可达) 在此无可达路径"
  - "zstd 的 cfile.h/cfile.c 全程受 WITH_ZSTD 守卫, bzip2/lzma 为无条件硬依赖 (cfile.h 无条件 include), 故 bzip2 必须就地提供, zstd 可选但为保留完整功能同样就地构建"
  - "配方此前缺失 source() 方法 (靠依赖构建失败掩盖, 从未暴露); 补上主源码与 vendored 源码的显式下载"
