# conandata.yml — deltarpm 3.6.5
# Official upstream source: rpm-software-management/deltarpm tag 3.6.5
#
# vendored: bzip2/zstd are built in-tree from official sources (same pattern
# as upstream's own bundled rsyncable zlib). Rationale: plain versions
# bzip2/1.0.8 and zstd/1.5.6 exist in BOTH conancenter and ohpcd; with both
# remotes enabled the resolver picks conancenter's CMake recipes, which fail
# on OHOS (CMake has no HarmonyOS platform support). There is no published
# ohpcd-only bzip2/zstd version to pin to (1.0.8.x/1.5.7.1 are unpublished),
# so vendoring from official tarballs (sha256-verified) is the deterministic
# route. liblzma comes from the lzma/5.6.2 Conan dep instead: that package
# name exists only in ohpcd, and its published binary ships complete headers
# (xz/5.8.3.1's published binary demonstrably lacks lzma.h).

