# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: deltarpm/3.6.5
homepage: "https://github.com/rpm-software-management/deltarpm"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: deltarpm 3.6.5 tag tarball, sha256 f3fba9b96c55be21696466bbfc3b2a623a4fb35646ff9a135f5c29406b412f22)
upstream_test_audit:
  source_tarball: "deltarpm-3.6.5.tar.gz (github tag 3.6.5, commit b559d700)"
  source_sha256: "f3fba9b96c55be21696466bbfc3b2a623a4fb35646ff9a135f5c29406b412f22"
  top_level_files:
    - Makefile            # targets: all/python/perl/clean/install; 无 check / test / check_PROGRAMS 目标
    - "*.c / *.h"         # makedeltarpm/applydeltarpm/combinedeltarpm 等实现; 无 TEST() / TEST_F (gtest) 宏
    - deltarpm.py / deltarpmmodule.c  # python 绑定, 无 pytest 用例
    - perl/               # 仅 Makefile.PL + deltarp.pm/xs, 无 t/ 测试目录
    - drpmsync            # 辅助脚本, 无测试
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile check / test 目标"
    - "tests/ / test/ / t/ 目录"
    - "ctest / meson test 目标"
  scan_result: "0 matches — 顶层 Makefile 无 check/test 目标; 全包 266 个文件, 仅 zlib-1.2.2.f-rsyncable/contrib 下有示例性质的 test 样例, 未被任何构建目标引用"
  make_check_output: "不适用 — 上游 Makefile 未定义 check 目标, make check 为 make 默认 no-op (No rule to make target 'check')"
  reason: "deltarpm 3.6.5 为纯 Makefile 工具包, 上游 Git tag 3.6.5 不含任何自动化测试套件: 无 tests/ 目录、无测试源文件、无 check/test 构建目标、无 gtest/pytest 用例"

# 上游测试命令 (无测试套件, 故为空, 避免清单器误判为存在测试)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test_iso_tools.sh"
    description: "makedeltaiso/applydeltaiso 无参调用用法输出断言 (存在性 + usage 文本 + 非空证据)"
    command: "bash test_iso_tools.sh"
  - file: "test_rpm_tools.sh"
    description: "makedeltarpm/applydeltarpm/combinedeltarpm/fragiso 无参调用诊断输出断言 (存在性 + 自标识输出 + 非空证据)"
    command: "bash test_rpm_tools.sh"
  - file: "conanfile.py"
    description: "Conan test() 入口, 逐用例执行两个脚本并按实际成功数复发 HMBS 机器证据标记 (test_package discovered=2 + upstream no_tests/0)"
    command: "conan test test_package"

assertion_count: 12
