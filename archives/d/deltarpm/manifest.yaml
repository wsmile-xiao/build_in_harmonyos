software: deltarpm
display: "deltarpm"
description: "Tools to create and apply deltarpms (delta RPMs) and delta ISOs"
category: system
homepage: "https://github.com/rpm-software-management/deltarpm"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目, 无 configure, 直接 make 显式目标构建"
    - "rpmdumpheader 需 librpm (rpm/6.0.2 未发布), 配方跳过该二进制, 其余 6 工具不依赖 rpm"
    - "bzip2/xz/zstd 由 Conan 依赖提供, zlib 使用上游自带 rsyncable 副本树内静态构建"
    - "上游无测试套件, test_package 以 2 个行为冒烟脚本覆盖 6 个二进制"
  common_dependencies:
    - bzip2
    - xz
    - zstd

versions:
  "3.6.5":
    status: built
    build_date: "2026-09-11"
