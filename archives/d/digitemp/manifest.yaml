# 软件级 manifest — digitemp
software: digitemp
display: "DigiTemp 1-Wire 温度传感器读取工具"
description: "1-Wire 温度传感器读取工具，支持 DS9097/DS9097U 串口适配器"
category: utility
homepage: "https://github.com/bcl/digitemp"
license: GPL-2.0-or-later
build_system: custom
ohos_adaptation:
  key_points:
    - "上游 Makefile 无可用 install 目标（其依赖不存在的 digitemp 目标），打包阶段由配方直接复制二进制与 man page"
    - "仅构建 ds9097 / ds9097u 两个串口适配器目标；ds2490（USB）上游标注 BROKEN 且依赖 libusb"
    - "编译器经 tools.build:compiler_executables 注入（make CC=<clang>），不依赖 shell 环境变量（R33）"
    - "上游 v3.7.2 无自动化测试套件（-T 自检在本版本未实现），已在 ci/config/no_official_test.txt 申报，并补充 12 项消费者断言"
  common_dependencies: []
versions:
  "3.7.2":
    status: built
    build_date: "2026-09-10"
    upstream_version: "3.7.2"
    source_url: "https://github.com/bcl/digitemp/archive/refs/tags/v3.7.2.tar.gz"
