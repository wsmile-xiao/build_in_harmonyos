package: digitemp/3.7.2
homepage: https://github.com/bcl/digitemp

upstream_check_command: "make ds9097 && make ds9097u"
upstream_test_in_build: false
upstream_test_command: "none (v3.7.2 has no test target; -T self-test unimplemented in this release)"
upstream_tests: []

build_checks:
  - name: "DS9097 串口适配器构建"
    command: "make CC=<conf> ds9097"
  - name: "DS9097U 串口适配器构建"
    command: "make CC=<conf> ds9097u"

test_package_tests:
  - file: test_digitemp.py
    description: "两个变体的 -h 用法契约: 退出码 3 + 版本横幅 + 适配器标识 (6 断言)"
    command: "test_digitemp.py <package>"
  - file: test_digitemp.py
    description: "两个变体拒绝未知选项 (-Z): 退出码 3 + getopt 报错 (2 断言)"
    command: "test_digitemp.py <package>"
  - file: test_digitemp.py
    description: "rcfile 语法错误 -> 退出码 2 + Error reading rcfile (1 断言)"
    command: "test_digitemp.py <package>"
  - file: test_digitemp.py
    description: "两个变体报告串口设备不存在 -> 退出码 7 (2 断言)"
    command: "test_digitemp.py <package>"
  - file: test_digitemp.py
    description: "pty 冒充串口完成一次真实串口通信 (设备打开 + 1-Wire 搜索) (1 断言)"
    command: "test_digitemp.py <package>"

assertion_count: 12
