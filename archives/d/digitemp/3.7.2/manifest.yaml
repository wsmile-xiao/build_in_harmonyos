knowledge_gained:
- "digitemp v3.7.2 的 -T 自检选项仅在 src/digitemp.c:2423 登记 OPT_TEST 标志、无任何后续实现，上游 tests.yml 的 ./digitemp_DS9097 -T 在本版本恒返回 exit 3；Makefile 无 check/test 目标，故按 ci/config/no_official_test.txt 机制申报无官方测试 [knowledge_ref: E479]"
- "ds2490 (USB 适配器) 目标上游标注 BROKEN 且依赖 libusb，本包仅构建 ds9097 / ds9097u 两种串口适配器版本 [knowledge_ref: E479]"
- "conan-verify G1 要求配方含 export_sources() 方法与 apply_conandata_patches 调用（即使无补丁）；Conan 2 这两个 API 在 conandata.yml 无 patches 键时均为 no-op，属通用脚手架 [knowledge_ref: E429]"
- "上游官方源 waterlan.home.xs4all.nl 已失效，改用上游 GitHub v3.7.2 tag 归档（sha256 与 Debian orig tarball 字节一致）；W3/conan-verify 会在验证期临时把 conandata.yml 的源改写为 GitHub 加速镜像，验证进程被超时中断时该改写会残留，提交前必须核验 conandata.yml 为官方 URL 单一形式 [knowledge_ref: E017]"
