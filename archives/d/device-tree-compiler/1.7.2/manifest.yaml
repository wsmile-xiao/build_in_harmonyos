software: device-tree-compiler
version: "1.7.2"
build_system: make
status: built
source:
  url: "https://mirrors.edge.kernel.org/pub/software/utils/dtc/dtc-1.7.2.tar.xz"
  sha256: "92d8ca769805ae1f176204230438fe52808f4e1c7944053c9eec0e649b237539"
knowledge_gained:
  - "DTC 为设备树工具集（dtc/fdtdump/fdtget/fdtput/fdtoverlay + libfdt），纯 make 构建，无第三方运行依赖"
  - "STATIC_BUILD=1 使 fdtget/fdtput/fdtoverlay 静态链接 libfdt.a；工具包不含 .so，签名面最小"
  - "make 式构建需显式 CC=clang AR=llvm-ar；version_gen.sh 在构建期由 VERSION.txt 生成 version_gen.h 供 --version"
  - "clang 不识别 GCC 专属的 -Wsuggest-attribute=format，且 Makefile 启用 -Werror 会直接编译失败；需补丁从 WARNINGS 移除该 flag"
  - "bin/ 可执行文件需 binary-sign-tool 代码签名（鸿蒙 XPM 要求，desktop-file-utils 同款方案）"