# test_package/MANIFEST.yml — device-tree-compiler 1.7.2
# CI L0e requires this file to exist.

package: device-tree-compiler/1.7.2
homepage: "https://github.com/devicetree-org/device-tree-compiler"

# 上游自带 tests/ 套件（make check 驱动），在 conan create 的 build() 阶段
# 于 OHOS worker 原生执行（can_run），make check 退出码映射为构建结果。
# 实测（CI #43602）TEST SUMMARY：2070 例全部 PASS。
# 注：OHOS toybox stat 无法被 run_tests.sh 识别为 GNU，故显式 STATSZ="stat -c %s"。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游 tests/ 端到端套件（含参数化 dtc/libfdt/fdtget/fdtput/fdtoverlay 用例）
upstream_tests:
  - "tests/ 端到端套件（make check）— 2070 例（dtc/fdtdump/fdtget/fdtput/fdtoverlay/libfdt 功能与校验用例）"
upstream_tests_total: 2070
upstream_tests_passed: 2070
upstream_tests_skipped_reason: ""

# test_package 自带的验证（消费者视角）
test_package_verification:
  - command: "fdtdump --version"
    expect: "1.7.2"