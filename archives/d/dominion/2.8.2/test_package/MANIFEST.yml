# test_package/MANIFEST.yml — dominion 2.8.2
#
# 上游测试清点证据（R51 上游测试三步法）：
#   - dominion 2.8.2 源码树（https://ftp.gnu.org/gnu/dominion/dominion-2.8.2.tar.gz）
#     无 tests/ 目录、无 ctest/自建测试框架；
#   - 全部 Makefile.am 与 configure.ac 中无 TESTS/check_PROGRAMS/测试目标
#     （grep 证据：仅 bin_PROGRAMS = dominion dom_make dom_add dom_update dom_print）；
#   - 结论：上游静态测试声明总数 N_static = 0，无上游套件可执行。

package: dominion/2.8.2
homepage: "https://www.gnu.org/software/dominion/"

upstream_check_command: ""
upstream_check_command_note: "上游无 make check 目标（清点证据见文件头注释）"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_dominion.sh
    description: "消费者测试：校验 5 个工具齐备可执行，并断言 dominion 对未知选项的确定性拒绝路径（usage + exit 1）"
    command: "sh test_dominion.sh <bindir>"

assertion_count: 6
