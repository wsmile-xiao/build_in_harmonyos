# 版本级 manifest
# 文件位置: archives/d/ddate/0.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.2"

# 软件名
software: "ddate"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/bo0ts/ddate/archive/refs/tags/v0.2.2.tar.gz"

  # 源码校验和
  sha256: "d53c3f0af845045f39d6d633d295fd4efbe2a792fd0d04d25d44725d11c678ad"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ddate 为单文件 C 程序 + CMake 构建（binary + gzip manpage），零外部依赖"
  - "上游 cmake_minimum_required(VERSION 2.8)，CMake 4.x 需 CMAKE_POLICY_VERSION_MINIMUM=3.5（E187/E103）"
  - "纯可执行包：package_info 不声明 cpp_info.libs，test_package 直接运行安装二进制（bambootracker 先例）"
  - "上游无任何测试套件（无 tests/ 目录、无 add_test/enable_testing、无 check 目标），按 no_tests 口径申报（sipcalc/buildtorrent 先例）"
