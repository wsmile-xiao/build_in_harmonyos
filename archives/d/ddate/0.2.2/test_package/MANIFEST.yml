# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ddate/0.2.2
homepage: "https://github.com/bo0ts/ddate"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: v0.2.2.tar.gz, sha256 d53c3f0af845045f39d6d633d295fd4efbe2a792fd0d04d25d44725d11c678ad)
upstream_test_audit:
  source_tarball: "v0.2.2.tar.gz"
  source_sha256: "d53c3f0af845045f39d6d633d295fd4efbe2a792fd0d04d25d44725d11c678ad"
  top_level_files:
    - CMakeLists.txt  # 仅 add_executable(ddate) + manpage gzip 目标，无 enable_testing / add_test
    - ddate.c         # 单文件实现，无 TEST / TEST_F / assert 测试代码
    - ddate.1         # man 页
    - README.org      # 构建与历法说明，无测试入口
    - .gitignore
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / add_test (ctest)"
    - "check_PROGRAMS / TESTS / check target (make check)"
    - "tests/ / test/ 目录"
  scan_result: "0 matches — tarball 顶层仅 5 个文件，无 tests/ 目录、无 *test* 源文件、无任何测试接线"
  reason: "ddate 0.2.2 为纯 CLI 工具，上游发布包不含任何测试套件"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件，故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ddate.sh
    description: "消费者功能测试：无参当前日期 + 指定日期转换 + %Y/%B 格式化 + 非法日期拒绝 + 错误参数提示"
    command: "sh test_ddate.sh <ddate_binary_path>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
