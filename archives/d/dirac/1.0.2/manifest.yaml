software: dirac
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.2"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/dirac/dirac-codec/Dirac-1.0.2/dirac-1.0.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-static"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"
  - "0002-libdirac_common-mot_comp.cpp.patch"
  - "0003-config.guess.patch"
  - "0004-config.sub.patch"
  - "0005-libdirac_common-dirac-stdint.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: autotools cl*|CL*) glob模式误匹配 clang++ 为 MSVC cl.exe — 修复为 cl|cl.exe|CL|CL.exe 精确匹配"
  - "E008: HMDFS文件系统 umask 077 导致 tmp 目录权限错误 — 移除 umask 077，fallback用 mkdir -m 0770"
  - "E999: HMDFS getcwd() 失败导致 libtool 静态库链接失败 — 使用 --disable-static 避免静态库链接"
  - "E999: configure SHELL 默认 /bin/sh 在 HMDFS 上不可用 — 改为 /data/service/hnp/bin/bash"
  - "E999: clang++ C++11 narrowing 错误 — 在 configure 中为 clang++ 注入 -Wno-c++11-narrowing"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/dirac-1.0.2.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/dirac-1.0.2.work
  source_orig_hash: c65b4b1ff0dfc817
  source_work_hash: 7ccdd73fb94e3b34
  generated_at: '2026-06-12T20:17:14'
  patches_count: 5

patch_classification:
  - file: 0001-configure.patch
    type: manual
    platform_only: True
    guard: 'pending'
    note: 'configure脚本适配: SHELL→/data/service/hnp/bin/bash, cl精确匹配, umask→mkdir -m 0770, clang++*注入-Wno-c++11-narrowing'
  - file: 0002-libdirac_common-mot_comp.cpp.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0005-libdirac_common-dirac-stdint.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
