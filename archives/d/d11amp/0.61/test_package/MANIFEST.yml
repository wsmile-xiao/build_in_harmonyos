# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: d11amp/0.61
homepage: "https://github.com/dettus/d11amp"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 说明：上游 make check 需运行 d11amp --gui.theme.dumpdefault（GTK 主题转储，
# 依赖图形栈），在 conan 干净构建环境无法可靠运行；该测试在探索编译阶段
# 于本地设备实测通过（check OK）。故 build() 未集成，如实申报 false。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（checks.mk 定义 1 个校验项，探索阶段实测通过）
upstream_tests:
  - file: checks.mk
    source: d11amp-0.61/mark4/software/checks.mk
    description: "d11amp --gui.theme.dumpdefault 转储主题后校验 cc-0-10.txt 的 SHA256（探索阶段本地实测 check OK，1/1 通过）"
    command: "./d11amp --dir=<TMP> --gui.theme.dumpdefault=<TMP> && sha256sum cc-0-10.txt 对比期望值"

# test_package 中自带的测试 (消费者视角验证，R34 实质断言)
test_package_tests:
  - file: test.sh
    description: "运行安装后的 d11amp --version 断言输出 0.61；--help 断言可读"
    command: "bash test.sh"

# 测试断言总数 (test_package 2 个断言：--version 输出 + --help 可读)
assertion_count: 2