# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试来源（db-6.2.32.tar.gz）：
#   test/c/cutest      — CuTest C 单元测试框架（make cutest，13 suites / 55 tests）
#   test/c/chk.ctests  — 独立 C 回归测试（test_api_methods / test_db185 / test_log_verify）
#   test/cxx/chk.cxxtests — C++ 回归测试（8 个 .cpp，输出与 .testout 逐字节比对）
#   test/tcl/          — TCL 测试套件（553 文件；TESTS 注册 478 名；需 tclsh + libdb_tcl 动态加载，本环境不可执行）
#   test/xa/           — XA 事务测试（7 条目：chk.xa + src1~src5 + utilities；需 Oracle Tuxedo，本环境不可执行）
# 上游无 `make check` 目标（autoconf 项目未注册 check），可执行口径为上述专用测试目标。
# 上游注册总数 N = 55 + 3 + 8 + 478 + 7 = 551。

package: db/6.2.32
homepage: "https://www.oracle.com/database/technologies/related/berkeleydb.html"

# 上游测试命令（BDB 无统一 check 目标，列出各专用测试入口）
upstream_check_command: "make cutest && sh test/c/chk.ctests && sh test/cxx/chk.cxxtests"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本环境实测记录，详见 notes.md 测试台账）
upstream_tests:
  - file: test/c/cutest
    source: db-6.2.32/test/c/cutest + test/c/suites/*.c
    description: "C 单元测试套件（CuTest）：13 suites / 55 tests，实测 55/55 通过"
    command: "make cutest && ./cutest"
  - file: test/c/test_api_methods.c
    source: db-6.2.32/test/c/test_api_methods.c
    description: "C API 方法回归测试，静态链接 libdb-6.2.a 编译运行，退出码 0"
    command: "cc -I build_unix test/c/test_api_methods.c build_unix/.libs/libdb-6.2.a && ./a.out"
  - file: test/c/test_log_verify.c
    source: db-6.2.32/test/c/test_log_verify.c
    description: "日志校验回归测试，退出码 0"
    command: "cc -I build_unix test/c/test_log_verify.c build_unix/.libs/libdb-6.2.a && ./a.out"
  - file: test/cxx/*.cpp
    source: db-6.2.32/test/cxx/Test*.cpp
    description: "C++ API 回归测试 8 个，stdout/stderr 与上游 .testout/.testerr 逐字节比对一致"
    command: "sh test/cxx/chk.cxxtests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — db_create/open/put x50/get/cursor 扫描 50 条/close/重开 RDONLY 持久性验证"
    command: "./test_db"

# 测试断言总数（test.c 内 API 调用断言点：create/open/put/get/cursor/reopen/close 7 组 + 数据内容校验）
assertion_count: 9
