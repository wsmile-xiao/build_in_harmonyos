software: db
version: "6.2.32"
status: built
build_date: "2026-09-09"
build_system: autotools

source:
  url: "https://download.oracle.com/berkeley-db/db-6.2.32.tar.gz"
  sha256: "a9c5e2b004a5777aa03510cfe5cd766a4a3b777713406b02809c17c8e0e7a8fb"
  tar_format: tar.gz

build:
  system: autotools
  configure_command: "cd build_unix && ../dist/configure"
  configure_options:
    - "--prefix=/"
    - "--enable-static"
    - "--enable-shared"
    - "--enable-cxx"
    - "--with-repmgr-ssl=no"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-dist-config.guess.patch (HarmonyOS 三元组识别, E007)"
  - "0002-dist-config.sub.patch (linux-ohos 接受, E007)"
  - "0003-dist-configure-force-printf.patch (HMDFS print 探测假阳性 -> 强制 printf)"
  - "0004-db_cxx-undef-atomic_init.patch (libc++ <atomic> 宏冲突)"

knowledge_gained:
  - "E007 变体: BDB dist/configure 内嵌 2014 版 config.guess/sub，需按其结构手工打 OHOS 补丁"
  - "HMDFS: ksh 风格 print 内建探测假阳性 -> config.status 'print: command not found' + libtool archive_expsym_cmds 截断；源文件级修复 dist/configure 强制 printf（5 赋值 + 3 探测条件）"
  - "HMDFS: config.status ./confXXXX umask 077 临时目录拒写（R6 生成文件，运行时改写重定向 $TMPDIR + umask 022）"
  - "clang/libc++: dbinc/atomic.h 的 atomic_init 宏污染 <atomic>，db_cxx.h include iostream 前 #undef 修复"
  - "上游测试 UB: TestQueue.c K&R 无原型定义 + SH_LIST 指针重解释宏在 -O2/-O3 暴露（SIGTRAP），-O0 编译 136/136 全过——测试目标降优化不改断言"
  - "上游 TCL 测试套件（478 注册名）在本环境不可执行：tcl/8.6.14 conan 包静态构建，tclsh load 命令不可用（dlopen 本身可用，构建形态限制）"
  - "上游 XA 测试（test/xa/ 7 条目）不可执行：需 Oracle Tuxedo 商业中间件（TUXDIR）"
  - "上游注册测试总数 N=551：cutest 55 + C 回归 3 + C++ 回归 8 + TCL 478 + XA 7"

binaries:
  - db_archive
  - db_checkpoint
  - db_convert
  - db_deadlock
  - db_dump
  - db_hotbackup
  - db_load
  - db_log_verify
  - db_printlog
  - db_recover
  - db_replicate
  - db_stat
  - db_tuner
  - db_upgrade
  - db_verify

test_report: reports/test-report.md
