# conandata.yml — db (Berkeley DB classic) 6.2.32

sources:
  url: "https://download.oracle.com/berkeley-db/db-6.2.32.tar.gz"
  sha256: "a9c5e2b004a5777aa03510cfe5cd766a4a3b777713406b02809c17c8e0e7a8fb"

patches:
  - patch_file: "patches/0001-dist-config.guess.patch"
    patch_type: "backport"
    patch_source: "https://git.savannah.gnu.org/gitweb/?p=config.git"
    patch_description: "config.guess 增加 *:HarmonyOS:* 分支，输出 aarch64-unknown-linux-ohos (E007)"
  - patch_file: "patches/0002-dist-config.sub.patch"
    patch_type: "backport"
    patch_source: "https://git.savannah.gnu.org/gitweb/?p=config.git"
    patch_description: "config.sub KERNEL-OS 列表与 OS 列表接受 linux-ohos (E007)"
  - patch_file: "patches/0003-dist-configure-force-printf.patch"
    patch_type: "conan"
    patch_description: "dist/configure 强制 POSIX printf 回显。HMDFS 开发者 shell 的探测 shell 支持 ksh 风格 print 内建，探测假阳性后 config.status 在无 print 的执行环境运行，产生大量 'print: command not found' 并损坏 libtool 脚本（archive_expsym_cmds 被截断 -> make 阶段 libtool 语法错误）"
  - patch_file: "patches/0004-db_cxx-undef-atomic_init.patch"
    patch_type: "conan"
    patch_description: "src/dbinc/db_cxx.in 在 include <iostream> 前 #undef atomic_init。dbinc/atomic.h 将 atomic_init 定义为宏，与 libc++ <atomic> 的同名函数声明冲突，--enable-cxx 编译报 'expected unqualified-id'"
