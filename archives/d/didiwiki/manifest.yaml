software: didiwiki
display: "CiWiki (didiwiki)"
description: "Small personal wiki engine with a built-in HTTP web server, zero external dependencies"
category: network
homepage: "https://sourceforge.net/projects/ciwiki/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "使用 tarball 自带的 configure 直接构建，勿跑 autogen（AM_CONFIG_HEADER 老宏已被现行 automake 移除）"
    - "configure 安全临时目录 umask 077 需放宽为 007（设备默认 umask，同 dash-shell 先例）"
    - "configure 无 AC_CANONICAL_HOST，无需 config.guess/config.sub 补丁"
  common_dependencies: []

versions:
  "3.0.5":
    status: built
    build_date: "2026-09-10"
    conan_ref: "didiwiki/3.0.5"
