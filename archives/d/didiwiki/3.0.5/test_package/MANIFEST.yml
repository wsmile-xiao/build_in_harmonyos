# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: didiwiki/3.0.5
homepage: "https://sourceforge.net/projects/ciwiki/"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []
# 上游 3.0.5 无任何自动化测试套件（NO_UPSTREAM_TESTS，discovery 证据完整）：
# - tarball 无 tests/ 或 test/ 目录，src/ 仅 8 组实现源文件（无 *test*）
# - 顶层与 src/scripts/docs 子目录 Makefile.am 均无 TESTS 变量、无自定义 check 目标
#   （顶层仅有 snapshot 目标），make check 落到 automake 默认空目标 check-am: all-am
# - configure.ac 无任何测试相关配置
# 完整证据：设备端 ~/tmp/oh-device-porting-v2/didiwiki-3.0.5-discovery/upstream-test-discovery.md

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: run ciwiki -v with a throwaway HOME and verify the 'CiWiki - version 3.0.5' banner"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
