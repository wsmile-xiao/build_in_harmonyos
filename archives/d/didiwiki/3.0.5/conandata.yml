# conandata.yml — didiwiki 3.0.5
# 上游 3.0.x 发布名为 ciwiki（SourceForge ciwiki 项目）；Debian 源码包沿用历史名
# didiwiki，两个归档字节相同（SHA256 一致，已双端核验）。

sources:
  # SourceForge 规范直链；/projects/.../download 302 重定向到该地址。
  # 注意不要用 .../download 结尾的 URL：conan get() 依赖扩展名识别压缩格式，
  # 无扩展名文件会被当作 zip 尝试解压（BadZipFile）。
  url: "https://downloads.sourceforge.net/project/ciwiki/ciwiki-3.0.5.tar.gz"
  sha256: "290aee7fe2efc8f1c2612b6aff2bb832d3c8129e6fd9dd9e6adbdb02d1f19aef"

patches:
  - patch_file: "patches/0001-configure-umask.patch"
    patch_description: "Relax configure secure-tmpdir umask from 077 to 007 (device default umask 077 makes generated build files unreadable for later steps)"
    patch_type: "portability"
  - patch_file: "patches/0002-fix-stdin-const-assign.patch"
    patch_description: "Drop stdin reassignment after freopen in src/ci.c (-t option): OHOS musl sysroot declares stdin as FILE *const; per POSIX freopen itself reassociates the stream, so behavior is unchanged on all platforms"
    patch_type: "portability"
