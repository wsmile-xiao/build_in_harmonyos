version: "3.0.5"
status: built
build_date: "2026-09-10"
conan_ref: "didiwiki/3.0.5"

source:
  url: "https://downloads.sourceforge.net/project/ciwiki/ciwiki-3.0.5.tar.gz"
  sha256: "290aee7fe2efc8f1c2612b6aff2bb832d3c8129e6fd9dd9e6adbdb02d1f19aef"
  tar_format: tar.gz

build:
  system: autotools
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  notes: "tarball 自带生成的 configure，直接 ./configure && make；不可跑 autogen（AM_CONFIG_HEADER 老宏已被现行 automake 移除）；tarball 携带作者 in-tree 构建残留，conan VPATH 构建前需清理（source() 内处理）"

patches_applied:
  - file: "patches/0001-configure-umask.patch"
    description: "configure 安全临时目录 umask 077 → 007（设备默认 umask 077 下 configure 生成的构建文件对后续步骤不可读，参照 dash-shell 0.5.13.2 先例）"
    type: "portability"
  - file: "patches/0002-fix-stdin-const-assign.patch"
    description: "src/ci.c 的 -t 分支对 stdin 回赋 freopen 结果；OHOS musl sysroot 将 stdin 声明为 FILE *const 导致编译错误。按 POSIX 语义 freopen 本身即重关联流，去掉回赋，全平台行为不变"
    type: "portability"

install_files:
  - path: bin/ciwiki
    type: executable
    description: "ciwiki 服务器主程序（内建 HTTP 服务）"

test_results:
  official_suite: "N/A（上游无测试套件，NO_UPSTREAM_TESTS：tarball 无 tests/ 目录，各 Makefile.am 无 TESTS 变量与 check 目标）"
  test_package: "PASS（ciwiki -v 输出 'CiWiki - version 3.0.5' 且退出码 0）"

knowledge_gained:
  - "上游 3.0.x 发布名为 ciwiki（SourceForge ciwiki 项目），可执行名为 ciwiki；Debian 沿用历史源码包名 didiwiki，归档字节相同"
  - "tarball 自带生成的 configure/Makefile.in，直接 configure+make 即可；跑 autogen 会因 AM_CONFIG_HEADER 老宏失败"
  - "configure 无 AC_CANONICAL_HOST，不需要 config.guess/config.sub 补丁（不同于 dash 先例）"
  - "configure 临时目录 umask 077 需放宽为 007（设备默认 umask，autotools 通用坑，同 dash-shell 先例）"
  - "tarball 成员名带 ./ 前缀：conan strip_root 只剥 ./ 不上移根目录，需手动扁平化（source() 内处理）"
  - "tarball 携带作者 in-tree 构建残留（config.status 等），conan VPATH 构建会报 source directory already configured，需先清理（source() 内处理）"
  - "OHOS musl sysroot 将 stdin/stdout/stderr 声明为 FILE *const，源码对它们赋值会编译失败；freopen 后无需回赋（0002 补丁）"
