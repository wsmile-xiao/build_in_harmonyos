software: dwarves
version: 1.30
status: built
build_system: cmake
build_date: 2026-09-10
compile_date: 2026-09-10

dependencies:
  required:
    - elfutils/0.195
    - zlib/1.3.1.1
    - argp-standalone/1.5.0
    - musl-obstack/1.2.3
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - -DLIBBPF_EMBEDDED=ON（默认，内嵌 libbpf 子模块 @42a6ef6）
    - -DCMAKE_INCLUDE_PATH/-DCMAKE_LIBRARY_PATH 注入依赖搜索（上游 FindDWARF 只查 /usr）

patches_applied:
  - file: 0001-libbpf-netlink-sockaddr-storage.patch
    purpose: "OHOS 内核头 linux/socket.h 无条件定义 sockaddr_storage，与 musl sys/socket.h 冲突（E091）：libbpf netlink.c/nlattr.c include 期间重命名"
    lines_changed: 12

compatibility:
  level: medium
  issues:
    - "pahole 系列 CLI 依赖 vmlinux/kernel BTF 才能展示业务输出，OHOS 设备无内核 vmlinux 调试包，相关上游测试按 exit 2 skip"
    - "上游 pfunct-btf-decl-tags.sh 依赖可写 /tmp，OHOS /tmp 为 erofs 只读挂载，候选挂载点均不满足 0700 语义，该项记录平台阻塞"
  notes: "编译产物正确：libdwarves*.so（带 DT_SONAME）、pahole/codiff/pfunct 等 13 个 CLI 可执行"

test_results:
  type: auto
  passed: 1
  failed: 1
  skipped: 4
  note: |
    上游测试 6 项：default_vmlinux_btf.sh PASS；pfunct-btf-decl-tags.sh 平台阻塞（/tmp erofs ro）；
    btf_functions/flexible_arrays/reproducible_build 缺 vmlinux skip；prettify_perf 缺 perf skip。
    全量通过率 1/6；鸿蒙专项 BTF 解析与消费者用例均 PASS（test_package）。

knowledge_gained:
  - "dwarves 公开头 dwarves.h 直接 include <obstack.h>/<argp.h>/<dwarf.h>：OHOS-musl 消费者需显式链接 musl-obstack/argp-standalone/elfutils（CMakeDeps 不展开传递依赖 include 元数据）"
  - "GitHub release tarball 不含 lib/bpf 子模块：需在 source() 按版本锁定 commit 单独拉取，否则 CMakeLists 直接 FATAL"
  - "OHOS 无 CMake 平台模块时 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 未定义，SOVERSION 不产出 DT_SONAME：配方需显式补 -Wl,-soname,"

references:
  - https://github.com/acmel/dwarves

patch_generation:
  method: conandata-patches
  patches_count: 1
