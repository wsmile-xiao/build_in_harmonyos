# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: dtfabric/20251118.1
homepage: "https://github.com/libyal/dtfabric"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# dtfabric 上游用 unittest(非 pytest): run_tests.py 用 unittest.TestLoader().discover('tests')
upstream_check_command: "./run_tests.py"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# dtfabric 上游 tests/ 目录含 unittest TestCase 子类,由 run_tests.py discover 加载,共 188 个测试
upstream_tests:
  - file: tests/data_types.py
    source: dtfabric-20251118/tests/data_types.py
    description: "数据类型定义(DataTypeDefinition/StorageDataTypeDefinition 等)单测"
    command: "./run_tests.py"
  - file: tests/reader.py
    source: dtfabric-20251118/tests/reader.py
    description: "YAML 数据类型定义读取器(reader)单测"
    command: "./run_tests.py"
  - file: tests/registry.py
    source: dtfabric-20251118/tests/registry.py
    description: "数据类型定义注册表(registry)单测"
    command: "./run_tests.py"

# test_package 中自带的测试 (消费者视角验证)
# dtfabric 为 Python 包,消费者测试在 test_package/conanfile.py 内嵌 test_all.py
test_package_tests:
  - file: test_package/conanfile.py
    description: "消费者测试:模块导入(dtfabric 版本+definitions 常量+reader/registry YAML 解析)+ CLI validate-definitions.py"
    command: "python3 test_all.py"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 run_tests.py (unittest discover) 实跑 188 个测试全过;test_package test_all.py 另含 4 处 assert
assertion_count: 192
