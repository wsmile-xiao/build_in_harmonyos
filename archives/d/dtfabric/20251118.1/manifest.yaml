# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/20251118.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "20251118.1"

# 软件名
software: "dtfabric"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/e5/95/8f438ce3b01b030bc6f8df3250c56a663e2c481cd852fd26ddc9c906f56e/dtfabric-20251118.tar.gz"

  # 源码校验和
  sha256: "bf6aac66da866f8d29e7f435206848fa9acc0a4babbb1141d014cc3912b3997e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: none (pure Python, no C/C++)
  cxx: none (pure Python, no C/C++)

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Pure Python 包,无 C/C++ 编译;用 pip install --target staging 装包,无需交叉编译工具链"
  - "PyYAML 是 pip 运行时依赖而非 conan recipe 依赖(requirements 留空),build() 中以 --no-deps 安装避免联网装依赖"
  - "package() 将 staging 目录整体 copy 到 package_folder,test_package 通过 PYTHONPATH 指向包目录导入 dtfabric 模块并调 CLI validate-definitions.py"
