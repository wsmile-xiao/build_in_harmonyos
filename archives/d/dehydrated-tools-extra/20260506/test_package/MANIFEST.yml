# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: dehydrated-tools-extra/20260506
homepage: "https://git.open-infrastructure.net/tools/dehydrated-tools-extra"

# 上游有官方测试入口：Makefile 的 test 目标（sh -n 语法检查；
# checkbashisms/shellcheck 在工具缺失时自动跳过）
upstream_check_command: "make -n test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile
    source: dehydrated-tools-extra-20260506/Makefile
    description: "test 目标对 bin/* 与 share/hooks/* 全部脚本做 sh -n 语法检查，checkbashisms/shellcheck 可用时一并执行"
    command: "make test"

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_dehydrated_tools_extra.sh 对打包产物做结构化冒烟（不执行脚本本体）"
    command: "conan create (test_package: bash test_dehydrated_tools_extra.sh <bin_dir> <pkg_root>)"
  - file: test_dehydrated_tools_extra.sh
    description: "真实冒烟测试: bin/ 3 个脚本与 share/dehydrated/hooks/ 7 个脚本存在、可执行、shebang 为 /data/service/hnp/bin/bash、bash -n 通过；etc/cron.d、etc/logrotate.d 配置与 rst 文档齐全"
    command: "bash test_dehydrated_tools_extra.sh <package bin dir> <package root>"

# 脚本本体禁止执行：不支持 --version/--help，且 dehydrated-cron 会真的调用
# dehydrated 并写 /var/log、dehydrated-hook 依赖 /etc/dehydrated/hook.d、
# dehydrated-nsupdate 依赖 dig/nsupdate
assertion_count: 3
