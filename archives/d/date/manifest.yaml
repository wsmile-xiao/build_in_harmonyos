software: date
description: >-
  Howard Hinnant's date library, a C++11/14/17 date and time library based on
  the C++ <chrono> library.  Provides the header-only date component and the
  compiled date-tz timezone component (IANA tzdb-based).
homepage: "https://github.com/HowardHinnant/date"
license: MIT

