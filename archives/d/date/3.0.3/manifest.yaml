knowledge_gained:
  - "Manual tzdb mode avoids both an implicit curl dependency and assumptions about a Linux zoneinfo layout on OHOS."
  - "The Conan package name differs from upstream's CMake package; CMakeDeps exposes the canonical date::date and date::date-tz targets."
  - "A TZ environment candidate must fall back to the existing platform discovery chain when it is a POSIX rule string, colon-prefixed path, or unknown IANA name."
