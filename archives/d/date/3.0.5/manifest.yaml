software: date
version: "3.0.5"
status: built
build_date: "2026-09-01"
build_system: cmake
conan_ref: "date/3.0.5"

source:
  url: "https://github.com/HowardHinnant/date/archive/refs/tags/v3.0.5.tar.gz"
  sha256: "ef786edc203daec76475825640b3af247bd08e31fc52217e5ce8f76107b4bb05"
  tag_commit: "179a6b921ccd6179b5b04dce812a89f71a51b4df"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TZ_LIB=ON"
    - "-DMANUAL_TZ_DB=ON"
    - "-DUSE_SYSTEM_TZ_DB=OFF"
    - "-DENABLE_DATE_TESTING=ON"
    - "-DCOMPILE_WITH_C_LOCALE=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-use-env-bash-for-compile-fail-tests.patch"
  - "0002-honor-tz-environment-for-current-zone.patch"

test_results:
  validation_round: 1
  upstream_source_translation_units: 108
  upstream_ctest_discovered: 108
  upstream_ctest_passed: 108
  upstream_ctest_failed: 0
  upstream_ctest_not_run: 0
  upstream_ctest_exempted: 0
  consumer_assertions_passed: 220
  test_environment:
    tzdata: "IANA tzdata2026b (SHA256 114543d9f19a6bfeb5bca43686aea173d38755a3db1f2eec112647ae92c6f544)"
    locale: "LC_ALL=C, LANG=C"
    timezone: "TZ=UTC"
knowledge_gained:
  - "Manual tzdb mode avoids both an implicit curl dependency and assumptions about a Linux zoneinfo layout on OHOS."
  - "Upstream v3.0.5 ships a project(date VERSION 3.0.4) in CMakeLists.txt; the tarball is the official v3.0.5 tag (commit 179a6b92) and the Conan version stays 3.0.5."
  - "The ambient LD_LIBRARY_PATH on Harmony PC can be malformed (space after a path separator); pinning LD_LIBRARY_PATH=/system/lib64 inside the recipe test environment keeps upstream CTest and consumer test binaries loadable."
  - "Upstream v3.0.5 rewrote test_fail.sh to #!/bin/sh, so the 3.0.3-era bash shebang patch only remains necessary for compile_fail.sh."
