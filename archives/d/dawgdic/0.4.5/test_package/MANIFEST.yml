# test_package/MANIFEST.yml
# Upstream test declaration for dawgdic 0.4.5.

package: dawgdic/0.4.5
homepage: "https://github.com/stil/dawgdic"

# Upstream test suite runs inside conanfile.py build() via `make check`.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - file: test/dawg-builder-test.sh
    source: "dawgdic-0.4.5/test/dawg-builder-test.sh"
    description: "Runs the dawg-builder-test binary (DawgBuilder insert/finish + Dictionary build + Contains checks)"
    command: "make check"
  - file: test/dictionary-test.sh
    source: "dawgdic-0.4.5/test/dictionary-test.sh"
    description: "Builds a dictionary with dawgdic-build and diffs dawgdic-find output against dictionary-answer"
    command: "make check"
  - file: test/completer-test.sh
    source: "dawgdic-0.4.5/test/completer-test.sh"
    description: "Builds a guided dictionary and diffs completion output against completer-answer"
    command: "make check"
  - file: test/ranked-completer-test.sh
    source: "dawgdic-0.4.5/test/ranked-completer-test.sh"
    description: "Builds a ranked dictionary, diffs output against ranked-completer-answer, runs ranked-completer-test"
    command: "make check"

test_package_tests:
  - file: test_dawgdic.cpp
    description: "C++ consumer: DawgBuilder/Dictionary/Guide/Completer API checks (12 assertions)"
    command: "test_dawgdic"
  - file: test_tools.sh
    description: "Packaged dawgdic-build/dawgdic-find plain + guided round trips"
    command: "bash test_tools.sh <package>/bin"

assertion_count: 14
