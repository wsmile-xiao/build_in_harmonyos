# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dd-opentracing-cpp/1.3.7
homepage: "https://github.com/DataDog/dd-opentracing-cpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --timeout 120"

# 上游实际运行的测试程序 (test/CMakeLists.txt 注册的 13 个 ctest 用例，
# 全部基于 3rd_party 内 vendored Catch2，无需外部测试框架)
upstream_tests:
  - file: test/agent_writer_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/agent_writer_test.cpp
    description: "Agent 写入器单元测试（编码/发送/重试）"
    command: "./agent_writer_test"
  - file: test/opentracing_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/opentracing_test.cpp
    description: "OpenTracing API 兼容性测试"
    command: "./opentracing_test"
  - file: test/propagation_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/propagation_test.cpp
    description: "Datadog/B3 传播头注入与提取测试"
    command: "./propagation_test"
  - file: test/sample_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/sample_test.cpp
    description: "采样器单元测试"
    command: "./sample_test"
  - file: test/span_buffer_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/span_buffer_test.cpp
    description: "Span 缓冲区单元测试"
    command: "./span_buffer_test"
  - file: test/span_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/span_test.cpp
    description: "Span 生命周期与标签测试"
    command: "./span_test"
  - file: test/tag_propagation_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/tag_propagation_test.cpp
    description: "Trace 级标签传播测试"
    command: "./tag_propagation_test"
  - file: test/tracer_factory_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/tracer_factory_test.cpp
    description: "Tracer 工厂函数测试"
    command: "./tracer_factory_test"
  - file: test/tracer_options_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/tracer_options_test.cpp
    description: "TracerOptions 解析与 JSON 序列化测试"
    command: "./tracer_options_test"
  - file: test/tracer_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/tracer_test.cpp
    description: "Tracer 核心行为测试"
    command: "./tracer_test"
  - file: test/limiter_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/limiter_test.cpp
    description: "限流器单元测试"
    command: "./limiter_test"
  - file: test/logger_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/logger_test.cpp
    description: "日志器单元测试"
    command: "./logger_test"
  - file: test/glob_test.cpp
    source: dd-opentracing-cpp-1.3.7/test/glob_test.cpp
    description: "Glob 模式匹配单元测试"
    command: "./glob_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_dd_opentracing.cpp
    description: "消费者测试: makeTracer/StartSpan/SetTag/Finish + 流式 Inject/Extract 传播 + getOptions/toJSON，共 10 项检查"
    command: "./test_dd_opentracing"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 23
