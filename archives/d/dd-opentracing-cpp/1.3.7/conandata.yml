# conandata.yml — dd-opentracing-cpp 1.3.7
#
# Upstream release v1.3.7 (2023-06-02). Tarball URL follows the canonical
# GitHub tag-archive form with the gh-proxy mirror fallback pre-committed
# (same mapping as ci/conan/build_and_test.sh: gh-proxy first, official URL
# last as fallback; Conan 2.x get() tries the list in order). sha256 matches
# the conan-center-index entry for the identical archive.

sources:
  url:
    - "https://gh-proxy.com/https://github.com/DataDog/dd-opentracing-cpp/archive/refs/tags/v1.3.7.tar.gz"
    - "https://github.com/DataDog/dd-opentracing-cpp/archive/refs/tags/v1.3.7.tar.gz"
  sha256: "8d39c6b23f941a2d11571daaccc04e69539a3fcbcc50a631837560d5861a7b96"

# Vendored private dependency (opentracing-cpp 1.6.0): the OHOS registry has
# no opentracing-cpp package yet (preflight: Unable to find in remotes), so
# the recipe downloads the upstream release tarball and builds + bundles it
# privately (same approach as upstream scripts/install_dependencies.sh).
# sha256 matches the conan-center-index entry for the identical archive.
opentracing_sources:
  url:
    - "https://gh-proxy.com/https://github.com/opentracing/opentracing-cpp/archive/refs/tags/v1.6.0.tar.gz"
    - "https://github.com/opentracing/opentracing-cpp/archive/refs/tags/v1.6.0.tar.gz"
  sha256: "5b170042da4d1c4c231df6594da120875429d5231e9baa5179822ee8d1054ac3"

patches:
  - patch_file: "patches/0001-tmpfile-tmpdir.patch"
    patch_description: "Respect TMPDIR/TMP/TEMP in test TmpFile: std::tmpnam() hardcodes /tmp (read-only on HarmonyOS), so relocate only the directory portion to the harness-injected writable temp root; the temp file is still really created, written, consumed and removed"
    patch_type: "test"
