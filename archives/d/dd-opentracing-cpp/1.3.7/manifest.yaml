# 版本级 manifest
# 文件位置: archives/d/dd-opentracing-cpp/1.3.7/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "1.3.7"
software: "dd-opentracing-cpp"
status: built
build_date: "2026-09-11"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/DataDog/dd-opentracing-cpp/archive/refs/tags/v1.3.7.tar.gz"
  sha256: "8d39c6b23f941a2d11571daaccc04e69539a3fcbcc50a631837560d5861a7b96"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED=OFF"
    - "-DBUILD_STATIC=ON"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_PLUGIN=OFF"
    - "-DBUILD_OBJECT=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - libcurl/8.5.0
    - msgpack-cxx/7.0.0
    - zlib/1.3.1.1
  vendored:
    - "opentracing-cpp/1.6.0 (private: built from upstream release tarball into build_folder prefix and merged into this package; registry has no standalone package yet)"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "in-recipe _patch_cmakelists_for_conan rewrite (no .patch file): deps via Conan config packages (vendored OpenTracing private prefix + msgpack-cxx/CURL/ZLIB with correct OpenTracing::opentracing/opentracing-static targets); drop sanitizers-cmake helpers"
  - "patches/0001-tmpfile-tmpdir.patch (test-only): test TmpFile honors TMPDIR/TMP/TEMP instead of hardcoded /tmp"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游默认用 scripts/install_dependencies.sh 预编译 deps/ 树；Conan 化需把 find_path/find_library 换成 find_package(CONFIG)"
  - "上游 3rd_party 内含 nlohmann/json 与 Catch2，库本身无需 nlohmann_json 外部依赖"
  - "BUILD_TESTING=ON 会强制 BUILD_SHARED=ON；静态包需在 package() 裁掉多余 .so"
  - "test/ 树的 add_sanitizers() 调用可用 recipe 内 no-op shim 兼容，避免改上游测试文件"
