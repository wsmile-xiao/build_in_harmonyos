# test_package/MANIFEST.yml
# 上游官方测试声明文件（drwav 0.14.5，官方 tag wav-0.14.5 归档）
# 详见 notes.md 上游官方测试逐入口台账。

package: drwav/0.14.5
homepage: "https://github.com/mackron/dr_libs"

# 上游无构建系统集成测试；测试源位于官方归档 tests/wav/（CMake 可选注册）。
upstream_check_command: ""

# conanfile.py build() 方法中未集成上游测试（header-only，无 build 步骤）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序（官方 tag 归档 tests/wav/，独立入口 3 个）
upstream_tests:
  - file: wav_encoding.c
    source: dr_libs-wav-0.14.5/tests/wav/wav_encoding.c
    description: "WAV 编码（写 WAV 文件）— 编译运行 PASS，生成 352,844B WAV"
    command: "./bin/wav_encoding enc_output.wav"
  - file: wav_decoding.c
    source: dr_libs-wav-0.14.5/tests/wav/wav_decoding.c
    description: "WAV 解码基准（对比 libsndfile）— 编译 OK；运行需 libsndfile 运行期共享库 + 官方 testvectors 数据（外部阻塞）"
    command: "./bin/wav_decoding"
  - file: wav_playback.c
    source: dr_libs-wav-0.14.5/tests/wav/wav_playback.c
    description: "WAV 播放（miniaudio）— 编译需 miniaudio 子模块（官方 tag 归档未含）+ 音频设备（外部阻塞）"
    command: "./bin/wav_playback input.wav"

# test_package 自带测试（消费者视角 + HarmonyOS 专项文件回环）
test_package_tests:
  - file: test.c
    description: "消费者测试：内存解码断言 + OHOS 文件写读回环"
    command: "./test_drwav"

# 测试断言总数（test.c 内存解码 7 项 + OHOS 文件回环 6 项）
assertion_count: 13