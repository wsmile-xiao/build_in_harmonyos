version: "1.1"
software: dascrubber
status: built
build_date: "2026-09-11"
build_system: makefile

source:
  url: "https://deb.debian.org/debian/pool/main/d/dascrubber/dascrubber_1.1.orig.tar.gz"
  sha256: "cd350ac73a580e659c2f3f6fea12c99ceaa62445a7d7c968af97410acab88fcb"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  build_command: 'make CC="<tools.build:compiler_executables:c>" -j1 (CC via portability patch replacing hardcoded gcc)'

patches_applied:
  - "patches/0001-use-conan-cc-instead-of-hardcoded-gcc.patch"

binary:
  type: executable
  path: bin/DAScover (+9 tools)
  tools:
    - DAScover
    - DASqv
    - DAStrim
    - DASpatch
    - DASedit
    - DASmap
    - DASrealign
    - REPcover
    - REPqv
    - REPtrim

conan:
  verified: false
  verification_note: "待 HMBS 真机预检（conan create）通过后由后端统一更新"

knowledge_gained:
  - "DASCRUBBER 纯 Makefile 项目，上游 Makefile 硬编码 gcc，需 $(CC) 补丁才能吃到 Conan  profile 编译器"
  - "纯 C99 + -lm，无第三方依赖，无 configure 步骤"
  - "上游无正式测试套件（无 check/ctest 入口）；HMBS 门禁不接受 no_tests/0，test_package 以 11 项真实执行（在位检查 + 10 工具逐一 Usage 契约）作为上游等效验证并上报 passed/custom"
