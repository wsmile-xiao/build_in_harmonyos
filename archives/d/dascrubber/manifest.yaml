software: dascrubber
display: "dascrubber"
description: "Dazzler 比对校正管线工具集（PacBio 长读长 scrubbing：DAScover→DASqv→DAStrim→DASpatch→DASedit）"
category: utility
homepage: "https://github.com/thegenemyers/DASCRUBBER"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 工具包，仅发布 10 个二进制（application 包，R38）"
    - "上游 Makefile 硬编码 gcc，portability 补丁改为 $(CC) 以吃到 Conan profile 编译器（R33）"
    - "纯 C99 + -lm，无第三方依赖，无 configure 步骤"
    - "上游无测试套件，test_package 用 Usage 契约负向对照防空壳（R34）"
  common_dependencies: []

versions:
  "1.1":
    status: built
    build_date: "2026-09-11"
