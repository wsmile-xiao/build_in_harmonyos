software: Digest-HMAC
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.05/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.05"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（顶层字段，用于质量检查）
build_system: perl

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://cpan.metacpan.org/authors/id/A/AR/ARODLAND/Digest-HMAC-1.05.tar.gz"

  # 源码校验和
  sha256: "215cb59cba610745cfb2d4b3f8ef756d590e57e3ad7986a992e87c4969fcdc7a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "INSTALL_BASE=$DEFAULT_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  # 运行时依赖（更正：使用内置模块而非 CPAN）
  dependencies:
    - "Digest::SHA (Perl 5.42+ 内置)"
    - "Digest::MD5 (Perl 5.42+ 内置)"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块，无 XS 组件，编译简单"
  - "使用 INSTALL_BASE 而非 --prefix 设置安装路径"
  - "Digest::HMAC_SHA1 使用 Digest::SHA (Perl内置) 而非 Digest::SHA1 (CPAN)"
  - "Perl 5.42+ 内置 Digest::SHA v6.04 和 Digest::MD5 v2.59"
  - "RFC 2202 测试向量全部通过（14 个测试）"
  - "与 OpenSSL HMAC 实现结果完全一致"
  - "无需额外安装依赖，开箱即用"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
