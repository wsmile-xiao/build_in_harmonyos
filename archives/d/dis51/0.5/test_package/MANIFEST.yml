# test_package/MANIFEST.yml — dis51 0.5
# CI (build_and_test.sh L0e) requires this file: it declares where the upstream
# tests are and which consumer tests the package itself adds.

package: dis51/0.5
homepage: "https://plit.de/asem-51/dis51.html"

# ── 上游测试入口台账 ─────────────────────────────────────────────────────────
# dis51 0.5 (21 Nov 2003) 上游不带任何测试套件：
#   1. `python3 -m tarfile -l dis51-0.5.tar.gz` 共 16 个成员 = 1 个顶层目录
#      dis51-0.5/ + 15 个文件（Makefile, README, NOTES, HISTORY, COPYING,
#      10 个 .c/.h），其中没有任何 test/check/spec 命名成员；
#   2. 顶层 Makefile 的目标只有 default / dis51 / *.o / shared / clean，
#      没有 check/test 目标（`grep -nE '^[a-zA-Z0-9_.-]+:' Makefile`；
#      `make -n check` 实测 rc=2 "No rule to make target 'check'"）。
# 因此上游用例数 = 0（“未发现可运行的上游测试入口”），既不是 PASS 也不是
# SKIP；本文件的 upstream_* 字段按此如实填写。
upstream_check_command: ""  # 上游无 check/test 目标，无可运行入口
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── 适配后新增的消费者测试（conan create 自动执行）──────────────────────────
test_package_tests:
  - file: conanfile.py
    description: "Consumer test entry: takes bin/ from the tested package and runs test.sh with bash"
    command: "conan create . --version=0.5 -pr:h=ci/conan/profiles/ohos-aarch64"
  - file: test.sh
    description: "12 个功能用例：--version/--help 长选项、5 组 Intel HEX 夹具的黄金汇编清单比对（含 -l 列表模式与第二个入口地址）、段/数据指令断言、A5 非法操作码诊断、损坏 HEX 与空输入拒绝"
    command: "bash test.sh <package_bin_dir> [work_dir]"

# 夹具与黄金清单（人工按 8051 指令编码核对，不是由被测程序自证）
test_fixtures:
  - fixtures/basic.hex: "LJMP + MOV/ADD + MOV P1,A + 自跳转 SJMP + 不可达 RET（降级为 DB）"
  - fixtures/sfr.hex: "SFR 符号名（P1/SBUF/TH1/PCON/IE）、位地址（SETB EA、CLR P1.0）、MOV DPTR,#imm16"
  - fixtures/alu.hex: "INC/DEC/MUL/DIV/ADD/ADDC/SUBB/ANL/ORL/XRL/CPL/CLR/RL/RR/RRC/RLC/SWAP/PUSH/POP/MOVX/MOVC"
  - fixtures/flow.hex: "JNZ/LCALL/RET/DJNZ/AJMP + 代码段间隙与被跳过的数据字节"
  - fixtures/illegal.hex: "非法操作码 A5（唯一保留操作码）诊断与后续字节降级为数据"
  - expected/*.asm, expected/basic.listing.txt: "上列夹具的黄金输出（默认入口 0 / 入口 16 / -l 列表模式）"

# 用例统计（统计单位：test.sh 中的功能用例，每个用例打印一行 [ok]/[fail]）
test_case_count: 12

# 兼容旧字段：断言总数与用例数一致（每个用例一次判定）
assertion_count: 12
