version: "0.5"
software: "dis51"

# conan-verify/W3 通过、release upload 未确认前只能记 built（workflow 第 13 节）
status: built

build_date: "2026-09-11"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://plit.de/asem-51/dis51-0.5.tar.gz"
  sha256: "a6241f142324bb175ed94a663b2caec53e06943320ef6e127015746e13c9a4f6"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # 上游 Makefile 无 configure 步骤，也没有 install 目标
  configure_options: []
  build_command: "make -j1 CC=<profile tools.build:compiler_executables:c>"
  # 上游 Makefile 自带 CFLAGS=-c -I. -Wall；hnp clang 默认产出 PIE + BIND_NOW + NX
  build_flags:
    - "CC=/data/service/hnp/bin/clang"
  dependencies: []
  cc: clang
  cxx: clang++

