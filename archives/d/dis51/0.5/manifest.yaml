# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CLI 工具缺 --version/--help 长选项时，L2 smoke test 调用的这两个长选项会落到位置参数分支，本程序还会阻塞在 stdin 上；在 main() 读取输入前拦截并返回 0"  # knowledge_ref: E503
  - "上游零测试入口的包按可审计台账记为 0（既不是 PASS 也不是 SKIP），替代验证用与实现独立的输入夹具加人工核对清单，并保留 L1e 破坏性反向验证路径"  # reference: knowledge/drafts/DRAFT-cute_files-1.0.0-upstream-zero-test-ohos-validation.md
  - "同一 0.5 版本的发行版重打包 tarball（Debian dis51_0.5.orig.tar.gz）顶层目录名与联系邮箱都与官方发布页 tarball 不同，字节不一致，因此源码 sha256 只能锚定官方发布页"  # reference: conandata.yml sources
