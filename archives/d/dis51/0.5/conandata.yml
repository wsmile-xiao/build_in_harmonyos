# conandata.yml — dis51 0.5
#
# 官方源码来自 Dis51 发布页（asem-51 站点，Uwe Hermann 维护）。
# 上游作者原始下载地址（members.naspa.net 域名）已失效，发布页提供的
# dis51-0.5.tar.gz 为同内容正式发行 tarball：顶层目录 dis51-0.5/，
# 共 16 个成员 = 1 个顶层目录 + 15 个文件（Makefile、README、NOTES、
# HISTORY、COPYING 与 10 个 .c/.h 源文件）。
# 注意：Debian 的 dis51_0.5.orig.tar.gz 是发行版重新打包（顶层目录
# dis51-0.5.orig，且联系邮箱为更早的 earthlink 版本），字节与本 tarball
# 不一致，因此 sha256 只锚定官方发布页这一份。
#
# 补丁生成方式：3 个补丁按 workflow 第 17 节（refresh-patch 已知缺陷：
# 丢补丁、改名不同步 conandata.yml、整段删 manifest 小节）的临时口径用
# 人工 GNU diff 生成，并已用 patch_ng 1.19.1（Conan
# apply_conandata_patches 的实际执行路径）在纯净源码树上 strip=0 验证
# 全部应用成功，本文件的 patch_file 逐条同步。待框架修复后回改为
# refresh-patch --auto 生成。

sources:
  url: "https://plit.de/asem-51/dis51-0.5.tar.gz"
  sha256: "a6241f142324bb175ed94a663b2caec53e06943320ef6e127015746e13c9a4f6"

patches:
  - patch_file: "patches/0001-fix-format-string-warning.patch"
    patch_description: "pass2.c 用字面量格式串调用 fprintf，消除 -Wformat-security 非字面量格式串（与 Debian dis51 0001_format_string.patch 同源）"
    patch_type: "bugfix"
  - patch_file: "patches/0002-fix-signed-label-array.patch"
    patch_description: "global.c 的 lbl[] 定义与 global.h 声明不一致（short 对 unsigned short），标签数超过 32767 时编号变负（与 Debian 0002_unsigned_short_lbl.patch 同源）"
    patch_type: "bugfix"
  - patch_file: "patches/0003-add-version-and-help-options.patch"
    patch_description: "在读取标准输入之前处理 --version/--help 长选项，使 CLI 通过 smoke test 且不阻塞等待 HEX 输入"
    patch_type: "portability"
