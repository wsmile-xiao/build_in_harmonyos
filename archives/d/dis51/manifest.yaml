# 软件级 manifest — dis51
# 文件位置: archives/d/dis51/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: dis51

display: "Dis51"

description: "8051 微控制器反汇编器 — 读取 Intel HEX 文件，从命令行入口地址出发跟踪代码并输出 8051 汇编"

category: utility

homepage: "https://plit.de/asem-51/dis51.html"

license: GPL-2.0-only

build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目（0.5 发布于 2003 年）：无 configure、无 install、无 check/test 目标，只能 `make CC=<clang>` 后手工安装产物"
    - "输入固定从 stdin 读、输出固定写 stdout，没有输入文件或输出文件选项，测试与消费方都需要重定向"
    - "上游 CLI 只识别 -l 与入口地址参数，--version/--help 会落到位置参数分支；补丁在读取 stdin 前拦截这两个长选项（L2 smoke gate，E503）"
    - "global.c 的 lbl[] 定义（short）与 global.h 声明（unsigned short）类型不一致，标签数超过 32767 时编号变负"
    - "hnp clang 不传额外链接参数即产出 PIE + BIND_NOW + NX 的 hnp 签名产物，无需自定义加固 flag"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.5":
    status: built
    build_date: "2026-09-11"
    conan_ref: "dis51/0.5"
