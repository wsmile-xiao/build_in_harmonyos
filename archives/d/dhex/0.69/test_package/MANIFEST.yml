# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dhex/0.69
homepage: "https://www.dettus.net/dhex/"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: dhex_0.69.tar.gz, sha256 52730bcd1cf16bd4dae0de42531be9a4057535ec61ca38c0804eb8246ea6c41b)
upstream_test_audit:
  source_tarball: "dhex_0.69.tar.gz"
  source_sha256: "52730bcd1cf16bd4dae0de42531be9a4057535ec61ca38c0804eb8246ea6c41b"
  top_level_files:
    - Makefile            # 仅 all/dhex/install/clean 目标与 .c.o 后缀规则; 无 check/test/TESTS 目标
    - main.c              # 纯实现源, 无 TEST()/TEST_F (gtest) / def test_ (pytest)
    - mkrelease.sh        # 发布打包脚本, 仅 make + ./dhex -v 烟雾, 非测试套件
    - todo.txt            # 含 "write a test suite which checks if searching/correlation etc. works" — 上游自认无测试套件
    - README.txt          # 使用文档, 无测试说明
    - dhex.1/dhexrc.5/dhex_markers.5/dhex_searchlog.5  # man 手册页, 非测试
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile check / test / TESTS 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "ctest / meson test / configure.in 测试宏"
    - "find . -name '*test*' (全树)"
  scan_result: "0 matches — 全树无 tests/ 目录与测试源文件; Makefile 无 check/test 目标; todo.txt 明确缺测试套件"
  make_check_output: "Makefile 未定义 check 目标 — make check 无规则可执行, 上游测试执行数为 0"
  reason: "dhex 0.69 为纯 CLI ncurses 工具, 官方源码包不含任何测试套件: 无 tests/ 目录、无测试源文件、无 check/test 目标 (todo.txt 自认缺测试套件)。功能验证由 test_package 真实执行 dhex 二进制 (-v 精确版本断言 + -h 帮助断言 + -g 许可证断言) 完成"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质执行被测包的二进制
test_package_tests:
  - file: test.sh
    description: "功能测试: dhex -v 精确版本断言(0.69) + dhex -h 帮助断言(含 DHEX) + dhex -g 许可证断言(含 GPL)"
    command: "bash test.sh"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 test.sh 并输出 HMBS 机器证据标记 (test_package discovered=3/passedCount=3 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test.sh 的 3 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=3 一致)
assertion_count: 3
