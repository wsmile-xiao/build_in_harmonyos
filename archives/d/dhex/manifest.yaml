software: dhex
display: "dhex"
description: "dhex 是基于 ncurses 的十六进制编辑器，含 diff 二进制对比模式与主题支持"
category: utils
homepage: "https://www.dettus.net/dhex/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "手写 Makefile 无 check/test 目标，上游无测试套件（todo.txt 自认缺失）"
    - "output.h 的 initcolors 补全函数原型以匹配定义"
    - "依赖 ncurses/6.6（宽字符静态库），符号链接满足上游 -lncurses"
    - "命令行工具: 软件级 commands.json 声明 (R38)"
  common_dependencies:
    - ncurses

versions:
  "0.69":
    status: built
    build_date: "2026-09-10"
