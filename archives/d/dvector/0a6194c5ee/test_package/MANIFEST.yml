# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dvector/0a6194c5ee
homepage: "https://github.com/BareRose/dvector"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# dvector 上游仓库仅含 dvector.h + README.md + LICENSE 三个文件（0a6194c5ee），
# 无构建系统、无 tests/ 目录、无任何测试注册，故无上游测试可运行（R51 清点证据：
# codeload tarball 文件清单 = LICENSE/README.md/dvector.h，见 notes.md 与 conandata 源码包）。
upstream_check_command: "none (upstream has no build system / no tests)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：上游无测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：include dvector.h，实际调用 vec3/quat/mat4/frst API 并断言结果"
    command: "./test_dvector"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16
