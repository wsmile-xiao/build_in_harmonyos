# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0a6194c5ee/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0a6194c5ee"

# 软件名
software: "dvector"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: "headeronly"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 archive tarball，R39）
  url: "https://github.com/BareRose/dvector/archive/0a6194c5ee.tar.gz"

  # 源码校验和
  sha256: "4b0683f530ef64861407ce7ae3b31ae7d3f41784f13ffc6e2912e047882f5864"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | headeronly
  system: headeronly

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "header-only 库（无构建系统）用 headeronly 模板：package_type=header-library，build() 留空（R34），package_id clear"
- "conan 2 copy() 的目标必须显式 os.path.join(self.package_folder, 'include')，相对 dst 会落到错误目录导致 'No files in this package!'"
- "conandata sources.url 必须是可直接下载的官方 archive tarball（https://github.com/{owner}/{repo}/archive/{commit}.tar.gz），不能是仓库主页，否则 conan get 403"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
