# conandata.yml — db5.3 5.3.28（Oracle / Sleepycat Berkeley DB 5.3，
# Debian 源包名 db5.3，与仓库内已有的 berkeley-db5/5.3.28 同一上游 tarball）
#
# 源：Oracle 官方归档主机（https，非镜像、非 Debian 重打包）。
# 下载双校验：sha256 + `tar tzf | wc -l` = 9597（本次均实测一致）。
sources:
  "5.3.28":
    url: "https://download.oracle.com/berkeley-db/db-5.3.28.tar.gz"
    sha256: "e0a992d740709892e81f9d93f06daf305cf73fb81b545afe72478043172c3628"

patches:
  "5.3.28":
    - patch_file: "patches/0001-dist-config.guess-ohos.patch"
      patch_type: "portability"
      patch_description: >-
        dist/config.guess 增加 *:HarmonyOS:*:* 分支（旧式写法：echo + exit），
        使原生构建时能猜出 aarch64-unknown-linux-ohos。上游捆绑的是 2011-11-11
        版 GNU config.guess（`grep -c '^GUESS='` = 0，旧式代际），官方 E007 工具
        scripts/patch-autotools-ohos.pl 的 5 个锚点全部取自 2016 年重构后的新式
        脚本，对旧式脚本只能命中 1/5、且插入 GUESS= 赋值在旧式脚本里是死代码
        （见 knowledge/drafts/DRAFT-E564-oldstyle-config-guess-ohos-reanchor.md）。
        本补丁按 E564 的旧式锚点手工编写并本机验证（见 notes.md）。
    - patch_file: "patches/0002-dist-config.sub-ohos.patch"
      patch_type: "portability"
      patch_description: >-
        dist/config.sub 增加两个锚点（E564 要求双锚点缺一不可）：
        maybe_os 的 kernel-libc 行接受 linux-ohos，basic os 列表接受
        -linux-ohos，使 aarch64-unknown-linux-ohos 原样通过校验。
    - patch_file: "patches/0003-dist-Makefile.in-check-target.patch"
      patch_type: "conan"
      patch_description: >-
        dist/Makefile.in 两处改动，都是为了让上游测试真的能跑、且成为标准入口：
        ① 把 `check depend dvi info obj TAGS:` 里的 check 桩
        （`@echo "make: $@ target not available"`）拆成真目标 `check: cutest` → `./cutest`，
        这样 `make check` 就是上游 CuTest 套件的真实入口（任何 suite 失败即 make 非 0 退出）；
        ② CUTEST_FLAGS 追加 -O0：上游 test/c/suites/TestQueue.c 用 SH_LIST_* 相对偏移宏操作
        malloc 出来的对象，跨对象指针相减是 C 未定义行为，GCC -O1/-O2 会把元素 link 字段的
        写入当死存储删掉（插桩实测 -O0 next=-1/prev=-800、-O1 next=0/prev=0）→
        sh_l_as_string 沿 next=0 自环、静态缓冲越界 SIGSEGV。只降级测试对象，库本体优化级别不变。
