test_results:
  upstream_check_target: "make check（patches/0003 把上游的 `target not available` 桩换成真目标后生效）"
  upstream_check_target_note: >-
    上游 dist/Makefile.in 原本的 `check depend dvi info obj TAGS:` 只有
    `@echo "make: $@ target not available"`（原文桩）。本包用 patches/0003 把 check 拆成
    真目标 `check: cutest` → `./cutest`（并给 CUTEST_FLAGS 追加 -O0 规避 TestQueue 的
    SH_LIST 相对偏移宏 UB），因此 build() 里的 `make check` 是**真跑上游 CuTest**：
    任何 suite 失败都会让 make 非 0 退出 → 构建失败。上游 Tcl 套件则用上游自己的驱动
    test/tcl/test.tcl 的 `r <subsystem>` 跑。
