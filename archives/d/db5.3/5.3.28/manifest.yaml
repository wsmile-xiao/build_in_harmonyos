  upstream_tcl_failed: 0
  upstream_tcl_report_only: "log（上游 log006.d 目录相关不稳定，FAIL 原文仍打进日志）"

  upstream_tcl_note: >-
    env 21 / txn 14 / log 9 / byte 9 / lock 6 / rsrc 4 / mutex 2 /
    dbm 1 / ndbm 1 / hsearch 1 / archive 1 / backup 1 = 70 个测试，全 0 FAIL。
    另做过一次性全量普查：19 个本地子系统（含 memp/sdb/sindex/compressed）0 FAIL，
