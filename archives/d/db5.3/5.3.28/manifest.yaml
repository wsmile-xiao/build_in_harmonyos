ohos_ci_evidence:
  build: "PR #14142 build #66206（worker CI-033）"
  make_check: "通过 —— HMBS_UPSTREAM_CUTEST_SUMMARY rc=0 suites=9 suites_failed=0 macro_sub_cases=232"
  consumer_c_api: "14 checks, 0 failed（事务环境/提交/读回/游标/回滚，dlopen libdb-5.3.so 正常）"
  tcl_suite: "declared=12 executed=0 unavailable=12 —— CI 的 tcl/8.6.16 tclsh 不支持 load（与 db/6.2.32 记录一致），配方如实记 unavailable 并告警，硬闸退回 CuTest"
  cli_chain: "4 轮 CI 实证：OHOS 拒绝对**包目录里的安装态 ELF** execve（EACCES），自签名（.codesign 段确认写入、rc=0、0755）也救不了；仓库 db/6.2.32、berkeley-db5 同样把安装态 CLI 的 L2 冒烟记非阻塞 warn。处理：① package() 仍按 E128/E077 逐个签名 14 个 bin/db_* 与 lib/*.so（写另一个输出文件再 os.replace，原地写法对动态链接 C ELF 实测无效）并加真 exec 抽检 HMBS_OHOS_EXEC_PROBE（失败只告警）；② CLI 端到端链路移到 build()，用刚构建的 build_unix/db_* 真跑 5 项（HMBS_CLI_CHAIN，build 目录 ELF 可执行，./cutest 已在 CI 反复跑通）；③ test_cli.py 在执行被拒时显式打印平台限制说明 + 只保留交付形态检查"

knowledge_gained:
  - "GCC15/clang 下 BDB 5.3.28 的 CFLAGS 需要 7 条，尤其 -Wno-error=implicit-function-declaration：缺它会静默劣化 configure 的运行期探测（atomic/64bit-seq/mmap-grow 三项 no），最终 HAVE_64BIT_TYPES 未定义 → libdb_tcl-5.3.so 链接通过但 dlopen 报 undefined symbol: _SetListElemWideInt，上游 Tcl 套件全跑不起来"
  - "上游 CuTest 的 TestQueue 用 SH_LIST_* 相对偏移宏操作 malloc 对象（跨对象指针相减 = UB）；GCC -O1/-O2 把元素 link 字段写入当死存储删掉（插桩实测 -O0 next=-1/prev=-800，-O1 next=0/prev=0）→ sh_l_as_string 沿 next=0 自环缓冲越界 SIGSEGV；只把 cutest 对象降到 -O0 即 9/9 全绿（库本体仍 -O1）"
  - "conan Release profile 注入的 -DNDEBUG 会改变 BDB 5.3 上游 repmgr 通道语义：CuTest TestChannel 第 454 行断言稳定失败；A/B/C/D 四组对照证明只与这一个 define 相关（与 static/shared、--prefix 无关），上游默认构建不带它 → toolchain.ndebug = None"
  - "BDB 没有真 make check（dist/Makefile.in 的 check: 是 target not available 桩）→ 用一个补丁把 check 拆成真目标 `check: cutest` → `./cutest`，即同时满足平台“build() 里要有 make check”的门禁与“上游测试真跑”的实质；另一套上游套件入口是 test/tcl/test.tcl 驱动（r <subsystem>），需要 --enable-tcl 且 HAVE_64BIT_TYPES 必须被定义"
  - "旧式（pre-2016）config.guess 的 OHOS 适配要走 E564 的锚点：*:HarmonyOS:*:* 用 echo+exit 写法插在 arm*:Linux 分支前；config.sub 必须双锚点（maybe_os kernel-libc 行 + basic os 列表行）；官方 perl 工具只覆盖新式脚本"
  - "HMDFS：dist/configure 内嵌的 config.status 模板里有两处必须改写——ksh 风格 print 回显探测假阳性（改回 printf %s\\n）与 umask 077 造 2700 目录导致 awk 临时脚本拒写（改 022）"
  - "E128 + E077：OHOS 上被 execve 的 ELF 必须带 .codesign 段，否则 PermissionError(EACCES)（而文件权限位完全正常、os.access(X_OK) 也为真）；签名后还需 chmod 0o755 复原 owner x 位（HMDFS 会丢位）。修法（对**动态链接 C 可执行文件**以 tcl/8.6.16 为准：**写到另一个文件**再 os.replace；dbmate/2.33.0 的原地 -outFile X 对 C ELF 实测无效，且 os.access(X_OK) 看不出签名没生效，必须用真 exec 抽检）：/data/service/hnp/bin/llvm-objcopy --remove-section .codesign <f> 幂等清旧段 → /data/service/hnp/bin/binary-sign-tool sign -selfSign 1 -inFile <f> -outFile <f> 原地签 → chmod 0o755；范围含 bin/* 与 lib/*.so（符号链接跳过）。库 .so 用 dlopen 不强制要求签名，但一并签更稳；消费者用例不应为此加跳过逻辑"
  - "CI 的 L1 门禁是**静态扫描 conanfile**：build() 里必须出现 make check / ctest / meson test / pytest 的调用（只在日志里印字样不够）。对上游把 check 做成 echo 桩的项目（如 BDB：`check: @echo target not available`），正解是先用 patches 把 check 做成真目标（`check: cutest` → `./cutest`）再调用它——门禁与真跑同时成立"
  - "BDB 的 dist/configure 非标准（configure 在 dist/、build 需在源码树的 build_unix/），conan 侧要用显式 folders.source/build 并把所有命令用 cwd=<source>/build_unix 跑"

