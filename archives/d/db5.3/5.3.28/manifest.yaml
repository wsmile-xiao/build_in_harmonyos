software: db5.3
version: "5.3.28"
status: built
build_date: "2026-10-01"
build_system: autotools

source:
  url: "https://download.oracle.com/berkeley-db/db-5.3.28.tar.gz"
  sha256: "e0a992d740709892e81f9d93f06daf305cf73fb81b545afe72478043172c3628"
  tar_format: tar.gz
  double_check: "sha256 + `tar tzf | wc -l` = 9597（实测一致，35090431 字节）"
  note: >-
    Oracle 官方归档主机（https）。仓库里已有的 berkeley-db5/5.3.28 是同 tarball 的
    另一条记录；本包用 Debian 源包名 db5.3（平台任务名），因此是独立条目。

build:
  system: "autotools（configure 在 dist/，必须先建 build_unix 再 `../dist/configure`）"
  configure_command: "mkdir -p build_unix && cd build_unix && ../dist/configure"
  configure_options:
    - "--prefix=/（安装用 DESTDIR=<package_folder>，包内不留打包机绝对前缀）"
    - "--enable-posixmutexes"
    - "--enable-test"
    - "--enable-tcl（跑上游 Tcl 测试套件；交付物不含 libdb_tcl*）"
    - "--with-tcl=<展开 ${TCL_ROOT} 后的 tclConfig.sh 目录>"
    - "--enable-shared --disable-static（跟随 shared 选项；默认 shared=True）"
  cflags:
    - "-O1"
    - "-w"
    - "-fcommon"
    - "-Wno-error=implicit-int"
    - "-Wno-error=implicit-function-declaration"
    - "-Wno-error=incompatible-pointer-types"
    - "-Wno-error=int-conversion"
  cflags_note: >-
    最后一条 implicit-function-declaration 是本次新增、也是必需：GCC15/clang 把
    implicit-* 当硬错误（-w 挡不住），缺它会让 configure 的三个运行期探测静默变 no
    （atomic operations / 64-bit integral types for sequences / growing a file under
    an mmap region），进而 HAVE_64BIT_TYPES 未定义 → libdb_tcl-5.3.so 缺
    _SetListElemWideInt → 上游 Tcl 套件无法 load。
  make: "make -j1（worker 内存紧张，避免 fork OOM）"
  extra_fix: "toolchain.ndebug = None：清掉 conan Release profile 注入的 -DNDEBUG（见 knowledge_gained）"
  dependencies: []
  tool_requires:
    - "tcl/8.6.16（仅构建期跑上游 Tcl 测试套件；不进交付依赖）"
  cc: clang

patches_applied:
  - "0001-dist-config.guess-ohos.patch（旧式 config.guess 的 *:HarmonyOS:*:* 分支，echo+exit 写法，E007/E564）"
  - "0002-dist-config.sub-ohos.patch（config.sub 双锚点接受 linux-ohos，E007/E564）"
  - "0003-dist-Makefile.in-check-target.patch（把上游 `target not available` 的 check 桩改成真目标 check: cutest → ./cutest；CUTEST_FLAGS 追加 -O0，规避 TestQueue 的 SH_LIST 相对偏移宏 UB）"

