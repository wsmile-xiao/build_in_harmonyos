# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "daps 是纯 bash 脚本 + XSLT 工具套件（无 C/C++ 编译产物），configure 将运行时文档工具链（/etc/xml/catalog、convert、DocBook DTD/stylesheets）探测设为硬错误，OHOS 需降级为警告"
  - "daps 的 Makefile 为 in-source 设计，conan 配方 layout 需将 source/build 指到同一目录，否则 etc/config.in 等相对路径产物无法生成"
  - "E017 预防自动注入 ghfast.top 镜像，本机网络不可达时可用 conan sources download_cache（按 sha256 键值）预置 tarball 绕过"
  - "configure 的 AX_PYTHON_MODULE(lxml, fatal) 硬检查在 CI 环境（python 无 lxml）失败：lxml 仅 daps 辅助 python 工具（daps-xmlwellformed）运行时依赖，核心 bash 脚本套件不受影响，按方案 A 降级为警告"

