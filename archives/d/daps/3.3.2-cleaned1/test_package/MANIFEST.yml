# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: daps/3.3.2-cleaned1
homepage: "https://github.com/openSUSE/daps"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 test/run_tests.sh 依赖系统级文档工具链（shunit2/DocBook XSL/epubcheck
# /lynx/pdfinfo/xmlstarlet），OHOS 缺失，已实测无法运行（见 notes.md R51 清点）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "daps --version / --help / --commands / daps-check-deps 实质执行（4 断言）"
    command: 'bash test.sh'

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4