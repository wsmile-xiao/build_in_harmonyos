software: dua-cli
display: "Dua CLI"
description: "A tool to conveniently learn about the disk usage of directories, fast!"
category: system
homepage: "https://github.com/Byron/dua-cli"
license: MIT
build_system: cargo

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Rust 编译器在 OpenHarmony 上 SIGSEGV 崩溃，无法从源码编译"
    - "GitHub 发布的 aarch64-musl 预编译二进制在 OpenHarmony 上同样 SIGSEGV（musl 内存布局不兼容）"
    - "使用 glibc 风格内存布局的 Rust 静态二进制可正常运行"
  common_dependencies: []

# 版本索引
versions:
  "2.34.0":
    status: published
    build_date: "2026-06-04"