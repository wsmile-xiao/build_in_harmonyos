# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dev86/0.16.21
homepage: "https://github.com/jbruchon/dev86"

# 上游测试命令：dev86 v0.16.21 官方 tarball 无 `make check`/回归测试目标
# （bcc/as86/ld86 工具链仅带 examples/ 编译示例），上游测试用例数按 0 计。
upstream_check_command: "make check (not provided upstream — toolchain has no check target)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游未随包提供独立测试程序）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 真实调用被测工具链全链路：bcc -S 编译 C→8086 汇编 → as86 汇编 →
# ld86 链接 → objdump86 反汇编，断言全链路退出码 0（R34 真实调用）。
test_package_tests:
  - file: conanfile.py
    description: >
      dev86 8086 工具链端到端链路：用 bcc 将 test.c 编译为 8086 汇编
      （-S），as86 汇编为 .o，ld86 链接为 8086 可执行文件，objdump86
      反汇编分析产物；BCC_PREFIX 指向包内 lib/bcc 组件，TMPDIR 指向
      可写目录（OHOS /tmp 只读）。断言：4 个工具全部退出 0。
    command: "bcc -S test.c -o test.s && as86 test.s -o test.o && ld86 test.o -o test.elf && objdump86 test.elf"

# 测试断言总数 (近似值, 用于质量评估)：
# 工具链全链路 1 条（含 4 个工具的依次调用），本地 conan create 通过
assertion_count: 1
