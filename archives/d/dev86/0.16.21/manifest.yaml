# dev86 软件级 manifest
# 文件位置: archives/d/dev86/0.16.21/manifest.yaml
# 链接到 ARCHIVE-SPEC v2.0

software: dev86
display_name: "dev86 (Linux-8086 Development Environment)"
description: "8086 系列目标的 C 编译器/汇编器/链接器工具链（ELKS 内核使用）"
category: development
homepage: "https://github.com/jbruchon/dev86"
license: GPL-2.0
build_system: gnu-make

# 跨版本适配要点
ohos_adaptation:
  key_points:
    - "bcc 驱动硬编码 /tmp 临时目录（HMDFS 只读），补丁改为遵循 TMPDIR 环境变量"
    - "老式 C 代码（K&R 风格）被 clang 默认告警拦截，需 -Wno-* 放宽编译标志"
    - "bcc 运行期通过 BCC_PREFIX 环境变量注入安装前缀，组件位于 <prefix>/lib/bcc/"
    - "8086 目标库（libc 等）需 ncc 交叉编译，未纳入本次适配；仅打包主机工具链"
  patches_needed:
    - "0001-bcc-tmpdir.patch：bcc.c 支持 TMPDIR 环境变量"

# 版本索引
versions:
  - version: "0.16.21"
    status: built
    build_date: "2026-09-10"
    patches: 1
    notes: "主机工具链（bcc/as86/ar86/ld86/objdump86）适配"
