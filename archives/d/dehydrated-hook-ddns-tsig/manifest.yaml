software: dehydrated-hook-ddns-tsig
display: "dehydrated-hook-ddns-tsig"
description: "dehydrated 的 DNS-01 challenge hook：用 dnspython 通过 RFC2136+TSIG 动态更新 TXT 挑战记录"
category: network
homepage: "https://github.com/eferdman/dehydrated-hook-ddns-tsig"
license: GPL-3.0-or-later
build_system: python-script

ohos_adaptation:
  key_points:
    - "纯 Python 单脚本，无编译；入口 shebang 修正为 python3（设备无 python 命令）"
    - "运行依赖 dnspython：设备 Python 3.12.9 无该模块且仓库无配方，以固定 SHA256 的官方 PyPI sdist vendor 进本包（lib/python3.12/site-packages），入口脚本相对 sys.path 引导"
    - "可选依赖 iscpy 不打包（py2-only）；conf 直配 key_name/key_secret 规避 DDNS_HOOK_KEY_FILE 路径"
    - "补丁集参照 Debian 0.1.4-8（shebang/key 初始化/rcode==/resolver.resolve/nameserver 容错）并修复脚本自身 py3 兼容"
  common_dependencies:
    - "dnspython (vendored, MIT)"

versions:
  "0.1.4":
    status: built
    build_date: "2026-09-09"
    conan_ref: "dehydrated-hook-ddns-tsig/0.1.4"
