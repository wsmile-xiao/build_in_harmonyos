knowledge_gained:
  - "上游 v0.1.4 即 master 最终状态（上游停更），所有现代兼容修复必须以 recipe patches 携带"
  - "dnspython 2.x 下 rcode 是 IntEnum，`is` 身份比较恒 False，必须用 =="
  - "dnspython 2.x Resolver.nameservers setter 拒绝裸字符串，回退路径 [name_server_ip] 需包成列表"
  - "read_config() 对无 domain 参数的 hook（request_failure/startup_hook/exit_hook）会 KeyError — 上游 bug，测试只能用含 domain 的 no-op hook（invalid_challenge）"
  - "iscpy 为 py2-only（'rU' 模式 + keys()[0]），OHOS 不打包；用 conf 直配 key_name/key_secret 规避"
