sources:
  "0.1.4":
    url: "https://github.com/eferdman/dehydrated-hook-ddns-tsig/archive/refs/tags/v0.1.4.tar.gz"
    sha256: "a8732aaa9276b9b99e275019140440fe33212a388cd1c4e8144ea3b98a0dfffe"

patches:
  - patch_file: "patches/0001-ohos-python3-entry.patch"
    patch_description: "python3 shebang + relative sys.path bootstrap for the vendored site-packages (OHOS install layout)"
    patch_type: "portability"
  - patch_file: "patches/0002-init-key-variables.patch"
    patch_description: "pre-initialize key_name/key_secret/key_algorithm to avoid NameError with partial key configuration"
    patch_type: "bugfix"
  - patch_file: "patches/0003-rcode-value-comparison.patch"
    patch_description: "compare DNS rcode by value (==) — identity comparison breaks with dnspython 2.x IntEnum"
    patch_type: "bugfix"
  - patch_file: "patches/0004-dnspython-2x-resolve.patch"
    patch_description: "use dns.resolver.resolve() — query() is deprecated in dnspython 2.x"
    patch_type: "portability"
  - patch_file: "patches/0005-nameserver-tolerance.patch"
    patch_description: "keep remaining nameservers when one lacks A/AAAA records; accept bare-string nameserver fallback"
    patch_type: "bugfix"
  - patch_file: "patches/0006-py3-key-file-compat.patch"
    patch_description: "py3 fixes in ISC key-file parsing ('rU' open mode, keys()/values() indexing)"
    patch_type: "portability"
