# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dehydrated-hook-ddns-tsig/0.1.4
homepage: "https://github.com/eferdman/dehydrated-hook-ddns-tsig"

# 上游测试结论: NO_UPSTREAM_TESTS — 官方归档 v0.1.4 仅 4 个文件
# (COPYING/README.md/conf/py)，无 test 目录、无 CI workflow、
# 无 Makefile、无 setup.py/pyproject，Debian 打包亦不带测试。
upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: verify_hook.py
    description: "消费者侧验证: 安装布局(bin 脚本可执行+python3 shebang+conf 样例)、vendored dnspython 导入链与版本、rcode==/TSIG keyring+update/Resolver.nameservers 离线 API、--help 与 invalid_challenge 回调冒烟"
    command: "python3 verify_hook.py <package_folder>"
    executable: true

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
