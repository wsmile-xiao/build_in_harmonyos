software: dime
display: "dime"
description: "C++ library for reading, manipulating, and writing DXF (AutoCAD Drawing eXchange Format) files"
category: cad-file-format
homepage: "https://github.com/coin3d/dime"
license: "BSD-3-Clause"
build_system: autotools

ohos_adaptation:
  key_points:
    - "2009-era config.guess/config.sub reject OHOS; pin generic linux-gnu build/host triplets instead of patching cfg/."
    - "Pass -fuse-ld=<ld.lld> so configure's C++ link probes succeed (OHOS has no bare ld on the clang driver path)."
    - "Run configure under bash with a build-local TMPDIR; mksh + read-only /tmp break config.status."
    - "Drop the C++17-removed register storage class in src/Input.cpp."
  common_dependencies: []

versions:
  "0.20111205":
    status: built
    build_date: "2026-09-12"
    source: "https://github.com/coin3d/dime/archive/edcbe949ae67.tar.gz"
