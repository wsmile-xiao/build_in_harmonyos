patches:
  "0.20111205":
    - patch_file: "patches/0001-configure-use-TMPDIR-for-temp-dir.patch"
      patch_description: "Make the autoconf temporary directory honour $TMPDIR (OHOS /tmp is read-only)."
      patch_type: "portability"
    - patch_file: "patches/0002-Input-cpp-remove-register-storage-class.patch"
      patch_description: "Drop the register storage class qualifier (removed in C++17; clang 15 errors under -std=gnu++17)."
      patch_type: "portability"
