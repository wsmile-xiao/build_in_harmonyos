package: dime/0.20111205
homepage: "https://github.com/coin3d/dime"

# Upstream has no test suite in this snapshot: no tests/ directory, no
# TESTS/check_PROGRAMS declarations in any Makefile.am (automake emits an
# empty `check` target).  The only in-tree programs are the noinst
# examples dxf2vrml/dxfsphere.  R51 inventory evidence is recorded in
# notes.md; test_package provides the functional coverage.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.cpp
    description: "Basic round-trip: build a model with one LINE entity, write DXF via dimeOutput, read back via dimeInput, verify entity type and all 6 coordinates."
    command: "./test_dime"
  - file: test_model_layers.cpp
    description: "Consumer use case (CAD-importer shape): LAYER table entry + 3DFACE mesh on that layer, write/read round-trip, verify layer name/count and entity type plus 9 vertex coordinates."
    command: "./test_model_layers"

assertion_count: 43
