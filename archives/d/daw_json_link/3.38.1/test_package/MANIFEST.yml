# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: daw_json_link/3.38.1
homepage: "https://github.com/beached/daw_json_link"

upstream_check_command: "ctest -N"

upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: DAW_ENABLE_TESTING=ON 时启用 tests/（add_subdirectory(tests)），
# 上游测试依赖 FetchContent 拉取 daw_json_link_test_data（cities.json 等大数据集）
# 测试源码规模: tests/src/*.cpp 约 40+ 测试程序
upstream_tests:
  - file: tests/src/daw_json_link_test.cpp
    source: daw_json_link-3.38.1/tests/src/daw_json_link_test.cpp
    description: "核心解析/序列化往返测试（数据契约全特性）"
    command: "ctest -R daw_json_link_test"
  - file: tests/src/daw_json_city_test.cpp
    source: daw_json_link-3.38.1/tests/src/daw_json_city_test.cpp
    description: "cities.json 大数据集解析基准测试（FetchContent test_data）"
    command: "ctest -R daw_json_city_test"

test_package_tests:
  - file: test_daw_json_link.cpp
    description: "消费者测试: 验证 daw_json_link 库链接、json_data_contract/from_json/to_json/json_value 核心 API"
    command: "./test_daw_json_link"

assertion_count: 4
