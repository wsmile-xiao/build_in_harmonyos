# 版本级 manifest — daw_json_link 3.38.1
# 文件位置: archives/d/daw_json_link/3.38.1/manifest.yaml

# 版本号
version: "3.38.1"

# 软件名
software: daw_json_link

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源码下载 URL（beached/daw_json_link v3.38.1 tag）
  url: "https://github.com/beached/daw_json_link/archive/refs/tags/v3.38.1.tar.gz"

  # 源码 SHA-256（官方 tarball 实测）
  sha256: "8de522747e51954daa47f9b7e9b0258fa361f419a7ff170aa548a959ec52b514"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（header-only CMake INTERFACE library）
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DDAW_USE_PACKAGE_MANAGEMENT=ON"
    - "-DDAW_ENABLE_TESTING=OFF"

  # 编译依赖列表（daw 系依赖链，制品仓均已发布）
  dependencies:
    - "daw-header-libraries/2.135.0"
    - "daw-utf-range/2.2.6"

  # 编译器（OHOS aarch64 clang 15）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无需补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "daw_json_link 是 header-only 库（CMake INTERFACE library），仅含 include/daw/json/*.h"
  - "依赖链：daw-header-libraries + daw-utf-range（序列化路径 to_daw_json_string.h 用 daw/utf8/unchecked.h）"
  - "DAW_USE_PACKAGE_MANAGEMENT=ON 切换 find_package 模式（extern/ 默认 FetchContent——CI 无网环境必须切换）"
  - "CMake 目标：daw::daw-json-link / daw::json_link（两个 ALIAS 同名目标）"
  - "上游 tests/ 默认形态注册 141 个 add_test（159 总数中 18 个挂 DAW_JSON_FULL_TESTS=ON 条件）"
  - "上游测试默认启用 Boost（find_package Boost 1.83）——CI 无 Boost 时须 DAW_JSON_USE_BOOST=OFF"
