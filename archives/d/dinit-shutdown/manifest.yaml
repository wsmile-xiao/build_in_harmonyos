# 软件级 manifest
# 遵循 ARCHIVE-SPEC v3.0

software: dinit-shutdown
display: "dinit shutdown utilities"
description: "dinit 服务管理器的系统关机工具集（shutdown/halt/poweroff/reboot/soft-reboot）"
category: system
homepage: "https://davmac.org/projects/dinit/"
license: Apache-2.0
build_system: custom
conan_ref: "dinit-shutdown/0.21.0"

ohos_adaptation:
  key_points:
    - "上游 release tarball 顶层同时含 BUILD 文档与 build/ 目录，HMDFS 大小写不敏感导致 conan get() 解包失败；source() 以 excludes 排除该文档文件"
    - "configure 仅在 uname 报告 Linux 时默认构建 shutdown 工具，HarmonyOS 上须显式 --enable-shutdown"
    - "configure 写入 mconfig 的 SHUTDOWN_PREFIX 带单引号，make 目标名须用命令行变量覆盖修正"
    - "OHOS 工具链产物带 .codesign，须 --disable-strip，剥离符号后二进制加载失败（rc=126）"
    - "编译期控制 socket 为 /var/run/dinitctl（上游非 Linux 默认），需与 dinit 守护进程配置一致"
    - "鸿蒙平台契约由 test_package 的 9 条断言固化：64 位 LE AArch64 PIE、.codesign 段保留、未 strip（strip 后 rc=126）、控制 socket 与 dinit- 前缀字面量"
  common_dependencies: []

versions:
  "0.21.0":
    status: built
    build_date: "2026-09-11"
    conan_ref: "dinit-shutdown/0.21.0"
