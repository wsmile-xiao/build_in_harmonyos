# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dinit-shutdown/0.21.0
homepage: "https://davmac.org/projects/dinit/"

# 上游测试命令: src/Makefile 的 check 目标依次运行 src/tests 下 6 个测试程序
# 以及 src/tests/cptests（cptests 通过 src/tests/Makefile 的 build-tests 递归进入）。
upstream_check_command: "make -C src check"

# conanfile.py build() 方法中是否已集成上游测试（是：build() 末尾执行 make -C src check -j1）
upstream_test_in_build: true
upstream_test_command: "make -C src check -j1"

# 上游实际运行的测试程序（统计单位 = RUN_TEST 注册的测试用例；每个用例实跑打印一行 PASSED）
upstream_tests:
  - file: src/tests/tests.cc
    source: dinit-0.21.0/src/tests/tests.cc
    description: "服务集合/加载/依赖顺序/停止回滚等核心用例（44 例）"
    command: "./tests"
  - file: src/tests/proctests.cc
    source: dinit-0.21.0/src/tests/proctests.cc
    description: "进程服务（process/bgprocess/scripted）启动、超时、信号与重启用例（47 例）"
    command: "./proctests"
  - file: src/tests/loadtests.cc
    source: dinit-0.21.0/src/tests/loadtests.cc
    description: "服务描述文件解析与报错定位用例（15 例）"
    command: "./loadtests"
  - file: src/tests/envtests.cc
    source: dinit-0.21.0/src/tests/envtests.cc
    description: "服务环境变量处理用例（2 例）"
    command: "./envtests"
  - file: src/tests/iostreamtests.cc
    source: dinit-0.21.0/src/tests/iostreamtests.cc
    description: "dinit 控制流 iostream 编解码用例（7 例）"
    command: "./iostreamtests"
  - file: src/tests/cptests/cptests.cc
    source: dinit-0.21.0/src/tests/cptests/cptests.cc
    description: "控制协议（control protocol）客户端/服务端交互用例（21 例）"
    command: "./cptests"

# 上游用例总数取数命令（分子=实跑 PASSED 行数；与注册数逐文件对账）
#   注册数: grep -hc '^[[:space:]]*RUN_TEST(' src/tests/tests.cc src/tests/proctests.cc \
#             src/tests/loadtests.cc src/tests/envtests.cc src/tests/iostreamtests.cc \
#             src/tests/cptests/cptests.cc   ->  44+47+15+2+7+21 = 136
#   实跑数: make -C src check 2>&1 | grep -c 'PASSED'   ->  136
upstream_test_count_command: "make -C src check 2>&1 | grep -c 'PASSED'"
upstream_test_total: 136

# test_package 中自带的测试 (消费者视角验证)
# conanfile.py 的 test() 直跑 bin/dinit-shutdown --help，随后执行测试程序 test_dinit_shutdown.py
test_package_tests:
  - file: test_dinit_shutdown.py
    description: "5 个已安装可执行文件在 conanrun 环境中逐个实跑 --help：断言退出码 1（usage）、usage 首行回显自身 argv[0] 名称（证明编译期 SHUTDOWN_PREFIX=dinit- 与安装名一致）、默认动作为 power down、soft-reboot 选项与 --help 条目存在"
    command: "<pkg>/bin/dinit-{shutdown,halt,poweroff,reboot,soft-reboot} --help"
  - file: test_dinit_shutdown.py
    description: "未识别选项：dinit-shutdown -Z 退出码 1 且打印 Unrecognized command-line parameter: -Z"
    command: "<pkg>/bin/dinit-shutdown -Z"
  - file: test_dinit_shutdown.py
    description: "控制 socket 路径实跑（仅当 /var/run/dinitctl 无监听时）：dinit-shutdown 退出码 1 且打印 connect: No such file or directory；有监听则显式 SKIP，绝不发送关机命令"
    command: "<pkg>/bin/dinit-shutdown"
  - file: test_dinit_shutdown.py
    description: "OHOS 平台契约（鸿蒙特有测试，9 条断言）：产物为 64 位 LE AArch64 PIE；保留 .codesign 段与 .symtab（本平台 strip 后加载失败 rc=126，设备实测）；编译期控制 socket 为 /var/run/dinitctl（上游非 Linux 默认）；编译期命令前缀字面量 dinit-reboot/dinit-soft-reboot 存在（--shutdown-prefix=dinit-）"
    command: "python3 -c \"读 <pkg>/bin/dinit-shutdown 字节：ELF 头 + b'.codesign' + b'.symtab' + b'/var/run/dinitctl' + b'dinit-reboot'\""

test_package_test_count: 4
# 断言数 = 5 个二进制 ×7（PATH 可见性、退出码、首行回显自身名、banner 文本、默认动作、
#          soft-reboot 选项、--help 条目）= 35
#          + 未知选项 2（退出码、错误文本）+ 无守护进程 connect 2（退出码、错误文本）= 39
#          + OHOS 平台契约 9（64 位 LE / AArch64 / PIE / .codesign / .symtab /
#            控制 socket（NUL 锚定）/ 前缀字面量 NUL 锚定 ×2 / 4 个别名字节一致）= 48
assertion_count: 48
ohos_platform_assertions: 9
