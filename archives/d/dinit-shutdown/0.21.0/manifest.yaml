# 版本级 manifest
# 遵循 ARCHIVE-SPEC v3.0

version: "0.21.0"
software: "dinit-shutdown"
# published | built | failed | archived
status: built
build_system: custom
build_date: "2026-09-11"
conan_ref: "dinit-shutdown/0.21.0"

source:
  url: "https://github.com/davmac314/dinit/releases/download/v0.21.0/dinit-0.21.0.tar.xz"
  sha256: "9d8fad8e944a0b970cc4dacab2fefb9f481628600f91e9f6bab413e74dc6decf"
  tar_format: tar.xz

build:
  system: custom
  configure_options:
    - "--enable-shutdown"
    - "--shutdown-prefix=dinit-"
    - "--disable-strip"
  make_target: "make -C src SHUTDOWN_PREFIX=dinit- dinit-shutdown -j1"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

platform_adaptations:
  # 每一项都在 notes.md 有对应的错误依据与实测输出
  - "HMDFS 大小写不敏感：上游 release tarball 顶层同时含 BUILD 文档与 build/ 构建目录，Python tarfile 建 build/ 目录抛 FileExistsError，conan get() 在构建前即失败；source() 用 get(excludes=[...]) 排除 BUILD 文档（无构建规则读取该文件），其余成员逐字节原样解包，设备与 CI 输入树一致"
  - "configure 生成的 SHUTDOWN_PREFIX='dinit-' 带单引号，make 目标名随之带引号；改用命令行覆盖 SHUTDOWN_PREFIX=dinit- 保持目标名干净，mconfig.h 内的编译期前缀仍为 dinit-"
  - "HarmonyOS PC 的 uname 报告 HarmonyOS，configure 默认 BUILD_SHUTDOWN=no，须显式 --enable-shutdown"
  - "OHOS 工具链产物带 .codesign 段，须 --disable-strip，strip 后二进制在本平台加载失败（rc=126）"

upstream_tests:
  suite: "make -C src check（src/tests 6 个测试程序 + src/tests/cptests）"
  total: 136
  passed: 136
  failed: 0
  skipped: 0
  not_run: 0
  unit: "RUN_TEST 注册的测试用例（每个用例实跑打印一行 PASSED）"
  command: "make -C src check -j1"
  count_command: "make -C src check 2>&1 | grep -c 'PASSED'"
  count_breakdown: "tests 44 / proctests 47 / loadtests 15 / envtests 2 / iostreamtests 7 / cptests 21 = 136"

test_package:
  type: "可执行文件消费者测试（test_dinit_shutdown.py，5 个已安装二进制逐项实跑）"
  total: 4
  passed: 4
  assertion_count: 48
  ohos_platform_assertions: 9
  ohos_platform_assertions_note: "鸿蒙特有测试：64 位 LE AArch64 PIE、保留 .codesign 段、保留 .symtab（未 strip，本平台 strip 后 rc=126）、编译期控制 socket /var/run/dinitctl、编译期前缀字面量 dinit-reboot/dinit-soft-reboot（均按 NUL 结尾字面量精确锚定）、4 个别名与主体字节一致"

knowledge_gained:
  - "大小写不敏感文件系统（HMDFS）上，上游 tarball 顶层同时含 BUILD 文档与 build/ 目录时 Python tarfile 建目录抛 FileExistsError，conan get() 在构建前失败；可用 get(excludes=[...]) 在解包成员层排除文档文件，设备与 CI 行为一致"  # knowledge_ref: E578
  - "dinit configure 的 --shutdown-prefix 写入 mconfig 时带单引号，make 目标名含引号；命令行覆盖同名变量可保持目标名干净且 mconfig.h 前缀不变"  # knowledge_ref: E578

validation:
  device_native:
    status: passed
    command: "make -C src check -j1（沙箱 HOME=$TASK_DIR/test-home）"
    log: "reports/upstream-tests-native.log"
  conan:
    command: "python3 scripts/ohc-run.py conan-verify dinit-shutdown 0.21.0 --project-dir <worktree>"
    log: "reports/conan-verify-report.md, reports/conan-verify-supplement.md, reports/conan-create.log"
    note: "G4/L2/L4/L5 命中纯可执行包跳过路径，按流程 7.2 节人工补测并记录于 conan-verify-supplement.md；采信轮为清缓存后的干净构建（reports/conan-create.log 含 RUN: make 与 136 例上游测试）"
  w3:
    command: "python3 scripts/ohc-run.py finish dinit-shutdown 0.21.0 built --project-dir <worktree>"
    log: "reports/w3-local-ci.log, reports/w3-local-ci-notes.md"
    note: "W3 Step5 阻塞门禁通过（1/1，100%）：L0/L1/L4/L5 pass；L2 因 smoke 探针要求 rc=0 而上游 usage 退出码为 1 被记 skip，已按流程 7.2 节人工补测（见 conan-verify-supplement.md 的 L2 节与 cli-behaviour.txt）"
