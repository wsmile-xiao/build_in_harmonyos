# test_package/MANIFEST.yml — dominate 2.9.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: dominate/2.9.1
homepage: "https://github.com/Knio/dominate"

# 上游测试套件：tests/ 目录 pytest 套件（dominate 零依赖，可本地运行）
upstream_check_command: "pytest tests/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: tests/
    source: dominate-2.9.1/tests/*.py
    description: "pytest 套件：本地实测 65/65（100%），零失败"
    command: "pytest tests/"

# test_package 消费者测试（R34 真实 API：import 打包的 dominate + 生成 HTML）
test_package_tests:
  - file: test_dominate.py
    description: "Imports packaged dominate and builds a real HTML document via tags, asserting rendered output"
    command: "python3 test_dominate.py"

# 断言总数：1（HTML 渲染结果校验）
assertion_count: 1
