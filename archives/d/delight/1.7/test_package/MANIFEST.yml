package: delight/1.7
homepage: "https://savannah.nongnu.org/projects/delight"

# delight 1.7 has no upstream test suite.  The GNU ELPA release tarball
# contains only delight.el, delight-pkg.el and COPYING, and the upstream
# Savannah repository contains only delight.el and COPYING: there is no
# Makefile, no test directory, no ERT file and no CI configuration.
upstream_check_command: "emacs -Q --batch -f batch-byte-compile delight.el; emacs -Q --batch -l delight.elc --eval \"(unless (featurep 'delight) (error ...))\""
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_result: "NO_UPSTREAM_TESTS"
upstream_tests_passed: 0
upstream_tests_total: 0
upstream_test_notes: "No upstream-authored tests exist. Recipe build() runs Emacs batch byte-compilation of delight.el and a batch load of the compiled delight.elc as the substitute upstream validation, following the ol-notmuch and web-mode Emacs Lisp recipes."
upstream_tests: []

test_package_tests:
  - file: test_delight.sh
    description: "Consumer validation: checks DELIGHT_LISPDIR, packaged delight.el/delight.elc, EMACSLOADPATH, then runs the Emacs batch functional test"
    command: "sh test_delight.sh"
  - file: test_delight.el
    description: "Requires delight from the packaged load path and verifies the feature, public entry points, format-mode-line advice installation, minor-mode lighter and mode-line-mode-menu rewrite, major-mode spec/hook registration, delighted mode-name wrapping against the captured original, and the inhibit semantics of the around-advice"
    command: "emacs -Q --batch -L $DELIGHT_LISPDIR -l test_delight.el"

assertion_count: 20
