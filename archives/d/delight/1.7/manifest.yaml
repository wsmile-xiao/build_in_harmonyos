software: delight
version: "1.7"
status: built
build_date: "2026-09-10"

source:
  url: "https://elpa.gnu.org/packages/delight-1.7.tar"
  sha256: "92728eb388daf445ff6f73b152e2372f513b86ac1fd542bc6530e91341cefac8"
  tar_format: tar

build:
  system: elisp
  configure_options:
    - "emacs -Q --batch -f batch-byte-compile delight.el"
    - "emacs -Q --batch -l delight.elc --eval \"(unless (featurep 'delight) (error ...))\""
  dependencies:
    - "emacs/29.1"
  cc: N/A
  cxx: N/A

patches_applied: []

artifacts:
  lisp:
    - "share/emacs/site-lisp/delight-1.7/delight.el"
    - "share/emacs/site-lisp/delight-1.7/delight.elc"
  licenses:
    - "licenses/COPYING"

validation:
  upstream_tests: "NO_UPSTREAM_TESTS"
  upstream_test_discovery:
    - "Release tarball delight-1.7.tar contains only delight.el, delight-pkg.el and COPYING (no Makefile, no test directory, no ERT files, no CI configuration)."
    - "Upstream Savannah repository tree contains only COPYING and delight.el."
    - "GNU ELPA package page lists no test suite or CI."
  upstream_substitute_validation:
    - "Emacs batch byte-compile delight.el (build())"
    - "Emacs batch load delight.elc and assert the delight feature (build())"
  test_package: "sh test_delight.sh -> emacs -Q --batch -L $DELIGHT_LISPDIR -l test_delight.el"
  ci_entrypoint: "ci/conan/build_and_test.sh archives/d/delight/1.7 (profile ci/conan/profiles/ohos-aarch64)"

knowledge_gained:
  - "delight 1.7 is a single-file GNU ELPA package; its Package-Requires (cl-lib 0.5, nadvice 0.3) are Emacs built-ins, so the Conan recipe only needs emacs/29.1."
  - "ELPA release tarballs carry no build system or test suite; batch byte-compilation plus a batch load is the upstream-equivalent validation, matching the ol-notmuch and web-mode recipes."
  - "The package is share-only (no bin/lib/include); test_package must exercise the Lisp API through DELIGHT_LISPDIR / EMACSLOADPATH."
