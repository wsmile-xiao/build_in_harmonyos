software: disk-filltest
display: "disk-filltest"
description: "Simple program to detect bad disks by filling them with random data"
category: system
homepage: "https://panthema.net/2013/disk-filltest/"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Single ANSI C file; compiles unmodified with the OHOS clang 15 / musl toolchain using the upstream CFLAGS (-O3 -W -Wall -ansi)."
    - "No Conan package dependencies: only libc and POSIX headers are included."
    - "Artifacts are installed by the recipe instead of `make install`, which needs GNU install, gzip and hard-codes /usr/local paths."
    - "Functional tests always bound the fill with -S 1 -f 1 inside a scratch directory; the tool is never run unbounded on a shared filesystem."
  common_dependencies: []

versions:
  "0.8.2":
    status: built
    build_date: "2026-09-19"
    conan_ref: "disk-filltest/0.8.2"
