knowledge_gained:
  - "上游 0.8.2 是单文件 C 程序，无 configure、无测试目标；.travis.yml 仅执行 make。"
  - "OHOS clang 15 + musl 下上游 CFLAGS（-O3 -W -Wall -ansi）零修改即可编译，无告警。"
  - "GitHub tag 归档与作者站点 tarball 内部 6 个文件哈希完全一致，可互为官方源回退。"
  - "设备侧 github.com 不可达（codeload.github.com 可达）、panthema.net 可达；配方按官方多源顺序回退下载。"
  - "disk-filltest 会写满目标路径：功能测试统一加 -S 1 -f 1 边界并在临时目录内运行，跑完立即删除。"
