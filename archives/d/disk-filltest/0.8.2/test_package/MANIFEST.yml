package: disk-filltest/0.8.2
homepage: https://panthema.net/2013/disk-filltest/

# Upstream ships no test suite: the release archive contains only
# disk-filltest.c, Makefile, README, COPYING, disk-filltest.1 and .travis.yml.
# The Makefile defines the targets all / disk-filltest / disk-filltest.1.gz /
# install / install-bin / install-man / clean — there is no check target — and
# .travis.yml runs only "make". Upstream test count is therefore 0, and there is
# no upstream check command to record.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# Adaptation regression tests added by this package (upstream has none).
test_package_tests:
  - file: test_disk_filltest.py
    description: "Bounded (-S 1 -f 1) CLI regression: version, usage, fill+verify+unlink, kept file, read-only re-verify, corruption detection, unlink-immediate mode"
    command: "python3 test_disk_filltest.py <package>/bin/disk-filltest"

assertion_count: 10
