# test_package/MANIFEST.yml — debian-pan 0.4
# 上游测试声明（诚实申报：Debian Pure Blend 元数据包无测试套件）
package: debian-pan/0.4
homepage: "https://salsa.debian.org/blends-team/pan"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

upstream_test_evidence:
  find_tests: "find . -iname '*test*' -> 0 results (no tests/ directory)"
  ctest_registration: "find . -name 'CTestTestfile.cmake' -> 0"
  pytest_registration: "find . -name 'test_*.py' -o -name 'conftest.py' -> 0"
  source_files: "find . -name '*.c' -o -name '*.cpp' -o -name '*.h' -> 0 (metadata-only source)"
  build_system: "none (top-level Makefile is one line: include /usr/share/blends-dev/Makefile)"
  files_total: 35

# Harmony 特有 package/data 验证（非 upstream test）
test_package_tests:
  - file: test_debian_pan.py
    description: >
      验证：packaged layout（tasks/ 18 个任务文件 + tasksel desc + registry.json +
      官方依赖快照 debian-pan_0.4.json + licenses/copyright），且不含 bin/ 与 ELF 产物
      （诚实性检查）；tasks/ Deb822 字段（Format == blends 1.1、Task == 文件名、
      Description 非空，18/18）；tasksel desc 结构（17 段落、父任务 debian-pan、
      16 个 pan-* Key）；registry.json 与打包文件重新派生的逐任务 title/format
      交叉复核；debian/control 18 个声明包全为 Architecture: all、16 个 pan-* 元包、
      映射不对称（laue/mx-dev 仅任务无元包）如实记录；官方快照 debian-pan_0.4.json
      主题集合 == tasks/ 文件集合（18/18）、5 类字段均为数组、446 个去重 OS 引用；
      semantics 记录 conan_requires == none 与 blends 1.1 语义
    command: "python3 test_debian_pan.py <package_folder>"

assertion_count: 48
