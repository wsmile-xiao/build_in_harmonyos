# conandata.yml — debian-pan 0.4
# 官方 Debian-native 源包（Debian Pure Blend, Format 3.0 (native)）。
# 源：salsa.debian.org 官方 Git 归档（R39 合规：https 官方源，非 Debian 下游重打包 URL）。
# 权威仓库: salsa.debian.org/blends-team/pan （tag debian/0.4）
#
# 注意：本文件不写裸仓库 URL（salsa.debian.org/blends-team/pan），因为它会是
# sources.url 的前缀——CI 预下载按 URL 子串改写为 file:// 时会截断真 URL
# （build_and_test.sh 的 predl 改写是先下载每个匹配到的 URL 再做内容替换）。
#
# sha256 核验方法（本地实测，两次独立下载一致）：
#   curl -fsSL -o pan.tar.gz \
#     "https://salsa.debian.org/blends-team/pan/-/archive/debian/0.4/pan-debian-0.4.tar.gz"
#   sha256sum pan.tar.gz   # -> 2f4e8f6804fe45fadcec53aeda3fd7c2d14e52080081608c4ebd51d94517e9ac
# 归档内文件清单（35 文件）与官方 pool 的 debian-pan_0.4.tar.xz 逐项 diff 一致。

sources:
  url: "https://salsa.debian.org/blends-team/pan/-/archive/debian/0.4/pan-debian-0.4.tar.gz"
  sha256: "2f4e8f6804fe45fadcec53aeda3fd7c2d14e52080081608c4ebd51d94517e9ac"

# 本包无补丁：纯打包元数据（Deb822 任务文件 + tasksel desc + 元包声明），
# 无 C/C++ 源码、无构建系统、无平台相关代码需要改动。
patches: {}
