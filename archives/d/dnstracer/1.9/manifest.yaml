software: dnstracer
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9"

# 构建系统类型
build_system: autotools

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://deb.debian.org/debian/pool/main/d/dnstracer/dnstracer_1.9.orig.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-dnstracer.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "musl libc 不提供 glibc 的 _res 结构，无法自动检测 DNS 服务器"
  - "需要用户使用 -s 选项手动指定 DNS 服务器"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

testing:
  issues_fixed:
    - id: "query_type_option_fail"
      fixed_date: "2026-05-29"
      fix_description: "使用 strcasecmp 替代 strcmp，支持大小写不敏感的查询类型"
      verification: "测试 MX、NS、CNAME 等所有类型，大写和小写都正常工作"
    - id: "dns_server_auto_detect_disabled"
      fixed_date: "2026-05-29"
      fix_description: "实现手动读取 /etc/resolv.conf 的函数 get_dns_server_from_resolv_conf()"
      verification: "测试不指定服务器时自动使用 114.114.114.114"

# ============================================================
# 已知问题
# ============================================================

known_issues:
  - id: "query_type_option_fail"
    severity: "medium"
    description: "查询类型选项（-q）无法正常工作"
    impact: "用户无法查询 MX、NS、CNAME 等其他类型的 DNS 记录，仅支持默认的 A 记录"
    workaround: "使用其他工具（如 dig 或 nslookup）查询其他类型记录"
    status: "pending_fix"

  - id: "dns_server_auto_detect_disabled"
    severity: "low"
    description: "无法自动检测系统 DNS 服务器"
    impact: "默认使用 127.0.0.1，本地没有 DNS 服务器时会超时"
    workaround: "使用 -s 选项指定公共 DNS 服务器（如 8.8.8.8 或 1.1.1.1）"
    status: "platform_limitation"

# ============================================================
# 测试信息
# ============================================================

testing:
  test_date: "2026-05-29"
  test_coverage: "82%"
  test_results:
    passed: 9
    failed: 2
    total: 11
  functional_status: "partial"
  core_function_working: true
  report_file: "reports/test-report.md"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/dnstracer-1.9.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/dnstracer-1.9.work
  source_orig_hash: 6ac0b5a3d3b640dd
  source_work_hash: 07a48888ab81fccd
  generated_at: '2026-05-29T11:06:37'
  patches_count: 1

patch_classification:
