software: digup
display: "digup"
description: "校验并更新 md5sum/sha1sum/sha256sum/sha512sum 摘要文件的命令行工具"
category: utility
homepage: "https://panthema.net/2009/digup/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "设备 uname -s 返回 HarmonyOS：2020-01-01 版 config.guess 无该分支，需补 HarmonyOS 识别并输出 aarch64-unknown-linux-ohos (E007)"
    - "同版 config.sub 的 ambiguous 三元组列表与 OS 列表都缺 linux-ohos，需补 linux-ohos* (E122)"
    - "HMDFS 上 configure/config.status 的 umask 077 临时目录不可写，需改 umask 022 (E011/E114)"
    - "本仓库 CI 用同一 profile 传给 -pr:h/-pr:b，Conan 不注入 --build/--host，configure 用补丁后的 config.guess 自行判定原生三元组（build == host）；异构 profile 下保留注入，由补丁 0002 接受 Conan 的 aarch64-linux-ohos 形态"
  common_dependencies: []

versions:
  "0.6.57":
    status: built
    build_date: "2026-09-11"
    conan_ref: "digup/0.6.57"
