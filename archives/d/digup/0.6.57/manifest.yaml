version: "0.6.57"
software: "digup"
status: built
build_date: "2026-09-11"
build_system: autotools

source:
  url: "https://panthema.net/2009/digup/digup-0.6.57.tar.gz"
  sha256: "ef132e277277fc28091e714980db55021272fa5c3a9134968cdeeef28305186e"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "native build: configure resolves build == host == aarch64-unknown-linux-ohos through the patched config.guess"
    - "generate() 不改写 configure_args：同构 profile 下 Conan 不注入 --build/--host（cross_building() 为 False），异构时保留注入并由补丁 0002 接受 aarch64-linux-ohos 形态"
    - "make -j1"
    - "make check -j1 (upstream automake test suite)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-guess-harmonyos.patch"
  - "0002-config-sub-ohos.patch"
  - "0003-configure-umask-hmdfs.patch"

knowledge_gained:
  - "config.guess 2020-01-01 版没有 HarmonyOS 分支：设备 uname -s 返回 HarmonyOS 时 configure 直接报 cannot guess build type；补丁 0001 在主 case 内新增 *:HarmonyOS:*:* 分支并直接输出 aarch64-unknown-linux-ohos（不依赖 CC 探测 因此 HMDFS 上也可用）"  # knowledge_ref: E007
  - "该版 config.sub 的两个列表都不含 linux-ohos：ambiguous 三元组列表（nto-qnx* | linux-gnu* | linux-android* ...）与 OS 列表都需加入 linux-ohos*；只补 config.guess 时 configure 并不报错 而是把三元组静默规范化成 aarch64-unknown-linux-gnu-ohos（host_os 变成 linux-gnu-ohos） 因此自检命令 config.sub \"$(config.guess)\" 必须原样返回"  # knowledge_ref: E122; knowledge_ref: DRAFT-autotools-config-sub-silent-ohos-triplet（静默形态的增量，本 PR 携带）
  - "HMDFS 上 configure 生成的 config.status 用 umask 077 + mktemp 建临时目录 导致 subs1.awk Permission denied；补丁 0003 在 configure 内把 umask 077 改成 022 一次性修好 configure 与它生成的 config.status"  # knowledge_ref: E011
  - "Conan 是否给 autotools configure 注入 --host/--build 取决于 cross_building()：本仓库 CI 用同一 profile 传给 -pr:h/-pr:b 因此不注入 configure 会自行调用 config.guess（trip-probe 配方实测 update_configure_args 前后 configure_args 完全相同 剪枝在同构下是空操作）；异构 profile 才出现三元组 此时剪枝会让 configure 在构建机上跑 config.guess 并静默选错架构 故本包不做剪枝 改由补丁 0002 让 config.sub 同时接受 Conan 的 aarch64-linux-ohos 形态"  # knowledge_ref: DRAFT-autotools-config-sub-silent-ohos-triplet（本 PR 携带）

validation:
  upstream_tests:
    command: "conan create archives/d/digup/0.6.57 -pr:h=$HOME/ws/build_in_harmonyos/ci/conan/profiles/ohos-aarch64 -pr:b=$HOME/ws/build_in_harmonyos/ci/conan/profiles/ohos-aarch64 --build=digup/*  (build() 内 make -j1; make check -j1)"
    evidence: "reports/conan-create.log 中 RUN: make check -j1 后的 PASS: test_rbtree / test_digest / test_digup 与 # TOTAL: 3 / # PASS:  3"
  test_package:
    command: "bash archives/d/digup/0.6.57/test_package/test.sh（由 conan create 的 test() 在 conanrun 环境执行）"
    evidence: "reports/conan-create.log 末尾 HMBS_TEST_SUMMARY discovered=21 passed=21 failed=0 skipped=0"

test_results:
  type: automake
  total: 3
  passed: 3
  failed: 0
  skipped: 0
  not_run: 0
  unit: "automake TESTS 条目（测试程序），取数命令 make check 后读 src/test-suite.log 的 '# TOTAL: 3'"
  upstream_tests:
    total: 3
    passed: 3
    failed: 0
    skipped: 0
    note: "test_rbtree test_digest test_digup 三条 automake 测试程序全部 PASS"
  test_package:
    total: 21
    passed: 21
    failed: 0
    skipped: 0
    note: "以已安装 bin/digup 真实驱动 CLI 的 21 项断言（版本、四种摘要类型、摘要记录逐字节比对、校验退出码、篡改检出、用法错误）"
