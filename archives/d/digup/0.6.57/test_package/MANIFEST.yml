# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: digup/0.6.57
homepage: "https://panthema.net/2009/digup/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件（automake TESTS = src/Makefile.am if BUILDTESTS）
# 统计单位 = automake 测试程序（每个测试程序一个 PASS/FAIL 条目）
# 取数命令: make check 后在 src/test-suite.log 中读取 "# TOTAL: 3" / "# PASS:  3"
upstream_tests:
  - name: "test_rbtree"
    file: src/test_rbtree.c
    source: digup-0.6.57/src/test_rbtree.c
    description: "红黑树实现测试（test_strings / test_integers / test_integers_multi N=10..99），以 -DRBTREE_VERIFY 编译，每个操作后校验树不变量"
    command: "./src/test_rbtree"
  - name: "test_digest"
    file: src/test_digest.c
    source: digup-0.6.57/src/test_digest.c
    description: "MD5/SHA1/SHA256/SHA512/CRC32 预置测试向量的流式与 process_buffer 双路径比对"
    command: "./src/test_digest"
  - name: "test_digup"
    file: src/test_digup.c
    source: digup-0.6.57/src/test_digup.c
    description: "digest 文件文件名转义/反转义（unescape_filename / needescape_filename）用例"
    command: "./src/test_digup"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "以已安装的 bin/digup 真实驱动 CLI：版本自报、四种摘要类型各自生成摘要文件、摘要记录逐字节比对、二次校验退出码 0、篡改内容后检出 CHANGED、未知选项退出码 255"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 21
