# 版本级 manifest — debugbreak 1.0
# 遵循 ARCHIVE-SPEC

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 软件名
software: debugbreak

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag）
  url: "https://github.com/scottt/debugbreak/archive/refs/tags/v1.0.tar.gz"

  # 源码校验和（实测官方 refs/tags/v1.0.tar.gz）
  sha256: "62089680cc1cd0857519e2865b274ed7534bfa7ddfce19d72ffee41d4921ae2f"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（header-only，无 configure）
  configure_options: []

  # 编译依赖列表（header-only，无三方依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码修改，无补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "debugbreak 为 header-only 库（单头文件），conan recipe 用 package_type=header-library，无需 configure/make install"
  - "OHOS aarch64 上 debugbreak.h 走陷阱指令实现 DEBUG_BREAK_USE_TRAP_INSTRUCTION（.inst 0xd4200000, brk #0），进程内 SIGTRAP 处理器可验证，无需 gdb"
  - "HarmonyOS PC 限制 ptrace：gdb 无法跟踪子进程（upstream .gdb 测试驱动在设备上不可运行，属真实平台限制，可用进程内信号验证等价替代）"
  - "本环境 gdb 16.3 无 Python 支持，debugbreak-gdb.py 扩展不可加载（工具链构建配置，非库缺陷）"
  - "lang-preflight 工具边界：GNUmakefile 不被识别为 make 构建系统（仅识别恰好名为 Makefile 的文件），且 gdb 辅助脚本 .py 被计入主体统计 → 60% 误判 mixed；按协议 D.4 边界规则（辅助脚本不算主体、C/C++ 兼容族）应判 cpp"