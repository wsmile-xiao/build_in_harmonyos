# test_package/MANIFEST.yml
# 上游官方测试声明文件
# debugbreak 1.0 是 header-only 库；上游 GNUmakefile 无 configure/make check 目标，
# 测试程序由 make 构建后经仓库自带 .gdb 脚本在 gdb 下驱动，验证 debug_break()
# 命中调试器断点。

package: debugbreak/1.0
homepage: "https://github.com/scottt/debugbreak"

# 上游测试命令 (GNUmakefile 构建全部测试程序)
upstream_check_command: "make"

# conanfile.py build() 中已集成上游测试编译 (4 个测试程序 C/C++)
upstream_test_in_build: true
upstream_test_command: "build(): clang/clang++ -Os -Wall -I. 编译 test/break.c test/break-c++.cc test/fib.c test/trap.c"

# 上游实际运行的测试程序 (仓库自带 .gdb 驱动脚本)
upstream_tests:
  - file: test/break.c
    source: debugbreak-1.0/test/break.c
    description: "C 程序调用 debug_break()，gdb 下应命中断点 (break.gdb)"
    command: "gdb -batch -x test/break.gdb"
  - file: test/break-c++.cc
    source: debugbreak-1.0/test/break-c++.cc
    description: "C++ 程序调用 debug_break()，gdb python 扩展驱动 (test-debugbreak.gdb)"
    command: "gdb -batch -x test/test-debugbreak.gdb"
  - file: test/fib.c
    source: debugbreak-1.0/test/fib.c
    description: "递归 fib，r==89 时调用 debug_break() (fib.gdb)"
    command: "gdb -batch -x test/fib.gdb"
  - file: test/trap.c
    source: debugbreak-1.0/test/trap.c
    description: "__builtin_trap() 信号测试 (trap.gdb, handle SIGILL stop nopass)"
    command: "gdb -batch -x test/trap.gdb"

# test_package 自带的消费者测试
test_package_tests:
  - file: test.c
    description: "消费者安装 SIGTRAP 处理器后调用 debug_break()，验证 aarch64 陷阱指令实际触发"
    command: "ctest -R test_debugbreak"
  - file: test_ohos.c
    description: "鸿蒙专项测试：编译期断言 OHOS aarch64 平台选择陷阱指令实现 + 运行期进程内验证 brk #0 触发 SIGTRAP（无需 ptrace/gdb）"
    command: "ctest -R test_ohos"

# 测试断言总数 (test.c 2 处 + test_ohos.c 编译期 1 处 + 运行期 2 处)
assertion_count: 5
