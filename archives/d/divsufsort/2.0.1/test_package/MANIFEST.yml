package: divsufsort/2.0.1
homepage: "https://github.com/y-256/libdivsufsort"

# ── Upstream test inventory ──
# divsufsort 2.0.1 has NO formal ctest/enable_testing suite.
# Upstream formal test count: 0
upstream_formal_tests: 0

# Upstream ships 5 example programs that exercise the core API.
# These are functional verification programs, NOT formal tests —
# they are NOT counted in upstream_formal_tests.
upstream_examples: 5

# Upstream check command (formal tests only; none exist here).
upstream_check_command: "(none — upstream has no ctest/make check)"

# Upstream examples are compiled AND executed in conanfile.py build()
# via BUILD_EXAMPLES=ON. Execution asserts on real program output
# (BWT round-trip file compare, sasearch result == [1,3,11]).
upstream_examples_in_build: true
upstream_examples_result: "5/5 PASS (executed on OHOS)"

# Upstream example targets (verification programs, not ctest)
upstream_examples_list:
  - file: examples/suftest.c
    source: libdivsufsort-2.0.1/examples/suftest.c
    description: "Suffix array construction + sufcheck on file input"
    command: "./suftest FILE"
    ohos_result: "PASS (exit 0)"
  - file: examples/bwt.c
    source: libdivsufsort-2.0.1/examples/bwt.c
    description: "Burrows-Wheeler Transform (divbwt) on file input"
    command: "./bwt INFILE OUTFILE"
    ohos_result: "PASS (framed BWT file produced)"
  - file: examples/unbwt.c
    source: libdivsufsort-2.0.1/examples/unbwt.c
    description: "Inverse Burrows-Wheeler Transform (inverse_bw_transform)"
    command: "./unbwt INFILE OUTFILE"
    ohos_result: "PASS (output byte-identical to original input)"
  - file: examples/mksary.c
    source: libdivsufsort-2.0.1/examples/mksary.c
    description: "Suffix array builder utility"
    command: "./mksary FILE OUTFILE"
    ohos_result: "PASS (non-empty binary .sa file produced)"
  - file: examples/sasearch.c
    source: libdivsufsort-2.0.1/examples/sasearch.c
    description: "Suffix-array binary search (sa_search)"
    command: "./sasearch PATTERN FILE SAFILE"
    ohos_result: "PASS (sa_search('ana') == [1,3,11] sorted)"

# test_package consumer verification (independent of upstream examples)
test_package_tests:
  - file: test.c
    description: "32-bit divsufsort/sufcheck/divbwt/inverse_bw_transform plus 64-bit divsufsort64/sufcheck64 on 'banana'; verifies SA=[5,3,1,0,4,2], BWT='annbaa', round-trip recovery, and both packaged components"
    command: "./test_divsufsort"

# Consumer remains one integration test; 64-bit component coverage added.
# Internal check count updated after adding divsufsort64/sufcheck64 verification.
assertion_count: 17
