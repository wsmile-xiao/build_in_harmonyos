# 版本级 manifest
# 文件位置: archives/d/divsufsort/2.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.1"

# 软件名
software: "divsufsort"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/y-256/libdivsufsort/archive/refs/tags/2.0.1.tar.gz"

  # 源码校验和
  sha256: "9164cb6044dcb6e430555721e3318d5a8f38871c2da9fd9256665746a69351e0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "BUILD_EXAMPLES=ON"
    - "BUILD_DIVSUFSORT64=ON"
    - "USE_OPENMP=OFF"
    - "WITH_LFS=ON"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  # divsufsort 自包含，静态构建仅链接 libm，无外部依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无需补丁：上游 CMake 原生构建在 OHOS armv8 直接通过
# （唯一注意点：cmake_minimum_required(VERSION 2.4) 需
# CMAKE_POLICY_VERSION_MINIMUM=3.5 以兼容 CMake 4+，见 conanfile.py）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "divsufsort/2.0.1 与 libdivsufsort/2.0.1 是同一份上游源码（y-256/libdivsufsort tag 2.0.1），包名按积分赛任务注册为 divsufsort"
  - "cmake_minimum_required(VERSION 2.4) 在 CMake 4+ 下移除兼容支持，必须用 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 传 cache 变量；不能放 toolchain file（cmake_minimum_required 在 toolchain 加载前求值）"
  - "上游无 ctest/enable_testing 测试套件，以 5 个 example 程序（suftest/bwt/unbwt/mksary/sasearch）在 build() 中实跑作为功能验证：banana_bandana 输入下 BWT 往返字节一致、sa_search('ana')==[1,3,11]"
  - "双组件打包：divsufsort (saidx_t=int32) + divsufsort64 (saidx64_t=int64)，静态构建下 system_libs 需补 m"
  - "package() 中移除 lib/pkgconfig 与 share 目录，避免生成物混入"
