# 适配后新增的**完整消费者用例**（test_package/consumer_keyring.py）
# 消费方式 = 真实消费方用法：把安装后的 share/keyrings 当"可信密钥库"，
# ① 按同目录 sha512sums.txt 核验交付完整性（等同 apt 校 Release 校验和）；
# ② 按 RFC 4880 解析 OpenPGP 数据流（报文头/长度域/子包），算 v4 指纹建索引；
# ③ 按签名者 keyid / 指纹做查找（apt Signed-By 语义），未受信 keyid 必须查不到；
# ④ 顺带消费每个密钥的强度（首段 MPI 位数）与自签名绑定（UID 必须被自身签名绑定）。
# 结论由真实产物的字节决定，不是断言模板：4 条密钥环 / 1202 把公钥全部可唯一定位。
consumer_case:
  script: "test_package/consumer_keyring.py"
  framework: "python script (端到端消费安装后的 Prefix)"
