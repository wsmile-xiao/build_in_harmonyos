software: dictconv
display: "dictconv"
description: "Dictionary file format converter (Babylon/Freedict/Sdictionary/StarDict)"
category: utility
homepage: "http://dictconv.sourceforge.net/"
license: GPL-2.0-or-later
build_system: cmake
compile_date: "2026-09-10"

ohos_adaptation:
  key_points:
    - "上游 autotools 不可用：2006 年 config.guess 用 uname -p 判定 CPU，本平台返回 unknown，./configure rc=1；aclocal.m4 的 AM_PATH_XML2 用 AC_TRY_RUN，交叉编译下不可运行 → 改走上游自带的 CMake 路径"
    - "CMake 4.x 需补 cmake_minimum_required(VERSION 3.5)（CMP0000 硬错误），CMAKE_POLICY_VERSION_MINIMUM 无法兜底"
    - "musl 不再隐式提供 sys/types.h：7 处 legacy u_int32_t/uint typedef 需显式 #include <sys/types.h>"
    - "上游 src/CMakeLists.txt 的 FIND_PATH/FIND_LIBRARY 写死 /usr/local、/usr 路径 → 配方 generate() 注入 XML2_*/ZLIB_* cache 变量，不改上游脚本"
    - "getopt → getopt_long，支持 --help/--version/--output 长选项（CI 冒烟测试依赖 --version）"
    - "上游无测试套件：消费者测试由 test_package/test.sh 提供（8 用例），并在归档 notes/manifest 中保留上游测试清点证据"
  common_dependencies:
    - libxml2
    - zlib

versions:
  "0.2":
    status: published
    build_date: "2026-09-10"
