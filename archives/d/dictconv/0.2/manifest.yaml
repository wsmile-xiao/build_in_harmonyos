# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 2006 年 config.guess 无法识别 HarmonyOS：`uname -p` 返回 unknown 导致 configure 直接失败（rc=1）；aclocal.m4 的 AM_PATH_XML2 用 AC_TRY_RUN 探测 libxml2，交叉编译下不可运行 —— 必须改走上游自带的 CMake 路径 (ref: E568)"
  - "CMake 4.x 拒绝没有 cmake_minimum_required 的工程（CMP0000 在 add_subdirectory/install 场景下直接报错），而 CMAKE_POLICY_VERSION_MINIMUM=3.5 无法兜底（实测仍失败），只能在顶层 CMakeLists.txt 补一行 cmake_minimum_required(VERSION 3.5) (ref: E567；方案关联 E321 cache_variables 路线)"
  - "上游 src/CMakeLists.txt 用 FIND_PATH(XML2_INCLUDE_DIR)/FIND_LIBRARY(XML2_LIBRARY) 在 /usr/local、/usr 下找 libxml2，交叉编译时找不到；FIND_* 见到同名 cache 变量即直接采用，因此在配方 generate() 里按 self.dependencies 的 cpp_info 注入 4 个缓存变量即可，无需改上游脚本 (ref: E569)"
  - "musl 头文件不再顺带引入 sys/types.h：babylon.h 等 7 处头文件使用的 legacy u_int32_t/uint typedef 报 'No such file or directory (bits/alltypes.h)'，需显式 #include <sys/types.h>（全局 -include sys/types.h 也可，但会污染全部翻译单元） (ref: E194)"
  - "dictconv 只解析 -h/-o/-q/-v 短选项，--version/--help 落到 getopt 的未知长选项分支直接 usage：补丁改用 getopt_long 映射 --help/--version/--output（CI 冒烟测试依赖 --version） (ref: E570)"
  - "zlib/1.3.1.1 为静态库（libz.a）直接链入；libxml2 为共享库，OHOS 系统目录无同名库（/lib64 只有 libzone_util.z.so、libzstd.z.so），运行时 libxml2.so.16 由 conanrun 提供，R26 系统同名库隔离规则不适用 (ref: E541)"

