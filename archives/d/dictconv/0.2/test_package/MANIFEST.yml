# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dictconv/0.2
homepage: "http://dictconv.sourceforge.net/"

# 上游测试存在性审计
upstream_tests_exist: false
upstream_test_audit: |
  审计结论：dictconv 0.2（2007-10 发布）没有任何自动化测试套件。
  1. autotools 侧：configure.in 为老式写法，顶层 Makefile.am / src/Makefile.am
     均未注册 TESTS、check_PROGRAMS 或 check-local 目标 —— `make check` 无测试可跑。
  2. CMake 侧：顶层 CMakeLists.txt 与 src/CMakeLists.txt 均无 enable_testing()、
     add_test() 或 ctest 相关配置 —— `ctest` 无测试可跑。
  3. 源码树无 test/、tests/ 目录，也没有任何测试源文件（全树 grep TESTS /
     check_PROGRAMS / add_test / ctest 零命中）。
  4. 上游测试覆盖率以“无上游测试”计；消费者测试全部由 test_package/test.sh 提供。

# 上游测试命令（无测试套件，留空）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试用例：无
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，夹具在脚本内生成）
test_package_tests:
  - file: test.sh
    description: >-
      消费者测试 8 例：--version；--help 用法清单；FreeDict(.tei)→PlainText(.dic)
      字节级比对；→StarDict(.ifo/.idx/.dict) 字节级比对（含 --output 长选项）；
      →DICT(.index/.dict) 字节级比对；非法输出扩展名错误路径；输入文件不存在错误路径；
      HarmonyOS/aarch64 消费者运行时 ELF 架构与实际执行验证
    command: "bash test.sh"
    executable: true

# 测试用例总数（8 个独立消费者用例，见 test.sh 中 [n/8] 标记）
assertion_count: 8
