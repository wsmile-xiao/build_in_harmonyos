# conandata.yml — dictconv 0.2
#
# 源码：官方 SourceForge 站点已下线（dictconv.sourceforge.net 仅剩归档页），
# 按 R39 采用权威镜像 Debian pool 的 orig tarball（与 ltrace 0.7.3 先例同源）。
sources:
  "0.2":
    url: "https://ftp.debian.org/debian/pool/main/d/dictconv/dictconv_0.2.orig.tar.gz"
    sha256: "b3fa22073675973c06db533604aa81272178203a6ee8cb2f86974a7c605ca239"

patches:
  "0.2":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Add cmake_minimum_required(VERSION 3.5): CMake 4.x aborts on the 2007 CMakeLists (CMP0000) and CMAKE_POLICY_VERSION_MINIMUM cannot rescue it"
      patch_type: "portability"
    - patch_file: "patches/0002-src-babylon.h.patch"
      patch_description: "Include sys/types.h for the legacy u_int32_t typedef and uint usage (musl headers do not pull it in anymore)"
      patch_type: "portability"
    - patch_file: "patches/0003-src-dictconv.cpp.patch"
      patch_description: "Use getopt_long so GNU-style long options --help/--version/--output work (CI smoke test needs --version)"
      patch_type: "portability"
    - patch_file: "patches/0004-src-dictdbuilder.h.patch"
      patch_description: "Include sys/types.h for the legacy uint typedef"
      patch_type: "portability"
    - patch_file: "patches/0005-src-plaintextdictbuilder.h.patch"
      patch_description: "Include sys/types.h for the legacy uint typedef"
      patch_type: "portability"
    - patch_file: "patches/0006-src-sdict.h.patch"
      patch_description: "Include sys/types.h for the legacy uint typedef"
      patch_type: "portability"
    - patch_file: "patches/0007-src-stardict.cpp.patch"
      patch_description: "Include sys/types.h before stardict.h (direct consumer of the legacy typedefs)"
      patch_type: "portability"
    - patch_file: "patches/0008-src-stardictbuilder.h.patch"
      patch_description: "Include sys/types.h for the legacy uint typedef"
      patch_type: "portability"
    - patch_file: "patches/0009-src-stardictreader.h.patch"
      patch_description: "Include sys/types.h before including stardict.h (stardict.h itself carries latin-1 comment bytes, kept untouched)"
      patch_type: "portability"
