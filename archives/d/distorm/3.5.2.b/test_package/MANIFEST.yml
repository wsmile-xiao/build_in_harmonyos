# test_package/MANIFEST.yml — distorm 3.5.2.b 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 上游 C 库侧无可接入测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）

package: distorm/3.5.2.b
homepage: "https://github.com/gdabah/distorm"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "distorm-3.5.2b.tar.gz（github.com/gdabah/distorm tag 3.5.2b，顶层 12 项）"
    finding: "顶层仅 .github/、disOps/、examples/、include/、make/、python/、src/、test-deps/、COPYING、README.md、setup.py 等；无 tests/、test/、check* 目录，无 CTest/CMake/CTest 接线"
  - path: "make/linux/Makefile（C 库唯一构建入口）"
    finding: "仅 all/clean/clib/install 四个目标；无 check、test 目标。examples/linux/Makefile 仅构建演示程序 disasm，无测试逻辑"
  - path: "examples/tests/main.cpp"
    finding: "Windows 演示采样程序：对固定 3 字节（0f 01 cb）做一次 decompose 并打印，无任何断言，main 恒返回 0；属于示例而非测试套件"
  - path: "examples/linux/main.c、examples/win32、examples/java、examples/cs、examples/ddk"
    finding: "均为各平台演示/绑定示例（命令行反汇编器、Java/C# 绑定、DDK 示例），无断言、无测试运行器"
  - path: "python/test_distorm3.py（约 367 个 def test_ 方法，11 个 TestCase）"
    finding: "唯一实质测试套件，但测试对象是 CPython 绑定模块 distorm3（import distorm3），且约半数用例经 yasm 汇编器在线汇编测试向量；配方仅打包 C 静态/动态库，不构建 Python 扩展，OHOS 无 yasm 预编译包，属缺失组件无法低成本补齐，故未接入"

test_package_tests:
  - file: test_version.c
    description: "版本号校验（distorm_version 须为 3.5.2）与单字节 NOP 在 32 位模式下的解码验证（7 项断言）"
    command: "./test_version"
  - file: test_decode.c
    description: "上游演示字节序列的 decompose、上游 MOV 语义的 32/64 位 decode（含操作数文本）与双 NOP 计数验证（13 项断言）"
    command: "./test_decode"

assertion_count: 20
