version: "3.5.2.b"
status: built
build_date: "2026-09-10"

source:
  url: "https://github.com/gdabah/distorm/archive/refs/tags/3.5.2b.tar.gz"
  tar_format: tar.gz

build:
  system: makefile
  cflags:
    - "-fPIC"
    - "-O2"
    - "-Wall"
    - "-DSUPPORT_64BIT_OFFSET"
    - "-DDISTORM_STATIC"
    - "-std=c99"
  cc: clang

patches_applied: []

knowledge_gained:
  - "无 configure/CMake，直接编译 src/ 下 8 个 C 文件，与上游 make/linux/Makefile 旗标一致"
  - "编译器与归档工具路径从 Conan conf 获取 (R33)，不依赖 shell 环境变量"
  - "库文件名保持上游命名 libdistorm3（不改名为 distorm）"
  - "C 侧无可接入的上游测试目标；Python 绑定套件需 yasm 与 CPython 扩展构建，未接入（见 test_package/MANIFEST.yml 审计）"
