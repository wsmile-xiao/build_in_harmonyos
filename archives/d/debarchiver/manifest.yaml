software: "debarchiver"
display: "debarchiver"
description: "Debian 仓库管理工具：收集上传的 .changes 包、生成 apt 索引并可对 Release 签名"
category: system
homepage: "https://packages.debian.org/source/debarchiver"
license: "GPL-2.0-or-later"
build_system: none

# 跨版本通用说明
ohos_adaptation:
  key_points:
    - "shebang 由 #!/usr/bin/perl 改为 #!/usr/bin/env perl（OHOS 无 /usr/bin/perl）"
    - "不调 make install：OHOS 无 coreutils install（E188），上游 Makefile 用 install -m755/-m644"
    - "man 页改用 perl 自带 Pod::Man 生成（上游 po4a 流程需 podselect/po4a，均不可用）"
    - "硬编码运行期目录（/var/lib/debarchiver 等）可用 --configfile 覆盖，无需改源码"
    - "核心功能依赖 apt-ftparchive/dpkg-scanpackages/dpkg-deb/gpg/adduser，OHOS 上均不可得（功能限制，如实声明）"
  common_dependencies:
    - opalmod
    - perl

# 版本索引
versions:
  - version: "0.11.7"
    status: built
    build_date: "2026-09-12"
    notes: "纯 Perl 脚本；conan create EXIT=0；test_package 9/9（含 --configfile 绕过硬编码目录的正/负向验证）"
