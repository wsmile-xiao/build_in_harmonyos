version: "0.11.7"
software: "debarchiver"
status: "built"
build_date: "2026-09-12"
build_system: "none"

source:
  url: "https://deb.debian.org/debian/pool/main/d/debarchiver/debarchiver_0.11.7.tar.xz"
  sha256: "4517e667b576013d5fa3cf683508aecc722180aaccf7a1c0d9d956030901c093"
  tar_format: "tar.xz"

build:
  system: "none"
  dependencies:
    - "opalmod/0.2.2.1"
    - "perl/5.42.2"
  notes:
    - "纯 Perl 脚本（src/debarchiver.pl，114KB），无编译步骤"
    - "shebang 由 #!/usr/bin/perl 改为 #!/usr/bin/env perl（OHOS 无 /usr/bin/perl）"
    - "不调 make install：OHOS 无 coreutils install（E188），上游 Makefile 用 install -m755/-m644"
    - "man 页走上游 po4a 流程不可行（缺 podselect/Pod::Select 与 po4a），改用 Pod::Man 生成"
  runtime_tools_unavailable:
    - apt-ftparchive
    - dpkg-scanpackages
    - dpkg-deb
    - gpg
    - adduser

patches_applied: []

knowledge_gained:
  - "硬编码运行期目录（如 /var/lib/debarchiver）可在不改源码的前提下用 --configfile 覆盖；实测 debarchiver 的 inputdir/destdir/cachedir 均可用配置覆盖，避免脚本 chdir 失败（EXIT 2）。"
  - "上游脚本内版本串可能与发行包版本不一致：debarchiver 0.11.7 的 --version 输出 'version 0.10'。测试断言须按实测输出写，按包版本断言会假失败。"
  - "OHOS 缺 coreutils install（E188）时，纯 Perl 包的 Makefile install 目标也不能用（即便无需编译器），须由配方自行落盘。"

verification:
  test_package: "9/9 通过（1 产物检查 + 1 shebang + 1 依赖加载 + 2 --help/--version 真实执行 + 1 配置项 + 1 负向 + 2 打包完整性）"
  upstream_tests: "上游无测试套件（见 notes.md 取证）"

homepage: "https://packages.debian.org/source/debarchiver"
license: "GPL-2.0-or-later"
