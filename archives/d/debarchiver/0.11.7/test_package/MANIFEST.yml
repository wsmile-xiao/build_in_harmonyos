# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: debarchiver/0.11.7
homepage: "https://packages.debian.org/source/debarchiver"

# 上游测试命令
# 上游**不带测试套件**（无 tests/、无 t/、无 CI 配置），故无 upstream_check_command。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

upstream_test_count: 0

upstream_test_note: |
  上游**确实没有测试套件**（非"未启用"）。取证：
    · tarball 结构为 Makefile / conf / src / po4a / debian / patches，
      **不存在 tests/ 或 t/ 目录**；
    · `src/Makefile` 只有 all/install/clean 三个目标，**无 test/check 目标**；
    · 顶层 Makefile 仅以 for 循环驱动 conf/src/po4a 三个子目录的 install，
      亦无 test 目标；
    · Debian 打包侧（debian/）只有 rules/control/changelog，
      rules 中无 dh_auto_test 之外的测试阶段。

  因上游无可实跑的测试，本配方改为**驱动该工具真实可运行的部分**做验证 ——
  `test_package/run_debarchiver_tests.py`（9 项）：
    1. bin/debarchiver 存在且可执行；
    2. shebang 已正确改写为 #!/usr/bin/env perl；
    3. ★ 依赖 opalmod（OpaL::*）已被真实加载（无 "Can't locate OpaL"）—— 这是本包
       必须先行适配 opalmod 的直接验证；
    4. --help 真实执行并输出 "Usage: debarchiver"；
    5. --version 真实执行成功；
    6. 负向：不给 --configfile 时因硬编码 /var/lib 不存在而失败（证明第 5 项非恒真）；
    7-9. 打包完整性：etc/debarchiver.conf、logcheck 配置、man 页随包。

  ⚠️ 覆盖范围限制（诚实声明）：本包核心功能（收 .changes、建 apt 索引、gpg 签名）
  依赖 apt-ftparchive / dpkg-scanpackages / dpkg-deb / gpg / adduser，
  **这些工具在 OHOS 上全部不可得**（实测 command -v 均为空）。故测试覆盖的是
  「脚本自身可真实运行的部分」，未伪称完整功能可用。

  ⚠️ 版本串差异：上游 `--version` 输出 "Debian package archiver, version 0.10"，
  而 Debian 包版本为 0.11.7（上游未同步该字符串）。断言按**实测输出**写。
