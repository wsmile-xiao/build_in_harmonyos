# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: dylib/3.0.1
homepage: "https://github.com/martin-olivier/dylib"

# 上游测试命令 (cmake 项目，gtest)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（17 个独立 TEST_CASE，C++17 全量）
upstream_tests:
  - file: tests/tests.cpp
    source: dylib-3.0.1/tests/tests.cpp
    description: "gtest 单元测试：library(6) + symbols(3) + cpp_symbols(8)，17 个 TEST_CASE，C++17 下 17/17 通过"
    command: "./unit_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：加载真实 OHOS 系统库 libhilog.so 并调用 HiLogPrint"
    command: "./test_dylib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
