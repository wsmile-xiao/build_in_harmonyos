  - "0002-src-symbols.cpp.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS musl libc 无 dlinfo(RTLD_DI_LINKMAP)，需用 dl_iterate_phdr + dlsym 过滤替代符号枚举；.dynsym 条目数必须用可验证边界（优先 DT_HASH nchain，仅 GNU hash 时遍历 bucket 链，bloom 为 ElfW(Xword) 宽），禁止用 DT_STRSZ/DT_SYMENT 推导"
  - "OHOS libc++ 内联命名空间 std::__n1:: 需在 demangle 归一化中处理为 std::"
  - "OHOS HiLogPrint 为变参函数 int(LogType,LogLevel,unsigned int,const char*,const char*,...)，消费者函数指针原型必须带省略号并按其契约（rc>=0 成功）断言，不得用固定参数原型（UB）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_hash: b8c7f20dbd49e0ca07501ecad55fa188
  source_work_hash: e8d4d04d2b3ad3e62afda7075579bb68
  generated_at: '2026-09-03T15:55:00'
  patches_count: 2

patch_classification:
