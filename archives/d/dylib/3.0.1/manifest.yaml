# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag 归档）
  url: "https://github.com/martin-olivier/dylib/archive/refs/tags/v3.0.1.tar.gz"

  # 源码校验和（官方 tarball SHA-256）
