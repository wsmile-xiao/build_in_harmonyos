# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dap/3.9
homepage: "https://www.gnu.org/software/dap/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 dap 3.9 无自动化测试套件：顶层与 src/Makefile.am 均无 TESTS /
# check_PROGRAMS 声明，`make check` 无可执行目标（清点证据见同版本 notes.md）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：运行已安装的 dap 二进制，断言 --version 输出含版本横幅（上游缺陷：横幅打至 stderr 且退出码 1，按上游真实契约断言）"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
