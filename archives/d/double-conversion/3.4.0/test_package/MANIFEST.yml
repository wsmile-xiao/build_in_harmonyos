# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: double-conversion/3.4.0
homepage: "https://github.com/google/double-conversion"

# 上游测试命令 (CMake ctest)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游实际运行的测试程序 (cctest 单一二进制，内含 9 个测试用例)
upstream_tests:
  - file: test/cctest.cc
    source: double-conversion-3.4.0/test/cctest.cc
    description: "CCTest runner: bignum, bignum_dtoa, conversions, diy_fp, dtoa, fast_dtoa, fixed_dtoa, ieee, strtod"
    command: "./cctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: double-to-string and string-to-double round-trip conversion"
    command: "./test_double-conversion"

# 测试断言总数 (9 upstream + 1 test_package)
assertion_count: 10
