software: devicexlib
display: "deviceXlib"
description: "MaX CoE deviceXlib - Fortran abstraction layer unifying CPU/GPU device memory management (malloc/mapping/memcpy/memset/pinned) and BLAS/LAPACK linear algebra wrappers, used by Quantum ESPRESSO"
category: foundation
homepage: "https://gitlab.com/max-centre/components/devicexlib"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游为 98.8% Fortran 项目，CMake project(LANGUAGES Fortran C) 硬依赖 Fortran 编译器"
    - "OHOS 设备无 gfortran/flang：用仓内 flang-ohos/20.1.0（设备原生 LLVM Flang tool 包）作 tool_requires，同 openblas/lapack 先例"
    - "flang-ohos 为精简运行集（无 builtins/crt）：编译喂 --sysroot + -resource-dir(SDK clang 15.0.4)，链接喂 SDK llvm/lib 路径与 libFortranRuntime/Decimal"
    - "上游 CMake 的 DEVXLIB_ENABLE_ACC/GPU_BLAS 三种 GPU 选项各带编译器门禁（NVHPC/GNU/IntelLLVM），补丁新增 OFF(CPU-only) 与 LLVMFlang 支持"
    - "find_package(LAPACK/OpenMP REQUIRED) 由 recipe 的 FindLAPACK/FindOpenMP shim 确定性满足（CPU 路径不使用 OpenMP 开关）"
    - "上游版本字符串（devxlib_version.h 0.8.5）与 tag 0.9.1 脱节，以 tag/conandata 为准"
  common_dependencies:
    - lapack

versions:
  "0.9.1":
    status: built
    build_date: "2026-09-11"
    conan_ref: "devicexlib/0.9.1"
