# test_package/MANIFEST.yml — devicexlib 0.9.1
# CI L0e requires this file to exist.

package: devicexlib/0.9.1
homepage: "https://gitlab.com/max-centre/components/devicexlib"

# Upstream has no CTest suite; tests are Fortran programs (test_*.x) built by the
# same CMake tree and run via tests/run.sh -a (autotools: `make test`).
upstream_check_command: "tests/run.sh -a"
upstream_test_in_build: true
upstream_test_command: "src/test_linalg.x, src/test_malloc.x, src/test_mapping.x, src/test_buffer.x, src/test_memcpy.x, src/test_memcpy_async.x, src/test_memset.x, src/test_pinned.x (run inside build())"

upstream_tests:
  - linalg: "BLAS/LAPACK wrapper axpy/dot/gemm/gemv on host memory"
  - malloc: "unified malloc/allocated/free on device(=host in CPU build)"
  - mapping: "map/unmap/mapped host-device memory views"
  - buffer: "buffered memory handling (fbuff tester)"
  - memcpy: "d2d/d2h/h2d/h2h memory copies (host==device in CPU build)"
  - memcpy_async: "asynchronous copies"
  - memset: "device/host memory initialization"
  - pinned: "pinned memory handling (host fallback in CPU build)"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Plain C consumer links libdevXlib.a with its Fortran-runtime and lapack closure and runs"
    command: "cmake build + ./test_devicexlib"

assertion_count: 9
