version: "0.9.1"
status: built
build_date: "2026-09-11"
conan_ref: "devicexlib/0.9.1"

source:
  url: "https://gitlab.com/max-centre/components/devicexlib/-/archive/0.9.1/devicexlib-0.9.1.tar.gz"
  sha256: "900fe8b0849d451e7c541d00a1b92c723e0969bae47ebcabd295e14ebcc17d1e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DDEVXLIB_ENABLE_ACC=OFF"
    - "-DDEVXLIB_ENABLE_GPU_BLAS=OFF"
    - "-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY"
  dependencies:
    - lapack/3.12.1
    - flang-ohos/20.1.0 (tool_requires)
  cc: /data/service/hnp/bin/clang (profile conf)
  fc: flang-ohos/20.1.0 包内 bin/flang (LLVM Flang 20.1.0)

patches_applied:
  - "0001-cmake-cpu-off-option.patch"
  - "0002-flang-async-kind-cpu.patch"
  - "0003-cmake-memset-test-target.patch"

knowledge_gained:
  - "CMake project(LANGUAGES Fortran C) 在默认工具链下报 No CMAKE_Fortran_COMPILER could be found（设备无 gfortran）"
  - "上游 CMake 仅允许 CUDAF/OPENACC/OPENMPGPU 三种加速且各带编译器门禁，无 CPU 选项；补丁新增 OFF 值"
  - "无宏（无 __DXL_CUDAF/__DXL_OPENACC/__DXL_OPENMP_GPU）时 GPU 源文件退化为 CPU 主机实现（mod_cublas 等留 stub 符号），CPU-only 可编译"
  - "find_package(LAPACK/OpenMP REQUIRED) 用 Find 模块 shim 确定性满足，避开 flang 精简运行集的链接探测不可靠问题"
  - "上游版本字符串 devxlib_version.h=0.8.5 与 tag 0.9.1 脱节，conandata 以 tag 为准"
