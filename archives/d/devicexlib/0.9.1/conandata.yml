sources:
  url: "https://gitlab.com/max-centre/components/devicexlib/-/archive/0.9.1/devicexlib-0.9.1.tar.gz"
  sha256: "900fe8b0849d451e7c541d00a1b92c723e0969bae47ebcabd295e14ebcc17d1e"

patches:
  - patch_file: "patches/0001-cmake-cpu-off-option.patch"
    patch_description: "Allow DEVXLIB_ENABLE_ACC/GPU_BLAS=OFF (CPU-only) and add an LLVMFlang compiler config module so the project configures without NVHPC/GNU/Intel compilers"
    patch_type: "portability"
  - patch_file: "patches/0002-flang-async-kind-cpu.patch"
    patch_description: "Route integer(kind=dxl_async_kind) through a DXL_ASYNC_DECL macro: under parallel/HMDFS builds cross-file .mod reads can be corrupted, breaking constant evaluation at consumer kind selectors; default integer is equivalent in CPU-only builds (GPU branches keep the original text)"
    patch_type: "portability"
  - patch_file: "patches/0003-cmake-memset-test-target.patch"
    patch_description: "Add the missing test_memset target to the upstream CMake source list so the full 8-suite upstream test set (tests/run.sh TEST_LIST) builds and runs"
    patch_type: "bugfix"
