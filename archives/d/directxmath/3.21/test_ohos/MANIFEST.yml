# test_ohos/MANIFEST.yml — directxmath 3.21 HarmonyOS PC 专项验证
# 五项独立鸿蒙检查（run_ohos_test.py，任一失败非零退出）：
#   T1_aarch64_elf    ELF64 AArch64（readelf -h）
#   T2_musl_no_glibc  musl libc, 无 GLIBC 符号版本, 无 ld-linux
#   T3_codesign       .codesign 段存在（OHOS 签名管线）
#   T4_no_host_paths  无宿主绝对路径（含 RPATH/RUNPATH）
#   T5_real_simd      真实 NEON SIMD 计算：向量往返/加法/矩阵旋转 90°/XMFLOAT3，
#                     仅经公开头文件调用公开 API，可观察结果断言
checks:
  - id: T1_aarch64_elf
    desc: ELF64 AArch64 (readelf -h)
  - id: T2_musl_no_glibc
    desc: musl libc, no GLIBC symbol versions, no ld-linux
  - id: T3_codesign
    desc: .codesign section present (OHOS signing pipeline)
  - id: T4_no_host_paths
    desc: no absolute host paths, no RPATH/RUNPATH
  - id: T5_real_simd
    desc: real NEON SIMD computation (vector roundtrip/add, matrix rotate 90deg, XMFLOAT3)
assertion_count: 5
assertion_count_note: 5 machine checks + 4 in-program assertions (T5)