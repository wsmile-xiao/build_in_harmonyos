software: debootstick
display: "debootstick"
description: "Turn a chroot environment into a bootable live image"
category: system
homepage: "https://github.com/drakkar-lig/debootstick"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "Pure shell tool (bash + Makefile), no compilation and no external build dependencies"
    - "Upstream installs to /usr/sbin + /usr/share/debootstick; recipe relocates to bin/ + share/debootstick with fallback copies beside the binary"
    - "OHOS has no /bin/bash: invoke the script via CONFIG_SHELL bash explicitly, never exec directly"
    - "Upstream Makefile install-tool runs chown root:root unless DH_BUILD_TYPE=1; recipe installs files with Conan copy instead"
  common_dependencies: []

versions:
  "2.9":
    status: built
    build_date: "2026-09-10"
