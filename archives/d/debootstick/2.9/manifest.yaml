version: "2.9"
software: debootstick
status: built
build_date: "2026-09-10"
build_system: makefile

source:
  url: "https://deb.debian.org/debian/pool/main/d/debootstick/debootstick_2.9.tar.xz"
  sha256: "6be758f1ee468ba6a90af797e5f2cf02881150cb107c0bcf1796b01f4f6c8566"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "No configure step (pure shell + Makefile install-tool project)"
    - "build() runs bash -n syntax checks on debootstick and the two sourced helpers"
    - "package() replicates the Makefile sed @VERSION@ stamping without chown/absolute-mkdir steps"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Debian native tarball extracts at archive root, so get() needs strip_root=False"
  - "Upstream DBSTCK_DIR falls back to the script directory, so sibling scripts/ + disk-layouts/ copies keep the package relocatable patch-free"
  - "The script shebang is /bin/bash which is absent on OHOS; always invoke via CONFIG_SHELL bash"

compatibility:
  level: high
  issues:
    - "Real image creation needs root, loop devices, parted/grub and a Debian chroot; consumer tests cover headless CLI paths only"
