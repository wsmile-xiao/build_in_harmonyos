# test_package/MANIFEST.yml
# Upstream test declaration for debootstick 2.9.
# CI script (build_and_test.sh L0e) requires this file to exist.

package: debootstick/2.9
homepage: "https://github.com/drakkar-lig/debootstick"

# Upstream ships no automated test suite; audit below (all four sources
# inspected: source tree, build files, release tarball, Debian packaging).
upstream_tests_exist: false
upstream_test_audit:
  - source: "debootstick_2.9.tar.xz source tree"
    reason: "Top level holds only debootstick, Makefile, README.md, debootstick.8, scripts/, disk-layouts/, debian/; no tests/, test/, check/, pytest, ctest, prove, or bats files exist."
  - source: "Makefile"
    reason: "Defines only empty all:/clean: plus install-tool/install-docs/uninstall targets; there is no check or test target to run."
  - source: "GitHub repository file listing (master branch)"
    reason: "Shows debian/, disk-layouts/, scripts/, Makefile, README.md, debootstick, debootstick.8 only; no test harness or CI test workflow is present."
  - source: "Debian packaging (debian/ directory)"
    reason: "Adds changelog, control, copyright, rules, install files; no debian/tests/ autopkgtest control file is shipped."
  - conclusion: "Upstream 2.9 provides no automated tests; the adaptation adds installed-binary headless CLI checks without presenting them as upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# Consumer tests bundled in test_package (headless CLI, no root required).
test_package_tests:
  - file: test.sh
    description: "Launcher presence/executable check plus --version exact-match (debootstick 2.9)"
    command: "bash test.sh (scenario 1)"
  - file: test.sh
    description: "--help exits 0 and prints usage text"
    command: "bash test.sh (scenario 2)"
  - file: test.sh
    description: "--help-os-support exits 0 with non-empty OS support description"
    command: "bash test.sh (scenario 3)"
  - file: test.sh
    description: "Unknown option fails closed with non-zero exit (negative path)"
    command: "bash test.sh (scenario 4)"
  - file: test.sh
    description: "Missing chroot/image args fail closed with non-zero exit (negative path)"
    command: "bash test.sh (scenario 5)"
  - file: test.sh
    description: "scripts/create-image helpers and disk-layouts/ payload present in package"
    command: "bash test.sh (scenario 6)"

test_scenario_count: 6
assertion_count: 14
assertion_count_basis:
  install_and_version: 3
  help_and_os_support: 3
  negative_paths: 2
  data_payload: 3
  pass_markers: 3
  final_summary: 0
