# 版本级 manifest — debconf 1.5.77
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.5.77"

# 软件名
software: debconf

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-30"
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 官方源池）
  url: "https://deb.debian.org/debian/pool/main/d/debconf/debconf_1.5.77.tar.xz"

  # 源码校验和（sha256，tar tJf 实测）
  sha256: "03482934c645140dd4cb8cae4970f81f576995b757ac7b89192067e72aa1d067"

  # 压缩格式
  compression: tar.xz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "work"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  # 纯 Perl 实现，无编译（上游 Makefile 仅构建 doc/po）
  options: []
  notes: "package_type=application，package() 拷贝 Debconf/**/*.pm 到 lib/perl5/ + 可执行脚本到 bin/"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: "纯 Perl 模块，仅依赖 Perl 核心模块（IO::File、File::Temp、POSIX、Text::Wrap、File::Spec、Exporter 等）+ 内部 Debconf::* 模块，无外部 CPAN 依赖"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 1
  failed: 0
  note: |
    上游测试：work/Test/ 为 Test::Unit 框架套件（AllTests.pm 聚合 CopyDBTest +
    DbDriver 各驱动测试），依赖 Test::Unit::* CPAN 模块且需真实数据库驱动
    （LDAP/SLAPD 等）——OHOS 沙箱无这些 CPAN 模块，无法运行（如实记录）。
    适配后：test_package R34 真实调用 Debconf::Config 模块 API（纯 Perl，
    perl -I<lib> 运行），1/1 = 100%。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "debconf 是纯 Perl 的 Debian 配置管理框架：Debconf/*.pm 模块 + debconf-* CLI 脚本，无编译；上游 Makefile 仅构建 doc/po，测试为 Test::Unit 套件（依赖 CPAN 模块 + 真实数据库驱动，沙箱无法运行）"

references:
  - https://salsa.debian.org/pkg-debconf/debconf
  - https://packages.debian.org/source/bullseye/debconf
