# test_package/MANIFEST.yml — debconf 1.5.77
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: debconf/1.5.77
homepage: "https://salsa.debian.org/pkg-debconf/debconf"

# 上游测试套件：work/Test/ 下 Test::Unit 框架套件（AllTests.pm 聚合
# CopyDBTest + DbDriver 各驱动测试：DirTree/File/LDAP/PackageDir/Common）
# 依赖 Test::Unit::* CPAN 模块 + 真实数据库驱动（LDAP/SLAPD 等）——
# OHOS 沙箱无这些 CPAN 模块，无法运行（实测 perl -MTest::Unit 报 Can't locate）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（沙箱不可运行，如实声明）
upstream_tests: []

# test_package 消费者测试（R34 真实 API：perl 加载 Debconf::Config + 运行 debconf-escape）
test_package_tests:
  - file: test_debconf.py
    description: "Loads packaged Debconf::Config module via perl -I<lib> and calls dump() (real API); runs packaged bin/debconf-escape helper"
    command: "python3 test_debconf.py"

# 断言总数：Debconf::Config 加载 + debconf-escape 运行 = 2
assertion_count: 2
