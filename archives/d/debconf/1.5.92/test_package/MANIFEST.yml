# Conan L0e and upstream test inventory for debconf 1.5.92
package: debconf/1.5.92
homepage: "https://salsa.debian.org/pkg-debconf/debconf"

# The upstream repository has a Test::Unit suite, not a Makefile check target.
# `rg -c '^\s*sub\s+test_[A-Za-z0-9_]+' Test` finds 7 declared test methods.
# It imports Test::Unit::* and its aggregate includes LDAP/SLAPD integration;
# the OHOS Perl runtime lacks these CPAN modules and the LDAP service. Keep
# this separate from the runnable package consumer test below.
upstream_check_command: "perl -I. test_debconf.pl --all"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: Test/CopyDBTest.pm
    description: "Test::Unit CopyDBTest suite; unavailable because Test::Unit and test database services are absent"
  - file: Test/Debconf/DbDriver/CommonTest.pm
    description: "5 shared Test::Unit test methods used by database driver suites"
  - file: Test/Debconf/DbDriver/DirTreeTest.pm
    description: "Test::Unit database driver integration suite"
  - file: Test/Debconf/DbDriver/FileTest.pm
    description: "Test::Unit database driver integration suite"
  - file: Test/Debconf/DbDriver/LDAPTest.pm
    description: "LDAP/SLAPD integration suite"
  - file: Test/Debconf/DbDriver/PackageDirTest.pm
    description: "Test::Unit package database driver suite"

test_package_tests:
  - file: test_debconf.py
    description: "Loads the packaged Debconf::Priority API and checks packaged debconf-escape behavior using the OHOS Perl interpreter"
    command: "python3 test_debconf.py"
assertion_count: 8
