software: duo_unix
display: "Duo Unix"
description: "Duo Security two-factor authentication for Unix systems"
category: security
homepage: "https://duo.com/docs/duounix"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "HMDFS 临时文件限制：autotools 的 mktemp -d \"./confXXXXXX\" 在 HMDFS 上失败"
    - "解决方案：在 ~/tmp 目录运行 configure + 修改 config.guess/config.status 使用固定临时目录"
    - "需要 OpenSSL 1.1.1w（静态链接）作为依赖"
    - "使用 --sysconfdir=$DEFAULT_PREFIX/etc 避开 /etc 只读问题"
    - "login_duo 已成功编译，pam_duo 未编译（缺少 PAM 支持）"
    - "修改生成文件（config.status）属于 R6 铁律特例，需详细记录"
  common_dependencies:
    - openssl/1.1.1w

versions:
  "2.2.3":
    status: built
    build_date: "2026-06-15"
    notes: "使用 HMDFS 解决方案（方案 B）编译成功，G0 因平台限制跳过"