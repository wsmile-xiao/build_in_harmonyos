software: duo_unix
version: "2.2.3"
status: published
build_date: "2026-06-16"

source:
  url: "https://github.com/duosecurity/duo_unix/archive/refs/tags/2.2.3.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  build_system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--sysconfdir=$DEFAULT_PREFIX/etc"
    - "--with-openssl=$OPENSSL_PREFIX"
  dependencies:
    - openssl/1.1.1w
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-autotools-config.guess.patch"
  - "0002-autotools-config.sub.patch"
  - "0003-login_duo-Makefile-static-ssl.patch"
  - "0004-lib-libduo.la-remove-ssl-deps.patch"

knowledge_gained:
  - "HMDFS 临时文件限制：autotools mktemp -d 在 HMDFS 上失败"
  - "静态链接 OpenSSL：需要修改 Makefile 使用完整路径 + 修改 libtool .la 文件"

quality_verification:
  g0_clean_build: skipped
  g0_reason: "HMDFS 平台限制"
  g1_binary_integrity: pass
  g2_functional: pass
  g3_portability: pass
  g4_archive_integrity: pass
  static_ssl_linking: verified
  overall: pass