software: Data-Peek
display: "Data::Peek"
description: "Perl XS module for debugging and visualizing Perl internal data structures"
category: dev-tool
homepage: "https://metacpan.org/pod/Data::Peek"
license: perl
build_system: perl
compile_date: "2026-06-10"

ohos_adaptation:
  key_points:
    - "Perl XS module requires OHOS SDK sysroot headers and lib paths"
    - "Link with -nostartfiles to bypass missing CRT files"
    - "SELinux restricts .so loading in user directories (hmdfs vs hnp_file)"
  common_dependencies:
    - perl
    - musl (headers)

versions:
  "0.53":
    status: built
    build_date: "2026-06-10"