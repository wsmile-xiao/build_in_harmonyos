software: Data-Peek
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.53/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.53"

# 编译状态
# published | built | failed | archived
# archived: 编译成功但受平台限制无法使用
# built: 编译成功，产物完整
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"
compile_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/H/HM/HMBRAND/Data-Peek-0.53.tgz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: autotools
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local INC=-I/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot/usr/include -I/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot/usr/include/aarch64-linux-ohos"

  # 特殊链接参数（绕过 CRT 文件缺失）
  link_options:
    - "-nostartfiles --sysroot=/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot -L/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/lib/aarch64-linux-ohos -l:libunwind.a -lc"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.PL.patch: 添加 dynamic_lib => { OTHERLDFLAGS => '-nostartfiles --sysroot=... -L... -l:libunwind.a -lc' }"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块编译需要标准 C 库头文件（OHOS SDK sysroot）"
  - "鸿蒙系统缺少 CRT 文件（crti.o, crtn.o, crtbeginS.o, crtendS.o），链接需要 -nostartfiles 参数"
  - "链接 Perl XS 模块需要添加 sysroot 和 llvm 库路径，并链接 libunwind.a 和 libc"
  - "Makefile.PL 中可通过 dynamic_lib => { OTHERLDFLAGS => ... } 添加链接参数"
  - "鸿蒙 SELinux 策略限制：用户目录 .so 标签为 hmdfs，系统路径为 hnp_file"
  - "普通用户无法修改 SELinux 标签（setfattr: Not supported）"
  - "binary-sign-tool 需要开发者证书，不支持 .so 文件签名"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/Data-Peek-0.53.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/Data-Peek-0.53.work
  source_orig_hash: c17bd3beb0bd8760
  source_work_hash: a6a373f29eb7330b
  generated_at: '2026-06-10T16:00:19'
  patches_count: 1

patch_classification:
  - file: 0001-Makefile.PL.patch
    type: auto
    platform_only: True
    guard: 'pending'
