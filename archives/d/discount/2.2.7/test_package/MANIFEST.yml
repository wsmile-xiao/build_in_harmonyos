# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: discount/2.2.7
homepage: "https://github.com/Orc/discount"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/*.t
    source: discount-2.2.7/tests/
    description: "discount 上游 Markdown 兼容性测试套件 (20 个测试)"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 mkd_string/mkd_compile/mkd_document API 验证 Markdown 到 HTML 转换"
    command: "./test_discount"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
