package: dictd/1.13.3
homepage: "https://www.dict.org/"
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  - file: "Makefile.in"
    source: "dictd-1.13.3/Makefile.in"
    description: "Upstream make test runs test/dictd_test (dictfmt/dictunformat/index round-trips and dictd protocol answers, mostly via dictd --stdin2stdout) and test/dictzip_test (dictzip compression and random-access decompression)."
    command: "make test"
test_package_tests:
  - file: "test.sh"
    description: "Socket-free smoke: dict/dictd banner version check (both exit 1 by upstream design, so banner text is asserted), dictzip->dictunzip round-trip byte comparison, dictfmt -c5 built dictionary answered by dictd through --stdin2stdout pipe protocol (DEFINE returns 150/151 and the definition body)."
    command: "./test.sh"
assertion_count: 8
