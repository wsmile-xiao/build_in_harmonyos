software: dictd
version: "1.13.3"
status: built
build_system: autotools
build_date: "2026-09-10"
created_at: 2026-09-10
knowledge_gained:
  - "libmaa 无仓内 Conan recipe，采用 Coordinator 批准的方案 a：在 dictd recipe 内 vendored 静态构建 libmaa 1.4.7（仅 dictd 用到的 maa_init/maa_shutdown），源归档固定于 conandata.yml"
  - "libmaa 1.4.7 为 BSD make (mkc) 构建，vendored 构建直接用 clang 编译 maa/*.c：mkc 特性宏用命令行提供（-DSIZEOF_LONG=8 -DHAVE_HEADER_SYS_RESOURCE_H=1），arggram.c 需 awk -f arggram2c 预生成；maa.c 引用 timer.c 的 tim_* 符号，排除 timer.c 会链接失败（1.4.7 旧笔记'排除 bit.c/timer.c'为缺宏误诊，已纠正）"
  - "上游测试入口是 make test（非 make check）：cd test && sh dictd_test && sh dictzip_test；绝大多数 server 用例走 dictd --stdin2stdout 管道，仅 nodetach 组绑定 localhost:26281"
  - "设备 bash 启动时 getcwd() 在 HMDFS 路径上失败（errno 随机），conan 自定义 run 命令必须以 cd '<workdir>' && 前缀重建 shell 工作目录"
  - "AC_PROG_LEX(yywrap) 在无 -lfl 时把 LEX 降级为 ':'（静默不生成 scanner）；dictd scanners 自带 yywrap，需在 make 前按上游命令行预生成 4 个 scanner/parser 文件绕开"
  - "上游不产出独立 dictunzip：dictzip.c 按 argv[0] 分派解压模式，发行版以 dictunzip→dictzip 链接提供；上游 make test 全套（含 nodetach/daemon 组）已在 OHOS 设备真实通过"
patches_applied:
  - 0001-config.guess.patch
  - 0002-config.sub.patch
build_log: logs/build.log
