# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dynamic-bitset/1.3.3
homepage: "https://github.com/pinam45/dynamic_bitset"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-tests"

upstream_tests:
  - name: tests/（Catch2 v3 单元测试——catch_discover_tests 多目标；Catch2/libpopcnt 子模块不在 tarball）
    count: "0"
    description: "上游测试实测（rule 4，如实记录）：Catch2 子模块需 v3.5.0（唯一含 catch_uniform_integer_distribution.hpp 的版本），但 v3.5.0 与 OHOS LP64/clang 15 编译不兼容——SizedUnsignedType<16> 缺特化（DoubleWidthUnsignedType_t 2*8=16 无特化）+ generic extendedMult static_assert 'sizeof(unsigned long long) < sizeof(unsigned long)' 失败（LP64 下均为 8 字节）——已试 v2.13.10/v3.2.1/v3.3.2/v3.4.0/v3.5.0 五轮，上游测试无法完整运行，如实记录"

test_package_tests:
  - file: test_dynamic_bitset.py
    description: "R34：头文件存在 + 编译运行使用 dynamic_bitset 的 smoke（sul::dynamic_bitset 位操作）"
    command: "python3 test_dynamic_bitset.py <package>"

assertion_count: 2
