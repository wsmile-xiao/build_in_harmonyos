knowledge_gained:
  - category: L1
    content: "上游 tests/（Catch2 v3）实测无法在 OHOS 完整运行（rule 4 如实记录 N/A）——Catch2 版本 5 轮排查：v2.13.10 无 generators 布局、v3.2.1/v3.3.2/v3.4.0 无 catch_uniform_integer_distribution.hpp、v3.5.0 唯一含所需头但与 OHOS LP64/clang 15 编译不兼容（SizedUnsignedType<16> 缺特化 + generic extendedMult static_assert sizeof(unsigned long long) < sizeof(unsigned long) 失败）"
    reason: "rule 4 如实记录（上游测试框架与 OHOS 不兼容）"
  - category: L1
    content: "header-only 库 CMake 测试构建要点：测试依赖 git 子模块（Catch2）时需下载完整源码到 extlibs/Catch2（CMake add_subdirectory 方式——仅拷头文件不够）；Catch2::Catch2WithMain 需 CATCH_BUILD_STATIC_LIBRARY=ON；docs 依赖子模块需 DYNAMICBITSET_BUILD_DOCS=OFF；subprocess 调 cmake/ctest 需绝对路径（OHOS posix_spawn 不搜 PATH）"
    reason: "dynamic-bitset 适配实测——与 rich/vc posix_spawn 同源教训"
