name: diffutils
version: 3.10
category: core
status: built
build_system: autotools
build_date: 2026-05-21
compiler: clang 15.0.4
platform:
  os: ohos
  arch: aarch64

source:
  url: https://ftp.gnu.org/gnu/diffutils/diffutils-3.10.tar.xz

dependencies:
  runtime: []
  build:
    - gnulib

build_options:
  configure_options:
    - --prefix=$DEFAULT_PREFIX

verification:
  binaries:
    - diff
    - diff3
    - sdiff
    - cmp

artifacts:
  package: archives/d/diffutils/3.10/packaging/diffutils-3.10-ohos-aarch64.tar.gz

patches:
  - 0001-po-Makefile.in.patch
  - 0002-src-version.c.patch
  - 0003-build-aux-config.guess.patch
  - 0004-build-aux-config.sub.patch
  - 0005-doc-stamp-vti.patch
  - 0006-doc-version.texi.patch
  - 0007-po-POTFILES.patch
  - 0008-src-paths.h.patch
  - 0009-src-version.h.patch
  - 0010-configure-umask.patch

knowledge_gained:
  - E007: config.guess 无法识别 HarmonyOS
  - E072: config.sub 三元组验证失败
  - E011: HMDFS umask 077 权限问题（关键修复）