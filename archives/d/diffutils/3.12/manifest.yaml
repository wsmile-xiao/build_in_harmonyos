knowledge_gained:
  - "E007: config.guess 不识别 HarmonyOS（uname -s = HarmonyOS），需新增三元组分支 -> aarch64-unknown-linux-ohos"
  - "E072: 3.12 上游 config.sub 已支持 ohos（ohos* / linux-ohos*），无需再打补丁"
