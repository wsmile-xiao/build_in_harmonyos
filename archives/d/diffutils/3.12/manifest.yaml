  - "E232: conan 下 ./configure 直接执行报 Permission denied / Error 126，需用 /system/bin/sh 调用"
  - "E490: HMDFS 丢失 autotools 脚本执行位且 chmod 无效，需 unlink 后以 umask=0 + O_CREAT|O_EXCL(0o755) 重建"
  - "doc 需保留随包发布的 diffutils.info：补丁改动 configure 的 mtime 会触发 stamp-vti/version.texi/info 重生成，而构建环境无 makeinfo"

