# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）

package: diffutils/3.12
homepage: "https://www.gnu.org/software/diffutils/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序（tests/Makefile.am 的 TESTS 变量，共 33 项）
upstream_tests:
  - file: tests/basic
    source: diffutils-3.12/tests/basic
    description: "diff 基础比较（FR 用例）"
    command: "make check TESTS=basic"
  - file: tests/cmp
    source: diffutils-3.12/tests/cmp
    description: "cmp 逐字节比较"
    command: "make check TESTS=cmp"
  - file: tests/diff3
    source: diffutils-3.12/tests/diff3
    description: "diff3 三方比较"
    command: "make check TESTS=diff3"
  - file: tests/binary
    source: diffutils-3.12/tests/binary
    description: "二进制文件比较"
    command: "make check TESTS=binary"
  - file: tests/expand-tabs
    source: diffutils-3.12/tests/expand-tabs
    description: "--expand-tabs 制表符展开"
    command: "make check TESTS=expand-tabs"
  - file: tests/no-dereference
    source: diffutils-3.12/tests/no-dereference
    description: "--no-dereference 符号链接比较"
    command: "make check TESTS=no-dereference"
  - file: tests/timezone
    source: diffutils-3.12/tests/timezone
    description: "时区对上下文输出头部的影响"
    command: "make check TESTS=timezone"
  - file: tests/colors
    source: diffutils-3.12/tests/colors
    description: "--color 彩色输出（需 FIFO）"
    command: "make check TESTS=colors"
  - file: tests/bignum
    source: diffutils-3.12/tests/bignum
    description: "大数行号"
    command: "make check TESTS=bignum"
  - file: tests/help-version
    source: diffutils-3.12/tests/help-version
    description: "--help/--version 输出"
    command: "make check TESTS=help-version"
  - file: tests/ignore-matching-lines
    source: diffutils-3.12/tests/ignore-matching-lines
    description: "-I 忽略匹配行"
    command: "make check TESTS=ignore-matching-lines"
  - file: tests/ignore-case
    source: diffutils-3.12/tests/ignore-case
    description: "-i 忽略大小写（需 UTF-8 locale）"
    command: "make check TESTS=ignore-case"
  - file: tests/side-by-side
    source: diffutils-3.12/tests/side-by-side
    description: "-y 并排输出（需 UTF-8 locale）"
    command: "make check TESTS=side-by-side"
  - file: tests/stdin
    source: diffutils-3.12/tests/stdin
    description: "从标准输入比较"
    command: "make check TESTS=stdin"
  - file: tests/large-subopt
    source: diffutils-3.12/tests/large-subopt
    description: "大文件子选项（XFAIL，上游已知失败）"
    command: "make check TESTS=large-subopt"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "diff/diff3/sdiff/cmp 冒烟 + 功能验证"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 33
