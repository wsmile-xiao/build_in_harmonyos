# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: decorator/5.3.1
homepage: "https://github.com/micheles/decorator"

# 上游测试命令 — decorator unittest 套件（tests/test.py）
upstream_check_command: "python3 -m pytest tests/test.py -o addopts=""" ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测记录）：
# - tests/ 目录（test.py unittest 风格 + documentation.py）
# - 实测结果：**25 passed（100%，6.04s）**——全部测试真实运行通过，
#   无受阻无失败
upstream_tests:
  - file: tests/
    source: decorator-5.3.1/tests/
    description: "上游 unittest 套件（tests/test.py；实测 25 passed 100%，无受阻无失败）"
    command: "python3 -m pytest tests/test.py -o addopts=""" ""

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_decorator.py
    description: "消费者测试：真实 API（R34）——@decorator 包装函数 + 签名/名称/docstring 保留"
    command: "python3 test_decorator.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 3
