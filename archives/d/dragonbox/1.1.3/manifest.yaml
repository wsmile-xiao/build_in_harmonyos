software: dragonbox
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.3"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jk-jeon/dragonbox/archive/refs/tags/1.1.3.tar.gz"

  # 源码校验和
  sha256: "a0b2c3d4e5f6"  # 由 init-build 生成

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: cmake
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DDRAGONBOX_ENABLE_SUBPROJECT=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # dragonbox 无外部依赖，完全自包含

  # 编译器
  cc: clang
  cxx: clang++

  # 编译器版本
  cc_version: "Clang 15.0.4"

  # make 参数
  make_options: "-j2"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake INTERFACE 库 + STATIC 库混合项目，零补丁编译"
  - "测试子项目需 -DDRAGONBOX_ENABLE_SUBPROJECT=ON 启用，测试在 subproject/test/ 子目录运行"
  - "enable_testing() 在子目录调用，ctest 需在 build/subproject/test/ 目录执行"
