knowledge_gained:
  - category: L1
    content: "debsig-verify 的 libdpkg 依赖通过 dpkg/1.23.7 整包提供（该包执行完整 make install，含 libdpkg 头文件与库）；配方优先走 libdpkg.pc 的 pkg-config 解析，缺失时回退到预置 LIBDPKG_CFLAGS/LIBDPKG_LIBS 缓存变量跳过探测"
    reason: "dpkg 包的 package_info 未声明 libs，无法直接生成依赖 .pc，需显式处理 libdpkg 的发现路径"
  - category: L1
    content: "上游 21 个 autotest 用例中 19 个签名用例需 dpkg-deb（dpkg 包提供）与 OpenPGP 后端（OHOS 工具链与制品仓均无，gnupg 为 file:// stub）；配方以纯 stdlib 真实 OpenPGP 脚手架 hmbs_gpg_shim.py 在 build 期提供 gpg 后端（不进安装包），B255 段 11 例（编号 3-13）可真实通过，0DB59D1F 子钥 8 例（编号 14-21，本地实测该指纹在自身 keyring 内无匹配条目）因上游 fixture 自洽性缺陷仍失败（keyring 内无条目匹配被引用的该指纹，真 gpg 亦同），真实计数如实上报，豁免声明见 test_package/MANIFEST.yml"
    reason: "TEST_QUALITY_SPEC 3.3 要求保留 make check 调用，确实无法修复的失败在 MANIFEST 中声明豁免并说明原因"
