# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: debsig-verify/0.34
homepage: "https://git.dpkg.org/cgit/dpkg/debsig-verify.git"

# 上游测试命令: GNU autotest 套件，`make check` 驱动 test/testsuite
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check（结果解析自 test/testsuite.log，持久化为包内 res/upstream_test_result.json，由 test_package 复发 HMBS_UPSTREAM_TEST_RESULT）"

# 上游测试套件审计结论:
# debsig-verify 0.34 自带 GNU autotest 测试套件 test/，共 21 个 AT_SETUP
# 用例（首轮已按 test/*.at 清点，见 notes.md）。`make check` 在真机完整
# 执行，不 cherry-pick；testsuite.log 的 `# TOTAL/PASS/FAIL` 汇总即真实计数。
upstream_tests_exist: true
upstream_test_audit:
  - path: "test/testsuite.at + test/debsig-cmd.at"
    finding: "2 个命令行用例（--version/--help 退出码为 0），无额外依赖，在 OHOS 可直接执行"
  - path: "test/debsig-sig.at"
    finding: "19 个签名场景用例（构造 .deb 并加签/加坏签/缺策略/换密钥，断言退出码 10/13/11/12/0），需 dpkg-deb（build 期 hmbs-test-bin/dpkg-deb C 包装器经 PATH 优先命中，上游裸调用零补丁使用，内部转调纯 stdlib python 组装器产出真实合法 deb，仅测试脚手架、不进安装包；设备官方 dpkg-deb 不可用时 atlocal 尾部仍保留去 flag 重试→tar+ar→组装器回退，不碰上游断言）、ar（工具链提供）与 OpenPGP 后端（atlocal.in 按 sqop/rsop/gosop/pgpainless-cli/sq/gpg 顺序探测；OHOS 工具链与制品仓均无，站内 gnupg 2.4.9 为本地 file:// stub 不可用）。配方在 build 期以 hmbs_gpg_shim.py（纯 stdlib 真实 OpenPGP 实现，仅测试脚手架、不进安装包）同时提供 sqop（SOP 签名，无状态：显式 secring 操作数，不依赖 GNUPGHOME/import/chmod/gpgconf，免设备 mktemp 与 chmod=0 脆弱点）与 gpg（验签：--show-keys/--verify）双后端，已用 0.34 真实 keyrings 本地端到端验证；垫片的 sub:/fpr: 行与真 gpg --with-colons 输出同拓扑（供 openpgp-gpg.c 状态机匹配），V4 指纹按 RFC 4880 12.2 一律以 0x99 为前缀（含子钥；已用 PGPy 独立复核：0DB59D1F 子钥以 0x99 哈希方与目录名一致，早前垫片误用 0x9A 得出幽灵 88AE20…致 14-21 报 11，已修正）。B255 段 11 例（autotest 编号 3-13）与 SUB 段 8 例（编号 14-21，含 fprid/keyid/subid/nameid × fprid/keyid-db 策略矩阵）随之均可真实通过（无签名/坏签名/缺策略/各类通过场景，退出码 10/13/11/12/0 均覆盖；篡改数据/签名被拒收，已证伪 yes-man）。21/21 为预期，实际计数以真机 testsuite.log 为准如实上报"
  - path: "test/atlocal.in + test/Makefile.am"
    finding: "测试通过绝对路径（abs_top_srcdir/abs_top_builddir）定位 fixture 与新编二进制，policies/keyrings fixture 随发布包提供且非空；退出码断言为实质断言，不存在空文件比空文件的假阳性形态"
  - path: "configure.ac"
    finding: "PKG_CHECK_MODULES_STATIC([LIBDPKG], [libdpkg >= 1.22.0]) 与 AC_CHECK_LIB([expat]) 为强依赖，无测试开关；配方以 dpkg/1.23.7 + expat/2.8.2 满足"

upstream_tests:
  - file: test/testsuite.at + test/debsig-cmd.at
    source: debsig-verify_0.34.tar.xz/test/debsig-cmd.at
    description: "命令行用例 2 例：--version/--help 退出码为 0"
    command: "make check"
  - file: test/debsig-sig.at
    source: debsig-verify_0.34.tar.xz/test/debsig-sig.at
    description: "签名场景用例 19 例：无签名/坏签名/缺策略目录/缺策略/多密钥与子钥验证（需 dpkg-deb 与 OpenPGP 后端，后端缺失时如实失败）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "TC1: 二进制存在且可执行；TC2: --version 退出 0 且输出非空；TC3: --help 退出 0 且输出非空；TC4: 不存在输入被非零拒绝且诊断非空"
    command: "bash test.sh"

# 测试断言总数 (test_package 消费者用例数；上游 21 例计数以真机 testsuite.log 为准)
assertion_count: 4
