software: debsig-verify
display: "debsig-verify"
description: "Debian 二进制包签名校验工具"
category: system
homepage: "https://git.dpkg.org/cgit/dpkg/debsig-verify.git"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "使用发布包自带的 Autotools 生成文件，无需 autogen，不打补丁"
    - "libdpkg 头文件与库由 dpkg/1.23.7 整包提供，优先 pkg-config 解析 libdpkg.pc"
    - "上游 autotest 套件通过 make check 完整执行，结果解析自 test/testsuite.log"
  common_dependencies:
    - dpkg
    - expat
    - zlib

versions:
  "0.34":
    status: built
    build_date: "2026-09-11"
