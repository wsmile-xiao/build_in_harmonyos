# test_package/MANIFEST.yml — darts-clone 0.32h
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: darts-clone/0.32h
homepage: "https://github.com/s-yata/darts-clone"

# 上游测试命令（手动复现：./configure && make check → test-darts + test-tools.sh）
upstream_check_command: "./configure && make check"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内编译实跑 test/test-darts.cc（46 条 assert）+ test/test-tools.sh（mkdarts/darts CLI，cmp correct-dic/correct-result 字节比对）"

# 上游 2 个测试 = test-darts（46 条 assert 自检）+ test-tools.sh
# （2 个 exit 检查 + 2 处 cmp 字节比对）= 50 个判定点
upstream_test_count: 50
upstream_test_cases_skipped: 0
