# 版本级 manifest — dropbear 2025.88
# 文件位置: archives/d/dropbear/2025.88/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2025.88"

# 软件名
software: "dropbear"

# 编译状态
# published | built | failed | archived
# built: 设备构建与要求验证通过; release upload 尚未确认（口径见 workflow 第 13 节）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方发布目录）
  url: "https://matt.ucc.asn.au/dropbear/releases/dropbear-2025.88.tar.bz2"

  # 源码校验和（设备下载后 sha256sum 自验一致）
  sha256: "783f50ea27b17c16da89578fafdb6decfa44bb8f6590e5698a4e4d3672dc53d4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-zlib"
    - "--build=aarch64-unknown-linux-musl"
    - "--host=aarch64-unknown-linux-musl"

  # 编译依赖列表（格式: name/version）; libtomcrypt/libtommath 为源码自包含
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（描述文本不含逗号）
patches_applied:
  - "0001-src-cli-auth-getpass.patch: getpass_or_cancel 按 HAVE_GETPASS 条件编译并以 /dev/tty 逐行读取为 fallback"
  - "0002-src-common-session-getspnam.patch: shadow 密码处理按 HAVE_GETSPNAM 条件编译并以无有效 shadow 条目 fallback"
  - "0003-configure-umask.patch: AS_TMPDIR 临时目录 umask 077 改 022 适配 HMDFS 目录权限语义"

# ============================================================
# 上游测试统计（2026-09-06 设备实测）
# ============================================================

# 统计单位: pytest 用例/参数化实例（grep -E "PASSED|FAILED|SKIPPED|XFAIL" -v 日志分列计数）
# TOTAL=52 PASS=9 FAIL=39 SKIP=3 XFAIL=1 NOT_RUN=0
# 39 例 FAIL 两类根因均为设备环境限制而非代码缺陷:
#   25 例认证会话不可行（当前 uid 不在 /etc/passwd; 全部条目 pw_dir 空 + shell /bin/false;
#      非 root dropbear 仅允许 pw_uid == euid 登录, svr-auth.c checkusername）
#   14 例 from_openssh 的 comment 附带比较失配（getpwuid 失败致 ssh-keygen 与
#      dropbearkey fallback 分叉; 密钥本体一致且 7/7 roundtrip 通过）
# 9 例 PASS 中 2 例为空数据连接级用例; 3 例 SKIP 为上游 CI-only 环境门
# （DBTEST_IN_ACTION）; 1 例 XFAIL 为上游标记 Not yet implemented。
# 发布 tarball 的 make check lint 段存在上游打包缺陷（引用顶层 ./dropbear_lint.sh
# 而脚本在 src/ 下）; lint 等价执行通过（cd src && sh dropbear_lint.sh, rc=0）。
upstream_tests:
  total: 52
  passed: 9
  failed: 39
  skipped: 3
  xfailed: 1
  not_run: 0
  command: "pytest --hostkey=fakekey --dbclient=../dbclient --dropbear=../dropbear --basetemp=<fresh> -p no:cacheprovider -v . （等价上游 make -C test 的 venv pytest 段）"
  log: "reports/upstream-test-run2.log"

# test_package（消费者冒烟; 独立于上游用例数分栏统计）
test_package:
  command: "conan test（sh test_dropbear.sh; env=conanrun）"
  result: "全部通过（tp1-tp4 共 10 处断言）"
  log: "reports/"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（行内 knowledge_ref 引用知识库条目）
knowledge_gained:
  - "autoconf AS_TMPDIR 的 umask 077 在 HMDFS 产生 0700 组位缺失目录使 config.status 写入失败; 补丁改 022 并确认 Makefile.in 无 configure 再生成规则避免回滚"  # knowledge_ref: E011
  - "OHOS sysroot 有 shadow.h 与 struct spwd 但 libc 无 getspnam 导出符号; HAVE_SHADOW_H 成立不等于 getspnam 可用"  # knowledge_ref: E206
  - "OHOS getpwuid 对当前 uid 失败时 ssh-keygen 公钥 comment fallback 写 100@host 而 dropbearkey 写 @host; 依赖 comment 一致性的上游断言在此类平台失配"  # knowledge_ref: E547（draft 待审）

# patch_generation 元数据（本版本为手工 GNU diff 精确生成并经 patch_ng 全量应用验证）
patch_generation:
  method: manual-gnu-diff
  source_orig_dir: /storage/Users/currentUser/builds/dropbear-2025.88.orig
  source_work_dir: /storage/Users/currentUser/builds/dropbear-2025.88.work
  generated_at: '2026-09-06T12:30:00'
  patches_count: 3
