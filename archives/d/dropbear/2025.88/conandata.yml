    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask.patch"
    patch_description: "AS_TMPDIR 临时目录 umask 077 改 022 (HMDFS 拒绝 0700 组位缺失目录写入; 知识 E011/E136/E206; btparse 同款补丁先例)"
    patch_type: "portability"
