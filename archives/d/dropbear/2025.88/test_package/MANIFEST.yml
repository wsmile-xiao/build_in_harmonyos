# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）。

package: dropbear/2025.88
homepage: https://matt.ucc.asn.au/dropbear/dropbear.html

# 上游 make check = lint + pytest 两段（Makefile.in:289-294）。
upstream_check_command: "make check"

# 上游 test/Makefile 的 venv 目标在 HMDFS 上不可用（python3 -m venv +
# pip install 卡死，2026-06 首次适配与本轮均实测），故 CI 门禁未接入
# 上游测试。本轮适配已在设备上以等价方式真实执行上游套件并逐类归因，
# 完整证据见 archives/d/dropbear/2025.88/notes.md 与 reports/。
#
# 等价执行（绕过 venv，使用全局 python3 + pytest 9.1.1 + asyncssh 2.17.0）:
#   cd test && pytest --hostkey=fakekey --dbclient=../dbclient \
#     --dropbear=../dropbear --basetemp=<fresh-dir> -p no:cacheprovider -v .
# lint 段等价执行: cd src && sh dropbear_lint.sh（通过，rc=0）。
# 注意: 发布 tarball 的 Makefile.in:290 引用顶层 ./dropbear_lint.sh，
# 而脚本实际位于 src/ 下（上游打包缺陷），逐字 `make check` 的 lint 段
# 必然失败，与包适配无关。
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游测试统计（2026-09-06 设备实测，统计单位: pytest 用例/参数化实例;
# 取数: grep -E "PASSED|FAILED|SKIPPED|XFAIL" <pytest -v 日志> 分列计数）:
#   TOTAL=52  PASS=9  FAIL=39  SKIP=3  XFAIL=1  NOT_RUN=0
#
# 39 个 FAIL 的两类根因（均附设备证据，非代码缺陷）:
#   a) 25 例（test_channels 23 + test_aslr 1 + test_concurrent 1）:
#      认证会话在本机平台性不可行 —— 当前 uid 20020084 不在 /etc/passwd
#      （getpwuid 失败, dbclient "failed to identify current user"），
#      /etc/passwd 全部条目 pw_dir 为空且 shell 为 /bin/false，非 root
#      dropbear 仅允许 pw_uid == 服务器 euid 的用户登录
#      （src/svr-auth.c checkusername），普通权限无法补充用户条目。
#      服务端日志证据: "Login attempt for nonexistent user"。
#   b) 14 例（test_dropbearconvert::test_from_openssh 全部参数化）:
#      上游断言比较整行公钥（含 comment，上游注释自认 "since it
#      currently matches" 属附带比较）。本机 getpwuid 失败导致两个工具
#      fallback 分叉: ssh-keygen 写 "100@localhost"，dropbearkey -y 的
#      fallback（src/dropbearkey.c:411）输出 "@localhost"。密钥本体
#      转换正确: 断言 diff 中 base64 完全一致，fingerprint 一致，
#      且 7/7 test_roundtrip（含逐字节往返比较）全部通过。
# 9 个 PASS 中 2 例（test_roundtrip[0]/test_read_pty[0]）为空输入空
# 输出的连接级用例，在本机仅覆盖到连接建立/断开路径（认证不可达）。
# 3 个 SKIP 为上游框架自身条件（DBTEST_IN_ACTION 仅上游 CI 设置）。
# 1 个 XFAIL 为上游标记 strict 的 "Not yet implemented" 用例。

# 代表性上游测试
upstream_tests:
  - file: test/test_dropbear.py
    source: dropbear-2025.88.tar.bz2/test/test_dropbear.py
    description: "dropbear 服务器连接/认证集成测试（依赖 Unix 登录基础设施）"
    command: "pytest test/"
  - file: test/test_dropbearconvert.py
    source: dropbear-2025.88.tar.bz2/test/test_dropbearconvert.py
    description: "dropbearconvert 密钥格式转换测试（21 例: roundtrip 7 通过; from_openssh 14 因用户名无法解析的 comment 附带比较失败）"
    command: "pytest test/"
  - file: test/test_channels.py
    source: dropbear-2025.88.tar.bz2/test/test_channels.py
    description: "通道边界测试（依赖认证会话，本机平台性不可行）"
    command: "pytest test/"

# test_package 自带测试（消费者视角，独立于上游用例数）
test_package_tests:
  - file: test_dropbear.sh
    description: "四个打包产物存在; dropbearkey 生成 ed25519 并导出公钥; dropbearconvert 双向转换往返逐字节一致; 三个工具 usage 退出码为 0"
    command: "sh test_dropbear.sh <package_folder> <scratch_dir>"

# test_package 断言计数: tp1 存在性 1 组(4 文件) + tp2 密钥生成 2(退出码+非空)
# + 公钥导出 grep 1 + tp3 转换 2(两次退出码) + cmp 1 + tp4 usage 3 = 10 处断言
assertion_count: 10
