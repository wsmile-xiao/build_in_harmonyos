software: dropbear
display: "dropbear"
description: "轻量级 SSH2 服务器/客户端套件（dropbear、dbclient、dropbearkey、dropbearconvert），自包含 libtomcrypt/libtommath"
category: network
homepage: "https://matt.ucc.asn.au/dropbear/dropbear.html"
license: "MIT-style (dropbear); bundled libtomcrypt/libtommath under their own licenses"
build_system: autotools

ohos_adaptation:
  key_points:
    - "autoconf AS_TMPDIR 的 umask 077 在 HMDFS 上产生 0700 组位缺失目录导致 config.status 写入失败，补丁改 022（知识 E011/E136/E206，btparse 同款先例）"
    - "OHOS libc 无 getpass()/getspnam()（shadow.h 存在但无实现）；按 HAVE_GETPASS/HAVE_GETSPNAM 特性条件编译并提供等价 fallback"
    - "显式 --build/--host=aarch64-unknown-linux-musl 跳过 config.guess 的 HMDFS 不兼容 mktemp 探测（自带 config.sub 拒收 ohos 三元组）"
    - "zlib 按 --disable-zlib 显式关闭，避免 configure auto 探测链接未声明的系统 libz"
    - "上游测试需 Unix 登录基础设施（passwd 条目+主目录+合法 shell），OHOS 设备单端环境平台性不可行，已逐类归因（见版本级 manifest 与 notes.md）"
  common_dependencies: []

versions:
  "2025.88":
    status: built
    build_date: "2026-09-06"
