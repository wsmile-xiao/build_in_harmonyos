# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: debug_assert/1.3.0
homepage: "https://github.com/foonathan/debug_assert"

# 上游无 CTest/独立测试框架；上游自带 example.cpp（含必失败断言，不可直接复用）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序：无（header-only 单头文件，无库级测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/example.cpp
    description: "Consumer smoke test: DEBUG_ASSERT 通过性断言 + default_handler/set_level + 自定义 handler 模块"
    command: "./example"

assertion_count: 4