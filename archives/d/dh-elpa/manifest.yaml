software: dh-elpa
display: "dh-elpa"
description: "debhelper 插件——将 Emacs Lisp（ELPA 风格）包安装进包构建目录并按需字节编译（纯 Perl）"
category: dev-tool
homepage: "https://salsa.debian.org/emacsen-team/dh-elpa"
license: GPL-3.0-or-later
build_system: "none (pure Perl script packaging)"
compile_date: "2026-09-13"

ohos_adaptation:
  key_points:
    - "pure Perl debhelper 插件——零编译（download + tar -xJf + cp -a 收拢，build() 仅 pod2man 生成 man 页）"
    - "package() 挑文件安装: bin/dh_elpa + bin/dh_elpa_test + Sequence/elpa.pm + debhelper 模板 + lib/dh-elpa/ + dh-elpa.el"
    - "dh_elpa 安装器即 emacs -batch + dh-elpa.el——emacs 是硬性运行时依赖"
    - "Module::Metadata 为 perl 核心双寿命模块（5.13.9+ 随 perl core 分发），无需 conan 依赖"
    - "补丁 0001: DH_ELPA_TEMPLATEDIR 环境变量覆盖模板目录——conan 包布局无 /usr 根，字节编译模式可用"
  common_dependencies:
    - debhelper
    - dpkg
    - perl-config-tiny
    - emacs

versions:
  "2.2.0":
    status: built
    build_date: "2026-09-13"
