# 版本级 manifest — dh-elpa 2.2.0
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "2.2.0"

# 软件名
software: dh-elpa

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-13"
build_system: none (pure Perl script packaging)

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/d/dh-elpa/dh-elpa_2.2.0.tar.xz"

  # 源码校验和（与 dh-elpa_2.2.0.dsc Checksums-Sha256 核对一致）
  sha256: "4d448416d1d3458b20fb9abcc194ae410e8f3910129194bd35126ce2b8fd5154"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: none (pure Perl script packaging)

  # 配置选项列表（无 configure——零编译；build() 仅 pod2man 生成 man 页）
  configure_options: []

  # 运行时依赖列表（格式: name/version）
  # Module::Metadata 为 perl 核心双寿命模块（5.13.9 起随 perl core 分发），
  # 由系统 perl 提供，不在 conan requires 内
  # ncurses/6.5 为 override=True 依赖图冲突消解（emacs 6.5 vs dpkg 6.4）
  dependencies:
    - debhelper/13.3.4
    - dpkg/1.23.7
    - perl-config-tiny/2.30
    - emacs/29.1
    - ncurses/6.5 (override)

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - 0001-ohos-templatedir-env-override.patch
  - 0002-emacs29-lm-package-requires-compat.patch

# ============================================================
# 知识沉淀
# ============================================================

# 适配中学到的知识
knowledge_gained:
  - category: L2
    content: "dh-elpa 是 debhelper 的 dh_* 插件（纯 Perl）——零编译，download + tar -xJf --no-same-owner + cp -a 收拢，package() 挑文件安装（bin/ + share/perl5/ + share/debhelper 模板 + lib/dh-elpa/ + share/emacs/site-lisp/elpa/）"
    reason: "dh-elpa 无 C 代码、无 configure；build() 仅用 pod2man 生成 dh_elpa.1/dh_elpa_test.1（上游 debian/rules 同款命令）"
  - category: L2
    content: "dh_elpa 的安装器就是 emacs -batch + dh-elpa.el（dhelpa-batch-install-file/directory），即使 --no-byte-compile 也必须运行 emacs——emacs 是硬性运行时依赖而非可选"
    reason: "源码 dh_elpa L312-344：单文件与多文件两条路径都无条件 doit_quietly(emacs -batch ...)，BYTECOMPILE 标志只影响 elpa/elpa-src 目录与 helper 脚本生成"
  - category: L2
    content: "上游 $templatedir 硬编码 /usr/share/debhelper/dh_elpa/emacsen-common——conan 包布局无 /usr 根，字节编译模式的 emacsen-common helper 脚本生成会失败；补丁 0001 增加 DH_ELPA_TEMPLATEDIR 环境变量覆盖（默认保持 Debian 行为，与 dh 自身的 DH_AUTOSCRIPTDIR 模式同构）"
    reason: "maybe_install_helper 读 $templatedir 做 sed_file 模板替换；补丁让沙箱内字节编译 + helper 生成可用"
  - category: L2
    content: "elpa.pm 的 Module::Metadata 是 perl 核心双寿命模块（5.13.9 起随 perl core 分发），无需 conan 依赖——制品仓检索 perl-module-metadata/* 为空（仓库 1.000038 条目为无 conanfile 的旧格式），不得谎报依赖；Config::Tiny 则确需 perl-config-tiny/2.30（在仓）"
    reason: "v2/conans/search API 实测：perl-module-metadata 返回空 results；perl-config-tiny/2.30、emacs/29.1、debhelper/13.3.4、dpkg/1.23.7 均在仓"
  - category: L2
    content: "CI 实测依赖图冲突——emacs/29.1 固定 ncurses/6.5、dpkg/1.23.7 固定 ncurses/6.4（conan create 报 Version conflict，冲突源自 emacs/29.1）——consumer 侧 self.requires('ncurses/6.5', override=True) 统一到 6.5（仓库标准模式，100+ 先例）；反向统一需从源码重编 emacs，代价远大于以 6.5 重编 dpkg（dpkg 的 ncurses 仅 update-alternatives 界面用，配方已 --without-dselect）"
    reason: "CI build #51051 conan create 失败日志：ERROR: Version conflict: Conflict between ncurses/6.5 and ncurses/6.4 in the graph. Conflict originates from emacs/29.1"
  - category: L2
    content: "dh_elpa_test 的 ERT/Buttercup 测试运行模式依赖 File::Find::Rule / Array::Utils / Text::Glob / Debian::Control 四个 Perl 模块，均不在 ohpcd 制品仓——dh_elpa 主安装路径不受影响，但 dh --with elpa 序列的测试步骤受限，如实记录不伪造"
    reason: "dh_elpa_test L194-200 use 上述模块；制品仓与仓库检索均无对应条目"
  - category: L2
    content: "上游 dh-elpa 2.2.0 声明 emacs >= 1:30.1，制品仓仅 29.1——逐符号源码核对后确认 dh-elpa.el 只用到一个 Emacs 30 独有 API `lm-package-requires`（lisp-mnt 新增），其余 API 在 29.1 均可用；补丁 0002 按 Emacs 30 源码 backport 该函数 + 其依赖 `lm--prepare-package-dependencies`（fboundp 守卫，Emacs>=30 为 no-op），使配方可在 29.1 运行"
    reason: "CI build #51320/#52239：dh_elpa 内部 emacs 命令 exit 255（doit_quietly 吞 stderr）；对照 emacs-mirror tag emacs-29.1 与 emacs-30 的 lisp-mnt.el 源码确认函数缺失。其余 API（copy-package-desc/package-desc-from-define/package--make-autoloads-and-stuff 等）核对 29.1 package.el 均有"
  - category: L2
    content: "dh_elpa 内部用 `emacs -batch -Q -l package`（加载 package.el）——emacs 包 runenv 只导出单目录 EMACSLOADPATH=<pkg>/share/emacs/29.1/lisp，而 -Q 隐含 --no-site-lisp，需在测试/消费侧把 lisp 的子目录一并加入 EMACSLOADPATH 否则 emacs 找不到 package（exit 255）"
    reason: "CI build #51320 实测；补齐后 probe `emacs -l package` exit=0"
  - category: L2
    content: "上游 Build-Depends/DEP-8 要求 emacs >= 1:30.1，制品仓最新为 emacs/29.1——dh_elpa 实际使用的 package.el API 在 29.x 稳定存在，按仓库惯例 requires emacs/29.1 并在 notes 记录版本偏差"
    reason: "deb.dsc Build-Depends: emacs-nox (>= 1:30.1) | emacs (>= 1:30.1)；registry 只有 emacs/29.1"
