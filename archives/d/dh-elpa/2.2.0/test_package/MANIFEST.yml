# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dh-elpa/2.2.0
homepage: "https://salsa.debian.org/emacsen-team/dh-elpa"

# 上游测试命令
# 上游有 DEP-8 autopkgtest（Testsuite: autopkgtest）共 1 项：
# build-deb——用 dpkg-buildpackage 构建示例 elpa 包（debian/tests/elpa-test/
# 是该项的夹具目录，非独立测试）并校验 ${elpa:Depends}。需 Debian 打包环境
# （build-essential/dpkg/dpkg-dev/emacs-nox）——OHOS 沙箱无此环境不可运行，
# 如实申报（R51）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - name: autopkgtest build-deb
    count: "1"
    description: "DEP-8 测试：dpkg-buildpackage 构建 debian/tests/elpa-test 示例包（夹具 all.el）并 grep Depends 校验 dh-elpa-helper（debian/tests/build-deb:1-12）——依赖 build-essential/dpkg/dpkg-dev/emacs-nox，OHOS 沙箱无 Debian 打包环境，不可运行"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_dh_elpa.py
    description: "R1 文件存在断言（bin×2 + Sequence/elpa.pm + emacsen-common 模板×3 + prerm-elpa + lib/dh-elpa×2 + dh-elpa.el，10 断言；man 页存在则 +1 条件断言）+ R2 perl -c（dh_elpa + elpa.pm，2 硬断言；dh_elpa_test 依赖模块齐备则 +1，否则 SMOKE-NOTE 受限说明）+ R3 功能冒烟 --no-byte-compile（emacs 安装器装入 .el + 生成 -pkg.el，2 断言）+ R4 字节编译冒烟（helper 脚本生成 + substvars misc:Depends，2 断言；构建期不产 .elc——字节编译由 helper 在消费机安装时执行；autoscript 阶段受阻如实 SMOKE-NOTE）"
    command: "python3 test_dh_elpa.py <package> <dep_packages...>"

assertion_count: 17
