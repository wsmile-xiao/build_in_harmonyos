# test_package/MANIFEST.yml — devio 1.2
package: devio/1.2
homepage: "https://launchpad.net/ubuntu/+source/devio"

# 上游无独立测试套件（2005 年单 .c 工具，仅 autotools 框架）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（验证 devio binary 可执行 + 输出含 usage 关键字）
test_package_tests:
  - file: test_devio.c
    description: "消费者测试 3 条：devio 存在/可执行；真实执行有输出；输出含 usage/read/write 关键字（popen 直读，不写 /tmp）"
    command: "test_devio"

# 测试断言总数
assertion_count: 4
