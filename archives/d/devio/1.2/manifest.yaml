software: devio
display: "devio"
description: "dd-like block device read/write tool (MTD-friendly), MIT, John Bowler 2005"
category: system
homepage: "https://launchpad.net/ubuntu/+source/devio"
license: MIT
build_system: custom  # autotools 框架存在但 conanfile 直驱 clang，避开跨编译

ohos_adaptation:
  key_points:
    - "单 .c 文件 + autotools 框架（configure/Makefile.in），conan 直驱 clang 编译"
    - "devio.c 不依赖 config.h.in 的 HAVE_* 宏，可跳过 autogen + configure 直接编译"
    - "无外部库依赖（仅 libc：fcntl/unistd/stdlib/stdio/string/errno）"
    - "musl 全支持，无 patch"
    - "编译产出单可执行文件 bin/devio (约 30KB stripped)"
  common_dependencies:
    - libc (fcntl/unistd/stdlib/stdio/string/errno)
    - mtd/block 设备节点（运行时需要）

versions:
  "1.2":
    status: built
    build_date: "2026-09-09"
    source_url: "https://launchpad.net/ubuntu/+archive/primary/+sourcefiles/devio/1.2-3build1/devio_1.2.orig.tar.gz"
    source_sha256: "A71E87F49F52CD90DBD45431F65E83D18E073FB2669F91C29C59019B175CD5A8"
