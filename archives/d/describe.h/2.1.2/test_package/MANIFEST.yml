# test_package/MANIFEST.yml — describe.h 2.1.2
package: describe.h/2.1.2
homepage: "https://github.com/stephenmathieson/describe.h"

# 上游测试命令: 上游仅有 Makefile 的 default 目标（构建 example 并运行）
upstream_check_command: "make"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（example.c 为上游样例/BDD 测试入口）
upstream_tests:
  - file: example.c
    source: describe.h-2.1.2/example.c
    description: "上游样例：4 个 it() BDD 用例（3 通过 + 1 个 assert(0==12) 上游故意失败演示）"
    command: "./example"

# test_package 自身测试（消费者视角验证，真实调用 describe.h API）
test_package_tests:
  - file: test.c
    description: "describe/it BDD 宏 + assert_* 宏族 + assert_failures() 计数验证"
    command: "./test_describe.h"

# 测试断言总数（test_package 内断言宏数量: 1+1+7+1 计数检查 = 10）
assertion_count: 10