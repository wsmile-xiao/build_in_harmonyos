# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: daw_utf_range/2.2.6
homepage: "https://github.com/beached/utf_range"

upstream_check_command: "ctest -N"

upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: DAW_ENABLE_TESTING=ON 时构建 tests/ 下 2 个测试可执行文件（add_test 注册 2 项）
# 注1: daw_utf_string 测试的 add_test COMMAND 引用 daw_utf_range（上游 CMakeLists.txt 原样保留）
# 注2: daw_utf_string 源码 4 个测试函数中 utf_string_sort_001 因上游 sort() 缺陷必然失败
#      （to_u32string 后重复 std::copy 追加致 size 翻倍断言失败，非适配问题，详见 notes.md）
upstream_tests:
  - file: tests/daw_utf_range_test.cpp
    source: utf_range-2.2.6/tests/daw_utf_range_test.cpp
    description: "char_range UTF-8 码点遍历测试（西里尔/天城体/希伯来多文种文本）— PASS"
    command: "ctest -R daw_utf_range_test"
  - file: tests/daw_utf_string_test.cpp
    source: utf_range-2.2.6/tests/daw_utf_string_test.cpp
    description: "utf_string 构造/比较/排序测试 — 部分通过（前 2 函数 PASS；sort_001/002 因上游 sort() 缺陷 FAIL，豁免理由见 notes.md）"
    command: "ctest -R daw_utf_string"

test_package_tests:
  - file: test_daw_utf_range.cpp
    description: "消费者测试: 验证 daw_utf_range 库链接、char_range/utf_string/utf8 迭代核心 API"
    command: "./test_daw_utf_range"

assertion_count: 5
