# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dmc_unrar/1.8.0
homepage: "https://github.com/DrMcCoy/dmc_unrar"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 v1.8.0 tag 仅含 4 个文件（COPYING / README.md / dmc_unrar.c / example.c），
# 无 configure/make/CMake、无任何测试目录或测试注册（audit 见 notes.md）。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 — 上游未提供测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >-
      消费者用例：写入内嵌 RAR5 夹具，调用 dmc_unrar_is_rar_path /
      dmc_unrar_archive_init / dmc_unrar_archive_open_path /
      dmc_unrar_get_file_count / dmc_unrar_get_file_stat /
      dmc_unrar_get_filename / dmc_unrar_extract_file_to_path 打开、
      枚举并解压 2 个 2048 字节文件，校验解压产物大小。