# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.8.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.0"

# 软件名
software: "dmc_unrar"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/DrMcCoy/dmc_unrar"

  # 源码校验和
  sha256: "9800526d85f0ec03a345879b0d4ca3f1e87169ddb8be518b858b31faf60ab7ae"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "stb 风格单文件 C 库（无构建系统）：conan 配方用 custom 直编路径，conf 取编译器（R33），basic_layout 下 build() 须用 source_folder 绝对路径"
  - "HMDFS inode 耗尽（48.45M 上限）：大仓 77k 文件全量检出失败 ENOSPC，sparse-checkout cone 模式按需映射顶层目录可规避"
  - "github.com 主站不可达时，codeload.github.com（官方归档 CDN）与 api.github.com 可用；tarball SHA-256 确定性可预验证"
  - "conan 源下载缓存按 sha256 键控（core.sources:download_cache/s/<sha256>），预置 tarball 可离线跑通 conan create"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
