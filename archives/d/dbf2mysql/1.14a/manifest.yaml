version: "1.14a"
software: "dbf2mysql"
status: built
build_date: "2026-09-12"
build_system: makefile
package_type: application

source:
  url: "https://deb.debian.org/debian/pool/main/d/dbf2mysql/dbf2mysql_1.14a.orig.tar.gz"
  sha256: "34a1865308d38e52244646ddf9e82d77b56de37361be73ec166c61620bb6e2f6"
  tar_format: tar.gz
  hosting_exception: "PF7: upstream SourceForge directs users to CVS and labels its releases bogus; the official CVS snapshot is an RCS repository that the archive builder cannot consume, so Debian's pristine orig tarball is used."

build:
  system: makefile
  configure_options:
    - "VERSION=1.14a"
    - "EXTRALIBS=-lmariadb -lm"
  dependencies:
    - mariadb-connector-c/3.4.8
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-use-mysql-real-connect.patch"

knowledge_gained:
  - "The 1.14a source uses the removed mysql_connect API; MariaDB Connector/C requires mysql_init followed by mysql_real_connect."
  - "The upstream Makefile has no automated test target, so package validation uses explicit consumer tests for both installed tools."
  - "The SourceForge CVS code snapshot is an RCS repository rather than a buildable source checkout; the Debian pristine orig tarball is used under the documented PF7 hosting exception."
