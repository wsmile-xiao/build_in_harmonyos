name: dbf2mysql
description: Convert between xBase DBF files and MySQL-compatible databases.
category: database
license: Public-Domain
homepage: https://dbf2mysql.sourceforge.net/
build_system: makefile
ohos_adaptation:
  key_points:
    - "Replace the removed mysql_connect API with mysql_init plus mysql_real_connect."
    - "Build both command-line tools with the OHOS Clang toolchain."
  common_dependencies:
    - mariadb-connector-c
versions:
  1.14a:
    status: built
    configure_options: []
    build_system: makefile
    dependencies:
    - mariadb-connector-c/3.4.8
