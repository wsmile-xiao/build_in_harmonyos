knowledge_gained:
  - "上游 makefile 写死 CC= gcc；make 命令行赋值优先级更高，配方 make CC=<clang> 即可覆盖，无需为该点打补丁"
  - "2016 年旧 C 代码在头文件里直接定义全局变量，靠编译器默认 -fcommon 合并 tentative definition；clang 15 默认 -fno-common 时每个包含该头的 TU 都产出强符号 → duplicate symbol。正解（知识库 DRAFT-clang-fno-common-header-globals）：头文件只保留 extern 声明，把定义集中到单一 .c（本包为 ddru_ntfscommon.c），不使用 -fcommon 兜底"

