# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: ddrutility/2.8
homepage: "https://ddrutility.sourceforge.net/"

# ── 上游测试：如实申报 N=0 ──────────────────────────────────────────
# 清点证据（2026-09-16，源码树 ddrutility-2.8 逐项核实）：
#   1) tarball 无 tests/ 或 test/ 目录（31 个文件中无任何测试目录）；
#   2) makefile 只有目标 all / ddrutility / ddru_ntfsbitmap /
#      ddru_ntfsfindbad / ddru_diskutility / clean / install / uninstall，
#      grep '^check\|^test' makefile 无命中（无 check/test 目标）；
#   3) 全源码树无 test_*.c / *_test.c / *.t 等测试源文件，无 ctest/pytest 注册。
# 故 N = 0，上游无测试用例可运行。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests_total: 0
upstream_tests_passed: 0
upstream_tests_skipped_reason: "上游 ddrutility 2.8 无测试套件：tarball 无 tests/ 目录、makefile 无 check/test 目标、全树无测试源文件（已逐项核实）"

upstream_tests: []

# ── 适配后补全的测试（鸿蒙特有，全部为新增）────────────────────────
# test.sh 以消费者身份实执行包内 bin/ 下 5 个交付程序：10 项 --version/--help
# 执行断言 + 3 项非法输入边界断言（证明程序真实解析参数与输入数据）。
test_package_tests:
  - file: test.sh
    description: "5 个交付程序的 --version/--help 实执行（A1-A10）+ 3 项非法输入边界断言（A11-A13）"
    command: "bash test.sh <bindir>"

# 测试断言总数（与 test.sh 内 PASS/FAIL 计数一致）
assertion_count: 13
