# 软件级 manifest — ddrutility
# 文件位置: archives/d/ddrutility/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: ddrutility
display: "ddrutility"
description: "配合 GNU ddrescue 使用的数据恢复工具集：坏道相关文件定位、NTFS 位图导出、磁盘直通命令工具"
category: utility
homepage: "https://ddrutility.sourceforge.net/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 makefile 写死 CC= gcc；配方用 make CC=<clang> 覆盖（命令行赋值优先），不引入源码补丁"
    - "旧 C 代码全局变量在头文件直接定义，clang 15 默认 -fno-common 会 duplicate symbol；正解为头文件改 extern + ddru_ntfscommon.c 单一定义（patches/0001+0002），不用 -fcommon"
    - "ddru_findbad 为 POSIX sh 脚本，OHOS /bin/sh(mksh) 可直接执行；不改 shebang"
  common_dependencies: []

versions:
  "2.8":
    status: built
    build_date: "2026-09-16"
