software: debsigs
display: "debsigs"
description: "Debian .deb 软件包签名管理工具（纯 Perl 脚本）"
category: system
homepage: "https://gitlab.com/debsigs/debsigs"
license: GPL-2.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Perl 工具，无编译：脚本装入 bin/，模块装入 lib/perl5/Debian/debsigs/"
    - "沙箱下用 download()+tar --no-same-owner 代替 get()（debhelper/dpkg 同模式）"
    - "上游 perl/test.pl（Test::More 4 用例）在 build() 中实际运行"
  common_dependencies: []

versions:
