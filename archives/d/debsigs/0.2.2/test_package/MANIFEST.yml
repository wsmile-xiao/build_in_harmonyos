package: debsigs/0.2.2
homepage: "https://gitlab.com/debsigs/debsigs"

upstream_check_command: "perl test.pl"
upstream_test_in_build: true
upstream_test_command: "perl test.pl"

upstream_tests:
  - file: perl/test.pl
    source: debsigs_0.2.2.orig.tar.xz/perl/test.pl
    description: "上游 Test::More 模块加载测试（4 用例：arf/debsigsmain/forktools/gpg）"
    command: "perl test.pl"
  - file: python/tests/testsigs/unit/test_*.py
    source: debsigs_0.2.2.orig.tar.xz/python/tests/testsigs/unit/
    description: "上游 pytest 功能测试（6 用例：autosign/list+sign/ features/installer/signchanges，需 gnupg+debsig-verify+sqop，OHOS 未运行，见补充说明）"
    command: ""

test_package_tests:
  - file: test_debsigs.py
    description: "R34：执行真实 debsigs 二进制（--version 横幅 + --features 与版本一致）"
    command: "python3 test_debsigs.py <package>"

assertion_count: 2
