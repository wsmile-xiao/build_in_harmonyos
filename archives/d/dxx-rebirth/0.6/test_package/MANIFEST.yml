package: dxx-rebirth/0.6
homepage: https://github.com/dxx-rebirth/dxx-rebirth

upstream_check_command: "none (upstream 0.60.0-beta2 has no standalone test suite)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests: []

test_package_tests:
  - file: test_commands.py
    description: "Run the installed d1x-rebirth help interface"
    command: "python3 test_commands.py <package>/usr/bin"
  - file: test_commands.py
    description: "Run the installed d2x-rebirth help interface"
    command: "python3 test_commands.py <package>/usr/bin"
  - file: test_sdl_runtime.c
    description: "Initialize the OHOS SDL video path, render and flip a software surface, and round-trip an input event"
    command: "SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./test_sdl_runtime"

assertion_count: 3
