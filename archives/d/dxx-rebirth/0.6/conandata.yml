sources:
  url: "https://github.com/dxx-rebirth/dxx-rebirth/archive/refs/tags/0.60.0-beta2.tar.gz"
  sha256: "1e684f98c3f2e44407617dd014964d73637d1f6893327b583f282da944227c6a"
patches:
  - patch_file: "patches/0001-fix-python3-file-lists.patch"
    patch_description: "Backport upstream Python 3 file-list parsing fix"
    patch_type: "backport"
  - patch_file: "patches/0002-fix-python3-dictionary-api.patch"
    patch_description: "Backport upstream Python 3 dictionary API compatibility"
    patch_type: "backport"
  - patch_file: "patches/0003-fix-python3-environment-keys.patch"
    patch_description: "Backport upstream Python 3 environment key handling"
    patch_type: "backport"
  - patch_file: "patches/0004-fix-python3-filter-api.patch"
    patch_description: "Backport upstream Python 3 filter compatibility"
    patch_type: "backport"
  - patch_file: "patches/0005-fix-python3-bytes-strings.patch"
    patch_description: "Backport upstream Python 3 bytes/string compatibility"
    patch_type: "backport"
  - patch_file: "patches/0006-fix-python3-pch-initialization.patch"
    patch_description: "Backport upstream Python 3 PCH initialization fix"
    patch_type: "backport"
  - patch_file: "patches/0007-use-native-static-assert.patch"
    patch_description: "Avoid overriding the native C++ static_assert keyword on OHOS libc++"
    patch_type: "portability"
  - patch_file: "patches/0008-use-policy-static-constants.patch"
    patch_description: "Read static policy constants from their types for Clang compatibility"
    patch_type: "portability"
  - patch_file: "patches/0009-fix-clang-protected-access.patch"
    patch_description: "Backport upstream Clang protected-access fix"
    patch_type: "backport"
  - patch_file: "patches/0010-accept-ohos-host-platform.patch"
    patch_description: "Accept OHOS as a POSIX SCons host platform and use its system shell"
    patch_type: "portability"
