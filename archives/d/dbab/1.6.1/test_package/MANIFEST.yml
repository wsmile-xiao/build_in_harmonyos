# test_package/MANIFEST.yml — dbab 1.6.1
# CI L0e requires this file to exist.
package: dbab/1.6.1
homepage: "https://github.com/suntong/dbab"

# Upstream ships NO test suite (see upstream_test_audit below):
# the 24-file release tarball has no tests/ or t/ directory and the
# Makefile provides only man/clean/install targets (no check/test).
# NOTE: the two command fields below must stay null/empty. preflight treats any
# non-empty value (even a "no tests" placeholder sentence) as expected tests.
upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: null
upstream_tests_exist: false
upstream_test_audit: "Audited tag tarball 1.6.1 (15062 bytes, 24 entries,
  root dbab-1.6.1/) and the matching git tag tree (api.github.com file
  listing, 30 blobs/trees): top level holds LICENSE, Makefile, README.md,
  dbab.md plus bin/ (5 tool scripts: dbab-svr, dbab-get-list, dbab-add-list,
  dbab-chk-list, dhcp-add-wpad) and assets/ (configs, man pages, systemd
  unit) only; no tests/, t/, testsuite/ directories and no *test* files
  anywhere (case-insensitive full-tree scan). Makefile targets are man
  (needs ronn: cat README.md | ronn), clean and install -- no check/test
  target. Upstream CI: none (.github/ holds nfpms packaging config
  dbab.yaml, Debian postinst dbab-get-list/dbab-add-list, and a
  release-only workflow). Debian autopkgtest: none declared."
upstream_tests: []

# test_package tests (consumer perspective, all offline, no root needed)
test_package_tests:
  - file: test.sh
    description: "5 script presence+exec checks, 4 bash -n syntax checks, 3 offline transform-fixture checks (add-list sed, chk-list grep, get-list filter+rewrite), 1 dbab-svr payload check"
    command: "bash test.sh"

# Assertion count: 13 shell assertions in test.sh (each failure exits 1);
# test() in conanfile.py additionally asserts 9 packaged files exist.
assertion_count: 13
