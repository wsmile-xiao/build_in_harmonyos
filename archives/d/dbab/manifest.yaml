software: dbab
display: "dbab"
description: "dnsmasq-based ad-blocking using pixelserv (shell/Perl tools)"
category: network
homepage: "https://github.com/suntong/dbab"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "Pure shell/Perl scripts, no compilation; install-only Makefile"
    - "Upstream make install needs ronn-generated man page and /usr/bin/install; recipe copies files directly instead"
    - "Upstream sbin/ layout relocated to Conan bin/; configs to etc/dbab/"
  common_dependencies: []

versions:
