package: devcontainer/0.87.0
homepage: "https://github.com/devcontainers/cli"

upstream_test_command: "npm test"
upstream_test_in_build: false
upstream_tests:
  - name: mocha-unit
    source: "src/test/*.test.ts"
    case_basis: "TypeScript unit tests run via mocha, covering spec API, config parsing, features CLI"
  - name: mocha-features
    source: "src/test/container-features/*.test.ts"
    case_basis: "Container features CLI integration tests"
  - name: mocha-templates
    source: "src/test/container-templates/*.test.ts"
    case_basis: "Container templates integration tests"
external_integration_note: "Full devcontainer integration tests require Docker/Podman and container runtime, not available in CI."

test_package_tests:
  - file: test_devcontainer.sh
    description: "Validate the wrapper script, version output, and help output."
    command: "./test_devcontainer.sh <devcontainer-wrapper>"

assertion_count: 4
