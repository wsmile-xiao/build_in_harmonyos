software: devcontainer
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.87.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.87.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"

# 构建系统类型（顶层字段，供自检）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/devcontainers/cli/archive/refs/tags/v0.87.0.tar.gz"

  # 源码校验和
  sha256: "354f8684533cf77d2cd6cfd6bdffd28ec8959cb3103ac14381e233c30cb0529d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - node/24.13.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "npm install --ignore-scripts 需要先执行以避免 node-gyp Python 检测失败，然后手动编译 node-pty"
  - "node-gyp 编译需要设置 LD_LIBRARY_PATH 包含 Python 库路径，否则 Python 无法运行"
  - "devcontainer CLI 是 Node.js 应用，需要 Node.js 运行环境"
  - "node-pty 原生模块 (pty.node) 是 ELF 二进制，需要签名才能在 OHOS 上运行"
