# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: das-watchdog/0.9.0
homepage: "https://github.com/kmatheussen/das_watchdog"

# 上游无 tests/ 目录、无 ctest/gtest 注册；唯一独立上游测试为 test_rt.c
# （SCHED_FIFO 冻结实时进程验证看门狗语义）。Makefile 无 make check 目标。
upstream_check_command: "make -n check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_rt.c
    source: das-watchdog-master/test_rt.c
    description: "独立上游测试程序：以 SCHED_FIFO 优先级冻结 CPU，验证 das_watchdog 看门狗降级实时进程；可独立编译（clang exit 0），真实语义需 root/CAP_SYS_NICE（执行环境非 root，SCHED_FIFO 被拒，如实计入未通过）"
    command: "./test_rt"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证：运行已安装的 das_watchdog --version，校验退出码 0 且版本 banner 含 0.9.0（真实调用本库 CLI，非空壳）"
    command: "./test_das-watchdog"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
