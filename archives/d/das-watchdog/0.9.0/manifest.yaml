knowledge_gained:
  - "上游 Makefile 构建入口 `which xmessage` 硬检查在无 X11/无显示环境下失败（X11 工具，OHOS 不存在）：在配方补丁范围内弱化为 `which xmessage || true` 并把 gcc 换为 $(CC)（R33 从 conan conf 取编译器）；代码本身有 xmessage_found 运行时降级（access(WHICH_XMESSAGE, X_OK) 失败回退 $PATH），弱化安全"
  - "Makefile 型配方消费 pkg-config 依赖：PkgConfigDeps 生成的 .pc 位于 generators_folder，须以独立 build-scope 脚本 export PKG_CONFIG_PATH（save_script 唯一命名，避免与 VirtualBuildEnv 聚合 conanbuild.sh 同名被覆盖），否则 make FLAGS 内嵌的 `pkg-config --libs --cflags libgtop-2.0` 找不到依赖"
