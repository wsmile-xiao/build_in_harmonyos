# 版本级 manifest — dinotrace 9.4f
version: "9.4f"
software: dinotrace
status: built
build_date: "2026-09-13"
conan_ref: "dinotrace/9.4f"
build_system: autotools

source:
  url: "https://www.veripool.org/ftp/dinotrace-9.4f.tgz"
  sha256: "a45b462da5797496d1d305b6f7953ee7572e0201d9e4a4678bfd4580447621be"
  tar_format: tar.gz
  upstream_version: "9.4f"
  version_mapping: "Conan dinotrace/9.4f builds upstream Dinotrace 9.4f (DTVERSION \"Dinotrace 9.4f\")."

build:
  system: autotools
  in_source: true
  configure_options:
    - "--x-includes=<libx11>/include"
    - "--x-libraries=<libx11>/lib"
    - "--prefix=/"
  make_target: "all"
  dependencies:
    - "motif/2.3.8"
    - "xorgproto/2025.1"
  cc: clang
  cxx: clang++

patches_applied: []

validation:
  local:
    - "python3 -m py_compile passed for conanfile.py and test_package/conanfile.py"
    - "sh -n passed for test_package/test_dinotrace.sh"
    - "conan create with ci/conan/profiles/ohos-aarch64 (host+build) -> see reports/validation-report.md"
    - "packaged bin/dinotrace present; ELF DT_NEEDED libXm.so.4/libXt.so.6/libX11.so.6"
  pending:
    - "motif/2.3.8 is not published in the registry yet -> CI blocks the PR until it is released"

knowledge_gained:
  - "Dinotrace 9.4f is written against Xt + Motif (libXm); it needs the locally adapted motif/2.3.8 (libXm.so.4)."
  - "The 2019 hand-written Makefile has no VPATH support: build in-source (folders.build='.')."
  - "Perl is a hard build dependency: src/dist_date.pl -> dist_date.h and src/dinodoc.pl -> dinodoc.h."
  - "configure's AC_PATH_XTRA/AC_PATH_X are satisfied with --x-includes/--x-libraries from the libx11 package."
  - "make install -> all info: touch the shipped dinotrace.info/.txt/.pdf newer than the .texi so makeinfo is never needed."
  - "Headless: XtOpenDisplay fails -> dt_dispmgr.c prints \"Can't open display ''\" and exit(0); --version is the headless-safe check."
