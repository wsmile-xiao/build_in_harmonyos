# test_package/MANIFEST.yml — dinotrace 9.4f
# 上游官方测试声明文件 (CI L0e 强制要求). 详见 docs/TEST_QUALITY_SPEC.md 与 notes.md.
package: dinotrace/9.4f
homepage: "https://www.veripool.org/dinotrace"

# ── R51 上游测试清点（证据见 notes.md "R51 上游测试清点"） ──
# Dinotrace 9.4f 不提供正式测试套件：
#   * `find . -iname "*test*"`      -> 0 个文件
#   * `Makefile.in` 只有 1 个测试相关目标 `test:`（= `./dinotrace traces/ascii.tra`）
#   * 无 `check:` 目标（`make check` 报 "No rule to make target 'check'"）
#   * traces/ 只有样例波形（ascii.tra/ascii.dino/tempest.*/vcd.*），非自动化用例
upstream_check_command: "make check"          # 上游无此目标（清点证据见 notes.md）
upstream_test_in_build: true                  # build() 内确实调用了上游 `test:` 目标
upstream_test_command: "make test"            # = ./dinotrace traces/ascii.tra（需 X display）

# 上游可运行的测试目标（唯一一个；需 X display，本平台无 X -> 见 exemption）
upstream_tests:
  - target: "test"
    file: "Makefile.in:119"
    command: "./dinotrace traces/ascii.tra"
    description: "上游唯一的 test 目标：用样例波形 ascii.tra 启动 GUI。需要 X display；OHOS 无 X -> 平台豁免。"
    platform_exemption: true
    exemption_reason: >-
      OHOS / 本机均无 X server 且无 Wayland；该目标进入 XtOpenDisplay 后必然打印
      "Can't open display" 并 exit(0)。build() 仍以 `timeout 60 make test` 原样执行并
      捕获原始输出（见 notes.md 原始日志），未删除、未伪造。

# test_package 中自带的消费者测试（R34 实质调用被测二进制）
test_package_tests:
  - file: test_dinotrace.sh
    description: >-
      执行打包后的 bin/dinotrace：(a) 存在且可执行；(b) `--version` exit 0 且 stdout
      含 "Dinotrace 9.4f"；(c) llvm-readelf -d 断言 ELF DT_NEEDED 含 libXm.so.4 /
      libXt.so.6 / libX11.so.6（证明真正链接打包的 Motif/X11 链）；(d) DISPLAY 取消下
      `timeout 30 dinotrace` 不得挂起，须打印真实 display 错误。timeout=FAIL。
    command: "sh test_dinotrace.sh <bin_dir> /data/service/hnp/bin/llvm-readelf"
  - file: conanfile.py
    description: "消费者测试入口：test() 调用 test_dinotrace.sh 执行被测包二进制"
    command: "conan create 内 test() 阶段运行"

# 测试断言总数：6（(a) 1 + (b) 1 + (c) 3 + (d) 1）
assertion_count: 6
