# 软件级 manifest — dinotrace
software: dinotrace
display: "Dinotrace"
description: "X11/Motif waveform viewer for Verilog/VCD value-change-dump traces"
category: gfx
homepage: "https://www.veripool.org/dinotrace"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Written against X Toolkit (Xt) + Motif (libXm); depends on the locally adapted motif/2.3.8 (libXm.so.4)."
    - "In-source build only (the 2019 hand-written Makefile is not VPATH-capable)."
    - "Perl required at build time (dist_date.pl / dinodoc.pl generate headers)."
    - "No X server on OHOS: GUI cannot be exercised; `dinotrace --version` is the headless-safe check."
    - "E011: configure umask 077->022 and /bin/sh shebang/SHELL retarget to the OHOS shell."
  common_dependencies:
    - motif
    - xorgproto

versions:
  "9.4f":
    status: built
    build_date: "2026-09-13"
    conan_ref: "dinotrace/9.4f"
    note: "First OHOS adaptation. In-source autotools build; no source patches. motif/2.3.8 not yet in the registry (CI gated)."
