conan_ref: "datefudge/1.27"
test_total: 19
test_passed: 19
test_failed: 0

source:
  url: "https://salsa.debian.org/debian/datefudge/-/archive/debian/1.27/datefudge-debian-1.27.tar.gz"
  sha256: "35b3ba6636de4c0ae4cc7a31c745ce705d4db8ee0dd0ca18438b2c4cfc3f5df6"
  commit: "99a1e817b95b68cd8fa6f9a141cda05d37db3c91"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make -j1 CC=<Conan compiler> VERSION=1.27 prefix=/usr"
  dependencies:
    - "coreutils/9.10"
    - "perl/5.42.2"
  cc: clang
  cxx: clang++
  outputs:
    - "bin/datefudge"
    - "lib/datefudge/datefudge.so"
    - "share/man/man1/datefudge.1"

patches_applied:
  - file: "patches/0001-datefudge.sh.patch"
    description: "Resolve the private preload library relative to the installed launcher"
    type: portability
  - file: "patches/0002-configurable-test-perl.patch"
    description: "Allow the upstream test target to select an explicit Perl interpreter"
    type: portability

test_results:
  type: official-and-consumer
  upstream_total: 9
  upstream_passed: 9
  consumer_total: 10
  consumer_passed: 10
  harmonyos_specific_total: 1
  harmonyos_specific_passed: 1

knowledge_gained:
  - "LD_PRELOAD 私有库的启动脚本必须使用可重定位路径，不能嵌入 Conan 构建机缓存路径"
  - "OHOS 系统 date 不支持 GNU --date 语法，启动器和上游测试必须通过 Conan 使用 coreutils/date"
  - "OHOS 上游 Perl 测试必须使用已发布的动态 Conan Perl 绝对路径，避免回退到系统解释器"
