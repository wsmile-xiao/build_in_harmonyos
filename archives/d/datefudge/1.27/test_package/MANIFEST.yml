package: "datefudge/1.27"
homepage: "https://salsa.debian.org/debian/datefudge"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - file: "Makefile"
    source: "Makefile test target"
    description: "Two official date and Perl localtime LD_PRELOAD checks"
    command: "make test"
  - file: "debian/tests/control"
    source: "Debian autopkgtest metadata"
    description: "Seven official dynamic, static, subsecond, leap-day, and LD_PRELOAD checks"
    command: "autopkgtest"

test_package_tests:
  - file: "test_datefudge.c"
    description: "Calls time, gettimeofday, CLOCK_REALTIME, and CLOCK_MONOTONIC under the packaged preload library"
    command: "LD_PRELOAD=datefudge.so ./test_datefudge"
  - file: "test.sh"
    description: "Runs the nine upstream-derived launcher checks and package relocation checks"
    command: "bash test.sh"
  - file: "test_datefudge.c"
    description: "HarmonyOS-specific compile guard and ELF64 AArch64 ABI validation"
    command: "cmake --build build"

assertion_count: 10
