software: datefudge
display: "datefudge"
description: "Fake the system date for a process through LD_PRELOAD interposition"
category: system
homepage: "https://salsa.debian.org/debian/datefudge"
license: "GPL-2.0-or-later"
language: c
build_system: makefile

ohos_adaptation:
  key_points:
    - "Build the private LD_PRELOAD library with the Conan OHOS Clang toolchain"
    - "Resolve the private library relative to the launcher for relocatable Conan packages"
    - "Supply GNU date through the coreutils Conan runtime dependency"
    - "Sign the HarmonyOS shared object before consumer execution"
  common_dependencies:
    - "coreutils/9.10"

versions:
  "1.27":
    status: built
    build_date: "2026-09-10"
    conan_ref: "datefudge/1.27"
