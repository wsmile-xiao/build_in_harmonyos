# 版本级 manifest — diffpdf 2.1.3.1
# 文件位置: archives/d/diffpdf/2.1.3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.1.3.1"
software: "diffpdf"

status: published
build_date: "2026-09-03"
build_system: cmake

source:
  url: "https://deb.debian.org/debian/pool/main/d/diffpdf/diffpdf_2.1.3.1.orig.tar.xz"
  sha256: "a7cbea3831886e70b2e47c09890d239c664a492d59cda83913c48c22eb60baf8"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "CMAKE_SYSTEM_NAME=OHOS (via CMakeToolchain block)"
    - "CMAKE_CXX_STANDARD=14"
    - "CMAKE_AUTOMOC=ON"
  dependencies:
    - qt5-qtbase/5.15.2.2
    - poppler/25.12.0.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-add-cmakelists-for-ohos-poppler-cpp-build.patch"

knowledge_gained:
  - "制品仓 poppler 无 Qt 绑定（ENABLE_QT5=OFF），diffpdf 上游的 poppler-qt5 依赖用自研 poppler-cpp shim 兼容层替代，上游 21 个源文件零修改 (knowledge_ref: E324)"
  - "qt5-qtbase/5.15.2.2 链 zlib/1.3.1 与 poppler 链 zlib/1.3.1.1 图内冲突：override 到 1.3.1.1（PIC），qt5-qtbase 从源码构建（baka !6487 先例）(knowledge_ref: E324)"
  - "CMAKE_AUTOMOC 在手动链接 Qt5（无 find_package）时报 No valid Qt version found：改 add_custom_command 显式调 moc (knowledge_ref: E324)"
