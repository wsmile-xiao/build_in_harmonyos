# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游 diffpdf 2.1.3.1（qtrac.eu）是无测试套件的 Qt5 GUI 应用：
# 源码包只含应用源文件 + 翻译 + 文档，无 tests/ 目录、无 CTest 注册、
# 无 make check 目标（其 CMakeLists.txt 只定义 add_executable(diffpdf)）。
# 按 R34/官方模板要求，以链路级 smoke test 补全验证。

package: diffpdf/2.1.3.1
homepage: "http://www.qtrac.eu/diffpdf.html"

# 上游测试命令 (无官方测试套件)
upstream_check_command: "make check / ctest -N（上游无 tests/ 目录与 CTest 注册，输出为空）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "可执行程序链路级冒烟测试：offscreen 平台运行 diffpdf --help，校验 QApplication 初始化 + usage banner + 选项列表（--appearance/--words）"
    command: "test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
