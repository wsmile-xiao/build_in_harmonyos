# 版本级 manifest — delay 1.0

version: "1.0"
software: delay

# published | built | failed | archived
# 本地 conan-verify 通过后置 built；CI 合并发布后置 published（由 CI 流水线处理）
status: built

build_date: "2026-09-10"
build_system: make

source:
  # 上游 rom1v/delay 无 release/tag，采用官方仓库固定 commit 0a430a0 的 archive 归档
  # （Debian 以同一仓库打包为 delay 1.0；任务版本字段为 "1"，Conan 版本至少 2 字符，包版本用 1.0）
  # 用 github archive/<sha>.tar.gz（以 .tar.gz 结尾），不用 codeload /tar.gz/<sha>（无后缀会被 Conan 当 zip 解压报 BadZipFile）
  url: "https://github.com/rom1v/delay/archive/0a430a05d1be6ef9153c0817ed7084af4f1e6ffa.tar.gz"
  sha256: "20f06e6adc216e670756ad5ab6758c0165f2ab9a044968e1c82d0a12cc9a45a4"
  tar_format: tar.gz

build:
  system: make
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  notes: "纯 C + POSIX（poll/gettimeofday），in-source make 构建；编译器从 Conan conf 读取（R33）"

patches_applied: []

knowledge_gained:
  - "无 release/tag 的 GitHub 小型 C 工具：可用固定 commit 的官方 archive 归档作为 conan 源（R39 官方源合规），URL 必须以 .tar.gz 结尾（github.com/<org>/<repo>/archive/<sha>.tar.gz）；codeload 的 /tar.gz/<sha> 以哈希结尾无后缀，Conan get() 默认按 zip 解压会报 BadZipFile，两种 URL 下载内容字节一致、sha256 相同"
  - "Conan 版本号正则 ^[a-z0-9_][a-z0-9_+.-]{1,100}$ 要求至少 2 字符：任务版本为单字符（如 1/9）时包版本必须补成 X.0（如 1.0/9.0），任务分支同步用 feat/<名>-X.0（同 disktype 9→9.0），否则 conan export 报 Invalid package version"
  - "命令行工具型包（无库 API）：test_package 采用 VirtualRunEnv + test.sh 实际执行二进制（R34），delay 无参数会阻塞等待 stdin，测试必须通过管道喂数据并验证透传与延时行为"
