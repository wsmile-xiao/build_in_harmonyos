# conandata.yml — delay 1.0
# 源码: GitHub 官方仓库 rom1v/delay @ commit 0a430a0（2019-05-31, PR #9 合并后 master 快照）
# 上游无 release/tag（仓库仅 master 分支），以固定 commit 的官方归档为源（R39）。
# URL 必须用 github.com/<org>/<repo>/archive/<sha>.tar.gz 形式（以 .tar.gz 结尾）：
# codeload.github.com/<repo>/tar.gz/<sha> 以哈希结尾、无压缩后缀，Conan get() 无法识别
# 格式会默认按 zip 解压而报 BadZipFile；archive 形式与其字节完全一致（sha256 相同）。
# 版本说明: Debian 将同一仓库打包为 delay 1.0（sources.debian.org/src/delay）；
# 积分赛任务版本字段为 "1"，但 Conan 版本号至少 2 字符（单字符 "1" 非法），
# 故包版本采用 "1.0"，任务分支对应 feat/delay-1.0（同 disktype 9→9.0 先例）。

