# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: delay/1.0
homepage: "https://github.com/rom1v/delay"

# 上游测试命令 (make -n check 验证: Makefile 无 check/test 目标)
# 清点证据: 上游仅 release/install/clean/fmt 目标，无 check/test/tests，上游测试用例数为 0
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：上游不含任何测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试：管道喂数据执行 delay 二进制，验证 ①数据透传 ②空输入 ③时间单位后缀 ④缓冲区参数，共 4 个独立检查项"
    command: "bash test.sh"

# 测试断言总数 (按独立检查项计数，共 4 项)
assertion_count: 4
