software: delay
display: "delay"
description: "恒定延时管道工具：在 stdin 与 stdout 之间引入指定延时（command_A | delay 5s | command_B），支持 -b 缓冲区与 s/m/h 时间单位"
homepage: "https://github.com/rom1v/delay"
license: "MIT"
category: utility
language: c
build_system: make

ohos_adaptation:
  key_points:
    - "纯 C + POSIX（poll/gettimeofday），OHOS libc 全量提供，零 patch 适配"
    - "普通 Makefile 构建，in-source；CC 从 Conan conf 读取注入（R33）"
    - "单二进制命令行工具安装到 bin/，commands.json 声明（R38）"

versions:
  "1.0":
    status: built
    build_date: "2026-09-10"
    conan_ref: "delay/1.0"
