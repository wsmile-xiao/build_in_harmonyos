package: dc3dd/7.3.1
homepage: "https://sourceforge.net/projects/dc3dd/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "bash tests/test-file-imaging.sh && bash tests/test-hashing.sh"
upstream_test_result: "pending OHOS aarch64 shadow CI"

upstream_tests:
  - file: "tests/test-compile.sh"
    description: "Builds default, compile-flag, and static configurations."
    command: "bash tests/test-compile.sh linux"
  - file: "tests/test-file-imaging.sh"
    description: "Exercises file imaging, split/join, output hashing, patterns, skips, and validation."
    command: "bash tests/test-file-imaging.sh"
  - file: "tests/test-hashing.sh"
    description: "Compares dc3dd MD5 and SHA-1 results against reference files."
    command: "bash tests/test-hashing.sh"
  - file: "tests/test-device-imaging.sh"
    description: "Images an explicitly supplied block device; requires device queue and privileges."
    command: "bash tests/test-device-imaging.sh <device>"
  - file: "tests/test-damaged-device-imaging.sh"
    description: "Runs damaged-device recovery checks; requires a dedicated device fixture."
    command: "bash tests/test-damaged-device-imaging.sh <device>"

test_package_tests:
  - file: "test.sh"
    description: "Runs the packaged binary, checks version and compile-time hashes, copies a file, verifies SHA-256, splits output, and writes a text pattern."
    command: "bash test.sh"

assertion_count: 9
