software: dc3dd
version: "7.3.1"
status: built
build_date: "2026-09-13"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/dc3dd/dc3dd/7.3.1/dc3dd-7.3.1.zip"
  sha256: "bd1b66d20a4020ab94b512e56d76cb5f86470d0216081586d596366927cb8d8b"
  tar_format: zip

target:
  platform: OHOS
  triplet: aarch64-unknown-linux-ohos
  compiler: clang

build:
  system: autotools
  configure_options:
    - "--disable-nls"
    - "--disable-hdparm"
    - "HELP2MAN=/bin/true"
    - "MAKEINFO=/bin/true"
  cflags:
    - "-DDEFAULT_HASH_MD5"
    - "-DDEFAULT_HASH_SHA1"
    - "-DDEFAULT_HASH_SHA256"
    - "-DDEFAULT_HASH_SHA512"
  dependencies: []

patches_applied:
  - "0001-config.guess-ohos.patch"
  - "0002-config.sub-ohos.patch"
  - "0003-configure-umask.patch"
  - "0004-freadahead-musl.patch"
  - "0005-freadptr-musl.patch"
  - "0006-freadseek-musl.patch"
  - "0007-fseterr-ohos.patch"
  - "0008-pthread-cancel-ohos.patch"

upstream_audit:
  release_format: zip
  release_date: "2023-04-25"
  upstream_test_scripts:
    - "tests/test-compile.sh"
    - "tests/test-file-imaging.sh"
    - "tests/test-hashing.sh"
    - "tests/test-device-imaging.sh"
    - "tests/test-damaged-device-imaging.sh"
  functional_tests_wired_into_make_check: false
  device_tests_deferred: true
  release_fixture_gap: "The 7.3.1 ZIP does not ship test_data/reference_images/ref-pat.img; the device file-imaging run used a synthetic fixture generated with dc3dd."

knowledge_gained:
  - "The official 7.3.1 release is dc3dd-7.3.1.zip, not a tar.gz archive."
  - "The bundled 2008 config.guess reports cannot guess build type on HarmonyOS."
  - "The bundled config.sub rejects aarch64-unknown-linux-ohos until linux-ohos is accepted and preserved."
  - "Autoconf 2.61 uses umask 077 for temporary directories, which is incompatible with the HMDFS build workspace."
  - "The release documents hdparm/HPA-DCO as incomplete; keep that optional path disabled."

validation:
  local_precheck:
    - "Source archive SHA256 verified."
    - "SDK clang predefined macros verified: __OHOS__ and __linux__."
    - "SDK sysroot headers verified: sys/mount.h, sys/mtio.h, pthread.h."
    - "Conan recipe and test_package syntax checks passed."
    - "All eight version-local patches pass local git apply checks against the release source."
  shadow_ci:
    device: "currentUser@10.62.178.77:2222"
    profile: "ohos-aarch64-fixed"
    runs:
      - "r2: fseterr.c fallback was effective; compilation reached the link stage and exposed unavailable pthread_cancel."
      - "r3: pthread cancellation fallback linked the binary; the release man rule then failed because Locale/gettext.pm was unavailable."
      - "r4: build, package, and test_package completed successfully."
    package_reference: "dc3dd/7.3.1#185b770918ecb5403d7e13f5a8677012:eda5abb401cbed7c3f6f2ad04bfecec451641886#fed257414d0a043dae17a27aebcadd0f"
    package_binary: "/storage/Users/currentUser/.conan2/p/b/dc3ddff4cfe009e552/p/bin/dc3dd"
    package_man: "/storage/Users/currentUser/.conan2/p/b/dc3ddff4cfe009e552/p/share/man/man1/dc3dd.1"
    package_binary_sha256: "7bac15742253ff129889e93bd4a5e9587c9dd71e470e35eb6def92cc2df2003d"
