# dietlibc 软件级 manifest
# 文件位置: archives/d/dietlibc/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: dietlibc
display_name: "diet libc"
description: "轻量级 C 标准库实现，专注静态链接与极小体积，可作为 glibc/musl 之外的 libc 选择"
category: system
homepage: "https://www.fefe.de/dietlibc/"
license: GPL-2.0-or-later
build_system: makefile

# 跨版本适配要点
ohos_adaptation:
  key_points:
    - "自定义 Makefile，通过 ARCH/CC/AR 交叉编译到 aarch64（无需 autotools/cmake）"
    - "补丁：Makefile 增加 AR 变量（用 llvm-ar）、去掉 -fno-integrated-as（用 clang 集成汇编器）"
    - "补丁：aarch64 汇编 .type #function 改 %function 以兼容 clang 集成汇编器"
    - "无 make check（test/ 目录为手动示例程序）；交叉编译仅构建核心静态库目标"
  notes:
    - "dietlibc 是 libc 本体，零外部依赖，只依赖 clang + llvm-ar 工具链"
    - "aarch64 完整支持（aarch64/ 目录 37 个汇编文件，syscalls 为 Linux ABI 编号）"

# 版本索引
versions:
  - version: "0.34-cvs20160606"
    status: built
    build_date: "2026-09-18"
    patches: 5
    notes: "真机 shadow CI 通过（L0/L1/L4/L5 pass）；上游测试 132 个程序实跑 101 通过、30 失败、1 编译失败（如实记录环境限制/语义差异）"
