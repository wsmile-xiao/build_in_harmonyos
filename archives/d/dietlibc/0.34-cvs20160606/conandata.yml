# conandata.yml — dietlibc 0.34-cvs20160606
# 源码：上游 fefe.de 的 0.34 CVS 快照（2016-06-06），经 Debian 以 orig.tar.xz 形式
# 权威打包（固定 SHA256）。fefe.de 未提供该 CVS 快照的直接归档 URL，故使用 Debian pool。

sources:
  url: "https://deb.debian.org/debian/pool/main/d/dietlibc/dietlibc_0.34~cvs20160606.orig.tar.xz"
  sha256: "6d0d43846f58e53821407707b9c096e7ac4b0c582ce9e4c0126d1d3f959ffc25"

patches:
  "0.34-cvs20160606":
    - patch_file: "patches/0001-makefile-ohos-toolchain.patch"
      patch_description: "Makefile：增加 AR 变量（llvm-ar）、去掉 -fno-integrated-as（clang 集成汇编器）、$(CROSS)ar 改 $(CROSS)$(AR)、LIBPTHREAD_OBJS 用 wildcard 替代 threadsafe.sh（执行位丢失/无 gcc）"
      patch_type: "portability"
    - patch_file: "patches/0002-aarch64-type-function-percent.patch"
      patch_description: "aarch64 汇编 .type #function 改为 %function（clang 集成汇编器兼容，与上游 arm 写法一致）"
      patch_type: "portability"
    - patch_file: "patches/0003-aarch64-testandset-stlxr-register.patch"
      patch_description: "修复 aarch64 __testandset.S stlxr status 寄存器 w2 与地址寄存器 x2 重叠（ARM unpredictable，clang 集成汇编器拒绝）"
      patch_type: "portability"
    - patch_file: "patches/0004-aarch64-clone-weak-alias.patch"
      patch_description: "aarch64/clone.S 补 __clone 符号（其他架构均有，pthread_internal.c 引用 __clone；clone 改为 weak 别名）"
      patch_type: "portability"
    - patch_file: "patches/0005-disable-want-tls-ssp.patch"
      patch_description: "禁用 WANT_TLS 和 WANT_SSP（原生 TLS 的 msr tpidr_el0 与 clang emutls 冲突、stackgap SSP canary 设置导致启动段错误；__thread 交由 clang emutls 处理）"
      patch_type: "portability"
    - patch_file: "patches/0006-fix-stpncpy-rand48-malloc0.patch"
      patch_description: "修复 3 处 bug：stpncpy 缺 0 填充（定义 WANT_FULL_POSIX_COMPAT）、srand48 seed 高低 16 位放反、malloc(0) 返回 NULL（定义 WANT_MALLOC_ZERO）"
      patch_type: "bugfix"
    - patch_file: "patches/0007-fix-rand48-order.patch"
      patch_description: "修复 jrand48/nrand48/erand48 与 glibc 语义：jrand48/mrand48 先 calc_next 再返回高 32 位（(unsigned long)buf[2]<<16 | buf[1]，避免 int 溢出符号扩展）；nrand48/lrand48 返回 X>>17（(unsigned long)buf[2]<<15 | (buf[1]>>1)）；erand48/drand48 先 calc_next 再返回 X/2^48"
      patch_type: "bugfix"
    - patch_file: "patches/0008-fix-putenv-remove-all.patch"
      patch_description: "修复 putenv/unsetenv 只删除第一个同名条目（POSIX 要求删除全部）：无 '=' 时用双指针原地压缩 environ 数组，删除所有匹配项"
      patch_type: "bugfix"
    - patch_file: "patches/0009-fix-strtod-hexfloat.patch"
      patch_description: "strtod 补全 C99 十六进制浮点解析（0x<hex>[.<hex>][p[+-]<dec>]）：此前无 0x/p 分支，'0x1.4p+3' 等 19 个 hex 用例解析为 0 且 endptr 停在 'x'"
      patch_type: "bugfix"
    - patch_file: "patches/0010-fix-getdelim-overflow.patch"
      patch_description: "修复 getdelim 越界写：缓冲区写满时 NUL 终止符写在 *n 字节分配之外（off-by-one 堆溢出）；扩容条件改为 i+1>=*n 预留终止符，size_t 避免大 *n 溢出"
      patch_type: "bugfix"
    - patch_file: "patches/0011-fix-printf-n-ahex.patch"
      patch_description: "printf 补全 %n（含 h/hh/l/ll 宽度）与 C99 %a/%A 十六进制浮点（此前均落入 default 输出空串/不写指针，tst-printf %hhn 与 tst-fphex 全失败）"
      patch_type: "bugfix"
    - patch_file: "patches/0012-fix-scanf-width-float-scanset.patch"
      patch_description: "scanf 修复 4 处：整数字段宽度未计入 +/- 符号、浮点解析忽略字段宽度且强制指数符号（1e3 错）、scanset 首字符 ] 被当作终止符误吞、缺 inf/nan 解析"
      patch_type: "bugfix"
    - patch_file: "patches/0014-fix-strftime-width.patch"
      patch_description: "strftime 补 GNU 字段宽度/flags（-%_0^# 与数字宽度）并在 buffer 不足时返回 0（glibc 语义），修复 %2000Y 等宽字段输出"
      patch_type: "bugfix"
    - patch_file: "patches/0015-fix-printf-Z-modifier.patch"
      patch_description: "printf 补 glibc 废弃的 %Z size_t 长度修饰符（等价 %z），修复 tst-strftime 的 %Zu 导致 va_arg 错位/段错误"
      patch_type: "bugfix"
    - patch_file: "patches/0016-fix-scanf-strict-flags.patch"
      patch_description: "scanf 严格校验格式：'*'/长度必须在宽度前、'l' 最多两个（ll）、'L'/'q' 不可用于整数转换（%Ld/%qd），对 %llllld/%l2d/%2*s 等畸形格式返回 0（glibc 语义）"
      patch_type: "bugfix"
