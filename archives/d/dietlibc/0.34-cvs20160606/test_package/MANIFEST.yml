# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dietlibc/0.34-cvs20160606
homepage: "https://www.fefe.de/dietlibc/"

# 上游测试命令：dietlibc 无统一 make check 目标（Makefile 无 check/test 目标）。
# 上游 test/ 目录为手动编译的示例程序（runtests.sh 逐个运行）。
upstream_check_command: "test/runtests.sh"

# conanfile.py build() 是否集成上游测试：是（build() 内改用 clang 静态链接编译 test/ 下测试程序并逐个运行，15s 超时保护）
upstream_test_in_build: true
upstream_test_command: "clang -static -nostdlib -nostdinc -D__dietlibc__ + start.o + dietlibc.a + builtins + libpthread.a + libcompat.a"

# 上游测试程序（runtests.sh 口径：顶层 76 + dirent/inet/stdio/string/stdlib/time 子目录 52 + 4 个特殊 asprintf/cycles/read1/getpass，共 132 个）
upstream_tests:
  - file: "test/*.c"
    source: "dietlibc-0.34~cvs20160606/test/"
    description: "dietlibc 上游测试套件：132 个程序（字符串/stdio/stdlib/time/dirent/inet 等），build() 内静态链接编译并运行"
    command: "clang -static ... ./test_program"
  - result: "101 passed / 30 failed / 1 compile-failed（失败含 adjtime SIGSYS、/etc→/system/etc、无外网 DNS、rand48/浮点语义差异，如实记录）"

# test_package 自带测试（消费者视角，R34：真实调用 dietlibc API）
test_package_tests:
  - file: test.c
    description: "消费者视角：strcpy/strcat/strlen/printf 验证 dietlibc 头文件与静态库可用"
    command: "./test_probe"

# 测试断言总数（test_package 3 项断言；上游测试为独立程序，不计入断言数）
assertion_count: 3
