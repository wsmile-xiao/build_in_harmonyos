knowledge_gained:
  - "dietlibc 自定义 Makefile，ARCH/CC/AR 交叉编译，无 make check 目标"
  - "aarch64 汇编 .type #function 需改 %function 以兼容 clang 集成汇编器"
  - "HarmonyOS 无 GNU ar/gas，需 llvm-ar + clang 集成汇编器（去 -fno-integrated-as）"
  - "threadsafe.sh 用 gcc -E 检测 WANT_THREAD_SAFE，设备无 gcc 导致 libpthread.a 空"
  - "dietlibc TLS + clang emutls 需显式链接 compiler-rt builtins 与 libpthread.a（--start-group 解决循环依赖）"
  - "dietlibc 原生 TLS(msr tpidr_el0)/SSP 与 clang emutls 冲突，需禁用 WANT_TLS/WANT_SSP"
  - "OHOS clang 默认加 .interp 动态链接器，与 dietlibc 静态启动冲突，需 -static -no-pie"
  - "rand48: jrand48/nrand48/erand48 需先 calc_next 再取新状态；jrand48 返回高32位、nrand48 返回 X>>17（glibc __jrand48_r/__nrand48_r 语义），(unsigned long)buf[2]<<16 避免 int 溢出符号扩展"
  - "putenv/unsetenv 按 POSIX 须删除所有同名条目（dietlibc 原只删首个）"
  - "strtod 需实现 C99 十六进制浮点（0x<p>）——dietlibc 原为纯十进制解析器"
  - "getdelim 原实现写满缓冲区时 NUL 越界（off-by-one 堆溢出）"
  - "printf 缺 %n 与 C99 %a/%A；scanf 整数宽度未计符号、浮点宽度/指数符号/scanset 首 ]/inf-nan 均有 bug"
  - "dietlibc 不读 TZ 环境变量，POSIX TZ 字符串解析缺失（tzname 恒 GMT、daylight 恒 0）——tst-mktime/tst-posixtz 根因"
  - "dietlibc __dtostr 的 flags 不区分 %e/%f，%e 走固定点路径无科学计数法——tst-fphex 的 %040e 根因"
  - "OHOS 设备 /tmp 只读、/etc 无权限且 /etc/motd /etc/fstab 缺失——tst-fdopen/tst-ungetc/readdir/getdelim/getmntent 等根因"
  - "strftime 缺 GNU 字段宽度/flags，且 buffer 不足时返回截断长度而非 0（glibc 返回 0 让调用方重试）"
  - "printf 缺 glibc 废弃 %Z size_t 修饰符（等价 %z），导致 %Zu 使 va_arg 错位"
  - "scanf 缺格式严格校验（* 须在宽度前、宽度须在长度前、l 最多两个、%Ld/%qd 非法）"
