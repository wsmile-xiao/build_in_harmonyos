software: ddclient
version: "4.0.0"
status: published
build_date: "2026-06-03"

source:
  url: "https://download.savannah.nongnu.org/releases/ddclient/ddclient-4.0.0.tar.gz"
  sha256: "15c73d4b61e8e4974707379df1dbf15ab9f933835c6968947d2b56173388c6f0"
  tar_format: tar.gz

build:
  system: custom
  build_system: custom
  configure_options:
    - "手动sed替换（configure在HMDFS上无法运行config.status）"
  dependencies:
    - "perl/5.42.0"
    - "curl/system"
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
  - "ddclient是Perl脚本软件，无需C编译，核心产物为ddclient脚本（7705行）"
  - "ddclient的Makefile.am通过sed从.in模板生成ddclient脚本，替换@PACKAGE_VERSION@/@localstatedir@/@confdir@/@runstatedir@/@CURL@及shebang"
  - "configure/config.status在HMDFS上无法运行（Permission denied: 无法创建临时目录confXXX/subs1.awk），原因是HMDFS安全限制导致bash内置rm不可用"
  - "Perl脚本在HMDFS上shebang直接执行报'no such file or directory'（已知平台限制），需通过perl ddclient方式调用"
  - "ddclient运行需要IO::Socket::SSL模块（缺失），但不影响--version/--help/--list-protocols等基本功能验证"
  - "verify-build G4检查manifest.yaml中'build_system:'字段（flat key），但模板使用嵌套'build.system:'，需手动添加'build_system:'字段"
