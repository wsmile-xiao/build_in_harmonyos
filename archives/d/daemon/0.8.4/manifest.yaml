# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://libslack.org/daemon/download/daemon-0.8.4.tar.gz"
  sha256: "fa28859ad341cb0a0b012c11c271814f870482013b49f710600321d379887cd1"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # daemon 使用自定义 configure 脚本（非 GNU autoconf）
  system: custom

  # configure 选项（单行字符串，G0 clean-verify 直接拼接到 ./configure 后面）
  configure_options: "--platform=Linux --disable-logind --disable-mail-test"

  # 需要在 configure 之后修改 libslack/config.h 禁用 musl 不兼容的函数
  # 具体方法见 patches/0001-libslack-config.h-musl-fix.patch 和 patches/0002-conf-linux-musl-fix.patch
  post_configure_note: "configure 后需 sed 禁用 HAVE_FUNC_GETSERVBYNAME_R_6, HAVE_VHANGUP, HAVE_PTSNAME_R"

  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-conf-linux.patch"
  - "0002-libslack-config.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "daemon 使用自定义 configure 脚本（非 GNU autoconf），支持 --platform=Linux, --prefix, --destdir"
  - "daemon 的 configure 脚本会使用 perl 修改 Makefile/macros.mk/config.h 来适配平台"
  - "make clean/clobber 会重置所有配置（运行 ./configure --default），修改后需重新应用"
  - "musl libc 无 getservbyname_r、vhangup、ptsname_r 函数，需在 conf/linux 和 config.h 中禁用"
  - "daemon 只构建静态库 libslack.a 和单一二进制，无需 --disable-shared"
  - "测试中 coproc/daemon/pseudo 模块有 PTY 权限限制（OpenHarmony SELinux），属于平台限制非软件 bug"
