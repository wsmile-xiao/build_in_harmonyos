# test_package/MANIFEST.yml
# 上游官方测试声明文件
# doas(opendoas v6.8.2 基线)上游无测试套件:GNUmakefile 无 test/check
# 目标,仓库无 tests/ 目录,无 ctest/pytest 注册;仅 make 编译期告警可看。

package: doas/6.8.2
homepage: "https://github.com/Duncaen/opendoas"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: probe.py
    description: "三项真实消费者：-C permit0合法解析；非法配置必须原syntax-error及RC1；usage原RC1。正式官方r017同run3/3，不能把缺账户/RC126当parser成功，不证明认证或权限转换。"
    command: "actual-conan-python probe.py (absolute installed ELF, no shell=True)"

# 上游测试断言总数
assertion_count: 3
harmony_tests:
  - file: harmony_safety.py
    description: "Actual HarmonyOS non-root UID/EUID and 0755 installed product must reject ordinary -n execution with the exact original account or non-setuid diagnostic; not positive authentication."
    command: "actual-conan-python harmony_safety.py"
harmony_assertion_count: 1
