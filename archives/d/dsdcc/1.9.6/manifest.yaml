# 版本级 manifest — dsdcc 1.9.6

version: "1.9.6"
software: "dsdcc"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方上游 URL（R39）
  url: "https://github.com/f4exb/dsdcc/archive/refs/tags/v1.9.6.tar.gz"

  # 源码校验和（实际下载验证）
  sha256: "43505fe537b12492860a44d0373b6b2a7edacbaec058160b5007c341af1b40d9"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_TOOL=ON"

  # 编译依赖列表（格式: name/version）— 可选依赖 mbelib/serialdv 未启用
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无需补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "dsdcc 使用 CMake 而非 autotools：conan-init 自动检测会误判为 autotools，需手动改用 CMakeToolchain 模板生成配方"
- "testfec/ 目录包含 12 个独立自检用例（Makefile 硬编码 g++），OHOS 环境无 g++ 时需用 clang++ 包装（PATH 前置 ~/tmp/bin/g++ -> clang++）并 -j1 编译以避开 HMDFS jobserver fifo 限制"
- "dsdcc 公开头文件位于 include/dsdcc/ 且使用 namespace DSDcc，消费者需 #include <dsdcc/dsd_decoder.h> + using namespace DSDcc"
- "构建产物含 CLI 工具 dsdccx（R38），软件级目录须声明 commands.json"