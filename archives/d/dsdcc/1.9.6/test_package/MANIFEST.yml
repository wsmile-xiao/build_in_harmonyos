# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dsdcc/1.9.6
homepage: "https://github.com/f4exb/dsdcc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# dsdcc 主 CMakeLists 未注册 ctest；独立测试入口位于 testfec/ (Makefile)
upstream_check_command: "make -C testfec -j1"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (testfec/ 独立自检程序, 12 个入口)
upstream_tests:
  - file: testfec/qr.cpp
    source: dsdcc-1.9.6/testfec/qr.cpp
    description: "QR 纠错码自检"
    command: "./qr"
  - file: testfec/golay20.cpp
    source: dsdcc-1.9.6/testfec/golay20.cpp
    description: "Golay(20,8) 自检"
    command: "./golay20"
  - file: testfec/golay23.cpp
    source: dsdcc-1.9.6/testfec/golay23.cpp
    description: "Golay(23,12) 自检"
    command: "./golay23"
  - file: testfec/golay24.cpp
    source: dsdcc-1.9.6/testfec/golay24.cpp
    description: "Golay(24,12) 自检"
    command: "./golay24"
  - file: testfec/hamming7.cpp
    source: dsdcc-1.9.6/testfec/hamming7.cpp
    description: "Hamming(7,4) 自检"
    command: "./hamming7"
  - file: testfec/hamming12.cpp
    source: dsdcc-1.9.6/testfec/hamming12.cpp
    description: "Hamming(12,8) 自检"
    command: "./hamming12"
  - file: testfec/hamming15.cpp
    source: dsdcc-1.9.6/testfec/hamming15.cpp
    description: "Hamming(15,11) 自检"
    command: "./hamming15"
  - file: testfec/hamming16.cpp
    source: dsdcc-1.9.6/testfec/hamming16.cpp
    description: "Hamming(16,11) 自检"
    command: "./hamming16"
  - file: testfec/viterbi.cpp
    source: dsdcc-1.9.6/testfec/viterbi.cpp
    description: "Viterbi 卷积译码自检"
    command: "./viterbi"
  - file: testfec/viterbi35.cpp
    source: dsdcc-1.9.6/testfec/viterbi35.cpp
    description: "Viterbi 3/5 多项式自检"
    command: "./viterbi35"
  - file: testfec/crc.cpp
    source: dsdcc-1.9.6/testfec/crc.cpp
    description: "CRC 自检"
    command: "./crc"
  - file: testfec/pn.cpp
    source: dsdcc-1.9.6/testfec/pn.cpp
    description: "PN 序列自检"
    command: "./pn"

# test_package 中自带的测试 (消费者视角验证, R34: 必须真实调用被测包 API)
test_package_tests:
  - file: test.cpp
    description: "消费者用例: 构造 DSDDecoder 并调用 run()/getSamplesPerSymbol()/getSymbolSyncQuality()/formatStatusText() 公开 API"
    command: "./test_dsdcc"

# 测试断言总数
assertion_count: 24