# debianutils 软件级 manifest
# 文件位置: archives/d/debianutils/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: debianutils

# 软件描述
description: "Miscellaneous utilities specific to Debian"

# 官方信息
homepage: "https://salsa.debian.org/debian/debianutils"
repository: "https://deb.debian.org/debian/pool/main/d/debianutils/"

# 许可证
license: "GPL-2.0-or-later"

# 分类
category: "system-tools"

# 关键词
keywords:
  - debian
  - utilities
  - run-parts
  - tempfile
  - savelog

# 版本索引
versions:
  5.23.2:
    status: published
    build_date: "2026-06-09"
    patches: 1
    package_size: "280KB"
    notes: "禁用 po4a 文档翻译，核心功能正常"

# 包含工具
tools:
  binaries:
    - name: run-parts
      description: "执行目录中的所有脚本/程序"
      size: "38KB"
    - name: tempfile
      description: "创建临时文件（已弃用，建议使用 mktemp）"
      size: "22KB"
      warning: "deprecated"
    - name: ischroot
      description: "检测是否在 chroot 环境中运行"
      size: "22KB"

  scripts:
    - name: which.debianutils
      description: "查找命令位置（which 的 Debian 版本）"
      size: "1.0KB"
    - name: savelog
      description: "保存和轮转日志文件"
      size: "10KB"
    - name: installkernel
      description: "安装内核映像"
      size: "2.6KB"
      location: "sbin"
    - name: add-shell
      description: "向 shells 列表添加 shell"
      size: "1.0KB"
      location: "sbin"
    - name: remove-shell
      description: "从 shells 列表移除 shell"
      size: "1.0KB"
      location: "sbin"
    - name: update-shells
      description: "更新 shells 列表"
      size: "3.9KB"
      location: "sbin"

# 编译特性
build_characteristics:
  - "需要 autoreconf 生成 configure"
  - "禁用 po4a 文档翻译（缺少 po4a-translate）"
  - "部分工具依赖 Debian 特有功能"
  - "tempfile 和 run-parts 中硬编码 /tmp 路径"

# OHOS 特殊说明
ohos_notes:
  platform_issues:
    - issue: "硬编码 /tmp 路径"
      affected_tools: ["tempfile", "run-parts"]
      impact: "HMDFS 上 /tmp 为只读，需使用 $TMPDIR"
      workaround: "设置 TMPDIR 环境变量"

    - issue: "缺少 po4a-translate"
      affected_feature: "文档翻译"
      impact: "无法生成翻译后的 man 文档"
      workaround: "禁用 po4a 子目录，保留英文文档"

  debian_specific:
    - tool: "add-shell/remove-shell/update-shells"
      dependency: "/etc/shells 文件"
      note: "需要手动创建或适配"

# 测试状态
test_status:
  last_test: "2026-06-09"
  result: "PASS"
  passed: 6
  warnings: 1
  failed: 0
  details: "archives/d/debianutils/5.23.2/reports/test-report.md"