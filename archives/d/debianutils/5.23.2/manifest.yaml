software: debianutils
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.23.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.23.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/d/debianutils/debianutils_5.23.2.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.am.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "源码包未预生成 configure，需运行 autoreconf -fvi 生成"
  - "po4a 文档翻译功能依赖 po4a-translate 工具，缺失时需禁用"
  - "Makefile.am 中 TRANSLATE 变量设置为 exit 1，缺失工具会导致构建失败"
  - "tempfile 工具已弃用，建议使用 mktemp 替代"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

# 质量门禁结果
quality_gate:
  G0_clean_build: "⚠️ 平台限制（Python subprocess），手动验证通过"
  G1_binary_integrity: "PASS"
  G2_functional: "PASS"
  G3_portability: "PASS"
  G4_archive: "PASS（补充后）"

# 测试信息
test_info:
  test_date: "2026-06-09"
  test_result: "PASS"
  passed_items: 6
  warning_items: 1
  failed_items: 0
  test_report: "reports/test-report.md"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/debianutils-5.23.2.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/debianutils-5.23.2.work
  source_orig_hash: f2808219dfb8aff4
  source_work_hash: 17cd679c76d5a394
  generated_at: '2026-06-09T12:32:02'
  patches_count: 1

patch_classification:
  - file: 0001-Makefile.am.patch
    type: build_adaptation
    platform_only: True
    guard: 'none'
    description: "禁用 po4a 文档翻译子目录，避免缺失 po4a-translate 导致构建失败"
