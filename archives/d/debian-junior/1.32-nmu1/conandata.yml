sources:
  "1.32-nmu1":
    # 上游：debian-junior（Debian Pure Blend 的任务数据包）
    # 交付 Blend 的任务描述（tasks/ 逐任务源文件 + 生成好的 <blend>-tasks.desc）
    # 与 logo；不含任何需要编译的产物。
    # 上游 Debian 版本号是 1.32+nmu1（"+"在 URL 里写作 %2B）；平台任务版本号是
    # 1.32-nmu1（conan 版本正则不含 "~" 且要与任务 version_match），recipe 取后者，
    # 源码文件名仍按上游的 +nmu1 取。
    url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/d/debian-junior/debian-junior_1.32%2Bnmu1.tar.xz"
    sha256: "2c52b1fd9c862b055696180a95b2a863d80d54dc6a07483bf41529b4aa3b0e1a"
patches:
  "1.32-nmu1": []
