software: dcap
version: "2.47.14"
status: built
build_system: autotools
build_date: "2026-09-10"

source:
  url: "https://github.com/dCache/dcap/archive/refs/tags/2.47.14.tar.gz"
  sha256: "dda98990d93cded815ee425101674ad2f48438fff76b3d4d5d3f91e380e9cc49"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-shared"
    - "--disable-static"
  dependencies:
    - "zlib/1.3.1"
    - "openssl/3.5.6"
    - "cunit/2.1-3"
  dependency_scopes:
    cunit: test_requires
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-musl-opaque-file-stream.patch (musl/OHOS opaque FILE portability)"
  - "patches/0002-musl-preload64-alias.patch (musl/OHOS *64 macro-alias preload dedup)"

knowledge_gained:
  - "GitHub tag 归档无 configure，需 autoreconf -fi 生成（tool_requires automake/autoconf/libtool）"
  - "config.guess 无法识别 HarmonyOS，显式 --build/--host 跳过探测"
  - "生成的 configure 用 umask 077 建临时目录，HMDFS 上需替换为 022"
  - "CUnit 是上游测试专用依赖（test_requires），不进入消费者依赖"

upstream_tests:
  command: "make check"
  total: 11
  assertions: 40
  note: "总数与断言数为源码审计值（11 个 CU_add_test，40 处 CU_ASSERT）；通过数待真机预检 evidence 回填"

test_package:
  command: "./test_dcap"
  assertions: 7
