# test_package/MANIFEST.yml
# 上游官方测试声明文件；详见 docs/TEST_QUALITY_SPEC.md

package: dcap/2.47.14
homepage: "https://github.com/dCache/dcap"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游唯一的测试程序：tests/test_url.c（CUnit，离线解析 dcap URL，
# 无需 dCache 服务端）。11 个 CU_add_test，40 处 CU_ASSERT。
upstream_tests:
  - file: tests/test_url.c
    source: dcap-2.47.14/tests/test_url.c
    description: "CUnit 驱动的 dcap URL 解析官方测试套件"
    command: "./tests/test_url"
    test_count: 11
    assertion_count: 40
    dependency: "cunit/2.1-3 (test_requires)"

# test_package 中自带的消费者视角测试
# 链接已安装的 libdcap，验证版本与错误串离线 API。
test_package_tests:
  - file: test.c
    description: "消费者程序链接 libdcap，验证版本与错误串离线 API"
    command: "./test_dcap"
    assertion_count: 7

# 上游 40 + 消费者测试 7
assertion_count: 47
