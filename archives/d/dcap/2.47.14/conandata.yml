sources:
  url: "https://github.com/dCache/dcap/archive/refs/tags/2.47.14.tar.gz"
  sha256: "dda98990d93cded815ee425101674ad2f48438fff76b3d4d5d3f91e380e9cc49"

patches:
  - patch_file: "patches/0001-musl-opaque-file-stream.patch"
    patch_description: "musl/OHOS opaque FILE 兼容：src/dcap_stream.c 不再触碰 glibc FILE 内部成员（_fileno/_flags/_chain/_lock/_IO_*）与 sizeof(FILE) 伪造 FILE*，改用私有堆令牌注册表保存虚 fd 与 EOF/ERR 位，真 FILE* 经 fileno() 走 system_* 后端；glibc 构建不受影响"
    patch_type: "portability"
  - patch_file: "patches/0002-musl-preload64-alias.patch"
    patch_description: "musl/OHOS 下 *64 为宏别名（open64->open、stat64->stat）：src/dcap_preload64.c 整文件跳过，避免与 dcap_preload.c 重复定义导致 libpdcap 链接失败；glibc 构建不受影响"
    patch_type: "portability"
