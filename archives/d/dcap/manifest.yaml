software: dcap
display: "dcap"
description: "dCache access protocol client library (libdcap, LD_PRELOAD libpdcap and dccp copy tool)"
category: library
homepage: https://github.com/dCache/dcap
license: LGPL-2.1-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tag 归档无 configure，需 autoreconf -fi 生成（tool_requires automake/autoconf/libtool）"
    - "config.guess 无法识别 HarmonyOS，显式 --build/--host=aarch64-unknown-linux-gnu 跳过探测"
    - "生成的 configure 用 umask 077 建临时目录，HMDFS 上需替换为 022（E011/E114 同类）"
    - "CUnit 仅为上游 make check 的 test_requires，不进入消费者依赖"
  common_dependencies:
    - "zlib/1.3.1"
    - "openssl/3.5.6"

versions:
  "2.47.14":
    conan_ref: "dcap/2.47.14"
    status: built
    build_date: "2026-09-10"
