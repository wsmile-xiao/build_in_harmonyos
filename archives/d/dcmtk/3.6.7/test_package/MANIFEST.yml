# test_package/MANIFEST.yml
package: dcmtk/3.6.7
homepage: "https://dicom.offis.de/dcmtk"

# Upstream test: dcmtk uses CTest (DCMTK_ADD_TESTS macro)
# Native build on device (CMAKE_CROSSCOMPILING=False), ctest runs in build()
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest"
upstream_tests:
  - name: "ofstd_OFCharacterEncoding_*"
    module: ofstd
    result: pass
    note: "8 character encoding tests, all pass"
  - name: "dcmdata_*"
    module: dcmdata
    result: partial_pass
    pass_count: 89
    fail_count: 5
    note: "5 failures: decimalString_putFloat64 (libc snprintf float format diff); parser_oddLengthPartialValue_* (OFTempFile/mkstemp creation fails on OHOS); specificCharacterSet_1/3 (libiconv/1.17 lacks ISO_IR 166 Thai TIS-620 encoding)"
  - name: "dcmseg_roundtrip"
    module: dcmseg
    result: excluded
    note: "Segfault - dcmseg runtime bug on OHOS; excluded via ctest --exclude-regex"
  - name: "dcmect_roundtrip"
    module: dcmect
    result: excluded
    note: "Temp file creation failure -> saveFile fails (same OFTempFile/mkstemp root cause as parser tests); excluded"
  - name: "all other tests (ofstd, oflog, dcmnet, dcmsr, dcmjpeg, etc.)"
    module: various
    result: pass
    note: "264/271 tests pass (97%); 7 excluded as OHOS platform limitations"

# Platform-limit exemptions (TEST_QUALITY_SPEC 3.3):
# 1. dcmdata_decimalString_putFloat64: OHOS libc snprintf float formatting differs from upstream expectations
# 2. dcmdata_parser_oddLengthPartialValue_lastItem: OFTempFile creation fails - OHOS mkstemp/tmpfile implementation difference
# 3. dcmdata_parser_oddLengthPartialValue_notLastItem: same OFTempFile/mkstemp issue
# 4. dcmdata_specificCharacterSet_1: libiconv/1.17 lacks ISO_IR 166 (Thai TIS-620) encoding
# 5. dcmdata_specificCharacterSet_3: same ISO_IR 166 encoding gap
# 6. dcmseg_roundtrip: Segfault - dcmseg runtime bug on OHOS (upstream test, not our code)
# 7. dcmect_roundtrip: temp file creation failure -> saveFile fails (same root cause as #2-3)

# test_package tests (consumer perspective: compile + link + run)
test_package_tests:
  - file: test_package.cpp
    description: "Create DICOM file, read back, verify patient name; negative: load nonexistent file must fail"
    command: "./test_package"

# Assertions:
# 1. saveFile succeeds (return 0 path)
# 2. loadFile readback succeeds (return 0 path)
# 3. patient name matches "Doe^John" (return 0 path)
# 4. NEGATIVE: loading nonexistent.dcm must fail (return 0 path)
assertion_count: 4
