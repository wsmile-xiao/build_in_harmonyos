software: dcmtk
version: "3.6.7"
status: built
build_date: ""

source:
  url: "https://dicom.offis.de/download/dcmtk/dcmtk367/dcmtk-3.6.7.tar.gz"
  sha256: "7c58298e3e8d60232ee6fc8408cfadd14463cc11a3c4ca4c59af5988c7e9710a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=<conan_package_folder>"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DDCMTK_NO_TRY_RUN=ON"
    - "-DDCMTK_USE_FIND_PACKAGE=ON"
  dependencies:
    - "zlib/1.3.1.1"
    - "openssl/3.4.1"
    - "libpng/1.6.58"
    - "libtiff/4.6.0"
    - "libxml2/[>=2.12.5 <3]"
    - "libiconv/1.17"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-robust-deps-handling.patch"
  - "0002-cmake-check-openssl-symbol.patch"
  - "0003-ambiguous-overload-operator-equal.patch"
  - "0004-fix-two-segmentation-faults.patch"

knowledge_gained:
  - "DCMTK_NO_TRY_RUN official cross-compile mechanism skips try_run probes"
  - "OHOS platform guard: CMAKE_SYSTEM_NAME=Linux"
  - "3.6.7 < 3.6.8: oficonv not available, use libiconv"
  - "icu not adapted on OHOS, disabled by default"
  - "4 CCI patches: robust deps, openssl symbol check, C++20 overload fix, CVE fix"
