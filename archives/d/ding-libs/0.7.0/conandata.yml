sources:
  "0.7.0":
    url: "https://github.com/SSSD/ding-libs/releases/download/0.7.0/ding-libs-0.7.0.tar.gz"
    sha256: "5df2f202f892b4c1a6caf87f0056398a8288b281da9d7e65cd7637978ec20ef3"
patches:
  "0.7.0":
    - patch_file: "patches/0001-build-config.guess.patch"
      patch_description: "Recognize native OpenHarmony aarch64 as a linux-ohos Autotools system."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-build-config.sub.patch"
      patch_description: "Accept the linux-ohos system tuple in config.sub."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0003-configure.ac.patch"
      patch_description: "Use an HMDFS-compatible temporary-directory umask in generated Autotools scripts."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0004-ini-ini_augment_ut.c.patch"
      patch_description: "Use the HMDFS-observed normalized mode in the INI augmentation permission test."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0005-ini-ini_config_ut.c.patch"
      patch_description: "Use the HMDFS-observed normalized mode in the INI configuration permission test."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0006-ini-ini_configmod_ut_check.c.patch"
      patch_description: "Flush open_memstream before close on OHOS so its final size is published."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0007-ini-ini_configobj.c.patch"
      patch_description: "Use an identity translation macro on OHOS where gettext is unavailable."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0008-ini-ini_parse.c.patch"
      patch_description: "Use an identity translation macro on OHOS where gettext is unavailable."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0009-ini-ini_parse_ut.c.patch"
      patch_description: "Use HMDFS-normalized private-file modes in the INI parser tests."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0010-ini-ini_print.c.patch"
      patch_description: "Use an identity translation macro on OHOS where gettext is unavailable."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0011-ini-ini_save_ut.c.patch"
      patch_description: "Make the save comparison portable and account for HMDFS file mode normalization."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0012-ini-ini_validators_ut_check.c.patch"
      patch_description: "Validate regex diagnostics semantically across libc implementations."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0013-path_utils-path_utils.h.patch"
      patch_description: "Use an identity translation macro on OHOS where gettext is unavailable."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0014-path_utils-path_utils_ut.c.patch"
      patch_description: "Avoid the OHOS /etc symlink when testing path utilities."
      patch_type: "portability"
      strip: 1
