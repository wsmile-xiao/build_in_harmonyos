knowledge_gained:
  - "config.guess/config.sub 需要识别本机 linux-ohos；配方不传 --build/--host/--target。"
  - "通过 configure.ac 源宏重生成 configure，使用 umask 027 兼容 HMDFS 临时目录；生成文件不进入补丁集。"
  - "Autotools bootstrap 使用 autoconf/2.72、automake/1.18、libtool/2.5.4 tool_requires；命令显式使用设备 Perl，并将 PERL5LIB 限定为 Automake 纯 Perl 模块。"
  - "通过 AutotoolsToolchain 注入 Check include 路径，避免修改生成的 Makefile.in；Check 0.15.2 在 OHOS 上使用 CK_FORK=no，并把 TEMP/TMP/TMPDIR 指向构建目录。"
  - "动态 libcheck 仅在 make check 环境中加入其 lib 目录，不用静态 Check 掩盖运行时问题。"
  - "HMDFS 将测试文件权限归一化为 0640，相关上游断言按平台宏处理。"
  - "OHOS SDK 不提供 gettext 声明，源码翻译宏在 OHOS 下使用 identity 处理。"
  - "open_memstream 在 OHOS 上需要 fflush 后再 fclose 才能发布最终缓冲区大小。"
  - "OHOS regex 诊断文本由 libc 实现决定，测试验证语义而非固定诊断字符串。"
