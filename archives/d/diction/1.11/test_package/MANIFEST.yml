# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: diction/1.11
homepage: "https://www.gnu.org/software/diction/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 注意：上游 Makefile 的 check 目标为 `for i in test/test*; do $$i || break; done`，
# 首个失败即 break 且仍返回 0，故 build() 中改为逐个执行 test01..test09 并检查退出码。
upstream_test_in_build: true
upstream_test_command: "sh ./test/test0N (N=1..9)，逐个检查退出码"

# 上游测试程序（test/test01..test09，共 9 个）
upstream_tests:
  - file: test/test01
    description: "Two regular sentences"
  - file: test/test02
    description: "Ending ellipsis"
  - file: test/test03
    description: "Beginning ellipsis"
  - file: test/test04
    description: "Omission ellipsis"
  - file: test/test05
    description: "Stemming"
  - file: test/test06
    description: "Recovery"
  - file: test/test07
    description: "End of sentence 1"
  - file: test/test08
    description: "End of sentence 2"
  - file: test/test09
    description: "Suffix matching"

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_diction.sh 验证随包安装的 diction 二进制 + 短语库可正常工作"
    command: "conan create (test_package: sh test_diction.sh <package_folder>)"
  - file: test_diction.sh
    description: "消费者测试 5 项：--version 版本输出 / 短语库 share/diction 随包安装 / 默认查找路径下真实短语标记与统计行 / -f 显式短语库与 -q 静默模式 / 鸿蒙安装目录迁移后相对路径查找"
    command: "sh test_diction.sh <package_folder>"

assertion_count: 5
harmonyos_consumer_tests:
  - file: test_diction.sh
    description: "复制 Conan 包到新的安装目录后，真实执行 diction 并验证相对可执行文件的短语库查找与结果统计"
