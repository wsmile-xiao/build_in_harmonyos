# conandata.yml — diction 1.11
# 官方源码（GNU FTP 主站，R39）：https://ftp.gnu.org/gnu/diction/
sources:
  "1.11":
    url: "https://ftp.gnu.org/gnu/diction/diction-1.11.tar.gz"
    sha256: "35c2f1bf8ddf0d5fa9f737ffc8e55230736e5d850ff40b57fdf5ef1d7aa024f6"

patches:
  "1.11":
    - patch_file: "patches/0001-Makefile.in.patch"
      patch_description: "HMDFS 不支持硬链接（知识库 E079）：短语库语言文件 C 的 'ln en C' 改为 'rm -f C; cp en C'，否则 make install 直接失败"
      patch_type: "portability"
    - patch_file: "patches/0002-config.guess.patch"
      patch_description: "config.guess（2006 年版）不识别 HarmonyOS：补 ohos 分支，configure 得到 aarch64-unknown-linux-ohos"
      patch_type: "portability"
    - patch_file: "patches/0003-config.sub.patch"
      patch_description: "config.sub（2006 年版）不识别 ohos：补 basic_machine/OS 映射，配合 config.guess 输出合法目标三元组"
      patch_type: "portability"
    - patch_file: "patches/0004-configure.patch"
      patch_description: "HMDFS 权限语义（知识库 E011）：configure 的 mktemp -d 临时目录受 umask 077 影响导致 config.status 无法写入，改为显式 umask 022"
      patch_type: "portability"
    - patch_file: "patches/0005-diction.c.patch"
      patch_description: "运行期短语库目录改为相对可执行文件查找（/proc/self/exe，回退 configure 期 SHAREDIR）：安装/移动到任意前缀后默认查找路径均可用"
      patch_type: "portability"
    - patch_file: "patches/0006-configure-disable-libintl.patch"
      patch_description: "OHOS 环境的 libintl 头文件可能存在但实现不完整：强制关闭 gettext/libintl 探测，避免链接生成 -lintl 后出现 g_libintl_* 未定义"
      patch_type: "portability"
