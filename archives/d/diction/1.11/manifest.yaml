# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.11"

# 软件名
software: "diction"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/diction/diction-1.11.tar.gz"

  # 源码校验和
  sha256: "35c2f1bf8ddf0d5fa9f737ffc8e55230736e5d850ff40b57fdf5ef1d7aa024f6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-nls"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.in.patch"
  - "0002-config.guess.patch"
  - "0003-config.sub.patch"
  - "0004-configure.patch"
  - "0005-diction.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_ref:
  - "E007"
  - "E011"
  - "E079"
knowledge_gained:
  - "复用 E007（ref: E007）：2006 年版 config.guess/config.sub 不识别 HarmonyOS，补 ohos 分支后 configure 得到 aarch64-unknown-linux-ohos"
  - "复用 E011（ref: E011）：HMDFS 下 configure 的 mktemp -d 临时目录受 umask 077 影响，config.status 无法写入；补丁改为显式 umask 022"
  - "复用 E079（ref: E079）：HMDFS 不支持硬链接，make install 的 'ln en C' 改为 'rm -f C; cp en C'"
  - "新增（ref: DRAFT-diction-1.11-runtime-data-relocatable）：diction 把短语库目录(SHAREDIR)编译期烧进二进制，安装/迁移到其它 prefix 后默认查找失效；改为 /proc/self/exe 相对查找并以 SHAREDIR 回退"
  - "新增（ref: conan-2-api）：Conan 2 的 ConanException 在 conan.errors 中（from conan import ConanFile, ConanException 会 ImportError，conan create 直接加载失败）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

