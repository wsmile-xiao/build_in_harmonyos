# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dawn/0.0-git20260529.432db5d7
homepage: "https://dawn.googlesource.com/dawn"

# 上游测试命令 (cmake 构建)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试在本地单独运行 (见 reports/), conan create 仅构建库
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (本地 build-min 全量运行记录)
upstream_tests:
  - file: src/tint/**/test.cc (Tint unit tests)
    source: dawn-0.0-git20260529.432db5d7/src/tint
    description: "Tint WGSL compiler unit tests (44484 cases / 1073 suites)"
    command: "./tint_unittests"
    result: "44484/44484 PASS (100%)"
  - file: src/dawn/tests/end2end/*.cpp
    source: dawn-0.0-git20260529.432db5d7/src/dawn/tests/end2end
    description: "Dawn end2end tests on Null backend (292 cases / 10 suites)"
    command: "./dawn_end2end_tests --use-wgpu-adapter=none"
    result: "292/292 PASS (100%)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 真实调用 wgpuCreateInstance/wgpuInstanceRelease 验证库可链接、Null 后端可初始化"
    command: "./test_dawn"
    result: "PASS"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 44776
