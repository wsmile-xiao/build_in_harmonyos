software: dee
# 版本级 manifest
# 文件位置: archives/d/dee/1.2.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "1.2.7"
status: built
build_date: "2026-09-05"
build_system: autotools

source:
  url: "https://launchpad.net/dee/1.0/1.2.7/+download/dee-1.2.7.tar.gz"
  sha256: "1bf0336ce684aa0f48d6eae2469628c1a9b43695a77443bc31a5790aa673bf8a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-maintainer-flags"
    - "--disable-icu"
    - "--disable-extended-tests"
    - "--disable-trace-log"
  dependencies:
    - glib/2.84.0.1.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-ohos.patch"

knowledge_gained:
  - "dee 核心依赖仅 glib 族（glib-2.0/gobject-2.0/gio-2.0/gthread-2.0/gio-unix-2.0 >= 2.32）：D-Bus 经 glib 的 GDBus，无需外部 dbus/dbus-glib 包"
  - "OHOS 本机 uname -s 返回 'HarmonyOS'（非 Linux）：旧版 config.guess 需加 aarch64:HarmonyOS 分支（同保留 aarch64:Linux 分支供 CI worker 用）"
  - "glib conan 包未装 gio-unix-2.0.pc：配方 generate 生成 gio-unix-2.0.pc shim（Requires: gio-2.0，gio-unix 属 glib 一部分）"
  - "-Werror 默认开启（odd micro 1.2.7）→ --disable-maintainer-flags"
  - "OHOS 设备怪癖：umask 077 建的目录（0700）在 hmdfs 缓存路径拒绝 owner 写 → configure 的 config.status 临时目录 'Permission denied'；修复=配方 build() 在 configure 前把 configure 脚本的 umask 077 改 022（隔离复现确认）"
  - "dee 头文件平铺安装于 include/dee-1.0/（无 dee/ 子目录）；DeeModel 是接口需用具体实现（dee_sequence_model_new）"

patch_generation:
  method: per-file-difflib
  patches_count: 1

test_results:
  type: manual
  total: 188
  passed: 182
  failed: 6
  note: "上游 test-dee 逐用例（g_test -p 单测模式，build() 内实跑）182/188 = 96.8%（口径 passed/(passed+failed+errors)，无 skipped/xfailed，N=188 全量最小单元，TAP 1..188 确认）；6 个失败同为 g_test_trap_assert_stderr 断言：OHOS 上 glib 的 CRITICAL 消息落 STDOUT 而子进程 stderr 为空 → 模式匹配失败 → Bail out（exit 134）：/Model/Sequence/Column/NoSchemas、/Model/Proxy/Column/NoSchemas、/ModelTags/SequenceModel/NoTags、/ModelTags/SequenceModel/OneTag、/ModelTags/SharedModel/NoTags、/ModelTags/SharedModel/OneTag；改断言会破坏 Linux 不可安全消除（R8）；test_package R34 PASS（1 通过）；适配后合计=上游 188 + 新增 1 = 189；make check 的 tests 步骤依赖 dbus-test-runner（CI 无）已由逐用例运行器替代；extended-tests 需 gtx 框架（ohpcd 无）--disable-extended-tests"
