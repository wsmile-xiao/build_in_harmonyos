software: dnstap-ldns
# 版本级 manifest
version: "0.2.1"
status: built
build_date: "2026-09-25"
build_system: autotools

source:
  url: "https://github.com/dnstap/dnstap-ldns/archive/refs/tags/v0.2.1.tar.gz"
  sha256: "1a1b642a8ba52bd2afdedd0115ba30b00a3d330de78c5a1a6a1c8335c72d42e9"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - "ldns/1.9.0"
    - "libfstrm/0.6.1"
    - "protobuf-c/1.5.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-ac-module-name-and-protoc.patch"
  - "0002-makefile-use-pre-generated-pb-c.patch"

knowledge_gained:
  - "ohpcd 发布的 ldns/1.9.0 pkg-config 模块名为 ldns（非上游 libldns），PKG_CHECK_MODULES 模块名需修正"
  - "ohpcd 发布的 protobuf-c/1.5.1 包剥离 bin/（无 protoc-c 工具）；消费 .proto 的 autotools 库可作者期用 protoc-gen-c 预生成 pb-c 绑定并 patch 掉 protoc-c 硬依赖"
  - "config.status 临时目录 E011/E114：autoreconf 生成的 configure 中 umask 077 替换为 umask 022（与 libfstrm/ldns 一致）"
  - "make -j2 触发 E074（HMDFS jobserver fifo EPERM），用 -j1"

compiled_tools:
  - name: "dnstap-ldns"
    status: "success"
    type: "CLI（bin/dnstap-ldns）"
    usage: "dnstap-ldns -r <file> | -x [hex|RFC3597] [-q|-y]"
    consumer_verified: true