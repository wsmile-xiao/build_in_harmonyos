# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dnstap-ldns/0.2.1
homepage: "https://github.com/dnstap/dnstap-ldns"

# 上游测试命令（dnstap-ldns 是参考工具，无 make check 测试目标）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：0.2.1 无上游自动化测试（bin_PROGRAMS 仅 dnstap-ldns）
upstream_tests: []

# test_package 自带的消费者测试（L0c 真实测试源）
test_package_tests:
  - file: test_dnstap_ldns.c
    description: "消费者测试（真实测试源）：编译 test_dnstap_ldns.c，经已安装 bin/dnstap-ldns 的 -x/-x -y 公开 CLI 解码真实 dnstap protobuf（hex 7801721008011001180122047f00000130353835 = Dnstap{type=MESSAGE, message={AUTH_QUERY, INET, UDP, 127.0.0.1, 53/53}}），断言输出含 AQ/127.0.0.1/AUTH_QUERY，退出码 0"
    command: "test_dnstap_ldns <bin/dnstap-ldns 绝对路径>（由 test() 调用）"
  - file: conanfile.py
    description: "test() 编译 test_dnstap_ldns.c 后以已安装二进制路径运行并断言可观察输出"

# 测试断言总数
assertion_count: 3