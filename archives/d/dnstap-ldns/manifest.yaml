software: dnstap-ldns
display: "dnstap-ldns"
description: "dnstap 编码的 DNS 流量解码参考工具：支持 Frame Streams、裸 hex protobuf、RFC 3597，输出 quiet text / YAML 两种格式"
category: network
homepage: "https://github.com/dnstap/dnstap-ldns"
license: Apache-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tag archive 无 configure，需 autoreconf 自举（tool_requires automake/libtool，autoconf 2.72 来自系统）"
    - "dnstap.pb-c.c/.h 在配方作者期用 protobuf-c 1.5.1 的 protoc-gen-c 预生成；ohpcd 发布的 protobuf-c 包剥离 bin/ 无 protoc-c 工具，configure.ac 改为不要求 protoc-c，Makefile.am 直接使用预生成源码"
    - "ohpcd ldns/1.9.0 制品 pkg-config 模块名为 ldns（非上游 libldns），configure.ac 模块名已修正"
    - "config.status 临时目录 E011/E114：生成的 configure 中 umask 077 替换为 umask 022"
    - "make 需 -j1（E074：HMDFS jobserver fifo EPERM）"
    - "config.guess 无法识别 HarmonyOS，显式传 --build/--host=aarch64-unknown-linux-ohos"
  common_dependencies:
    - ldns
    - libfstrm
    - protobuf-c

versions:
  "0.2.1":
    status: built
    build_date: "2026-09-25"
    conan_ref: "dnstap-ldns/0.2.1"