# 软件级 manifest — dh-sysuser
# 遵循 ARCHIVE-SPEC v3.0
software: dh-sysuser
display: "dh-sysuser"
description: "Debhelper 插件，用于在软件包安装/卸载时创建系统用户与组（Debian 官方 dh 序列 addon）"
category: system
homepage: "https://salsa.debian.org/debian/dh-sysuser"
license: GPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Perl / POSIX sh 脚本包（Debian native 源，无 Makefile/configure），不需要编译，直接安装脚本 + 手册页"
    - "缺 Debian::Debhelper::Dh_Lib 时 dh_sysuser 无法执行；可独立执行的 minsysusers（纯 perl）与 sysuser-helper（POSIX sh）在 CI worker 上用真实解释器执行"
    - "上游 debian/tests/sysuser-helper autopkgtest 依赖 apt-get/root/dpkg 与 useradd，OHOS 无法承载，已在 Debian 13 chroot 中用本包产物替换运行时后真实执行（1/1 通过），证据见 reports/upstream-autopkgtest-evidence.md"
    - "test_package 共 10 条断言：产物存在性/内容标记 + 真实执行（perl -c/perl 运行 minsysusers、sh -n/sh 运行 sysuser-helper），L2 的 --version 探测为警告级（非阻断）"
  common_dependencies: []

versions:
  "1.6.0":
    status: built
    build_date: "2026-09-11"
    conan_ref: "dh-sysuser/1.6.0"