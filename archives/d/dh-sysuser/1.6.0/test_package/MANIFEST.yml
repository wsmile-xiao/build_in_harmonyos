# test_package/MANIFEST.yml
# 上游官方测试声明文件 — dh-sysuser 1.6.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dh-sysuser/1.6.0
homepage: "https://salsa.debian.org/debian/dh-sysuser"

# 上游纯脚本包（Debian native，无 Makefile/configure，无编译产物 → build() 无 make check）
upstream_check_command: "none"

upstream_test_in_build: false
upstream_test_command: "debian/tests/sysuser-helper (DEP-8 autopkgtest)"

# 上游官方测试：Debian autopkgtest (DEP-8)。实测用例数 N=1（debian/tests/ 下唯一的测试）。
# 已真实执行：1 发现 / 1 执行 / 1 通过 / 0 失败 → 通过率 100%。
upstream_tests:
  - name: sysuser-helper
    type: autopkgtest
    location: "debian/tests/sysuser-helper"
    control: "debian/tests/control (Depends: runit-helper; Restrictions: needs-root, allow-stderr)"
    description: "安装 runit 包后断言 _runit-log 系统用户被创建（remove 后保留）"
    discovered: 1
    executed: 1
    passed: 1
    failed: 0
    skipped: 0
    pass_rate: "100% (1/1)"
    executed_in: "Debian 13 (trixie) chroot — 详见 reports/upstream-autopkgtest-evidence.md"
    execution_note: >-
      上游脚本逐字硬依赖 apt-get / root / dpkg：安装 runit 包 → 触发该包 postinst 中由
      dh_sysuser/1.6.0 生成的片段 → 调用 /usr/sbin/minsysusers → 创建 _runit-log。
      OpenHarmony 无 apt/dpkg，也无 useradd/groupadd（shadow-utils），该链路在 OHOS
      目标环境内不可承载，故在 Debian 13 trixie 用户态真实执行上游脚本本体：
      RUN A（基线，发行版运行时）与 RUN B（把本包产出的 minsysusers / sysuser-helper /
      dh_sysuser / autoscripts 替换进 Debian 安装路径）均退出码 0，_runit-log 创建成功。
    evidence: "reports/upstream-autopkgtest-evidence.md"

# OHOS 侧 test_package：产物断言 + 真实执行包内脚本本体
test_package_tests:
  - file: test.sh
    description: >-
      产物断言（3 个 CLI 脚本存在性 + dh_sysuser 版本标记 1.6.0 + minsysusers 内容标记 +
      sysuser-helper sh shebang）与真实执行（perl -c minsysusers、perl minsysusers 用法路径、
      sh -n sysuser-helper、sh sysuser-helper prerm）
    command: "test.sh {bin_dir}"

# 10 条断言（perl 可用时）；宿主无 perl 时跳过 4 条执行类断言并打印 WARN
assertion_count: 10
