# 版本级 manifest — dh-sysuser 1.6.0
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 为 CI 唯一构建输入，本文件为人读索引）

version: "1.6.0"

software: "dh-sysuser"

# 编译状态：built（CI 校验通过后由 maintainer 提升为 published）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-11"
build_system: custom
# 包类型：application（CLI 工具，非库；r46 供 conan-init 生成器读取）
package_type: application

source:
  # 源码下载 URL（Debian 官方 pool，native 源）
  url: "https://deb.debian.org/debian/pool/main/d/dh-sysuser/dh-sysuser_1.6.0.tar.xz"

  # 源码校验和（sha256sum 核验）
  sha256: "c11f350279c9d7e3c730f664c79cbd8c65a22255349f1ad2b1f9dc70afbf3f60"

  # 压缩格式
  tar_format: tar.xz

build:
  # 构建系统类型：custom（纯脚本包，无 Makefile/configure/CMake）
  system: custom

  # 配置选项列表（无）
  configure_options: []

  # 编译依赖列表 — 无外部依赖（零编译；运行时依赖 perl，非构建依赖）
  dependencies: []

  # 编译器（无编译，声明字段保留）
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
- "dh-sysuser 是 Debian native 源：纯 Perl/POSIX sh 脚本，无任何构建系统，文件按 debian/dh-sysuser.install 布局安装，Conan 配方只需 get + 安装脚本与手册页，build() 空操作"
- "上游 autopkgtest（debian/tests/sysuser-helper）逐字依赖 apt-get/root/dpkg，断言的是「安装用 dh-sysuser 构建的 deb 包 → postinst 调用 minsysusers/sysuser-helper → 系统用户被创建」链路；OHOS 无 apt/dpkg/shadow-utils，无法承载，需在 Debian 用户态执行，并把本包产出的运行时文件替换进 Debian 安装路径才能让断言覆盖适配产物（RUN A 基线 / RUN B 适配产物双双退出码 0，N=1 通过 1）"
- "OHOS 无 debhelper 用户管理后端，dh_sysuser --version 无法执行（缺 Debian::Debhelper::Dh_Lib）；可独立执行的 minsysusers（纯 perl，仅核心模块）与 sysuser-helper（POSIX sh）可在 CI worker 上用真实解释器执行，作为真实执行断言"
- "上游 License 为 GPL-3.0-or-later（minsysusers* 单独为 BSD-3-clause），commands.json 标记 binary=false（非 ELF 产物）"