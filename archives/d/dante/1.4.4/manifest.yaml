# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 需要替换+patch以支持 OHOS triplet，且需添加 linux-ohos* 到 config.sub 有效 kernel-OS 组合"
  - "E011: HMDFS 上 umask 077 && mktemp 创建临时目录权限异常(drwx--S---)，需去掉 umask 并改临时目录为 ${TMPDIR:-/tmp}"
  - "OpenHarmony musl libc 不支持 _res 全局变量(resolver state)，需 HAVE_NO_RESOLVESTUFF=1，这会导致 TCP resolver 协议选项不可用"
  - "OpenHarmony 不支持 cpu_set_t 类型(CPU affinity)，虽然 sched_setaffinity 函数存在，需 HAVE_SCHED_SETAFFINITY=0 和 HAVE_CPU_EQUAL=0"
  - "Dante configure 会测试 IP_FINDPMTU，OHOS 未定义此宏导致某些编译测试失败但不影响最终 configure 完成"
  - "Dante 无自带测试套件(has_tests=False)，需手动功能验证"
  - "sockd 需要root权限才能正常启动(配置权限系统)，非root环境仅能做配置验证(-V)"
  - "Dante 使用 K&R 风格函数定义，编译时产生大量 -Wdeprecated-non-prototype 警告，不影响功能"
  - "make 触发 config.status --recheck 可能在某些环境失败，需在 Makefile 中禁用 --recheck 规则"

