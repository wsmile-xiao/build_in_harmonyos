# 软件级 manifest - dwgsim
# 遵循 ARCHIVE-SPEC v3.0

software: dwgsim
display: "dwgsim (Distribution Wrapped Genome SIMulator)"
description: "面向新一代测序数据的短读段模拟器，按参考基因组与给定变异生成 FASTQ 读段，并附带评估工具 dwgsim_eval"
category: bioinformatics
homepage: "https://github.com/nh13/DWGSIM"
license: GPL-3.0-only

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 .gitmodules 声明 samtools 子模块，tag 归档里 samtools/ 为空；按该 tag 树固定的 gitlink commit 28391e5898804ce6b805016d8c676fdf61442eb3 取官方归档解到 samtools/"
    - "Makefile 默认目标是 all-recur，会把带 ncurses 依赖的 samtools 可执行文件一起编出来；显式指定 dwgsim dwgsim_eval 只走 lib-recur（libbam.a + DWGSIM 对象），绕开 ncurses"
    - "PACKAGE_VERSION 必须作为带引号的 C 字符串进入预处理；直接喂 -DPACKAGE_VERSION=\"0.1.14\" 会被配方 shell 剥成裸 0.1.14 并报 invalid suffix '.14' on floating constant"
    - "上游 Makefile 硬编码 CC=gcc，且 -lz 由 `$(CC) $(CFLAGS)` 链接，故 CC 从 Conan profile 取、zlib 的 include/lib 绝对路径并入 CFLAGS（R33/R26）"
    - "make test 目标写死 /bin/bash，OHOS 无此路径；build() 用 PATH 中的 bash 执行同一 testdata/test.sh，脚本零改动"
    - "OHOS 需对安装后的 ELF 就地签名，否则消费者测试无法执行"
  common_dependencies:
    - "zlib/1.3.1"

versions:
  "0.1.14":
    status: built
    build_date: 2026-10-08
