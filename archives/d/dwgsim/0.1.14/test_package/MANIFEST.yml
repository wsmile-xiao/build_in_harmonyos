# test_package/MANIFEST.yml - dwgsim 0.1.14
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dwgsim/0.1.14
homepage: "https://github.com/nh13/DWGSIM"

# 上游测试命令
# 上游 Makefile 的 `make test` 目标写死 `/bin/bash testdata/test.sh`，
# OHOS 无 /bin/bash，故由配方 build() 直接以 PATH 中的 bash 执行同一脚本，
# 脚本内容零改动。
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "bash testdata/test.sh"

# 上游实际运行的测试程序
upstream_tests:
  - file: testdata/test.sh
    source: DWGSIM-dwgsim.0.1.14/testdata/test.sh
    description: "以 -z 13 -N 10000 从 samtools/examples/ex1.fa 生成 10000 条读段，并把 5 个输出与仓内期望文件逐个 diff"
    command: "bash testdata/test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_dwgsim.c
    description: "生成 2x1500bp 参考序列，真实调用已安装的 dwgsim 生成 100 对读段并断言 5 个输出非空，再调用 dwgsim_eval -h 断言用法横幅"
    command: "./test_dwgsim <bindir>/dwgsim <bindir>/dwgsim_eval"

# 测试断言总数
assertion_count: 7
