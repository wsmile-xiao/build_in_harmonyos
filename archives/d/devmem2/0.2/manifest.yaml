software: devmem2
display: "devmem2"
description: "Read/write from/to any location in memory (single .c file, ~200 lines), GPL-2.0"
category: system
homepage: "https://github.com/literming/devmem2"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "单 .c 文件 + Makefile，~200 行 C 代码，极简"
    - "无外部库依赖（仅 libc：mmap/munmap 用于映射 /dev/mem）"
    - "OHOS musl <sys/mman.h> 完整 mmap 支持，与 glibc 兼容"
    - "默认 /dev/mem 在 OH 内核不一定导出给普通进程，但 conan 适配只需 build 成功，runtime 可在特权 shell 用"
    - "支持 byte/halfword/word 三种访问宽度，可读写任意地址"
  common_dependencies:
    - libc (mmap/munmap/open/close/printf)
    - linux-kernel (/dev/mem 字符设备)

versions:
  "0.2":
    status: built
    build_date: "2026-09-09"
    source_url: "https://github.com/literming/devmem2/archive/refs/tags/0.2.tar.gz"
    source_sha256: "4FBE24670BD8B4A31C31E3D7FFFCAD8C2D6616D90A9BAC9A3486C82DFCF55DFE"
