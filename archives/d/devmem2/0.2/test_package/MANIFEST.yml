# test_package/MANIFEST.yml — devmem2 0.2
package: devmem2/0.2
homepage: "https://github.com/literming/devmem2"

# 上游无独立测试套件（GPL 内存读写工具，单 .c 文件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（验证 devmem2 binary 可执行 + 无参数时输出 Usage 提示）
test_package_tests:
  - file: test_devmem2.c
    description: "消费者测试 3 条：devmem2 存在/可执行；真实执行有输出；输出含 'Usage' 提示（popen 直读，不写只读的 /tmp）"
    command: "test_devmem2"

# 测试断言总数
assertion_count: 4
