software: duff
display: "duff"
description: "重复文件查找命令行工具（duplicate file finder）"
category: system
homepage: "http://duff.sourceforge.net/"
license: Zlib
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Git tag 快照不含 configure/Makefile.in/build-aux/po 基础设施，build() 须自行引导：tool_requires automake/1.18 + m4/1.4.19 + gettext/0.22.5.1（autoconf/autoreconf 用镜像自带）+ ACLOCAL_PATH + AUTOPOINT=true"
    - "gettext 包内 autopoint/gettextize 以 prefix=/ 构建（datadir 解析为 //share/gettext）且有 AM_GNU_GETTEXT_VERSION 依赖，均不可用；改用从 share/gettext 复制 po 基础设施文件（E007 同类做法见 authselect/libzbar/centerim5）"
    - "config.guess 无 HarmonyOS 分支（E007）：configure 报 cannot guess build type，需在 autoreconf 后补 *:HarmonyOS:*:*) 分支与 __OHOS__ libc 探测（禁止 --build/--host 绕过）"
    - "configure 的 config.status 临时目录用 umask 077（E114）：HMDFS 下生成 drwx--S--- 不可写，写 subs1.awk 报 Permission denied，须去掉 umask 077"
    - "OHOS musl libc 不含 libintl：gettext/0.22.5.1 作为 host 依赖提供 libintl.h+libintl.so，configure 才判定 USE_NLS=yes（否则译文静默丢失）"
    - "po/LINGUAS 声明 en@quot/en@boldquot，po/Makevars 必须 include $(srcdir)/Rules-quot，否则 po/ 的 make 报 File en@boldquot.po does not exist"
    - "不要 tool_requires autoconf：其传递依赖 perl 注入 PERL5LIB 会打破系统 autoreconf（PERL5LIB ABI 冲突）"
    - "gettext 的 cpp_info.libs 含未随包提供的 asprintf：AutotoolsDeps 会把 -lasprintf 塞进 LIBS 导致 conftest 失败，需按需收敛 LIBS"
    - "启用 NLS 时二进制内 LOCALEDIR 为根前缀绝对路径，与 Conan --prefix=/ 可重定位布局存在取舍（payload 在 <pkg>/share/locale）"
  common_dependencies:
    - gettext

versions:
  "0.5.2":
    status: built
    build_date: "2026-09-30"
    conan_ref: "duff/0.5.2"
