# test_package/MANIFEST.yml
# 上游测试声明 — duff 0.5.2（R37 首次适配版本号）
#
# 上游**没有**自动化测试套件（清点证据见 notes.md「上游测试入口核验」）：
#   * 无 tests/ 目录（源码树只有 lib/ m4/ man/ po/ src/）
#   * Makefile.am / src/Makefile.am / lib/Makefile.am / man/Makefile.am
#     中无 TESTS / check_PROGRAMS / BUILD_TESTING 注册（grep rc=1）
#   * `make check` → "Nothing to be done for 'check'."（4 个目录均无测试）
#   * CHECKLIST 只要求人工 "Test the changes"
# 唯一可执行的上游测试入口是 README.SHA:126-133 声明的编译期自测宏。

package: duff/0.5.2
homepage: "http://duff.sourceforge.net/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# conanfile.py build() 中是否集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际可运行的测试入口：SHA*_TEST 编译期自测（NIST 样例向量，4 算法 × 3 条）
upstream_tests:
  - file: sha1.c
    source: duff-0.5.2/src/sha1.c
    description: "SHA1_TEST 自测（sha1.c 内 #ifdef SHA1_TEST，3 条 NIST 向量：\"abc\" / 448-bit / 1e6×'a'）"
    command: "clang -Wall -O2 -DSHA1_TEST -DHAVE_CONFIG_H -Isrc -o t_sha1 src/sha1.c && ./t_sha1"
  - file: sha256.c
    source: duff-0.5.2/src/sha256.c
    description: "SHA256_TEST 自测（3 条 NIST 向量）"
    command: "clang -Wall -O2 -DSHA256_TEST -DHAVE_CONFIG_H -Isrc -o t_sha256 src/sha256.c && ./t_sha256"
  - file: sha384.c
    source: duff-0.5.2/src/sha384.c
    description: "SHA384_TEST 自测（3 条 NIST 向量）"
    command: "clang -Wall -O2 -DSHA384_TEST -DHAVE_CONFIG_H -Isrc -o t_sha384 src/sha384.c && ./t_sha384"
  - file: sha512.c
    source: duff-0.5.2/src/sha512.c
    description: "SHA512_TEST 自测（3 条 NIST 向量）"
    command: "clang -Wall -O2 -DSHA512_TEST -DHAVE_CONFIG_H -Isrc -o t_sha512 src/sha512.c && ./t_sha512"

# test_package 自带的消费者端到端验证（真实执行包内二进制）
test_package_tests:
  - file: test_duff.sh
    description: "消费者测试 — 执行安装好的 duff：重复检测/摘要选择/excess 模式等上游行为 14 项 + OHOS 平台契约 7 项（AArch64 ELF、libintl.so.8、msgunfmt 校验译文、内置 LOCALEDIR）"
    command: "bash test_duff.sh"

# 上游测试断言总数（4 算法 × 3 条 NIST 向量；test_package 另 21 项=14 上游行为 + 7 OHOS 契约，不计入）
assertion_count: 12
