version: "0.5.2"
software: "duff"
status: built
build_system: autotools          # submit 自检必填（同时保留下方 build.system）
build_date: "2026-09-30"
conan_ref: "duff/0.5.2"

source:
  url: "https://github.com/elmindreda/duff/archive/refs/tags/0.5.2.tar.gz"
  sha256: "149dd80f9758085ed199c37aa32ad869409fa5e2c8da8a51294bd64ca886e058"
  tar_format: tar.gz
  # 官方发布 tarball（SourceForge）在本环境不可达（curl rc=52/35/28），
  # 使用上游作者仓库同一 tag 的快照；该快照为 Git 树，需自行引导构建系统。

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>（Conan AutotoolsToolchain 自动注入）"
    - "CPPFLAGS/LDFLAGS：由 AutotoolsDeps 注入 gettext 包 include/lib（启用 NLS）"
  dependencies:
    - gettext/0.22.5.1
  build_tools:
    - automake/1.18
    - m4/1.4.19
    - gettext/0.22.5.1
  build_tools_note: "autoconf/autoreconf/autoheader 使用镜像自带版本（/data/service/hnp/bin，2.72）；不声明 tool_requires(autoconf/2.72)——其传递依赖 perl/5.42.2 注入 PERL5LIB 会破坏系统 autoreconf"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-po-Makevars.patch"

knowledge_gained:
  - "Git tag 快照无 configure/Makefile.in：autoreconf -fi 需要 automake(aclocal)+autoconf；gettext 包的 autopoint 因 prefix=/ 不可用，改用 ACLOCAL_PATH + AUTOPOINT=true + 从 share/gettext 复制 po 基础设施"
  - "E007：GNU config.guess 2024-07-27 无 HarmonyOS 分支，uname -s=HarmonyOS 时 configure 报 cannot guess build type；补 *:HarmonyOS:*:*) 分支产出 aarch64-unknown-linux-ohos"
  - "E114：configure 的 (umask 077 && mktemp -d ./confXXXXXX) 在 HMDFS 上生成 drwx--S--- 目录，config.status 写 subs1.awk 报 Permission denied；去掉 umask 077 后 configure rc=0"
  - "OHOS musl libc 无 libintl：不注入 gettext 的 include/lib 时 configure 静默 USE_NLS=no（译文全丢）；注入后 'GNU gettext in libintl... yes / whether to use NLS... yes'，4 个语言目录入包"
  - "po/LINGUAS 含 en@quot/en@boldquot 时 po/Makevars 必须 include $(srcdir)/Rules-quot，否则 make 报 File en@boldquot.po does not exist"
  - "HMDFS 不支持硬链接（ln 报 EPERM），duff -p physical 语义无法在 OHOS 上用例验证"
  - "tool_requires(autoconf/2.72) 的传递依赖 perl/5.42.2 注入 PERL5LIB，使系统 autoreconf 加载不兼容 Cwd.so（Perl_my_cxt_init: symbol not found）→ 不声明 autoconf，用镜像自带 2.72"
  - "gettext 的 cpp_info.libs 含 asprintf 但包内无 libasprintf：AutotoolsDeps 把整个 libs 写进 LIBS，conftest 链接 -lasprintf 失败 → generate() 收敛 LIBS 为 -lintl"
  - "conanrun 下 test_package 的 grep 命中 /system/bin/grep（toybox 0.8.12），二进制文件内容检索恒 0 命中 → 用 msgunfmt 文本化后断言"
  - "autoconf 绝对 LOCALEDIR（//share/locale）与 Conan --prefix=/ 可重定位布局的取舍：从 cache 直接运行不加载译文，TEXTDOMAINDIR 不可覆盖"

