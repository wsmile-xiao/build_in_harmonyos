# 版本级 manifest — dosfstools 4.2
# 文件位置: archives/d/dosfstools/4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.2"

# 软件名
software: "dosfstools"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-08"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian pristine = 上游 release tarball，池内同目录带上游 .asc 签名）
  # 2026-10-08 实测: https 200/320917B、http 200/320917B，sha256 与
  # dosfstools_4.2-1.dsc 的 Checksums-Sha256 逐字节一致
  url: "https://deb.debian.org/debian/pool/main/d/dosfstools/dosfstools_4.2.orig.tar.gz"

  # 源码校验和
  sha256: "64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  # config.guess 不认识 HarmonyOS uname（E007 族），设备为原生 aarch64
  # --sbindir 指到 prefix/bin：上游用 sbin_PROGRAMS，而框架的产物核验
  # （Step5/6/8）按 bin/* 清点；conan 侧 AutotoolsToolchain 同样把
  # --sbindir 收到 ${prefix}/bin，两处布局一致
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--build=aarch64-unknown-linux-gnu"
    - "--sbindir=$HOME/usr/local/bin"
    - "--enable-compat-symlinks"
  # 编译依赖列表（格式: name/version）
  # 本包零三方依赖（仅 libc）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本包无源码补丁：umask/xxd 两处均走配方内环境层处置）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
