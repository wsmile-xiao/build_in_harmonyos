# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
# 依据: dosfstools-4.2 原始 tarball 的 tests/Makefile.am 与 test-* 驱动脚本，
#       2026-10-08 在构建机上对实物源码树清点。

package: dosfstools/4.2
homepage: "https://github.com/dosfstools/dosfstools"

# 上游测试命令（automake TESTS 套件）
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 check   # automake 并行测试驱动, tests/ 目录"

# 上游实际运行的测试程序（3 个驱动脚本 + 其 40 条 TESTS 用例）
upstream_tests:
  - file: test-mkfs
    source: dosfstools-4.2/tests/test-mkfs
    description: "用 mkfs.fat 生成镜像并与 tests/<name>.xxd 参考十六进制转储逐字节比对"
    command: "make check （referenceFAT12 / referenceFAT16 / referenceFAT32 / referenceFAT32mbr / mkfs-fat32_2_res_sects / mkfs-fat32_4K）"
  - file: test-fsck
    source: dosfstools-4.2/tests/test-fsck
    description: "从十六进制转储重建带缺陷的 FAT 镜像，两轮运行 fsck.fat 后与参考镜像比对"
    command: "make check （check-* 系列，含 bad_names / chain / circular / duplicate / label 等）"
  - file: test-label
    source: dosfstools-4.2/tests/test-label
    description: "fatlabel 读写回环并与参考转储比对"
    command: "make check （check-label-* 系列）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_dosfstools.py
    description: "普通文件镜像上的 mkfs→fsck→fatlabel 断言链（含别名与反向对照），10 条断言"
    command: "conan test（conan create 的 test_package 阶段自动执行）"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 10
