name: dosfstools
description: "FAT filesystem utilities (mkfs.fat / fsck.fat / fatlabel)"
homepage: https://github.com/dosfstools/dosfstools
license: GPL-2.0-or-later
package_type: application
status: built
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 传 --build=aarch64-unknown-linux-gnu（上游 config.guess 不识 HarmonyOS uname）"
    - "配置期 umask 077→022 由配方 replace_in_file 处理（HMDFS 临时目录不可写，E011/E114）"
    - "xxd / cmp / install 三个 toybox 简版命令以构建期 env-bin wrapper 适配，上游源码零改动"
    - "每条构建命令以 env -u CONFIG_SHELL SHELL=/bin/sh 执行（profile 指向的 hnp bash getcwd 全域失败，E386）"
    - "启用上游 --enable-compat-symlinks 提供 mkfs.vfat/fsck.vfat 别名"
  common_dependencies: []

versions:
  "4.2":
    status: built
    build_date: "2026-10-08"
    conan_ref: "dosfstools/4.2"
    note: "Debian pristine 源（上游 release tarball），sha256 与 dsc Checksums-Sha256 逐字节一致"
