# conandata.yml — dnswire 0.5.0
# Official release asset (v0.5.0 release page):
#   https://www.dns-oarc.net/files/dnswire/dnswire-0.5.0.tar.gz
# Official SHA-256 published by upstream (DNS-OARC):
#   7db89f8118ea42b116fc211b05bc4253d105c86054c2dbce58f8ead80c8f3aad
# R02 fix: the codeberg dynamic archive endpoint
# (…/archive/v0.5.0.tar.gz) returns HTTP 429 for CI automation downloads,
# so the recipe must use the stable official release asset instead.

sources:
  url: "https://www.dns-oarc.net/files/dnswire/dnswire-0.5.0.tar.gz"
  sha256: "7db89f8118ea42b116fc211b05bc4253d105c86054c2dbce58f8ead80c8f3aad"

# Pre-generated artifacts (dnstap.pb-c.c/.h, m4/pkg.m4) are NOT patches here;
# they ship via conanfile.py `exports_sources = "pregen/*"` and are copied
# into the source tree in source(). Only true source modifications that the
# OHOS build needs are patched below.
patches:
  - patch_file: "patches/0003-src-test-reader_unixsock.c.patch"
    patch_description: "src/test/reader_unixsock.c: support abstract namespace sockets (OHOS refuses AF_UNIX file-socket bind, E461)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-test-test5.sh.patch"
    patch_description: "src/test/test5.sh: use abstract socket name (E461)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-test-writer_unixsock.c.patch"
    patch_description: "src/test/writer_unixsock.c: support abstract namespace sockets (E461)"
    patch_type: "portability"
