# dnswire test_package — 上游测试声明（MANIFEST）

# 本文件声明该配方携带的上游测试信息，供 CI / 审计读取。
# 上游测试入口在官方 tag 源码 src/test/（autotools TESTS）。

test-framework: autotools
test-source-dir: src/test
source-declared-total: 6
configured-executable-total: 6
executed-passed-total: 6
failed-total: 0
skipped-total: 0
uninstantiated-total: 0
pass-rate: 6/6 (100.0%)
configured-pass-rate: 6/6 (100.0%)

# 说明：
# - 官方 tag 归档（codeberg v0.5.0 tarball）的 src/test/ 下声明 6 个 TESTS
#   脚本（test1.sh..test6.sh），全部为独立上游用例；另有 11 个 check_PROGRAMS
#   作为测试支撑程序被这些脚本调用（reader_read/reader_push/writer_write/
#   writer_pop/reader_unixsock/writer_unixsock/test_dnstap/test_encoder/
#   test_decoder/test_reader/test_writer），不重复计数。
# - 本配方以最小补丁将 test5.sh 的 AF_UNIX 文件 socket 改为 abstract
#   namespace（OHOS 拒绝文件 socket bind，见知识 E461），保证 6/6 可运行。
# - 另有鸿蒙专项测试（recipe 内 ohos 测试用例，独立于上游计数）。
