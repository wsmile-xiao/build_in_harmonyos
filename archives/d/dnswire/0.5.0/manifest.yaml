# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 拒绝 AF_UNIX 文件 socket bind（HMDFS EPERM / /dev/shm EACCES / /tmp 只读 EROFS），上游测试改用 abstract namespace（知识 E461）"
  - "HMDFS 下 autoreconf 生成的 configure 用 umask 077 + mktemp 建临时目录会因 UID 映射不可写（知识 E011），build() 中改为 umask 022"
  - "protoc-c 在 OHOS 构建主机不可用；dnstap.pb 子模块不在官方 codeberg 归档 tarball 中，预生成 dnstap.pb-c.[ch] 随 exports_sources 提供并让 protoc-c 变为可选"

