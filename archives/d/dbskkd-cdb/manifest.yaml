# 软件级 manifest — dbskkd-cdb
# 文件位置: archives/d/dbskkd-cdb/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: dbskkd-cdb

display: "dbskkd-cdb"

description: "SKK 日语输入法的词典服务器 — 基于 cdb 常量数据库，按 SKK 服务端协议在标准输入输出上应答假名汉字转换请求"

category: language

homepage: "https://github.com/jj1bdx/dbskkd-cdb"

license: MIT

build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "手写 Makefile（非 autotools/cmake）：CC 与编译 flags 是同一个变量（cc -Wall -O2 -g -I/usr/local/include）、cdb 库是硬编码静态库路径（/usr/local/lib/libcdb.a）、install 目标写死 /usr/local/libexec；用 make 命令行覆盖 CC/COMPAT/CDBLIB 即可整体替换，无需补丁改 Makefile"
    - "依赖 TinyCDB 兼容 API（cdb.h + libcdb.a）：本仓已发布的 cdb/20251021（DJB cdb，cdb_find/cdb_dataread/cdb_datapos 语义一致）可直接替换，配方按上游做法静态链接 libcdb.a，制品运行时不需要 cdb 的动态库"
    - "词典路径被编译进二进制（JISYO_FILE 默认 /usr/local/share/skk/SKK-JISYO.L.cdb），而 OHOS 上该目录既不存在也不可写，缺词典时程序直接 exit(EX_CONFIG)=78；补丁 0001 增加运行期覆盖（argv[1] → DBSKKD_JISYO → 编译期默认），无平台条件编译，默认行为不变"
    - "程序是 inetd 模型的标准输入输出服务：请求 '2'/'3'/'0'/'1<键> '，命中回 '1'+数据+LF、未命中回 '4'+键+LF；测试必须按协议逐条读取定长应答，单请求多应答或多次 write 合流都会读错"
    - "hnp clang/lld 默认产物已是 PIE + BIND_NOW + GNU_RELRO + NX，且带 .codesign 自签段：链接后任何字节改写（含 strip）都会使签名失效、内核拒绝 exec，因此配方不做 strip"
    - "test_package 使用 cdb 包的 cdbmake/cdbtest 生成并校验词典夹具：必须在 test_package 的 requirements() 里显式声明 cdb，否则 Conan 打印 Skipped binaries 且 package_folder 为 None"
  common_dependencies:
    - "cdb/20251021"

# ============================================================
# 版本索引
# ============================================================

versions:
  "3":
    status: built
    build_date: "2026-09-11"
    conan_ref: "dbskkd-cdb/3.00"
