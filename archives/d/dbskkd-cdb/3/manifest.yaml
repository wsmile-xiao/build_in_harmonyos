# 版本级 manifest — dbskkd-cdb 3
# 文件位置: archives/d/dbskkd-cdb/3/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# 任务卡/归档目录版本（CI L0n 分支门禁按「分支去前缀 == 包目录名-版本」精确匹配）
version: "3"
software: "dbskkd-cdb"

# set_version() 归一化后的**制品仓真实引用**（查询/消费请用这个）：
# Conan 的 ConanName 校验要求版本总长 >= 2
# （conan/api/model/refs.py 的 ^[a-z0-9_][a-z0-9_+.-]{1,100}$），单字符 "3" 在
# conan create 导出阶段直接报 Invalid package version '3'，且 set_version() 会覆盖
# 命令行 --version，故制品版本只能取上游发布号 3.00。
# 注意：commands.json 的 versions["3"].ref 按**本地 PF8 配方闸**的口径写
# "dbskkd-cdb/3"（PF8 要求 ref 恒等于「包名/版本目录」，见 scripts/ohc/preflight.py
# 的 check_recipe_static）。CI 的 L0k 只校验 type=="tool"、name 与包名一致、以及
# 版本键 "3" 是否存在，不比较 ref（ci/conan/build_and_test.sh 的 L0k 段）。
# commands.json 另有 version_normalization 段记录本条对应关系。
conan_ref: "dbskkd-cdb/3.00"

# conan-verify/W3 通过、release upload 未确认前只能记 built（workflow 第 13 节）
status: built

build_date: "2026-09-11"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/jj1bdx/dbskkd-cdb/archive/refs/tags/3.00.tar.gz"
  sha256: "e92ef7162c2c50a441dd864dbf21510d746174b9f1f484bfbbdca1b31c055286"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # 上游 Makefile 无 configure；CC 与 cdb 库路径由 make 命令行整体替换
  configure_options: []
  build_command: "make -j1 CC=<profile tools.build:compiler_executables:c> COMPAT=\"<GnuToolchain cflags + -D defines> -I<cdb include>\" CDBLIB=\"<cdb 静态库绝对路径>\""
  build_flags:
    - "CC=/data/service/hnp/bin/clang"
    - "COMPAT=-O3 -DNDEBUG -I<cdb 包>/include"
    - "CDBLIB=<cdb 包>/lib/libcdb.a"
  dependencies:
    - "cdb/20251021"
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

products:
  executables:
    - dbskkd-cdb

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001 dbskkd-cdb.c dictionary path override via argv[1] or the DBSKKD_JISYO environment variable"

# ============================================================
# 测试统计
# 统计单位：test_package/test.sh 打印的 [ok]/[fail] 用例行（每个用例一次判定）
# 上游为 0 个可运行测试入口，台账与取数命令见 test_package/MANIFEST.yml
# ============================================================

test_results:
  upstream_total: 0
  upstream_passed: 0
  upstream_failed: 0
  upstream_skipped: 0
  upstream_note: "上游 3.00 的 release tarball 13 个成员中 test/check/spec 命中 0，Makefile 无 check/test 目标，.travis.yml 的 script 只有编译命令——无任何可运行上游测试入口"
  package_total: 31
  package_passed: 31
  package_failed: 0
  # 鸿蒙特有测试（规则 12 口径）：ohos_ 前缀的 5 个平台检查，见 test_package/fixtures/ohos_platform_check.py
  package_harmony_specific: 5

# ============================================================
# 实跑证据（权威副本；notes.md 只引用不复制）
# 证据形态：仓库审查规则 19 禁止 PR 携带 *.log，故原始日志不随 PR 提交，
# 其关键行区间逐字摘录进 reports/conan-create-report.md 与 reports/w3-local-ci-report.md（非全文，覆盖面见各报告文末）
# （两份报告头部给出原始日志的任务私有留存路径、sha256 与复核命令）。
# ============================================================

validation:
  source_fetch:
    command: "curl -sSL -o dbskkd-cdb-3.00.tar.gz https://github.com/jj1bdx/dbskkd-cdb/archive/refs/tags/3.00.tar.gz && sha256sum dbskkd-cdb-3.00.tar.gz ; curl -sSL -o dbskkd-cdb-3.00-codeload.tar.gz https://codeload.github.com/jj1bdx/dbskkd-cdb/tar.gz/refs/tags/3.00 && cmp dbskkd-cdb-3.00.tar.gz dbskkd-cdb-3.00-codeload.tar.gz"
    result: "两次均 HTTP=200 bytes=9380；sha256=e92ef7162c2c50a441dd864dbf21510d746174b9f1f484bfbbdca1b31c055286；cmp 无输出（byte-identical），gzip magic 1f 8b"
  upstream_ledger:
    command: "python3 -m tarfile -l dbskkd-cdb-3.00.tar.gz | grep -Eic 'test|check|spec' ; grep -nE '^[a-zA-Z_.-]+:' dbskkd-cdb-3.00/Makefile ; grep -n 'script:' dbskkd-cdb-3.00/.travis.yml"
    result: "0；Makefile 目标只有 .c.o / all / clean / dbskkd-cdb / dbskkd-cdb.o / error.o / install；.travis.yml 的 script 只有一条 make 编译命令——上游用例数 0"
  native_build:
    command: "make -j1 CC=/data/service/hnp/bin/clang COMPAT=\"-Wall -O2 -g -I<cdb 包>/include\" CDBLIB=\"<cdb 包>/lib/libcdb.a\"（未打补丁的上游源码）"
    result: "exit 0，零编译告警；产物 dbskkd-cdb = ELF 64-bit LSB arm64 dynamic (/lib/ld-musl-aarch64.so.1)；以编译期内置默认词典路径启动 rc=78（EX_CONFIG）——设备上 /usr/local/share/skk/ 不可写且不存在"
  patched_native_build:
    command: "python3 -c \"import patch_ng; p=patch_ng.fromfile(<patches/0001>); p.apply(strip=1, root=<patched 树>)\" && make -j1 CC=/data/service/hnp/bin/clang COMPAT=\"-Wall -O2 -g -I<cdb 包>/include\" CDBLIB=\"<cdb 包>/lib/libcdb.a\" ; printf '1かんじ ' | ./dbskkd-cdb <词典.cdb>"
    result: "patch_ng apply=True 且与验证树逐字节一致；exit 0；'2'→'dbskkd-cdb-3.00 '、'3'→'novalue: '、'1かんじ '→'1/漢字/'、'1みつからない '→'4みつからない'、'0'→rc 0；DBSKKD_JISYO=<词典> 亦命中（'1あい '→'1/愛/相/'）"
  conan_create:
    evidence: "reports/conan-create-report.md（原始 conan-create.log 关键行区间的逐字摘录，非全文；日志按规则 19 不入库）"
    command: "conan create . -pr:h=$HOST_PROFILE -pr:b=$HOST_PROFILE --build='dbskkd-cdb/*'"
    result: "exit 0；'Apply patch (portability): 0001 dbskkd-cdb.c dictionary path override via argv[1] or the DBSKKD_JISYO environment variable' 1 条；RUN: make -j1 CC=\"/data/service/hnp/bin/clang\" COMPAT=\"-O3 -DNDEBUG -I<cdb 包>/include\" CDBLIB=\"<cdb 包>/lib/libcdb.a\"；Package be187fe3f087e2f59986370df4ac629377eb18c4 created"
  test_package:
    evidence: "reports/conan-create-report.md 第 4 节（31 个用例逐行 [ok] 原文）与 reports/w3-local-ci-report.md"
    command: "bash archives/d/dbskkd-cdb/3/test_package/test.sh <package_bin_dir> <cdb_tools_bin_dir>（词典由 fixtures/make_dict.py 在运行时经 cdbmake 生成，不提交二进制夹具）"
    result: "TOTAL=31 PASS=31 FAIL=0（26 个消费者协议/夹具用例 + 5 个鸿蒙特有平台检查；标记行：dbskkd-cdb test_package summary）"
  reproducibility:
    command: "两轮各自先清缓存（conan remove 'dbskkd-cdb/*@*' -c、conan remove 'dbskkd-cdb/*' -c、rm -rf ~/.conan2/p/*/dbskk*/，并用 cache.sqlite3 的 recipes/packages 两表回查为空确认）后各跑一次 conan create，比较包内 bin/dbskkd-cdb 的 sha256"
    result: "两轮 sha256 相同：62a2e57cbaa80714cdb68c56bc50e8bf526a2e07d2543ec5d7bce08cd7f5dfaa；两轮日志各含 1 条 RUN: make，均为干净构建轮而非缓存命中"
  ohos_platform_checks:
    command: "python3 archives/d/dbskkd-cdb/3/test_package/fixtures/ohos_platform_check.py <package_bin_dir>/dbskkd-cdb <词典.cdb> <可写目录>"
    result: "5/5 OK：ohos_elf_aarch64_pie（type=3 ET_DYN、machine=183 AArch64）、ohos_elf_codesign（.codesign 段 size=16384）、ohos_elf_hardening（nx=True relro=True bind_now=True df_1_pie=True）、ohos_elf_relocatable（DT_NEEDED=['libc.so']、无 DT_RPATH/RUNPATH）、ohos_runs_minimal_env（rc=0、stdout='dbskkd-cdb-3.00 '）——同轮 test_package summary 已计入这 5 项"
  package_contents:
    command: "find <包目录> -type f ; readelf -h -lW -dW <包目录>/bin/dbskkd-cdb"
    result: "bin/dbskkd-cdb 与 licenses/LICENSE（另含 conaninfo.txt/conanmanifest.txt），与 package_info() 的 bindirs=['bin']、libdirs/includedirs 为空一致；Type=DYN(PIE)、GNU_STACK RW(NX)、GNU_RELRO、FLAGS BIND_NOW、FLAGS_1 NOW PIE、DT_NEEDED 仅 libc.so；含 .codesign 段（hnp lld 自签），因此不做 strip"
  l1e_negative:
    command: "bash test.sh <只打印版本行的桩 ELF 所在目录> <cdb_tools_bin_dir> ; bash test.sh <产物被移走的目录> <cdb_tools_bin_dir>"
    result: "桩产物：rc=1、TOTAL=27 PASS=11 FAIL=16（5 个平台检查在桩 ELF 上同样参与判定：桩是设备 clang 产物，故 PIE/.codesign/加固/仅 libc 与最小环境运行被桩伪造为通过，而协议与会话用例大面积失败）；产物缺失：rc=1 且报 'binary missing in package'——测试确实依赖被测包产物，不是 PATH 假绿"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "test_package 访问传递依赖（cdb 包）提供的可执行工具时必须显式 requires 该依赖：Conan 对测试图做依赖裁剪，先打印 Skipped binaries 再让 package_folder 为 None，配方侧 os.path.join(..., None, 'bin') 抛 TypeError"  # knowledge_ref: E577
  - "任务卡单数字版本 3 不能直接做 conan 版本（ConanName 要求 >=2 字符）；目录保任务卡值过 CI L0n 分支门禁，配方 set_version() 把制品版本归一化为上游发布号 3.00"  # knowledge_ref: E563
  - "上游把词典路径编译进二进制（JISYO_FILE 默认 /usr/local/share/skk/SKK-JISYO.L.cdb）而 OHOS 系统目录不可写：补丁 0001 加 argv[1] 与环境变量覆盖并保留编译期默认，使制品可安装到任意 prefix 且可被测试驱动，不含平台条件编译"  # reference: patches/0001-dbskkd-cdb.c.patch 与 notes.md「源码修改」节
  - "上游零测试入口的包按可审计台账记为 0（既非 PASS 也非 SKIP）；替代验证用真实 SKK 协议会话加 cdb 参考实现双向校验（cdbmake 写夹具、cdbtest 读夹具），并保留 L1e 破坏性反向验证路径"  # reference: test_package/MANIFEST.yml 与 manifest.yaml 的 validation.l1e_negative
