# test_package/MANIFEST.yml — dbskkd-cdb 3.00
# CI (build_and_test.sh L0e) requires this file: it declares where the upstream
# tests are and which consumer tests this adaptation adds.

package: dbskkd-cdb/3.00
homepage: "https://github.com/jj1bdx/dbskkd-cdb"

# ── 上游测试入口台账 ─────────────────────────────────────────────────────────
# dbskkd-cdb 3.00（2016-11-13 发布）上游不带任何测试套件，三项独立证据：
#   1. release tarball 共 13 个成员，全为目录项、.travis.yml、4 个 .md、LICENSE、
#      Makefile、dbskkd-cdb.c 与 2 个 .sh 脚本；
#      `python3 -m tarfile -l dbskkd-cdb-3.00.tar.gz | grep -Eic 'test|check|spec'` = 0；
#   2. 顶层 Makefile 的目标只有 all / clean / dbskkd-cdb / dbskkd-cdb.o / error.o /
#      install 与 .c.o 后缀规则，没有 check / test 目标
#      （`grep -nE '^[a-zA-Z_.-]+:' Makefile`）；
#   3. 上游 CI 配置 .travis.yml 的 script 只有一条编译命令（make … ），
#      没有任何测试执行（`grep -n 'script:' .travis.yml`）。
# 因此上游用例数 = 0（“未发现可运行的上游测试入口”），既不是 PASS 也不是
# SKIP；下表的 upstream_* 字段按此如实填写。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── 适配后新增的消费者测试（conan create 自动执行）──────────────────────────
test_package_tests:
  - file: conanfile.py
    description: "Consumer test entry: drives the packaged bin/dbskkd-cdb with the cdb dependency's cdbmake/cdbtest and runs test.sh with the profile's bash (CONFIG_SHELL)"
    command: "conan create archives/d/dbskkd-cdb/3 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"
  - file: test.sh
    description: "31 个功能用例：请求码与退出码（VERSION/HOST/CLIENT_END/EOF/未知请求码/缺少分隔符）、词典查找（okuri-nasi 单条与多条候选、okuri-ari、ASCII 与多字节未命中、64 字节长键、键后多余文本）、10 个夹具词条逐条比对、运行期词典选择（DBSKKD_JISYO 环境变量、argv[1] 优先级、缺失词典退出码、编译期内置默认路径仍在）、夹具自校验（cdbmake 输入与 golden 文本逐字节一致、cdbtest 反向读取）、一次单进程交互会话的 6 个断言，以及 5 个鸿蒙特有平台检查（见下一项）"
    command: "bash test.sh <package_bin_dir> <cdb_tools_bin_dir>"
  - file: fixtures/ohos_platform_check.py
    description: "5 个鸿蒙特有平台检查（用例名前缀 ohos_，纯 Python 解析 ELF，不依赖 readelf）：ohos_elf_aarch64_pie 目标三元组与 PIE 形态（ELF64/AArch64/ET_DYN）；ohos_elf_codesign 非空 .codesign 段（OHOS 加载器只执行带有效签名的 ELF，E077，也是本包不做 strip 的原因）；ohos_elf_hardening 平台加固基线（PT_GNU_STACK 无 PF_X 即 NX + PT_GNU_RELRO + DF_BIND_NOW + DF_1_PIE）；ohos_elf_relocatable 可重定位且仅依赖 libc（DT_NEEDED 恰为 [libc.so]、无路径分隔符、无 DT_RPATH/DT_RUNPATH 指向构建或缓存目录，cdb 库已静态链入）；ohos_runs_minimal_env 最小环境运行（仅 PATH、无 conanrun/LD_LIBRARY_PATH，词典取自调用方可写目录，验证 OHOS 系统数据目录只读前提下的运行期路径覆盖）"
    command: "python3 fixtures/ohos_platform_check.py <packaged dbskkd-cdb> <dictionary .cdb> <user-writable dir>"
  - file: fixtures/session_check.py
    description: "单进程交互会话驱动：保持一个服务进程存活，按顺序交换 VERSION/HOST/命中/未命中/再次命中/CLIENT_END 请求，逐条按协议定义的字节数读取答案并比对（6 个断言，命名前缀 session_）"
    command: "python3 fixtures/session_check.py <packaged dbskkd-cdb> <dictionary .cdb> argv"

# ── 夹具与 golden（全部为文本，随 PR 提交；.cdb 运行期生成）──────────────────
# .cdb 词典是二进制文件，**不随 PR 提交**：本仓库 CI 的 checkout-pr 步骤用
# `git apply` 应用平台生成的 PR diff，而该 diff 对新增二进制文件不含
# `GIT binary patch` 数据（`error: missing binary patch data for ...`），会在检出
# 阶段直接失败（先例 dbview PR #9495 / dbskkd-cdb 适配同源约束）。因此词典由
# test.sh 在测试运行时调用 fixtures/make_dict.py 重新生成。
test_fixtures:
  - fixtures/SKK-JISYO.test: "主词典源文本（10 条：2 条 okuri-ari + 8 条 okuri-nasi），SKK-JISYO 格式，UTF-8"
  - fixtures/SKK-JISYO.alt: "备用词典源文本（3 条，键与主词典相同但值不同：かんじ /幹事/ 等），用于 argv[1] 与环境变量优先级用例"
  - fixtures/SKK-JISYO.test.cdbmake: "主词典的 cdbmake 输入 golden 文本，与上游 skktocdbm.sh（awk，LC_ALL=C）对同一 SKK-JISYO 的输出逐字节一致（适配期在设备上实跑比对）"
  - fixtures/make_dict.py: "SKK-JISYO → cdbmake 输入 → .cdb 的生成器（纯标准库 Python；cdbmake 来自 cdb 依赖包，即服务端所链接库的参考实现）"
  - "运行期产出（不提交）：SKK-JISYO.test.cdb 2455 字节 / SKK-JISYO.alt.cdb 2162 字节 / *.cdb.cdbmake 250 与 67 字节"

# 用例统计（统计单位：test.sh 打印的 [ok]/[fail] 行，每个用例一行）
# 构成：26 个消费者协议/夹具用例 + 5 个鸿蒙特有平台检查（ohos_ 前缀）
test_case_count: 31
# 鸿蒙特有测试数（规则 12 口径：PC 平台特有 / 鸿蒙适配特有）
harmony_specific_test_count: 5
# 兼容旧字段：断言总数与用例数一致（每个用例一次判定）
assertion_count: 31
