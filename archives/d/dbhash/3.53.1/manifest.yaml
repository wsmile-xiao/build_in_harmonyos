software: dbhash
version: 3.53.1
status: built
category: database-tools
description: Computes SHA1 hash of SQLite database schema and content
homepage: https://www.sqlite.org/dbhash.html
license: blessing

# Source information
source_url: https://www.sqlite.org/2026/sqlite-src-3530100.zip
source_type: zip
source_size: 13.84 MiB
source_sha3: 27cfc9264b2188fd17f811a8c03424eb65391c2ef9874cbfc860ea25f4322363

# Note: dbhash is part of SQLite source tree (tool/dbhash.c)
# Requires SQLite amalgamation (sqlite3.c/sqlite3.h) to compile

# Build information
build_system: manual
compiler: clang 15.0.4
platform: aarch64-unknown-linux-ohos

# Dependencies
dependencies:
  - sqlite3 (embedded amalgamation)

# Configure options (manual build, no standard configure)
configure_options: []
build_commands:
  - clang -c -fPIC -O2 -DSQLITE_ENABLE_FTS5 sqlite3.c -o sqlite3.o
  - ar rcs sqlite3.a sqlite3.o
  - clang -c -fPIC -O2 -I. dbhash.c -o dbhash.o
  - clang dbhash.o sqlite3.a -o dbhash -lpthread -ldl -lm

# Platform adaptations required
platform_adaptations:
  - Replace autosetup/autosetup-config.guess with HarmonyOS-adapted version
  - Replace autosetup/autosetup-config.sub with HarmonyOS-adapted version
  - Set TMPDIR environment variable (default /tmp is read-only on HarmonyOS)

# Verification
verification_commands:
  - dbhash --help

# Build date
build_date: 2026-05-21
build_duration: ~15 minutes (including source download)

# Binary information
binary_size: 1.3 MiB
binary_type: static executable (sqlite3 embedded)