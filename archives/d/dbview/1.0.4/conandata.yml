# conandata.yml — dbview 1.0.4
#
# 官方源码来自 dbview 项目主页（www.infodrom.org，Joey Schulze 维护）。
# 该 tarball 与 Debian pool 的 dbview_1.0.4.orig.tar.gz 字节一致（同为
# 9857 字节、同一 sha256），可作为交叉校验。
# 顶层目录 dbview-1.0.4/：Makefile、db_dump.c/h、dbview.c、version.c/h、
# dbview.1（man page）、CHANGES、README、dBASE 与 db_dump.header 两份
# dBase 格式说明文本。上游不提供任何测试套件（tarball 内无 test/check
# 相关成员，Makefile 也只有 all/dbview/depend/install/clean/clobber 目标）。

sources:
  url: "https://www.infodrom.org/projects/dbview/download/dbview-1.0.4.tar.gz"
  sha256: "bca41716e1ec0ce8833bcacfa17063f338b25f249f92ddb954c7d935e008cee7"

patches:
  - patch_file: "patches/0001-dbview.c.patch"
    patch_description: "修正退出码语义：db3_process() 返回的是 TRUE/FALSE 布尔值而不是进程退出码，原代码直接 exit() 该返回值，导致查看成功时退出 1、数据库打不开时反而退出 0；取反后成功退出 0、失败退出 1（与 Debian dbview 的 negate_exit_code 补丁、Debian 缺陷 #439875 同源）"
    patch_type: "bugfix"
