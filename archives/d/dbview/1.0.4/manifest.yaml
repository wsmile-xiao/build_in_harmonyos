# 版本级 manifest — dbview 1.0.4
# 文件位置: archives/d/dbview/1.0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "1.0.4"
software: "dbview"

# conan-verify/W3 通过、release upload 未确认前只能记 built（workflow 第 13 节）
status: built

build_date: "2026-09-11"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.infodrom.org/projects/dbview/download/dbview-1.0.4.tar.gz"
  sha256: "bca41716e1ec0ce8833bcacfa17063f338b25f249f92ddb954c7d935e008cee7"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # 上游 Makefile 无 configure 步骤；install 目标以 -o root -g root 安装并把
  # 字面量 MAN=man 当作 man page 属主，因此配方完全接管安装
  configure_options: []
  build_command: "make -j1 CC=<profile tools.build:compiler_executables:c> CFLAGS=<GnuToolchain cflags + -D defines>"
  # 上游 Makefile 默认 CFLAGS=-O6 -fomit-frame-pointer -Wall -pipe 被 profile flags 覆盖
  # （clang 会把 -O6 夹到 -O3 并告警，覆盖后该告警消失）
  build_flags:
    - "CC=/data/service/hnp/bin/clang"
    - "CFLAGS=-O3 -DNDEBUG"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001 fix inverted exit status in dbview.c (exit(!db3_process(...)))"

# ============================================================
# 测试统计（统计单位：test_package/test.sh 中的功能用例；上游为 0 个可运行测试入口）
# ============================================================

test_results:
  upstream_total: 0
  upstream_passed: 0
  upstream_failed: 0
  upstream_skipped: 0
  upstream_note: "上游 1.0.4 无任何测试文件与 check/test 目标，台账见 test_package/MANIFEST.yml"
  package_total: 22
  package_passed: 22
  package_failed: 0

# ============================================================
# 实跑证据（权威副本；notes.md 只引用不复制）
# ============================================================

validation:
  source_fetch:
    command: "curl -sS -L --max-time 90 -w 'HTTP=%{http_code} bytes=%{size_download}\\n' -o dbview-1.0.4.tar.gz https://www.infodrom.org/projects/dbview/download/dbview-1.0.4.tar.gz && sha256sum dbview-1.0.4.tar.gz"
    result: "HTTP=200 bytes=9857; bca41716e1ec0ce8833bcacfa17063f338b25f249f92ddb954c7d935e008cee7"
  upstream_ledger:
    command: "python3 -m tarfile -l dbview-1.0.4.tar.gz | grep -Eic '(test|check|spec)'"
    result: "0（12 个成员全部为 Makefile/CHANGES/README/dBASE/db_dump.header/dbview.1 与 5 个 .c/.h；Makefile 目标仅 all/dbview/depend/install/clean/clobber）"
  native_build:
    command: "cd dbview-1.0.4 && make -j1 CC=/data/service/hnp/bin/clang"
    result: "exit 0；17 条告警（3 条 clang '-O6 not supported; using -O3' + 14 条 K&R 原型告警）；产物 dbview = ELF 64-bit LSB arm64 dynamic (/lib/ld-musl-aarch64.so.1)"
  patched_native_build:
    command: "cp -a dbview-1.0.4 patched && python3 -c \"import patch_ng; p=patch_ng.fromfile(<patch>); p.apply(strip=1, root=<patched>)\" && cd patched && make -j1 CC=/data/service/hnp/bin/clang CFLAGS='-O3 -DNDEBUG -pipe'"
    result: "patch_ng apply=True；exit 0；14 条 K&R 告警；./dbview basic.dbf 退出 0、./dbview missing.dbf 退出 1"
  conan_create:
    command: "conan create . -pr:h=$HOST_PROFILE -pr:b=$HOST_PROFILE --build='dbview/*'"
    result: "exit 0；'Apply patch (bugfix)' 1 条；'RUN: make -j1 CC=\"/data/service/hnp/bin/clang\" CFLAGS=\"-O3 -DNDEBUG\"'；14 条 K&R 告警；Package 6b129b068851896169fae42d399fa922d239ce8a created"
  test_package:
    command: "bash archives/d/dbview/1.0.4/test_package/test.sh <package_bin_dir>（夹具由 fixtures/make_fixtures.py 在运行时确定性重建，不提交二进制）"
    result: "TOTAL=22 PASS=22 FAIL=0（标记行：dbview test_package summary）"
  ci_diff_apply:
    command: "git diff upstream/main...HEAD | grep -c 'Binary files' （并对照 CI run #44073 的 checkout-pr 日志）"
    result: "已提交 .dbf 二进制的首个 PR 版本 CI 失败：checkout-pr 报 8 条 \"error: missing binary patch data for ... fixtures/*.dbf\" 后\"PR diff 无法应用\"——平台生成的 PR diff 不含 GIT binary patch 数据。据此把 .dbf 夹具改为运行期由 make_fixtures.py 生成，PR 内不再含任何二进制文件"
  l1e_negative:
    command: "bash test.sh <sabotage_bin_dir>（用只打印版本行的桩替换 bin/dbview）"
    result: "exit 1；TOTAL=22 PASS=2 FAIL=20——测试确实依赖被测包产物而非 PATH"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "raw Makefile 配方手工拼接 GnuToolchain 的 CFLAGS 时 defines 是裸宏名，直接相加会让 clang 把 NDEBUG 当成源文件（no such file or directory: 'NDEBUG'）；必须逐项补 -D 前缀"  # knowledge_ref: E573
  - "上游 CLI 把内部布尔返回值直接当退出码时整体反转（查看成功退出 1、库文件打不开退出 0）；按发行版同源补丁取反修正后 test_package 才能断言成功=0、失败非 0"  # reference: conandata.yml patches[0]（Debian dbview negate_exit_code / Debian #439875）
  - "上游零测试入口的包按可审计台账记为 0（既不是 PASS 也不是 SKIP），替代验证用与实现独立的字节级 dBase III 夹具加人工核对的黄金 stdout，并保留 L1e 破坏性反向验证路径"  # reference: knowledge/drafts/DRAFT-cute_files-1.0.0-upstream-zero-test-ohos-validation.md
