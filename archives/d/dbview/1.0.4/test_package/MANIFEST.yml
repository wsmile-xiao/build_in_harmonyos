# test_package/MANIFEST.yml — dbview 1.0.4
# CI (build_and_test.sh L0e) requires this file: it declares where the upstream
# tests are and which consumer tests the package itself adds.

package: dbview/1.0.4
homepage: "https://www.infodrom.org/projects/dbview/"

# ── 上游测试入口台账 ─────────────────────────────────────────────────────────
# dbview 1.0.4 (2006-11-27) 上游不带任何测试套件：
#   1. `python3 -m tarfile -l dbview-1.0.4.tar.gz | grep -Eic '(test|check|spec)'`
#      = 0，12 个成员全是 Makefile/CHANGES/README/dBASE/db_dump.header/
#      dbview.1 与 5 个 .c/.h；
#   2. 顶层 Makefile 的目标只有 all / dbview / depend / install / clean /
#      clobber，没有 check/test 目标
#      （`grep -nE '^[a-zA-Z_-]+:' Makefile`）。
# 因此上游用例数 = 0（“未发现可运行的上游测试入口”），既不是 PASS 也不是
# SKIP；下表的 upstream_* 字段按此如实填写。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── 适配后新增的消费者测试（conan create 自动执行）──────────────────────────
test_package_tests:
  - file: conanfile.py
    description: "Consumer test entry: takes bin/ from the tested package and runs test.sh with bash"
    command: "conan create . --version=1.0.4 -pr:h=ci/conan/profiles/ohos-aarch64"
  - file: test.sh
    description: "22 个功能用例：--version/-v/--help/-h/无参数，以及运行时用 make_fixtures.py 生成 8 个 dBase III 夹具后的黄金 stdout 比对（默认视图、-b 浏览、-b -t 去空白、-b -d 自定义分隔符、-i 文件信息、-e 字段字典、-o 省略记录、-r 保留字段名）、C/N/D/L 字段类型、已删除记录标记、dBase III+ 版本字节、零记录与截断文件、不支持版本的诊断、缺失文件的非零退出码"
    command: "bash test.sh <package_bin_dir>"

# 夹具与黄金输出（黄金文件是人工对照 db_dump.c 的打印逻辑逐行核对的结果，
# 不是由被测程序自证的快照）
#
# 注意：.dbf 夹具是二进制文件，**不随 PR 提交**。本仓库 CI 的 checkout-pr 步骤用
# `git apply` 应用平台生成的 PR diff，而该 diff 对新增二进制文件不含 `GIT binary
# patch` 数据（`error: missing binary patch data for ...`），会导致检出阶段直接失败
# ——已在 PR #9495 的 CI run #44073 实测复现（8 条 missing binary patch data，
# 随后报「PR diff 无法应用」）。因此夹具改由 test.sh 在测试运行时调用生成脚本
# 逐字节重建（生成脚本为纯标准库 Python，源码在 PR diff 内可审）。
test_fixtures:
  - fixtures/make_fixtures.py: "按 dBase III 字节布局显式构造全部 8 个夹具的生成脚本（纯标准库 Python，输出确定性：同一脚本重复运行产出的 .dbf 逐字节一致）；test.sh 在运行时调用它生成到工作目录"
  - "生成的夹具（运行期产出，不提交）：basic.dbf 122 B / types.dbf 287 B / deleted.dbf 131 B / dbase3plus.dbf 73 B / names.dbf 150 B / empty.dbf 66 B / truncated.dbf 69 B / badversion.dbf 68 B"
  - "夹具语义：basic = 2 条记录的 C(8)/N(3) 库；types = C/N(2 位小数)/D/L 三类字段含空日期与空逻辑值；deleted = 中间一条删除标志 '*'；dbase3plus = 版本字节 0x83；names = 字段名含大写与下划线；empty = 仅头部记录数 0；truncated = 头部声明 3 条但文件只含 1 条；badversion = 版本字节 0x8B（dBase IV）"
  - expected/*.out: "上列夹具与选项组合的黄金 stdout（文本，随 PR 提交）"

# 用例统计（统计单位：test.sh 中的功能用例，每个用例打印一行 [ok]/[fail]）
test_case_count: 22

# 兼容旧字段：断言总数与用例数一致（每个用例一次判定）
assertion_count: 22
