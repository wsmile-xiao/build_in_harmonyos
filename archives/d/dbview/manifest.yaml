# 软件级 manifest — dbview
# 文件位置: archives/d/dbview/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: dbview

display: "dbview"

description: "dBase III/III+ 数据库文件查看器 — 读取 .dbf 文件并把记录、字段字典或文件头信息打印到标准输出"

category: db

homepage: "https://www.infodrom.org/projects/dbview/"

license: GPL-2.0-or-later

build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目（1.0.4 发布于 2006 年）：无 configure、无 check/test 目标，且上游 install 目标以 -o root -g root 安装、把字面量 MAN=man 当 man page 属主，OHOS 上不可用——配方必须完全接管安装"
    - "main() 直接 exit(db3_process(...))，而该函数返回 TRUE/FALSE 布尔值：查看成功退出 1、文件打不开退出 0；补丁 0001 取反修正（Debian negate_exit_code 同源）"
    - "db3_process() 在 db3_read_dic() 失败时仍返回 TRUE，版本字节不受支持的文件只打印诊断、退出码仍为 0（上游限制，本次未改）"
    - "db3_process() 用 strcpy() 把路径拷进 256 字节栈缓冲区，超长路径存在溢出风险（上游限制，本次未改）"
    - "Makefile 自带 CFLAGS=-O6，hnp clang 会告警 '-O6 not supported; using -O3' 并按 -O3 编译；配方用 profile 的 flags 覆盖该默认值"
    - "hnp clang 不传额外链接参数即产出 PIE + BIND_NOW + RELRO + NX 的 hnp 签名产物，无需自定义加固 flag"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.4":
    status: built
    build_date: "2026-09-11"
    conan_ref: "dbview/1.0.4"
