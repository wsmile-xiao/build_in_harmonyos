software: dr_mp3
display: "dr_mp3"
description: "dr_mp3 零依赖 MP3 音频解码器（header-only C 库，来自 dr_libs 单仓库）"
category: library
homepage: "https://github.com/mackron/dr_libs"
license: Unlicense OR MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only 单头文件库（dr_mp3.h）：无 .so/.a 产物，包内仅 include/dr_mp3.h 与 licenses/LICENSE"
    - "官方源为 mackron/dr_libs 单仓库 tag mp3-0.7.2（commit 547c211a87a06a42bf62c1366616aa14b57dd429）；tarball 同时含 dr_flac.h/dr_wav.h，本包只交付 dr_mp3.h（兄弟格式归各自包）"
    - "消费者集成：#include \"dr_mp3.h\" 前 #define DR_MP3_IMPLEMENTATION，实现编译进消费者，无链接依赖"
    - "上游 CMake 测试依赖 tests/testvectors 数据集，官方 tarball 不含（仅 .gitkeep）；test_package 以源内真实 MPEG1 L3 帧解码覆盖（11 断言）"
  common_dependencies: []

versions:
  "0.7.2":
    status: built
    build_date: "2026-08-30"
    conan_ref: "dr_mp3/0.7.2"
