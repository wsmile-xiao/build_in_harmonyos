# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试状态: 官方 CMake 测试套件 (tests/mp3/mp3_basic.c 等) 依赖
# tests/testvectors 数据集，官方 mp3-0.7.2 tag tarball 不含该数据集
# (testvectors 目录仅含 .gitkeep)，故上游测试无法从源码包运行。
# 消费者侧功能验证由 test_package 覆盖（源内真实 MPEG1 L3 帧解码，
# 低层 + 高层 API 共 11 个断言）。

package: dr_mp3/0.7.2
homepage: "https://github.com/mackron/dr_libs"

# 上游测试命令 (上游 CMake: cmake -DDR_LIBS_BUILD_TESTS=ON && ctest)
upstream_check_command: "cmake -DDR_LIBS_BUILD_TESTS=ON .. && ctest"

# conanfile.py build() 方法中是否已集成上游测试
# (header-only 无 build 步骤; 上游测试需外部 testvectors, 不可运行)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# (mp3_basic/mp3_playback 等需 testvectors 数据集, 官方 tarball 未随附)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "源内真实 MPEG1 Layer III 帧 (128kbps/44.1kHz/立体声) 经低层 drmp3dec_* 与高层 drmp3_* API 解码，断言版本宏/通道/采样率/层/比特率/帧长/PCM 帧数共 11 项"
    command: "./test_dr_mp3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11
