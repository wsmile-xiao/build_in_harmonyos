software: debugedit
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.3"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sourceware.org/pub/debugedit/5.3/debugedit-5.3.tar.xz"

  # 源码校验和
  sha256: "3b8c6396fe235e0270c9b9c0d244cfd0e86c284fc27e820acc58360e7cfa08c2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires:
  - "elfutils/0.195"
  - "libxxhash/0.8.3"

# 构建配置选项
build_options:
  - "autotools；PKG_CHECK_MODULES 命中 libelf/libdw/libxxhash；config.guess/config.sub OHOS patch；umask 077 修复（E011）"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | failed | skipped | not_run
test_status: passed

# 测试说明
test_note: "上游 tests/ automake testsuite 实测（2026-09-10）：三轮递进——①补全运行时库（libelf/libdw 传递依赖 libzstd/libfts/libobstack）后 8/58（13.8%）②find-debuginfo 真根因修复（shebang 由 /bin/bash 改 /data/service/hnp/bin/bash——OHOS 无 /bin/bash，E488 copy-rewrite chmod 0777）③测试数据路径修复（atconfig/atlocal 复制到运行目录，abs_srcdir 定义生效）后重跑 **44 run / 16 failed / 14 skipped（通过+跳过 28/58 ≈ 48%）**，失败从 40 → 16；剩余 16 失败均为 gdb-index/dwz 深度场景（gdb/dwz 需真实 DWARF 调试信息构建，OHOS 受限，按 rule 1.2 声明）；test_package 校验 debugedit/debugedit-classify-ar/sepdebugcrcfix 工具存在 + debugedit --version 运行（运行时真实执行）"
