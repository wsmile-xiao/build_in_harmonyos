# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: debugedit/5.3
homepage: "https://sourceware.org/debugedit/"

# 上游测试（tests/ automake testsuite：debugedit.at/find-debuginfo.at/
# debugedit-classify-ar.at，需 ELF/DWARF 调试信息场景）——本 PR 构建 CLI 工具，
# test_package 校验工具存在 + debugedit --version 运行
upstream_check_command: "echo \"upstream testsuite needs ELF/DWARF debuginfo build context\""

# conanfile.py build() 中未运行上游测试（testsuite 需完整 ELF/DWARF 场景）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_debugedit.sh
    description: "校验安装产物：debugedit/debugedit-classify-ar/sepdebugcrcfix 存在 + debugedit --version 运行"
    command: "sh test_debugedit.sh <bin>"

# 断言总数（test_package 1 个断言）
assertion_count: 1
