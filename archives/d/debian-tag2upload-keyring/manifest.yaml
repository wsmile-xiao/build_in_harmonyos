# debian-tag2upload-keyring
# 文件位置: archives/d/debian-tag2upload-keyring/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: debian-tag2upload-keyring

display: debian-tag2upload-keyring

description: OpenPGP signing key for the Debian tag2upload service

category: crypto

homepage: "https://salsa.debian.org/dgit-team/debian-tag2upload-keyring"

license: GPL-3.0-or-later

build_system: custom

ohos_adaptation:
  key_points:
    - "纯数据包（二进制 OpenPGP 公钥环），无编译步骤"
    - "runenv 注入 OPENPGP_KEYRING_DIR 指向 share/keyrings 供验签工具使用"
    - "消费侧以 Python 解析 OpenPGP 包流并校验密钥身份：按 RFC 4880 §12.2 重算 v4 指纹 374D8CE4…E4683C079 与 long key id 606D084E4683C079（经 gpg --check-sigs 独立核对）、RSA-4096、创建时间戳、user ID"
    - "认证结构：2 个自签名（0x13，gpg 校验有效）+ 3 个第三方颁发者的 0x10 认证，46 项断言"
    - "端到端消费者用例 test_consumer_e2e.py：跑「定位制品→选键→派生身份→归类认证→三闸门判决→确定性报告」完整流程，报告与 GnuPG 2.4.5 独立转录的参考输出逐字节比对，24 项断言；含 OHOS 交付面预检与 5 组变异对照"
    - "三程序合计 90 项断言（上游驱动器 20 + 结构验证 46 + 端到端 24），每项均由程序内计数器在运行时统计并打印，非手工推算；16 组变异/损坏对照在流水线内自动执行且全部按预期失败（含仅改 1 字节的 RSA 模数替换），另有 1 组换入 gpg 现场生成的真实异钥的外部对照（仅开发机执行，不在 CI 流水线内），判决与断言均非空转"
    - "gpg/gpgv 不在 OHOS 工具链与制品仓内，测试保持纯 Python；gpg 仅作离线独立核对标定固定常量"
    - "上游 autopkgtest verify-one 已在 OHOS 逐字节原样执行并通过：其验签步骤依赖的 `rsop` 不在 OHOS 工具链与制品仓，由 test_package/rsop.py 纯 Python 实现同一 `rsop verify` 契约替代；夹具 test-tag-object 内是真实的 tag2upload 签名（GnuPG 2.4.5 报 Good signature），并非 dgit 占位签名；perl 本身在 OHOS 可用，非阻塞点；详见 notes.md「上游测试实测」"
  common_dependencies:
    - gpgv

versions:
  "1.2":
    status: built
    build_date: "2026-09-10"
    notes: "首次适配；上游 autopkgtest verify-one 逐字节原样执行并通过（20 项断言 + 4 组变异对照），另有消费者视角 OpenPGP 密钥身份与认证结构验证（46 项断言 + 7 组变异对照 + 2 项 runenv 对照）和完整端到端消费者信任决策用例（24 项断言 + 5 组变异对照），合计 90 项断言、16 组流水线内变异对照"