knowledge_gained:
  - "纯数据包（二进制 OpenPGP keyring），无编译步骤"
  - "debian-tag2upload.pgp 是 3240 字节二进制公钥环（非 ASCII armored），首字节 0x99 表示 old-format 公钥包"
  - "上游 autopkgtest (verify-one) 现已在 OHOS 原样执行并通过：其验签步骤依赖的 `rsop` 不在 OHOS 工具链与制品仓（perl 本身可用，5.42.0 @ /data/service/hnp/bin/perl），已由 test_package/rsop.py 纯 Python 实现同一 `rsop verify` 契约替代（RFC 4880 包流解析 + §5.2.4 v4 签名数据构造 + EMSA-PKCS1-v1_5 完整填充校验），无需 root/联网/GnuPG"
  - "rsop verify 的签名数据来自 stdin（上游脚本里 `<plaintext` 是 shell 输入重定向），操作数只有 <signature.asc> <keyring> 两个"
  - "上游夹具 test-tag-object 内是真实的 tag2upload 签名（RSA-4096 / SHA-512 / sigtype 0x00 / issuer 374D8CE4…E4683C079），不是 dgit 占位签名：早前「digest 前缀 0x1621 ≠ 明文 SHA-512 前缀 0xe9d1」的判据不成立 —— 一是前缀实为 0x0b9f，二是 OpenPGP v4 签名按 RFC 4880 §5.2.4 对 data‖sig前缀‖trailer 求哈希，不能与明文裸摘要直接比较；按正确构造重算逐字节吻合，GnuPG 2.4.5 亦报 Good signature"
  - "自实现的 OpenPGP 验签已与 GnuPG 2.4.5 逐例交叉核对：同一条未修改的上游脚本在原始夹具上双方均 accept，在篡改明文 / 篡改签名 / 替换 RSA 模数 / 空 keyring 四组变异上双方均 reject"
  - "上游脚本执行时 cwd 为暂存目录，其中 debian-tag2upload.pgp 是本包交付的 share/keyrings/debian-tag2upload.pgp（经 runenv OPENPGP_KEYRING_DIR 定位），故断言落在真实制品上"
  - "校验器实现 OpenPGP old-format 包流解析：tag=6 公钥包，七段包结构全部通过"
  - "该 keyring 的公钥包体为 525 字节，比 RFC 4880 §5.5.2 少 2 字节（缺公钥包级 2 字节 key-material 位数字段，0x1000 实际充当 n 的 MPI 位数字段），GnuPG 按 4096-bit RSA 正常解析；自己实现 OpenPGP 验签时不要假定标准包长"
  - "gpg/gpgv 不在 OHOS 工具链与制品仓内（archives/l/librnp/0.18.1/conanfile.py:278），故 test_package 全部保持纯 Python；gpg 仅作开发机离线独立核对，用于标定 PINNED_* 常量、撰写端到端用例的参考输出，以及交叉核对 rsop.py 这个 rsop 替代实现"