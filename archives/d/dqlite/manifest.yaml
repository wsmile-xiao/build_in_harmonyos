software: dqlite
display: "dqlite"
description: "Distributed SQLite library with Raft consensus"
category: db
homepage: "https://github.com/canonical/dqlite"
license: Apache-2.0
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "musl libc 不支持 GNU 扩展 qsort_r，需添加兼容实现"
    - "noreturn 函数需要添加 __builtin_unreachable()"
    - "测试套件因 noreturn 问题跳过，需进一步修复"
  common_dependencies:
    - libuv

# 版本索引
versions:
  "1.18.6":
    status: built
    build_date: "2026-05-29"