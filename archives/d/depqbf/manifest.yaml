software: depqbf
display: "DepQBF"
description: "基于 QDPLL 的量化布尔公式（QBF）求解器，提供 C API 与命令行工具"
category: system
homepage: "https://lonsing.github.io/depqbf/"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure/cmake，直接 make 构建"
    - "显式目标 libqdpll.a + depqbf，跳过 Linux -soname 动态库分支"
    - "编译器经 tools.build:compiler_executables 传入，禁用 -j 并行之外的所有并行"
    - "上游 5.01 无自动化测试，适配后新增 API 与二进制求解测试"
  common_dependencies: []

versions:
  "5.01":
    status: built
    build_date: "2026-09-10"
    conan_ref: "depqbf/5.01"
