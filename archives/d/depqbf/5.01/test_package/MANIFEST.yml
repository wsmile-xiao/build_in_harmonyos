package: depqbf/5.01
homepage: "https://lonsing.github.io/depqbf/"

upstream_tests_exist: false
upstream_test_audit:
  - path: "makefile (upstream root)"
    finding: "Only build targets (depqbf, libqdpll.a, libqdpll.so) and clean; no check or test target"
  - path: "source archive depqbf-version-5.01/"
    finding: "No tests/, test/, or *test*.sh harness; only examples/ with hand-built API demos and DepQBF4J-0.2 JNI wrapper"
  - path: "examples/makefile"
    finding: "Builds six API demo programs with gcc, no assertions or expected-output comparison"
  - conclusion: "Upstream 5.01 provides no automated tests; adaptation adds libqdpll C API consumer test and depqbf CLI SAT/UNSAT checks without presenting them as upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_qdpll.c
    description: "libqdpll C API 消费者测试：SAT/UNSAT 求解、模型读取、前缀检查与作用域类型断言（19 个检查点）"
    command: "./test_qdpll"
  - file: test_bin.sh
    description: "depqbf 二进制测试：--version/--help 烟雾测试 + SAT(退出码10)/UNSAT(退出码20) QDIMACS 求解与输出校验"
    command: "bash test_bin.sh <source-folder>"

assertion_count: 25
assertion_count_basis:
  api_consumer: 19
  binary_smoke_and_solve: 6
