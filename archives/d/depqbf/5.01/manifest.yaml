version: "5.01"
software: depqbf
status: built
build_date: "2026-09-10"
build_system: makefile

source:
  url: "https://github.com/lonsing/depqbf/archive/version-5.01.tar.gz"
  sha256: "ba2b93b3a83917f6084ab88d75b4848ce9354584fb36d70537fa7490e42921bc"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make CC=<conan-cc> -j1 libqdpll.a depqbf (skip Linux -soname shared branch)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "纯 Makefile 项目：默认目标同时构建 depqbf 二进制与 libqdpll 静态/动态库，OHOS 下显式构建 libqdpll.a + depqbf 即可跳过 -soname 分支"
  - "libqdpll.a 规则硬编码 ar/ranlib，传 CC 即可在真机完成构建"
  - "上游 5.01 无自动化测试（无 check/test 目标、无 tests 目录），仅有 examples 手工演示程序"

compatibility:
  level: high
  issues: []
