software: dockerfile-language-server
version: 0.0.24
status: published
date: 2026-06-08
build_system: nodejs
source_url: https://github.com/rcjsuen/dockerfile-language-server-nodejs/archive/refs/tags/v0.0.24.tar.gz

dependencies:
  runtime:
    - node >= 12.0.0
    - dockerfile-language-service 0.0.12
    - dockerfile-utils 0.0.11
    - vscode-languageserver ^6.1.1
  build:
    - typescript ^3.7.5
    - npm >= 6.0.0

build_command:
  - npm install
  - npm run build

install_command:
  - npm install -g

test_command:
  - npm test

notes: |
  This is a Node.js project, not a traditional autotools/cmake project.
  The build process uses npm to install dependencies and compile TypeScript.
  The binary is bin/docker-langserver which is a Node.js script.
  For distribution, we package the entire compiled project with node_modules.

platform_support:
  ohos_arm64: native