# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dex2jar/2.4
homepage: "https://github.com/pxb1988/dex2jar"

# 上游测试命令（Gradle/JUnit；OHOS CI 无 JDK 未执行）
upstream_check_command: "gradle test"
upstream_test_in_build: false
upstream_test_command: "gradle test"

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_failed_archive.py
    description: "验证失败归档包含明确状态(status: failed)、失败原因(JVM/Gradle/JDK 缺失)与 OHOS 说明"
    command: "python3 test_failed_archive.py <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
