# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: dirent/1.26
homepage: "https://github.com/tronkko/dirent"

upstream_check_command: "ctest -N"
# conanfile.py build() 中已集成上游测试（cmake.test()）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游: CMakeLists.txt 的 DIRENT_TESTS foreach 列表声明 9 个独立 CTest
# 可执行测试，每个对应一个独立测试源文件，SKIP_RETURN_CODE=77。
upstream_test_count: 9
upstream_ctest_entries:
  - name: t-compile
    command: "ctest -R '^t-compile$'"
  - name: t-dirent
    command: "ctest -R '^t-dirent$'"
  - name: t-scandir
    command: "ctest -R '^t-scandir$'"
  - name: t-unicode
    command: "ctest -R '^t-unicode$'"
  - name: t-cplusplus
    command: "ctest -R '^t-cplusplus$'"
  - name: t-telldir
    command: "ctest -R '^t-telldir$'"
  - name: t-strverscmp
    command: "ctest -R '^t-strverscmp$'"
  - name: t-utf8
    command: "ctest -R '^t-utf8$'"
  - name: t-symlink
    command: "ctest -R '^t-symlink$'"

upstream_tests:
  - file: tests/t-compile.c
    description: "编译清理测试 (含 winsock 冲突场景)"
  - file: tests/t-dirent.c
    description: "dirent 核心 API: 检索/不存在/文件/归零/rewind/chdir 等断言"
  - file: tests/t-scandir.c
    description: "scandir/versionsort/alphasort 行为断言"
  - file: tests/t-unicode.c
    description: "宽字符目录名访问断言"
  - file: tests/t-cplusplus.cpp
    description: "C++ 编译兼容性测试"
  - file: tests/t-telldir.c
    description: "telldir/seekdir 定位断言"
  - file: tests/t-strverscmp.c
    description: "strverscmp 版本串比较断言"
  - file: tests/t-utf8.c
    description: "UTF-8 文件名访问断言"
  - file: tests/t-symlink.c
    description: "符号链接/软链接处理断言"

consumer_test_count: 1
test_package_tests:
  - file: test_dirent.c
    description: "鸿蒙消费者用例: 链接 dirent CMake 目标, 调用 opendir/readdir/closedir/scandir/alphasort/telldir/seekdir/rewinddir 验证可观察结果"
    command: "./test_dirent"

assertion_count: 8