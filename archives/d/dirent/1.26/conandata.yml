# （镜像代理下载，字节与官方 tarball 一致；提交保留官方 HTTPS URL）

sources:
  url: "https://github.com/tronkko/dirent/archive/refs/tags/1.26.tar.gz"
  sha256: "a91662ee5243d2dae5aee7ed8527f95097afda517cc5cc7ca2699648a74a419c"

patches:
  - patch_file: "patches/0001-t-symlink-limits-h.patch"
    patch_description: "t-symlink.c 使用 PATH_MAX 但未包含 <limits.h>（musl/OHOS 不隐式传递），补齐头文件；同时测试临时目录尊重 $TMPDIR（OHOS PC 的 /tmp 为只读 erofs 挂载，硬编码 /tmp/ 必然失败）"
    patch_type: "portability"
  - patch_file: "patches/0002-t-strverscmp-libc-probe.patch"
    patch_description: "OHOS runtime libc (musl) 无 GNU strverscmp() 扩展；libc 探针兜底 dirent 自带可移植实现，使上游 t-strverscmp 测试可真实编译链接执行（R8 libc 探针例外，PR 已说明理由）"
    patch_type: "portability"
  - patch_file: "patches/0003-t-scandir-libc-probe.patch"
    patch_description: "OHOS runtime libc (musl) 无 GNU versionsort()/strverscmp() 扩展，libc 探针兜底 dirent 自带可移植实现；同时 test_large 临时目录尊重 $TMPDIR（OHOS PC 的 /tmp 为只读 erofs 挂载，硬编码 /tmp/ 必然失败）——R8 libc 探针例外，PR 已说明理由"
    patch_type: "portability"
