software: djvu2pdf
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: makefile

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ghfast.top/https://github.com/vindvaki/djvu2pdf/archive/refs/heads/master.tar.gz"

  # 源码校验和
  sha256: "1864851a9853b73fc4fcd587fc0631e051c965cc814d194e9f2ece29fc753168"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # Runtime dependencies: djvulibre (ddjvu, djvused), djvu2hocr, tiffsplit, pdfbeads

  # 编译器
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-add-Makefile-for-install.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
