# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: dfu/0.11
homepage: "https://dfu-util.sourceforge.net/"

# 上游测试（需真实 USB DFU 设备连接，OHOS 无 DFU 设备）——本 PR 为 CLI 工具集，
# test_package 校验 3 个 CLI 工具存在 + dfu-util 可运行
upstream_check_command: "echo \"upstream tests need a real USB DFU device (absent on OHOS)\""

# conanfile.py build() 中未运行上游测试（设备依赖）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: conanfile.py
    description: "校验安装产物：dfu-util/dfu-suffix/dfu-prefix 三个 CLI 工具存在且 dfu-util 可运行"
    command: "test 全部工具产物存在 + dfu-util 运行"

# 断言总数（test_package 1 个断言）
assertion_count: 1
