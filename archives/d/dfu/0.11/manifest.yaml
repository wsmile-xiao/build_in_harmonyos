software: dfu
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.11"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://dfu-util.sourceforge.net/releases/dfu-util-0.11.tar.gz"

  # 源码校验和
  sha256: "b4b53ba21a82ef7e3d4c47df2952adf5fa494f499b6b0b57c58c5d04ae8ff19e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires:
  - "libusb/1.0.27"

# 构建配置选项
build_options:
  - "autotools；config.guess/config.sub OHOS patch；--host=--build=aarch64-unknown-linux-ohos"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | failed | skipped | not_run
test_status: passed

# 测试说明
test_note: "上游测试实测（2026-09-09）：dfu-prefix/dfu-suffix 文件操作测试跑通（不需 USB 设备）——构造 32 字节固件，dfu-suffix -a 加后缀成功（32→48 字节）+ dfu-suffix -c 校验通过（BCD DFU 0x0100/CRC 0x6AF4E6C0，RC=0）；dfu-util 烧录/上传需真实 USB DFU 设备（OHOS 无设备，按 rule 1.2 声明设备限制）；test_package 校验三个 CLI 工具存在 + dfu-util --version 运行时真实执行 dfu-util 0.11"
