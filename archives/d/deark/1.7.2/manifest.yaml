software: deark
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.7.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.7.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# 构建系统类型 (verify-build 检查字段)
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://entropymine.com/deark/releases/deark-1.7.2.tar.gz"

  # 源码校验和
  sha256: "e2163169b18781425e87566abf21a235513cef457a4bd27c14c304cf9a872971"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "make CC=clang CFLAGS=-fPIC -O2 -std=c99 -Wall -Wextra -Wmissing-prototypes -Wformat-security -Wno-unused-parameter"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "deark 使用纯 Makefile 构建系统，非 autotools，无 configure 脚本"
  - "Makefile 使用 DEARK_INSTALLDIR 变量控制安装路径，默认 /usr/local/bin"
  - "install 目标使用 -s(strip) 标志，在鸿蒙上 strip 后的 ELF 需要重新签名"
  - "无 make check 目标，软件不包含测试套件"
