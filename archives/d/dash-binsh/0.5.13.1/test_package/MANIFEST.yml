# test_package/MANIFEST.yml
# 上游官方测试声明文件
# dash 0.5.13.1 上游无正式测试套件(make check 为空,无 ctest/pytest),
# 适配时执行真实功能验证:test_package 消费者用例 5 项断言 + R7 冒烟验证

package: dash-binsh/0.5.13.1
homepage: "http://gondor.apana.org.au/~herbert/dash/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (dash 上游无独立测试程序,已清点: 无 tests/ 目录)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 调用已安装 dash 二进制执行真实 POSIX 脚本"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 5