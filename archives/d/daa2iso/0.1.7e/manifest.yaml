# 版本级 manifest — daa2iso 0.1.7e

version: "0.1.7e"
software: "daa2iso"

# published | built | failed | archived
status: built
build_date: "2026-09-10"
build_system: custom

source:
  # 上游为个人站点（aluigi.altervista.org），CI worker 网络受限不可达；
  # 使用 Debian pool 的 orig.tar.gz（内容与上游一致）
  url: "https://deb.debian.org/debian/pool/main/d/daa2iso/daa2iso_0.1.7e.orig.tar.gz"
  sha256: "d304428eb40106fe38039ed796f2c0059991c453190d89ff108e8b78d3796b9b"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
  - "clang -O2 -Wall -fcommon -c src/LzmaDec.c -o src/LzmaDec.o"
  - "clang -O2 -Wall -fcommon -c src/tinflate.c -o src/tinflate.o"
  - "clang -O2 -Wall -fcommon src/daa2iso.c src/LzmaDec.o src/tinflate.o -o src/daa2iso"
  dependencies: []
  cc: clang
  cxx: N/A

patches_applied: []

knowledge_gained:
- "daa2iso 上游站点（aluigi.altervista.org）在 CI worker 上不可达；改用 deb.debian.org 的 orig.tar.gz 可稳定获取，且 sha256 与上游发行包一致。"
- "LzmaDec.c / tinflate.c 是 7-Zip LZMA 与 zlib 解压器的内嵌副本，含老式 C 的 tentative definition，需 -fcommon 才能在多 TU 链接时不报重复定义。"
- "src/Makefile 只做三步编译+链接，配方直接驱动 clang 可绕开 make 依赖，行为与 Makefile 等价（差别仅少了 -s strip）。"
- "daa2iso 无参数时打印 'Usage: <bin> <input.DAA/GBI> <output.ISO>'，可作为稳定的消费者断言。"
