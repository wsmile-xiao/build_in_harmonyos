package: d0-blind-id/1.0
homepage: "https://github.com/divVerent/d0_blind_id"

# ⚠️ 如实声明：上游 v1.0 **没有测试套件**（仓库里只有 main.c 的演示/基准程序，
# 无 tests/ 目录、无 check/meson test/ctest 目标）。因此 build() 里跑的是
# **上游自带的 blind_id 演示程序**（在它自己的循环体里跑完 签名→验签→认证→
# DH 会话密钥 全流程），而协议正确性的强证据来自 test_package 的消费者用例
# ——其中 AES 部分用 **NIST FIPS-197 官方测试向量**（外部权威 golden 数据）逐字节比对。
upstream_check_command: "echo quit | ./blind_id（上游演示程序，非测试套件）"
upstream_test_in_build: true
upstream_test_command: "echo quit | ./blind_id"

upstream_tests:
  - file: main.c
    source: d0_blind_id-1.0/main.c
    description: "上游自带的演示/基准程序（构建后为 bin/blind_id）：循环体里跑完整协议流程（生成 RSA 私钥 + 私有 ID 模数/请求/应答/完成 + 公钥 ID 交换 + 签名/验签 + 盲身份认证挑战/应答/验证 + DH 会话密钥双方一致），stdin 收到 quit 后退出并打印 'Generated key has ID: <base64>'。上游**没有**测试套件，这一点如实声明（本包 build() 用它做端到端冒烟 + 交付物验证）。"
    command: "echo quit | ./blind_id"

upstream_summary:
  suite: none
  note: "上游无 tcltest/ctest/meson test/make check 之类测试套件；build() 内跑上游演示程序做全流程冒烟（用 timeout -s INT 结束它的 SIGINT-only 交互式循环，判据取日志内容：HMBS_UPSTREAM_DEMO_RESULT rc=124 full-protocol-round-ok signal_terminated=yes）"

test_package_tests:
  - file: test_d0_blind_id.c
    description: "完整消费者用例（rule12 端到端业务流程）：① **NIST FIPS-197 官方 AES 测试向量**（Appendix C.1/C.2/C.3 的 AES-128/192/256）逐字节比对 + 解密往返；② 盲身份协议全流程（RSA 私钥 → 公钥指纹/序列化 → 私有 ID 模数/请求/应答/完成 → 公钥 ID 交换 → 签名/验签 → 盲身份认证挑战/应答/验证 → DH 会话密钥双方一致）；③ 负例（篡改签名/篡改认证应答必须无效）。共 35 项可核对结果"
    command: "./test_d0_blind_id"
  - file: test_layout.py
    description: "适配自检（M=17）：两个 ELF 共享库（ET_DYN）、include/d0_blind_id 三个公开头、两个 .pc 且 prefix 已重写为 ${pcfiledir}/../..、bin/blind_id、R38 源码树级 commands.json 的 name/type/ref/commands 对齐、3-clause BSD 的 licenses/COPYING、无 .la/构建残留、无隐藏文件（JC5）"
    command: "python3 test_layout.py <package_folder>"

assertion_count: 35
