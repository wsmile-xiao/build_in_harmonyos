version: "1.0"
software: d0-blind-id
status: built
build_date: "2026-09-30"
build_system: autotools

source:
  url: "https://github.com/divVerent/d0_blind_id/archive/refs/tags/v1.0.tar.gz"
  sha256: "e9edcc55af1b322a5e51832f4a95b456a368d527b34ff31ebe88340728eca5a1"
  tar_format: tar.gz
  note: >-
    上游 tag v1.0（configure.ac 里的 AC_INIT 版本号仍是历史值 0.5，未随 tag 更新）。
    平台任务版本字段为单字符 "1"，而 Conan 版本正则要求 ≥2 字符，故按仓库先例
    （5 → 5.0）用版本目录 "1.0"。下载双校验：sha256 + tar tzf | wc -l = 26。

build:
  system: "autotools（GitHub 归档不带 configure → build() 内 autoreconf --install 生成）"
  configure_options:
    - "--enable-rijndael（上游默认开启，显式写出）"
    - "--enable-shared --disable-static（跟随 conan 的 shared 选项）"
    - "E007：autoreconf 后用 scripts/patch-autotools-ohos.pl 给 config.guess/config.sub 加 HarmonyOS 支持（内联 Python 兜底）"
    - "E011/E129：生成的 configure 里 umask 077 → 022（HMDFS 下 0600 临时目录不可写）"
  dependencies:
    - "gmp/6.3.0（唯一外部依赖；上游默认后端 d0_bignum-gmp.c）"
  tool_requires:
    - "automake/1.18 + libtool/2.5.4（E178：CI worker 有 autoconf 但没有 automake/aclocal/libtoolize）"
  cc: clang

patches_applied: []

test_passed: 2
test_failed: 0

test_results:
  upstream_suite: none
  upstream_demo_runs: 1
  upstream_demo_passed: 1
  upstream_demo_failed: 0
  test_package_registered: 1
  test_package_executed: 1
  test_package_passed: 1
  test_package_failed: 0
  assertion_count: 35
  adapter_self_checks: 17
  note: >-
    上游 v1.0 没有测试套件（如实声明）：build() 内跑上游自带的 blind_id 演示程序
    （全协议流程冒烟，二进制未修改，用 timeout -s INT 发 SIGINT 结束它的交互式
    无限循环），协议正确性的强证据是消费者用例 —— AES 用 **NIST FIPS-197
    官方测试向量**、协议用完整任务流 + 篡改负例，共 35 项全绿。

knowledge_gained:
  - "d0_blind_id 是**盲身份/匿名认证密码学**库：给定 RSA 公钥，双方可协商出 private ID，并用它做匿名认证、签名与 DH 会话密钥；API 成对（generate/answer/finish、sign/verify、authenticate start/challenge/response/verify）。上游仓库只有一个 main.c 演示/基准程序，**没有任何测试套件** —— 这类包的正确性证据必须自建：本包用 NIST FIPS-197 官方 AES 向量（外部 golden 数据）+ 完整协议流 + 篡改负例。"
  - "上游 GitHub 归档**不带 configure**（只有 configure.ac/Makefile.am），必须 autoreconf 引导；CI worker 有 autoconf 但没有 automake/aclocal/libtoolize → build_requirements() 里 tool_requires automake/1.18 + libtool/2.5.4（E178；enet/1.3.18 先例）。"
  - "autoreconf 生成的 config.guess/config.sub 不认识 HarmonyOS → 必须做 E007（仓库 scripts/patch-autotools-ohos.pl，或内联 Python 兜底），否则 configure 猜出的三元组不对导致交叉/原生构建异常。"
  - "autotools 生成的 configure 里 `umask 077` 在 HMDFS/SELinux 下会造出 0600 目录导致后续步骤不可写（E011/E129）→ 在 build() 里对**生成物**做 umask 077→022（不算改源码）。"
  - "上游 `blind_id` 演示程序的循环体就是完整协议流程（sign→signverify→auth→chall→resp→verify→sessionkey 双方一致）；但它的 `quit` **不是读 stdin**，而是 `signal(SIGINT, mysignal)` 的 handler 置位，第二层 `while(!quit)` 是交互式基准的无限循环 ⇒ 只能 `timeout -s INT N ./.libs/blind_id` 结束它（SIGINT 后走正常退出路径，stdio 缓冲 flush 落盘）。`echo quit | ./blind_id` 会永远阻塞：本机 rc=124/日志 0 字节，OHOS worker 上耗满 14400s 构建超时被 KILL 记「校验异常」。判据用「日志含 `Generated key has ID:` + 不含 errx 的 ` fail`」而不是退出码。"
  - "上游 API 的 in/out 长度参数**只作入参上界、不回收实际长度**（fingerprint/write/sign 后仍返回入参值），消费者必须用 strlen 取真实产物长度；否则日志里会出现 '65536 字节签名' 这类误导数字。"
  - "autotools 的 .pc 里 prefix 是绝对安装前缀（conan 下会指向打包前缀）→ 必须改写成 ${pcfiledir}/../.. 才能让包在任意安装位置可用（unibilium/usbutils 先例）。"
  - "包名带连字符（d0-blind-id）时 CMakeDeps 生成的目标名不能用 `-` → 必须显式 set_property('cmake_file_name'/'cmake_target_name', 'd0_blind_id'/'d0_blind_id::d0_blind_id')。"
  - "**许可与 R38 申报的交付位置是两回事**（CI 实证）：`commands.json` 属**源码树**交付物 —— 软件级 `archives/<字母>/<包名>/commands.json`（仓库 2096 个软件级先例；平台 L0k 与 ci/conan/hooks/pre-commit 都 *只* 看软件级，并且要求 `type=tool`、`name` 含包名、`versions` 里有当前版本，CLI 名写在 `versions[ver].commands` 里）；而许可原文必须由 `package()` 用 `copy()` 拷进包内 `licenses/`（仓库 1500+ 配方同款）。别把 commands.json 装进包目录，也别把许可漏拷 —— 本包第一轮适配就是漏拷许可以致自检 FAIL（CI #66399 实证）。"
  - "上游许可名与声明要对齐：d0_blind_id 根目录是 `COPYING`，正文是 Aaron D. Gifford / Rudolf Polzer 的 **3-clause BSD**（不是仓库里常见的 MIT）⇒ conanfile 的 `license` 字段必须写 `BSD-3-Clause`，交付 `licenses/COPYING` 就顺理成章（`copy(..., keep_path=False)` 保持上游文件名）。"
