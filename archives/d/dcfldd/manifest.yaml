# 软件级 manifest
# 文件位置: archives/d/dcfldd/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: dcfldd

# 显示名
display: "dcfldd"

# 一句话描述
description: "增强版dd命令，支持哈希校验、分块写入和进度显示"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://github.com/resurrecting-open-source-projects/dcfldd"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "Source tarball lacks configure script; autoreconf -fi required"
    - "pkg.m4 unavailable on OHOS; patch removes PKG_CHECK_MODULES for bash-completion"
    - "HMDFS umask 077 prevents temp file creation; sed fix to umask 022 (E011)"
    - "CONFIG_SHELL must be bash, not toybox sh (E005)"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.9.3":
    status: built
    build_date: "2026-06-06"
