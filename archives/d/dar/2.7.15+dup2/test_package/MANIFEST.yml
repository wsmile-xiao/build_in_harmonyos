# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dar/2.7.15
homepage: https://dar.sourceforge.net/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# false: 完整 make check 套件前置要求 root/GPG 密钥/SFTP/FTP 仓库与全部压缩
# 算法特性，OHOS CI 交叉编译环境不可满足（同 2.7.15/2.7.15.1 先例白名单处理）
# 上游可运行单元（bnonzero/padder）与 dar 功能级测试已在 OHOS aarch64 原生
# 环境实测通过（T1-T7，7/7），见版本目录 notes.md
upstream_test_in_build: false
upstream_test_command: "make check"
upstream_test_result: "PASS 7/7 functional tests (aarch64 OHOS native environment)"

# 上游 make check 测试套件（CI 交叉编译环境跳过，OHOS aarch64 原生环境已验证）
upstream_tests:
  - name: "bnonzero"
    source: src/check/bnonzero.c
    description: "bnonzero 测试工具（独立运行 PASS）"
  - name: "padder"
    source: src/check/padder.cpp
    description: "padder 测试工具（独立运行 PASS）"
  - name: "all_features"
    source: src/check/all_features.cpp
    description: "全功能集成测试前置检查（要求全部压缩算法特性，配置类受限不运行）"

# test_package 中自带的测试
test_package_tests:
  - file: test_dar.sh
    description: "dar -V + -h + dar_xform/dar_slave/dar_manager/dar_cp/dar_split -V 存在性与执行验证"
    command: "bash test_dar.sh <bindir>"

# 测试断言总数
assertion_count: 7
