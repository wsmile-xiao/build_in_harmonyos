software: doxygen
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.17.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.17.0"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: cmake

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/doxygen-1.17.0.src.tar.gz"

  # 源码校验和
  sha256: "28199ea88989fc56e302c927ef979596fe9247dd231e767ba6edcdbaa49f78aa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DIconv_INCLUDE_DIR=$DEFAULT_PREFIX/include"
    - "-DIconv_LIBRARY=$DEFAULT_PREFIX/lib/libiconv.so"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libiconv/1.17

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-src-dotrunner.cpp.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "doxygen 使用 cmake 构建系统（非 autotools），需要在源码目录外创建 build 目录"
  - "doxygen 依赖 Iconv 库，需要安装 libiconv 预编译包并创建符号链接 libiconv.so"
  - "doxygen 内置 fmt/spdlog 库可能与系统 fmt 库冲突，需要临时备份系统 fmt 库"
  - "C++17 structured binding 变量不能直接在 lambda 捕获列表中使用，需要创建副本（src/dotrunner.cpp 第 400 行）"
  - "运行时需要设置 LD_LIBRARY_PATH 或 RPATH 才能找到 libiconv.so.2"

patch_generation:
