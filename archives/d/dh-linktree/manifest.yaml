software: dh-linktree
display: "dh-linktree"
description: "debhelper plugin to create symlink trees to embed files from other packages (pure Perl)"
category: dev-tool
homepage: "https://salsa.debian.org/debian/dh-linktree"
license: GPL-3.0-or-later
build_system: "none (pure Perl script packaging)"
compile_date: "2026-09-10"

ohos_adaptation:
  key_points:
    - "pure Perl debhelper plugin — zero compile (download + tar -xJf + cp -a 收拢)"
    - "package() 挑文件安装: bin/dh_linktree + lib/perl5/Debian/Debhelper/Sequence/linktree.pm + share/man/man1/"
    - "runtime deps: debhelper (Debian::Debhelper::Dh_Lib) + dpkg (Dpkg::IPC + dpkg/dpkg-query)"
  common_dependencies:
    - debhelper
    - dpkg

versions:
  "0.9":
    status: built
    build_date: "2026-09-10"
