# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dh-linktree/0.9
homepage: "https://salsa.debian.org/debian/dh-linktree"

# 上游测试命令
# 上游无测试套件（debian/rules 只有 dh + pod2man，无 make check——
# tar tJf 核验：tarball 仅 dh_linktree/linktree.pm/dh_linktree.1/debian/）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - name: 无
    count: "0"
    description: "上游无测试套件（debian/rules 仅 dh + pod2man；tar tJf 核验 tarball 内容）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_dh_linktree.py
    description: "R1 文件存在断言（bin/dh_linktree + Sequence/linktree.pm，2 断言）+ R2 perl -c 语法检查（dh_linktree + linktree.pm，2 断言）+ R3 功能冒烟（最小 debian 骨架真实运行 embed，符号链接树创建 1 断言——dpkg 数据库缺失则如实记录受限说明，不伪造通过率）"
    command: "python3 test_dh_linktree.py <package> <dep_packages...>"

assertion_count: 5
