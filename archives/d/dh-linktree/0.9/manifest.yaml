# 版本级 manifest — dh-linktree 0.9
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "0.9"

# 软件名
software: dh-linktree

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"
build_system: none (pure Perl script packaging)

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/d/dh-linktree/dh-linktree_0.9.tar.xz"

  # 源码校验和
  sha256: "ea968315dad69c259037e357bfcd3537cbf062eefe57731ffb519be1f0253bfd"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: none (pure Perl script packaging)

  # 配置选项列表（无 configure——零编译）
  configure_options: []

  # 运行时依赖列表（格式: name/version）
  dependencies:
    - debhelper/13.3.4
    - dpkg/1.23.7

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 适配中学到的知识
knowledge_gained:
  - category: L2
    content: "纯 Perl debhelper 插件打包型适配——零编译，download + tar -xJf --no-same-owner + cp -a 收拢，package() 挑文件安装（bin/ + lib/perl5/ + share/man/man1/），build() 为 pass"
    reason: "dh-linktree 是 debhelper 的 dh_* 插件（pure Perl），无 C 代码、无 configure、无编译步骤"
  - category: L2
    content: "test_package 的 PERL5LIB 需收集本包与依赖包所有含 .pm 的目录——Debian::Debhelper::Dh_Lib 来自 debhelper 包、Dpkg::IPC 来自 dpkg 包，跨包 Perl 依赖"
    reason: "dh_linktree use Debian::Debhelper::Dh_Lib + Dpkg::IPC，语法检查与运行均需依赖包 perl 库路径"
  - category: L2
    content: "功能冒烟在无 dpkg 数据库的 OHOS 沙箱只能跑通符号链接树创建（embed 动作），脚本尾部 dpkg --search / dpkg-query -W 生成依赖阶段受阻——如实记录为受限通过，禁止伪造通过率"
    reason: "实测 dh_linktree 尾部 spawn dpkg --search 需 Debian dpkg 数据库，沙箱无此环境"
  - category: L2
    content: "test_package 的 PERL5LIB 只能加包根/库根目录，不能把依赖树所有含 .pm 的目录加入——dpkg 包的 Dselect/Method/Config.pm 会遮蔽 perl 核心 Config 模块导致 Errno.pm 编译失败（%Config requires explicit package name）"
    reason: "实测 dpkg 包 Dselect/Method/Config.pm 被 perl 误加载为 Config 模块"
