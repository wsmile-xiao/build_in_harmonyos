software: dicom3tools
display: "dicom3tools"
description: "DICOM 医学影像离线工具集（创建、修改、转储与校验 DICOM 文件）"
category: gfx
homepage: "https://www.dclunie.com/dicom3tools.html"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - '构建系统是 X11 imake：./Configure 生成 config/generic.cf，imake 由 Imakefile 生成 Makefile，make 再编译。imake 依赖的 imake、makedepend、mkdirhier 三个工具在 OHOS 上没有发行包，配方按上游 INSTALL 指定的官方归档现场编译，仅作构建工具，不进入制品'
    - 'clang 的 cpp 把多行宏调用内部的换行与制表符塌缩成一个空格，X11R5 imake 的 FIXUP_CPP_WHITESPACE 修正逻辑因此既漏掉配方行的制表符、又把对齐的宏定义误当成配方行；变量消失后子目录 imake 找不到 Imake.tmpl。补丁按首个词是否含冒号区分 target 与 recipe，并保留宏定义'
    - 'imake 通过 stdin 把 Imakefile 交给 cpp，历史实现是 /lib/cpp；clang-cpp 同样读 stdin，但必须加 -P，否则它插入的空行会重置 imake 的 InRule 状态'
    - 'hnp clang 的产物带 .codesign 段，strip 后内核拒绝执行（退出码 126）；配方设 -DStripCmd=true 并清空 INSTPGMFLAGS'
    - '设备 /tmp 是只读挂载：Configure 的临时文件必须走 TMPDIR；libsrc/support/*.awk 把诊断写到 /dev/tty，没有控制终端时 gawk 视为致命错误并截断生成的表头'
    - 'musl 没有 sys_errlist，也没有 infinity()/quiet_nan()；Configure 的 gcc 版本号判定对 clang 无效，改为编译探测'
    - 'appsrc/dconvert/signa/Imakefile 与顶层 Imakefile 中注释掉的配方行以 TAB 加井号开头，新版 cpp 报 invalid preprocessing directive，改为 XCOMM'
    - '上游测试依赖的 images/ 与 test/ 两份夹具树，上游把它们作为独立归档分发，而该归档在官方站点上不存在（24 个 URL 逐一探测均为 S3 NoSuchKey：当前版本 4 个路径基 × {images,test} × {tar.bz2,tar.gz} 共 16 个，另 4 个历史日期 × {images,test} 共 8 个）。按清点口径 308 个测试驱动调用点（候选数法取最大值：296 个 testapp 调用 + 12 个独立脚本驱动；差额逐项归因见版本级 manifest 与 test_package/MANIFEST.yml）全部无法执行；取证见 reports/upstream-test-evidence.md 与 reports/upstream-test-probe.md'
  common_dependencies:
    - libx11
    - libxext

versions:
  "1.00-20240118131615":
    status: built
    build_date: "2026-09-11"
