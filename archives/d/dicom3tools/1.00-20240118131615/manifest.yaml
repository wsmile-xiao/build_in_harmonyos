software: dicom3tools
version: "1.00-20240118131615"
status: built
build_date: "2026-09-11"
build_system: makefile

source:
  url: "https://www.dclunie.com/dicom3tools/workinprogress/dicom3tools_1.00.snapshot.20240118131615.tar.bz2"
  sha256: "64c2186b8a132aa92c5ec0834184a32f64d13ab55e840280864de9ce2914831b"
  tar_format: tar.bz2

build_tools:
  # imake、makedepend、mkdirhier 由上游 INSTALL 指定的官方归档现场编译；仅作构建工具
  imake:
    url: "https://www.dclunie.com/imake/imake.tar.gz"
    sha256: "1339c0285fccbff955e802dea8e7b537687f38db65a5b978b2c9cefda1610412"

build:
  system: makefile
  configure_options:
    - "./Configure（生成 config/generic.cf；TMPDIR 指向构建目录，设备 /tmp 只读）"
    - "imake -I./config -DStripCmd=true -DAnsiCCmd=clang -DCPlusPlusCmd=clang++ -DX11IncludePath=<libx11 与 xorgproto 的 include> -DDisplayLoadFlags=-L<libx11 与 libxext 的 lib> -lX11 -lXext"
    - "make IMAKE_DEFINES=... Makefiles"
    - "make IMAKE_DEFINES=... depend"
    - "make -j<N> IMAKE_DEFINES=... INSTALL='busybox install' INSTPGMFLAGS=（设备无 install 命令，且不能 strip）"
    - "make ... DESTDIR=<stage> install"
    - "make ... DESTDIR=<stage> install.man"
  dependencies:
    - "libx11/6.4.0"
    - "libxext/6.4.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-probe-compiler-capabilities.patch（Configure 改为编译探测编译器与 C 库能力）"
  - "0002-imakefile-xcomm-comment-lines.patch（注释掉的配方行改用 XCOMM）"
  - "0003-support-awk-diagnostics-to-stderr.patch（awk 诊断写 stderr）"
  - "0004-imake-build-on-musl-and-modern-cpp.patch（imake 适配 musl 与现代 cpp）"
  - "0005-makedepend-build-on-modern-c.patch（makedepend 适配现代 C 库并修复 64 位诊断崩溃）"
  - "0006-portable-userland-command-syntax.patch（sort 的 +N -M 旧式键语法改为 -k；xargs -L 1 改为 POSIX 的 -n 1——toybox 两者都不支持）"

artifacts:
  # 取数命令：ls <package_folder>/bin | wc -l 等
  # bin/ 分类判据：前 4 字节 \x7fELF / 前 2 字节 '#!'
  bin_total: 122
  bin_elf: 102
  bin_shebang_scripts: 19
  bin_zero_byte_script: 1   # bin/himrunid：上游 himrunid.script 本身即 0 字节成员，按原样安装
  man_pages: 130
  licenses: 1

validation:
  conan_create:
    command: "conan create <package_folder> -pr:h=<repo>/ci/conan/profiles/ohos-aarch64 -pr:b=<repo>/ci/conan/profiles/ohos-aarch64 --build=missing --user=ohpcd --channel=stable"
    result: "PASS（清缓存干净轮；日志标记：linked 102 programs、5 条 Apply patch、5 条 RUN: make、1 条 Calling build()）"
    evidence: "reports/conan-create-evidence.md（逐字留档；本轮原始日志 667449 字节，sha256 8ef5106a…）"
  test_package:
    command: "bash test_package/test.sh（由 test_package/conanfile.py 在 conanrun 环境调用）"
    result: "PASS 22/22"
    evidence: "reports/test-package-evidence.md"
  upstream_tests:
    command: "make IMAKE_DEFINES=... test"
    unit: "测试驱动调用点（support/testapp 调用 + 独立测试脚本调用）"
    result: "TOTAL 308 / PASS 0 / FAIL 0 / SKIP 0 / NOT_RUN 308"
    n_candidates: "候选值：0（无单元测试框架）/ 21 test:: 目标 / 21 test.create:: 目标 / 16 test:: 具名子目标 / 2 test.create:: 具名子目标 / 148 compare testapp / 148 create testapp / 296 全部 testapp（词法）/ 288 可达 testapp / 12 脚本驱动调用点 / **308 采纳值（= 296 + 12，取最大值）**；取数命令与逐项归因见 test_package/MANIFEST.yml 的 upstream_test_counts"
    reason: "上游夹具 images/ 与 test/ 为独立分发归档且官方站点任何日期均 HTTP 404。判定口径（见 reports/upstream-test-evidence.md）：FAIL 只记「驱动真的执行了比对并给出不符结论」，NOT_RUN 记「驱动在达到比对之前即被阻断」。308 个驱动点全部属后者——296 个 testapp 调用在夹具目录不存在处中止；12 个脚本驱动中，binpatch.test.sh 与 acrnema 两个脚本虽被执行，但前者硬编码 /tmp（设备只读）使被测程序 abort、比对报 nothing stored to compare，后者 mkdir //tmp 失败使每条 cmp/diff 都指向不存在的文件。因此没有任何驱动产生过比对结论，PASS=0 且 FAIL=0"
    evidence: "reports/upstream-test-evidence.md（分析）、reports/upstream-test-probe.md（404 原始响应）、reports/upstream-make-test-evidence.md（日志逐字留档）"
    note: "make test 退出码恒为 0，不作为通过证据——顶层 test:: 的 recipe 是 for 循环，退出状态等于最后一次迭代，子目录失败不向上传递（实测同轮 22 条 *** Error 与 rc=0 并存，原始输出见 reports/make-test-exit-code-probe.md）"
  conan_verify:
    command: "python3 scripts/ohc-run.py conan-verify dicom3tools 1.00-20240118131615 --project-dir <repo>"
    result: "Verdict PASS（G1/G2/G3 实跑；G4 与 L2/L4/L5 命中工具缺陷走跳过分支）"
    evidence: "reports/conan-verify-report.md 与 reports/conan-verify-stdout.md"
    supplement: "G4 与 L2/L4/L5 因 conan-verify 定位不到包目录而走「无 cache 路径」跳过分支，按 §7.2 人工补测，见 reports/conan-verify-supplement.md"
  w3_local_ci:
    command: "python3 scripts/ohc-run.py finish dicom3tools 1.00-20240118131615 built --project-dir <repo>（内嵌 Step 5/10 W3）"
    result: "L0 pass / L1 pass: test_package executed / L2 pass / L4 warn: dangerous functions in patches / L5 pass；包构建 1/1"
    evidence: "reports/w3-local-ci-evidence.md（逐字留档；原始日志 679496 字节）"
  l2_consumer_test:
    command: "PATH=<package_folder>/bin:$PATH bash reports/l2-consumer-test.sh"
    result: "PASS 36/36"
    evidence: "reports/l2-consumer-test-evidence.md"
  l4_security_attributes:
    command: "readelf -h/-lW/-dW <package_folder>/bin/*（逐个 ELF）"
    result: "PASS 102/102（PIE + GNU_STACK RW + GNU_RELRO + BIND_NOW）"
  l5_artifact_baseline:
    command: "见 reports/conan-verify-supplement.md 的稳定聚合口径"
    result: "七轮清缓存构建两条稳定聚合逐字节一致；bin/ 下 122 项逐产物 sha256 与基线 diff 无输出"
    evidence: "reports/l5-artifacts.sha256（bin/ 下 122 项逐产物 sha256）"

knowledge_gained:
  - 'X11 imake 这类把 cpp 当宏处理器的老构建系统在现代 clang 上会静默产出坏 Makefile：cpp 把宏展开内的制表符塌缩成空格，imake 的修正逻辑按行内是否含冒号判断 target，会把对齐的宏定义误判为配方行并吞掉变量，症状出现在下游（子目录 imake 报 Imake.tmpl file not found）而不是补丁位置'  # knowledge_ref: E6341
  - 'imake 把 Imakefile 通过 stdin 交给 cpp，CPP_PROGRAM 必须是能读 stdin 的预处理器；clang-cpp 可以，但必须加 -P 去掉行号标记与它插入的空行，否则空行会重置 imake 的跨行规则状态'  # knowledge_ref: E6341
  - 'imake 的修正逻辑要同时满足「启用 FIXUP_CPP_WHITESPACE」与「target 判据只看首个词」，只做其一会分别表现为 missing separator 与变量被吞掉两种不同症状'  # knowledge_ref: E6341
  - 'hnp clang 产物带 .codesign 段，strip 之后内核拒绝执行且退出码是 126；老构建系统的 StripCmd 与 INSTPGMFLAGS=-s 必须显式关掉，而不是先 strip 再重签名'  # knowledge_ref: E077
