# conandata.yml -- dicom3tools 1.00-20240118131615
#
# Two sources are needed: the dicom3tools snapshot itself, and the imake
# configuration tools (imake and makedepend).  dicom3tools is built with imake, the
# X11 makefile generator; upstream expects imake to be installed on the host and
# points at this exact distribution in INSTALL ("If you don't have imake, I suggest
# you get it from Paul DuBois's archive ... It is also probably at the site where
# you found dicom3tools").  No imake package is published for OHOS, so the two small
# X11R5 tools are bootstrapped from the official tarball inside build().
#
# Both files are fetched from the maintainer's own site, which is also where the
# dicom3tools source lives.

sources:
  dicom3tools:
    url: "https://www.dclunie.com/dicom3tools/workinprogress/dicom3tools_1.00.snapshot.20240118131615.tar.bz2"
    sha256: "64c2186b8a132aa92c5ec0834184a32f64d13ab55e840280864de9ce2914831b"
  imake:
    url: "https://www.dclunie.com/imake/imake.tar.gz"
    sha256: "1339c0285fccbff955e802dea8e7b537687f38db65a5b978b2c9cefda1610412"

patches:
  "1.00-20240118131615":
    - patch_file: "patches/0001-configure-probe-compiler-capabilities.patch"
      patch_description: "Configure probes the C and C++ compilers and the C library capabilities instead of parsing a gcc version number"
      patch_type: portability
    - patch_file: "patches/0002-imakefile-xcomm-comment-lines.patch"
      patch_description: "Imakefile and appsrc/dconvert/signa/Imakefile: write commented-out recipe lines as XCOMM so that a C preprocessor does not reject them as invalid directives"
      patch_type: portability
    - patch_file: "patches/0003-support-awk-diagnostics-to-stderr.patch"
      patch_description: "libsrc/support/*.awk: send diagnostics to stderr; a failed redirect to /dev/tty is fatal to gawk and truncated generated headers"
      patch_type: portability
    - patch_file: "patches/0004-imake-build-on-musl-and-modern-cpp.patch"
      patch_description: "imake: build against musl and a modern C compiler (strerror instead of sys_errlist, no bare return in a non-void function)"
      patch_type: portability
    - patch_file: "patches/0005-makedepend-build-on-modern-c.patch"
      patch_description: "makedepend: build on a modern C library (rename the private getline, explicit void returns) and fix the diagnostic helpers that truncate pointers on 64-bit targets"
      patch_type: bugfix
    - patch_file: "patches/0006-portable-userland-command-syntax.patch"
      patch_description: "libsrc/docs, libsrc/standard and libsrc/standard/elmdict: use portable userland command syntax: replace the obsolescent sort keys (+N -M, which only GNU coreutils honours via _POSIX2_VERSION=199209) with the modern -k form, and xargs -L 1 with the POSIX xargs -n 1, because a toybox sort/xargs rejects both and the failing pipeline truncates the generated headers"
      patch_type: portability
