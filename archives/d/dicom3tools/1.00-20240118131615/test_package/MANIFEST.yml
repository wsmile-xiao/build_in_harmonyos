# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: dicom3tools/1.00-20240118131615
homepage: "https://www.dclunie.com/dicom3tools.html"

# 上游测试入口：顶层 `make test`，递归进入 21 个 Imakefile 中定义了 test:: 的目录
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游测试的数据来源：$(TOP)/images/ 与 $(TOP)/test/，由上游单独分发的
# dicom3tools_images_<version>.tar.bz2 / dicom3tools_test_<version>.tar.bz2 提供。
# 这两个归档在官方站点上不存在（任何日期均 HTTP 404，且未列入目录索引），
# 因此上游用例在设备上无法执行。取证见 reports/upstream-test-evidence.md 与
# reports/upstream-test-probe.md。

# 统计单位：**测试驱动调用点**（`support/testapp` 调用 + 独立测试脚本调用）。
# 上游无单元测试框架、无 case 注册机制，因此不存在「注册 case 数」口径。
upstream_tests:
  - name: "support/testapp 调用点（compare 模式，= make test 实际驱动）"
    count: 148
    status: NOT_RUN
    reason: "夹具归档 dicom3tools_images_<version>.tar.bz2 未分发（官方站点 HTTP 404）"
  - name: "support/testapp 调用点（create 模式，= make test.create 生成比对基准）"
    count: 148
    status: NOT_RUN
    reason: "同上"
  - name: "appsrc/misc/binpatch.test.sh（test:: → testbinpatch，compare）"
    count: 1
    status: NOT_RUN
    reason: "脚本硬编码 /tmp 作为临时目录，设备 /tmp 只读 → 被测程序 binpatch abort、脚本报 nothing stored to compare，未产出比对结论；比对基准 $(TOP)/test/appsrc/misc/ 亦未分发"
  - name: "appsrc/misc/binpatch.test.sh（test.create:: → testbinpatch.create）"
    count: 1
    status: NOT_RUN
    reason: "夹具未分发"
  - name: "appsrc/acrnema/test.create.ut.sh（compare 与 create 各一处）"
    count: 2
    status: NOT_RUN
    reason: "脚本依赖未分发的 $(TOP)/test/；未达到可判定阶段"
  - name: "appsrc/acrnema/test.create.private.un.sh（compare 与 create 各一处）"
    count: 2
    status: NOT_RUN
    reason: "同上"
  - name: "appsrc/dconvert/gen/testy2k.sh（compare 与 create 各一处）"
    count: 2
    status: NOT_RUN
    reason: "夹具 $(TOP)/images/genesis 未分发"
  - name: "appsrc/dcfile/testy2k.sh（compare 与 create 各一处）"
    count: 2
    status: NOT_RUN
    reason: "夹具未分发"
  - name: "appsrc/dcfile/testy2k.antodc.sh（compare 与 create 各一处）"
    count: 2
    status: NOT_RUN
    reason: "夹具未分发"

# 候选值清单（§7.3 规则 2：N 取候选数法中的最大值，差额逐项归因）
