    - {label: "support/testapp 调用（仅 test::/test.create:: 可达目标）", value: 288, command: "见 reports/upstream-test-evidence.md 的可达性归因"}
    - {label: "脚本驱动调用点（**与脚本名无关**的枚举）", value: 12, command: "grep -rnE '^[[:space:]]*(@)?\\./[A-Za-z0-9_.-]+\\.sh' --include=Imakefile . | grep -v ':[[:space:]]*#' | grep -v makedcdtchgheader | wc -l"}
    - {label: "测试驱动调用点（采纳值 N = 296 + 12）", value: 308, command: "见下 attribution"}
  attribution:
    - "308 = 296 + 12：296 个 `support/testapp` 调用点（词法口径，含 create 与 compare 两种模式）加 12 个独立脚本驱动调用点"
    - "296 = 148 + 148：compare 模式 148 处、create 模式 148 处（create 模式是生成比对基准而非比对本身，按最大口径仍计入）"
    - "296 = 288 + 8：288 处位于 `test::`/`test.create::` 直接或经具名子目标可达的规则体内；另 8 处位于 testdctopnm / testdctopgx / testdctopnm.create / testdctopgx.create 四个目标内（appsrc/dcfile/Imakefile:634/635/638/639/780/781/784/785），这四个目标未出现在 dcfile/Imakefile:523 的 `test::` 前置列表中，因此 `make test` 不会触达——按最大口径仍计入 N"
    - "12 = 2 + 2 + 2 + 2 + 2 + 2：binpatch.test.sh 2、test.create.ut.sh 2、test.create.private.un.sh 2、testy2k.sh 4（dconvert/gen 2 + dcfile 2）、testy2k.antodc.sh 2（dcfile）"
    - "12 这个数必须用「与脚本名无关」的枚举取得：按脚本名硬编码三个名字（binpatch.test.sh / test.create.ut.sh / testy2k.sh）只能看到 8 处，会漏掉 test.create.private.un.sh ×2 与 testy2k.antodc.sh ×2 —— 这是本文件此前 N=304 的少报根因"
    - "唯一比 308 更小的另一种口径是「仅可达」= 288 + 12 = 300；本表按最大口径取 308"
    - "21 + 21 = 42 个 `test::`/`test.create::` 目标定义，其中 16 + 2 = 18 个带具名子目标；目标数是比调用点更粗的单位，不参与 N 的取最大值"
    - "不可静态计数、因而未计入 N 的项：`appsrc/acrnema/Imakefile:62` 的独立目标 testcompareandcwithoriginal（未被 `test::` 或任何目标引用，不在 `make test` 路径上；其驱动 `andiff` 按 images/<dir>/testlist 逐行展开，行数取决于未分发的夹具归档）"
    - "真实断言数同样不可得：testapp 按 images/<dir>/testlist 逐行展开，而这些 testlist 位于未分发的夹具归档内"
