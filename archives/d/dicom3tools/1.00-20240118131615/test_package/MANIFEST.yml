  pass: 0
  fail: 0
  skip: 0
  not_run: 308
  command: "见 reports/upstream-test-evidence.md；TOTAL = PASS + FAIL + SKIP + NOT_RUN = 0 + 0 + 0 + 308 = 308"
  status_criteria: "FAIL 只记「驱动真的执行了比对并给出不符结论」；驱动在达到比对前被阻断（夹具目录不存在、或脚本硬编码 /tmp 导致被测程序 abort / 输出文件无法创建）一律记 NOT_RUN。本包 308 个驱动点全部属后者，故 FAIL=0、NOT_RUN=308；binpatch.test.sh 的被测二进制确实被调用并 abort，该原始输出保留在逐字日志中，可佐证不是静默跳过"

