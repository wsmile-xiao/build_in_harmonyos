# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: daw-header-libraries/2.135.0
homepage: "https://github.com/beached/header_libraries"

upstream_check_command: "ctest -N"

upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: DAW_ENABLE_TESTING=ON 时构建 tests/ 下 138 个 .cpp 测试可执行文件
# 每个可执行文件为独立测试程序（含多个断言/用例），具体用例计数见本轮 test-report
upstream_tests:
  - file: tests/daw_span_test.cpp
    source: header_libraries-2.135.0/tests/daw_span_test.cpp
    description: "daw::span 核心单元测试（构造/访问/迭代）"
    command: "ctest -R daw_span_test"
  - file: tests/daw_expected_test.cpp
    source: header_libraries-2.135.0/tests/daw_expected_test.cpp
    description: "daw::expected 单元测试"
    command: "ctest -R daw_expected_test"
  - file: tests/daw_static_string_test.cpp
    source: header_libraries-2.135.0/tests/daw_static_string_test.cpp
    description: "daw::static_string 单元测试"
    command: "ctest -R daw_static_string_test"

test_package_tests:
  - file: test_daw_header_libraries.cpp
    description: "消费者测试: 验证 daw-header-libraries 库链接、span/expected/static_string 核心 API"
    command: "./test_daw_header_libraries"

assertion_count: 3