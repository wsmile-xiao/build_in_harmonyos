software: diff-so-fancy
display: "diff-so-fancy"
description: "Human-readable Git diff output formatter"
category: doc
homepage: "https://github.com/so-fancy/diff-so-fancy"
license: MIT
build_system: custom               # Perl 脚本，无需编译

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Perl 脚本，无需编译，直接安装即可"
    - "lib/DiffHighlight.pm 必须在脚本所在目录的 lib/ 下"
    - "需要 Perl >= 5.14（系统自带 5.42.0）"
  common_dependencies:
    - perl

# 版本索引
versions:
  "1.4.10":
    status: built
    build_date: "2026-05-19"