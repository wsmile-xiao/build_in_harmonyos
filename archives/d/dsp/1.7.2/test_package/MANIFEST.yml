# test_package/MANIFEST.yml — dsp 1.7.2
# 上游官方测试声明文件（L0e 强制要求存在）

package: dsp/1.7.2
homepage: "https://github.com/Signalsmith-Audio/dsp"

# 上游为 header-only 库（仅 CMake INTERFACE 目标 + 头文件），
# 上游仓库 v1.7.2 不含任何测试目录/测试目标（无 tests/、无 ctest 注册、
# 无 make check），因此无上游测试可运行（R51 清点证据见下）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
# 清点证据（v1.7.2 标签解包后）:
# - 文件清单仅: CMakeLists.txt LICENSE.txt README.md + 11 个顶层 .h + include/signalsmith-dsp/ 转发头
# - CMakeLists.txt 仅 add_library(signalsmith-dsp INTERFACE) + target_include_directories，无 test/ 目标
# - find 结果无 tests/ examples/ 目录，无 .cpp/.c 测试源文件

# test_package 自带的消费者测试（真实调用库 API，R34）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：CubicLfo/BiquadStatic/RealFFT 往返/MultiBuffer/Kaiser 窗口真实调用"
    command: "./dsp_test"

assertion_count: 5
