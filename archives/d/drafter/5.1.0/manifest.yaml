software: drafter
# 版本级 manifest
# 文件位置: archives/d/drafter/5.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.1.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/apiaryio/drafter/releases/download/v5.1.0/drafter-v5.1.0.tar.gz"

  # 源码校验和（本地 tarball SHA256，通过 git clone --branch v5.1.0 创建）
  sha256: "447ce171e4dbb68b650a10e8bd988b40922230e76d3d030ea2e7ecf096486440"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 需要添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 解决子模块（sundown/cmdline）的 cmake_minimum_required 兼容性"
  - "GitHub release tarball 下载在 HarmonyOS 环境 SSL 证书验证失败，可使用 git clone --depth 1 --branch 替代获取源码"
  - "drafter 项目将所有依赖（sundown, cmdline, snowcrash 等）作为 git 子模块内嵌在 packages/ 目录中，无外部依赖"
  - "drafter --version 报告 v5.0.0 而非 v5.1.0，因为版本号来自 CMake 项目配置而非 git tag"
  - "conan-init 默认生成 Autotools 模板，CMake 项目需手动改写 conanfile.py 为 CMake 模板"
