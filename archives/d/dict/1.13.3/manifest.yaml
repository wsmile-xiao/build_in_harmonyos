# libmaa 无仓内 Conan recipe：vendored 静态构建 libmaa 1.4.7（仅用 maa_init/maa_shutdown），
# 源归档固定于 conandata.yml（SHA256 4e01a9eb...）
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

knowledge_gained:
  - "libmaa 无仓内 Conan recipe，采用先例 dictd/1.13.3 已验证方案：recipe 内 vendored 静态构建 libmaa 1.4.7，源归档固定于 conandata.yml"
  - "libmaa 1.4.7 为 BSD make (mkc) 构建，vendored 构建直接用 clang 编译 maa/*.c：mkc 特性宏用命令行提供（-DSIZEOF_LONG=8 -DHAVE_HEADER_SYS_RESOURCE_H=1），arggram.c 需 awk -f arggram2c 预生成；maa.c 引用 timer.c 的 tim_* 符号，排除 timer.c 会链接失败"
  - "上游测试入口是 make test（非 make check）：cd test && sh dictd_test && sh dictzip_test；绝大多数 server 用例走 dictd --stdin2stdout 管道"
  - "设备 bash 启动时 getcwd() 在 HMDFS 路径上失败，conan 自定义 run 命令必须以 cd '<workdir>' && 前缀重建 shell 工作目录"
  - "AC_PROG_LEX(yywrap) 在无 -lfl 时把 LEX 降级为 ':'（静默不生成 scanner）；scanners 自带 yywrap，需在 make 前按上游命令行预生成 4 个 scanner/parser 文件绕开"
  - "OHOS 构建需在 /data/storage/el2/base tmpfs 下进行（HMDFS 临时文件/getcwd 不可靠），与 dialog/dictd 同款方案"

