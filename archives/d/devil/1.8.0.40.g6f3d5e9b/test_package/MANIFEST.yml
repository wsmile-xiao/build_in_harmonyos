# test_package/MANIFEST.yml — upstream official test declaration (CI L0e)
# See docs/TEST_QUALITY_SPEC.md; CI script build_and_test.sh requires this file.
package: devil/1.8.0.40.g6f3d5e9b
homepage: "https://github.com/DentonW/DevIL"

# Upstream official test entry: the repository's own CI config (.travis.yml at
# the repo root, present in the pinned source archive) runs:
#   cmake DevIL && make all UnitTest benchmark
upstream_check_command: "make all UnitTest benchmark"

# Both upstream test targets are built and executed inside the recipe's
# build(), so a plain `conan create` runs the official upstream tests.
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target benchmark && ./benchmark test/UnitTest/Data/Logo.png ; cmake --build . --target UnitTest && ./UnitTest"

# Upstream test inventory at the pinned commit (test/CMakeLists.txt):
#   - Benchmark and UnitTest are the only wired subdirectories (both
#     EXCLUDE_FROM_ALL); neither registers any add_test(), so `ctest -N`
#     finds zero tests.
#   - format_test (the only format-regression suite) and 8 further test
#     programs are commented out upstream ("TODO") — dead code, no target.
upstream_tests:
  - file: "test/UnitTest (ILTest.cpp, ILUTest.cpp, UnitTest.cpp)"
    source: "upstream cppunit assertion suite (CPPUNIT_TEST_SUITE_REGISTRATION), test data in test/UnitTest/Data"
    description: "9 active cppunit tests for il*/ilu* APIs (TestilActiveImage, TestilBindImage, TestilClearColour, TestilClearImage, TestilCloneImage, TestilConvertImage, TestilSaveF, TestiluSaturate4f, TestiluReplaceColour); requires cppunit"
    command: "make UnitTest && ./UnitTest"
    status: "RUN - built against cppunit/1.15.1 (test_requires; binary exists in the ohpcd registry for the ohos-aarch64 profile) with include-wiring patch 0003 and executed on the OHOS device in recipe build(); PASS = cppunit reports 'OK (9)' and exit code 0 (verified in pre-flight on the device). The suite hardcodes Windows-style relative paths ('.\\Data\\Logo.png'); the recipe materializes files under exactly those literal POSIX names pointing at the upstream test data"
  - file: "test/Benchmark/benchmark.c"
    source: "upstream benchmark target (part of the official .travis.yml entry)"
    description: "Loads an image 20x via ilLoadImage (2 hints x 10); always exits 0, so the recipe additionally fails when the DevIL error stack is not empty. Runs against the upstream test image test/UnitTest/Data/Logo.png because upstream's own data/DevIL_logo.jpg is a 0-byte file at this commit (feeding it corrupts the heap via a DevIL/libjpeg error-path defect)"
    command: "./benchmark test/UnitTest/Data/Logo.png"
    status: "RUN - executed in recipe build(); PASS = 20 loads with empty error stack"

# test_package consumer verification (CI L1a)
test_package_tests:
  - file: test.c
    description: "Consumer round-trip: ilTexImage -> ilSave(IL_PNG/IL_JPG) -> ilLoad -> dimension/pixel verification; also checks ILU runtime version (links both libIL and libILU). Consumer ELF is self-signed before execution (OHOS loader rejects unsigned images)"
    command: "./test_devil"

assertion_count: 16
