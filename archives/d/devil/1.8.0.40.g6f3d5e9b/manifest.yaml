software: devil
# 版本级 manifest（ARCHIVE-SPEC v2.0 模板，对照 leptonica/1.87.0）
# 文件位置: archives/d/devil/1.8.0.40.g6f3d5e9b/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.0.40.g6f3d5e9b"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"

conan_ref: "devil/1.8.0.40.g6f3d5e9b"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（codeload 为 GitHub 官方归档端点，与
  # github.com/archive 对同一 commit 字节一致；设备直连 github.com 不稳）
  url: "https://codeload.github.com/DentonW/DevIL/tar.gz/6f3d5e9bc5d173f56060fc8e14bed35c8edcfdcc"

  # 源码校验和
  sha256: "a5736901df923e1f25459a08b2143e15b8e2559ea6c2ea4774b2165678401779"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# 版本映射: 1.8.0.40.g6f3d5e9b = git describe 1.8.0-40-g6f3d5e9b 的点分形式
# （tag v1.8.0 + 40 commits，固定 commit 6f3d5e9bc5d173f56060fc8e14bed35c8edcfdcc）

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "BUILD_SHARED_LIBS=ON"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "CMAKE_SYSTEM_NAME=Linux"
    - "IL_PNG_LIB=ON"
    - "IL_JPEG_LIB=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.2
    - libpng/1.6.58.2
    - libjpeg/10

  # 测试专用依赖（test_requires，不进消费者闭包）
  test_dependencies:
    - cppunit/1.15.1

  # 编译器
  cc: clang
  cxx: clang++

patches_applied:
  - file: 0001-exclude-src-ILUT.patch
    type: portability
    description: 剔除 src-ILUT（硬依赖 OpenGL/GLUT，OHOS 无桌面 GL）；保留 IL/ILU
  - file: 0002-cpp17-register-ilmanip.patch
    type: portability
    description: 去除 C++17 非法 register 存储类说明符（src-IL/src/il_manip.cpp）
  - file: 0003-fix-unittest-includes.patch
    type: portability
    description: 修复上游 UnitTest 目标 include 接线（CPPUNIT_INCLUDE_DIRS / DevIL_SOURCE_DIR/include），不改测试逻辑

knowledge_gained:
  - "OHOS 动态加载器拒绝未签名共享库/可执行文件（与路径无关：LD_LIBRARY_PATH、RUNPATH、cwd 实测均无效）；所有 .so 与测试可执行文件必须 binary-sign-tool sign -selfSign 1 自签（libpng/1.6.58.2 同约定）"
  - "CMake 不设 CMAKE_SYSTEM_NAME 时回退 generic 平台模块，静默丢失 SOVERSION/SONAME（libIL.so 无 DT_SONAME 无法加载）；OHOS 传 CMAKE_SYSTEM_NAME=Linux 恢复"
  - "上游 cppunit 套件 include 接线损坏（cppunit_INCLUDE_DIRECTORIES / DevIL_SOURCE_DIR/../include 均为无效引用），补丁只修接线不改断言；用例硬编码 Windows 相对路径（.\\Data\\Logo.png），POSIX 下按字面文件名物化即可不改测试代码"
  - "上游 data/DevIL_logo.jpg 在该 commit 是 0 字节文件，喂给 libjpeg 触发 DevIL 错误路径 double-destroy 堆破坏；benchmark 改用上游自有测试图 test/UnitTest/Data/Logo.png"
  - "上游 ENABLE_TESTING() 但全树零 add_test()，ctest -N 恒为 0；format_test 等 9 个测试目录上游已注释"
  - "cmake 4.x 拒绝 cmake_minimum_required(2.6/2.8)，须同时在工具链与启动环境设 CMAKE_POLICY_VERSION_MINIMUM=3.5（leptonica/1.87.0 同法）"

ci_verification:
  # 权威 CI（ci/conan/build_and_test.sh, profile ohos-aarch64, CI_PACKAGES 定向）
  # 已完整跑通：CI_EXIT=0，L0/L1/L1e/L4/L5=pass，L2=skip（纯库无 bin/）。
  # 以下 L0-L5 为预检 + 权威 CI 一致的结果。
  environment: "Python 3.12, Conan 2.29.1 (OHOS 适配版), Clang 15, CMake 4.1.2, HarmonyOS PC (aarch64, OHOS 6.0)"
  L0: "PASS — 标准四件套齐全；test_package/MANIFEST.yml 声明上游测试；依赖均在制品仓"
  L1: "PASS — 上游官方入口 make all UnitTest benchmark 两目标均在 build() 内真实执行：cppunit 套件 OK (9) 退出码 0；benchmark 20 次 ilLoadImage 错误栈为空；test_package PNG/JPEG 往返校验全部 ok（test_devil 签名后执行）"
  L1e: "PASS — 破坏性反向验证通过（ sabotage lib/ 与 include/ 后测试失败），消费者真实依赖 devil"
  L2: "SKIP — 纯库软件无 bin/"
  L4: "PASS — 补丁无危险函数；readelf NX/PIE/RELRO 常规满足"
  L5: "PASS — lib/ 有 libIL.so.1 / libILU.so.1（均已 .codesign 签名）"
  authoritative_ci: "PASS — CI_EXIT=0（Run Summary: 1 success / 0 failed）；日志：设备 <run>/logs/ci/authoritative-ci.log 与 conan_build_devil_1.8.0.40.g6f3d5e9b.log（2026-09-10，候选 d1e20501e87ce6af57892e863303946a2d7d0582，tree a8031fbca219187a00cb5dc050424f3b80647657）"
