# conandata.yml — devil 1.8.0.40.g6f3d5e9b
# Upstream: DentonW/DevIL, commit 6f3d5e9bc5d173f56060fc8e14bed35c8edcfdcc
# (= tag v1.8.0 + 40 commits, 2021-08-29; version string is the dotted form
#  of `git describe` 1.8.0-40-g6f3d5e9b). SHA256 verified on the device via
# the run's safe downloader (codeload.github.com redirect validated).
#
# URL notes: the canonical github.com/archive URL is unreachable from the
# porting device (connect timeout); codeload.github.com is GitHub's official
# archive endpoint and serves the byte-identical tarball for the same commit
# (final_url of the verified download), so it is pinned here directly.

sources:
  url: "https://codeload.github.com/DentonW/DevIL/tar.gz/6f3d5e9bc5d173f56060fc8e14bed35c8edcfdcc"
  # codeload URLs carry no file extension; give the cached download its
  # canonical archive name so Conan detects the tar.gz format.
  filename: "DevIL-6f3d5e9bc5d173f56060fc8e14bed35c8edcfdcc.tar.gz"
  sha256: "a5736901df923e1f25459a08b2143e15b8e2559ea6c2ea4774b2165678401779"

patches:
  - patch_file: "patches/0001-exclude-src-ILUT.patch"
    patch_description: "Exclude src-ILUT: it hard-requires OpenGL/GLUT via find_package(... REQUIRED), which do not exist on OHOS; IL and ILU are kept"
    patch_type: "portability"
  - patch_file: "patches/0002-cpp17-register-ilmanip.patch"
    patch_description: "Drop the removed 'register' storage class specifier in src-IL/src/il_manip.cpp (ill-formed under the C++17 toolchain profile)"
    patch_type: "portability"
  - patch_file: "patches/0003-fix-unittest-includes.patch"
    patch_description: "Fix the upstream UnitTest target cppunit include wiring (cppunit_INCLUDE_DIRECTORIES -> CPPUNIT_INCLUDE_DIRS; the Findcppunit module never defines the former) so the official cppunit test entry builds; no test logic changed"
    patch_type: "portability"
