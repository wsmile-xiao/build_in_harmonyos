# debian-ports-archive
# 文件位置: archives/d/debian-ports-archive/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: debian-ports-archive

display: debian-ports-archive

description: OpenPGP archive certificates of the debian-ports archive

category: crypto

homepage: "https://salsa.debian.org/aurel32/debian-ports-archive-keyring"

license: GPL-2.0-or-later

build_system: custom

ohos_adaptation:
  key_points:
    - "纯数据包（ASCII-armored PGP 归档证书），无编译步骤"
    - "runenv 注入 DEBIAN_PORTS_ARCHIVE_KEYS 指向密钥目录，供 apt/sosumi 导入"
    - "上游用 gnupg 装配 keyring 作为 conffile；OHOS 改为直接分发源码密钥文件"
  common_dependencies:
    - gpgv

versions:
  "2026.02.04":
    status: built
    build_date: "2026-09-10"
    notes: "首次适配，armored PGP 结构校验通过（2 有效 + 19 历史密钥）"