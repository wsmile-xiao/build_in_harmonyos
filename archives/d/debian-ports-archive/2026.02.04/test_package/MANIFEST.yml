# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: debian-ports-archive/2026.02.04
homepage: https://salsa.debian.org/aurel32/debian-ports-archive-keyring

# 上游测试命令
# 上游无独立测试套件，构建期用 gnupg 验证 key 数据 (debian/rules)。OHOS
# 不重建 keyring（依赖 gnupg 导入），故以 Python 结构校验替代。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_verify.py
    description: "校验 active/removed 密钥均为合法 armored PGP 公钥块且清单完整"
    command: "python3 test_verify.py $PACKAGE_ROOT"
# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 109