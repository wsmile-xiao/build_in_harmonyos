sources:
  "1.9.12":
    url: "https://github.com/drogonframework/drogon/archive/v1.9.12.tar.gz"
    sha256: "becc3c4f3b90f069f814baef164a7e3a2b31476dc6fe249b02ff07a13d032f48"

patches:
  "1.9.12":
    - patch_file: "patches/0001-util-linux-uuid-include-path.patch"
      patch_description: "Use util-linux uuid header layout (<uuid/uuid.h>) instead of ossp-style flat <uuid.h>; the conan uuid package (util-linux 2.40.1) installs headers under include/uuid/"
      patch_type: "portability"
    - patch_file: "patches/0002-fix-FileTypeTest-include-path.patch"
      patch_description: "Fix upstream relative include bug in FileTypeTest.cc: ../lib/src/HttpUtils.h -> ../../lib/src/HttpUtils.h (all sibling tests use the two-level path; the one-level path resolves to a nonexistent lib/tests/lib/src/)"
      patch_type: "bugfix"
