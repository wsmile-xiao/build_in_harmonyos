software: drogon
version: "1.9.12"
status: built
build_date: "2026-09-19"

source:
  url: "https://github.com/drogonframework/drogon/archive/v1.9.12.tar.gz"
  sha256: "becc3c4f3b90f069f814baef164a7e3a2b31476dc6fe249b02ff07a13d032f48"
  tar_format: tar.gz

build:
  system: cmake
  dependencies:
    - "trantor/1.5.26 (OHOS, in-registry)"
    - "jsoncpp/1.9.8 (OHOS)"
    - "openssl (transitive via trantor)"
    - "zlib (OHOS)"
    - "uuid/2.40.1 (util-linux libuuid)"
  cc: clang
  cxx: clang++
  cxx_standard: 17

patches_applied:
  - "0001-util-linux-uuid-include-path.patch"
  - "0002-fix-FileTypeTest-include-path.patch"

options_note: >
  Non-essential dependencies trimmed per task guidance:
  BUILD_CTL=OFF, BUILD_POSTGRESQL/MYSQL/SQLITE/REDIS=OFF,
  BUILD_BROTLI=OFF, BUILD_YAML_CONFIG=OFF, BUILD_EXAMPLES=OFF,
  BUILD_DOC=OFF. USE_SUBMODULE=OFF (conan trantor 1.5.26).
  Upstream DROGON_TEST suite built with BUILD_TESTING=ON and
  executed in build() via ctest (39/39 passed).

test_summary:
  upstream_tests_registered: 39
  upstream_tests_passed: 39
  upstream_tests_failed: 0
  test_package_tests: 1
  test_package_passed: 1
  framework: "DROGON_TEST (upstream built-in framework, registered via ParseAndAddDrogonTests)"

knowledge_gained:
  - "drogon 1.9.12 is compatible with the in-registry trantor 1.5.26: grep over the whole 1.9.12 tree returns 0 hits for the trantor 1.5.27+ APIs (forwardToTLSBuffer, getCloseCallback) and 0 for the removed verifySslName; CCI range is >=1.5.25 <2"
  - "ctest 注册数口径：lib/tests 共 47 个 DROGON_TEST 宏（unittests/ 45 + CookieSameSite/RealIpResolverTest 2），其中 CoroutineTest 7 个需 C++20 coroutine、BrotliTest 1 个需 Brotli_FOUND，本构建（cppstd=17 + BUILD_BROTLI=OFF）注册 39 = unittest 37 + cookie_same_site 1 + real_ip_resolver 1"
  - "orm_lib/tests 的 5 个 DB 测试可执行目标上游从不注册 add_test（grep -rn 'add_test(' --include=CMakeLists.txt 除 ParseAndAddDrogonTests 外 0 命中）；DB 客户端按裁剪关闭，lib/tests/integration_test 在 1.9.12 无 CMakeLists 不参与构建"
  - "util-linux uuid header layout: conan uuid package installs uuid.h under include/uuid/, drogon uses ossp-style flat <uuid.h>; CMakeDeps maps UUID/UUID_lib and patch 0001 fixes the include"
  - "Upstream FileTypeTest.cc has a relative-include bug at C++17 non-MSVC: ../lib/src/HttpUtils.h should be ../../lib/src/HttpUtils.h (patch 0002; the offending line is identical in 1.9.12)"
  - "CookieSameSite ctest needs server.crt/server.key in the ctest working dir (build/lib/tests); upstream test.sh copies them from the trantor submodule — ship trantor test certificates via exports_sources"
  - "OHOS mksh (/system/bin/sh) cannot load dynamically linked test binaries; run ctest through CONFIG_SHELL bash (aa3d precedent). The /data/service/hnp/bin/bash default only exists on the CI worker layout — a harmonybrew-style device needs CONFIG_SHELL exported to ~/.harmonybrew/bin/bash"
  - "binary-sign-tool is an ELF under <sdk>/toolchains/lib (no JVM needed) while the compiler sits in <sdk>/native/llvm/bin: the tool lookup must also walk up from realpath(cpp), because /data/service/hnp/bin does not exist on such a device"
  - "An incompatible libc++_shared.so in LD_LIBRARY_PATH (e.g. OpenDesk app bundle lib dir) breaks symbol resolution; prepend the toolchain libc++ dir resolved from os.path.realpath(compiler) — symlink hnp/bin/clang++ -> ohos-sdk/llvm/bin/clang++"
