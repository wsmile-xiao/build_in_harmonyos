software: drogon
version: "1.9.13"
status: built
build_date: "2026-09-12"

source:
  url: "https://github.com/drogonframework/drogon/archive/v1.9.13.tar.gz"
  sha256: "c3bd0e276b82576151dc7376c8d4027dd1fcec282d784849e11f84a7e977b2f5"
  tar_format: tar.gz

build:
  system: cmake
  dependencies:
    - "trantor/1.5.26 (OHOS, in-registry)"
    - "jsoncpp/1.9.8 (OHOS)"
    - "openssl (transitive via trantor)"
    - "zlib (OHOS)"
    - "uuid/2.40.1 (util-linux libuuid)"
  cc: clang
  cxx: clang++
  cxx_standard: 17

patches_applied:
  - "0001-util-linux-uuid-include-path.patch"
  - "0002-fix-FileTypeTest-include-path.patch"

options_note: >
  Non-essential dependencies trimmed per task guidance:
  BUILD_CTL=OFF, BUILD_POSTGRESQL/MYSQL/SQLITE/REDIS=OFF,
  BUILD_BROTLI=OFF, BUILD_YAML_CONFIG=OFF, BUILD_EXAMPLES=OFF,
  BUILD_DOC=OFF. USE_SUBMODULE=OFF (conan trantor 1.5.26).
  Upstream DROGON_TEST suite built with BUILD_TESTING=ON and
  executed in build() via ctest (48/48 passed).

test_summary:
  upstream_tests_registered: 48
  upstream_tests_passed: 48
  upstream_tests_failed: 0
  test_package_tests: 1
  test_package_passed: 1
  framework: "DROGON_TEST (upstream built-in framework, registered via ParseAndAddDrogonTests)"

knowledge_gained:
  - "drogon 1.9.13 is compatible with trantor 1.5.26 (does not use trantor 1.5.27+/1.5.28 APIs like forwardToTLSBuffer/getCloseCallback); submodule pin is v1.5.28 but CCI range is >=1.5.25 <2"
  - "util-linux uuid header layout: conan uuid package installs uuid.h under include/uuid/, drogon uses ossp-style flat <uuid.h>; CMakeDeps maps UUID/UUID_lib and patch 0001 fixes the include"
  - "Upstream FileTypeTest.cc has a relative-include bug at C++17 non-MSVC: ../lib/src/HttpUtils.h should be ../../lib/src/HttpUtils.h (patch 0002)"
  - "CookieSameSite ctest needs server.crt/server.key in the ctest working dir (build/lib/tests); upstream test.sh copies them from the trantor submodule — ship trantor test certificates via exports_sources"
  - "OHOS mksh (/system/bin/sh) cannot load dynamically linked test binaries; run ctest through CONFIG_SHELL bash (aa3d precedent)"
  - "An incompatible libc++_shared.so in LD_LIBRARY_PATH (e.g. OpenDesk app bundle lib dir) breaks symbol resolution; prepend the toolchain libc++ dir resolved from os.path.realpath(compiler) — symlink hnp/bin/clang++ -> ohos-sdk/llvm/bin/clang++"
