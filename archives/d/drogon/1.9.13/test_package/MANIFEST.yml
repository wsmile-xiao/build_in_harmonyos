# test_package/MANIFEST.yml
package: drogon/1.9.13
homepage: https://github.com/drogonframework/drogon

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "cd build/Release && ctest --output-on-failure"

upstream_tests:
  - file: lib/tests/unittests/*.cc
    description: "Upstream DROGON_TEST unit suite (48 ctest cases registered by ParseAndAddDrogonTests at C++17 without coroutine/brotli: Base64/UrlCodec/Gzip/Cookie/MD5/Sha1/CacheMap/HttpHeader/HttpMethod/Utilities/Uuid/...); all pass"
    command: "./unittest"
  - file: lib/tests/CookieSameSite.cc
    description: "Upstream Cookie SameSite attribute test (HTTPS listener with trantor test certificates)"
    command: "./cookie_same_site"
  - file: lib/tests/RealIpResolverTest.cc
    description: "Upstream real-IP resolver test"
    command: "./real_ip_resolver"
  - file: orm_lib/tests/db_test.cc
    description: "Upstream ORM db tests — not registered as ctest targets upstream; require live PostgreSQL/MySQL/SQLite servers. DB clients disabled in this build (trimmed deps), test bodies compile to no-ops behind USE_* guards (main returns 0)"
    command: "./db_test"
  - file: lib/tests/integration_test/
    description: "Upstream integration tests — require BUILD_CTL=ON (drogon_ctl code generator, trimmed); matches ConanCenter default (BUILD_CTL=False)"
    command: "./integration_test_server"

test_package_tests:
  - file: test.cpp
    description: "drogon core subsystems link+run test (HttpAppFramework/EventLoop, HttpResponse, async routing registration, utils Base64, HttpClient factory)"
    command: "./test_drogon"

assertion_count: 10
