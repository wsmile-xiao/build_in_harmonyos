# test_package/MANIFEST.yml — upstream and consumer test declaration

package: dcadec/0.2.0
homepage: "https://github.com/foo86/dcadec"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: test/test.sh
    source: dcadec-0.2.0/test/test.sh
    description: "Decode 19 DTS-HD streams in four output modes; verify 118 SHA-1 checks and 69 PCM standard-deviation checks"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Consumer-side C99 link and 12 public-API assertions, including an official-sample DTS header with an independently decoded frame size"
    command: "ctest --output-on-failure"
  - file: conanfile.py
    description: "Execute the packaged dcadec command-line program and verify its help path"
    command: "dcadec --help"

upstream_assertion_count: 187
consumer_assertion_count: 12
assertion_count: 199
