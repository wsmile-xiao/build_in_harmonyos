software: dares
version: "0.6.5"
status: built
compile_date: "2026-09-11"
build_system: make (hand-written recursive Makefile, no configure)

source:
  url: "https://deb.debian.org/debian/pool/main/d/dares/dares_0.6.5+repack.orig.tar.gz"
  sha256: "6be06bd9c331166a50b516d0cca09a7c97cbfedac78f3e779cfe4d2e92e342e2"
  tar_format: tar.gz

build:
  system: make
  make_target: frontend/ncurses only (top-level `all: qt ncurses` skipped —
    the Qt3 frontend is abandoned upstream and qt3 does not exist on OHOS)
  make_overrides:
    cc: clang
    cppflags: "-I<ncurses>/include -I<file>/include"
    cflags: "-O2 -Wall"
    ldflags: "-L<ncurses>/lib -L<file>/lib -lncursesw -lmagic"
  install_target: none (upstream has no install; recipe copies bin/dares +
    share/dares/magic.mgc from the file dependency)
  dependencies:
    - ncurses/6.6 (conan, static wide-char, provides -lncursesw)
    - file/5.48.1 (conan, static libmagic, provides -lmagic)
  cc: clang

patches_applied:
  - "0001-ncurses-Makefile.patch"

knowledge_gained:
  - "First in-repo -lmagic consumer: libmagic comes from file/5.48.1
     (static-only per R26); static archives must be linked AFTER the object
     files, so the Makefile link rule was reordered (was `$(LDFLAGS) -o
     dares $(OBJ)`)."
  - "dares loads magic/magic.mime from the CWD (MAGIC_FILE \"magic\") and
     only falls back to libmagic's compiled-in default path (broken:
     \"//share/misc/magic\"). Explicit-path loading of a compiled magic.mgc
     is ALSO broken in the redistributed libmagic; the MAGIC env var
     fallback is the only verifiably working path (device experiment
     matrix). Decision: ship libmagic 5.48.1's compiled magic.mgc in
     share/dares and set runenv MAGIC=<pkg>/share/dares/magic.mgc;
     do not package upstream's file-3.x-era magic files (fail to load)."
  - "Autosave (-a) is the only fully non-interactive execution mode when
     files are found: it carves and exits(1) before the ncurses file-list
     UI. Any scan that finds files without -a enters initscr() (TUI), which
     cannot run in CI."
  - "dares exits 0 on almost every path (daresClose() returns 0 even after
     invalid params); output-based assertions are mandatory, exit codes are
     only meaningful for the autosave path (exit 1 by design)."

patch_generation:
  method: diff -u against pristine 0.6.5+repack extraction
  generated_at: '2026-09-11'
  patches_count: 1

patch_classification:
  - file: 0001-ncurses-Makefile.patch
    type: build-system
    platform_only: true
    guard: 'overridable CC/CPPFLAGS/CFLAGS/LDFLAGS + static link order'
