# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: dares/0.6.5
homepage: "http://www.heise.de/ct/projekte/dares"

# Upstream test command (make -n check / ctest -N / meson test --list analysis)
# dares 0.6.5 ships NO test suite: the hand-written Makefiles have no
# check/test targets and the tarball contains no test sources (verified
# against the full 17-file tarball listing, 7 of which are the abandoned
# qt3 frontend; see notes.md). This package is
# therefore recorded as NO_UPSTREAM_TESTS and validated by the self-built
# test_package smoke tests below.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs: none exist upstream
upstream_tests: []

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Non-interactive smoke: usage banner, invalid-arg diagnostics, empty-image scan (exit 0), real carve run with -a (magic db loaded from CWD, file saved), -m -a magic.mime variant"
    command: "dares; dares --version; dares -i image.img -s out ...; dares -m -a -i image.img -s out ..."
  - file: test.sh
    description: "Shell smoke: usage banner via grep"
    command: "sh test.sh"

# Test assertion count (approximate, for quality assessment)
assertion_count: 13
