software: diamond
version: "2.1.24"
status: built
build_date: "2026-05-25"
build_system: cmake

source:
  url: "https://github.com/bbuchfink/diamond/archive/refs/tags/v2.1.24.tar.gz"
  sha256: "4879c27a8fc96d84793c3239a314cc3ff78f3b26ee6a3f228cddab6338bc0990"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DAARCH64=ON"
    - "-DX86=OFF"
  dependencies:
    - sqlite3/3.49.1
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  regression_tests: "22/22 passed (20 blastp + 2 stress tests via diamond test)"
  manual_tests: "13/13 passed (makedb, blastp 4 formats, blastx, dbinfo, getseq, sensitive mode, PAF, multithreading)"
  overall_verdict: "ALL PASS"

knowledge_gained:
  - "CMake项目在aarch64/HarmonyOS上需要 -DAARCH64=ON -DX86=OFF，否则会尝试编译x86 SSE/AVX目标导致失败"
  - "diamond需要sqlite3和zlib作为运行时依赖"
  - "CMAKE_SYSTEM_NAME=Linux会触发CROSS_COMPILE模式，绕过自动平台检测；native编译不应设置此标志"
  - "diamond内置test子命令提供完整回归测试套（20+2个测试），可作为标准功能验证手段"