# test_package/MANIFEST.yml — debian-science 1.15
# 上游测试声明（诚实申报：Debian Pure Blend 元包无测试套件）
package: debian-science/1.15
homepage: "https://salsa.debian.org/blends-team/science"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

upstream_test_evidence:
  find_tests: "find . -iname '*test*' -> 0 results (no tests/ directory)"
  ctest_registration: "find . -name 'CTestTestfile.cmake' -> 0"
  pytest_registration: "find . -name 'test_*.py' -o -name 'conftest.py' -> 0"
  source_files: "find . -name '*.c' -o -name '*.cpp' -o -name '*.h' -> 0 (metadata-only source)"
  files_total: 97

# Harmony 特有 package/data 验证（非 upstream test）
test_package_tests:
  - file: test_debian_science.py
    description: >
      验证：packaged layout（tasks/ 46 个任务文件 + tasksel desc + registry.json +
      官方依赖快照 + licenses/copyright）；tasks/ Deb822 字段（Task/Description 非空、
      Install 为 true|false，且 18 true / 28 false）；tasksel desc 结构（42 段落、
      父任务 debian-science、41 个 science-* Key 且全部映射到已打包任务文件）；
      registry.json 与打包文件重新派生的逐任务 title/depends/suggests/recommends
      交叉复核；旧格式 blends 语义（文件级 Depends -> 元包 Recommends）逐任务记录；
      debian/control 45 个声明包全为 Architecture: all 且 science-* 前缀；
      官方快照 debian-science_1.15.json 主题集合 == tasks/ 文件集合、
      依赖引用名符合 Debian 命名规范；semantics 记录 conan_requires == none
    command: "python3 test_debian_science.py <package_folder>"

assertion_count: 33
