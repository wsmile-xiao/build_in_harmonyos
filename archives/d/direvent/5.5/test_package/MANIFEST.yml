# test_package/MANIFEST.yml — direvent 5.5
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: direvent/5.5
homepage: "https://www.gnu.org/software/direvent/"

# 上游测试命令（autotest 套件，tests/*.at 共 31 个测试）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试
# 31 个测试在设备上全部执行，但均失败于同一系统性根因（详见 notes.md）：
# 测试框架的 --self-test 机制依赖 SIGHUP 握手收尾（envdump 经 -k 参数向
# 自测脚本投递 SIGHUP），OHOS 上该信号语义差异导致 direvent 以 129 退出
# 而非预期的 0；核心文件监控功能本身工作正常（调试日志证明事件捕获、
# handler 执行、dump 写盘全部成功）。
upstream_tests:
  - file: tests/create.at
    source: direvent-5.5/tests/create.at
    description: "上游 autotest 套件 31 项测试之一（Create/Write/Delete/Attrib/env/re 等目录事件场景），全部执行、失败于同一 SIGHUP 握手根因"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package/test.sh
    description: "运行安装后的 direvent 守护进程：--version 冒烟、-t 配置检查、真实 inotify 监视目录 + create 事件触发 handler 的功能断言（1 个消费者程序，3 处断言）"
    command: "conan test test_package direvent/5.5"

# Approximate assertion count
assertion_count: 3
