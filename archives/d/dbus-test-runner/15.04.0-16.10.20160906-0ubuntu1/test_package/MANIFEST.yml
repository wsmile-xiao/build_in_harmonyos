package: dbus-test-runner/15.04.0-16.10.20160906-0ubuntu1
homepage: "https://github.com/unity8-team/dbus-test-runner"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

test_package_tests:
  - file: test_consumer.c
    description: "编译并运行 C 消费者，创建/销毁公开 DbusTestTask API 对象"
    command: "conan create 内自动执行（CMake build + test()）"
  - file: "bin/dbus-test-runner"
    description: "在 OHOS 上执行 dbus-test-runner --help 并检查 CLI 可启动"
    command: "conan create 内自动执行（test()）"
