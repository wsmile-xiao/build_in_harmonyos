# 版本级 manifest — dact 0.8.42

version: "0.8.42"
software: "dact"

status: built
build_date: "2026-09-10"
build_system: custom

source:
  url: "https://deb.debian.org/debian/pool/main/d/dact/dact_0.8.42.orig.tar.gz"
  sha256: "08c91d36b2de30c4f2e9e13a7b044c137c096db2ba8d868d1962e209dd6b2ed8"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
  - "-DHAVE_CONFIG_H -I. （必须：dact.h 用 HAVE_CONFIG_H 门控 config.h 的包含）"
  - "clang -O2 -Wall -DHAVE_CONFIG_H -I. -I<zlib inc> -c <核心 16 个 .o + ALGO 10 个 .o>"
  - "clang ... <全部 .o> -L<zlib lib> -lz -o dact"
  - "生成 dact.conf（上游由 Makefile 生成，运行时读取）"
  dependencies:
  - zlib/1.3.1
  cc: clang
  cxx: N/A

patches_applied: []

knowledge_gained:
- "autoconf 项目里 <code>config.h</code> 的包含常被 <code>HAVE_CONFIG_H</code> 门控（dact.h 的写法是 `#ifdef HAVE_CONFIG_H / #include \"config.h\" / #endif`）。绕过 configure 直编时若忘了 -DHAVE_CONFIG_H，生成的 config.h **根本不会被包含**，全部能力宏形同虚设 —— 症状与"config.h 写错"难以区分。"
- "algorithms.h 是**位置敏感**的函数指针表：每个条目按 #ifdef HAVE_LIBZ / HAVE_LIBBZ2 / DEBUG 切换为真实实现或 DACT_FAILED_ALGO。因此"定义了哪个能力宏"必须与"链接了哪些 .c"严格自洽，否则要么表里引用未定义符号、要么把可用算法错误注册成失败占位（编译能过但功能静默缺失）。"
- "上游 configure.in 用 AC_REPLACE_FUNCS(getopt strsep getpass mkstemp uname)：libc 缺哪个就编自带的哪个。OHOS musl 的 <unistd.h> **不声明 getpass**（glibc 会声明），故必须使用上游自带 getpass.c 并保持 HAVE_GETPASS 未定义（dact.h 据此 include 自带 getpass.h）。"
- "上游用自定义 m4 宏 DC_CHK_MODULE(lib, srcs, define)（内部为 AC_CHECK_LIB(lib, main) 的"能链接即算有"写法）探测可选库，命中后把 srcs 追加进 ALGO、把 -llib 追加进 MODLIBS。直编时需按同样规则显式给出 ALGO 与链接库。"
- "未启用 lzo 系列时无需编译 comp_lzoox/lzooy/lzota.c：其头文件在 !defined(HAVE_LIBLZO) 等条件下把 comp_lzoX_algo 宏定义为 DACT_FAILED_ALGO，成为编译期别名而非符号。"
- "产物 dact 为 ELF64/AArch64，NEEDED 仅 libc.so —— zlib 以静态库链入，系统库隔离（G3）反而更好。"
