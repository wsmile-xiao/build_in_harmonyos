# test_package/MANIFEST.yml — dact 0.8.42
package: dact/0.8.42
homepage: "https://www.rkeene.org/oss/dact/"

# 上游无自动化测试套件（仅 Docs/ 下的手册与 tools/ 辅助脚本，Makefile 无 check/test 目标）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试
test_package_tests:
  - file: test_dact.c
    description: "消费者测试 6 条：dact 存在/可执行/ELF64-AArch64；-h 与 -V 真实执行且排除 126-127-128+；-h 输出含 usage 字面；etc/dact.conf 已安装"
    command: "test_dact <package_folder>"

# 测试断言总数：上游 0 + test_package 6
assertion_count: 6