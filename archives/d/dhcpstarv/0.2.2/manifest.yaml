# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS musl netinet/udp.h 中 struct udphdr 采用 BSD 风格成员名 uh_sport/uh_dport/uh_ulen/uh_sum，与 glibc 的 source/dest/len/check 不同，直接访问 udph->dest 报 no member named 'dest'（新增 E215-draft-4AA8 草稿）"
- "HMDFS 上 config.status 的 mktemp -d ./confXXXXXX（umask 077）报 Permission denied，需改用源码内 .tmp 目录并去掉 umask 077（对齐 apcupsd 既有修复）"
- "dhcpstarv 是命令行工具（非库），package_type=application，上游无测试框架，test_package 自备 smoke test（--help 退出码 0）"
- "CI worker 无 automake/aclocal 且上游 tarball 不含预生成 configure：本地 autoreconf 生成 configure 等文件，以 patch 0000 随 recipe 提交（方案 C）"

