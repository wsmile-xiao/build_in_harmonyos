# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dune/3.17.0
homepage: https://github.com/ocaml/dune

# 上游测试命令
upstream_check_command: "dune runtest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "dune runtest"

# 上游单元测试声明（test/unit-tests/ 目录，共 4 个）
# 运行环境：OHOS arm64 + conan ocaml/4.14.1.1.2 + dune 3.17.0
# 源码复制到 /data/storage/el2/base/cache/ 规避 /storage/Users 权限限制
upstream_tests:
  - name: "sexp_tests"
    source: dune-3.17.0/test/unit-tests/sexp_tests.ml
    description: "Dune_lang.Atom 一致性校验（遍历长度<=3 所有字节串）"
    command: "dune build test/unit-tests/sexp_tests.exe && ./sexp_tests.exe"
    result: "pass"

  - name: "gh637"
    source: dune-3.17.0/test/unit-tests/ocaml-config/gh637.ml
    description: "Ocaml_config 解析一致性校验（Vars.of_lines + make + to_list/by_name）"
    command: "dune build test/unit-tests/ocaml-config/gh637.exe && dune runtest test/unit-tests/ocaml-config"
    result: "pass"

  - name: "fswatch_win"
    source: dune-3.17.0/test/unit-tests/fswatch_win/fswatch_win_tests.ml
    description: "Windows 文件监控测试"
    command: "dune runtest test/unit-tests/fswatch_win"
    result: "skip"
    skip_reason: "enabled_if: (= %{os_type} Win32)，非 Windows 平台不执行"

  - name: "artifact_substitution"
    source: dune-3.17.0/test/unit-tests/artifact_substitution/artifact_substitution.ml
    description: "Artifact_substitution encode/decode round-trip 测试"
    command: "dune build test/unit-tests/artifact_substitution/artifact_substitution.exe"
    result: "fail"
    fail_reason: "build_info 规则（build_info__Build_info_data.ml-gen）需扫描源码上级目录，OHDFS 权限拒绝（Permission denied），无法构建"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "dune --version 版本验证"
    command: "dune --version"
  - file: conanfile.py
    description: "dune build 简单可执行文件编译"
    command: "dune build"
  - file: conanfile.py
    description: "dune exec 运行编译产物"
    command: "dune exec"
  - file: conanfile.py
    description: "dune build 多模块编译链接（含 library 依赖）"
    command: "dune build"
  - file: conanfile.py
    description: "dune clean + rebuild 增量构建"
    command: "dune clean && dune build"

# 测试断言总数
# 上游 unit-tests: sexp_tests 约 16M 组合验证(2 断言) + gh637 1 断言 + fswatch_win 14 断言(跳过) + artifact_substitution 10 断言(无法构建)
# test_package: 5 项功能测试
# 可统计的有效断言: 2(sexp_tests) + 1(gh637) + 5(test_package) = 8
assertion_count: 8
