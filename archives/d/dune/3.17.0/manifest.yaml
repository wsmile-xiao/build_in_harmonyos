version: "3.17.0"
status: published
build_date: "2026-07-02"

source:
  url: "https://github.com/ocaml/dune/archive/refs/tags/3.17.0.tar.gz"
  sha256: "a67dbfdd7d1a39ed08cadb04d928f645682d6a558b80cffb116663eb73f16e6e"
  tar_format: tar.gz

build:
  system: dune-bootstrap
  configure_options: []
  dependencies:
    - "ocaml/4.14.1 (system)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-boot-duneboot.ml.patch: Prefer bytecode over .opt native binaries (OHOS security)"
  - "0002-dune-project.patch: Add (version 3.17.0) to dune-project"
  - "0004-src-dune_rules-which.ml.patch: Don't prefer .opt variants in compiler detection"
  - "0005-vendor-spawn-src-spawn_stubs.c.patch: Guard pthread_setcancelstate for OHOS"

knowledge_gained:
  - "Dune uses custom bootstrap (ocaml boot/bootstrap.ml) not standard configure"
  - "OHOS blocks native ELF binaries; bytecode bootstrap preferred"
  - "pthread_setcancelstate not implemented on OHOS, needs guard"
