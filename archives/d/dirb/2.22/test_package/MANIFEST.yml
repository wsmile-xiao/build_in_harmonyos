# test_package/MANIFEST.yml — dirb 2.22
# 上游官方测试声明文件（详见同目录 notes.md 的 NO_UPSTREAM_TESTS 证据）

package: dirb/2.22
homepage: "https://sourceforge.net/projects/dirb/"

# 上游测试命令：上游无任何自动化测试套件
# （4 个 Makefile.am 均无 check/TESTS 目标；docs/ 无测试文档；
#   configure.ac 无测试框架探测；tarball 无 test/ 目录）
upstream_check_command: "none (upstream has no test suite)"

# conanfile.py build() 方法中未集成上游测试（上游不存在可运行的官方测试）
upstream_test_in_build: false
upstream_test_command: "none (upstream has no test suite)"

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "无参 usage 冒烟（断言 banner 且按上游约定非零退出）+ 本地 loopback HTTP 服务（python3 http.server）真实字典扫描，断言发现预置目录 admin/、backup/"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
