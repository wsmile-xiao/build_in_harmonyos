version: "2.22"
status: built
build_date: "2026-09-11"
conan_ref: "dirb/2.22"

source:
  url: "https://downloads.sourceforge.net/project/dirb/dirb/2.22/dirb222.tar.gz"
  sha256: "f3748ade231ca211a01acbec31cc6a3b576f6c56c906d73329d7dbb79f60fc2c"
  tar_format: tar.gz

build:
  system: autotools
  configure_options: []
  dependencies:
    - "curl/8.15.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fno-common-globals.patch"
  - "0002-default-wordlist-path.patch"

knowledge_gained:
  - "tarball 自带 configure（autoconf 2.69）/Makefile.in（automake 1.9.6），无需 autoreconf 与 config.guess/sub（configure.ac 无 AC_CANONICAL_HOST）"
  - "clang -fno-common：variables.h 直接定义全局变量、8 个 TU 经 dirb.h 包含 → 链接 multiple definition；改 extern + 新增 src/variables.c 单点定义（需同步注册 Makefile.am 与 Makefile.in，构建实际读 Makefile.in）"
  - "configure.ac 在 PATH 上直接调用 curl-config：generate() 用 Environment 把依赖 curl 包的 bin 目录前置到 conanbuild PATH，AutotoolsDeps 提供 -I/-L"
  - "默认词表硬编码 /usr/share/dirb/... 在 OHOS 不存在：运行期按 /proc/self/exe 解析 <exe_dir>/../share/dirb/wordlists/common.txt；package() 把上游不安装的 wordlists/ 装入 <prefix>/share/dirb/wordlists（common.txt 4614 行，共 1.6MB）"
  - "configure 执行位经 conan 解包丢失（can't execute: Permission denied，Error 126）→ build() 里 os.chmod(0o755)；真机实测 os.chmod 与 /usr/bin/chmod 均可置位（同款手法见 archives/a/abiword-plugin-pdf/3.0.8/conanfile.py）"
  - "man 页安装：automake 1.9 的 INSTALL_DATA 为 ${INSTALL} -m 644 → 配方 install shim 覆盖 INSTALL/INSTALL_DATA，不依赖平台 install 模式位语义（真机探针 /system/bin/install -c -m 644 rc=0，产物权限受 fs umask 影响）"
  - "configure HMDFS 适配：./confXXXXXX + umask 077 → ${TMPDIR:-/tmp}（同 E114，见 archives/a/aaphoto/0.45/notes.md）；ac_pwd=`pwd` 判定 getcwd 失败回退 $PWD 并预置 PWD 环境变量"
  - "上游无测试套件：4 个 Makefile.am 均无 check/TESTS 目标，docs/ 无测试文档，configure.ac 无测试框架探测，tarball 无 test/ 目录 → NO_UPSTREAM_TESTS；功能验证由 test_package 真实扫描 loopback HTTP 服务承担"
