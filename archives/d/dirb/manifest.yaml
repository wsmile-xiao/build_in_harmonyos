software: dirb
display: "DIRB"
description: "Web 内容字典爆破扫描工具（基于词表暴力发现 Web 目录与文件）"
category: network
homepage: "https://sourceforge.net/projects/dirb/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "唯一外部依赖 libcurl：configure.ac 经 curl-config + AC_CHECK_LIB 探测，配方用 conan curl/8.15.0 并把依赖 bin 目录前置到 conanbuild PATH"
    - "tarball 自带预生成 configure（autoconf 2.69）/Makefile.in（automake 1.9.6），无需 autoreconf；configure.ac 无 AC_CANONICAL_HOST，无 config.guess/sub 需求"
    - "clang 默认 -fno-common 与上游头文件全局变量定义冲突（multiple definition）：variables.h 改 extern + 新增 src/variables.c 单点定义"
    - "默认词表路径 /usr/share/dirb/... 在 OHOS 不存在：运行期按 /proc/self/exe 解析 <exe_dir>/../share/dirb/wordlists，词表装入包内 share/dirb/wordlists"
    - "man 页安装：配方内 install shim 覆盖 INSTALL/INSTALL_DATA，不依赖平台 install(1) 的模式位语义"
    - "上游无任何自动化测试套件（4 个 Makefile.am 均无 check/TESTS，docs/ 无测试文档）"
  common_dependencies:
    - curl

versions:
  "2.22":
    status: built
    build_date: "2026-09-11"
    conan_ref: "dirb/2.22"
