version: "1.0.2"
status: built
build_date: "2026-05-30"

source:
  url: "https://github.com/maoschanz/drawing/archive/refs/tags/1.0.2.tar.gz"
  sha256: "539e7e28fe4db96cfedd4477e217d5d48b9422ad8c98f33d8ae46120b2d5738b"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Denable-translations-and-appdata=false"
    - "-Duse-uuid-as-binary-name=false"
  dependencies:
    - gtk+3
    - meson
    - glib
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-skip-help-subdir.patch"
  - "0002-skip-update-desktop-database.patch"

knowledge_gained:
  - "meson 项目的 help subdir 需要禁用，因为 itstool 依赖 libxml2 Python 模块在 OHOS 上不可用"
  - "postinstall 脚本中 update-desktop-database 在 OHOS 上不存在，需要跳过"