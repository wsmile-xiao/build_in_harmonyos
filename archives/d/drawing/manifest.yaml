software: drawing
display: "drawing"
description: "Simple image editor similar to Microsoft Paint, for the GNOME desktop"
category: gfx
homepage: "https://maoschanz.github.io/drawing/"
license: GPL-3.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "help subdir needs to be disabled (itstool requires libxml2 Python module unavailable on OHOS)"
    - "update-desktop-database is not available on OHOS, postinstall script must skip it"
  common_dependencies:
    - gtk+3
    - meson

versions:
  "1.0.2":
    status: built
    build_date: "2026-05-30"