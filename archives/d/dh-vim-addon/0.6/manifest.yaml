# ============================================================
# 语言预检（R47，协议 v0.8 附录 D）
# ============================================================

language:
  detected_language: perl
  task_language: perl
  matched: true
  evidence:
    build_system: "none（无 configure/CMakeLists/Makefile 构建入口）"
