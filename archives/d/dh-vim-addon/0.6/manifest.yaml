  count: 0
  evidence: "tar tzf dh-vim-addon-debian-0.6.tar.gz 全部条目：dh_vim_addon / vim_addon.pm / COPYING / .gitignore / debian/{changelog,clean,control,copyright,gbp.conf,install,manpages,rules,salsa-ci.yml,source/format}；grep -iE '(^|/)(t|test|tests|check)/' 无命中；debian/rules 仅 `dh $@` + pod2man"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - category: L2
    content: "纯 Perl debhelper 插件打包型适配——零编译：download + tar -xzf --no-same-owner + cp -a 收拢，package() 挑文件安装（bin/ + lib/perl5/Debian/Debhelper/Sequence/ + share/man/man1/），build() 为 pass。与 dh-linktree 0.9 同族"
    reason: "dh_vim-addon 是 debhelper 的 dh_* 插件（pure Perl），无 C 代码、无 configure、无编译步骤"
  - category: L2
    content: "dh_vim-addon 的 man 页不在 tarball 内（上游 debian/rules 由 `pod2man --utf8 dh_vim-addon > dh-vim-addon.1` 生成）——package() 需尽力生成：优先 pod2man，回退 `perl -MPod::Man`；两者不可用则跳过（非运行必需，不阻塞打包）"
    reason: "与 dh-linktree（tarball 自带 dh_linktree.1）不同，本包需在配方内生成 man 页"
  - category: L2
    content: "功能冒烟可真实运行：最小 debian 骨架（debian/control 用 debhelper-compat(=13) 且不得再有 debian/compat，否则 compat 重复报错）+ 两个无 doc/ 的 addon 目录，`dh_vim-addon -pmoke` 退出码 0 并在 usr/share/vim/vimfiles/pack/dist-bundle/{start,opt}/ 下创建符号链接树"
    reason: "实测：addon 目录须放在 debian/<pkg>/（tmpdir），放 debian/tmp 会报 'No directories found matching'"
  - category: L2
    content: "addon 含 doc/ 目录时 dh_vim-addon 尾部调用 helpztags（vim-common 提供），OHOS 沙箱无该命令→ exit 25；冒烟须避开 doc/ 目录或如实记录受限"
    reason: "实测 dh_vim-addon 对含 doc/ 的 addon 会 doit('helpztags', ...)，沙箱缺少该二进制"
  - category: L2
    content: "test_package 的 PERL5LIB 只加包根与常见 perl 库根，不 walk 全树——dpkg 包 Dselect/Method/Config.pm 会遮蔽 perl 核心 Config 模块导致 Errno.pm 编译失败"
    reason: "沿用 dh-linktree 0.9 实测结论（本包依赖树同样含 dpkg）"

# ============================================================
# 参考
# ============================================================

references:
  - "https://salsa.debian.org/vim-team/dh-vim-addon"
  - "archives/d/dh-linktree/0.9（同族先例：纯 Perl debhelper 插件）"
