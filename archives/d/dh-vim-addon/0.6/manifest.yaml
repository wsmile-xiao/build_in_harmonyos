  dependencies_unavailable:
    - name: vim-common
      reason: "提供 helpztags（生成 doc/ 帮助标签）+ vim 运行时目录；ohpcd 制品仓未发布，未声明 requires"
      evidence: "conan download vim-common/9.1.0 -r=ohpcd --only-recipe -> ERROR（未找到）"

  cc: clang
  cxx: clang++

# ============================================================
# 依赖可用性预检（W0 / R36 / PF4）
# ============================================================

