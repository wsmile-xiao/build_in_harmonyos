# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dh-vim-addon/0.6
homepage: "https://salsa.debian.org/vim-team/dh-vim-addon"

# 上游测试命令
# 上游无测试套件（R51 清点证据：tar tzf 列出 tarball 全部条目 ——
# dh_vim-addon / vim_addon.pm / COPYING / .gitignore / debian/{changelog,
# clean,control,copyright,gbp.conf,install,manpages,rules,salsa-ci.yml,
# source/format}，无 t/、tests/、check/ 目录；debian/control 无
# Testsuite / autopkgtest，debian/rules 仅 `dh $@` + pod2man，
# 无 make check / prove 目标）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - name: 无
    count: "0"
    description: "上游确无测试套件（tar tzf 核验 tarball 条目无 t/tests/check；debian/rules 仅 dh + pod2man）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_dh_vim_addon.py
    description: "R1 文件存在断言（bin/dh_vim-addon + Sequence/vim_addon.pm，2 断言）+ R2 perl -c 语法检查（两文件，2 断言）+ R3 功能冒烟（最小 debian 骨架真实运行 dh_vim-addon -psmoke：退出码 0 + start/opt 符号链接树创建，3 断言）+ R4 鸿蒙特有测试（7 断言）"
    command: "python3 test_dh_vim_addon.py <package> <dep_packages...>"

# 鸿蒙特有测试（针对 OpenHarmony 平台特性的断言；上游为 Debian 侧工具，
# 解释器、权限与制品路径语义在 OHOS 上均不同）
harmonyos_tests:
  - name: H1
    description: "消费链运行在 OpenHarmony aarch64 目标机（os.uname(): sysname=HarmonyOS, machine=aarch64），非交叉构建主机"
  - name: H2
    description: "平台 perl 由 OHOS 自带 hnp 运行时提供（/data/service/hnp/bin/perl），OHOS 无系统 perl 发行包"
  - name: H3
    description: "解释器按目标架构构建（perl -V:archname = aarch64-linux）"
  - name: H4
    description: "OHOS 权限语义下安装产物保留属主可执行位（实测 mode 0o770，非 Debian 常见 0755）"
  - name: "H5 (×2)"
    description: "packpath 符号链接为相对目标 → 制品在 /storage/Users 长路径下可重定位"
  - name: H6
    description: "上游固定 shebang #!/usr/bin/perl 未经改写；OHOS 无 /usr/bin/perl，调用必须经平台解释器（本测试即该路径）"

assertion_count: 14
