software: dh-vim-addon
display: "dh-vim-addon"
description: "debhelper addon to help package Vim/Neovim addons (pure Perl, no compile)"
category: dev-tool
homepage: "https://salsa.debian.org/vim-team/dh-vim-addon"
license: GPL-3.0-or-later
build_system: "none (pure Perl script packaging)"
compile_date: "2026-09-13"

ohos_adaptation:
  key_points:
    - "pure Perl debhelper addon — zero compile (download + tar -xzf --no-same-owner + cp -a 收拢)"
    - "package() 挑文件安装: bin/dh_vim-addon + lib/perl5/Debian/Debhelper/Sequence/vim_addon.pm + share/man/man1/（pod2man 生成）"
    - "runtime deps: debhelper (Debian::Debhelper::Dh_Lib) + dpkg (Dpkg::Control::Info / Dpkg::Version)"
    - "language preflight: R47 语言 = perl（debhelper addon 家族，非 C/C++），--lang perl 显式声明"
  common_dependencies:
    - debhelper
    - dpkg

versions:
  "0.6":
    status: built
    build_date: "2026-09-13"
