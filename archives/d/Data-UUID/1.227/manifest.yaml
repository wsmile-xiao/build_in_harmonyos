software: Data-UUID
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.227/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.227"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# 编译完成日期（YYYY-MM-DD HH:MM:SS）
compile_date: "2026-06-10 11:31:05"

# 构建系统
build_system: "perl-xs"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/G/GT/GTERMARS/Data-UUID-1.227.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - musl/1.2.5 (提供 libc.so 用于链接)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块链接需要 -nostartfiles -nodefaultlibs 参数避免 CRT 文件缺失问题"
  - "musl libc.so 可以用于链接 Perl XS 模块（使用绝对路径）"
  - "SELinux HMDFS 限制需要通过管理员安装到 /data/service/hnp 目录解决"
  - "Data::UUID 功能完整：UUID v1/v3 生成、字符串转换、比较等功能均实现"