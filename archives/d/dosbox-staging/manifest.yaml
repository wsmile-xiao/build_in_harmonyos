software: dosbox-staging
display: "DOSBox Staging"
description: "Modern DOS emulator with high-quality audio and rendering"
category: application
homepage: "https://www.dosbox-staging.org/"
license: GPL-2.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Preserve SDL2_net, libslirp, FluidSynth, and mt32emu feature providers"
    - "Disable desktop OpenGL until an OHOS gl provider satisfies the upstream contract"
    - "Bind release-tar version metadata to the official v0.82.2 tag commit"
    - "Require exact one-to-one terminal evidence for all 24 upstream Meson tests"
  common_dependencies:
    - iir1
    - opusfile
    - sdl2
    - zlib
    - libpng
    - speexdsp
    - sdl2_net
    - libslirp
    - fluidsynth
    - mt32emu

versions:
  "0.82.2-r1":
    status: pending
    build_date: "2026-07-23"
    conan_ref: "dosbox-staging/0.82.2-r1"
