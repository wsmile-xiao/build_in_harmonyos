test_framework:
  source_url: "https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz"
  source_filename: "gtest-1.14.0.tar.gz"
  source_sha256: "8ad598c73ad796e0d8280b082cebd82a630d73e73cd3c70057938a6501bba5d7"
  patch_url: "https://wrapdb.mesonbuild.com/v2/gtest_1.14.0-1/get_patch"
  patch_filename: "gtest_1.14.0-1_patch.zip"
  patch_sha256: "2e693c7d3f9370a7aa6dac802bada0874d3198ad4cfdf75647b818f691182b50"

patches:
  "0.82.2-r1":
    - patch_file: "patches/0001-scripts-get-version.sh.patch"
      patch_description: "Allow official release archives to use an externally bound tag hash"
      patch_type: "portability"
    - patch_file: "patches/0002-meson.build.patch"
      patch_description: "Invoke the version script through a POSIX shell"
      patch_type: "portability"
    - patch_file: "patches/0015-capability-audio-forward-decl.patch"
      patch_description: "Exercise native video, negotiated audio, dynamic core, and audio-only production boundaries with a parser-safe unified diff and an explicit helper declaration"
      patch_type: "portability"
    - patch_file: "patches/0016-dynrec-invalid-return-fallback.patch"
      patch_description: "Keep the ARMV8 dynamic recompiler capability probe alive when an invalid block return is reported, while retaining the production abort outside the probe"
      patch_type: "portability"
    - patch_file: "patches/0017-dynrec-ohos-wx-mmap.patch"
      patch_description: "Use an OHOS-compatible writable dynamic-code mapping and transition it to executable through the existing W^X path"
      patch_type: "portability"
    - patch_file: "patches/0018-dynrec-ohos-rwx-probe.patch"
      patch_description: "Keep the capability probe's dynamic-code cache RWX while preserving W^X protection for normal production execution"
      patch_type: "portability"
    - patch_file: "patches/0019-dynrec-stage-trace.patch"
      patch_description: "Emit capability-probe-only dynamic-cache and ARMv8 execution stage markers for target failure localization"
      patch_type: "portability"
    - patch_file: "patches/0020-sdl2-net-header-layout.patch"
      patch_description: "Accept SDL2_net packages that install SDL_net.h below the SDL2 include directory"
      patch_type: "portability"
    - patch_file: "patches/0021-fs-utils-case-canonicalization.patch"
      patch_description: "Resolve case-insensitive POSIX path spellings through canonical directory entries"
      patch_type: "portability"
