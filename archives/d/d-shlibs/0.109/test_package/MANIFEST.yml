# test_package/MANIFEST.yml — d-shlibs 0.109
# CI L0e requires this file (upstream test declaration).
#
# Upstream test inventory (R51) — taken from the extracted tarball, not guessed:
#
#   Makefile (the ONLY test entry point of the project):
#     check:        bash -n d-shlibmove
#                   bash -n d-devlibdeps
#                   shellcheck d-shlibmove
#                   shellcheck d-devlibdeps
#     test-build:   mkdir TESTS; for PKG in dancer-xml dlisp libdshconfig
#                   libgtkdatabox; do apt-get source $PKG; cd */;
#                   /usr/bin/debuild -us -uc; debc; done
#     all:          (empty — nothing to compile)
#   debian/rules:   `%: dh $@`  (debhelper; no override targets)
#   debian/tests/control (autopkgtest, NOT part of `make check'):
#     - active  : uppercase.d
#                   cd debian/tests/uppercase.d &&
#                   gcc -shared -Wl,--soname="libUppercase.so.1" \
#                       -o $AUTOPKGTEST_TMP/libUppercase.so.1.0.0 &&
#                   ln -s libUppercase.so.1.0.0 $AUTOPKGTEST_TMP/libUppercase.so &&
#                   d-shlibmove $AUTOPKGTEST_TMP/libUppercase.so
#                   # expects exit code 2 (dry-run)
#     - commented-out: ncurses.d (kept as a TODO in the upstream file)
#   No ctest / pytest / meson test / tests/ directory anywhere in the tarball.

package: d-shlibs/0.109
homepage: "https://salsa.debian.org/debian/d-shlibs"

# Upstream test commands (as declared by the upstream Makefile)
upstream_check_command: "make check"
upstream_test_command: "make check"
# build() is a deliberate no-op: `make check' cannot pass on OHOS because
# shellcheck is not published on ohpcd (see notes.md). The runnable half of
# `make check' (`bash -n' x2) is executed by the test_package instead, together
# with the upstream autopkgtest scenario.
upstream_test_in_build: false

upstream_tests:
  - file: Makefile
    source: d-shlibs-debian-0.109/Makefile
    description: "`make check' step 1+2 — bash -n syntax gate on d-shlibmove and d-devlibdeps (RUN: both pass on OHOS)"
    command: "bash -n d-shlibmove && bash -n d-devlibdeps"
  - file: Makefile
    source: d-shlibs-debian-0.109/Makefile
    description: "`make check' step 3+4 — shellcheck lint of both scripts (NOT RUN: shellcheck is not published on the ohpcd remote and is absent from the OHOS image)"
    command: "shellcheck d-shlibmove && shellcheck d-devlibdeps"
  - file: Makefile
    source: d-shlibs-debian-0.109/Makefile
    description: "`make test-build' — apt-get source + debuild of dancer-xml/dlisp/libdshconfig/libgtkdatabox (NOT RUN: needs a full Debian build environment, apt-get source and debuild)"
    command: "make test-build"
  - file: debian/tests/control
    source: d-shlibs-debian-0.109/debian/tests/control
    description: "upstream autopkgtest uppercase.d — build libUppercase.so chain, run d-shlibmove, expect exit 2. REPRODUCED by test_dshlibs.py group D on OHOS"
    command: "d-shlibmove $AUTOPKGTEST_TMP/libUppercase.so"

test_package_tests:
  - file: test_dshlibs.py
    description: ("Group A installed artifacts (7 asserts) + Group B `bash -n' on "
                  "both scripts = upstream make check step 1 (2 asserts) + Group C "
                  "documented argument handling of both tools (4 asserts) + Group D "
                  "d-shlibmove end-to-end on a compiled libUppercase.so chain with "
                  "its move-plan and internal d-devlibdeps substvars (10 asserts) + "
                  "Group E d-devlibdeps standalone (1 assert)")
    command: "python3 test_dshlibs.py <package> <dpkg_package> <binutils_package>"
  - file: fixtures/libUppercase.c
    description: ("C fixture mirroring upstream debian/tests/uppercase.d/libUppercase.c "
                  "— compiled by the consumer test into libUppercase.so.1.0.0")
    command: "cc -shared -Wl,--soname=libUppercase.so.1 -o libUppercase.so.1.0.0 libUppercase.c"
  - file: fixtures/debian_control
    description: ("debian/control fixture mirroring upstream debian/tests/uppercase.d/"
                  "debian/control — provides the libuppercase1 / libuppercase1-dev "
                  "package sections that d-shlibmove's control check validates")
    command: "cat fixtures/debian_control > debian/control"

# Approximate number of assertions executed by test_dshlibs.py (26 with the
# full OHOS toolchain present, 13 when only the package artifacts and the bash
# interpreter are available — the toolchain-dependent groups then report
# LIMITED with their exact technical reason)
assertion_count: 26
