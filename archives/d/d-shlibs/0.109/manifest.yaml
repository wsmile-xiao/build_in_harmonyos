# version manifest — d-shlibs 0.109
# 遵循 ARCHIVE-SPEC v3.0

version: "0.109"
software: d-shlibs

# published | built | failed | archived
status: published

build_date: "2026-09-14"
build_system: none (pure bash script packaging; install-only Makefile)

# ============================================================
# 源码信息
# ============================================================

source:
  # Debian-native package: canonical upstream is the salsa.debian.org Git repo
  # declared in debian/control as Vcs-Git; 0.109 is the tag `debian/0.109`.
  # The debian.org pool tarball is intentionally NOT used (PF7/R39 classifies
  # debian.org pool files as a downstream re-package source).
  url: "https://salsa.debian.org/debian/d-shlibs/-/archive/debian/0.109/d-shlibs-debian-0.109.tar.gz"
  sha256: "568a98fccc4f54cb2afe105cd220591b008cf50e2fe5abf13a8656f8d78d07ed"
  tar_format: tar.gz
  archive_root: "d-shlibs-debian-0.109"

# ============================================================
# 构建配置
# ============================================================

build:
  system: none (pure bash script packaging)

  # 上游 Makefile 的 `all:` 为空规则；`install:` 只做 install -m 755 到
  # $(DESTDIR)/usr/bin/。没有任何 configure 步骤，故无配置选项。
  configure_options: []

  # 运行时依赖（格式: name/version）
  #   dpkg     -> dpkg-architecture（两个脚本都执行 eval "$(dpkg-architecture -s)"）
  #   binutils -> $DEB_HOST_GNU_TYPE-objdump（-p 读取 SONAME / DT_NEEDED）
  #   debhelper-> Debian 源码包 Build-Depends 声明 debhelper-compat (= 13)
  dependencies:
    - debhelper/13.3.4
    - dpkg/1.23.7
    - binutils/2.46.0

  cc: clang
  cxx: clang++

# ============================================================
# 未发布依赖（如实记录，禁止写入 requires —— PF4 依赖闸 / R41）
# ============================================================

dependencies_unavailable:
  - package: apt
    debian_role: "d-shlibs 的 Debian Depends 字段（debian/control: Depends: apt, binutils）"
    used_by: "d-devlibdeps -> validate_package() 调用 apt-cache show / apt-cache showpkg"
    evidence: |
      $ conan download apt/2.10.1 -r=ohpcd --only-recipe
      Connecting to remote 'ohpcd' anonymously
      ERROR: error:system acceleration policy not enabled. [Remote: ohpcd]
      $ conan list "apt/*" -r=ohpcd
      Found 0 pkg/version recipes matching apt/* in ohpcd
      （对照：同一个报错在探测不存在的包 definitely-not-a-pkg-xyz/9.9.9 时同样出现，
        而 conan download debhelper/13.3.4 -r=ohpcd --only-recipe 正常返回 revision）
    impact: >-
      d-devlibdeps 的依赖校验分支在 OHOS 上无法完成（apt-cache 不存在），只会走到
      “no package matching … please report bug” 的失败分支。该工具在 OHOS 上的可用
      形态是：对 DT_NEEDED 能被 overridedevlibdeps 规则消解或命中同源 debian/control
      的库，正常产出 devlibs:Depends；对需要 apt 数据库查询的情况如实报错。
  - package: shellcheck
    debian_role: "debian/control Build-Depends: shellcheck <!nocheck>"
    used_by: "上游 `make check` 的第 3、4 条命令（shellcheck d-shlibmove / d-devlibdeps）"
    evidence: |
      $ conan download shellcheck/0.10.0 -r=ohpcd --only-recipe
      Connecting to remote 'ohpcd' anonymously
      ERROR: error:system acceleration policy not enabled. [Remote: ohpcd]
      $ conan list "shellcheck/*" -r=ohpcd
      Found 0 pkg/version recipes matching shellcheck/* in ohpcd
      $ command -v shellcheck   # OHOS PC 镜像
      (not found)
    impact: >-
      上游 `make check` 只能执行其中的 bash -n 两条；shellcheck 两条在该平台不可执行。
      build() 因此不调用 `make check`（否则必然红），改由 test_package 执行可运行部分并
      在 reports/test-report.md 如实申报，见 R51 三步法。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - category: L2
    content: "纯 bash 脚本打包型适配——零编译，download + tar -xzf --no-same-owner + cp -a 收拢（salsa git-archive 根目录 d-shlibs-debian-0.109/），package() 挑文件安装（bin/ + share/man/man1/ + licenses/），build() 为 pass"
    reason: "d-shlibs 是 Debian native 包（debian/source/format = 3.0 (native)），上游 Makefile 的 all: 为空规则"
  - category: L1
    content: "OHOS PC 无 /bin/bash（/bin -> /system/bin，只有 /bin/sh）——任何 #!/bin/bash 的上游脚本直接执行都会 bad interpreter；测试/构建必须显式用解析出的绝对 bash 启动脚本，并为脚本内部的跨脚本调用（d-shlibmove -> d-devlibdeps）在 PATH 上放一个 exec 绝对 bash 的 wrapper"
    reason: "d-shlibmove 与 d-devlibdeps 的 shebang 都是 #!/bin/bash；实测直接执行报 '/bin/bash: bad interpreter: No such file or directory'（rc=126）"
  - category: L1
    content: "dpkg 包的 dpkg-architecture 需要三件事同时成立：PERL5LIB 指向包根（Dpkg.pm）、DPKG_DATADIR 指向 <pkg>/share/dpkg（cputable/ostable/tupletable）、PATH 里有同包的 dpkg（--print-architecture）；它的 shebang 指向构建期解释器，跨机必须用绝对 perl 显式调用"
    reason: "实测缺 DPKG_DATADIR 报 'cannot open cputable'，缺 dpkg 报 'dpkg --print-architecture failed'"
  - category: L2
    content: "d-shlibmove / d-devlibdeps 调用 $DEB_HOST_GNU_TYPE-objdump（前缀来自 dpkg-architecture，aarch64-linux-gnu），而 ohpcd 的 binutils/2.46.0 只安装无前缀的 objdump——测试需要按运行时查询到的 triplet 建立 <triplet>-objdump 软链，不能硬编码"
    reason: "实测 DEB_HOST_GNU_TYPE=aarch64-linux-gnu，binutils 包 bindirs=['bin'] 只有 objdump"
  - category: L2
    content: "R47 语言预检对“纯 bash 脚本 + install-only Makefile”会误判为 c：_manifest_scan 见到顶层 Makefile 即返回 c/cpp 族，_source_stats 又把 debian/tests 里唯一的 autopkgtest 夹具 (libUppercase.c) 计为主体（bash 一律被排除在主体统计外，且无扩展名的脚本根本不计），detected=c 与 task=bash 不匹配 → 自动写 env_unsupported。按 D.4 边界规则（辅助夹具不算主体）人工复核为 bash，保留工具输出为证据后继续适配"
    reason: "实测 lang-preflight d-shlibs 0.109 --lang bash 输出 detected_language=c（build_system=make，source_stats=c:1 100%）"

