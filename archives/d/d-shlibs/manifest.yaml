software: d-shlibs
display: "d-shlibs"
description: "Debian shared library package building helper scripts (d-shlibmove + d-devlibdeps, pure bash)"
category: dev-tool
homepage: "https://salsa.debian.org/debian/d-shlibs"
license: GPL-2.0-or-later
build_system: "none (pure bash script packaging)"
compile_date: "2026-09-14"

ohos_adaptation:
  key_points:
    - "pure bash scripts + install-only Makefile — zero compile (download + tar -xzf + cp -a 收拢)"
    - "package() 挑文件安装: bin/d-shlibmove + bin/d-devlibdeps + share/man/man1/ + licenses/COPYING"
    - "runtime deps: dpkg (dpkg-architecture) + binutils (objdump) + perl; debhelper declared per Debian Build-Depends"
    - "OHOS 无 /bin/bash（只有 /bin/sh）——脚本 shebang 是 #!/bin/bash，调用须显式指定绝对解释器"
  common_dependencies:
    - debhelper
    - dpkg
    - binutils

dependencies_unavailable:
  - apt
  - shellcheck

versions:
  "0.109":
    status: published
    build_date: "2026-09-14"
