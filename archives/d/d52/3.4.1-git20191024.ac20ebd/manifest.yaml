knowledge_gained:
  - "raw makefile 项目（无 configure）配方三要素：self.run(make) 必须 cwd=self.source_folder、编译器从 tools.build:compiler_executables 字典整体取（check_type=dict 后索引 c）"  # knowledge_ref: E392
  - "上游 Makefile 把对象写进硬编码的 ./obj 却没有创建该目录的规则：配方侧 os.makedirs(source_folder/obj) 即可，无需补丁（与 Debian 打包 override_dh_auto_build 的 mkdir -p obj 同型）"  # knowledge_ref: E392
  - "上游无测试套件但自带参考输出时，在 test_package 里回放上游 golden（只忽略版本/日期头 N 行）作为可复核替代验证；上游用例数仍记 0、新增用例单独计数、不把 0/0 写成 100%"  # reference: DRAFT-cute_files-1.0.0-upstream-zero-test-ohos-validation（上游零测试入口的可审计证据 + 替代验证口径；本条为其 golden 数据变体，未另开草稿）
