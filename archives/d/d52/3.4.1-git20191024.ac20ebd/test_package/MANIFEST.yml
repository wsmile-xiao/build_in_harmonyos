# test_package/MANIFEST.yml — d52 3.4.1-git20191024.ac20ebd
# CI L0e requires this file to exist.

package: d52/3.4.1-git20191024.ac20ebd
homepage: "https://github.com/jblang/d52"

# ── Upstream official tests: NONE at this commit ──
# Evidence (all re-checked on device against the recipe's own source tarball):
#   1. the only build file is `Makefile`; its explicit targets are
#      all / install / d52 / d48 / dz80 / clean / win / wind52 / wind48 / windz80 /
#      winclean plus the Windows triples d52.exe / d48.exe / dz80.exe
#      (14 targets in total) — there is no `check`, `test` or `testall` target;
#   2. the source tree has no tests/ directory and no test runner script
#      (`find <src> -maxdepth 2 -name 'test*'` returns nothing);
#   3. the Debian packaging for this exact version declares an empty
#      Testsuit field (no autopkgtest), i.e. upstream ships no test suite.
# Therefore the upstream test count is 0 (not skipped, not partially run) and
# all executed tests are the adaptation-side tests listed below.
upstream_check_command: "none — upstream Makefile has no check/test target"
upstream_test_in_build: false
upstream_test_command: "none"

upstream_tests:
  command: "none"
  upstream_test_in_build: false
  test_source: "none"
  total: 0
  passed: 0
  failed: 0
  skipped: 0
  not_run: 0
  notes: "Upstream ships no automated test suite at commit ac20ebd (no test target in Makefile, no tests/ tree, empty Debian Testsuit field). Counted as 0 upstream cases, with the evidence commands recorded in ../notes.md. This is not a skip and not a partial run."

# ── Golden replay data (upstream's own reference outputs) ──
# Upstream ships benchmark input + expected disassembly output in cyclefiles/;
# the test replays them against the installed binaries and compares byte for
# byte after the 4-line version/date header. Fixture provenance and the two
# storage-only adaptations (lower-cased file names, and the Z80 binary input
# stored as printable octal escapes so that a PR diff stays text-only):
# data/PROVENANCE.md
golden_replay:
  data_source: "upstream cyclefiles/ directory of the recipe's source tarball"
  header_lines_ignored: 4
  cases:
    - "d52 -zADuC84x.cyc bench0  vs cyclefiles/bench0.aduc84x.d52"
    - "d52 -zAT89LP.cyc bench0    vs cyclefiles/bench0.at89lp.d52"
    - "d52 -zDS80C320.cyc bench0  vs cyclefiles/bench0.ds80c320.d52"
    - "d52 -zDS89C4x0.cyc bench0  vs cyclefiles/bench0.ds89c4x0.d52"
    - "d52 -zMSC12xx.cyc bench0   vs cyclefiles/bench0.msc12xx.d52"
    - "d52 -zSiLabs.cyc bench0    vs cyclefiles/bench0.silabs.d52"
    - "d52 -zW77e.cyc bench0      vs cyclefiles/bench0.w77e.d52"
    - "dz80 -d z                  vs cyclefiles/z.z80"
  total: 8
  passed: 8

test_package_tests:
  - file: test.sh
    description: >-
      Runs the installed d52/d48/dz80 binaries and asserts real behavior:
      self-identification of all three tools, 8 upstream golden replays
      (7 d52 cycle-file cases + 1 dz80 binary/-d case, byte-identical after the
      version/date header), missing-input error handling, d48 disassembly,
      d52 -u upper-case mode and d52 -t trace/analyze mode (control-file
      generation).
    command: "/bin/sh test.sh <data-dir> <work-dir> (invoked by test_package/conanfile.py with env conanrun)"

assertion_count: 15
