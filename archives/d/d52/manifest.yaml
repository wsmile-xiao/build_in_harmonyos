# 软件级 manifest — d52
# 遵循 ARCHIVE-SPEC v3.0

software: d52

display: "D52"

description: "8052/8048/Z80 系列单片机代码反汇编器套件（d52、d48、dz80）"

category: utility

homepage: "https://github.com/jblang/d52"

license: GPL-3.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 makefile 项目（无 configure）：make 需显式传入 CC（上游默认 CC=gcc，OHOS 主机无 gcc）"
    - "上游 Makefile 把对象写进硬编码的 ./obj 但没有创建该目录的规则，配方侧需先 mkdir（无需补丁）"
    - "上游 install 目标硬编码 /usr/local/bin，配方改为直接 copy 到包内 bin/"
    - "三个工具都不支持 --version/--help 长选项（无参数运行打印版本横幅），CI L2 冒烟探测为非阻塞告警"
    - "上游无测试套件；上游在 cyclefiles/ 自带基准与参考输出，test_package 按 golden 回放做逐字节回归"
  common_dependencies: []

versions:
  "3.4.1-git20191024.ac20ebd":
    status: built
    build_date: "2026-09-10"
    conan_ref: "d52/3.4.1-git20191024.ac20ebd"
