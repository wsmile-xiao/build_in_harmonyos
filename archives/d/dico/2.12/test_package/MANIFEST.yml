# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dico/2.12
homepage: "https://www.gnu.org/software/dico/"

# 上游测试清点（双口径，同源于真机构建日志 reports/ 与 upstream-check.log）：
# ① 源文件级（审查脚本口径）：6 个子目录 141 个 .at 套件源文件
#    (dicod/tests 23, grecs/tests 53, lib/tests 28, modules/* 37)。
# ② 运行注册级（configure 后各 autotest testsuite 实际注册用例）：
#    wordsplit 190 + lib 38 + grecs 42 + dicod 23 + modules 66 = 359 项。
# 本适配在配方 build() 中真实执行 `make -k check`：357 通过 + 2 test_skipped
# （epp.at#28 / ppexit.at#29，bash getcwd() HMDFS 假阴性，E386 同族，
# 见 notes.md 与 upstream-check.log），0 未预期失败。
upstream_check_command: "make -k check（配方 build() 内真实执行）"
upstream_test_in_build: true
upstream_test_command: "make -k check MAKEINFO=true SHELL=/bin/sh CPPFLAGS=-I<src>/libltdl（conanfile.py build() 实现）"

upstream_tests:
  - file: wordsplit/tests/testsuite
    source: dico-2.12/src/tests/testsuite
    description: "wordsplit 词分割套件（190 用例）"
    command: "make -k check（配方 build() 内真实执行，190/190 通过）"
  - file: lib/tests/testsuite
    source: dico-2.12/lib/tests/testsuite
    description: "lib 基础库套件（38 用例）"
    command: "make -k check（配方 build() 内真实执行，38/38 通过）"
  - file: grecs/tests/testsuite
    source: dico-2.12/grecs/tests/testsuite
    description: "grecs 解析器套件（42 用例）"
    command: "make -k check（40 通过 + 2 test_skipped：epp.at#28/ppexit.at#29 E386 假阴性）"
  - file: dicod/tests/testsuite
    source: dico-2.12/dicod/tests/testsuite
    description: "dicod 服务器套件（23 用例）"
    command: "make -k check（配方 build() 内真实执行，23/23 通过）"
  - file: modules/tests/testsuite
    source: dico-2.12/modules/*/tests/testsuite
    description: "模块套件（word 3 + outline 15 + dict.org 16 + greek_kbd 3 + stratall 1 + gcide 16 + metaphone2 6 + substr 1 + nprefix 5 = 66 用例）"
    command: "make -k check（配方 build() 内真实执行，66/66 通过）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_dico.py
    description: "消费者测试: 运行打包后的 dico 客户端与 dicod 服务器, 断言两者 --version 横幅 (GNU dico 2.12) 与 dicod --config-help 配置向导输出"
    command: "python3 test_dico.py <bindir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
