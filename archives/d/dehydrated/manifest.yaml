software: dehydrated
display: "dehydrated"
description: "ACME v2 客户端（Let's Encrypt 等），单个纯 Bash 脚本实现证书签发/续期"
category: network
homepage: "https://dehydrated.io"
license: MIT
build_system: none

ohos_adaptation:
  key_points:
    - "纯 Bash 4+ 脚本应用，无编译产物（脚本打包路径）；运行时依赖 bash/curl/openssl/sed/awk/grep/diff/mktemp/hexdump，OHOS PC 运行时均已具备"
    - "脚本以 OSTYPE=$(uname) 判定 OS，HarmonyOS != Linux 走 sed -E 分支（toybox/gnu sed 均支持 ERE，已实测）"
    - "OHOS 下 hnp bash 在部分执行上下文 getcwd() 失败导致内置 PWD 未定义（脚本 set -u 下 ${PWD} 引用报错），自检/测试显式传 PWD=<目录> 规避"
  common_dependencies: []

versions:
  "0.7.2":
    status: built
    build_date: "2026-09-09"
    notes: |
      - dehydrated 0.7.2（dehydrated-io/dehydrated，纯 Bash ACME v2 客户端）
      - bash -n 语法自检 + --version 冒烟（真实触发脚本内置依赖检查）通过；test_package 消费者自检 OK
