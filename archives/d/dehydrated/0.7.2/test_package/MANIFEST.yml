package: dehydrated/0.7.2
homepage: "https://dehydrated.io"

# 上游测试命令（dehydrated 为纯 Bash 脚本应用，上游无 make check/CTest/CI 测试套件；
# 可验证自检 = bash -n 语法检查 + --version 冒烟，后者内部真实执行脚本依赖检查）
upstream_check_command: "bash -n dehydrated && bash dehydrated --version"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "bash -n dehydrated && bash dehydrated --version"

# 上游实际运行的测试程序（上游无任何测试套件，如实声明，见 notes.md discovery）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，R34 实质自检）
test_package_tests:
  - file: test_dehydrated.py
    description: "校验 bin/dehydrated 存在+可执行+shebang，bash -n 语法自检，--version 冒烟并核对版本输出（真实触发脚本内置依赖检查）"
    command: "python3 test_dehydrated.py <pkg_root>"
assertion_count: 6
