knowledge_gained:
  - "docopt 是**单模块**包（py_modules=['docopt']，顶层 docopt.py 而非包目录）——package() 直接把 docopt.py 拷进 site-packages，不能按包目录 copytree。"
  - "docopt 的 PyPI sdist **不含上游测试**（MANIFEST.in 只 include README/LICENSE + recursive-include examples），测试（test_docopt.py、testcases.docopt、conftest.py）只在 GitHub 仓库根目录——R51 要回填真实通过率就必须构建期从官方 tag 下载（同 antlr4-python3-runtime/adcli 先例），并把「上游确无测试」与「sdist 未打包测试」区分开：本库属后者，测试确实存在。"
  - "py3.12 下 docopt 0.6.2 只有 SyntaxWarning（docopt.py 中 re.findall('(<\\S*?>)') 等非 raw 字符串的字面反斜杠），功能不受影响——无需源码补丁。"
  - "两组上游测试口径不同：tests/test_docopt.py 是常规 pytest 文件（39 passed）；tests/cases/testcases.docopt 靠 conftest.py 的**旧式 pytest_collect_file / pytest.Item 钩子**收集（pytest 5.4.3 下 164 passed），pytest 9.x 已移除该旧 API——把该 conftest 隔离在独立 tests/cases/ 子目录，避免它影响常规测试文件的收集。"

verification:
