# conandata.yml — docopt 0.6.2
# 源码来自 PyPI 官方文件托管（files.pythonhosted.org，R39 合规）
#
# 注意：docopt 的 sdist **不含上游测试**（仓库根目录的 test_docopt.py 与
# testcases.docopt 没打进 PyPI 包）。这两个文件只存在于 GitHub 官方仓库，
# 故 source() 额外把它们下载到 tests/ 以便回填真实通过率（R51）。
# 仅构建期使用，不进 package() 产物。

sources:
  url: "https://files.pythonhosted.org/packages/a2/55/8f8cab2afd404cf578136ef2cc5dfb50baa1761b68c9da1fb1e4eed343c9/docopt-0.6.2.tar.gz"
  sha256: "49b3a825280bd66b3aa83585ef59c4a8c82f2c8a522dbe754a8bc8d08c85c491"

# 上游测试文件（GitHub 官方 tag 0.6.2），仅构建期使用，已校验 sha256
# .docopt 用例文件与其 conftest.py 收集器放在 tests/cases/（独立子目录）：
# 该 conftest 用的是 pytest 旧式 pytest_collect_file 钩子，放在 tests/ 下会
# 影响 test_docopt.py 的收集；隔离后 test_docopt.py 可独立稳定运行。
test_sources:
  - url: "https://raw.githubusercontent.com/docopt/docopt/0.6.2/test_docopt.py"
    sha256: "7670233e466bd1cf54fc598dcccec5320861d9a0357d4f5234d80a20da522c10"
    dest: "tests/test_docopt.py"
  - url: "https://raw.githubusercontent.com/docopt/docopt/0.6.2/testcases.docopt"
    sha256: "ff1c967b929bd397aaa107129f1e66ae313acece3d32a4309e9c1c73f5c8ec37"
    dest: "tests/cases/testcases.docopt"
  - url: "https://raw.githubusercontent.com/docopt/docopt/0.6.2/conftest.py"
    sha256: "0ddd77ede7a6e354feb7af8c01083b25708c5486391732029abc0b525a5eb7f0"
    dest: "tests/cases/conftest.py"

patches: {}
