# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: docopt/0.6.2
homepage: "https://github.com/docopt/docopt"

# 上游测试命令
# 注意：docopt 的 PyPI sdist **不含测试**，上游测试仅存在于 GitHub 仓库根目录，
# 故 conanfile.py 的 source() 从官方 tag 0.6.2 下载（sha256 校验）到 tests/。
upstream_check_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=<src> python3 -m pytest tests/test_docopt.py -q --assert=plain"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=<src> python3 -m pytest tests/test_docopt.py -q --assert=plain -p no:cacheprovider"

# 上游实际运行的测试程序（2026-09-16 实测记录）：
# - Upstream 仓库有两组测试（sdist 均不含）：
#   (1) tests/test_docopt.py — 单元/API 测试（pytest 风格）
#   (2) tests/cases/testcases.docopt + conftest.py — 用例语料驱动，
#       conftest 用旧式 pytest_collect_file/pytest.Item 钩子
# - 实测结果：
#   (1) **39 passed**（无失败）
#   (2) **164 passed**（pytest 5.4.3 下，conftest 旧钩子仍可用；pytest 9.x
#       已移除该旧 API，故配方中对用例组做了存在性判断的 best-effort 执行）
#   合计 203 passed
upstream_tests:
  - file: tests/test_docopt.py
    source: "GitHub docopt/docopt @ tag 0.6.2（sdist 不含）"
    description: "上游 pytest 单元/API 测试；实测 39 passed"
    command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=<src> python3 -m pytest tests/test_docopt.py -q --assert=plain -p no:cacheprovider"
  - file: tests/cases/testcases.docopt
    source: "GitHub docopt/docopt @ tag 0.6.2（sdist 不含）"
    description: "上游用例语料（自定义 conftest 收集器）；pytest 5.4.3 下实测 164 passed"
    command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=<src> python3 -m pytest tests/cases/testcases.docopt -q --assert=plain -p no:cacheprovider"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_docopt_consumer.py
    description: "消费者测试：真实 API（R34）——子命令/可重复参数/选项默认值/互斥组/DocoptExit + Option.parse/parse_argv 等上游测试面"
    command: "python3 test_docopt_consumer.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 18
