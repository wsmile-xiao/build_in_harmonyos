version: "1.6.7"
status: published
build_date: "2026-04-24"

source:
  url: "http://vu1tur.eu.org/tools/dmg2img-1.6.7.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - zlib >= 1.3.1
    - bzip2 >= 1.0.8
    - openssl >= 1.1.1w
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.patch"
  - "0001-vfdecrypt.c.patch"

knowledge_gained:
  - "OpenSSL 1.1.1 API 兼容性：EVP_CIPHER_CTX 和 HMAC_CTX 结构体变化"
  - "简单 Makefile 项目直接修改 CC/CFLAGS/LDFLAGS 即可交叉编译"

binaries:
  - dmg2img
  - vfdecrypt
