software: dmg2img
display: "dmg2img"
description: "将 Apple DMG 磁盘映像转换为 IMG/raw 格式的工具"
category: system
homepage: "http://vu1tur.eu.org/tools/"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "简单 Makefile 项目，无 configure"
    - "OpenSSL API 兼容性需要处理（EVP_CIPHER_CTX/HMAC_CTX）"
    - "vfdecrypt.c 需要修复 OpenSSL 1.1.1 API 兼容性"
  common_dependencies:
    - zlib
    - bzip2
    - openssl

versions:
  "1.6.7":
    status: published
    build_date: "2026-04-24"
