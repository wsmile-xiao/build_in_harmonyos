# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制）
# dslib 1.1 — 上游测试由 Makefile `make test` 编译、直接运行测试二进制

package: dslib/1.1
homepage: "https://github.com/jarun/dslib"

# 上游测试命令
upstream_check_command: "make test && ./test/{test_binary}"

# conanfile.py build() 中未集成上游测试（Conan 构建仅产库，测试在本地门禁单独执行）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本地门禁实测：5/6 自终止用例通过；
# avl_Thread_Safe_Test 是交互式演示（50 线程 + while(1) pause()，靠信号驱动），设计上不可批量运行）
upstream_tests:
  - file: test_avl_1.c
    source: dslib-1.1/test/test_avl_1.c
    description: "AVL 树节点插入/打印/删除往返"
    command: "./test/test_avl_1"
  - file: test_bst_1.c
    source: dslib-1.1/test/test_bst_1.c
    description: "BST 树节点插入/打印/删除往返"
    command: "./test/test_bst_1"
  - file: test_dlist_1.c
    source: dslib-1.1/test/test_dlist_1.c
    description: "双向链表节点增删"
    command: "./test/test_dlist_1"
  - file: test_queue_1.c
    source: dslib-1.1/test/test_queue_1.c
    description: "队列入队/出队往返"
    command: "./test/test_queue_1"
  - file: test_stack_1.c
    source: dslib-1.1/test/test_stack_1.c
    description: "栈压入/弹出往返"
    command: "./test/test_stack_1"
  - file: avl_Thread_Safe_Test.c
    source: dslib-1.1/test/avl_Thread_Safe_Test.c
    description: "AVL 线程安全交互演示（50 线程 + pause()，设计上无限循环，不可批量运行）"
    command: "N/A (interactive demo)"

# test_package 中自带的测试（消费者视角验证，实质调用 dslib 栈 API）
test_package_tests:
  - file: test.c
    description: "消费者测试：get_stack/push/pop/isStackEmpty/destroy_stack LIFO 往返"
    command: "./test_dslib"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 5
