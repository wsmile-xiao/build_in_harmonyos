# 版本级 manifest — dslib 1.1
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.1"

# 软件名
software: "dslib"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag 1.1 tarball）
  url: "https://github.com/jarun/dslib/archive/refs/tags/1.1.tar.gz"

  # 源码校验和（tag 1.1 tarball 实测 sha256）
  sha256: "21f58204549ba43c0f2d01f906069edd5d18ea7d151f141f03bd53d6f04c1bee"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游同时提供 Makefile 与 CMakeLists.txt，配方使用 CMake）
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）——本库无第三方依赖
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-CMakeLists-install-rules.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "上游 CMakeLists.txt 无 install 规则，补丁补充 install(TARGETS ds) 与 include/ds 头文件安装"
- "上游 isStackEmpty() 语义为'存在头节点即 TRUE'（命名歧义），消费者测试不可按字面'空栈'断言"
- "avl_Thread_Safe_Test 是交互式演示（50 线程 + while(1) pause()），设计上不可批量运行，不计入可运行测试"
