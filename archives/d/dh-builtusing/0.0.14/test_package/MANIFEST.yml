# test_package/MANIFEST.yml -- dh-builtusing 0.0.14
# CI L0e force-requires this file (upstream test declaration)

package: dh-builtusing/0.0.14
homepage: "https://salsa.debian.org/debian/dh-builtusing"

# upstream audit (extracted dh-builtusing_0.0.14.tar.xz, not estimated):
# - Makefile: `check: sh run-unit-tests`; debian/tests/control defines autopkgtest
# - unit-tests/ 16 files (10basic/20binary-arch/20binary-indep/
#   20build-depends-arch-indep/20package-arch/30encoding/30or-dependency/
#   40pattern/45multiple-matches/50same-source/60substvars-file/
#   70arch-profile-restrictions/70arch-suffix/70multiarch/
#   80not-in-build-depends/90c-option) -- this IS `make check` scope,
#   all 16 run on-device in build() via vendored offline Debian fixture
#   (debian_shims/: dpkg-architecture/dpkg-query/dh_gencontrol shims +
#   minimal Dh_Lib/Dpkg Perl emulation; fixture DB mirrors trixie sources).
# - integration-tests/ 3 files (10execute-before-dh-gencontrol/20dh-with/
#   30dh-sequence) are autopkgtest-only: they need an installed .deb plus
#   the `dh` sequencer and a Debian build env (`debian/rules binary`),
#   never run by `make check`. Not counted in the HMBS_UPSTREAM marker
#   (marker scope = `make check` = 16); documented here, not hidden.
upstream_check_command: "sh run-unit-tests"
upstream_test_in_build: true
upstream_test_command: "sh run-unit-tests"

upstream_tests:
  - file: unit-tests/10basic
    source: dh-builtusing-0.0.14/unit-tests/10basic
    description: "basic Built-Using/Static-Built-Using substvars + dh_gencontrol"
    command: "sh run-unit-tests"
  - file: unit-tests/40pattern
    source: dh-builtusing-0.0.14/unit-tests/40pattern
    description: "D/P/S pattern encoding and wildcard matching"
    command: "sh run-unit-tests"
  - file: unit-tests/60substvars-file
    source: dh-builtusing-0.0.14/unit-tests/60substvars-file
    description: "substvars-file deprecated variables and comment handling"
    command: "sh run-unit-tests"

test_package_tests:
  - file: test_dh_builtusing.py
    description: "R34 content check: bin/dh_builtusing core + builtusing.pm wiring + DPS encoding (3 asserts)"
    command: "python3 test_dh_builtusing.py <package>"

assertion_count: 3
