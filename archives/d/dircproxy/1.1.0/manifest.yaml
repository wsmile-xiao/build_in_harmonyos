# dircproxy 1.1.0 编译元数据

software:
  name: dircproxy
  version: 1.1.0
  category: network
  description: IRC proxy server for keeping IRC connections alive

source:
  url: https://github.com/w8tvi/dircproxy/archive/refs/tags/RELEASE-1_1_0.tar.gz
  checksum: unknown
  license: GPL-2.0

# 构建系统类型（G4 检查字段）
build_system: autotools

build:
  system: autotools
  configure_options: [--prefix=/storage/Users/currentUser/usr/local]
  dependencies: []
  tools_required: [autoconf, automake, clang]

status: published

test_results:
  date: 2026-05-29
  result: passed
  summary: 所有核心功能正常，可以正常使用
  details:
    - ✅ 安装验证通过
    - ✅ 安全弹窗无需（Kernel 1.12.0）
    - ✅ 版本查询正常
    - ✅ 帮助信息完整
    - ✅ 配置文件解析成功
    - ✅ 进程启动和运行正常
    - ✅ 密码加密功能完全正常
    - ✅ crypt() 函数实现正确

knowledge_gained:
  - E081: HMDFS mktemp 权限限制 - 需使用固定临时目录
  - OpenHarmony crypt 函数在 unistd.h 而非 crypt.h 中声明
  - 现代编译器不支持老旧 C 特性：三元运算符赋值、指针到 int 转换

patches_applied:
  - config.status: published（HMDFS workaround）
  - crypt/main.c: 使用 unistd.h 替代 crypt.h
  - src/irc_client.c: crypt 函数声明 + socklen_t + 指针转换
  - src/irc_server.c: 链表赋值 + socklen_t
  - src/dcc_net.c: 链表赋值 + socklen_t
  - src/net.c: 三元运算符取地址 + socklen_t

archive:
  created_at: 2026-05-28
  last_updated: 2026-05-29
  published_at: 2026-05-29