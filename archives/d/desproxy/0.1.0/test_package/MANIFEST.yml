# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: desproxy/0.1.0
homepage: "https://sourceforge.net/projects/desproxy/"

# 上游测试命令 (make -n check 验证: Makefile 无 check/test 目标)
# 清点证据: tar 包内 Makefile.in / src/Makefile.in 仅有 all/clean/install 目标，
# 无 check / test / tests 目录，上游测试用例数为 0
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：上游不含任何测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试：逐一执行 5 个二进制（desproxy/desproxy-inetd/desproxy-socksserver/desproxy-dns/socket2socket），验证可运行且输出版本 banner"
    command: "bash test.sh"

# 测试断言总数 (5 个二进制 × 各 1 项 banner 断言)
assertion_count: 5
