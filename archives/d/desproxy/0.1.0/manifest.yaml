# 版本级 manifest — desproxy 0.1.0

version: "0.1.0"
software: desproxy

# published | built | failed | archived
# 本地 conan-verify 通过后置 built；CI 合并发布后置 published（由 CI 流水线处理）
status: built

build_date: "2026-09-10"
build_system: autotools

source:
  # 上游无正式 0.1.0 release，采用 0.1.0 系列最新源码包 0.1.0-pre3（SourceForge 官方）
  url: "https://downloads.sourceforge.net/project/desproxy/desproxy/desproxy-0.1.0-pre3/desproxy-0.1.0-pre3.tar.gz"
  sha256: "d0c8a299fc3eacd12aef79c422a09f0e15e48ac69163ff8eef0b62b20d162ffd"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "CFLAGS 注入 -fcommon（via AutotoolsToolchain.extra_cflags）"
    - "TMPDIR 注入 conan 构建目录 + ac_cv_header_libintl_h=no（via Environment buildenv）"
  dependencies: []
  cc: clang
  cxx: clang++
  notes: "老 C 代码在 desproxy.h 定义全局变量，现代编译器默认 -fno-common 致 multiple definition，配方注入 -fcommon 解决；OHOS toybox mktemp -d 创建的 config.status 临时目录权限异常致 Permission denied，配方注入 TMPDIR + 0001 patch（mkdir + 当前目录兜底）解决；OHOS libintl.h 不声明 gettext 致 clang 隐式声明报错，配方预置 ac_cv_header_libintl_h=no 禁用 NLS 解决"

patches_applied:
  - "patches/0001-tmpdir-fallback.patch"

knowledge_gained:
  - "1990s 老式 C 代码（头文件定义全局变量而非 extern）在现代编译器 -fno-common 默认下链接报 multiple definition，AutotoolsToolchain.extra_cflags 注入 -fcommon 即可（构建参数层修复，优于源码 patch）"
  - "命令行工具型包（无库 API）：test_package 采用 VirtualRunEnv + test.sh 实际执行二进制（R34），验证安装产物可运行"
  - "OHOS 上 toybox mktemp -d 创建的目录权限异常：老 autoconf config.status 用 `mktemp -d -q \\"$TMPDIR/csXXXXXX\\"` 建临时目录，CI 上无论 $TMPDIR 指向哪里（.cache/tmp 或 conan build 目录）都出现 subs.sed/out 等 Permission denied、Makefile 未生成。修复：config.status 临时目录改用 mkdir（umask 077）+ $TMPDIR 失败时回退当前目录（configure 所在目录确定可写），配方同时注入 TMPDIR=构建目录"
  - "OHOS sysroot 的 libintl.h 不声明 gettext（stub/阉割版），configure 检测 libintl.h 存在即定义 HAVE_LIBINTL_H，源码 include 后 clang 隐式函数声明默认报 error。修复：Environment 预置 autoconf 缓存变量 ac_cv_header_libintl_h=no 跳过检测，config.h 不定义 HAVE_LIBINTL_H，源码走无 gettext 宏分支（构建参数层，优于源码 patch；适用于所有 1990s 老 autoconf 包）"
