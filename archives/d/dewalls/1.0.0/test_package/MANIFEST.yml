# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dewalls/1.0.0
homepage: "https://github.com/jedwards1211/dewalls"

# 上游仅提供 QBS 构建（dewalls.qbs），无 make check/ctest 目标；
# adapter 以 CMake 改写（patches/0001-CMakeLists.txt.patch），
# 通过 ctest 运行上游 Catch 测试程序 dewalls-test。
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（Catch v1.2.1 单头测试）
upstream_tests:
  - file: test/dewallstests.cpp
    source: dewalls-1.0.0/test/dewallstests.cpp
    description: "Catch v1.2.1 单头测试入口（CATCH_CONFIG_MAIN），聚合 8 个 TEST_CASE：general / azimuth / inclination / length / applyheightcorrections / wallsprojectparser 解析"
    command: "./dewalls-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_dewalls.cpp
    description: "消费者视角：链接 libdewalls 并调用 WallsSurveyParser 公共 API 解析 .srv 数据行"
    command: "./test_dewalls"

# 测试断言总数 (真实运行统计)
assertion_count: 2729