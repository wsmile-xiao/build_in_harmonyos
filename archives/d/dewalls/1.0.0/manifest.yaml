knowledge_gained:
  - "QBS 项目适配：上游仅提供 dewalls.qbs（Qt Build Suite），CI 无 QBS 工具链，改写为 CMakeLists.txt 声明等价目标（库 + 测试程序）"
  - "Qt5 conan 包消费：qt/5.15.19 自带 Qt5Config.cmake 且 cmake_find_mode=none，CMakeDeps 不生成 qt 目标；下游 generate() 须将 qt package_folder 注入 CMAKE_PREFIX_PATH 才能 find_package(Qt5)"
  - "QT_AUTOMOC 运行时依赖 libc++_shared.so：qt 包内 moc 执行需 LD_LIBRARY_PATH 包含 OHOS SDK llvm lib 目录（aarch64-linux-ohos），否则报 __cxa_pure_virtual symbol not found"

