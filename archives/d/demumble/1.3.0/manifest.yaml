version: "1.3.0"
software: demumble
status: built
build_date: "2026-09-10"
build_system: cmake

source:
  url: "https://github.com/nico/demumble/archive/refs/tags/v1.3.0.tar.gz"
  sha256: "29501fbd5522820a1672aea0292105b8706899e4e4b283ff51c126f79b3b2c41"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-ohos-keep-pie-on-aarch64.patch (portability: preserve PIE/PIC defaults on OHOS to fix aarch64 relocations)"

test_results:
  type: official
  total: 42
  passed: 42
  failed: 0
  note: "上游 demumble_test.py 的全部 42 项在 HarmonyOS PC 虚拟机上由等价 POSIX shell 驱动执行；另完成 11 项消费测试和 1 项 HMDFS 鸿蒙特有测试。"

knowledge_gained:
  - "官方 v1.3.0 源码内嵌 LLVM 与 Swift demangler，无第三方 Conan 依赖。"
  - "上游 CMake 只定义 demumble 可执行目标且没有 install 规则，配方从构建目录显式打包 bin/demumble。"
  - "上游对非 Apple Unix 强制 -fno-PIC/-no-pie，会令 aarch64 OHOS 链接产生未对齐绝对重定位；仅在 OHOS 保留 SDK 默认 PIE/PIC 可解决。"
  - "x86_64 OHOS 产物通过 HDC 在 HarmonyOS 6.0 PC 虚拟机上执行，并以 HMDFS 环境检查作为鸿蒙特有测试门禁。"
