package: demumble/1.3.0
homepage: "https://github.com/nico/demumble"

upstream_check_command: "python3 demumble_test.py"
upstream_test_in_build: true
upstream_test_command: "python3 demumble_test.py"
upstream_tests_exist: true
upstream_tests:
  - file: demumble_test.py
    source: "demumble-1.3.0/demumble_test.py"
    description: "上游官方 42 项命令行回归，覆盖 Itanium、Rust、D、Swift、MSVC、stdin、选项和错误处理"
    command: "python3 demumble_test.py"

test_package_tests:
  - file: test_demumble.sh
    description: "消费者测试：从 VirtualRunEnv 的 PATH 真实执行安装后的 demumble，完成 11 项功能断言"
    command: "sh test_demumble.sh"
  - file: test_ohos_runtime.sh
    description: "鸿蒙特有测试：确认 HarmonyOS PC 的 HMDFS 挂载后，真实执行 OHOS x86_64 demumble 并校验析构函数符号输出"
    command: "sh test_ohos_runtime.sh ./demumble"
  - file: run_upstream_tests_ohos.sh
    description: "虚拟机无 Python 时的等价驱动：逐项执行官方 demumble_test.py 中全部 42 条命令与期望输出"
    command: "sh run_upstream_tests_ohos.sh ./demumble"
  - file: conanfile.py
    description: "Conan test_package 入口；原生 OHOS CI 执行消费测试，交叉构建由 HDC 虚拟机执行同一产物"
    command: "conan test . demumble/1.3.0"

assertion_count: 54
