# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "dumb 2.0.3 upstream declares cmake_minimum_required(3.1); CMake 4.x refuses <3.5 — the CMAKE_POLICY_VERSION_MINIMUM=3.5 shim must be an ENVIRONMENT VARIABLE (or -D on the command line): setting it inside the toolchain or generate() takes effect only at project(), after cmake_minimum_required has already failed"
  - "duh_render_int sig_samples contract: pass sample_t **sigptr = NULL and &sigptr — the library owns the buffer (allocates/reuses across calls); passing a stack array makes destroy_sample_buffer() free a stack pointer → SEGV (diagnosed with ASan on-device)"
  - "dumb 0 registered tests (no tests/ dir, no add_test, no CI); examples/ are demo programs (dumbplay needs a live audio device)"
  - "S3M fixture layout for parser tests: 28B title + type 0x1A + 0x10 + 2B + n_orders/n_samples/n_patterns LE16 + flags + cwtv + ffi + 'SCRM' at 0x2C; MOD: 'M.K.' at offset 1080 (20 + 31*30 + 2 + 128) followed by 1024B/pattern"
  - "USE_SSE: on aarch64 check_c_compiler_flag(-msse) fails so upstream self-skips; the recipe makes it explicit OFF"

