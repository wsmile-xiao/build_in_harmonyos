# test_package/MANIFEST.yml — dumb 2.0.3
# CI L0e requires this file to exist.

package: dumb/2.0.3
homepage: "https://github.com/kode54/dumb"

# Upstream test inventory (tag 2.0.3):
# - No tests/ directory, no add_test/enable_training anywhere in the
#   tree, no CI workflows (.github absent) — upstream registers 0 test
#   cases. The examples/ (dumbout CLI, dumbplay SDL audio player) are
#   demo programs, not tests (dumbplay needs a live audio device).
# Registration count: 0 test cases; upstream validation is the library
# build itself.
upstream_check_command: "grep -rn add_test . || echo none; cmake -B build -DBUILD_EXAMPLES=OFF -DBUILD_ALLEGRO4=OFF -DUSE_SSE=OFF && cmake --build build"
upstream_test_in_build: false
upstream_test_command: "cmake --build build (library build = upstream validation; headless consumer asserts run in test_package)"

# Local execution on the OHOS device (see notes.md): library built with
# BUILD_EXAMPLES/ALLEGRO4/SSE off; consumer suite drives the real S3M
# and MOD parsers on in-memory fixtures and renders samples headlessly.
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_dumb.c
    description: "Headless consumer flow: register stdfiles → dumbfile_open_memory S3M/MOD fixtures → dumb_read_s3m / dumb_read_mod parse → duh_get_length → duh_start_sigrenderer + duh_render (1024 stereo samples through the IT rendering core) → assert failures=0"
    command: "conan create (cmake build → run test_dumb)"

assertion_count: 9

consumer_tests: 9
consumer_passed: 9
consumer_assertions: 9
