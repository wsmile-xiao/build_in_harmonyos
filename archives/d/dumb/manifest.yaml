# 软件级 manifest
# 文件位置: archives/d/dumb/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: dumb

# 显示名
display: "DUMB"

# 一句话描述
description: "Tracker 音乐模块库（IT/XM/S3M/MOD 等纯 C 解码渲染）"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/kode54/dumb"

# 开源许可证（SPDX 标识）
license: Zlib

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "CMake 4.x 拒绝 minimum_required<3.5：CMAKE_POLICY_VERSION_MINIMUM=3.5 必须环境变量传递（toolchain 内 set 在 project() 前无效）"
    - "三开关：BUILD_EXAMPLES=OFF / BUILD_ALLEGRO4=OFF / USE_SSE=OFF（aarch64）"
    - "duh_render_int 契约：sigptr 初值 NULL 传 &sigptr，库自管缓冲——误传栈数组 SEGV"
    - "纯 C + libm，headless 全可测（内存缓冲渲染无音频设备依赖）"
    - "测试二进制运行需 E077 签名"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.0.3":
    status: built
    build_date: 2026-09-20
