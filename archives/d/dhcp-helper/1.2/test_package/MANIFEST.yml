# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dhcp-helper/1.2
homepage: "https://www.thekelleys.org.uk/dhcp-helper/"

# 上游 Makefile 只有 all/clean/install 目标，没有 check/test 目标，
# 也没有任何测试源码或测试脚本（源码包仅含 dhcp-helper.c / Makefile /
# get-version / dhcp-helper.8 / README / CHANGELOG / COPYING）。
upstream_check_command: ""

# 上游无测试套件，因此 build() 中没有可集成的上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测二进制)
test_package_tests:
  - file: test_dhcp_helper.c
    description: "dhcp-helper -v：断言退出码 0 且输出含 dhcp-helper version 1.2"
    command: "./test_dhcp_helper <dhcp-helper-bin>"
  - file: test_dhcp_helper.c
    description: "无 -s/-b 参数：断言退出码 1 且提示 no destination（绑定端口前的守卫路径）"
    command: "./test_dhcp_helper <dhcp-helper-bin>"
  - file: test_dhcp_helper.c
    description: "-i <不存在接口>：断言 SIOCGIFFLAGS 校验失败退出码 1 且输出 bad interface"
    command: "./test_dhcp_helper <dhcp-helper-bin>"
  - file: test_dhcp_helper.c
    description: "-Z 未知选项：断言退出码 1 且输出 Usage: dhcp-helper"
    command: "./test_dhcp_helper <dhcp-helper-bin>"

# 测试断言总数 (test_dhcp_helper.c 中 check() 调用数)
assertion_count: 8
