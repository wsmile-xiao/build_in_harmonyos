# 软件级 manifest — dhcp-helper
# 遵循 ARCHIVE-SPEC v3.0

software: dhcp-helper
display: "dhcp-helper"
description: "DHCP 中继代理（RFC 2131/1542），监听网段的 DHCP 请求并单播转发到远端 DHCP 服务器，支持多接口、广播中继与备用端口；由 dnsmasq 作者编写"
category: network
homepage: "https://www.thekelleys.org.uk/dhcp-helper/"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 依赖 $(CC)/$(CFLAGS)，编译器与flags从 Conan profile 注入（R33）"
    - "release tarball 的 get-version 脚本回退输出 UNKNOWN（$Format:%d$ 占位符未替换且无 .git），构建时以 make 命令行变量 version=1.2 覆盖"
    - "OHOS libc(musl) 已内置 resolver/socket，无需额外链接库"
    - "无需补丁：单文件 POSIX C，OHOS 下一次编译通过（仅上游 1 个 -Wsign-compare 警告）"
    - "中继功能需 root 绑定 UDP 67/1067 端口，消费者测试覆盖无特权参数路径（-v/usage/坏接口/缺服务器）"
  common_dependencies: []

versions:
  "1.2":
    status: built
    build_date: 2026-09-11
