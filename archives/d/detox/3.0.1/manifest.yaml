knowledge_gained:
  - "Release tarball includes generated lexer/parser and configure files."
  - "Runtime dependencies are limited to the platform C/POSIX environment and libm when detected."
  - "Upstream test fixtures contain hard-coded /tmp paths and need a generic TMPDIR-aware portability patch."
  - "HarmonyOS exposes an upstream UTF-8 output-buffer overflow when an overlong encoded NUL expands to _hidden_null_."
  - "Check must retain its fork mode for upstream expected-exit tests; forcing CK_FORK=no invalidates five test programs."
  - "The table-resize unit test needs its source-only fixture mirrored into the out-of-source build tree."

