package: detox/3.0.1
homepage: "https://github.com/dharple/detox"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check VERBOSE=yes"
ohos_expected_result: "14 Check programs / 37 registered tests and 17 legacy scenarios pass"

upstream_tests:
  - file: "tests/unit/test_*.c"
    source: "detox-3.0.1/tests/unit"
    description: "Fourteen Check executables containing 37 registered tests"
    command: "make -j1 check VERBOSE=yes"
  - file: "tests/legacy/*/test.sh"
    source: "detox-3.0.1/tests/legacy"
    description: "Seventeen command-line regression scenarios"
    command: "make -j1 check VERBOSE=yes"

test_package_tests:
  - file: "test_detox.sh"
    description: "Nine real packaged-command assertions covering versions, data discovery, dry-run, rename and stdin conversion"
    command: "bash test_detox.sh <detox> <inline-detox>"
  - file: "test_ohos_tmpdir.sh"
    description: "Four OHOS assertions for caller-provided writable TMPDIR use and real filename rename"
    command: "bash test_ohos_tmpdir.sh <detox>"

assertion_count: 67
