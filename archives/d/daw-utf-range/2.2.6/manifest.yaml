# 版本级 manifest — daw-utf-range 2.2.6
# 文件位置: archives/d/daw-utf-range/2.2.6/manifest.yaml

# 版本号
version: "2.2.6"

# 软件名
software: daw-utf-range

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源码下载 URL（beached/utf_range v2.2.6 tag）
  url: "https://github.com/beached/utf_range/archive/refs/tags/v2.2.6.tar.gz"

  # 源码 SHA-256（官方 tarball 实测）
  sha256: "314e12d3a611a8179cc920acbae965d7280b28fb140a69fc5021623c0f0aa359"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（header-only CMake INTERFACE library）
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DDAW_USE_PACKAGE_MANAGEMENT=ON"
    - "-DDAW_ENABLE_TESTING=OFF"

  # 编译依赖列表（daw 系基础头文件库，制品仓已发布）
  dependencies:
    - "daw-header-libraries/2.135.0"

  # 编译器（OHOS aarch64 clang 15）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无需补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "daw-utf-range 是 header-only 库（CMake INTERFACE library），仅含 include/daw/utf8*.h 与 include/daw/utf_range/*.h"
  - "唯一运行时依赖 daw-header-libraries（CMake INTERFACE 链接）；DAW_USE_PACKAGE_MANAGEMENT=ON 切换 find_package 模式，避免 FetchContent 联网"
  - "CMake 命名空间：daw::daw-utf-range / daw::utf_range（两个 ALIAS 同名目标）"
  - "上游 tests/ 注册 2 个 add_test（daw_utf_range_test / daw_utf_string），源码含 5 个测试函数"
  - "daw_json_link 3.38.1 序列化路径（to_daw_json_string.h）硬依赖 daw/utf8/unchecked.h"
