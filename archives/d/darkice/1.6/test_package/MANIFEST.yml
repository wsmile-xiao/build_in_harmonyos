# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: darkice/1.6
homepage: "https://github.com/rafael2k/darkice"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Smoke test: darkice -h 报告版本字符串，验证二进制可执行"
    command: "bash test.sh"

assertion_count: 1
