software: dcc-extras
display: "DCC — Distributed Checksum Clearinghouse"
description: "基于校验和的分布式反垃圾邮件系统工具全集（cdcc/dccproc/dccif-test/dccd/dccifd/dbclean/dblist/dccsight 及辅助脚本）"
category: mail
homepage: "https://www.dcc-servers.net/dcc/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "补 1 处源码：include/dcc_types.h 增 #include <sys/types.h>（OHOS sysroot 为 musl，u_char/u_int*_t/caddr_t 只在 <sys/types.h>，DCC 依赖 glibc 的传递引入）"
    - "上游 configure 拒收 --prefix，改用 --homedir/--bindir/--libexecdir + --with-installroot（等效 DESTDIR）"
    - "上游发行仅 compress(1) .Z；conan get()/unzip 与 toybox gzip 均不支持，改用 cmake -E tar（libarchive）解包"
    - "安装按上游 SUBDIR 逐目录进行（顶层 make install 的 for 循环会掩盖子目录失败）；跳过 homedir 的主机专属密钥生成（map/ids）"
    - "运行期路径保持上游默认 DCC_HOMEDIR=/var/dcc、DCC_LIBEXECDIR=/var/dcc/libexec，仅安装目标被 staging 重定向"
    - "libmilter 缺席 → 上游默认不构建 dccm（上游文档：dccm 的构建期可选依赖）"
  common_dependencies: []

versions:
  "2.3.169":
    status: built
    build_date: "2026-09-26"
