# test_package/MANIFEST.yml — dcc-extras 2.3.169（DCC: Distributed Checksum Clearinghouse）
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制存在）

package: dcc-extras/2.3.169
homepage: "https://www.dcc-servers.net/dcc/"

# 测试类型：上游无自动化测试套件，本包只有消费者视角测试 + 上游可执行入口实测
test_type: "consumer-only"

# ── 上游测试入口清点（R51 第一步；真实命令与原始输出见 reports/test-report.md §1）──
# 顶层 Makefile 无 check/test/extras 目标，无 tests/ 目录，无 ctest/BUILD_TESTING；
# 唯一带 test 的路径 dccifd/dccif-test 是 dccifd 的自测客户端工具（非回归套件）。
upstream_check_command: "make -n check / make -n test / make -n extras"
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_count: 0
upstream_tests: []

# ── 上游可执行入口实测（R51 第二步；逐项真实执行，无漏测）──
# 上游构建出 13 个 ELF 可执行文件，全部实测；-V 不支持的用其自身 usage 入口。
# 原始矩阵：reports/test-report.md §3，TSV 见工作区 .progress/dcc-extras-logs/11_upstream_exec_matrix.tsv
upstream_entrypoints_tested:
  - {name: "cdcc -V",              binary: "bin/cdcc",                rc: 0, out: "2.3.169"}
  - {name: "dccproc -V",           binary: "bin/dccproc",             rc: 0, out: "2.3.169"}
  - {name: "dccif-test -V",        binary: "bin/dccif-test",          rc: 0, out: "2.3.169"}
  - {name: "dccd -V",              binary: "libexec/dccd",            rc: 0, out: "2.3.169"}
  - {name: "dccifd -V",            binary: "libexec/dccifd",          rc: 0, out: "2.3.169"}
  - {name: "dbclean -V",           binary: "libexec/dbclean",         rc: 0, out: "2.3.169"}
  - {name: "dblist -V",            binary: "libexec/dblist",          rc: 0, out: "2.3.169"}
  - {name: "dccsight -V",          binary: "libexec/dccsight",        rc: 0, out: "2.3.169"}
  - {name: "check_ip_range -V",    binary: "libexec/check_ip_range",  rc: 0, out: "2.3.169"}
  - {name: "dns-helper -V",        binary: "libexec/dns-helper",      rc: 0, out: "2.3.169"}
  - {name: "wlist -V",             binary: "libexec/wlist",           rc: 0, out: "2.3.169"}
  - {name: "ck2ip usage",          binary: "libexec/ck2ip",           rc: 0, out: "unrecognized option: h + usage"}
  - {name: "dump-clients usage",   binary: "libexec/dump-clients",    rc: 0, out: "option requires an argument: h + usage"}
  - {name: "cdcc help (离线全命令表)", binary: "bin/cdcc",            rc: 0, out: "version 2.3.169 + 命令表"}
  - {name: "cdcc homedir (离线)",  binary: "bin/cdcc",                rc: 0, out: "homedir=<tmpdir>"}
  - {name: "cdcc libexecdir (离线)", binary: "bin/cdcc",              rc: 0, out: "libexecdir=/var/dcc/libexec"}
upstream_entrypoints_summary: {total: 16, passed: 16, failed: 0, skipped: 0}

# ── 消费者测试（test_package/，共 14 例）──
test_package_tests:
  - name: test_dcc-c-consumer
    file: test_dcc.c
    description: "C 消费者测试：链接 libdcc 并调用 dcc_hstrerror；断言 OHOS 专有类型 u_char/u_int32_t/caddr_t 可用（补丁编译期验证）+ DCC_HOMEDIR/DCC_LIBEXECDIR 为上游默认（7 断言）"
    command: "./test_dcc"
  - name: pkg-layout-bin
    file: test_dcc-extras.sh
    description: "bin/ 三个可执行文件（cdcc/dccproc/dccif-test）存在且可执行"
    command: "bash test_dcc-extras.sh <package_folder>"
  - name: pkg-layout-libexec
    file: test_dcc-extras.sh
    description: "libexec/ 13 个组件（dccd/dccifd/dbclean/dblist/dccsight/ck2ip/check_ip_range/dump-clients/dns-helper/wlist/fix-map/start-dccd/stop-dccd）存在且可执行"
  - name: pkg-layout-cgi-bin-and-config-prototypes
    file: test_dcc-extras.sh
    description: "cgi-bin/ 的 Perl CGI 与 res/dcc/ 的 8 个静态配置原型齐全"
  - name: pkg-layout-dev-headers-and-libs
    file: test_dcc-extras.sh
    description: "include/ 公共头文件 + lib/libdcc.a、lib/libclnt.a 齐全"
  - name: cli-cdcc-version
    file: test_dcc-extras.sh
    description: "cdcc -V 输出 2.3.169"
  - name: cli-dccproc-version
    file: test_dcc-extras.sh
    description: "dccproc -V 输出 2.3.169"
  - name: cli-dccif-test-version
    file: test_dcc-extras.sh
    description: "dccif-test -V 输出 2.3.169"
  - name: cli-libexec-daemons-version
    file: test_dcc-extras.sh
    description: "libexec 7 个守护/工具（dccd/dccifd/dblist/dccsight/check_ip_range/dns-helper/wlist）版本一致"
  - name: cli-cdcc-help-offline-runs
    file: test_dcc-extras.sh
    description: "cdcc -h<tmp> help 真实执行 rc=0 且含 version 2.3.169 与命令表"
  - name: cli-cdcc-homedir-offline-runs
    file: test_dcc-extras.sh
    description: "cdcc -h<tmp> homedir 真实执行并回显指定 homedir"
  - name: ohos-elf-native-aarch64-musl
    file: test_dcc-extras.sh
    description: "鸿蒙特有用例：纯 Python 解析 13 个 ELF，断言 ELF64 + e_machine=0xB7(AArch64) + PT_INTERP=/lib/ld-musl-aarch64.so.1（无外部工具依赖）"
  - name: ohos-no-shared-lib-shadow
    file: test_dcc-extras.sh
    description: "鸿蒙特有用例：包内不含 .so（R26 语义，不向系统注入同名动态库）"
  - name: ohos-patcher-sys-types-compiles
    file: test_dcc-extras.sh
    description: "鸿蒙特有用例：包内 include/dcc_types.h 含本包补丁的 #include <sys/types.h>"
# 断言点总数（可复算口径 = 用例级聚合结论断言 + C 消费者断言）
#   复算（在 test_package/ 下执行）：
#     shell = grep -oE '(ok|bad|skip) "\$c[0-9]+"' test_dcc-extras.sh \
#             | grep -oE '\$c[0-9]+' | sort -u | wc -l          → 13（每用例 1 条结论）
#     C     = grep -oE 'return [1-7];' test_dcc.c | wc -l      →  7
#     total = 13 + 7 = 20
assertion_count: 20
test_package_summary: {total: 14, passed: 14, failed: 0, skipped: 0}
ohos_specific_test_count: 4   # test_dcc-c-consumer + 用例 11/12/13

notes: |
  1) 上游 DCC 2.3.169 **无自动化测试套件**（顶层 Makefile 无 check/test/extras 目标、
     无 tests/ 目录、无 ctest/BUILD_TESTING；唯一带 test 的 dccifd/dccif-test 是
     dccifd 的自测客户端工具）——清点命令与原始输出见 reports/test-report.md §1；
  2) 上游测试因此无“复跑”口径，改为对 13 个 ELF 可执行入口逐个实测（16 条命令，
     全部 rc=0），矩阵见 reports/test-report.md §3；
  3) 本套件对已安装包执行（env="conanrun"），满足 CI L1e 的“破坏性反向验证”：
     移走包内 bin//libexec/ 后用例 1/2/5/6/7/8 必然失败（实测中由此发现并修复了
     INSTALL_SUBDIRS 漏 dblist、fix-map 缺 x 位两个真实缺陷）；
  4) 未覆盖：DCC map 生命周期与在线客户端/服务端互测 —— 具体原因（HMDFS 权限
     归一化为 0660，DCC 的 HAVE_PRIVATE_FILES 检查要求 0600）与实测证据见
     reports/test-report.md §3「不可测项与具体原因」。
