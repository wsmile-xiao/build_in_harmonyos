patches_applied:
  - file: "patches/0001-include-dcc_types.h.patch"
    type: portability
    files: ["include/dcc_types.h"]
    description: >-
      补 #include <sys/types.h>：BSD 风格别名 u_char/u_int*_t/caddr_t 在 OHOS
      sysroot（musl）只在 <sys/types.h> 中定义，DCC 未包含该头 → 全树编译失败。

knowledge_gained:
  # 每条附知识图谱引用（knowledge_ref）；无对应条目的模式已按 R31 生成草稿
  - "OHOS sysroot 是 musl：BSD 别名 u_char/u_int*_t/caddr_t 只在 <sys/types.h>（受 _GNU_SOURCE/_BSD_SOURCE 门控），DCC 依赖 glibc 的传递引入 → include/dcc_types.h 补 #include <sys/types.h>（无平台宏）"   # knowledge_ref: E113,E429
  - "判定顺序：先用 clang -E 探针确认 sysroot 是否已提供这些别名，再决定「补 <sys/types.h>」还是「新建 compat 头」——musl 下已提供，重复 typedef 会与 sysroot 冲突"   # knowledge_ref: E429
  - "上游 configure 明确拒收 --prefix（'error: --prefix is not what you think it is.'），只认 --homedir/--bindir/--libexecdir/--mandir/--with-installroot（等效 DESTDIR）"   # knowledge_ref: E336
  - "上游发行只有 compress(1) .Z（LZW）：conan get()/unzip 与 toybox gzip 都不支持，用 cmake -E tar（内置 libarchive 支持 compress）解包"   # knowledge_ref: E429
  - "顶层 make install 用 shell for 循环递归子目录，子目录失败仍返回 rc=0（掩盖 homedir 失败）；逐目录 make -C <dir> install 才能让失败显性化"   # knowledge_ref: E430
  - "DCC 打开 map 带 HAVE_PRIVATE_FILES 检查（clntlib/lock_open.c:141 要求 0600）；HMDFS/tmpfs 把权限归一化为 0660 且 chmod 无效 → fix-map 必然失败；主机专属密钥不应进入可重定位包"   # knowledge_ref: E430
  - "上游无自动化测试套件（无 check/test/extras 目标、无 tests/ 目录）；dccifd/dccif-test 是自测客户端工具，随默认 make 构建"   # knowledge_ref: E430
  - "libdcc/libclnt 为同源树内静态库；上游称 libdcc 为 'the public DCC client library'，可对外交付头文件 + 静态库（本包 include/ + lib/）"   # knowledge_ref: E336

