# conandata.yml — dcc-extras 2.3.169（DCC: Distributed Checksum Clearinghouse）
#
# 上游官方源（项目自建服务器 https://www.dcc-servers.net/dcc/ ，非镜像/非 fork）：
#   页面原文："The current version of the DCC source is version 2.3.169, March 22, 2024"
#   发行文件只有 compress(1) 的 .Z 一种格式（同目录下仅 dcc.tar.Z）。
#
# 注意：.Z 是 Unix compress(LZW)，conan 的 get()/unzip 不支持；本机 gzip 是
# toybox（不支持 LZW）。配方 source() 里用 `cmake -E tar`（内置 libarchive
# 支持 compress）解包，与仓内 archives/c/cspice/67.0.0.1 同一做法。
sources:
  url: "https://www.dcc-servers.net/dcc/source/dcc.tar.Z"
  sha256: "3447e655476ac742942daf25fc217236da456dd0f82b7117661b9a70484b7bf6"

patches:
  "2.3.169":
    - patch_file: "patches/0001-include-dcc_types.h.patch"
      patch_description: >-
        include/dcc_types.h 补 #include <sys/types.h>：DCC 假定 BSD 风格别名
        u_char/u_int*_t/caddr_t 由其他系统头传递引入（glibc 成立），OHOS
        sysroot（musl）只在 <sys/types.h> 里定义它们，导致全树 .c 报
        "unknown type name 'u_char'"。
      patch_type: portability
      patch_source: >-
        OHOS 适配补丁（本仓库）；无上游 PR，属 POSIX 头显式化，对所有平台等价无害
