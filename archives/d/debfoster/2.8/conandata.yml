sources:
  url: "https://deb.debian.org/debian/pool/main/d/debfoster/debfoster_2.8.orig.tar.xz"
  sha256: "c5d044a89642603987e216d406d8f9aa74c60240be4b4992f45bd9b743a9a522"

patches:
  "2.8":
    - patch_file: "patches/0001-configure-umask-hmdfs.patch"
      patch_description: "configure 内嵌的 config.status 以 umask 077 建立 ./confXXXXXX 临时目录；该目录在 hmdfs 上落盘为 2700 且属主不是本进程 uid，随后写 subs1.awk 报 Permission denied 使 configure 失败。改为 umask 022"
      patch_type: "portability"
    - patch_file: "patches/0002-keepers-include-fcntl.patch"
      patch_description: "src/keepers.c 调用 open() 并使用 O_RDONLY/O_RDWR/O_CREAT 但只包含 sys/file.h；glibc 经由 sys/file.h 间接引入 fcntl.h 而 OHOS 的 musl 不引入。显式包含 fcntl.h"
      patch_type: "portability"
    - patch_file: "patches/0003-etc-makefile-install-d.patch"
      patch_description: "etc/Makefile.am 的 install-data-local 硬编码 coreutils 的 install -d；OHOS 无 install 命令导致 make install 报 exit 127。改用 autoconf 提供的 MKDIR_P 变量并同步更新无法再生的 etc/Makefile.in"
      patch_type: "portability"
