# test_package/MANIFEST.yml — debfoster 2.8
# CI (build_and_test.sh L0e) requires this file: it declares where the upstream
# tests are and which consumer tests the package itself adds.

package: debfoster/2.8
homepage: "https://salsa.debian.org/debian/debfoster"

# ── 上游测试入口台账 ─────────────────────────────────────────────────────────
# debfoster 2.8 上游不带任何测试套件，证据：
#   1. 四个 Makefile.am（顶层 / src / etc / doc）都没有 TESTS 变量，只有
#      src/Makefile.am 的 sbin_PROGRAMS = debfoster 与 LOCALEDIR/DEFS 定义；
#      `grep -n 'TESTS\|check_PROGRAMS' */Makefile.am Makefile.am` 无命中；
#   2. tarball 里没有 tests/、test/、check/、spec/ 目录，也没有任何
#      test_*.c / *_test.c 源文件
#      （`python3 -m tarfile -l debfoster_2.8.orig.tar.xz | grep -Eic
#        '(^|/)(tests?|checks?|specs?)(/|$)'` = 0）；
#   3. `make check` 在 automake 生成的 Makefile 里确实存在，配方也真实调用了它，
#      但递归到的每一层都无事可做。采信轮日志的 `RUN: make check -j1`
#      段逐行如下（每层都 Entering/Leaving 成对出现）：
#        src       —— 进入后直接离开，无任何输出
#        etc/doc/po —— 各打印一行 "make[1]: Nothing to be done for 'check'."
#                      （全日志该串合计 3 次）
#        顶层       —— 打印 "make[1]: Nothing to be done for 'check-am'."（1 次）
#      复核命令：
#        grep -c "Nothing to be done for 'check'" reports/conan-create.log  # 3  (本地原始日志)
#        grep -c 'check-am'                       reports/conan-create.log   # 1
# 因此上游用例数 = 0（“未发现可运行的上游测试入口”），既不是 PASS 也不是
# SKIP；配方仍在 build() 里调用 make check，使这一事实在每轮构建日志中可核。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"
upstream_tests: []

# ── 适配后新增的消费者测试（conan create 自动执行）──────────────────────────
test_package_tests:
  - file: conanfile.py
    description: "Consumer test entry: uses VirtualRunEnv to put the packaged bin/ on PATH and runs test.sh with a shell resolved as CONFIG_SHELL if (non-empty) else the device bash /data/service/hnp/bin/bash — CONFIG_SHELL is not exported into test()'s environment, so the device bash is what actually runs (measured RUN line, excerpted in reports/evidence-excerpts.md); os.environ['SHELL'] must NOT be used as an intermediate fallback because it is /bin/sh (toybox ash)"
    command: "conan create archives/d/debfoster/2.8 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 --build=missing --user=ohpcd --channel=stable"
  - file: test.sh
    description: "36 项 CLI 行为断言：版本自报（--version/-V）、用法面（usage 行、-k/-s 选项、六种查询模式）、退出码契约（未知命令行选项 1、未知 -o 选项 1、-o 缺等号 1、状态库不可读 3）、查询模式 golden stdout（-a 空/非空 keeper 列表、-s 孤立包、-d 依赖、-e 依赖者、-p Provides 解析、-r 唯一带入包）、交互模式改写 keeper 文件（y → 追加包名、n → 写入 -前缀）以及包内布局（相邻 etc/debfoster.conf 存在、可被 -c/-o 接受、无 -c 时回落到编译期前缀绝对路径并报 3）"
    command: "bash test.sh"

# 夹具说明（全部是运行期生成的文本文件，不提交）：dpkg status 数据库两套
#   status            —— libfoo1(Provides: libfoo) / appbar(Depends: libfoo1 (>= 1.0)) /
#                        orphanbaz（无人依赖）/ essentialpkg(Priority: required, Essential: yes)
#   status-versioned  —— libbar2 2.5-1 / libbaz 0.9-1 / toolv(Depends: libbar2 (>= 2.0), libbaz) /
#                        needv9(Depends: libbaz)，用于验证版本约束与“共享依赖不算唯一带入”
# 配置文件把 DpkgStatus/DpkgAvailable/KeeperFile 指到测试工作目录，并把
# InstallCmd/RemoveCmd/InfoCmd 全部换成 /bin/true，测试不会触碰任何包管理器。

# 用例统计（统计单位：test.sh 中逐个判定的功能断言，每项打印一行 ok/FAIL）
test_case_count: 36
assertion_count: 36
