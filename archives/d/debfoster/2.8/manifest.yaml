version: "2.8"
software: "debfoster"
status: built
build_date: "2026-09-11"
build_system: autotools
conan_ref: "debfoster/2.8"

source:
  url: "https://deb.debian.org/debian/pool/main/d/debfoster/debfoster_2.8.orig.tar.xz"
  sha256: "c5d044a89642603987e216d406d8f9aa74c60240be4b4992f45bd9b743a9a522"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "Conan 传入 --prefix=/ --bindir=${prefix}/bin --sbindir=${prefix}/bin（cpp.package.bindirs=[\"bin\"]）：上游 sbin_PROGRAMS 因此装在包内 bin/"
    - "不改写 configure_args：同构 profile 下 cross_building() 为 False，Conan 不注入 --build/--host，configure 调用补丁后的 config.guess 自行判定原生三元组"
    - "make -j1"
    - "make check -j1（上游无测试套件，递归到的每一层都无事可做；保留调用使该事实在每轮日志中可核）"
  dependencies:
    - gc/8.2.12
  cc: clang

patches_applied:
  - "0001-configure-umask-hmdfs.patch"
  - "0002-keepers-include-fcntl.patch"
  - "0003-etc-makefile-install-d.patch"

generated_files:
  note: "上游 Makefile.am 的 dist-hook 从发行 tarball 删除 config.guess/config.sub/install-sh/missing/depcomp/aclocal.m4 却保留 configure；本设备与 CI 均无 autotools 工具链，故随配方交付并复制回源码树。sha256 与来源见 2.8/generated/PROVENANCE.md"
  files:
    - "generated/config.guess"
    - "generated/config.sub"
    - "generated/install-sh"
    - "generated/missing"
    - "generated/depcomp"
    - "generated/aclocal.m4"

knowledge_gained:
  - "conan autotools 配方只生成 AutotoolsToolchain 时 requirements 的 -I/-L 不会被注入：AC_CHECK_LIB 是纯链接探测因此仍打印 'checking for GC_malloc in -lgc... yes'（假通过），configure 全程 rc=0，失败推迟到 make 的首个消费者文件才以 \"fatal error: 'gc/gc.h' file not found\" 暴露；generate() 必须同时生成 AutotoolsDeps（与 E467 的相反缺口面：E467 是 Deps 存在时 LIBS 被过早注入导致 conftest 失败）"  # knowledge_ref: DRAFT-E2186（本 PR 携带）
  - "上游 Makefile.am 的 dist-hook 删除 config.guess/config.sub/aclocal.m4/install-sh/missing/depcomp 却保留生成好的 configure 与 Makefile.in：无 autotools 工具链时第一级报 'cannot find required auxiliary files'，补齐后缺 aclocal.m4 又让 automake 的 maintainer 规则触发并报 `aclocal-1.16: inaccessible or not found`（exit 127）。解法是随配方交付这批文件（逐文件名复制，不用通配以免带上 PROVENANCE.md）+ 占位 aclocal.m4 + 把整条 autotools 依赖链 os.utime 到同一时间戳，并用三处旁证证明 configure 未被重生成"  # knowledge_ref: DRAFT-E2187（本 PR 携带）; knowledge_ref: E305
  - "config.guess 2024-07-27 版没有 HarmonyOS 分支：设备 uname -s 返回 HarmonyOS 时 configure 报 cannot guess build type；在 'order is significant' 注释之前插入 *:HarmonyOS:*:* 分支并直接输出 aarch64-unknown-linux-ohos（不依赖 CC 探测）；同版 config.sub 已原生接受 ohos，无需补丁"  # knowledge_ref: E007
  - "configure 内嵌的 config.status 用 umask 077 + mktemp -d ./confXXXXXX 建临时目录，hmdfs 上落盘为 2700 且属主 uid 与进程 uid 不同，写 subs1.awk 报 Permission denied 使 configure rc=1；必须改 configure 自身（config.status 是运行时内嵌生成的），改 umask 022 即可同时修好 configure 与它生成的 config.status"  # knowledge_ref: E011
  - "raw autotools 的 install-data-local 里裸写 coreutils `install -d` 会绕过 configure 探测到的 $(INSTALL)，OHOS 无 install 命令导致 make install exit 127；改用 autoconf 的 MKDIR_P，并同步改无法再生的 Makefile.in"  # knowledge_ref: E114
  - "静态 gc/8.2.12 在 OHOS 上每次运行向 stderr 打印 GC Warning: Failed to find PT_GNU_RELRO segment inside PT_LOAD region：默认/-z relro,now/-z norelro/-z noseparate-code/--no-rosegment/-no-pie 六种链接形态的最小探针（GC_INIT + GC_MALLOC）全部打印同一行且全部正常返回，证明与消费方无关且不可通过链接选项消除；比对输出时只看 stdout，同型记录见 archives/p/poke/5.0/notes.md"  # reference: archives/p/poke/5.0/notes.md

validation:
  upstream_tests:
    command: "conan create archives/d/debfoster/2.8 -pr:h=/storage/Users/currentUser/ws/build_in_harmonyos/ci/conan/profiles/ohos-aarch64 -pr:b=/storage/Users/currentUser/ws/build_in_harmonyos/ci/conan/profiles/ohos-aarch64 --build=missing --user=ohpcd --channel=stable (build() 内 make -j1; make check -j1)"
    evidence: "采信轮完整日志（本地 reports/conan-create.log，按规则 19 不入库；逐字摘录与计数复核见 reports/evidence-excerpts.md §1）中 `RUN: make check -j1` 段逐行复核：src 子目录进入后直接离开（无任何输出），etc/doc/po 三个子目录各打印一行 \"Nothing to be done for 'check'.\"（全日志合计 3 次），顶层打印 \"Nothing to be done for 'check-am'.\"（1 次）——即递归到的每一层都无事可做，上游用例数 = 0（计数命令见 test_package/MANIFEST.yml）"
  test_package:
    command: "bash archives/d/debfoster/2.8/test_package/test.sh（由 conan create 的 test() 在 conanrun 环境执行）"
    evidence: "reports/evidence-excerpts.md §1 摘录的采信轮日志行 HMBS_TEST_SUMMARY discovered=36 passed=36 failed=0 skipped=0（原始日志 reports/conan-create.log 不入库）"

