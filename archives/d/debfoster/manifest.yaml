software: debfoster
display: "debfoster"
description: "维护显式的软件包 keeper 列表并清理无人依赖的孤立包的命令行工具"
category: system
homepage: "https://salsa.debian.org/debian/debfoster"
license: GPL-2.0-only AND LGPL-2.0-only AND LGPL-2.1-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游发行 tarball 被 dist-hook 删掉了 config.guess/config.sub/install-sh/missing/depcomp/aclocal.m4 却保留 configure：本设备与 CI 都没有 autotools 工具链，必须随配方交付这些辅助文件（generated/）并把整条 autotools 依赖链时间戳钉成同一个值，否则 make 走 maintainer 规则报 aclocal-1.16 inaccessible or not found (exit 127)"
    - "设备 uname -s 返回 HarmonyOS：2024-07-27 版 config.guess 只认 Linux/GNU，需补 *:HarmonyOS:*:* 分支输出 aarch64-unknown-linux-ohos (E007)"
    - "hmdfs 上 configure 内嵌 config.status 的 umask 077 + mktemp -d 临时目录落盘为 2700 且属主非当前 uid，写 subs1.awk 报 Permission denied，需改 umask 022 (E011)"
    - "etc/Makefile.am 的 install-data-local 硬编码 coreutils install -d，OHOS 无 install 命令（make install exit 127），改用 autoconf 的 MKDIR_P"
    - "src/keepers.c 用 open() 但只包含 sys/file.h：glibc 间接引入 fcntl.h 而 OHOS musl 不引入，需显式包含"
    - "上游无测试套件（Makefile.am 无 TESTS、无测试目录），make check 四个子目录全为 no-op，测试由 test_package 的 CLI 行为断言承担"
    - "静态 gc/8.2.12 在 OHOS 上每次运行向 stderr 打印 GC Warning: Failed to find PT_GNU_RELRO segment inside PT_LOAD region（既知良性现象），比对输出时只看 stdout"
  common_dependencies:
    - gc/8.2.12

versions:
  "2.8":
    status: built
    build_date: "2026-09-11"
    conan_ref: "debfoster/2.8"
