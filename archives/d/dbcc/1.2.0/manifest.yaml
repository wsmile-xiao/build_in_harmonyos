# 版本级 manifest — dbcc 1.2.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.0"

# 软件名
software: "dbcc"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag v1.2.0 归档）
  url: "https://github.com/howerj/dbcc/archive/refs/tags/v1.2.0.tar.gz"

  # 源码校验和
  sha256: "99047e5e9e320a41837243fdc3e40d3615bdf3e99742fbec8dd7fdf7bc67ba93"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（纯 makefile，无 configure）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码修改，无补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（等价命中既有知识，走路径 A，不创建草稿）
knowledge_gained:
  - "E424: application/CLI 工具包必须在软件级目录提供 commands.json（archives/d/dbcc/commands.json），type=tool、name 含包名、versions 含当前版本"
  - "E097: 无 configure 脚本的自定义 makefile 项目，配方直接 make + 拷贝二进制到 bin/，不做 autotools.configure()"
  - "上游 out/makefile 硬编码 gcc：本环境无 gcc，以 CC=clang 复跑 make test 生成代码编译通过（环境噪声，非当前库缺陷）"
