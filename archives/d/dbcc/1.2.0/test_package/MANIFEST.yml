# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dbcc/1.2.0
homepage: "https://github.com/howerj/dbcc"

# 上游测试命令：`make test` 生成 out/ex1.c/ex2.c/double_signal.c/float_signal.c 及
# XML/CSV/JSON 产物并编译生成代码（make -C out）；实测在 clang 下通过（out/makefile 硬编码
# gcc，本环境以 CC=clang 复跑验证）。XML 经 xmllint --schema dbcc.xsd 校验通过。
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: out/ex1.c
    source: dbcc-1.2.0/ex1.dbc
    description: "将 ex1.dbc 报文定义转换为 C 结构体代码并编译"
    command: "make -C out"
  - file: out/ex2.c
    source: dbcc-1.2.0/ex2.dbc
    description: "将 ex2.dbc 报文定义转换为 C 结构体代码并编译"
    command: "make -C out"
  - file: out/ex1.xml
    source: dbcc-1.2.0/ex1.dbc
    description: "DBC 转 XML 并通过 dbcc.xsd 模式校验"
    command: "xmllint --noout --schema dbcc.xsd out/ex1.xml"
  - file: out/ex2.xml
    source: dbcc-1.2.0/ex2.dbc
    description: "DBC 转 XML 并通过 dbcc.xsd 模式校验"
    command: "xmllint --noout --schema dbcc.xsd out/ex2.xml"
  - file: out/double_signal.c
    source: dbcc-1.2.0/double_signal.dbc
    description: "double 信号 DBC 转 C 代码并编译"
    command: "make -C out"
  - file: out/float_signal.c
    source: dbcc-1.2.0/float_signal.dbc
    description: "float 信号 DBC 转 C 代码并编译"
    command: "make -C out"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 dbcc -V 版本输出，并将最小 DBC 报文定义转换为 C 与 JSON，验证产物非空"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
