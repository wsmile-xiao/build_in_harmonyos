# 软件级 manifest — dh-shell-completions
# 遵循 ARCHIVE-SPEC v3.0
software: dh-shell-completions
display: "dh-shell-completions"
description: "Debhelper 插件，按各 shell 约定安装 bash/fish/zsh 补全脚本（Debian 官方 dh 序列 addon）"
category: build-tool
homepage: "https://salsa.debian.org/debian/dh-shell-completions"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Perl(.pm + dh_shell_completions 脚本) 包（Debian native 源，无 configure/CMake/autotools），不需要编译，直接安装脚本 + perl 序列模块"
    - "上游 3 组官方用例（tests/run.sh gen|composite|separate）在 build() 内真实执行并通过 3/3：perl 5.42.0 由 HNP 提供（/data/service/hnp/bin/perl），debhelper 13.3.4 源码 tarball + dh-autoreconf 20 .deb 在 build 目录内搭建测试工具链，DEB_* 环境变量替代 OHOS 缺失的 dpkg-architecture"
    - "shebang 适配：OHOS 无 /usr/bin/perl，dh_shell_completions 的 shebang 经 patches/0001 改为 #!/usr/bin/env perl（唯一上游源码改动，测试脚本未动）"
    - "手册页由 debian/rules 用 pod2man 生成（依赖 perl），配方不生成/不安装手册页"
    - "测试为两层：上游官方用例实跑（3/3）+ 包产物消费者断言（10/10）；L2 的 --version/--help 探测为警告级（需 debhelper 的 Dh_Lib，属运行时依赖）"
  common_dependencies: []

versions:
  "0.1.0":
    status: built
    build_date: "2026-09-17"
    conan_ref: "dh-shell-completions/0.1.0"
