# 版本级 manifest — dh-shell-completions 0.1.0
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 为 CI 唯一构建输入，本文件为人读索引）

version: "0.1.0"

software: "dh-shell-completions"

# 编译状态：built（CI 校验通过后由 maintainer 提升为 published）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"
build_system: custom
# 包类型：application（CLI/脚本包，非库；供 conan-init 生成器读取）
package_type: application

source:
  # 源码下载 URL（Debian 官方 pool，native 源；R39 官方源）
  url: "https://deb.debian.org/debian/pool/main/d/dh-shell-completions/dh-shell-completions_0.1.0.tar.xz"

  # 源码校验和（sha256sum 核验，与 Debian .dsc 一致）
  sha256: "9f90f4122198336a8917d77d1e6e408a3506fbecb7300fbcf58145f4f61b120f"

  # 压缩格式
  tar_format: tar.xz

build:
  # 构建系统类型：custom（纯脚本包，无 configure/CMake/autotools）
  system: custom

  # 配置选项列表（无）
  configure_options: []

  # 编译依赖列表 — 无外部依赖（零编译；运行时依赖 perl + debhelper(dh)，非构建依赖）
  dependencies: []

  # 编译器（无编译，声明字段保留）
  cc: clang
  cxx: clang++

patches_applied:
- "patches/0001-dh_shell_completions-env-perl-shebang.patch：dh_shell_completions 第 1 行 shebang 由 /usr/bin/perl 改为 /usr/bin/env perl（OHOS 无 /usr/bin/perl，perl 由 HNP 提供且位于 PATH）——上游测试脚本未修改"

knowledge_gained:
- "dh-shell-completions 是 Debian native 源（debian/source/format=3.0 (native)）：纯 Perl(.pm + dh_shell_completions 脚本)，无任何构建系统；文件按 debian/install 布局安装（shell_completions.pm→/usr/share/perl5/Debian/Debhelper/Sequence/，dh_shell_completions→/usr/bin/），Conan 配方只需 get + 安装"
- "顶层 Makefile 仅驱动 tests/（gen/composite/separate 三组），不产生任何 C/C++ 编译；init-build 的构建系统启发式会把本包误判为 make/mixed（假阳性），实测无任何 C/C++ 源文件"
- "上游 3 组官方用例可在 OHOS 上真实执行（3/3 通过）：perl 5.42.0 由 HNP 提供（/data/service/hnp/bin/perl，位于 PATH），debhelper 13.3.4 官方源码 tarball（dh + 全部 dh_* + Dh_Lib/Sequence）与 dh-autoreconf 20（compat 13 默认启用的 autoreconf 序列 addon）在 build 目录内解包即可，无需 dpkg"
- "OHOS 无 /usr/bin/perl（perl 在 PATH 中），shebang 为 #!/usr/bin/perl 的 perl 脚本 exec 会报 bad interpreter；改为 #!/usr/bin/env perl 即可正常执行"
- "debhelper 依赖 dpkg-architecture 获取架构信息；OHOS 无 dpkg，用 DEB_HOST_ARCH/DEB_BUILD_ARCH/DEB_HOST_GNU_TYPE/DEB_HOST_MULTIARCH 等 DEB_* 环境变量替代（debhelper 优先读环境变量）"
- "手册页 dh_shell_completions.1 由 debian/rules 用 pod2man 生成（依赖 perl），配方不生成/不安装手册页，避免引入 pod2man 依赖"
- "上游 License 为 Apache-2.0（LICENSE 与 debian/copyright 一致）；commands.json 标记 binary=false（非 ELF 产物）"
