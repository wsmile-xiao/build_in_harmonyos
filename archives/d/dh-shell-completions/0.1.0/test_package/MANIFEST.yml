# test_package/MANIFEST.yml
# 上游官方测试声明文件 — dh-shell-completions 0.1.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dh-shell-completions/0.1.0
homepage: "https://salsa.debian.org/debian/dh-shell-completions"

# 上游为 Debian native 纯脚本包（无 configure/CMake/autotools，无编译产物）。
# 上游无 ctest/meson/pytest；测试由顶层 Makefile 的 `test` target 驱动 tests/run.sh。
upstream_check_command: "make test"

# 上游测试在 build() 内真实执行，3/3 通过（工具链搭建见 conanfile.py）
upstream_test_in_build: true
upstream_test_command: "tests/run.sh gen && tests/run.sh composite && tests/run.sh separate"

# 上游官方测试：顶层 Makefile `test` → tests/run.sh <case>，共 3 组
# （gen / composite / separate，fixture 位于 tests/{gen,composite,separate}/）。
# 上游实测用例数 N=3；上游无 debian/tests/（无 DEP-8 autopkgtest）。
# 执行方式：build() 内用 perl（HNP 提供，/data/service/hnp/bin/perl）+ debhelper
# 测试工具链（debhelper 13.3.4 官方源码 tarball：dh + dh_* + Dh_Lib；
# dh-autoreconf 20：compat 13 默认启用的 autoreconf 序列 addon；
# DEB_* 环境变量替代 OHOS 缺失的 dpkg-architecture）。
upstream_tests:
  - name: test-gen
    type: make-target
    location: "tests/run.sh gen"
    description: "generation 模式：按 debian/shell-completions 的 mode=gen 指令调用命令生成 bash/fish/zsh 补全并安装到期望路径，再校验内容"
    result: PASS
  - name: test-composite
    type: make-target
    location: "tests/run.sh composite"
    description: "composite 模式：从 debian/shell-completions 文件列表按行安装多 shell 补全，校验安装路径与内容"
    result: PASS
  - name: test-separate
    type: make-target
    location: "tests/run.sh separate"
    description: "separate 模式：按 debian/bash-completions、debian/fish-completions、debian/zsh-completions 分别安装补全，校验路径与内容"
    result: PASS

# 消费者视角的包产物断言（test_package/test.sh，10 条）
test_package_tests:
  - file: test.sh
    description: "bin/dh_shell_completions 与 share/perl5/Debian/Debhelper/Sequence/shell_completions.pm 存在性 + 核心标记断言（shebang/Dh_Lib/三 shell 路径/generation 模式/序列注册）"
    command: "test.sh {bin_dir} {pkg_dir}"

assertion_count: 10
