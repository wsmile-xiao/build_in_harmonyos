software: DateTime
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.66/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.66"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# 构建系统（用于验证脚本检查）
build_system: autotools

# ============================================================
# 功能测试结果
# ============================================================

functional_test:
  xs_compile: PASS
  xs_load: FAIL
  reason: "SELinux HMDFS 限制 - 动态库无法从用户目录加载"
  selinux_label: "u:object_r:hmdfs:s0"
  required_label: "u:object_r:hnp_file:s0"
  solution: "需要管理员安装到 /data/service/hnp 系统目录"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/DateTime-1.66.tar.gz"

  # 源码校验和
  sha256: "afabd686fb83d3ebf49ee453974f9122f3eec9b25ff8d2ddf4f12de92af1e5e2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "CCFLAGS=-I~/usr/local/include -D_GNU_SOURCE -fno-strict-aliasing -pipe -fstack-protector-strong"
    - "INSTALL_BASE=~/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - musl/1.2.5 (必需 - 提供 C 库头文件和 off64_t typedef)
    - DateTime::Locale/1.45 (纯 Perl - 已下载)
    - DateTime::TimeZone/2.68 (纯 Perl - 已下载)
    - namespace::autoclean/0.31 (纯 Perl - 已下载，缺 B::Hooks::EndOfScope)
    - B::Hooks::EndOfScope (缺失 - XS 模块，阻塞依赖链)

  # 编译器
  cc: clang
  cxx: clang++

  # 链接参数（Perl XS 模块专用）
  link_flags: "-nostartfiles -nodefaultlibs -lc"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch (自动生成的 Makefile)"

# 平台级修改（不属于软件补丁）
platform_modifications:
  - "~/usr/local/include/bits/alltypes.h: 添加 off64_t typedef"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E112 扩展: musl 缺少 off64_t 类型定义，需要在 alltypes.h 中添加 typedef _Int64 off64_t;"
  - "Perl XS 模块链接: 使用 -nostartfiles -nodefaultlibs -lc 绕过 CRT 文件缺失问题"
  - "glibc/musl 兼容性: Perl 预编译包基于 glibc，其 XS 模块依赖 glibc 特有类型（off64_t）"
  - "E046 SELinux HMDFS: 用户目录上的动态库无法加载，必须安装到系统目录"
  - "参考 perl-dbd-pg 3.18.0 的成功编译经验"

# ============================================================
# 交付物
# ============================================================

deliverables:
  xs_module:
    path: "packaging/DateTime.so"
    size: "21KB"
    format: "ELF shared object, 64-bit LSB arm64"
    signed: true
    selinux_label: "hmdfs:s0"
    loadable: false  # SELinux 限制

  perl_module:
    files: ["DateTime.pm", "DateTime/*.pm"]
    location: "~/usr/local/lib/perl5/site_perl/5.42.0"

  test_report:
    path: "reports/functional-test-report.md"
    status: "XS 编译成功，运行受限"
patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/DateTime-1.66.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/DateTime-1.66.work
  source_orig_hash: c72b1b245be409c6
  source_work_hash: 4f7323d65d0c2901
  generated_at: '2026-06-10T15:32:24'
  patches_count: 1

patch_classification:
  - file: 0001-Makefile.patch
    type: auto
    platform_only: True
    guard: 'pending'
