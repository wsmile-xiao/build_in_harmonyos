software: dump1090-fa
display: "dump1090-fa"
description: "FlightAware 维护的 Mode-S/ADS-B 报文解码器，支持 RTL-SDR 等 SDR 前端，提供 dump1090/view1090/faup1090/starch-benchmark 命令"
category: radio
homepage: "https://github.com/flightaware/dump1090"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建（无 configure 脚本），产物为命令行工具，非库"
    - "interactive.c 无条件 #include <curses.h>，需依赖已发布的 ncurses/6.5 静态包"
    - "OHOS(uname=HarmonyOS) 不匹配 Makefile 的 Linux 分支，LIBS_CURSES 为空，须显式传 -lncursesw 与 ncurses include/lib 路径"
    - "非 Linux 分支下 CPUFEATURES 默认 no → STARCH_MIX=generic，避免 cpu_features 构建复杂度"
    - "上游测试：make test → cprtests（CPR 解码器，55 用例）"
  common_dependencies:
    - ncurses/6.5

versions:
  "8.0":
    status: built
    build_date: "2026-08-16"
    source_url: "https://github.com/flightaware/dump1090/archive/refs/tags/v8.0.tar.gz"
    sha256: "082d09c10d40d0b9675555b9d496280d057f30872f79beda35b1391779f72965"
