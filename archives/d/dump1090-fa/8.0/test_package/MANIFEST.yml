# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: dump1090-fa/8.0
homepage: "https://github.com/flightaware/dump1090"

# Upstream test command (Makefile): `make test` → cprtests (CPR 解码器测试)
upstream_check_command: "make test"

# Upstream tests run in build (make test executed during verification)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
