version: "1.11"
software: "daemontools-encore"
status: built
build_date: "2026-09-11"
build_system: makefile
conan_ref: "daemontools-encore/1.11"

source:
  url: "https://untroubled.org/daemontools-encore/daemontools-encore-1.11.tar.gz"
  sha256: "3bab6cf1de2bdefa607d42a8f50577f2664b6a29b273b98cd0b3b8f7781d8b72"
  tar_format: tar.gz

build:
  system: makefile
  # Configured through the upstream conf-* files exactly as upstream's README
  # documents, so no configure options exist.
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-MAN-optional-setuser.patch: MAN install manifest marks the setuser.8 entry with the installer's own optional prefix because release 1.11 neither ships nor builds setuser.8"

knowledge_gained:
  - "DJB build without patches: the documented conf-cc / conf-ld / conf-bin / conf-man files are the configuration interface, so the recipe writes clang and the Conan toolchain flags there and lets upstream make + ./installer install the 20 programs and man pages"  # knowledge_ref: E6340
  - "HMDFS is case-insensitive: upstream's `make clean` removes everything listed in TARGETS and that list contains `man` and `targets`, so on OHOS it deletes the shipped MAN install manifest (MAN and man are the same inode) and the later `make install` fails with \"No rule to make target 'MAN'\"; use `make -B` instead of `make clean`"  # knowledge_ref: E6340
  - "HMDFS keeps the mode a directory was created with and ignores later chmod: upstream installer.c does mkdir(man8, 0700) + chmod(0755) and the directory stays 2700 owned by the share owner, so the next open inside it fails with `access denied`; pre-creating the manifest directories with a group-accessible mode takes installer.c's EEXIST branch"  # knowledge_ref: E6340
  - "HarmonyOS denies mkfifo(2) and mknod(2) S_IFIFO to user processes (also AF_UNIX bind), so supervise cannot create its supervise/control FIFO and the 9 upstream supervise/svscan cases cannot run; the packaged smoke test probes the capability and otherwise asserts the documented control-channel error"  # knowledge_ref: E074; knowledge_ref: E6340

tests:
  upstream:
    command: "per-case runner: 00-preamble.sh + rts.tests/<case>.sh vs rts.tests/<case>.exp (upstream `make rts` concatenates the same files)"
    cases: 21
    passed: 12
    not_run: 9
    pass_rate: "12/21 executed cases (9 supervise/svscan cases blocked by the device FIFO policy)"
    note: "cases = ls rts.tests/*.exp | wc -l (00-preamble.sh is the harness preamble, zz-cleanup.sh is teardown); the 9 blocked cases all fail with `supervise: fatal: unable to read supervise/control: file does not exist`"
  adapted:
    command: "python3 test_package/test_daemontools.py <package>/bin (run by conan create test_package)"
    cases: 31
    passed: 31
    pass_rate: "31/31 (100%)"

verification:
  w0_dependency_check: pass_no_dependencies
  local_source_check: pass
  native_build: pass_make_b_programs_man
  upstream_tests: partial_12_of_21_fifo_policy_blocks_9
  conan_verify: pass
  w3_clean_build: pass
  test_package: pass_31_of_31
  device_test: pass
