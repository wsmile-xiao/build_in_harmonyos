# conandata.yml — daemontools-encore 1.11
# Single source of truth for the upstream tarball URL and its SHA-256.
# Only the sources: mapping may contain URLs (the CI pre-downloader follows
# every bare http(s) URL in this file).

sources:
  url: "https://untroubled.org/daemontools-encore/daemontools-encore-1.11.tar.gz"
  sha256: "3bab6cf1de2bdefa607d42a8f50577f2664b6a29b273b98cd0b3b8f7781d8b72"

patches:
  "1.11":
    - patch_file: "patches/0001-MAN-optional-setuser.patch"
      patch_description: >-
        MAN install manifest: mark the setuser.8 entry with the installer's own
        '?' optional prefix. Release 1.11 neither ships setuser.8 nor builds it
        (the Makefile man target builds setuidgid.8 while MAN still asks for
        setuser.8) so the unpatched upstream `make install` always aborts with
        "installer: fatal: unable to read setuser.8: file does not exist"
      patch_type: "bugfix"
