    command: "sh runner: 00-preamble.sh + rts.tests/svscan.sh vs rts.tests/svscan.exp"

# test_package tests (consumer perspective, runs the packaged binaries)
test_package_tests:
  - file: test_daemontools.py
    description: "31 assertions over the packaged tools on this device (exactly 34 when the run passes on a FIFO-capable platform): presence of all 20 programs, envdir set/remove/prefix, envini global+section vars, fghack/pgrphack process-group behaviour, setlock contention (-n/-nx), softlimit -c 0 child limit, tai64n/tai64nlocal round trip, multilog log directory + status record + stderr action, svstat/svc/svok/supervise exit codes for unsupervised and missing dirs, and a mkfifo capability probe: where FIFOs are denied it asserts the documented control-channel error, where they are allowed it waits for svup to report the service up (upstream waituntil svup), runs svc -x and asserts the documented transition to svstat reporting supervise not running"
    command: "python3 test_daemontools.py <package>/bin"

# 31 assertions are executed on this device, where mkfifo(2) is denied so the
# capability probe takes the documented-error branch. On a platform that allows
# FIFO creation a PASSING run of the same script executes exactly 34 assertions
# (the control-channel error assertion is replaced by svok-up + svup-up + svc -x +
# the documented `svstat: supervise not running` transition from upstream
# rts.tests/supervise-base.exp). A failing capable-platform run reports 32, 33 or
# 34: a replaced record lowers the total, while a failure recorded in addition to the
# four records keeps it at 34 (all three observed with stubs; the capable branch is
# unreachable on this device - see reports/capable-branch-stub-test.log.md).
assertion_count: 31
