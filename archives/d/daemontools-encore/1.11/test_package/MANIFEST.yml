# test_package/MANIFEST.yml — daemontools-encore 1.11
# CI L0e requires this file to exist.

package: daemontools-encore/1.11
homepage: "https://untroubled.org/daemontools-encore/"

# Upstream regression suite: `make rts` concatenates rts.tests/*.sh into rts.sh,
# runs it under /bin/sh and diffs the combined output against rts.exp (built
# from rts.tests/*.exp).  Number of cases = 21 expected-output files
# (00-preamble.sh is the harness preamble, zz-cleanup.sh is teardown):
#   ls rts.tests/*.exp | wc -l
upstream_check_command: "make -n rts"
upstream_test_in_build: false
upstream_test_command: "make rts"

# Upstream test programs/cases actually driven on the device, one case per
# shell invocation (same files, same comparison as the upstream `rts` target;
# see reports/upstream-tests.md for the per-case runner and raw logs).
upstream_tests:
  - file: rts.tests/envdir.sh
    source: daemontools-encore-1.11/rts.tests/envdir.sh
    description: "envdir: usage, unreadable dir/file, add/remove/prefix variables (1 case)"
    command: "sh runner: 00-preamble.sh + rts.tests/envdir.sh vs rts.tests/envdir.exp"
  - file: rts.tests/envini.sh
    source: daemontools-encore-1.11/rts.tests/envini.sh
    description: "envini: argument check, unreadable file, global/section/prefix variables (1 case)"
    command: "sh runner: 00-preamble.sh + rts.tests/envini.sh vs rts.tests/envini.exp"
  - file: rts.tests/envuidgid.sh
    source: daemontools-encore-1.11/rts.tests/envuidgid.sh
    description: "envuidgid: usage, UID for root, child exec failure (1 case)"
    command: "sh runner: 00-preamble.sh + rts.tests/envuidgid.sh vs rts.tests/envuidgid.exp"
  - file: rts.tests/fghack.sh
    source: daemontools-encore-1.11/rts.tests/fghack.sh
    description: "fghack: usage, child exec failure, backgrounded child (1 case)"
    command: "sh runner: 00-preamble.sh + rts.tests/fghack.sh vs rts.tests/fghack.exp"
  - file: rts.tests/matchtest.sh
    source: daemontools-encore-1.11/rts.tests/matchtest.sh
    description: "multilog line matching engine (1 case)"
    command: "sh runner: 00-preamble.sh + rts.tests/matchtest.sh vs rts.tests/matchtest.exp"
  - file: rts.tests/multilog.sh
    source: daemontools-encore-1.11/rts.tests/multilog.sh
    description: "multilog: actions, wildcards, fnmatch, long lines, status file, timestamps (1 case)"
    command: "sh runner: 00-preamble.sh + rts.tests/multilog.sh vs rts.tests/multilog.exp"
  - file: rts.tests/nonexistent.sh
    source: daemontools-encore-1.11/rts.tests/nonexistent.sh
    description: "svstat/svc/svok/supervise behaviour for new and nonexistent service dirs (1 case)"
    command: "sh runner: 00-preamble.sh + rts.tests/nonexistent.sh vs rts.tests/nonexistent.exp"
  - file: rts.tests/pgrphack.sh
