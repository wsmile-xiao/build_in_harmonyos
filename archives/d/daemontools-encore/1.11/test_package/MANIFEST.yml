  - file: rts.tests/readproctitle.sh
    source: daemontools-encore-1.11/rts.tests/readproctitle.sh
    description: "readproctitle: argument and title-length checks (1 case)"
    command: "sh runner: 00-preamble.sh + rts.tests/readproctitle.sh vs rts.tests/readproctitle.exp"
  - file: rts.tests/setlock.sh
    source: daemontools-encore-1.11/rts.tests/setlock.sh
    description: "setlock: usage, lock creation, non-truncation, -n/-nx contention (1 case)"
