  - file: rts.tests/supervise-stop.sh
    source: daemontools-encore-1.11/rts.tests/supervise-stop.sh
    description: "supervise runs stop and tears down the log service (1 case, blocked on device: mkfifo denied, E074)"
    command: "sh runner: 00-preamble.sh + rts.tests/supervise-stop.sh vs rts.tests/supervise-stop.exp"
  - file: rts.tests/svc.sh
    source: daemontools-encore-1.11/rts.tests/svc.sh
