  - file: rts.tests/supervise-base.sh
    source: daemontools-encore-1.11/rts.tests/supervise-base.sh
    description: "supervise/svok/svup/svstat/svc -x basic cycle (1 case, blocked on device: mkfifo denied, E074)"
    command: "sh runner: 00-preamble.sh + rts.tests/supervise-base.sh vs rts.tests/supervise-base.exp"
