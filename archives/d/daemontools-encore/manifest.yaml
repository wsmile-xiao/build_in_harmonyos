software: daemontools-encore
display: "daemontools-encore"
description: "D. J. Bernstein daemontools 的增强分支：20 个服务监管与日志命令行工具（supervise/svscan/svc/multilog/envdir 等）"
category: system
homepage: "https://untroubled.org/daemontools-encore/"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "DJB 风格构建：无 configure，配置接口是 conf-cc / conf-ld / conf-bin / conf-man 四个文件，配方直接写这些文件而不打补丁"
    - "上游 MAN 清单引用了 1.11 未随发行版提供的 setuser.8（man 目标只生成 setuidgid.8），未修补时 make install 必然失败；补丁用 installer 自带的 '?' 可选前缀标记该行"
    - "HMDFS 大小写不敏感：上游 make clean 会按 TARGETS 清单删除 man/targets，从而删掉 MAN 安装清单与 TARGETS 自身，必须改用 make -B"
    - "HMDFS 目录落盘模式不可再 chmod：installer 用 mkdir(0700)+chmod(0755) 建 man8 目录后自己都写不进去，配方预建该目录走 installer 的 EEXIST 分支"
    - "HarmonyOS 拒绝用户进程创建 FIFO（mkfifo/mknod S_IFIFO 均 EPERM），supervise 的控制通道不可用，上游 21 个回归用例中 9 个 supervise/svscan 用例无法在设备执行"
  common_dependencies: []

versions:
  - version: "1.11"
    status: built
    build_date: "2026-09-11"
    conan_ref: "daemontools-encore/1.11"
