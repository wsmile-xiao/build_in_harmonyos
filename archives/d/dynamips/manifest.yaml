# 软件级 manifest
# 文件位置: archives/d/dynamips/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: dynamips

display: "dynamips"

description: "Cisco router emulation platform"

category: network

homepage: "https://github.com/GNS3/dynamips"

license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "aarch64平台需DYNAMIPS_ARCH=nojit（无JIT重编译支持）"
    - "CMake 4.x需DCMAKE_POLICY_VERSION_MINIMUM=3.5解决兼容性"
    - "需ANY_COMPILER=1跳过gcc/clang编译器检查"
    - "依赖standalone libelf（非elfutils）"

  common_dependencies:
    - libelf
    - libpcap
    - argp-standalone
    - musl-fts
    - musl-obstack

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.2.23":
    status: built
    build_date: 2026-07-16
