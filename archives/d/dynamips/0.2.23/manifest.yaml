software: dynamips
# 版本级 manifest
# 文件位置: archives/d/dynamips/0.2.23/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.2.23"
build_system: cmake
status: published
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/GNS3/dynamips/archive/refs/tags/v0.2.23.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DDYNAMIPS_ARCH=nojit"
    - "-DANY_COMPILER=1"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_PREFIX_PATH=$DEFAULT_PREFIX"
  dependencies:
    - libelf/0.8.13
    - libpcap/1.10.6
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "aarch64平台需DYNAMIPS_ARCH=nojit（无JIT重编译支持） ref:E082"
  - "CMake 4.x需DCMAKE_POLICY_VERSION_MINIMUM=3.5解决兼容性 ref:E081"
  - "需ANY_COMPILER=1跳过gcc/clang编译器检查 ref:E083"
  - "依赖libelf(standalone 0.8.13)和libpcap(1.10.6) ref:libelf"
