software: dhcpcd
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/10.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "10.3.2"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/NetworkConfiguration/dhcpcd/releases/download/v10.3.2/dhcpcd-10.3.2.tar.xz"

  # 源码校验和
  sha256: "b6aa46932074906a9badef1bfe142b8aff9d041c2689e1ef8b74c12e9fd942bd"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires: []

# 构建配置选项
build_options:
  - "autotools；零外部依赖（libc）；config.guess/config.sub OHOS patch；umask 077 修复（E011）"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | failed | skipped | not_run
test_status: passed

# 测试说明
test_note: "上游无独立自动化测试套件（dhcpcd 为运行时 DHCP 守护进程，真实 DHCP 协商需网络环境，OHOS 上按 rule 1.2 声明运行场景）；test_package 校验 dhcpcd 二进制存在 + dhcpcd --version 运行"
