# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: dhcpcd/10.3.2
homepage: "https://roy.marples.name/projects/dhcpcd"

# 上游测试（dhcpcd 为 DHCP 客户端守护进程，无独立自动化测试套件）——
# 本 PR 为 CLI 守护进程，test_package 校验 dhcpcd 二进制存在 + --version 运行
upstream_check_command: "echo \"dhcpcd has no separate automated test suite (runtime DHCP daemon)\""

# conanfile.py build() 中未运行上游测试（无独立测试套件）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: conanfile.py
    description: "校验安装产物：dhcpcd 二进制存在（sbin/ 或 bin/）+ dhcpcd --version 运行"
    command: "test dhcpcd 二进制存在 + --version 运行"

# 断言总数（test_package 1 个断言）
assertion_count: 1
