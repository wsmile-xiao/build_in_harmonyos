software: dawg
display: "Dawg"
description: "DNA Assembly With Gaps：带 indel 的 DNA 序列演化模拟器，按系统发育树生成已知真实比对"
category: utility
homepage: "https://github.com/reedacartwright/dawg"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 CMakeLists.txt 首行 CMAKE_MINIMUM_REQUIRED(VERSION 2.6)，CMake 4.x 已移除 <3.5 兼容策略，须在 cmake.configure() 传 CMAKE_POLICY_VERSION_MINIMUM=3.5（与 Debian 打包同口径）"
    - "词法/语法分析器由 flex/bison 现场生成，src/CMakeLists.txt 缺任一即 SEND_ERROR，须以 tool_requires 提供（CI worker 无系统级 flex/bison）"
    - "CMake 无 OHOS 平台模块，按仓库惯例显式声明 CMAKE_SYSTEM_NAME=Linux"
    - "需两个补丁：0002 把 2009 年代码移植到 C++17（std::auto_ptr → std::unique_ptr、去掉已移除的 std::unary_function 基类，不应用无法编译），0001 刷新过期的测试基准 tests/test0.fasta"
    - "测试基准属上游版本语义漂移而非平台差异：编号 #56 的依据是 Debian 官方包 debian/rules 注释与 Debian 邮件列表归档，原始字节见 archives/d/dawg/1.2/reports/evidence/"
    - "输出按文件名扩展名推断格式，识别短名 fas/nex/phy/aln/poo/txt/out（大小写敏感），\"-o x.fasta\" 会被判 Unknown file format"
  common_dependencies: []

versions:
  "1.2":
    status: built
    build_date: "2026-09-11"
    conan_ref: "dawg/1.2"
