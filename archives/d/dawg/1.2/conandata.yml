sources:
  url: "https://github.com/reedacartwright/dawg/archive/refs/tags/v1.2.tar.gz"
  sha256: "0034d77309e538b34a395916326818a1a0d37cad789819178a905daabb41c9fe"

patches:
  - patch_file: "patches/0001-refresh-stale-test0-golden.patch"
    patch_description: "Refresh the stale tests/test0.fasta golden so the upstream test compares against v1.2's deterministic output; upstream never regenerated the fixture after the v1.0.0 to v1.1 RNG semantics change (tracked as upstream issue 56, attested by the Debian source package debian/rules comment and Debian mailing-list archives archived under reports/evidence/)"
    patch_type: "test"
    patch_strip: 0
  - patch_file: "patches/0002-cxx17-portability.patch"
    patch_description: "Port the 2009-era sources to C++17: replace std::auto_ptr with std::unique_ptr and drop the removed std::unary_function base of LinearFunc while keeping its argument_type/result_type typedefs"
    patch_type: "portability"
