# 版本级 manifest — dawg 1.2
# 文件位置: archives/d/dawg/1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2"
software: "dawg"

# 编译状态: built（conan-verify 通过，未确认 release upload）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-11"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方仓库 tag tarball（与 Debian dawg_1.2.orig.tar.gz 逐字节相同：Debian 源码包
  # 1.2-5 的 orig tarball SHA-256 与本文件记录值一致）
  url: "https://github.com/reedacartwright/dawg/archive/refs/tags/v1.2.tar.gz"
  sha256: "0034d77309e538b34a395916326818a1a0d37cad789819178a905daabb41c9fe"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"   # CMake 4.x 需显式恢复 <3.5 兼容策略
    - "-DCMAKE_SYSTEM_NAME=Linux"            # CMake 无 OHOS 平台模块，按仓库惯例声明
    - "-DBUILD_SHARED_LIBS=OFF"              # R26：终端工具不做动态库交付

  # 编译依赖列表（构建期工具，均来自 ohpcd 制品仓，W0 已用 install --build=never 验证）
  dependencies:
    - "bison/3.8.2"
    - "flex/2.6.4"
    - "m4/1.4.19"

  cc: clang
  cxx: clang++
  cppstd: "17"   # profile 强制；上游 2009 年代码需补丁 0002 才能在 C++17 下编译

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-refresh-stale-test0-golden.patch"
  - "0002-cxx17-portability.patch"

# ============================================================
# 测试
# ============================================================

# 上游测试计数口径（审方 rule4 分母对齐；统计单位 = 测试入口脚本）
# 取数命令：
#   find <src>/tests -maxdepth 1 -type f | sort
#   wc -c <src>/tests/CMakeLists.txt          # 0（CMake 化时未迁移测试，ctest 注册数 0）
upstream_tests:
  total: 1
  passed: 1
  failed: 0
  skipped: 0
  not_run: 0
  unit: "测试入口（脚本）"
  framework: "上游自写 sh 脚本 + diff golden（无 ctest/gtest/pytest）"
  upstream_command: "DAWG=<build>/src/dawg top_srcdir=<src> sh tests/test0.sh"
  note: >-
    上游唯一测试入口 tests/test0.sh（端到端 golden 回归）。基准 tests/test0.fasta 由
    patches/0001 刷新；刷新理由与跨平台证据见 notes.md「上游测试基准过期」。

test_package_assertions: 16

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake 4.x 对 CMAKE_MINIMUM_REQUIRED(<3.5) 的兼容策略检查发生在 CMakeLists 首行，早于 toolchain 注入生效，必须用 cmake.configure(variables=...) 的命令行缓存变量传 CMAKE_POLICY_VERSION_MINIMUM"  # knowledge_ref: E600
  - "上游 golden 基准随版本语义变更失效（非平台差异）时，须先用「未修改源码在第二平台复现同一输出」证明基准过期，再做旧语义还原实验量化 LCP，最后才按实测输出刷新；禁止跳过该入口或不经证明直接刷新"  # knowledge_ref: E576
  - "ohpcd 的 bison/3.8.2 把 pkgdatadir 硬编码为 /share/bison，作为 tool_requires 使用时必须用 BISON_PKGDATADIR 指向包内 share/bison 并配套 m4/1.4.19（与 archives/b/ball 同型）"  # knowledge_ref: E576
  - "dawg 的 -o/File 按输出文件扩展名推断格式且大小写敏感（fas/nex/phy/aln），-o x.fasta 会被判 Unknown file format，且该条上游诊断连 %s 都未格式化"  # reference: upstream src/dawg.cpp:477-491
