# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
#
# 清点口径（2026-09-11 实测，设备 conan create 干净轮）：
#   * v1.2 tarball 的 tests/ 目录只有 1 个可执行测试入口 tests/test0.sh（端到端
#     golden 回归：以固定 Seed 跑 test0.dawg，把程序输出与 tests/test0.fasta 逐字节
#     diff）。取数命令：
#       find dawg-1.2/tests -maxdepth 1 -type f | sort
#       ls -l dawg-1.2/tests/CMakeLists.txt        # 0 字节
#       grep -c add_test dawg-1.2/tests/CMakeLists.txt  # 0（未注册 ctest）
#   * 统计单位：测试入口（脚本）数；上游无单元测试框架（无 ctest/gtest/pytest 注册）。
#   * 上游 TOTAL=1；本 PR 未新增/删除上游用例，适配后 TOTAL 仍为 1。

package: "dawg/1.2"
homepage: "https://github.com/reedacartwright/dawg"

# 上游测试命令（v1.2 的 tests/CMakeLists.txt 是 0 字节空文件，未注册 ctest；
# 上游只在 autotools 时代用 tests/test0.sh，脚本读 top_srcdir/DAWG/DIFF 环境变量）
upstream_check_command: "DAWG=<build>/src/dawg top_srcdir=<src> sh tests/test0.sh"
upstream_test_in_build: true
upstream_test_command: "DAWG=<build>/src/dawg top_srcdir=<src> sh tests/test0.sh"

# 上游实际运行的测试入口
upstream_tests:
  - file: tests/test0.sh
    source: dawg-1.2/tests/test0.sh
    description: >-
      端到端 golden 回归：按 tests/test0.dawg（Newick 树 ((A:0.1,B:0.1)D:0.1,C:0.2)R、
      Lambda=0.1、GapModel=NB、GapParams={1,0.5}、Seed=1000、Format=Fasta）运行模拟，
      把标准输出与 tests/test0.fasta 逐字节 diff；退出码即 diff 结果。
    command: "DAWG=<build>/src/dawg top_srcdir=<src> sh tests/test0.sh"

# 上游测试入口计数（审方 rule4 分母对齐用）
upstream_test_census:
  unit_test_frameworks: 0          # 无 ctest/gtest/pytest 注册
  test_entry_scripts: 1            # tests/test0.sh
  total: 1
  passed: 1
  failed: 0
  skipped: 0
  not_run: 0
  unit: "测试入口（脚本）"
  note: >-
    tests/CMakeLists.txt 为 0 字节（CMake 化时未迁移该测试），因此 ctest 注册数为 0；
    上游唯一入口是 autotools 时代的 tests/test0.sh。基准 tests/test0.fasta 由
    patches/0001 刷新（刷新理由与跨平台证据见版本级 notes.md）。

# test_package 自带的消费者测试（不对上游分母计数，单列）
test_package_tests:
  - file: test.sh
    description: >-
      针对已安装制品 bin/dawg 的 16 项断言：版本横幅/帮助、test0 配置输出与 golden
      逐字节一致、比对结构不变量（5 条等长序列、字母表 ACGT-）、同 seed 两次运行
      一致、换 seed 必变、Nexus/Phylip/Clustal 格式头、GapModel NB/PL/US 合法参数
      产出、PL 非法参数被拒、CLI -o 重定向写出 golden 内容、输入夹具未被改写。
    command: "bash test.sh"
test_package_assertion_count: 16

# 判据实现：test.sh 逐项打印 `[ok] PASS[n]: ...`（失败为 `[fail] FAIL: ...`），末尾打印
# `TEST_PACKAGE_RESULT: PASS 16/16 assertions`；任一断言失败即非 0 退出
# （test_package/conanfile.py 同时校验汇总行存在，防空跑假绿）。
