# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ddpt/0.97
homepage: "https://sg.danny.cz/sg/ddpt.html"

# 上游顶层 Makefile.am 仅有 SUBDIRS=src/doc 与 distclean-local，无 check/test
# 目标，无任何自动化测试注册入口。testing/ 目录含 2 个手动脚本（prepare.sh、
# test_sgl.sh）与 8 个 .jf 作业/数据文件，依赖真实 Linux SCSI/ram 块设备
# （/dev/sg*、/dev/ram*）且写入 /tmp（OHOS 只读，E002），OHOS 环境不可执行。
upstream_check_command: ""

# 上游无可集成的自动化测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测二进制)
# 单一消费者程序 test_ddpt.c，以下按 4 条被测路径分列
test_package_tests:
  - file: test_ddpt.c
    description: "ddpt -V：断言退出码 0 且版本横幅含 0.97"
    command: "./test_ddpt <ddpt-bin>"
  - file: test_ddpt.c
    description: "常规文件→文件拷贝（100000 字节确定性输入，bs=4096）：断言退出码 0、输出大小一致且逐字节相同"
    command: "./test_ddpt <ddpt-bin>"
  - file: test_ddpt.c
    description: "/dev/zero 固定 count 拷贝（bs=4096 count=2）：断言退出码 0、恰为 8192 全零字节"
    command: "./test_ddpt <ddpt-bin>"
  - file: test_ddpt.c
    description: "缺失输入文件：断言非零退出码且输出 unable to access 错误提示"
    command: "./test_ddpt <ddpt-bin>"

# 测试断言总数 (test_ddpt.c 中 check() 调用数)
assertion_count: 10
