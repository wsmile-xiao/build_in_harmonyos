# 软件级 manifest — ddpt
# 遵循 ARCHIVE-SPEC v3.0

software: ddpt
display: "ddpt"
description: "dd 克隆式数据拷贝工具（sg3-utils 家族），支持常规文件与块/sg passthrough 设备间拷贝，含 SCSI 特有扩展与 JF 作业文件模式"
category: storage
homepage: "https://sg.danny.cz/sg/ddpt.html"
license: BSD-3-Clause

build_system: autotools

ohos_adaptation:
  key_points:
    - "release tarball 自带 configure，无需 autoreconf；显式传 --build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos 三元组"
    - "config.guess/config.sub（2020-11-19 版）补 OHOS 三元组支持：HarmonyOS uname 分支（E007）、ohos-linux 映射与 OS/kernel-os 白名单（E072+E122）"
    - "E122 缺口实证：patch-autotools-ohos.pl 不覆盖 kernel-os 校验分支，需手动补 linux-ohos*（已固化进 0002 补丁）"
    - "configure 的 umask 077 → umask 022（E011，HMDFS UID 映射致临时目录不可写）"
    - "上游 testing/ 脚本依赖 Linux SCSI/ram 块设备，OHOS 不可执行；消费者测试以常规文件对拷覆盖"
  common_dependencies: []

versions:
  "0.97":
    status: built
    build_date: 2026-09-11
