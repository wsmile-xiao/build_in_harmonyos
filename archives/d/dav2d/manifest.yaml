software: dav2d
display: "dav2d"
description: "Small and fast AV2 decoder from the VideoLAN project"
category: multimedia
homepage: "https://code.videolan.org/videolan/dav2d"
license: BSD-2-Clause
build_system: meson

ohos_adaptation:
  key_points:
    - "Pure-C Meson profile (enable_asm=false): no NASM needed, checkasm stays out"
    - "Meson machine files need OHOS fixes: ar/ranlib absolute paths, shell-script compiler wrappers, -D_POSIX_C_SOURCE=200809L and -Qunused-arguments in c_args"
    - "Packaged .so files must be re-signed with binary-sign-tool -selfSign 1"
  common_dependencies: []

versions:
  "0.0.1":
    status: built
    build_date: "2026-09-10"
