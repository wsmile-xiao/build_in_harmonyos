# test_package/MANIFEST.yml
# Test declaration for Conan L1 consumer test (dav2d 0.0.1).

package: dav2d/0.0.1
homepage: "https://code.videolan.org/videolan/dav2d"

upstream_check_command: "meson test -v"
upstream_test_in_build: true
upstream_test_command: "meson test -C <build_dir> --print-errorlogs"

upstream_tests:
  - file: "tests/header_test.c"
    source: "dav2d-0.0.1/tests/header_test.c"
    description: "Meson header API tests for common.h, data.h, dav2d.h, headers.h, picture.h, version.h (6 registered tests)"
    command: "meson test -C <build_dir>"
  - file: "tests/checkasm/*"
    source: "dav2d-0.0.1/tests/checkasm"
    description: "checkasm suite identified but not executed in this package profile; requires enable_asm=true plus the external checkasm wrap dependency"
    command: "meson test checkasm"
  - file: "tests/dav2d-test-data"
    source: "external dav2d-test-data repository"
    description: "testdata suite identified but not executed; requires cloning tests/dav2d-test-data and -Dtestdata_tests=true"
    command: "meson test with -Dtestdata_tests=true"
  - file: "tests/libfuzzer/*"
    source: "dav2d-0.0.1/tests/libfuzzer"
    description: "fuzzer binaries are built with the test build but are not registered meson test() entries and need a corpus for meaningful execution"
    command: "not executed (no corpus)"

test_package_tests:
  - file: test_package.c
    description: "Consumer test: include dav2d/dav2d.h, link libdav2d, run version/defaults/open/flush/close lifecycle plus a negative case (7 assertions)"
    command: "./test_package"

assertion_count: 7
