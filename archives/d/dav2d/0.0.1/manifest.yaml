software: dav2d
version: "0.0.1"
status: built
build_system: meson
build_date: "2026-09-10"
conan_ref: "dav2d/0.0.1"

source:
  url: "https://code.videolan.org/videolan/dav2d/-/archive/0.0.1/dav2d-0.0.1.tar.gz"
  sha256: "1b0874984cb29b96f59c8b24f109a5707e4917d2e7d45d57d482ae0473d8c627"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Ddefault_library=shared"
    - "-Denable_asm=false"
    - "-Denable_tools=false"
    - "-Denable_examples=false"
    - "-Denable_tests=true"
    - "-Denable_docs=false"
    - "-Dtestdata_tests=false"
    - "-Dwrap_mode=nodownload"
  ohos_c_args:
    - "-D_POSIX_C_SOURCE=200809L"
    - "-Qunused-arguments"
  cc: clang
  cxx: clang++

patches_applied: []

dependencies:
  system:
    - "pthread"
    - "libm"

verification:
  local:
    - "python -m py_compile conanfile.py test_package/conanfile.py"
    - "git diff --check -- archives/d/dav2d/0.0.1"
  ohos:
    result: pending
    profile: "ohos-aarch64"
    detail: "awaiting HMBS true-device preflight (conan create + meson test + test_package)"
  upstream_tests:
    audit: "tests/meson.build registers one header test per API header (header_test.c x6: common.h, data.h, dav2d.h, headers.h, picture.h, version.h); checkasm needs enable_asm=true plus the external checkasm wrap (disabled in this profile); the testdata suite needs the separate dav2d-test-data repo (testdata_tests=false); libfuzzer binaries build but are not registered meson tests"
    expected_registered: 6
