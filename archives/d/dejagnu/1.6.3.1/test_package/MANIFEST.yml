# test_package/MANIFEST.yml -- dejagnu 1.6.3
# CI L0e requires this file to exist.

package: dejagnu/1.6.3.1
homepage: "https://www.gnu.org/software/dejagnu/"

# dejagnu upstream tests: make check runs runtest on its own testsuite
# DEJATOOL = launcher libdejagnu report-card runtest
upstream_check_command: "make check"
upstream_test_in_build: true
# NOTE: --build/--host triplet is computed at build time by
# _get_gnu_triplet(settings.os, settings.arch) -> aarch64-ohos
upstream_test_command: "make check RUNTESTFLAGS=--build=aarch64-ohos --host=aarch64-ohos"

# Upstream test programs in the tarball
upstream_tests:
  - "testsuite/launcher.all/command.exp"
  - "testsuite/launcher.all/help.exp"
  - "testsuite/launcher.all/interp.exp"
  - "testsuite/launcher.all/verbose.exp"
  - "testsuite/libdejagnu/tunit.exp"
  - "testsuite/report-card.all/onetest.exp"
  - "testsuite/report-card.all/passes.exp"
  - "testsuite/runtest.libs/libs.exp"
  - "testsuite/runtest.main/error.exp"
  - "testsuite/runtest.main/options.exp"
  - "testsuite/runtest.main/pr42399.exp"
  - "testsuite/runtest.main/pr48155.exp"
  - "testsuite/runtest.main/stats.exp"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs runtest --version and dejagnu --version; both are mandatory assertions (each version-string grep failure prints the output and exits 1)"
    command: "bash test.sh"

# Assertion count: 2 mandatory assertions (runtest version string + dejagnu version string); each grep failure exits 1
assertion_count: 2

# ── Upstream test statistics ──
# Distinguish file count vs assertion count to avoid confusion.
#
# exp_file_total: 28  = total .exp files under testsuite/ (includes
#   7 framework/init .exp and 8 nested/ sub-test .exp that are not
#   standalone test entries).
#
# upstream_tests_run: 13  = the 13 test .exp files listed above in
#   upstream_tests that are actually executed by make check.
#
# assertion_count_upstream: 361  = total assertions from make check
#   (359 passed + 2 unresolved, 0 failed).
#
# On OHOS, 2 testcases are unresolved due to expect 5.45.4 spawn/PTY
# limitation (cross-library gap, user-accepted: ACCEPTED_WITH_DECLARED_GAP).
upstream_test_statistics:
  exp_file_total: 28          # find testsuite/ -name *.exp | wc -l
  upstream_tests_run: 13      # count of upstream_tests entries above
  assertion_count_upstream: 361  # 359 passed + 2 unresolved
  passed: 359
  unresolved: 2
  failed: 0
  exit_code: 2
  gap_reason: "OHOS expect 5.45.4 spawn/PTY limitation (cross-library)"
  user_decision: "ACCEPTED_WITH_DECLARED_GAP"
