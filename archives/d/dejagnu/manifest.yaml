software: dejagnu
display: "DejaGnu"
description: "GNU testing framework for running test suites on software tools"
category: build-tool
homepage: "https://www.gnu.org/software/dejagnu/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "主要产物是 Tcl 脚本，不是 ELF 二进制文件"
    - "依赖 expect，需要正确配置 Tcl"
    - "configure 需要应用 E011 umask 022 方案解决 HMDFS 临时文件限制"
  common_dependencies:
    - expect
    - tcl

versions:
  "1.6.3.1":
    status: published
    build_date: "2026-06-15"