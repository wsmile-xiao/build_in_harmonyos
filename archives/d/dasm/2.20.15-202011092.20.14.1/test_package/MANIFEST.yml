# test_package/MANIFEST.yml — dasm 2.20.15-202011092.20.14.1
package: dasm/2.20.15-202011092.20.14.1
homepage: "https://github.com/dasm-assembler/dasm"

# 上游自带完整回归套件：test/run_tests.sh（bash + find/sed/awk/diff）
upstream_check_command: "cd test && bash run_tests.sh -S 7"
upstream_test_in_build: false
upstream_test_command: "cd test && bash run_tests.sh -S 7"
upstream_tests:
  - name: "strict=off 段：对每个 *.bin.ref 汇编并 cmp"
    command: "dasm NAME.asm -f1 -oNAME.bin -LNAME.list.txt -DINEEPROM && cmp NAME.bin NAME.bin.ref"
    cases: 62
    result: "62/62 pass（本包实测 85 OK 中的非 strict 部分）"
  - name: "strict=on 段：对每个 *.fail 加 -S 期望报错并校验错误码"
    command: "dasm NAME.asm -S -f1 -oNAME.bin -DINEEPROM  # 期望非 0 且错误码匹配 .fail 首行"
    cases: 31
    result: "上游既有状态：selftest/ 元测试 7 项 + atari7800/spritesample 1 项未通过"
  - name: "子目录套件 atari2600 / atari7800 / channel-f / cmdline_defs / selftest"
    command: "make -C <subdir>（由 run_tests.sh / test/Makefile 驱动）"
    result: "已含在上面 93 例统计内"

# test_package 自带消费者测试（内嵌 12 个上游用例做逐字节回归比对）
test_package_tests:
  - file: test_dasm.c
    description: >-
      消费者测试 38 条：dasm/ftohex 存在性与可执行位；二者 ELF64-AArch64；
      无参调用打印 "DASM 2.20.14.1" 与 "Usage: dasm sourcefile" 且退出码 ==
      ERROR_COMMAND_LINE(1)；share/dasm/machines/atari2600/vcs.h 与
      share/man/man1/dasm.1 已安装；12 个上游回归用例按 run_tests.sh 同款命令
      汇编并与上游 .bin.ref **逐字节**比对（origin 头 + 机器码）；
      ftohex 转换产物为 Intel HEX（首字符 ':' + EOF 记录 ":00000001FF"）。
    command: "test_dasm <package_folder>"
  - file: test_cases.h
    description: >-
      12 个上游用例的内嵌真值表（.asm 源文本 + .bin.ref 期望字节 + origin），
      由 recipe 作者从上游 test/ 生成后随源码提交，不参与构建逻辑。

# 断言总数：上游 93 + test_package 38
assertion_count: 38
upstream_assertion_count: 93
test_package_result: "38 passed, 0 failed（在真实 OHOS aarch64 制品上实跑）"
upstream_suite_result: "executed 93 tests, 85 OK, 8 failed（8 项均上游既有元测试/既知失败）"
