# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: detachtty/11.0.0
homepage: "https://github.com/cosmos72/detachtty"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: 11.0.0.tar.gz, sha256 bab72f35f31e8eb31f0682f3bb4e652624aca04bf4741a9f4ce478916dc6b1fb)
upstream_test_audit:
  source_tarball: "11.0.0.tar.gz"
  source_sha256: "bab72f35f31e8eb31f0682f3bb4e652624aca04bf4741a9f4ce478916dc6b1fb"
  top_level_files:
    - COPYING        # GPL-2.0 许可证文本
    - ChangeLog      # 变更记录，无测试入口
    - INSTALL        # 仅描述 vi Makefile/make/make install，无测试入口
    - Makefile       # 仅 all/clean/install/deb 目标，无 check/test 目标
    - README         # 功能与用法说明，无测试入口
    - attachtty.c    # 客户端实现，无 TEST / assert 测试代码
    - config.h       # 平台头配置，含 DETACHTTY_VERSION_STR 11.0.0
    - copy-stream.c  # 数据拷贝实现，无测试代码
    - detachtty.1    # man 页
    - detachtty.c    # 服务端实现，无测试代码
    - errors.c       # 错误处理实现，无测试代码
    - forkpty.c      # forkpty 兼容实现，无测试代码
    - forkpty.h      # forkpty 头文件
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / add_test (ctest)"
    - "check_PROGRAMS / TESTS / check target (make check)"
    - "tests/ / test/ 目录"
  scan_result: "0 matches — tarball 顶层仅 13 个文件，无 tests/ 目录、无 *test* 源文件、无任何测试接线"
  reason: "detachtty 11.0.0 为纯 CLI 工具，上游发布包不含任何测试套件"

# 上游测试命令 (无测试套件，故 check 命令不适用)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_detachtty.py
    description: "消费者功能测试：detachtty --version 版本断言 + attachtty 无参用法拒绝 + 真实 unix-socket 端到端连接"
    command: "python3 test_detachtty.py <detachtty_binary> <attachtty_binary>"

# 测试断言总数 (3 个测试用例)
assertion_count: 3
