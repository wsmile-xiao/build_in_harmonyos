software: detachtty
display: "detachtty"
description: "Attach/detach from interactive processes across the network"
category: system
homepage: "https://github.com/cosmos72/detachtty"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Builds the upstream Makefile targets with clang from Conan conf"
    - "Drops upstream -lutil on OHOS: forkpty/openpty live in OHOS musl libc"
    - "Installs detachtty and attachtty into bin/ via DESTDIR plus INSTALL_DIR"
  common_dependencies: []

versions:
  "11.0.0":
    status: built
    build_date: "2026-09-11"
