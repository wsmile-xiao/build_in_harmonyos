# debian-design 3.0.29 — 上游测试状态
#
# Debian 原生数据包：源包里是 blend 的**节点类清单**（nodes/*.yml）、live 安装配置
# 模板（skel/preseed.cfg.in、skel/script.sh.in）与 `Makefile`（组合 + 生成校验和）。
# 没有测试目录、没有测试框架，`debian/rules` 只 include blends-dev 的 blends.mk，
# 也没有 autopkgtest；`Makefile` 的组合步骤依赖**外部**的 `boxer`（不在本包内）。
# 因此上游 N=0（清点证据：无 test/tests 目录、无 check/test 目标、无 debian/tests/）。
upstream_tests:
  total: 0
  passed: 0
  failed: 0
  skipped: 0
  type: "none"

# 完整消费者用例（平台 rule12：鸿蒙特有测试不能只有断言，必须有真正跑通功能/流程的
# 端到端用例）。consumer_design.py 按 live-build / d-i 的取用方式跑完整链路：
#   nodes/*.yml + skel/*.in → content/<node>/{preseed.cfg,script.sh}
#   → content/{MD5SUMS,SHA256SUMS} → 消费方回算校验和 + preseed 指令校验 + script.sh `sh -n`
# 实测（真实上游数据）：4 个节点 → 8 个 live 安装产物；desktop 14 class、
# desktop-animation/graphics/web 各 15 class。
consumer_case:
  file: "test_package/consumer_design.py"
  kind: "end-to-end consumer (nodes + skel templates -> live installer artifacts + checksum manifests, verified as live-build/d-i does)"
  nodes: 4
  artifacts: 8
  checks:
    - "Template Toolkit 子集渲染（IF 块 + 变量）"
    - "MD5SUMS/SHA256SUMS 生成与消费方回算校验"
    - "preseed 指令合法性（含行尾反斜杠续行）"
    - "script.sh 通过 sh -n 语法检查且带节点类清单"

# 适配自检（M=7，非上游用例）：节点/模板齐全、类清单总数、模板占位符仍在、
# Makefile 随包交付、安装纯净性。与上面的消费者用例分列申报。
added_tests:
  framework: "python-unittest-free script (test_package/test_design.py)"
  total: 7
  passed: 7
  failed: 0
  type: "data-integrity"
