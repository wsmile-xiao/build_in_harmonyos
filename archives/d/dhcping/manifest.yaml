software: dhcping
display: "dhcping"
description: "DHCP server testing tool for verifying DHCP server responses"
category: network              # network tools
homepage: "https://packages.debian.org/dhcping"
license: GPL-2.0+
build_system: autotools        # 常用构建系统

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "2002年老软件需要更新 config.guess/config.sub 以支持 HarmonyOS"
    - "configure 临时文件权限问题可绕过（HMDFS 文件系统限制）"
    - "需要 root 权限或 setuid root 才能正常工作（原始套接字访问）"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "1.2":
    status: published             # published | built | failed | archived
    build_date: "2026-06-15"
    published_as: dhcping   # 已编译完成，预编译包可用