software: dfu-programmer
version: "1.1.0"
status: published
build_date: "2026-06-09"
build_system: autotools

source:
  url: "https://github.com/dfu-programmer/dfu-programmer/archive/refs/tags/v1.1.0.tar.gz"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$HOME/usr/local"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CI 远端未发布 libusb/1.0.27，需要使用 $HOME/usr/local/libusb-package 或 $HOME/usr/local 下的预置 libusb"
  - "dfu-programmer configure 可通过 LIBUSB_CFLAGS/LIBUSB_LIBS 和 PKG_CONFIG_PATH 接入系统 libusb"
