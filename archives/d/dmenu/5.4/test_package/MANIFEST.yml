# test_package/MANIFEST.yml
# 上游官方测试声明文件（dmenu 5.4）
#
# 上游测试清点（R51，2026-09-22 DS-33 实测）：
# - 上游 tarball 无 tests/ 目录、无 *test*.c 测试套件源；
# - Makefile 目标仅 all/dmenu/stest/clean/dist/install/uninstall，无 check/test 目标；
# - stest.c 是 dmenu_path 的伴生过滤器工具（suckless "stock testing tool"，
#   按谓词过滤文件），随包安装，不是针对 dmenu 的测试框架，不计入上游用例。
# ⇒ N_static=0（上游无测试），按规则以消费者测试补位（见 test.sh）。

package: dmenu/5.4
homepage: "https://tools.suckless.org/dmenu/"

# 上游无 check/test 目标（实测 make check 报 "No rule to make target 'check'"）
upstream_check_command: ""

# 上游确无测试 ⇒ build() 不集成上游测试（upstream_tests 为空是清点结论，非缺漏）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（N_static=0）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，真实执行被测二进制并断言行为)
test_package_tests:
  - file: test.sh
    description: "dmenu -v 版本断言；dmenu_run/dmenu_path/stest 安装与 PATH 断言；stest -f/-d 谓词行为断言"
    command: "sh test.sh"

# 测试断言总数（test.sh 内 4 组）
assertion_count: 4
