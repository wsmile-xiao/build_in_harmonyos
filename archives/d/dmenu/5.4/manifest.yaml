# 版本级 manifest
# 文件位置: archives/d/dmenu/5.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "5.4"
software: "dmenu"

# published | built | failed | archived
status: built

build_date: "2026-09-22"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://dl.suckless.org/tools/dmenu-5.4.tar.gz"
  sha256: "8fbace2a0847aa80fe861066b118252dcc7b4ca0a0a8f3a93af02da8fb6cd453"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  configure_options: []
  # 裸 Makefile 无 configure；适配变量以 make 命令行覆盖注入：
  #   make CC=<conf 工具链> INCS='<依赖 include 目录>' \
  #        LIBS='<依赖 lib 目录> -lX11 -lfontconfig -lXft' \
  #        XINERAMAFLAGS= XINERAMALIBS= -j1
  # 安装：make install PREFIX=<package_folder> MANPREFIX=<package_folder>/share/man

  dependencies:
    - libx11/1.8.13
    - libxft/2.3.9

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试账本（五维）
# ============================================================

tests:
  upstream_static: 0        # 上游无测试套件（无 tests/ 目录、无 check/test 目标）
  upstream_registered: 0    # 构建系统无可执行测试目标（stest 是伴生工具非测试）
  upstream_executed: 0      # N_static=0 ⇒ 无上游用例可执行
  consumer_tests: 1         # test_package/test.sh（内含 4 组断言）
  consumer_assertions: 4
  unexecuted_reasons: []    # 无未执行项（上游本就无测试）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "裸 Makefile 烧死系统路径（X11INC/X11LIB/FREETYPEINC）+ CC=cc：make 命令行变量覆盖即可零补丁注入 Conan 依赖路径（直接覆盖 INCS/LIBS，绕开三个路径变量）"
  - "X11 生态双版本系冲突：libxft 钉 libx11/1.8.13、libxinerama 钉 libx11/6.4.0（SONAME 风格兼容包，源码同为 1.8.x）⇒ 同图不可共存；对上游可选特性（Xinerama）置空 XINERAMAFLAGS/XINERAMALIBS 禁用（gtk2 同因先例）"
  - "stest 是 suckless 随包安装的文件谓词过滤器（dmenu_path 运行期依赖），不是测试套件；上游 N_static=0 的清点证据须写进 test_package/MANIFEST.yml"
