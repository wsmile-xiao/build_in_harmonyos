# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: dmenu
display: "dmenu"
description: "suckless 的 X11 动态菜单程序：从 stdin 读取选项列表渲染水平菜单栏，配套 dmenu_run（运行器）、dmenu_path（PATH 可执行枚举）、stest（文件谓词过滤器）"
category: tool
homepage: "https://tools.suckless.org/dmenu/"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "裸 Makefile 烧死系统路径与编译器（CC=cc、X11INC=/usr/X11R6/include、FREETYPEINC=/usr/include/freetype2）⇒ conan build() 以 make 命令行变量覆盖（CC/INCS/LIBS/PREFIX/MANPREFIX）注入依赖路径，零补丁"
    - "Xinerama 禁用（XINERAMAFLAGS=/XINERAMALIBS= 置空）：libxinerama 配方钉 libx11/6.4.0 与 libxft 钉的 libx11/1.8.13 同图冲突；上游自带可选特性，gtk2 同因先例"
    - "X11 依赖（libx11/libxft 及其传递依赖 fontconfig/freetype/libxrender/xorgproto）全部来自 ohpcd 制品仓"
    - "上游 install 目标使用 cp -f/mkdir/chmod（toybox 可用），直接以 PREFIX=package_folder 安装"
    - "上游无测试套件（无 check/test 目标，N_static=0）；stest 为 dmenu_path 的伴生工具非测试框架，消费者测试以 dmenu -v + stest 谓词断言补位"

  common_dependencies:
    - "libx11/1.8.13"
    - "libxft/2.3.9"

versions:
  "5.4":
    status: built
    build_date: 2026-09-22
