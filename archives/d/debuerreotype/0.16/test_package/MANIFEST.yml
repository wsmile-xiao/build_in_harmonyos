# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: debuerreotype/0.16
homepage: "https://github.com/debuerreotype/debuerreotype"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: debuerreotype 0.16 tag 归档, sha256 0ace5b5ccb473a1ef3adcd82c3ae474b2fea7fc1c99cf6682218e58c34a5acfa)
upstream_test_audit:
  source_tarball: "debuerreotype-0.16.tar.gz"
  source_sha256: "0ace5b5ccb473a1ef3adcd82c3ae474b2fea7fc1c99cf6682218e58c34a5acfa"
  source_url: "https://github.com/debuerreotype/debuerreotype/archive/refs/tags/0.16.tar.gz"
  top_level_files:
    - VERSION             # 纯文本 "0.16", 无构建/测试目标
    - scripts/            # 11 个 debuerreotype-* Bash 入口 + .constants.sh 等点号 helper, 无测试文件
    - examples/           # debian.sh/ubuntu.sh 等端到端用法示例, 非测试套件
    - Dockerfile          # 确定性构建环境定义, 非测试运行器
    - .validate-debian.sh # 端到端校验驱动 (需 debootstrap + root + 网络), 非单元测试
    - .validate-dockerfile.sh
    - .validate-readme.sh
    - .validate-ubuntu.sh
    - validate            # git submodule 占位 (外部校验仓库引用)
    - .github/workflows/ci.yml  # 仅调用上述端到端 validate 脚本, 无 pytest/ctest/gtest 注册
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "Makefile / CMakeLists.txt / meson.build 测试目标"
    - "make check / ctest / meson test 目标"
    - "find . -name '*test*' (全树)"
  scan_result: "0 matches — 全树无 tests/ 或 test/ 目录; find -name '*test*' 仅命中 .github/workflows/ci.yml 内核对 testing suite 的 Debian 发行版字面引用 (非测试文件); 无 Makefile/CMakeLists/meson 测试目标; 无 gtest/pytest 注册"
  ci_nature: "ci.yml 的 test 矩阵调用 .validate-debian.sh 等脚本做 debootstrap + Docker + snapshot.debian.org 端到端可复现性校验 (固定 TIMESTAMP 的 SHA256 比对 + smoke), 需 root/debootstrap/Docker daemon/公网, 在 OHOS 上不可运行"
  reason: "debuerreotype 0.16 为纯 Bash 脚本工具, 官方源码包不含任何可运行单元测试套件: 无 tests/ 目录、无测试源文件、无构建系统测试目标; 官方 CI 全部为需特权与公网的端到端校验, 不可移植为配方内上游测试; 功能验证由 conanfile build() 自检 (bash -n + debuerreotype-version 实执) 与 test_package 真实执行已安装 Bash 入口 (--version/--help + bash -n) 完成"

# 上游测试命令 (无单元测试套件, 故 check 命令不适用; 可执行自检见 build/test_package)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无单元测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质执行被测包的二进制 (此处为 Bash 入口脚本)
test_package_tests:
  - file: test_debuerreotype.sh
    description: "功能测试: 5 项真实断言 — 入口脚本在 PATH、已安装入口 bash -n、debuerreotype-version 实执输出 0.16、--help 输出核验（version 脚本打印 debuerreotype version 0.16、tar 脚本打印 usage:）、helper 与 VERSION 随包安装"
    command: "bash test_debuerreotype.sh"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 test_debuerreotype.sh 并输出 HMBS 机器证据标记 (test_package discovered=5/passedCount=5 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test_debuerreotype.sh 的 5 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=5 一致)
assertion_count: 5
