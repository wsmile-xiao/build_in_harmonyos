software: debuerreotype
display: "debuerreotype"
description: "可复现、基于 snapshot 的 Debian rootfs 构建器（纯 Bash 脚本，面向 Docker 镜像制作）"
category: tool
homepage: "https://github.com/debuerreotype/debuerreotype"
license: MIT
build_system: none

ohos_adaptation:
  key_points:
    - "纯 Bash 脚本应用，无编译产物（脚本打包路径）；运行时依赖 bash/getopt，OHOS PC 工具链已具备"
    - "安装布局保持上游相对路径语义：bin/ 下入口 + 点号 helper，包根 VERSION 供 _version() 读取"
    - "上游无单元测试套件，官方 CI 全部为需特权与公网的端到端校验，不可移植；功能验证只做脚本可执行性与选项解析"
  common_dependencies: []

versions:
  "0.16":
    status: built
    build_date: "2026-09-12"
    notes: |
      - debuerreotype 0.16（debuerreotype/debuerreotype，纯 Bash rootfs 构建脚本集）
      - bash -n 语法自检 + debuerreotype-version 冒烟（真实走 getopt 解析与 VERSION 读取）通过；test_package 消费者自检 OK
