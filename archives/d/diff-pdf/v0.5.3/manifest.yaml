  - "0002-diff-pdf.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "diff-pdf v0.5.3 requires wxWidgets and poppler-glib which are not available on OpenHarmony"
  - "Replaced wxWidgets with getopt_long for command-line parsing; GUI mode (--view) removed"
  - "Replaced poppler-glib with poppler-cpp C++ API for PDF rendering and comparison"
  - "poppler-cpp uses Splash renderer (not Cairo), but pixel comparison still works correctly"
  - "autotools bootstrap fails on OpenHarmony due to automake issues; custom Makefile used instead"
  - "C++17 required (-std=c++17) for poppler headers using std::optional"

