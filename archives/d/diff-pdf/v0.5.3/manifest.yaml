    - "PREFIX=/storage/Users/currentUser/usr/local"
    - "CXX=clang++"
    - "CXXFLAGS=-fPIC -O2 -std=c++17"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - poppler/23.12.0
    - cairo/system
    - zlib/system

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
