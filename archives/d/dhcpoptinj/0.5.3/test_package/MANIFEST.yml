package: dhcpoptinj/0.5.3
homepage: "https://github.com/misje/dhcpoptinj"

upstream_tests_exist: false
upstream_test_audit:
  - source: "dhcpoptinj-0.5.3 source tree root"
    reason: "No tests/ or test/ directory present; only src/, CMakeLists.txt, README.md."
  - source: "CMakeLists.txt"
    reason: "Defines only add_executable(dhcpoptinj); no enable_testing(), no add_test(), no test targets."
  - source: ".travis.yml"
    reason: "CI script only runs cmake .. and make -j2; no test invocation."
  - source: "src/*.c full-text scan"
    reason: "No TEST/TEST_F/check/munit/cmocka harness strings; test-like hits are ordinary words (latest, contest)."
  - conclusion: "Upstream 0.5.3 ships zero automated tests; adaptation validates via test_package binary checks without claiming upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "Run packaged sbin/dhcpoptinj --help and verify usage text"
    command: "test_dhcpoptinj"
  - file: test.c
    description: "Run packaged sbin/dhcpoptinj --version and verify 0.5.3 string"
    command: "test_dhcpoptinj"
  - file: test.c
    description: "Run packaged binary with invalid queue; require non-silent failure handling"
    command: "test_dhcpoptinj"

test_scenario_count: 3
assertion_count: 3
assertion_count_basis:
  cli_help: 1
  cli_version: 1
  negative_path: 1
