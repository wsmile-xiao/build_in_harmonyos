# debootstrap
# 文件位置: archives/d/debootstrap/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: debootstrap

display: debootstrap

description: Bootstrap a basic Debian system

category: system-tools

homepage: "https://salsa.debian.org/installer-team/debootstrap"

license: MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "纯 POSIX shell 脚本，无编译步骤，无需编译器工具链"
    - "@VERSION@ 占位符在打包时替换为真实版本（同上游 Makefile sed 逻辑）"
    - "通过 DEBOOTSTRAP_DIR 环境变量定位 functions/scripts 数据目录"
    - "与 hugo/turso 等 shell 打包模式一致，进度板命令可用"
  common_dependencies:
    - shell
    - grep
    - sed
    - awk
    - wget

versions:
  "1.0.144":
    status: built
    build_date: "2026-09-10"
    notes: "首次适配，--version 冒烟测试通过"