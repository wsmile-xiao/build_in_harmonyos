patches:
  - patch_file: "patches/0001-usage-printf-no-heredoc.patch"
    patch_description: "Replace usage() heredoc with printf: OHOS /bin/sh is mksh, which creates here-doc temp files in /tmp; OHOS /tmp is read-only and the script unsets TMPDIR at startup, so any heredoc (only used by usage()) dies with 'can't create temporary file ... Read-only file system' under set -e. printf is a shell builtin and needs no temp file; --help output stays byte-identical."
    patch_type: "portability"
