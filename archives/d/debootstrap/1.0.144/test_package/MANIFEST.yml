# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: debootstrap/1.0.144
homepage: https://salsa.debian.org/installer-team/debootstrap

# 上游测试命令
# 上游 Makefile 只有 all/clean/install，无 check 目标；上游测试是 autopkgtest
# 套件 (debian/tests/)，由 run_upstream_tests.sh 直接调用执行。
upstream_check_command: "sh test_package/run_upstream_tests.sh <src_root> <built_debootstrap> <report>"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "sh test_package/run_upstream_tests.sh"

# 上游实际运行的测试程序 (共 5 个 autopkgtest 用例, 由 debian/tests/control 解析得出)
upstream_tests:
  - name: debian-testing-minbase
    command: "./debian/tests/debian-testing minbase"
    restrictions: "allow-stderr, needs-root"
    blocking_reason: "control 声明 needs-root；脚本需 chroot/mknod/runuser/script 与 perl 模块 Debian::DistroInfo, IPC::Run"
  - name: debian-testing-buildd
    command: "./debian/tests/debian-testing buildd"
    restrictions: "allow-stderr, needs-root"
    blocking_reason: "control 声明 needs-root；脚本需 chroot/mknod/runuser/script 与 perl 模块 Debian::DistroInfo, IPC::Run"
  - name: debian-testing-default
    command: "./debian/tests/debian-testing -"
    restrictions: "allow-stderr, needs-root"
    blocking_reason: "control 声明 needs-root；脚本需 chroot/mknod/runuser/script 与 perl 模块 Debian::DistroInfo, IPC::Run"
  - name: unsorted-packages-files
    command: "./debian/tests/unsorted-packages-files"
    restrictions: "allow-stderr"
    blocking_reason: "需 dpkg + python3-flask + python3-requests + python3-debian，且 mitm 用无超时的 requests.get 拉取公网镜像"
  - name: arch-all-support
    command: "./debian/tests/arch-all-support"
    restrictions: "allow-stderr"
    blocking_reason: "需 dpkg + python3-flask + python3-requests + python3-apt，且 mitm 用无超时的 requests.get 拉取公网镜像"

# 上述 blocking_reason 只是「可能缺失的依赖」清单，不是预写结论。
# run_upstream_tests.sh 在每台构建机上真实探测这些依赖：探测全部通过则必须真实
# 执行上游脚本并以真实退出码判定（失败即 build 失败）；只有探测真实失败才记 BLOCKED，
# 并把探测命令的真实输出写进报告。因此 BLOCKED 结论不可手写伪造。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: >-
      对真实制品断言 6 项：(1) bin/debootstrap 存在；(2) 全文无 CR(CRLF 会让
      shebang 变成 /bin/sh^M 而无法执行)；(3) shebang 为 #!/bin/sh 且直接 exec
      成功(不走 sh <script> 兜底)；(4) --version 输出 debootstrap 1.0.144；
      (5) share/debootstrap/functions 存在且 scripts/ 非空；(6) DEBOOTSTRAP_DIR
      指向真实数据目录时 --help 成功、指向不存在目录时失败(rc=2)。
    command: "sh test.sh"
  - file: consumer_e2e.sh
    description: >-
      完整消费者端到端用例 (鸿蒙特有测试)：用本制品 bin/debootstrap 真实执行
      `debootstrap --download-only --no-check-sig --arch arm64 --variant=minbase
      <suite> <target> <file://mirror>` 来下载并校验一个本地构建的最小 apt 归档
      (Release + Packages + pool 载荷)。断言 debootstrap 自己的下载管线真实产出：
      (1) debpaths 列出 required(base-files)+base(apt) 两个包；(2) 对应 .deb 被
      真实下载且通过 Size+SHA256 校验落盘；(3) Release/Packages 索引被真实抓取
      到 $TARGET/var/lib/apt/lists/。不需要 root；wget 缺失时注入 fail-fast stub
      (file:// 下载实际走 debootstrap 的 cp 分支，stub 永不被调用)。
    command: "sh consumer_e2e.sh"
# 测试断言总数 (近似值, 用于质量评估): test.sh 6 项 + consumer_e2e.sh 3 项
assertion_count: 9
