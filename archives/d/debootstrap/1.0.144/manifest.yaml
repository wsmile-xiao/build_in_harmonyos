build:
  system: custom
  configure_options: []
  dependencies: []
  cc: ""
  cxx: ""

patches_applied:
  - "0001-usage-printf-no-heredoc.patch"

knowledge_gained:
  - "debootstrap 为纯 POSIX shell 脚本工具，无需编译，无 autotools 依赖"
  - "上游 Makefile 用 sed 将 @VERSION@ 替换为 debian/changelog 中的版本号，需在打包时做相同替换"
  - "运行时通过 DEBOOTSTRAP_DIR 环境变量定位 functions/scripts，默认 /usr/share/debootstrap 不存在，需注入 package share 目录"
  - "bin/debootstrap + share/debootstrap/{functions,scripts/} 相对布局与 Debian 安装路径一致"
  - "--version 为真实可运行命令，可作 R34 冒烟测试"
  - "OHOS /bin/sh 是 mksh：heredoc 会写 /tmp 临时文件，而 OHOS /tmp 只读；debootstrap 脚本启动即 unset TMPDIR，故 usage() 的 heredoc 使 --help 必死（set -e 下静默 rc=1），--version 无 heredoc 不受影响。printf 内建替代 heredoc 即可，输出字节不变"