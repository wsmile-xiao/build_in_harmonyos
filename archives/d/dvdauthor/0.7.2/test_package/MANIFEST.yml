# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: dvdauthor/0.7.2
homepage: "https://dvdauthor.sourceforge.net/"

# Upstream test command
upstream_check_command: "make check"

# Upstream test suite（规则 4 如实申报）：
# 上游 dvdauthor 0.7.2 无测试套件——tarball 无 tests/ 目录、
# Makefile.am 无 check/TESTS/check_PROGRAMS 目标、上游仓库
# （venam/dvdauthor master/main）无 test/check 文件。
# 上游测试数如实为 0（非少报）。
upstream_tests_total: 0
upstream_tests_passed: 0

# Upstream tests not run in build (no upstream test suite exists)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_dvdauthor.sh
    description: "Run dvdauthor --help to verify tool executes"

# Test assertion count
assertion_count: 1
