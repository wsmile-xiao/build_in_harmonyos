software: datamash
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"
compile_date: "2026-06-09"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/datamash/datamash-1.9.tar.gz"

  # 源码校验和
  sha256: "f382ebda03650dd679161f758f9c0a6cc9293213438d4a77a8eda325aacb87d2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gettext/0.22.5
    - sed/4.9
    - sort/8.32
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.guess.patch (E007 HarmonyOS platform detection)"
  - "0002-build-aux-config.sub.patch (E007 linux-ohos triplet)"
  - "0003-configure.patch (E011 umask 077 → umask 022)"
  - "0004-doc-stamp-vti.patch (auto-generated)"
  - "0005-doc-version.texi.patch (auto-generated)"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: GNU config.guess 不包含 HarmonyOS 检测，需要使用 patch-autotools-ohos.pl"
  - "E011: HMDFS UID 映射导致 umask 077 创建的临时目录不可写，需要修改为 umask 022"
  - "texinfo 模块缺失会导致文档生成失败，使用 make install-exec 只安装可执行文件"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
