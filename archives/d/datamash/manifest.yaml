software: datamash
display: "GNU Datamash"
description: "GNU Datamash is a command-line program which performs basic numerical, textual and statistical operations on input data files"
category: data
homepage: "https://www.gnu.org/software/datamash/"
license: GPL-3.0-or-later
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "需要修复 config.guess/config.sub 支持 HarmonyOS 平台检测"
    - "需要定义 __GNUC_PREREQ 宏（glibc 特有，OHOS 缺失）"
    - "需要设置 gl_cv_header_stdbool_h=yes 绕过 stdbool.h 检测问题"
    - "texinfo 模块缺失时可创建空 info 文件跳过文档生成"
  common_dependencies:
    - gettext
    - sed
    - sort

# 版本索引
versions:
  "1.9":
    status: built
    build_date: "2026-06-09"
    patches_count: 4