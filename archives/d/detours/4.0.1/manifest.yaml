# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Detours 核心功能（函数拦截/hooking）依赖 Windows PE 格式和进程管理，在 HarmonyOS 上完全不可用"
  - "适配仅提供编译链接层面的兼容（Windows API 兼容头文件 + CMake 构建系统），不提供运行时拦截能力"
  - "下游消费者链接此库后，拦截相关 API 将静默返回 stub 值，不应依赖其拦截功能"

# R40: 深度适配验证 — 适配完整性声明
adaptation_scope: "link_only"
adaptation_limitations:
  - "核心运行时功能（函数拦截/hooking）在 HarmonyOS 上不可用"
  - "仅提供编译链接兼容，test_package 验证库链接成功，非功能验证"
  - "下游消费者不应依赖 DetourAttach/DetourTransactionBegin 等拦截 API 的运行时行为"

patch_generation:
