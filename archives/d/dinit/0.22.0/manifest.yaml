software: dinit
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.22.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.22.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/davmac314/dinit/tarball/refs/tags/v0.22.0"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: custom
  system: custom

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

  # 平台特殊说明
  notes:
    - "平台检测为 HarmonyOS，自动禁用 Linux 特有功能（shutdown/cgroups/capabilities/ioprio/oom_adj）"
    - "手动安装替代 make install（缺少 install 命令）"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "鸿蒙缺少 install 命令，使用 cp + chmod 替代（E098）"
  - "dinit 自动检测 HarmonyOS 平台并禁用 Linux 特有功能"
  - "dinit 无外部库依赖，适合嵌入式环境"
  - "SSL 下载问题可用 curl -k -L 手动下载解决"
=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
