# diaspora-installer
# 文件位置: archives/d/diaspora-installer/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: diaspora-installer

display: diaspora-installer

description: Distributed social networking service - installer scripts

category: network

homepage: "https://wiki.debian.org/Diaspora"

license: GPL-2.0-or-later

build_system: custom

ohos_adaptation:
  key_points:
    - "纯 shell 脚本 + 配置模板数据包，无编译步骤（上游说明无二进制构建）"
    - "diaspora-versions.sh 为无副作用版本工具，可通过 CONAN PATH 直接调用"
    - "grantpriv/adduser/initdb 等依赖 Debian 运行时（psql/adduser）,仅分发供装配参考"
    - "runenv 注入 DIASPORA_INSTALLER_DIR 指向配置目录；PATH 注入脚本目录"
  common_dependencies:
    - shell
    - cut
    - grep

versions:
  "0.9.0.0-debian2-nmu1":
    status: built
    build_date: "2026-09-10"
    notes: "首次适配，shell 语法校验 + 版本脚本冒烟测试通过"