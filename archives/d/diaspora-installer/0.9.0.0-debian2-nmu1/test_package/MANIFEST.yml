# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: diaspora-installer/0.9.0.0-debian2-nmu1
homepage: https://wiki.debian.org/Diaspora

# 上游测试命令
# 上游为 shell 安装器脚本，无独立测试套件
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "sh -n 校验全部脚本语法 + 运行 diaspora-versions.sh 断言版本 0.9.0.0 与脚本数量"
    command: "sh test.sh"
# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8