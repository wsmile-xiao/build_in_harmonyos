version: "1.14.10.1"
software: "dbus"
status: built
build_date: "2026-09-08"
conan_ref: "dbus/1.14.10.1"
build_system: "cmake"
source:
  url: "https://dbus.freedesktop.org/releases/dbus/dbus-1.14.10.tar.xz"
  tar_format: tar.xz
build:
  system: cmake
  configure_options:
    - "DBUS_BUILD_TESTS=OFF"
    - "DBUS_BUILD_TOOLS=OFF"
    - "DBUS_ENABLE_DOXYGEN_DOCS=OFF"
    - "DBUS_ENABLE_XML_DOCS=OFF"
    - "DBUS_ENABLE_X11=OFF"
    - "DBUS_ENABLE_SYSTEMD=OFF"
    - "DBUS_ENABLE_SELINUX=OFF"
    - "DBUS_ENABLE_APPARMOR=OFF"
    - "CMAKE_SYSTEM_NAME=OHOS"
  dependencies:
    - expat/2.8.2.1
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-build-aux-config.guess.patch"
  - "0003-build-aux-config.sub.patch"
  - "0004-dbus-CMakeLists.txt.patch"
  - "0005-dbus-daemon-link-expat.patch"
knowledge_gained:
  - "1.14.10.1：在 1.14.10 基础上启用 dbus-daemon 构建与打包（R37 版本后缀）。1.14.10 曾跳过 daemon（OHOS 交叉编译下链接 expat 失败）；1.14.10.1 修复链接后打包 bin/dbus-daemon，供 gtk 测试环境 D-Bus session bus（defaultvalue、tree-relationships 2 项上游测试）"
  - "运行期注意：OHOS HMDFS 拒绝 unix socket bind → session bus 需以 TCP 地址启动（DBUS_SESSION_BUS_ADDRESS=tcp:host=127.0.0.1,port=...），可行性由 gtk 测试复测环节实测"
