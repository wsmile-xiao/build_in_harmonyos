sources:
  "1.14.10.1":
    url: "https://dbus.freedesktop.org/releases/dbus/dbus-1.14.10.tar.xz"
    sha256: "ba1f21d2bd9d339da2d4aa8780c09df32fea87998b73da24f49ab9df1e36a50f"
    tar_format: tar.xz
patches:
  "1.14.10.1":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Disable shared library build (static build for OHOS HMDFS softlink workaround)"
      patch_type: "portability"
    - patch_file: "patches/0002-build-aux-config.guess.patch"
      patch_description: "config.guess: detect OHOS system"
      patch_type: "portability"
    - patch_file: "patches/0003-build-aux-config.sub.patch"
      patch_description: "config.sub: add ohos OS support"
      patch_type: "portability"
    - patch_file: "patches/0004-dbus-CMakeLists.txt.patch"
      patch_description: "dbus/CMakeLists.txt: client library build fixes"
      patch_type: "portability"
    - patch_file: "patches/0005-dbus-daemon-link-expat.patch"
      patch_description: "bus/CMakeLists.txt: link dbus-daemon against expat (config-loader-expat.c XML_Parser* symbols)"
      patch_type: "portability"
