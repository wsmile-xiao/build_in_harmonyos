status: published
build_system: cmake
created_at: 2026-04-28
updated_at: 2026-09-10
knowledge_gained:
  - "OHOS sandbox 禁止 AF_UNIX bind（Operation not permitted），dbus-daemon 会话总线需以 TCP 等价路径验证；恢复条件：目标设备具备 AF_UNIX 权限时使用 unix:tmpdir 监听"
  - "OHOS musl libc 的 getpwuid_r 直接解析只读 /etc/passwd，运行用户 UID 无记录时 dbus-daemon 启动失败；恢复条件：为运行用户建立 passwd 记录"
  - "dbus 顶层 CMake 用标准 find_package(EXPAT)（FindEXPAT 模块），conan CMakeDeps 只提供 expat::expat 目标；需在配方注入 EXPAT_INCLUDE_DIR/EXPAT_LIBRARY/EXPAT_LIBRARIES 使 dbus-daemon 链接成功"
  - "TCP 传输下服务端无法获取对端 UID（SO_PEERCRED 仅 AF_UNIX 有效），默认规则断开；需配置 <allow_anonymous/> + ANONYMOUS 认证完成往返"
