sources:
  url: "https://github.com/facebookincubator/dispenso/archive/refs/tags/v1.5.1.tar.gz"
  sha256: "e75b2a1bd428b2e9558ea99c03d266d2bf8881ba41689016e8c98052e1a0c17d"

patches:
  - patch_file: "patches/0001-capture-exception-at-catch-site.patch"
    patch_description: "Backport upstream 68b6dc3 so Clang shared-library callers capture exception_ptr at the catch site"
    patch_type: "backport"
  - patch_file: "patches/0002-unify-pipeline-inline-depth.patch"
    patch_description: "Backport pipeline portion of upstream 3a1aaa4 so shared-library code uses one exported inline-depth TLS state"
    patch_type: "backport"
  - patch_file: "patches/0003-rethrow-pipeline-exceptions-in-caller.patch"
    patch_description: "Move pipeline exception rethrowing to the header caller for shared-library runtime portability"
    patch_type: "portability"
