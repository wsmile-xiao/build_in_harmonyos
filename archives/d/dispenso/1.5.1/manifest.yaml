    type: backport
    upstream_commit: "68b6dc3189646669dce17573fa91bb3d671ea863"
    reason: "避免 Clang 共享库跨模块捕获当前异常得到空 exception_ptr，并防止随后重抛空指针的未定义行为。"
  - file: "patches/0002-unify-pipeline-inline-depth.patch"
    type: backport
    upstream_commit: "3a1aaa4056474061994a423179573719d58cd3c6"
    reason: "将 pipeline 递归深度 TLS 统一到库内并通过导出访问器读取，确保共享模块使用同一线程状态。"
  - file: "patches/0003-rethrow-pipeline-exceptions-in-caller.patch"
    type: portability
    reason: "让头文件实现的 pipeline 在调用方模块重抛库中捕获的 exception_ptr，避免共享库异常运行时跨模块重抛失效。"

