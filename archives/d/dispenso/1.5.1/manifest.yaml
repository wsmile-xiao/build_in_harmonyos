knowledge_gained:
  - "上游源码共清点 1109 个 GoogleTest 用例；官方稳定自动化集合为 1080 项，集合外含 19 个 flaky 用例及 10 个未由稳定配置实例化或注册的用例。"
  - "OHOS SDK 的 Clang 驱动会对工具链注入但未消费的 --gcc-toolchain 参数发出告警；仅将 unused-command-line-argument 从错误降级即可保留上游其余 -Werror。"
  - "生产库无第三方 Conan 依赖，GoogleTest 必须保持为 test_requires，避免泄漏给消费者。"
  - "Conan 生成的消费目标需同时导出 include 与 include/dispenso/third-party，才能保持上游内嵌 concurrentqueue 的公开包含路径。"
  - "HarmonyOS 专项测试通过 Dispenso ThreadPool 执行任务，并从工作线程调用 OHOS libc 的 pthread_getschedparam，覆盖库与平台线程 ABI 的实际交互。"
  - "Clang 共享库的异常必须在 catch 所在模块捕获为 exception_ptr；已回移上游 68b6dc3，避免跨 DSO 捕获为空造成异常安全路径自旋。"
  - "头文件实现跨共享库边界传播 exception_ptr 时，应在实例化头文件的调用方模块执行 rethrow_exception。"
