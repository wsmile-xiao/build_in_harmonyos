# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dispenso/1.5.1
homepage: "https://github.com/facebookincubator/dispenso"

upstream_check_command: "ctest --test-dir build -N --label-exclude flaky"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error --label-exclude flaky --parallel 4"

upstream_tests:
  - file: "tests/*test.cpp"
    source: "dispenso-1.5.1/tests/*test.cpp"
    description: "30 upstream test translation units contain 1109 GoogleTest cases; 27 units instantiate the 1080-case stable CTest suite, while 19 cases are upstream-labeled flaky and 10 are not materialized by the stable configuration, including shared_pool_test which upstream does not wire into CMake"
    command: "ctest --output-on-failure --no-tests=error --label-exclude flaky"

source_declared_test_files: 30
upstream_inventory_total: 1109
configured_stable_test_files: 27
configured_stable_total: 1080
upstream_outside_stable_total: 29
upstream_excluded_flaky_total: 19
upstream_not_materialized_total: 10

test_package_tests:
  - file: test.cpp
    description: "Consumer test covering version macros, ThreadPool, TaskSet exception propagation, parallel_for, ConcurrentVector, pipeline exception propagation, and the 32-level inline-depth guard through the packaged CMake target"
    command: "ctest --output-on-failure --no-tests=error"
  - file: ohos_thread_runtime.cpp
    description: "HarmonyOS-specific test exercising Dispenso tasks on OHOS pthread workers and validating their scheduler metadata through the OHOS libc ABI"
    command: "ctest --output-on-failure --no-tests=error -R dispenso_ohos_thread_runtime"

consumer_assertion_count: 16
ohos_assertion_count: 5
