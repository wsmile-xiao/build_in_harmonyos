# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: verdict/1.4.5
homepage: "https://github.com/sandialabs/verdict"

# 上游测试命令 (unittests/ 由 CMake 注册到 CTest: UT-unittests_verdict)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试 (GoogleTest, 真机执行)
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (unittests/unittests_verdict)"

# 上游实际运行的测试程序
upstream_tests:
  - file: unittests/verdict.test.cpp
    source: verdict-1.4.5/unittests/verdict.test.cpp
    description: "GoogleTest suite: 67 TEST cases covering edge/tri/quad/tet/hex/wedge/pyramid quality metrics"
    command: "./unittests/unittests_verdict"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_verdict.cpp
    description: "消费者测试：真实调用 verdict 公共 API（7 个解析值断言 + 3 个退化单元比较断言 = 10 项）"
    command: "./test_verdict"

# 测试断言总数 (test_package 10 项 + 上游 67 个 GoogleTest TEST 用例)
assertion_count: 77
