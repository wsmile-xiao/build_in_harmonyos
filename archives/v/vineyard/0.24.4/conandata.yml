# glog is VENDORED: conancenter glog/0.7.1 recipe has a cmake tool_requires that
# pulls conancenter cmake package; that cmake recipe has no OHOS entry in its
# conandata `sources` and fails with KeyError: 'OHOS'. We build from source using
# the same upstream tarball as the adapted repo glog (archives/g/glog/0.7.1).
# See notes.md round-1.
glog:
  url:
    - "https://gh-proxy.com/https://github.com/google/glog/archive/v0.7.1.tar.gz"
    - "https://github.com/google/glog/archive/v0.7.1.tar.gz"
  sha256: "00e4a87e87b7e7612f519a41e491f16623b12423620006f59f5688bfd8d13b08"

patches:
  # CMake 4.x removed support for cmake_minimum_required < 3.5;
  # v6d-0.24.4 uses VERSION 3.3. Bump to 3.22 for compatibility.
  - patch_file: "patches/0002-increase-cmake-minimum-required-to-3.22.patch"
  # RDMA/RPC is Linux-only (needs libfabric). Gate RDMA sources on non-Linux.
  - patch_file: "patches/0003-gate-rdma-rpc-off-non-linux.patch"
  # Skip RPC/RDMA-dependent unit tests on non-Linux platforms.
  - patch_file: "patches/0004-skip-rpc-rdma-tests-non-linux.patch"
  # OHOS (musl) <malloc.h> has no malloc_trim: guard the glibc-only call in
  # src/common/util/env.cc::trim_rss() so the client library compiles on OHOS
  # (whose clang toolchain defines __linux__, taking the glibc branch).
  - patch_file: "patches/0005-guard-malloc_trim-non-ohos.patch"
  # Gate upstream unit tests that need the unbuilt module stacks (basic/io/
  # server/malloc/RPC-RDMA): only the 3 core-compilable tests build/run; the
  # rest are accounted as ohos_feature gaps.
  #
  # NOTE: patch 0006 (fix-test-arrow-availability, round-11) was REMOVED in
  # round-12. It forced find_apache_arrow() into the core-client build gate,
  # which made configure fatally depend on resolving the apache-arrow conan
  # package (Arrow_DIR not found on OHOS). The core vineyard_client and the 3
  # kept tests never include or link arrow, so apache-arrow is not required.
  - patch_file: "patches/0007-gate-module-dependent-tests.patch"
  # Enable ctest at the top level (CMakeLists.txt). Upstream only calls
  # enable_testing() inside test/CMakeLists.txt, so CMake generates a
  # CTestTestfile.cmake only in build/test/ and NOT in the root build dir;
  # `ctest` run from build/Release then reports "No tests were found!!!".
  # Adding enable_testing() at the top level emits the root CTestTestfile.cmake
  # so ctest discovers the 3 kept tests. (Round-16)
  - patch_file: "patches/0008-enable-top-level-testing.patch"
  # The upstream add_test_case macro registers each test with the old-style
  # `add_test(${testname} ${testname})`. Because the test executables are
  # EXCLUDE_FROM_ALL (BUILD_VINEYARD_TESTS_ALL=OFF) and CMAKE_RUNTIME_OUTPUT_
  # DIRECTORY=${PROJECT_BINARY_DIR}/bin, CMake does NOT resolve the bare command
  # name to the built binary's path; ctest then cannot locate the executable and
  # flags every test "***Not Run" (0 assertions actually execute, 0 passed).
  # Switch to new-style add_test with $<TARGET_FILE:${testname}> so the
  # CTestTestfile records the absolute path to each linked test binary and ctest
  # genuinely launches them and reports their real result. (Round-17)
  - patch_file: "patches/0009-add-test-abspath.patch"
