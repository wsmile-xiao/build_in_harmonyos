# conandata.yml — vineyard (v6d) 0.24.4
#
# Main source: Official GitHub Release tarball (v0.24.4 tag).
#   SHA256 matches Homebrew core Formula/v/vineyard.rb:
#   055bab09ca67542ccb13229de8c176b7875b4ba8c8a818e942218dccc32a6bae
#
# Note: vineyard uses git submodules (thirdparty/*) extensively. The official
# GitHub release tarball does NOT include submodule sources (only top-level
# dotfiles). Therefore this recipe vendoring the required submodules in source()
# at the exact commit pinned in the v0.24.4 git tree: zstd / libcuckoo / mimalloc.
# SHA256 values below are computed from the actual commit archives.
#
# Other submodules (etcd-cpp-apiv3 / cpprestsdk / hiredis / redis-plus-plus /
# libfabric / libgrape-lite / boost-leaf / GraphAr / powturbo / DataFrame /
# pybind11) are only needed when enabling corresponding feature modules, which
# are OFF in this round (core client build only), so no vendoring.
#
# Mirror note: GitHub URLs use gh-proxy.com as primary mirror with the original
# URL as fallback. Direct github.com connections timeout on the preflight machine.
# See notes.md round-6 for details.

sources:
  url:
    - "https://gh-proxy.com/https://github.com/v6d-io/v6d/releases/download/v0.24.4/v6d-0.24.4.tar.gz"
    - "https://github.com/v6d-io/v6d/releases/download/v0.24.4/v6d-0.24.4.tar.gz"
  sha256: "055bab09ca67542ccb13229de8c176b7875b4ba8c8a818e942218dccc32a6bae"

