# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file

package: vineyard/0.24.4
homepage: "https://v6d.io"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "v6d-0.24.4.tar.gz (GitHub release v6d-io/v6d v0.24.4)"
  source_sha256: "055bab09ca67542ccb13229de8c176b7875b4ba8c8a818e942218dccc32a6bae"
  build_system: "CMake"
  test_definition: "test/CMakeLists.txt globs test/*.cc (and *.cu when CUDA) into one
    executable each and registers it with add_test(<name> <name>), collected under
    the 'vineyard_tests' custom target. Each test executable is a standalone
    main() program using vineyard's own CHECK / VINEYARD_CHECK_OK assertion macros
    (a failed check aborts with a non-zero exit code, so ctest captures failures)."
  dependency: "core client vendors and builds glog from source; apache-arrow is
    NOT required (the core client and the 3 kept tests never use arrow). The full
    suite needs the complete module stack (basic/io/graph/server, MPI, etcd,
    redis) which is not yet ported to OHOS in this base adaptation round."
  portability_changes:
    - "RDMA/RPC is Linux-only (depends on libfabric). OHOS defines __linux__ via
      its clang toolchain but has no libfabric/RDMA, so src/common/rdma/* +
      src/client/rpc_client.cc are gated out of vineyard_client on non-Linux
      (patch 0003)."
    - "The core-client-only round builds only vineyard_client core + common +
      compression and does not start a vineyardd server. The rest of the
      upstream unit tests cannot pass here: basic/ds -> MPI/boost, io, server,
      malloc, RPC/RDMA -> libfabric, boost/process, DataFrame,
      hosseinmoein-dataframe headers are not present (modules OFF), and the
      compilable core tests version/custom_vector/concurrent_id need a running
      vineyardd via ipc_socket. Only 3 core-compilable, self-contained tests are
      built/run (test/CMakeLists.txt patch 0007 keep-list:
      compressor/concurrent_memcpy/signature); the gated-out tests are reported
      as ohos_feature gaps against the upstream total of 58 ctest entries.
      Apache-arrow is NOT a dependency of this core build: the kept tests and
      the client never include/link arrow (blob.h only forward-declares
      arrow::Buffer), so the round-11 arrow-discovery patch 0006 that forced
      find_apache_arrow() into the client gate (and made configure fatally
      depend on resolving Arrow_DIR on OHOS) was removed in round-12."
  counting_unit: "ctest entry (add_test)"
  verification: "test/*.cc => 58 test executables; gpumalloc_test.cu is appended only
    when USE_CUDA=ON (not the case here). Hence ctest -N lists 58 entries."

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_test_total: 58
upstream_test_count_method: ctest_entries

