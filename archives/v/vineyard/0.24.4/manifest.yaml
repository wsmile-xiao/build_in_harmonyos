# 版本级 manifest
# 文件位置: archives/v/vineyard/0.24.4/manifest.yaml

version: "0.24.4"
software: "vineyard"
status: built
build_date: "2026-09-19"
build_system: "cmake"

source:
  url: "https://github.com/v6d-io/v6d/releases/download/v0.24.4/v6d-0.24.4.tar.gz"
  sha256: "055bab09ca67542ccb13229de8c176b7875b4ba8c8a818e942218dccc32a6bae"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_VINEYARD_SERVER=OFF"
    - "-DBUILD_VINEYARD_GRAPH=OFF"
    - "-DBUILD_VINEYARD_IO=OFF"
    - "-DBUILD_VINEYARD_BASIC=OFF"
    - "-DBUILD_VINEYARD_MALLOC=OFF"
    - "-DBUILD_VINEYARD_CLIENT=ON"
    - "-DBUILD_VINEYARD_PYTHON_BINDINGS=OFF"
    - "-DBUILD_VINEYARD_JAVA=OFF"
    - "-DBUILD_VINEYARD_FUSE=OFF"
    - "-DBUILD_VINEYARD_TESTS=ON"
  dependencies: []
  # glog is VENDORED (built from source), see knowledge_gained / notes.md round-1
  # apache-arrow is NOT a dependency: the core client + kept tests never use arrow
  # (removed round-12, see knowledge_gained)
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-glog-CMakeLists.txt.patch"
  - "0002-increase-cmake-minimum-required-to-3.22.patch"
  - "0003-gate-rdma-rpc-off-non-linux.patch"
  - "0004-skip-rpc-rdma-tests-non-linux.patch"
  - "0005-guard-malloc_trim-non-ohos.patch"
  - "0007-gate-module-dependent-tests.patch"
  - "0008-enable-top-level-testing.patch"
  - "0009-add-test-abspath.patch"

knowledge_gained:
  - "vineyard 大量使用 git submodule (thirdparty/*)；官方 GitHub release 归档不含 submodule 源码，仅顶层 dotfile"
  - "核心 client 构建仍需 vendoring zstd/libcuckoo/mimalloc 三个 submodule（v0.24.4 树内 pinned commit），否则 find_zstd/find_libcuckoo/find_mimalloc 失败"
  - "common/util/status.h 并非引入 apache-arrow：它不含任何 arrow include；只有 server/io/graph 模块与 server-only 源码 include \"arrow/api.h\"。核心 vineyard_client 及 keep-list 的 3 个测试（compressor/concurrent_memcpy/signature）从不 include 或 link arrow（blob.h 仅前向声明 arrow::Buffer）。故本核心构建不需要 apache-arrow（round-12 移除）"
  - "conancenter glog/0.7.1 配方声明 cmake tool_requires，会拉取 conancenter cmake 包；该 cmake 配方 conandata 的 sources 无 OHOS 条目，构建即 KeyError: 'OHOS'"
  - "禁用 conancenter 的官方 CI 上 glog/0.7.1 解析到 ohpcd 的自适配配方（无 cmake tool_requires），但启用 conancenter 的预检环境会解析到 conancenter -> 触发 cmake 构建失败；为对两种情况都健壮，glog 改为配方内 vendoring 源码构建（复用 archives/g/glog/0.7.1 的 tarball/patch/选项），静态链接进 vineyard_client"
  - "BUILD_VINEYARD_BASIC 会执行 find_package(MPI REQUIRED)，OHOS 无 MPI，基础模块需在后续迭代逐步端口"
  - "OHOS 下 CMAKE_SYSTEM_NAME 为 HarmonyOS 而非 Linux，v6d 顶层 CMakeLists 的 Linux 专属块（libfabric/RDMA/rdma 链接）会被跳过，简化移植"
  - "使用 CMAKE_PREFIX_PATH 指向 vendored glog 前缀，使 v6d 自带 FindGlog.cmake(find_library) 能解析 glog 制品；本核心构建不再依赖 find_package(Arrow)"
  - "OHOS 的 clang 工具链定义 __linux__，但 libc 是 musl，非 glibc：凡源码用 #if defined(__linux__) 门控调用的 glibc 专有 API（如 malloc_trim、RDMA 所用的 libfabric 头）在 OHOS 上会编译失败；应改为按 libc 能力判定，如 env.cc::trim_rss() 的 malloc_trim() 用 #if defined(__GLIBC__) 门控（补丁 0005），不引入 __OHOS__ 平台宏（R8）"
  - "round-11 曾用补丁 0006 把 BUILD_VINEYARD_CLIENT 加进 v6d 顶部的 find_apache_arrow() 门控并给测试目标加 Arrow 链接，试图让 test/*.cc（spill_test 等 include \"arrow/api.h\"）能编译。这引入一个致命副作用：core-client 仅构建对 find_package(Arrow) 变成硬依赖，而 Arrow_DIR 在 OHOS 无法解析（CONAN 的 apache-arrow 配置未被 v6d 找到），configure 直接 FATAL 'apache-arrow is required'。round-12 决策：核心 client 与 keep-list 的 3 个测试根本不使用 arrow，因此彻底移除 apache-arrow 依赖与补丁 0006，恢复原始门控，configure 不再对 arrow 做强依赖。"
  - "上游 58 个 ctest 测试里大部分依赖未构建模块（basic/ds->MPI/boost、io、server、malloc、RPC/RDMA->libfabric、boost/process、DataFrame、hosseinmoein-dataframe）或需要运行中的 vineyardd server（version/custom_vector/concurrent_id），在 core-client-only 无 server 的 conan 构建里无法通过；补丁 0007 按 keep-list 只构建 3 个 core 可编译且自含的测试（compressor/concurrent_memcpy/signature），其余以 ohos_feature gaps 如实记账（总数仍 58）。"
  - "glog 0.7.1（vendored）在 OHOS 上：cmake --install 只装入 glog 库而不一定把头文件装入 <prefix>/include/glog；且其 src/glog/*.h 顶部若无 GLOG_USE_GLOG_EXPORT 定义会触发 '#error <glog/logging.h> was not included correctly'（GLOG_EXPORT/GLOG_NO_EXPORT 只由生成的 export.h 提供）。修复（round-14）：_build_vendored_glog 在 install 后把 src/glog/*.h 与 <bdir>/glog/export.h 拷贝到 <prefix>/include/glog/，并在 generate() 给 CMAKE_CXX_FLAGS 追加 -DGLOG_USE_GLOG_EXPORT；3 个保留 test 经 common/util/logging.h 用 glog，client 从不 include glog。"
  - "glog 0.7.1（vendored）的静态库 libglog.a 在 OHOS 上同样可能因 cmake --install 不可靠而未落到 <prefix>/lib（同 round-14 头文件缺失同源），导致 test 链接报 'No rule to make target vendored-glog/install/lib/libglog.a'。修复（round-15）：_build_vendored_glog 在 install 后显式从 glog 构建目录 os.walk 找 libglog.a 并 conan_copy 到 <prefix>/lib/（即 GLOG_LIBRARY 指向的路径），保证 test 链接目标引用的文件存在。"
  - "vineyard 只在 test/CMakeLists.txt（子目录）调用 enable_testing()，CMake 因此只在 build/test/ 生成 CTestTestfile.cmake，顶部 build 目录没有 CTestTestfile.cmake；从 build/Release 顶层运行 `ctest` 时报告 'No tests were found!!!'，ctest 汇总行无法解析 -> 主配方 _run_upstream_tests 抛 RuntimeError。修复（round-16，补丁 0008）：在顶层 CMakeLists.txt 的 project() 后加 enable_testing()，使顶层 CTestTestfile.cmake 生成，ctest 从 build/Release 即可发现 test/ 下的 3 个保留用例。已实测：enable_testing() 只在子目录时顶层 CTestTestfile.cmake 不生成，ctest 顶层无测试；顶层 enable_testing() 后顶层 CTestTestfile 生成，ctest 可发现子目录用例。zstd/mimalloc/libcuckoo 的 add_test 均被 OFF（ZSTD_BUILD_TESTS=OFF/MI_BUILD_TESTS=OFF），不会混入 ctest 计数，ctest 仅含 3 个保留用例。"
  - "round-17（补丁 0009）：vineyard 上游 add_test_case 宏用旧式 `add_test(${testname} ${testname})` 注册测试；因为测试可执行文件是 EXCLUDE_FROM_ALL（BUILD_VINEYARD_TESTS_ALL=OFF）且 CMAKE_RUNTIME_OUTPUT_DIRECTORY=${PROJECT_BINARY_DIR}/bin，CMake 不会把裸命令名解析为已构建二进制的完整路径，ctest 得到的仍是裸名，按 test/ 构建目录+各 config 子目录查找都找不到，于是所有用例报 \"***Not Run\"（0.00 sec，0 断言真正执行，passed=0）。本地 cmake 3.28 最小复现证实：旧式 add_test 在 EXCLUDE_FROM_ALL+自定义 RUNTIME_OUTPUT_DIRECTORY 下生成 `add_test(compressor_test \"compressor_test\")`（裸名，Not Run）；改成 `add_test(NAME ${testname} COMMAND $<TARGET_FILE:${testname}>)` 后 CTestTestfile 生成 `add_test(compressor_test \"/.../build/bin/compressor_test\")`（绝对路径），ctest 真正启动二进制并如实报 Passed/Failed（故意让 signature_test return 1 能被抓到 Failed）。3 个保留测试（compressor/concurrent_memcpy/signature）均为自含用例（无 vineyardd、无外部依赖），运行即真实通过。补丁 0009 即把该宏的 add_test 改成 new-style+TARGET_FILE。"
  - "round-18：上游 3 个保留用例已真跑全过（发现 3/执行 3/通过 3/失败 0）。本轮失败移到 test_package 冒烟用例编译：`test_package/test_package.cpp` 第 24 行以未限定方式调用 `vineyard_version()`，但 `src/common/util/version.h` 中该函数声明在 `namespace vineyard` 内（编译器直接提示 did you mean 'vineyard::vineyard_version'，并给出模板 inline const char* vineyard_version()）。修复：改为 `vineyard::vineyard_version()`，头注释同步限定。未改动任何断言/计数（仍为 version 非空 / Client 构造未 Connected / InvalidObjectID==max 3 项）。"

problem_notes:
  - "round-1：真机预检在依赖构建阶段失败 cmake/3.31.12: KeyError: 'OHOS'。根因：vineyard 的 requires('glog/0.7.1') 在启用 conancenter 时解析到 conancenter 版 glog，其 tool_requires 拉取 conancenter cmake 包，构建 OHOS 平台因无 sources 条目 KeyError。修复：glog 改 vendoring 源码构建（https://github.com/google/glog/archive/v0.7.1.tar.gz，sha256 与仓库自适配 glog 一致），移除 conan requires('glog/0.7.1')，在 build() 内用生成工具链构建 glog 静态库并写入 CMAKE_PREFIX_PATH，不再进入 conan 依赖图。"
