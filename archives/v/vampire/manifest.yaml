software: vampire
display: "Vampire"
description: "High-performance first-order logic theorem prover"
category: science
homepage: "https://github.com/vprover/vampire"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "使用 CMake 构建系统，非 Autotools；ohc-run.py 默认模板需手动改为 CMake"
    - "E092: CMake 不识别 HarmonyOS 平台，需设置 CMAKE_SYSTEM_NAME=Linux"
    - "R26: BUILD_SHARED_LIBS=OFF 静态链接，产物为 ELF static executable"
    - "Vampire 是二进制工具非库，package_info 使用 bindirs 而非 libs"
    - "Conan 2 API: 获取依赖路径用 self.dependencies[name].package_folder"
    - "CMakeToolchain 不能同时在 generators 和 generate() 中声明"
    - "内嵌 CaDiCaL 2.1.3 SAT 求解器和 Minisat，无外部依赖"
  common_dependencies: []

versions:
  "5.0.1":
    status: published
    build_date: "2026-06-29"
