# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: vampire/5.0.1
homepage: "https://github.com/vprover/vampire"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# Vampire 项目不提供 make check / ctest 测试套件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "smoke test: 迧行 vampire --version 验证二进制可用"
    command: "vampire --version"

# 测试断言总数 (近似值)
assertion_count: 1
