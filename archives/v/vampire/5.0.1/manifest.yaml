software: vampire
# 文件位置: archives/v/vampire/5.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "5.0.1"

# 编译状态: published | built | failed | archived
status: published

# 编译日期
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://gh-proxy.com/https://github.com/vprover/vampire/releases/download/v5.0.1/vampire.tar.gz"
  sha256: "3d991c914e9f400641d8b2e4362065c218c0ecb08079b96b0da1714aa6842520"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Vampire 5.0.1 使用 CMake 构建系统，不是 Autotools；ohc-run.py 默认生成的模板需手动改为 CMake"
  - "CMakeToolchain 不能同时在 generators 属性和 generate() 方法中声明，否则 ConanException"
  - "Vampire 是二进制工具而非库，package_info 应使用 bindirs 而非 libs，test_package 应做 smoke test 而非链接测试"
  - "Conan 2 中获取依赖路径用 self.dependencies[name].package_folder，不是 deps_cpp_info（Conan 1 API）"
  - "OHOS 适配版 Conan 2.29.1 自动映射 os=OHOS 到 CMAKE_SYSTEM_NAME=HarmonyOS，无需手动覆盖（旧版 conan 2.12.0 才需要 E092 修复）"
  - "Vampire 内嵌 CaDiCaL 2.1.3 SAT 求解器和 Minisat，无外部依赖"
  - "make -j1 编译约 200 个 C++ 源文件耗时约 944 秒（15.7 分钟）"
  - "CI L0e 检查强制要求 test_package/MANIFEST.yml 存在，需声明上游测试来源"
