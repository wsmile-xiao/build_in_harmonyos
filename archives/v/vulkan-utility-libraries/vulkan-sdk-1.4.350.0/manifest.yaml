software: vulkan-utility-libraries
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/vulkan-sdk-1.4.350.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "vulkan-sdk-1.4.350.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/KhronosGroup/Vulkan-Utility-Libraries/archive/refs/tags/vulkan-sdk-1.4.350.0.tar.gz"

  # 源码校验和
  sha256: "19a215e9469df0749d7c1b389fc667a3f7e160f0b6da71000fadc30140494563"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_TESTS=OFF"
    - "-DVUL_ENABLE_INSTALL=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "vulkan-headers/vulkan-sdk-1.4.350.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "vulkan-utility-libraries 测试套依赖 GTest 和 magic_enum，cmd-pkgs 无预编译包"
  - "CMake 的 'System is unknown' 警告不影响编译结果"
  - "vulkan-utility-libraries 是纯 header+static library 项目，无可执行二进制"
