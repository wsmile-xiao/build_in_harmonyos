# 版本级 manifest — validns 8.00.11.0
# 文件位置: archives/v/validns/8.00.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "8.00.11.0"
software: "validns"
# O5 口径：合并后 release upload 确认才 published；此前一律 built
status: built
build_date: "2026-09-22"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游 DNS-OARC 官方发行物（发行说明 sha256 锚定）。
  # 平台版本 8.00.11.0 = Debian/Ubuntu 8.0+really0.11.0 = 上游 v0.11.0；
  # Debian 等价 orig.tar.xz sha256=a41d5dcfe15c1a922c3f7c4e195d9c59b8f028a9488f486ab981a6dcf244088f
  #（重打包、无生成的 configure，故取上游原始发行物，取数路径见 notes.md）。
  url: "https://www.dns-oarc.net/files/validns/validns-0.11.0.tar.gz"
  sha256: "76d11af7930231bb5914643b5247df69ac85327dc490ba04b3c1bb207697f4e8"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  # 额外参数仅 PERL5LIB（测试用，见 conanfile.py _run_upstream_tests）；
  # configure 参数由 AutotoolsToolchain 提供（--prefix），未加其它开关
  configure_options: []
  dependencies:
    - judy/1.0.5
    - openssl/3.5.6
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# config.guess/config.sub 的 OHOS 三元组适配以配方内 Python 补丁实现
#（conanfile.py _patch_config_for_ohos；tarball 已 bootstrap，无需 autoreconf，
#  2024 版 config.sub 结构与仓库既有 patch 文件锚点不同，故用幂等程序内补丁）
patches_applied:
  - "in-recipe: config.guess OHOS early-branch (conanfile.py _patch_config_for_ohos)"
  - "in-recipe: config.sub linux-ohos triplet acceptance (conanfile.py _patch_config_for_ohos)"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游测试驱动的非 core Perl 模块缺口用 CPAN 官方发行物作为 conandata 第二 source、构建期 PERL5LIB 注入解决，不改动上游脚本（等价 Debian libtest-command-simple-perl <!nocheck>，仅测试面） (knowledge_ref: E661 草稿)"
