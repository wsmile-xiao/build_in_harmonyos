# test_package/MANIFEST.yml — validns 8.00.11.0
# CI L0e requires this file to exist.

package: validns/8.00.11.0
homepage: "https://codeberg.org/DNS-OARC/validns"

# Upstream test contract (src/Makefile.am check target): TAP suite driven by
# perl + three C self-test programs. It runs inside build() via
# `make check` with PERL5LIB pointing at the CPAN Test::Command::Simple
# dist fetched as the second conandata source.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: tap-suite-t-test.pl
    command: "perl -MTest::Harness -e \"runtests('t/test.pl')\" (via make check)"
    expected: "pass; assertions counted from the TAP plan line of the run log"
  - name: test64
    command: "./test64 (base64 self-test, prints 'All N tests successful.')"
    expected: "pass"
  - name: test32hex
    command: "./test32hex (base32hex self-test, prints 'All N tests successful.')"
    expected: "pass"
  - name: testcompose
    command: "./testcompose (textparse self-test, prints 'All N tests successful.')"
    expected: "pass"

# test_package tests (consumer perspective, OHOS-specific binary run)
test_package_tests:
  - file: test.sh
    description: "Runs validns -V (asserts upstream version 0.11.0), validates an unsigned zone single-threaded and with -n2 (pthread path), and checks a bogus RR type is rejected"
    command: "bash test.sh"

assertion_count: 5
