# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 读数来源：上游 test/Makefile.am 的 TESTS 块（静态清点）+ 本次真跑的
# test/test-suite.log 汇总（conanfile.py build() 里的 make check），
# 逐字判决与 5 维账本见 ../notes.md。

package: vcdimager/2.0.1
homepage: "https://www.gnu.org/software/vcdimager/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# true —— build() 里 autotools.make(target="check", args=["-j1"]) 真跑，
# 未加任何 --disable-*、未跳测试、TESTS 分母 8 未缩减。
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（test/Makefile.am 的 TESTS 8 项 + XFAIL_TESTS）
upstream_tests:
  - file: test/check_sizeof.c
    source: vcdimager-2.0.1/test/check_sizeof.c
    description: "sizeof 断言（结构体尺寸）"
    command: "./check_sizeof"
  - file: test/check_bitfield.c
    source: vcdimager-2.0.1/test/check_bitfield.c
    description: "位域布局断言"
    command: "./check_bitfield"
  - file: test/check_nrg.sh
    source: vcdimager-2.0.1/test/check_nrg.sh
    description: "Nero 镜像读写回归：真调 vcdxbuild/vcdxrip/vcd-info 并比对 .right 基准"
    command: "./check_nrg.sh"
  - file: test/check_vcd11.sh
    source: vcdimager-2.0.1/test/check_vcd11.sh
    description: "VCD 1.1 镜像回归：真调 vcdimager 与 vcd-info，比对 cksum 与 .right"
    command: "./check_vcd11.sh"
  - file: test/check_vcd20.sh
    source: vcdimager-2.0.1/test/check_vcd20.sh
    description: "VCD 2.0 镜像回归（同上）"
    command: "./check_vcd20.sh"
  - file: test/check_svcd1.sh
    source: vcdimager-2.0.1/test/check_svcd1.sh
    description: "SVCD 1 镜像回归（同上）"
    command: "./check_svcd1.sh"
  - file: test/testassert.c
    source: vcdimager-2.0.1/test/testassert.c
    description: "断言机制自检；上游 XFAIL_TESTS 自标的预期失败（计 XFAIL 不计通过）"
    command: "./testassert"
  - file: test/testvcd.c
    source: vcdimager-2.0.1/test/testvcd.c
    description: "需物理 CD-ROM 内有 (S)VCD 才执行；无介质时上游自行返回 77 SKIP（实测即 SKIP）"
    command: "./testvcd"

# test_package 中自带的测试 (消费者视角验证)
# 真跑的是 test.sh（conanfile.py 的 test() 只执行 bash test.sh）；
# 原 conan-init 遗留骨架 test.c / CMakeLists.txt（add_executable + add_test 的无条件
# 绿灯）已删除：09-26 审查 🔴 Critical 指其与真正跑断言的 test.sh 并存时，一旦 test 流程
# 走 CMake 就会把 `return 0` 当测试通过（R34 空壳 / R9 伪造通过）。删除后包内只剩
# test.sh 这一条消费者测试入口，读数来源单一。
test_package_tests:
  - file: test.sh
    description: "7 枚安装 CLI 在 conanrun PATH 上真跑：-V 版本自述 2.0.1、vcdxgen 生成 videocd.xml、vcdxbuild 读回该 XML（libxml2 解析面/补丁回归哨兵）、负控制（无参 cdxa2mpeg 与非法选项必须非零退出）"
    command: "/data/service/hnp/bin/bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 17 = test.sh 里 run/grep_check 调用行数，由 conanfile.py 的 _count_assertions()
# 从 test.sh 现数得出（不写死），与实跑的「== 消费者测试汇总：17 项断言，失败 0 项 ==」同源。
assertion_count: 17
