# 版本级 manifest — vcdimager 2.0.1
# 文件位置: archives/v/vcdimager/2.0.1/manifest.yaml

version: "2.0.1"
software: "vcdimager"
status: built
build_date: "2026-09-26"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/vcdimager/vcdimager-2.0.1.tar.gz"
  sha256: "67515fefb9829d054beae40f3e840309be60cda7d68753cafdd526727758f67a"
  tar_format: tar.gz

build:
  system: autotools
  # 全部来自配方 generate()/build() 实测，不是模板默认值
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "PKG_CONFIG_PATH=<generators>:<依赖包 lib/pkgconfig>"
    - "LIBCDIO_CFLAGS / LIBCDIO_LIBS（conan 依赖图绝对路径预置）"
    - "LIBISO9660_CFLAGS / LIBISO9660_LIBS（同上，库名切自 libcdio 合集）"
    - "LIBPOPT_CFLAGS / LIBPOPT_LIBS"
    - "XML_CFLAGS / XML_LIBS"
  dependencies:
    - "libcdio/2.3.0"    # 合集：libcdio + libiso9660 + libudf
    - "popt/1.16"
    - "libxml2/2.15.3.1"
  compiler: clang
  cxx: clang++
  make: "make -j1（含 make check）"

patches_applied:
  - "0001-vcd-xml-common-libxml2-2.15-enc-handler-union.patch"

test:
  upstream_command: "make check"
  upstream_tests_total: 8
  upstream_xfail: 1
  upstream_tests_executed: 7
  upstream_tests_passed: 6
  upstream_tests_xfailed: 1
  upstream_tests_skipped: 1
  upstream_tests_failed: 0
  consumer_assertions: 17
  consumer_passed: 17
  consumer_failed: 0

knowledge_gained:
  - "HMDFS 拒绝构建树 getcwd()：配方侧 Environment 预置 PWD + 钉死 TMPDIR/TMP/TEMP 即绕过（不改源码）；knowledge_ref: archives/v/vcdimager/2.0.1/notes.md:69"
  - "config.status 在新建目录里写 subs1.awk 被拦 → ac_tmp 改指配方预建目录（E114 先例）；knowledge_ref: archives/v/vcdimager/2.0.1/notes.md:54"
  - "制品 --prefix=/ 使依赖 .pc 的 prefix 展开成 `/`、.la 的 libdir 成 `//lib` → 用 PKG_CHECK_MODULES precious var 预置 + E236 la-free 目录；knowledge_ref: 无对应动作行（判据：grep -n -e 'prefix=/' -e 'la-free' -e 'E236' archives/v/vcdimager/2.0.1/notes.md 三式各 0 命中）"
  - "libxml2 2.15 把 xmlCharEncodingHandler.input/output 改成匿名 union：按 4 参 legacyFunc 型调用 2.15 只填的新式 func(void *vctxt,out,outlen,in,inlen,flush) 会参数错位并 SIGSEGV（探针两臂实测 rc=139 vs rc=0），正解是改走 func(<方向>Ctxt, ..., flush=0)；union 两成员同址，判空守卫语义不变；knowledge_ref: archives/v/vcdimager/2.0.1/notes.md:63"
  - "OHOS 的 /usr/bin/diff 是 toybox 软链：configure 探到的绝对路径会被烧进随包发布的测试脚本，修法是用上游支持的 precious var DIFF=<conan 依赖图里的 GNU diffutils 绝对路径> 覆盖 + tool_requires diffutils/3.12；knowledge_ref: archives/v/vcdimager/2.0.1/notes.md:64"
  - "上游 tarball 里预烧好 @VAR@ 的生成物（本包 test/check_common_fn，mtime 2018-01-08）会挡住 configure 覆盖：out-of-tree 下 config.status 只写 build 目录，需把本次生成物搬到脚本 source 的那个位置，搬之前自证内容；knowledge_ref: archives/v/vcdimager/2.0.1/notes.md:65"
  - "requires 用类属性元组声明会让 W0 与 CI 依赖闸失明：ci/scripts/preflight_check.sh 与 ci/conan/build_and_test.sh 的 L0i 分别用正则与 AST，只认 requires()/tool_requires() 调用式；knowledge_ref: archives/v/vcdimager/2.0.1/notes.md:68"
  - "conan 2 里 tool_requires 落在构建上下文，self.dependencies[名字] 只覆盖 host ⇒ 取工具路径要遍历 dependencies.build；knowledge_ref: archives/v/vcdimager/2.0.1/notes.md:66"
  - "L0g 连注释与文档串一起扫 conan download 配 remote 参数的写法：配方里记 W0 证据只记 RC 与 rev，不记 remote 参数名；knowledge_ref: archives/v/vcdimager/2.0.1/notes.md:267"
knowledge_ref:
  - "archives/v/vcdimager/2.0.1/notes.md:69"
  - "archives/v/vcdimager/2.0.1/notes.md:54"
