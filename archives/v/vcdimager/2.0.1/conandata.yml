# conandata.yml — vcdimager 2.0.1
#
# 取源合规（R39）：url 只写**官方原址单值**（GNU 官方发布目录 ftp.gnu.org/gnu/vcdimager/），
# 不手写任何镜像前缀（gh-proxy / ghfast 等），CI 框架自己会加镜像回退；
# 也不用 debian 下游重打包址。
#
# sha256 口径：算的是**归档自身哈希**（tarball 文件本体），不是源码树聚合哈希。
# 实测证据（2026-09-25，构建主机 B，设备原生 curl + sha256sum）：
#   $ curl -sSL -o vcdimager-2.0.1.tar.gz \
#       -w "HTTP=%{http_code} BYTES=%{size_download}\n" \
#       https://ftp.gnu.org/gnu/vcdimager/vcdimager-2.0.1.tar.gz
#   HTTP=200 BYTES=1115207
#   $ sha256sum vcdimager-2.0.1.tar.gz
#   67515fefb9829d054beae40f3e840309be60cda7d68753cafdd526727758f67a
# GNU 该目录**不提供** .sha512/.sha256 校验文件（实测 vcdimager-2.0.1.tar.gz.sha512
# 返回 HTTP=404），故以本机自测哈希为准。

sources:
  url: "https://ftp.gnu.org/gnu/vcdimager/vcdimager-2.0.1.tar.gz"
  sha256: "67515fefb9829d054beae40f3e840309be60cda7d68753cafdd526727758f67a"

patches:
  "2.0.1":
    - patch_file: "patches/0001-vcd-xml-common-libxml2-2.15-enc-handler-union.patch"
      patch_description: "libxml2 2.15 把 xmlCharEncodingHandler 的 input/output 改成匿名 union { func; legacyFunc }：上游 2018 年的 handler->output(...) / handler->input(...) 直调不再合法（invalid operands to binary expression）。union 两成员同址但签名不同——2.15 内部只填新式 func(void *vctxt, out, outlen, in, inlen, flush)，按 4 参 legacyFunc 型调用会参数错位并当场 SIGSEGV（vcdxbuild 全灭），故改为 handler->output.func(handler->outputCtxt, ...) / handler->input.func(handler->inputCtxt, ...) 并补 flush=0"
      patch_type: "portability"
