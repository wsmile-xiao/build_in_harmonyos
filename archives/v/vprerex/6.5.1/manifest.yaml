knowledge_gained:
  - "制品仓 poppler 全部版本以 ENABLE_QT5=OFF / ENABLE_QT6=OFF 发布且无独立 poppler-qt5 包；复用并扩展知识库 E324（poppler-qt5 缺失 → 自建兼容 shim）为 core 变体：poppler 包同时发布 core 头/库，PDFDoc::getLinks()/AnnotLink::getRect()/LinkURI::getURI()/SplashOutputDev 符号均已导出，可直接自建 shim 实现链接注记提取与渲染（poppler-cpp 前端不提供）"
  - "poppler core 头文件要求 C++20+（std::span/std::optional/concepts），poppler 自身按 C++23 构建；包含这些头的 TU 必须单独用 CXX_STANDARD 23 编译（工程级 CMAKE_CXX_STANDARD 会拉低目标级设置，故单独成静态库）"
  - "poppler core 头用引号包含同目录头（goo/gfile.h -> \"poppler-config.h\"），编译需同时给 -I<prefix>/include 与 -I<prefix>/include/poppler"
  - "splashModeXBGR8 的位图内存布局为 [B,G,R,X]（Splash::pipeRunSimpleXBGR8 实测），与 aarch64 小端下 QImage::Format_RGB32 完全一致，可直接包裹无需逐像素转换"
  - "qt5-qtbase/5.15.2.2 链 zlib/1.3.1、poppler 链 zlib/1.3.1.1 → consumer 侧 override 到 1.3.1.1（-fPIC 适配修复版）"
  - "上游 qmake 工程硬编码 /usr/include/poppler/qt5 与 -lpoppler-qt5，交叉编译需自研 CMakeLists；window.ui 需 uic，Q_OBJECT 头需 moc，均用 qt5-qtbase/bin 工具并以 LD_LIBRARY_PATH 指向 qt5 lib 运行"

