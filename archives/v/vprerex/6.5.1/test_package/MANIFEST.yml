# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游 vprerex 6.5.1（CTAN prerex 包的 doc/vprerex-6.5.1.tar.gz）是无测试
# 套件的 Qt5 GUI 应用：源码包共 14 个文件（3 .cpp / 2 .h / 1 .pro / .ui /
# .desktop / .png / .1 / COPYING / ChangeLog / INSTALL / README），
# 无 tests/ 目录、无 CTest/meson test 注册、无 make check 目标
# （唯一构建描述是 qmake 工程 vprerex.pro，只负责编译链接）。
# 按 R34/R40/R51 要求，以 headless smoke + shim 功能测试补全验证。

package: vprerex/6.5.1
homepage: "https://www.ctan.org/pkg/prerex"

# 上游测试命令 (无官方测试套件)
upstream_check_command: "make check / ctest -N（上游为 qmake 工程，无 tests/ 目录与 CTest 注册，输出为空）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "OHOS headless 冒烟 + poppler-qt5 兼容 shim 功能验证：offscreen 平台运行 vprerex --version / --help（QApplication 初始化、参数解析、Qt5 与 shim 装载链路），并用 vprerex --check-pdf selftest.pdf 经 shim 加载 PDF、渲染页面（200x200）并提取链接注记（coord: 3,4）"
    command: "test.sh"
  - file: test_gui_ohos.sh
    description: "鸿蒙特有【真实 GUI 测试】：在 offscreen QPA 平台上构造**真实** QApplication（加载 qt5-qtbase 的 plugins/platforms/libqoffscreen.so 平台插件）+ 真实 MainWindow（ui_window.h）+ 真实 DocumentWidget（QLabel），经 poppler-qt5 shim 加载真实 PDF、跑 Qt 事件循环并 QWidget::grab() 真实渲染整棵控件树；断言页面数=1 且 grab 结果含真实像素（实测 960x1000、nonwhite=867076）。这不是静态断言，而是端到端跑通 GUI 栈（Qt5 Gui/Widgets + QPA 插件 + shim + 渲染）"
    command: "test_gui_ohos.sh"
  - file: selftest.pdf
    description: "631 字节最小 PDF 测试夹具（1 页 200x200 + 1 个 Link 注记，URI=coord: 3,4），供 --check-pdf 与 --check-gui 验证 shim 的文档加载/渲染/链接提取与真实 GUI 渲染"
    command: "vprerex --check-pdf selftest.pdf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
