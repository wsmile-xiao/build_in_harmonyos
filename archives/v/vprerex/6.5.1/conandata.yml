# conandata.yml — vprerex 6.5.1
#
# 官方源：CTAN 的 prerex 宏包（http://www.ctan.org/tex-archive/graphics/prerex）
# 同时收录 prerex.sty / prerex / vprerex 三个组件。vprerex（visual prerex）
# 6.5.1 是其中的 Qt-5 版 GUI 前端，源码 tarball 位于该包的 doc/ 子目录。
# 该 URL 为 CTAN 官方面向镜像服务的稳定地址（https://mirrors.ctan.org/...）。
sources:
  url: "https://mirrors.ctan.org/graphics/prerex/doc/vprerex-6.5.1.tar.gz"
  sha256: "fef226574a214d39d4f09017b29167b4efc24bc9f592d69f56127d7e0d33245b"
  tar_format: tar.gz

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "OHOS 适配：新增 CMakeLists.txt，替换上游 qmake 工程（vprerex.pro 硬编码 /usr/include/poppler/qt5 与 -lpoppler-qt5）；poppler-qt5 shim 以 C++23 单独成静态库"
    patch_type: "portability"
  - patch_file: "patches/0002-main.cpp.patch"
    patch_description: "OHOS 适配：main.cpp 增加无 GUI 入口（--version/--help/--check-pdf），供 test_package 在无显示环境验证 Qt5 + poppler-qt5 shim 链路"
    patch_type: "portability"
  - patch_file: "patches/0003-poppler-qt5.cpp.patch"
    patch_description: "OHOS 适配：新增 poppler-qt5 兼容 shim 实现（poppler-qt5.cpp），在 poppler core API 之上重实现 Document/Page/Link 的加载、Splash 渲染与链接注记提取"
    patch_type: "portability"
  - patch_file: "patches/0004-poppler-qt5.h.patch"
    patch_description: "OHOS 适配：新增 poppler-qt5 兼容 shim 头（poppler-qt5.h），声明 vprerex 实际用到的 Poppler::Document/Page/Link/LinkBrowse 子集"
    patch_type: "portability"
  - patch_file: "patches/0005-main.cpp.patch"
    patch_description: "OHOS 适配：main.cpp 增加真实 GUI 路径自测入口 --check-gui（构造真实 QApplication + Window + DocumentWidget，经 shim 加载 PDF、跑 Qt 事件循环并 grab 渲染结果），供 test_package 在无显示环境端到端验证 GUI 集成"
    patch_type: "portability"
