# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "OHOS libc++ 无 <tr1/memory>，需迁移到 <memory> + std::shared_ptr（C++11 标准）"
  - "OHOS（musl）无 pthread_cancel/pthread_setcancelstate/pthread_testcancel（E127），线程停止需协作式 stop_flag + pthread_join"
  - "OHOS HMFS 不支持 mkfifo 创建 FIFO 特殊文件（/tmp erofs 只读、其余路径 EPERM），依赖 FIFO 的上游测试需自研普通文件测试替代"
  - "FindGnutls.cmake 硬编码 sasl2 静态依赖猜测，OHOS 无 libsasl2，需移除硬编码改用实际找到的库"
  - "gtest ≥1.17 要求 C++17（std::index_sequence），全局 -std=c++11 的目标需单独 target_compile_options -std=c++17"
