sources:
  url: "https://github.com/volkszaehler/vzlogger/archive/refs/tags/v0.8.9.tar.gz"
  sha256: "734fcd78ef5e1a41913fdef627b8382d9c0c04cb99fe023cdb50dc2ad2d972a4"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "curl/gnutls include 目录传播 + HAVE_PTHREAD_CANCEL 检测"
    patch_type: "portability"
  - patch_file: "patches/0002-etc-vzlogger.conf.patch"
    patch_description: "示例配置移除 sml 协议段（config_options 测试兼容）"
    patch_type: "portability"
  - patch_file: "patches/0003-include-Channel.hpp.patch"
    patch_description: "Channel: _stop_requested 协作式停止标志 + stopRequested()（替代 pthread_cancel）"
    patch_type: "portability"
  - patch_file: "patches/0004-include-MeterMap.hpp.patch"
    patch_description: "MeterMap: _stop_requested 协作式停止标志 + stopRequested()"
    patch_type: "portability"
  - patch_file: "patches/0005-include-Options.hpp.patch"
    patch_description: "lookup_string_tolower 返回 std::string（clang15 -Wreturn-stack-address）"
    patch_type: "portability"
  - patch_file: "patches/0006-include-shared_ptr.hpp.patch"
    patch_description: "tr1/memory 迁移到 <memory> + std::shared_ptr（OHOS libc++ 无 TR1）"
    patch_type: "portability"
  - patch_file: "patches/0007-include-threads.h.patch"
    patch_description: "CANCELLABLE/_safe_to_cancel/_cancellable_sleep 增加 HAVE_PTHREAD_CANCEL 兼容分支"
    patch_type: "portability"
  - patch_file: "patches/0008-modules-FindGnutls.cmake.patch"
    patch_description: "移除 sasl2 硬编码静态依赖猜测（OHOS 无 libsasl2）"
    patch_type: "portability"
  - patch_file: "patches/0009-src-Channel.cpp.patch"
    patch_description: "Channel 构造函数初始化 _stop_requested"
    patch_type: "portability"
  - patch_file: "patches/0010-src-CurlSessionProvider.cpp.patch"
    patch_description: "pthread_testcancel 改为 _safe_to_cancel（经兼容层）"
    patch_type: "portability"
  - patch_file: "patches/0011-src-MeterMap.cpp.patch"
    patch_description: "MeterMap::cancel 协作式停止（pthread_cancel 守卫 + stop_requested）"
    patch_type: "portability"
  - patch_file: "patches/0012-src-Options.cpp.patch"
    patch_description: "lookup_string_tolower 实现返回 std::string"
    patch_type: "portability"
  - patch_file: "patches/0013-src-protocols-MeterRandom.cpp.patch"
    patch_description: "RAND_MAX 显式 float 转换（clang15 -Wimplicit-const-int-float-conversion）"
    patch_type: "portability"
  - patch_file: "patches/0014-src-threads.cpp.patch"
    patch_description: "reading/logging 线程主循环 stopRequested 检查 + MQTT &*it 恒真修复"
    patch_type: "portability"
  - patch_file: "patches/0015-tests-CMakeLists.txt.patch"
    patch_description: "gtest/gmock include 路径传播 + C++17（gtest 1.17 要求）"
    patch_type: "portability"
  - patch_file: "patches/0016-tests-mocks-CMakeLists.txt.patch"
    patch_description: "mock 目标 gtest include + C++17（gtest 1.17 要求）"
    patch_type: "portability"