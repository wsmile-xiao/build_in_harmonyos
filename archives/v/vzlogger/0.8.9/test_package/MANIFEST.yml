# test_package/MANIFEST.yml
# vzlogger 0.8.9 测试声明

package: vzlogger/0.8.9
homepage: "https://github.com/volkszaehler/vzlogger"

# 上游测试命令
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 中是否已集成上游测试（本配方 build 仅 configure+build；
# 上游测试已在适配期手动执行并记录于 notes.md/test-report.md）
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（CMake/CTest 注册）
upstream_tests:
  - file: tests/main.cpp
    source: vzlogger-0.8.9/tests/main.cpp
    description: "gtest 单元测试集（43 用例：32 通过 + 11 平台限制运行失败）"
    command: "./vzlogger_unit_tests"
  - file: tests/mocks/mock_metermap.cpp
    source: vzlogger-0.8.9/tests/mocks/mock_metermap.cpp
    description: "MeterMap mock 测试"
    command: "./mock_metermap"
  - file: tests/mocks/mock_MeterW1therm.cpp
    source: vzlogger-0.8.9/tests/mocks/mock_MeterW1therm.cpp
    description: "W1therm 温度传感器 mock 测试"
    command: "./mock_MeterW1therm"
  - file: tests/mocks/mock_MeterS0.cpp
    source: vzlogger-0.8.9/tests/mocks/mock_MeterS0.cpp
    description: "S0 脉冲计数器 mock 测试"
    command: "./mock_MeterS0"

# test_package 自带测试（消费者视角验证）
test_package_tests:
  - file: conanfile.py
    description: "--version 冒烟（输出 0.8.9）"
    command: "vzlogger --version"
  - file: conanfile.py
    description: "--help 冒烟（列出 file/s0/d0/random/exec/fluksov2/w1therm 协议）"
    command: "vzlogger --help"

# 测试断言总数（精确值，与 test_package/conanfile.py 的 assert 数一致）
assertion_count: 2