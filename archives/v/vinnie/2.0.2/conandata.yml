patches:
  - patch_file: "patches/0001-jdk17-source-target.patch"
    patch_description: "Raise pom.xml <java.version> from 1.5 to 1.8. JDK 9+ removed support for -source/-target 1.5; JDK 17 javac rejects 'Source option 5 is no longer supported. Use 7 or later.', which makes maven-compiler-plugin:2.3.2 fail during the compile goal and aborts 'mvn clean package' (exit 1) before the upstream Surefire/JUnit suite runs. 1.8 is the lowest widely-compatible baseline that JDK 17 still supports."
    patch_type: "portability"
  - patch_file: "patches/0002-surefire-open-jdk17.patch"
    patch_description: "Pin maven-surefire-plugin:2.22.2 (default Maven 3.6.3 surefire is too old for JDK 17) and set argLine --add-opens java.base/java.lang,java.util,java.lang.reflect,java.io,java.net=ALL-UNNAMED. The upstream JUnit tests use Mockito 1.10.19 (spy/inOrder/verify), which relies on CGLIB/Objenesis deep reflection into JDK internals; JDK 9+ strong encapsulation would otherwise raise InaccessibleObjectException/IllegalAccessError in Surefire and fail the test phase. The --add-opens flags restore the class/member access Mockito needs so the 112-method JUnit suite can actually execute."
    patch_type: "portability"
