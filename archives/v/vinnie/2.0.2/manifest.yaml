version: "2.0.2"
software: "vinnie"
status: built
build_date: "2026-09-19"
conan_ref: "vinnie/2.0.2"

source:
  url: "https://github.com/mangstadt/vinnie/archive/refs/tags/2.0.2.tar.gz"
  sha256: "aabcd1dafce25662e67981813d6b274046205d8660c86f6b164cab1acee411c3"
  tar_format: tar.gz

build:
  system: maven
  configure_options:
    - "clean package"
    - "-DskipTests=false"
  dependencies:
    - "BiSheng JDK 17.0.13 (cmd-pkgs install-jdk.sh)"
    - "Maven 3.6.3 (cmd-pkgs install-maven.sh)"
  cc: ""
  cxx: ""

patches_applied:
  - "0001-jdk17-source-target.patch: raise pom <java.version> 1.5 -> 1.8 (JDK 17 javac rejects -source/-target 1.5, blocking compile phase)"
  - "0002-surefire-open-jdk17.patch: pin maven-surefire-plugin 2.22.2 + --add-opens argLine (Mockito 1.10.19/CGLIB needs JDK internals on JDK 17)"

upstream_tests:
  framework: "JUnit 4.12 (org.junit.Test) via maven-surefire-plugin"
  test_files: 7
  test_methods: 112
  test_command: "mvn clean package -B -DskipTests=false"
  run_in_build: true

knowledge_gained:
  - "源码编译方式：下载 GitHub tarball (mangstadt/vinnie tag 2.0.2)，用 Maven 编译"
  - "上游测试：112 个 @Test 方法（JUnit 4.12），7 个测试 .java 文件"
  - "build() 中运行 mvn clean package 执行上游 JUnit 测试并产出 JAR"
  - "vinnie 2.0.2 tarball 无 mvnw wrapper，需系统 mvn 或 cmd-pkgs 安装 Maven 3.6.3"
  - "test_package 通过 Java API 调用验证 JAR 功能（真机运行）"
  - "R32: validate() 检查 settings.os in (Linux, OHOS)"
  - "R38: 库包，不需要 commands.json"
  - "vinnie 是纯 Java 库，无 native code/Unsafe 反射问题，无需 .patch 文件"
