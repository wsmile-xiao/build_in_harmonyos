# test_package/MANIFEST.yml
# Upstream test declaration file for vinnie 2.0.2
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: vinnie/2.0.2
homepage: "https://github.com/mangstadt/vinnie"

# Upstream tests run via Maven Surefire (mvn clean package -B, package phase includes test)
# Upstream test framework: JUnit 4.12 (org.junit.Test)
upstream_check_command: "mvn clean package -B -DskipTests=false"
upstream_test_in_build: true
upstream_test_command: "mvn clean package -B -DskipTests=false"

# Upstream test total & counting method (hmbs rule4 hard gate)
