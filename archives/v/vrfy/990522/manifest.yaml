knowledge_gained:
  - "OHOS bionic 的 <resolv.h> 提供 struct __res_state 与 res_search/dn_expand/dn_skipname，但**不导出** BIND 的 `_res` 与内部函数 `_getshort` → 需自备兼容实现"
  - "glibc 的 sys_errlist/sys_nerr 在 bionic 不存在 → 统一改 strerror()"
  - "BSD rindex 在 bionic 缺失 → 老包常自带 `#define rindex strrchr`（如 port.h SYSV_STRCHR 开关），编译时打开即可"
  - "1998 年的 K&R C 需 `-std=gnu89` + 放宽 -Wimplicit-function-declaration/-Wdeprecated-non-prototype 等告警"
  - "上游无测试（N=0）的小 CLI 适配成本低、rule4 不触发"
