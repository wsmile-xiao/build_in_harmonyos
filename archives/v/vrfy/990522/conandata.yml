patches:
  - patch_file: "patches/0001-strerror-instead-of-sys-errlist.patch"
    patch_description: "stat.c uses the glibc-specific `sys_errlist`/`sys_nerr` arrays to map errno values to messages; OHOS libc (bionic) does not provide them, so the build fails with 'use of undeclared identifier sys_errlist/sys_nerr'. Use the standard strerror() instead (which also handles unknown errno values)."
    patch_type: "portability"
