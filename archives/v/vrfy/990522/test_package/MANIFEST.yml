# test_package/MANIFEST.yml
# vrfy 990522.

package: vrfy/990522
homepage: https://packages.debian.org/vrfy

upstream_tests_exist: false
upstream_test_audit: "Upstream (1998) ships C sources and a hand-written Makefile with only all/install/man/clean/lint/dist targets; there is no test suite (no make check / ctest)"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_vrfy.sh
    description: "runs the installed vrfy: -V version output and the usage text when no address is given"
    command: "sh test_vrfy.sh"

test_files:
  - path: "test_package/test_vrfy.sh"
    test_type: "R34"
    assertion_count: 2

test_package_test_count: 1
consumer_assertion_count: 2
assertion_count: 2
