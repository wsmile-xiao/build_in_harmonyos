software: vrfy
display: "vrfy"
description: "邮件地址校验工具：连接目标域 SMTP 服务器执行 VRFY/EXPN，并结合 DNS MX 与语法检查"
category: tool
homepage: "https://packages.debian.org/vrfy"
license: BSD-3-Clause
build_system: make

ohos_adaptation:
  key_points:
    - "1998 年的 K&R 风格 C 程序；用 `-std=gnu89` 并放宽告警（-Wno-implicit-function-declaration 等）才能被 clang 15 接受"
    - "stat.c 用 glibc 专有的 `sys_errlist`/`sys_nerr`，bionic 无 → 补丁改用标准 `strerror()`"
    - "mxrr.c 用 BIND 内部符号 `_getshort`，且多处置 `_res.options`；bionic 不导出 `_res`/`_getshort` → 新增 `ohos_compat.c` 提供 `_res` 与本地 `_getshort`（大端 16 位读取）；`res_search`/`dn_expand`/`dn_skipname` 由 bionic libc 提供"
    - "BSD `rindex()` 在 bionic 缺失 → 以 `-DSYSV_STRCHR` 启用 port.h 的 `#define rindex strrchr`"
    - "Makefile 默认链接 `-lresolv`，OHOS 无该库 → `make RES= LIBS=` 覆盖"
    - "上游无测试套件（只有 all/install/man/clean/lint/dist）→ rule4 N=0 不触发"
    - "构建环境无 install(1) → package() 手工拷贝；CLI 工具提供软件级 commands.json"

versions:
  "990522":
    status: built
    build_date: "2026-09-21"
    conan_ref: "vrfy/990522"
