name: vgmplay
version: 0.52.0
description: "Command-line VGM (Video Game Music) player, libvgm-based (VGM/VGZ, S98, DRO, GYM)"
homepage: "https://github.com/ValleyBell/vgmplay-libvgm"
license: "GPL-2.0-or-later"
build_system: "CMake"
cpp_standard: "C++14"

status: "pre-adaptation"

source:
  url: "https://github.com/ValleyBell/vgmplay-libvgm/archive/refs/tags/0.52.0.tar.gz"
  sha256: "dd48e2d971ff8e03c749abbc693a41167a3541169f45689632ca4152d33da820"

dependencies:
  conan:
    - libvgm/g20260121
    - inih/r58
  system:
    - pthread
    - m
    - iconv (musl libc 内建, 经 libvgm 传递)

features_disabled:
  - MEDIA_CONTROLS (OHOS 无 D-Bus 开发包；上游 WIN_KEYS/WIN_SMTC 为 Windows 专有)
  - bundled libs/inih (submodule 不在 release tarball，改用 Conan inih/r58)
  - bundled libvgm submodule (改用 Conan libvgm/g20260121)

platform:
  os: [Linux, OHOS]
  arch: [aarch64]

notes: |
  - vgmplay 0.52.0 = ValleyBell/vgmplay-libvgm tag 0.52.0，基于 libvgm 的命令行播放器
  - 上游 archive 不含三个 submodule（libvgm、libs/inih、libs/wingetopt）；
    libvgm 与 inih 由 Conan 依赖提供，wingetopt 仅 MSVC 使用
  - patch 0001：(a) inih 检测优先 find_package(inih CONFIG) → inih::inih；
    (b) 链接聚合 target libvgm::libvgm 替代上游 submodule 导出的四个分库 target
  - 上游无自动化测试套件；非交互自检入口 --version / --lib-info 见 test_package
  - 运行时限制：musl iconv 无 CP932，S98 标签转换降级（继承自 libvgm，VGM 主格式不受影响）
  - OHOS 上音频播放需声卡设备，本轮仅验证非交互 CLI（--version/--lib-info）可执行
