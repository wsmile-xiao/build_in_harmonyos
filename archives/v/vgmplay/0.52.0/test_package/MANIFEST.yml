# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: vgmplay/0.52.0
homepage: "https://github.com/ValleyBell/vgmplay-libvgm"

# 上游测试命令 — vgmplay 是交互式命令行播放器，仓库无 Makefile/ctest 测试
# 目标（CMakeLists.txt 无 add_test，无 tests/ 目录）。非交互自检入口为
# --version / --help / --lib-info。
upstream_check_command: "none (interactive player; upstream ships no automated test suite)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证：直接运行被测二进制)
# - CMakeLists.txt + test.c: 功能级消费者用例。CMakeDeps 暴露 vgmplay_BIN_DIRS_RELEASE，
#   add_test 以绝对路径执行打包的 vgmplay --version 并断言版本串（CTest 1 项）。
# - conanfile.py: 7 条断言。
#   1) --version 断言版本串 0.52.0
#   2) --version 断言 supports VGM 1.72
#   3) --lib-info 断言 Supported formats 横幅（进入 libvgm 枚举逻辑）
#   4) --lib-info 断言 - VGM 格式引擎已注册
#   5) --lib-info 断言 YM2612 FM 核心已链接进最终二进制
#   6) --help 断言 CLI 用法输出（消费者用例）
#   7) 端到端解码用例: conanfile.py 运行时用 Python 生成最小 VGM 1.72 夹具
#       （wait 静音 120 帧 ≈ 2s，136 字节；不提交二进制文件避免 PR diff
#       二进制 patch 丢失），-w -W 解码导出为 WAV，断言播放以 "Bye." 正常
#       结束且 test.wav 存在、> 1 KiB（AUDDRV_WAVEWRITE 驱动，无需音频设备）。
test_package_tests:
  - file: CMakeLists.txt + test.c
    description: "功能级消费者用例：通过 CMakeDeps 定位打包的 vgmplay 并执行 --version 断言版本串"
    command: "ctest -R test_vgmplay"
  - file: conanfile.py
    description: "运行 vgmplay 二进制非交互自检 + 端到端 WAV 导出：--version 2 项；--lib-info 3 项；--help 1 项；运行时生成最小 VGM 1.72 夹具并 -w -W 解码导出 WAV、断言产物存在且 >1 KiB（1 项）"
    command: "vgmplay --version / vgmplay --lib-info / vgmplay --help / vgmplay -w -W <dir> test.vgm"

# 测试断言总数 (近似值)
# CTest 1 项 + 7 条断言：版本 0.52.0 / supports VGM 1.72 / Supported formats / - VGM / YM2612 / usage(不区分大小写) / WAV 导出
assertion_count: 7
