software: v4l
version: "1.28.1"
status: built
build_system: meson
build_date: "2026-09-28"

source:
  url: "https://linuxtv.org/downloads/v4l-utils/v4l-utils-1.28.1.tar.xz"
  sha256: "0fa075ce59b6618847af6ea191b6155565ccaa44de0504581ddfed795a328a82"
  tar_format: tar.xz

build:
  system: meson
  default_profile: "minimal libv4l"
  disabled_features:
    - bpf
    - gconv
    - jpeg
    - libdvbv5
    - qv4l2
    - qvidcap
    - v4l2-tracer
    - v4l-utils
    - v4l-plugins
    - v4l-wrappers
    - doxygen-doc

dependencies:
  system:
    - "V4L2/media kernel headers"
    - "libm, libdl, pthread, librt"

platform_requirements:
  - "linux/videodev2.h"
  - "linux/media.h"
  - "sys/ioctl.h"
  - "/dev/video* or /dev/media* for device-level runtime tests"

verification:
  local:
    - "python -m py_compile conanfile.py test_package/conanfile.py"
    - "conan inspect ."
    - "conan export ."
    - "git diff --check -- archives/v/v4l/1.28.1"
  ohos:
    result: pending
    profile: "ohos-aarch64"
    note: "to be filled after finish (conan create + test_package on OHOS)"
  upstream_tests:
    meson_registered_tests: 0
    edid_decode:
      raw_result: "pending"
      expected_pass_result: "pending"
      note: "EDID parser corpus expected comparable to 1.32.0 (23/24 raw, 23/23 expected-pass)"
    device_tests:
      result: "not run on current worker"
      reason: "no /dev/video*, no /dev/media*, missing modprobe/udevadm, no writable /dev/kmsg"
  pending:
    - "Optional runtime checks on a machine with video/media devices"
