# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: vtgrab/0.1.8
homepage: "https://tracker.debian.org/pkg/vtgrab"

# 上游 vtgrab 0.1.8 发布于 2001 年，tarball 内没有任何测试框架：
# Makefile.am 只有 bin_PROGRAMS（rvc / rvcd / twiglet），既无 check_PROGRAMS
# 也无 TESTS，configure.in 里没有 AC_CONFIG_FILES/TESTS。因此没有可迁移的
# 上游用例，下面全部是本次适配补全的用例。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "CLI 契约：三个程序的 --version/--help 与非法参数退出码（15 项断言）"
    command: "bash test.sh"
  - file: rvc_protocol_test.py
    description: "RVC 001.000 协议握手：对真实 rvcd 校验协议版本、认证方案、特性列表与 ClientInitialisation 解析（10 项断言）"
    command: "python3 rvc_protocol_test.py 6161 rvcd"
  - file: ohos_binary_check.py
    description: "鸿蒙特有：解析 ELF 头，断言三个程序均为 AArch64 且使用 OHOS musl 动态加载器（9 项断言）"
    command: "python3 ohos_binary_check.py"

# 叶子断言总数：15（CLI 契约）+ 10（RVC 协议握手）+ 9（ELF 指纹）= 34
# 其中鸿蒙特有 11 项：9 项 ELF 指纹 + 2 项「OHOS 无虚拟控制台」行为断言。
assertion_count: 34
