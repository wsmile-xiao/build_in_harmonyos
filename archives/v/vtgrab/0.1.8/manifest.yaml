software: vtgrab
version: "0.1.8"
status: built
build_date: "2026-10-03"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/v/vtgrab/vtgrab_0.1.8.orig.tar.gz"
  sha256: "cc9136e206050d53b01c51a72ed33b78de7585298db7120de2abcc5725ce8e24"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/usr"
    - "--bindir=/usr/bin"
  dependencies:
    - ncurses/6.5
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-xfree86-include-limits-h.patch"

knowledge_gained:
  - "musl 的 <unistd.h> 不再间接引入 <limits.h>，老代码里裸用 PATH_MAX 会在 OHOS 上编译失败，需显式 #include <limits.h>"
  - "本平台发布的 ncurses 包只产出宽字符库 libncursesw.a，硬编码 -lncurses 的老 Makefile 会链接失败；应在 make 时清空该变量，改由 LIBS（来自依赖 cpp_info）提供"
  - "OHOS 的 sys/select.h 把 FD_SET/FD_CLR 加固为调用 __fd_chk，动态产物在非 OHOS musl loader（如本地 qemu 用通用 musl）下加载即报 __fd_chk: symbol not found"

patch_generation:
  method: refresh-patch --auto
  patches_count: 1

patch_classification:
  - file: 0001-xfree86-include-limits-h.patch
    type: portability
    platform_only: false
    guard: 'none'
