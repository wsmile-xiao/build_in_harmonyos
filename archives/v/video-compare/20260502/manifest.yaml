software: video-compare
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/20260502/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "20260502"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/pixop/video-compare/archive/refs/tags/20260502.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: makefile

  # 配置选项列表
  configure_options:
    - "CXX=clang++"
    - "USE_PKG_CONFIG=1"
    - "CXXFLAGS=-I$DEFAULT_PREFIX/include"
    - "LDLIBS=-pthread -L$DEFAULT_PREFIX/lib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ffmpeg/8.1.1
    - SDL2/2.30.0
    - SDL2_ttf/2.24.0
    - freetype/2.14.3
    - libpng/1.6.43

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
