# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: vecmath/1.5.2
homepage: "https://java.net/projects/vecmath/"

# 上游源码审计（hmbs 硬门禁）：vecmath 1.5.2 是纯 Java 向量/矩阵数学库。
# 该精确版本唯一的官方源码发行是 Maven Central 的 vecmath-1.5.2-sources.jar。
# 逐项审计结论：发行版不含任何测试代码。
upstream_tests_exist: false
upstream_test_audit:
  - source: "vecmath-1.5.2-sources.jar (javax/vecmath/)"
    reason: "源码归档仅含 51 个 *.java（AxisAngle4d/f、Color3b..4f、GMatrix、GVector、Matrix3d/f、Matrix4d/f、Point2..4、Quat4d/f、TexCoord2..4f、Tuple*、Vector2..4、VecMathI18N、VecMathUtil）与 ExceptionStrings.properties、package.html；无任何测试 .java。"
  - source: "构建/测试框架接线"
    reason: "1.5.2 发行版未打包任何构建脚本（build.xml/pom.xml/maven wrapper），既无 TestNG/JUnit/自定义 harness 的测试源，也无 test/ 目录或 make check/ctest 等价物。"
  - source: "Maven Central 发布物完整性核对"
    reason: "javax.vecmath:vecmath:1.5.2 在 Maven Central 仅发布主 jar（编译产物）与 sources jar（源码），两者均不含 test-classes，确认该版本无随包测试。"
  - conclusion: "vecmath 1.5.2 上游发行版确无任何测试用例可接入；由 test_package 对打包 JAR 做真实 API 功能断言（Vector3f 长度/归一化/点积/叉积、Tuple3f 存取、Matrix4f 行列式、Matrix3f 乘法、Quat4f 共轭，共 16 个断言）。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，在鸿蒙真机运行)
test_package_tests:
  - file: TestVecmath.java
    description: "编译并运行 Java 测试程序，调用 javax.vecmath 的 Vector3f/Tuple3f/Matrix4f/Matrix3f/Quat4f API 做 16 个数值断言（R34 实质性验证）"
    command: "bash test.sh"

# 测试断言总数 (test_package 的 16 个真实 API 数值断言)
assertion_count: 16
