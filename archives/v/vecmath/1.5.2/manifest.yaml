version: "1.5.2"
software: vecmath
status: built
build_date: "2026-09-18"
conan_ref: "vecmath/1.5.2"

source:
  url: "https://repo1.maven.org/maven2/javax/vecmath/vecmath/1.5.2/vecmath-1.5.2-sources.jar"
  sha256: "7bea4e97b737757c14bc346a45bb5e57a3f6ddd5c1bafe51e4d1eacd64347030"
  tar_format: "zip"

build:
  system: custom (javac + jar)
  configure_options:
    - "javac -source 8 -target 8 -encoding UTF-8"
    - "jar cf vecmath-1.5.2.jar"
  dependencies:
    - "BiSheng JDK 17.0.13 (conandata build_tools.bisheng_jdk pinned download, gitcode cmd-pkgs)"
  cc: "N/A (pure Java)"
  cxx: "N/A (pure Java)"

patches_applied: []

upstream_tests:
  framework: "none"
  test_files: 0
  test_methods: 0
  test_command: ""
  run_in_build: false
  audit: "vecmath 1.5.2 上游发行版（Maven Central sources jar）不含任何测试代码，见 test_package/MANIFEST.yml upstream_test_audit"

knowledge_gained:
  - "源码获取：javax.vecmath:vecmath:1.5.2 官方源码为 Maven Central 的 vecmath-1.5.2-sources.jar（javax/vecmath/*.java），源码包无单根目录，strip_root=False 解包"
  - "编译方式：纯 Java，无构建脚本，用 javac -source 8 -target 8 编译全部 51 个 .java + jar cf 打包（仿 servlet-api/4.0.1 模式）"
  - "JDK 依赖：conandata build_tools.bisheng_jdk 固定 BiSheng JDK 17.0.13（gitcode cmd-pkgs 下载，与 servlet-api 同款）"
  - "上游无测试：1.5.2 发行版无 test-classes/测试源/构建脚本，审计后置 upstream_tests_exist: false，test_package 做真实 API 断言"
  - "test_package：编译并运行 TestVecmath.java 调用 Vector3f/Tuple3f/Matrix4f/Matrix3f/Quat4f 共 16 个数值断言（R34 实质性验证）"
  - "HMBS 机器门禁：HMBS_UPSTREAM_TEST_RESULT(status=no_tests, discovered=0, executed=0) 与 HMBS_TEST_PACKAGE_RESULT(discovered/passedCount=16) 均在 test_package/test() 输出（覆盖 cache-hit）"
  - "R32: validate() 检查 settings.os in (Linux, OHOS)"
  - "R38: 库包（JAR 产物），不需要 commands.json"
