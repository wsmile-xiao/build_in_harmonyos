# 软件级 manifest — voronota
# 遵循 ARCHIVE-SPEC v2.0

software: voronota
display: "voronota (Voronoi diagram of atomic balls)"
description: "基于原子球 Voronoi 图分析生物大分子三维结构（蛋白质/RNA）的命令行工具：计算 Voronoi 顶点、原子间接触面积、溶剂可及面积，含 VoroMQA/CAD-score 评分脚本"
category: science
homepage: "https://github.com/kliment-olechnovic/voronota"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 C++11/14 实现，零外部依赖，仅需 C++ 编译器，OHOS 原生可构建"
    - "核心 voronota + expansion_js (voronota-js, C++14, 内嵌 Duktape/Eigen 等) + expansion_lt (voronota-lt) 一起构建；expansion_gl (OpenGL 可视化) 默认关闭"
    - "单二进制 CLI 工具组，package_type=application"
    - "上游测试为 tests/jobs_scripts/*.bash 作业脚本流水线（需 git checkout 全量 fixtures 与参考输出），发布包内无 tests/ 目录，配方在 build() 中运行等价核心流水线并做非空断言"
  common_dependencies: []

versions:
  "1.29.4781":
    status: built
    build_date: 2026-09-29
    notes: "首次适配：CMake 构建核心 + JS/LT 扩展，build() 内运行 5 项上游等价流水线检查，test_package 做 4 项消费者功能验证"
