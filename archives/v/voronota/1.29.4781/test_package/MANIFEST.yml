# test_package/MANIFEST.yml — voronota 1.29.4781
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）

package: voronota/1.29.4781
homepage: "https://github.com/kliment-olechnovic/voronota"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "voronota_1.29.4781.tar.gz (official GitHub release asset, quick-install documented source)"
  source_sha256: "23a61a7f59b0ea47dd3b1f2ac48a486061c80e57f04e939c69f0f360a565a979"
  build_system: "CMake (core C++11 + expansion_js/expansion_lt C++14, zero external dependencies)"
  test_definition: >
    上游测试为 tests/jobs_scripts/*.bash（26 个核心脚本）与
    expansion_js/tests/jobs_scripts/*.bash（17 个 JS 脚本）两套作业脚本流水线，
    合计 43 个，均由顶层 test.bash 驱动（run_all_jobs_scripts.bash 跑全部脚本
    并用 git status 比对 jobs_output/ 参考输出；另有 expansion_lt /
    expansion_lt_cadscore 两套 LT 套件，走 run_all_tests.bash，属独立断言体系，
    不计入本次作业脚本口径）。计数单位为作业脚本文件，
    在发布标签 v1.29.4781 下用上游 GitHub API 逐文件清点为 26 + 17 = 43 个。
    官方发布包内无 tests/ 目录（顶层仅 src/、expansion_*/、radii 与包装脚本），
    故作业脚本无法在 conan source 布局下按原样运行；配方在 build() 中运行
    等价核心流水线（T1 help、T2 取球、T3 算顶点 --check、T4 算接触 + 体积、
    T5/T6 JS/LT 烟雾测试），每项均做输出非空断言与退出码检查。
  dependency: "none (upstream builds with only a C++ compiler; harness extras like OpenMPI/valgrind/R are device-absent)"
  portability_changes: []

upstream_check_command: "voronota --help; get-balls-from-atoms-file | calculate-vertices --check | calculate-contacts"
upstream_test_in_build: true
upstream_test_command: "voronota get-balls-from-atoms-file < mini.pdb | voronota calculate-vertices --print-log --check | voronota calculate-contacts --volumes-output volumes"

# build() 中实际运行的 6 项上游等价检查（逐项对应核心作业脚本能力）
upstream_tests:
  - test_name: "core_help"
    source: "tests/jobs_scripts/do_help_printing.bash"
    kind: "smoke"
    description: "voronota --help 输出非空（对应上游 basic_help/full_help 两份输出）"
    command: "voronota --help"
  - test_name: "get_balls"
    source: "tests/jobs_scripts/do_basic_triangulation_and_contacts.bash (default_radii leg)"
    kind: "pipeline"
    description: "合成 PDB 取球，断言产出非空且不少于 4 个球"
    command: "voronota get-balls-from-atoms-file"
  - test_name: "calc_vertices_check"
    source: "tests/jobs_scripts/do_basic_triangulation_and_contacts.bash (default_radii leg)"
    kind: "pipeline"
    description: "calculate-vertices --print-log --check，断言顶点输出与日志均非空"
    command: "voronota calculate-vertices --check"
  - test_name: "calc_contacts_volumes"
    source: "tests/jobs_scripts/do_basic_triangulation_and_contacts.bash (default_radii leg)"
    kind: "pipeline"
    description: "calculate-contacts + --volumes-output，断言接触与体积输出均非空"
    command: "voronota calculate-contacts"
  - test_name: "js_smoke"
    source: "expansion_js/tests/run_all_job_scripts.bash"
    kind: "smoke"
    description: "EXPANSION_JS=ON 构建的 voronota-js 可执行且输出非空"
    command: "voronota-js --help"
  - test_name: "lt_smoke"
    source: "expansion_lt/test.bash"
    kind: "smoke"
    description: "EXPANSION_LT=ON 构建的 voronota-lt 可执行且输出非空"
    command: "voronota-lt --help"

# 计数口径：单一 bash 作业脚本框架，auto（标签 v1.29.4781 下 API 清点 26 + 17 = 43 个作业脚本）
upstream_test_total: 43
upstream_test_count_method: auto
upstream_test_passed: 6
upstream_test_failed: 0

test_package_tests:
  - file: test.sh
    scenario: "consumer-pipeline"
    description: >
      消费者视角端到端验证：已安装的 voronota --help 非空；合成 PDB 经
      取球→算顶点→算接触全流水线且每级输出非空断言；voronota-js 与
      voronota-lt 烟雾测试输出非空。共 4 项检查。
    command: "bash test.sh"
    assertions: 12

assertion_count: 12
