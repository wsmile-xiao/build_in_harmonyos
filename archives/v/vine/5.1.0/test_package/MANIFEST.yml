package: vine/5.1.0
homepage: "https://github.com/celery/vine"
upstream_check_command: "python3 -m pytest -q t/unit"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest -q t/unit"
upstream_tests:
  - file: t/unit/test_abstract.py
    source: "vine-5.1.0/t/unit/test_abstract.py"
    description: "Abstract promise interface tests"
    command: "python3 -m pytest -q t/unit/test_abstract.py"
  - file: t/unit/test_funtools.py
    source: "vine-5.1.0/t/unit/test_funtools.py"
    description: "Promise conversion and functional helper tests"
    command: "python3 -m pytest -q t/unit/test_funtools.py"
  - file: t/unit/test_promises.py
    source: "vine-5.1.0/t/unit/test_promises.py"
    description: "Promise chaining, callbacks, and error handling tests"
    command: "python3 -m pytest -q t/unit/test_promises.py"
  - file: t/unit/test_synchronization.py
    source: "vine-5.1.0/t/unit/test_synchronization.py"
    description: "Barrier synchronization tests; patched setup hook for pytest compatibility"
    command: "python3 -m pytest -q t/unit/test_synchronization.py"
test_package_tests:
  - file: functional.py
    description: "Six consumer checks for package provenance, version, callbacks, chaining, barrier, and conversion helpers"
    command: "python3 functional.py <absolute-package-folder> <results-json>"
assertion_count: 11
