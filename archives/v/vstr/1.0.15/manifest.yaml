# 版本级 manifest — vstr 1.0.15
software: vstr
version: '1.0.15'
status: built
build_date: '2026-09-18'
build_system: autotools

source:
  url: 'http://www.and.org/vstr/1.0.15/vstr-1.0.15.tar.gz'
  sha256: '8d4a0c66cd89370f6b9d4599c08e9d005f9b4e3f22206d354ee826249489734a'
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - '--enable-debug'
    - '--enable-tst-noassert-loop'
    - '--enable-tsts-static'
    - 'CFLAGS="-std=gnu89"'
  cc: clang

patches_applied:
  - 'config.guess / config.sub 替换为现代 GNU OHOS 感知副本（2005 旧版不识别 aarch64/OHOS）'

knowledge_gained:
  - 'vstr 是 2006 年 autotools 项目，2005 版 config.guess/config.sub 不识别 aarch64 与 HarmonyOS，需替换为现代 OHOS 感知副本（E007）'
  - '上游 make check 需 --enable-debug + --enable-tst-noassert-loop：默认配置下 98 个 xfail 负向测试会被当作普通测试并因 assert abort 判 FAIL，开启后进入 XFAIL_TESTS 被正确识别为预期失败'
  - '现代 clang 默认标准下 extern inline 语义与 GNU89 不同，需 CFLAGS=-std=gnu89（与 Homebrew 结论一致）'
  - '测试程序用 --enable-tsts-static 静态链接 libvstr.a，避免 make check 运行时依赖 .libs/libvstr.so 的 LD_LIBRARY_PATH'
  - 'tst-main.c 在 en_US locale 缺失时打印 "This library does things with the locale" 并静默 exit(0)——全部用例零断言"通过"（假证据），配方须检测该警告并拒绝放行'
