software: vstr
display: "vstr"
description: "C 字符串库，专为网络通信设计（chunk 化 ptr+length 数据，快速增删改查）"
category: library
homepage: "http://www.and.org/vstr/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "2006 年 autotools 项目，2005 版 config.guess/config.sub 不识别 aarch64 与 HarmonyOS，需替换为现代 GNU OHOS 感知副本（E007）"
    - "现代 clang 需 CFLAGS=-std=gnu89 以匹配 GNU89 extern inline 语义"
    - "上游 make check 需 --enable-debug + --enable-tst-noassert-loop，否则 98 个 xfail 负向测试被判 FAIL"
  common_dependencies: []

versions:
  "1.0.15":
    status: built
    build_date: "2026-09-18"
