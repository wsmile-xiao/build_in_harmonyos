notes: "venc-pyc 是 Alpine 生态中 VenC 的预编译 Python bytecode 子包，本归档为独立 Conan 包（路径 A），源码来源为 VenC 3.2.7 的 PyPI sdist；包内同时保留 venc3/**/*.py（含 package_data 资源）与预编译 .pyc"
