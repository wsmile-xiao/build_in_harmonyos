# 版本级 manifest
# 文件位置: archives/v/venc-pyc/3.2.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名（Conan 包名）
software: venc-pyc

# 版本号
version: "3.2.7"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-18"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（venc-pyc 来源于 VenC 3.2.7 sdist，见 notes.md）
  url: "https://files.pythonhosted.org/packages/a2/6a/d808e032181f419d7928e481950ad607a3ee23916d033a1690d0498c25c3/venc-3.2.7.tar.gz"

  # 源码校验和
  sha256: "7114e53949ff58fb9db5bb6b8560ca391adb3e0de69ca787703c9bb6d30786b6"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（纯 Python，PEP 517 / flit_core）
  system: custom

  # 配置选项列表
  configure_options: []

  # 运行时依赖（python3 解释器 + pyyaml/unidecode Python 包，均为运行时
  # 命令/解释器方式依赖，非 Conan requires()）
  dependencies:
    - "python3/3.12.9"
    - "pyyaml (Python 包，运行时解释器依赖)"
    - "unidecode (Python 包，运行时解释器依赖)"

  # 不需要编译器（纯 Python，无 C 扩展）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 纯 Python 包，无需源码补丁
patches_applied: []

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  total: 0
  passed: 0
  failed: 0
  skipped: 0
  note: "PyPI sdist 不含上游测试（pyproject.toml [tool.flit.sdist] exclude = ['test/']），上游测试位于 Git 仓库 test/ 目录，未纳入本次归档（与 acme-tiny-pyc 路径 A 模式一致）；conanfile.py build() 做确定性构建与包内基础自检（pip wheel / import venc3 / venc CLI 入口 / pyc 生成与直接加载）；test_package 提供消费者断言 6 项（import / pyc 存在 / py 与 pyc 并存 / pyc 直接加载 / package_data 资源完整 2 项）+ bin/venc -v CLI smoke"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "venc-pyc 是 Alpine 生态中 VenC 的预编译 Python bytecode 子包，本任务按路径 A 独立归档，源码来源为 VenC 3.2.7 的 PyPI sdist"
  - "独立包需要同时保留 venc3/**/*.py（运行所需模块文件）并额外提供预编译 bytecode（__pycache__/*.pyc），因为 Alpine 的 pyc 子包依附主包存在，而本包独立归档必须自包含可运行"
  - "纯 Python 包无编译器、无 ELF 签名需求；PEP 517 wheel 产物平台无关；settings 按 CI L0p 门禁声明 os/compiler/build_type/arch 四项（与 OHOS profile 兼容，纯 Python 不实际使用编译器）"
  - "pyyaml/unidecode 是运行时 Python 包依赖（以解释器方式存在），不链接 C 库，不放入 conan requires()，在 manifest.yaml 中声明"
  - "package_data/ 资源（themes、oembed_providers.json 等）必须完整打包，否则 venc CLI 无法运行"

# 纯 Python 适配，无源码补丁（与 patches_applied: []、conandata patches: {} 一致）
patch_generation:
  method: none
  patches_count: 0
