# test_package/MANIFEST.yml — venc-pyc 3.2.7
# 上游官方测试声明（详见 docs/TEST_QUALITY_SPEC.md）
#
# 上游测试入口（framagit.org/denissalem/VenC 仓库 test/ 目录，v3.2.7 tag）：
#   上游 VenC 3.2.7 的 PyPI sdist 不含 test/ 目录
#   （pyproject.toml [tool.flit.sdist] exclude = ["test/"]），故 sdist 中无
#   上游测试可运行；上游测试位于 Git 仓库 test/ 目录（经 Software Heritage
#   归档核实共 6 个用例），本次归档以 PyPI sdist 为源码（与 acme-tiny-pyc
#   路径 A 模式一致），未纳入上游测试。
#
# 上游 6 个用例实测（2026-08-18，venc 3.2.7 代码）：
#   - patterns_processing.py 3 个（test_datastructure / test_process_no_flatten /
#     test_process_flatten）：0/3 通过——第 1 个即崩溃 AttributeError
#     '_str'（venc3 3.2.7 已将 _str 重命名为 string），后续不可达；
#   - themes.py 3 个（Gentle / Tessellation / Academik 主题导出合规对照）：
#     无法运行——测试数据（themes/tested + themes/refs）仅存于 framagit 仓库，
#     本环境不可达；
#   - 入口 test/run.py 自身 ImportError（引用的 run_tests 在两模块中均未定义），
#     上游测试无法整体运行；Alpine aports 对 venc 打包亦显式 !check。
#
# 运行情况（真机测试驱动实测口径）：
#   - conanfile.py build() 仅做确定性构建与包内基础自检（pip wheel / import /
#     venc CLI 入口 / pyc 生成与直接加载），不运行依赖外部网络/服务的上游测试。
#   - test_package 提供消费者视角断言：import venc3 / .pyc 存在 / .py 与 .pyc
#     并存 / pyc 直接加载 / package_data 资源完整 / bin/venc -v CLI smoke。

package: venc-pyc/3.2.7
homepage: "https://framagit.org/denissalem/VenC"

# sdist 无上游测试（flit sdist exclude test/），无可运行命令
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（Git 仓库 test/ 共 6 个用例；PyPI sdist 不含 test/，
# 如实声明为不可运行；实测 0/6 通过）
upstream_tests: []
upstream_test_total: 6
upstream_test_passed: 0
upstream_test_note: "test/ 目录 6 用例（patterns_processing 3 + themes 3）；patterns_processing 实测 0/3（venc3 3.2.7 API 变更 _str->string 崩溃）；themes 3 因测试数据仅存于 framagit（本环境不可达）未运行；入口 run.py ImportError"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: smoke.py
    description: "消费者断言：import venc3（含 datastore）/ .pyc 存在 / .py 与 .pyc 并存 / .pyc 直接加载 / package_data 资源完整 + venc3.patterns 核心功能（PatternTree 数据结构 string 属性 / UnknownPattern 错误路径 / Processor 处理 Escape pattern）"
    command: "python3 smoke.py"
  - file: conanfile.py
    description: "消费者测试：调用 smoke.py + bin/venc -v CLI smoke"
    command: "conan test test_package venc-pyc/3.2.7@"

# 测试断言总数（test_package 消费者断言 9 项：import 1 + pyc 存在 1 + py 并存 1
# + pyc 直接加载 1 + package_data 2 + venc3.patterns 核心功能 3
# （PatternTree.string / UnknownPattern / Processor.Escape））
assertion_count: 9
