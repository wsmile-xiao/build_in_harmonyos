# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# vrpn 07.36 口径（W60-2 整改后）：
#   上游测试程序（client_src 下 18 个唯一 test_* 目标，探索构建日志 26 条
#   「Built target test_*」行）由 BUILD_TESTING 门控；包构建 BUILD_TESTING=OFF
#   （配方裁剪，未逐项运行）⇒ upstream_tests 如实留空，静态清点见
#   reports/test-report.md 与 notes.md 测试账本。

package: vrpn/07.36
homepage: "https://github.com/vrpn/vrpn"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（包构建 BUILD_TESTING=OFF ⇒ 未运行，如实留空；
# 静态清点 18 个唯一 test_* 目标见 reports/test-report.md 五维账本）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：真实链接六静态库，调用 vrpn_gettimeofday 公开 API 并按返回值判定（API OK / return 0）"
    command: "./test_vrpn"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
