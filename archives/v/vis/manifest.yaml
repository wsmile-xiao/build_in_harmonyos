software: vis
display: "vis - 高效文本编辑器"
description: "基于 Plan 9 结构化正则表达式的 vi-like 文本编辑器，支持多光标编辑和 sam 命令语言"
category: editor
homepage: "https://martanne.github.io/vis/"
license: ISC
build_system: configure

ohos_adaptation:
  key_points:
    - "libtermkey 为必需依赖，需手动编译静态库"
    - "unibilium 替代 ncurses 提供 terminfo 支持"
    - "vt100 终端后端无需 curses 依赖"
    - "静态链接避免动态依赖问题"
  common_dependencies:
    - name: libtermkey
      note: "手动编译静态库版本"
    - name: unibilium
      note: "手动编译静态库版本"

versions:
  "0.9":
    status: built
    build_date: "2026-06-09"
    source_url: "https://github.com/martanne/vis/archive/v0.9.tar.gz"
    configure_options:
      - "--enable-curses=no"
      - "--enable-lua=no"
      - "--enable-tre=no"
    notes:
      - "无补丁文件（手动编译依赖）"
      - "使用 zip 格式替代 tar.gz（toybox tar 限制）"
      - "vt100 终端后端（无 curses）"
