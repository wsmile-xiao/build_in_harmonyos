# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: vis/0.9
homepage: "https://github.com/martanne/vis"

# Upstream test command（如实申报：上游 make test 触发 test/ 子模块）
upstream_check_command: "make test"

# Upstream test suite（规则 4 如实申报）：
# 上游存在测试套件：Makefile test: 目标（make test → git submodule
# update 拉取 test/ 子模块 → make -C test），test/ 子模块
# （martanne/vis-test）含 core/fuzz/lua/sam/util/vim 等测试文件。
# 未运行原因：test/ 为 git submodule（tarball 不含，需 GitHub 拉取，
# gh-proxy 429 限流无法获取）+ vis 为 TUI 编辑器，测试需终端环境
# （OHOS 沙箱无交互终端）——环境限制，非适配问题。
upstream_tests_total: 0
upstream_tests_passed: 0
upstream_tests_skipped_reason: "上游 test/ 为 git submodule（需 GitHub 拉取，gh-proxy 429 无法获取）+ TUI 编辑器测试需终端环境（OHOS 沙箱无交互终端）"

# Upstream tests not run in build (see skipped reason above; consumer-side
# test covers real execution of vis)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_vis.sh
    description: "Run vis --version to verify tool executes"

# Test assertion count
assertion_count: 1
