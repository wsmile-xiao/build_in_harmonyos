software: vis
version: 0.9
status: built
build_system: configure
source_url: https://github.com/martanne/vis/archive/v0.9.tar.gz
source_type: tar

configure_options:
  - --enable-curses=no
  - --enable-lua=no
  - --enable-tre=no

dependencies:
  - name: libtermkey
    required: true
    note: Static library manually compiled
  - name: unibilium
    required: true
    note: Static library manually compiled for terminfo support

build_date: 2026-06-09
compiler: clang 15.0.4

patches: []

notes: |
  - vis 0.9 is the latest stable release
  - Built without ncurses/Lua/TRE support (vt100 terminal backend)
  - Dependencies (libtermkey, unibilium) manually compiled as static libraries
  - Static binary for better portability on HarmonyOS
  - Terminal backend: vt100 (no curses dependency)

archived_files:
  - type: executable
    path: bin/vis
    size: 575KB
  - type: utility
    path: bin/vis-clipboard
    size: 2.3KB
  - type: utility
    path: bin/vis-complete
    size: 1.5KB
  - type: utility
    path: bin/vis-digraph
    size: 194KB
  - type: utility
    path: bin/vis-menu
    size: 112KB
  - type: utility
    path: bin/vis-open
    size: 1.9KB
  - type: documentation
    path: share/doc/vis/
  - type: man_pages
    path: share/man/man1/

package:
  format: zip
  file: vis-0.9-ohos-aarch64.zip
  size: 378KB
  contents: 16 files
  note: Using zip format due to toybox tar limitations on HarmonyOS