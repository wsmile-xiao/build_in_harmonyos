# test_package/MANIFEST.yml
# 上游/消费者测试声明（CI build_and_test.sh L0e 强制要求本文件存在）
package: vbrfix/0.24
homepage: "https://salsa.debian.org/debian/vbrfix"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# ── 上游测试清点（R51 三步法）────────────────────────────────────
# 上游 0.24（vbrfixc）为单个命令行程序，源码树仅 69 个文件，无任何测试基础设施：
#   * 无 tests/ / test/ 目录（find 全树无匹配）
#   * Makefile.am / vbrfixc/Makefile.am 中无 TESTS = 声明（automake 测试套件为空）
#   * 无 ctest / meson / pytest / 自建测试脚本
# 实测 `make check` 退出码 0，输出 "Nothing to be done for 'check'"（空套件）。
# 结论：上游无自动化测试、也无上游样例文件可跑；下方 test_package 提供真实
# 功能测试（实质运行被测二进制）作为消费者侧验证。
upstream_test_in_build: false
upstream_test_command: "make check"
upstream_tests_total: 0
upstream_tests_passed: 0
upstream_tests_failed: 0
upstream_tests_skipped: 0
upstream_tests_skipped_reason: >-
  上游 vbrfix 0.24 全树无自动化测试（无 tests/ 目录、Makefile.am 无 TESTS 声明、
  无 ctest/meson/pytest 入口），`make check` 为空套件；亦无上游样例数据文件，
  故无可运行的上游用例。

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 消费者侧测试
test_package_tests:
  - file: test_vbrfixc.sh
    description: >-
      vbrfixc 真实功能测试：对合成 MPEG-1 LayerIII 样本运行被测二进制，校验
      Xing 头重建、既有 Xing 识别、CBR 拒写、-allways/-makevbr 标志、
      ID3v1/ID3v2 标签保留，以及【鸿蒙特有】产物 AArch64 ELF 目标与可执行性
    command: "bash test_vbrfixc.sh <bin_dir>"
  - file: gen_mp3.py
    description: "合成 MP3 样本生成器（无外部音频工具依赖）"
  - file: verify.py
    description: "断言助手（大小/子串/魔数/ELF 目标平台）"

# 测试用例统计（test_package）
test_case_count: 9
test_case_ohos_specific_count: 1
test_case_names:
  - TC-01-usage
  - TC-02-vbr-no-xing
  - TC-03-vbr-with-xing
  - TC-04-cbr-refused
  - TC-05-cbr-allways
  - TC-06-id3v1-kept
  - TC-07-id3v2-kept
  - TC-08-cbr-makevbr
  - TC-09-ohos-abi        # 鸿蒙特有

# 断言总数
assertion_count: 24
