# conandata.yml — vbrfix 0.24 (vbrfixc, 命令行 MP3 VBR 头修复工具)
#
# 上游：VBRfix / vbrfixc 0.24，作者 William Pye <will@willwap.co.uk>，GPL-2.0-or-later
# 版本证据：configure.in 中 AM_INIT_AUTOMAKE(vbrfixc,0.24)、vbrfixc.lsm "Version: 0.24"
#
# 源 URL 说明（R39）：
#   官方原站 http://www.willwap.co.uk/Programs/vbrfix.php 在本次适配期间已失效
#   ——域名被抢注，HTTP 301 跳转至无关站点 guidenetworth.com，原始 tarball 不可达；
#   全网无同字节可达镜像（web.archive.org 在本机与 CI worker 均不可达）。
#   故采用 Debian 官方源码仓库 salsa.debian.org/debian/vbrfix 的 pristine upstream
#   标签 upstream/0.24 —— 该标签即 Debian 从 willwap 原始 tarball 导入的上游树，
#   与 Debian orig 包 vbrfix_0.24+dfsg.orig.tar.xz 中的 vbrfixc/ 源码逐字节一致
#   （dfsg 版仅剔除一个非源码文件：上游误打包的 32 位 x86 Linux 预编译二进制
#    vbrfixc/vbrfixc；本配方的 tarball 保留该二进制但构建时由 make 覆盖，不参与打包）。
#   salsa 为 Debian 官方托管（非第三方镜像），且不触发 CI 镜像重写/Debian 重打包规则。

sources:
  url: "https://salsa.debian.org/debian/vbrfix/-/archive/upstream/0.24/vbrfix-upstream-0.24.tar.gz"
  sha256: "bc770e24fd56f209292c69aea40e245c7472c80bf4f2211bfc896dc9c3ad51f5"

patches:
  - patch_file: "patches/0001-admin-config.guess.patch"
    patch_description: >-
      上游 admin/config.guess（时间戳 2002-10-21）不认识 HarmonyOS/HongMeng 内核，
      configure 报 "cannot guess build type"，无法在 HarmonyOS PC (aarch64) 判定
      build/host 三元组。补 HarmonyOS 分支输出 aarch64-unknown-linux-ohos。
    patch_type: "portability"
  - patch_file: "patches/0002-admin-config.sub.patch"
    patch_description: >-
      上游 admin/config.sub（时间戳 2002-09-05）不认识 aarch64 CPU、也不接受
      -linux-ohos OS，无法规范化上一步得到的 aarch64-unknown-linux-ohos 三元组。
      补 aarch64/aarch64-* CPU 与 linux-ohos OS 识别。
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: >-
      configure 自建临时目录用 `(umask 077 && mktemp -d)`；HMDFS 上新目录带 setgid
      且权限落为 drwx--S---，创建者自身也无法写入，config.status 写 config.h /
      Makefile 全部 "Permission denied"。改为 umask 022（知识库 E011）。
    patch_type: "portability"
  - patch_file: "patches/0004-vbrfixc-vbrfix.cpp.patch"
    patch_description: >-
      vbrfix.cpp 使用非标准类型 uint（老 BSD <sys/types.h> 提供）。
      clang 15 + libc++ (OHOS) 下报 unknown type name 'uint'，改为 unsigned int。
    patch_type: "portability"
  - patch_file: "patches/0005-vbrfixc-wputil.h.patch"
    patch_description: >-
      wputil.h::copyFile() 用 `return out << in.rdbuf();` 依赖已废弃的
      std::ostream 隐式 operator bool 转换；clang 15 + libc++ 报 no viable
      conversion。改为显式写入后返回 !out.fail()（语义等价：原隐式转换为 !fail()）。
    patch_type: "portability"
