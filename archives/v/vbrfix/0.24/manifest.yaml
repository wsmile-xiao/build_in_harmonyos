    type: portability
    platform_only: true
    guard: "新增 uname -s = HarmonyOS 分支（构建期平台判定，非 OHOS 平台不命中，行为不变）"
  - file: 0002-admin-config.sub.patch
    type: portability
    platform_only: true
    guard: "新增 aarch64 / aarch64-* CPU 与 linux-ohos OS 白名单（非 OHOS 平台不命中，行为不变）"
  - file: 0003-configure.patch
    type: portability
    platform_only: true
    guard: "临时目录 umask 077 → 022（跨平台安全，非 OHOS 平台行为不变）"
  - file: 0004-vbrfixc-vbrfix.cpp.patch
    type: portability
    platform_only: false
    guard: "非标准类型 uint → unsigned int（现代编译器通用修复，未引入平台宏）"
  - file: 0005-vbrfixc-wputil.h.patch
    type: portability
    platform_only: false
    guard: "显式判 !out.fail() 取代已废弃的 ostream→bool 隐式转换（现代编译器通用修复，未引入平台宏）"
