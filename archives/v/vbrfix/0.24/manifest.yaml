source:
  # 官方原站 http://www.willwap.co.uk/Programs/vbrfix.php 已失效（域名被抢注）；
  # 采用 Debian 官方仓库 salsa.debian.org/debian/vbrfix 的 pristine upstream 标签
  # upstream/0.24（与 Debian orig 0.24+dfsg 的 vbrfixc/ 源码逐字节一致）。
  url: "https://salsa.debian.org/debian/vbrfix/-/archive/upstream/0.24/vbrfix-upstream-0.24.tar.gz"
  sha256: "bc770e24fd56f209292c69aea40e245c7472c80bf4f2211bfc896dc9c3ad51f5"
  tar_format: tar.gz

build:
  system: autotools
  # 无额外 configure 选项（--prefix 由 Conan AutotoolsToolchain 生成）；
  # 空字符串而非 []，避免 clean-verify 把 "[]" 当作 configure 参数（G0）
  configure_options: ""
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-admin-config.guess.patch"
  - "0002-admin-config.sub.patch"
  - "0003-configure.patch"
  - "0004-vbrfixc-vbrfix.cpp.patch"
  - "0005-vbrfixc-wputil.h.patch"

knowledge_gained:
  - "HMDFS 上 (umask 077 && mktemp -d) 创建的临时目录权限落为 drwx--S---，创建者自身也无法写入，config.status 写 config.h/Makefile 全报 Permission denied；改为 umask 022。knowledge_ref: E011"
  - "2002 年版 config.guess/config.sub 不认识 HarmonyOS 与 aarch64/-linux-ohos，需补 HarmonyOS 分支（输出 aarch64-unknown-linux-ohos）+ aarch64 CPU + linux-ohos OS 白名单。knowledge_ref: E160, E007, E122"
  - "HMDFS 上 conan 复制后的新建脚本 execve 返回 EACCES（chmod +x 无效），直接执行 ./configure 报 126 Permission denied，须改由 sh 显式解释执行。knowledge_ref: E087, E490"
  - "老 C++ 源码（2003 年）在 clang 15 + libc++ 下两处不可编译：隐式 std::ostream→bool（operator bool 已 explicit）、非标准类型 uint。修补方式已沉淀为草稿。knowledge_ref: E429-draft-AB38"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/vbrfix-0.24.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/vbrfix-0.24.work
  source_orig_hash: 2390d67260b6794d
  source_work_hash: 3ec997d9db8812b8
  generated_at: '2026-09-30T09:04:10'
  patches_count: 5

