software: vbrfix
display: "VBRfix (vbrfixc)"
description: "命令行 MP3 VBR 头修复工具：扫描 MP3，重建正确的 VBR 头（Xing/Info），修正错误的比特率、时长与 seek 信息"
category: multimedia
homepage: "https://salsa.debian.org/debian/vbrfix"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 admin/config.guess / config.sub 为 2002 年版，不认识 HarmonyOS/aarch64 与 -linux-ohos OS → 补丁补齐三元组识别"
    - "configure 自建临时目录用 (umask 077 && mktemp -d)，HMDFS 上新目录权限落为 drwx--S--- 致自身不可写 → 改 umask 022（知识库 E011）"
    - "clang 15 + libc++ 下两处老式 C++ 写法不可编译：wputil.h 隐式 ostream→bool、vbrfix.cpp 非标准类型 uint"
    - "上游 tarball 内含 32 位 x86 预编译二进制 vbrfixc/vbrfixc（Debian 因此做了 +dfsg 重打包）；构建时由 make 覆盖，不参与打包"
    - "产物为 bin/vbrfixc 命令行工具（R38：软件级 commands.json 已声明）"
  common_dependencies: []

versions:
  "0.24":
    status: built
    build_date: "2026-09-30"
    conan_ref: "vbrfix/0.24"
    source_url: "https://salsa.debian.org/debian/vbrfix/-/archive/upstream/0.24/vbrfix-upstream-0.24.tar.gz"
    build_system: autotools
    configure_options: []
    notes:
      - "无第三方依赖（纯 C++ 标准库 + libtool 链接）"
      - "5 个可移植性补丁（见 0.24/manifest.yaml patches_applied）"
      - "消费者测试 9 项全通过（含 1 项鸿蒙特有 AArch64 产物断言）"
