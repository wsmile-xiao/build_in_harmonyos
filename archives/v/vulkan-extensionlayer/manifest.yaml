software: vulkan-extensionlayer
category: gfx
description: "Khronos Vulkan Extension Layer - provides Vulkan extension implementations as layers that can be loaded by applications"
homepage: "https://github.com/KhronosGroup/Vulkan-ExtensionLayer"
license: Apache-2.0

build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake UNIX variable is NOT set on HarmonyOS (missing Platform/HarmonyOS module), causing JSON layer manifest installation to be skipped"
    - "Need to add CMAKE_SYSTEM_NAME STREQUAL 'HarmonyOS' alongside UNIX conditions in layers/CMakeLists.txt"
    - "WSI support (XCB/XLib/Wayland) must be explicitly disabled since HarmonyOS has no X11/Wayland display system"
    - "ExtensionLayer builds as MODULE (.so) libraries, not SHARED libraries"
    - "VkLayer_khronos_memory_decompression is intentionally not installed per upstream CMakeLists"
  common_dependencies:
    - vulkan-headers
    - vulkan-utility-libraries
    - vulkan-volk

versions:
  1.4.350:
    status: built
    build_date: 2026-05-25