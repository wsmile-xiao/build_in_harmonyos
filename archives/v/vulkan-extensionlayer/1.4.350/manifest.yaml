name: vulkan-extensionlayer
version: 1.4.350
status: built
build_system: cmake
compiler: clang 15.0.4
build_type: module
configure_options:
  - -DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX
  - -DCMAKE_BUILD_TYPE=Release
  - -DCMAKE_C_COMPILER=$OHOS_CLANG
  - -DCMAKE_CXX_COMPILER=$OHOS_CLANGXX
  - -DBUILD_WSI_XCB_SUPPORT=OFF
  - -DBUILD_WSI_XLIB_SUPPORT=OFF
  - -DBUILD_WSI_WAYLAND_SUPPORT=OFF
  - -DUPDATE_DEPS=OFF
  - -DBUILD_TESTS=OFF
  - -DCMAKE_PREFIX_PATH=$DEFAULT_PREFIX
  - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
dependencies:
  - VulkanHeaders vulkan-sdk-1.4.350.0
  - VulkanUtilityLibraries vulkan-sdk-1.4.350.0
  - VulkanVolk 1.4.350
patches:
  - 0001-layers-CMakeLists.txt.patch