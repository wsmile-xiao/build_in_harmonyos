# conandata.yml — vala 0.56.19
# 源码官方源（GNOME download.gnome.org，R39）。sha256 与官方 tarball 一致
# （f2affe7d...）。注意：CI 会自动为 download.gnome.org URL 添加国内镜像
# fallback（ustc/tuna/nju），这里只需写官方原始 URL（单值格式，勿用列表——
# 列表格式 CI 的 mirror fallback 无法识别重写，CI 环境直连 gnome.org 会被
# 连接重置，见 #26146 失败日志）。

sources:
  url: "https://download.gnome.org/sources/vala/0.56/vala-0.56.19.tar.xz"
  sha256: "5ad7cbbfcc0de61b403d6797c9ef60455bfbebd8e162aec33b5b0b097adfb9d5"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS (uname -s) and emit aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    patch_description: "config.sub: accept ohos OS / linux-ohos kernel-OS combination"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: use umask 022 for temp dirs (OHOS sandbox umask 077 breaks mktemp dirs)"
    patch_type: "portability"
