# test_package/MANIFEST.yml
package: visit_struct/1.2.0
homepage: "https://github.com/cbeck88/visit_struct"

upstream_check_command: "b2 (Jamroot.jam): build and run the test executables"
upstream_test_in_build: true
upstream_test_command: "compile + execute the three Boost-free runtime tests"

upstream_tests:
  - file: test_visit_struct.cpp
    source: visit_struct-1.2.0/test_visit_struct.cpp
    description: >-
      Main runtime test: VISITABLE_STRUCT registration, visitor traversal,
      field_count, contexts, for_each on values/pointers/const, assert-based.
      Upstream builds it via b2 with -std=c++11; build() compiles and runs it
      directly (b2/Boost.Build unavailable on the CI worker).
    command: "./test_visit_struct"
  - file: test_visit_struct_intrusive.cpp
    source: visit_struct-1.2.0/test_visit_struct_intrusive.cpp
    description: >-
      Intrusive-syntax variant (VISIT_STRUCT_BEGIN/END inside the struct),
      C++11, assert-based runtime test.
    command: "./test_visit_struct_intrusive"
  - file: test_fully_visitable.cpp
    source: visit_struct-1.2.0/test_fully_visitable.cpp
    description: >-
      C++14 compile-time visitability checks (static_assert heavy); upstream
      only builds it when TEST_CXX14 is set. Built with -std=c++14 and run.
    command: "./test_fully_visitable"

test_package_tests:
  - file: test.cpp
    description: >-
      Consumer-side API validation: 10 CHECKs exercising the real reflection
      API (is_visitable true/false, field_count, for_each field order and
      values including std::string, get_name field-name lookup,
      registration-order visitation). Returns non-zero on any failed check.
    command: "./test_visit_struct"

assertion_count: 10
