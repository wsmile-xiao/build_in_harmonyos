# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: valijson/1.1.1
homepage: "https://github.com/tristanpenman/valijson"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试依赖多种第三方 JSON 库适配器 (jsoncpp, rapidjson, yaml-cpp,
# boost.json, nlohmann_json, POCO, Qt 等), 鸿蒙平台部分不可用, 故未在构建中运行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 tests/ 目录下共 22 个 C++ 测试源文件, 使用 CMake/CTest 框架
# 以下列出代表性测试文件; 因第三方 JSON 库适配器依赖, 未在鸿蒙平台运行
upstream_tests:
  - file: test_validator.cpp
    source: valijson-1.1.1/tests/test_validator.cpp
    description: "核心校验器功能测试 (Schema 校验、类型约束、属性约束等)"
    command: "ctest -R test_validator"
  - file: test_jsoncpp_adapter.cpp
    source: valijson-1.1.1/tests/test_jsoncpp_adapter.cpp
    description: "JsonCpp 适配器测试 (未运行: 依赖 jsoncpp 库)"
    command: "ctest -R test_jsoncpp_adapter"
  - file: test_rapidjson_adapter.cpp
    source: valijson-1.1.1/tests/test_rapidjson_adapter.cpp
    description: "RapidJSON 适配器测试 (未运行: 依赖 rapidjson 库)"
    command: "ctest -R test_rapidjson_adapter"
  - file: test_uri.cpp
    source: valijson-1.1.1/tests/test_uri.cpp
    description: "URI 解析与规范化测试"
    command: "ctest -R test_uri"
  - file: test_yaml_cpp_adapter.cpp
    source: valijson-1.1.1/tests/test_yaml_cpp_adapter.cpp
    description: "yaml-cpp 适配器测试 (未运行: 依赖 yaml-cpp 库)"
    command: "ctest -R test_yaml_cpp_adapter"
  - file: test_nlohmann_json_adapter.cpp
    source: valijson-1.1.1/tests/test_nlohmann_json_adapter.cpp
    description: "nlohmann JSON 适配器测试 (未运行: 依赖 nlohmann_json 库)"
    command: "ctest -R test_nlohmann_json_adapter"
  - file: test_validation_errors.cpp
    source: valijson-1.1.1/tests/test_validation_errors.cpp
    description: "校验错误报告测试 (错误路径、错误描述)"
    command: "ctest -R test_validation_errors"
  - file: test_validator_with_custom_regular_expressions.cpp
    source: valijson-1.1.1/tests/test_validator_with_custom_regular_expressions.cpp
    description: "自定义正则表达式校验器测试"
    command: "ctest -R test_validator_with_custom_regular_expressions"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_valijson.cpp
    description: "JSON Schema 校验核心功能: Schema 创建 + string 类型 valid 通过 + object/number 类型 invalid 拒绝"
    command: "./test_valijson"

# 测试断言总数 (近似值, 用于质量评估)
# 3 个校验断言: string 类型通过 + object 类型拒绝 + number 类型拒绝
assertion_count: 3
