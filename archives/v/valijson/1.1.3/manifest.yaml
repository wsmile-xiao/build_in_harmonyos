# 版本级 manifest — valijson 1.1.3
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.3"

# 软件名
software: "valijson"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub 源）
  url: "https://github.com/tristanpenman/valijson/archive/refs/tags/v1.1.3.tar.gz"

  # 源码校验和
  sha256: "887b53b1a924f6fe0b35fa3bbc9bbbe5ae8c72097b7f0f7c17b45f4cfa646029"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_SYSTEM_NAME=Linux"
  - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（1.1.3 上游已内置 from_chars 自动回退，无需 1.1.1 补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "E092: CMake 不识别 OHOS 平台，generate() 需设 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
- "valijson 1.1.3 引入 internal/double_parser.hpp，std::from_chars 缺失时自动回退 istringstream，无需 1.1.1 式 strtod 补丁"