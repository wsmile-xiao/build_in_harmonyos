# test_package/MANIFEST.yml — valijson 1.1.3 上游测试声明
# 详见: docs/TEST_QUALITY_SPEC.md

package: valijson/1.1.3
homepage: "https://github.com/tristanpenman/valijson"

# 上游测试命令（用于 ctest -N 分析）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本机 OHOS 工具链实测，见 reports/test-report.md 全量台账）
upstream_tests:
  - file: tests/test_validator.cpp
    source: valijson-1.1.3/tests/test_validator.cpp
    description: "核心 schema 校验用例（Draft3-7 完整校验 + 可选 format）85 个 TEST_F"
    command: "./test_suite"
  - file: tests/test_adapter_comparison.cpp
    source: valijson-1.1.3/tests/test_adapter_comparison.cpp
    description: "多 JSON 适配器交叉比较 64 个用例"
    command: "./test_suite"
  - file: tests/test_uri.cpp
    source: valijson-1.1.3/tests/test_uri.cpp
    description: "URI 解析参数化用例（4 组参数化实例）"
    command: "./test_suite"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_valijson.cpp
    source: test_package/test_valijson.cpp
    description: "消费者视角：程序化构建 schema + 类型/数值约束校验 + OHOS double 解析回退路径"
    command: "./test_valijson"