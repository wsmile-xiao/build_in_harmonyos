# 版本级 manifest — vcflib 1.0.15-src
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.0.15-src"

# 软件名
software: "vcflib"

# 编译状态
# published | built | failed | archived
# 本轮为工作树 bootstrap + 适配; 真机预检通过并发布后才置 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方上游 Release 资产)
  url: "https://github.com/vcflib/vcflib/releases/download/v1.0.15/vcflib-1.0.15-src.tar.gz"

  # 源码校验和 (已下载归档实测 SHA-256)
  sha256: "178e8c27fffc5324ac73f1c4b35f407184271b57f82aedc2efb9703df6ee3d49"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  configure_options:
  - "-DZIG=OFF"
  - "-DWFA_GITMODULE=ON"

  # 编译依赖列表 (格式: name/version)
  dependencies:
  - "htslib/1.24-r0"
  - "zlib/1.3.1"
  - "xz/5.6.2"
  - "bzip2/1.0.8"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# OHOS 无 pybind11。pyvcflib 模块与 realign/pyvcflib ctest 用例在
# source() 内通过对 CMakeLists.txt 做精确字符串替换守卫在
# pybind11_FOUND 之后（不依赖外部 patch 文件 / GNU patch，避免真机
# /tmp 只读导致 patch 失败）。
patches_applied: []
source_edits:
  - "CMakeLists.txt: 在 pybind11_FOUND 后守卫 pyvcflib Python 模块"
  - "CMakeLists.txt: 在 pybind11_FOUND 后守卫 realign/pyvcflib ctest 用例"
  - "contrib/fastahack/LargeFileSupport.h: musl/OHOS 移植 —— _FILE_OFFSET_BITS=64 下 off_t 已是 64 位，将 glibc 内部类型 __off64_t 改为 off_t（修复 'unknown type name __off64_t' 编译错误）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "vcflib 1.0.15-src 官方 release 归档已自带全部子模块 (htslib/WFA2-lib/tabixpp/fastahack 等)，无需 Vendor"
- "htslib 通过 pkg-config 提供：用 PkgConfigDeps 生成 htslib.pc 并注入 PKG_CONFIG_PATH，避免触发内部 ExternalProject autotools bootstrap (需 autoreconf)"
- "find_package(ZLIB/LibLZMA/BZip2) 为 Module 模式，需用 CMAKE_PREFIX_PATH + ZLIB_*/LIBLZMA_*/BZIP2_* 缓存变量指向 conan 依赖，避免落到 OHOS sysroot"
- "ZIG 代码路径 (vcfcreatemulti) 在 OHOS 无 zig，用 -DZIG=OFF 关闭; WFA2-lib 用 -DWFA_GITMODULE=ON 走 add_subdirectory 内建"
- "pybind11 Python 绑定 pyvcflib 及其 ctest 用例 (realign/pyvcflib) 在 OHOS 无 pybind11，source() 内对 CMakeLists.txt 做精确字符串替换守卫在 pybind11_FOUND 后再注册（不依赖外部 patch 文件，规避真机 /tmp 只读导致 GNU patch 失败）"
- "上游 ctest 套件由 Python doctest 组成 (test/pytest/*.md 经 rtest.py 驱动内置二进制与 data/regression/ 比对)；vcflib-api 与 doc/vcfintersect 两个 doctest 为纯说明文档，无可执行断言但上游仍注册并计为通过"
