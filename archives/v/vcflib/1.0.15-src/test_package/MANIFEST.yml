# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
package: vcflib/1.0.15-src
homepage: "https://github.com/vcflib/vcflib"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cd build && ctest --output-on-failure"

# ---- rule4: 官方上游测试总数声明 ----
# 官方向口径 = ctest_entries：上游 vcflib CMakeLists.txt 在其默认选项
# (BUILD_STATIC=OFF, ZIG=ON, 有 pybind11) 下注册 10 个 vcflib 自有 ctest 用例：
#   realign(pytest), pyvcflib(pydoctest), vcflib-api(pydoctest),
#   vcf2tsv(pydoctest), vcfallelicprimitives(pydoctest), vcfwave(pydoctest),
#   vcffilter(pydoctest), vcfcreatemulti(pydoctest), vcfnulldotslashdot(pydoctest),
#   doc/vcfintersect(doctest)
# (内嵌第三方依赖 WFA2-lib 的 `wfa2lib` 自测不属 vcflib 自有套件，配方已禁用。)
# OHOS 上这三个用例因平台/工具链缺失无法注册运行（见下方 upstream_test_gaps）：
#   realign/pyvcflib   —— 需 pybind11 Python 模块（ohpcd 仓无 pybind11、OHOS 无
#                         python 绑定运行环境），配方 source() 守卫在 pybind11_FOUND 后
#   vcfcreatemulti     —— 需 zig 编译器（OHOS 无 zig），配方 -DZIG=OFF
# 实际在 OHOS 真机运行并全通过的用例数 = 7（ctest"out of 7"，一致口径）。
upstream_test_total: 10
upstream_test_count_method: ctest_entries
upstream_test_gaps:
  - count: 2
    category: ohos_feature
    detail: "realign/pyvcflib ctest 用例需要 pyvcflib Python 模块 (pybind11_add_module, CMakeLists.txt ~478/535); ohpcd 仓无 pybind11、OHOS 无 python 绑定运行环境; source() 守卫在 pybind11_FOUND 后"
    evidence: "CMakeLists.txt:478 if (pybind11_FOUND AND NOT BUILD_STATIC); CMakeLists.txt:535 if (pybind11_FOUND AND NOT BUILD_STATIC)"
  - count: 1
    category: ohos_feature
    detail: "vcfcreatemulti ctest 需要 zig 工具链 (CMakeLists.txt ~544 if (ZIG) add_pydoctest(vcfcreatemulti)); ZIG=ON 且无 zig 二进制时 CMake FATAL_ERROR (~106-110); OHOS 无 zig, 配方 -DZIG=OFF"
    evidence: "CMakeLists.txt:106-110 ZIG_EXE FATAL_ERROR; CMakeLists.txt:544-546 if (ZIG) add_pydoctest(vcfcreatemulti)"
upstream_test_passed: 7
upstream_test_failed: 0

# 上游实际运行的测试程序
# vcflib 的 CTest 套件由 Python doctest/pytest 组成，对内置的 85+ 个 VCF
# 命令行工具做黑盒回归（test/pytest/*.md 经 rtest.py 驱动内置二进制并与
# data/regression/ 参照文件比对）。CMakeLists.txt 注册了以下用例：
#   add_pydoctest(vcflib-api) / add_pydoctest(vcf2tsv) /
#   add_pydoctest(vcfallelicprimitives) / add_pydoctest(vcfwave) /
#   add_pydoctest(vcffilter) / add_pydoctest(vcfnulldotslashdot) /
#   add_doctest(doc/vcfintersect)
# 依赖 pybind11 的两个用例 realign / pyvcflib 在 OHOS 无 pybind11，
# 由配方 source() 对 CMakeLists.txt 的字符串替换守卫在 pybind11_FOUND
# 时才注册（见 conanfile.py source()）。
upstream_tests:
  - file: test/pytest/vcf2tsv.md
    source: vcflib-1.0.15/test/pytest/vcf2tsv.md
    description: "vcf2tsv 工具黑盒回归 (doctest, 含 regression 比对)"
    command: "python3 -m doctest pytest/vcf2tsv.md"
  - file: test/pytest/vcfallelicprimitives.md
    source: vcflib-1.0.15/test/pytest/vcfallelicprimitives.md
    description: "vcfallelicprimitives 工具黑盒回归 (doctest)"
    command: "python3 -m doctest pytest/vcfallelicprimitives.md"
  - file: test/pytest/vcfwave.md
    source: vcflib-1.0.15/test/pytest/vcfwave.md
    description: "vcfwave 工具黑盒回归 (doctest)"
    command: "python3 -m doctest pytest/vcfwave.md"
  - file: test/pytest/vcffilter.md
    source: vcflib-1.0.15/test/pytest/vcffilter.md
    description: "vcffilter 工具黑盒回归 (doctest)"
    command: "python3 -m doctest pytest/vcffilter.md"
  - file: test/pytest/vcfnulldotslashdot.md
    source: vcflib-1.0.15/test/pytest/vcfnulldotslashdot.md
    description: "vcfnulldotslashdot 工具黑盒回归 (doctest)"
    command: "python3 -m doctest pytest/vcfnulldotslashdot.md"
  - file: test/pytest/vcflib-api.md
    source: vcflib-1.0.15/test/pytest/vcflib-api.md
    description: "VCFLIB C++ API 文档 (doctest, 纯说明文档无可执行断言)"
    command: "python3 -m doctest pytest/vcflib-api.md"
  - file: doc/vcfintersect.md
    source: vcflib-1.0.15/doc/vcfintersect.md
    description: "vcfintersect 工具 man 文档 (doctest, 纯说明文档无可执行断言)"
    command: "python3 -m doctest ../doc/vcfintersect.md"
  - file: test/pytest/rtest.py
    source: vcflib-1.0.15/test/pytest/rtest.py
    description: "doctest 驱动辅助 (rtest.py: 执行内置二进制并与 data/regression/* 比对)"
    command: "python3 -m doctest pytest/*.md"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_vcflib.cpp
    description: "消费端测试: 链接打包的 libvcflib, 用 VariantCallFile/Variant API 解析 sample.vcf 的 7 条记录, 校验 42 项字段断言"
    command: "./test_vcflib sample.vcf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 49
