software: vitetris
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.59.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.59.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/vicgeralds/vitetris/archive/refs/tags/v0.59.1.tar.gz"

  # 源码校验和
  sha256: "699443df03c8d4bf2051838c1015da72039bbbdd0ab0eede891c59c840bdf58d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: makefile

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.mk.patch"
  - "0002-src-config.h.patch"
  - "0003-src-src-conf.mk.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（每条引用知识图谱条目ID）
knowledge_gained:
  - id: E035
    summary: "vitetris自定义configure脚本通过文件路径检测headers，DPREFIX=/usr下鸿蒙headers不存在但clang编译时可自动找到sysroot中的headers"
  - id: E115
    summary: "vitetris使用-help而非--help/--version来获取帮助信息"
  - id: E115
    summary: "首次执行ELF需sign-elf签名才能通过OpenHarmony安全弹窗"
  - id: E115
    summary: "OpenHarmony环境需设置SSL_CERT_FILE环境变量才能下载源码包"
  - id: E115
    summary: "vitetris编译产生大量非致命warnings（parentheses/pointer-sign等）不影响功能"

patch_generation:
  method: per-file-difflib
