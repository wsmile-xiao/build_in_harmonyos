# 版本级 manifest
# 文件位置: archives/v/vali/0.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "0.1.1"

# 软件名
software: "vali"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-03"
build_system: "meson"
conan_ref: "vali/0.1.1"

# 源码信息
source:
  # 源码下载 URL（与 conandata.yml 的官方 URL 一致；gitlab 无可用镜像故为单源）
  url: "https://gitlab.freedesktop.org/emersion/vali/-/releases/v0.1.1/downloads/vali-0.1.1.tar.gz"

  # 源码校验和
  sha256: "791785eca66392f91f28ca371ba9cfa2dc11915df0bff9f590a33453f67e5756"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表（对应 conanfile.py generate() 里写入 conan_meson_native.ini 的值）
  configure_options:
    - "-Ddefault_library=static"
    - "-Dwrap_mode=nodownload"
    - "-Db_ndebug=false"

  # 编译依赖列表（格式: name/version；制品仓为裸 ref，无 @user/channel）
  dependencies:
    - json-c/0.18
    - aml/1.0.0

  # 编译器
  cc: clang
  cxx: clang++

# 应用的补丁列表（本版本零补丁）
patches_applied: []

# 编译中学到的知识
knowledge_gained:
  - "上游源码用顶层兼容头 #include <json_object.h> / <json_tokener.h>；json-c 官方 CMakeLists 只把 16 个头装到 include/json-c/（顶层那批是 Debian/Alpine 的 json-c-dev 打包补的符号链接），制品仓 json-c/0.18 同样只有 include/json-c/，conan 的 PkgConfigDeps 生成的 json-c.pc 也只有 -I<prefix>/include ⇒ 必须在配方里补 -I<json-c>/include/json-c，否则编译期直接找不到头"
  - "上游 test/basic.c 在 NDEBUG 下主动失败（#ifdef NDEBUG 打印提示并 return 1）；CI profile 是 build_type=Release，MesonToolchain 会写 b_ndebug='true' ⇒ 必须显式覆写 b_ndebug='false'，否则 build() 里的 meson test 必然失败。上游自己的 CI 只用默认 buildtype=debug，从不跑 Release，所以这个约束只在下游暴露"
  - "基础镜像与 CI 环境都没有 meson（command -v meson 为空、python3 无 mesonbuild 模块），CI profile 的 [buildenv] PATH 只补 usr/local/bin 与 /data/service/hnp/bin ⇒ meson 必须以 tool_requires 引入（meson/1.11.0）"
  - "conan MesonToolchain 不把 tools.build:compiler_executables 的 ar/ranlib 写进 conan_meson_native.ini，meson 按裸名探测 llvm-ar 会因 PATH 上没有而 configure 失败 ⇒ 需从 c 编译器同目录推导 llvm-ar/llvm-ranlib 全路径注入 native file"
  - "上游 meson.build 用 custom_target 调用**刚编译出的** bin/vali 生成 org.varlink.service.{h,c}（构建期自举代码生成）；本例是原生构建所以可直接运行，交叉编译场景下必须提供可执行的 tool 或预生成产物"
  - "上游 dependency('aml', 'aml1') 是 pkg-config 双名回退写法：aml 包把 pkg_config_name 设为 aml1，只写 dependency('aml') 会找不到；上游 subprojects/aml.wrap 是 [wrap-git] revision=HEAD，若 meson 走 subproject 回退会 clone 上游 HEAD（不可复现，且 CI 无网络），故必须保持 wrap_mode=nodownload 并用 conan 提供依赖"
  - "上游 meson.build 的 pkgconfig.generate(lib, requires: ['json-c']) 漏掉 aml：静态链接的下游按 vali.pc 取链接参数会缺 aml 符号（vali.h 里 aml 不露出，但 service.c 的 .o 依赖 aml_*）。包内这份 .pc 的 prefix 还是构建期根目录（conan 用 --prefix=/），因此直接删除、由 conan 的 CMakeDeps/PkgConfigDeps 另生成完整描述"
  - "上游把 meson 的 werror=true + warning_level=3 写死在 project() default_options 里，且 .builds/alpine.yml 用 --fatal-meson-warnings；OHOS clang 15 下会不会因新告警中断构建，需真机实测确认（结论见 notes.md §4）"
