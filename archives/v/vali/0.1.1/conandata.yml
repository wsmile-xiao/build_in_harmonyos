# conandata.yml — vali 0.1.1
# 位置: archives/v/vali/0.1.1/conandata.yml
# 本文件是源码 URL + SHA256 + 补丁的唯一权威来源。
# conanfile.py 通过 self.conan_data["sources"] 与 apply_conandata_patches() 读取。

sources:
  # 官方源：gitlab.freedesktop.org 的 v0.1.1 **release 资产**（维护者上传的成品
  # tarball，另有同名 .sig 分离签名），不是站点动态生成的 /-/archive/ URL。
  # 两类 URL 都实测过：内容逐文件 sha256 完全一致（30 个文件全同），但归档是由
  # GitLab 按 tag 即时打包的，release 资产则是冻结的上传文件，可复现性更好。
  # 同款先例：archives/w/wayland/1.24.0 也用
  #   https://gitlab.freedesktop.org/<proj>/-/releases/<ver>/downloads/<file>
  #
  # 只给单个官方 URL、不列镜像：R39/PF7 的镜像规则针对 GitHub
  # （ghfast.top / gh-proxy.com 只反代 github.com），对 gitlab.freedesktop.org
  # 没有可用镜像，所以这里保持官方单源。
  #
  # 实测（2026-10-03，连续两次下载字节完全相同，30493 bytes）：
  #   https://gitlab.freedesktop.org/emersion/vali/-/releases/v0.1.1/downloads/vali-0.1.1.tar.gz
  #   sha256 = 791785eca66392f91f28ca371ba9cfa2dc11915df0bff9f590a33453f67e5756
  #   解包根目录 vali-0.1.1/（单根目录，strip_root=True 可用）
  url: "https://gitlab.freedesktop.org/emersion/vali/-/releases/v0.1.1/downloads/vali-0.1.1.tar.gz"
  sha256: "791785eca66392f91f28ca371ba9cfa2dc11915df0bff9f590a33453f67e5756"

patches:
# 本版本零补丁：上游源码一行不改。
# 两个真正的移植障碍都在配方层解决（extra_cflags 补 json-c 头目录、
# b_ndebug=false 关掉 NDEBUG），理由见 conanfile.py 的 generate() 注释与 notes.md §3.2。
# 留空（而不是 patches: {}）与同仓已合入的 archives/r/reliable/1.3.5 一致：
# apply_conandata_patches() 对 None 会打印
#   info: apply_conandata_patches(): No patches defined in conandata
# 这条日志本身就是"零补丁"的证据；对空 dict 则什么都不打印。
# List format (Conan 2.x standard — compatible with apply_conandata_patches):
# - patch_file: "patches/0001-xxx.patch"
#   patch_description: "..."
#   patch_type: "portability"
