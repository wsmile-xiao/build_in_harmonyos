# 软件级 manifest
# 文件位置: archives/v/vali/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: vali

# 显示名
display: "vali"

# 一句话描述
description: "vali — Varlink C implementation and code generator: client, service and interface registry speaking Varlink over Unix sockets"

# 分类标签
category: library

# 官网 URL
homepage: "https://gitlab.freedesktop.org/emersion/vali"

# 开源许可证（SPDX 标识）
license: MIT

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: meson

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "Meson 项目，install 两类产物：libvali 库 + bin/vali 代码生成器（.varlink 接口定义 → C 代码）"
    - "公共头只有 include/vali.h 且自包含（只 include <stdbool.h>）；conn.h / def.h / util.h 是内部实现，不 install"
    - "两个外部依赖：json-c（报文编解码）+ aml（事件循环）。上游写 dependency('aml', 'aml1')，aml 的 pkg-config 名是 aml1"
    - "上游源码用顶层兼容头 <json_object.h> / <json_tokener.h>；json-c 官方 CMakeLists 只装 include/json-c/，顶层头是发行版打包补的 ⇒ 需在配方补 -I<json-c>/include/json-c"
    - "上游 meson.build 用 custom_target 调用刚编译出的 bin/vali 生成服务接口源码（构建期自举代码生成），交叉编译时必须提供可执行的 tool"
    - "上游 test/basic.c 强制要求 NDEBUG 关闭（#ifdef NDEBUG 即 return 1）；CI profile 是 Release ⇒ 必须覆写 meson 的 b_ndebug='false'"
    - "上游 meson 未提供任何可裁剪选项（example/ 与 test/ 恒被 subdir 进来），构建期会连带编出 2 个示例程序与 2 个测试程序；它们没有 install 规则，不进包"
    - "上游 subprojects/aml.wrap 是 [wrap-git] revision=HEAD，必须保持 wrap_mode=nodownload 并用 conan 提供的依赖，否则会去 clone 上游 HEAD"
  common_dependencies:
    - json-c
    - aml

# 版本索引
versions:
  "0.1.1":
    conan_ref: "vali/0.1.1"
    status: built
    build_date: "2026-10-03"
