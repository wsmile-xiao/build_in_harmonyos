software: vorbis
version: "1.3.7"
status: built
build_date: "2026-09-16"
conan_ref: "vorbis/1.3.7"

source:
  url: "https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz"
  sha256: "0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab"
  tar_format: tar.gz

build_system: cmake
build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DINSTALL_CMAKE_PACKAGE_MODULE=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - "ogg/1.1.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-minimum-version.patch"
  - "0002-link-ogg-by-soname.patch"

package_line_note: >-
  vorbis 包名线（平台任务 #13473），与既有 libvorbis/1.3.7（archives/l/libvorbis/）
  同一上游 tarball、不同包名线；依赖旧 ogg 包名线 ogg/1.1.1（PR #10038），
  多包名先例同 ogg/libogg。

knowledge_gained:
  - "Same tarball as libvorbis/1.3.7; the CMake path avoids the Autotools config.status temporary-directory issues on HMDFS."
  - "The upstream CMake build omits the test/ subdirectory; upstream test sources are executed from test_package/ on the installed package (libvorbis 1.3.7 precedent)."
  - "vorbis CMake package exports Vorbis::vorbis, Vorbis::vorbisenc, and Vorbis::vorbisfile."
