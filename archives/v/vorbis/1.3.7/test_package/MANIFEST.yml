# test_package/MANIFEST.yml
# Upstream test declaration file (CI L0e requires this file to exist)
# See docs/TEST_QUALITY_SPEC.md

package: "vorbis/1.3.7"
homepage: "https://xiph.org/vorbis/"

# Upstream test command: test/Makefile.am registers one check program
# (`check_PROGRAMS = test`) and wires it to `make check`.
upstream_check_command: "make check"

# The upstream CMake build does not include the test/ subdirectory, so the
# upstream test sources are executed from test_package/ on the installed
# package (same approach as the libvorbis/1.3.7 recipe).
upstream_test_in_build: false
upstream_test_command: "./vorbis_upstream_test"

upstream_tests:
  - file: test/test.c
    source: libvorbis-1.3.7.tar.gz/test/test.c
    description: "官方编码/解码往返矩阵测试：1-8 声道 × 6 种采样率全组合，生成 PCM → Vorbis 编码 → Ogg 封装 → 解码 → PCM，逐帧校验误差容限"
    command: "./vorbis_upstream_test"

test_package_tests:
  - file: test_vorbis.c
    description: "版本字符串、编码器初始化、comment API 与 vorbisfile 链接性验证"
    command: "./test_vorbis"

assertion_count: 4
