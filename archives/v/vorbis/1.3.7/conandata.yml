# conandata.yml — vorbis 1.3.7
# Official upstream source: xiph/vorbis tag v1.3.7 (same tarball as the
# libvorbis/1.3.7 recipe: downloads.xiph.org official release archive).

sources:
  "1.3.7":
    url: "https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz"
    sha256: "0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab"

patches:
  "1.3.7":
    - patch_file: "patches/0001-cmake-minimum-version.patch"
      patch_description: "Raise cmake_minimum_required from 2.8.12 to 3.5 so modern CMake accepts the project"
      patch_type: "portability"
    - patch_file: "patches/0002-link-ogg-by-soname.patch"
      patch_description: "Link libogg by library name (controlled -L plus -Wl,-l:libogg.so) instead of the absolute CMakeDeps IMPORTED_LOCATION, keeping DT_NEEDED free of cache absolute paths"
      patch_type: "portability"
