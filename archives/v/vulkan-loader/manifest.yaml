software: vulkan-loader
description: Vulkan Runtime Loader - 发现和加载 Vulkan ICD 及 Layer
category: graphics
license: Apache-2.0
homepage: https://github.com/KhronosGroup/Vulkan-Loader
versions:
  - version: "1.3.295"
    status: built
    build_system: cmake
    configure_options:
      - CMAKE_SYSTEM_NAME=Linux
      - CMAKE_SYSTEM_PROCESSOR=aarch64
      - BUILD_WSI_XCB_SUPPORT=OFF
      - BUILD_WSI_XLIB_SUPPORT=OFF
      - BUILD_WSI_WAYLAND_SUPPORT=OFF
      - BUILD_WSI_DIRECTFB_SUPPORT=OFF
    artifacts:
      - vulkan-loader-1.3.295-ohos-aarch64.tar.gz
      - vulkan-loader-1.3.295-ohos-aarch64-debug.tar.gz
    dependencies:
      - vulkan-headers/1.3.295
    compiled_at: "2026-05-21"