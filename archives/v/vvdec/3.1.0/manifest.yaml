software: vvdec
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.1.0"

# 构建系统（顶级字段，供 verify-build 检索）
build_system: cmake

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/fraunhoferhhi/vvdec/archive/refs/tags/v3.1.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DVVDEC_INSTALL_VVDECAPP=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-clang-no_opt_simd.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Clang 不支持 GCC 的 optimize(no-tree-vectorize) 属性，需用 __clang__ 宏守卫"
  - "vvdec 默认不安装 vvdecapp 二进制，需 -DVVDEC_INSTALL_VVDECAPP=ON"
  - "vvdec 测试套需要外部 bitstream 文件，需 -DVVDEC_ENABLE_BITSTREAM_DOWNLOAD=ON 下载"
  - "使用 SIMDE 实现 x86 SIMD 跨平台到 ARM"

patch_generation:
  method: per-file-difflib
