# 软件级 manifest — vibes
software: vibes
display: "VIBES"
description: "VIsualizer for Intervals and BoxES — 以 JSON 命令向 VIBES 查看器发送绘图指令的 C++ 客户端库"
category: gfx
homepage: "https://github.com/ENSTABretagneRobotics/VIBES"
license: LGPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "只打包纯 C++11、零依赖的 client-api/C++ 客户端库（src/vibes.h + vibes.cpp，生成 libvibes），Qt GUI 查看器头less 不构建"
    - "client-api/C++ 无上游构建系统，配方直接编译 vibes.cpp（自定义 custom build），编译器从 tools.build:compiler_executables 解析（R33）"
    - "绘图/连接函数把 JSON 消息写入文件（查看器为独立进程监听文件），beginDrawing(file)+绘图命令可 headless 自测，无需 GUI"
    - "上游 C++ 客户端库无自动化测试套件（仅无断言 examples），test_package 以真实 API 消费者断言测试补全"
  common_dependencies: []

versions:
  "0.3.4":
    status: built
    build_date: "2026-09-19"
    conan_ref: "vibes/0.3.4"
