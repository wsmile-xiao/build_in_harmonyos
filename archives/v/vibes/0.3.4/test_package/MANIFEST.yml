# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: vibes/0.3.4
homepage: "https://github.com/ENSTABretagneRobotics/VIBES"

# 适配对象：VIBES C++ client API（client-api/C++）
# 上游测试套件存在性 (经审计上游源码 v0.3.4 确认：该 C++ 客户端库无自动化测试框架)
upstream_tests_exist: false

# 上游测试审计 (源码: VIBES-0.3.4.tar.gz,
# sha256 1a4f60b04d1ff6a7150aa602a22b3085e50163addf762548b4788e486e21e1fc)
upstream_test_audit:
  source_tarball: "v0.3.4.tar.gz (https://github.com/ENSTABretagneRobotics/VIBES/archive/refs/tags/v0.3.4.tar.gz)"
  source_sha256: "1a4f60b04d1ff6a7150aa602a22b3085e50163addf762548b4788e486e21e1fc"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / include(CTest) / add_test (ctest)"
    - "CATCH / doctest 断言框架引用"
    - "check_PROGRAMS / TESTS / make check (automake)"
    - "meson test wiring"
  scan_result: "client-api/C++ 仅含 src/vibes.h + src/vibes.cpp 与 examples/ 目录，无任何测试框架引用、无 enable_testing/add_test/CTest 接线、无 check/test 构建目标；examples/ 下的 CMakeLists.txt 仅把 vibes.cpp 编译进 all_commands / sivia_simple / pong 三个演示程序（driven by main()，非断言套件）。viewer/tests/all_commands.json 是 Qt 界面查看器的 JSON 输入 fixture（非可执行测试运行器），且 viewer 为 Qt5/Qt6 GUI 应用，OHOS 头less 环境不构建。"
  manual_programs_only:
    - "client-api/C++/examples/all_commands.cpp — 演示程序，VIBES_TEST 宏仅打印 'DONE' 无 pass/fail 断言，需连接 VIBES viewer 查看图形，非自动化断言套件"
    - "client-api/C++/examples/pong.cpp / sivia_simple.cpp — 演示程序，调用绘图 API 展示图形，无断言"
  reason: "VIBES C++ client API 0.3.4 上游发布包不含任何针对客户端库的自动化测试套件（只有无断言的 examples 演示程序与该库未被本配方打包的 Qt 查看器 fixture）"

# 上游测试命令 (无自动化套件，故 check 命令不适用)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

# 上游测试总数口径 (无测试, 如实为 0)
upstream_test_total: 0
upstream_test_count_method: none

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_vibes.cpp
    description: "消费者测试：以库使用者身份编译链接已安装 libvibes，13 项断言——(a) Value/Params JSON 序列化纯函数（int/decimal/bool/string/params key-value）；(b) 文件模式绘图端到端：beginDrawing(file)+newFigure/clearFigure/drawBox/drawLine/axisLimits 写出 JSON 消息到文件，校验文件非空且含 new/clear/draw-box/draw-line/viewbox/figure 等预期负载。全程无需 VIBES 查看器 GUI，headless 可跑。"
    command: "./test_vibes"

# 测试断言总数
assertion_count: 13
