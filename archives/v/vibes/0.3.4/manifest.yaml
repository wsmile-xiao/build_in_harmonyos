patches_applied: []
knowledge_gained:
  - "VIBES（VIsualizer for Intervals and BoxES）由 Qt 查看器应用与多语言客户端库组成；OHOS 只打包纯 C++11、零依赖的 client-api/C++ 库（src/vibes.h + vibes.cpp），Qt GUI 查看器无需也 h无面构建。"
  - "client-api/C++ 无 Makefile/CMake 构建系统（仅 examples/ 有 CMakeLists），需在 conanfile.py 直接调用编译器编译 vibes.cpp 生成 libvibes。"
  - "该库的所有绘图/连接函数把 JSON 消息写入文件（查看器是独立进程监听文件），因此 beginDrawing(file)+绘图命令可 headless 自测，无需 GUI。"
  - "Value::toJSONString()/Params::toJSON() 为纯函数，可直接做 JSON 序列化断言（int/decimal/bool/string/vt_object）。"
  - "beginDrawing(fileName) 用 fopen(fileName,'a') 打开文件并 fflush，测试可从另一句柄读取已冲刷内容。"
  - "上游 C++ 客户端库无自动化测试套件（examples 为无断言演示程序），test_package/MANIFEST.yml 声明 upstream_tests_exist:false + 审计；test_package 以真实 API 消费者测试（13 断言）补全。"
  - "配方直接编译需从 tools.build:compiler_executables 取编译器（R33），静态库归档用 llvm-ar/ar，勿依赖未定义 shell 环境变量。"
