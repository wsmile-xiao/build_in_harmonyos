# 版本级 manifest — vgrabbj 0.9.9

version: "0.9.9"
software: "vgrabbj"
status: built
build_date: "2026-09-19"
build_system: autotools

source:
  url:
    - "https://downloads.sourceforge.net/project/vgrabbj/vgrabbj/vgrabbj-0.9.9/vgrabbj-0.9.9.tar.gz"
    - "https://sourceforge.net/projects/vgrabbj/files/vgrabbj/vgrabbj-0.9.9/vgrabbj-0.9.9.tar.gz/download"
    - "https://nchc.dl.sourceforge.net/project/vgrabbj/vgrabbj/vgrabbj-0.9.9/vgrabbj-0.9.9.tar.gz"
    - "https://cytranet.dl.sourceforge.net/project/vgrabbj/vgrabbj/vgrabbj-0.9.9/vgrabbj-0.9.9.tar.gz"
    - "https://freefr.dl.sourceforge.net/project/vgrabbj/vgrabbj/vgrabbj-0.9.9/vgrabbj-0.9.9.tar.gz"
  sha256: "a4eb11c3eccbc97e6c31ff19bee4e8c2c485878bb2ab2eb0cc81b1721647feb1"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-timestamp"
    - "--disable-ftp"
  dependencies:
    - v4l/1.32.0 (共享, 复用 ohpcd 预编译二进制, 避免从源码重建 meson)
    - libjpeg/10
    - libpng/1.6.58 (共享, 标准 conan 配方, 与 aaphoto 同)
    - zlib/1.3.1.1 (由 libpng 传递引入)
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-mcheck.patch (portability): Guard <mcheck.h> include and mtrace() call behind defined(DEBUGGING) && DEBUGGING - mcheck.h is glibc-only, absent on OHOS, was breaking src/vgrabbj.h compile"

knowledge_gained:
  - "vgrabbj 是 CLI 工具（bin_PROGRAMS），非库，package_type=application，无需 cpp_info.libs"
  - "vgrabbj configure.ac 使用 PKG_CHECK_MODULES(LIBV4L1, libv4l1)，需 AutotoolsDeps + PkgConfigDeps 注入 flags 与 .pc 文件"
  - "v4l/1.32.0 包已包含 libv4l1 库和 pkg-config 声明，直接 requires 即可"
  - "OHOS 上禁用 --disable-timestamp 避免 libttf/freetype 依赖；禁用 --disable-ftp 避免 ftplib 头文件检查"
  - "【第二十二轮+终局】vgrabbj configure.ac 四个 AC_MSG_ERROR 硬检查按序：jpeg/m/png/z。jpeg/z 为静态 conan 库（libjpeg.a/libz.a），AC_CHECK_LIB 链接探测可通过；png 为共享库（libpng16.so），其 configure 期链接探测本机不可解（缺传递 -lz / libpng16.so 未版本化符号链接在 OHOS 上不可靠）。修复=在 AutotoolsToolchain configure_args 追加 ac_cv_lib_png_png_create_info_struct=yes 与 ac_cv_lib_z_crc32=yes 缓存变量短路（标准交叉编译手法；libpng/libz 是依赖闭包真实存在的库，非伪造）：configure 走 (cached) 分支跳过 conftest 链接，if-found 分支把 -lpng/-lz 追加进 Makefile LIBS，由 AutotoolsDeps LDFLAGS(-L) 在最终 make 解析，运行期由 LD_LIBRARY_PATH 提供。注意：库名保留 configure 原生 -lpng（不改写为 -lpng16）——aaphoto/0.45 同一真机同机制下以 -lpng 链接共享 libpng 成功，而改写成 -lpng16 后最终链接报 'unable to find library -lpng16'（未版本化 libpng16.so 符号链接在 OHOS 上不可用）"
  - "configure.ac 硬性 PKG_CHECK_MODULES([LIBV4L1], [libv4l1])，但 v4l 包 pkg_config_name=libv4l2，PkgConfigDeps 只生成 libv4l2.pc；须在 generate() 的 generators_folder（已在 conanbuild PKG_CONFIG_PATH 中）补写修正版 libv4l1.pc（绝对路径 -L/-l），否则 configure 在 pkg-config 阶段中止"
  - "E490: OHOS/HMDFS 路径可能丢失 autotools 辅助脚本的 execute bit，需 chmod 恢复"
  - "OHOS 受限文件系统下 config.status 的 umask 077 临时目录写入被拒，需降为 umask 022（source() 内改 configure）"
  - "vgrabbj 需在 source() 中用 get() 下载源码；缺少 source() 时 conan create 不会拉源码导致构建必然失败"
  - "vgrabbj 上游无测试框架（无 tests/ 目录、无 check target），upstream_tests_exist=false"
  - "共享 libpng/1.6.58 提供 libpng16（cpp_info.libs=['png16']）；vgrabbj configure.ac 用 AC_CHECK_LIB(png,...) 探测字面量 -lpng，与 aaphoto 原生一致，可被 AutotoolsDeps 注入的 -L<libpng libdir> 解析（共享 libpng16 及传递 libz）——不做库名改写"
  - "getcwd 兜底（aaphoto/aribb24 同思路，无副作用）：build() 预置 $PWD，source() patch 顶层 pwd 判定失败回退 $PWD（不覆盖 SHELL/CONFIG_SHELL，aaphoto 原生构建无需此覆盖）"
  - "【第二十三轮】vgrabbj.h 无条件 #include <mcheck.h>（glibc 专有头），OHOS libc 无此头 → 编译期 fatal error: 'mcheck.h' file not found（vgrabbj.h:48）。mtrace() 是 mcheck 唯一使用者，且调用在 #ifdef DEBUGGING 下。修复=conandata patch 0001-mcheck.patch：把 #include <mcheck.h> 与 mtrace() 调用都改为 #if defined(DEBUGGING) && DEBUGGING 守卫（默认 DEBUGGING 0 时两者都不启用；显式 -DDEBUGGING=1 的 glibc 调试构建仍生效）。"
  - "不得强制 libpng shared=False：定制 libpng/1.6.58.3 配方的 _relax_private_umask 严格要求 configure 中 umask 077 数量 == 2，本机依赖重建会抛 'unexpected number of private umask commands in configure'；改用共享 libpng/1.6.58（标准配方，宽松 umask 处理，二进制可从 ohpcd 远端取用）。与 aaphoto/aribb24/astrometry 等同路径，真机已验证。"
  - "【第二十六轮】最终链接阶段 configure 缓存短路后 `-lpng` 会优先命中 libpng 包内遗留的**静态 libpng.a**，而该静态归档的 pngrtran.c/pngrutil.c 引用 ARM NEON 实现（png_init_filter_functions_neon/png_riffle_palette_neon/png_do_expand_palette_*_neon）却没有对应 object → ld.lld undefined symbol。AutotoolsDeps 注入的 `-lpng16` 却解析到**共享 libpng16.so** 且无此报错（错误只出现 libpng.a、无 libpng16.a）。修复=build() 在 configure 前用 _locate_libpng_shared 定位共享库绝对路径，_patch_configure_libpng_abs 把 configure 里 `LIBS=\"-lpng  $LIBS\"`/`LIBS=\"-lpng $LIBS\"` 替换为共享库绝对路径，使最终 Makefile LIBS 直接链共享 libpng16.so、避开静态归档；SONAME 运行期由 LD_LIBRARY_PATH 提供。找不到共享库/文本不匹配时 output.warn 如实告警（宁缺毋假）。"
  - "【第二十七轮】_locate_libpng_shared 在真机返回 None 的原因：① 依赖访问只用 self.dependencies.get('libpng')（ConanFileDependencies 对 .get 支持不稳，取不到即早退不扫目录）；② glob+realpath 对 OHOS/HMDFS 的符号链接/版本化 .so 判定不可靠。修复=_find_libpng_dep 三路访问（get/索引/迭代按 ref.name）兜底；_locate_libpng_shared 改 os.listdir 列目录 + 手工 readlink 解析符号链接链 + isfile 校验，搜索 cpp_info.libdirs + lib/lib64 + 包根，只收含 .so 且非 .a/.la/.dylib/.tbd 的常规文件；找不到时 _describe_libpng_libdirs 把各 libdir 的 png* 条目真实列出打进 WARN；双路保障再于 build_folder/compat-lib 建 libpng.so→真实共享库符号链接并把 -L<compat-lib> 前置进 LDFLAGS。"
  - "【第二十八轮】【决定性】真机诊断（_describe_libpng_libdirs）证实本机 libpng/1.6.58 包 lib/ 内**只有静态归档 liblibpng16_static.a 与 libpng.a，没有任何共享 .so**——此前所有『改链共享 libpng16.so』的方向在本机根本不可行。`-lpng` 命中的 libpng.a 引用了 ARM NEON 符号（png_init_filter_functions_neon/png_riffle_palette_neon/png_do_expand_palette_rgba8_neon/png_do_expand_palette_rgb8_neon）却缺对应 object → ld.lld undefined symbol；libpng.a 应为残缺/转发归档，liblibpng16_static.a 是完整静态库。修复=_locate_libpng_archive()：枚举 libdirs+lib/lib64+包根全部 .a，用 nm -g --defined-only（_run_nm 依次试 $NM/llvm-nm/nm/nm-new）实证每个归档是否定义了上述 4 个 NEON 符号（_archive_defines_neon 解析，成员头 'a.o:' 不误匹配），选定义齐全者的绝对路径，用 _patch_configure_libpng_abs 把 configure LIBS \"-lpng\" 替换为完整归档绝对路径；nm 不可用时按命名（libpng16/带 _static）启发选择；所有归档都缺 NEON 时如实告警（宁缺毋假）。"



  - "\u3010第二十九轮\u3011\u3010决定性修正\u3011round28的\u300e选完整归档\u300f假设不成立：hmbs hook 诊断直证本机 libpng 包两个静态归档（libpng.a 与 liblibpng16_static.a）都缺失 4 个 ARM NEON 符号，且无共享 .so 可改链；任何选库路线都失败。因此弃用选库，改为自供缺失符号：_build_neon_stub() 编译 4 个 ARM NEON 符号的功能安全 stub（__attribute__((weak))，no-op/返回 0，libpng 所有调用点有标量回退，禁用 NEON 优化路径），归档为 libpngneonstub.a；注入方式为 configure 之后、make 之前，用 re.MULTILINE 正则，遍历 generated Makefile（build_folder+source_folder）把 -L<build_folder> -lpngneonstub 追加到 LIBS 行末尾（automake 链接规则末尾即 $(LIBS)，stub 出现在 -lpng 之后，ld.lld 多趟重扫归档补齐 NEON 符号）。不再 patch configure 脚本源码文本 (LIBS=\"-lpng $LIBS\")，多轮证明该文本在不同 autoconf 变体/缓存分支写法不可靠，补丁不落地就静默漏链。stub 编译/归档或 Makefile LIBS 未命中时 output.warn 如实告警（宁缺勿假）\u3002"
  - "【第三十轮】vgrabbj 冒烟测试不能用 `--help`/`-h`：上游 usage() 无条件 `exit(1)`（src/v_config.c line 111、opt_help 调 usage），故 `vgrabbj --help` 打印帮助后必返回退出码 1，test_package 的 self.run 因此抛 ConanException。真正的非设备、返回 0 的验证命令是 `vgrabbj -V`（opt_version -> exit(0)，src/v_config.c line 530-531；v_options.h 中 -V short_name='V'）。test_package 改用 `vgrabbj -V` 作冒烟断言（discovered=1/passedCount=1）并按仓库约定输出 HMBS_TEST_PACKAGE_RESULT 机器证据标记。"

patch_generation:
  method: conandata_patches
  patches_count: 1

patch_classification: []
