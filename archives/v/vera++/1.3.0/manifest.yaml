# 版本级 manifest — vera++ 1.3.0
version: "1.3.0"
software: vera++
status: built
build_date: "2026-08-14"
build_system: cmake

source:
  url: "https://github.com/verateam/vera/archive/refs/tags/v1.3.0.tar.gz"
  sha256: "32d1d29be8ec96556fa0935d908d2627daffbf117abd1aa639f5a1c64ae10ceb"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DVERA_PYTHON=OFF"
    - "-DVERA_LUA=OFF"
    - "-DVERA_USE_SYSTEM_BOOST=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - boost/1.84.0
    - tcl/8.6.14
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "制品仓 boost 包未编译 libboost_wave.a（仅 filesystem/iostreams/program_options/regex），vera++ 依赖 boost::wave，需从 boost 官方源码补编 wave 库（libs/wave/src 下 12 个源文件）"
  - "boost 包头文件已内置 BOOST_SP_NO_PTHREAD_SETCANCELSTATE 守卫（E127：鸿蒙无 pthread_setcancelstate），补编 wave 只需定义该宏，无需改源码"
  - "vera++ 1.3.0 是 CMake 构建（非 autotools），cmake_minimum_required 2.8.6 与 CMake 4.x 不兼容，需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "Tcl 解释器由 cpptcl 内置；Python/Lua 规则引擎可通过 VERA_PYTHON/VERA_LUA=OFF 关闭，规则脚本（.tcl）仍可用"
