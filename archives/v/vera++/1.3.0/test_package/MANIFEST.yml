# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: vera++/1.3.0
homepage: "https://github.com/verateam/vera"

# 上游测试命令: vera++ 通过 ctest 驱动（tests/ 目录），
# 上游构建系统为 CMake，测试目标为 tests/ 下的规则回归样例
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（tests/ 下每个规则对应一个样例文件，
# 由 ctest 以 vera++ 规则断言方式执行）
upstream_tests:
  - file: tests/L001.cpp
    source: vera++-1.3.0/tests/L001.cpp
    description: "L001 行长度规则样例（上游 ctest 回归样例）"
    command: "ctest -R L001"
  - file: tests/T011.cpp
    source: vera++-1.3.0/tests/T011.cpp
    description: "T011 大括号对齐规则样例（上游 ctest 回归样例）"
    command: "ctest -R T011"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: sample.cpp
    description: "运行完整 profile 对违规样例执行规则分析，断言规则真实触发"
    command: "vera++ -p full -s sample.cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 56
