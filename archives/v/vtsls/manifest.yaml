software: vtsls
display: "@vtsls/language-server"
description: "LSP wrapper for TypeScript extension of VSCode"
category: language-server
homepage: "https://github.com/yioneko/vtsls"
license: MIT
build_system: npm

ohos_adaptation:
  key_points:
    - "Node.js application, requires Node.js >= 16"
    - "Uses pnpm for building, requires git submodule (vscode)"
    - "HMDFS does not support hard links (E079), pnpm store-dir must be set to non-HMDFS directory"
  common_dependencies:
    - nodejs
    - pnpm

versions:
  "0.3.0":
    status: published
    build_date: "2026-06-05"
    published_as: vtsls