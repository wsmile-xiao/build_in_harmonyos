version: "0.3.0"
status: published
build_date: "2026-06-05"

source:
  url: "https://github.com/yioneko/vtsls"
  sha256: ""
  tar_format: git-clone
  git_ref: main
  git_submodules:
    - vscode

build:
  system: npm-pnpm
  configure_options: []
  dependencies:
    - nodejs/16+
    - pnpm/10+
  cc: none
  cxx: none

patches_applied: []

knowledge_gained:
  - "Node.js 应用不适用传统 ELF 签名"
  - "pnpm 需要 store-dir 配置避免 HMDFS 硬链接问题（E079）"
  - "git submodule (vscode) 需要浅层克隆 (--depth=1)"
  - "stdin.setRawMode 在某些环境不可用，构建脚本可能卡住"