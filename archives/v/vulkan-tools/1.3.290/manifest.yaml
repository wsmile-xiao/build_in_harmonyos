software: vulkan-tools
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3.290/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.290"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/KhronosGroup/Vulkan-Tools/archive/refs/tags/vulkan-sdk-1.3.290.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_CUBE=OFF"
    - "-DBUILD_WSI_XCB_SUPPORT=OFF"
    - "-DBUILD_WSI_XLIB_SUPPORT=OFF"
    - "-DBUILD_WSI_WAYLAND_SUPPORT=OFF"
    - "-DBUILD_WSI_DIRECTFB_SUPPORT=OFF"
    - "-DINSTALL_ICD=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "vulkan-headers/1.3.295"
    - "volk/1.3.295"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []