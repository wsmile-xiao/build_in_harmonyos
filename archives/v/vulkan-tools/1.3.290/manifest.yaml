software: vulkan-tools
build_system: cmake
# 版本级 manifest
# 文件位置: archives/v/vulkan-tools/1.3.290/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.3.290"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-23"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/KhronosGroup/Vulkan-Tools/archive/refs/tags/vulkan-sdk-1.3.290.0.tar.gz"
  sha256: "9d8a941f3cedd904774e888871840dd9b5df4de7682d741181b5c9af58a46420"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_CUBE=OFF"
    - "-DBUILD_WSI_XCB_SUPPORT=OFF"
    - "-DBUILD_WSI_XLIB_SUPPORT=OFF"
    - "-DBUILD_WSI_WAYLAND_SUPPORT=OFF"
    - "-DBUILD_WSI_DIRECTFB_SUPPORT=OFF"
    - "-DINSTALL_ICD=ON"
  dependencies:
    - "vulkan-headers (built from source in recipe)"
    - "volk (built from source in recipe)"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "vulkan-headers和volk未发布到Conan制品仓，在recipe内从源码构建"
  - "HarmonyOS平台CMake需设置CMAKE_SYSTEM_NAME=Linux"
  - "WSI(XCB/Xlib/Wayland/DirectFB)在HarmonyOS不可用，需禁用"
  - "BUILD_CUBE需禁用(cube依赖WSI)"
  - "INSTALL_ICD默认OFF，需显式启用以安装Mock ICD"

patch_generation:
  method: none
  patches_count: 0

patch_classification: []
    guard: 'pending'
