# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: vulkan-tools/1.3.290
homepage: "https://github.com/KhronosGroup/Vulkan-Tools"

# Vulkan-Tools has no `make check` / `ctest` — it ships binaries (vulkaninfo, Mock ICD).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无正式测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "执行 vulkaninfo --summary 验证二进制可运行；验证 Mock ICD 库和 JSON 清单文件存在"
    command: "conan test"

# 测试断言总数 (二进制存在性检查 + 库存在性检查 + JSON存在性检查 + vulkaninfo执行)
assertion_count: 4
