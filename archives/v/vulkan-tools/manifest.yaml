software: vulkan-tools
display: "Vulkan Tools"
description: "Vulkan Development Tools including vulkaninfo and Mock ICD"
category: gfx
homepage: "https://github.com/KhronosGroup/Vulkan-Tools"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "需要设置 CMAKE_SYSTEM_NAME=Linux（HarmonyOS 基于 Linux 内核）"
    - "禁用所有 WSI 支持（XCB/Xlib/Wayland/DirectFB）"
    - "需要启用 INSTALL_ICD 选项以安装 Mock ICD"
  common_dependencies:
    - vulkan-headers
    - volk

versions:
  "1.3.290":
    status: published
    build_date: "2026-05-21"
    published_as: vulkan-tools