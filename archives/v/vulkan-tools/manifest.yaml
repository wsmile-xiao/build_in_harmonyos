software: vulkan-tools
display: "Vulkan Tools"
description: "Vulkan Development Tools including vulkaninfo and Mock ICD"
category: gfx
homepage: "https://github.com/KhronosGroup/Vulkan-Tools"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMAKE_SYSTEM_NAME=Linux (HarmonyOS基于Linux内核)"
    - "禁用所有WSI支持(XCB/Xlib/Wayland/DirectFB)"
    - "启用INSTALL_ICD安装Mock ICD"
    - "vulkan-headers和volk从源码构建(未发布到Conan制品仓)"
  common_dependencies:
    - vulkan-headers
    - volk

versions:
  "1.3.290":
    status: built
    build_date: "2026-08-23"
    published_as: vulkan-tools
