# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: veque/1.3.7
homepage: "https://github.com/Shmoopty/veque"

# veque 上游无构建系统（tarball 内无 CMakeLists.txt / Makefile / configure），
# 测试入口是 test/ 下自带的 catch.hpp（Catch2 v2 单头）+ main.cpp。
# 实跑形态：11 个编译单元 → 按 TU 分 10 个测试程序（test_types.h 的变量模板显式特化
# 无 inline，多 TU 一次链接必撞 duplicate symbol）。
upstream_check_command: "clang++ -std=c++17 -I test -I include -c test/*.cpp && clang++ -std=c++17 main.o <name>.o -o bin_<name> && ./bin_<name>"

# conanfile.py build() 方法中是否已集成上游测试
# （header-only + 上游无构建系统：配方 build() 不编译，上游测试在设备验证阶段单独执行）
upstream_test_in_build: false
upstream_test_command: "HOME=$TASK_DIR/test-home $TASK_DIR/upstream-test/bin_<name>   # 设备实跑证据见 reports/test-report.md"

# 上游实际运行的测试程序（10 个，按测试源逐个链接运行）
upstream_tests:
  - file: bin_test_deque_parity
    source: veque-1.3.7.tar.gz/test/test_deque_parity.cpp
    description: "TEMPLATE_PRODUCT_TEST_CASE 4 模板 x 16 类型组合 → 64 case"
    command: "./bin_test_deque_parity"
  - file: bin_test_end_growth
    source: veque-1.3.7.tar.gz/test/test_end_growth.cpp
    description: "TEMPLATE_PRODUCT_TEST_CASE 4 模板 x 32 类型组合 → 128 case"
    command: "./bin_test_end_growth"
  - file: bin_test_hashing
    source: veque-1.3.7.tar.gz/test/test_hashing.cpp
    description: "TEMPLATE_LIST_TEST_CASE(MyTypes) 48 项类型清单 → 48 case"
    command: "./bin_test_hashing"
  - file: bin_test_insert_erase
    source: veque-1.3.7.tar.gz/test/test_insert_erase.cpp
    description: "TEMPLATE_PRODUCT_TEST_CASE 4 模板 x 16 类型组合 → 64 case"
    command: "./bin_test_insert_erase"
  - file: bin_test_insertion_growth
    source: veque-1.3.7.tar.gz/test/test_insertion_growth.cpp
    description: "TEMPLATE_PRODUCT_TEST_CASE 4 模板 x 16 类型组合 → 64 case"
    command: "./bin_test_insertion_growth"
  - file: bin_test_ordering
    source: veque-1.3.7.tar.gz/test/test_ordering.cpp
    description: "TEMPLATE_PRODUCT_TEST_CASE 4 模板 x 16 类型组合 → 64 case"
    command: "./bin_test_ordering"
  - file: bin_test_reassignment
    source: veque-1.3.7.tar.gz/test/test_reassignment.cpp
    description: "TEMPLATE_PRODUCT_TEST_CASE 4 模板 x 16 类型组合 → 64 case"
    command: "./bin_test_reassignment"
  - file: bin_test_resize
    source: veque-1.3.7.tar.gz/test/test_resize.cpp
    description: "TEMPLATE_PRODUCT_TEST_CASE 4 模板 x 32 类型组合 → 128 case"
    command: "./bin_test_resize"
  - file: bin_test_strong_exception_guarantee
    source: veque-1.3.7.tar.gz/test/test_strong_exception_guarantee.cpp
    description: "TEMPLATE_PRODUCT_TEST_CASE 4 模板 x 32 类型组合 → 128 case"
    command: "./bin_test_strong_exception_guarantee"
  - file: bin_test_vector_parity
    source: veque-1.3.7.tar.gz/test/test_vector_parity.cpp
    description: "TEMPLATE_PRODUCT_TEST_CASE 3 模板 x 16 类型组合 → 48 case"
    command: "./bin_test_vector_parity"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "veque 消费者实例化测试：读写/at 越界/连续内存/insert-erase/前端 resize/容量族/迭代器算法/非平凡类型/强异常保证接口，运行期断言 67 条"
    command: "./test_veque"

# ── N 的取数命令（R51 候选数法：候选取最大值，差额逐项归因）────────────────
# 口径 = Catch2 test case（用例单位），四种口径不混用：
#   1) 源码宏数  : grep -ohE 'TEMPLATE_[A-Z_]*TEST_CASE|TEST_CASE\(' veque-1.3.7/test/*.cpp | wc -l   → 10
#      （9 处 TEMPLATE_PRODUCT_TEST_CASE + 1 处 TEMPLATE_LIST_TEST_CASE）
#   2) 框架注册数: 逐程序 bin_<name> --list-test-names-only | wc -l 后求和          → 800
#   3) 运行期报告: 逐程序 bin_<name> → "All tests passed (<A> assertions in <M> test cases)"
#      合计 800 case / 13762477 assertions，10 个程序 rc=0                          → 800
#   4) 断言口径  : grep -ho 'REQUIRE(' test/*.cpp | wc -l → 116 / 'CHECK(' → 224（源码词面，不作 N）
#   SECTION 口径 : grep -ho 'SECTION(' test/*.cpp | wc -l → 51（不作 N）
#   差额归因：10 处宏 → 800 注册 case，差 790 全部来自 Catch2 模板用例宏展开
#             （TEMPLATE_PRODUCT = 模板 x 类型组合；TEMPLATE_LIST = 类型清单项数），
#             逐文件表格见 reports/test-report.md；注册数 == 实跑数（800 == 800），无未运行项。
# test_package 消费者断言数（上游 assertion 口径见上方取数命令，只作附注、不作 N）
assertion_count: 67
