# 版本级 manifest
# 文件位置: archives/v/veque/1.3.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.7"

# 软件名
software: "veque"

# 编译状态
# published | built | failed | archived
# （O5：合并并确认 release upload 之前一律 built，不得写 published）
status: "built"

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
# header-only：上游 tarball 不含 CMakeLists.txt / Makefile / configure，
# 配方不运行任何上游构建系统（无标准构建入口可归类，故为 custom）
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档，R39）
  url: "https://github.com/Shmoopty/veque/archive/refs/tags/v1.3.7.tar.gz"

  # 源码校验和（2026-09-25 实测下载值，与 conan-center-index conandata 全值一致）
  sha256: "f67ae3ce3f3e16e60f63bc8d4df0c606a6dfbc8651e01cba5a6c4ed1209349b1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表（header-only：配方不运行上游构建系统，无配置选项）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # 头文件只 include C++ 标准库，无外部依赖（W0 预检 w0-deps.txt = none）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（源码未修改，零补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（行尾注释 # knowledge_ref: 指向既有条目/新草稿号，官方脚本与 overlay 都认的唯一形态）
knowledge_gained:
  - "veque 1.3.7 是 header-only C++17 容器（单头 include/veque.hpp），package_type=header-library，package() 只拷贝头文件与 LICENSE，package_id 清空，零外部依赖"  # knowledge_ref: DRAFT-E744-veque-1.3.7-header-only-catch2-upstream-test-count
  - "上游 tarball 无 CMakeLists/Makefile/configure → manifest build.system=custom；配方 build() 不编译、不伪造日志（R34），finish 内嵌 G0 clean_verify 报「未找到任何构建入口」属预期非阻塞告警"  # knowledge_ref: DRAFT-E744-veque-1.3.7-header-only-catch2-upstream-test-count
  - "上游测试由 test/ 自带 catch.hpp（Catch2 v2 单头）驱动：源码宏 10 处（9×TEMPLATE_PRODUCT_TEST_CASE + 1×TEMPLATE_LIST_TEST_CASE）展开为框架注册 800 case，实跑 800/800 全过（13762477 assertions）；四口径分列不混用，N 取最大候选 800"  # knowledge_ref: DRAFT-E744-veque-1.3.7-header-only-catch2-upstream-test-count
  - "上游测试树在头文件里对变量模板做无 inline 的显式特化（test_types.h 的 val<T,N>），多 TU 一次链接必撞 duplicate symbol → 按 TU 分 10 个测试程序分别链接运行（不改上游源码）"  # knowledge_ref: DRAFT-E744-veque-1.3.7-header-only-catch2-upstream-test-count
  - "手工编译上游测试必须同时给两个 include 目录（-I test -I include）：测试源 include \"veque.hpp\" 实际位于 include/，只给 -I test 会 fatal error: file not found，表现为上游测试 0 执行"  # knowledge_ref: DRAFT-E744-veque-1.3.7-header-only-catch2-upstream-test-count
  - "test_package 消费者断言 67 条（读写/at 越界/连续内存/insert-erase/前端 resize/容量族/迭代器算法/非平凡类型/强异常保证接口），实跑 VEQUE-CONSUMER checks=67 failures=0，计入「鸿蒙特有测试」行、不进上游分母"  # knowledge_ref: DRAFT-E744-veque-1.3.7-header-only-catch2-upstream-test-count
