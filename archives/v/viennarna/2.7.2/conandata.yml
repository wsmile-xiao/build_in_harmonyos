# conandata.yml — ViennaRNA 2.7.2
# Single source of truth for source URL + SHA256 + patches.
#
# URL: official ViennaRNA Github release asset (the org maintains GitHub
# releases alongside the website tarballs). The `url:` is an ordered list:
# mirror first (gh-proxy.com, per ci/conan/build_and_test.sh get_mirrors),
# official github.com last as fallback. conanfile.py.source() iterates the
# list and tries each mirror in order, so the build survives a github.com
# connect timeout on the real device. sha256 is unchanged for every mirror.
sources:
  "2.7.2":
    url:
      - "https://gh-proxy.com/https://github.com/ViennaRNA/ViennaRNA/releases/download/v2.7.2/ViennaRNA-2.7.2.tar.gz"
      - "https://github.com/ViennaRNA/ViennaRNA/releases/download/v2.7.2/ViennaRNA-2.7.2.tar.gz"
    sha256: "4cb7aaca00dfac92cb36b030c9111487c170b90568759bd4ffedd8318cc9384f"

patches:
  - patch_file: "patches/0003-Makefile.in-no-doc.patch"
    patch_description: "Drop doc/doxygen and doc from the top-level SUBDIRS list in Makefile.in so the reference-manual build (which needs doxygen/sphinx/pdflatex, all absent on OHOS) is never entered. WITH_REFERENCE_MANUAL stays enabled despite --without-doc, and with no doxygen binary the nested WITH_REFERENCE_MANUAL_BUILD rule for noinst_DATA xml/* is never emitted -> 'No rule to make target xml/*' at make time. Removing the doc subdirs from SUBDIRS eliminates the failing target entirely."
    patch_type: "build"
