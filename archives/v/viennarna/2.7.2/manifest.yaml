software: viennarna
version: "2.7.2"
status: built
build_date: "2026-09-19"
build_system: autotools

source:
  url: "https://github.com/ViennaRNA/ViennaRNA/releases/download/v2.7.2/ViennaRNA-2.7.2.tar.gz"
  sha256: "4cb7aaca00dfac92cb36b030c9111487c170b90568759bd4ffedd8318cc9384f"
  tar_format: tar.gz

build:
  system: autotools
  options:
    - "--host=<derived from Conan settings.arch>"
    - "--build=<derived from Conan settings_build.arch>"
    - "--without-python"
    - "--without-perl"
    - "--without-swig"
    - "--without-gsl"
    - "--disable-mpfr"
    - "--without-svm"
    - "--without-forester"
    - "--without-kinfold"
    - "--without-rnalocmin"
    - "--disable-lto"
    - "--disable-openmp"
    - "--disable-vectorize"
    - "--disable-simd"
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - check/0.15.2
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0003-Makefile.in-no-doc.patch"
  - "in-recipe content-anchored OHOS recognition (config/config.sub + config/config.guess, see conanfile.py _apply_ohos_gnu_config_patches)"

knowledge_gained:
  - "ViennaRNA ships checkmk-generated .c unit-test sources in the tarball (no checkmk build tool needed); only the check library (check/0.15.2) is required to link the 10 C-library unit tests (PKG_CHECK_MODULES [check >= 0.9.4])."
  - "libRNA_la_LDFLAGS forces -static, so the package always produces a static libRNA.a (shared option rejected in validate)."
  - "The bundled dlib (C++17) is compiled into libRNA, so libRNA.a is a mixed C/C++ archive; consumers must link the C++ standard library (libc++ on OHOS)."
  - "libsvm support injects -lstdc++ into the link, which does not resolve on OHOS's libc++ toolchain; --without-svm avoids it (SVM only powers RNALfold z-scores; swig interfaces disabled via --without-swig so no wrapper regeneration is required)."
  - "The scripting interfaces (Python/Perl/SWIG) are separate deliverables (upstream binary packages list them as distinct components); they are disabled, which also auto-disables the 46 Python2/Python3 + 14 Perl interface unit tests, leaving 19 native test ENTRIES registered in TESTS (10 Check C-programs + 9 executable TAP scripts). The HMBS rule4 gate measures this make check at the TAP-assertion unit, so upstream_test_total=83 (the 83 TAP ok/not ok lines from the 9 executable scripts)."
  - "The gengetopt/help2man/xxd maintainer tools are only needed for regeneration; the release tarball ships generated _cmdl.c and .hex template files, so a plain configure+make works."

patch_classification:
  - file: "patches/0003-Makefile.in-no-doc.patch"
    type: "build"
    platform_only: true
    guard: "none"
  - file: "in-recipe content-anchored OHOS recognition (conanfile.py _apply_ohos_gnu_config_patches)"
    type: "portability"
    platform_only: true
    guard: "none"
    note: "applied as content-anchored string edits, not a shipped patch file, so drifted/newer-generation config scripts in the fetched archive cannot abort the build"
