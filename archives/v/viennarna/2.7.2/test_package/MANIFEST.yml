# test_package/MANIFEST.yml
# 上游官方测试声明文件 — ViennaRNA 2.7.2
# gnome automake TAP harness (make check). tests/Makefile.am registers
# 19 test ENTRIES:
#   LIBRARY_TESTS       (WITH_CHECK, C-library Check programs):  10
#   EXECUTABLE_TESTS    (WITH_EXECUTABLE_TESTS, TAP scripts):     9
#   PERL / PYTHON3 / PYTHON2 tests are auto-disabled because the
#   Python/Perl/SWIG scripting interfaces are separate deliverables and are
#   NOT built in this C-library + programs package (--without-python/perl/swig).
# The HMBS rule4 evidence gate measures this make check at the TAP-assertion
# unit, so upstream_test_total counts the 83 TAP `ok`/`not ok` result lines
# emitted by the 9 executable scripts (14+3+21+2+14+6+17+2+4 = 83); the 10
# Check C-programs report in check's own (non-TAP) format and add no TAP
# assertion lines. 合计（TAP-assertion 口径，与真机 rule4 计数一致）: 83

package: viennarna/2.7.2
homepage: "https://www.tbi.univie.ac.at/RNA/"

# 上游测试命令（automake make check）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试（Layer 1: make check 在 build() 末尾执行）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试是否真实存在（已通过源码审计确认，非 no_tests）
upstream_tests_exist: true
# 官方注册总数：TAP-assertion 口径 = 83（9 个可执行 TAP 脚本的 ok/not ok 断言行总数，
# 与真机 rule4 计数一致）。make check 同时注册 19 个测试条目（10 个 Check C 程序 +
# 9 个 TAP 脚本），但 rule4 以 TAP 断言行为统计单位。
upstream_test_total: 83
upstream_test_count_method: autotools_tests

# 上游 C 库单元测试（check 框架，checkmk 预生成 .c 已随 tarball 发布，仅需 check 库链接）
upstream_tests:
  - file: tests/energy_evaluation.c
    source: tests/energy_evaluation.ts
    description: "能量评估库函数单元测试（check 框架）"
    command: "./energy_evaluation"
  - file: tests/constraints.c
    source: tests/constraints.ts
    description: "硬约束处理单元测试（check 框架）"
    command: "./constraints"
  - file: tests/constraints_soft.c
    source: tests/constraints_soft.ts
    description: "软约束处理单元测试（check 框架）"
    command: "./constraints_soft"
  - file: tests/ensemble_defect.c
    source: tests/ensemble_defect.ts
    description: "ensemble defect 计算单元测试（check 框架）"
    command: "./ensemble_defect"
  - file: tests/fold.c
    source: tests/fold.ts
    description: "RNA 折叠算法单元测试（check 框架）"
    command: "./fold"
  - file: tests/utils.c
    source: tests/utils.ts
    description: "工具函数单元测试（check 框架）"
    command: "./utils"
  - file: tests/eval_structure.c
    source: tests/eval_structure.ts
    description: "结构评价单元测试（check 框架）"
    command: "./eval_structure"
  - file: tests/walk.c
    source: tests/walk.ts
    description: "结构空间游走单元测试（check 框架）"
    command: "./walk"
  - file: tests/neighbor.c
    source: tests/neighbor.ts
    description: "结构邻居单元测试（check 框架）"
    command: "./neighbor"
  - file: tests/hash_table.c
    source: tests/hash_table.ts
    description: "哈希表单元测试（check 框架）"
    command: "./hash_table"

# 上游可执行程序测试（TAP 脚本，运行 RNAfold/RNAcofold/RNAalifold 并 diff 参照输出）
upstream_program_tests:
  - file: tests/RNAfold/general
    description: "RNAfold 常规功能测试（版本号、dangle 模式）"
    command: "./RNAfold/general"
  - file: tests/RNAfold/partfunc
    description: "RNAfold 配分函数测试"
    command: "./RNAfold/partfunc"
  - file: tests/RNAfold/special
    description: "RNAfold 特殊功能测试"
    command: "./RNAfold/special"
  - file: tests/RNAfold/long
    description: "RNAfold 长序列测试"
    command: "./RNAfold/long"
  - file: tests/RNAcofold/general
    description: "RNAcofold 常规测试"
    command: "./RNAcofold/general"
  - file: tests/RNAcofold/partfunc
    description: "RNAcofold 配分函数测试"
    command: "./RNAcofold/partfunc"
  - file: tests/RNAalifold/general
    description: "RNAalifold 常规测试"
    command: "./RNAalifold/general"
  - file: tests/RNAalifold/partfunc
    description: "RNAalifold 配分函数测试"
    command: "./RNAalifold/partfunc"
  - file: tests/RNAalifold/special
    description: "RNAalifold 特殊功能测试"
    command: "./RNAalifold/special"

# test_package 自带的消费者测试（Layer 2，验证链接与 API 调用）
test_package_tests:
  - file: test_viennarna.c
    description: "消费者测试：vrna_fold_compound + vrna_mfe 折叠序列并校验 MFE 结构长度/合法字符/负能量/参照折叠（4 断言）"
    command: "./test_viennarna"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 4
