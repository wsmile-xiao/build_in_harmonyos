software: viennarna
display: "ViennaRNA"
description: "The ViennaRNA Package — a C code library and stand-alone programs for the prediction and comparison of RNA secondary structures"
category: library
homepage: "https://www.tbi.univie.ac.at/RNA/"
license: "LicenseRef-ViennaRNA"
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 构建；libRNA.a 强制静态（upstream LDFLAGS -static），内含 bundled dlib C++ 对象，下游需链接 C++ 标准库（libc++）"
    - "config/config.sub 与 config/config.guess 需打 HarmonyOS (ohos) 识别补丁"
    - "configure 需可用 awk 与 diff；TMPDIR 指向可写构建目录（OHOS /tmp 只读）"
    - "libsvm 注入 -lstdc++ 在 OHOS libc++ 工具链上无法解析，需 --without-svm"
    - "GSL/MPFR/Python/Perl/SWIG 接口均为可选/独立交付物，打包时禁用"
  common_dependencies:
    - check

versions:
  "2.7.2":
    status: built
    build_date: "2026-09-19"
