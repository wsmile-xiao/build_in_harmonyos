# conandata.yml — vbackup 1.0.1
#
# 源码使用官方 GitHub tag 归档（精确对应 v1.0.1）。
# GitHub archive 不含预生成的 configure，build() 中以 autoreconf -fi 自举。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/sharhalakis/vbackup/archive/refs/tags/v1.0.1.tar.gz"
    - "https://github.com/sharhalakis/vbackup/archive/refs/tags/v1.0.1.tar.gz"
  sha256: "11f075b7eabf0a7d1dd786f3bea4292b6c58b7cd147d52728fc967e3d25d4d08"

patches:
  - patch_file: "patches/0001-vbackup-env-bash-shebangs.patch"
    strip: 1
    patch_description: "脚本 shebang 由 /bin/bash 改为 /usr/bin/env bash（OHOS 上 bash 不在 /bin；脚本使用 [[ ]]、=~、BASH_REMATCH 等 bashism，只改解释器查找方式）"
    patch_type: "portability"
  - patch_file: "patches/0002-vbackup-relocatable-prefix.patch"
    strip: 1
    patch_description: "脚本内 prefix/datarootdir/myhelperdir 等编译期路径改为从脚本自身位置推导（可重定位包），common.in 经 BASH_SOURCE 推导，避免把构建机缓存绝对路径烘焙进制品"
    patch_type: "portability"
