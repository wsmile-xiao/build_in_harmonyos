# test_package/MANIFEST.yml
# 上游官方测试声明文件（vbackup 1.0.1）

package: vbackup/1.0.1
homepage: "https://github.com/sharhalakis/vbackup"

# 上游测试命令（上游无真实测试：make check 为 automake 占位符，check-am "Nothing to be done"）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\", args=[\"-j1\"])"

# 上游实际运行的测试程序
# 上游静态用例数 N_static = 0（scripts/ 纯 bash 脚本模块，无测试源、
# 无测试注册；make check 递归各子目录均为占位目标，无任何断言执行）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    source: test_package/test.sh
    description: "消费者测试：以使用者身份运行打包后的 vbackup --version，断言版本横幅输出与退出码 0"
    command: "vbackup --version"
