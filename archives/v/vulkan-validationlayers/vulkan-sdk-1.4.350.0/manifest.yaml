software: vulkan-validationlayers
version: "vulkan-sdk-1.4.350.0"
status: published
build_system: cmake
build_date: "2026-05-27"

source:
  url: "https://github.com/KhronosGroup/Vulkan-ValidationLayers/archive/refs/tags/vulkan-sdk-1.4.350.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DBUILD_WSI_XCB_SUPPORT=OFF"
    - "-DBUILD_WSI_XLIB_SUPPORT=OFF"
    - "-DBUILD_WSI_XLIB_XRANDR_SUPPORT=OFF"
    - "-DBUILD_WSI_WAYLAND_SUPPORT=OFF"
    - "-DBUILD_TESTS=OFF"
    - "-DBUILD_WERROR=OFF"
    - "-DUPDATE_DEPS=OFF"
  dependencies:
    - "vulkan-headers/v1.4.350"
    - "spirv-headers/sdk-1.4.350.0"
    - "spirv-tools/2026.2.1"
    - "vulkan-utility-libraries/a96bd4933c6adfc21329d15e9999791a0153bbf3"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
    - "VVL requires matching Vulkan-Headers version (v1.4.350 for vulkan-sdk-1.4.350.0)"
    - "CMAKE_SYSTEM_NAME=Linux needed for OpenHarmony platform detection in cmake"
    - "WSI support options (XCB/Xlib/Wayland) must be disabled on OpenHarmony as they are unavailable"
    - "UPDATE_DEPS=OFF when building with manually-installed dependencies"
    - "Dependencies must be pre-installed: Vulkan-Headers, SPIRV-Headers, Vulkan-Utility-Libraries, SPIRV-Tools-opt"
