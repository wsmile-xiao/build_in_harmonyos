software: vbindiff
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0_beta5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0_beta5"

# 编译状态
# published | built | failed | archived
status: published
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/madsen/vbindiff/archive/e478092.tar.gz"

  # 源码校验和
  sha256: "215ed2fd0f10a6ef434b549be69cc4804f1e28b9e694c0d0ae0c78f51fe887fb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "ncurses/6.4"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.h.in.patch"
  - "0002-curses-ConWin.hpp.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ncurses 预编译包缺少开发头文件，需从源码 curses.h.in 手动替换 @VAR@ 变量生成 curses.h"
  - "curses.h.in 模板不含 KEY_* 函数键常量定义段，需手动追加 KEY_DOWN=0402 至 KEY_MAX=0777"
  - "ncurses 头文件由 curses.h.in + curses.tail 组合而成，组装时必须确保 extern \"C\" 正确闭合"
  - "ncurses 宏 clear/move/erase/box/refresh 与 C++ 类成员函数名冲突，需在 C++ 代码中 #undef 这些宏"
  - "vbindiff 3.0_beta5 GetOpt 子模块需手动从 GitHub madsen/free-getopt 下载填充"
  - "vbindiff man page 生成依赖 Perl Template 模块，沙箱缺此模块需手动创建简易 man page"
  - "unctrl.h 中 @NCURSES_SP_FUNCS@ 等变量需手动替换为具体值（0 或 1）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/vbindiff-3.0_beta5.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/vbindiff-3.0_beta5.work
  source_orig_hash: 4226a2b58dea05b9
  source_work_hash: c52c0e4890f67796
  generated_at: '2026-06-03T14:34:00'
  patches_count: 2

patch_classification:
  - file: 0001-config.h.in.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-curses-ConWin.hpp.patch
    type: auto
    platform_only: True
    guard: 'pending'
