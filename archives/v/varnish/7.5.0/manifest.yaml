software: varnish
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/7.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.5.0"

# 构建系统类型
build_system: "autotools"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ghfast.top/https://github.com/varnishcache/varnish-cache/archive/refs/tags/varnish-7.5.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-rst2man=rst2man.py"
    - "--with-rst2html=rst2html.py"
    - "--with-sphinx-build=sphinx-build"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libedit/20240808"
    - "pcre2/10.42"
    - "ncurses/6.4"
    - "docutils/0.22.4"
    - "sphinx/9.1.0"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-bin-varnishtest-vtc_logexp.c.patch"
  - "0002-bin-varnishtest-vtc_server.c.patch"
  - "0003-bin-varnishtest-vtc_syslog.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS平台pthread_cancel未实现，需要使用#ifdef __OHOS__守卫跳过"
  - "从GitHub下载的源码包缺少configure文件，需要手动运行autogen.sh生成"
  - "需要手动创建rst2man.py、rst2html.py wrapper脚本"
  - "ncurses只有静态库，需要手动创建pkg-config文件"
  - "libedit.so软链接缺失，需要手动创建"
  - "make check会超时，可跳过并记录原因"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
