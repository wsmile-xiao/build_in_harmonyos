# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求存在）
package: vecgeom/1.2.8
homepage: "https://gitlab.cern.ch/VecGeom/VecGeom"

# 上游测试入口：CMake + ctest（BUILD_TESTING=ON，test/ 子目录注册 ctest 用例）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py 的 build() 内已集成并真实执行上游 ctest
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --output-junit upstream-ctest.xml"

# 上游实际运行的测试程序（test/CMakeLists.txt 注册的 ctest 用例，默认选项 45 项）
upstream_tests:
  - file: test/unit_tests/TestBox.cpp
    source: vecgeom-1.2.8/test/unit_tests/TestBox.cpp
    description: "Box 几何量与 Inside/Extent 校验（ctest: TestBox）"
    command: "ctest -R TestBox"
  - file: test/core/TestVector.cpp
    source: vecgeom-1.2.8/test/core/TestVector.cpp
    description: "Vector3D/Vector2D 模板与运算（ctest: TestVector）"
    command: "ctest -R TestVector"
  - file: test/core/TestGeoManager.cpp
    source: vecgeom-1.2.8/test/core/TestGeoManager.cpp
    description: "GeoManager 世界几何管理（ctest: TestGeoManager）"
    command: "ctest -R TestGeoManager"

# test_package 自带的消费者测试（视角：消费者链接并使用该包）
test_package_tests:
  - file: test_vecgeom.cpp
    description: "消费者调用 VecGeom::SimpleBox 的 Capacity/SurfaceArea/Inside/Extent"
    command: "./test_vecgeom"
  - file: test_ohos.cpp
    description: "鸿蒙特有用例：__OHOS__ 平台识别 + 运行时几何导航（仅 OHOS 目标）"
    command: "./test_ohos"

# 上游 ctest 用例总数（默认选项；ctest -N 实测为准，见 reports/）
assertion_count: 45
