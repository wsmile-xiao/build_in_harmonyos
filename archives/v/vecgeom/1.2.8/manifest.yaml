knowledge_gained:
  - "knowledge_ref: notes.md#1 — VecGeom 唯一强制第三方依赖是 VecCore（CMakeLists.txt:208 `set(VecCore_VERSION 0.8.0)` + :222 `find_package(VecCore REQUIRED)`）；ROOT/Geant4/CUDA/Embree/GDML(Xerces-C)/VTUNE 全部默认关闭，OHOS 上一律关闭后零额外依赖"
  - "knowledge_ref: notes.md#1 — VecGeom 官方仓库在 CERN GitLab（https://gitlab.cern.ch/VecGeom/VecGeom），不是 GitHub；GitLab archive tarball 内 cmake/CgvFindVersion.cmake 经 export-subst 携带 tag v1.2.8，因此无 .git 也能得到正确版本号（否则退化为 0.0.0）"
  - "knowledge_ref: E429-draft-69E4 — OHOS sysroot 的 <fenv.h>（musl 系）不提供 glibc 扩展 feenableexcept/fedisableexcept；VecGeom/base/FpeEnable.h 仅按 __GNUC__ && !__APPLE__ 守卫就直接调用，导致测试目标编译失败。修复：先把 <fenv.h> include 提到守卫之前（让 __GLIBC__ 可见），再把构造函数收进 defined(__GLIBC__) 能力守卫（不引入任何平台宏）"
  - "knowledge_ref: E429-draft-8FC3 — aarch64 基线含 FMA，clang 从 -O2 起默认 -ffp-contract=on，会把 a*b+c 融合成单条 FMA 改变浮点结果；上游参考平台 x86-64 无 FMA 不发生收缩，故 TestSphere（DistanceToIn 断言）与 TestPolyhedra（Contains 表面判定）在 OHOS 上失败。加 -ffp-contract=off 后 45/45 全过"
  - "knowledge_ref: E429-draft-456A — Conan 2 对 package_type=library 的包，依赖默认不算传递头文件（transitive_headers 默认 False；header-library 中间包才默认 True）。VecGeom 公开头文件直接 include VecCore 头，必须 self.requires(\"veccore/0.8.1\", transitive_headers=True)，否则消费者 CMakeDeps 生成的 VecGeom 目标既不带 VecCore 的 include 目录也不生成 find_dependency(VecCore)"
  - "knowledge_ref: E429-draft-5BFE — OHOS 上由 python（conan 本体）派生的 clang 若继承终端 stdin 会静默失败（rc=1、无任何输出），表现为 CMake 'is not able to compile a simple test program / broken'；以 conan create ... < /dev/null 运行即稳定通过"
  - "knowledge_ref: E429-draft-E4C3 — OHOS /tmp 只读（EROFS）：zsh here-document 落 $TMPPREFIX（默认 /tmp/zsh）失败，CI 脚本报 'can't create temp file for here document: read-only file system'；导出 TMPPREFIX/TMPDIR 到可写目录即可"
  - "knowledge_ref: notes.md#4 — 上游测试入口 = CMake/CTest：BUILD_TESTING=ON 时 test/ 被纳入构建；默认选项下 ctest -N 实测 45 个用例，全部通过；产物是共享库 libvecgeom.so（非系统同名库，R26 不要求静态），安装 VecGeomConfig.cmake + VecGeom::vecgeom 导入目标"

