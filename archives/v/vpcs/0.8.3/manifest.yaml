knowledge_gained:
- OpenHarmony lacks <pty.h> and libutil; need forkpty/openpty via /dev/ptmx
- OpenHarmony/musl lacks BSD types (u_char/u_short/u_int/u_long); need -include types_compat.h
- OpenHarmony/musl lacks pthread_cancel; stub using pthread_kill(SIGTERM)
- OpenHarmony lacks <linux/if_tun.h>; need custom if_tun_ohos.h with TUN/TAP constants
- vpcs uses -v not --version for version info
- vpcs nested source (src.drivers/freebsd) confuses init-build detection
