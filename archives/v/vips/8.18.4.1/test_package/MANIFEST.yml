package: vips/8.18.4.1
homepage: "https://www.libvips.org/"

upstream_check_command: "meson test -C builddir --list"
upstream_test_in_build: false
upstream_test_command: "not run in W0; upstream tests require a full source checkout and image fixtures"

upstream_tests:
  - file: test/test-suite/test-suite.c
    source: vips-8.18.4/test/test-suite/test-suite.c
    description: "Upstream C test runner; deferred to shadow CI after core recipe is published."
    command: "meson test -C builddir"

test_package_tests:
  - file: test.c
    description: >
      (a) inherits the 8.18.4 kernel check (2x2 matrix, vips_avg == 2.5);
      (b) builds a 16x16 3-band uchar image, jpegsaves it, asserts
      vips_foreign_find_load() reports a jpeg loader, reloads it and checks
      size/bands/pixel within a lossy tolerance; (c) does the same through
      pngsave with bit-exact pixel expectations. Fails loudly if a codec
      loader or saver is missing from the package.
    command: "./test_vips"

assertion_count: 13
