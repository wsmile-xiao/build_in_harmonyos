software: vips
display: "VIPS"
description: "高性能图像处理库，支持大量图像格式和操作"
category: image-processing
homepage: "https://libvips.github.io/libvips/"
license: LGPL-2.1+
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建系统需要设置 PKG_CONFIG_PATH"
    - "传递依赖检测需要手动添加（libtiff + liblzma）"
    - "toybox rm 不兼容 ninja STATIC_LINKER 规则"
    - "使用 meson setup builddir --prefix=$DEFAULT_PREFIX"
  common_dependencies:
    - glib/2.88.0
    - libtiff/4.7.1
    - libjpeg/2.1.5.1
    - zlib/1.3.1
    - xz/5.6.2
    - lcms2/2.19
    - OpenEXR/3.1.5
    - libopenjp2/2.5.2
    - libheif/1.22.2

versions:
  "8.18.2":
    status: built
    build_date: "2026-05-29"
    source_url: "https://github.com/libvips/libvips/releases/download/v8.18.2/vips-8.18.2.tar.xz"
  "8.18.4":
    status: built
    build_date: "2026-08-07"
    source_url: "https://github.com/libvips/libvips/releases/download/v8.18.4/vips-8.18.4.tar.xz"
  "8.18.4.1":
    status: built
    build_date: "2026-09-11"
    source_url: "https://github.com/libvips/libvips/releases/download/v8.18.4/vips-8.18.4.tar.xz"
    note: "同 8.18.4 源码，启用 JPEG/PNG/zlib 编解码器（libjpeg-turbo/libpng）"