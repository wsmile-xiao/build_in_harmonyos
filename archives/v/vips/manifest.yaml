software: vips
display: "VIPS"
description: "高性能图像处理库，专为处理大型图像而设计"
category: gfx
homepage: "https://libvips.github.io/libvips/"
license: LGPL-2.1+
build_system: meson

ohos_adaptation:
  key_points:
    - "使用 meson 构建系统，非 autotools"
    - "需要 glib-2.0 >= 2.88.0 作为核心依赖"
    - "gobject-introspection 可禁用（-Dintrospection=false）"
    - "支持多种图像格式：JPEG, PNG, HEIF, WebP 等"
  common_dependencies:
    - glib
    - libpng
    - libjpeg

versions:
  "8.14.1":
    status: built
    build_date: "2026-05-20"