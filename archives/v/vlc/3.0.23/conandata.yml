# conandata.yml — vlc 3.0.23
# 源码 URL + SHA256 + 补丁声明的单一真相来源。
#
# R39：URL 指向官方正式源（videolan.org 官方 release）。

sources:
  url: "https://get.videolan.org/vlc/3.0.23/vlc-3.0.23.tar.xz"
  sha256: "e891cae6aa3ccda69bf94173d5105cbc55c7a7d9b1d21b9b21666e69eff3e7e0"

patches:
  - patch_file: "patches/vlc-0001-ohos-triplet.patch"
    # autotools/config.guess + config.sub 识别 aarch64-linux-ohos /
    # HarmonyOS（E007/E072/E122 同类：ohos triplet 验证三处白名单）
  - patch_file: "patches/vlc-0002-ohos-capability-macros.patch"
    # 能力宏探测（POSIX 接口适配，非平台宏分支）：
    # configure.ac 的 linux 分支追加 AC_CHECK_FUNCS([posix_close
    # pthread_cancel pthread_setcancelstate pthread_testcancel])——
    # OHOS musl 头文件里定义了 POSIX_CLOSE_RESTART/PTHREAD_CANCEL_*
    # 宏但未实现对应函数（头/实现不同步），链接探测按符号存在性
    # 决定；源码侧 vlc_close/vlc_cancel/vlc_savecancel/vlc_restorecancel/
    # vlc_testcancel 依据 HAVE_POSIX_CLOSE/HAVE_PTHREAD_CANCEL 等
    # autoconf 能力宏分支，缺能力时走 POSIX 兼容 fallback
    # （close(fd)/no-op）——glibc/musl 主线等有能力的平台行为不变。
  - patch_file: "patches/vlc-0004-ohos-disable-classic-gl.patch"
    # OHOS 无 classic OpenGL（GLX/固定管线），configure 跳过 GL 探测，
    # gl/glx/glspectrum 插件不构建（configure.ac AS_IF 守卫 + 预生成
    # configure 的 fallback 分支短路——tarball configure 是 autoconf
    # 2.69 产物，重生成 diff 巨大不可入补丁，故双文件 patch）
