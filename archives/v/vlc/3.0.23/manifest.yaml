# 版本级 manifest — vlc 3.0.23
# 遵循 ARCHIVE-SPEC v2.0 / 模板 templates/manifest-version.yaml

# ============================================================
# 必须字段
# ============================================================

version: "3.0.23"
software: vlc

# 编译状态：published | built | failed | archived
status: built

build_date: "2026-09-25"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://get.videolan.org/vlc/3.0.23/vlc-3.0.23.tar.xz"
  sha256: "e891cae6aa3ccda69bf94173d5105cbc55c7a7d9b1d21b9b21666e69eff3e7e0"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

compiler: clang 15
platform: OpenHarmony aarch64 (aarch64-linux-ohos, musl)
default_options:
  shared: true
  fPIC: true

# 上游有标准 automake TESTS 套件（make check）
upstream_tests_exist: true

# 裁剪矩阵（OHOS 无 X/Wayland 桌面栈）
configure_disabled:
  - nls / xcb / wayland / x11 / vdpau / qt / skins2 / notify / ncurses
  - v4l2 / linsys / dvbpsi / libva / mfx / decklink
  - macosx / wasapi / oss / alsa / pulse / jack / sdl
  - svg / svgdec / a52 / lua / gnutls / gcrypt
  - classic OpenGL（GLX/固定管线，OHOS 无 libGL.so）
configure_enabled:
  - avcodec / avformat / swscale（ffmpeg/4.4.8）
  - mad / ogg / vorbis / flac / opus / theora
  - dav1d / vpx / x264 / x265
  - dvdnav / libass 字幕链（freetype/fribidi/harfbuzz/fontconfig 传递）

# ============================================================
# 产物
# ============================================================

products:
  - name: libvlc
    type: shared-library
    file: lib/libvlc.so.5.6.1
  - name: libvlccore
    type: shared-library
    file: lib/libvlccore.so.9.0.1
  - name: vlc-plugins
    type: plugin-tree
    file: lib/vlc/plugins/  # ~283 个 *_plugin.so（demux/codec/filter/access/...）
  - name: vlc
    type: executable
    file: bin/vlc

headers:
  - include/vlc/vlc.h
  - include/vlc/libvlc.h
  - include/vlc/libvlc_media.h
  - include/vlc/libvlc_media_player.h
  - include/vlc/libvlc_events.h
  # 及 vlc/plugins/ 下的完整公共头树

pkg_config: lib/pkgconfig/libvlc.pc

dependencies:
  - { name: ffmpeg, version: "4.4.8", relation: conan }
  - { name: flac, version: "1.5.0", relation: conan }
  - { name: libvorbis, version: "1.3.7", relation: conan }
  - { name: libtheora, version: "1.2.0-alpha1", relation: conan }
  - { name: libmad, version: "0.15.1b", relation: conan }
  - { name: dav1d, version: "1.5.0", relation: conan }
  - { name: x264, version: "r3223", relation: conan }
  - { name: x265, version: "4.2", relation: conan }
  - { name: libdvdnav, version: "7.0.0", relation: conan }
  - { name: fribidi, version: "1.0.16", relation: conan }
  - { name: libass, version: "0.17.5", relation: conan }
  - { name: libogg, version: "1.3.6", relation: conan-force-unified }
  - { name: libopus, version: "1.6.1", relation: conan-force-unified }
  - { name: libvpx, version: "1.16.0", relation: conan-force-unified }
  - { name: pthread, relation: system }
  - { name: dl, relation: system }

patches_applied:
  - vlc-0001-ohos-triplet.patch
  - vlc-0002-ohos-posix-close.patch
  - vlc-0003-ohos-pthread-cancel.patch
  - vlc-0004-ohos-disable-classic-gl.patch

knowledge_gained:
  - "OHOS musl unistd.h 定义 POSIX_CLOSE_RESTART 宏但未实现 posix_close()（头/实现不同步），configure.ac AC_CHECK_FUNCS 探测符号存在性，vlc_close 以 HAVE_POSIX_CLOSE 能力宏分支走 close()"
  - "OHOS musl libc 无 pthread_cancel/pthread_setcancelstate/pthread_testcancel 符号，AC_CHECK_FUNCS 探测失败 → HAVE_PTHREAD_* 不定义，vlc 的 cancel 系 API 走 POSIX 兼容 no-op fallback（实例创建/释放仍正常）"
  - "OHOS 无 classic OpenGL（无 libGL.so；libGLv4.so 仅 GLES 兼容子集，无 glMatrixMode 固定管线符号）→ configure 层禁用 GL 探测"
  - "多依赖 pkg-config 版本字段陷阱：conan PkgConfigDeps 生成 pc 的 Version 用包版本（ffmpeg/4.4.8），vlc 要求 libavcodec>=57.37.100（库 ABI 版本）→ 需用包内原生 pc 替换并逐行重写路径"
  - "libogg 三版本碎片（flac→1.3.5/libvorbis→1.3.6/libtheora→1.3.6.2）图冲突 → 顶层 force=True 统一 1.3.6"
  - "HMDFS umask 077 陷阱（E011）：configure/config.status 内嵌 umask 077 的 mktemp 目录对构建进程不可写，sed 替换 umask 022"
  - "补丁修改 configure.ac 后 tarball 的 automake 重建链会尝试重跑 aclocal-1.16（CI 无 automake 且 @am_AUTOM4TE@ 未替换 → 127）→ 补丁后按依赖序 touch 时间链（m4 < aclocal.m4 < configure < Makefile.in）"
  - "vlc 3.0 上游 bug：fontconfig.c 的 FONTCONFIG_CFLAGS 未注入（4.0 已修）→ freetype2.pc 并入 fontconfig include"
  - "fribidi 头在 include/fribidi/ 子目录，vlc 直引 <fribidi.h> → pc Cflags 补子目录"
