# test_package/MANIFEST.yml — vlc 3.0.23
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）。
# 详见 docs/TEST_QUALITY_SPEC.md

package: vlc/3.0.23
homepage: "https://www.videolan.org/vlc/"

# 上游测试套件存在性（经审计源码 tar 包 + 本机实测 make check 确认）
upstream_tests_exist: true

# 上游测试审计（源码: vlc-3.0.23.tar.xz）
upstream_test_audit:
  source_tarball: "vlc-3.0.23.tar.xz"
  source_sha256: "e891cae6aa3ccda69bf94173d5105cbc55c7a7d9b1d21b9b21666e69eff3e7e0"
  registration: "test/Makefile.am: TESTS = $(check_PROGRAMS) check_POTFILES.sh"
  check_programs_count: 21   # 20 基础 + test_modules_tls（ENABLE_SOUT 条件编译）
  framework: "automake TESTS (parallel harness via autotools/test-driver)"
  samples_dependency: "部分测试依赖 samples/test.sample（HTTP 下载 streams.videolan.org），check_DATA 未默认启用"

# 本机实测结果（2026-09-23，aarch64 HarmonyOS，交叉构建 make check）
# N = 22（20 个无条件 check_PROGRAMS + test_modules_tls(ENABLE_SOUT) + check_POTFILES.sh）
local_run:
  command: "make check"
  total: 22
  pass: 17
  skip: 1
  fail: 4
  failures_detail:
    - test: "test_src_input_stream"
      reason: "硬编码 /tmp 写入（fill_rand 断言失败）——OHOS /tmp 只读（E002 平台限制），非库缺陷"
    - test: "test_modules_keystore"
      reason: "硬编码 /tmp/libvlc_XXXXXX（vlc_mkstemp 断言失败）——OHOS /tmp 只读（E002 平台限制），非库缺陷"
    - test: "test_libvlc_media"
      reason: "media_subitems fd:// 目录枚举在 alarm(10s) 内未完成（SIGALRM 142）——HMDFS 目录操作慢导致超时，非功能错误"
    - test: "check_POTFILES.sh"
      reason: "校验 po/POTFILES.in 列出的 modules/gui/qt/ui/about.h 存在性——Qt 按平台裁剪(--disable-qt)后源文件不存在，裁剪必然结果"
  skip_detail:
    - test: "test_modules_tls"
      reason: "TLS 插件因 gnutls/gcrypt 平台裁剪未构建，上游自身 SKIP 语义（exit 77）"

scanned_for:
  - "TEST(F / TEST_F (gtest)"
  - "add_test (ctest)"
  - "TESTS = (automake)"
  - "check_PROGRAMS (automake)"
