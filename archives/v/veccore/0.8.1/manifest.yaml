# veccore 0.8.1 版本级 manifest
# 位置: archives/v/veccore/0.8.1/manifest.yaml

version: "0.8.1"
software: "veccore"
status: built
build_date: "2026-09-20"
build_system: cmake

source:
  url: "https://github.com/root-project/veccore/archive/refs/tags/v0.8.1.tar.gz"
  sha256: "7d7983947c2c6faa55c908b3a968f19f96f4d5c909447c536de30c34b439e008"
  tag: "v0.8.1"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_GOOGLETEST=ON"
    - "-DINSTALL_GTEST=OFF"
    - "-DDETAILED_TEST_REPORT=ON"
    - "-DVC=OFF"
    - "-DUMESIMD=OFF"
    - "-DCUDA=OFF"
    - "-DBUILD_BENCHMARKS=OFF"
    - "-DBUILD_GOOGLEBENCH=OFF"
    - "-DBUILD_DOCS=OFF"
    - "-DCMAKE_CXX_STANDARD=17"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "VecCore 是纯头文件库（上游 add_library(VecCore INTERFACE)），因此 conan 侧用 package_type=header-library + package_id() 清空 settings，包 ID 恒为 da39a3ee5e6b4b0d3255bfef95601890afd80709"
  - "上游仓库自带 builtins/googletest 快照（GOOGLETEST_VERSION 1.10，但含 1.11+ 才有的 GTEST_ALLOW_UNINSTANTIATED_PARAMETERIZED_TEST），BUILD_GOOGLETEST=ON 即可零外部依赖跑上游测试；该快照的 cmake_minimum_required 是 2.8.12，CMake 4.x（真机 4.4.3）必须配 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "自带 googletest 快照需要 C++14 起，而上游 project(VecCore) 把 CMAKE_CXX_STANDARD 写成 11（CACHE），profile 的 cppstd=17 不会自动覆盖这个 cache 变量，必须显式传 -DCMAKE_CXX_STANDARD=17"
  - "BUILD_TESTING=ON 时上游只注册 1 条 ctest 用例（add_test(NAME test-backends COMMAND test-backends --gtest_brief=1)），8 个测试文件被折成 1 条；DETAILED_TEST_REPORT=ON 才由 gtest_discover_tests 逐用例注册，才能拿到 581 这个真实用例数"
  - "上游 EXCLUDE_FROM_ALL 只影响 all 目标、不影响 install 规则，因此必须额外 -DINSTALL_GTEST=OFF，否则 libgtest.a/libgtest_main.a 与 gtest 头会被装进这个 header-only 包"
  - "aarch64 上 VecCore 的可用后端是 Scalar 与 ScalarWrapper：Backend/SIMD.h 的 std::experimental::simd 需要 C++20 且 libc++ 不提供，Vc/UMESIMD 无 OHOS 制品；47 个宏声明按「后端 × 向量类型」实例化后展开成 581 个实际用例"
  - "VecCore 的 Common.h 有 __aarch64__ → VECCORE_ARM64 分支，SIMD.h 的 <x86intrin.h> 只在 x86 分支包含，因此 aarch64/OHOS 上不需要任何移植补丁；Utilities.h 走 posix_memalign（OHOS musl libc 提供）"
