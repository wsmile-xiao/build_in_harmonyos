package: veccore/0.8.1
homepage: "https://github.com/root-project/veccore"

upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure --output-junit upstream-ctest.xml"

upstream_tests:
  - name: "VecCore 上游 GoogleTest 套件（test/*.cc → 单个 test-backends 二进制）"
    count: "581 实跑通过 / 源码声明 47 个宏"
    description: >-
      test/*.cc 声明 47 个 GoogleTest 用例（TYPED_TEST_P + TEST）。这些套件是
      typed-parameterized 的，按「后端 × 向量类型 × 用例」实例化展开；OHOS
      aarch64 上可用后端只有 Scalar 与 ScalarWrapper，配方打开
      -DDETAILED_TEST_REPORT=ON 后由 gtest_discover_tests 把 581 个实例逐条注册为
      ctest 用例，并在 build() 内全部实跑通过（Scalar 290 + ScalarWrapper 290 +
      TraitTest.TraitTest 1）。无排除项、无跳过项。
      align.cc 的 3 个 AlignmentTest 用例按上游设计在没有 Vc / std::simd 后端时
      不实例化（上游自己写了 GTEST_ALLOW_UNINSTANTIATED_PARAMETERIZED_TEST），
      不是本配方关掉的。

test_package_tests:
  - file: consumer.cpp
    description: >-
      R34 消费者验证：只用公开头 <VecCore/VecCore> 与公开 API，对
      Scalar/ScalarWrapper 两个后端的 Double_v/Float_v 跑同一组 SIMD 抽象断言
      （VectorSize、Get/Set、运算符、MaskFull/MaskEmpty、MaskedAssign/Blend、
      Load/Store、ReduceAdd/Min/Max、Sqrt/Pow/Exp/Abs/Min/Max、NumericLimits），
      并与标准库参考值对拍，共 90 条断言
    command: "conan create . -pr:h=ohos-aarch64 -pr:b=ohos-aarch64 --build=missing"
  - file: test_veccore_ohos.cpp
    description: >-
      鸿蒙特有测试（18 条断言）：__OHOS__ 与上游 VECCORE_ARM64 分支同时成立且
      不走 x86 内建头路径；aarch64 下 VECCORE_SIMD_ALIGN == 16；OHOS libc 的
      posix_memalign 路径（Utilities.h 非 MSVC 分支）在 16/32/64 对齐下可分配、
      对齐成立、可写读回；两个后端各用 VectorSize 步长遍历 64 元素做
      Load→Sqrt→Store 与 std::sqrt 对拍
    command: "conan create . -pr:h=ohos-aarch64 -pr:b=ohos-aarch64 --build=missing"

assertion_count: 108
