sources:
  url: https://codeload.github.com/Kitware/VTK/tar.gz/refs/tags/v9.3.0
  sha256: b4b7323fc24446f0a19813a0c8bdf4fd5b6f796c6f3caf2fb159f65425557a60
  filename: VTK-9.3.0.tar.gz
patches:
- patch_file: patches/0001-CMakeLists.txt.patch
  patch_description: Add an opt-in control for floating-point contraction in numerically sensitive sources
  patch_type: portability
- patch_file: patches/0002-Charts-Core-CMakeLists.txt.patch
  patch_description: Preserve separately rounded axis tick endpoints
  patch_type: portability
- patch_file: patches/0003-Common-Core-CMakeLists.txt.patch
  patch_description: Preserve separately rounded geometry helpers and data-array interpolation
  patch_type: portability
- patch_file: patches/0004-Common-DataModel-CMakeLists.txt.patch
  patch_description: Preserve geometry boundary classification and interpolation rounding
  patch_type: portability
- patch_file: patches/0005-Common-Math-CMakeLists.txt.patch
  patch_description: Preserve RK2 integration and the RK45 exactly-zero error branch
  patch_type: portability
- patch_file: patches/0006-Filters-FlowPaths-CMakeLists.txt.patch
  patch_description: Preserve interpolated velocities and streamline seed-distance decisions
  patch_type: portability
- patch_file: patches/0007-ThirdParty-ioss-vtkioss-Ioss_FileInfo.C.patch
  patch_description: Use the portable POSIX unistd header
  patch_type: portability
- patch_file: patches/0008-Common-Core-Testing-Cxx-UnitTestMath.cxx.patch
  patch_description: Derive the expected range-fitting type from plain-char signedness
  patch_type: test portability
- patch_file: patches/0009-Filters-Selection-Testing-Cxx-TestLinearSelector3D.cxx.patch
  patch_description: Use the existing endpoint-exclusion default appropriate to float coordinates; retain expected
    counts
  patch_type: test portability
- patch_file: patches/0010-IO-HDF-vtkHDFReaderImplementation.cxx.patch
  patch_description: Handle signed 8-bit HDF data independently of plain-char signedness
  patch_type: portability
- patch_file: patches/0011-IO-SegY-vtkSegYTraceReader.cxx.patch
  patch_description: Decode signed SEG-Y format-8 samples independently of plain-char signedness
  patch_type: portability
- patch_file: patches/0012-Rendering-CellGrid-vtkDGOpenGLRenderer.cxx.patch
  patch_description: Guard the desktop-only seamless cubemap token
  patch_type: portability
- patch_file: patches/0013-Rendering-ContextOpenGL2-vtkOpenGLContextDevice2D.cxx.patch
  patch_description: Set programmable GLES point size for 2D markers and sprites
  patch_type: portability
- patch_file: patches/0014-Rendering-LICOpenGL2-vtkBatchedSurfaceLICMapper.cxx.patch
  patch_description: Expand LIC vectors with the actual GLES primitive vertex indices
  patch_type: portability
- patch_file: patches/0015-Rendering-LICOpenGL2-vtkLineIntegralConvolution2D_AAH.glsl.patch
  patch_description: Move uniform-dependent initialization into GLSL main
  patch_type: portability
- patch_file: patches/0016-Rendering-LICOpenGL2-vtkLineIntegralConvolution2D_AAV.glsl.patch
  patch_description: Move uniform-dependent initialization into GLSL main
  patch_type: portability
- patch_file: patches/0017-Rendering-LICOpenGL2-vtkLineIntegralConvolution2D_EE.glsl.patch
  patch_description: Move uniform-dependent initialization into GLSL main
  patch_type: portability
- patch_file: patches/0018-Rendering-LICOpenGL2-vtkStructuredGridLIC2D.cxx.patch
  patch_description: Use a renderable RGBA floating-point target on GLES
  patch_type: portability
- patch_file: patches/0019-Rendering-LICOpenGL2-vtkSurfaceLICInterface_CE.glsl.patch
  patch_description: Use type-correct floating-point comparisons in GLES
  patch_type: portability
- patch_file: patches/0020-Rendering-OpenGL2-vtkDepthPeelingPass.cxx.patch
  patch_description: Copy an offset viewport into the origin of its viewport-sized textures
  patch_type: portability
- patch_file: patches/0021-Rendering-OpenGL2-vtkDualDepthPeelingPass.cxx.patch
  patch_description: Use type-correct floating-point depth-peeling expressions
  patch_type: portability
- patch_file: patches/0022-Rendering-OpenGL2-vtkEDLShading.cxx.patch
  patch_description: Use complete GLES depth sampling with nearest filters
  patch_type: portability
- patch_file: patches/0023-Rendering-OpenGL2-vtkEGLRenderWindow.cxx.patch
  patch_description: Select the GLES3 API and context and negotiate pbuffer configurations
  patch_type: portability
- patch_file: patches/0024-Rendering-OpenGL2-vtkEquirectangularToCubeMapTexture.cxx.patch
  patch_description: Use a renderable RGBA floating-point cubemap on GLES
  patch_type: portability
- patch_file: patches/0025-Rendering-OpenGL2-vtkOpenGLBatchedPolyDataMapper.cxx.patch
  patch_description: Avoid instanced line copies when a geometry shader expands lines
  patch_type: portability
- patch_file: patches/0026-Rendering-OpenGL2-vtkOpenGLES30PolyDataMapper.cxx.patch
  patch_description: Expand extra attributes and selections correctly and render wide lines with GLES 3.2 geometry
    shaders
  patch_type: portability
- patch_file: patches/0027-Rendering-OpenGL2-vtkOpenGLES30PolyDataMapper.h.patch
  patch_description: Declare capability-based geometry-shader line selection
  patch_type: portability
- patch_file: patches/0028-Rendering-OpenGL2-vtkOpenGLFluidMapper.cxx.patch
  patch_description: Use renderable RGBA floating-point fluid targets on GLES
  patch_type: portability
- patch_file: patches/0029-Rendering-OpenGL2-vtkOpenGLFramebufferObject.cxx.patch
  patch_description: Honor requested 32-bit depth precision with the GLES floating-point format
  patch_type: portability
- patch_file: patches/0030-Rendering-OpenGL2-vtkOpenGLGlyph3DHelper.cxx.patch
  patch_description: Set programmable point size during GLES glyph picking
  patch_type: portability
- patch_file: patches/0031-Rendering-OpenGL2-vtkOpenGLPolyDataMapper.cxx.patch
  patch_description: Use type-correct lighting/depth GLSL and GLES texture-buffer edge lookup
  patch_type: portability
- patch_file: patches/0032-Rendering-OpenGL2-vtkOpenGLRenderWindow.cxx.patch
  patch_description: Correct depth readback, depth-shader initialization and GLES resolve/copy operations
  patch_type: portability
- patch_file: patches/0033-Rendering-OpenGL2-vtkOpenGLRenderer.cxx.patch
  patch_description: Enable depth peeling after separately verifying GLES float renderability and MAX blending
  patch_type: portability
- patch_file: patches/0034-Rendering-OpenGL2-vtkOpenGLRenderer.h.patch
  patch_description: Cache the float blending capability result for the current OpenGL context
  patch_type: portability
- patch_file: patches/0035-Rendering-OpenGL2-vtkOpenGLShaderCache.cxx.patch
  patch_description: Emit the supported GLES shader version, matching precision and texture-buffer emulation
  patch_type: portability
- patch_file: patches/0036-Rendering-OpenGL2-vtkOpenGLState.cxx.patch
  patch_description: Use portable float storage for normalized unsigned-short textures on GLES
  patch_type: portability
- patch_file: patches/0037-Rendering-OpenGL2-vtkOpenGLTexture.cxx.patch
  patch_description: Use the available GLES border-clamp extension instead of discarding it
  patch_type: portability
- patch_file: patches/0038-Rendering-OpenGL2-vtkPBRIrradianceTexture.cxx.patch
  patch_description: Avoid the reserved GLSL sample identifier
  patch_type: portability
- patch_file: patches/0039-Rendering-OpenGL2-vtkPBRPrefilterTexture.cxx.patch
  patch_description: Use explicit floating-point operands in PBR sample calculations
  patch_type: portability
- patch_file: patches/0040-Rendering-OpenGL2-vtkPixelBufferObject.cxx.patch
  patch_description: Map GLES readback buffers with the supported read-range API
  patch_type: portability
- patch_file: patches/0041-Rendering-OpenGL2-vtkShader.cxx.patch
  patch_description: Compile supported GLES geometry shaders through their extension token
  patch_type: portability
- patch_file: patches/0042-Rendering-OpenGL2-vtkShaderProgram.cxx.patch
  patch_description: Link supported GLES geometry stages instead of silently omitting them
  patch_type: portability
- patch_file: patches/0043-Rendering-OpenGL2-vtkTextureObject.cxx.patch
  patch_description: Preserve normalized/HDR upload and readback, depth formats, offsets and GLES buffer/state contracts
  patch_type: portability
- patch_file: patches/0044-Rendering-OpenGL2-vtkTextureObject.h.patch
  patch_description: Keep the public border-clamp enum available for GLES callers
  patch_type: portability
- patch_file: patches/0045-Rendering-OpenGL2-vtkValuePass.cxx.patch
  patch_description: Read float channels with a supported GLES pair and index expanded point/cell values correctly
  patch_type: portability
- patch_file: patches/0046-Rendering-OpenGL2-glsl-vtkFluidMapperDepthFilterBiGaussFS.glsl.patch
  patch_description: Use explicit GLSL types and runtime uniform initialization in GLES rendering
  patch_type: portability
- patch_file: patches/0047-Rendering-OpenGL2-glsl-vtkFluidMapperDepthFilterNarrowRangeFS.glsl.patch
  patch_description: Use explicit GLSL types and runtime uniform initialization in GLES rendering
  patch_type: portability
- patch_file: patches/0048-Rendering-OpenGL2-glsl-vtkFluidMapperFS.glsl.patch
  patch_description: Use explicit GLSL types and runtime uniform initialization in GLES rendering
  patch_type: portability
- patch_file: patches/0049-Rendering-OpenGL2-glsl-vtkFluidMapperFinalFS.glsl.patch
  patch_description: Use explicit GLSL types and runtime uniform initialization in GLES rendering
  patch_type: portability
- patch_file: patches/0050-Rendering-OpenGL2-glsl-vtkFluidMapperThicknessAndVolumeColorFilterFS.glsl.patch
  patch_description: Use explicit GLSL types and runtime uniform initialization in GLES rendering
  patch_type: portability
- patch_file: patches/0051-Rendering-OpenGL2-glsl-vtkFluidMapperVS.glsl.patch
  patch_description: Use explicit GLSL types and runtime uniform initialization in GLES rendering
  patch_type: portability
- patch_file: patches/0052-Rendering-OpenGL2-glsl-vtkPointFillPassFS.glsl.patch
  patch_description: Use explicit GLSL types and runtime uniform initialization in GLES rendering
  patch_type: portability
- patch_file: patches/0053-Rendering-OpenGL2-glsl-vtkPolyDataWideLineGS.glsl.patch
  patch_description: Use explicit float conversion for GLES line expansion
  patch_type: portability
- patch_file: patches/0054-Rendering-OpenGL2-glsl-vtkSphereMapperGS.glsl.patch
  patch_description: Write all geometry outputs for every emitted sphere vertex
  patch_type: portability
- patch_file: patches/0055-Rendering-OpenGL2-glsl-vtkStickMapperGS.glsl.patch
  patch_description: Write all geometry outputs for every emitted stick vertex
  patch_type: portability
- patch_file: patches/0056-Rendering-VolumeOpenGL2-vtkOpenGLGPUVolumeRayCastMapper.cxx.patch
  patch_description: Resolve depth at source coordinates before viewport cropping and use complete depth samplers
  patch_type: portability
- patch_file: patches/0057-Rendering-VolumeOpenGL2-vtkOpenGLProjectedTetrahedraMapper.cxx.patch
  patch_description: Accumulate in a single-sample float target and copy through GLES-compatible GPU operations
  patch_type: portability
- patch_file: patches/0058-Rendering-VolumeOpenGL2-vtkVolumeShaderComposer.h.patch
  patch_description: Use type-correct runtime initialization, texture representation and lighting expressions for
    GLES
  patch_type: portability
