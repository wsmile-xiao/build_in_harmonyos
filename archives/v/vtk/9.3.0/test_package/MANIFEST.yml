package: vtk/9.3.0
homepage: https://vtk.org/
upstream_check_command: ctest --show-only=json-v1
upstream_test_in_build: true
upstream_test_command: ctest --output-on-failure --no-tests=error --output-junit upstream-tests.xml
upstream_tests:
- name: VTK upstream CTest suite
  type: ctest
  configuration: VTK_BUILD_TESTING=ON, BUILD_TESTING=ON; C++ product with EGL/GLES
    rendering
  description: Full registered suite for the enabled product modules; test failures
    are fatal to conan create.
  discovered: 1832
  executed: 1830
  passed: 1830
  failed: 0
  skipped: 2
  not_run: 0
  status: Complete fresh native W3 suite passed; two upstream Windows backend skips
    retained.
  report: reports/upstream_tests_report.md
  data: Upstream ExternalData objects, downloaded by content hash from Kitware/vtk.org
    into a private OHOS store.
  scope: Python/Java bindings and optional external backends are not enabled product
    interfaces; C++ tests do not require VTK Python wrapping.
test_package_tests:
- file: src/main.cpp
  description: VTK version, sphere pipeline, 226 points and 448 cells; five positive
    assertions.
  command: test_vtk
  expected_exit: 0
- file: src/main.cpp
  description: Deliberately inverted geometry assertion; a crash or other exit code
    is not accepted.
  command: test_vtk --expect-fail
  expected_exit: 1
- file: src/test_render.cpp
  description: 'Twenty positive assertions: EGL sphere/readback, HDR/normalized textures,
    resize/refill, state/error recovery, MSAA/offset depth and geometry-shader depth.'
  command: test_vtk_render
  expected_exit: 0
- file: src/test_render.cpp
  description: Deliberately inverted pixel assertion, after successful context creation
    and drawing.
  command: test_vtk_render --expect-fail
  expected_exit: 1
- file: src/test_viewports.cpp
  description: 'Six positive assertions: PROJ resource discovery and EPSG:3978 initialization,
    offset viewports, sampler declarations and MSAA state isolation.'
  command: test_vtk_viewports
  expected_exit: 0
consumer_program_count: 3
consumer_process_run_count: 5
positive_assertion_count: 31
negative_control_count: 2
consumer_result: Fresh W3 installed package passed all five process expectations,
