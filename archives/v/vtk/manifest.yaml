software: vtk
# 软件级 manifest 模板
# 文件位置: archives/v/vtk/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件描述
description: "VTK is an open-source library for 3D computer graphics, image processing, and visualization"

# 主页
homepage: "https://vtk.org/"

# 许可证
license: BSD-3-Clause

# 类别（用于依赖排序）
# library | tool | utility | development | system
category: library

# ============================================================
# 版本索引（软件级）
# ============================================================

# 已编译版本列表（按日期排序，最新在前）
versions:
  - version: "9.4.1"
    status: built
    build_date: "2026-05-26"
    build_system: cmake
    configure_options:
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DBUILD_SHARED_LIBS=ON"
      - "-DBUILD_TESTING=OFF"
      - "-DBUILD_EXAMPLES=OFF"
      - "-DVTK_WRAP_PYTHON=OFF"
      - "-DVTK_WRAP_JAVA=OFF"

# ============================================================
# 依赖关系（软件级）
# ============================================================

# 编译依赖（格式: software/version）
build_dependencies: []

# 运行依赖（格式: software/version）
runtime_dependencies: []

# ============================================================
# 知识索引（软件级）
# ============================================================

# 相关知识图谱条目
knowledge_links: []

# ============================================================
# 元数据
# ============================================================

# 首次编译日期
first_compile: "2026-05-26"

# 最后更新日期
last_updated: "2026-05-26"