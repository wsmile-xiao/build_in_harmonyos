# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: vtk/9.4.1
homepage: "https://vtk.org/"

# 上游测试命令 (VTK 上游使用 CTest + VTK_BUILD_TESTING=ON 运行数千个测试)
# 此适配中 BUILD_TESTING=OFF (上游测试套件需 Python + 大量数据, OHOS CI 不可用)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# VTK 上游测试依赖 Python wrapping + Testing/Data, OHOS CI 环境不可用, 故未集成
upstream_test_in_build: false
upstream_test_command: ""
# 接入说明: VTK 上游测试套件 (数千个 ctest 测试) 依赖 VTK_WRAP_PYTHON=ON +
# Testing/Data 数据文件 + Python3, OHOS CI 环境不可用。BUILD_TESTING=OFF 禁用。
# 改用 test_package 消费者视角 API 测试 (R34) 验证库链接与核心 API 可用性。

# 上游实际运行的测试程序 (未集成, 说明原因)
upstream_tests:
  - name: "VTK CTest suite"
    type: "ctest"
    description: "VTK 上游包含数千个 C++ 单元测试 + 集成测试, 通过 BUILD_TESTING=ON +
      Testing/Data 运行。依赖 Python wrapping + 测试数据文件, OHOS CI 不可用。"
    command: "ctest"
    ran: false
    status: "未集成 (依赖 VTK_WRAP_PYTHON=ON + Testing/Data + Python3, OHOS CI 不可用; BUILD_TESTING=OFF)"

# test_package 中自带的测试 (消费者视角验证 — R34: 调用真实 VTK API)
test_package_tests:
  - file: src/main.cpp
    description: "验证 VTK 库链接与核心 API: vtkVersion::GetVTKVersion() 版本查询 +
      vtkNew<vtkSphereSource> RAII 创建 + SetRadius/SetThetaResolution/SetPhiResolution 配置 +
      Update() 管线执行 + GetOutput()->GetNumberOfPoints() 几何输出断言"
    command: "./test_vtk"

# 测试断言总数
# test_package: 3 个断言 (version 非空 + GetOutput 非空 + nPoints > 0)
assertion_count: 3
