software: vtk
# 版本级 manifest 模板
# 文件位置: archives/v/vtk/9.4.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.4.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Kitware/VTK/archive/refs/tags/v9.4.1.tar.gz"

  # 源码校验和
  sha256: "905f0b2d7e2af699d0323b8478dfcaabd59382848db6d963ddd661abefe65a2a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DVTK_WRAP_PYTHON=OFF"
    - "-DVTK_WRAP_JAVA=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "VTK是大型3D可视化库，编译产物包含约150个共享库模块"
  - "HarmonyOS编译VTK需要CMake构建系统"
  - "禁用Python和Java封装以简化编译"
  - "VTK内置了多个第三方库(hdf5, netcdf, cgns, exodusII等)"
  - "VTK包含Rendering模块但未启用X窗口系统支持"