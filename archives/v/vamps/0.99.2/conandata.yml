# conandata.yml — vamps 0.99.2
# 上游源码: SourceForge 官方项目归档（官方源, R39/PF7；下载 302 → master.dl.sourceforge.net，属 SF 自身 CDN）
#   https://sourceforge.net/projects/vamps/files/Vamps/0.99.2/vamps-0.99.2.tar.gz
# sha256 = 9bac71441db55c04a642c786d6427efdb65aa27f4b1719ffa34ebc3869572694
#   （与 Debian vamps_0.99.2.orig.tar.gz 逐字节一致，已实测双源 sha256 相同）
# URL 带 /download 后缀：conan get() 会把 URL 末段误当文件名（abcmidi 先例），
# 配方 source() 已显式传 filename="vamps-0.99.2.tar.gz"。
# 适配补丁共 1 个（见下方 patches 段）：上游手写 Makefile 的硬编码项
# （CC = gcc、LDFLAGS += -s）经 make 命令行注入 CC/CFLAGS/LDFLAGS 全量接管，
# 构建系统无需补丁；唯一源码改动是 requant.c 的 musl uint typedef（可移植性）。

sources:
  url: "https://sourceforge.net/projects/vamps/files/Vamps/0.99.2/vamps-0.99.2.tar.gz/download"
  sha256: "9bac71441db55c04a642c786d6427efdb65aa27f4b1719ffa34ebc3869572694"

patches:
  - patch_file: "patches/0001-musl-uint-typedef.patch"
    patch_description: "Provide the legacy SysV 'uint' typedef for musl (glibc-only in upstream; requant.c is the sole consumer, 29 occurrences)"
    patch_type: "portability"
