# 遵循 ARCHIVE-SPEC v2.0

version: "0.99.2"

software: vamps

# published | built | failed | archived
# R29: 本地 create 通过前标 built，不伪造 published
status: built

build_date: "2026-09-20"
build_system: makefile

source:
  url: "https://sourceforge.net/projects/vamps/files/Vamps/0.99.2/vamps-0.99.2.tar.gz/download"
  sha256: "9bac71441db55c04a642c786d6427efdb65aa27f4b1719ffa34ebc3869572694"
  tar_format: tar.gz

build:
  system: makefile
  make_options:
    - "-j1"
    - "CC=<conan conf tools.build:compiler_executables.c>"
    - "CFLAGS='-pipe -O2 -DHAVE_BUILTIN_EXPECT -I<libdvdread include>'"
    - "LDFLAGS='-L<libdvdread lib>'"
  dependencies:
    - "libdvdread/7.1.0"
  cc: clang

patches_applied:
  - patches/0001-musl-uint-typedef.patch

knowledge_gained:
  - "上游手写递归 Makefile 硬编码 CC=gcc，但 CFLAGS 为 ?=、LDFLAGS 为 +=，make 命令行注入 CC/CFLAGS/LDFLAGS 即可全量接管，无需构建系统补丁"
  - "唯一可移植性补丁：requant.c 依赖 glibc <sys/types.h> __USE_MISC 下的遗留 typedef uint，musl 完全不提供；补丁加 #ifndef __GLIBC__ typedef unsigned int uint 守卫（29 处使用，仅此一处）"
  - "命令行变量同时压掉 Makefile 的 LDFLAGS += -s（GNU make 规则：命令行赋值胜过 makefile 内赋值，除非用 override），顺带去除对交叉构建无意义的链接期 strip"
  - "OHOS SDK sysroot 自带 libpthread.a/libm.a 桩（usr/lib/aarch64-linux-ohos/），上游 -lm -lpthread 无需改动"
  - "libdvdread/7.1.0 取默认静态变体（libdvdread.a）链入 play_cell，产物自包含，规避 E316/E492/E505 SONAME 软链运行期问题"
  - "SourceForge 官方归档 URL 以 /download 结尾，conan get() 会把 URL 末段误当文件名（abcmidi 同型坑），须显式 filename= 传 .tar.gz 名"
  - "vamps.c 自带 #define _GNU_SOURCE，musl 下 getopt_long_only 可用；play_cell.c 未定义但 musl getopt.h 无条件声明该函数，仍可用"

upstream_tests_exist: false
upstream_test_audit: "Audited vamps-0.99.2 source archive (12 files): no test/tests directory, no check/TESTS target in any Makefile (top-level recurse target is 'all install uninstall clean' only), no gtest/pytest/criterion bindings. Upstream ships no test harness."
reason: "vamps 0.99.2 ships no upstream test framework: no test directory, no make check target, no gtest/pytest bindings. HarmonyOS consumer smoke cases (5) added in test_package/test.sh."
