# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: vamps/0.99.2
homepage: "https://sourceforge.net/projects/vamps/"

upstream_check_command: ""
upstream_tests_exist: false
upstream_test_audit: "Audited vamps-0.99.2 source archive (12 files: COPYING, INSTALL, Makefile, play_cell/Makefile, play_cell/play_cell.c, vamps/Makefile, vamps/vamps.c, vamps/requant.c, vamps/requant.h, vamps/getvlc.h, vamps/putvlc.h, vamps/qTable.h): no test/tests directory, no check/TESTS target in any of the three Makefiles (top-level recurse target is 'all install uninstall clean' only), no gtest/pytest/criterion bindings. Upstream ships no test harness."
reason: "vamps 0.99.2 ships no upstream test framework: no test/tests directory, no check/TESTS target in any Makefile, no gtest/pytest/criterion bindings."

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "鸿蒙消费者冒烟用例 ×5：①vamps --bogus → usage+rc1（musl getopt_long_only）；②vamps 无 -S 且 stdin 非常规文件 → fstat 守卫+rc1；③vamps -e 非数字 → strtof 校验+rc1；④play_cell 无参 → usage+rc1（证明静态链 libdvdread 的二进制可加载，坏链接将 rc=127）；⑤vamps -e 1.0 -S 1 < 空常规文件 → rc0（malloc+pthread 管线+干净 EOF 关闭）。不读 DVD 设备、不联网。"
    command: "sh test.sh"

assertion_count: 5
