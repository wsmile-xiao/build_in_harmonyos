# 软件级 manifest — vamps
software: vamps
display: "vamps"
description: "DVD MPEG-2 程序流重量化工具（DVD-9 → DVD-5 瘦身）"
category: multimedia
homepage: "https://sourceforge.net/projects/vamps/"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游手写递归 Makefile 硬编码 CC=gcc；make 命令行注入 CC/CFLAGS/LDFLAGS 即可全量接管，构建系统无需补丁（唯一源码补丁为 requant.c 的 musl uint typedef）"
    - "唯一第三方依赖 libdvdread/7.1.0（play_cell 链接 + 头文件），默认静态变体链入，产物自包含"
    - "上游 install 目标依赖 install(1) 且 PREFIX 写死；package() 直接 copy bin/vamps、bin/play_cell 与 COPYING"
    - "上游无任何测试套件；test_package 新增 5 个鸿蒙消费者冒烟用例（usage ×4 + 空 PS 全管线 EOF ×1）"
    - "OHOS SDK sysroot 自带 libpthread.a/libm.a 桩，上游 -lm -lpthread 无需改动"
  common_dependencies:
    - libdvdread

versions:
  "0.99.2":
    status: built
    build_date: "2026-09-20"
    conan_ref: "vamps/0.99.2"
