# 版本级 manifest — vkfft 1.3.4
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.3.4"
software: "vkfft"

# published | built | failed | archived
status: built

build_date: "2026-10-09"
build_system: conan

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/DTolm/VkFFT/archive/refs/tags/v1.3.4.tar.gz"
  sha256: "b61055393adb3adc79009fe12401cbfbbdfba584e665e9c35fcbf4b32fb31f30"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: conan
  configure_options:
    - "package_type=header-library"
    - "VKFFT_BACKEND=0 (Vulkan, upstream default)"
  dependencies:
    - vulkan-headers/vulkan-sdk-1.4.357.0
    - glslang/vulkan-sdk-1.3.290.0
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "vkFFT 1.3.4 为头文件库：包布局 include/vkFFT/vkFFT.h + include/vkFFT/vkFFT/**，cpp_info 需同时挂 include/ 与 include/vkFFT/ 两个 include 根（内部头 #include \"vkFFT/...\" 以内层 vkFFT 目录为根解析） (reference: archives/v/vkfft/1.3.4/conanfile.py package_info())"
  - "glslang 制品把 glslang_c_interface.h 装在 glslang/Include/ 子目录，而 vkFFT.h 顶层平铺 include 它（上游 CMake 用 -I glslang/glslang/Include 实现平铺）→ vkfft 包内放转发 shim 头避免改上游源码 (reference: archives/v/vkfft/1.3.4/conanfile.py package())"
  - "上游 VkFFT_TestSuite 30 sample 已于鸿蒙 PC 真机（Maleoon 916，Vulkan 1.2.275）全量真实执行：16 通过；10 个因设备不支持 shaderFloat64 失败（fp64 类），1 个显存不足，3 个全尺寸扫描 benchmark 超 900s 限时；0 个样本因库缺陷失败 (reference: archives/v/vkfft/1.3.4/reports/test-report.md 与 reports/vkfft-testsuite-run/)"
  - "Conan 2.29 对 package_type=build-scripts 的依赖（如 vulkan-headers）自动标记 visible=False，下游 cpp_info.requires=[\"dep::comp\"] 校验会报 not a direct requirement；须在 self.requires(..., visible=True) 显式恢复可见性 (reference: conan/internal/model/cpp_info.py check_component_requires() 与 archives/v/vkfft/1.3.4/conanfile.py requirements())"
