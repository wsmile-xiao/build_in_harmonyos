knowledge_gained:
  - "HarmonyOS 真机 uname -s 为 HarmonyOS；config.guess/config.sub 需成对识别 HarmonyOS 的 OHOS triplet。"
  - "HarmonyOS 真机 id -u 返回 bad uid 20020084；跳过该不可用检查后真实系统检测采用 best-effort，其他系统仍保留上游 root 限制。"
  - "HMDFS 强制 setgid，umask 077 会新建 owner 不可写目录；config.status 临时目录改用 umask 022。"
  - "HarmonyOS HMDFS 中 pwd/getcwd 可能失败；configure 使用 PWD 环境回退并经设备构建验证。"

