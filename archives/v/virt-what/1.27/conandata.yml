sources:
  url: "https://people.redhat.com/~rjones/virt-what/files/virt-what-1.27.tar.gz"
  sha256: "d4d9bd9d4ae59095597443fac663495315c7eb4330b872aa5f062df38ac69bf1"

patches:
  "1.27":
    - patch_file: "patches/0001-config.guess.patch"
      patch_description: "0001 Recognize HarmonyOS aarch64 from uname as aarch64-unknown-linux-ohos using this upstream release's legacy config.guess syntax"
      patch_type: "portability"
    - patch_file: "patches/0002-config.sub.patch"
      patch_description: "0002 Accept linux-ohos in the legacy config.sub system aliases and canonical operating-system list"
      patch_type: "portability"
    - patch_file: "patches/0003-configure.patch"
      patch_description: "0003 Use PWD when HMDFS prevents pwd/getcwd, and use umask 022 for config.status temporary directories because HMDFS forces SGID and makes umask 077 directories unwritable by their owner"
      patch_type: "portability"
    - patch_file: "patches/0004-virt-what.in.patch"
      patch_description: "0004 Skip the unusable id -u privilege check on HarmonyOS while preserving upstream root enforcement on other systems"
      patch_type: "portability"
