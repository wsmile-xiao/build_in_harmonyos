# 上游官方测试声明文件
# virt-what 1.27 在 tests/ 下注册 45 个 Automake test.sh fixture；
# Conan build() 执行完整 make check。真机测试结果在 notes.md 回填。

package: virt-what/1.27
homepage: "https://people.redhat.com/~rjones/virt-what/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

upstream_tests:
  - file: tests/*/test.sh
    source: "virt-what-1.27.tar.gz: tests/（45 个 Automake fixture 测试）"
    description: >-
      每项测试用独立的伪造 proc/sys、dmidecode、uname 和 CPUID helper 输入
      验证对应虚拟化 fact；通过 --test-root 隔离宿主硬件信息。
    command: "make check -j1"

test_package_tests:
  - file: test_virt_what.py
    description: >-
      消费者测试实际运行打包的 virt-what --version/--help 和
      virt-what-cpuid-helper，验证安装产物可执行及版本输出。
    command: "python3 test_virt_what.py <package>/bin"
  - file: test_ohos.py
    description: >-
      HarmonyOS 专项真机测试：核验 HarmonyOS/aarch64 运行平台，并在真实系统
      执行打包的 virt-what；非 root 场景成功退出，输出为空或只含合法 fact 行。
    command: "python3 test_ohos.py <package>/bin <bash>"

assertion_count: 9
