software: virt-what
display: "virt-what"
description: "Detects whether the system is running in a virtual machine"
category: system
homepage: "https://people.redhat.com/~rjones/virt-what/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "HarmonyOS aarch64 使用系统 clang 原生构建，无第三方 Conan 依赖。"
    - "旧版 GNU config.guess/config.sub 需要识别 HarmonyOS 并规范为 aarch64-unknown-linux-ohos。"
    - "HarmonyOS 的 id -u 与 HMDFS 的 pwd/umask 行为需要兼容处理。"
  common_dependencies: []

versions:
  "1.27":
    status: built
    build_date: "2026-09-30"
    conan_ref: "virt-what/1.27"
