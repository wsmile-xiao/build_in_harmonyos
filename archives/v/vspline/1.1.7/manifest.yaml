# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.7"

# 软件名
software: "vspline"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "headeronly"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://bitbucket.org/kfj/vspline/get/1.1.7.tar.gz"

  # 源码校验和
  sha256: "b127a14ae85edac1a495b7aa544c3975506395ecbea344e21b4f955913642c54"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: headeronly

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "header-only 库配方用 package_type=header-library + no_copy_source，package() 只复制头文件"
  - "本地 W3 在变更未提交时 junk_check 落 full 模式，会误扫 main 上他人遗留标记文件——先 commit 再 finish"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
