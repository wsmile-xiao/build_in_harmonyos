# test_package/MANIFEST.yml — vspline 1.1.7 上游测试声明
#
# 上游测试清点（R51 三步法）：
#   vspline 上游无自动化测试套件（无 Makefile/CMakeLists/ctest/pytest 注册，
#   上游以 example/ 目录下的示例程序代替回归测试，examples.sh 逐个编译运行）。
#   example/self_test.cc 是上游最接近测试的程序（编译期静态断言为主）。
#   因此本适配以 test_package 消费者测试替代：实际调用 vspline API
#   （bspline/prefilter/evaluator/remap）验证头文件可用且行为正确。

package: vspline/1.1.7
homepage: "https://bitbucket.org/kfj/vspline"

upstream_check_command: "bash example/examples.sh"

upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序（examples.sh 编译并运行 example/ 下的程序）
upstream_tests:
  - file: example/self_test.cc
    source: vspline-1.1.7/example/self_test.cc
    description: "上游自检程序（编译期断言为核心）"
    command: "clang++ -std=c++17 -pthread -c self_test.cc"

# test_package 中自带的测试（消费者视角验证，实际调用被测库 API）
test_package_tests:
  - file: test_vspline.cpp
    description: "预滤波 + 求值 + remap 往返测试（调用 bspline/evaluator/remap API，断言常量场求值结果）"
    command: "./test_vspline"

assertion_count: 6
