# vdt 0.4.4 版本级 manifest
# 位置: archives/v/vdt/0.4.4/manifest.yaml

# 版本号
version: "0.4.4"

# 软件名
software: "vdt"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 codeload 镜像入口，与 github.com/archive 字节一致）
  url: "https://codeload.github.com/dpiparo/vdt/tar.gz/refs/tags/v0.4.4"

  # 源码校验和
  sha256: "8b1664b45ec82042152f89d171dd962aea9bb35ac53c8eebb35df1cb9c34e498"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（aarch64 路径）
  configure_options:
    - "-DDIAG=ON"
    - "-DNEON=ON"
    - "-DSSE=OFF"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（vdt 无强制第三方依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "vdt 顶层构建系统为 CMake，configure 阶段需要 Python 运行 src/signatures_generator.py 生成 src/vdtMath_signatures.cc（官方要求，不可跳过）"
  - "CMake 4.x 移除了 <3.5 兼容，vdt 声明 cmake_minimum_required 3.2，需设置 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "上游测试仅随 DIAG=ON 构建（progs/units/*_test.cpp，12 个独立用例 + 6 个诊断/工具程序）；CMAKE_RUNTIME_OUTPUT_DIRECTORY 被上游固定为 ${CMAKE_SOURCE_DIR}/bin"
  - "vdt 0.4.4 与 0.4.6 上游源码仅顶层 CMakeLists.txt 一行之差（VECT_OPT -Ofast vs -O3），其余文件完全一致"
