software: velero
version: "1.14.0"
status: published
build_date: "2026-06-01"

source:
  url: "https://github.com/vmware-tanzu/velero/archive/refs/tags/v1.14.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  build_system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOTOOLCHAIN=local"
    - "GOPROXY=https://goproxy.cn,direct"
    - "-mod=vendor"
  dependencies:
    - "go/1.22.10"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Go项目在鸿蒙上需要ELF签名:所有Go pkg/tool/linux_arm64/下的二进制都需要签名才能执行"
  - "Go模块缓存(HMDFS)文件系统问题:module cache下载时出现.no such file or directory错误,需使用go mod vendor避免"
  - "Go项目需使用GOPROXY=https://goproxy.cn,direct绕过GitHub网络限制"
  - "velero是Go项目,使用go build -mod=vendor + ldflags设置版本信息编译"
  - "velero --version不支持,需用velero version --client-only查看版本"
