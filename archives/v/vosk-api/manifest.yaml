software: vosk-api
display: "Vosk"
description: "离线开源语音识别工具箱的 C API 核心库（libvosk + vosk_api.h），基于 Kaldi 与 OpenFst"
category: library
homepage: "https://github.com/alphacep/vosk-api"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "只交付 C API 核心库 libvosk.so + vosk_api.h；仓库内 python/java/kotlin/csharp/nodejs/rust/go 是绑定，均为 libvosk 的消费者，不参与构建"
    - "上游 CMakeLists 漏写 src/postprocessor.cc（vosk_api.cc 的 vosk_text_processor_* 引用其 Processor 符号），需补入，见 patches/0001"
    - "上游 find_package(kaldi) + 裸库名 kaldi-base/kaldi-online2/kaldi-rnnlm/fstngram 是发行版 cmake 打包假设；Conan 交付需改链 kaldi::kaldi / libfstngram::libfstngram，见 patches/0001"
    - "src/model.cc 直接 include <fst/extensions/ngram/ngram-fst.h> 并注册 FST 类型 ngram；openfst/1.8.4 默认 --enable-ngram-fsts=no 不带该扩展，必须额外依赖 libfstngram/1.8.4"
    - "kaldi-asr/kaldi g20231112 已把 kaldi::WordAlignLatticePartial 合并进 kaldi::WordAlignLattice（签名一致），vosk 0.3.50 面向 alphacep/kaldi 分支，需按此迁移，见 patches/0002"
    - "设备原生构建（os=OHOS arch=armv8，设备 clang 15）；make jobserver FIFO 在 HMDFS 上不可用，配方串行构建（CMAKE_BUILD_PARALLEL_LEVEL=1）"
  common_dependencies:
    - kaldi
    - openfst
    - libfstngram
    - openblas

versions:
  "0.3.50":
    status: built
    build_date: "2026-09-28"
    notes: >-
      C API 库 libvosk.so（上游 Makefile 亦默认 --shared）。test_package 17/17 断言通过
      （消费者功能 10 + 鸿蒙专项 7）。上游无自动化测试套件（N=0），真实测试入口为
      c/Makefile 的 test_vosk/test_vosk_speaker（需外部模型）。
