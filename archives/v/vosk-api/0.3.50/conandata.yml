  filename: "vosk-api-0.3.50.tar.gz"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "CMake 构建修复：(1) 补入上游 CMakeLists 漏掉的 src/postprocessor.cc（vosk_api.cc 的 vosk_text_processor_new 引用其 Processor 符号，缺失即链接失败）；(2) 上游 find_package(kaldi) 期望安装态 kaldi 导出的 kaldi-base/kaldi-online2/kaldi-rnnlm 目标加裸库名 fstngram，本仓以 Conan 包交付 kaldi/openfst/libfstngram，改为消费 CMakeDeps 目标 kaldi::kaldi 与 libfstngram::libfstngram。"
    patch_type: "portability"
  - patch_file: "patches/0002-src-recognizer.cc.patch"
    patch_description: "Kaldi API 版本适配：上游 vosk-api 0.3.50 调用 kaldi::WordAlignLatticePartial（alphacep/kaldi 分支 API），kaldi-asr/kaldi 自 g20231112 起已把该函数合并进 kaldi::WordAlignLattice（同一签名：CompactLattice + TransitionInformation + WordBoundaryInfo + max_states + CompactLattice*，语义为 partial-word 感知的词对齐），故改用合并后的入口。"
    patch_type: "portability"
