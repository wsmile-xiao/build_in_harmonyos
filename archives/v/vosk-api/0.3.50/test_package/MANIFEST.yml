# test_package/MANIFEST.yml
# 上游官方测试与消费者测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: vosk-api/0.3.50
homepage: "https://github.com/alphacep/vosk-api"

# ── 上游测试清点结论 ────────────────────────────────────────────────
# vosk-api 0.3.50（tag v0.3.50 tarball）不含自动化测试套件。证据：
#   1. 源码树无 tests/ 目录；顶层 CMakeLists.txt 无 enable_testing()/add_test()，
#      src/ 无 ctest/pytest/gtest/doctest 注册；
#   2. 唯一 CI 配置 .travis.yml 只执行 travis/build-wheels.sh（构建 Python wheel），
#      不运行任何测试；
#   3. c/Makefile 的 all 目标编出 test_vosk / test_vosk_speaker 两个示例程序，
#      属人工验证程序：c/test_vosk.c:9 打开写死的 "model" 目录、c/test_vosk.c:15
#      打开 "test.wav"，二者都需要外部下载的模型与音频，且无断言、无退出码约定；
#   4. python/example/*.py 是面向用户的示例脚本（同样需要下载模型），
#      python/test/transcribe_scp.py 是辅助脚本，均非测试套件。
# 故上游自动化用例数 N = 0。真实测试入口 = c/Makefile（见下，需外部模型）。

upstream_check_command: ""
upstream_tests: []

# 上游真实测试入口（非自动化、依赖外部模型，故不在本配方 build()/test_package 内执行）
upstream_test_entry_points:
  - file: c/Makefile
    description: "上游 C API 示例/验证程序入口（all: test_vosk test_vosk_speaker）"
    command: "cd c && make && ./test_vosk"
    blocker: >-
      需要外部下载的 Vosk 模型目录（上游写死为相对路径 'model'）与 test.wav；
      程序仅 printf 结果，无断言、无自动通过/失败判定。

test_package_tests:
  - file: test_vosk.c
    description: >-
      消费者测试：以 C 语言链接 libvosk.so，验证 (1) C API 可链接可调用；
      (2) 缺失模型目录时 vosk_model_new/vosk_spk_model_new/vosk_batch_model_new
      按契约返回 NULL 而非 abort；(3) NULL 句柄释放为 no-op；
      (4) vosk_text_processor_new 经 OpenFst Fst::Read 加载两个 identity 转移器后，
      vosk_text_processor_itn 对输入做 StringCompiler+Compose+ShortestPath 往返，
      输出必须与输入逐字一致（模型无关的真实功能路径）。
    command: 'bash -c ''./test_vosk <tagger.fst> <verbalizer.fst> <missing-dir>'''
  - file: make_identity_fst.cpp
    description: >-
      测试夹具生成器（仅链 OpenFst，不链 libvosk.so）：写出字节级 identity
      转移器 tagger.fst / verbalizer.fst，供上述 ITN 往返断言使用。
    command: 'bash -c ''./make_identity_fst <out.fst>'''
  - file: ohos_dlopen_probe.c
    description: >-
      鸿蒙运行期加载探针：dlopen(libvosk.so) + dlsym 解析 10 个公开 C API 符号，
      复现 Python ctypes / Java / C# 绑定在 OHOS 上的消费路径（不链接、只 dlopen）。
    command: 'bash -c ''./ohos_dlopen_probe <libvosk.so>'''
  - file: ohos_specific_test.sh
    description: >-
      鸿蒙专项测试：libvosk.so 为 64 位 AArch64 ELF；NEEDED 依赖闭合
      （libc++_shared.so / libc.so / libopenblas.so.0，且无构建机绝对路径）；
      OHOS musl 加载器下 dlopen + 公开符号解析通过。
    command: "bash ohos_specific_test.sh <libvosk.so> <ohos_dlopen_probe> <work_dir> <log>"

# 断言总数 = test_vosk.c 10 条 + ohos_specific_test.sh 7 条
#   ohos 7 条：AArch64 / ELF64 / NEEDED(libc++_shared.so, libc.so, libopenblas.so.0)
#              / 无绝对路径 NEEDED / dlopen 成功且 10 个公开符号解析
#   实测：test_vosk checks=10 failures=0；ohos_specific_test summary: pass=7 fail=0
assertion_count: 17
