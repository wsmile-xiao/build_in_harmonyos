knowledge_gained:
  - "vosk 的 C 核心主体为 C++（src/*.cc，顶层 CMakeLists project(vosk-api CXX)）；仓库内 python/java/kotlin/csharp/nodejs/rust/go 目录只是 libvosk 的语言绑定，不参与本包构建。lang-preflight 会因嵌套的 python/setup.py 误判 detected=python，需人工按绑定主体覆盖 (reference: notes.md 语言预检偏差记录节)"
  - "src/model.cc 直接 include <fst/extensions/ngram/ngram-fst.h> 并注册 FstRegisterer<NGramFst<StdArc>>；openfst/1.8.4 上游默认 --enable-ngram-fsts=no 不产出 ngram 扩展（包内无 include/fst/extensions/、无 libfstngram.a），必须额外消费独立包 libfstngram/1.8.4 (reference: notes.md W0 依赖预检节)"
  - "上游 CMakeLists.txt 的 add_library 漏写 src/postprocessor.cc（其 Processor 被 vosk_api.cc 的 vosk_text_processor_new/itn 引用），而上游 src/Makefile 的 VOSK_SOURCES 含该文件——上游 CMake 路径未进 CI，走 CMake 构建会 undefined reference (reference: notes.md 问题 #3)"
  - "上游 find_package(kaldi) + 裸库名 kaldi-base/kaldi-online2/kaldi-rnnlm/fstngram 是发行版 cmake 打包假设；Conan 交付需改为 CMakeDeps 目标 kaldi::kaldi / libfstngram::libfstngram (reference: notes.md 问题 #4)"
  - "上游 vosk 0.3.50 面向 alphacep/kaldi 分支调用 WordAlignLatticePartial；kaldi-asr/kaldi g20231112 已把该函数合并进 kaldi::WordAlignLattice（签名一致，语义为 partial-word 感知的词对齐），故消费 upstream kaldi 时需按其迁移 (reference: notes.md 问题 #2)"
  - "上游 CMakeLists 未设 VERSION/SOVERSION，shared library 无 DT_SONAME，W3/CI 的 L5a soname_gate 拦截；已知本平台根因是 CMake 无 Platform/HarmonyOS.cmake 使 CMAKE_SHARED_LIBRARY_SONAME_*_FLAG 为空，本例以目标级 target_link_options(-Wl,-soname,libvosk.so) 等价修复（产物 readelf -d 实测 SONAME=[libvosk.so]），无需版本号后缀 (knowledge_ref: knowledge/graph/E383.kv)"

knowledge_ref:
  - "knowledge/graph/E383.kv"

