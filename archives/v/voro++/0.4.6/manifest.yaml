  - "0001-Makefile.patch"
  - "0002-config.mk.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "voro++ 使用自定义 Makefile+config.mk 构建系统，无 autotools/cmake，需手动修改 config.mk 设置编译器"
  - "上游 Makefile 不支持 DESTDIR，需修改 install 目标将 $(PREFIX) 替换为 $(DESTDIR)$(PREFIX)"
  - "G0 clean-verify 硬编码执行 ./configure，需为非 autotools 项目创建 configure wrapper 脚本"
  - "G4 verify_build 检查扁平格式 build_system: 字段，而非嵌套 build: system: 格式"
  - "voro++ 0.4.6 二进制版本字符串仍显示 0.4.5（上游未更新 cmd_line.cc），NEWS 文件确认是 0.4.6"
  - "manifest.yaml 中 configure_options 为 YAML 列表格式时，会被 G0 shell 命令误解析导致引号错误，需改为空字符串"
  - "dfsg1 源码包不含部分外部测试数据文件（如 pack_ten_cube），import 示例无法运行"

patch_generation:
