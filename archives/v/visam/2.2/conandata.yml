# V-ISAM 官方只发布 Unix compress 归档（.tar.Z），conan 的 get() 不认识 LZW，
# 因此 conanfile.py 单独 download 后用 `cmake -E tar` 解包（libarchive 原生支持 compress）。
# 官方发布页：http://inglenet.com/gnucobol.html （Debian 软件包 visam 的 Homepage 亦指向此处）。
# 该归档是作者机器上的工作副本（含上一轮 configure/make 产物与若干无关 core dump），
# conanfile.py build() 中按上游自身方式 `make distclean` 后做 VPATH 构建。
sources:
  url: "http://inglenet.com/Products/GnuCOBOL/visam-2.2.tar.Z"
  sha256: "cdf4db8f5b6dedb4038ed4049d4e9990d321154021d3dc604ed6468ba112e1ec"
patches:
  "2.2":
    - patch_file: "patches/0001-build_aux-config.guess.patch"
      patch_description: "为 config.guess 增加 HarmonyOS/linux-ohos 系统识别分支"
      patch_type: "portability"
    - patch_file: "patches/0002-build_aux-config.sub.patch"
      patch_description: "为 config.sub 增加 linux-ohos 三元组支持"
      patch_type: "portability"
    - patch_file: "patches/0003-configure.patch"
      patch_description: "config.status 临时目录 umask 077 改为 022（HMDFS setgid 下 077 目录 owner 亦不可写，CI 实测 ./confXXXXXX/subs1.awk Permission denied）"
      patch_type: "portability"
