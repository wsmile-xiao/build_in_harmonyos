package: visam/2.2
homepage: "http://inglenet.com/gnucobol.html"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: "tests/Makefile.am"
    source: "visam-2.2/tests/Makefile.am"
    description: >-
      Upstream declares only `noinst_PROGRAMS = mvtest detest00 detest01 jvntest mvtest2`
      and no `TESTS=`/`check_PROGRAMS`, so `make check` compiles the five test programs
      but executes zero cases. The programs are run manually as the real upstream test
      entry point (see notes.md for per-case results).
    command: "make check"
test_package_tests:
  - file: "main.c"
    description: >-
      Consumer test using only the public headers/API: deccvdbl/dectodbl decimal
      round-trip (the only call chain needing the OHOS ecvt(3) shim) plus a full
      ISAM lifecycle (iserase/isbuild/isaddindex/iswrite/isread/isfullclose).
    command: "./visam_consumer"
assertion_count: 3
