version: "2.2"
software: "visam"
status: "built"
build_date: "2026-09-27"
build_system: "autotools"

source:
  url: "http://inglenet.com/Products/GnuCOBOL/visam-2.2.tar.Z"
  sha256: "cdf4db8f5b6dedb4038ed4049d4e9990d321154021d3dc604ed6468ba112e1ec"
  # 官方只发 Unix compress（LZW）归档；conan 的 get() 不支持，配方改用
  # download() + `cmake -E tar xf`（libarchive 原生支持 compress）。
  tar_format: "tar.Z"

build:
  system: "autotools"
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--enable-logging"
    - "--enable-thread-safe"
    - "--with-pthread"
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
  dependencies: []
  cc: "clang"
  cxx: "clang++"
  vpath_build: true

patches_applied:
  - "0001-build_aux-config.guess.patch"
  - "0002-build_aux-config.sub.patch"
  - "0003-configure.patch"

knowledge_gained:
  - "ecvt(3) 缺失：libvisam/isdecimal.c 用它做 double→十进制数字串转换，OHOS musl 不提供该 glibc 扩展，链接报 undefined reference ... ecvt；配方自带 ohos-ecvt-shim.[ch]（-include 声明 + extra_ldflags 注入 + ar r 并入 libvisam.a）（ref: notes.md 问题 4）"
  - "事务/日志初始化缺陷：非 pthread 分支下 VB_GET_RTD 展开为 &vb_rtd_data，vb_init_rtd() 永不执行，cvbtransbuffer 恒 NULL，vtranshdr() 写事务头时空指针解引用（mvtest SIGSEGV 139）；用 --enable-thread-safe --with-pthread 走 HAVE_PTHREAD_H 分支即可（ref: notes.md 问题 6）"
  - "上游 tar 是作者机器上的工作副本（config.status/config.h/Makefile/libtool/stamp-h1/.deps 与 9 个无关 core dump），VPATH 构建前必须 make distclean，否则 configure 报 source directory already configured（ref: E434；notes.md 问题 3）"
  - "上游 tests/Makefile.am 只有 noinst_PROGRAMS、没有 TESTS=，make check 只编译不执行；5 个测试程序需手工运行并单独统计（ref: notes.md 上游测试）"
  - "官方 tar.Z 的 build_aux/* 全为 0644（补丁与 tar 均无法设置权限位），而 autoconf 的 MKDIR_P 探测只认 GNU coreutils 版 mkdir，非 GNU 环境回退 build_aux/install-sh -c -d 后 make install 必失败；配方 build() 首步恢复已知 helper 的 0755（ref: E490；notes.md 问题 9）"
  - "HMDFS setgid + umask 077 使 autoconf 生成的 config.status 无法建立临时目录（CI 实测 ./confXXXXXX/subs1.awk: Permission denied → could not setup config files machinery）；configure 内两处 umask 077 改为 022 即可，本地非 HMDFS 环境不复现、只有 CI/真机触发（ref: E136、E129、E112；notes.md 问题 10）"

homepage: "http://inglenet.com/gnucobol.html"
license: "LGPL-2.1-or-later"

tests:
  upstream:
    command: "make check（编译 5 个测试程序，注册用例数 0）"
    cases: 0
    passed: 0
    note: >-
      tests/Makefile.am 未声明 TESTS=/check_PROGRAMS，make check 不执行任何用例。
      上游真实测试入口是 5 个测试程序，已手工逐一运行：detest00/detest01/
      mvtest(create+run)/mvtest2(create+run)/jvntest，7 次调用全部 rc=0（6/7 见 notes.md）。
  adapted:
    command: "test_package/visam_consumer"
    cases: 3
    passed: 3
    pass_rate: "3/3 (100%)"

