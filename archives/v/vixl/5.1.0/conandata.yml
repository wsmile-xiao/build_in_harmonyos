sources:
  "5.1.0":
    url: "https://github.com/Linaro/vixl/archive/refs/tags/5.1.0.tar.gz"
    sha256: "2a371df23e61ed6a2a652c9dc17bdae57d3e64b844eeacd36ca92f7b11950c4b"
patches:
  - patch_file: "patches/0001-scons4-ohos-portability.patch"
    patch_description: "OHOS/SCons 4.x portability: normalize list in AliasedListVariable.validator; replace subprocess rm/ln with Python primitives; demote -Werror to -Wno-error for newer clang warnings."
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-cpufeatures-id-reg-skip.patch"
    patch_description: "Skip the CPUFeatures_infer_from_id_registers test when ID registers report fewer features than the OS (OHOS S3-encoded AA64ZFR0 reads as zero while HWCAP reports SVE features)."
    patch_type: "portability"
  - patch_file: "patches/0003-util-getcompilerdirectives-split-cxxflags.patch"
    patch_description: "Split CXXFLAGS into separate argv entries in GetCompilerDirectives: SCons 4.x stores flags as a space-separated CLVar whose str() is '-fPIC -O2', which clang rejects as a single unknown argument, breaking GetHostArch architecture detection."
    patch_type: "portability"
