version: "5.1.0"
software: "vixl"
status: built
build_date: "2026-09-19"
build_system: scons

source:
  url: "https://github.com/Linaro/vixl/archive/refs/tags/5.1.0.tar.gz"
  sha256: "2a371df23e61ed6a2a652c9dc17bdae57d3e64b844eeacd36ca92f7b11950c4b"
  tar_format: tar.gz

build:
  system: scons
  configure_options:
    - "std=c++14"
    - "mode=release"
    - "simulator=aarch64"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-scons4-ohos-portability.patch"
  - "0002-ohos-cpufeatures-id-reg-skip.patch"

knowledge_gained:
  - "VIXL SConstruct 只从环境变量读 CC/CXX/AR/RANLIB，命令行传编译器会报 Unknown build options"
  - "OHOS 上 rm/ar/ln 是 shell alias 或 SELinux 受限，subprocess exec 不可用，需用 Python 原语或 llvm-ar"
  - "SCons 4.x 的 Variables 把 list 直接传给自定义 validator，旧 SCons 2.0 语义需兼容"
  - "clang 15 新增 -Wbitwise-instead-of-logical/-Wimplicit-const-int-float-conversion 等，VIXL 5.1.0 -Werror 需降级"
