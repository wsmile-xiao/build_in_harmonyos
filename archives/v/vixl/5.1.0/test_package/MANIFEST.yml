# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: vixl/5.1.0
homepage: "https://github.com/Linaro/vixl"

# 上游测试命令（tools/test.py 构建并运行全部测试，release + debug 模式）
upstream_check_command: "python3 tools/test.py --nolint --noclang-format --noclang-tidy"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/test-runner.cc
    source: vixl-5.1.0/test/test-runner.cc
    description: "VIXL 上游测试套件（AArch64/AArch32 assembler、disassembler、simulator 单元测试）"
    command: "python3 tools/test.py --nolint --noclang-format --noclang-tidy"

test_package_tests:
  - file: test.cpp
    description: "消费者测试: 用 MacroAssembler 生成 AArch64 代码、Decoder 解码、Simulator 执行并校验寄存器结果"
    command: "./test_vixl"

assertion_count: 3
