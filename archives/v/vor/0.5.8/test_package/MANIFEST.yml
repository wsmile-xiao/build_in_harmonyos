# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: vor/0.5.8
homepage: "https://sametwice.com/vor"

# ── 上游测试清点（R51 上游测试三步法之“清点”）────────────────────────
# 取证命令与结果（B 机 2026-09-27 实测，官方 tarball 解包 vor-0.5.8/）：
#   $ grep -nE "check|TESTS" Makefile.in        → 无输出（全文既无 check: 目标，
#                                                 也无 TESTS/am__TESTDrivers）
#   $ grep -n "AC_CONFIG_TESTDIR\|AM_INIT_AUTOMAKE" configure.ac → 无输出
#   $ ls                                           → 无 tests/ test/ t/ 目录
#   $ grep -n "^.PHONY" Makefile.in               → all clean maintainer-clean
#                                                 install uninstall ... 无 check
# ⇒ 上游注册的可执行测试数 = 0，故本配方 build() 不发 `make check`
#   （发了只会 "No rule to make target 'check'"），不是省略、不是绕过。
upstream_check_command: "N/A（上游无测试套件：Makefile.in 无 check/TESTS 目标）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "N/A"

# 上游实际运行的测试程序
upstream_tests: []

# ── 消费者测试（test_package/test.sh，25 条断言）─────────────────────
test_package_tests:
  - file: test.sh
    description: "CLI 面 11 条（编号 1–8 共 8 个检查点，其中 4 号按 --help usage 的四行各计一条展开为 4 条，故实执行 11 条）：--version 退出码 0 且逐字输出 'Variations on Rockdodger 0.5.8'；--help 退出码非 0 且 usage 列出 -f/-s/-V/-? 四行；未知短选项 -Z 非 0 退出并打印 'unknown option -Z'；未知长选项 --bogus-option 打印 'unknown long option --bogus-option'；裸参数打印 'not an option'（上游 main() 在触碰 SDL 之前解析参数 ⇒ 无头可跑，未加补丁）"
    command: "vor --version / --help / -Z / --bogus-option / not-an-option"
    assertions: 11
  - file: test.sh
    description: "数据资产面 11 条：包内 share/vor 恰好 59 枚 PNG、总计 61 个条目（59 png + bang.wav + mph.xm），并逐一验证 b_variations.png/font.png/ship.png/icon.png/life.png/rock00.png/rock49.png/bang.wav/mph.xm 在位"
    command: "ls <pkg>/share/vor"
    assertions: 11
  - file: test.sh
    description: "运行期数据定位面 3 条（把包内 share/vor 临时改名再放回，双向钉死编译期烧进的 DATA_PREFIX 就是运行时取数目录）：数据被藏起时 vor 报 \"Can't find VoR data!\"；数据在位时同一调用不再报缺数据；且无任何动态链接器错误（证明 libSDL-1.2.so/SDL_image/SDL_mixer 运行期真的解析到了）。视频后端固定 SDL_VIDEODRIVER=none + 20 秒看门狗，使断言与 worker 有无显示无关；显示/音频能力本身的实测输出原样打在日志，不做断言（见 notes.md）"
    command: "SDL_VIDEODRIVER=none vor -s"
    assertions: 3

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 25
