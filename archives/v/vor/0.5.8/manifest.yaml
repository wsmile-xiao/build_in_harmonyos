  # catch-all 页：vor-0.5.8.tar.gz 返回 1535 字节、同族页 1502-1550 字节、真主页 8591 字节，唯一下载链是 jasonwoof.com 的 vor-win-0.5.4-rc1.zip，
  # 版本/平台都不对）⇒ 取 Debian 官方主仓 .orig（上游原样发布物，非第三方搬运），
  # sha256 与 361789 字节实物实测一致。细节见 conandata.yml 与 notes.md「取源」；「为什么不能改用上游 GitHub 的 tag 件」这半段例外链的现取否证读数已随 PR：notes.md:43 挂钩 → §13 摘要 → 证据件 reports/pf7-source-equivalence-evidence.md（两枚 URL 实测、51 枚共同文件逐字节相同、tag 件缺件清单）。
  url: "https://deb.debian.org/debian/pool/main/v/vor/vor_0.5.8.orig.tar.gz"

  sha256: "9003089708327e1a3169b412e16725ccb669dd21465d49abec5aa4e6e4cce09a"

  # 压缩格式: tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项（<> 内为本包由 conan 注入的取值说明）
  configure_options:
    - "--prefix=<包最终绝对目录 self.package_folder>"
    - "--build=x86_64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "PKG_CONFIG_PATH=<generators_folder（含 sdl/SDL_image/SDL_mixer 三枚别名 .pc）>"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sdl12-compat/1.2.68
    - sdl_image/1.2.12
    - sdl_mixer/1.2.12

  # 编译器
  cc: clang
  cxx: clang++

