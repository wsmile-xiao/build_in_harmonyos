patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "SDL 1.2 老游戏用 configure.ac 的 PKG_CHECK_MODULES 找模块名 sdl / SDL_image / SDL_mixer（大小写敏感、按 .pc 文件名匹配）；本仓 conan 的 PkgConfigDeps 产出的是 sdl12-compat.pc / sdl_image.pc / sdl_mixer.pc，三个都对不上，且 sdl 那个连名字都不同 ⇒ 在 generators_folder 里为三枚模块各补一枚别名 .pc 即可满足上游探测，无需 patch configure.ac、无需重装 autotools（AutotoolsToolchain 已自动把 generators_folder 前置进 PKG_CONFIG_PATH）。⚠ 别名内容必须读回原 .pc 后改写：第一版写成只做 Requires 前转的桩，而 HMDFS 大小写不敏感 ⇒ 桩与 conan 生成的小写 .pc 是同一个物理文件、桩覆盖真身，pkg-config 于是自引用、--cflags/--libs 返回空而 --exists 仍为 0（configure 照样打印 yes），该做法已被本包推翻（机制与一手读数见 notes.md:109-117）（ref: notes.md:79 与 :117）"
  - "上游 Makefile.in 把 pkgdatadir 以 -DDATA_PREFIX=\"$(pkgdatadir)\" 烧进二进制，file.c find_data_dir() 第三候选就是它；而 conan AutotoolsToolchain 的默认 prefix 是 \"/\" ⇒ 必须用 AutotoolsToolchain(self, prefix=self.package_folder) 让烧死的路径等于包最终目录，否则装完就跑不起数据（配合上游自带的 VOR_DATA 环境变量第一候选，配方在 package_info 里用 runenv_info 一并导出）（ref: notes.md:170 与 :172）"
  - "tar 内已有预生成 configure/Makefile.in/aclocal.m4（上游 INSTALL:13-16 说 autoconf>=2.63 只在「从 git 构建」或「改动图形资产」时才需要——原文含 or editing the graphics 那一支，此前写作「只在从 git 构建时才需要」是跨行连读的截断错读，逐字见 reports/failure-state-evidence.md:323-325 与 notes.md:26-29；本包两条都不走，且仓库无 Makefile.am）⇒ 走预生成 configure，绝不 autoreconf 自举；交叉双三元组跳过 autoconf 的 conftest 运行探测（未签名 ELF 在沙箱跑不了；两枚三元组的实装位置见 conanfile.py:163-166，docstring 说明见同件 :35，同义的 generate() 内注释见 :161-162）（ref: notes.md:26 与 :22）"
  - "上游零测试：Makefile.in 无 check/TESTS、configure.ac 无 AC_CONFIG_TESTDIR、无 tests/ 目录 ⇒ 注册测试数 0；可执行验证由 test_package/test.sh 的 25 条断言承担，靠 args.c 里 --version/--help 先于任何 SDL 调用这一事实实现无头真跑（不需要 criticalmass 那种 headless 补丁；该口径的原文注释见随 PR 的 test_package/test.sh:10-11）（ref: notes.md:213 与 :215）"
  - "OHOS ELF 必须在 package() 内 llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1 自签，否则消费者测试执行时报 Operation not permitted；HMDFS 下 GNU make jobserver 的 mkfifo 被拒（Operation not permitted）⇒ make -j1（ref: notes.md:157 与 :276）"

# 本配方实际作为决策依据使用的知识条目（顶层键，_scan_knowledge_ref() 只读这里）
