software: vimpager
version: "2.06"
status: published
build_system: makefile
build_date: "2026-06-16"

source:
  url: "https://github.com/rkitover/vimpager/archive/refs/tags/2.06.tar.gz"
  sha256: "cc616d0840a6f2501704eea70de222ab662421f34b2da307e11fb62aa70bda5d"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
    - "SYSCONFDIR=$DEFAULT_PREFIX/etc"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "纯Makefile项目无configure脚本，构建系统检测为autotools但实际为makefile"
  - "DESTDIR模式必须指定PREFIX=$DEFAULT_PREFIX，否则安装路径与脚本期望不一致"
  - "构建产物(vimpager脚本重建)不应作为补丁记录，属于make过程正常输出"
  - "G0 clean-verify对makefile项目尝试运行configure会失败，需手动验证替代"
