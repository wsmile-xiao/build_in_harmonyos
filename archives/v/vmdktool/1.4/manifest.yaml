software: vmdktool
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://people.freebsd.org/~brian/vmdktool/vmdktool-1.4.tar.gz"

  # 源码校验和
  sha256: "981eb43d3db172144f2344886040424ef525e15c85f84023a7502b238aa7b89c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "zlib/1.2.11 (系统静态库 libz.a)"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-add-long-options.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "vmdktool 使用 BSD-style Makefile，非 autotools，无 configure 脚本"
  - "Makefile 包含 FreeBSD 特定 CFLAGS (-Wsystem-headers, -Werror)，必须覆盖"
  - "静态链接需要 -L 指定 libz.a 路径: -L/storage/Users/currentUser/usr/local/lib"
  - "原代码仅支持 -V 短选项，需补丁添加 --version/--help 长选项以通过 L2 smoke test"
  - "Conan 2 的 conan cache path 返回 recipe export 路径，需创建符号链接到 binary package"
  - "FreeBSD 源码服务器 SSL 证书不被信任，用 curl -kL 手动下载"
