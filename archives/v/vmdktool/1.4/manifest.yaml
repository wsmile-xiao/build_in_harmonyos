software: vmdktool
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://people.freebsd.org/~brian/vmdktool/vmdktool-1.4.tar.gz"

  # 源码校验和
  sha256: "981eb43d3db172144f2344886040424ef525e15c85f84023a7502b238aa7b89c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-add-long-options.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "vmdktool 使用 BSD-style Makefile，非 autotools，无 configure 脚本"
  - "Makefile 包含 FreeBSD 特定 CFLAGS (-Wsystem-headers, -Werror)，必须覆盖"
  - "R26: 终端工具静态链接 zlib，使用 -static -L{conan_zlib_lib_dir} -lz"
  - "原代码仅支持 -V 短选项，需补丁添加 --version/--help 长选项以通过 L2 smoke test"
  - "source() 使用 conan.tools.files.get() 下载，CI 环境兼容"
  - "zlib/1.3.1 作为 Conan 依赖，从 ohpcd 制品仓获取"
