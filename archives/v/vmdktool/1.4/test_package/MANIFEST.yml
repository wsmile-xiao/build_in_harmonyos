# test_package/MANIFEST.yml — vmdktool 1.4
# CI L0e requires this file to exist.

package: vmdktool/1.4
homepage: "https://people.freebsd.org/~brian/vmdktool/"

# vmdktool has upstream tests (make test / prove) but they require
# perl TAP::Harness and test data in the tarball.
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs used in test_package
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_vmdktool.sh
    description: "Runs vmdktool --version and --help, verifying the binary executes and produces expected output"
    command: "bash test_vmdktool.sh"

# Approximate assertion count (--version + --help)
assertion_count: 2
