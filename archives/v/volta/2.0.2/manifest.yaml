software: volta
version: 2.0.2
status: built
description: "JS Toolchains as Code - JavaScript toolchain manager"
homepage: https://volta.sh/
source_url: https://github.com/volta-cli/volta/archive/refs/tags/v2.0.2.tar.gz
license: BSD-2-Clause

build_system:
  type: cargo
  detected: false
  manual: true

build_config:
  prefix: /usr
  destdir_mode: true
  build_method: "cargo build --release"
  install_method: "manual cp binaries to DESTDIR"

build_cleanliness:
  warnings_only: true
  no_source_modifications: true

compatibility:
  platform: HarmonyOS
  kernel: "HongMeng Kernel 1.12.0"
  arch: aarch64
  rust_version: "1.95.0"
  ohos_patches_needed: false

installed_files:
  - /usr/bin/volta
  - /usr/bin/volta-migrate
  - /usr/bin/volta-shim

test_results:
  type: manual
  total: 2
  passed: 2
  failed: 0
  note: "volta --version returns 2.0.2, volta --help works correctly"
