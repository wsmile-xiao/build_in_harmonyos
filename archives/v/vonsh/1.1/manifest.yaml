# 版本级 manifest — vonsh 1.1
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1"
software: "vonsh"

status: built
build_date: "2026-09-17"
build_system: makefile

source:
  url: "https://github.com/aurb/vonsh/archive/refs/tags/v1.1.tar.gz"
  sha256: "d607002268408ed98da56136d47830142f81a9e2dbac6f6d891e3357763eac35"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=<profile clang> STRIP=true VERSION_STR=1.1 -j2"
    - "CFLAGS 命令行覆盖：上游 -std=c99 -D_DEFAULT_SOURCE -pedantic -O2 加固旗标 + 各依赖 -I 路径"
    - "LDLIBS 命令行覆盖：-lSDL2_image -lSDL2_mixer -lSDL2 -lcjson -lm（去掉 -lSDL2main），依赖 -L 路径"
  dependencies:
    - sdl2/2.30.10
    - sdl2-image/2.8.12
    - sdl2-mixer/2.8.2
    - cjson/1.7.19
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "vonsh Makefile 的 CFLAGS 用 ?=/+=、LDLIBS 用 =：命令行覆盖会整体替换（+= 失效），必须完整复刻上游旗标"
  - "conan 的 sdl2 包不含 SDL2main（WinMain 兼容垫片），-lSDL2main 需从 LDLIBS 去掉；游戏自身有 main()"
  - "sdl2-image/2.8.12 与 sdl2/2.30.10.1 版本冲突，须配 sdl2/2.30.10"
  - "STRIP=true 覆盖：OHOS 内核 MAC 拒绝 strip 后的二进制（abduco 先例）"
  - "SDL2 游戏无显示环境冒烟：SDL_VIDEODRIVER=dummy SDL_AUDIODOVRIVER=dummy + timeout 5，exit 124 即存活"
