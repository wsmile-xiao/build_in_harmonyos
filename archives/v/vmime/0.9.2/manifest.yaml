# 版本级 manifest — vmime 0.9.2

version: "0.9.2"
software: "vmime"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag）
  url: "https://github.com/kisli/vmime/archive/refs/tags/v0.9.2.tar.gz"
  sha256: "9874bf911a7dbc257297ab00f7541875da221ee8251a4218cc65abff6e362399"
  tar_format: tar.gz

# ============================================================
# 构建信息
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DVMIME_BUILD_TESTS=ON"
    - "-DVMIME_BUILD_SAMPLES=OFF"
    - "-DVMIME_BUILD_DOCUMENTATION=OFF"
    - "-DVMIME_CHARSETCONV_LIB=iconv"
    - "-DVMIME_SENDMAIL_PATH=/usr/sbin/sendmail"
    - "-DVMIME_TLS_SUPPORT_LIB=openssl"
    - "-DVMIME_HAVE_SASL_SUPPORT=OFF"
  dependencies:
    - openssl/1.1.1w
    - libiconv/1.17.1
  test_requires:
    - cppunit/1.15.1
  cc: clang
  cxx: clang++
  stdlib: libc++17

# ============================================================
# 补丁信息
# ============================================================

patches:
  - file: "patches/0001-CMakeLists.txt.patch"
    description: "Static-only build: provide export-shared.hpp, link tests against vmime-static, and propagate OpenSSL/iconv via INTERFACE_LINK_LIBRARIES"
    type: conan
  - file: "patches/0002-src-vmime-encoding.cpp.patch"
    description: "Replace std::bind2nd with lambda for C++17 compatibility"
    type: portability
  - file: "patches/0003-src-vmime-net-tls-openssl-TLSSocket_OpenSSL.cpp.patch"
    description: "Convert static BIO_METHOD initialization to thread-safe BIO_meth_* API (C++11 magic static, populate-then-publish) for OpenSSL 1.1.0+ opaque BIO"
    type: portability
  - file: "patches/0004-src-vmime-net-tls-openssl-TLSSocket_OpenSSL.hpp.patch"
    description: "Declare static sm_customBIOMethod pointer and ensureCustomBIOMethod() helper"
    type: portability
  - file: "patches/0005-src-vmime-platforms-posix-posixHandler.cpp.patch"
    description: "Move G_mutex to global scope and add VMIME_HAVE_PTHREAD guard to getLocalCharset"
    type: portability
  - file: "patches/0006-src-vmime-platforms-posix-posixSocket.cpp.patch"
    description: "Fix strerror_r GNU/POSIX compatibility"
    type: portability
  - file: "patches/0007-tests-net-maildir-maildirStoreTest.cpp.patch"
    description: "Honor TMPDIR instead of hard-coded /tmp (OHOS device /tmp is read-only)"
    type: portability
  - file: "patches/0008-tests-parser-fileContentHandlerTest.cpp.patch"
    description: "Honor TMPDIR instead of hard-coded /tmp (OHOS device /tmp is read-only)"
    type: portability

# ============================================================
# 测试信息
# ============================================================

tests:
  upstream_total: 453
  upstream_passed: 453
  upstream_failed: 0
  pass_rate: "100%"
  failure_reason: "None — all 453 CppUnit test cases in 58 suites pass on HarmonyOS PC (aarch64)"

# ============================================================
# 备注
# ============================================================

notes: |
  - OHOS sysroot does not ship iconv.h; use conan-provided libiconv
  - SASL support disabled (gsasl not published to registry)
  - Static library build: OpenSSL and libiconv linked via INTERFACE_LINK_LIBRARIES
  - Test targets depend on vmime-static instead of vmime
  - Upstream test suite (tests/testRunner, CppUnit) executes in build() via ctest:
    453 test cases in 58 test executables, 100% pass
  - OHOS /tmp is read-only: test TMPDIR patches redirect temporary file I/O
    to the build directory