# test_package/MANIFEST.yml — vmime/0.9.2
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求）

package: vmime/0.9.2
homepage: "https://www.vmime.org/"

# 上游测试命令：CMake VMIME_BUILD_TESTS=ON 生成 run-tests 与逐目录测试可执行
# （CppUnit 框架，ADD_TEST 注册），经 TMPDIR 补丁适配 /tmp 只读后由 ctest 驱动
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test()（ctest 驱动 tests/ 下全部 CppUnit 测试可执行）"

# 上游实际运行的测试程序（tests/ 共 58 个 *Test.cpp，按目录归类）
upstream_tests:
  - file: tests/parser/
    source: vmime-0.9.2/tests/parser/
    description: "MIME 解析器用例（bodyPart/body/charset/attachment 等，CppUnit 注册）"
    command: "ctest"
  - file: tests/net/
    source: vmime-0.9.2/tests/net/
    description: "网络层用例（maildir/SMTP/POP3/IMAP 会话语义）"
    command: "ctest"
  - file: tests/security/
    source: vmime-0.9.2/tests/security/
    description: "安全层用例（证书/DIGEST-MD5 等）"
    command: "ctest"
  - file: tests/utility/
    source: vmime-0.9.2/tests/utility/
    description: "工具层用例（path/datetime/stringUtils/inputStream 等）"
    command: "ctest"
  - file: tests/misc/
    source: vmime-0.9.2/tests/misc/
    description: "杂项用例（importanceHelper/referenceHandler 等）"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：构造 MIME 报文→序列化→重解析并逐字段断言"
    command: "./test_vmime"

# 测试用例总数（上游 run-tests 全量执行输出 "OK (453 tests)"）
assertion_count: 453