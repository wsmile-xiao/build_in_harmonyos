sources:
  "0.9.2":
    url:
      - "https://gh-proxy.com/https://github.com/kisli/vmime/archive/refs/tags/v0.9.2.tar.gz"
      - "https://github.com/kisli/vmime/archive/refs/tags/v0.9.2.tar.gz"
    sha256: "9874bf911a7dbc257297ab00f7541875da221ee8251a4218cc65abff6e362399"
patches:
  "0.9.2":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Static-only build: provide export-shared.hpp, link tests against vmime-static, and propagate OpenSSL/iconv via INTERFACE_LINK_LIBRARIES"
      patch_type: "conan"
    - patch_file: "patches/0002-src-vmime-encoding.cpp.patch"
      patch_description: "Replace std::bind2nd with lambda for C++17 compatibility"
      patch_type: "portability"
    - patch_file: "patches/0003-src-vmime-net-tls-openssl-TLSSocket_OpenSSL.cpp.patch"
      patch_description: "Convert static BIO_METHOD initialization to thread-safe BIO_meth_* API (C++11 magic static, populate-then-publish) for OpenSSL 1.1.0+ opaque BIO"
      patch_type: "portability"
    - patch_file: "patches/0004-src-vmime-net-tls-openssl-TLSSocket_OpenSSL.hpp.patch"
      patch_description: "Declare static sm_customBIOMethod pointer and ensureCustomBIOMethod() helper"
      patch_type: "portability"
    - patch_file: "patches/0005-src-vmime-platforms-posix-posixHandler.cpp.patch"
      patch_description: "Move G_mutex to global scope and add VMIME_HAVE_PTHREAD guard to getLocalCharset"
      patch_type: "portability"
    - patch_file: "patches/0006-src-vmime-platforms-posix-posixSocket.cpp.patch"
      patch_description: "Fix strerror_r GNU/POSIX compatibility"
      patch_type: "portability"
    - patch_file: "patches/0007-tests-net-maildir-maildirStoreTest.cpp.patch"
      patch_description: "Honor TMPDIR instead of hard-coded /tmp (OHOS device /tmp is read-only)"
      patch_type: "portability"
    - patch_file: "patches/0008-tests-parser-fileContentHandlerTest.cpp.patch"
      patch_description: "Honor TMPDIR instead of hard-coded /tmp (OHOS device /tmp is read-only)"
      patch_type: "portability"
