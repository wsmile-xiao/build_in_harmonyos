software: vpnc
display: "vpnc"
description: "Client for Cisco VPN concentrator"
category: network
homepage: "https://www.unix-ag.uni-kl.de/~massar/vpnc/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用纯 Makefile 构建，无 configure 脚本"
    - "依赖 libgcrypt（加密库）和 libgpg-error（传递依赖）"
    - "构建产物为两个可执行文件：vpnc（VPN 客户端）和 cisco-decrypt（密码解码器）"
    - "使用 make -e 让 Conan 环境变量覆盖 Makefile 赋值"
    - "手动安装代替 make install（OHOS 可能没有 install 命令）"
  common_dependencies:
    - libgcrypt/1.12.2

versions:
  "0.5.3":
    status: built
    build_date: "2026-09-04"
    conan_ref: "vpnc/0.5.3"
