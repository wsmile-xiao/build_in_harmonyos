# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: vpnc/0.5.3
homepage: "https://www.unix-ag.uni-kl.de/~massar/vpnc/"

# 上游测试命令
upstream_check_command: "make check"

# vpnc 0.5.3 has no `make check` target
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 vpnc --version 验证二进制可执行且返回版本号; 运行 cisco-decrypt 验证密码解密功能"
    command: "vpnc --version && cisco-decrypt 0038554D5A0C515739"

# 测试断言总数
assertion_count: 2
