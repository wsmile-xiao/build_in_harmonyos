software: vpnc
# 版本级 manifest
# 文件位置: archives/v/vpnc/0.5.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.unix-ag.uni-kl.de/~massar/vpnc/vpnc-0.5.3.tar.gz"

  # 源码校验和
  sha256: "46cea3bd02f207c62c7c6f2f22133382602baeda1dc320747809e94881414884"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libgcrypt/1.12.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "vpnc 0.5.3 uses a plain Makefile (no configure script), similar to babeld"
  - "vpnc depends on libgcrypt (for crypto) and libgpg-error (transitive)"
  - "vpnc builds two executables: vpnc (VPN client) and cisco-decrypt (password decoder)"
  - "The Makefile uses CC?=gcc and CFLAGS?= pattern, allowing Conan env override"
  - "Manual installation via copy() is used instead of `make install` because the install command may not be available on OHOS"
  - "AutotoolsToolchain generates the conanbuild environment with CC, CFLAGS, LDFLAGS, CPPFLAGS from Conan profile and dependencies"
