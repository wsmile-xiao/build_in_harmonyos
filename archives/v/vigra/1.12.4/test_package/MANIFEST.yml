# test_package/MANIFEST.yml
# 上游官方测试声明文件 + HMBS 测试计数声明
# 详见: docs/TEST_QUALITY_SPEC.md

package: vigra/1.12.4
homepage: "https://github.com/ukoethe/vigra"

# ── 上游测试审计（守则「上游测试套件执行」）──────────────────────────
# vigra 1.12.4 上游用 CMake 的 VIGRA_ADD_TEST 宏在 test/<子目录>/CMakeLists.txt
# 中注册测试，测试脚本由 config/VigraAddTest.cmake 生成（run_*.sh + ADD_TEST）。
# 统计口径 = ctest 条目计数（build 后 `ctest -N` 的 'Total Tests' 值，即
# "ctest_entries"），与官方 CMake 注册口径一致。
#
# 源码盘点（test/CMakeLists.txt 的 63 个 ADD_SUBDIRECTORY 逐个读各子目录
# CMakeLists.txt，逐条 IF/ELSE 判断在配方构建选项下的可达性）：
#   - 无条件注册：41 条
#   - 受 switch 控制的 conditional 条目，按本配方构建选项（WITH_HDF5=OFF、
#     WITH_OPENEXR=OFF、WITH_BOOST_GRAPH=OFF、WITH_LEMON=OFF、WITH_VALGRIND=OFF，
#     FFTW3_FOUND=true、THREADING_FOUND=true）评估：
#       * 关闭（不注册）：hdf5impex(test_hdf5impex)、polytope(test_polytope)、
#         gridgraph(test_gridgraph_BGL / test_gridgraph_LEMON)、
#         objectfeatures(test_objectfeatures_lemon)  = 5 条
#       * classifier / random_forest_3 / multiarray / registration /
#         simpleanalysis 的 IF(HDF5/THREADING) 分支仅影响链接库，两种分支都
#         注册同名测试，故计数不变。
#   - 合计：ctest -N 传统统计 = 53（BUILD_TESTS=ON + 上述选项下实测口径）。
#     若开启 HDF5/LEMON/BOOST_GRAPH（全选项）则为 58，但本配方默认最小依赖
#     关闭它们，故按配方实际注册口径申报 53。
upstream_test_total: 53
upstream_test_count_method: ctest_entries

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（目录组织，来源见 test/CMakeLists.txt 的 ADD_SUBDIRECTORY）
upstream_tests:
  - file: test/CMakeLists.txt
    source: vigra/test/CMakeLists.txt
    description: "53 个 ctest 条目（VIGRA_ADD_TEST），覆盖 basic image / multiarray / impex / blockwise / watersheds 等核心模块；子目录逐一盘点"
    command: "ctest -N"
  - file: test/multiarray
    source: vigra/test/multiarray
    description: "test_multiarray + test_multiarray_chunked（threading）"
    command: "ctest --output-on-failure -R multiarray"
  - file: test/impex
    source: vigra/test/impex
    description: "图像读写（PNG/JPEG/TIFF/FFTW）相关测试"
    command: "ctest --output-on-failure -R impex"

# test_package 中自带的测试 (消费者视角验证 vigraimpex 链接 + 头文件可用性)
test_package_tests:
  - file: test_vigra.cpp
    description: "消费者测试：BImage 初始化 + copyImage + TinyVector 算术 + ImageExportInfo 构造，验证 vigra 头文件与 libvigraimpex 链接"
    command: "./test_vigra"

# test_vigra.cpp 中的 4 条真实断言（各自返回不同错误码）
assertion_count: 4

# 上游测试不足 100% 时的缺口声明（由 conanfile.py build() 依据真机 ctest 实测
# 动态生成 gaps，覆盖 test_correlation + 每个真实失败用例 + 未执行用例，
# 并满足 Σgaps.count == upstream_test_total - passed，详见配方注释）。
# 下列为静态审计说明，非最终计数来源（最终以真机 HMBS_UPSTREAM_TEST_RESULT 的 gaps 为准）。
upstream_test_gaps:
  - count: 1
    category: ohos_feature
    detail: "test_correlation（对应 1 个 ctest 条目）需要单精度 FFTW libfftw3f(fftwf_* API)；fftw 3.3.10 的 OHOS conan 构建只产出双精度 libfftw3.so（未加 --enable-single），故配方对 test/correlation/CMakeLists.txt 增加 FFTW3F_FOUND 守卫跳过该测试。"
    evidence: "fftw 3.3.10 conanfile.py generate() 配置 --enable-shared/--disable-static/--disable-fortran/--disable-doc，无 --enable-single；真机链接报 'No rule to make target .../libfftw3f.so'（此前注入了不存在的路径）。"
  - count: 0
    category: test_failure
    detail: "真机 ctest 实际失败用例（如 test_math 的 AutodiffTest 断言精度问题）按 real 记录为 test_failure；具体名称与数目由 conanfile build() 从 ctest 状态行动态提取填充。"
    evidence: "conanfile.py build() 解析 ctest 'Test #N ... ***Failed/***Timeout' 状态行，逐一登记为 test_failure gap。"
  - note: "若某次 ctest 运行因外部 wall-clock/资源限制在全部用例完成前被截断（executed < discovered），未执行用例由配方以 environment 分类登记（count=discovered-executed），并用 --timeout 120 尽量保证整套完整执行；绝不以当前可运行子集当总数。"
