software: vigra
display: "VIGRA"
description: "A generic C++ library for image analysis"
category: gfx
homepage: "https://ukoethe.github.io/vigra/"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，关闭 vigranumpy 与文档，仅保留核心 vigraimpex"
    - "最小依赖：zlib/libpng/libjpeg-turbo/libtiff/fftw；可选 HDF5/OpenEXR/Boost/Lemon 默认关闭"
    - "开启 BUILD_TESTS 并通过 ctest 执行上游 53 项测试（WITH_HDF5=OFF 等最小依赖下 ctest -N 口径）"
  common_dependencies:
    - zlib
    - libpng
    - libjpeg-turbo
    - libtiff
    - fftw

versions:
  "1.12.4":
    status: built
    build_date: "2026-09-19"
