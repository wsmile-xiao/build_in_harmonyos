software: visp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.7.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.7.0"

# 构建系统类型
build_system: cmake

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://visp-doc.inria.fr/download/releases/visp-3.7.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DAARCH64=ON"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
    - "-DCMAKE_CXX_FLAGS=-fPIC -stdlib=libc++"
    - "-DCMAKE_EXE_LINKER_FLAGS=-lc++"
    - "-DCMAKE_SHARED_LINKER_FLAGS=-lc++"
    - "-DCMAKE_INSTALL_RPATH=$DEFAULT_PREFIX/lib"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"
    - "-DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

