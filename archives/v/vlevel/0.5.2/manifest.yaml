# 版本级 manifest — vlevel 0.5.2
# 遵循 ARCHIVE-SPEC v2.0

version: "0.5.2"
software: "vlevel"

status: built
build_date: "2026-09-17"
build_system: makefile

source:
  url: "https://github.com/radiocicletta/vlevel/archive/refs/tags/v0.5.2.tar.gz"
  sha256: "a0245608d5c6e072488ffcec42ebc260c88407469ce007ffe7888da351bd4769"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make -C vlevel-bin CXX=<profile clang++> VERSION=0.5.2 CXXFLAGS='-Wall -O3 -fPIC -DPIC -DVLEVEL_VERSION=\"0.5.2\"'"
    - "仅构建核心两组件（volumeleveler.o + vlevel-bin）；ladspa/jack/winamp 插件前端依赖宿主插件环境，OHOS 不支持，明确跳过"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "vlevel 顶层 Makefile 递归构建 4 个前端；OHOS 只取 core：vlevel-bin（raw PCM 过滤器）+ volumeleveler（算法对象）"
  - "vlevel-bin/Makefile 用 'CC = $(CXX)' 强制隐式规则走 g++；交叉构建需显式 CXX=<ohos clang++> 并复刻顶层 CXXFLAGS（含 -DVLEVEL_VERSION）"
  - "插件前端（ladspa/jack/winamp）为宿主插件环境产物，非 OHOS 目标"
