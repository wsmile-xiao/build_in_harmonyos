# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: vc-dwim/1.10
homepage: "https://www.gnu.org/software/vc-dwim/"

# 上游测试命令 — tests/ 下 25 个测试脚本（automake parallel test harness）
# 在 OHOS 依赖 GNU patch 2.7.6 / GNU awk / ctags（本机已装于 ~/usr/local/bin）
# 以及 conan 制品仓的 perl-pod-parser（Pod::PlainText）。
upstream_check_command: "make check -C tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-09-21 真机实测记录）
upstream_tests:
  - file: tests/
    source: "25 个测试脚本（automake 测试驱动）"
    description: >-
      上游测试套件：PERL5LIB 指向 perl-pod-parser 包、PATH 含 GNU patch/ctags、
      TMPDIR 指向可写目录、umask 022 下实测 —— 19 PASS / 6 SKIP / 0 FAIL。
      SKIP 均为环境缺可选 VC 工具（hg/bzr/cvs、git man viewer），非包缺陷。
    command: "make check -C tests"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: conanfile.py
    description: >-
      消费者测试（真实执行被测工具，R34）：① vc-dwim/vc-chlog --version 冒烟；
      ② 功能测试 vc-dwim --diff 在真实 git 工作树上比对 ChangeLog 与 diff；
      ③ 功能测试 vc-chlog --stdin 由 unified diff 生成 GCS 条目（awk/patch 管线）。
    command: "conan test"

# 测试断言总数（test_package 内）
assertion_count: 6
