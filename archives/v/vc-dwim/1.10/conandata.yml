patches:
  - patch_file: "patches/0001-perlmoddir-relocatable-and-umask-022.patch"
    patch_description: >
      Make vc-dwim's perl module dir lookup relocatable (resolve
      ../share/vc-dwim relative to the script when the baked-in datadir is
      absent) and relax `umask 077` temp-dir creation in vc-chlog to 022
      (E129: HMDFS setgid + umask 077 makes temp dirs unwritable).
