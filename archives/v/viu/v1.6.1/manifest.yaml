software: viu
version: "v1.6.1"
status: built
build_date: "2026-05-26"
build_system: cargo

source:
  url: "https://github.com/atanunq/viu/archive/refs/tags/v1.6.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cargo
  configure_options:
    - "cargo build --release"
  dependencies:
    - rust/1.95.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Rust项目需要修复 cargo 的 RUNPATH（patchelf + sign-elf）才能在 OHOS musl ldso 上运行"
  - "Cargo 需要独立的 CARGO_HOME 以避免与其他并行构建的文件锁冲突"
  - "viu 1.6.1 可直接 cargo build --release 编译，无需源码修改"