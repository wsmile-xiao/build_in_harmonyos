# conandata.yml — vibecheck 1.7.7
# Single source of truth for the upstream source tarball URL + SHA256 + patches.
# conanfile.py reads this via self.conan_data["sources"] and
# self.conan_data["go_toolchain"].

sources:
  # Official upstream GitHub release tarball for tag v1.7.7.
  # Ordered list: gh-proxy mirror first (spec rule 3.18b), official URL last.
  url:
    - "https://gh-proxy.com/https://github.com/rshdhere/vibecheck/archive/refs/tags/v1.7.7.tar.gz"
    - "https://github.com/rshdhere/vibecheck/archive/refs/tags/v1.7.7.tar.gz"
  sha256: "8fef335a930a1c752465e871125d269a72df4f39b6cec65ca6531383faba4f9c"

# Go toolchain used to build + run upstream tests when the device has no go
# (or only an old go such as go1.21).  ali/mirrors sha256 are the official
# go.dev distribution hashes, verified in this repo (alloy/1.17.1 +
# algernon/1.17.10 precedent).  go >= 1.24 satisfies vibecheck's go.mod
# `go 1.24.11` directive.
go_toolchain:
  version: "1.26.5"
  linux-amd64:
    url: "https://mirrors.aliyun.com/golang/go1.26.5.linux-amd64.tar.gz"
    sha256: "5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053"
    filename: "go1.26.5.linux-amd64.tar.gz"
  linux-arm64:
    url: "https://mirrors.aliyun.com/golang/go1.26.5.linux-arm64.tar.gz"
    sha256: "fe4789e92b1f33358680864bbe8704289e7bb5fc207d80623c308935bd696d49"
    filename: "go1.26.5.linux-arm64.tar.gz"

# No patches are required — vibecheck is a pure-Go CLI built with the Go
# toolchain; no source-level portability patches are needed on HarmonyOS.
patches: []
