  - "源码镜像：conandata url 有序列表 gh-proxy.com 前缀镜像置前，官方 GitHub 置后（规则 3.18b）"
  - "Go 工具链 conandata.go_toolchain：linux-arm64 用 aliyun go1.26.5（sha256 fe4789e9...，与 alloy/1.17.1 一致，官方 go.dev 哈希）"
  - "GOPROXY=https://mirrors.aliyun.com/goproxy/,https://goproxy.cn,https://goproxy.io,https://proxy.golang.org,direct 用于模块下载（aliyun goproxy 居首，因真机已证可达 mirrors.aliyun.com；多代理回退）"
  - "OHOS /tmp 只读，GOCACHE/GOMODCACHE/TMPDIR 指向 go work root（/data/storage/el2/base/cache 下 conan-go-build/vibecheck-1.7.7）"
