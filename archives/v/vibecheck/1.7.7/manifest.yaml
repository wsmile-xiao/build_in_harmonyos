software: vibecheck
# 版本级 manifest —— vibecheck 1.7.7
# 遵循 ARCHIVE-SPEC v2.0

version: "1.7.7"

# 编译状态（published | built | failed | archived）
# 当前为已写入配方的初始工作树状态，等待 hmbs 真机预检确认。
# hmbs 预检 conan-create 沙盒只注入 cmake/make/ninja/python3，不注入 Go；若
# 真机无 go（或仅有 go1.21），配方自动从 aliyun Go 镜像 bootstrap 一个
# go >= 1.24 工具链（sha256 校验 + ELF 签名，algernon/alloy 先例），再真实
# 运行上游 `go test -v ./...`，因此上游 115 个 Test* 会真正执行。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"

# 构建系统类型
build_system: go

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方上游 GitHub release tarball
  url: "https://github.com/rshdhere/vibecheck/archive/refs/tags/v1.7.7.tar.gz"
  sha256: "8fef335a930a1c752465e871125d269a72df4f39b6cec65ca6531383faba4f9c"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（cmake|autotools|makefile|meson|cargo|custom|go）
  system: go

  # 配置选项列表
  configure_options:
    - "build_system=go"
    - "CGO_ENABLED=0"
    - "GOFLAGS=-mod=mod"
    - "GOPROXY=https://mirrors.aliyun.com/goproxy/,https://goproxy.cn,https://goproxy.io,https://proxy.golang.org,direct"

  # 编译依赖列表（格式: name/version）—— Go 模块依赖由 go mod 管理，无 conan 依赖
  dependencies: []

  # 编译器（Go 工具链，非 clang）
  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 上游测试审计（守则「上游测试套件执行」）
# ============================================================

upstream_tests_exist: true
upstream_tests_executable: true
upstream_test_total: 115
upstream_test_count_method: go_test_functions
upstream_test_audit: |
  vibecheck 1.7.7 是纯 Go CLI（go.mod 要求 go >= 1.24.11）。上游官方测试经
  `go test -v ./...` 运行，源码审计确认共 115 个顶层 Test* 函数，分布 23 包
  （23 个 *_test.go）。统计口径 = go test 函数计数（**全模块 Test* 出现次数**，
  非去重函数名）：`go test -v ./...` 对每个顶层 `TestXxx` 各打印一行
  `--- PASS/FAIL/SKIP: TestXxx`。注意不同包可出现同名 Test*（如
  internal/config 与 internal/keys 都有 TestLoad/TestSave/TestLoadWithInvalidJSON），
  因此 115 不是去重后的 67。逐包核点：
    main_test.go(2) cmd/(2+2+3+4=11) internal/config(7)
    internal/git(1+5=6，其中 TestCommitWMessage 上游 t.Skip)
    internal/keys(9) internal/llm/(provider_test 4 + 各 provider client 52)
    internal/stats(11) internal/ui/banner(1) internal/ui/notify(6)
  合计 115。其中 TestCommitWMessage（internal/git/commit_test.go）由上游源码
  显式 t.Skip（git commit -em 需交互式编辑器输入，不适合自动化测试），属
  框架级 skip（非本配方遮蔽）：平台无关的上游主动跳过，由标记 skipped 字段
  如实承载（passed 114 + skipped 1 = discovered 115、failed 0）。因它计入官方
  go-test 总数却未跑到 PASS 判定，suite 非 100%，按 rule4 在 gaps 补 1 条
  category=ohos_feature 缺口（libm2k 处理上游 self-skip 先例），status 标
  incomplete（不得 passed，轮次 7/13；不得 environment_gap，轮次 12；详见
  notes.md 轮次 13）。其余 114 个为实质测试。

  上游测试在 hmbs 预检沙盒中真实执行：配方先探测设备 go（PATH / HNP_GO /
  HNP_GOROOT / find），若缺失或旧于 1.24（如设备仅 go1.21.13），自动从
  aliyun Go 镜像 bootstrap go1.26.5（sha256 核对官方 go.dev 哈希，ELF 全部
  签名，见 algernon/1.17.10 + alloy/1.17.1 先例）。build() 内先 `go mod
  download` 预取全模块（含 test-only 依赖如 testify），GOPROXY **以 aliyun
  goproxy 居首**（mirrors.aliyun.com 是真机已证可达的主机，go 工具链即自其
  bootstrap）并带多代理回退 + 重试，再运行 `go test -v ./...` 完成 115 个用例。
  test_package/ 另以 C 等效实现覆盖 5 个核心纯逻辑 Test*（isVersionOrHelp /
  maskKey / getKeysPath / provider→env / banner），产出 HMBS_TEST_PACKAGE_RESULT。

  test_result 的 115 个上游用例与 C 等效用例的真实通过/未运行计数，一律以真机
  预检日志为准，本 manifest 不预填、不猜测。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Go binary CLI 构建系统：go build -o vibecheck .（无 configure 步骤），go.mod 要求 go >= 1.24.11"
  - "上游测试为 `go test -v ./...`：115 个顶层 Test* 函数（全模块出现次数，统计口径为 go test 函数计数；非去重函数名 67）"
  - "Go 静态链接：CGO_ENABLED=0 生成静态二进制，无需 RPATH"
  - "hmbs 预检 conan-create 沙盒只注入 cmake/make/ninja/python3，不注入 go（与 Rust 同理，见 acme-redirect/signal-tlsd 先例）"
  - "Go 工具链不部署或过旧时 bootstrap：从 aliyun Go 镜像下载 go1.26.5（sha256 核对官方 go.dev 哈希），对 go/bin 与 go/pkg/tool 下全部 ELF 用 binary-sign-tool 签名（algernon/alloy 先例）"
  - "OHOS 下运行 go test：用 -exec 包装器对每个测试二进制先签名再执行，否则 OHOS 执行策略 EACCES"

notes:
