# 软件级 manifest —— vibecheck
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: vibecheck

# 显示名
display: "vibecheck"

# 一句话描述
description: "跨平台命令行 AI 工具，通过 LLM 自动生成 git commit message"

# 分类标签（utility）
category: utility

# 官网 URL
homepage: "https://github.com/rshdhere/vibecheck"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: go

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "纯 Go CLI，go.mod 要求 go >= 1.24.11，用 go build + CGO_ENABLED=0 静态构建"
    - "hmbs 预检 conan-create 沙盒只注入 cmake/make/ninja/python3，不注入 go——设备无 go 或过旧时自动从 aliyun Go 镜像 bootstrap go >= 1.24 工具链并 ELF 签名（algernon/alloy 先例），再真实运行上游 go test"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.7.7":
    status: built
    build_date: "2026-09-19"
    conan_ref: "vibecheck/1.7.7"
