# test_package/MANIFEST.yml
# 上游官方测试声明 (R51 上游测试三步法：清点 → 运行 → 如实申报)

package: verstable/2.2.1
homepage: "https://github.com/JacksonAllan/Verstable"

# 上游无构建系统（单头文件库），无 make check / ctest / meson 注册入口。
# 上游自带两个独立测试源，均于 2026-09-19 本地 clang 编译并实际运行通过。
upstream_check_command: "clang -std=c11 -O2 -I. tests/unit_tests.c && ./unit_tests"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（2 个独立入口：C 通用 API 单测 + C++ STL 对照测试）
upstream_tests:
  - file: tests/unit_tests.c
    source: verstable-2.2.1/tests/unit_tests.c
    description: "C11 generic API 单元测试：30 个 map/set 用例（reserve/shrink/insert/get_or_insert/get/erase/erase_itr/clear/cleanup/init_clone/iteration/dtors/strings/const_strings/with_ctx）x1000 轮随机分配失败注入"
    command: "./unit_tests"
  - file: tests/tests_against_stl.cpp
    source: verstable-2.2.1/tests/tests_against_stl.cpp
    description: "C++ 对照测试：与 std::unordered_map/set 随机操作 5 轮 x 50000 次比对（分配失败注入）"
    command: "./tests_against_stl"

# test_package 自带消费者测试（R34：真实调用公开 API 并有可观察结果）
test_package_tests:
  - file: test.c
    description: "消费者视角：仅用安装头文件 verstable.h 与公开 C11 通用 API 实例化 set，插入/擦除/检索/迭代并断言可观察结果"
    command: "./test_verstable"

# 断言总数（上游 C 单测 ALWAYS_ASSERT 宏计数 + C++ ALWAYS_ASSERT 计数，近似）
assertion_count: 35