# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.1"

# 软件名
software: "value-ptr-lite"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 upstream tag）
  url: "https://github.com/nonstd-lite/value-ptr-lite/archive/refs/tags/v0.2.1.tar.gz"

  # 源码校验和（官方 tarball SHA-256，已独立复算一致）
  sha256: "683a6d98512249c4899d70ee1c3005843e1b05988c51f332fc0ad23cff9585f0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DVALUE_PTR_LITE_OPT_BUILD_TESTS=OFF"
  - "-DVALUE_PTR_LITE_OPT_BUILD_EXAMPLES=OFF"

  # 编译依赖列表（格式: name/version）— header-only，无编译依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表 — 无补丁，上游源码原生构建
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "value-ptr-lite 为 single-file header-only 库（nonstd-lite 家族），Conan package_type 应为 header-library，无需链接库文件"
- "上游 CMake 已提供 install() 导出 nonstd::value-ptr-lite target 与 value-ptr-lite-config.cmake，配方 package() 直接复用 cmake.install()"
- "上游测试使用 lest 单头文件框架（lest_cpp03.hpp），用例以 CASE 宏定义，共 51 个独立可运行用例 + 6 个隐藏诊断用例，OHOS 工具链下全量通过"