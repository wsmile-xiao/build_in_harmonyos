# test_package/MANIFEST.yml
# value-ptr-lite 0.2.1 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: value-ptr-lite/0.2.1
homepage: "https://github.com/nonstd-lite/value-ptr-lite"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -DVALUE_PTR_LITE_OPT_BUILD_TESTS=ON && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (lest 框架，单头文件框架 + 用户用例)
# 上游用例：test/value_ptr.t.cpp 52 个 CASE（含 1 个 [.applet] 空占位）、
# test/value_ptr-main.t.cpp 6 个隐藏诊断 CASE；框架头 lest_cpp03.hpp 非独立用例。
upstream_tests:
  - file: value_ptr.t.cpp
    source: value-ptr-lite-0.2.1/test/value_ptr.t.cpp
    description: "上游用户测试源（lest CASE，51 个独立可运行用例 + 1 个 [.applet] 空占位）"
    command: "./value-ptr-lite-cpp17.t --pass"
  - file: value_ptr-main.t.cpp
    source: value-ptr-lite-0.2.1/test/value_ptr-main.t.cpp
    description: "上游 main 入口 + 6 个隐藏诊断 CASE（[.value-ptr][.version] 等）"
    command: "./value-ptr-lite-cpp17.t --pass \"*\""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：真实调用 value_ptr 构造/复制/访问/比较 API"
    command: "./test_value-ptr-lite"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 51
