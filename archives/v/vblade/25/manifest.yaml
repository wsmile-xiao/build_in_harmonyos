knowledge_gained:
  - "vblade 上游 makefile 硬编码 CC = gcc，OHOS 构建必须以 make 命令行 CC=<clang> 覆盖（含 config.h 探测 config/u64.c）。knowledge_ref: general-makefile-cc-override"
