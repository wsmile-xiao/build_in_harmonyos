software: vblade
display: "vblade"
description: "Minimal userland ATA over Ethernet (AoE) storage target"
category: system
homepage: "https://github.com/OpenAoE/vblade"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 makefile 硬编码 CC = gcc，需以 make CC=<clang> 命令行覆盖"
    - "无 configure、无测试套件；test_package 以二进制冒烟测试验证"
    - "运行时需 raw packet socket (PF_PACKET/SOCK_RAW) 与块设备访问，属特权操作"
  common_dependencies: []

versions:
  "25":
    status: built
    build_date: "2026-10-03"
    conan_ref: "vblade/25"
    source_url: "https://github.com/OpenAoE/vblade/archive/vblade-25.tar.gz"
    build_system: makefile
    notes:
      - "无可移植性补丁（零补丁构建）"
      - "上游无自动化测试（no_tests 已审计），消费者冒烟测试 4 项"
