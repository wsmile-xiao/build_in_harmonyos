# test_package/MANIFEST.yml — vo-amrwbenc 0.1.3
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: vo-amrwbenc/0.1.3
homepage: "https://opencore-amr.sourceforge.net/"

# 上游测试命令：上游 Makefile.am 无 TESTS/check 目标（R51 清点证据：
# Makefile.am 仅含 lib_LTLIBRARIES、头文件与 pkgconfig 安装，无任何测试注册）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无自动化测试（如实记录为 0）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package/test.c
    description: "消费者程序：链接 libvo-amrwbenc，经公开 API E_IF_init/E_IF_encode/E_IF_exit 编码两帧 AMR-WB（mode 8=23.85kbps），断言 RFC 3267 帧大小恰为 61 字节且载荷非全零（1 个消费者程序，3 处断言）"
    command: "conan test test_package vo-amrwbenc/0.1.3"

# Approximate assertion count
assertion_count: 3
