# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: vtzero/1.2.0
homepage: "https://github.com/mapbox/vtzero"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
# vtzero 上游测试 (test/) 依赖 catch 框架 + mvt-fixtures 子模块 +
# protozero 头文件; 本配方为 header-only 安装, 不在构建中运行上游全套测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# r02 (2026-08-29, pc1-42): 在专用 worktree 内通过 Conan 依赖 protozero 完成
# W3 本地闭包后, 于上游源码构建目录实际运行 ctest 与 unit-tests, 结果:
#   - ctest 全套: 12/12 Passed (含 vtzero-filter/vtzero-show/ext-tests/unit-tests)
#   - unit-tests: 186 test cases / 1297 assertions, 全部通过 (exit 0)
#   - fixture-tests: 需 FIXTURES_DIR 指向 mvt-fixtures 子模块(未随 release 归档), 未直接运行
upstream_tests:
  - file: t/test_vector_tile.cpp
    source: vtzero-1.2.0/test/t/test_vector_tile.cpp
    description: "vector_tile 解码/编码往返测试"
    command: "ctest -R vector_tile"
  - file: t/test_builder.cpp
    source: vtzero-1.2.0/test/t/test_builder.cpp
    description: "tile/layer/feature builder 测试"
    command: "ctest -R builder"
  - file: test_main.cpp
    source: vtzero-1.2.0/test/test_main.cpp
    description: "catch 主测试入口; 实际运行 186 用例/1297 断言全通过"
    command: "ctest --output-on-failure; unit-tests -r compact"
    result: "ctest 12/12 PASSED; unit-tests 186/186 PASSED (1297 assertions)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_vtzero.cpp
    description: "vtzero encode/decode 往返: 构建一层 roads + 一个 point feature，序列化后解码验证图层名"
    command: "./test_vtzero"

# 测试断言总数
assertion_count: 3