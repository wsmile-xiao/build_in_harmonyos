package: volpack/1.0b3
homepage: "https://graphics.stanford.edu/software/volpack/"
upstream_check_command: "make check (no executable tests)"
upstream_test_in_build: true
upstream_test_command: "make check; sh test_ohos/run_ohos_test.sh"
upstream_tests:
  - file: examples/test.csh
    source: volpack-1.0b3/examples/test.csh
    description: "Raw, octree, classified, and classified-octree rendering against upstream check.ppm"
    command: "sh test_ohos/run_ohos_test.sh"
test_package_tests:
  - file: test.c
    description: "Create a context, set 3D volume dimensions, and retrieve all three values"
    command: "./test_volpack"
assertion_count: 9
