description: "Stanford software volume-rendering library"
category: library
homepage: "https://graphics.stanford.edu/software/volpack/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "Use the Debian authoritative gzip repack: the official .tar.Z needs unavailable LZW uncompress support on OHOS."
    - "Update 2007 GNU config scripts for native aarch64-unknown-linux-ohos."
    - "Run all four upstream rendering modes and compare each image with check.ppm."
