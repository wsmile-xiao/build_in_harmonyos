version: "5.4.11"
software: "vectorscan"
status: built
build_date: "2026-09-10"
build_system: cmake

source:
  url: "https://github.com/VectorCamp/vectorscan/archive/refs/tags/vectorscan/5.4.11.tar.gz"
  sha256: "905f76ad1fa9e4ae0eb28232cac98afdb96c479666202c5a4c27871fb30a2711"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_STATIC_LIBS=ON"
    - "BUILD_SHARED_LIBS=OFF"
    - "RELEASE_BUILD=ON"
    - "FAT_RUNTIME=OFF"
    - "BUILD_CHIMERA=OFF"
    - "BUILD_SVE=OFF"
    - "BUILD_SVE2=OFF"
    - "BUILD_SVE2_BITPERM=OFF"
    - "BUILD_UNIT_TESTS=OFF"
    - "CMAKE_POLICY_DEFAULT_CMP0167=OLD"
  dependencies:
    - "boost/1.84.0"
    - "pcre/8.45 (optional when with_chimera=TRUE)"
  build_tools:
    - "ragel 6.10 (pinned source bootstrap)"
    - "pkg-config 0.29.2 (device tool)"
  cc: clang
  cxx: clang++

patches_applied:
  - "5.4.11-0001-fix-cmake.patch"

upstream_tests:
  command: "bin/unit-hyperscan && bin/unit-internal"
  execution_scope: "default with_chimera=False / BUILD_CHIMERA=OFF"
  test_count: 17268
  executed_count: 17018
  passed: 17018
  failed: 0
  skipped: 0
  not_run: 250
  notes: "默认配置设备原生实测：unit-hyperscan 2978/2978、unit-internal 14040/14040；上游条件目标 unit-chimera 源码展开 250 个测试，因 with_chimera=False 本轮未运行；无 SKIPPED 汇总行。"

test_package:
  scenario_count: 1
  assertion_count: 5
  description: "一个安装后 hs C API consumer 场景：编译 foo、分配 scratch、扫描 foo，并校验 5 个断言（含一次回调及结束位置）。"

knowledge_gained:
  - "5.4.11 官方源码使用 CMake，CMake 4.x 需要将 CMP0167 设为 OLD 才能继续使用旧式 Boost 探测。"
  - "Ragel 6.10 是源码构建期工具；设备没有可用的 ragel Conan 包，因此从固定 SHA256 的上游归档构建私有工具前缀。"
  - "设备现有 pkg-config 0.29.2 满足 CMake 的 PkgConfig 探测，不再引入不可解析的 pkgconf Conan 工具包。"
  - "OHOS 原生 CMake 构建通过 BOOST_SP_NO_PTHREAD_SETCANCELSTATE 跳过 Boost 1.84 不可用的 pthread_setcancelstate；Conan boost_headers 组件沿用同一特性宏，CMake target 名为 Boost::headers。"
  - "上游 unit 测试通过 BUILD_UNIT_TESTS 显式开启；Conan 包构建保持 OFF，避免把测试可执行文件纳入库包。"
  - "设备 HMDFS 不允许 GNU make jobserver FIFO；OHOS Conan 构建固定使用 -j1，避免生成文件和依赖文件在并行构建中丢失。"
  - "Ragel bootstrap 的 configure 保留 profile Bash，递归 make 显式使用 /bin/sh；设备实测可避免 Bash 在 HMDFS 中的 getcwd/.deps 文件错误。"
  - "设备 Boost 1.84 的 Conan CMake 目标为 boost::boost；boost::headers 组件不存在，hs 组件依赖已按设备生成器输出修正。"
  - "libhs 对外提供 C API 但静态实现包含 C++；Conan CMakeDeps 通过 hs.languages=C++ 让 C 语言消费者使用 C++ linker，并在 OHOS 通过 hs.system_libs 透传 libc++ 兼容传统 C linker；test_package 保留 C 源码并显式验证该链接契约。"
