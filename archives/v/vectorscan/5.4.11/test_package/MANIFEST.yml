package: vectorscan/5.4.11
homepage: "https://github.com/VectorCamp/vectorscan"

upstream_check_command: "bin/unit-hyperscan && bin/unit-internal"
upstream_test_in_build: false
upstream_test_command: "bin/unit-hyperscan && bin/unit-internal"

upstream_tests:
  - file: unit/CMakeLists.txt
    source: vectorscan-5.4.11/unit/CMakeLists.txt
    description: "Default-profile upstream GoogleTest targets: unit-hyperscan and unit-internal (with_chimera=False)"
    command: "bin/unit-hyperscan && bin/unit-internal"

excluded_upstream_tests:
  - file: unit/chimera
    source: vectorscan-5.4.11/unit/chimera/*.cpp
    description: "Conditional unit-chimera suite: 250 parameter-expanded GoogleTest cases"
    count: 250
    status: not_run
    reason: "Requires with_chimera=True / BUILD_CHIMERA=ON and pcre/8.45; this package validation ran the default with_chimera=False profile."

test_package_tests:
  - file: test_vectorscan.c
    description: "One consumer scenario: compiles a public pattern, allocates scratch, scans input, and performs 5 assertions"
    command: "./test_vectorscan"

consumer_scenario_count: 1
assertion_count: 5
