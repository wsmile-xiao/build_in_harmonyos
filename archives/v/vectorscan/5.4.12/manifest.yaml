software: vectorscan
# 版本级 manifest
# 文件位置: archives/v/vectorscan/5.4.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.4.12"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（G4门禁必填）
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/VectorCamp/vectorscan/archive/refs/tags/vectorscan/5.4.12.tar.gz"

  # 源码校验和
  sha256: "1ac4f3c038ac163973f107ac4423a6b246b181ffd97fdd371696b2517ec9b3ed"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_DEFAULT_CMP0167=OLD"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_STATIC_LIBS=ON"
    - "-DRELEASE_BUILD=ON"
    - "-DFAT_RUNTIME=OFF"
    - "-DBUILD_SVE=OFF"
    - "-DBUILD_SVE2=OFF"
    - "-DBUILD_SVE2_BITPERM=OFF"

  # 编译依赖列表
  dependencies:
    - boost/1.84.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（源码无修改，仅修补已安装的boost头文件）
patches_applied: []

# 源码外的修补说明
external_patches:
  - target: "boost/core/detail/sp_thread_sleep.hpp"
    description: "HarmonyOS musl不提供pthread_setcancelstate，添加!defined(__OHOS__)排除条件"
    location: "/storage/Users/currentUser/usr/local/include/boost/core/detail/sp_thread_sleep.hpp"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cmake 4.1.2 CMP0167策略默认弃用FindBoost模块，需设置CMAKE_POLICY_DEFAULT_CMP0167=OLD" ref:E-cmake-cmp0167
  - "HarmonyOS缺少pthread_setcancelstate，boost sp_thread_sleep.hpp需排除__OHOS__" ref:E-boost-ohos-pthread-cancel
  - "cmake不识别HarmonyOS系统（System is unknown），但不影响编译" ref:E-cmake-ohos-unknown
  - "aarch64平台NEON自动可用，SVE/SVE2需显式启用" ref:E-vectorscan-arm-neon