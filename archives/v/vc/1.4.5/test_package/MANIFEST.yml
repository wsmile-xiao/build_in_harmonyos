# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: vc/1.4.5
homepage: "https://github.com/VcDevel/Vc"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-tests"

upstream_tests:
  - name: tests/（unittest 框架——31 个 ctest 用例，CMake BUILD_TESTING=ON 构建）
    count: "31"
    description: "上游测试实测（rule 4，分母=全部 31 用例）：29 passed / 2 failed / 0 skipped（93.5%）——两轮提升后从 3 失败降到 2；剩余失败为环境/实现差异：trigonometric_scalar 的 atan(+inf) float 精度（OHOS libm 返回 1.570796251 vs 参考 1.570796371，非 Apple 平台上游用严格比较）、alignedbase 的 MemoryAligned alignof(4) vs MemoryAlignment(1)（标量实现下 SIMD 对齐假设不成立）"

test_package_tests:
  - file: test_vc.py
    description: "R34：头文件存在 + 编译运行使用 Vc 类型的 smoke（Vc::int_v 加法）"
    command: "python3 test_vc.py <package>"

assertion_count: 2
