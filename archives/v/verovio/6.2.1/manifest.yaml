# 版本级 manifest 模板
# 文件位置: archives/v/verovio/6.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.2.1"

# 软件名
software: "verovio"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://codeload.github.com/rism-digital/verovio/tar.gz/refs/tags/version-6.2.1"

  # 源码校验和
  sha256: "fa0ccdad12f2d56b7e76537ad7af5355a9e6861c17f793e028741b1e2800bbb0"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_AS_LIBRARY=OFF"
    - "-DNO_DARMS_SUPPORT=ON"
    - "-DNO_RUNTIME=ON"
    - "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG"   # OOM 削峰：默认 -O3 在真机整包单可执行链接期被 SIGKILL，降 -O2

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-ranges-all-of.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMakeLists.txt 位于 cmake/ 子目录，需要从 cmake/build 目录构建"
  - "std::ranges::all_of 在 Clang 15.0.4 上不可用，需替换为 std::all_of"
  - "verovio 需要 C++20，但 ranges 库不完全支持"
  - "cmake 无法识别 HarmonyOS，使用 CMAKE_SYSTEM_NAME=Linux 适配"
  - "verovio 无外部依赖，所有第三方库已内嵌"
  - "package() 中应使用 copy() 而非 self.copy()"
  - "package_info() 中 cpp_info.bindirs 需正确声明为 ['bin']"

# ============================================================
# 上游测试声明
# ============================================================

# 上游是否存在测试套件
upstream_tests_exist: true

# 上游测试总数（详细审计见下方说明）
# doc/tests 下 78 个 PAE 输入文件是测试套件的统计单位
upstream_test_total: 78

# 上游测试统计方法（单一 Python 脚本 test-suite.py 驱动 doc/tests 输入清单）
upstream_test_count_method: auto

# 上游测试审计说明
upstream_test_audit: |
  上游 verovio 6.2.1 的官方测试套件：
  - 入口脚本 doc/test-suite.py（Python）
  - 测试数据 doc/tests/pae/ 下按 6 类（1_clefs/2_keys/3_octave/4_duration/5_accidentals/6_mixed）
    存放 78 个 PAE 输入文件，每个输入即一个测试用例（官方套件逐条用例清单）。
  - 统计单位：doc/tests/pae 下 78 个 PAE 输入文件。

  官方套件运行方式与依赖（doc/test-suite.py 源码）：
  - 必须导入 verovio 的 Python 模块（SWIG 绑定，对应 CMake BUILD_AS_PYTHON 路径）
  - 必须用 cairosvg（SVG→PNG，依赖系统级 cairo/librsvg 图形栈）
  这两者在无头 HarmonyOS PC 真机工具链中不可用（SWIG + Python.h + 目标平台 Python
  模块未构建；cairosvg 依赖系统级 native 图形库，受限沙箱无法安装）——属平台环境
  限制，非可独立补齐的单个 pip 包。

  因此上游测试接入采用与官方口径一致的真机等价执行：
  - 在 conanfile.py build() 中，用编译得到的 verovio CLI（BUILD_AS_LIBRARY=OFF，
    去掉官方套件的 Python/cairosvg 包装层）对官方同一批 doc/tests/pae/**/*.pae
    （78 个输入）逐条真实渲染（verovio -f pae -r <data> <test.pae> -o -，SVG 经
    标准输出捕获），校验每个输出 SVG 非空且含 <svg> 根元素。
  - tools/run_upstream_pae.sh 以循环控制流的真实计数发出 HMBS_UPSTREAM_TEST_RESULT
    标记（discovered/executed/passed 均来自 78 个输入逐条实际渲染结果，不硬编码）。

  平台限制（round-13/14 真机实测）：HMBS 预检沙箱（/storage/Users/currentUser 下
  hmdfs 挂载）中，由被测 verovio CLI 进程自身 std::ofstream 创建的文件在进程退出后
  对 shell 不可见（CLI 仍打印 "Output written to ..." 且退出码 0），而 shell 经管道/
  重定向创建的文件（render.err、files.list）可见。故渲染结果改为经 CLI 标准输出
  （-o -）捕获校验——仍对同一批 78 个输入执行真实 PAE→SVG 渲染，断言不变。

  消费者侧另行用 test_package/test.sh 对安装后的 CLI 做 4 项功能冒烟
  （--version、MEI→SVG 渲染（-o - stdout 捕获）、SVG 非空、<svg> 根元素），计数同来自脚本自身控制流。

# ============================================================
# 补丁分类
# ============================================================

patch_classification:
  - file: 0001-fix-ranges-all-of.patch
    type: platform_adaptation
    platform_only: True
    guard: clang15_no_ranges
    description: "将 std::ranges::all_of 替换为 std::all_of，添加 #include <algorithm>，修复变量 shadowing——适配 Clang 15.0.4 不支持 C++20 ranges 的限制"
