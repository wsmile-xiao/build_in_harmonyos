sources:
  # Official GitHub codeload URL. The tag is "version-6.2.1" (not "v6.2.1").
  # Conan get() by default infers filename from URL path end; since the path
  # ends with bare tag name, we pass explicit filename to force tar.gz decoder.
  url:
    - "https://codeload.github.com/rism-digital/verovio/tar.gz/refs/tags/version-6.2.1"
  sha256: "fa0ccdad12f2d56b7e76537ad7af5355a9e6861c17f793e028741b1e2800bbb0"

patches:
  - patch_file: "patches/0001-fix-ranges-all-of.patch"
    patch_description: "Replace std::ranges::all_of with std::all_of for Clang 15 compatibility"
    patch_type: "portability"
