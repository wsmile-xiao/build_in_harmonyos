software: verovio
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.1.1"

status: published

build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/rism-digital/verovio/archive/refs/tags/version-6.1.1.tar.gz"
  sha256: "4ac970d31d984f397d40cd8ed35ff1731b694594d93e323f98584135df256560"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  build_system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
    - "-DCMAKE_C_FLAGS=-fPIC -O2"
    - "-DCMAKE_CXX_FLAGS=-fPIC -O2 -std=c++20"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-.patch-ai-review.txt.patch"
  - "0002-src-resources.cpp.patch"
  - "0003-.tarball-sha256.patch"
  - "0004-include-vrv-git_commit.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMakeLists.txt 位于 cmake/ 子目录，需要从 cmake/build 目录构建"
  - "std::ranges::all_of 在 Clang 15.0.4 上不可用，需替换为 std::all_of"
  - "verovio 需要 C++20，但 ranges 库不完全支持"
  - "lld 链接器依赖 libxml2.so.16，需要使用 SDK 中签名版本"

patch_classification:
  - file: 0001-.patch-ai-review.txt.patch
    type: build_metadata
    platform_only: False
    guard: none
    description: "补丁审查追踪文件（AI 分类标注结果）"
  - file: 0002-src-resources.cpp.patch
    type: platform_adaptation
    platform_only: True
    guard: clang15_no_ranges
    description: "将 std::ranges::all_of 替换为 std::all_of，添加 #include <algorithm>，修复变量 shadowing——适配 Clang 15.0.4 不支持 C++20 ranges 的限制"
  - file: 0003-.tarball-sha256.patch
    type: build_metadata
    platform_only: False
    guard: none
    description: "构建过程中生成的源码包校验和跟踪文件"
  - file: 0004-include-vrv-git_commit.h.patch
    type: build_metadata
    platform_only: False
    guard: none
    description: "cmake 构建过程中自动生成的 git commit 版本头文件"
