# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "0.74.2"
software: "vte"
status: published
build_date: "2026-09-03"
build_system: meson

source:
  url: "https://download.gnome.org/sources/vte/0.74/vte-0.74.2.tar.xz"
  sha256: "a535fb2a98fea8a2449cd1a02cccf5190131dddff52e715afdace3feb536eae7"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dgtk4=false"
    - "-Dicu=false"
    - "-D_systemd=false"
    - "-Dgir=false"
    - "-Dvapi=false"
    - "-Dglade=false"
    - "-Dgnutls=false"
    - "-Dfribidi=false"
    - "-Da11y=false"
    - "-Dwrap_mode=nodownload"
    - "-Db_ndebug=false"
  dependencies:
    - "cairo/1.18.4"
    - "pango/1.50.14.1.1"
    - "glib/2.84.0.1"
    - "pcre2/10.45"
    - "zlib/1.3.1.1"
    - "gtk/3.24.43"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "vte 0.74.2 uses meson build system (not autotools)"
  - "GNOME tarball does not include tests/ directory; tests are inline in src/meson.build"
  - "Optional deps icu/libsystemd not in ohpcd → disabled via meson options"
  - "Produces libvte-2.91.so (shared library) and vte-2.91 binary (terminal app)"
  - "W_EXITCODE not provided by musl libc → patch defines it via meson-level check"
  - "Conan PkgConfigDeps does not emit glib tool variables (glib_compile_resources, glib_mkenums, glib_genmarshal) → injected in generate()"
  - "glib-2.0.pc missing -lintl → patched in generate() to fix undefined symbol g_libintl_bindtextdomain"
  - "pcre2 .pc generated as pcre2.pc but vte meson looks for libpcre2-8 → alias .pc created"
