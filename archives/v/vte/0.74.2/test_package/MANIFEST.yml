# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: vte/0.74.2
homepage: "https://gitlab.gnome.org/GNOME/vte"

# 上游测试命令 (meson build system)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序 (inline in src/meson.build)
upstream_tests:
  - file: src/modes-test.cc
    source: vte-0.74.2/src/modes-test.cc
    description: "Test terminal mode handling (DEC/ECMA modes)"
    command: "test-modes"
  - file: src/parser-test.cc
    source: vte-0.74.2/src/parser-test.cc
    description: "Test escape sequence parser"
    command: "test-parser"
  - file: src/pastify-test.cc
    source: vte-0.74.2/src/pastify-test.cc
    description: "Test paste handling (bracketed paste, etc.)"
    command: "test-pastify"
  - file: src/reaper.cc
    source: vte-0.74.2/src/reaper.cc
    description: "Test child process reaper"
    command: "test-reaper"
  - file: src/refptr-test.cc
    source: vte-0.74.2/src/refptr-test.cc
    description: "Test reference-counted pointer"
    command: "test-refptr"
  - file: src/vtestream.cc
    source: vte-0.74.2/src/vtestream.cc
    description: "Test streaming ring buffer"
    command: "test-stream"
  - file: src/tabstops-test.cc
    source: vte-0.74.2/src/tabstops-test.cc
    description: "Test tab stop handling"
    command: "test-tabstops"
  - file: src/utf8-test.cc
    source: vte-0.74.2/src/utf8-test.cc
    description: "Test UTF-8 encoding/decoding"
    command: "test-utf8"
  - file: src/vtetypes.cc
    source: vte-0.74.2/src/vtetypes.cc
    description: "Test VTE cell/char types (gtk3 only)"
    command: "test-vtetypes"
  - file: src/check-doc-syntax.sh
    source: vte-0.74.2/src/check-doc-syntax.sh
    description: "Check documentation syntax"
    command: "check-doc-syntax.sh"
  - file: src/test-vte-urlencode-cwd.sh
    source: vte-0.74.2/src/test-vte-urlencode-cwd.sh
    description: "Test URL-encoding of current working directory"
    command: "test-vte-urlencode-cwd.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 smoke 测试: vte_terminal_new() + vte_terminal_spawn_sync() 实质调用 vte API"
    command: "./test_vte"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
