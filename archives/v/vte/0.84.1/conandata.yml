# conandata.yml - vte 0.84.1
# Upstream official source (GNOME download server).

sources:
  url: "https://download.gnome.org/sources/vte/0.84/vte-0.84.1.tar.xz"
  sha256: "aca1caa8478aebcdbb1d67897fb3511eb7601debae6810e16a15b6fa25f31ac8"
patches:
  - patch_file: "patches/0001-clang15-gnuxx2b-alias.patch"
    patch_description: "OHOS SDK clang 15 only accepts -std=gnu++2b (C++23 provisional alias); same standard, different spelling"
  - patch_file: "patches/0002-clang15-typename-dependent-type.patch"
    patch_description: "clang 15 requires explicit typename for dependent type names (P0634 implicit typename completed in clang 16); parser-glue.hh three occurrences"
  - patch_file: "patches/0003-clang15-out-ptr-fallback.patch"
    patch_description: "std::out_ptr is C++23 library feature (P1132) not in OHOS clang 15 libc++; replace with raw pointer + reset() in widget.cc im_preedit_changed (vte.cc:7921 use is inside #if VTE_GTK==3 block, not compiled with gtk3=false)"
  - patch_file: "patches/0004-clang15-make-unique-for-overwrite-fallback.patch"
    patch_description: "std::make_unique_for_overwrite is C++20 P0980 not in OHOS clang 15 libc++; single use in fmt-glue.cc:34, buffer fully overwritten by simdutf conversion so make_unique is equivalent"
