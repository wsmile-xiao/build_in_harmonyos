knowledge_gained:
  - "vte 0.84.1 is the gtk4 flavour (libvte-2.91-gtk4.so, pkg-config vte-2.91-gtk4) — the version-follow of 0.74.2 (gtk3 flavour, different soname)."
  - "0.84.1 dependency delta: +liblz4 (scrollback compression, needs liblz4.pc alias from lz4.pc), +simdutf (>=6.2.0, vendored 8.2.0 subproject in the release tarball with its own meson.build — no network needed), +fmt (header-only via system dep first, allow_fallback: false)."
  - "The simdutf wrap is wrap-git but the release tarball pre-populates subprojects/simdutf/ with the full source; meson's subproject fallback uses the vendored tree — wrap_mode=nodownload still works."
  - "clang 15 (OHOS SDK) compat needs 4 patches on the 0.84 line: gnu++23→gnu++2b alias, explicit typename (P0634, clang 16), std::out_ptr fallback (P1132 missing in libc++), make_unique_for_overwrite→make_unique (P0980, buffer fully overwritten so equivalent)."
  - "CI red root cause (#65549/#66114/#66132, three workers, identical): registry glib/2.84.0.1.1 ships bin tools as OHOS ELF with stale .codesign — XPM exec rejects (FAILED code=126 at gnome.compile_resources). Fix: re-sign glib bin ELF tools in place from generate() (gtk4/4.22.4 R85/R86 precedent); tools need glib lib on LD_LIBRARY_PATH (no RPATH)."
