version: "0.8a"
software: vgabios
status: built
build_date: "2026-09-30"
build_system: makefile
conan_ref: "vgabios/0.8a"

source:
  # 上游官方 GitHub release tag 归档（bochs-emu/VGABIOS v0_8a，2021-06-03）
  url: "https://github.com/bochs-emu/VGABIOS/archive/refs/tags/v0_8a.tar.gz"
  sha256: "4e1e1d5a41225a1b842f1afaa030c058420fba4b377bdd35e623e57bd0cd4835"
  tar_format: tar.gz

build:
  system: makefile
  # 无 configure 选项；make 变量 CC/GCC/BCC/AS86 由 conanfile.build() 显式注入
  configure_options: []
  dependencies:
    - "dev86/0.16.21"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "8086 实模式固件（vgabios）可在 OHOS/aarch64 上交叉构建：宿主 clang 做预处理器与主机工具，目标码交给 dev86 的 bcc/as86；产物与宿主架构无关。knowledge_ref: E349"
  - "bcc 通过 BCC_PREFIX 定位包内 lib/bcc/{bcc-cpp,bcc-cc1,include}（缺省报 Unable to execute bcc-cpp）；TMPDIR 必须指向可写目录（HMDFS 的 /tmp 只读，dev86 已打 TMPDIR 补丁）。knowledge_ref: E002, E325"
  - "tools.build:compiler_executables 是 JSON dict 型 conf，不能按 ':c' 下标取；ConanFile.run(env=) 只收环境名/文件名列表，注入变量须用 Environment().vars(self, scope='build').apply()。knowledge_ref: DRAFT-CONAN-RUN-ENV-NOT-DELIVERED-TO-COMPILER"
  - "本机沙箱下 conan 子进程继承 socket 型 stdin 时，OHOS SDK clang/clang-15 静默 exit 1（零输出），make 只报 Error 1；conan create 时重定向 stdin 为 /dev/null 即恢复。knowledge_ref: E545"
  - "OHOS 的 /tmp 只读且脚本 shebang 为 zsh 时，here-document 临时文件创建失败（zsh 用 TMPPREFIX，默认 /tmp/zsh，不读 TMPDIR），令 W3/CI 脚本内 heredoc 门禁整体失效。knowledge_ref: E546"
