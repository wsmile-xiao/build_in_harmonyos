# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: vgabios/0.8a
homepage: "https://github.com/bochs-emu/VGABIOS"

# 上游测试入口：vgabios 0.8a 官方归档无 `make check` / `test` 目标
# （顶层 Makefile 仅有 all/bios/cirrus-bios/banshee-bios/clean/dist-clean/release
#  与 biossums/vbetables-gen/vbetables.h 规则，无任何 check/test/ctest 目标）。
# tests/ 下仅有两个 DOS 时代的交互式测试程序（Turbo C 2.0 / Watcom C++ 10.0a），
# 依赖 <dos.h>/<conio.h>/intr()/REGPACK 与 DOS4GW 运行期，无法在 OHOS 上运行，
# 上游测试用例数按 0 计（详见 ../reports/test-report.md）。
upstream_check_command: "make check (not provided upstream — no check/test target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  上游 0.8a 归档不含自动化测试基础设施；tests/testbios.c（Turbo C 2.0）与
  tests/lfbprof/lfbprof.c（Watcom C++ 10.0a + DOS4GW）为 DOS 交互式示例程序。
  用本适配的 8086 工具链尝试编译 tests/testbios.c 在 `#include <dos.h>` 处即失败
  （bcc: Cannot open include file），证据见 reports/test-report.md §1.3。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_vgabios.sh
    description: >
      ROM 结构校验（9 项用例）：读取包内 share/vgabios/ 的 5 个 8086 Option ROM，
      断言 0x55AA 签名、data[2]*512 长度字段、ROM 校验和 ≡ 0 (mod 256)、
      PCIR 结构（指针 0x18 / magic / Vendor ID / Device ID / Image Length）、
      IBM 标识与版本串、cirrus/banshee/debug 变体标记；并实际运行包内
      bin/biossums 修复被破坏的 ROM 校验和。含 1 项鸿蒙特有用例。
    command: "bash test_vgabios.sh <package_folder>"
  - file: verify_rom.py
    description: "Option ROM 逐字节结构断言助手（signature/checksum/sizefield/pcir/elf-ohos）"
    command: "python3 verify_rom.py <subcommand> <rom>"

# 测试断言总数 (近似值, 用于质量评估)：
# 用例 9 项（TC-01..TC-09），其中鸿蒙特有用例 1 项（TC-09-ohos-host-abi）
assertion_count: 9
ohos_specific_assertion_count: 1
