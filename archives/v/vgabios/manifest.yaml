software: vgabios
display: "LGPL'd VGABIOS"
description: "Bochs/QEMU/plex86 的 LGPL 显卡固件（VGA / PCI Option ROM）：实模式视频 BIOS，含 Bochs VBE、Cirrus SVGA 与 Voodoo Banshee 扩展"
category: emulation
homepage: "https://github.com/bochs-emu/VGABIOS"
license: LGPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "无源码补丁：上游 Makefile 以 CC/GCC/BCC/AS86 变量驱动且为简单赋值，命令行覆盖即可接入 Conan 工具链（R1 参数最少化）"
    - "tool_requires dev86/0.16.21 提供 OHOS(aarch64) 原生 8086 工具链 bcc/as86；bcc 经 BCC_PREFIX 定位包内 lib/bcc 组件"
    - "HMDFS /tmp 只读：配方把 TMPDIR 指向构建目录（dev86 已打补丁令 bcc 遵循 TMPDIR），否则 bcc 落临时文件失败"
    - "上游归档自带发布时预编译 ROM，构建前先移除，保证打包的一定是本次真构建产物；产物不全则显式报错"
    - "产物为与宿主无关的 8086 Option ROM 镜像；bin/biossums 为 OHOS aarch64 原生可执行文件"
  common_dependencies:
    - "dev86/0.16.21"

versions:
  "0.8a":
    status: built
    build_date: "2026-09-30"
    conan_ref: "vgabios/0.8a"
    source_url: "https://github.com/bochs-emu/VGABIOS/archive/refs/tags/v0_8a.tar.gz"
    build_system: makefile
    configure_options: []
    notes:
      - "tool_requires dev86/0.16.21（OW2 依赖已发布，conan download 可消费）"
      - "零补丁适配（仅 Conan 侧注入工具链与 TMPDIR/BCC_PREFIX）"
      - "消费者测试 9 项全通过（含 1 项鸿蒙特有 AArch64 原生产物断言）"
