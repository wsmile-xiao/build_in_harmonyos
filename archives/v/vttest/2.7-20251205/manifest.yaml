# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 config.guess（GNU 2025-07-10）不认识 HarmonyOS 内核（uname -s 返回 HarmonyOS），configure 以 `cannot guess build type; you must specify one` 退出；补丁在 `case $UNAME_SYSTEM` 中加入 HarmonyOS 并新增 `aarch64:HarmonyOS:*:*` → `aarch64-unknown-linux-$LIBC` 分支，原生构建无需 --host 即可识别自身（知识库 E160；上游 config.sub 本身已认识 linux-ohos）。ref: E160"
  - "HMDFS 对 umask 077 新建目录强制 setgid（umask 077 + SGID → drwx--S---），owner 也无法在其中写文件；autoconf 生成的 configure/config.status 用 `(umask 077 && mktemp -d \"$TMPDIR/csXXXXXX\")` 建临时目录，因此报 `could not setup config files machinery`。补丁把 configure 内两处 `umask 077` 改为 `umask 022` 即修复（知识库 E129/E112/E136；与已合入的 a52dec/0.7.4、teseq/1.1.1 同款补丁一致）。ref: E129, E112, E136"
  - "config.guess 的 set_cc_for_build() 同样用 umask 077 建编译器探测临时目录，在 HMDFS 上会 `can't create .../dummy.c: Permission denied` 导致探测失败/退出类型猜测；补丁把该文件内三处 umask 077 一并改为 022（同 E011 思路）。ref: E011"
  - "vttest 是交互式终端测试工具：上游无自动化测试（N=0，makefile 无 check 目标），消费者回归只能在目标真机上执行包内二进制；核心功能面（菜单/转义序列输出）需要伪终端——test_package 用 Python pty 启动程序、选择 Exit 菜单项并断言干净退出（无 /dev/ptmx 的宿主显式 skip，不伪装通过）。ref: none"

knowledge_ref:
  - "E160"
  - "E129"
  - "E112"
  - "E136"
  - "E011"

