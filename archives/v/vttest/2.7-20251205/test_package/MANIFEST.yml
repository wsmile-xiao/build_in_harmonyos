# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点证据 (R51)：
#   1. 官方源包 vttest-20251205.tgz（sha256
#      cd6886f9aefe6a3f6c566fa61271a55710901a71849c630bf5376aa984bf77cc）
#      内没有 tests/、test/ 或任何测试脚本/基准数据目录；MANIFEST（66 个
#      文件基线）逐项列出全部发行文件，其中无测试资产——vttest 本身就是
#      "终端测试程序"。
#   2. 上游 makefile.in 没有 check/test 目标，configure.in 仅做编译特性
#      探测（AC_HAVE_HEADERS/FUNCS、CF_* 宏），未注册任何测试程序，
#      因此不存在可执行的 `make check`。
#   3. vttest 的用例由"在被测终端上操作菜单"驱动（vttest.1: "The program
#      is menu-driven ... To run a given menu-item, you must enter its
#      number"），无预期输出基准，也不提供自动化断言。
#   4. 结论：上游自动化用例数 N=0。
#
# 依据竞赛规则 6 / R51，本适配在 test_package/ 中补全消费者回归断言，
# 并在 PR 中如实申报 0 上游用例 + 新增鸿蒙平台消费者测试。

package: vttest/2.7-20251205
homepage: "https://invisible-island.net/vttest/"

# 上游无自动化测试套件；build() 不运行 make check（makefile 无该目标）
upstream_check_command: "(none - upstream ships no automated test suite)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证，不替代上游测试统计）
test_package_tests:
  - file: conanfile.py
    description: >-
      CLI 消费者回归：包内 bin/vttest 存在且可执行；`vttest -V` 精确输出
      上游版本横幅 "VT100 test program, version 2.7 (20251205)" 且退出码 0；
      未知选项 `-Z` 输出 "Usage: vttest" 用法文本并以非零码退出（负向对照）；
      make install 的 man page share/man/man1/vttest.1 存在且非空。
    command: "conan create（test_package 阶段自动执行 test()）"
  - file: pty_smoke.py
    description: >-
      PTY 交互冒烟（vttest 的核心功能面）：在真正的伪终端上启动包内二进制，
      等待主菜单 "Choose test type:"，选择 Exit 菜单项，要求进程以 0 退出；
      断言版本横幅与主菜单均出现在 PTY 输出中。宿主无 /dev/ptmx 时显式
      skip（exit 77）并在日志说明，不伪装通过。
    command: "python3 pty_smoke.py <package>/bin/vttest（由 test() 调用）"

# 测试断言总数 (精确值)：6 条无条件 CLI 断言 + 3 条 PTY 交互断言
# （PTY 断言在提供伪终端的宿主上执行；无 /dev/ptmx 时 pty_smoke.py 显式 skip）
assertion_count: 9
