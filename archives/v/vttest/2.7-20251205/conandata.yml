patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: >-
      Teach the shipped config.guess (timestamp 2025-07-10) the HarmonyOS
      kernel (aarch64:HarmonyOS -> aarch64-unknown-linux-$LIBC) and create its
      compiler-probe temp directory with umask 022: configure otherwise stops
      with "cannot guess build type", and HMDFS turns umask 077 directories
      into drwx--S--- that even their owner cannot write (E129/E112/E136).
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: >-
      Use umask 022 for the config.status temp directory: HMDFS force-sets the
      setgid bit, so umask 077 yields a directory that rejects writes even from
      its owner ("could not setup config files machinery", E129/E112/E136).
    patch_type: "portability"
