# test_package/MANIFEST.yml
# Upstream test inventory for variant-lite 3.0.0.

package: variant-lite/3.0.0
homepage: "https://github.com/martinmoene/variant-lite"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# CMakeLists.txt registers four CTest programs (cpp98/cpp11/cpp14/cpp17).
# Each program compiles the same 92 CASE declarations from variant.t.cpp and
# variant-main.t.cpp. variant-override.t.cpp has one additional CASE declaration
# but is not listed in the upstream CMake SOURCES and is therefore not executed.
upstream_tests:
  - file: test/variant.t.cpp
    source: variant-lite-3.0.0/test/variant.t.cpp
    description: "variant core suite: 86 CASE declarations, executed in all four CTest programs"
    command: "ctest --output-on-failure"
  - file: test/variant-main.t.cpp
    source: variant-lite-3.0.0/test/variant-main.t.cpp
    description: "lest entry and configuration suite: 6 CASE declarations, compiled into all four programs"
    command: "ctest --output-on-failure"

test_package_tests:
  - file: test_variant_lite.cpp
    description: "Consumer test: include nonstd/variant.hpp and call variant/get/index/holds_alternative/get_if/visit APIs"
    command: "./test_variant_lite"

assertion_count: 92
