# test_package/MANIFEST.yml
package: vol/1.5.4
homepage: "https://github.com/coin-or/Vol"
upstream_official_tests:
  - suite: "test/osiUnitTest (make check)"
    count: 5
    kind: "unit"
    command: "make check"
    run_in_build: true
    result: "已实跑（build() 内手工编译运行 osiUnitTest）：424 PASSED，3 个 ERROR 均为上游预期错误（expected 3），All tests completed successfully（退出码 0）"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
# 说明：configure 的 COIN_HAS_OSITESTS 探测依赖 osi-unittests.pc（ohpcd 无独立
# 包），automake 不会构建 osiUnitTest——build() 内手工编译运行（源码
# test/osiUnitTest.cpp + OsiVolSolverInterfaceTest.cpp，3 组测试：
# OsiRowCut/OsiColCut/OsiVol 通用单元测试）；测试组件 OsiUnitTests.hpp +
# libOsiCommonTests.a 随 coin-or 包提供。测试需 COIN Sample 数据
# exmip1.mps（8 列标准 MIP）——build() 内从上游 coin-or-tools/Data-Sample
# 获取写入 Data/Sample/。静态链接无需 LD_LIBRARY_PATH。不修改任何上游测试内容。
adapted_tests: []
test_package_tests:
  - file: test_vol.cpp
    origin: ohos-adaptation
    description: "消费者测试：真实调用 libVol 非内联 API（VOL_dvector/VOL_ivector 的 operator= 与 cc()）并校验数值，强制链接 libVol.a 解析真实符号"
    command: "./test_vol"
assertion_count: 4
