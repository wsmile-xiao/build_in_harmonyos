# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: viewnior/1.8
homepage: "https://github.com/hellosiyan/Viewnior"

# 上游测试命令: viewnior 1.8 发行树无独立测试目录——无 tests/、无 test* 子目录；
# meson 仅有 1 个被 required:false 外部命令（desktop-file-validate）守卫的
# validate-desktop 测试，设备上该命令缺失，测试不会注册运行（属构建期可选校验，
# 非上游测试套件）。R51 清点证据见 notes.md。
upstream_check_command: "none (上游未提供测试)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# 豁免声明 (TEST_QUALITY_SPEC.md 3.3 / 平台限制)
exemptions:
  - rule: "upstream_has_no_test_suite"
    reason: "viewnior 1.8 发行树无 tests/ 目录、无 meson test 目标、无自动化测试脚本——功能覆盖改由 test_package 的消费者测试提供"
  - rule: "gui_requires_display"
    reason: "viewnior 是 GTK+2 图形查看器，OHOS 构建 worker 无 X server；补丁 0001 提供无头 --version 早退（输出与显示路径一致），消费者测试验证版本输出、aarch64 ELF、GTK+2 动态链接闭包解析"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: viewnior_test.py
    description: "① 断言二进制为真 aarch64 ELF（e_machine=0xB7，OHOS 目标）；② 运行 `viewnior --version` 断言 GTK+2/glib/exiv2 动态链接闭包完整解析且输出 'viewnior 1.8'（rc=0）；③ `--help` 在无显示时仅止步于 display init（无动态链接错误）"
    command: "python3 viewnior_test.py <package>/bin/viewnior"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
