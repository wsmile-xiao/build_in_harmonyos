# conandata.yml — viewnior 1.8
# 官方源：Viewnior GitHub tag viewnior-1.8（git archive 打包，meson 构建）。
# sha256 由 /storage/Users/currentUser/builds/viewnior-1.8.tar.gz 用 hashlib 计算
# （与 manifest.yaml source.sha256 一致）。
sources:
  url:
    - "https://github.com/hellosiyan/Viewnior/archive/refs/tags/viewnior-1.8.tar.gz"
  sha256: "b9319171ebca23929e6ea8039c194b1595d92e764db5e3890836fb5c36e233b0"

patches:
  - patch_file: "patches/0001-src-main.c.patch"
    strip: 1
    patch_description: "Headless early --version: print PACKAGE_STRING before GTK's option group opens the X display, so --version works on OHOS build workers without an X server (output identical to the display path)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-uni-exiv2.cpp.patch"
    strip: 1
    patch_description: "exiv2 0.28 API port: Image::AutoPtr -> Image::UniquePtr, AnyError -> Error (removed/renamed in exiv2 0.28; viewnior 1.8 was written against exiv2 0.21-era API)"
    patch_type: "portability"
