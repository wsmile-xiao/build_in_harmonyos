# 版本号
version: "1.8"

# 软件名
software: "viewnior"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-08"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39 官方源）
  url: "https://github.com/hellosiyan/Viewnior/archive/refs/tags/viewnior-1.8.tar.gz"

  # 源码校验和（对 /storage/Users/currentUser/builds/viewnior-1.8.tar.gz 用 hashlib 计算）
  sha256: "b9319171ebca23929e6ea8039c194b1595d92e764db5e3890836fb5c36e233b0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（init 误判为 autotools，实际为 meson）
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
  - "-Dwrap_mode=nofallback"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - gtk2/2.24.33
  - glib/2.84.0.1
  - gdk-pixbuf/2.44.6.1
  - exiv2/0.28.7
  # 注: shared-mime-info 仅做 meson 版本探测（>= 0.20），generate() 合成
  # shared-mime-info.pc 满足之；其 conan 包无 .pc/cpp_info，且引入 requires 会
  # 拖入 glib/2.84.0 pin 致 ohpcd 已发布二进制 package_id 失效、CI 源码构建失败。
  build_requirements:
  - gettext/0.22.5.1
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "patches/0001-src-main.c.patch"
- "patches/0002-src-uni-exiv2.cpp.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "gtk2 链与 shared-mime-info 的 glib 版本冲突：gtk2/gdk-pixbuf/pango 发布二进制 pin glib/2.84.0.1，shared-mime-info/2.5.1 配方 pin glib/2.84.0 → 本配方 requirements 用 glib/2.84.0.1 force=True 收敛（归档先例 blogc/0.20.1 同法）"
- "shared-mime-info conan 包不装 .pc 且不声明 cpp_info，viewnior meson 的 dependency('shared-mime-info') 需在 generate() 合成 shared-mime-info.pc（Version 2.5.1 >= 0.20 满足探测）"
- "exiv2 为静态库（expat/zlib 链接其中），PkgConfigDeps 生成的 exiv2.pc 无 Requires → generate() 追加 'Requires: expat zlib'（两者为可见传递依赖，.pc 均在 generators 目录）"
- "meson gnome.genmarshal 从 glib-2.0.pc 读 glib_genmarshal 变量，PkgConfigDeps 不生成 → generate() 注入指向 python 包装版 glib-genmarshal（accountsservice 模式，OHOS 拒绝裸 #!/usr/bin/env shebang）"
- "i18n.gettext/merge_file 需要 msgfmt/xgettext → gettext/0.22.5.1 tool_require（VirtualBuildEnv 注入 PATH）"
- "OHOS 构建 worker 无 X server：GTK 应用 --version 在 GOption 的 gtk 选项组 pre-parse 阶段即 'Cannot open display' 失败；补丁 0001 提前处理 --version 打印 PACKAGE_STRING（bluefish --selftest 先例），L2 smoke 与 test_package 因此可无头验证"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

