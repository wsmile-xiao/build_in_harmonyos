# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: vulkan-headers/vulkan-sdk-1.4.357.0
homepage: "https://github.com/KhronosGroup/Vulkan-Headers"

# 上游测试命令 — vulkan-headers 上游 CMake 测试（tests/——vk_hpp 编译检查）
upstream_check_command: "cmake --build build && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-18 实测记录）：
# - tests/：CMake 测试（tests/vk_hpp.cpp + vk_hpp_module.cpp——Vulkan-Hpp
#   头文件编译检查类）——纯头文件库的测试（编译检查）
# - 实测（2026-08-18，OHOS 环境）：**纯头文件编译检查通过**——clang
#   编译 include vulkan.h 的程序——`VK_HEADER_VERSION=357`（真实 API
#   验证通过）——纯头文件库（零编译产物——编译检查即测试）
# - 构建要点：CMake install（纯头文件——无编译——无 config.status
#   权限问题——CMake 可用）
upstream_tests:
  - file: tests/
    source: Vulkan-Headers-vulkan-sdk-1.4.357.0/tests/
    description: "上游 CMake 测试（vk_hpp 编译检查类）——实测：clang 编译 include vulkan.h 通过（VK_HEADER_VERSION=357）——纯头文件库编译检查即测试"
    command: "cmake --build build && ctest"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_vulkan_headers.py
    description: "消费者测试（L0c）：真实 API（R34）——clang 编译 include vulkan.h 断言 VK_HEADER_VERSION=357"
    command: "python3 test_vulkan_headers.py <include-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
