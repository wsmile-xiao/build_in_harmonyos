package: verdigris/1.3
homepage: "https://github.com/woboq/verdigris"

upstream_check_command: "qmake && make check"
upstream_test_in_build: false
upstream_test_command: "qmake && make check (Qt Test framework, offscreen QPA)"

upstream_test_total: 10
upstream_test_count_method: "auto"

upstream_tests:
  - file: tests/basic/tst_basic.cpp
    source: verdigris-1.3/tests/basic/tst_basic.cpp
    description: "Basic W_OBJECT signal/slot/property constexpr test"
    command: "./tst_basic"
  - file: tests/internal/tst_internal.cpp
    source: verdigris-1.3/tests/internal/tst_internal.cpp
    description: "Internal meta-object helpers"
    command: "./tst_internal"
  - file: tests/manyproperties/tst_manyproperties.cpp
    source: verdigris-1.3/tests/manyproperties/tst_manyproperties.cpp
    description: "Many W_PROPERTY stress test"
    command: "./tst_manyproperties"
  - file: tests/templates/tst_templates.cpp
    source: verdigris-1.3/tests/templates/tst_templates.cpp
    description: "Templated QObject support"
    command: "./tst_templates"
  - file: tests/cppapi/tst_cppapi.cpp
    source: verdigris-1.3/tests/cppapi/tst_cppapi.cpp
    description: "C++ property meta-programming API"
    command: "./tst_cppapi"
  - file: tests/qt/qmetaenum/tst_qmetaenum.cpp
    source: verdigris-1.3/tests/qt/qmetaenum/tst_qmetaenum.cpp
    description: "QMetaEnum mapping test"
    command: "./tst_qmetaenum"
  - file: tests/qt/qmetamethod/tst_qmetamethod.cpp
    source: verdigris-1.3/tests/qt/qmetamethod/tst_qmetamethod6.cpp
    description: "QMetaMethod tag/signature test"
    command: "./tst_qmetamethod"
  - file: tests/qt/qmetaobject/tst_qmetaobject.cpp
    source: verdigris-1.3/tests/qt/qmetaobject/tst_qmetaobject6.cpp
    description: "QMetaObject classInfo/method/property mirror test"
    command: "./tst_qmetaobject"
  - file: tests/qt/qmetaproperty/tst_qmetaproperty.cpp
    source: verdigris-1.3/tests/qt/qmetaproperty/tst_qmetaproperty6.cpp
    description: "QMetaProperty read/write/notify test"
    command: "./tst_qmetaproperty"
  - file: tests/qt/qobject/tst_qobject.cpp
    source: verdigris-1.3/tests/qt/qobject/tst_qobject6.cpp
    description: "Full QObject signal/slot/properties integration (Qt Test)"
    command: "./tst_qobject"

test_package_tests:
  - file: test_verdigris.cpp
    description: "Consumer test: header-only fallback — W_VERSION and W_OBJECT macro presence without Qt (Qt-dependent W_SIGNAL/W_SLOT verification marked as ohos_feature gap)"
    command: "./test_verdigris"

assertion_count: 2
