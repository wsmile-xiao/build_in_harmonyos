software: verdigris
version: "1.3"
build_system: header-only
status: published
build_date: "2026-09-19"

source:
  url: "https://github.com/woboq/verdigris/archive/refs/tags/v1.3.tar.gz"
  sha256: "ec6de8c2050020021dd540870a43738f8416502ede477416c86ee18cbe582638"
  tar_format: tar.gz

build:
  system: header-only
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "verdigris 1.3 is header-only (src/wobjectdefs.h + src/wobjectimpl.h), C++14 constexpr QMetaObject, binary compatible with Qt 5.9-5.15 and Qt 6.0-6.3"
  - "No configure/make needed; headers are copied to include/ and include/verdigris/, no shared lib, package_type header-library"
  - "Upstream Qt Test suite (qmake) exists but requires Qt; test_package validates headers with real Qt dependency when available"

install_paths:
  include: include/verdigris
