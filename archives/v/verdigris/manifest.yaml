software: verdigris
display: "Verdigris"
description: "Header-only Qt moc replacement — constexpr QMetaObject generation without moc"
category: library
homepage: "https://github.com/woboq/verdigris"
license: "LGPL-3.0-or-later"
build_system: header-only

ohos_adaptation:
  key_points:
    - "Header-only library (src/wobjectdefs.h + src/wobjectimpl.h), C++14 relaxed constexpr, no build step"
    - "Binary compatible with Qt 5.9-5.15 and Qt 6.0-6.3, replaces moc with W_OBJECT/W_SLOT/W_SIGNAL macros"
    - "Headers installed to include/ and include/verdigris/, package_type header-library, package_id cleared"
    - "Consumer test validates W_OBJECT/W_SLOT/W_SIGNAL/W_PROPERTY with Qt6 and QMetaObject introspection (offscreen QPA)"
  common_dependencies: []

versions:
  "1.3":
    status: published
    build_date: "2026-09-19"
