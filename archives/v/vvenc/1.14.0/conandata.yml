# conandata.yml — vvenc 1.14.0（官方 v1.14.0 tag tarball）

sources:
  url: "https://github.com/fraunhoferhhi/vvenc/archive/refs/tags/v1.14.0.tar.gz"
  sha256: "dd43d061d59dbc0d9b9ae5b99cb40672877dd811646228938f065798939ee174"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Add the VVENC_ENABLE_VERSIONED_SONAME option (default ON, upstream behaviour) so the versioned shared-library layout can be switched off on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-modules-vvencTests.cmake.patch"
    patch_description: "Register the added HarmonyOS/OHOS consumer use case test (Test_vvencohoscapptest) in the upstream ctest suite"
    patch_type: "portability"
  - patch_file: "patches/0003-source-Lib-CommonLib-x86-CommonDefX86.cpp.patch"
    patch_description: "Guard the GCC-only optimize(\"no-tree-vectorize\") attribute against clang, which defines __GNUC__ as well but rejects that attribute string; with VVENC_ENABLE_WERROR=ON the resulting -Wignored-attributes warning aborted the build"
    patch_type: "portability"
  - patch_file: "patches/0004-source-Lib-vvenc-CMakeLists.txt.patch"
    patch_description: "Omit the VERSION/SOVERSION target properties when VVENC_ENABLE_VERSIONED_SONAME is OFF, so the shared library is emitted as a single unversioned real file instead of a symlink chain that HMDFS cannot follow (Knowledge-Ref E050)"
    patch_type: "portability"
  - patch_file: "patches/0005-test-vvencohoscapptest-CMakeLists.txt.patch"
    patch_description: "Add the build file of the HarmonyOS/OHOS consumer use case test executable"
    patch_type: "portability"
  - patch_file: "patches/0006-test-vvencohoscapptest-vvencohoscapptest.c.patch"
    patch_description: "Add the HarmonyOS/OHOS consumer use case test: runtime linkage integrity (the library must be a real, non-symlinked file, Knowledge-Ref E050) plus a public-encoder-API round trip producing a non-empty VVC bitstream"
    patch_type: "portability"
