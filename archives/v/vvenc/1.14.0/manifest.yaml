# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCMAKE_SYSTEM_NAME=Linux"           # E092：CMake 无 Platform/HarmonyOS 模块
    - "-DVVENC_ENABLE_VERSIONED_SONAME=OFF" # E050：HMDFS 无法跟随版本化软链
    - "-DVVENC_TOPLEVEL_OUTPUT_DIRS=OFF"    # 产物留在构建树内，不污染源码树
    - "-DVVENC_ENABLE_INSTALL=ON"
    - "-DVVENC_INSTALL_FULLFEATURE_APP=ON"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"  # E504：避免 install 期改写 DT_RUNPATH 破坏 OHOS 代码签名
    - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  # 唯一的外部依赖是 Threads（pthread），由 OHOS sysroot 提供；
  # thirdparty/nlohmann_json 与 thirdparty/simde 为源码自带，无 Conan 依赖。
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

