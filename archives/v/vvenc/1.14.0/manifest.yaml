# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "clang 也定义 __GNUC__，但拒绝 GCC 专有的 optimize(\"no-tree-vectorize\") 属性串；上游 VVENC_ENABLE_WERROR=ON 会把 -Wignored-attributes 升级为 error。守卫改为 #if defined(__GNUC__) && !defined(__clang__)（E063 族，与 vvdec 3.1.0 同一修复）（ref: E063）"
  - "E092：CMake 4.1.2 只有 Platform/OHOS.cmake（内容即 include(Platform/Linux)），没有 Platform/HarmonyOS.cmake；而 OHOS 适配版 Conan 把 os=OHOS 映射为 CMAKE_SYSTEM_NAME=HarmonyOS，且构建机自身 uname 也报 HarmonyOS，于是 CMAKE_SYSTEM_NAME 落到未知平台，丢失 Linux 平台语义（无 -Wl,-soname、无 rpath 基址），可执行文件的 DT_NEEDED 记录相对路径（ref: E092）"
  - "E092 落地要点：必须走 tc.cache_variables（→ CMakePresets.json 的 -D），因为 GenericSystemBlock 的注入被 if(NOT DEFINED CMAKE_SYSTEM_NAME) 守卫，只有预置 cache 才能阻止 HarmonyOS 注入；tc.variables 写入工具链文件内部、不阻止注入（ref: E092）"
  - "E050：HMDFS 无法可靠创建/跟随符号链接。exec 期动态加载器无法通过软链解析 DT_NEEDED（进程内 dlopen 却可以）；最小复现实测：同目录真实文件 exit=0、软链 exit=127，关闭沙箱复现一致。CMake 的 VERSION/SOVERSION 会产生 libvvenc.so -> libvvenc.so.1.14 -> libvvenc.so.1.14.0 软链链，导致 38/38 上游用例以 Error loading shared library libvvenc.so.1.14 全败（ref: E050）"
  - "VERSION/SOVERSION 要在 CMake 中整体省略，不可置空字符串：置空会生成畸形名 libvvenc.so. 与 SONAME=libvvenc.so.；省略后得到单个真实文件与 SONAME=libvvenc.so（ref: E050）"
  - "libc++_shared.so 由设备默认搜索路径解析（设备上 /system/lib64/libc++_shared.so 存在），C++ 共享库的消费者无需额外 LD_LIBRARY_PATH（ref: E429）"
  - "上游 VVENC_TOPLEVEL_OUTPUT_DIRS 默认为 ON，会把 lib/ 与 bin/ 写进源码树（CMAKE_SOURCE_DIR）并带上 release-<shared|static> 后缀；Conan 构建必须置 OFF，否则污染源码导出并干扰补丁生成（ref: E429）"
  - "上游测试入口为 cmake/modules/vvencTests.cmake 的 add_test 注册；shared 构建 39 项（vvencinterfacetest 1 + vvenclibtest 6 + 工具/比对 31 + cleanup 1），static 构建额外含 Test_vvenc_unit_test（ref: E429）"
  - "E504：OHOS 的 clang/lld 在链接期给每个产物植入代码签名（.note.ohos.ident 段 + .codesign 段），而 CMake install 期会对 DT_RUNPATH 做就地改写（本例 .dynstr 中 21 字节），签名随即失效；OHOS 内核校验签名不匹配后拒绝 mmap(PROT_EXEC)，报 Error loading shared library <lib>: Permission denied（EACCES），dlopen/ctypes 报同一错误。判据：构建树副本可加载而安装副本不可加载，且两者仅有 RPATH 差异（ref: E504）"
  - "E504 落地：设 CMAKE_BUILD_WITH_INSTALL_RPATH=ON，使链接期即写入安装期 RPATH，install 阶段 CMake 检测到已正确便完全跳过改写，安装产物与链接产物逐字节一致、签名保持有效，且无需 binary-sign-tool 等外部工具。相比 CMAKE_SKIP_INSTALL_RPATH（会丢弃上游的可重定位 RPATH），该方案语义偏差更小，最终 RUNPATH 与 Linux 构建完全相同（ref: E504）"
  - "上游 CMakeLists.txt:436-442 在 BUILD_SHARED_LIBS AND NOT WIN32 时自行设置 CMAKE_INSTALL_RPATH（APPLE 用 @loader_path，UNIX 用 $ORIGIN，第二项为 $ORIGIN 到 libdir 的相对路径），因此 shared 构建下 install 期改写必然发生（ref: E504）"

