# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）

package: vvenc/1.14.0
homepage: "https://github.com/fraunhoferhhi/vvenc"

# 上游测试入口：cmake/modules/vvencTests.cmake 通过 enable_testing()/add_test() 注册
upstream_check_command: "ctest -N"

# conanfile.py 的 build() 已集成上游测试（build 阶段执行 cmake.test() → ctest）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（shared 构建共 39 项用例，static 构建另含 Test_vvenc_unit_test）
upstream_tests:
  - file: test/vvencinterfacetest/vvencinterfacetest.c
    source: vvenc-1.14.0/test/vvencinterfacetest/vvencinterfacetest.c
    description: "公开编码接口示例测试：vvenc_encoder_create/open/encode/close 全流程（4 组配置，含多线程与 1-pass RC）"
    command: "ctest -R Test_vvencinterfacetest"
  - file: test/vvenclibtest/vvenclibtest.cpp
    source: vvenc-1.14.0/test/vvenclibtest/vvenclibtest.cpp
    description: "库级单元测试：参数范围、调用顺序、输入参数校验、SDK 默认配置、字符串 API 接口、时间戳（6 项用例）"
    command: "ctest -R Test_vvenclibtest"
  - file: test/vvencohoscapptest/vvencohoscapptest.c
    source: vvenc-1.14.0/test/vvencohoscapptest/vvencohoscapptest.c
    description: "本项目新增的 HarmonyOS/OHOS 消费者用例：运行时链接完整性（库必须是真实文件而非软链，E050 回归护栏）+ 公开编码 API 端到端往返"
    command: "ctest -R Test_vvencohoscapptest"
  - file: cmake/modules/vvencTests.cmake
    source: vvenc-1.14.0/cmake/modules/vvencTests.cmake
    description: "vvencapp / vvencFFapp 工具测试与输出比对（tooltest/faster/fast/medium/slow 各预设 + 2-pass RC + statsFile），另含 Cleanup_remove_temp_files 清理用例"
    command: "ctest"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_vvenc.cpp
    description: "消费者用例：find_package(vvenc) + vvenc::vvenc 链接；校验 vvenc_get_version()；OHOS 下校验实际映射的库为真实非软链文件；176x144 8 帧公开 API 编码往返产出非空 VVC 码流"
    command: "./test_vvenc"

# 测试断言总数（上游 39 项用例 + test_package 5 项检查）
assertion_count: 44
