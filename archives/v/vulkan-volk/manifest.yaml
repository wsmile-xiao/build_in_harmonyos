software: vulkan-volk
category: gfx
description: "Meta-loader for Vulkan API - loads Vulkan loader and provides function pointers for all Vulkan entry points"
homepage: "https://github.com/zeux/volk"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "Needs Platform/HarmonyOS.cmake to suppress CMake 'Unknown system' warning"
    - "VK_USE_PLATFORM_OHOS must be defined via VOLK_STATIC_DEFINES to enable vulkan/vulkan_ohos.h inclusion"
    - "Uses CMAKE_HOST_SYSTEM_NAME for detection (available before project()), not CMAKE_SYSTEM_NAME (only set during project())"
    - "volk.h header-only mode includes vulkan/vk_platform.h + vulkan/vulkan_core.h; VK_USE_PLATFORM_OHOS triggers vulkan/vulkan_ohos.h"
    - "Static library (libvolk.a) with volk.h + volk.c installed directly as include files"
  common_dependencies:
    - vulkan-headers

versions:
  1.4.350:
    status: built
    build_date: 2026-05-25