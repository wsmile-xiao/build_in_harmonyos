test_package:
  type: consumer
  language: lua
  requires:
    - vusted/2.5.3-1
    - neovim/0.11.3
    - busted/2.2.0-1
  entrypoint: smoke_spec.lua
  checks:
    - run Python guard for the packaged smoke spec
    - run packaged vusted through packaged nvim
    - force VUSTED_NVIM to the packaged nvim binary
    - keep LUA_CPATH empty so Neovim LuaJIT does not load Lua 5.4 C modules
    - verify pure-Lua compatibility shims for system, term, and lfs are visible through the vusted package path
    - verify lfs.dir returns entry type metadata and nil-plus-error for missing paths
    - verify Lua assertion in Neovim context
    - verify vusted helper module loads

