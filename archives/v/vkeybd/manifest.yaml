# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: vkeybd
display: "vkeybd (virtual keyboard)"
description: "X11/Tk 虚拟 MIDI 键盘，驱动 ALSA sequencer；附纯 C 的 SoundFont 转换工具 sftovkb"
category: audio
homepage: "https://github.com/tiwai/vkeybd"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 硬编码 TCL_VERSION=8.4 与 X11R6 路径（-L/usr/X11R6/lib、-I/usr/X11R6/include），本平台均不存在；全部以 make 命令行变量覆盖，不改上游源码"
    - "制品仓 tk 无 8.6 系列（仅 9.0.3.1/9.0.3.2），tcl/tk 主版本须一致 ⇒ 只能用 tcl/9.0.3.2 + tk/9.0.3.2"
    - "已发布 tcl/tk 的 soname 是 tcl9.0 / tcl9tk9.0，不是 Makefile 写死的 -ltcl8.4/-ltk8.4，链接名需重定向"
    - "AWE 与 MIDI 后端 #include <linux/soundcard.h>（Linux OSS ioctl，OHOS 无此头）→ USE_AWE=0 USE_MIDI=0；保留 ALSA 后端，属声明式降级（见 notes.md）"
    - "不覆盖 CFLAGS：Makefile 在其内部拼 -DVKB_TCLFILE/-DVKBLIB_DIR/-DVKB_USE_ALSA，改为覆盖其组成项 COPTFLAGS 以保留这些 define"

  common_dependencies:
    - "tcl/9.0.3.2"
    - "tk/9.0.3.2"
    - "libx11/6.4.0"
    - "alsa-lib/1.2.16"

versions:
  "0.1.18d":
    status: built
    build_date: 2026-09-29
