# test_package/MANIFEST.yml — vkeybd 0.1.18d consumer-test declaration (G1/L0e).

upstream:
  source: "tiwai/vkeybd tag v0.1.18d (33 entries: 9x .c + headers + hand-written Makefile + vkeybd.tcl; last commit 2016-01-20)"
  suite: "none — upstream ships no test harness: no tests/ directory, no `make check` target, no CI config (verified on the extracted tag tree 2026-09-29)"
  note: "consumer test below always runs in CI L1; zero-upstream-tests declared per R51 (wavegain/libexplain precedent)"

upstream_surface_note: >-
  Two targets, verified by reading the Makefile: `vkeybd` (Tcl/Tk GUI, links
  -ltcl8.4 -ltk8.4 -lX11 -lasound) and `sftovkb` (pure C, -lm only, no X11/Tk).
  The consumer test exercises sftovkb end-to-end because it is the only part
  with device-observable output; vkeybd is covered by its installed data files
  and a real dynamic-link/start check.

consumer_tests:
  - file: "test_vkeybd.sh"
    runs: "sftovkb on a generated SF2 fixture / non-SoundFont rejection / no-arg usage / vkeybd data files + start"
    asserts:
      - "sftovkb prints exactly 3 preset lines: '0 0 Piano', '0 1 Brass (Ensemble)', '0 2 Chord  Pad'"
      - "preset-name sanitiser maps [ -> ( and { -> space (roundtrip of the fixture names)"
      - "non-SoundFont input exits non-zero with no stdout output"
      - "empty command line exits non-zero and prints 'usage: sftovkb soundfont' on stderr"
      - "vkeybd.tcl and vkeybd.list are installed in share/vkeybd"
      - "vkeybd starts without 'error while loading shared libraries' (libtcl9tk9.0/libX11/libasound resolve)"

  - file: "make_sf2_fixture.py"
    runs: "generates a structurally valid SF2 (38-byte phdr, 22-byte inst, 46-byte shdr records) for the fixture"
    asserts:
      - "produces 3 named presets plus a terminal EOP record"
