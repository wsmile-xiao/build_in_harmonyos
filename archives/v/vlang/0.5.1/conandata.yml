sources:
  # vlang 0.5.1 官方源码——CI Worker 无法直连 github.com（#26556 源码下载失败），
  # 按 CI 修复建议改用 gitcode.com 镜像优先 + 官方 GitHub 兜底（R39 官方 URL 保留）
  url:
    - "https://gitcode.com/gh_mirrors/vl/vlang/-/archive/0.5.1/vlang-0.5.1.tar.gz"
    - "https://github.com/vlang/v/archive/refs/tags/0.5.1.tar.gz"
  sha256: "444f20a77b57fec8a4e8a31fb2d50c318d277fe8377e0c870c2087395c0de810"

# gh-proxy 代理 GitHub（内容一致，sha256 匹配——避开 GitHub 429/直连不可达）——
# 独立键（不混入 sources url 列表——R39 官方 URL 保留在 sources）+ 配方
# source() fallback（aireview P2：镜像前缀不直接进 sources）
vlang-ghproxy:
  url: "https://gh-proxy.com/https://github.com/vlang/v/archive/refs/tags/0.5.1.tar.gz"
  sha256: "444f20a77b57fec8a4e8a31fb2d50c318d277fe8377e0c870c2087395c0de810"
# R12 补丁登记（0001/0002——aireview P2：补丁未按 R12 在 patches 字段登记）
patches:
  "0.5.1":
    - patch_file: "patches/0001-vlib-native-conditions.patch"
    - patch_file: "patches/0002-vlib-copen-signature.patch"
