# 版本级 manifest — volk 3.3.0（GNU Radio VOLK）
# 文件位置: archives/v/volk/3.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "3.3.0"
software: "volk"
status: built
build_date: "2026-09-28"
build_system: "cmake"

source:
  url: "https://github.com/gnuradio/volk/releases/download/v3.3.0/volk-3.3.0.tar.gz"
  sha256: "89d11c8c8d4213b1b780354cfdbda1fed0c0b65c82847e710638eb3e21418628"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_ORC=OFF"
    - "-DENABLE_TESTING=ON"
    - "-DENABLE_MODTOOL=ON"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"
    - "-DCMAKE_INSTALL_RPATH=$ORIGIN/../lib"
    - "-DCMAKE_SYSTEM_NAME=OHOS"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_CXX_FLAGS=-DFMT_DEPRECATED_HEAVY_CORE"
  dependencies:
    - fmt/11.1.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 FetchContent 钉 fmt 10.2.1，制品仓无该版本；改用 fmt/11.1.3 + fmt 官方兼容开关 FMT_DEPRECATED_HEAVY_CORE（<fmt/core.h> 自 fmt 11 起不再导出 fmt::format）"
  - "配方 generate() 必须显式 CMakeDeps(self).generate()：缺失时 find_package(fmt) 落空，上游会 FetchContent 拉取 fmt 10.2.1 并作为子项目把 libfmt.a/include/fmt 装进本包"
  - "OHOS 宿主上 Conan 工具链不设目标系统，CMake 采用宿主 HarmonyOS（无平台模块）→ CMAKE_SYSTEM_PROCESSOR=unknown 使 cpu_features 分支被跳过、共享库丢失 SONAME/版本链；recipe 需固定 CMAKE_SYSTEM_NAME=OHOS + CMAKE_SYSTEM_PROCESSOR=aarch64"
  - "OHOS SDK 的 llvm-ranlib 不存在（只有 llvm-ar）：裸 cmake + ohos.toolchain.cmake 需 -DCMAKE_RANLIB=/data/service/hnp/bin/llvm-ranlib，否则静态归档目标 rc=127"
  - "安装期 RPATH 改写会使链接期 .codesign 失效（E077）；CMAKE_BUILD_WITH_INSTALL_RPATH=ON + CMAKE_INSTALL_RPATH=$ORIGIN/../lib（bin/ 工具免 LD_LIBRARY_PATH）+ package() 四步重签（先副本签名，失败不破坏原文件）"
  - "E537 复验：libvolk.so 的 DT_NEEDED 仅 libc（SONAME libvolk.so.3.3），无 Conan cache 绝对路径泄漏"
  - "上游 volk.pc 内嵌绝对安装前缀，package() 改写为 ${pcfiledir}/../.. 保证可重定位"
  - "ENABLE_ORC 默认 ON，但制品仓 orc/0.4.42 未提供 orcc 工具，FindORC 必然失败 → 显式关闭"
  - "CI worker 上 Conan 进程 Python 与 conanbuild 环境 Python 可能不是同一解释器：build 期 Python 依赖（mako）必须统一在 conanbuild 环境内探测/安装/复检（python3 -c 'import mako'），不能依赖 Conan 进程内的 importlib.metadata（CI build #63475 根因）"
  - 'R38/L0k 启发式只认静态非空 cpp_info.bindirs：含 bin/ 产物的包需在 package_info() 显式声明 cpp_info.bindirs = ["bin"]，否则 commands.json 校验走 warn 分支'
