# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
# 依据: docs/TEST_QUALITY_SPEC.md

package: volk/3.3.0
homepage: "https://github.com/gnuradio/volk"

# 上游测试命令（volk 上游在 CMake/CTest 下注册 154 个 kernel QA 用例）
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j2"

# 上游实际运行的测试程序（volk_test_all 为 per-kernel QA 可执行文件，
# 每个 CTest 用例运行其中一个 kernel 的 generic/neon/neonv8 变体比较）
upstream_tests:
  - file: lib/testqa.cc
    source: volk-3.3.0/lib/testqa.cc
    description: "volk_test_all QA 驱动：单 kernel 多架构一致性/容差比较"
    command: "ctest -R qa_volk_32f_s32f_multiply_32f"
  - file: lib/qa_utils.cc
    source: volk-3.3.0/lib/qa_utils.cc
    description: "QA 工具：测试向量生成、容差比较、benchmark 表格输出"
    command: "ctest --output-on-failure -j2"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：volk_get_machine/volk_get_alignment/volk_malloc + volk_32f_s32f_multiply_32f + 版本宏（7 项断言）"
    command: "./test_volk"
  - file: conanfile.py
    description: "鸿蒙特有：llvm-readelf 校验包内 libvolk.so.3.3.0 的 .codesign 段（E077）"
    command: "llvm-readelf -S <pkg>/lib/libvolk.so.3.3.0 | grep codesign"

# 测试断言总数（近似值：上游 154 个 CTest 用例 + test_package 7 项显式断言）
assertion_count: 161
