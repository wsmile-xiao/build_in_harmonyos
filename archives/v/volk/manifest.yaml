# 软件级 manifest — volk（GNU Radio VOLK）
# 文件位置: archives/v/volk/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: volk
display: "VOLK"
description: "GNU Radio 的 SIMD 内核库：可移植的矢量优化信号处理内核与运行期 CPU 分发"
category: library
homepage: "https://github.com/gnuradio/volk"
license: LGPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "构建期需 Python mako（recipe build() 内确定性 pip 安装）"
    - "上游 FetchContent 钉 fmt 10.2.1，制品仓取 fmt/11.1.3 + FMT_DEPRECATED_HEAVY_CORE"
    - "配方 generate() 需显式 CMakeDeps，否则 find_package(fmt) 落空并触发 FetchContent 把 fmt 装进本包"
    - "固定 CMAKE_SYSTEM_NAME=OHOS + CMAKE_SYSTEM_PROCESSOR=aarch64（宿主 HarmonyOS 无平台模块，会导致 cpu_features 关闭与 SONAME 丢失）"
    - "ENABLE_ORC=OFF：制品仓 orc/0.4.42 无 orcc 工具，FindORC 必然失败"
    - "CMAKE_BUILD_WITH_INSTALL_RPATH=ON + CMAKE_INSTALL_RPATH=$ORIGIN/../lib + package() ELF 四步重签（E077）"
    - "上游 volk.pc 改写为 ${pcfiledir} 相对路径，保证可重定位"
  common_dependencies:
    - fmt

versions:
  "3.3.0":
    status: built
    build_date: "2026-09-28"

# 注: archives/v/volk/1.4.350/ 为同名不同项目（上游 zeux/volk，Vulkan Overlay
# Loader）的历史归档，与 GNU Radio VOLK 无关，本次适配未改动其内容。
