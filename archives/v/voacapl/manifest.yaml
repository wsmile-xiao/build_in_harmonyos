software: voacapl
display: "voacapl"
description: "VOACAP HF 无线电传播预测命令行工具（Fortran）"
category: radio
homepage: "https://github.com/jawatson/voacapl"
license: "LicenseRef-voacapl-special"
build_system: autotools

ohos_adaptation:
  key_points:
    - "设备与 OHOS NDK 无 Fortran 编译器，tool_requires flang-ohos/20.1.0（flang 作 F77/FC 驱动）"
    - "flang 编译需 --target=aarch64-unknown-linux-ohos --sysroot -resource-dir -L<llvm>/lib/aarch64-linux-ohos"
    - "运行期 LD_LIBRARY_PATH 需含 flang 包 lib/ 与 SDK llvm/lib/aarch64-linux-ohos（libc++_shared.so）"
    - "E114：configure 生成的 config.status 用 umask 077 + mktemp 建临时目录，HMDFS 下不可写，须移除 umask 077"
    - "flang 不支持 -fno-sign-zero（gfortran 选项）与 FORTRAN 66 Hollerith 编辑描述符，须替换"
    - "gfortran 扩展过程 call unlink() 需 shim（OPEN/CLOSE STATUS='DELETE' 等价实现）"
    - "install-data-hook 内 coeffbin/fof2bin 等按 DESTDIR 长路径写 .bin，源 len=128 须扩至 512"
  common_dependencies: []

versions:
  0.7.7:
    status: built
    build_date: 2026-09-25
