#   - coeffs 工具路径变量 len 128→512 (coeffbin/coefbinw/fof2bin/fof2binw.f)

knowledge_gained:
  - "纯 Fortran autotools 项目适配：flang-ohos/20.1.0 作 F77/FC，需 --target/--sysroot/-resource-dir/-L 完整注入"
  - "flang 运行期依赖 libc++_shared.so（SDK llvm/lib/aarch64-linux-ohos）与 flang 包 libLLVM/libMLIR/libclang-cpp"
  - "automake out-of-source 构建：all-am 依赖 dist 数据文件，build() 需先复制数据树到 build 目录"
  - "E114：config.status umask 077 + HMDFS setgid → 临时目录不可写，须移除 umask 077"

