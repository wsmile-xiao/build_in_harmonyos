# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: voacapl/0.7.7
homepage: "https://github.com/jawatson/voacapl"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无自动化测试注册（make check 目标为空，tests/ 下无 ctest/check 脚本）；
# tests/p2p 仅有静态算例资产 test01.dat（输入）+ test01.out（参考输出），
# 已在真机实测：运行 voacapl 处理 test01.dat EXIT=0 生成预测输出，与参考
# 输出存在平台性差异（参考为 Windows 平台生成：\SAMPLE.00 路径/CRLF/VOACAP
# 无 L 标记；本机 /sample.00、LF、VOACAP L 标记；数值差异 ≤1dB 属浮点/平台差异）。
upstream_tests:
  - file: tests/p2p/test01.dat
    source: voacapl-0.7.7/tests/p2p/test01.dat
    description: "p2p 传播预测算例（输入卡），实测 voacapl EXIT=0 生成输出"
    command: "voacapl <itshfbc_root>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "test.c 经 popen 执行 voacapl --version 断言输出含 'voacapl - release'；conanfile.py test() 另直接执行 voacapl --version 校验版本输出"
    command: "test_voacapl; voacapl --version"

# 测试断言总数 (近似值, 用于质量评估)
# = 上游 p2p 算例实测 1 + test_package 自研断言 2（test.c popen 断言 1 + voacapl --version 直接执行 1）
assertion_count: 3
