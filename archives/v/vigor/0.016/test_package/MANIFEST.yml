# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: vigor/0.016
homepage: "https://sourceforge.net/projects/vigor/"

# 上游测试命令 (消息目录自检; 位于源码树 catalog/ 子目录)
upstream_check_command: "make -C catalog check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 清点（R51）: vigor 无 tests/ 目录; 唯一上游自检是 catalog/Makefile 的 check
# 目标 –– 对 7 个消息目录做校验（生成目录文件 + 与 *.check 对照查重/缺号）。
# 实测: CC=clang make -B check 在本机源码树 catalog/ 下执行成功 (exit=0),
#      7/7 目录校验通过。
upstream_tests:
  - file: catalog/Makefile
    source: vigor-0.016/catalog/Makefile
    description: "消息目录自检（check 目标）: 从源码提取消息并校验 7 个 catalog (dutch/english/french/german/ru_SU.KOI8-R/spanish/swedish) 的编号唯一性与对照 *.check"
    command: "make -C catalog check"

# test_package 中自带的测试 (消费者视角验证, 运行 vigor_test.py)
# vigor 属 nvi 家族, 上游无 --version 选项 (--version 返回 1 + usage),
# 故真实执行采用 `vigor -e -r` (ex 模式恢复文件列表, rc=0 且输出可断言)。
test_package_tests:
  - file: vigor_test.py
    description: "HarmonyOS 专用测试: ①真实执行 vigor -e -r (rc=0+输出) ②二进制内嵌版本戳 'Version 1.79' ③aarch64 ELF (e_machine=0xB7) ④DT_NEEDED 动态链接解析"
    command: "python3 vigor_test.py"

# 测试断言总数 (vigor_test.py 实际 check() 断言数, 实测全过)
assertion_count: 9
