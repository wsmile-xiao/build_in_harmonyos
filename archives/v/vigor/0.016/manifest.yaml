# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Tcl/Tk 9 将 Tcl_Interp 改为不透明结构，interp->result 直接访问编译失败，需改用 Tcl_GetStringResult/Tcl_SetObjResult 系列 API"
  - "2000 年版 config.guess/config.sub 不识别 HarmonyOS（E160）：显式 --host=aarch64-linux-ohos + config.sub 补丁（aarch64/-ohos）"
  - "autoconf 2.13 无 VAR=value CLI，且沙箱内系统目录不可写：用导出环境变量满足 vi_cv_path_preserve/ac_cv_have_x/ac_cv_prog_CPP 探测"
  - "AC_PROG_CPP 被 clang -Wl,--code-sign 等 stderr 警告污染回落 /lib/cpp：注入 ac_cv_prog_CPP='clang -E -Qunused-arguments'"
  - "shadow-CI 瞬态缺失 /data/service/hnp（DRAFT-9639）：生成环境脚本里 CI 路径不存在时回退 PATH 解析工具"
  - "上游 2000 年版 Makefile 无 DESTDIR：package() 用 make install prefix=$package_folder + strip 覆写 no-op"
  - "test_package 静态 DT_NEEDED 断言把系统 libz.so 误判未解析（E541：OHOS 自带系统 libz.so，tcl/tk 9 的 system_libs 注入 -lz；本机 sysroot 路径存在而 CI worker 无该路径 → 本地过、CI 挂）：在 vigor_test.py 中将 libz.so 与 libc.so 同等视为 loader-resolved，其余 NEEDED 仍严格校验"

