# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求；详见 docs/TEST_QUALITY_SPEC.md）

package: velvet/1.2.10
homepage: "https://github.com/dzerbino/velvet"

# 语料存储：corpus/tests/ 内 6 个 .gz 输入以未压缩明文（.fa/.fq，ASCII）
# 入库——GitCode PR diff 不携带二进制补丁数据，CI git apply 无法应用二进制
# 文件（PR #14063 首轮 CI 实测失败）。test.sh 在测试工作目录现场 gzip 生成
# .gz 后执行上游套件；解压内容与上游原 .gz 一致，断言对象（Sequences/
# Roadmaps）不受影响。

# 上游测试入口：Makefile test 目标 → cd tests && ./run-tests.sh
# runner 原生报告口径：NUMTESTS = tests/ 下 .t 脚本数 = 5
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "bash tests/run-tests.sh（等价于 make test；显式 bash 避免 OHOS /usr/bin/env 解析问题）"
upstream_tests:
  - file: tests/fasta_eq_fastq_ascii.t
    description: "fasta.gz 与 fastq.gz（ascii）输入产生一致的 Sequences/Roadmaps（4 项 cmp 断言）"
    command: "./run-tests.sh 内 source 执行"
  - file: tests/fasta_eq_fastq_binary.t
    description: "-create_binary 模式下 fasta/fastq 输入产生一致 Roadmaps（2 项 cmp 断言）"
    command: "./run-tests.sh 内 source 执行"
  - file: tests/fmt_auto_mode.t
    description: "-fmtAuto 自动识别 fasta.gz/fastq.gz 产生一致 Roadmaps（2 项 cmp 断言）"
    command: "./run-tests.sh 内 source 执行"
  - file: tests/interleaved_eq_separate.t
    description: "interleaved 与 -separate 双文件输入产生一致 Sequences（2 项 cmp 断言）"
    command: "./run-tests.sh 内 source 执行"
  - file: tests/mismatched_separates.t
    description: "-separate 缺文件/读数不匹配时必须报错退出（2 项失败预期断言）"
    command: "./run-tests.sh 内 source 执行"
upstream_total_count: 5
upstream_executed_count: 5
upstream_passed_count: 5
upstream_failed_count: 0
upstream_skipped_count: 0
upstream_skip_reason: ""
upstream_skipped_tests: []
upstream_known_host_failures: []

# test_package 自带测试（消费者视角，实际执行安装产物）
test_package_tests:
  - file: test_package/test.sh
    description: "U1-U5 上游套件对安装产物原样重放；H1 鸿蒙特有 e2e（velveth→velvetg 完整组装并校验 contigs.fa）"
    count: 6
    command: "bash test.sh"
test_package_test_count: 6
test_package_passed_count: 6
test_package_failed_count: 0
test_package_pass_rate: "100%"
# 断言口径：上游 5 个 .t 各含 4/2/2/2/2 项 cmp/失败预期断言（共 12 项）+ H1 e2e 5 项检查
assertion_count: 17
