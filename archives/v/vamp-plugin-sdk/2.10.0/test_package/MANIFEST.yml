package: vamp-plugin-sdk/2.10.0
homepage: "https://vamp-plugins.org/"
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  - file: "test/run-test-plugin-regression.sh"
    source: "vamp-plugin-sdk-2.10.0/test/run-test-plugin-regression.sh"
    description: "Upstream regression suite; requires built vamp-simple-host (libsndfile) and the vamp-test-plugin repo which is not shipped in the SDK tarball."
    command: "test/run-test-plugin-regression.sh"
test_package_tests:
  - file: "main.cpp"
    description: "Instantiates the installed host SDK PluginLoader and composes a plugin key, asserting loader is alive."
    command: "./vamp_smoke"
assertion_count: 2
