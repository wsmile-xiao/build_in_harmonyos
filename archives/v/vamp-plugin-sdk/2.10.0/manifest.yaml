software: vamp-plugin-sdk
# 版本级 manifest — 遵循 ARCHIVE-SPEC v2.0
version: "2.10.0"
status: built
build_date: "2026-08-19"
build_system: autotools

source:
  url: "https://codeload.github.com/vamp-plugins/vamp-plugin-sdk/tar.gz/refs/tags/vamp-plugin-sdk-v2.10"
  sha256: "b552bc91817294c7f90ea07d70938642ebf15d5e3bafc81cf7d55efab9995399"
  tar_format: tar.gz
  note: >-
    github.com 直连超时；使用 GitHub 官方 codeload 标签归档并核验 SHA-256。
    官方发布资产 https://github.com/vamp-plugins/vamp-plugin-sdk/releases/download/
    vamp-plugin-sdk-v2.10/vamp-plugin-sdk-2.10.0.tar.gz 无法从本机验证其 SHA-256。

build:
  system: autotools
  configure_options:
    - "--disable-programs"
    - "--disable-shared"
    - "--enable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
  - "HMDFS 下 autoconf `umask 077 && mktemp -d` 创建 0700 临时目录（属主被强制为 20001006），非属主 euid 无法写入 → configure 的 config.status 失败。需以 umask 002 的 mktemp shim 前置到 PATH（非 chmod 路径）。"
  - "上游 --disable-programs 可避免 libsndfile 硬依赖，仅构建核心 SDK（libvamp-sdk/libvamp-hostsdk）与示例插件。"
