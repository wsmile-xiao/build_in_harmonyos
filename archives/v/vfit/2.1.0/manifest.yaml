knowledge_gained:
  - "vfit 是纯 Python 的可变字体静态实例化工具（fontTools + tqdm + brotli），poetry 构建，无编译产物，pip --prefix 安装即可打包"
  - "上游 sdist 无任何测试文件（无 tests/ 目录），需在 build() 中先 pip 安装运行时依赖 fonttools/tqdm/brotli 保证导入成功"
  - "pip --prefix staging 会产生 lib/pythonX.Y/site-packages 或 lib64 布局，需探测多种候选路径并递归查找 vfit 包目录"
  - "console_scripts 入口 vfit.app:main，pip 可能在 staging/bin 生成脚本，缺失时需手写 wrapper 并 chmod +x"
