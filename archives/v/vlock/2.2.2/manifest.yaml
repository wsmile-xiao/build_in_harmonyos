version: "2.2.2"
software: vlock
status: built
build_date: "2026-09-30"
build_system: makefile
conan_ref: "vlock/2.2.2"

source:
  # 上游原站已下线（Debian #833843 "Upstream is dead"）。使用 Debian 官方打包
  # 仓库 salsa.debian.org/debian/vlock 的 pristine upstream 标签 upstream/2.2.2
  # ——即上游 2.2.2 源码树的逐字节导入（仓库同时提供 pristine-tar 分支）。
  url: "https://salsa.debian.org/debian/vlock/-/archive/upstream/2.2.2/vlock-upstream-2.2.2.tar.gz"
  sha256: "5db15a875ead8f210a2fb3c57cda9001e43aed063b45a6126d1b2bb56d2f8422"
  tar_format: tar.gz

build:
  system: makefile
  # 上游为自制 POSIX-sh `configure` + GNU make（非 autotools）。
  # 注意：该键供 clean-verify(G0) 解析并追加到 `./configure` 命令行，
  # 因此必须留空（写多行折叠标量或 "[]" 会被当成非法参数传给 configure）；
  # 真实构建使用的完整参数见下方 build.configure_invocation 与 notes.md。
  configure_options: ""
  configure_invocation: >-
    ./configure --prefix=<package_folder> --quiet CC=<clang>
    ROOT_GROUP=root VLOCK_GROUP=root
    EXTRA_CFLAGS="-I<linux-pam include> -I<cunit include>"
    EXTRA_LDFLAGS="-L<linux-pam lib> -L<cunit lib>"
  dependencies:
    - linux-pam/1.7.2
  test_dependencies:
    - cunit/2.1-2
  install_tool: /bin/install   # OHOS 的 install 仅为 /bin 下的 toybox applet，不在默认 PATH
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.patch"

# ⚠️ 本节必须排在 patch_generation/patch_classification 之前：
#    `refresh-patch --auto`（finish step 1）会重写且仅重写 manifest 尾部这两段，
#    排在其后的自定义段落会被截断丢失（vbrfix 0.24 manifest 同为该顺序）。

knowledge_gained:
  # 每条必须单行且带 knowledge_ref（check_knowledge_gap 逐 `- ` 行正则匹配，
  # 多行折叠标量会被判为 unreferenced）。
  - "上游自制 configure 用 `case \"$OS\" in Linux)`（OS=`uname`）选择平台链接库/插件集；HarmonyOS 上 `uname` 输出 \"HarmonyOS\"，无分支命中 → PAM_LIBS/DL_LIB/CRYPT_LIB 与 MODULES 全空（vlock-main 链接缺 -lpam、插件不再构建）。修复：补丁 0001-configure.patch 把 HarmonyOS 并入 Linux 分支。knowledge_ref: E007"
  - "OHOS 无 `getent`，configure 无法推导 ROOT_GROUP；安装插件时上游用 `-g $(VLOCK_GROUP)`（默认组名 vlock，发行版安装期才创建）→ toybox install 报 `bad group 'vlock'`。修复：以 configure 旋钮置 ROOT_GROUP=root / VLOCK_GROUP=root（Conan 包不承载属主属组语义）。knowledge_ref: E188"
  - "OHOS 的 `install` 仅以 toybox applet 存在于 /bin，而 /bin 不在默认 PATH，make 报 `install: No such file or directory`（Error 127）。修复：make install 显式传 INSTALL=/bin/install。knowledge_ref: E188"
  - "上游 CUnit 测试套件必须搭配 cunit/2.1-2：测试源码用 4 字段 CU_SuiteInfo（pName,pInitFunc,pCleanupFunc,pTests），而 cunit/2.1-3 在中间插入 pSetUpFunc/pTearDownFunc，4 字段初始化器把 CU_TestInfo[] 写进 pSetUpFunc、pTests 保持 NULL → 套件注册期段错误（core dumped），无任何用例输出。knowledge_ref: E545"
  - "本机 hmmac 沙箱下，由 python 直接派生的 make/clang 会静默失败（exit 1、stdout/stderr 全空）；需以「工具 shell → python(标准输入脚本) → 子进程」形态驱动构建链，编译器方可启动。属环境限制（证据 reports/environment-probes.txt），非被测软件缺陷。knowledge_ref: E346"

test_results:
  upstream:
    command: "make -C tests check"
    framework: cunit/2.1-2
    total: 14
    passed: 13
    failed: 1
    skipped: 0
    failure_detail:
      - case: "test_process::test_wait_for_death"
        classification: environment-limited
        evidence: >-
          断言要求「usleep(20000) 后 execl(/bin/true) 的子进程死亡」落在 20 ms 窗口内；
          本机实测子进程 41.7~43.2 ms 才退出（usleep 本身 20.07 ms，余下为 exec 延迟），
          窗口不足，与被测代码无关。日志 reports/upstream-make-check.log
  test_package:
    command: "python3 test_package/test_vlock.py <package_folder>"
    total: 8
    passed: 8
    failed: 0
    skipped: 0
    harmonyos_specific_cases: 3   # TC-06 / TC-07 / TC-08

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/vlock-2.2.2.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/vlock-2.2.2.work
  source_orig_hash: f1548f3083dd8fbb
  source_work_hash: 2fded0be24486bbe
  generated_at: '2026-09-30T13:16:09'
  patches_count: 1

patch_classification:
  - file: 0001-configure.patch
    type: portability
    platform_only: true
    guard: >-
      仅新增 `uname` 分支标签 HarmonyOS（`case "$OS" in Linux|HarmonyOS)`）；
      非 HarmonyOS 平台该标签不命中，行为与上游逐字节一致；补丁不引入 __OHOS__ 平台宏。
