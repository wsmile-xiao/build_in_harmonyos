# conandata.yml — vlock 2.2.2
# 上游（Frank Benkstein, frank-vlock@benkstein.net）原站已下线（Debian #833843
# "Upstream is dead"）。此处采用 Debian 官方打包仓库 salsa.debian.org/debian/vlock
# 的 pristine upstream 标签 upstream/2.2.2 —— 该标签即上游 2.2.2 源码树的逐字节导入
# （仓库同时提供 pristine-tar 分支），与 Deb 源包 vlock_2.2.2.orig.tar.gz 同源。
sources:
  url: "https://salsa.debian.org/debian/vlock/-/archive/upstream/2.2.2/vlock-upstream-2.2.2.tar.gz"
  sha256: "5db15a875ead8f210a2fb3c57cda9001e43aed063b45a6126d1b2bb56d2f8422"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: >-
      configure 通过 `uname` 判定操作系统后，用 `case "$OS" in Linux)` 选择各平台
      的链接库与插件集；HarmonyOS 上 `uname` 输出 "HarmonyOS"，无分支命中，导致
      PAM_LIBS/DL_LIB/CRYPT_LIB 与 MODULES 全部为空（vlock-main 链接缺 -lpam，
      modules 不再构建）。补丁把 HarmonyOS 并入 Linux 分支。
    patch_type: "portability"
