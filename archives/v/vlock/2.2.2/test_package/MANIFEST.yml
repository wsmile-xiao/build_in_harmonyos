package: vlock/2.2.2
homepage: "https://salsa.debian.org/debian/vlock"

upstream_check_command: "make -C tests check"
upstream_test_in_build: true
upstream_test_command: "make -C tests check"
upstream_test_notes: >-
  Upstream ships a CUnit suite in tests/ (built with cunit/2.1-2 via
  test_requires). 4 suites / 14 cases. 12 pass, 2 fail on this device for
  host-sandbox reasons (test_wait_for_death: 20 ms timeout races the 20 ms
  child sleep plus host exec latency; test_create_child_process: the sandbox
  denies execve(/usr/bin/rev) from a non-shell parent with EACCES). The
  recipe's build() runs the suite and fails the build on any *other* failure.

upstream_tests:
  - suite: test_list
    case: test_list_new
  - suite: test_list
    case: test_list_copy
  - suite: test_list
    case: test_list_free
  - suite: test_list
    case: test_list_length
  - suite: test_list
    case: test_list_append
  - suite: test_list
    case: test_list_delete_item
  - suite: test_list
    case: test_list_delete
  - suite: test_list
    case: test_list_find
  - suite: test_tsort
    case: test_tsort
  - suite: test_util
    case: test_parse_timespec
  - suite: test_process
    case: test_wait_for_death
  - suite: test_process
    case: test_ensure_death
  - suite: test_process
    case: test_create_child_function
  - suite: test_process
    case: test_create_child_process

test_package_tests:
  - file: test_vlock.py
    description: "bin/vlock、sbin/vlock-main、man8/vlock-main.8 等产物齐全"
    command: "无（文件系统断言）"
  - file: test_vlock.py
    description: "vlock --version 输出 'vlock version 2.2.2' 且退出码 0"
    command: "sh bin/vlock --version"
  - file: test_vlock.py
    description: "vlock --help 打印用法（含 --current 等选项）且退出码 0"
    command: "sh bin/vlock --help"
  - file: test_vlock.py
    description: "非法选项被拒绝并打印用法（非 0 退出码）"
    command: "sh bin/vlock --definitely-not-an-option"
  - file: test_vlock.py
    description: "三个插件模块 lib/vlock/modules/*.so 均已构建"
    command: "无（文件系统断言）"
  - file: test_vlock.py
    description: "[OHOS] vlock-main 为 ELF64/LSB/AArch64 且 PT_INTERP=/lib/ld-musl-aarch64.so.1"
    command: "无（纯 Python ELF 解析断言）"
  - file: test_vlock.py
    description: "[OHOS] vlock-main 的 DT_NEEDED 含 libpam.so.0 且经 conanrun LD_LIBRARY_PATH 可解析"
    command: "无（纯 Python ELF + 依赖闭包断言）"
  - file: test_vlock.py
    description: "[OHOS] 在 HarmonyOS 设备上实际执行打包后的 vlock（uname -s=HarmonyOS 且 rc=0）"
    command: "sh bin/vlock -v"

assertion_count: 8
harmonyos_specific_test_count: 3
