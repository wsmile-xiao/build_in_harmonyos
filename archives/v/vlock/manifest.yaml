software: vlock
display: "vlock"
description: "虚拟控制台锁定程序：vlock 启动脚本 + setuid 的 vlock-main 认证进程 + 插件模块（all/new/nosysrq）"
category: system
homepage: "https://salsa.debian.org/debian/vlock"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游自制 configure 以 `case \"$OS\" in Linux)`（OS=`uname`）选择平台链接库/插件集；HarmonyOS 上无分支命中 → PAM_LIBS/DL_LIB/CRYPT_LIB 与 MODULES 全空 → 补丁把 HarmonyOS 并入 Linux 分支"
    - "OHOS 无 getent（ROOT_GROUP）且无安装期创建的 vlock 组（VLOCK_GROUP）→ 以 configure 旋钮置为 root，规避 `install: bad group 'vlock'`"
    - "OHOS 的 install 仅为 /bin 下的 toybox applet（不在默认 PATH）→ make install 显式 INSTALL=/bin/install"
    - "上游 CUnit 套件必须搭配 cunit/2.1-2（4 字段 CU_SuiteInfo）；2.1-3 的中间插入 SetUp/TearDown 字段会令套件注册期段错误"
    - "VT 相关运行时能力在 HarmonyOS PC 上不可用：lock_console_switch() 以 ENOTTY/EINVAL 干净失败（上游已处理），-a/--all 不可用"
    - "vlock-main 依赖 /etc/passwd 中存在的账号（getpwuid），应用沙箱 uid 不在其中"
  common_dependencies:
    - linux-pam/1.7.2

versions:
  "2.2.2":
    status: built
    build_date: "2026-09-30"
    conan_ref: "vlock/2.2.2"
    source_url: "https://salsa.debian.org/debian/vlock/-/archive/upstream/2.2.2/vlock-upstream-2.2.2.tar.gz"
    build_system: makefile
    configure_options: []
    test_dependencies:
      - cunit/2.1-2
    notes:
      - "上游原站已下线（Debian #833843）；采用 salsa.debian.org pristine upstream/2.2.2 标签"
      - "1 个可移植性补丁（configure 平台分支）"
      - "上游 CUnit 套件 14 用例：13 通过 / 1 环境限制失败（test_wait_for_death 时序）/ 0 跳过"
      - "消费者测试 8 项全通过（含 3 项鸿蒙特有：ELF ABI、PAM 依赖闭包、本机执行）"
