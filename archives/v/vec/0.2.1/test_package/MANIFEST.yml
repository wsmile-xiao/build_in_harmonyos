# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: vec/0.2.1
homepage: "https://github.com/rxi/vec"

# 上游测试命令: 上游无 Makefile/meson，测试由 test/build_test.py 直接调用
# gcc -Wall -Wextra -I../src -o ../bin/test_vec.bin ../src/*.c test_vec.c
upstream_check_command: "python3 test/build_test.py && ./bin/test_vec.bin"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test/test_vec.c, 22 sections)
upstream_tests:
  - file: test_vec.c
    source: vec-0.2.1/test/test_vec.c
    description: "上游完整测试: vec_push/pop/splice/insert/sort/swap/foreach 等 22 个分节"
    command: "./bin/test_vec.bin"

# test_package 中自带的测试 (消费者视角验证, 直接调用 vec API 断言)
test_package_tests:
  - file: test.c
    description: "消费者测试: 按上游断言验证 vec 常用 API 与 libvec.a 链接"
    command: "./test_vec"

# 测试断言总数 (上游实测 51 条断言 51/51 通过)
assertion_count: 51