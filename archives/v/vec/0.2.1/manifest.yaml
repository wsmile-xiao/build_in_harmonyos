# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.1"

# 软件名
software: "vec"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/rxi/vec/archive/refs/tags/v0.2.1.tar.gz"

  # 源码校验和
  sha256: "8d6520b013a3b18686e9f31b2b30a59b05837210f5ae83e36e348e5de65fad47"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "无构建系统的 drop-in 源码库（src/vec.c + vec.h）：配方直接用 tools.build:compiler_executables 的 c 编译器编译 + llvm-ar 归档 (R33)"
- "JC5 junk check 基于 git ls-files（索引）而非工作区文件系统；其他库已跟踪的未登记点文件会触发 full 模式拦截，需临时 index 隔离并无条件恢复"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
