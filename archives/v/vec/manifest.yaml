software: vec
display: "vec"
description: "A type-safe dynamic array implementation for C"
category: data-structure
homepage: "https://github.com/rxi/vec"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "上游为 drop-in 源码对 (src/vec.c + src/vec.h)，无 configure/make/cmake"
    - "配方直接以工具链编译器编译 vec.c 为 libvec.a (R33)，llvm-ar 归档"
    - "test_package 映射上游 test_vec.c 断言验证链接与 API 行为"
    - "纯库类型，无可执行产物，不声明 commands.json (R38)"
  common_dependencies: []

versions:
  "0.2.1":
    status: built
    build_date: "2026-09-08"
