# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 2048.c 1.0.3 上游测试：内置于 2048.c 主程序（testSucceed()，13 个棋盘移动/合并断言），
# 通过 `make test`（`./2048 test`）触发；无独立 tests/ 目录、无 ctest/pytest 注册。

package: 2048.c/1.0.3
homepage: "https://github.com/mevdschee/2048.c"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (2048.c 的 13 项自测编译在二进制内, 无独立测试源文件)
upstream_tests:
  - file: 2048.c
    source: 2048.c-1.0.3/2048.c
    description: "内置自测 testSucceed() — 13 个棋盘移动/合并断言, `./2048 test` 触发"
    command: "./2048 test"

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 调用已安装 2048 二进制执行 --version 与内置 13 项自测"
    command: "bash test.sh"

# 上游测试断言总数
assertion_count: 13