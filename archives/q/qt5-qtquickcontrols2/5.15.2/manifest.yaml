version: "5.15.2"

# 编译状态
status: published

# 编译日期
build_date: "2026-09-19"

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/qt/archive/qt/5.15/5.15.2/submodules/qtquickcontrols2-everywhere-src-5.15.2.tar.xz"（官方源 download.qt.io 在 CI Worker 上 302 跳转 mirrors.sau.edu.cn 超时，tuna 镜像实测可达且 sha256 一致；conandata.yml 内已列官方源为 fallback）
