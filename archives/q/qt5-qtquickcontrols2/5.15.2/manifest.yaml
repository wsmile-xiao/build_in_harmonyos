  configure_options:
    - "qmake -spec linux-clang qtquickcontrols2.pro"
  dependencies:
    - qt5-qtbase/5.15.2.2
    - qt5-qtdeclarative/5.15.2
  cc: clang
  cxx: clang++
  mkspec: linux-clang

patches_applied: []

packaging:
  conan_recipe: true
  conanfile: conanfile.py
  conandata: conandata.yml
  test_package: test_package/

knowledge_gained:
  - "qt5-qtquickcontrols2 builds with qmake like qtdeclarative/qtgraphicaleffects: quicktemplates2 + quickcontrols2 C++ libs + QML style plugins (Default/Fusion/Imagine/Material/Universal/Calendar/Templates/LabsPlatform)"
  - "syncqt forward headers under include/QtQuickControls2 use relative ../../src/ paths that break on package relocation - must copy real headers from src/ during build() (_sync_forward_headers)"
  - "QCoreApplication::addLibraryPath does NOT extend QML engine importPathList - use engine.addImportPath() in consumers"
  - "QQuickStyle::setStyle(Material) segfaults without QGuiApplication ( font in QQuickTheme init); Default style is safe for headless testing"
  - "OHOS SELinux W^X blocks QV4 JIT/YarrJIT mprotect(PROT_EXEC): with QV4_FORCE_INTERPRETER=1 + QML_DISABLE_DISK_CACHE=1 + offscreen, 31/36 upstream test targets fully execute (8174/8187 = 99.8% passed); remaining crashes are Yarr RegExp JIT (compile-time flag, cannot disable at runtime) - qtdeclarative engine limitation, not adaptation defect"

test_summary:
