# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qt5-qtquickcontrols2/5.15.2
homepage: "https://www.qt.io/"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试
# 上游 tests/auto/auto.pro SUBDIRS 32 项 = 31 个单测试目录 + controls 组（5 风格变体）
# 注册测试目标 N=36（另有 benchmarks 2 个基准目标不计入）
# 上游测试为 Qt Test/QML QuickTest，完整执行需要 X11/OpenGL 窗口环境才能完整执行，
# 本机为 HarmonyOS PC 目标环境（aarch64），用 QT_QPA_PLATFORM=offscreen 真跑，
# 36 目标中 31 完整执行，实测 8187 用例通过 8174（99.8%），详见版本目录 reports/test-report.md
upstream_tests:
  - file: tests/auto/auto.pro
    source: qtquickcontrols2-everywhere-src-5.15.2/tests/auto/auto.pro
    description: "Qt5 upstream auto tests for Quick Controls 2"
    command: "make check"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "Verifies QtQuickControls2 C++ API (QQuickStyle Default) + QML plugin import (import QtQuick.Controls 2.15 + QtObject create)"
    command: "./test_qt5_qtquickcontrols2"

# 测试断言总数
assertion_count: 2
