patches_applied:
  - file: "patches/0001-guard-accessible-include.patch"
    file_md5: "936c19f473bc2a5651459d06b7100a4a"
    description: >-
      qtquicktemplates2global.cpp 上游无条件 include accessible/qaccessiblequickpage_p.h；
      本套构建 qtbase 为 accessibility=off，该头链引用的 QAccessibleQuickItem 未声明，
      产生 4 个编译错误。补丁以 QT_CONFIG(accessibility) 条件包裹该 include。
    evidence: >-
      负向测试（完整构建树内换回原始文件、单对象重编译）：复现 4 个编译错误 negative_rc=2；
      恢复补丁版重编译 restore_rc=0。详见 reports/test-report.md。

packaging:
  conan_recipe: true
  conanfile: conanfile.py
  conandata: conandata.yml
  test_package: test_package/
  test_package_cases: 3

knowledge_gained:
  - "OHOS 工作区禁符号链接（ln -s 报 EPERM）且 qmake 的 ABI 别名步骤带 - 前缀被 make 静默忽略：无版本名 .so 缺失导致同树后续链接报 clang no such file or directory。解法=预生成库子目录 Makefile 后把 -ln -s $(TARGET) 改写为 -cp -f $(TARGET)（顶层 Makefile 判据 test -e Makefile || 已存在不重生成，改写得以保留）"
  - "OHOS 工作区新建脚本不可直接执行（两种 shebang 均 Permission denied rc=126；同目录 ELF 二进制正常执行、sh <脚本> 可解释执行）：PATH ln 垫片方案不可行"
  - "qmake -r 单进程一次性递归丢失 configure 特性上下文，报 Could not find feature quickcontrols2-default：须顶层单独 qmake + 各库子目录独立 qmake 进程"
  - "make jobserver mkfifo Operation not permitted 为无害警告（构建照常完成）"
  - "沿用 5.15.2：syncqt 转发头需用 src/ 真头覆盖（_sync_forward_headers）；无头环境测试用 Default 风格（Material 风格需 QGuiApplication 字体）"
  - "QtTest QML 模块 install-only（qtdeclarative 包）：qml/QtTest 仅 .so+qmldir，TestCase.qml/SignalSpy.qml/testlogger.js 经 make install 入前缀不随构建树分发（平台既有 Qt5 包同型）；测试时按源码 src/imports/testlib/ 补齐（qmldir md5 与包内逐字节一致 da9a1687487d76528d099b2d0ea642be）"
  - "QV4 JIT 崩溃根因：OHOS 匿名 mmap(PROT_EXEC) 放行但 mprotect(PROT_EXEC) 拒绝，QV4 探测只做 mmap 形态误判 JIT 可用 → ExecutableAllocator mprotect 被拒 → Q_UNREACHABLE SIGSEGV；LD_PRELOAD 垫片令匿名 PROT_EXEC mmap 返 MAP_FAILED（文件映射放行）→ 引擎纯解释执行，monthgrid/weeknumbercolumn/snippets/qquickmaterialstyle/sanity 等此前崩溃用例全部跑通"
  - "Qt.labs.calendar 3 个 .qml 同属 install-only（Makefile 仅 install_qmlfiles 列出）；Imagine 风格 DelayButton/ProgressBar 依赖平台未提供的 QtGraphicalEffects → imagine 目标改 -input 逐文件补救（49 文件 46 全过）"

