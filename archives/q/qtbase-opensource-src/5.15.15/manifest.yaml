software: qtbase-opensource-src
version: "5.15.15"
status: built
build_date: "2026-08-27"
category: qt-core

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.15/submodules/qtbase-everywhere-opensource-src-5.15.15.tar.xz"
  sha256: "e5f941fecf694ecba97c550b45b0634e552166cc6c815bcfdc481edd62796ba1"
  tar_format: tar.xz

build:
  system: configure+make
  configure_options:
    - "-opensource -confirm-license"
    - "-dbus -no-accessibility"
    - "-opengl es2 -no-xcb -no-eglfs -no-linuxfb"
    - "-no-feature-sql"
    - "-no-feature-systemsemaphore -no-feature-sharedmemory"
    - "-nomake tests -nomake examples"
    - "-no-iconv -no-glib -no-icu -no-vulkan"
    - "-no-openssl -no-libproxy -no-system-proxies"
    - "-system-zlib"
    - "-platform linux-clang"
    - "-recheck-all"
  dependencies:
    - zlib/1.3.1
    - dbus/1.14.10
  cc: clang
  cxx: clang++

products:
  libraries:
    - libQt5Core.so.5.15.15
    - libQt5Network.so.5.15.15 (with abstract socket patch)
    - libQt5Gui.so.5.15.15
    - libQt5Test.so.5.15.15
    - libQt5Concurrent.so.5.15.15
    - libQt5OpenGLExtensions.a (static)
    - libQt5DBus.so.5.15.15
    - libQt5Widgets.so.5.15.15
    - libQt5PrintSupport.so.5.15.15
    - libQt5Xml.so.5.15.15
  headers:
    - QtCore, QtGui, QtNetwork, QtTest, QtConcurrent, QtOpenGLExtensions, QtDBus, QtWidgets, QtPrintSupport, QtXml
  tools:
    - qmake, moc, rcc, uic, lupdate, lrelease

patches_applied:
  - "0001-abstract-socket.patch: QLocalServer abstract socket"
  - "0002-abstract-socket-client.patch: QLocalSocket abstract socket"
  - "0003-pthread-cancel-stub.patch: guard pthread_cancel calls with HAVE_PTHREAD_CANCEL feature detection"
  - "0004-socklen-t-ohos.patch: use POSIX socklen_t on supported Linux and OHOS targets"
  - "0005-qmake-ohos-host.patch: use LD_LIBRARY_PATH for unrecognized Q_OS_UNIX hosts"
  - "0006-benchmark-sql-module.patch: omit QtSql benchmarks when QtSql is disabled"
  - "0007-qmetatype-sched-yield.patch: use POSIX sched_yield in the qmetatype test"
  - "0009-qpluginloader-clang-section-type.patch: use a consistent metadata section type under Clang"
  - "0010-qlocale-standard-fenv-test.patch: use standard floating-point exception flags"
  - "0011-qthreadpool-ohos-startup-sync.patch: synchronize OHOS thread pool startup"

knowledge_gained:
  - "OHOS stripped ELF dlopen 限制 (E215): musl 拒绝加载 stripped 共享库"
  - "OHOS Unix 域套接字 bind() 被拒绝: 需使用抽象套接字命名空间"
  - "LD_LIBRARY_PATH 在 OHOS 上被忽略: 用 $ORIGIN RPATH 替代"
  - "OHOS musl does not provide pthread_cancel; guard with HAVE_PTHREAD_CANCEL"
  - "qmake host tools on OpenHarmony require an LD_LIBRARY_PATH fallback in qtAddTargetEnv"
  - "OHOS does not provide pthread_yield; use POSIX sched_yield in tests"
  - "Qt3D requires QtGui with the OpenGL ES 2 feature enabled"
  - "Qt5DBus requires dbus/1.14.10 dependency for D-Bus IPC support"

dependency_for:
  - "libngf-qt"
  - "poppler"

patch_generation:
  method: recovered-from-conan-cache
  note: "配方和补丁从 conan 缓存 (/storage/Users/currentUser/.conan2/p/qtbas779c64c118ac3/) 恢复；conan-verify PASSED (G0-G4)"
  patches_count: 10

patch_classification:
  - file: 0001-abstract-socket.patch
    type: portability
    platform_only: true
    guard: none
    description: "OHOS: use abstract Unix domain socket namespace in QLocalServer"
  - file: 0002-abstract-socket-client.patch
    type: portability
    platform_only: true
    guard: none
    description: "OHOS: use abstract Unix domain socket namespace in QLocalSocket"
  - file: 0003-pthread-cancel-stub.patch
    type: portability
    platform_only: true
    guard: HAVE_PTHREAD_CANCEL
    description: "Guard pthread cancellation calls when the toolchain does not provide pthread_cancel"
  - file: 0004-socklen-t-ohos.patch
    type: portability
    platform_only: true
    guard: none
    description: "Use POSIX socklen_t for the supported modern Linux and OHOS targets"
  - file: 0005-qmake-ohos-host.patch
    type: portability
    platform_only: true
    guard: none
    description: "Use LD_LIBRARY_PATH for unrecognized Q_OS_UNIX qmake hosts such as OpenHarmony"
  - file: 0006-benchmark-sql-module.patch
    type: test
    platform_only: false
    guard: none
    description: "Build QtSql benchmarks only when the QtSql module is enabled"
  - file: 0007-qmetatype-sched-yield.patch
    type: test
    platform_only: false
    guard: none
    description: "Use POSIX sched_yield in qmetatype tests because OHOS does not provide pthread_yield"
  - file: 0009-qpluginloader-clang-section-type.patch
    type: test
    platform_only: false
    guard: none
    description: "Use a writable metadata marker in the qpluginloader test so it shares the plugin pointer section type under Clang"
  - file: 0010-qlocale-standard-fenv-test.patch
    type: test
    platform_only: false
    guard: none
    description: "Use standard floating-point exception flags in the qlocale test when feenableexcept is unavailable"
  - file: 0011-qthreadpool-ohos-startup-sync.patch
    type: test
    platform_only: false
    guard: none
    description: "Synchronize QThreadPool peak-concurrency measurement with worker startup"
