version: "5.15.19"
software: "qt5"
status: built
build_date: "2026-08-24"
build_system: "configure-qmake"

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.19/submodules/qtbase-everywhere-opensource-src-5.15.19.tar.xz"
  sha256: "51e91c73abacab81e64efd01bf95794e79c0e605ad80947a024769f0dd620a32"
  tar_format: tar.xz

build:
  system: configure + qmake
  configure_options:
    - "-opensource -confirm-license"
    - "-no-dbus -no-accessibility"
    - "-opengl es2 -no-xcb -no-eglfs -no-linuxfb"
    - "-no-feature-sql"
    - "-no-feature-systemsemaphore -no-feature-sharedmemory"
    - "-nomake tests -nomake examples"
    - "-no-iconv -no-glib -no-icu -no-vulkan"
    - "-no-openssl -no-libproxy -no-system-proxies"
    - "-system-zlib"
    - "-platform linux-clang"
  dependencies:
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-abstract-socket.patch - abstract Unix domain socket (QLocalServer)"
  - "0002-abstract-socket-client.patch - abstract Unix domain socket (QLocalSocket)"
  - "0003-pthread-cancel-ohos.patch - OHOS musl pthread_cancel guard"
  - "0004-socklen-t-ohos.patch - OHOS socklen_t type fix"
  - "0005-qmake-ohos-host.patch - OHOS qmake host OS detection"

knowledge_gained:
  - "Qt5 5.15.19 on OHOS musl needs pthread_cancel guards (not available in musl)"
  - "QT_SOCKLEN_T must be socklen_t on OHOS (not int)"
  - "qmake needs OHOS host OS support in qt_functions.prf"
  - "Qt5 dbus module fails on OHOS (Operating system not supported)"
  - "No QPA platform plugin available (GUI apps won't run without ArkUI adaptation)"
  - "Abstract socket namespace needed for local socket IPC on OHOS"