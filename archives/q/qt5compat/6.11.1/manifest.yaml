# 版本级 manifest
# 文件位置: archives/q/qt5compat/6.11.1/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.11.1"

# 软件名
software: "qt5compat"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-21"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://mirrors.tuna.tsinghua.edu.cn/qt/official_releases/qt/6.11/6.11.1/submodules/qt5compat-everywhere-src-6.11.1.tar.xz"

  # 源码校验和
  sha256: "cfcb9fdaa051aad54b0e61b24ac5693b4887a86e07609f665fea67328a6f161b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DQT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "-DQT_BUILD_TESTS=ON"
    - "-DQT_BUILD_EXAMPLES=OFF"
    - "-DQT_BUILD_BENCHMARKS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qtbase/6.11.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Qt5Compat 使用 CMake 构建系统，需通过 Qt 官方配置器 qt-configure-module 配置"
  - "OHOS 平台需设置 QT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
  - "test_package 需通过 Qt6 模块系统寻找 Qt6::Core5Compat"
  - "tst_qtextcodec::toLocal8Bit() 在 OHOS 上因运行时符号解析差异失败（Qt6Core 共享库）"