# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5compat/6.11.1
homepage: "https://doc.qt.io/qt-6/qt5compat-index.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure -j1"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/auto/core5/codecs/qtextcodec/tst_qtextcodec.cpp
    source: qt5compat-6.11.1/tests/auto/core5/codecs/qtextcodec/tst_qtextcodec.cpp
    description: "Qt5Compat text codec tests"
    command: "./tst_qtextcodec"
  - file: tests/auto/core5/codecs/utf8/tst_utf8.cpp
    source: qt5compat-6.11.1/tests/auto/core5/codecs/utf8/tst_utf8.cpp
    description: "Qt5Compat UTF-8 codec tests"
    command: "./tst_utf8"
  - file: tests/auto/core5/io/qdebug/tst_qt5compat_qdebug.cpp
    source: qt5compat-6.11.1/tests/auto/core5/io/qdebug/tst_qt5compat_qdebug.cpp
    description: "Qt5Compat QDebug tests"
    command: "./tst_qt5compat_qdebug"
  - file: tests/auto/core5/sax/qxml/tst_qxml.cpp
    source: qt5compat-6.11.1/tests/auto/core5/sax/qxml/tst_qxml.cpp
    description: "Qt5Compat XML tests"
    command: "./tst_qxml"
  - file: tests/auto/core5/sax/qxmlinputsource/tst_qxmlinputsource.cpp
    source: qt5compat-6.11.1/tests/auto/core5/sax/qxmlinputsource/tst_qxmlinputsource.cpp
    description: "Qt5Compat XML input source tests"
    command: "./tst_qxmlinputsource"
  - file: tests/auto/core5/sax/qxmlsimplereader/tst_qxmlsimplereader.cpp
    source: qt5compat-6.11.1/tests/auto/core5/sax/qxmlsimplereader/tst_qxmlsimplereader.cpp
    description: "Qt5Compat XML simple reader tests"
    command: "./tst_qxmlsimplereader"
  - file: tests/auto/core5/serialization/json/tst_qt5compat_json.cpp
    source: qt5compat-6.11.1/tests/auto/core5/serialization/json/tst_qt5compat_json.cpp
    description: "Qt5Compat JSON serialization tests"
    command: "./tst_qt5compat_json"
  - file: tests/auto/core5/serialization/qtextstream/tst_qt5compat_qtextstream.cpp
    source: qt5compat-6.11.1/tests/auto/core5/serialization/qtextstream/tst_qt5compat_qtextstream.cpp
    description: "Qt5Compat QTextStream tests"
    command: "./tst_qt5compat_qtextstream"
  - file: tests/auto/core5/text/qregexp/tst_qregexp.cpp
    source: qt5compat-6.11.1/tests/auto/core5/text/qregexp/tst_qregexp.cpp
    description: "Qt5Compat QRegExp tests"
    command: "./tst_qregexp"
  - file: tests/auto/core5/text/qstringref/tst_qstringref.cpp
    source: qt5compat-6.11.1/tests/auto/core5/text/qstringref/tst_qstringref.cpp
    description: "Qt5Compat QStringRef tests"
    command: "./tst_qstringref"
  - file: tests/auto/core5/text/qstringbuilder/qstringbuilder1/tst_qstringbuilder1.cpp
    source: qt5compat-6.11.1/tests/auto/core5/text/qstringbuilder/qstringbuilder1/tst_qstringbuilder1.cpp
    description: "Qt5Compat QStringBuilder tests"
    command: "./tst_qt5compat_qstringbuilder1"
  - file: tests/auto/core5/tools/qlinkedlist/tst_qlinkedlist.cpp
    source: qt5compat-6.11.1/tests/auto/core5/tools/qlinkedlist/tst_qlinkedlist.cpp
    description: "Qt5Compat QLinkedList tests"
    command: "./tst_qlinkedlist"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 Qt6Core5Compat 库可链接"
    command: "./test_qt5compat"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 500