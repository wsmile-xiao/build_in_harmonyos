# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游 rinigus/qmlrunner 1.0.2 是无测试套件的单文件 Qt5 程序：
# 仓库仅含 qmlrunner.pro + src/main.cpp + LICENSE + README.md，
# 无 tests/ 目录、无 CTest/autotest 注册、qmake 工程无 check target。
# 按 R34/R51 以 consumer 视角补全功能级测试（test.sh）。

package: qmlrunner/1.0.2
homepage: "https://github.com/rinigus/qmlrunner"

# 上游测试命令 (无官方测试套件)
upstream_check_command: "qmake && make check（上游工程无 check target，无测试注册）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "consumer 级功能测试：offscreen QPA + 软件渲染后端下用 qmlrunner 加载真实 QML 窗口应用（Timer→Qt.quit 正例 ×2：含 -noscale/-path 组合），并以 4 个负例对照验证 CLI 契约（无参数 rc=255/未知选项 rc=253/重复应用名 rc=254/应用缺失 rc=254 及对应错误消息）"
    command: "test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
