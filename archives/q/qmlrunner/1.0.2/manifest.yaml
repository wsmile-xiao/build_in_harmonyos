version: "1.0.2"
software: qmlrunner
status: built
build_date: "2026-10-01"
build_system: cmake

source:
  url: "https://codeload.github.com/rinigus/qmlrunner/tar.gz/refs/tags/1.0.2"
  sha256: "9bc8c4242545e1d3b8efccc048a5b928cb32d334cb22c710dba70dbfafdef43b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=OHOS（CMakeToolchain 注入，E092）"
    - "-DQMLRUNNER_QT5_INCLUDE_DIRS / -DQMLRUNNER_QT5_LIB_DIRS（配方 generate() 从 qt5-qtbase/qt5-qtdeclarative 依赖包注入）"
    - "-DCMAKE_SKIP_RPATH=ON（避免 install 重写 RPATH 使 .codesign 失效，E077 同族）"
  dependencies:
    - qt5-qtbase/5.15.2.2
    - qt5-qtdeclarative/5.15.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"

knowledge_gained:
  - "CMake install 默认会在 install rpath 与 build rpath 不一致时原地重写 ELF 动态段；该修改使 OHOS 链接器写入的 .codesign 段失效，内核拒绝执行（EPERM: Operation not permitted），且 chmod 无法绕过。对纯可执行包用 CMAKE_SKIP_RPATH/SKIP_BUILD_RPATH/SKIP_INSTALL_RPATH 关闭 RPATH 后，安装产物与链接产物逐字节一致（md5 相同）且可执行；运行期库解析交给 conanrun 的 LD_LIBRARY_PATH（与 diffpdf 配方同款运行时模型）。同族知识 E077（签名失效需四步重签；设备侧无 /data/service/hnp 签名工具时首选避免修改）"
  - "GitHub codeload tar.gz URL 末段为 tag 名（无扩展名），Conan get() 必须显式 filename=\"qmlrunner-1.0.2.tar.gz\"，否则 BadZipFile（E483 推荐方案原样命中）"
  - "Qt5 QML 应用可在 OHOS PC 无显示运行：QT_QPA_PLATFORM=offscreen + QT_QUICK_BACKEND=software + QT_PLUGIN_PATH=<qt5-qtbase>/plugins + QML2_IMPORT_PATH=<qt5-qtdeclarative>/qml；QtQuick Window + Timer→Qt.quit 可完成完整 QML 加载与事件循环验证"

conan_adaptation:
  recipe: conanfile.py
  test_package: test_package/
  package_type: application
  commands_json: true

tests:
  upstream_tests: 0
  upstream_passed: 0
  upstream_test_in_build: false
  note: "上游无测试套件：源包仅 .gitignore/LICENSE/README.md/qmlrunner.pro/src/main.cpp，无 tests/ 目录、无 CTest 注册、qmake 工程无 check target；test_package 以 offscreen 平台补 13 条消费者断言（2 正例 QML 真实加载 + 4 负例 CLI 契约），证据见 test_package/MANIFEST.yml（R51）"

