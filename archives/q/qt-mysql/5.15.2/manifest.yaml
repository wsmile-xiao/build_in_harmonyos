version: "5.15.2"
status: built
build_date: "2026-06-12"

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
  tar_format: tar.xz

build:
  system: custom
  configure_options:
    - "Manual compilation: clang++ with Qt5 5.12.12 headers and MariaDB libmariadb"
  dependencies:
    - "qt5-qtbase/5.12.12"
    - "mariadb"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-plugins-sqldrivers-mysql-qsql_mysql.cpp.patch"

knowledge_gained:
  - "Qt5 mysql plugin requires Qt5-specific headers; installed headers are mixed Qt5/Qt6"
  - "Mixed Qt5/Qt6 header environment requires explicit Qt5 header paths for plugin compilation"
  - "libqsqlmysql.so supports QMYSQL3, QMYSQL, and QMARIADB keys simultaneously"
  - "Driver links against libmariadb.so (MariaDB client library) rather than libmysqlclient.so"
  - "Runtime dlopen testing blocked by OHOS ELF signing requirement (platform limitation)"