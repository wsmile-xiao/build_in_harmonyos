software: qt-mysql
display: "Qt5 MySQL Driver"
description: "Qt5 MySQL/MariaDB SQL driver plugin (QMYSQLDriver)"
category: db
homepage: "https://download.qt.io/archive/qt/5.15/"
license: LGPL-2.1
build_system: custom

ohos_adaptation:
  key_points:
    - "Qt5 SQL driver plugin需要手动clang++编译，无法使用qmake构建系统（OHOS混合Qt5/Qt6环境）"
    - "需要Qt5 Core/Sql开发库和MariaDB libmariadb开发库"
    - "运行时dlopen加载需要ELF签名（平台限制）"
    - "libqsqlmysql.so支持QMYSQL3/QMYSQL/QMARIADB三种驱动键"
  common_dependencies:
    - qt5-qtbase
    - mariadb

versions:
  "5.15.2":
    status: built
    build_date: "2026-06-12"