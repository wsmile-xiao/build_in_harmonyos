software: qsv
version: "homebrew"
status: built
build_date: "2026-06-03"

source:
  url: "https://github.com/dathere/qsv/releases/download/20.1.0/qsv-20.1.0-aarch64-unknown-linux-gnu.zip"
  sha256: ""
  tar_format: zip

build:
  system: custom
  configure_options:
    - "patchelf --replace-needed libc.so.6 libgcompat.so.0"
    - "patchelf --replace-needed libm.so.6 libgcompat.so.0"
    - "patchelf --replace-needed libpthread.so.0 libgcompat.so.0"
    - "patchelf --replace-needed libdl.so.2 libgcompat.so.0"
    - "patchelf --replace-needed ld-linux-aarch64.so.1 libglibc-shim.so"
    - "patchelf --set-interpreter /lib/ld-musl-aarch64.so.1"
    - "patchelf --set-rpath ~/usr/local/lib"
  dependencies:
    - gcompat/homebrew
    - libgcc_s/homebrew
  cc: N/A
  cxx: N/A

packaging:
  format: tar.gz
  files:
    - bin/qsv
    - bin/qsvlite
    - bin/qsvdp
    - lib/libgcompat.so.0
    - lib/libglibc-shim.so
    - lib/libucontext.so.1
    - lib/libobstack.so.1
    - lib/libgcc_s.so.1

knowledge_gained:
  - "glibc-dynamic Rust 二进制可通过 gcompat 适配在 musl HarmonyOS 上运行"
  - "qsv 无 aarch64-unknown-linux-musl 版本，需使用 glibc-dynamic + gcompat 方案"
