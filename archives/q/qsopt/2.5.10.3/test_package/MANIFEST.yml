# test_package/MANIFEST.yml — qsopt 2.5.10.3
# 上游官方测试声明文件（R51 三步法，证据见 notes.md）

package: qsopt/2.5.10.3
homepage: "https://github.com/jonls/qsopt-ex"

# 上游测试清点（清点证据见 notes.md「上游测试」节）:
#   1) Makefile.am: TESTS = tests/test_qs（TAP 套件，8 项检查）+ tap-driver.sh
#   2) tests/: test_qs.c（TAP 8 项）、eg_sloan.c（noinst 演示程序，非测试）
#   3) 仓库: .travis.yml 曾跑 make check（上游 CI 同源测试）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/test_qs.c
    source: qsopt-ex-2.5.10.3/tests/test_qs.c
    description: >
      TAP 套件 8 项检查：加载上游测试 LP（max 3x+2y+4z，
      s.t. 3x+2y+z<=12, 5x+y=10, x>=2, y free, 1<=z<=10）→ 行列计数 →
      精确求解（DUAL_SIMPLEX）→ 最优状态 QS_LP_OPTIMAL → 目标值精确等于 42
      → x/对偶数组 → LP 写出到 /dev/null。
    command: "make check"

test_package_tests:
  - file: test.c
    description: >
      消费者视角验证（2 个独立断言）：① 精确求解上游同款小 LP 返回
      QS_LP_OPTIMAL；② 最优值精确等于 42/1（mpq_cmp_ui），并校验
      x 变量数组可读。与上游 test_qs.c 同源（R51 对应关系）。
    command: "./test"

# 鸿蒙特有测试（规则 rule12）：独立检查项数口径，共 2 项，真实针对本包
# 两个 OHOS 适配点（conanfile.py 中的 aarch64-unknown-linux-ohos 三元组与
# 4 个 ac_cv_* 探针 pin），可在宿主环境对交叉构建产物直接执行（不运行
# OHOS 二进制），本地 OHOS 交叉与 CI 原生均真实执行。test_package 中仅
# 本清单两项计入鸿蒙特有口径，test.c 消费者断言不计入。
ohos_platform_tests:
  - file: ohos_platform_check.sh
    description: >
      鸿蒙特有检查 2 项（统一口径：独立检查项数）：
      H1 — libqsopt_ex.a 目标对象为 ELF64 AArch64（e_machine=EM_AARCH64），
      验证 OHOS armv8 目标 ABI 正确（--host=aarch64-unknown-linux-ohos）；
      H2 — 库内无 rpl_malloc/rpl_realloc/rpl_memcmp/rpl_strtod 符号引用，
      验证 AC_FUNC 探针 pin 生效（否则 config.h 定义无实现的 rpl_* 符号
      导致 OHOS 链接失败）。
    command: "sh ohos_platform_check.sh <libqsopt_ex.a>"

assertion_count: 2
# 统一测试计数口径：独立检查项数（skill2 第9节）
#   上游：8（make check TAP test case）
#   鸿蒙特有：2（H1/H2，ohos_platform_check.sh）
#   test_package 消费者断言：2（test.c，L1 证据，不计入鸿蒙口径）
upstream_test_count: 8
ohos_specific_test_count: 2
total_test_count: 10
