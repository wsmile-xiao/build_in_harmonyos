# 版本级 manifest — qsopt 2.5.10.3
# 遵循 ARCHIVE-SPEC v2.0（与 conandata.yml/conanfile.py 交叉校验）

version: "2.5.10.3"
software: qsopt
status: built
build_date: "2026-09-27"
build_system: autotools

source:
  url: "https://github.com/jonls/qsopt-ex/archive/refs/tags/v2.5.10.3.tar.gz"
  sha256: "ca221aac6532766f968eb35185f8aa44eca83ca8224a557d07e80f9ecfc664bf"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--with-pic"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "ac_cv_func_malloc_0_nonnull=yes"
    - "ac_cv_func_realloc_0_nonnull=yes"
    - "ac_cv_func_memcmp_working=yes"
    - "ac_cv_func_strtod=yes"
  dependencies:
    - gmp/6.3.0
    - zlib/1.3.1
    - bzip2/1.0.8
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-trace-h-ndebug-iftrace2.patch"

# 测试计数（统一口径：独立检查项数，与 test_package/MANIFEST.yml、notes.md 一致）
tests:
  upstream_count: 8        # make check TAP test case（tests/test_qs.c）
  ohos_specific_count: 2   # ohos_platform_check.sh H1（AArch64 ELF ABI）/ H2（无 rpl_* 符号）
  consumer_assertions: 2   # test.c（精确最优值 42/1），L1 证据，不计入鸿蒙口径
  total: 10                # 8 上游 + 2 鸿蒙（+2）

knowledge_gained:
  - "上游 tag tarball 不含生成的 configure/config.sub，需在 build() 先 autoreconf（conan Autotools 不会自动执行）"
  - "config.sub 由构建机 automake 生成：新 automake 已识别 linux-ohos；旧版需在 build() 幂等补丁（E072/E122 三处修改）"
  - "OHOS 用 --build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos（vendor 位非空，libtool linux* 分支才启用共享库，libopendbx 先例）"
  - "AC_FUNC_MALLOC/REALLOC/MEMCMP/STRTOD 在交叉视角 configure 下无法运行探针，需 pin 缓存变量，否则 config.h 定义无实现的 rpl_* 符号"
  - "AutotoolsToolchain 不聚合依赖 cpp_info，gmp/zlib/bzip2 的 -I/-L 需手动注入（extra_cflags/extra_ldflags）"
  - "esolver 为交互式演示程序，库包不安装 bin/（R38 库类型无需 commands.json）"
  - "上游 trace.h NDEBUG 分支漏定义 ILL_IFTRACE2（重复定义 ILL_IFTRACE），Release 构建必炸；需 0001 补丁（bugfix）"
