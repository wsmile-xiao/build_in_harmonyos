# 软件级 manifest — qsopt
# 遵循 ARCHIVE-SPEC v2.0

software: qsopt
display: "QSopt_ex"
description: "QSopt_ex — 精确有理数线性规划（LP）求解器库（C，GMP 精确算术）"
category: library
homepage: "https://github.com/jonls/qsopt-ex"
license: GPL-3.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 C Autotools 库（libqsopt_ex + 头文件 include/qsopt_ex/），GMP 为硬依赖（configure AC_MSG_ERROR）"
    - "tag tarball 为 autoreconf 源（无预生成 configure/config.sub）：conan build() 先 autoreconf，再对生成的 config.sub 做幂等 linux-ohos 三元组补丁（E072/E122：basic_os 映射 + OS 白名单 + kernel-os 白名单，新 automake 已原生支持则跳过）"
    - "OHOS 使用 --build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos（vendor 位非空，libtool linux* 分支才启用共享库）；libopendbx 已发布同款先例"
    - "交叉视角 configure 下 AC_RUN_IFELSE 探针无法执行：pin ac_cv_func_malloc_0_nonnull/ac_cv_func_realloc_0_nonnull/ac_cv_func_memcmp_working/ac_cv_func_strtod=yes（否则定义无实现的 rpl_* 符号导致链接失败）"
    - "AutotoolsToolchain 不聚合依赖 cpp_info：gmp/zlib/bzip2 的 -I/-L 经 extra_cflags/extra_ldflags 手动注入"
    - "默认静态库（与 gmp 同款）；shared=True 时 OHOS 需 SDK llvm/lib -L 供 libtool 共享探测（配方内置探测）"
    - "esolver 交互式演示程序不打包（库类型，R38 无需 commands.json）；test_package 用与上游 test_qs.c 同源 LP 断言精确最优值 42/1"
  common_dependencies:
    - "gmp/6.3.0"
    - "zlib/1.3.1"
    - "bzip2/1.0.8"

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.5.10.3":
    status: built
    build_date: "2026-09-27"
