package: qthttpserver/6.11.1
homepage: https://www.qt.io/
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

excluded_upstream_tests:
  - command: "./tst_qhttpserver (localSocket case)"
    reason: "OHOS cannot create QLocalServer (listen fails); the upstream localSocket case is skipped via QSKIP when no local server could be created."

upstream_tests:
  - file: tests/auto/qabstracthttpserver/tst_qabstracthttpserver.cpp
    source: qthttpserver-everywhere-src-6.11.1/tests/auto/qabstracthttpserver/tst_qabstracthttpserver.cpp
    description: "Upstream QAbstractHttpServer tests"
    command: "./tst_qabstracthttpserver"
  - file: tests/auto/qhttpserver/tst_qhttpserver.cpp
    source: qthttpserver-everywhere-src-6.11.1/tests/auto/qhttpserver/tst_qhttpserver.cpp
    description: "Upstream QHttpServer API and routing tests"
    command: "./tst_qhttpserver"
  - file: tests/auto/qhttpservermultithreaded/tst_qhttpservermultithreaded.cpp
    source: qthttpserver-everywhere-src-6.11.1/tests/auto/qhttpservermultithreaded/tst_qhttpservermultithreaded.cpp
    description: "Upstream multithreaded server tests"
    command: "./tst_qhttpservermultithreaded"
  - file: tests/auto/qhttpserverrequestfilter/tst_qhttpserverrequestfilter.cpp
    source: qthttpserver-everywhere-src-6.11.1/tests/auto/qhttpserverrequestfilter/tst_qhttpserverrequestfilter.cpp
    description: "Upstream request-filter tests"
    command: "./tst_qhttpserverrequestfilter"
  - file: tests/auto/qhttpserverresponder/tst_qhttpserverresponder.cpp
    source: qthttpserver-everywhere-src-6.11.1/tests/auto/qhttpserverresponder/tst_qhttpserverresponder.cpp
    description: "Upstream responder tests"
    command: "./tst_qhttpserverresponder"
  - file: tests/auto/qhttpserverresponse/tst_qhttpserverresponse.cpp
    source: qthttpserver-everywhere-src-6.11.1/tests/auto/qhttpserverresponse/tst_qhttpserverresponse.cpp
    description: "Upstream response tests"
    command: "./tst_qhttpserverresponse"
  - file: tests/auto/qhttpserverrouter/tst_qhttpserverrouter.cpp
    source: qthttpserver-everywhere-src-6.11.1/tests/auto/qhttpserverrouter/tst_qhttpserverrouter.cpp
    description: "Upstream router tests"
    command: "./tst_qhttpserverrouter"
test_package_tests:
  - file: test_qthttpserver.cpp
    description: "Construct a QHttpServer object and verify its initial state"
    command: "./test_qthttpserver"
assertion_count: 1
