software: qthttpserver
version: "6.11.1"
status: pending
build_system: cmake
source_url: https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qthttpserver-everywhere-src-6.11.1.tar.xz
dependencies:
  - qtbase-gui/6.11.1
configure_options:
  - QT_BUILD_TESTS=ON
  - QT_BUILD_EXAMPLES=OFF
  - QT_BUILD_BENCHMARKS=OFF
  - QT_BUILD_DOCS=OFF
  - QT_QMAKE_TARGET_MKSPEC=harmonyos-clang
knowledge_gained:
  - Qt modules require qtbase-gui's native Qt6Config.cmake and Qt6BuildInternals package files.
  - Consumer tests must find Qt6HttpServer directly because the module and qtbase-gui use separate Conan package prefixes.
  - The separate qtbase-gui prerequisite PR must publish the dependency first.
  - The upstream module_includes CMake self-test uses NO_DEFAULT_PATH sub-build lookups, so the recipe exposes qtbase-gui's Qt6Config.cmake through QT_BUILD_CMAKE_PREFIX_PATH.
  - OHOS cannot create QLocalServer (listen fails), so the upstream localSocket test is skipped with QSKIP when no local server could be created.
