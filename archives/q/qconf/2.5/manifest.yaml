# 版本级 manifest — qconf 2.5
# 遵循 ARCHIVE-SPEC v2.0

version: "2.5"
software: "qconf"
status: built
build_date: "2026-10-01"
build_system: qmake

source:
  url: "https://github.com/psi-im/qconf/archive/refs/tags/v2.5.tar.gz"
  sha256: "b9465797b477e7a85d8a787fc5af3b3c7437494938ad092e912eccc045447f9c"
  tar_format: tar.gz

build:
  system: qmake
  configure_options:
    - "-spec linux-clang"
    - "QMAKE_STRIP= (留空，OHOS 加载器拒绝 stripped ELF)"
  dependencies:
    required:
      - "qt5-qtbase/5.15.2.2 (published)"
    transitive:
      - "zlib/1.3.1 (published)"
      - "dbus/1.14.10 (published)"
      - "expat/2.8.2 (published)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "qconf 2.5 = QConf（github.com/psi-im/qconf，tag v2.5 = a06a3ca），Qt5 控制台工具，qmake 工程；唯一强制第三方依赖 = qt5-qtbase（Qt5Core + Qt5Xml + qmake/moc/rcc/uic），不依赖 libX11/libXext（默认走 conf4.* Qt5 路径）"
  - "qt5-qtbase/5.15.2.2 包内 mkspecs/modules/*.pri 记录**构建期**绝对路径（QT_MODULE_*_BASE、QT_TOOL.*.binary、include(<builddir>/mkspecs/modules-inst/...)）：qmake 报 Cannot read .../modules-inst/qt_lib_*.pri、QT += core xml 解析为 Unknown module(s)、生成的 Makefile 把 <stale>/bin/rcc 写成 qrc 依赖致 make 直接失败；_setup_qmake_modules() 复制并按正则 /[^\\s\"'()]*?/p/b/[^/\\s\"'()]+/[bp] 把构建期 conan 私有前缀整体改写为真实 package 目录，经 QMAKEMODULES 暴露"
  - "qt5-qtbase 包内 bin/qt.conf 的 [Paths] Prefix 同样是构建期路径 → QT_INSTALL_BINS/LIBS 解析到已消失目录（rcc/moc/uic 不可执行、产物 RUNPATH 失效）；用自建 qt.conf（Prefix/HostPrefix=真实 package）配 qmake -qtconf 修复（不可带 [EffectivePaths] Prefix=..，否则找不到 mkspec），并用命令行 QMAKE_RCC/QMAKE_MOC/QMAKE_UIC 兜底（命令行赋值优先级最高）"
  - "qconf 运行期以 QCoreApplication::applicationDirPath()/conf + /modules 做就地检测（looksLikeInPlace），非就地时回退 DATADIR/qconf/conf 或 ./conf；Conan 包无固定安装前缀，故 conf/ 与 modules/ 随二进制装到 bin/ 下（包自包含且与 cwd 无关）；conan copy() 保留匹配到的相对路径，dst 需给 bin/ 而非 bin/conf"
  - "R47 lang-preflight 对无构建 manifest 的 qmake 工程（C 辅助源 + C++ 主体）会误判 mixed：lang_detect 未合并 c/cpp 计数且不识别 qmake，遇此须按附录 D.4 复核主体后继续（草稿 DRAFT-qconf-2.5-langpreflight-c-cpp-share-misdetect）"
  - "make -j>1 在本环境报 jobserver mkfifo 错误（文件系统不支持 mkfifo），用 -j1"
  - "本机 W3 的 JC 杂项门禁为**仓库级 full 扫描**：其他软件已跟踪的 .build-closed/.staging-verified 会造成 JC1/JC5 失败并阻断 L0/L1（与 qconf 无关）；qconf 自身无已跟踪隐藏文件"

failure_reason: null
