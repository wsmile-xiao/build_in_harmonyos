# 软件级 manifest — qconf
software: qconf
display: "QConf"
description: "为 qmake 工程生成 configure 脚本的 Qt5 命令行工具（Qt Core + Qt Xml）"
category: devel
homepage: "https://github.com/psi-im/qconf"
license: GPL-2.0-or-later
build_system: qmake

ohos_adaptation:
  key_points:
    - "Qt5 控制台工具（QT -= gui / QT += xml / CONFIG += console），唯一强制第三方依赖 = qt5-qtbase/5.15.2.2（Qt5Core + Qt5Xml + qmake/moc/rcc）"
    - "不依赖 libX11/libXext：v2.5 默认 conf.qt4=true 走 conf/conf4.*（Qt5 路径）；Qt3 遗留 conf/conf.pro 仅在 .qc 声明 <qt3> 时启用"
    - "qtbase 模块 .pri 记录构建期绝对路径 → _setup_qmake_modules() 复制并改写 QT_MODULE_*_BASE 与 include(<builddir>/mkspecs/modules-inst/…) 到包内路径，经 QMAKEMODULES 暴露"
    - "运行期数据（conf/ + modules/）随二进制装到 bin/ 下：qconf 以 applicationDirPath()/conf + /modules 做就地检测，Conan 包无固定前缀，故采用就地布局保证包自包含"
    - "产物 RPATH 指向构建期路径失效 → 运行期由 conanrun 环境提供 LD_LIBRARY_PATH"
    - "make -j>1 在本环境报 jobserver mkfifo 错误 → 用 -j1"
  common_dependencies:
    - "qt5-qtbase (published 5.15.2.2)"
    - "zlib (published 1.3.1)"
    - "dbus (published 1.14.10)"
    - "expat (published 2.8.2)"

versions:
  "2.5":
    status: built
    build_date: "2026-10-01"
    conan_ref: "qconf/2.5"
    note: "conan create + conan-verify 全绿（G0-G4 + L2/L4/L5），test_package 6/6 PASS，上游 4 个 examples/*.qc 样例全部执行通过；finish 的 W3 仅被仓库级 JC 杂项（其他软件已跟踪的运行时状态文件）阻断，与 qconf 无关"
