# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qtlocation/6.11.1
homepage: "https://doc.qt.io/qt-6/qtlocation-index.html"

# 上游测试命令: Qt 模块测试为 Qt Test (tst_*) 单元测试, 需 Qt6Test 基础设施;
# 本次适配构建 QT_BUILD_TESTS=OFF, 不执行上游 tst_* 测试。
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/auto/qplace/tst_qplace.cpp
    source: qtlocation-everywhere-src-6.11.1/tests/auto/qplace/tst_qplace.cpp
    description: "Upstream QPlace unit tests (not executed in this adaptation build)"
    command: "./tst_qplace"
  - file: tests/auto/qgeoserviceprovider/tst_qgeoserviceprovider.cpp
    source: qtlocation-everywhere-src-6.11.1/tests/auto/qgeoserviceprovider/tst_qgeoserviceprovider.cpp
    description: "Upstream QGeoServiceProvider unit tests (not executed in this adaptation build)"
    command: "./tst_qgeoserviceprovider"

test_package_tests:
  - file: test_qtlocation.cpp
    description: "Exercise QPlace/QPlaceCategory/QPlaceContactDetail/QGeoServiceProvider APIs"
    command: "./test_qtlocation"

assertion_count: 6
