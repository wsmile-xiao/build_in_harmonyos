package: qtquicktimeline/6.11.1
homepage: https://doc.qt.io/qt-6/qtquicktimeline-index.html
upstream_check_command: "ctest --test-dir build --output-on-failure -R '^(tst_qtquicktimeline|tst_blendtrees)$'"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure -R '^(tst_qtquicktimeline|tst_blendtrees)$'"

upstream_tests:
  - file: tests/auto/qtquicktimeline/tst_qtquicktimeline.cpp
    source: qtquicktimeline-everywhere-src-6.11.1/tests/auto/qtquicktimeline/tst_qtquicktimeline.cpp
    description: "Upstream Qt Quick Timeline core test"
    command: "./tst_qtquicktimeline"
  - file: tests/auto/qtquicktimeline_blendtrees/tst_blendtrees.cpp
    source: qtquicktimeline-everywhere-src-6.11.1/tests/auto/qtquicktimeline_blendtrees/tst_blendtrees.cpp
    description: "Upstream Qt Quick Timeline blend trees test"
    command: "./tst_blendtrees"

test_package_tests:
  - file: test_qtquicktimeline.cpp
    description: "Load the QtQuick.Timeline QML module through QQmlEngine and verify the plugin resolves"
    command: "./test_qtquicktimeline"
assertion_count: 1
