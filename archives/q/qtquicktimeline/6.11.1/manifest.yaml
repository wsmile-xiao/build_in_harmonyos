software: qtquicktimeline
version: "6.11.1"
status: pending
build_system: cmake
build_date: ""

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtquicktimeline-everywhere-src-6.11.1.tar.xz"
  sha256: "af53f643fd9e4045e1b9ba919998e5c048ca877452c08036c9c8c5ee07ea8c27"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "QT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "BUILD_SHARED_LIBS=ON"
    - "QT_BUILD_TESTS=ON"
    - "QT_BUILD_TESTS_BY_DEFAULT=OFF"
    - "QT_BUILD_EXAMPLES=OFF"
    - "QT_BUILD_BENCHMARKS=OFF"
    - "QT_BUILD_DOCS=OFF"
  dependencies:
    - qtbase/6.11.1
    - qtdeclarative/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Qt Quick Timeline is a QML-centric module: libQt6QuickTimeline registers the QtQuick.Timeline QML types and requires Qt Core, Qml and Quick."
  - "The module root CMakeLists aborts when Qt::Quick is missing or the Qt::Core cborstreamreader/cborstreamwriter features are disabled; both are satisfied by qtbase/qtdeclarative in main."
  - "The upstream auto tests (tst_qtquicktimeline, tst_blendtrees) are QML tests that run with the offscreen QPA platform plugin."
  - "qtdeclarative host tools require qtbase/qtdeclarative lib dirs on LD_LIBRARY_PATH during the build."
