software: qtquicktimeline
version: "6.8.2"
status: built
build_date: "2026-09-01"

source:
  url: "https://download.qt.io/official_releases/qt/6.8/6.8.2/submodules/qtquicktimeline-everywhere-src-6.8.2.tar.xz"
  sha256: "c33dbceed9fabb3d7f6731a68aee602bad5a04bb6f0a473792e61858c0bc1aaa"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DQT_BUILD_EXAMPLES=OFF"
    - "-DQT_BUILD_TESTS=ON"
    - "-DQT_BUILD_TESTS_BY_DEFAULT=ON"
    - "-DCMAKE_PREFIX_PATH=<qtbase package folder (set by generate())>"
  dependencies:
    - qtbase/6.8.2
    - qtdeclarative/6.8.2
    - qtshadertools/6.8.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Qt Quick Timeline requires Qt Quick and Qt Core CBOR stream reader/writer features."
  - "The recipe declares qtbase/6.8.2, qtdeclarative/6.8.2, and qtshadertools/6.8.2 as Conan requirements; generate() points CMake at the resolved package folders with explicit Qt6_DIR/Qt6Qml_DIR/Qt6Quick_DIR."
  - "R40 manual validation marker: manual adaptation-completeness confirmation is required. Headless CI covers build, linkage, and QML type loading only; Qt Quick Timeline animation behavior requires an OpenHarmony PC display session. Keep status built until manual validation is complete."
  - "Upstream auto tests are enabled with BUILD_TESTING=ON and QT_BUILD_TESTS=ON, then run by ctest with offscreen/software Qt Quick settings when the target binaries can execute."

test_package:
  assertion_count: 1
  pass_rate: "1/1 test_package case passes only when target execution is available; cross profiles compile and link the consumer executable and skip runtime execution without echo/true placeholders."
