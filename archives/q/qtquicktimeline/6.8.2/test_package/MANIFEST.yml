package: qtquicktimeline/6.8.2
homepage: "https://doc.qt.io/qt-6/qtquicktimeline-index.html"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ctest --test-dir <build_folder> --output-on-failure"

upstream_tests:
  - file: tests/auto/qtquicktimeline
    source: qtquicktimeline-everywhere-src-6.8.2/tests/auto/qtquicktimeline
    description: "Qt Quick Timeline auto tests; enabled by BUILD_TESTING=ON and QT_BUILD_TESTS=ON."
    command: "ctest"
    status: enabled
  - file: tests/auto/qtquicktimeline_blendtrees
    source: qtquicktimeline-everywhere-src-6.8.2/tests/auto/qtquicktimeline_blendtrees
    description: "Blend tree auto tests; enabled by BUILD_TESTING=ON and QT_BUILD_TESTS=ON."
    command: "ctest"
    status: enabled

test_package_tests:
  - file: test_qtquicktimeline.cpp
    description: "Consumer CMake smoke test that links against Qt6::QuickTimeline, loads the QtQuick.Timeline QML import, and instantiates a Timeline object."
    command: "./test_qtquicktimeline"

assertion_count: 1
upstream_total_case_count: 2
upstream_enabled_case_count: 2
upstream_excluded_case_count: 0
upstream_manual_case_count: 2
pass_rate: "2 upstream auto CTest targets enabled (tst_qtquicktimeline, tst_blendtrees); tests/manual has 2 .pro programs (timelineTestApp, keyframeBinaryGenerator) that are not built/run by headless CI; pass rate pending OpenDesk log"
