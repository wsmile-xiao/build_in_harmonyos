# test_package/MANIFEST.yml — 上游测试与新增测试声明（CI L0e 校验）

package: qsopt-ex/2.5.10.3
homepage: https://github.com/jonls/qsopt-ex

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check（LOG_DRIVER 经 POSIX /bin/sh 执行上游 tap-driver.sh）"

# 上游注册测试（automake TESTS = tests/test_qs；TAP plan 1..8，源码宏 TEST_COUNT=8）
upstream_tests:
  - name: "tap-test_qs"
    source: tests/test_qs.c
    description: "上游唯一注册测试：加载 LP → 精确求解 → 断言最优值/解/对偶/LP 写盘，TAP 8 条"
    count: 8

upstream_test_total: 8

# 新增/鸿蒙特有测试（不并入上游分母）
test_package_tests:
  - file: test.c
    description: "消费者：仅用公开头与公开 API 加载并精确求解同一 LP，断言最优值 14 与解 (1,4)"
    command: "./qsopt_ex_test"
    count: 6
  - file: test_ohos_solve.sh
    description: "鸿蒙特有：安装后的 esolver 求解自备 .map 样例（LP/MPS 标准格式），产物非空+预期标记断言；样例 sha256 与任务留档 sources/fixtures/ 锚定一致"
    command: "sh test_ohos_solve.sh"
    count: 14

# test_package 断言合计（= PR 模板「鸿蒙特有测试」行）
assertion_count: 20
