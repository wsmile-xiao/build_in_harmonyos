# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.5.10.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.5.10.3"

# 软件名
software: "qsopt-ex"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jonls/qsopt-ex/archive/refs/tags/v2.5.10.3.tar.gz"

  # 源码校验和
  sha256: "ca221aac6532766f968eb35185f8aa44eca83ca8224a557d07e80f9ecfc664bf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--disable-shared"
    - "--enable-static"
    - "ac_cv_lib_z_gzopen=no"
    - "ac_cv_lib_bz2_BZ2_bzopen=no"
  # 说明: --build 用于绕开 config.guess 对 HarmonyOS uname 的识别失败；
  #       shared/static 跟随配方 options（默认静态库）；
  #       两个 ac_cv_* 缓存变量按 W0 可选依赖口径禁用 zlib/bzip2 压缩写盘
  #       （调用点全在 #ifdef 守卫内），保证静态库与消费者链接零隐式依赖。

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "gmp/6.3.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-esolver-long-options-for-smoke-test.patch"
  - "0002-trace-h-define-ILL_IFTRACE2-under-NDEBUG.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "automake TAP 测试经 tap-driver.sh 走 bash 时组 fd3 重定向失效（sh: >&3: bad file descriptor → ERROR + 0 字节日志），make check 必须把 LOG_DRIVER 换成 POSIX /bin/sh 才有真实产物" # knowledge_ref: E675
  - "HMDFS 下 mktemp 强制 0700 落盘 2700（属主映射后不可写），autoreconf 之后需把 configure 的 config.status 临时目录强制走 autoconf 的 mkdir 回退（落 2771 可写）" # knowledge_ref: E114
  - "config.guess 不认 HongMeng/HarmonyOS uname，autotools 包必须显式 --build=aarch64-unknown-linux-gnu" # knowledge_ref: E160
