package: qscintilla2/2.14.1
homepage: "https://www.riverbankcomputing.com/software/qscintilla/"

upstream_check_command: "qmake example/application.pro && make; qmake cfgtest_Qsci.pro && make && ./cfgtest_Qsci qscintilla-version.txt"
upstream_test_in_build: false
upstream_test_command: "recipe package() builds upstream example/application.pro, starts it once with QT_QPA_PLATFORM=offscreen, then compiles and runs Python/config-tests/cfgtest_Qsci.cpp"

upstream_tests:
  - file: example/
    source: QScintilla_src-2.14.1/example
    description: "Upstream Qt example application; built against the packaged QScintilla headers/library and started once with QT_QPA_PLATFORM=offscreen. Timeout after startup is accepted because this upstream example is interactive and does not exit by itself."
    command: "qmake application.pro && make && QT_QPA_PLATFORM=offscreen timeout 5s ./application || test $? -eq 124"
    status: enabled
  - file: Python/config-tests/cfgtest_Qsci.cpp
    source: QScintilla_src-2.14.1/Python/config-tests/cfgtest_Qsci.cpp
    description: "Python binding configuration probe for QScintilla headers and library."
    command: "compile/link probe"
    status: enabled

test_package_tests:
  - file: test_qscintilla2.cpp
    description: "Consumer CMake smoke test that includes Qsci/qsciglobal.h, checks QSCINTILLA_VERSION_STR, links qscintilla2_qt6 and Qt6::Widgets directly from the Conan package folders, and creates a QsciScintilla widget; QsciPrinter is omitted because OHOS qtbase disables PrintSupport."
    command: "./test_qscintilla2"

assertion_count: 2
upstream_total_case_count: 2
upstream_enabled_case_count: 2
upstream_excluded_case_count: 0
upstream_manual_case_count: 0
pass_rate: "OpenDesk round8 target log required: upstream example and cfgtest are enabled in the recipe; test_package case passes when target execution is available with qtbase dependency libs, while cross profiles compile and link the consumer executable."
