software: qscintilla2
version: "2.14.1"
status: partial
build_date: "2026-07-19"

source:
  url: "https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz"
  sha256: "dfe13c6acc9d85dfcba76ccc8061e71a223957a6c02f3c343b30a9d43a4cdd4d"
  tar_format: tar.gz

build:
  system: qmake
  configure_options:
    - "CONFIG+=release"
    - "INSTALL_ROOT=<package_folder>"
  dependencies:
    - qtbase/6.11.1 (Conan dependency, qmake and Qt 6 Widgets; OHOS qtbase disables PrintSupport, so QsciPrinter support is omitted)
  cc: clang
  cxx: clang++

patches_applied:
  - "src/qscintilla.pro and src/features*/*.prf: conditionalize QtPrintSupport with qtHaveModule(), exclude qsciprinter sources when absent, and remove the installed Qsci/qsciprinter.h when qtbase has no PrintSupport"

knowledge_gained:
  - "QScintilla 2.14.1 builds through qmake and names the Qt 6 library qscintilla2_qt6."
  - "qmake and the Qt 6 headers/libs are consumed from the qtbase/6.11.1 Conan dependency; the qmake install step uses INSTALL_ROOT for staging, then the recipe normalizes the staged Qt prefix into the Conan package folder."
  - "The recipe builds the upstream example/application.pro against the packaged QScintilla headers/library and starts it once with QT_QPA_PLATFORM=offscreen; timeout after startup is treated as successful interactive-GUI launch coverage."
  - "The recipe also compiles and runs upstream Python/config-tests/cfgtest_Qsci.cpp, validating the packaged Qsci/qsciglobal.h version output."
  - "The package test creates a QsciScintilla widget and verifies text operations using Qt from the qtbase dependency; the test_package avoids CMakeDeps for qscintilla2 because qtbase uses cmake_find_mode=none and links qscintilla2_qt6 manually. Full rendering and input behavior still require manual validation on an OpenHarmony PC display session."

test_package:
  assertion_count: 2
  pass_rate: "OpenDesk round8 target log required: upstream example and cfgtest are now part of the recipe; test_package case runs with qtbase dependency libs when target execution is available, while cross profiles compile and link the consumer executable."
