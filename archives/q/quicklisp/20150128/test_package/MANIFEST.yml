# test_package/MANIFEST.yml
# 上游测试声明文件（CI 门禁 L0e 要求存在）
#
# ── 上游测试清点（R51 三步法 · 第一步）──────────────────────────────
# 上游仓库: https://github.com/quicklisp/quicklisp-bootstrap
# tag     : version-2015-01-28
# 上游文件清单: LICENSE.txt / Makefile / README.txt / quicklisp.lisp
#
# 上游 Makefile 全文（137 bytes）:
#     all:
#
#     tag:
#     	test -z "`git status -s quicklisp.lisp`"
#     	git tag version-`grep 'defvar qlqs-info:.version.' quicklisp.lisp | cut -d\" -f 2`
#
# 结论：**上游没有任何自动化测试套件**
#   - 无 tests/ 目录、无 ctest 注册、无 pytest/unittest、无 `check`/`test` make 目标
#     （`make -n check` -> "No rule to make target 'check'"；`make -n test` 同样）
#   - `all:` 为空目标（无构建、无测试）；`tag:` 只是发版打 tag（依赖 git 工作区干净）
#   - Debian 源码包同样无测试入口（debian/rules 仅 `dh $@`，无 override_dh_auto_test）

package: quicklisp/20150128
homepage: "https://www.quicklisp.org"

# 上游测试命令探测（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check  # 上游无此目标 -> 'No rule to make target check'"
upstream_test_command: ""

# conanfile.py build() 是否集成上游测试 —— 否：上游无可执行的自动化测试
upstream_test_in_build: false

# 上游真实测试/使用入口（README.txt 给出的唯一入口）
upstream_tests:
  - file: quicklisp.lisp
    source: quicklisp-bootstrap-version-2015-01-28/quicklisp.lisp
    description: >-
      上游 README.txt 的用法即「启动 Lisp，然后 (load quicklisp.lisp)」。
      加载成功后应打印 quickstart 横幅并暴露 (quicklisp-quickstart:install)。
      这是上游唯一的功能入口，无独立测试程序。
    command: "ecl -norc -eval '(load \"quicklisp.lisp\")' -eval '(print qlqs-info:*version*)' -eval '(quit)'"

# test_package 中自带的消费者测试（真实执行被测物）
test_package_tests:
  - file: test.sh
    description: >-
      4 个用例：pkg-layout（文件/大小/sha256）、lisp-content（内容标记+S-表达式结构）、
      ohos-env-helper（OHOS: QUICKLISP_HOME 的 HOME 缺失回退）、
      ohos-ecl-load（OHOS/armv8: ECL 实际加载 quicklisp.lisp 并断言版本 2015-01-28）
    command: "sh test.sh <quicklisp_pkg_folder> <ecl_pkg_folder>"

# 断言总数（test.sh 内实际断言点）
assertion_count: 18
