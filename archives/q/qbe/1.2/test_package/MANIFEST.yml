# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_qbe.sh
    description: "Runs the packaged qbe: -h usage and -t? default target, compiles two minimal SSA fixtures to arm64 assembly, links and runs them natively with the C compiler, compares stdout (hello) and exit code (42), and checks invalid SSA is rejected"
    command: "bash test_package/test_qbe.sh"

# 测试断言总数: 12 条命令行断言 (见 test_qbe.sh 的 fail 点与 set -e 守卫)
assertion_count: 12
