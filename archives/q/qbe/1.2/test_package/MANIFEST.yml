package: qbe/1.2
homepage: "https://c9x.me/compile/"

# make check == tools/test.sh all (the recipe invokes the driver directly
# with TMPDIR/CC set); the 14 underscore-prefixed .ssa files are excluded
# by the upstream glob [!_]*.ssa and are never part of `make check`.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "TMPDIR=<build-folder>/qbe-test-tmp CC=<conan-conf-c-compiler> sh tools/test.sh all"
upstream_tests:
  - name: abi1.ssa
    description: "SSA fixture with embedded C driver linked by cc; executed natively on the device after `qbe` emits arm64 assembly; stdout diff"
