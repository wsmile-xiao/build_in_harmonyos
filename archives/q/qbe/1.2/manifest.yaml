software: qbe
version: "1.2"
status: built
build_date: "2026-09-16"
build_system: "makefile"
conan_ref: "qbe/1.2"

source:
  url: "https://c9x.me/compile/release/qbe-1.2.tar.xz"
  sha256: "a6d50eb952525a234bf76ba151861f73b7a382ac952d985f2b9af1df5368225d"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "make -j1 SHELL=sh CC=<conan-conf-c-compiler> CFLAGS=\"-std=c99 -O2 -g -Wall -Wextra -Wpedantic\""
    - "TMPDIR=<build-folder>/qbe-test-tmp CC=<conan-conf-c-compiler> sh tools/test.sh all"
  dependencies: []
  cc: clang
  cxx: N/A

patches_applied:
  - "0001-tools-test.sh.patch"

knowledge_gained:
  - "qbe is a self-contained C99 compiler backend (SSA -> amd64/arm64/rv64 assembly) built by a plain POSIX Makefile with no external dependencies"
  - "HarmonyOS /tmp is read-only; the upstream test driver tools/test.sh hardcodes tmp=/tmp/qbe.zzzz, which makes 49 of its 50 default tests fail with \"cannot open '/tmp/qbe.zzzz.s'\" before any codegen runs"
  - "Minimal portable fix: tmp=${TMPDIR:-/tmp}/qbe.zzzz in tools/test.sh keeps the upstream default and lets the recipe point the scratch dir into the build folder"
  - "On aarch64 the generated config.h selects Deftgt T_arm64, so the native device path runs the arm64 backend end-to-end: SSA -> assembly -> clang -> native execution -> output/return-code comparison"
  - "make check == tools/test.sh all executes 50 of the 64 shipped .ssa fixtures (14 underscore-prefixed files are excluded by the upstream glob [!_]*.ssa); dark.ssa is skipped by an upstream first-line directive on arm64"
  - "The recipe links its C test drivers with -lpthread successfully on OHOS clang 15.0.4 and does not use the cross/qemu branch"

# ============================================================
# 补丁生成（工具写入）
# ============================================================

patch_classification:
  - file: 0001-tools-test.sh.patch
    type: portability
    platform_only: false
    guard: 'none'
