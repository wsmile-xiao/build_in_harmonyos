software: qt5-qtcharts
version: 5.15.2
status: built
build_date: 2026-09-17
build_system: qmake
# qmake 从依赖的 qt5-qtbase Conan 包中取得（configure/build 期由 conanfile.py
# 注入 PATH 与 mkspecs），不依赖任何本机手工安装的 Qt prefix。
configure_options:
  - "qtcharts.pro"
compiler: clang++
platform: aarch64-linux-ohos
dependencies:
  - qt5-qtbase 5.15.2.2
  - qt5-qtdeclarative 5.15.2
# 交付形态为 Conan 包，安装前缀即 Conan 的 package_folder（运行期由 Conan 解析），
# 不是固定路径。package() 通过 `make install INSTALL_ROOT=<build_folder 内临时目录>`
# 落地产物后搬迁到 package_folder，并把 .pc/.la/.prl/cmake config 的 prefix 回指本包。
install_prefix: "<conan package_folder>"
products:
  - libQt5Charts.so.5.15.2
  - libqtchartsqml2.so
  - Qt5Charts headers
  - Qt5Charts QML plugin
knowledge_gained:
  - E543
  - E544
# 注：知识草稿原编号 E267/E268 与 main 已入库条目冲突（2026-08-10~12 批量入库
# E217-E311 占用了这两个编号），已重编号为 E543/E544（main 编号已至 E542）。

# 本配方不携带任何源码补丁。
# 说明：早期自动补丁生成器（per-file-difflib 比对 .orig 与 .work 目录）曾产出
# 8 个「补丁」，但经核对全部 8 个目标文件都不存在于上游 tarball——它们是 qmake
# 在构建目录里生成的产物（QtCharts.version / *_wrapper.sh / .qmake.stash /
# QtChartsDepends），其中 4 个还硬编码了本机临时前缀
# /storage/Users/currentUser/tmp/qt5charts-prefix，.qmake.stash 则冻结了
# 特定 SDK 版本与 clang 版本。这类文件不是源码修改，不应作为补丁交付，
# 且 conandata.yml 的 patches 一直为空（apply_conandata_patches 实为 no-op），
# 说明它们从未参与构建。已于 W4 审计打回后全部删除。
patches: none
# 注：`ohc finish` 的 refresh_patch 生成器（per-file-difflib，比对 .orig 与 .work
# 快照）每次运行都会把上述 qmake 生成物重新“发现”成补丁，并把本节改回
# method: per-file-difflib / patches_count: 8。它是框架脚本，不在本任务可改范围内，
# 因此每次 finish 后需手工清理 patches/*.patch 并把本节复位为下面的值。
patch_generation:
  method: none
  reason: "上游源码零修改；自动生成器产出的 8 项均为 qmake 构建产物，非源码补丁"
  patches_count: 0
