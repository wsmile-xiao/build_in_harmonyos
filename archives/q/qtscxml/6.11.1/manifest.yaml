software: qtscxml
version: "6.11.1"
status: built
build_system: cmake
build_date: "2026-08-30"

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtscxml-everywhere-src-6.11.1.tar.xz"
  sha256: "8e495245e5d1fe75de612c8a07e4043635407a1979bb1dd588f1751d1390203f"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "QT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "BUILD_SHARED_LIBS=ON"
    - "QT_BUILD_TESTS=ON"
    - "QT_BUILD_TESTS_BY_DEFAULT=OFF"
    - "FEATURE_system_zlib=OFF"
  dependencies:
    - qtbase/6.11.1
    - qtdeclarative/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "引入 qtdeclarative/6.11.1 后 scxml-qml/statemachine-qml/scxml-ecmascriptdatamodel 三个 QML feature 自动开启，上游 tests/auto 全量 17 个测试全部构建运行并 PASS；Core+Gui 库依赖不变（scxml 仅 Qt::Core，statemachine 加 Qt::Gui 因 qeventtransition）。"
  - "Qt6Config.cmake 解析 OPTIONAL_COMPONENTS（Qml/QuickTest）走 QT_ADDITIONAL_PACKAGES_PREFIX_PATH 内的 NO_DEFAULT_PATH find_package，不读 CMAKE_PREFIX_PATH → generate() 两个变量都须设为 qtbase+qtdeclarative package_folder 拼接。"
  - "CMAKE_MODULE_PATH 必须指向 qtbase 安装的 lib/cmake/Qt6/platforms（提供 Platform/HarmonyOS.cmake），否则 CMake 不识别 HarmonyOS 平台、跳过 SONAME/SOVERSION 处理。"
  - "QML 构建阶段的 host 工具（qmltyperegistrar/qmlcachegen/qmlimportscanner，随 qtdeclarative 包安装在 libexec/）在 conanbuild 环境运行，无 LD_LIBRARY_PATH → 报 Error loading shared library libQt6Core.so.6；build() 须把 qtbase+qtdeclarative 的 lib 目录加入 LD_LIBRARY_PATH（conanrun 只覆盖 test 阶段，不覆盖 build 阶段）。"
  - "QML/qmltest 测试不会自动注入 QML 模块导入路径：须设 QML2_IMPORT_PATH=<构建树 qml 目录>（QtScxml 与 QtQml/StateMachine 的 qmldir 暂存处）+qtdeclarative 包 qml/ 目录；QMLTEST 测试（QUICK_TEST_MAIN 可执行体）数据用工作目录=源码目录，无需 TESTDATA 部署。"
  - "QML 测试运行期共享库依赖由测试可执行体自身 RUNPATH 覆盖（Qt 构建树自动写入依赖 lib 目录），LD_LIBRARY_PATH 仍按惯例追加 qtbase/qtdeclarative/构建树 lib。"
  - "OHOS ELF 必须重新签名（llvm-objcopy 去 .codesign + binary-sign-tool sign -selfSign 1），否则 test_package 运行期加载失败；QML 插件（libdeclarative_scxmlplugin.so 等）同样走签名流程。"
  - "OHOS Clang 暴露 ARM crypto 特性但 arm_neon.h 缺 AES intrinsics，需 -DQT_NO_ARM_AES_INTRINSICS。"
  - "qtdeclarative 依赖 qtshadertools/6.11.1（conan 缓存外、需远端解析）→ CI 全量流程依赖设备外网（conan.cnb.cool）；离线环境下 conan create 图解析失败，须以离线 CMake 构建等价验证。"

