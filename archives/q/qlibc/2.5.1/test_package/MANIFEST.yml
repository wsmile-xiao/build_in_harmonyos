# test_package/MANIFEST.yml — qlibc 2.5.1 上游测试声明

package: qlibc/2.5.1
homepage: "https://github.com/wolkykim/qlibc"

# 上游测试命令（qunit 框架，make test / tests/launcher.sh 批量运行）
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make -C tests test"

# 上游实际运行的测试程序（10 个独立可执行用例，合计 74 个 TEST() 用例）
upstream_tests:
  - file: test_qstring.c
    source: qlibc-2.5.1/tests/test_qstring.c
    description: "qstring 字符串工具（trim/case/编码）"
    command: "./test_qstring"
  - file: test_qhashtbl.c
    source: qlibc-2.5.1/tests/test_qhashtbl.c
    description: "哈希表容器"
    command: "./test_qhashtbl"
  - file: test_qhasharr.c
    source: qlibc-2.5.1/tests/test_qhasharr.c
    description: "静态哈希数组容器"
    command: "./test_qhasharr"
  - file: test_qhasharr_darkdh.c
    source: qlibc-2.5.1/tests/test_qhasharr_darkdh.c
    description: "静态哈希数组（dark dh 冲突场景）"
    command: "./test_qhasharr_darkdh"
  - file: test_qtreetbl.c
    source: qlibc-2.5.1/tests/test_qtreetbl.c
    description: "红黑树表容器（含 5 个性能用例）"
    command: "./test_qtreetbl"
  - file: test_qlist.c
    source: qlibc-2.5.1/tests/test_qlist.c
    description: "双向链表容器"
    command: "./test_qlist"
  - file: test_qvector.c
    source: qlibc-2.5.1/tests/test_qvector.c
    description: "动态数组容器"
    command: "./test_qvector"
  - file: test_qqueue.c
    source: qlibc-2.5.1/tests/test_qqueue.c
    description: "FIFO 队列容器"
    command: "./test_qqueue"
  - file: test_qstack.c
    source: qlibc-2.5.1/tests/test_qstack.c
    description: "LIFO 栈容器"
    command: "./test_qstack"
  - file: test_qhash.c
    source: qlibc-2.5.1/tests/test_qhash.c
    description: "哈希/MD5 工具（含 4 个数据文件）"
    command: "./test_qhash"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libqlibc，调用 qvector/qlist/qhasharr/qstring/qhashmd5"
    command: "./test_qlibc"
  - file: test_ohos.c
    description: "HarmonyOS 专项消费者测试（R01 新增）"
    command: "./test_ohos"

# 测试断言数量口径：上游 10 程序 74 个独立 TEST() 用例 + 2 个消费者可执行程序
# （test_qlibc / test_ohos 各自内部另有断言，实际远多于 76）
assertion_count: 76
