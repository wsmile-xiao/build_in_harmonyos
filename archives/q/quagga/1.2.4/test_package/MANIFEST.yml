# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件（tests/Makefile.am: TESTS = ...）
upstream_tests:
  - name: "TESTS (automake)"
    source: quagga-quagga-1.2.4/tests/Makefile.am
    description: "TESTS 注册项：$(TESTS_BGPD) teststream tabletest testmemory testnexthopiter test-timer-correctness tabletest"
    command: "make check"
  - name: "check_PROGRAMS"
    source: quagga-quagga-1.2.4/tests/*.c
    description: "构建 21 个测试程序（含 BGPD 条件组 aspathtest/testbgpcap/ecommtest/testbgpmpattr/testbgpmpath）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
# 两侧都是硬失败：没有任何"打印一条提示然后继续"的分支。
test_package_tests:
  - file: conanfile.py
    description: "Python 侧：9 个产物逐个在 bin/sbin 定位(assert) + ELF 魔数校验(assert 前 4 字节) + 逐个真实执行 --version(非 0 则 assert --help==0)；另有 2 条反向断言 vtysh / nhrpd 必须缺席——它们与 --disable-vtysh / --disable-nhrpd 以及 commands.json 的 9 命令面互为契约"
    command: "conan create -> test_package test()"
  - file: test.sh
    description: "Shell 侧（用打包内的 /data/service/hnp/bin/bash 跑，因为 /system/bin/sh 是 toybox mksh、执行不了 ELF）：9 个命令 PATH 可见性 + vtysh/nhrpd 缺席检查 + 9 次 --version 且版本串必须含 1.2.4；set -eu，任一不满足即 exit 1"
    command: "bash test.sh"

# 断言/硬校验计数（逐条可复算，与 test_package 源码一一对应）
#   9 个命令面来自 commands.json 与 _BINARIES/test.sh COMMANDS 三处一致声明
assertions:
  python_locate_binary: 9        # assert path  —— _BINARIES 9 项
  python_elf_magic: 9            # assert 前 4 字节 == b"\x7fELF"
  python_absence_negative: 2     # vtysh、nhrpd 必须不存在（收缩契约）
  python_executed_version: 9     # 逐个执行；--version 非 0 则 assert --help == 0
  shell_path_visibility: 9       # command -v，缺失即 exit 1
  shell_absence_negative: 2      # vtysh、nhrpd 出现即 exit 1
  shell_version_string: 9        # --version 输出必须含 1.2.4
assertion_count: 49              # 9+9+2+9+9+2+9（与上面逐项加和一致）

# 交付命令面收缩口径（11 -> 9）：关掉的 vtysh 是交互式 CLI、nhrpd 是 RFC 2332
# 覆盖网协议，均因上游制品未发布（readline / c-ares）而用上游自带开关关闭；
# BGP/OSPF/RIP/IS-IS/PIM + zebra netlink 面全部保留。
declared_commands: 9
excluded_negative_assertions: 4   # python 2 + shell 2，断言 vtysh / nhrpd 缺席

# 上游测试实测（R51/rule4 同源数字，判决行原文见 notes.md §4.1）
measured:
  testsuite_total: 11
  testsuite_pass: 11
  testsuite_skip: 0
  testsuite_fail: 0
  testsuite_error: 0
  testsuite_xfail: 0
  testsuite_xpass: 0
  check_programs_built: 21
  packaged_executables: 11        # 9 声明命令 + 上游自带 bgp_btoa / test_igmpv3_join(non-blocking)
  # 2026-09-25 刷新到第 11 轮现行件；上一版三个值（19d2dfd2.. / 54b0f4af.. / 114295 B）
  # 属已被取代的第 10 轮件，且第 10 轮件 md5 与现行件不同 => 第 11 轮是真重跑而非复制。
  # NB: reports/conan-create.log (17917 B) 是 test_package 单跑日志，含 0 条 CCLD；
  #     21 个唯一 CCLD 只在 <仓根>/.ci_logs/conan_build_quagga_1.2.4.log 里。
  evidence: "reports/w3-local-ci.log (round 11: md5 b81af20be3c5bc4bafcffd46acc284c0, 113862 B, mtime 2026-09-25 01:57, 53 verdict markers; .ci-result.json integrity_hash d825c1bda660f24f, log_sha256 7ffe1f5943df7632c89e3542d437b260b19d6ca53c57a90506fc4e7b040f658d == sha256 of this log) + <repo-root>/.ci_logs/conan_build_quagga_1.2.4.log (round 11: md5 fc86bdff5886e9313f39e6966e16783d, 107608 B; the only log holding the 21 unique CCLD names)"
