# manifest.yaml — quagga 1.2.4
status: built
package:
  name: quagga
  version: "1.2.4"
  description: "GNU Quagga routing daemon suite — zebra, bgpd, ospfd, ospf6d, ripd, ripngd, isisd, pimd, watchquagga (optional vtysh shell and nhrpd not built)"
  homepage: "https://github.com/Quagga/quagga"
  license: "GPL-2.0-or-later"
  category: networking

source:
  url: "https://codeload.github.com/Quagga/quagga/tar.gz/refs/tags/quagga-1.2.4"
  filename: "quagga-1.2.4.tar.gz"
  sha256: "ff4b45e6d586e02e93199952978b25236dc8721f1ab959d2f401ec2bf32dcbee"

build:
  system: autotools
  configure_args:
    - "--enable-static"
    - "--disable-shared"
    - "--without-libpam"
    - "--disable-capabilities"
    - "--disable-doc"
    - "--disable-ospfapi"
    - "--disable-ospfclient"
    - "--disable-fpm"
    - "--disable-protobuf"
    - "--disable-pcreposix"
    - "--disable-werror"
    - "--disable-gcc_ultra_verbose"
    - "--disable-rusage"
    - "--disable-vtysh"
    - "--disable-nhrpd"
    - "--enable-user=root"
    - "--enable-group=root"
    - "--enable-vty_group=root"
  cflags_extra:
    - "-D__MUSL__"
    - "-fcommon"
  tool_requires:
    - "automake/1.18"
    - "libtool/2.5.4"
  ohos_adaptations:
    - "autoreconf -fi bootstrap (git-tag tarball ships configure.ac only, no configure)"
    - "config.guess replaced with OHOS-aware version emitting aarch64-unknown-linux-ohos (E007)"
    - "-D__MUSL__ resolves sockaddr_storage redefinition between <sys/socket.h> and <linux/netlink.h> (E091)"
    - "configure/config.status umask 077 -> umask 022 (HMDFS)"
    - "--enable-user/--enable-group/--enable-vty_group=root (no quagga account on OHOS)"
    - "--disable-vtysh (vtysh is the only libreadline consumer; readline 8.2/8.3 recipes exist on origin/main but no binary is published -> publication gap, daemon suite unaffected)"
    - "--disable-nhrpd (nhrpd is the only libcares consumer, configure.ac:1348; c-ares 1.34.4/1.34.5/1.34.6 recipes exist on origin/main but `conan install --build=never` finds none in remotes -> publication gap)"
    - "SNMP off by omission, NOT by --disable-snmp: configure.ac:1356 guards on `!= \"\"`, so --disable-snmp would set enable_snmp=no and *enter* the SNMP block (round 6 hard error)"
    - "--disable-exampledir dropped: `exampledir` is absent from configure.ac, the flag was an unrecognized option"
    - "-fcommon: pimd/pimd.h:71-103 and pimd/pim_version.h:28 declare the daemon's shared globals as tentative definitions (no extern, no initializer), so every TU including them emits a strong symbol; clang 15 defaults to -fno-common -> `ld.lld: error: duplicate symbol` at CCLD pimd (20 pairs before lld's error limit). Restoring the language default this 2018 code was written against is recipe-only, no upstream source edit"

conan:
  reference: "quagga/1.2.4@ohpcd/stable"

platform:
  os: "OHOS"
  arch: "armv8"
  compiler: "clang 15"
  libc: "musl"
  triplet: "aarch64-unknown-linux-ohos"

patch_generation:
  method: inline
  patches_count: 0
  notes: "config.guess rewrite + umask rewrite are done inline in conanfile.py build(); no upstream source edit"
