# conandata.yml — quagga 1.2.4
# url: official GitHub codeload endpoint for the upstream tag `quagga-1.2.4`.
#      Measured on the HarmonyOS build host (2026-09-24): the
#      `github.com/.../archive/...tar.gz` redirect target times out
#      (curl exit 28, http=000), while codeload returns HTTP 200 / 2234157 B.
#      No mirror prefix is injected (repo-wide policy, PF7 mirror-domain
#      blacklist). filename is mandatory: the URL carries no archive suffix,
#      so conan would otherwise guess zip and strip_root would fail.
# sha256: computed on the device from the downloaded bytes (sha256sum),
#      not copied from any third-party listing.
sources:
  url: "https://codeload.github.com/Quagga/quagga/tar.gz/refs/tags/quagga-1.2.4"
  filename: "quagga-1.2.4.tar.gz"
  sha256: "ff4b45e6d586e02e93199952978b25236dc8721f1ab959d2f401ec2bf32dcbee"

patches: {}
