# 软件级 manifest — quagga
software: quagga
display: "GNU Quagga"
description: "自由软件路由守护进程套件（zebra + BGP4+/OSPFv2/OSPFv3/RIP/IS-IS/PIM；可选 vtysh 交互 shell 与 nhrpd 因 libreadline / libcares 未发布而关闭）"
category: network
homepage: "https://github.com/Quagga/quagga"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "git-tag 源码包无 configure，必须 autoreconf -fi（tool_requires automake + libtool）"
    - "E007：config.guess 不认 HarmonyOS，需在 autoreconf 之后改写为 aarch64-unknown-linux-ohos"
    - "E091：同时包含 <sys/socket.h> 与 <linux/rtnetlink.h> 的 TU（zebra/rt_netlink.c、nhrpd）必须 -D__MUSL__"
    - "HMDFS：configure/config.status 的 umask 077 需改 022"
    - "运行身份：--enable-user/--enable-group/--enable-vty_group 指到 OHOS 上真实存在的账号"
    - "vtysh 需 libreadline（configure.ac:757-761 硬失败）且 sysroot 无可用 termcap -> --disable-vtysh；readline 8.2/8.3 配方在 main 但无已发布二进制，属发布缺口"
    - "nhrpd 需 libcares（configure.ac:1348 PKG_CHECK_MODULES）-> --disable-nhrpd；c-ares 1.34.4/1.34.5/1.34.6 配方在 main 但 conan install --build=never 全部 Unable to find in remotes，同为发布缺口"
  common_dependencies: []

versions:
  "1.2.4":
    status: built
    build_date: 2026-09-24
