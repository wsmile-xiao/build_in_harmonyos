# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qt5-qtscxml/5.15.2
homepage: "https://www.qt.io/"

# 上游测试命令：上游 tests/auto 纯逻辑 QTest 套件（parser/statemachine/
# statemachineinfo/dynamicmetaobject/compiled）在配方 build() 中用 qmake
# 真实编译并执行（offscreen），实测数字见 PR 正文验证结果段。
upstream_check_command: "cd tests/auto && qmake auto.pro && make -j4 && make check"
upstream_test_in_build: true
upstream_test_command: "make check (in conanfile.py build(), per-suite qmake+make+run)"
upstream_test_exemption:
  reason: "tests/auto/scion（W3C SCXML 官方一致性集，编译生成 273 个测试类）大量用例依赖 ECMAScript 数据模型（JS JIT）；OHOS 沙箱禁止可执行内存（mprotect failed in ExecutableAllocator::makeExecutable: Permission denied），本地实测 47 项 PASS 后进程在首个 JS 用例处被杀，套件无法完整执行；与仓内 qt5-qtdeclarative/5.15.2 先例同根因（环境限制非库缺陷）"
  spec: "TEST_QUALITY_SPEC §3"

# 上游测试套件位置
upstream_tests:
  - name: "parser"
    source: qtscxml-everywhere-src-5.15.2/tests/auto/parser/
    description: "SCXML 解析器单元测试（真跑：Totals 42 passed, 0 failed）"
  - name: "statemachine"
    source: qtscxml-everywhere-src-5.15.2/tests/auto/statemachine/
    description: "SCXML 状态机解释器单元测试（真跑：Totals 20 passed, 0 failed）"
  - name: "statemachineinfo"
    source: qtscxml-everywhere-src-5.15.2/tests/auto/statemachineinfo/
    description: "QScxmlStateMachineInfo 单元测试（真跑：Totals 3 passed, 0 failed）"
  - name: "dynamicmetaobject"
    source: qtscxml-everywhere-src-5.15.2/tests/auto/dynamicmetaobject/
    description: "SCXML 动态元对象单元测试（真跑：Totals 4 passed, 0 failed）"
  - name: "compiled"
    source: qtscxml-everywhere-src-5.15.2/tests/auto/compiled/
    description: "qscxmlc 编译产物行为测试（真跑：Totals 11 passed, 0 failed，STATECHARTS 由签名后的 qscxmlc 编译）"
  - name: "scion"
    source: qtscxml-everywhere-src-5.15.2/tests/auto/scion/
    description: "W3C 一致性集（273 测试类；本地实测 47 项 PASS 后因 OHOS JIT 沙箱限制进程被杀——环境限制豁免）"

# test_package 中自带的测试（消费者视角验证：链接 libQt5Scxml 并驱动状态机）
test_package_tests:
  - file: test.cpp
    description: "QScxmlStateMachine::fromData 解析内联 SCXML、start 驱动至 initial 态、submitEvent 触发迁移至 final 态并校验 isFinal"
    command: "./test_qt5_qtscxml"

assertion_count: 5
