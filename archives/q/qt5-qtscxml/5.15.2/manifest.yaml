software: qt5-qtscxml
# 版本级 manifest 模板
# 文件位置: archives/q/qt5-qtscxml/5.15.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "5.15.2"

# 编译状态
status: built

# 编译日期
build_date: "2026-10-06"
build_system: qmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtscxml-everywhere-src-5.15.2.tar.xz"
  sha256: "60b9590b9a41c60cee7b8a8c8410ee4625f0389c1ff8d79883ec5a985638a7dc"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: qmake
  configure_options:
    - "qmake -spec linux-clang qtscxml.pro"
  dependencies:
    - qt5-qtbase/5.15.2.2
    - qt5-qtdeclarative/5.15.2
  cc: clang
  cxx: clang++
  mkspec: linux-clang

patches_applied: []

packaging:
  conan_recipe: true
  conanfile: conanfile.py
  conandata: conandata.yml
  test_package: test_package/

knowledge_gained:
  - "qt5-qtscxml is a qmake addon module producing libQt5Scxml.so, the qscxmlc host tool and the QtScxml QML plugin (src/imports)"
  - "qmake requires qt5-qtdeclarative's mkspecs .pri files merged into the writable Qt prefix (qt-prefix pattern) so qtHaveModule(qml) resolves for src/imports and tests"
  - "qscxmlc host tool built from tools/qscxmlc must be ELF-signed with binary-sign-tool before it can compile STATECHARTS (tst_compiled) on the OHOS build host"
  - "Upstream auto tests (parser/statemachine/statemachineinfo/dynamicmetaobject/compiled) are pure-logic QTest suites that run headless with QT_QPA_PLATFORM=offscreen"
  - "No source modifications required for HarmonyOS - the module builds cleanly with the right mkspecs setup"
