package: qtgraphs/6.8.2
homepage: "https://doc.qt.io/qt-6/qtgraphs-index.html"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "recipe configures BUILD_TESTING=ON, QT_BUILD_TESTS=ON, QT_BUILD_TESTS_BY_DEFAULT=ON, FEATURE_graphs_3d=OFF and runs QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ctest --test-dir <build> --output-on-failure --timeout 300 when target binaries can execute"

upstream_tests:
  - file: tests/auto/cpp2dtest
    source: qtgraphs-everywhere-src-6.8.2/tests/auto/cpp2dtest
    description: "16 upstream 2D CTest targets wired by upstream CMake. Two additional theme test directories (qgtheme-graph, qgtheme-series) exist in this tree but are not wired by upstream CMake and are not counted."
    command: "ctest"
    status: enabled
  - file: tests/auto/qml2dtest
    source: qtgraphs-everywhere-src-6.8.2/tests/auto/qml2dtest
    description: "1 upstream 2D QML CTest target (tst_qgqml2dtest) wired by upstream CMake."
    command: "ctest"
    status: enabled
  - file: tests/auto/cpptest
    source: qtgraphs-everywhere-src-6.8.2/tests/auto/cpptest
    description: "23 upstream 3D CTest targets blocked because Qt6Quick3D is not available; the recipe passes FEATURE_graphs_3d=OFF."
    command: "ctest"
    status: "blocked (Qt6Quick3D missing)"
  - file: tests/auto/qmltest
    source: qtgraphs-everywhere-src-6.8.2/tests/auto/qmltest
    description: "1 upstream 3D QML CTest target (tst_qgqmltest) blocked because Qt6Quick3D is not available; the recipe passes FEATURE_graphs_3d=OFF."
    command: "ctest"
    status: "blocked (Qt6Quick3D missing)"

upstream_test_notes:
  - "tests/manual contains 27 manual test directories (plus CMakeLists.txt, manual.pro, and tests.pri project files); they require an interactive display environment and are not included in the 41 tests/auto CTest count."
  - "qtgraphs 6.8.2 has no tests/baseline directory."

test_package_tests:
  - file: test_qtgraphs.cpp
    description: "Consumer CMake smoke test that links against Qt6::Graphs, checks 2D Bar/Line/Scatter series APIs and the module version macro, and runs an optional QML/Quick render probe when QTGRAPHS_RUN_RENDER_TEST=1 is set in an OpenHarmony display session."
    command: "timeout 120 ./test_qtgraphs"

assertion_count: 9
upstream_total_case_count: 41
upstream_enabled_case_count: 17
upstream_excluded_case_count: 24
upstream_manual_case_count: 27
upstream_pass_rate: "17 upstream 2D CTest targets enabled (16 cpp2d + 1 qml2dtest); pass rate pending OpenDesk log; 41 is the tests/auto count, with tests/manual excluded from it."
