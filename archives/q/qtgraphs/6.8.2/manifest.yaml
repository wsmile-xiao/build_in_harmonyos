software: qtgraphs
version: "6.8.2"
build_system: cmake
status: built
build_date: "2026-09-23"
conan_ref: "qtgraphs/6.8.2"

source:
  url: "https://download.qt.io/official_releases/qt/6.8/6.8.2/submodules/qtgraphs-everywhere-src-6.8.2.tar.xz"
  sha256: "05c7a4a3482f6ffd7e9005964bb5ab634062a6d023ccd96f5447db6eae3c46d4"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DQT_BUILD_EXAMPLES=OFF"
    - "-DQT_BUILD_TESTS=ON"
    - "-DQT_BUILD_TESTS_BY_DEFAULT=ON"
    - "-DFEATURE_graphs_3d=OFF"
    - "-DCMAKE_PREFIX_PATH=<qtbase package folder (set by generate())>"
  dependencies:
    - qtbase/6.11.1
    - qtdeclarative/6.11.1
    - qtshadertools/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Cross-version adaptation (same approach as qtremoteobjects/6.8.2 and qtserialport/6.8.2): qtbase/qtdeclarative/qtshadertools 6.8.2 are not published to the ohpcd registry, so qtgraphs 6.8.2 builds against the published Qt 6.11.1 packages. CMake find_package(Qt6 6.8.2 ...) accepts the 6.11.1 installation because 6.11.1 satisfies the 6.8.2 minimum within Qt major 6, and the generated Qt6GraphsConfigVersion.cmake still declares 6.8.2 (PROJECT_VERSION)."
  - "No source patches are required for the 6.8.2 2D build: the 6.8.2 datetime axis test already uses QTimeZone::UTC (the 6.11.1 Europe/Helsinki fix is not needed), and the 2D build does not need ShaderTools added to the top-level find_package OPTIONAL_COMPONENTS (the prebuilt 2D .qsb shaders are shipped in the source tree)."
  - "qtshadertools/6.11.1 stays in requirements because the qtdeclarative::qml conan component declares a dependency on qtshadertools::shadertools."
  - "The recipe enables upstream Qt auto tests and runs ctest with the offscreen Qt platform, per-test timeout, and software Quick backend when target binaries can execute; 17 of the 41 upstream tests/auto CTest targets are enabled (16 cpp2dtest + 1 qml2dtest)."
  - "Upstream 3D suites (cpptest 23 targets, qmltest 1 target) require Qt6Quick3D; qtquick3d is not part of the current adaptation set, so the recipe passes FEATURE_graphs_3d=OFF to exclude those suites explicitly and documents them in the PR body."
  - "R40 manual validation marker: manual adaptation-completeness confirmation is required. Headless CI covers build/linkage/non-rendering smoke checks only; Qt Graphs rendering, QML integration, and EGL/GLES scene graph behavior require an OpenHarmony PC display session. Keep status built until manual validation is complete."
