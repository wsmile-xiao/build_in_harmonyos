package: qtgraphs/6.11.1
homepage: "https://doc.qt.io/qt-6/qtgraphs-index.html"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "recipe configures BUILD_TESTING=ON, QT_BUILD_TESTS=ON, QT_BUILD_TESTS_BY_DEFAULT=ON, FEATURE_graphs_3d=OFF and runs QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ctest --test-dir <build> --output-on-failure --timeout 300 when target binaries can execute"

upstream_tests:
  - file: tests/auto/cpp2dtest
    source: qtgraphs-everywhere-src-6.11.1/tests/auto/cpp2dtest
    description: "17 upstream 2D CTest targets wired by upstream CMake. Two additional theme test directories in this tree are not wired by upstream CMake and are not counted."
    command: "ctest"
    status: enabled
  - file: tests/auto/qml2dtest
    source: qtgraphs-everywhere-src-6.11.1/tests/auto/qml2dtest
    description: "1 upstream 2D QML CTest target wired by upstream CMake."
    command: "ctest"
    status: enabled
  - file: tests/auto/cpptest
    source: qtgraphs-everywhere-src-6.11.1/tests/auto/cpptest
    description: "26 upstream 3D CTest targets blocked because Qt6Quick3D is not available; the recipe passes FEATURE_graphs_3d=OFF."
    command: "ctest"
    status: "blocked (Qt6Quick3D missing)"
  - file: tests/auto/qmltest
    source: qtgraphs-everywhere-src-6.11.1/tests/auto/qmltest
    description: "1 upstream 3D QML CTest target blocked because Qt6Quick3D is not available; the recipe passes FEATURE_graphs_3d=OFF."
    command: "ctest"
    status: "blocked (Qt6Quick3D missing)"

upstream_test_notes:
  - "tests/manual contains 43 directories with 42 manual targets; they require an interactive display environment and are not included in the 45 tests/auto CTest count."
  - "tests/baseline registers a conditional CTest (tst_baseline_graphs) gated by Qt6Quick3D, qtbase baseline shared, and QT_FEATURE_process; it is not included in the 45 tests/auto count."

test_package_tests:
  - file: test_qtgraphs.cpp
    description: "Consumer CMake smoke test that links against Qt6::Graphs, checks 2D Bar/Line/Scatter series APIs, and runs an optional QML/Quick render probe when QTGRAPHS_RUN_RENDER_TEST=1 is set in an OpenHarmony display session."
    command: "timeout 120 ./test_qtgraphs"

assertion_count: 9
upstream_total_case_count: 45
upstream_enabled_case_count: 18
upstream_excluded_case_count: 27
upstream_manual_case_count: 42
upstream_pass_rate: "18 upstream 2D CTest targets enabled (17 cpp2d + 1 qml2dtest); pass rate pending OpenDesk log; 45 is the tests/auto count, with tests/baseline and tests/manual excluded from it."
