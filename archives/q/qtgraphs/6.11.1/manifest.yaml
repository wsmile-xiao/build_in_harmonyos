software: qtgraphs
version: "6.11.1"
status: built
build_date: "2026-07-20"

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtgraphs-everywhere-src-6.11.1.tar.xz"
  sha256: "84b1138ab68a8e2956439895a4b85eb68dda48ac169da673f67191873b1e0462"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DQT_BUILD_EXAMPLES=OFF"
    - "-DQT_BUILD_TESTS=ON"
    - "-DQT_BUILD_TESTS_BY_DEFAULT=ON"
    - "-DFEATURE_graphs_3d=OFF"
    - "-DCMAKE_PREFIX_PATH=<qtbase package folder (set by generate())>"
  dependencies:
    - qtbase/6.11.1
    - qtdeclarative/6.11.1
    - qtshadertools/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Qt Graphs is built from Conan qtbase/6.11.1, qtdeclarative/6.11.1, and qtshadertools/6.11.1 dependencies."
  - "The recipe enables upstream Qt auto tests and runs ctest with the offscreen Qt platform, per-test timeout, and software Quick backend when target binaries can execute."
  - "The package test verifies CMake consumer linkage, Qt dependency resolution, and non-rendering 2D Bar/Line/Scatter series APIs; graph rendering still requires manual validation on an OpenHarmony display session."
  - "Upstream 3D suites (cpptest/qmltest) require Qt6Quick3D; qtquick3d is not part of the current adaptation set, so the recipe passes FEATURE_graphs_3d=OFF to exclude those suites explicitly and documents them in the PR body."
  - "R40 manual validation marker: manual adaptation-completeness confirmation is required. Headless CI covers build/linkage/non-rendering smoke checks only; Qt Graphs rendering, QML integration, and EGL/GLES scene graph behavior require an OpenHarmony PC display session. Keep status built until manual validation is complete."
