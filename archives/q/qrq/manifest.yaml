software: qrq
display: "qrq"
description: "高速摩尔斯电码（CW）训练器，类似 DOS 经典 Rufz"
category: hamradio
homepage: "https://fkurz.net/ham/qrq.html"
license: "GPL-2.0-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游为手写 Makefile（无 configure）；音频后端由 USE_CA/USE_PA/USE_WIN32 选择，默认 USE_PA=YES"
    - "HarmonyOS 无 OSS /dev/dsp，也无 PulseAudio 守护进程，因此新增原生 OHAudio（libohaudio）后端 ohosaudio.c，并以 make USE_OHOS=YES 选择"
    - "OHAudio 仅有回调（pull）模型：后端缓存 write_audio() 的采样，在 close_audio() 启动 OH_AudioRenderer 并等待全部采样被消费"
    - "终端界面依赖 ncurses/6.5（静态 libncursesw.a，-lncursesw）"
    - "上游 Makefile 的 make install 调用 /usr/bin/install（HarmonyOS 缺失），配方在 package() 中直接收集产物"
    - "上游没有自动化测试套件（无 tests/，make check 无目标）；可用真实入口为 qrq -h"
    - "命令行工具，已声明 commands.json（R38）"
  common_dependencies:
    - ncurses/6.5

versions:
  "0.3.5":
    status: built
    build_date: "2026-10-10"
    source_url: "https://fkurz.net/ham/qrq/qrq-0.3.5.tar.gz"
