# test_package/MANIFEST.yml
# Upstream test declaration + consumer-side verification (L0e required)

package: qrq/0.3.5
homepage: "https://fkurz.net/ham/qrq.html"

# Upstream has no test suite: there is no tests/ directory and `make check`
# has no target in the hand-written Makefile.
upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs.
upstream_tests: []

# Consumer-side verification:
#  - test.sh runs `qrq -h` and checks the binary links libohaudio (HarmonyOS).
#  - src/test_ohos_audio.c is a HarmonyOS-specific runtime test of the native
#    OHAudio renderer used by the port.
test_package_tests:
  - file: test.sh
    description: "Smoke test: qrq -h reports v0.3.5; binary links libohaudio"
    command: "bash test.sh"
  - file: src/test_ohos_audio.c
    description: "HarmonyOS OHAudio renderer probe (create/start/callback/release)"
    command: "./test_ohos_audio"

assertion_count: 5
