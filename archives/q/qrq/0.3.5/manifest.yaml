knowledge_gained:
  - "qrq uses a hand-written Makefile (no configure); the audio backend is selected by USE_CA/USE_PA/USE_WIN32, default USE_PA=YES"
  - "Upstream has no automated test suite; make check is a no-op, there is no tests/ directory"
  - "HarmonyOS has no OSS /dev/dsp and no PulseAudio daemon; a native OHAudio (libohaudio) backend is required"
  - "OHAudio exposes only a pull (write-data callback) model; the backend buffers the qrq waveform and starts the OH_AudioRenderer in close_audio()"
  - "OH_AudioStreamBuilder_SetSamplingRate/ChannelCount(1)/SampleFormat(AUDIOSTREAM_SAMPLE_S16LE)/EncodingType(RAW)/RendererInfo(MUSIC) plus SetRendererWriteDataCallback"
  - "New source files (compat/ohosaudio.c/.h) are shipped via export_sources, not as new-file patches (E254: toybox patch --dry-run really creates the new-file target and poisons the baseline)"
  - "The Makefile's `make install` calls /usr/bin/install which is absent on HarmonyOS; package() copies the artefacts instead"
  - "make -j1 required: parallel make is unreliable on the HarmonyOS HMDFS"

