# test_package/MANIFEST.yml — qm-dsp 1.7.1
# 上游官方测试声明文件（CI L0e 硬门禁要求存在）

package: qm-dsp/1.7.1
homepage: "https://github.com/c4dm/qm-dsp"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "v1.7.1.tar.gz (GitHub c4dm/qm-dsp tag v1.7.1)"
  source_sha256: "4d6884ef9e45f571b2621a2d9e87c6bb5074a24ba4b82f78699f43eb0786d0df"
  build_system: "makefile (build/linux/Makefile.linux64 + tests/Makefile)"
  test_definition: "tests/ 目录 6 个 Boost.Test 程序，共 64 个 BOOST_AUTO_TEST_CASE；tests/Makefile 的 TESTS 变量注册 6 个二进制，默认以 valgrind -q 执行"
  dependency: "boost unit_test_framework（配方以 boost/1.90.0.4.1 提供，OHOS 真机以 VG=\"\" 直接执行二进制跳过 valgrind）"
  portability_changes: []
  counting_unit: "BOOST_AUTO_TEST_CASE 宏（gtest 风格宏计数）"
  verification: "grep -c 'BOOST_AUTO_TEST_CASE' TestFFT.cpp=>21 TestMathUtilities.cpp=>11 TestWindow.cpp=>9 TestMedianFilter.cpp=>10 TestResampler.cpp=>11 TestPhaseVocoder.cpp=>2，合计 64；与 tests/Makefile TESTS 注册的 6 个二进制一致"

upstream_test_total: 64
upstream_test_count_method: gtest_macros

# 审计明细见本文件上方 upstream_test_audit 与 notes.md「上游测试审计」。
upstream_check_command: "make -f build/linux/Makefile.linux64 test (VG=\"\" on OHOS)"
upstream_test_in_build: true
upstream_test_command: "make -C tests <6 binaries> VG=\"\" then ./test-* --log_level=test_suite --report_level=detailed"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/TestFFT.cpp
    source: qm-dsp-1.7.1/tests/TestFFT.cpp
    description: "FFT 正逆变换边界与正弦/余弦/直流/奈奎斯特共 21 用例"
    command: "./test-fft --log_level=test_suite"
  - file: tests/TestMathUtilities.cpp
    source: qm-dsp-1.7.1/tests/TestMathUtilities.cpp
    description: "round/mean/sum/median/princarg/幂次/阶乘/gcd 共 11 用例"
    command: "./test-mathutilities --log_level=test_suite"
  - file: tests/TestWindow.cpp
    source: qm-dsp-1.7.1/tests/TestWindow.cpp
    description: "周期/Bartlett/Hamming/Hann/Blackman/Kaiser/Sinc 共 9 用例"
    command: "./test-window --log_level=test_suite"
  - file: tests/TestMedianFilter.cpp
    source: qm-dsp-1.7.1/tests/TestMedianFilter.cpp
    description: "奇偶/百分位/独立调用/类型/inf/nan 共 10 用例"
    command: "./test-medianfilter --log_level=test_suite"
  - file: tests/TestResampler.cpp
    source: qm-dsp-1.7.1/tests/TestResampler.cpp
    description: "同速率/插值/抽取/上下变频共 11 用例（spectrum 已注释不计）"
    command: "./test-resampler --log_level=test_suite"
  - file: tests/TestPhaseVocoder.cpp
    source: qm-dsp-1.7.1/tests/TestPhaseVocoder.cpp
    description: "fullcycle/overlapping 相位声码器共 2 用例"
    command: "./test-pvoc --log_level=test_suite"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_qmdsp.cpp
    description: "真实调用 Pitch/FFT/MathUtilities/MedianFilter 四类 API，内容一致性与非空校验"
    command: "./test_qmdsp"

# 测试断言总数（test_qmdsp.cpp 的 4 个真实断言，与 HMBS_TEST_PACKAGE_RESULT discovered=4 一致）
assertion_count: 4
