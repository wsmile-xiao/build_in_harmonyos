software: qt-unixodbc
display: "Qt5 unixODBC Driver"
description: "Qt5 unixODBC SQL driver plugin (QODBCDriver)"
category: db
homepage: "https://download.qt.io/archive/qt/5.15/"
license: LGPL-2.1
build_system: custom

ohos_adaptation:
  key_points:
    - "Qt5 ODBC驱动插件需要手动clang++编译，无法使用qmake构建系统（OHOS混合Qt5/Qt6环境）"
    - "需要Qt5 Core/Sql开发库和unixODBC libodbc开发库"
    - "运行时dlopen加载需要ELF签名（平台限制）"
    - "libqsqlodbc.so支持QODBC3/QODBC两种驱动键"
    - "ODBC驱动需要补丁修复源码兼容性问题"
  common_dependencies:
    - qt5-qtbase
    - unixodbc

versions:
  "5.15.2":
    status: built
    build_date: "2026-06-12"