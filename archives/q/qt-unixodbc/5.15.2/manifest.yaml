knowledge_gained:
  - "Qt5Sql not built by qt5-qtbase (disabled with -no-feature-sql); must be built from source"
  - "unixODBC not published to conan registry; vendored as source build in recipe"
  - "ohenvironment library not needed: OHOS platform functions are built into Qt5Core via patches"
  - "ODBC plugin links against libQt5Sql, libQt5Core, libodbc (no ohenvironment)"
  - "moc from qt5-qtbase conan package works for Qt5 5.15.2 source"
