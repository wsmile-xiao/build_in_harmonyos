# Version-level manifest for qt-unixodbc 5.15.2
software: qt-unixodbc
version: "5.15.2"
status: built
build_date: "2026-08-26"
build_system: custom

# Source information
source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
  sha256: "909fad2591ee367993a75d7e2ea50ad4db332f05e1c38dd7a5a274e156a4e0f8"
  tar_format: tar.xz

# Build configuration
build:
  system: custom
  configure_options:
