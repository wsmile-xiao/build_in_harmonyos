package: qtspeech/6.11.1
homepage: "https://doc.qt.io/qt-6/qttexttospeech-index.html"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "QT_QPA_PLATFORM=offscreen ctest --test-dir <build> --output-on-failure -j1 -R '^(tst_qtexttospeech|tst_qvoice)$'"
upstream_case_count: 2
upstream_test_note: "Build and execute the upstream QTextToSpeech and QVoice test executables using the installed mock TTS engine and offscreen QPA backend; they contain 47 passing QtTest functions in the exploratory build."

upstream_tests:
  - file: tests/auto/qtexttospeech/tst_qtexttospeech.cpp
    source: qtspeech-everywhere-src-6.11.1/tests/auto/qtexttospeech/tst_qtexttospeech.cpp
    description: "Upstream engine discovery, state, properties, speech control, pause/resume, and synthesis callback tests"
    command: "./tst_qtexttospeech"
  - file: tests/auto/qvoice/tst_qvoice.cpp
    source: qtspeech-everywhere-src-6.11.1/tests/auto/qvoice/tst_qvoice.cpp
    description: "Upstream QVoice identity and serialization tests"
    command: "./tst_qvoice"

test_package_tests:
  - file: test_qtspeech.cpp
    description: "Discover and instantiate the packaged mock engine, then verify locales, voices, state, engine identity, rate, pitch, and volume APIs"
    command: "./test_qtspeech"

assertion_count: 8
