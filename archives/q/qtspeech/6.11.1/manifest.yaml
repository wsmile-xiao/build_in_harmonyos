knowledge_gained:
  - "HarmonyOS PC can build Qt Speech with the packaged Qt 6.11.1 BuildInternals and the mock TTS plugin; only plugin SONAME metadata needs a portability patch (ref: notes.md)."
  - "Qt module configuration must enter same-host mode before project setup; late CMAKE_SYSTEM_NAME overrides leave CMAKE_CROSSCOMPILING enabled and trigger QT_HOST_PATH checks (ref: E092)."
  - "The upstream tests require QT_QPA_PLATFORM=offscreen because the packaged qtbase provides offscreen/minimal plugins rather than XCB (ref: notes.md)."
  - "Speech Dispatcher and Flite are optional backends and are disabled; the package does not claim a HarmonyOS native speech service backend (ref: pre-analysis.md)."

