package: qtspeech/6.11.1.1
homepage: "https://doc.qt.io/qt-6/qtspeech-index.html"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "recipe configures BUILD_TESTING=ON, QT_BUILD_TESTS=ON, QT_BUILD_TESTS_BY_DEFAULT=ON and runs QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ctest --test-dir <build> --output-on-failure when target binaries can execute"

upstream_tests:
  - file: tests/auto
    source: qtspeech-everywhere-src-6.11.1/tests/auto
    description: "Upstream Qt auto tests enabled in the recipe; qtspeech now requires qtdeclarative/6.11.1 and generate() sets Qt6Qml_DIR/Qt6Quick_DIR/Qt6QuickTest_DIR so the Qt::Qml and Qt::QuickTest guard passes and all 3 CTest targets (tst_qtexttospeech, tst_qtexttospeech_qml, tst_qvoice) register. Executed with ctest when target binaries can run."
    command: "ctest"
    status: enabled

upstream_test_notes:
  - "1 组真实语音输出/音频后端人工验证项，不计入 3 个 auto CTest 用例。"

test_package_tests:
  - file: test_qtspeech.cpp
    description: "Consumer CMake smoke test that links against Qt6::TextToSpeech, queries TTS engines, and constructs a QTextToSpeech instance when target binaries can run."
    command: "./test_qtspeech"

assertion_count: 3
upstream_total_case_count: 3
upstream_enabled_case_count: 3
upstream_excluded_case_count: 0
upstream_manual_case_count: 1
upstream_pass_rate: "3 upstream CTest targets enabled (tst_qtexttospeech, tst_qtexttospeech_qml, tst_qvoice); pass rate pending OpenDesk log"
