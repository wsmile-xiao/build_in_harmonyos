software: qtspeech
version: "6.11.1.1"
status: built
build_date: "2026-07-20"

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtspeech-everywhere-src-6.11.1.tar.xz"
  sha256: "c035c318012025875a653245701a23d3807e8e46b8bf7987877842219c273f14"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DQT_BUILD_EXAMPLES=OFF"
    - "-DQT_BUILD_TESTS=ON"
    - "-DQT_BUILD_TESTS_BY_DEFAULT=ON"
    - "-DCMAKE_PREFIX_PATH=<qtbase package folder (set by generate())>"
  dependencies:
    - qtbase/6.11.1
    - qtmultimedia/6.11.1
    - qtdeclarative/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Qt Speech builds against Qt Core, Qt Multimedia, and Qt Declarative and installs the text-to-speech module metadata."
  - "The recipe declares qtbase/6.11.1, qtmultimedia/6.11.1, and qtdeclarative/6.11.1 as Conan requirements; generate() sets CMAKE_PREFIX_PATH, Qt6_DIR, Qt6Multimedia_DIR, Qt6Qml_DIR, Qt6Quick_DIR, Qt6QuickTest_DIR, and Qt6ShaderTools_DIR from the resolved package folders; test_package sets Qt6TextToSpeech_DIR for the consumer smoke test."
  - "The recipe enables upstream Qt auto tests and runs ctest with the offscreen Qt platform when target binaries can execute; the qtdeclarative dependency supplies Qt::Qml and Qt::QuickTest so tst_qtexttospeech_qml is registered and all 3 upstream CTest targets run."
  - "Runtime speech backends are platform dependent, so CI verifies QTextToSpeech object initialization and metadata only; this package does not guarantee audible TTS output until an OpenHarmony PC speech backend is manually validated."
  - "R40 manual validation marker: manual adaptation-completeness confirmation is required. Headless CI covers build/linkage/non-rendering smoke checks only; Qt Speech audible TTS output requires manual validation against the OpenHarmony PC speech backend. Keep status built until manual validation is complete."
