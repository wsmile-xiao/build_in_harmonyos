# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qtwebview-opensource-src/5.15.15
homepage: "https://www.qt.io/"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试
upstream_tests:
  - file: tests/auto/auto.pro
    source: qtwebview-opensource-src-5.15.15/tests/auto/auto.pro
    description: "Qt5 upstream auto tests for webview module"
    command: "make check"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "Verifies QtWebView QML plugin loads via QQmlEngine"
    command: "./test_qtwebview_opensource_src"

# 测试断言总数
assertion_count: 2
