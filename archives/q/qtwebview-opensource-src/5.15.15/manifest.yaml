software: qtwebview-opensource-src
# 版本级 manifest 模板
# 文件位置: archives/q/qtwebview-opensource-src/5.15.15/manifest.yaml

version: "5.15.15"

# 编译状态
status: built

# 构建系统
build_system: qmake

# 编译日期
build_date: "2026-08-28"

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.15/submodules/qtwebview-everywhere-opensource-src-5.15.15.tar.xz"
  sha256: "8e65b165df6f0608d97d8d0a9a5df691aa736ae0e76e2b93887e6fe2a247ae03"
  tar_format: tar.xz

build:
  system: qmake
  configure_options:
    - "qmake -spec linux-clang qtwebview.pro"
  dependencies:
    - qt5-qtbase/5.15.2.2
    - qt5-qtdeclarative/5.15.2
  cc: clang
  cxx: clang++
  mkspec: linux-clang

patches_applied: []

packaging:
  conan_recipe: true
  conanfile: conanfile.py
  conandata: conandata.yml
  test_package: test_package/

knowledge_gained:
  - "Qt WebView is a qmake-based Qt5 addon module that builds against qt5-qtbase and qt5-qtdeclarative"
  - "Without Qt WebEngine available, the module builds with the null backend (full API, no web rendering)"
  - "Qt 5.15.15 module is binary compatible with qt5-qtbase 5.15.2.x (Qt 5.15 LTS ABI stability)"
  - "Requires the same qt.conf and .pri path fixing as other Qt5 addon modules"
  - "Produces libQt5WebView.so, QML plugins under qml/QtWebView/, and CMake config files"
