software: qperf
display: "qperf"
description: "Measure RDMA and socket (TCP/UDP/RDS/SCTP/SDP) bandwidth and latency between two nodes"
category: network
homepage: "https://github.com/linux-rdma/qperf"
license: GPL-2.0-only OR BSD-2-Clause

build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 tag tarball 不含生成的 configure/Makefile.in，构建期需 GNU autotools 现场 bootstrap；autoconf/m4/perl 由 OHOS SDK 提供，aclocal/automake 由 tool_requires automake/1.18 提供。"
    - "automake 包内 bin/automake 与 bin/aclocal 是依赖 $0 自解析 libdir 的 shell 包装，在 OHOS 包布局下解析为空导致 Can't locate Automake/Config.pm；配方改为经 perl 解释器直调 .automake-real/.aclocal-real 并显式 -I share/automake-<ver>。"
    - "src/Makefile.am 以 ./mkhelp、./mkman 配合相对路径读取 help.txt 生成 help.c 与 manpage，只支持 in-tree 构建（folders.build = \".\"）。"
    - "configure.ac 用 AC_CHECK_LIB(ibverbs, ibv_open_device) 探测 RDMA：OHOS 上无 libibverbs 头/库时自动降级为纯 socket 版本（上游 README 明示为受支持配置），不报错。"
    - "RDMA 与 socket 两条传输路径的实测可用性与证据见 0.4.11/notes.md。"
  common_dependencies: []

versions:
  "0.4.11":
    status: built
    build_date: "2026-09-25"
