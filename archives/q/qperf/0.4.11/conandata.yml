patches:
  - patch_file: "patches/0001-support-sockatmark-via-siocatmark.patch"
    patch_description: "src/support.c 的 sockatmark(3) 可移植性回退：OHOS 的 C 库既不声明也不导出该 POSIX 标准函数（clang 报 call to undeclared function，ld.lld 报 undefined symbol），改发 sockatmark(3) 规范自身所定义的底层 ioctl(fd, SIOCATMARK, &val)——SDK 的 bits/ioctl.h 确实提供 SIOCATMARK；宏开关按特性（SIOCATMARK）而非平台分流，不具备该 ioctl 的平台仍走原 POSIX 调用"
    patch_type: "portability"
  - patch_file: "patches/0002-qperf-treat-unimplemented-f_setown-as-non-fatal.patch"
    patch_description: "src/qperf.c 的 remotefd_setup() 把 fcntl(fd, F_SETOWN, getpid()) 失败当作致命错误：HongMeng 内核不实现 signal-ownership 这一族 fcntl（本机实测：TCP 与 UDP 套接字上 F_SETOWN/F_SETOWN_EX/F_SETSIG 一律返回 -1 EINVAL、F_GETOWN 返回 -22，而同一句柄上的 ioctl(FIONBIO) 正常；普通文件上这四条均为 ENOTSUP），于是全部 socket 传输在建立阶段就报 `fcntl F_SETOWN failed: Invalid argument` 退出，一个字节都没交换。该 ownership 程序自身从不消费（整棵源码树无 O_ASYNC/F_SETFL/SIGIO/F_SETSIG 用法，也不安装 SIGIO 处理器），故改为只在失败原因不是『内核未实现该操作』（EINVAL/ENOTSUP）时才中止：F_SETOWN 可用的平台上行为逐字不变，真正误用句柄仍会报错"
    patch_type: "portability"
