package: qperf/0.4.11
homepage: "https://github.com/linux-rdma/qperf"

# ---------------------------------------------------------------- R51 step 1
# Upstream test inventory, produced before writing this recipe.
upstream_tests_exist: false
upstream_test_audit:
  - source: "whole extracted tarball (qperf-0.4.11)"
    reason: "grep -rn for 'enable_testing', 'add_test', 'AM_TESTS_ENVIRONMENT', 'TESTS =', 'check_PROGRAMS' and 'CTEST' returns no match anywhere in the tree."
  - source: "directory tree"
    reason: "find . -type d -name test -o -name tests returns nothing, and find . -iname '*test*' matches no file."
  - source: "Makefile.am and src/Makefile.am"
    reason: "They define only SUBDIRS, bin_PROGRAMS, man_MANS, EXTRA_DIST, dist-hook, clean-local and generated-file rules; there is no TESTS variable, no check_PROGRAMS and no check/installcheck target."
  - source: "configure.ac"
    reason: "Contains only AC_INIT/AM_INIT_AUTOMAKE/AC_PROG_CC plus three AC_CHECK_LIB probes and two AM_CONDITIONALs; no output of a test harness."
  - source: "src/qperf.c TEST Tests[] registry (the upstream unit-of-work that a harness would run)"
    reason: "The registry holds 36 entries and the four family counts add up: 12 unconditional (conf, quit and the ten tcp/udp/sctp/sdp/rds pairs) + 21 guarded by #ifdef RDMA (rc_* 10 + uc_* 6 + ud_* 3 + ver_rc_* 2 = 21) + 3 guarded by #ifdef HAS_XRC (xrc_* 3) = 36.  The HAS_XRC block is nested inside the RDMA block, so a build without libibverbs compiles out 21 + 3 = 24 entries and keeps the 12 unconditional ones.  None of the 36 is wired to a make target, so upstream exposes no command that runs any of them; they are interactive benchmarks, which is why this adaptation drives them itself."
  - conclusion: "Upstream qperf 0.4.11 ships no automated test suite (static count 0).  The 36 registered benchmark tests are the execution surface this adaptation enumerates and drives; the measurements below are added by this adaptation and are not presented as upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# The registry above is for automated upstream tests and stays empty on purpose.
# What upstream does register is a benchmark suite, enumerated verbatim from
# src/qperf.c's "TEST Tests[]" table and src/help.txt; run_tests.sh drives every
# one of the 12 entries this build compiles in, and the remaining 24 are not
# present in the binary at all (see notes.md, transport matrix).
upstream_registered_benchmarks:
  count: 36
  unconditional_in_this_build: 12
  under_ifdef_RDMA: 21
  under_ifdef_HAS_XRC: 3
  names:
    - conf
    - quit
    - rds_bw
    - rds_lat
    - sctp_bw
    - sctp_lat
    - sdp_bw
    - sdp_lat
    - tcp_bw
    - tcp_lat
    - udp_bw
    - udp_lat
    - rc_bi_bw
    - rc_bw
    - rc_compare_swap_mr
    - rc_fetch_add_mr
    - rc_lat
    - rc_rdma_read_bw
    - rc_rdma_read_lat
    - rc_rdma_write_bw
    - rc_rdma_write_lat
    - rc_rdma_write_poll_lat
    - uc_bi_bw
    - uc_bw
    - uc_lat
    - uc_rdma_write_bw
    - uc_rdma_write_lat
    - uc_rdma_write_poll_lat
    - ud_bi_bw
    - ud_bw
    - ud_lat
    - ver_rc_compare_swap
    - ver_rc_fetch_add
    - xrc_bi_bw
    - xrc_bw
    - xrc_lat

# ---------------------------------------------------------------- R51 step 2
# What the adaptation actually executes against the installed binary.
test_package_tests:
  - file: run_tests.sh
    description: "Execute packaged qperf --version and assert exit code 0 plus the exact upstream version string 'qperf 0.4.11'."
    command: "qperf --version"
  - file: run_tests.sh
    description: "Execute packaged qperf --help tests and require the four socket transports (tcp_bw, tcp_lat, udp_bw, udp_lat) to be advertised."
    command: "qperf --help tests"
  - file: run_tests.sh
    description: "Cross-check the binary's DT_NEEDED entries against the advertised transport list, so a build that silently lost or gained libibverbs fails the gate.  readelf is used because HarmonyOS ships no ldd; a missing reader is scored as a failure, never as a skip."
    command: "readelf -d <package>/bin/qperf"
  - file: run_tests.sh
    description: "Start the packaged binary in server mode on a dedicated listen port and require it to stay resident."
    command: "qperf -lp 19821 &"
  - file: run_tests.sh
    description: "Run a real TCP bandwidth measurement over loopback and require a non-zero bw reading."
    command: "qperf 127.0.0.1 -lp 19821 -t 1 tcp_bw"
  - file: run_tests.sh
    description: "Run a real TCP latency measurement over loopback and require a non-zero latency reading."
    command: "qperf 127.0.0.1 -lp 19821 -t 1 tcp_lat"
  - file: run_tests.sh
    description: "Run a real UDP latency measurement over loopback and require a non-zero latency reading."
    command: "qperf 127.0.0.1 -lp 19821 -t 1 udp_lat"
  - file: run_tests.sh
    description: "Run a real UDP bandwidth measurement over loopback and require non-zero send_bw and recv_bw readings."
    command: "qperf 127.0.0.1 -lp 19821 -t 1 udp_bw"
  - file: run_tests.sh
    description: "Attempt the SCTP transports under a falsifiable rule (tightened in the z32c round): each transport gets its own server on its own listen port with its own log file, reaped by its own PID, and the single assertion for it passes only on a real measurement or on that transport's genuine kernel-level refusal -- the line the server child prints, 'unable to make SCTP socket' (src/socket.c:636/678), or a socket-layer error on the client.  'getaddrinfo failed: Unrecognized service' is deliberately NOT accepted, because notes.md proves it is the downstream artifact of the dead server child leaving 0xFFFFFFFF as the service string.  On HarmonyOS both sctp_bw and sctp_lat are refused because socket(AF_INET, SOCK_STREAM, IPPROTO_SCTP) returns EPROTONOSUPPORT (errno 93)."
    command: "qperf -lp <per-transport port> &; qperf 127.0.0.1 -lp <per-transport port> -t 1 sctp_bw; qperf 127.0.0.1 -lp <per-transport port> -t 1 sctp_lat"
# The per-transport ports in the SDP/RDS entries below are not free choice: run_tests.sh:220 derives each one as PORT + 20 + ATTEMPT_SEQ, where PORT defaults to 19821 (run_tests.sh:40) and the six attempt_transport calls are issued in order at run_tests.sh:266-271, giving sctp_bw 19842, sctp_lat 19843, sdp_bw 19844, sdp_lat 19845, rds_bw 19846, rds_lat 19847.

  - file: run_tests.sh
    description: "Attempt the SDP transports under the same attributable-refusal rule (own server, own log, real refusal required); the accepted evidence is 'unable to make SDP socket' from that transport's server log, or a socket-layer error on the client.  qperf rewrites the address family to its own AF_INET_SDP 27, which this kernel answers with EAFNOSUPPORT (errno 97), and /dev/xpmem is absent."
    command: "qperf -lp 19844 &; qperf 127.0.0.1 -lp 19844 -t 1 sdp_bw; qperf -lp 19845 &; qperf 127.0.0.1 -lp 19845 -t 1 sdp_lat"
  - file: run_tests.sh
    description: "Attempt the RDS transports under the same rule.  Here the client itself prints the genuine socket-layer refusal, so 'socket failed: Address family not supported' (src/rds.c error(SYS, socket failed) plus strerror) on either side is accepted evidence; the unattributable getaddrinfo text is not.  /proc/sys/net/rds/pf_rds is absent, so upstream's rds.c falls back to DEFAULT_AF_RDS 21 and socket(21, SOCK_SEQPACKET, 0) returns EAFNOSUPPORT (errno 97)."
    command: "qperf -lp 19846 &; qperf 127.0.0.1 -lp 19846 -t 1 rds_bw; qperf -lp 19847 &; qperf 127.0.0.1 -lp 19847 -t 1 rds_lat"
  - file: run_tests.sh
    description: "Shut the daemon down through upstream's own quit test and require the server process to actually exit."
    command: "qperf 127.0.0.1 -lp 19821 quit"

test_scenario_count: 12
assertion_count: 31
# Each of the six registered_transport_attempts assertions is scored ok only on
# measurement or on an attributable kernel refusal (per-transport server log),
# never on the downstream getaddrinfo artifact.
assertion_count_basis:
  version_and_inventory: 7
  link_coherence: 1
  server_lifecycle: 3
  loopback_measurements: 14
  registered_transport_attempts: 6
