# 版本级 manifest
# 文件位置: archives/q/qperf/0.4.11/manifest.yaml

version: "0.4.11"
software: "qperf"
status: built
build_date: "2026-09-25"
build_system: "autotools"

source:
  url: "https://github.com/linux-rdma/qperf/archive/refs/tags/v0.4.11.tar.gz"
  sha256: "b0ef2ffe050607566d06102b4ef6268aad08fdc52898620d429096e7b0767e75"
  tar_format: tar.gz

build:
  system: autotools
  configure_options: []
  dependencies: []
  tool_dependencies:
    - "automake/1.18"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-support-sockatmark-via-siocatmark.patch"  # portability: OHOS libc 无 sockatmark(3)，改发 SIOCATMARK ioctl
  - "patches/0002-qperf-treat-unimplemented-f_setown-as-non-fatal.patch"  # portability: HongMeng 内核不实现 signal-ownership fcntl 族，F_SETOWN 的 EINVAL/ENOTSUP 不再当致命错误

knowledge_gained:
  - "上游 tag tarball 不附生成物：必须由 aclocal + automake --foreign --add-missing --copy + autoconf 现场 bootstrap（等价 README 的 ./autogen.sh）"
  - "src/Makefile.am 用 ./mkhelp、./mkman 以相对路径读 help.txt 生成 help.c 与 qperf.1，故构建树必须 in-tree，不能 out-of-tree"
  - "conan automake 包的 bin/automake、bin/aclocal 包装脚本从 $0 推导 perl libdir，在 OHOS 包布局下推导为空，报 Can't locate Automake/Config.pm；须用 perl -I <share/automake-1.18> <pkg>/bin/.automake-real 直调"
  - "configure.ac 的 AC_CHECK_LIB(ibverbs,...) 在 OHOS 上探测失败即自动编译出无 RDMA 版本（上游 README 明示此为受支持配置），不是硬错误"
  - "HongMeng 内核完全不实现 signal-ownership 这一族 fcntl：本机探针实测 TCP/UDP 套接字上 F_SETOWN/F_SETOWN_EX/F_SETSIG 一律 EINVAL、F_GETOWN 返回 -22，普通文件上均为 ENOTSUP，而同一句柄的 ioctl(FIONBIO) 正常；上游若把它当致命错误会在交换第一个字节前自杀"
  - "OHOS 上没有 ldd：消费者测试里核查 DT_NEEDED 必须改用 readelf -d，且探测不到工具时要判为失败而不是静默跳过，否则断言数会被虚报"
