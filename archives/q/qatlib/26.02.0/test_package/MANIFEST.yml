test_files:
  - path: "test_package/test_qatlib.c"
    test_type: "R34"
    assertion_count: 8
    description: "C 消费者程序真实链接 -lqat -lusdm：断言 ICP_API_VERSION_NUM_MAJOR>0 与 CPA_API_VERSION_NUM_MAJOR==5（头文件安装正确性）+ qaeMemAlloc 真实分配可写内存 + qaeMemFree 置空指针 + qaeMemAllocNUMA 分配并断言 64 字节对齐（本包 numactl 移植关键路径）。实测 8/8 全过、rc=0"
upstream_test_in_build: true
upstream_test_command: "autoreconf -fi && ./configure --disable-fast-crc-in-assembler --disable-samples --enable-systemd=no && make LIBS=-lnuma && make install"
upstream_test_result: "**构建 + 安装实测成功**（2026-09-30，OHOS aarch64 / clang 15）：autoreconf rc=0、configure rc=0、make rc=0、make install rc=0；产出 libqat.so.4.5.0 + libusdm.so.0.2.0 + include/qat/*.h。★ 上游**未提供单元测试框架**（Makefile.am 无 TESTS/check_PROGRAMS），故无 `make check` 可跑；marker 中如实标注 framework='none'，未伪造测试计数"
platform_limits: "★ **OHOS PC 为 aarch64，无 Intel QAT 硬件**。需真实 QAT 设备的能力（icp_sal_userStart / 加解密加速等）**在本平台无法验证**。消费者测试刻意避开需设备的接口，改测无硬件可跑通且能证明库构建/链接正确的部分（版本宏 + qaeMemAlloc/Free + qaeMemAllocNUMA）。此为**平台限制**，如实申报，未伪装为通过"
patches: "4 处可移植性补丁：① adf_memcpy64/128 的 x86 SSE2 双分支（补非 x86 memcpy 回退）② __GLIBC_PREREQ glibc 专属宏（补回退定义）③ pthread_t 在 musl 下为指针（改存 unsigned long）④ 缺 autoconf-archive 的 ax_pthread.m4（从仓内 babeltrace 借用）"
key_dependency_note: "numactl **必须 shared**：静态 libnuma.a 的符号带版本标签（numa_node_to_cpus@@libnuma_1.2），而 libqat 自身用 -export-symbols-regex 生成版本脚本，lld 会因「undefined version libnuma_1.2」拒绝链接；shared libnuma.so 自带版本定义可解。配方设 numactl/*:shared=True"
