sources:
  url: "https://github.com/intel/qatlib/archive/refs/tags/26.02.0.tar.gz"
  sha256: "7c68bf05f196153b1b1669a7d17e5bfba6253e7cafb69f67d30a0d17e7facecb"

patches:
  - patch_file: "patches/01-adf_platform_common-h.patch"
    patch_description: "Add a non-x86 fallback for adf_memcpy64/128 (both existing branches are x86 SSE2 inline asm)"
    patch_type: "portability"
  - patch_file: "patches/02-OsalServices-c.patch"
    patch_description: "Provide a fallback for the glibc-only __GLIBC_PREREQ macro"
    patch_type: "portability"
  - patch_file: "patches/03-qat_mgr-c.patch"
    patch_description: "Store pthread_self() as unsigned long: pthread_t is a pointer with musl-based libcs"
    patch_type: "portability"
  - patch_file: "patches/04-add-ax_pthread-m4.patch"
    patch_description: "Vendor m4/ax_pthread.m4 (AX_PTHREAD from autoconf-archive): configure.ac requires it, but autoconf-archive is not present in the CI build environment"
    patch_type: "portability"
