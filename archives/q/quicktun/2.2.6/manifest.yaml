# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.2.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2.6"

# 软件名
software: "quicktun"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/UCIS/QuickTun/archive/e052c0266e655b6dc03211a93502358cd163fd6c.tar.gz"

  # 源码校验和
  sha256: "26b7b8f396e0a3c6012adfe782bceec34906545fa32d132042949518f7bb0ac2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  # 上游无 configure/Makefile/CMake/meson，唯一入口是仓库根 build.sh（90 行裸 shell）
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - libsodium/1.0.22
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- 0001-build.sh.patch
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "裸 shell 构建入口用编译器探测选后端，探测失败会静默改用仓库内置实现且退出码 0；无 config.h/编译命令行/DT_NEEDED 可查时，判据只能取链接期产物双断言（见 knowledge/drafts/DRAFT-quicktun-2.2.6-bare-script-silent-backend-swap）"
  - "上游把编译器写死成 cc=「cc」且没有任何覆盖出口时，只能打补丁改成优先读 CC 环境变量的形式，CC 由 AutotoolsToolchain 注入（R33）"
  - "HMDFS 禁硬链接（E079）：脚本用 ln 产出主程序名时必须留 cp 兜底"
  - "上游脚本自带的 -lsodium 探测把结果静态折进产物，NEEDED 里只剩 libc.so ⇒ 查 DT_NEEDED 核对依赖这条在本包不可用"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

