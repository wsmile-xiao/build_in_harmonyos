# test_package/MANIFEST.yml
# 上游官方测试声明（CI L0e / PF3 要求的六件套之一）
#
# 本文件的核心事实：**QuickTun 上游没有任何自动化测试套件**。
# 这不是"没找到"，是按下列口径清点后的结论，清点依据同目录 notes.md 与 reports/。

package: quicktun/2.2.6
homepage: "http://wiki.ucis.nl/QuickTun"

# 上游没有 Makefile / configure / ctest / meson，因此不存在
# `make -n check` / `ctest -N` / `meson test --list` 任何一条可执行的清点命令。
# 唯一的构建入口是仓库根的 build.sh，它也不含任何测试步骤。
upstream_check_command: "none"

# 因此 build() 里无从集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序：空集（见下方 upstream_tests_absent_evidence）
upstream_tests: []

# ---- "上游确无测试"的一手清点证据 ----
upstream_tests_absent_evidence:
  - "取源 tarball 解包共 23 个文件：.gitignore .hgtags build.sh clean.sh version、deb/ 下 8 个打包脚本与静态页、src/ 下 9 个 .c + 1 个 .h（注：探索目录里多出的 ./.tarball-sha256 是本仓 init-build 自己写的下载校验标记，不属上游）"
  - "文件名层面不存在 tests/ test/ 目录，也不存在 *test*.c / *_test.c / spec 文件"
  - "无 Makefile / Makefile.am / CMakeLists.txt / meson.build ⇒ 没有 check 目标，make -n check / ctest -N / meson test --list 三条清点命令均无对象可执行"
  - "唯一构建入口 build.sh 全文 90 行，只做三件事：探测加密后端、逐条 cc 命令行编出 out/* 各二进制、（可选）打 deb；无任何测试执行或断言"
  - "grep -riE 'assert|check|test' src/*.c 的命中全在协议注释里（proto.nacltai.c:67 与 proto.salty.c:32/36/323 指的是报文 checksum 与 nonce 上限判断），不存在测试框架或用例"

# ---- test_package 自带的消费者测试（本包真正的测试面）----
# quicktun 是应用包，对外没有可链接的 API，消费者面就是随包 bin/ 里的可执行文件。
# test_quicktun.c 以绝对路径调用包内 quicktun.keypair（QuickTun 中唯一不需要
# /dev/net/tun、不需要 root、不需要网络即可跑到真实加密代码的路径），
# 并在进程内用 libsodium 的 crypto_scalarmult_base() 独立算出同一秘密标量对应的
# Curve25519 公钥作为预言机，逐条断言被测输出；任一条不过即非零退出。
test_package_tests:
  - file: test_quicktun.c
    description: "调用包内 quicktun.keypair，用 libsodium 独立预言机核对 Curve25519 公钥；覆盖 -v 版本面、-o space/human/bin 三种输出、同输入确定性、随机模式非常量、非法入参定向拒绝"
    command: "./test_quicktun"

# 断言总数以运行时自报为准（程序末尾打印 "检查项 N 条，失败 M 条"）。
# 此处静态计数 46，实跑得出的数字若小于它则以下方 runtime 记录为准，不得虚报。
assertion_count: 46
