software: quicktun
display: "QuickTun"
description: "Very simple, yet secure VPN: tun/tap encrypted tunnel daemon over UDP (libsodium)"
category: network
homepage: "http://wiki.ucis.nl/QuickTun"
license: BSD-2-Clause
build_system: custom

ohos_adaptation:
  key_points:
    - "上游无 configure/Makefile，唯一构建入口是仓库根 build.sh ⇒ 配方自己驱动脚本并自己做安装（上游无 install 目标）"
    - "build.sh 把编译器写死为 cc=\"cc\"，OHOS 工具链无 cc ⇒ 补丁改为优先读 CC 环境变量的形式（有 CC 用 CC、没有才退回 cc），CC 由 Conan AutotoolsToolchain 注入"
    - "build.sh 用硬链接 ln out/quicktun.combined out/quicktun 产出主程序名，HMDFS 禁硬链接(EPERM) ⇒ 补丁加 || cp 兜底"
    - "build.sh 只靠 CPATH/LIBRARY_PATH 探测 libsodium，探测失败会静默改用仓库自带 TweetNaCl 且照常产出二进制 ⇒ 配方在 build() 后断言后端确为 libsodium"
    - "上游官网 wiki.ucis.nl 与其 oss.ucis.nl 下载区 https 为自签证书、http 已 503 ⇒ 取源改用上游官方组织仓 UCIS/QuickTun 的 commit 归档（C 源码与 2.2.6 .orig 逐文件一致）"
    - "运行期需 /dev/net/tun + TUNSETIFF：构建主机上对 /dev/net、/dev/net/tun 的 stat 与 open 一律 EACCES，且同目录下必然不存在的设备名同样 EACCES ⇒ 可达性被拒、节点存在性不可证（TUNSETIFF 未达，不下结论）；守护进程主路径因此未运行过，keypair 等纯用户态路径可运行"
    - "上游无任何自动化测试套件（无 Makefile/ctest/meson，build.sh 无测试步骤）⇒ 测试面为 test_package 消费者测试"
  common_dependencies:
    - "libsodium/1.0.22"

versions:
  "2.2.6":
    status: built
    build_date: "2026-09-25"
