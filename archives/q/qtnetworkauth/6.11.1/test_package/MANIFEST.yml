package: qtnetworkauth/6.11.1
homepage: "https://doc.qt.io/qt-6/qtnetworkauth-index.html"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure -R '^(tst_oauth1signature|tst_abstractoauth2)$'"
upstream_case_count: 2
upstream_test_note: "Build and execute two upstream Qt NetworkAuth test executables (OAuth1 signature math + OAuth2 abstract base class) with the offscreen QPA backend. tst_abstractoauth is gated behind QT_FEATURE_private_tests (off) so not built."

upstream_tests:
  - file: tests/auto/oauth1signature/tst_oauth1signature.cpp
    source: qtnetworkauth-everywhere-src-6.11.1/tests/auto/oauth1signature/tst_oauth1signature.cpp
    description: "Upstream OAuth1 signature (HMAC-SHA1/plaintext) tests"
    command: "./tst_oauth1signature"
  - file: tests/auto/abstractoauth2/tst_abstractoauth2.cpp
    source: qtnetworkauth-everywhere-src-6.11.1/tests/auto/abstractoauth2/tst_abstractoauth2.cpp
    description: "Upstream QAbstractOAuth2 base-class tests"
    command: "./tst_abstractoauth2"

test_package_tests:
  - file: test_qtnetworkauth.cpp
    description: "Verify QOAuth1Signature PLAINTEXT form and 20-byte HMAC-SHA1 digest"
    command: "./test_qtnetworkauth"

assertion_count: 2
