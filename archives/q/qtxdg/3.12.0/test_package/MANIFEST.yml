# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qtxdg/3.12.0
homepage: "https://github.com/lxqt/libqtxdg"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (BUILD_TESTS=ON)"

# 上游实际运行的测试程序
# 上游 test/CMakeLists.txt 通过 qtxdg_add_test() 注册 3 个 QtTest 可执行文件：
#   qtxdg_test, tst_xdgdirs, tst_xdgdesktopfile
# 清点证据（源码包解压后 test/ 目录）：
#   test/CMakeLists.txt: qtxdg_add_test(qtxdg_test tst_xdgdirs tst_xdgdesktopfile)
#   test/qtxdg_test.cpp / test/tst_xdgdirs.cpp / test/tst_xdgdesktopfile.cpp
#   ctest -N -> 3 个测试（本机实测）
upstream_tests:
  - file: qtxdg_test
    source: test/qtxdg_test.cpp
    description: "QSettings 自定义 'list' 格式（readDesktopFile/writeDesktopFile）读写 round-trip 断言"
    command: "./qtxdg_test"
  - file: tst_xdgdirs
    source: test/tst_xdgdirs.cpp
    description: "XdgDirs 的 dataHome/configHome/cacheHome/... 目录推导断言"
    command: "./tst_xdgdirs"
  - file: tst_xdgdesktopfile
    source: test/tst_xdgdesktopfile.cpp
    description: "XdgDesktopFile 解析 / localizedValue / expandExecString 等断言"
    command: "./tst_xdgdesktopfile"

# test_package 中自带的测试 (消费者视角验证, R34: 实质依赖被测包)
test_package_tests:
  - file: test_qtxdg.cpp
    description: "调用已安装的 Qt5Xdg API（XdgDirs::dataHome/configHome/dataDirs、XdgDesktopFile::load/isValid/name/value/mimeTypes/id）逐项断言"
    command: "./test_qtxdg"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
