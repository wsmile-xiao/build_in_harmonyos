software: qtxdg
version: "3.12.0"
status: built
build_system: cmake
build_date: "2026-10-08"
created_at: 2026-10-08

source:
  url: "https://github.com/lxqt/libqtxdg/archive/refs/tags/3.12.0.tar.gz"
  sha256: "084e5fe7b4087d95657be7b5be3668e98bf14c2ba3b150205ebd819508774d45"
  format: tar.gz
  note: "官方上游 release 源；另自带 lxqt-build-tools-0.13.0.tar.xz（fd3c199d0d7c61f23040a45ead57cc9a4f888af5995371f6b0ce1fa902eb59ce）"

dependencies:
  required:
    - qt5-qtbase/5.15.2.2
    - qt5-qtsvgv/5.15.2.2
    - glib/2.88.0
  build:
    - lxqt-build-tools/0.13.0 (bundled, official upstream source)

build:
  system: cmake
  options:
    - "BUILD_SHARED_LIBS=OFF"
    - "CMAKE_POSITION_INDEPENDENT_CODE=ON"
    - "BUILD_TESTS=ON"
    - "QTXDG_INSTALL_DEFAPS_CONFIG=ON"
    - "QTXDG_DEFAPPS_CONF_INSTALL_DIR=share/qt5xdg"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-consume-conan-qt5-and-qtsvg.patch"
  - "0002-cmake-build-qtxdg-static-with-glib-static-deps.patch"
  - "0003-cmake-build-iconloader-static.patch"
  - "0004-test-use-portable-temp-dir.patch"

test_results:
  type: conan_create_ohos_aarch64
  upstream: "passed: BUILD_TESTS=ON 注册 3 个 QtTest（qtxdg_test / tst_xdgdirs / tst_xdgdesktopfile），build() 内 ctest 实测 3/3 通过"
  test_package: "passed: CMake 消费者 find_package(Qt5Xdg) 链接 Qt5Xdg 并调用 XdgDirs / XdgDesktopFile API，15/15 断言通过"
  full_reference: "qtxdg/3.12.0"

knowledge_gained:
  - "libqtxdg 3.12.0 configure 硬依赖 lxqt-build-tools（>=0.13.0），制品仓无此包 → 配方自带官方源码，在 build 目录配置/安装后经 CMAKE_PREFIX_PATH 暴露给 find_package(lxqt-build-tools)"
  - "qt5-qtbase 包内原生 Qt5 umbrella 配置不可重定位：*ConfigExtrasMkspecDir.cmake 烘焙了构建目录路径（.../b//mkspecs/linux-clang），find_package(Qt5Core) 会 file-exists 失败 → 改用 Conan CMakeDeps 目标 + 生成 shim 补齐 moc/qdbusxml2cpp/私有头/qt5_add_dbus_interface"
  - "Conan toolchain 设 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON，会使 CMakeDeps 生成的 glib-config.cmake 抢占 lxqt-build-tools 的 FindGLIB.cmake；上游只用大写 GLIB_INCLUDE_DIRS/GLIB_LIBRARIES → 用 deps.set_property('glib','cmake_find_mode','none') 让 module 模式生效"
  - "FindGLIB.cmake 的 gio-unix 组件需要 gio-unix-2.0.pc 与 include/gio-unix-2.0/gio/gdesktopappinfo.h；glib conan 包不导出 gio-unix 组件 → 配方生成 gio-unix-2.0.pc"
  - "OpenHarmony 的 zlib/1.3.1 与 glib/*（static）为非 PIC 静态库，不能链进 .so（R_AARCH64 relocation）→ Qt5Xdg/Qt5XdgIconLoader 构为 STATIC（同 quazip 先例），图标引擎插件保持 PIC 模块；glib 传递静态归档需注入 PUBLIC 接口"
  - "上游 test/qtxdg_test.cpp 硬编码 /tmp，OHOS /tmp 只读（E002）→ 补丁改用 QDir::tempPath()"
