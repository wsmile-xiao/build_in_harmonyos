sources:
  # Official upstream release tarball (lxqt/libqtxdg tag 3.12.0).
  url: "https://github.com/lxqt/libqtxdg/archive/refs/tags/3.12.0.tar.gz"
  sha256: "084e5fe7b4087d95657be7b5be3668e98bf14c2ba3b150205ebd819508774d45"

# lxqt-build-tools provides the CMake macros (LXQtConfigVars,
# LXQtCreatePkgConfigFile, LXQtCreatePortableHeaders, FindGLIB, ...) that
# libqtxdg's CMakeLists.txt REQUIRES via find_package(lxqt-build-tools 0.13.0).
# It is not published in the ohpcd registry, so it is bundled from its official
# upstream release to keep this recipe self-contained.
lxqt_build_tools:
  url: "https://github.com/lxqt/lxqt-build-tools/releases/download/0.13.0/lxqt-build-tools-0.13.0.tar.xz"
  sha256: "fd3c199d0d7c61f23040a45ead57cc9a4f888af5995371f6b0ce1fa902eb59ce"

patches:
  - patch_file: "patches/0001-cmake-consume-conan-qt5-and-qtsvg.patch"
    patch_description: >
      Consume the CMakeDeps-provided Qt5 aggregate config instead of
      find_package(Qt5 COMPONENTS Widgets Svg Xml DBus): the native Qt5
      umbrella configs shipped in qt5-qtbase are not relocatable (they bake the
      build machine's mkspecs path), and Conan's Qt5Config.cmake does not
      validate components.  Qt5::Svg is provided by the qt5-qtsvgv package.
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-build-qtxdg-static-with-glib-static-deps.patch"
    patch_description: >
      Build Qt5Xdg as a static library (zlib/glib are non-PIC static archives
      on OpenHarmony) and inject glib's transitive static archives into the
      public link interface so downstream consumers resolve them.
    patch_type: "portability"
  - patch_file: "patches/0003-cmake-build-iconloader-static.patch"
    patch_description: >
      Build Qt5XdgIconLoader as a static library (same non-PIC static zlib
      constraint); the icon-engine plugin stays a PIC module.
    patch_type: "portability"
  - patch_file: "patches/0004-test-use-portable-temp-dir.patch"
    patch_description: >
      test/qtxdg_test.cpp: use QDir::tempPath() instead of the hard-coded
      /tmp (read-only on OHOS) so the upstream QtTest suite can run.
    patch_type: "portability"
