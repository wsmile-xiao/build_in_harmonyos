software: qtxdg
display: "qtxdg (libqtxdg / Qt5Xdg)"
description: "Qt5 实现的 freedesktop.org XDG 规范库（libqtxdg）：提供 Qt5Xdg / Qt5XdgIconLoader 与图标引擎插件，是 kylin-calendar 的 find_package(Qt5Xdg 3.3.1) 依赖"
category: desktop
homepage: "https://github.com/lxqt/libqtxdg"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 CMakeLists 硬依赖 lxqt-build-tools（未发布到 ohpcd）→ 配方自带官方 0.13.0 源码，在 build 目录配置/安装后供 libqtxdg configure 使用"
    - "Qt5 通过 Conan CMakeDeps 目标消费；qt5-qtbase 包内的原生 Qt5 umbrella 配置不可重定位（烘焙构建机 mkspecs 路径），用生成的 qtxdg_qt5_compat.cmake 补齐 moc/qdbusxml2cpp 路径、私有头目录与 qt5_add_dbus_interface 宏"
    - "OpenHarmony 的 zlib / glib 只有非 PIC 静态库，故 Qt5Xdg 与 Qt5XdgIconLoader 构为 STATIC（同 quazip 先例）；图标引擎插件仍为 PIC 模块"
    - "glib 是静态库，配方把其传递静态归档（libffi/libgmodule/proxy-libintl/libpcre2-8/libz）注入 Qt5Xdg 的 PUBLIC 链接接口，下游才能解析"
    - "FindGLIB.cmake（lxqt-build-tools）需要 gio-unix-2.0.pc 与 gdesktopappinfo.h，配方生成 gio-unix-2.0.pc 补齐"
  common_dependencies:
    - qt5-qtbase/5.15.2.2
    - qt5-qtsvgv/5.15.2.2
    - glib/2.88.0

versions:
  "3.12.0":
    status: built
    build_date: "2026-10-08"
    source_url: "https://github.com/lxqt/libqtxdg/archive/refs/tags/3.12.0.tar.gz"
