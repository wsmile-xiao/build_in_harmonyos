# 版本级 manifest — qprint 1.1.dfsg.2

version: "1.1.dfsg.2"
software: "qprint"
status: built
build_date: "2026-09-20"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/q/qprint/qprint_1.1.dfsg.2.orig.tar.gz"
  sha256: "5bfb038c05453db8f356dd01e06e2dd5629519faa26c9ab190d67a3e71de6f02"
  tar_format: tar.gz
  origin: "Debian orig tarball（上游 fourmilab 分发的规范源）"

build:
  system: autotools
  configure_options: []
  dependencies: []
  cc: clang

patches_applied:
  - "0001-configure-hmdfs-tmpdir-umask.patch"
  - "0002-Makefile-in-installdirs.patch"

knowledge_gained:
  - "HMDFS 忽略 umask 语义：旧版 autoconf (umask 077 && mktemp -d ./confXXXXXX) 产出 drwx--S--- 组位仅 setgid 的目录，config.status 写 subs1.awk 即被拒；umask 022 一行修复（DRAFT-qprint-1.1-hmdfs-autoconf-umask-tmpdir）"
  - "老 autoconf Makefile 把 $(BINDIR) 列为 install 前置目标且无创建规则 → installdirs mkdir -p 补丁"
  - "HarmonyOS `/bin/sh` 不接受 CRLF 脚本中的 set -eu\r；test_package 脚本必须保持 LF 换行"
