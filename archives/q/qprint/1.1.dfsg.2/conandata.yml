# conandata.yml — qprint 1.1.dfsg.2
# Debian orig tarball (dfsg: docs/pdf logo removed upstream pristine is
# fourmilab; the Debian .orig is the canonical distributable source).

sources:
  url:
    - "https://deb.debian.org/debian/pool/main/q/qprint/qprint_1.1.dfsg.2.orig.tar.gz"
    - "https://sources.debian.org/data/main/q/qprint/1.1.dfsg.2/qprint_1.1.dfsg.2.orig.tar.gz"
  sha256: "5bfb038c05453db8f356dd01e06e2dd5629519faa26c9ab190d67a3e71de6f02"

patches:
  - patch_file: "patches/0001-configure-hmdfs-tmpdir-umask.patch"
    patch_description: "old autoconf config.status creates its temp dir with umask 077; on HMDFS that yields drwx--S--- (group bits reduced to setgid-only) and subsequent writes are denied ('permission denied: ./confXXXX/subs1.awk' — device-reproduced); umask 022 produces a writable directory with no functional loss for a single-user build"
    patch_type: "portability"
  - patch_file: "patches/0002-Makefile-in-installdirs.patch"
    patch_description: "old autoconf Makefile lists $(BINDIR) as a prerequisite of install-bin with no rule to create it, so make install into a fresh DESTDIR fails with No rule to make target; add an installdirs target using the bundled install-sh -d"
    patch_type: "portability"
