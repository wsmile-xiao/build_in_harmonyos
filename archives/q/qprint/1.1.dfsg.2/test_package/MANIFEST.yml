# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qprint/1.1.dfsg.2
homepage: "https://www.fourmilab.ch/webtools/qprint/"

# 上游测试清点（R51 第 1 步，2026-09-20 源码包实测）：
#   源码包内容：qprint.c（985 行单文件）+ 自带 getopt/configure/Makefile.in
#   + 文档（index.html/qprint.pdf/qprint.w/man 页）。
#   - 无 tests/ 目录，无任何 *test* 源文件
#   - 无 make check/test 目标（Makefile.in 仅 all/install/clean）
#   - 上游 README 未提及测试
#   结论：上游零测试（CLI 工具），消费者往返测试为唯一验证
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "消费者测试: qprint -e/-b 编码后 -d/-b 解码逐字节往返一致 + '=' → =3D 已知值断言"
    command: "sh test.sh <qprint>"

assertion_count: 2
