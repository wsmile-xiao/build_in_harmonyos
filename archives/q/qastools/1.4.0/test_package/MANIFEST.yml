package: qastools/1.4.0

upstream_test:
  has_automated_tests: false
  test_entrypoint: null
  note: >
    上游 qastools 1.4.0 无任何自动化测试入口：顶层与 qascommon/qasconfig/
    qashctl/qasmixer 各 CMakeLists.txt 均未调用 enable_testing() 或 add_test()；
    仓库无 tests/ 目录、无 CTest 注册（0 个）。上游为纯 GUI 工具集，
    不提供可在 headless CI 接入的测试套件。
  ctest_registered: 0
  tests_dir_present: false
  add_test_calls: 0

test_package:
  strategy: >
    消费者测试（consumer test）：test_package 不编译被测包，而是真实 exec
    被测包安装的三个 Qt6/ALSA GUI 可执行文件，验证 ELF 可执行性、动态链接
    闭包与命令行契约。headless 下用 QT_QPA_PLATFORM=offscreen（R7：三个程序
    都在进入 Qt 事件循环之前处理 --version/--help，可安全断言）。
  source: test_package/test_qastools.sh
  entrypoint: test_package/conanfile.py::test -> self.run(bash test_qastools.sh <pkg>/bin)
  runtime_deps: alsa-lib/1.2.16.1, qtbase-sql-dbus/6.11.1, qtsvg/6.11.1, libudev-zero/1.0.4
  cases:
    - id: TP-001
      name: qasmixer installed
      kind: static
    - id: TP-002
      name: qasmixer executable bit
      kind: static
    - id: TP-003
      name: qasmixer ELF magic
      kind: static
    - id: TP-004
      name: qashctl installed
      kind: static
    - id: TP-005
      name: qashctl executable bit
      kind: static
    - id: TP-006
      name: qashctl ELF magic
      kind: static
    - id: TP-007
      name: qasconfig installed
      kind: static
    - id: TP-008
      name: qasconfig executable bit
      kind: static
    - id: TP-009
      name: qasconfig ELF magic
      kind: static
    - id: TP-010
      name: "qasmixer --version prints 'qasmixer 1.4.0' and exits 255"
      kind: runtime
      contract: >
        desktop_items.cpp:130-133 打印 PROGRAM_NAME + " " + VERSION 后
        `return -1`；main.cpp:34-37 `if (res < 0) return res;` → 进程以 255
        退出且不进入 Qt 事件循环。故退出码可硬断言。
    - id: TP-011
      name: "qasmixer --help prints 'Usage:' and exits 255"
      kind: runtime
      contract: desktop_items.cpp:114-124 同一 return -1 路径。
    - id: TP-012
      name: "qashctl --version prints 'qashctl 1.4.0'"
      kind: runtime
      contract: >
        上游 main.cpp:27-30 写的是 `if (res < ditems.init_settings (argc, argv))`
        —— 二次调用 init_settings 后比较 `-1 < -1` 为假，条件落空，程序继续
        进入 app.exec()。故版本号会打印到 stdout，但进程不自行退出，由
        QASTOOLS_TEST_TIMEOUT（默认 15s）超时杀掉，rc=124 属预期。
        断言只落在 stdout 版本串上，不约束退出码。
    - id: TP-013
      name: "qasconfig --version prints 'qasconfig 1.4.0'"
      kind: runtime
      contract: 同 TP-012（qasconfig main.cpp:24-27 同一写法）。
  discovered: 13

platform_notes:
  - "OHOS 无 X11/Wayland：QT_QPA_PLATFORM=offscreen（conducteo/acetoneiso/diffpdf/marknote 先例）。"
  - >
    libc++_shared.so 位于 OHOS SDK 的**按架构分层** llvm lib 目录
    （.../llvm/lib/aarch64-linux-ohos），而 CI profile 的 buildenv 只前置了
    llvm/lib（不含架构层）。测试脚本按 OHOS_SDK_LLVM_LIB 覆盖并补齐该路径
    （conducteo 同款处置）。
  - >
    OHOS 的 /system/bin/sh（mksh）不能执行 ELF 二进制，test() 必须经
    CONFIG_SHELL 指向的 bash 包装（conducteo/acetoneiso 同款）。
  - >
    本次 test_package 尚未在 OHOS 设备/CI 上实测（首轮真实执行由 CI 承担）。
    修改前的历史版本（TP-001..006 纯静态 ELF 校验）于 2026-09-19 本地
    conan create 通过；新测试项的通过率以 CI 首次运行为准，不得预先宣称。
