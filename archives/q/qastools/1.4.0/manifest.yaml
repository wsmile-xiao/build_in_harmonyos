software: qastools
version: "1.4.0"
status: built
build_date: "2026-09-19"
conan_ref: "qastools/1.4.0"
build_system: cmake

source:
  url: "https://gitlab.com/sebholt/qastools/-/archive/v1.4.0/qastools-v1.4.0.tar.gz"
  sha256: "c2c06a07741b39be65744afef9b8e53708e7c3e937cd70df65e13cf2c937c5cc"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_LIST=qascommon,qasconfig,qashctl,qasmixer"
    - "SKIP_LICENSE_INSTALL=OFF"
  dependencies:
    - qtbase-sql-dbus/6.11.1
    - qtsvg/6.11.1
    - alsa-lib/1.2.16.1
    - libudev-zero/1.0.4
  cc: clang
  cxx: clang++
  cxxstandard: "17"

notes: |
  - 依赖 Qt6 DBus 组件：必须使用 qtbase 的 dbus 变体 qtbase-sql-dbus/6.11.1
    （裸 qtbase/6.11.1 为 FEATURE_dbus=OFF，Qt6Config.cmake 直接置 Qt6_FOUND=FALSE）。
  - udev 由 libudev-zero/1.0.4 静态实现替代（libudev.a + libudev.h，-ludev）。
  - udev sound 卡热插拔监听在 OHOS 运行期无 udev 守护进程，源码已有 NULL 降级
    分支（udev_device_lookout.cpp），notes 中声明运行期限制，不需要源码 patch。
  - 上游无自动化测试（CTest 注册 0 个，测试入口 0 个）：test_package 单独汇报。
  - 2026-09-19 本地 conan create 全通过：当时 test_package 为纯静态 TP-001..006。
  - 2026-09-26 CI 门禁修复：test_package 改为真实 exec 三个可执行文件
    （TP-001..013，见 test_package/MANIFEST.yml），并补齐软件级 commands.json（R38）。
    四道门禁判定（L0c/L0d/L0k/L1d）已在隔离工作树复跑通过。
  - 2026-09-27 CI L1 修复（E077）：CI build #62097 的 test_package 运行期探针
    （TP-010..013）因三个二进制无 OHOS .codesign 签名、exec 被拒（EPERM rc=126）
    而 4 失败。修复：conanfile.py package() 对 qasmixer/qashctl/qasconfig 打包期
    自签（binary-sign-tool -selfSign 1，cronutils/1.1 先例），exec 探针可真实运行。
