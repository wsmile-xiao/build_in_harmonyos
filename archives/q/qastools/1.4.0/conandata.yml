sources:
  url: "https://gitlab.com/sebholt/qastools/-/archive/v1.4.0/qastools-v1.4.0.tar.gz"
  sha256: "c2c06a07741b39be65744afef9b8e53708e7c3e937cd70df65e13cf2c937c5cc"
patches:
  - patch_file: "patches/0001-i18n-skip-linguist-tools-on-ohos.patch"
    patch_description: "Guard Qt6LinguistTools requirement; translations load at runtime"
    patch_type: "portability"
  - patch_file: "patches/0002-global-include-dirs.patch"
    patch_description: "Inject UDEV_INCLUDE_DIRS / ALSA_INCLUDE_DIRS into global include dirs"
    patch_type: "portability"
  - patch_file: "patches/0003-sstream-include.patch"
    patch_description: "Add #include <sstream> to states_db.cpp for std::basic_ostringstream"
    patch_type: "portability"
  - patch_file: "patches/0004-qashctl-udev-libs.patch"
    patch_description: "qashctl: honour top-level UDEV_LIBRARIES_CACHE (absolute path to libudev.a)"
    patch_type: "portability"
  - patch_file: "patches/0005-qasmixer-udev-libs.patch"
    patch_description: "qasmixer: honour top-level UDEV_LIBRARIES_CACHE (absolute path to libudev.a)"
    patch_type: "portability"
