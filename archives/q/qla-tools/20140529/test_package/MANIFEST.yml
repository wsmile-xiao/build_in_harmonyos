# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
#
# 上游测试清点（真实证据）:
#   - 源码树无 tests/ 或 test/ 目录；无任何 *test* 文件
#     $ find src -type d -name tests -o -type d -name test   -> 空
#     $ find src -iname '*test*'                              -> 空
#   - Debian 打包层无 debian/tests/ 目录
#     $ ls deb/debian/tests  -> No such file or directory
#   - debian/rules 无 dh_auto_test / make check 钩子
#     $ grep -nE 'dh_auto_test|make check' deb/debian/rules   -> 空
#   => 上游无自动化测试入口；仅随包提供 4 个脚本的使用说明（README）。

package: qla-tools/20140529
homepage: "http://driverdownloads.qlogic.com"

# 上游测试命令（无自动化测试入口）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无自动化测试套件
upstream_tests: []

# test_package 中自带的测试（消费者视角，实际执行上游 4 个样例脚本）
# 断言总数 8（含 3 个 HarmonyOS 特有测试）
test_package_tests:
  - file: test.sh
    description: "installed_scripts_present — 4 个上游脚本均已安装且在 PATH 上可执行"
    command: "bash test.sh"
  - file: test.sh
    description: "ql-hba-snapshot_runs — 执行 ql-hba-snapshot，无 shell 诊断、退出码合法"
    command: "bash test.sh"
  - file: test.sh
    description: "ql-lun-state-online_help — ql-lun-state-online -h 退出 0 且打印用法"
    command: "bash test.sh"
  - file: test.sh
    description: "ql-set-cmd-timeout_help — ql-set-cmd-timeout -h 退出 0 且打印用法"
    command: "bash test.sh"
  - file: test.sh
    description: "ql-dynamic-tgt-lun-disc_runs — 执行 ql-dynamic-tgt-lun-disc，走无 HBA 分支"
    command: "bash test.sh"
  - file: test.sh
    description: "OHOS_shebang_hnp_bash [鸿蒙特有] — 4 个脚本 shebang 均为 #!/data/service/hnp/bin/bash 且该 bash 可执行"
    command: "bash test.sh"
  - file: test.sh
    description: "OHOS_tmp_writable_base [鸿蒙特有] — 不再写只读 /tmp（OHOS E002）"
    command: "bash test.sh"
  - file: test.sh
    description: "OHOS_kernel_release_accepted [鸿蒙特有] — 内核门禁接受 HarmonyOS 内核串 HongMeng Kernel 1.12.0"
    command: "bash test.sh"

# 测试断言总数（8 个用例）
assertion_count: 8
