knowledge_gained:
  - "OHOS 无 /bin/bash 且 /usr/bin 对部分运行 uid 不可遍历（/usr/bin/env 无法执行），脚本 shebang 必须改 #!/data/service/hnp/bin/bash，否则 exec 报 126/127 bad interpreter"
  - "OHOS /tmp 只读（E002），脚本硬编码的 /tmp 临时文件需改 ${TMPDIR:-$HOME/tmp}"
  - "OHOS 的 uname -r 为 'HongMeng Kernel 1.12.0'，非 Linux 版本号；Linux 2.6+ 内核门禁需放行 HarmonyOS 内核串"
  - "OHOS 无 tput（ncurses-utils）/ modprobe（kmod），调用前 command -v 判空降级"
  - "上游无自动化测试：无 tests/ 目录、无 debian/tests、debian/rules 无 dh_auto_test 钩子"

validation:
  ohos_local:
    conan_create: passed
    upstream_tests: "N/A（上游无自动化测试套件）"
    test_package: "8/8 (含 3 个鸿蒙特有)"
  notes: "本机 OHOS PC（aarch64, HarmonyOS, HongMeng Kernel 1.12.0）真实执行 conan create + test_package。"

