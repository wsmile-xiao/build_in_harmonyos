# 软件级 manifest
# 文件位置: archives/q/qla-tools/manifest.yaml

software: qla-tools
display: "qla-tools"
description: "QLogic FC/iSCSI HBA 管理工具（HBA 快照、LUN 扫描、LUN 状态、命令超时）"
category: utility
homepage: "http://driverdownloads.qlogic.com"
license: GPL-2.0-or-later

build_system: custom

ohos_adaptation:
  key_points:
    - "纯 shell 脚本工具包（Architecture: all），无编译，直接安装 4 个脚本到 bin/"
    - "OHOS 无 /bin/bash 且 /usr/bin 对部分运行 uid 不可遍历：shebang 改 #!/data/service/hnp/bin/bash"
    - "OHOS /tmp 只读（E002）：临时文件改用 $TMPDIR/$HOME/tmp"
    - "OHOS 无 tput / modprobe：缺失时降级不报错"
    - "OHOS 内核串 'HongMeng Kernel 1.12.0' 非 Linux 版本号：原 Linux 2.6+ 内核门禁放行"
  common_dependencies:
    - libsgutils

versions:
  "20140529":
    status: built
    build_date: "2026-09-29"
    archive_path: "20140529"
    requires_manual_verification: false
