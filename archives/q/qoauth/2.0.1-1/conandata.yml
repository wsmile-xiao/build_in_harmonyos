sources:
  url: "https://github.com/ayoy/qoauth/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "a28005986410d333e03d077679cdf6c504ec5a33342867dc0f9fb0b74285e333"

patches:
  - patch_file: "patches/0001-add-qca-paths.patch"
    strip: 1
    patch_description: "src.pro 添加 Qt6 VERSION 分支、QCA_INCLUDE/QCA_LIB 路径与 -lqca-qt6 链接，QMAKE_LFLAGS 允许 shlib-undefined"
    patch_type: "portability"
  - patch_file: "patches/0002-add-qca-paths-ut-tests.patch"
    strip: 1
    patch_description: "ut_interface.pro 添加 QCA 包含/链接路径（单元测试编译需要 QtCrypto 头）"
    patch_type: "portability"
  - patch_file: "patches/0003-add-qca-paths-ft-tests.patch"
    strip: 1
    patch_description: "ft_interface.pro 添加 QCA 包含/链接路径（功能测试编译需要 QtCrypto 头）"
    patch_type: "portability"
  - patch_file: "patches/0004-qt6-compat.patch"
    strip: 1
    patch_description: "Qt6/clang 兼容：显式包含 QSslError（QList<QSslError> 需完整类型）、qSort → std::sort、toTime_t → toSecsSinceEpoch、补 <algorithm>"
    patch_type: "portability"
