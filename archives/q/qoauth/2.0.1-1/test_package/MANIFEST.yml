# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qoauth/2.0.1-1
homepage: "https://github.com/ayoy/qoauth"

# 上游测试命令 (qoauth 使用 qmake，测试在 tests/ut_interface 目录)
# 注意: 上游 "make check" 会执行 ut_interface + ft_interface，
#       其中 RSA 组在制品仓 qca/2.3.10 下触发上游 qFatal，ft_interface 需公网 term.ie，
#       故不集成进 conanfile.py build()，改由真机手动执行并如实记录结果。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "tests/ut_interface/ut_interface"

# 上游实际运行的测试程序 (qoauth 单元测试)
upstream_tests:
  - file: tests/ut_interface/ut_interface.cpp
    source: qoauth-2.0.0/tests/ut_interface/ut_interface.cpp
    description: "qoauth 单元测试：22 个 QTest 用例槽 / 21 条有效数据行（参数生成、签名、URL 编码、RSA 私钥）"
    command: "./ut_interface"
    result: "21/22 PASS（非 RSA 子集 Totals: 22 passed, 0 failed；RSA 组 setRSAPrivateKey/setRSAPrivateKeyFromFile 因 qca/2.3.10 无 pkey provider 触发上游 qFatal，接口 src/interface.cpp:656）"
  - file: tests/ft_interface/ft_interface.cpp
    source: qoauth-2.0.0/tests/ft_interface/ft_interface.cpp
    description: "qoauth 功能测试：向 http://term.ie/oauth/example/ 发起真实 OAuth 流程"
    command: "./ft_interface"
    result: "NOT RUNNABLE（上游硬编码公网服务 term.ie 已下线，离线/CI 无法运行）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_qoauth.cpp
    description: "消费者测试：库加载、消费者密钥设置、URL 配置"
    command: "./test_qoauth"
    result: "1/1 PASS"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 22
