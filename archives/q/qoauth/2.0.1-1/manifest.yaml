version: "2.0.1-1"
software: "qoauth"
status: published
build_date: "2026-09-27"
build_system: qmake
source:
  url: "https://github.com/ayoy/qoauth/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "a28005986410d333e03d077679cdf6c504ec5a33342867dc0f9fb0b74285e333"
  tar_format: tar.gz
build:
  system: qmake
  configure_options: []
  dependencies:
    - qtbase/6.11.1
    - qca/2.3.10
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-add-qca-paths.patch"
  - "0002-add-qca-paths-ut-tests.patch"
  - "0003-add-qca-paths-ft-tests.patch"
  - "0004-qt6-compat.patch"
knowledge_gained:
  - "Qt6 栈：本包基于 qtbase/6.11.1 + qca/2.3.10（归档 qca 配方即 Qt6 版，产物为 libqca-qt6.so），无需 Qt5"
  - "QCA 需要 --allow-shlib-undefined 链接器标志（Botan 符号未定义）"
  - "qoauth 的 .pro 文件需要添加 QCA include/lib 路径（QCA_INCLUDE/QCA_LIB）与 -lqca-qt6"
  - "Qt6/clang 兼容：需显式包含 <QSslError>、qSort→std::sort、toTime_t→toSecsSinceEpoch"
  - "RSA 签名用例不可通过：制品仓 qca/2.3.10 未打包 crypto 插件，运行时 QCA::isSupported(\"pkey\")=false，上游 src/interface.cpp:656 直接 qFatal"
