# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: qtserialport/6.8.2
homepage: "https://doc.qt.io/qt-6/qtserialport-index.html"

# 上游测试命令
upstream_check_command: "ctest --test-dir build --output-on-failure"

# conanfile.py build() 中已集成上游测试（tst_qserialport + tst_qserialportinfo）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -R '^(tst_qserialport|tst_qserialportinfo)$'"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/auto/qserialport/tst_qserialport.cpp
    source: qtserialport-everywhere-src-6.8.2/tests/auto/qserialport/tst_qserialport.cpp
    description: "QSerialPort 核心 API 测试（open/close/baudRate/flush 等）"
    command: "./tst_qserialport"
  - file: tests/auto/qserialportinfo/tst_qserialportinfo.cpp
    source: qtserialport-everywhere-src-6.8.2/tests/auto/qserialportinfo/tst_qserialportinfo.cpp
    description: "QSerialPortInfo 端口枚举/属性测试"
    command: "./tst_qserialportinfo"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_qtserialport.cpp
    description: "验证 QSerialPortInfo::availablePorts() 枚举、QSerialPort 构造/端口名/错误状态 API 可用"
    command: "./test_qtserialport"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
