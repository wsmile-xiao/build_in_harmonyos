# 版本级 manifest — qtserialport 6.11.1

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.11.1"

# 软件名
software: "qtserialport"

# 编译状态
# published | built | failed
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-15"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtserialport-everywhere-src-6.11.1.tar.xz"

  # 源码校验和
  sha256: "9af31a898ffd9a7e4faf6fed845d29e783c716885789055cbe319f3e072d3974"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "QT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "BUILD_SHARED_LIBS=ON"
    - "QT_BUILD_TESTS=ON"
    - "QT_BUILD_TESTS_BY_DEFAULT=OFF"
    - "QT_BUILD_EXAMPLES=OFF"
    - "FEATURE_libudev=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "qtbase/6.11.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Qt 6 独立模块（qtserialport）编译需要 qtbase 的 Qt6Config.cmake；配方通过 CMAKE_PREFIX_PATH 指向 qtbase 包前缀，并设置 QT_QMAKE_TARGET_MKSPEC=harmonyos-clang。"
  - "qtbase 安装包含 Platform/HarmonyOS.cmake（include Linux），需通过 CMAKE_MODULE_PATH 暴露 qtbase 的 lib/cmake/Qt6/platforms，否则 CMake 不识别 HarmonyOS 平台导致共享库 SONAME 处理损坏。"
  - "test_package 的 CMake 需要 CMAKE_PREFIX_PATH=qtbase + QT_ADDITIONAL_PACKAGES_PREFIX_PATH=qtserialport 包，因为 Qt 模块的 Config.cmake 分散在 qtbase 和模块自身包中。"
  - "qtserialport 上游测试 tst_qserialport/tst_qserialportinfo 可在 OHOS 上构建运行（无物理串口时枚举为空仍通过）。"

# ============================================================
# 测试结果
# ============================================================

test_results:
  upstream:
    total: 2
    command: "ctest --output-on-failure -R '^(tst_qserialport|tst_qserialportinfo)$'"
    status: built
  added:
    total: 10
    status: built

dependency_for: []
