# test_package/MANIFEST.yml

package: qttools/6.11.1
homepage: "https://doc.qt.io/qt-6/qttools-index.html"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure -R '^(tst_lrelease|tst_lcheck|tst_qtattributionsscanner)$'"
upstream_case_count: 3
upstream_test_note: "Build and execute three upstream qttools tests covering lrelease and lcheck (Linguist tool chain) plus qtattributionsscanner, with the offscreen QPA backend. tst_lconvert/tst_ltext2id use QTEST_APPLESS_MAIN (no QCoreApplication), where QLibraryInfo cannot read qt.conf (Qt 6.11 findConfiguration has no env-var fallback), so tool paths cannot be resolved; tst_lupdate's parsejs/parseqml cases need qtdeclarative QML parsing which is not yet published."

upstream_tests:
  - file: tests/auto/linguist/lrelease/tst_lrelease.cpp
    source: qttools-everywhere-src-6.11.1/tests/auto/linguist/lrelease/tst_lrelease.cpp
    description: "Upstream Linguist lrelease TS-to-QM release tests"
    command: "./tst_lrelease"
  - file: tests/auto/linguist/lcheck/tst_lcheck.cpp
    source: qttools-everywhere-src-6.11.1/tests/auto/linguist/lcheck/tst_lcheck.cpp
    description: "Upstream Linguist lcheck translation consistency checker tests"
    command: "./tst_lcheck"
  - file: tests/auto/qtattributionsscanner/tst_qtattributionsscanner.cpp
    source: qttools-everywhere-src-6.11.1/tests/auto/qtattributionsscanner/tst_qtattributionsscanner.cpp
    description: "Upstream qtattributionsscanner SPDX attribution scanner tests"
    command: "./tst_qtattributionsscanner"

test_package_tests:
  - file: CMakeLists.txt
    description: "加载 Qt6LinguistTools CMake 模块并通过 CTest 调用 lrelease 生成 QM"
    command: "ctest --output-on-failure"

assertion_count: 4
