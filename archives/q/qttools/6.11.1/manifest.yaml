software: qttools
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.11.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.11.1"

# 编译状态
# published | built | failed | archived
# R34/R9: 本地构建与功能验证已通过，尚未上传制品仓。
status: built

# 构建系统
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qttools-everywhere-src-6.11.1.tar.xz"

  # 源码校验和
  sha256: "8e61835a679c93fa9c6065b142353c2071ba68e297898937c32a03777fcaf50d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DQT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "-DQT_FEATURE_assistant=OFF"
    - "-DQT_FEATURE_designer=OFF"
    - "-DQT_FEATURE_pixeltool=OFF"
    - "-DQT_FEATURE_qdbus=OFF"
    - "-DQT_FEATURE_qdiag=OFF"
    - "-DQT_FEATURE_qplugininfo=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qtbase/6.11.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "qttranslations 只需要 Qt Linguist 工具链，可关闭 Assistant、Designer 等 GUI 工具以缩小构建范围"
  - "lrelease、lupdate、lconvert、lcheck、lrelease-pro、lupdate-pro 和 ltext2id 可在 HarmonyOS PC 真机运行"
  - "Qt Linguist CMake 配置必须安装到 Qt6LinguistTools 目录，供 qttranslations 的 qt_add_lrelease 使用"

# ============================================================
# 关联 Issue
# ============================================================

issue_url: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/issues/957"
main_library_issue: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/issues/951"
qtbase_pr: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/pull/2889"

test_results:
  build: passed
  install: passed
  tools_found: 7
  tools_checked: 7
  tools_passed: 7
  functional_checks: 3
  functional_passed: 3
