# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qtdeclarative/6.11.1.2
homepage: "https://doc.qt.io/qt-6/qtdeclarative-index.html"

# 上游测试命令: Qt 模块测试为 Qt Test/QML/Quick 测试套件。
# 本次适配打开 QT_BUILD_TESTS 和 QT_BUILD_TESTS_BY_DEFAULT=ON，
# 构建 Qt CMake 图启用的全部上游测试目标，并运行完整 CTest 注册表。
upstream_check_command: "cd build && ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "cd build && ctest -N --no-tests=error && ctest --output-on-failure --no-tests=error"
upstream_case_count: "dynamic (ctest -N)"
adapted_upstream_test_count: "dynamic (complete generated CTest registry)"
upstream_test_file_count: 10372
upstream_test_cmakelists_count: 550
upstream_test_top_level_dir_count: 22
upstream_test_matrix: "test_package/UPSTREAM_TEST_MATRIX.md"
upstream_test_inventory: "test_package/UPSTREAM_TEST_INVENTORY.md"
upstream_test_note: >-
  Qt Declarative 6.11.1 upstream tests/auto contains 10372 inventoried test
  files, 550 CMakeLists.txt files and 22 top-level areas. The recipe enables
  test generation and default test building, then runs the complete generated
  CTest registry without an allow-list or -R filter. The CI log is the
  authoritative source for the number of registered, passed and failed test
  cases. The inventory records the exact upstream source paths and the
  CMake/runtime gates that may exclude non-test fixtures or unsupported
  platform-specific harnesses; such exclusions are reported by CTest and are
  not silently counted as passes. The grouped explanation remains in
  test_package/UPSTREAM_TEST_MATRIX.md.

upstream_tests:
  - source: "qtdeclarative-everywhere-src-6.11.1/tests/auto/**"
    description: "All upstream Qt Declarative tests enabled and registered by the Qt CMake graph"
    command: "cd build && ctest --output-on-failure --no-tests=error"

test_package_tests:
  - file: test_qtdeclarative.cpp
    description: "Exercise QQmlEngine/QQmlComponent QtQuick Item instantiation and QJS evaluation"
    command: "./test_qtdeclarative"

assertion_count: 7
