# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.11.1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.11.1.2"

# 软件名
software: qtdeclarative

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://mirrors.tuna.tsinghua.edu.cn/qt/official_releases/qt/6.11/6.11.1/submodules/qtdeclarative-everywhere-src-6.11.1.tar.xz"

  # 源码校验和
  sha256: "52e670f670b0304f534b24f98c47ceb8a41bb710464414ebc9527ec71cc86aa4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "CMAKE_PREFIX_PATH=<qtbase package_folder>"
  - "QT_ADDITIONAL_PACKAGES_PREFIX_PATH=<qtshadertools package_folder>"
  - "QT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
  - "BUILD_SHARED_LIBS=ON"
  - "QT_BUILD_TESTS=ON"
  - "QT_BUILD_TESTS_BY_DEFAULT=ON"
  - "QT_BUILD_EXAMPLES=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - qtbase/6.11.1.3
  - qtshadertools/6.11.1
  - qtsvg/6.11.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "qtdeclarative depends on qtbase/6.11.1.3 and qtshadertools/6.11.1; qsb from qtshadertools needs qtbase and qtshadertools lib dirs on LD_LIBRARY_PATH during shader generation."
- "CMake on an OHOS host needs the same Linux platform-rule workaround used by related Qt 6 modules so shared library SONAME links are generated consistently."
- "Qt Declarative installs multiple Qt6 shared libraries, so package() must materialize .so and .so.6 links for every libQt6*.so.<version> installed by the module, not only Qt6Qml."
- "Consumers that declare qtdeclarative::quick require a Quick component in Conan metadata even though CMake consumers use the native Qt6 package config files."
- "R37: qtdeclarative/6.11.1 is already published; recipe fixes must use 6.11.1.1 while continuing to build the upstream 6.11.1 tarball and SONAME."
- "HarmonyOS job storage rejects symlink creation in CMake build directories; rewrite generated cmake_symlink_library Makefile rules to copy library aliases and materialize .so/.so.6 entries as regular files."
- "2026-08-25 shadow CI r3 passed for qtdeclarative/6.11.1.1 on 10.62.220.52:2222 after the symlink-copy workaround."
- "2026-09-12 review fix enables QT_BUILD_TESTS with QT_BUILD_TESTS_BY_DEFAULT=ON; the recipe builds every upstream test target enabled by the Qt CMake graph and runs the complete generated CTest registry without a target filter. The authoritative pass/fail totals are emitted by the CI log."
- "2026-09-12 CI follow-up serializes CMake AUTOMOC with CMAKE_AUTOGEN_PARALLEL=1 after the full-test build exposed a generated moc aggregation race on HMDFS."
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
- "R37 revision 6.11.1.2 migrates the qtbase provider to 6.11.1.3 with override=True; qtshadertools and qtsvg stay on 6.11.1 because their .1 revisions are not published yet (L0i R36 requires every declared require, including conditional ones, to be published)."
- "qtdeclarative/6.11.1.1 was merged with the legacy qtbase/6.11.1 requirement, so every consumer had to add its own qtbase override; 6.11.1.2 fixes this at the source so downstream (qtwebengine) can depend on the plain 6.11.1.3 provider."
