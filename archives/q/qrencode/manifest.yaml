software: qrencode
description: Fast and compact QR Code encoding library
website: https://fukuchi.org/works/qrencode/
repository: https://github.com/fukuchi/libqrencode

# 版本索引
versions:
  4.1.1:
    status: built
    build_date: 2026-05-25
    build_system: cmake
    dependencies:
      - libtool/2.4.7
      - sed/4.10
    configure_options:
      - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
      - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
      - "-DWITH_TESTS=YES"
      - "-DWITHOUT_PNG=YES"

# 当前最新版本
latest: 4.1.1

