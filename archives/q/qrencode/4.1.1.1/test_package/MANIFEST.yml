# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: qrencode/4.1.1.1
homepage: "https://github.com/fukuchi/libqrencode"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -S . -B build -DWITH_TESTS=ON -DWITH_TOOLS=OFF -DWITHOUT_PNG=ON && ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_bitstream.c
    source: libqrencode-4.1.1/tests/test_bitstream.c
    description: "Bitstream encoding tests"
    command: "ctest --test-dir build -R ^test_bitstream$"
  - file: tests/test_estimatebit.c
    source: libqrencode-4.1.1/tests/test_estimatebit.c
    description: "Bit size estimation tests"
    command: "ctest --test-dir build -R ^test_estimatebit$"
  - file: tests/test_split.c
    source: libqrencode-4.1.1/tests/test_split.c
    description: "Input splitting tests"
    command: "ctest --test-dir build -R ^test_split$"
  - file: tests/test_qrinput.c
    source: libqrencode-4.1.1/tests/test_qrinput.c
    description: "QR input encoding tests (Iconv available)"
    command: "ctest --test-dir build -R ^test_qrinput$"
  - file: tests/test_qrspec.c
    source: libqrencode-4.1.1/tests/test_qrspec.c
    description: "QR specification tests (Iconv available)"
    command: "ctest --test-dir build -R ^test_qrspec$"
  - file: tests/test_mqrspec.c
    source: libqrencode-4.1.1/tests/test_mqrspec.c
    description: "Micro QR specification tests (Iconv available)"
    command: "ctest --test-dir build -R ^test_mqrspec$"
  - file: tests/test_qrencode.c
    source: libqrencode-4.1.1/tests/test_qrencode.c
    description: "QR encoder tests (Iconv available)"
    command: "ctest --test-dir build -R ^test_qrencode$"
  - file: tests/test_split_urls.c
    source: libqrencode-4.1.1/tests/test_split_urls.c
    description: "URL splitting tests (Iconv available)"
    command: "ctest --test-dir build -R ^test_split_urls$"
  - file: tests/test_monkey.c
    source: libqrencode-4.1.1/tests/test_monkey.c
    description: "Randomized encoder tests (Iconv available)"
    command: "ctest --test-dir build -R ^test_monkey$"
  - file: tests/test_mask.c
    source: libqrencode-4.1.1/tests/test_mask.c
    description: "Mask tests (fixed-size buffer support)"
    command: "ctest --test-dir build -R ^test_mask$"
  - file: tests/test_mmask.c
    source: libqrencode-4.1.1/tests/test_mmask.c
    description: "Micro QR mask tests (fixed-size buffer support)"
    command: "ctest --test-dir build -R ^test_mmask$"
  - file: tests/test_rs.c
    source: libqrencode-4.1.1/tests/test_rs.c
    description: "Reed-Solomon tests (fixed-size buffer support)"
    command: "ctest --test-dir build -R ^test_rs$"
# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试"
    command: "./test_qrencode"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
