package: quicktype/26.0.0
homepage: "https://github.com/glideapps/quicktype"

upstream_check_command: "npm test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - name: vitest-unit-suite
    source: "test/unit/*.test.ts"
    description: "Upstream vitest unit suite, executed on OHOS: 158 passed / 0 failed / 0 skipped (25 files)"
    command: "vitest run (equivalent: node <runner> with cwd=repo root)"
    fixture_files: 25
    count: 158
  - name: fixture-matrix
    source: "test/ (script/test -> test/test.ts)"
    description: "Upstream per-language fixture matrix (85 fixture configs / 30 language dirs): not executed on OHOS, language toolchains absent (go/java/dotnet/crystal/dart/elixir/swift/kotlin/rust/php/...)"
    command: "FIXTURE=<name> script/test"
    fixture_files: 30
    count: 85

test_package_tests:
  - file: test.sh
    description: "Verifies the launcher is executable, quicktype --version/--help, generates TypeScript and Go from JSON, and the OHOS node --jitless launcher"
    command: "sh test.sh <quicktype-path> <workdir>"
    count: 6

upstream_case_count: 158
test_package_assertion_count: 6
assertion_count: 6
