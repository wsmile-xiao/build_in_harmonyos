software: quicktype
version: "26.0.0"
build_system: npm

# published | built | failed | archived
status: built

build_date: "2026-10-01"

source:
  url: "https://registry.npmjs.org/quicktype/-/quicktype-26.0.0.tgz"
  sha256: "55de624945e4f04fcc6d64c3ed6fcf2d1d6accd958e13c028deed8118b310c16"
  tar_format: tar.gz

build:
  system: npm
  configure_options: []
  # No Conan third-party dependencies: the CLI is pure JavaScript; Node.js is
  # provided by the OpenHarmony runtime (system preinstalled, not a Conan pkg).
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "纯 JavaScript npm CLI 用『conan 打包 + node --jitless shell launcher』路径适配：build() 用 `npm install --omit=dev --ignore-scripts` 只装运行时依赖并随包分发 node_modules，dist/ 直接来自 npm tarball（无需原生编译）。"
  - "npm install 必须显式 `--registry=https://registry.npmjs.org`：社区镜像 npm.cnb.cool 的 packument 对部分 devDependency 版本不完整，保留 devDependencies 时 `--omit=dev` 仍会在解析阶段报 ETARGET。"
  - "上游工具链在 OHOS 需替换方可运行：typescript ~7.0.2 为原生编译器（缺 openharmony-arm64 平台包）→ 用 JS 版 typescript@5.9.3 完成构建；vitest 4 的 rolldown 原生绑定无法 dlopen → 用 vitest shim + Node loader + esbuild 等价 runner 执行单元套件（158/158 通过）。fixture 矩阵因缺 go/java/dotnet/crystal/dart/elixir/swift/kotlin/rust/php 等目标语言工具链未执行。"
