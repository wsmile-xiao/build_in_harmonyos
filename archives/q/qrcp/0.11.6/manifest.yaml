# manifest.yaml — qrcp 0.11.6 (HarmonyOS PC)
version: "0.11.6"
software: "qrcp"
status: "built"
build_date: "2026-09-29"
arch:
  - "armv8"
  - "x86_64"
build_system:
  - "conan2"
  - "go1.23.8"
toolchain:
  go: "1.23.8"
  cgo: false
source:
  upstream: "https://github.com/claudiodangelis/qrcp"
  tag: "v0.11.6"
  url: "https://codeload.github.com/claudiodangelis/qrcp/tar.gz/refs/tags/v0.11.6"
  sha256: "a3eff505f366713fcb7694e0e292ff2da05e270f9539b6a8561c4cf267ec23c8"
  license: "MIT"
build:
  entry: "go build -trimpath ."
  output_binary: "qrcp"
  env:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
  ldflags: "-s -w -X github.com/claudiodangelis/qrcp/version.version=0.11.6 -X github.com/claudiodangelis/qrcp/version.date=2026-09-29"
patches_applied:
  - "0001-ohos-netlink-and-tmpdir.patch"
dependencies: []
knowledge_gained:
  - "qrcp 为纯 Go CLI（module github.com/claudiodangelis/qrcp），.goreleaser.yml 强制 CGO_ENABLED=0，无 C/C++ 第三方依赖；go.mod 33 个依赖均为 Go module，由 Go 工具链自动拉取。"
  - "HarmonyOS PC 上以 GOOS=linux、GOARCH=arm64、CGO_ENABLED=0 交叉编译为 aarch64 静态 ELF 运行。"
  - "Go SDK 由 conanfile.py 自引导下载（go1.23.8，官方 URL + sha256），不依赖宿主机预装 Go；Go 链接输出需放在 ext2 风格可写工作区（规避 HMDFS mmap 限制）。"
  - "OHOS 拒绝执行未签名 ELF：Go SDK 工具、最终二进制以及 go test 编译出的测试二进制都必须用 binary-sign-tool 补 .codesign 段（测试用 go test -exec 包装器）。"
  - "HarmonyOS 沙箱限制 AF_NETLINK：net.Interfaces() 报 netlinkrib: permission denied，导致 config.New 接口探测失败；补丁使其告警而非 panic。"
  - "Go 纯解析器（CGO_ENABLED=0 下 netdns=cgo 不可用）在仅 libc 层面拦截 DNS 的环境无法解析域名，需提供可达 GOPROXY。"
  - "上游测试 config/config_test.go::TestNew（5 子用例）实测 6/6 PASS；os.Clearenv() 后需保留 TMPDIR（OHOS /tmp 只读）。"
