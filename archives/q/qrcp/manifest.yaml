# 软件级 manifest — qrcp
software: qrcp
display: "qrcp"
description: "通过扫描二维码在电脑与手机间经 Wi-Fi 传输文件的命令行工具（纯 Go CLI）"
category: network
homepage: "https://github.com/claudiodangelis/qrcp"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 静态编译（CGO_ENABLED=0，GOOS=linux，GOARCH=arm64）"
    - "Go 工具链自引导下载（go1.23.8，官方 URL + sha256），不依赖宿主机预装 Go"
    - "Go linker mmap 在 HMDFS 上 permission denied，链接输出需放在 ext2 可写分区（/data/storage/el2/base/haps/entry/files）"
    - "OHOS 上每个被 fork/exec 的 ELF 必须用 binary-sign-tool 自签名（含 .codesign section），Go SDK 工具与 go test 测试二进制同样需要"
    - "HarmonyOS 沙箱限制 AF_NETLINK，net.Interfaces() 失败；补丁使接口探测失败告警而非 panic"
  common_dependencies: []

versions:
  "0.11.6":
    status: built
    build_date: "2026-09-29"
    conan_ref: "qrcp/0.11.6"
