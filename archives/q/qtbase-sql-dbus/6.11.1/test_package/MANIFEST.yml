# 上游测试来源声明（CI L0e 门禁要求）
# 上游 Qt 的测试框架（qttestlib）依赖 X11/DBus 运行环境，鸿蒙不可直接运行；
# 本 test_package 以真实功能测试（QSQLITE 驱动可用性 + QtDBus 编译链接）验证变体核心卖点。
package: qtbase-sql-dbus
version: 6.11.1
upstream: https://github.com/qt/qtbase
upstream_tests: qtbase/tests/auto（依赖 qttestlib + X11/DBus 环境，鸿蒙受限）
harmonyos_tests:
  - test_package/test.cpp: QSqlDatabase QSQLITE 驱动可用性 + QDBusConnection 编译链接验证
  - test_package/conanfile.py: CMake 构建 + CTest 运行
