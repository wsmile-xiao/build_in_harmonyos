# manifest.yaml — qtbase-sql-dbus 6.11.1

version: "6.11.1"
software: qtbase-sql-dbus
status: built
build_date: "2026-08-13"
build_system: cmake

source:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/qt/official_releases/qt/6.11/6.11.1/submodules/qtbase-everywhere-src-6.11.1.tar.xz"
    - "https://mirrors.ustc.edu.cn/qtproject/official_releases/qt/6.11/6.11.1/submodules/qtbase-everywhere-src-6.11.1.tar.xz"
    - "https://mirrors.cloud.tencent.com/qt/official_releases/qt/6.11/6.11.1/submodules/qtbase-everywhere-src-6.11.1.tar.xz"
  sha256: "d9594a31228aa23ad6b531719a29b45f0f3989fe6c136d45767ea179f233c1ac"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "QT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "BUILD_SHARED_LIBS=ON"
    - "FEATURE_gui=ON"
    - "FEATURE_network=ON"
    - "FEATURE_widgets=ON"
    - "FEATURE_sql=ON"
    - "FEATURE_dbus=ON"
  dependencies:
    - dbus/1.14.10
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "qtbase-sql-dbus 是 qtbase/6.11.1 的 Sql/DBus 组件变体：在 qtbase 基础上开启 FEATURE_sql/FEATURE_dbus 并依赖 dbus/1.14.10，供 actiona 的 actions/data（Qt6::Sql）与 actions/system（Qt6::DBus）使用"
