version: '9.2.4'
status: built
build_date: '2026-09-27'

source:
  url: 'https://github.com/qemu/qemu/archive/refs/tags/v9.2.4.tar.gz'
  sha256: 'c60f39779f3958152cf181db7aa33cce361a075f727a910679bbc3e3815f156f'
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - '--target-list=arm-softmmu,aarch64-softmmu,arm-linux-user,aarch64-linux-user'
    - '--enable-fdt=system'
    - '--disable-docs'
    - '--disable-guest-agent'
    - '--disable-werror'
    - '--disable-gtk'
    - '--disable-sdl'
    - '--disable-vnc'
    - '--disable-xen'
    - '--disable-brlapi'
    - '--disable-spice'
    - '--disable-glusterfs'
    - '--disable-libssh'
    - '--disable-curl'
    - '--disable-libnfs'
    - '--enable-vhost-net'
    - '--disable-vhost-kernel'
    - '--disable-rdma'
    - '--enable-gcrypt'
    - '--enable-zstd'
    - '--enable-lzo'
    - '--enable-snappy'
    - '--enable-lzfse'
    - '--enable-bzip2'
    - '--enable-linux-aio'
    - '--enable-seccomp'
    - '--enable-png'
    - '--enable-capstone'
  cc: clang

patches_applied:
  - file: 'patches/0001-meson-build-treat-HarmonyOS-as-Linux-host.patch'
    target: 'meson.build'
    reason: 'meson 独立探测 host_machine.system() 得到 harmonyos，而 QEMU 的 configure 依据 __linux__ 判定 host_os=linux，两者不一致会让 user-mode 门禁直接中止配置（Target arm-linux-user is only available on a Linux host）'
  - file: 'patches/0002-portability-harmonyos-sysroot-headers.patch'
    targets:
      - 'subprojects/libvhost-user/libvhost-user.h'
      - 'linux-user/syscall.c'
      - 'linux-user/strace.c'
      - 'linux-user/elfload.c'
    reason: 'OHOS sysroot 与内核行为差异四处：①<linux/vhost.h> 链入 sysroot 的 virtio uapi 头（与 QEMU 自带 standard-headers 重复定义、且缺 vring_need_event）②musl 的 struct sigevent 无 glibc 私有 _sigev_un union ③sysroot 的 linux/openat2.h 早于 Linux 5.12 缺 RESOLVE_CACHED ④HongMeng 内核（1.12.0）对 MAP_FIXED_NOREPLACE 返回 ENOSYS，导致 guest_base 搜索全部失败（Unable to find a guest_base），改为 ENOSYS 时回退 MAP_FIXED 并校验落点'

knowledge_gained:
  - 'qemu 自带的 configure 是普通 shell 脚本而非 autotools：它解析 CC/CFLAGS/LDFLAGS 环境变量，创建 ./build 并写出 config-meson.cross，随后用 meson/ninja 驱动；因此配方走 run() 调 configure + ninja，而不是 MesonToolchain'
  - 'libfdt 在 qemu meson.build 里是用 cc.find_library(\"fdt\") 探测的（不是 dependency()），所以必须把 libfdt 的 include/lib 目录显式放进 CFLAGS/LDFLAGS，仅靠 pkg-config 的 fdt.pc 不够'
  - '--target-list 必须显式限定为 aarch64-softmmu,arm-softmmu：默认 target-list 会构建全部 30+ 目标，在鸿蒙 PC 上耗时数倍且本适配只需要 ARM 系目标'
  - '上游 pyproject/meson 要求 meson >= 1.5.0（鸿蒙 PC 自带 1.12.0 满足）；docs 需 sphinx-build，故 --disable-docs 避免引入文档依赖链'
  - 'qemu 的 bin/ 下全部是宿主 aarch64 ELF，鸿蒙拒绝执行未签名 ELF，故 package() 需对 bin/ 逐个执行 binary-sign-tool sign -selfSign 1（复用 gcc-11-cross 的签名约定）'
  - 'meson test --exclude 是 meson 1.12 才有的选项，而驱动构建树的 meson 来自 QEMU 随源码附带的 wheel（9.2.4 为 1.5.0）装进私有 venv，故「排除要跳过的测试」在干净构建上不可用；改成「列出要跑的测试」（位置参数，1.5.0/1.11.0/1.12.0 均支持）才与构建树实际使用的 meson 版本无关。--suite 与位置参数是并集而非交集，两者同用会把被排除的用例重新选中'
  - 'HMDFS 与 /dev/shm 的 fallocate 能力与文件锁能力互斥：HMDFS 上 fcntl(F_SETLK) 可用但 fallocate(PUNCH_HOLE) 返 EACCES，/dev/shm 反之。写者若对文件加锁（QEMU 对每个 raw 映像锁 byte 100），把临时文件挪到 /dev/shm 会把「缺 punch」换成「缺锁」，且失败现象变形为 socket 超时'
  - '「声明了依赖」不等于「特性被启用」：capstone 曾长期处于 requires(capstone/5.0.7) 却 #undef CONFIG_CAPSTONE 的状态。根因是 PkgConfigDeps 生成的 capstone.pc 写 -I<prefix>/include，而头文件在 <prefix>/include/capstone/capstone.h（包自带 .pc 写的才是正确路径），generators 目录在 PKG_CONFIG_PATH 首位把正确的那份遮蔽，QEMU 的 cc.compiles("#include <capstone.h>") 遂失败；auto 选项下它只在日志里打印 "capstone found: YES 5.0.7" 后静默把该特性置为 not_found，汇总行才显示 NO。修法：显式补 -I<prefix>/include/capstone，并把选项从 auto 改为 --enable-capstone，使其无法再静默降级'
  - 'qcrypto 的 PBKDF2/hash 后端在制品仓只能选 libgcrypt：nettle 因伴随包 hogweed/3.9.1 依赖 gmp/6.3.0.1 而 nettle/3.9.1 钉 gmp/6.3.0，Conan 报版本冲突；libgcrypt 不依赖 gmp 且提供同等覆盖（crypto/pbkdf-gcrypt.c）。启用后 test-crypto-pbkdf 从空套件（1..0）变为 19 个真实用例'
  - 'keyutils 已声明又撤除，依据是实测而非推测：启用后 crypto/secret_keyring.c 生效，tests/unit/test-crypto-secret.c 的 keyring 用例（守卫为 #if defined(CONFIG_KEYUTILS) && defined(CONFIG_SECRET_KEYRING)）不再跳过，而宿主 seccomp 直接杀掉 add_key/keyctl（C 探针退出码 159 = 128+31 SIGSYS，/proc/self/status 为 Seccomp:2 / Seccomp_filters:1），套件由「跳过」变「硬失败」——对不支持该能力的主机，不提供该特性优于提供一个会崩的'
  - '制品仓的 snappy 是静态 C++ 库（libsnappy.a），而 QEMU 只按 C 库探测：cc.find_library + cc.links 会在 C++ 运行时符号上失败（undefined symbol: operator new[](unsigned long)），--enable-snappy 下这是配置期硬错误。修法是把 C++ 运行时以静态形态加进链接行（-Wl,-Bstatic -lstdc++ -Wl,-Bdynamic）：探针通过，且产物不新增 libc++_shared.so 依赖'
  - '共享依赖需要配方自己发 RPATH。glib/bzip2/lzo/snappy/lzfse/libaio/libseccomp 在制品仓是静态库，而 pixman/libslirp/capstone/libzstd/libgcrypt/libgpg-error 只有 .so，安装后的二进制离开 Conan 运行环境即报 "Error loading shared library libzstd.so.1"（即 L2 冒烟门禁由 pass 变 skip）。本配方直接驱动 configure、没有工具链 helper，故需显式 -Wl,-rpath；且必须是 DT_RPATH 而非 DT_RUNPATH（--disable-new-dtags），否则二级依赖 libgcrypt→libgpg-error 解析不到；rpath 用绝对目录，$ORIGIN 在本平台不稳定'
  - 'test_package 里执行包内二进制的断言必须带运行期环境：ConanFile.run() 默认 scope="build"，其环境不含链接期依赖的 libdir，二进制在 main() 之前即中止；改用 self.run(cmd, scope="run") 才会 source conanrun 环境（含全部依赖 libdir）。此外 L0 门禁静态要求 test_package 存在真实 self.run 调用，改写成裸 subprocess 会被判定为 stub_test_method'

