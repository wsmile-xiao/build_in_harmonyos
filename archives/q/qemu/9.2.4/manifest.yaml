verification:
  local_static_checks: "pass"
  upstream_tests: "unit 套件 95 项判定：Ok=93 / Fail=0 / Skipped=2（5 项宿主受限用例按精确名单跳过，见 conanfile.py 的 HOST_LIMITED_UNIT_TESTS）；选择清单由构建树自身 meson-info/intro-tests.json 生成，上游新增测试默认被执行。两处 Skipped 均为上游自行判定：test-seccomp 空套件（宿主 Seccomp:2 已处于受限状态，上游 can_play_with_seccomp() 直接返回 false）、test-io-channel-command 缺 socat"
  upstream_test_inventory: "三层口径清点（2026-10-01 rule4 修正，详见 test_package/MANIFEST.yml 与 notes.md）：① 用例级（评审核验口径）= 1325 例（unit 758 + qtest 368 + functional 199）；② 程序级 = 本包构建树注册 1720 项（含 qemu-iotests thorough/slow 变体）、默认选择 367 项，其中 unit 99 / qtest 66 / decodetree 44 / softfloat 41 / qapi 3 / func 26 / iotests 133；③ 历史声明 247 为程序级子集（unit 100 + qtest 66 + functional 81），系程序数而非用例数——评审 rule4 以用例级实测 N=732 判其少报，本版已修正为用例级 1325 例（≥ 732），程序级数字保留以便交叉核对"
  upstream_tests_harness: "unit + qtest 共 161 项全量驱动：Ok=160 / Fail=0 / Skipped=1（qtest 66/66 全通过，含 cdrom-test arm 9/9 与 aarch64 9/9、tpm-tis-device-swtpm-test 2/2 三项目由上游 SKIP 转 PASS；unit 94 项通过，仅 test-seccomp 保持 SKIP）。该口径使用仓库外的 4 个 LD_PRELOAD 宿主能力垫片（补偿 AF_UNIX 路径名 bind EPERM / mkfifo 被 seccomp 拒 / HMDFS 与 /dev/shm 的 fallocate 与锁互斥 / link EPERM）与运行期测试工具（socat、xorrisofs、swtpm），垫片不随配方发布，未修改任何上游测试源码"
  crypto_backend_enabled: "pass — 启用 libgcrypt/1.11.0 后 cbkdf 套件恢复真实断言：test-crypto-pbkdf 由空套件（1..0）变为 19 个用例（harness 口径判 OK，19 subtests passed；全量 harness 口径 Ok=160 / Fail=0 / Skipped=1），test-crypto-secret 16 subtests、test-crypto-hash 6 subtests、test-crypto-block 1 subtest 全部通过"
  package_tests: "25/25 assertions passed — 消费者功能测试（5 工具 --version、-M/-cpu 列表、qemu-img 建镜像与回读、包内固件、.codesign 签名段），含决定性的执行级验证：包内 qemu-arm 真实执行 arm-none-eabi-as/-ld 产出的 32 位 ARM ELF 并断言输出 qemu-arm-ok，qemu-aarch64 作负对照；并含 1 个完整端到端消费者用例（consumer_roundtrip.py，鸿蒙特有测试 / rule12：构造确定性语料 → qemu-img/qemu-io 跑通建镜像·写图案·自检·转 raw/压缩 qcow2/vmdk → 与独立参考逐字节比对，内部 12 项检查全过）"
