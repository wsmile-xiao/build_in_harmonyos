sources:
  url: "https://github.com/qemu/qemu/archive/refs/tags/v9.2.4.tar.gz"
  sha256: "c60f39779f3958152cf181db7aa33cce361a075f727a910679bbc3e3815f156f"

patches:
  - patch_file: "patches/0001-meson-build-treat-HarmonyOS-as-Linux-host.patch"
    patch_description: "meson 独立探测 host_machine.system() 得到 'harmonyos'，而 QEMU 自己的 configure 依据 __linux__ 判定 host_os=linux，两者不一致会让 `host_os != 'linux'` 的 user-mode 门禁直接中止配置（Target arm-linux-user is only available on a Linux host）。在 meson.build 读取 host_os 处把 harmonyos 归一为 linux，使其与 configure 的判定一致。"
    patch_type: "portability"
  - patch_file: "patches/0002-portability-harmonyos-sysroot-headers.patch"
    patch_description: "OHOS sysroot 与内核行为差异，五处：①<linux/vhost.h> 会链入 sysroot 自己的 virtio uapi 头（内核 _UAPI_* 守卫，且缺 libvhost-user 调用的 vring_need_event helper），与 QEMU 自带 standard-headers 副本重复定义 __virtio64/vring_desc 等，改为在 libvhost-user.h 中预置 sysroot 守卫使其不生效，让自带副本（含 helper）成为唯一来源；②musl 的 struct sigevent 没有 glibc 私有的 _sigev_un union，linux-user/syscall.c 的线程 id 赋值无法编译且 musl 本身也不支持 SIGEV_THREAD_ID，按 __GLIBC__ 分支屏蔽；③sysroot 的 linux/openat2.h 早于 Linux 5.12，缺 RESOLVE_CACHED 而 strace.c 要打印它，缺失时补齐内核取值 0x20；④HongMeng 内核（1.12.0）未实现 MAP_FIXED_NOREPLACE 而返回 ENOSYS，使 linux-user/elfload.c 的 guest_base 搜索候选全被否决（Unable to find a guest_base to satisfy all guest address mapping requirements，qemu-arm 因此无法执行任何目标程序），改为 ENOSYS 时清除该标志重试并校验落点是否等于请求地址，防止覆盖既有映射；⑤宿主 libc 可能在 <mqueue.h> 里声明 mq_open 却不从共享库导出（OHOS 的 musl 仅静态 libc.a 带该符号），使 linux-user/syscall.c 的 mqueue 翻译块链接失败（undefined symbol: mq_open），改为构建期能力探测——meson 用 cc.links 探测后写入 HAVE_MQ_OPEN，门禁用 defined(HAVE_MQ_OPEN) 而非平台宏（遵循 R8/PF5：补丁不得引入平台条件编译宏）。"
    patch_type: "portability"
