# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: qemu/11.1.1
homepage: "https://www.qemu.org"

# 上游测试入口：QEMU 用 Meson/Ninja，测试通过 `meson test` 运行
# (make check 只是配置层的包装，实际由 meson test --suite unit 执行)
upstream_check_command: "meson test --suite unit"

# conanfile.py build() 中未运行上游测试（QEMU 全量单元测试需大量宿主运行环境）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（在真实设备上执行过，见 notes.md）
upstream_tests:
  - file: tests/unit/
    source: qemu-11.1.1/tests/unit/
    description: "单元测试套件（104 项，含 test-base64/test-bitcnt/test-cutils/test-iov/test-keyval/test-mul64/test-qemu-opts 等全部 95 项通过）"
    command: "meson test --suite unit"

# test_package 中自带的测试（消费者视角，R34：实际执行打包产物）
test_package_tests:
  - file: test_package/test.sh
    description: "消费者用例：qemu-system-riscv64/qemu-img/qemu-nbd/qemu-io 四二进制 --version 版本校验 + qcow2 create/info 功能往返（5 例，/bin/sh 执行）"
    command: "/bin/sh test.sh <bindir>"

# 测试断言总数（近似值，用于质量评估）
# 单元测试 104 项（95 pass / 5 fail / 4 skip）；补 4 项消费者二进制 --version 断言
assertion_count: 108
