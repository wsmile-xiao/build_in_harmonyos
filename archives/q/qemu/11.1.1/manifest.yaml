# 版本级 manifest
# 文件位置: archives/q/qemu/11.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "11.1.1"

# 软件名
software: qemu

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://download.qemu.org/qemu-11.1.1.tar.xz"

  # 源码校验和
  sha256: "079ffbff8a7111bbc89022107cbabf3bbfd614d5fc9d7cc675991196aca12482"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表（configure 包装 Meson+Ninja）
  configure_options:
    - "--target-list=riscv64-softmmu"
    - "--disable-werror"
    - "--disable-kvm"
    - "--disable-hvf"
    - "--disable-dbus-display"
    - "--disable-keyring"
    - "--disable-guest-agent"
    - "--disable-guest-agent-msi"
    - "--disable-gtk"
    - "--disable-sdl"
    - "--disable-vnc"
    - "--disable-opengl"
    - "--disable-libssh"
    - "--disable-nettle"
    - "--disable-gnutls"
    - "--disable-bzip2"
    - "--disable-lzo"
    - "--disable-snappy"
    - "--disable-lzfse"
    - "--disable-zstd"
    - "--disable-seccomp"
    - "--disable-curl"
    - "--disable-vhost-user"
    - "--disable-vhost-kernel"
    - "--disable-slirp"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0
    - pixman/0.46.4
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-meson-build-harmonyos-linux.patch"
  - "patches/0002-can-skip-socketcan-on-harmonyos.patch"
  - "patches/0003-dtc-use-official-github-mirror.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Meson host_machine.system() 在 OHOS 返回 HarmonyOS，需归一化为 linux 才走 CONFIG_LINUX 路径（0001）"
  - "OHOS 拒绝加载未签名 ELF（EPERM/rc=126）：package() 须对全部打包 ELF 做 llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1（E077）"
  - "Meson 不记录 $ORIGIN RUNPATH，需在 generate() 注入依赖 lib 目录 -Wl,-rpath，否则运行时缺 libpixman-1.so.0（rc=127）"
  - "subproject [wrap-git] 在 OHOS 构建环境 git fetch 不可达：dtc 改 [wrap-file] 官方固定版本 tarball（0003），其余 bundled 子项目删 .wrap 用内置源码"
  - "OHOS /tmp 只读（erofs）：测试脚本禁用 /tmp 硬编码与 $(...)，用 $TMPDIR 兜底 + 重定向+grep"
  - "rust/ 为上游可选子模块（未参与构建），lang-preflight 报 mixed(cargo) 属检测器误报，主体纯 C/Meson（R47 边界：辅助目录不计主体）"
  - "上游 meson test 5 个 fail 均为 OHOS 宿主 EPERM/权限类限制（AF_UNIX bind/文件 truncate/HMDFS 权限归一化/inotify），4 个 skip 为 crypto 后端禁用与缺 socat"
