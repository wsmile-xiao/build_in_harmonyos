software: qemu
display: "QEMU"
description: "Generic machine emulator and virtualiser (system + user mode) for HarmonyOS PC"
category: emulator
homepage: "https://www.qemu.org/"
license: GPL-2.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "QEMU 自带 configure 是 shell 脚本而非 autotools：解析 CC/CFLAGS/LDFLAGS 后创建 build/ 并写 config-meson.cross，真实构建交给 meson+ninja"
    - "libfdt 用 cc.find_library('fdt') 探测而非 dependency()，必须把其 include/lib 目录显式传入 --extra-cflags/--extra-ldflags"
    - "bin/ 下全是宿主 aarch64 ELF，鸿蒙拒绝执行未签名 ELF，package() 需逐个 binary-sign-tool sign -selfSign 1"
    - "--target-list 必须显式限定为 ARM 系（arm/aarch64 的 softmmu + linux-user）：默认会构建 30+ 目标，成倍拉长构建时间"
    - "pc-bios/ 固件是数据文件（非可执行），随包安装到 share/qemu/ 直属目录（安装后不保留 pc-bios/ 层级），消费者按 <package_folder>/share/qemu/ 定位"
    - "本包是 ARM 目标程序在鸿蒙 PC 上可执行的最后一环：交叉工具链只能产出 ARM 产物，qemu-arm 才能运行它"

versions:
  "9.2.4":
    status: built
    build_date: "2026-09-27"
    conan_ref: "qemu/9.2.4"
  "11.1.1":
    status: built
    build_date: "2026-09-22"
    conan_ref: "qemu/11.1.1"
    note: "由另一 PR 交付并已合入 main；本软件级清单随 9.2.4 冲突解决一并登记全部已交付版本"
