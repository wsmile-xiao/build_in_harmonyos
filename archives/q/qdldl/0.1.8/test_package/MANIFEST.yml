# test_package/MANIFEST.yml — qdldl 0.1.8
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qdldl/0.1.8
homepage: "https://github.com/osqp/qdldl"

# 上游测试命令 (ctest -N 实测输出: 注册 1 项 tester)
upstream_check_command: "ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
# qdldl 上游单测在探索阶段以 QDLDL_UNITTESTS=ON 独立构建并运行（见 reports/test-report.md）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# CTest 注册 1 项 tester；内部以 minunit 运行 9 组子测试（qdldl_tester.c: all_tests()），
# 实测结果：9/9 通过，0 失败，0 跳过（本机 OHOS/aarch64, clang 15）
upstream_tests:
  - file: tests/qdldl_tester.c
    source: qdldl-0.1.8/tests/qdldl_tester.c
    description: "LDL^T 综合测试器（minunit 主程序，运行下述 9 组子测试）"
    command: "./qdldl_tester"
  - file: tests/test_basic.h
    source: qdldl-0.1.8/tests/test_basic.h
    description: "基础分解/求解正确性"
    command: "./qdldl_tester (组: test_basic)"
  - file: tests/test_identity.h
    source: qdldl-0.1.8/tests/test_identity.h
    description: "单位矩阵分解"
    command: "./qdldl_tester (组: test_identity)"
  - file: tests/test_rank_deficient.h
    source: qdldl-0.1.8/tests/test_rank_deficient.h
    description: "秩亏矩阵处理"
    command: "./qdldl_tester (组: test_rank_deficient)"
  - file: tests/test_singleton.h
    source: qdldl-0.1.8/tests/test_singleton.h
    description: "单元素矩阵"
    command: "./qdldl_tester (组: test_singleton)"
  - file: tests/test_sym_structure.h
    source: qdldl-0.1.8/tests/test_sym_structure.h
    description: "对称结构矩阵"
    command: "./qdldl_tester (组: test_sym_structure)"
  - file: tests/test_tril_structure.h
    source: qdldl-0.1.8/tests/test_tril_structure.h
    description: "仅下三角输入检测"
    command: "./qdldl_tester (组: test_tril_structure)"
  - file: tests/test_two_by_two.h
    source: qdldl-0.1.8/tests/test_two_by_two.h
    description: "2x2 矩阵分解/求解"
    command: "./qdldl_tester (组: test_two_by_two)"
  - file: tests/test_zero_on_diag.h
    source: qdldl-0.1.8/tests/test_zero_on_diag.h
    description: "零对角元处理"
    command: "./qdldl_tester (组: test_zero_on_diag)"
  - file: tests/test_osqp_kkt.h
    source: qdldl-0.1.8/tests/test_osqp_kkt.h
    description: "OSQP KKT 矩阵分解"
    command: "./qdldl_tester (组: test_osqp_kkt)"

# test_package 中自带的测试 (消费者视角验证，真实调用 qdldl API)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 QDLDL_etree/QDLDL_factor/QDLDL_solve 分解并求解 2x2 SPD 矩阵，与解析解比对（7 项检查）"
    command: "./test_qdldl"

# 测试断言总数：上游 9 组 mu_assert 15 项 + test_package 7 项检查
assertion_count: 22
