software: qcontrol
display: "qcontrol"
description: "Daemon and CLI controlling the peripherals (LCD, buttons, fans, LEDs, watchdog) of QNAP and Synology NAS devices"
category: system-tools
homepage: "https://www.hellion.org.uk/qcontrol/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "名字像终端工具，实为 NAS 外设守护进程：终端面只用到串口 termios（/dev/ttyS0、/dev/ttyS1），不使用 pty/ioctl。"
    - "上游唯一的库依赖经 pkg-config 硬编码模块名 lua5.1 发现，而制品仓 lua/5.1.5 发布的 pkg-config 名是 lua-5.1 且只有静态 liblua.a；改为在 make 命令行替换 CFLAGS/LIBS_DYNAMIC 两个由 pkg-config 派生的变量，不打补丁。"
    - "PKG_CONFIG=false 同时关掉可选的 libsystemd-daemon 探测（OHOS 无 systemd，socket activation 分支不得编入）。"
    - "上游 CFLAGS 的 -g 会把构建机路径写进产物，去掉 -g 后由 test_package/test_ohos.sh 断言产物内无任何宿主构建路径。"
    - "消费者测试以使用者身份真实调用二进制：版本串、usage、confdir() 的 glob 递归载入、Lua register() 装填 C 命令表、argv->C->Lua->logprint 往返、参数个数/未知命令退出码 255、坏配置与缺配置的诊断、无守护进程时 AF_UNIX 客户端的失败诊断。"
  common_dependencies:
    - lua/5.1.5

versions:
  "0.5.7":
    status: built
    build_date: "2026-09-26"
