# 版本级 manifest — archives/q/qcontrol/0.5.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0 + CONTRIBUTING「manifest.yaml 必填字段」

software: qcontrol
version: "0.5.7"

# conan-verify PASS(G1/G2/G3/G4) + conan create 全绿；尚未 upload，故 built
status: built

build_system: makefile
compile_date: "2026-09-26"
build_date: "2026-09-26"

source:
  url: "https://www.hellion.org.uk/qcontrol/releases/0.5.7/qcontrol-0.5.7.tar.gz"
  sha256: "ecc6977266531571e724146fe18478a3a4a168a8a766c47439c4a63b3f73aa3f"
  tar_format: tar.gz
  # 与 deb.debian.org/debian/pool/main/q/qcontrol/qcontrol_0.5.7.orig.tar.gz
  # 实测逐字节相同（cmp 无差异，同为 29396 字节），故 conandata 只写官方址（R39/PF7）。
  size_bytes: 29396
  http_status: built

dependencies:
  required:
    - lua/5.1.5
  optional: []
  # 上游另有 libsystemd-daemon 的条件探测（Makefile:13），本平台无 systemd，
  # 由 PKG_CONFIG=false 关闭，不参与依赖声明。
  system:
    - pthread
    - m
    - dl

build:
  system: makefile
  configure_options: []
  dependencies:
    - lua/5.1.5
  cc: /data/service/hnp/bin/clang
  cxx: ""
  make_command: >-
    make -j1 all CC=/data/service/hnp/bin/clang PKG_CONFIG=false
    CFLAGS='-c -Os -Wall -Wextra -DLUA_USE_POSIX -DLUA_USE_DLOPEN -I<lua>/include'
    LIBS_DYNAMIC='-lpthread -L<lua>/lib -llua -ldl -lm'
  notes:
    - "上游 Makefile:9-11 用硬编码模块名 lua5.1 问 pkg-config 要参数；制品仓 lua/5.1.5 的 pkg-config 名是 lua-5.1（实测 pkg-config --exists lua5.1 → rc=1 No package 'lua5.1' found），故在 make 命令行替换 CFLAGS/LIBS_DYNAMIC 两个由 pkg-config 派生的变量，flags 全部取自 conan 依赖的 cpp_info（R33）。"
    - "PKG_CONFIG=false 同时关闭 Makefile:13 的 libsystemd-daemon 条件探测，-DHAVE_SYSTEMD 不编入（OHOS 无 systemd）。"
    - "去掉上游 CFLAGS 的 -g：它会把构建机路径写进产物；test_package/test_ohos.sh 第 9 条硬断言产物内无任何本机构建路径。不做 strip（abduco/0.6 记录 OHOS MAC 拒绝被 llvm-strip 的二进制）。"
    - "只构建默认动态目标 all；上游 qcontrol-static 目标引用 <libdir>/liblua5.1.a，该文件名在 conan 的 lua 包里不存在（实为 liblua.a）。"

patches_applied: []

test_results:
  type: manual
  # 上游无任何测试套件（三条实测证据见 test_package/MANIFEST.yml 头部）
  upstream_total: 0
  upstream_runnable: 0
  upstream_passed: 0
  upstream_skipped: 0
  upstream_failed: 0
  upstream_tests_modified: false
  # 消费者侧真机断言
  consumer_total: 45
  consumer_passed: 45
  consumer_failed: 0
  consumer_skipped: 0
  total: 45
  passed: 45
  failed: 0

knowledge_ref: []

artifacts:
  bin:
    - bin/qcontrol
  share:
    - share/qcontrol/examples/{mv2120,synology,ts209,ts219,ts409,ts41x}.lua
    - share/doc/qcontrol/README
    - share/doc/qcontrol/HACKING
  licenses:
    - licenses/COPYING

platform_limits:
  - "串口节点不存在：open(/dev/ttyS0|/dev/ttyS1) → errno=2 (ENOENT)。上游所有 NAS 外设驱动都走这两个节点，本平台无承载物。"
  - "evdev 不可开：open(/dev/input/event0|event1|mice) → errno=13 (EACCES)；glob(/dev/input/event*) → GLOB_ABORTED/EACCES。"
  - "AF_UNIX bind 在实测的 4 个挂载点全部失败（HMDFS → EPERM；/dev/shm、/data/local/tmp → EACCES；/mnt/temp → ENOENT），且 /var/run 目录本身不存在 ⇒ 守护模式 -d/-f 无可用监听地址；默认 client 模式实测以 Error connecting to socket: No such file or directory + rc=255 优雅失败（已作为消费者测试第 11 条断言）。"
  - "以上均不影响本次验证通过的部分：CLI 参数解析、版本串、内嵌 Lua 配置装载（confdir glob）、register() 命令表、argv→C→Lua→logprint 往返、错误路径退出码。"
