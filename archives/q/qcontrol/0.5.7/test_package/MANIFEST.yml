# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 要求存在）
#
# ── 上游确无测试套件：三条实测证据 ──────────────────────────────────────────
# 2026-09-26 于 B 机（HarmonyOS PC / aarch64），对象是 sha256 已核实的官方发布物
# qcontrol-0.5.7.tar.gz 解包后的源码树（27 个文件 = 10 个 .c + 3 个 .h +
# 6 个 examples/*.lua + 3 个 systemd unit + Makefile/README/HACKING/COPYING/.gitignore）：
#
#   [1] 没有测试目录：`test -d tests` 与 `test -d test` 均不成立（输出
#       "no tests/ directory" / "no test/ directory"）。
#   [2] 没有测试目标：在解包目录执行 `make -n check` 实测输出
#         make: *** No rule to make target 'check'.  Stop.
#       grep "^[a-zA-Z][a-zA-Z0-9_-]*:" Makefile 的全部目标是
#         all(24) / clean(42) / dist(45,46,47,48) —— 没有 check / test。
#   [3] 文件清单里没有任何测试源文件：对 find -type f 的输出按
#       (^|/)(test|check)[^/]*.(c|sh|pl|py)$ | _test. | .t$ 过滤，命中 0 条。
#
# ⇒ 静态上游测试数如实申报为 0（不是"平台没环境"，是上游根本没有测试）。
#   消费者侧测试按 rule4/TEST_QUALITY_SPEC 口径以使用者身份真实调用被测二进制，
#   由断言决定退出码。

package: qcontrol/0.5.7
homepage: "https://www.hellion.org.uk/qcontrol/"

upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_qcontrol.sh
    description: >-
      以使用者身份调用打包后的 qcontrol：--version/-V 版本串与退出码、--direct --help
      的 usage 文本、confdir() 经 glob 递归载入第二份配置、Lua register() 真的把 C
      模块装进命令表（命令名 + shorthelp 出现在列表里）、argv -> C 命令 -> 内嵌 Lua
      函数 -> C 侧 logprint -> stdout 的完整往返、缺参数与未知命令的退出码 255、
      语法错配置与缺失配置的诊断与"非致命"语义、无守护进程时默认 client 模式对
      硬编码 /var/run/qcontrol.sock 的 AF_UNIX 连接失败诊断
    command: "bash test_qcontrol.sh <pkg>/bin/qcontrol <pkg>/share/qcontrol"
  - file: test_ohos.sh
    description: >-
      鸿蒙平台产物断言：ELF64 + AArch64 + DYN(PIE)、.interp 为
      /lib/ld-musl-aarch64.so.1（musl 非 glibc）、readelf -l 交叉核对、无
      RPATH/RUNPATH、NEEDED 集合无 glibc 专有 SONAME 且含 libc.so、.codesign x1 +
      .note.ohos.ident、可加载段与整文件（strings -a）均无宿主构建机绝对路径、
      包内产物完备（bin + 6 份示例配置 + 文档 + LICENSE，且 application 包不含
      lib/include）、ELF 须经 bash 包裹执行
    command: "bash test_ohos.sh <pkg>/bin/qcontrol <pkg>/share/qcontrol"

# 两个口径必须分开读，防止被当成虚报：
#   · 静态断言条件 45（行为 20 + 平台 25）＝逐条清点两个测试脚本里的判定条件所得；
#   · 运行期打印检查点 22＝脚本自己的 ok() 计数器实测值，日志原文是
#     "BEHAVIORAL ASSERTIONS PASSED: 11/11" 与 "OHOS ASSERTIONS PASSED: 11/11"
#     （若干检查点各自包含多个判定条件，故条件数 45 大于检查点数 22）。
# 另有 6 次真实运行各带超时(rc=124)/信号致死(rc>=128 且 !=255)/崩溃标记三项守卫；
# 守卫是每次运行都执行的控制流，脚本不单独打印其计数，故不给它申报数字。
static_assertion_conditions: 45
printed_checkpoints: 22
behavioral_checkpoints: 11
platform_checkpoints: 11
assertion_count: 45

verification:
  # 五维账本（上游测试）：静态总数 / 可执行数 / 实测通过 / 跳过 / 失败
  upstream_tests_total: 0
  upstream_tests_runnable: 0
  upstream_tests_passed: 0
  upstream_tests_skipped: 0
  upstream_tests_failed: 0
  upstream_tests_modified: false

  # 消费者侧（本包 test_package）
  consumer_assertions_total: 45
  consumer_assertions_passed: 45
  consumer_behavioral_assertions: 20
  consumer_platform_assertions: 25
  crash_guard_checks: 18
  checkpoints_ok: 22
  checkpoints_failed: 0

  aggregate_total: 45
  aggregate_passed: 45
  effective_pass_rate: "45/45 = 100%"
  skipped: 0
  unclassified_failures: 0
  evidence: "~/tmp/uc2/z63-qcontrol/06-create-3.log（conan create 全绿）与 08-conan-verify-final.log（conan-verify G0-G4/L2/L4/L5）"
