# test_package/MANIFEST.yml
# Upstream and consumer test declaration for qmmp/2.3.2 (CI L0e requires this file).

package: qmmp/2.3.2
homepage: https://qmmp.ylsoftware.com/

# 上游测试入口：qmmp 2.3.2 无自动化测试（源码内无 enable_testing()/add_test()、
# 无 tests/ 目录、无 CTest 注册项；CMakeLists 只构建 src/qmmp、src/qmmpui、
# src/plugins、src/app、doc）。核验证据见 notes.md「上游测试入口核验」一节。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_package/test.cpp
    description: "消费者测试（real API, R34）：Qmmp::strVersion()/configDir()/pluginPath()、Qmmp::findPlugins(\"Input/\"|\"Output/\"|\"Effect/\") 逐项确认 9 个已启用解码器与输出/效果插件就位、CueParser 解析内存 CUE 表（files/offset/createPlayList）"
    command: "./test_qmmp"
  - file: test_package/ohos_test.cpp
    description: "HarmonyOS 专项测试：libqmmp/liblqmmpui 的 DT_SONAME 断言、50 个插件全部为可重定位 ELF64 模块（DT_NEEDED 无任何含 '/' 路径）、10 个插件类别目录齐备、解码器集合与 bin/qmmp 应用产物、offscreen 下 Qt Widgets 运行链路"
    command: "./test_qmmp_ohos"

# 断言总数：消费者测试 12 条 + 鸿蒙专项 6 组断言
assertion_count: 18
