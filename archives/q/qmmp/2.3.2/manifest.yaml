knowledge_gained:
  - "qmmp 2.x 的插件依赖全部通过 pkg-config 探测（每个插件 pkg_search_module/pkg_check_modules 后 if(FOUND) 才 add_library），因此平台适配的主要工作是让 PKG_CONFIG_PATH 指向正确的 .pc：已发布依赖包自带的 .pc 常把 prefix 烤成构建机目录或 /usr/local，必须在配方里用 PkgConfigDeps + 就地修正 prefix 的 shim 覆盖（否则 CMake 会创建含不存在 include 目录的 imported target 并失败）。"
  - "qmmp 的 CMakeLists 在 configure 阶段用 execute_process 调 Qt Linguist lrelease 生成 .qm；只要 Qt6::lrelease 目标存在就不会 FATAL_ERROR，即使工具执行失败也不阻塞构建（本项目未额外打补丁）。"
  - "链接没有 DT_SONAME 的依赖库时，链接器会把打开时的绝对路径写进 DT_NEEDED；libvorbisfile/libvorbisenc/libsoxr/libQt6Multimedia 等已发布包即如此，导致插件被钉死在构建机路径上。配方在 package() 阶段就地缩短这些 .dynstr 字符串为纯文件名（长度只减不增），使模块可重定位（qmmp 实测 6 条）。"
  - "ohpcd 的 libogg 存在两套互斥 pin：opusfile/0.12 精确锁定 libogg/1.3.5 + openssl/3.5.6，而 libvorbis/1.3.7（经 libshout/2.4.6）需要 libogg/1.3.6；同一依赖图只能满足一边，取舍后保留 opusfile（放弃 Icecast 输出插件）并用独立 vorbis/1.3.7 包提供 vorbis.pc/vorbisfile.pc。"
