package: qt/5.15.19
homepage: "https://doc.qt.io/qt-5/"

upstream_check_command: "qmake selected upstream test .pro files, then make and run them"
upstream_test_in_build: true
upstream_test_command: "QT_QPA_PLATFORM=offscreen ./tst_qstring && ./tst_qhostaddress && ./tst_qimage && ./tst_qsizepolicy && ./tst_qdom"
upstream_case_count: 5
upstream_test_note: "Build and execute selected upstream Qt tests covering Core, Network, Gui, Widgets and Xml without requiring a display server."

upstream_tests:
