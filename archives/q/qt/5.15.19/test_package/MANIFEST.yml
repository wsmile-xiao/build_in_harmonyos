    description: "Upstream QString behavior tests"
    command: "./tst_qstring"
  - file: qtbase/tests/auto/network/kernel/qhostaddress/tst_qhostaddress.cpp
    source: qt-everywhere-opensource-src-5.15.19/qtbase/tests/auto/network/kernel/qhostaddress/tst_qhostaddress.cpp
    description: "Upstream QHostAddress tests"
    command: "./tst_qhostaddress"
  - file: qtbase/tests/auto/gui/image/qimage/tst_qimage.cpp
    source: qt-everywhere-opensource-src-5.15.19/qtbase/tests/auto/gui/image/qimage/tst_qimage.cpp
    description: "Upstream QImage raster tests"
    command: "./tst_qimage"
  - file: qtbase/tests/auto/widgets/kernel/qsizepolicy/tst_qsizepolicy.cpp
    source: qt-everywhere-opensource-src-5.15.19/qtbase/tests/auto/widgets/kernel/qsizepolicy/tst_qsizepolicy.cpp
    description: "Upstream QSizePolicy value tests"
    command: "./tst_qsizepolicy"
  - file: qtbase/tests/auto/xml/dom/qdom/tst_qdom.cpp
    source: qt-everywhere-opensource-src-5.15.19/qtbase/tests/auto/xml/dom/qdom/tst_qdom.cpp
    description: "Upstream Qt XML DOM tests"
    command: "./tst_qdom"

test_package_tests:
  - file: test_qt5.cpp
    description: "Load offscreen QPA, show a QWidget, draw a raster image, and exercise Qt Network and Xml APIs"
    command: "./test_qt5"

assertion_count: 13
