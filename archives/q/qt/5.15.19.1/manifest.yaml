software: qt
# 5.15.19.1 = 5.15.19 基础上启用 QtDBus（移除 -no-dbus），新增 Qt5::DBus 组件
version: "5.15.19.1"
status: built
build_system: custom
build_date: "2026-09-05"

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.19/single/qt-everywhere-opensource-src-5.15.19.tar.xz"
  sha256: "173c2326dae138bbb0d98921e9d911e55c00163d93a6db29f294b5e19ff306ae"
  tar_format: tar.xz

build:
  system: qmake-configure
  configure_options:
    - "-platform harmonyos-clang"
    - "-xplatform harmonyos-clang"
    - "-opensource -confirm-license"
    - "-prefix /"
    - "-shared"
    - "-nomake examples"
    - "-nomake tests"
    - "-no-dbus"
    - "-no-opengl"
    - "-no-eglfs"
    - "-no-linuxfb"
    - "-no-xcb"
    - "-no-xkbcommon"
    - "-no-libinput"
    - "-no-gtk"
    - "-no-glib"
    - "-no-cups"
    - "-no-icu"
    - "-no-fontconfig"
    - "-no-ssl"
    - "-no-sql-sqlite"
    - "-qt-zlib"
    - "-qt-pcre"
    - "-qt-libpng"
    - "-qt-libjpeg"
    - "-qt-freetype"
    - "-qt-harfbuzz"
    - "-skip non-qtbase modules"
  dependencies:
    required: []
    optional:
      - "xcb disabled"
      - "OpenGL/EGL disabled"
      - "DBus disabled"
      - "fontconfig disabled"
      - "SSL disabled"
      - "ICU disabled"
      - "SQLite SQL plugin disabled"
  tool_assumptions:
    - "HarmonyOS clang/clang++ from the active Conan profile"
    - "make and sh available in PATH"
    - "perl available for Qt syncqt/qmake build scripts"
    - "binary-sign-tool, llvm-objcopy and llvm-objdump available for installed ELF signing"

patches_applied:
  - "0001-mkspecs-add-harmonyos-clang.patch"
  - "0002-corelib-disable-pthread-cancel.patch"

knowledge_gained:
  - "Qt 5.15.19 single source archive uses the top-level configure script and qmake build graph, not the Qt 6 CMake-first flow."
  - "The first package scope is intentionally limited to qtbase modules: Core, Network, Gui, Widgets and Xml."
  - "Bundled zlib, pcre, libpng, libjpeg, freetype and harfbuzz keep W0 package dependencies empty for the first validation pass."
  - "Desktop integration stacks are disabled so the consumer test can run with the offscreen QPA backend."
  - "Qt 5.15.19 qhash.cpp does not contain the Qt 6 ARM AES hash block, so no ARM AES patch is applied for this package."
  - "Conan no_copy_source is enabled because Qt 5 supports shadow builds and copying the full 664 MB source tree timed out before configure on device."
  - "Shadow CI r3 reached patch application; patch entries now use strip: 1, corrected hunk counts, and dropped the Qt 6-only ARM AES hash patch that is absent from Qt 5.15.19."
  - "Shadow CI r4 applied both active patches and reached configure; L1 failed with Error 126 because qtbase/configure was not executable after source extraction."
  - "Shadow CI r5 adds executable bits to configure and qtbase/configure after patch application and before the shadow-build configure step."
  - "Shadow CI r12 reached Qt configure tests; verifyspec failed because the bootstrap qt.conf kept TargetSpec=dummy even after qmake was created."
  - "Shadow CI r13 patches qtbase/configure so the bootstrap qt.conf writes TargetSpec=$PLATFORM, allowing config-test qmake subprocesses to load harmonyos-clang instead of dummy."
  - "Shadow CI r19 failed while applying 0001-mkspecs-add-harmonyos-clang.patch because the qt_functions.prf hunk header pointed at line 217 even though its first context line is line 214 in Qt 5.15.19. Follow-up r20 corrects the hunk header while keeping the HarmonyOS LD_LIBRARY_PATH host OS fix."

test_results:
  upstream:
    total: 5
    passed: 5
    status: passed-shadow-ci-r23
    command: "recipe builds selected qmake upstream tests: tst_qstring, tst_qhostaddress, tst_qimage, tst_qsizepolicy, tst_qdom"
  test_package:
    total: 1
    passed: 1
    status: passed-shadow-ci-r23
    command: "ctest --output-on-failure via Conan test_package"
    assertion_count: 13
  local_static:
    total: 2
    passed: 1
    failed: 1
    details:
      - "Source URL and sha256 recorded from official Qt archive metadata."
      - "Conan is not installed in this Windows shell PATH, so conan create/conan inspect was not run locally."

