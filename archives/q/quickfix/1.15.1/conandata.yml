sources:
  url:
    - "https://codeload.github.com/quickfix/quickfix/tar.gz/refs/tags/v1.15.1"
    - "https://github.com/quickfix/quickfix/archive/refs/tags/v1.15.1.tar.gz"
  sha256: "1c4322a68704526ca3d1f213e7b0dcd30e067a8815be2a79b2ab1197ef70dcf7"
  filename: "quickfix-v1.15.1.tar.gz"

patches:
  - patch_file: "patches/0001-makefile-am-prune-nonessential-subdirs.patch"
    patch_description: "Prune UnitTest++/examples/doc from top-level SUBDIRS: UnitTest++ ships a standalone Makefile hardcoding CXX=g++ (built separately by the recipe with the OHOS clang), the banzai GUI example requires java/ant via #!/bin/bash build.sh (no /bin/bash, no JVM on OHOS), and doc is doxygen/html-only"
    patch_type: "portability"
  - patch_file: "patches/0002-atomiccount-replace-x86-inline-asm.patch"
    patch_description: "Replace the x86-only 'lock; xadd' inline asm in FIX::atomic_count with the __atomic_fetch_add builtin (same pre-modification return value, same full barrier), so the file assembles on aarch64 and every other GCC/clang target"
    patch_type: "portability"
  - patch_file: "patches/0003-src-cpp-makefile-static-symlink-tolerant.patch"
    patch_description: "Ignore ln -s failures for libquickfix.so/.dylib in src/C++ all-local, because the recipe builds with --disable-shared --enable-static (R26) and those artifacts do not exist"
    patch_type: "portability"
