# MANIFEST.yml — quickfix 1.15.1 test_package 声明
# 上游测试入口盘点（真实，未伪造）

upstream_tests:
  # 上游测试分两层：
  #  A) 单元测试：bundled UnitTest++ 框架，入口 src/ut（test/runut.sh →
  #     `./ut -p <port> -f cfg/ut.cfg`），由 ut.cpp 静态 #include 各
  #     *TestCase.cpp 组成单一编译单元。
  #  B) 验收测试（acceptance test）：入口 test/runat.sh —— `at`（FIX
  #     acceptor 服务端）+ `ruby Runner.rb`（发起端逐条回放 definitions/
  #     server/**/*.def）。
  unit_tests:
    source_macro_count: 220        # 31 个 *TestCase.cpp 全部 TEST/TEST_FIXTURE
    not_wired_into_ut_cpp: 5       # GroupTestCase 1 + StringUtilitiesTestCase 4
                                   # （文件在磁盘上，但 ut.cpp 未 #include，框架不注册）
    db_guarded_out: 15             # MySQL/Odbc/PostgreSQL 各 5，
                                   # HAVE_MYSQL/HAVE_ODBC/HAVE_POSTGRESQL 未定义
    framework_registered: 200      # ut 实际注册并运行数（框架自报）
  acceptance_tests:
    def_files_total: 467           # definitions/server/fix4* + fix50 + fix50sp1
                                   # + fix50sp2（runat.sh 的 glob 范围）
    fix40: 56                      # 以下分目录实测计数（供对账）
    fix41: 56
    fix42: 58
    fix43: 58
    fix44: 59
    fix50: 60
    fix50sp1: 60
    fix50sp2: 60
    future_dir: excluded_by_runat_sh   # definitions/server/future（2 个 .def）
                                       # 不在 runat.sh glob 内

consumer_tests:
  test_consumer.cpp: 1            # 编译链接 + 公开 FIX API 行为断言
  assertions: 9                   # 序列化 4 + 回解析 3 + Dictionary 1 + SessionID 1
  cpp_standard: "c++11"           # 头文件含 throw(...) 动态异常规格（C++17 移除）
