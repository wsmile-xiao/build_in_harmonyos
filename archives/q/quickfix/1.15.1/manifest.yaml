software: quickfix
version: "1.15.1"
status: built
build_date: "2026-09-22"
build_system: autotools

source:
  url: "https://github.com/quickfix/quickfix/archive/refs/tags/v1.15.1.tar.gz"
  sha256: "1c4322a68704526ca3d1f213e7b0dcd30e067a8815be2a79b2ab1197ef70dcf7"
  tar_format: tar.gz
  release_channel_note: "官网 quickfixdev.org 已不可达（连接失败）；v1.15.1 的官方发行物 = GitHub tag v1.15.1 归档（git ls-remote 实核 peeled commit 6908dc8c）。上游 configure.ac 的 AC_INIT 滞留在 1.14.3（上游未随 tag 更新），包版本以 release tag 为准。"

build:
  system: autotools
  bootstrap: "构建期 autoreconf -fi（tag 归档无预生成 configure；先 touch ChangeLog INSTALL 满足 GNU strictness）"
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    required: []
    optional:
      - "OpenSSL (native SSL, upstream default off, disabled)"
      - "MySQL (upstream default off, disabled)"
      - "PostgreSQL (upstream default off, disabled)"
      - "Boost (shared_ptr fallback, upstream default off, disabled)"
      - "STLPort (upstream default off, disabled)"
      - "TBB (upstream default off, disabled)"
      - "python2/python3/ruby/java SWIG bindings (upstream default off, disabled)"
    build_tools:
      - "automake/1.18 (tool_requires, build context)"
      - "libtool/2.5.4 (tool_requires, build context)"
      - "autoconf 2.7x / m4 / perl 5.42.0 / bash / clang (SDK /data/service/hnp/bin)"
  cc: clang (aarch64-unknown-linux-ohos)
  cxx_standard_note: "configure 尾部追加 -std=c++0x（C++11）最终生效；头文件含 throw(...) 动态异常规格（C++17 移除），消费方必须 ≤C++14 编译，test_package 显式 -std=c++11"
  patches_applied:
    - "patches/0001-makefile-am-prune-nonessential-subdirs.patch"
    - "patches/0002-atomiccount-replace-x86-inline-asm.patch"
    - "patches/0003-src-cpp-makefile-static-symlink-tolerant.patch"

test_results:
  type: official
  total: 667
  passed: 667
  failed: 0
  skipped: 0
  note: "上游两层测试全部真机实跑通过。①单元测试 200/200：上游入口 ./ut -p 54321 -f cfg/ut.cfg（bundled UnitTest++，rc=0，11.4s）；源码宏口径 220 = 框架注册 200 + MySQL/Odbc/PostgreSQL 守卫宏 15（HAVE_MYSQL/HAVE_ODBC/HAVE_POSTGRESQL 未定义）+ 未纳入 ut.cpp 编译单元 5（GroupTestCase 1 + StringUtilitiesTestCase 4，上游自身未接线）。②验收测试 467/467：上游 runat.sh 形态（at acceptor 服务端 + ruby Runner.rb 回放 definitions/server/fix4* + fix50 + fix50sp1 + fix50sp2 共 467 个 .def），467 条 <test ... result='success'/>，Runner rc=0。definitions/server/future 的 2 个 .def 不在 runat.sh 的 glob 内（上游自身排除），不计入分母。消费者测试另计：test_package 9 项公开 API 行为断言全通过。"

knowledge_gained:
  - "x86 专用 lock xadd 内联汇编在 aarch64 汇编失败，__atomic_fetch_add 内建等义替换" # knowledge_ref: E659
  - "消费含 throw(...) 动态异常规格的库头文件必须 ≤C++14 编译（configure 尾部追加 -std=c++0x 最终生效）" # knowledge_ref: DRAFT-CXX17-REMOVED-CONSTRUCTS-COMPILE-OUT-VIA-FEATURE-MACRO
  - "config.guess 不识别 HongMeng 内核，需显式 --build/--host 三元组" # knowledge_ref: E160
