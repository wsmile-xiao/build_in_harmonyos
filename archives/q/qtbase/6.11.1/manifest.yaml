software: qtbase
version: "6.11.1"
status: pending
build_system: cmake
build_date: ""

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtbase-everywhere-src-6.11.1.tar.xz"
  sha256: "d9594a31228aa23ad6b531719a29b45f0f3989fe6c136d45767ea179f233c1ac"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "QT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "BUILD_SHARED_LIBS=ON"
    - "QT_BUILD_TESTS=ON"
    - "QT_BUILD_TESTS_BY_DEFAULT=OFF"
    - "FEATURE_testlib=ON"
    - "FEATURE_gui=ON"
    - "FEATURE_network=ON"
    - "FEATURE_widgets=ON"
    - "FEATURE_graphicsview=ON"
    - "INPUT_opengl=no"
    - "FEATURE_opengl=OFF"
    - "FEATURE_xcb=OFF"
    - "FEATURE_dbus=OFF"
    - "FEATURE_printsupport=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-QtPlatformSupport.cmake-add-HarmonyOS.patch"
  - "0002-mkspecs-add-harmonyos-clang.patch"
  - "0003-corelib-disable-pthread-cancel.patch"
  - "0004-cmake-platforms-add-HarmonyOS.patch"
  - "0005-cmake-skip-android-autodetect.patch"
  - "0006-corelib-disable-arm-aes-hash-on-harmonyos.patch"

knowledge_gained:
  - "Qt 6 dependent modules require real Qt Gui, Widgets and graphicsview targets; a Core-only QtBase package cannot satisfy them."
  - "The raster-based Gui and Widgets libraries can be built without XCB, OpenGL, EGL, DBus or a display server."
  - "Qt native CMake package files must remain discoverable to downstream Qt modules."
  - "HarmonyOS Clang advertises ARM crypto support while its NEON headers omit the AES intrinsics used by Qt; qHash must use the portable fallback."
  - "Seven upstream Qt test executables are built explicitly and run with the offscreen QPA backend so tests remain outside the default package build while still producing an actual pass rate."

test_results:
  upstream:
    total: 7
    command: "ctest --output-on-failure -R '^(tst_qcolor|tst_qhostaddress|tst_qsizepolicy|tst_qwidget|tst_qimage|tst_qpainter|tst_qdom)$'"
    status: pending_ci
  added:
    total: 13
    status: previously_passed

dependency_for:
  - "qtpositioning/6.11.1"
  - "qtlocation/6.11.1"
  - "qtlanguageserver/6.11.1"
  - "qtremoteobjects/6.11.1"
  - "qtserialport/6.11.1"
  - "qthttpserver/6.11.1"
  - "qtcharts/6.11.1"
