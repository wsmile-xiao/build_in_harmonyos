    command: "test_qtbase --offscreen"
  - file: test_wayland_codegen.cpp
    description: "Run generated Wayland protocol metadata and call a downstream Qt shared library"
    command: "test_wayland_codegen"
  - file: consumer_bridge.cpp
    description: "Build a real downstream shared library with Qt Core and exercise CMake platform/RPATH metadata"
    command: "called by test_wayland_codegen"
  - file: test_qtbase.cpp
    description: "Temporary-file reopening, atomic save, machine-ID query, timezone conversion, runtime paths, interrupted stdio EOF and long-name shared memory with two locked child writers"
    command: "test_qtbase --system"
  - file: qtbase-test.xml
    description: "Minimal protocol fixture consumed by qt6_generate_wayland_protocol_client_sources"
    command: "generated during CMake build"
  - file: conanfile.py
    description: "Invoke run_tests.py; the deliberate negative control must return exactly 97"
    command: "test_qtbase --negative-control"
  - file: run_tests.py
    description: "Capture stdout/stderr and exact exit codes; reject loader failures, missing executables and timeouts"
    command: "test_qtbase --invalid-mode (expected exit 65)"

