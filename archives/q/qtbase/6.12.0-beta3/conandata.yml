sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/qt/development_releases/qt/6.12/6.12.0-beta3/submodules/qtbase-everywhere-src-6.12.0-beta3.tar.xz"
    - "https://mirrors.ustc.edu.cn/qtproject/development_releases/qt/6.12/6.12.0-beta3/submodules/qtbase-everywhere-src-6.12.0-beta3.tar.xz"
    - "https://mirrors.cloud.tencent.com/qt/development_releases/qt/6.12/6.12.0-beta3/submodules/qtbase-everywhere-src-6.12.0-beta3.tar.xz"
    - "https://download.qt.io/development_releases/qt/6.12/6.12.0-beta3/submodules/qtbase-everywhere-src-6.12.0-beta3.tar.xz"
  sha256: "f3824da6358d11da552dfbda21107c666606baac2d283a31d0ee1a052fdcff37"

patches:
  - patch_file: "patches/0001-cmake-QtPlatformSupport.cmake-add-HarmonyOS.patch"
    patch_description: "Treat HarmonyOS as a Linux-compatible UNIX platform"
    patch_type: "portability"
  - patch_file: "patches/0002-mkspecs-add-harmonyos-clang.patch"
    patch_description: "Add the harmonyos-clang Qt mkspec"
    patch_type: "portability"
  - patch_file: "patches/0003-corelib-disable-pthread-cancel.patch"
    patch_description: "Use a capability macro when pthread cancellation APIs are unavailable"
    patch_type: "portability"
  - patch_file: "patches/0004-cmake-platforms-add-HarmonyOS.patch"
    patch_description: "Reuse CMake Linux shared-library platform rules"
    patch_type: "portability"
  - patch_file: "patches/0005-cmake-skip-android-autodetect.patch"
    patch_description: "Skip Android autodetection for the harmonyos-clang mkspec"
    patch_type: "portability"
  - patch_file: "patches/0006-corelib-disable-arm-aes-hash-on-harmonyos.patch"
    patch_description: "Use Qt's portable hash when HarmonyOS headers lack ARM AES intrinsics"
    patch_type: "portability"
  - patch_file: "patches/0007-fix-ohos-toolchain-path-resolution.patch"
    patch_description: "Fix relative CMAKE_TOOLCHAIN_FILE path resolution in OHOS autodetect"
    patch_type: "portability"
  - patch_file: "patches/0008-disable-qos-harmony-define.patch"
    patch_description: "Disable Q_OS_HARMONY to use Linux code paths instead of OHOS NDK platform code"
    patch_type: "portability"

