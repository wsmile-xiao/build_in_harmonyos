patches:
  - patch_file: "patches/0001-cmake-QtPlatformSupport.cmake-add-HarmonyOS.patch"
    patch_description: "Treat HarmonyOS as a Linux-compatible UNIX platform"
    patch_type: "portability"
  - patch_file: "patches/0002-mkspecs-add-harmonyos-clang.patch"
    patch_description: "Add the harmonyos-clang Qt mkspec"
    patch_type: "portability"
  - patch_file: "patches/0003-corelib-disable-pthread-cancel.patch"
    patch_description: "Use a capability macro when pthread cancellation APIs are unavailable"
    patch_type: "portability"
  - patch_file: "patches/0004-cmake-platforms-add-HarmonyOS.patch"
    patch_description: "Reuse CMake Linux shared-library platform rules"
    patch_type: "portability"
  - patch_file: "patches/0005-cmake-skip-android-autodetect.patch"
    patch_description: "Skip Android autodetection for the harmonyos-clang mkspec"
    patch_type: "portability"
  - patch_file: "patches/0006-corelib-disable-arm-aes-hash-on-harmonyos.patch"
    patch_description: "Use Qt's portable hash when HarmonyOS headers lack ARM AES intrinsics"
    patch_type: "portability"
  - patch_file: "patches/0007-cmake-build-soname-files-without-symlinks.patch"
    patch_description: "Build ABI-named shared libraries directly on filesystems rejecting symlinks"
    patch_type: "portability"
  - patch_file: "patches/0009-dbus-report-missing-machine-id-without-abort.patch"
    patch_description: "Use D-Bus error-reporting machine ID lookup when linking libdbus"
    patch_type: "portability"
  - patch_file: "patches/0010-corelib-retry-stdio-after-transient-read-errors.patch"
    patch_description: "Clear transient stdio state and reject regular-file paths with trailing separators"
    patch_type: "portability"
  - patch_file: "patches/0011-corelib-use-uid-for-missing-runtime-user.patch"
    patch_description: "Use numeric UID for runtime directories when no passwd entry exists and exercise that case"
    patch_type: "portability"
  - patch_file: "patches/0012-tests-use-configured-moc-compiler.patch"
    patch_description: "Compile moc output with the configured C++ compiler and preserve its runtime environment"
    patch_type: "portability"
  - patch_file: "patches/0013-tests-add-harmonyos-file-selector-fixtures.patch"
    patch_description: "Add HarmonyOS data to the existing unchanged file-selector assertions"
    patch_type: "portability"
  - patch_file: "patches/0014-cmake-load-packaged-conan-dependency-bridges.patch"
    patch_description: "Load optional packaged Conan dependency bridges before Qt's external dependency discovery"
    patch_type: "portability"
  - patch_file: "patches/0016-testlib-restore-signal-action-before-forwarding.patch"
    patch_description: "Explicitly restore the previous fatal signal action before forwarding it"
    patch_type: "portability"
  - patch_file: "patches/0017-tests-use-configured-temporary-socket-directory.patch"
    patch_description: "Use QDir tempPath for socket fixtures rather than a hardcoded system tmp directory"
    patch_type: "portability"
  - patch_file: "patches/0018-tests-use-private-filesystem-fixtures.patch"
    patch_description: "Use owned directories for watcher and read-only directory tests with the original behavioral assertions"
    patch_type: "portability"
  - patch_file: "patches/0019-tests-respect-disabled-thread-cancellation.patch"
    patch_description: "Report five thread-cancellation cases as skipped when the existing Qt capability disables cancellation"
    patch_type: "portability"
  - patch_file: "patches/0020-tests-reset-abort-race-signal-handler.patch"
    patch_description: "Explicitly restore the default action so the second racing abort terminates the helper"
    patch_type: "portability"
  - patch_file: "patches/0021-corelib-trash-files-without-hardlinks.patch"
    patch_description: "Use the existing trash rename path when storage permissions reject hard links"
    patch_type: "portability"
  - patch_file: "patches/0022-gui-validate-freetype-coverage-and-font-fallbacks.patch"
    patch_description: "Validate advertised script coverage, detect PANOSE monospaced fonts, load collections and select installed font fallbacks"
    patch_type: "portability"
  - patch_file: "patches/0023-corelib-separate-posix-shared-memory-lock-namespace.patch"
    patch_description: "Give the internal lock a distinct deterministic name where sem_open and shm_open share a namespace"
    patch_type: "portability"
  - patch_file: "patches/0024-tests-isolate-and-clean-up-legacy-shared-memory.patch"
    patch_description: "Use the existing per-test key isolation and cleanup for the legacy constructor regression"
    patch_type: "portability"
  - patch_file: "patches/0025-tests-use-owned-completion-and-width-fixtures.patch"
    patch_description: "Exercise completion in owned directories and use child text wider than the header minimum across fonts"
    patch_type: "portability"
  - patch_file: "patches/0026-corelib-posix-collator-numeric-and-punctuation.patch"
    patch_description: "Implement numeric mode and punctuation handling in the POSIX collation backend"
    patch_type: "portability"
