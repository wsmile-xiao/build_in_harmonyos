# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: qrtr/1.2
homepage: "https://github.com/linux-msm/qrtr"

# 上游 1.2 发布包内不存在测试套件：仓库没有 tests/ 目录，
# .github/workflows/ci.yml 与 ci/*.sh 只做构建（meson setup/compile）。
# 因此没有 make check / meson test 可在 build() 中集成。
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试（消费者视角）
test_package_tests:
  - file: test_qrtr.c
    description: "链接安装后的 libqrtr，验证 QMI 编解码往返、报文头一致性与非法入参拒绝路径"
    command: "./test_qrtr"
  - file: conanfile.py
    description: "校验三个命令行工具已安装，并确认 qrtr-cfg 无参数时打印用法"
    command: 'qrtr-cfg 2>&1 | grep -q "<node-id>"'

assertion_count: 20          # test_qrtr.c 运行输出 TEST_PACKAGE_RESULT total=20 passed=20 failed=0

breakdown:
  api_roundtrip_assertions: 9    # test_qrtr.c: 编码长度/类型、报文头解析、事务号与两个 TLV 字段往返
  api_validation_assertions: 6   # test_qrtr.c: 错误 type/id、NULL 结构体、NULL 输出、报文长度不一致
  api_uapi_assertions: 5         # test_qrtr.c: AF_QIPCRTR、family 宽度、sockaddr_qrtr 尺寸/偏移、控制包 packed 尺寸
cli_checks: 1                   # conanfile.py test(): 三个命令行工具已安装，且 qrtr-cfg 无参数打印用法（不计入 assertion_count）
