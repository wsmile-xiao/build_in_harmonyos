software: qrtr
version: "1.2"
upstream_version: "1.2"
status: built
build_date: "2026-09-24"
build_system: meson
conan_ref: "qrtr/1.2"
difficulty: B
adaptation_path: 路径 A（基础适配）

source:
  url: "https://github.com/linux-msm/qrtr/archive/refs/tags/v1.2.tar.gz"
  sha256: "7a82bf80246fe71287b13c66c0466208822e8337fcd4aaf302eee6c5fcb48a52"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dsystemd-service=disabled"
    - "-Dqrtr-ns=enabled"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/001-libqrtr-ohos-sockaddr-storage.patch"
    type: portability
    description: "项目内提供最小 Linux QRTR UAPI 声明；不再包含或屏蔽系统 linux/socket.h，避免 sockaddr_storage 重定义，并使用 __attribute__((packed)) 保持 qrtr_ctrl_pkt 的线格式。"

knowledge_gained:
  - "鸿蒙 PC 没有 systemd；qrtr 的 systemd 单元特性必须显式 disabled，否则 Meson 的 dependency('systemd') 探测会成为障碍。"
  - "OHOS SDK 同时提供 sys/socket.h 与 linux/socket.h 的 sockaddr_storage 定义；项目内只替换 linux/qrtr.h 并用 unsigned short 声明 family 字段，不包含或屏蔽系统 linux/socket.h，避免 include guard 劫持。"
  - "OHOS linux/qrtr.h 中裸 __packed 对工具链不可移植；项目内 UAPI 兼容头使用 __attribute__((packed)) 可保持相同线格式并避免链接期 duplicate symbol。"
  - "conan 的 MesonToolchain 不写 ar/ranlib 到 conan_meson_native.ini，Meson 按裸名探测 llvm-ar 失败；需要从 OHOS clang 目录推导全路径写入 native file。"
  - "libqrtr 只依赖 libc；测试可在没有 QRTR 内核设备的情况下通过公开的 QMI 编解码 API 完成真实功能验证。"
  - "上游 1.2 发布包不含测试套件（无 tests/ 目录，CI 只做构建），消费者测试需要自己补全。"
  - "QMI 解码按 tlv_type 反查描述符（find_ei）：上游 qmi_response_type_v01_ei 的两个字段都用 QMI_COMMON_TLV_TYPE，编码后合成同一个 TLV，解码时 find_ei 永远命中第一个元素，因此该结构体无法按字段往返；这是上游对公共响应头的既定行为，消费者测试需改用各自独立 tlv_type(0x01/0x02) 的描述符才能验证往返。"
tests:
  upstream:
    framework: none
    test_count: 0
    note: 上游 1.2 没有测试套件：仓库无 tests/ 目录，.github/workflows/ci.yml 与 ci/*.sh 只做构建，无可集成的 make check / meson test 目标。
  adapted:
    command: Conan test_package
    programs: 1
    assertions: 20
    passed: 20
    failed: 0
    pass_rate: 20/20
    measured_by: "test_qrtr.c 运行输出 TEST_PACKAGE_RESULT total=20 passed=20 failed=0"
    breakdown:
      api_roundtrip_assertions: 9
      api_validation_assertions: 6
      api_uapi_assertions: 5
    cli_checks: 1
    note: 消费者测试链接安装后的 libqrtr，覆盖 QMI 编解码往返、报文头一致性、非法入参（错误 type/id、NULL 结构体、NULL 输出、报文长度不一致）拒绝路径，20 条 C 断言失败数为 0；另有 1 条 CLI 检查在 test_package/conanfile.py 中执行（校验 qrtr-cfg / qrtr-lookup / qrtr-ns 已安装，且 qrtr-cfg 无参数打印用法），不计入上述断言总数。

blockers: []

