software: qrtr
display: "qrtr"
description: "Userspace reference implementation of the Qualcomm IPC router protocol"
category: network
homepage: "https://github.com/linux-msm/qrtr"
license: BSD-3-Clause
build_system: meson

ohos_adaptation:
  key_points:
    - "OHOS 的 sys/socket.h 与 linux/socket.h 都定义了 sockaddr_storage；配方在项目 include 路径提供最小稳定 Linux UAPI 兼容头，使两类 ABI 在同一翻译单元共存，不使用任何平台条件编译宏。"
    - "OHOS 的 linux/qrtr.h 使用裸 __packed 标注结构体；项目内 UAPI 兼容头改用 __attribute__((packed))，保持相同线格式并避免多翻译单元链接报 duplicate symbol: __packed。"
    - "鸿蒙 PC 没有 systemd，Meson 的 systemd-service 特性显式 disabled，避免 dependency('systemd') 探测；qrtr-ns 显式 enabled 随包交付。"
    - "Conan 的 MesonToolchain 不写 ar/ranlib，Meson 按裸名探测 llvm-ar 会失败，配方从 OHOS clang 目录推导全路径写入 conan_meson_native.ini。"
    - "HarmonyOS 需要有效 ELF 签名（知识库 E077），打包时对 bin/ 下的三个可执行文件剥旧 .codesign 段并用 binary-sign-tool 自签，再恢复 0755 权限。"
  common_dependencies: []

versions:
  "1.2":
    status: built
    build_date: "2026-09-24"
    conan_ref: "qrtr/1.2"
