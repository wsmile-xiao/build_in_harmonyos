# test_package 消费者用例（不计入上游分母，按 PR 模板口径计入「鸿蒙特有测试」行）
test_package_tests:
  - file: test_qdiskinfo.cpp
    description: "T1/T2 打包二进制 bin/QDiskInfo 存在且可执行"
    command: "test_qdiskinfo <pkg>/bin/QDiskInfo"
  - file: test_qdiskinfo.cpp
    description: "T3 --version 在无显示服务器下退出码 0 并输出 'QDiskInfo 0.4'（补丁 0002 新增的早期退出分支）"
    command: "test_qdiskinfo <pkg>/bin/QDiskInfo"
  - file: test_qdiskinfo.cpp
    description: "T4 --help 在无显示服务器下退出码 0 并输出 Usage"
    command: "test_qdiskinfo <pkg>/bin/QDiskInfo"
  - file: test_qdiskinfo.cpp
    description: "T5 --ascii-view /dev/null：非 root 退出码 1 且 stderr 含 'root privileges'；root 退出码 0（SG_IO 路径真实执行）"
    command: "test_qdiskinfo <pkg>/bin/QDiskInfo"
  - file: test_qdiskinfo.cpp
    description: "T6/T7 GUI 在 QT_QPA_PLATFORM=offscreen 下进程成功启动（Qt 平台插件加载）且主窗口构造后不崩溃"
    command: "test_qdiskinfo <pkg>/bin/QDiskInfo"
  - file: conanfile.py
    description: "T8 非特权路径真实执行了 smartctl --scan --json（getSmartctlPath 在解压运行环境 PATH 中解析成功）"
    command: "PATH=<stub-dir>:$PATH QT_QPA_PLATFORM=offscreen <pkg>/bin/QDiskInfo（桩 smartctl 记录调用）"
  - file: conanfile.py
    description: "T9 特权路径在 pkexec 缺失时直接执行 smartctl -x --json=o <device>（补丁 0004 提权回退生效的直接证据）"
    command: "同上：断言桩日志同时包含 --scan 与 -x/--json=o/假设备节点"
  - file: test_app.sh
    description: "手工复现脚本：--version/--help/--ascii-view/smartctl 可用性/offscreen GUI 启动/提权回退提示"
    command: "sh test_app.sh <pkg>/bin/QDiskInfo"

assertion_count: 9
