# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS PC 无 polkit/pkexec：上游在特权路径固定调用 QProcess::start(\"pkexec\", ...)，缺失时启动失败且 exitCode()==0/isOpen()==false，上层只拿到空结果（静默失败）；改为运行时探测 pkexec，存在则保持上游行为、缺失则直接执行命令 — knowledge_ref: E550"
  - "OHOS 内核只加载带有效 .codesign 段的 ELF：cmake --install 会为改写 RPATH 而重写文件（'Set non-toolchain portion of runtime path ... to \"\"'），使链接器写入的签名失效，安装到 package 目录后真机执行报 EPERM（构建树内可直接执行）。package() 必须按 'llvm-objcopy --remove-section .codesign → binary-sign-tool sign -selfSign 1 → 恢复 +x' 重新自签名 — knowledge_ref: E545"
  - "conan.tools.files.chmod 在 Conan>=2.15 的签名是 chmod(self, path, read/write/execute)，旧的 chmod(self, path, 0o755) 会把 0o755 当成 read 参数而不改权限（测试桩 smartctl 因此不可执行，PATH 探测跳过它导致断言失败） — knowledge_ref: E046"
  - "OHOS SDK 自带 scsi/sg.h（含 SG_IO/sg_io_hdr_t），上游 asciiview.cpp 的 SG_IO 直读设备路径无需打补丁 — knowledge_ref: E238"
  - "qtbase 以 cmake_find_mode=none 导出，CMakeDeps 不生成 Qt6 target；需把 qtbase 包目录加进 CMAKE_PREFIX_PATH（Environment 保存 build 作用域脚本）才能 find_package(Qt6) — knowledge_ref: E451"
  - "上游 AppImage 把 smartctl 随应用分发；在 Conan 中声明 requires(\"smartmontools/7.4\") 使 conan install 后 smartctl 进入运行环境 PATH，getSmartctlPath() 直接命中 — knowledge_ref: E550"
  - "ENABLE_TRANSLATIONS 保持 OFF：qtbase 包不含 Qt6LinguistTools 组件（OHOS 无 lupdate/lrelease 原生工具链），上游官方 AppImage 构建同样未开启 — knowledge_ref: E487"

