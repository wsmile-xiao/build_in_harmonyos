# 版本级 manifest
# 文件位置: archives/q/qt5-qtgamepad/5.15.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.15.2"

# 软件名
software: "qt5-qtgamepad"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-06"
build_system: qmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方单条，R39）
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtgamepad-everywhere-src-5.15.2.tar.xz"

  # 源码校验和（download.qt.io / mirrors.tuna.tsinghua.edu.cn 双源实测一致）
  sha256: "c77611f7898326d69176ad67a9b886f617cdedc368ec29f223d63537d25b075c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: qmake

  # 配置选项列表
  configure_options:
  - "-spec linux-clang"
  - "QMAKE_STRIP="

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "qt5-qtbase/5.15.2.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "qmake 构建 Qt5 addon 模块沿用 qt5-qtsvg/qtwebsockets 模式：私有可写 Qt prefix 镜像 qtbase（symlink + 重写 mkspecs .pri 中 build-dir 引用）+ qmake -spec linux-clang"
- "qtgamepad 5.15.2 上游 tests/auto/auto.pro SUBDIRS 为空——无 QTest 套件；唯一注册自动化测试是 tests/auto/cmake（ctest_testcase 机制），`make check` 用 cmake+ctest 驱动 module_includes 用例（对模块依赖闭包 find_package+编译链接运行）"
- "上游 CMakeLists 声明 cmake_minimum_required(2.8)，宿主 CMake 4.x 直接配置报 Compatibility 关闭错误——向整个 make check 环境导出 CMAKE_POLICY_VERSION_MINIMUM=3.5 即可按兼容地板跑通（cmake --build-and-test 嵌套调用同样继承）"
- "qtgamepad 的 sdl2 后端特性由自身 configure.json 控制（config.tests/sdl + pkg-config sdl2 探测）；qtbase/5.15.2.2 的 QT.gui_private.enabled_features 含 evdev，evdev 后端插件（libevdevgamepad.so）随 QT_FOR_CONFIG(gui-private) 条件正常构建"
- "src/imports（QML Gamepad import）依赖 qml/quick 模块；qt5-qtbase 包不提供（qtHaveModule(quick) 为假）时 src.pro 自动跳过，无需裁剪"
- "qtgamepad 无私有测试目录，无需 private_tests/reduce_exports 特性翻转（qtwebsockets 需要是因为其私有 QTest 套件）"
- "QPluginLoader 按路径加载打包的 evdev 插件可在无手柄硬件的 OHOS PC 上验证插件契约（dlopen + IID/Keys 元数据），Qt 插件元数据不依赖输入设备存在"
- "无 /dev/input/js* 设备时 QGamepadManager 退回 dummy QGamepadBackend，connectedGamepads() 为空、QGamepad 全部属性取 QGamepadPrivate 构造默认值——消费者测试据此断言完整 API 逻辑面"
- "tst 可执行与打包 .so 均用 binary-sign-tool -selfSign 1 签名（coinutils/qrencode 先例）；make install 必须 STRIP=true"
- "打包后需重写 .prl/.la/.pc 中残留的 build-dir/source-dir 路径为 package_folder"
