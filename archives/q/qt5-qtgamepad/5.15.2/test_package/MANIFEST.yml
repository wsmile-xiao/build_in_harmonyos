# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qtgamepad/5.15.2
homepage: https://www.qt.io/

# 上游测试命令：qtgamepad 5.15.2 无 QTest 套件（tests/auto/auto.pro 的
# SUBDIRS 为空），唯一注册的自动化测试是 tests/auto/cmake（ctest_testcase
# 机制）：qmake 生成后 `make check` 驱动 cmake 配置 + ctest 注册 1 个
# module_includes build-and-test 用例（对 gamepad 模块依赖闭包
# Qt5Core/Qt5Gui 做 find_package + 编译链接验证）。
upstream_check_command: "cd tests/auto/cmake && qmake cmake.pro && make check"
upstream_test_in_build: true
upstream_test_command: "cd tests/auto/cmake && qmake -spec linux-clang cmake.pro && make -j2 && make check"

upstream_test_changes: []

# 上游测试套件位置
upstream_tests:
  - name: "QtGamepad cmake module test (tests/auto/cmake)"
    source: qtgamepad-everywhere-src-5.15.2/tests/auto/cmake/
    description: "ctest_testcase 注册的 1 个 module_includes 用例：cmake --build-and-test 生成独立子工程，find_package(Qt5Core/Qt5Gui 5.0.0 REQUIRED)（gamepad 模块依赖闭包）+ 编译链接 module_includes_exe 并运行。上游 CMakeLists 声明 cmake_minimum_required(2.8)，宿主 CMake 4.x 需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
    count: 1

# test_package 中自带的测试（消费者视角验证：链接 libQt5Gamepad 并断言
# 无手柄环境下的完整 API 逻辑面）
test_package_tests:
  - file: test.cpp
    description: "QGamepadManager 单例/空设备列表行为（5 断言）+ QGamepad 默认态与属性回写（26 断言）+ QGamepadKeyNavigation 默认键映射矩阵与 setter（22 断言）+ QPluginLoader 按路径 dlopen 打包的 evdev 后端插件并校验 IID/Keys 元数据契约（5 断言）"
    command: "./test_qt5_qtgamepad"

assertion_count: 58
