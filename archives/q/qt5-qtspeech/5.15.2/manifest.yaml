software: qt5-qtspeech
# 版本级 manifest 模板
# 文件位置: archives/q/qt5-qtspeech/5.15.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "5.15.2"

# 编译状态
status: built

# 编译日期
build_date: "2026-10-06"
build_system: qmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtspeech-everywhere-src-5.15.2.tar.xz"
  sha256: "c810fb9eecb08026434422a32e79269627f3bc2941be199e86ec410bdfe883f5"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: qmake
  configure_options:
    - "qmake -spec linux-clang qtspeech.pro"
  dependencies:
    - qt5-qtbase/5.15.2.2
  cc: clang
  cxx: clang++
  mkspec: linux-clang

patches_applied: []

packaging:
  conan_recipe: true
  conanfile: conanfile.py
  conandata: conandata.yml
  test_package: test_package/

knowledge_gained:
  - "qt5-qtspeech is a qmake addon module producing libQt5TextToSpeech.so (src/tts); no source modifications required for HarmonyOS"
  - "TTS engine plugins (speechdispatcher/flite/sapi/winrt/osx/ios/android) are feature-gated in src/tts/configure.json; on OHOS speechd/flite are disabled by qmake feature detection, so src/plugins/tts compiles no plugin — libQt5TextToSpeech itself is complete"
  - "qmake requires the writable Qt prefix pattern (qt-prefix) with rewritten mkspecs (same as qtmultimedia/qtscxml)"
  - "Upstream tests/auto/texttospeech runs headless with QT_QPA_PLATFORM=offscreen; its 3 failures carry the documented 'No text-to-speech plug-ins were found.' signature (OHOS has no speech-dispatcher/flite backend) — environment limitation, not a library defect; speech_rate/set_voice are BLACKLISTed upstream on all platforms"
  - "Upstream tests/auto/cmake (module_includes ctest) needs three environment adaptations on this toolchain: CMAKE_POLICY_VERSION_MINIMUM=3.5 (CMake >= 4 dropped cmake_minimum_required(2.8) compatibility), a mkspecs symlink repairing qt5-qtbase's packaged Qt5CoreConfigExtrasMkspecDir.cmake stale build path, and CMAKE_SYSTEM_NAME=Linux override so Qt5 config files resolve on HarmonyOS"
  - "test_package binary must be ELF-signed with binary-sign-tool -selfSign 1 (plus chmod 755) before it can run on the OHOS build host; the packaged lib keeps its toolchain .codesign section because QMAKE_STRIP is empty"
