# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qtspeech/5.15.2
homepage: "https://www.qt.io/"

# 上游测试命令：上游 tests/auto 两套件（texttospeech/cmake）在配方
# build() 中真实编译并执行，实测数字见 PR 正文验证结果段。
upstream_check_command: "cd tests/auto && qmake auto.pro && make check"
upstream_test_in_build: true
upstream_test_command: "per-suite qmake+make+run in conanfile.py build() (texttospeech) + cmake/ctest module_includes (cmake)"

upstream_test_exemption:
  reason: "texttospeech 套件的 5 个测试函数全部依赖真实 TTS 引擎插件（上游在 Linux 对 speech-dispatcher、部分场景对 flite 运行）；OpenHarmony PC 无 speech-dispatcher 守护进程亦无 flite 合成器服务，qmake 特性探测（src/tts/configure.json）关闭 speechd/flite，包内不含任何 TTS 引擎插件。实测 3 个失败（say_hello/pitch/volume）全部携带文档化签名 'No text-to-speech plug-ins were found.'（QSYSTEM 行），属环境限制非库缺陷；speech_rate/set_voice 被上游 BLACKLIST 在全平台拉黑（'*' 条目，非本平台特有）。消费者侧行为面（BackendError 状态/null-guarded API/0.0 默认值/空 voice 模型/QVoice 值语义）由 test_package 冒烟测试逐项断言补全"
  spec: "TEST_QUALITY_SPEC §3"

# 上游测试套件位置
upstream_tests:
  - name: "texttospeech"
    source: qtspeech-everywhere-src-5.15.2/tests/auto/texttospeech/
    description: "QTextToSpeech 引擎交互单元测试（真跑：Totals 2 passed, 3 failed, 0 skipped, 2 blacklisted——3 失败均为无引擎环境限制，2 黑名单为上游全平台拉黑）"
  - name: "cmake"
    source: qtspeech-everywhere-src-5.15.2/tests/auto/cmake/
    description: "CMake 消费者模块包含性测试 module_includes（真跑：1/1 Passed, 4.26s；带 CMAKE_POLICY_VERSION_MINIMUM=3.5 + mkspecs 路径修复 + CMAKE_SYSTEM_NAME=Linux 三项环境适配）"

# test_package 中自带的测试（消费者视角验证：链接 libQt5TextToSpeech 并断言无引擎行为面）
test_package_tests:
  - file: test.cpp
    description: "availableEngines 空/state==BackendError/null-guarded say-stop-pause-resume/rate-pitch-volume 0.0 默认值/空 voices-locales/无引擎信号静默/QVoice 值语义 共 12 组断言"
    command: "./test_qt5_qtspeech"

assertion_count: 12
