software: qtspeech-opensource-src
# 版本级 manifest 模板
# 文件位置: archives/q/qtspeech-opensource-src/5.15.15/manifest.yaml

version: "5.15.15"

# 编译状态
status: built

# 构建系统
build_system: qmake

# 编译日期
build_date: "2026-09-04"

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.15/submodules/qtspeech-everywhere-opensource-src-5.15.15.tar.xz"
  sha256: "090125ce13c4219c7e2291e7a248c0923fd8534f0667fabd544ca377e9a8b305"
  tar_format: tar.xz

build:
  system: qmake
  configure_options:
    - "qmake -spec linux-clang qtspeech.pro"
  dependencies:
    - qt5-qtbase/5.15.2.2
    - qt5-qtdeclarative/5.15.2
  cc: clang
  cxx: clang++
  mkspec: linux-clang

patches_applied: []

packaging:
  conan_recipe: true
  conanfile: conanfile.py
  conandata: conandata.yml
  test_package: test_package/

knowledge_gained:
  - "Qt Speech is a qmake-based Qt5 addon module that builds against qt5-qtbase and qt5-qtdeclarative"
  - "Without speech-dispatcher or flite available, the module builds with the mock backend (full API, no actual TTS output)"
  - "Qt 5.15.15 module is binary compatible with qt5-qtbase 5.15.2.x (Qt 5.15 LTS ABI stability)"
  - "Requires the same qt.conf and .pri path fixing as other Qt5 addon modules"
  - "Produces libQt5TextToSpeech.so, QML plugins under qml/QtTextToSpeech/, and CMake config files"
