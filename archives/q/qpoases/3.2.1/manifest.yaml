# 版本级 manifest — qpoases 3.2.1
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.2.1"
software: "qpoases"
status: built
build_date: "2026-10-01"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/coin-or/qpOASES/archive/releases/3.2.1.tar.gz"
  sha256: "a7d153b4e23ee66bd50cdb6e84291d0084d9967a9c788a4d873440a6b10ca13b"
  tar_format: tar.gz
  root_dir: "qpOASES-releases-3.2.1"

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DQPOASES_BUILD_EXAMPLES=ON（构建全部 11 个 example/qrecipe 可执行文件，验证完整 API 面）"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "OHOS: -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=armv8（E092：CMake 无 Platform/HarmonyOS 模块）"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 产物
# ============================================================

package_type: library
artifacts:
  - "lib/libqpOASES.a（上游 CMakeLists 硬编码 ADD_LIBRARY(qpOASES STATIC ...)，故恒为静态库）"
  - "include/qpOASES.hpp"
  - "include/qpOASES/*.hpp|*.ipp（22 个头文件 + 11 个实现文件，含 extras/）"
  - "licenses/LICENSE（LGPL-2.1-or-later）"
libs:
  - qpOASES
requires: []

# ============================================================
# 验证结果
# ============================================================

tests:
  upstream_suite: "testing/runUnitTests（testing/cpp 下 30 个测试源文件，共发起 31 次执行）"
  upstream_registered: 30
  upstream_invocations: 31
  upstream_passed: 24
  upstream_failed: 0
  upstream_data_missing: 7
  upstream_pass_rate: "24/24 (100%) —— 31 次执行中 24 次给出判定且全过，7 次因外部数据集缺失返回上游约定的 99"
  consumer_checks: 14
  consumer_failures: 0
  consumer_pass_rate: "14/14 (100%)"
  command: "conan create archives/q/qpoases/3.2.1 -pr:h=ohos-aarch64-run -pr:b=default --build=missing"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "qpOASES 自带 BLASReplacement.cpp / LAPACKReplacement.cpp，零外部依赖，是干净的交叉编译目标"
  - "上游 CMakeLists 硬编码 ADD_LIBRARY(qpOASES STATIC ...)，shared 选项无法生效，包恒为静态库"
  - "上游测试入口 testing/cpp/Makefile 继承 make.mk（硬编码本机 g++），无法复用于交叉编译；30 个测试源文件彼此独立，只需公共头文件 + libqpOASES.a，可用显式交叉编译器逐文件编译"
  - "testing/runUnitTests 的退出码语义：0=通过，99=外部 problem data 缺失，其他=失败；数据集来自已停服的 COIN-OR SVN（testing/cpp/data/fetch_cpp_data），故 test_hs268 / test_bench 系列返回 99 属上游认可的数据缺失而非失败"
  - "CMake 无 Platform/HarmonyOS 模块，os=OHOS 交叉构建需 pin CMAKE_SYSTEM_NAME=Linux（E092）"

adaptation_paths:
  - A
