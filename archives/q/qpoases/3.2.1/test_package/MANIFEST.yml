  - file: testing/cpp/test_gradientShift.cpp
    description: "gradientShift: 梯度平移/热启动"
    command: "./test_gradientShift"
  - file: testing/cpp/test_runAllOqpExamples.cpp
    description: "runAllOqpExamples: 批量运行 OQP 示例（需外部数据）"
