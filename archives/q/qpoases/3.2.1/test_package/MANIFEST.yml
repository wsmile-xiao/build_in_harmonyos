  - file: testing/cpp/test_bench.cpp
    description: "bench: 基准算例集（Odd/Ods/Omd 三个参数，需外部 problem data）"
    command: "./test_bench Odd|Ods|Omd"

# test_package 中自带的消费者端测试（rule12：真实调用库的完整流程）
consumer_test_count: 1
test_package_tests:
  - file: test_qpoases.cpp
    description: >-
      第三方消费者视角端到端用例（在 OHOS aarch64 上经 qemu 真实执行）：仅通过安装后的
      公共头文件 <qpOASES.hpp> 与 libqpOASES.a 求解上游 example1 的经典 QP——
      min ½x'Hx+g'x (H=diag(1,0.5), g=(1.5,1))，约束 0.5≤x1≤5、-2≤x2≤2、
      -1≤x1+x2≤2，逐项校验解析最优解 x*=(0.5,-1.5)、起作用约束 x1+x2=-1、
      界约束、对偶解 (1.75,0,0.25) 与目标值 -0.0625；再用 SQProblem::hotstart
      热启动换 g/界/约束，校验 x*=(0,-1)、目标值 -1.25 与工作集接口；
      另校验工具函数 getNorm。共 14 项断言，全部通过。
    command: "./test_qpoases"

# 测试断言总数（消费者用例内的 check() 计数）
assertion_count: 14

# 适配补丁（非平台宏，仅修正上游测试自身的 UB）
patches:
  - file: patches/0001-fix-test-example2-use-after-free.patch
    description: >-
      testing/cpp/test_example2.cpp 在 delete[] Primal_Dual_Var 之后才读取
      Primal_Dual_Var[3*5+3] 做最终断言，属堆释放后使用（heap-use-after-free，
      已用 AddressSanitizer 在本机 x86_64 复现）。该 UB 使 aarch64/OHOS 上
      test_example2 退出码为 1，即上游套件报出一个由测试自身缺陷（而非求解器）
      导致的失败。补丁把该读取上移到释放之前，保留原断言语义，不改动任何求解逻辑。
    verification: >-
      仅修正该读取后，test_example2 在 OHOS aarch64 上两项 KKT 断言均通过
      （maxKktViolation = 2.78e-17 与 5.55e-16，容限 1e-15 / 2e-15），
      方差协方差项等于期望值 26.0。

