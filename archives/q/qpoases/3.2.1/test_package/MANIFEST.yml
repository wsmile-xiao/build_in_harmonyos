# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: qpoases/3.2.1
homepage: "https://github.com/coin-or/qpOASES"

# 上游测试入口: testing/runUnitTests（内部先 `make testing` 再逐个执行 bin/test_*）
upstream_check_command: "cd testing && ./runUnitTests"
upstream_build_command: "cd testing/cpp && make"

# conanfile.py build() 中已集成上游测试：先按 testing/cpp 的源文件清单
# 交叉编译出 30 个测试二进制，再用 run-ohos-tests.py 按 runUnitTests 的
# 顺序与退出码语义逐个执行。
upstream_test_in_build: true
upstream_test_command: "python3 run-ohos-tests.py <build>/upstream-tests"

# 上游 cpp 测试源文件 30 个（testing/cpp/test_*.cpp），runUnitTests 中共发起
# 31 次执行（test_bench 以 Odd/Ods/Omd 三个参数各跑一次）。
upstream_test_source_count: 30
upstream_test_invocations: 31

# 退出码语义（上游 testing/runUnitTests）: 0=通过, 99=problem data missing, 其他=失败
# 外部数据集由 testing/cpp/data/fetch_cpp_data 从 COIN-OR SVN
# (https://projects.coin-or.org/svn/qpOASES/misc/testingdata/cpp) 拉取，
# 该服务已下线，故依赖外部数据集的用例返回 99（上游本身即视为"不可用"而非失败）。
upstream_data_external: true
upstream_data_source: "svn https://projects.coin-or.org/svn/qpOASES/misc/testingdata/cpp (retired)"

upstream_tests:
  - file: testing/cpp/test_matrices.cpp
    description: "DenseMatrix/SymmetricMatrix 基本运算与索引"
    command: "./test_matrices"
  - file: testing/cpp/test_matrices2.cpp
    description: "矩阵运算（qrecipe 稀疏/稠密数据）"
    command: "./test_matrices2"
  - file: testing/cpp/test_matrices3.cpp
    description: "矩阵运算扩展用例"
    command: "./test_matrices3"
  - file: testing/cpp/test_indexlist.cpp
    description: "Indexlist 工作集索引结构"
    command: "./test_indexlist"
  - file: testing/cpp/test_example1.cpp
    description: "example1: 标准 QProblem 求解 + 解析最优解校验"
    command: "./test_example1"
  - file: testing/cpp/test_example1a.cpp
    description: "example1a: 解 QP 并读取对偶解"
    command: "./test_example1a"
  - file: testing/cpp/test_example1b.cpp
    description: "example1b: 解 QP 并读取约束对偶解"
    command: "./test_example1b"
  - file: testing/cpp/test_example2.cpp
    description: "example2: SQProblem 在线主动集热启动序列"
    command: "./test_example2"
  - file: testing/cpp/test_example4.cpp
    description: "example4: 无约束 QProblemB"
    command: "./test_example4"
  - file: testing/cpp/test_example5.cpp
    description: "example5: 仅含界约束的 QProblemB 热启动"
    command: "./test_example5"
  - file: testing/cpp/test_exampleLP.cpp
    description: "exampleLP: H=0 退化为线性规划"
    command: "./test_exampleLP"
  - file: testing/cpp/test_qrecipe.cpp
    description: "qrecipe: 稀疏/稠密接口的 QP 配方用例"
    command: "./test_qrecipe"
  - file: testing/cpp/test_qrecipeSchur.cpp
    description: "qrecipeSchur: SQProblemSchur 在线主动集"
    command: "./test_qrecipeSchur"
  - file: testing/cpp/test_smallSchur.cpp
    description: "smallSchur: SQProblemSchur 小规模用例"
    command: "./test_smallSchur"
  - file: testing/cpp/test_infeasible1.cpp
    description: "infeasible1: 不可行 QP 的返回值语义"
    command: "./test_infeasible1"
  - file: testing/cpp/test_hs268.cpp
    description: "HS268 基准算例（需外部 problem data，返回 99 表示数据缺失）"
    command: "./test_hs268"
  - file: testing/cpp/test_example6.cpp
    description: "example6: 稀疏矩阵接口"
    command: "./test_example6"
  - file: testing/cpp/test_example7.cpp
    description: "example7: 稀疏接口读取对偶解"
    command: "./test_example7"
  - file: testing/cpp/test_sebastien1.cpp
    description: "sebastien1: 回归用例"
    command: "./test_sebastien1"
  - file: testing/cpp/test_vanBarelsUnboundedQP.cpp
    description: "vanBarel: 无界 QP 的返回值语义"
    command: "./test_vanBarelsUnboundedQP"
  - file: testing/cpp/test_janick1.cpp
    description: "janick1: 回归用例"
    command: "./test_janick1"
  - file: testing/cpp/test_janick2.cpp
    description: "janick2: 回归用例"
    command: "./test_janick2"
  - file: testing/cpp/test_constraintProduct1.cpp
