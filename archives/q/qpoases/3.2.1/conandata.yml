patches:
  "3.2.1":
    - patch_file: "patches/0001-fix-test-example2-use-after-free.patch"
      patch_description: >-
        testing/cpp/test_example2.cpp dereferences Primal_Dual_Var after
        delete[] (heap-use-after-free, reproduced with AddressSanitizer). On
        aarch64/OHOS this makes the upstream test binary exit 1, i.e. reports a
        failure that is caused by the test bug and not by the solver. The read
        is hoisted before the deletion so the intended assertion is preserved.
      patch_type: "portability"
