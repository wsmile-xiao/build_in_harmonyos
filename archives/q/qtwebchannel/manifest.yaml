software: qtwebchannel
display: "Qt WebChannel"
description: "Qt module enabling peer-to-peer communication between C++/QML and HTML/JavaScript clients"
category: qt-module
homepage: "https://doc.qt.io/qt-6/qtwebchannel-index.html"
license: "GPL-3.0-only OR LGPL-3.0-only OR LicenseRef-Qt-Commercial"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use the harmonyos-clang Qt mkspec for OHOS builds"
    - "Reuse qtbase's installed native Qt6 CMake package files"
    - "Declare Qt::Core as PUBLIC_LIBRARIES so the exported Qt6::WebChannel target propagates QtCore include dirs (patch 0001)"
    - "Run the C++ auto test and a consumer test exercising QWebChannel register/lookup/deregister"
  common_dependencies:
    - qtbase

versions:
  "6.11.1":
    status: published
    build_date: "2026-08-19"
    conan_ref: "qtwebchannel/6.11.1"
