# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qtwebchannel/6.11.1
homepage: https://doc.qt.io/qt-6/qtwebchannel-index.html

# 上游测试命令
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure -j1"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/auto/webchannel/CMakeLists.txt
    source: qtwebchannel-6.11.1/tests/auto/webchannel/CMakeLists.txt
    description: "Run tst_webchannel (core WebChannel functional test: QWebChannel API, object registration, transports)"
    command: "ctest -R '^tst_webchannel$' --output-on-failure"
  - file: tests/auto/cmake/CMakeLists.txt
    source: qtwebchannel-6.11.1/tests/auto/cmake/CMakeLists.txt
    description: "Run the Qt WebChannel CMake package integration test (module_includes)"
    command: "ctest -R '^module_includes$' --output-on-failure"

conditional_upstream_tests:
  - file: tests/auto/qml/CMakeLists.txt
    description: "QML WebChannel tests require upstream Qt Quick and Qt QuickTest targets"
    condition: "TARGET Qt::Quick AND TARGET Qt::QuickTest"
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "Verify QWebChannel object registration/lookup/deregistration and transport wiring via the Qt6::WebChannel CMake target"
    command: "./test_package"

# 测试断言总数
assertion_count: 4
