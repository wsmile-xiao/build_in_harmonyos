# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "qtbase/6.11.1 provides the native Qt6 CMake package; qtwebchannel consumers must use that package instead of generated CMakeDeps wrappers (cmake_find_mode=none)."
  - "The upstream WebChannel module only links Qt::CorePrivate; without a PUBLIC Qt::Core declaration the single-module build-tree export misses INTERFACE_LINK_LIBRARIES and consumers fail to find <QtCore/QObject> (patch 0001)."
  - "Qt WebChannel QML auto tests are guarded by Qt Quick/QuickTest and are outside the current qtbase/qtdeclarative dependency contract."
  - "The consumer test exercises QWebChannel registerObject/registeredObjects/deregisterObject plus a QWebChannelAbstractTransport send-path wiring."

