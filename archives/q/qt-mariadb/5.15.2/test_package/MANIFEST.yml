# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: qt-mariadb/5.15.2
homepage: "https://download.qt.io/archive/qt/5.15/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

# Qt plugins are loaded at runtime; no standalone upstream test binary
upstream_tests:
  - file: src/plugins/sqldrivers/mysql/qsql_mysql.cpp
    source: qtbase-everywhere-src-5.15.2/src/plugins/sqldrivers/mysql/qsql_mysql.cpp
    description: "MariaDB SQL driver implementation"
    command: "N/A (loaded at runtime by Qt5Sql)"

test_package_tests:
  - file: test_package/test_plugin.c
    description: "Compile and run ELF validation of libqsqlmysql.so: driver keys QMYSQL/QMARIADB, libmariadb linkage (not libmysqlclient), Qt plugin interface exports"
    command: "conan test"

assertion_count: 5
