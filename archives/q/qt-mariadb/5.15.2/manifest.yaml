version: "5.15.2"
status: built
software: qt-mariadb
build_date: "2026-08-27"
build_system: custom

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
  tar_format: tar.xz
  sha256: "909fad2591ee367993a75d7e2ea50ad4db332f05e1c38dd7a5a274e156a4e0f8"

build:
  system: custom
  configure_options:
    - "Manual compilation: clang++ with Qt5 5.15.2 headers and MariaDB libmariadb"
  dependencies:
    - "qt5-qtbase/5.15.2"
    - "mariadb-connector-c/3.4.8"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "qt-mariadb shares the same driver source and output file (libqsqlmysql.so) as qt-mysql"
  - "Qt5 mysql/mariadb plugin requires Qt5-specific headers"
  - "libqsqlmysql.so supports QMYSQL3, QMYSQL, and QMARIADB keys simultaneously"
  - "MariaDB driver links against libmariadb.so rather than libmysqlclient.so"
  - "Plugin source files included via exports_sources to avoid 50MB tarball download"
  - "Missing QtSql config forwarding headers created in build step"
