# 版本级 manifest
# 文件位置: archives/q/qt5-qtmultimedia/5.15.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.15.2"

# 软件名
software: "qt5-qtmultimedia"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: qmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://mirrors.tuna.tsinghua.edu.cn/qt/archive/qt/5.15/5.15.2/submodules/qtmultimedia-everywhere-src-5.15.2.tar.xz"

  # 源码校验和
  sha256: "0c3758810e5131aabcf76e4965e4c18b8911af54d9edd9305d2a8278d8346df5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: qmake

  # 配置选项列表
  configure_options:
  - "-spec linux-clang"
  - "QMAKE_STRIP="

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "qt5-qtbase/5.15.2.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "qmake 构建 Qt5 模块沿用 qt5-qtcharts 模式：私有可写 Qt prefix 镜像 qtbase（symlink + 重写 mkspecs 中 .pri 的 build-dir 引用）+ qmake -spec linux-clang"
- "make install 必须 STRIP=true（qmake strip --strip-unneeded 破坏动态符号表导致 dlopen 失败）"
- "打包后需重写 .prl/.la/.pc 中残留的 build-dir/source-dir 路径为 package_folder"
- "源码用清华 tuna 镜像（对 UA 不敏感、哈希稳定），避免 gitee archive 对 conan UA 返回 HTML"
