# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qt5-qtmultimedia/5.15.2
homepage: https://www.qt.io/

# 上游测试命令：QtMultimedia 上游 auto 测试套件依赖具体多媒体后端
# (pulseaudio/alsa/gstreamer) 与显示环境，OHOS 无对应后端，套件不可运行；
# 按 TEST_QUALITY_SPEC §3 申报豁免，以 test_package 消费者视角冒烟测试替代。
upstream_check_command: "cd tests && qmake auto/auto.pro -o Makefile.auto && make -f Makefile.auto -j4"
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_exemption:
  reason: "QtMultimedia auto 测试套件强依赖宿主机多媒体后端（pulse/alsa/gstreamer）与显示服务，OHOS 无这些后端，套件不可运行；以 test_package 的 QMediaPlayer/QAudioDeviceInfo 冒烟测试替代"
  spec: "TEST_QUALITY_SPEC §3"

# 上游测试套件位置
upstream_tests:
  - name: "QtMultimedia auto tests"
    source: qtmultimedia-everywhere-src-5.15.2/tests/auto/
    description: "QtMultimedia 自动化测试 — OHOS 无多媒体后端，套件不可运行"

# test_package 中自带的测试（消费者视角验证：链接 libQt5Multimedia 并构造/查询 API）
test_package_tests:
  - file: test.cpp
    description: "构造 QMediaPlayer、查询 QAudioDeviceInfo::availableDevices、校验 QMediaMetaData 枚举，验证 libQt5Multimedia 链接与运行"
    command: "./test_qt5_qtmultimedia"

assertion_count: 3
