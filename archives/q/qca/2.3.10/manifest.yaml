software: qca
version: "2.3.10"
status: built
build_system: cmake
build_date: "2026-07-19"

source:
  url: "https://download.kde.org/stable/qca/2.3.10/qca-2.3.10.tar.xz"
  sha256: "1c5b722da93d559365719226bb121c726ec3c0dc4c67dea34f1e50e4e0d14a02"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_WITH_QT6=ON"
    - "-DBUILD_TESTS=ON"
    - "-DBUILD_TOOLS=OFF"
    - "-DBUILD_PLUGINS=none"
    - "-DCMAKE_PREFIX_PATH=<qtbase package_folder>;<qtcore5compat package_folder>"
  dependencies:
    - qtbase/6.11.1 (Conan dependency)
    - qtcore5compat/6.11.1 (Conan dependency, Qt6Core5Compat)
  cc: clang
  cxx: clang++

patches_applied:
  - "src/CMakeLists.txt: replace UNIX-only source guards with if(NOT WIN32)"

knowledge_gained:
  - "QCA 2.3.10 supports Qt 6 through BUILD_WITH_QT6 and installs qca2-qt6 pkg-config metadata."
  - "Upstream unit tests are enabled with BUILD_TESTS=ON and run through CTest; tools and optional plugins remain disabled independently, leaving the core qca-qt6 library as the baseline package."
  - "The recipe consumes Qt from the qtbase/6.11.1 and qtcore5compat/6.11.1 Conan dependencies and points CMake at their package folders."
  - "OpenDesk round6 target log on head 18dbbb78e shows 100% tests passed (24/24) for the upstream CTest suite without OpenSSL; the cms test is conditional on OpenSSL. Current head pass rate is pending revalidation."
  - "The OHOS qtbase/6.11.1 package does not ship Qt6Core5Compat, so the recipe adds a qtcore5compat/6.11.1 dependency built from the official Qt qt5compat module; QCA's QTextCodec/QRegExp usage links against it unchanged."

test_package:
  framework: cmake
  tests:
    - "Compile and link a consumer executable with Qt6 found directly and qca-qt6 linked manually."
    - "Run a QCA::Initializer smoke check when the target binary can execute."
