software: qbdi
display: "QBDI"
description: "QuarkslaB Dynamic binary Instrumentation - LLVM-based DBI framework with an embedded AArch64 JIT and a private statically linked LLVM 19.1.5"
category: instrumentation
homepage: "https://github.com/QBDI/QBDI"
license: "Apache-2.0"
build_system: cmake

ohos_adaptation:
  key_points:
    - "QBDI 静态内置私有 LLVM 19.1.5（上游明写使用未导出的 LLVM 私有 API）; 产物中可检出 LLVMCreate/LLVMDispose/llvm::/LLVMContext 符号"
    - "LLVM 的 config.guess 不认识 HarmonyOS 而 config-ix.cmake 无条件调 get_host_triple(); 需补 aarch64:HarmonyOS 分支"
    - "LLVM NATIVE TableGen 子构建因 CMake 无 Platform/HarmonyOS 模块而报 Unable to determine platform; 需放宽 HandleLLVMOptions.cmake 条件"
    - "cmake/merge_archives.cmake 拒绝 CMAKE_SYSTEM_NAME=HarmonyOS; 用 -DCMAKE_SYSTEM_NAME=Linux(ABI 本就是 Linux/musl)"
    - "公共头文件分两处: 源码树 include/(含 .hpp) 与 CMake 构建树(生成的 Config.h/Version.h/State.h/Options.h); 只复制源码树会产出无法编译的包"
    - "Catch2 用例跨全部架构编写: 全仓 TEST_CASE_METHOD 751 个, 其中 582 个在 ARM/X86/X86_64 目录不参与本构建; 真机 --list-tests 枚举 185"
    - "鸿蒙 PC 普通用户可用 RWX mmap/mprotect, 但 ptrace 被拒绝; 适配与验证只主张进程内嵌 VM 模式(VMI/VMCall), preload/外部 attach 属平台能力边界"
    - "build() 以文本编辑方式在 cmake/llvm/QBDI_llvm.cmake 插入幂等 fixup 钩子, 不依赖外部 patch 工具; patches: {} 为空"
  common_dependencies:
    - "LLVM 19.1.5（源码，静态并入）"
    - "spdlog v1.15.0"
    - "Catch2 v3.3.1（仅测试）"

versions:
  "0.12.1":
    status: built
    build_date: "2026-09-29"
    source_url: "https://github.com/QBDI/QBDI/archive/refs/tags/v0.12.1.tar.gz"
