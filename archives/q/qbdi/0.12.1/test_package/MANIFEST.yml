# test_package/MANIFEST.yml
package: qbdi/0.12.1
homepage: "https://github.com/QBDI/QBDI"

# 本包交付静态库 libQBDI.a（内嵌私有 LLVM 19.1.5）与公共头文件 QBDI/。
# 上游测试由 -DQBDI_TEST=ON 构建出 QBDITest 可执行，但配方不代跑，
# 故 upstream_test_in_build 为 false。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "test/CMakeLists.txt"
    source: "QBDI-0.12.1/test/"
    description: >-
      上游 Catch2 单可执行 QBDITest。源码用例宏跨全部架构编写：全仓
      TEST_CASE_METHOD 751 个，其中 582 个位于 ARM/X86/X86_64 目录、本构建
      （QBDI_ARCH=AARCH64）永不编译；751-582+16 个实际编译的 TEST_CASE( = 185，
      为本架构适用并由 QBDITest --list-tests 逐条枚举的用例数。真机 185/185
      通过，86542 个断言 0 失败。
    command: "QBDITest"

test_package_tests:
  - file: "ohos_abi_check.py"
    description: >-
      产物 ELF/ABI 检查（纯 Python，任意宿主可跑）：公共头文件齐备（含
      QBDI/Memory.hpp 与构建期生成的 Config.h/Version.h/State.h/Options.h）、
      libQBDI.a 为 ar 归档且含 ELF64 AArch64 目标文件、私有 LLVM 确实静态并入
      （LLVMCreate/LLVMDispose/llvm::/LLVMContext 符号）、无 Mach-O/PE 泄漏。
      共 15 项断言。
    command: "python3 ohos_abi_check.py --package <pkg>"
  - file: "test_qbdi.cpp"
    description: >-
      消费者测试（5 项，仅 can_run 时在真机执行）：QBDI::getVersion() 返回
      0.12.1；插桩后的 vm.call() 正常完成；被插桩的 add3(1,2,3) 仍返回 6；
      PREINST 回调被触发（实测 7 条指令）；第二次独立插桩运行同样正常。
      刻意不使用 ptrace / 外部 attach。
    command: "test_qbdi"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
