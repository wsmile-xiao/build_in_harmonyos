# conandata.yml — QBDI 0.12.1
# 上游：QBDI/QBDI（基于 LLVM 的动态二进制插桩框架，静态内建私有 LLVM 19.1.5）
sources:
  url: "https://github.com/QBDI/QBDI/archive/refs/tags/v0.12.1.tar.gz"
  sha256: "6c530f55285282cbf5b3ad569013c6db9751c4ce7f3d33eb6aa39df48e7abd45"

# 本配方不使用 patches: 段的补丁文件。
# OHOS 可移植性修复由 conanfile.py 的 build() 直接注入：
#   * export_sources() 导出 fixups/ohos_*.py 两个幂等修复脚本
#   * build() 把脚本装到 <src>/cmake/llvm/ 并把调用钩子文本插入
#     cmake/llvm/QBDI_llvm.cmake（在 LLVM FetchContent 解包之后、configure 之前）
# 这样不依赖外部 patch 工具，也避免 conandata patches 在 export_sources 里的路径问题。
patches: {}
