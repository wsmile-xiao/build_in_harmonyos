software: qbdi
version: "0.12.1"
status: built
build_date: "2026-09-29"
build_system: cmake

source:
  url: "https://github.com/QBDI/QBDI/archive/refs/tags/v0.12.1.tar.gz"
  sha256: "6c530f55285282cbf5b3ad569013c6db9751c4ce7f3d33eb6aa39df48e7abd45"
  tar_format: tar.gz

build:
  system: cmake
  generator: Ninja
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DQBDI_PLATFORM=linux"
    - "-DQBDI_ARCH=AARCH64"
    - "-DQBDI_TEST=ON"
    - "-DQBDI_TOOLS_FRIDAQBDI=OFF"
    - "-DQBDI_TOOLS_PYQBDI=OFF"
    - "-DQBDI_INCLUDE_DOCS=OFF"
    - "-DQBDI_CCACHE=OFF"
  dependencies:
    - "LLVM 19.1.5（源码，经 FetchContent 拉取后静态并入 libQBDI.a）"
    - "spdlog v1.15.0（FetchContent）"
    - "Catch2 v3.3.1（FetchContent，仅测试）"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "QBDI 内置私有 LLVM：README.rst 明写使用未导出的 LLVM 私有 API，cmake/llvm/QBDI_llvm.cmake 钉住 19.1.5 并经 FetchContent 取源码，由 cmake/merge_archives.cmake 合并进 libQBDI.a；产物中可检出 LLVMCreate/LLVMDispose/llvm::/LLVMContext 符号。"
  - "LLVM 的 config.guess 不认识 HarmonyOS，而 config-ix.cmake 无条件调用 get_host_triple()（LLVM_HOST_TRIPLE 是输出），configure 会直接中止；需给 config.guess 补 aarch64:HarmonyOS:*:*) 分支。"
  - "LLVM 的 NATIVE TableGen 子构建会重新识别 host；CMake 没有 Platform/HarmonyOS 模块导致 UNIX 未置位，HandleLLVMOptions.cmake 报 Unable to determine platform；需放宽 elseif(FUCHSIA OR UNIX) 的条件。"
  - "cmake/merge_archives.cmake 按 CMAKE_SYSTEM_NAME 白名单分发，拒绝 HarmonyOS；-DCMAKE_SYSTEM_NAME=Linux 是正确旋钮，因为鸿蒙 PC 的 ABI 本就是 Linux（musl，aarch64-unknown-linux-ohos）。"
  - "QBDI 的公共头文件分两处：源码树 include/（含 .hpp）与 CMake 构建树（configure_file 生成的 QBDI/Config.h、Version.h，以及按架构选择的 State.h、Options.h）。只复制源码树的配方会产出无法编译的包——这是本适配修掉的一个真实配方缺陷。"
  - "QBDI 的 Catch2 用例宏跨全部架构编写：全仓 TEST_CASE_METHOD 751 个，其中 582 个位于 ARM/X86/X86_64 目录（本构建不编译），169 + 16 个实际编译的 TEST_CASE( = 185，与真机 --list-tests 输出吻合。报数时必须区分『跨架构源码声明』与『本架构可枚举』。"
  - "鸿蒙 PC 普通用户可用 RWX mmap 与 mprotect，但 ptrace、AF_PACKET/SOCK_RAW、AF_INET/SOCK_RAW、NETLINK_XFRM 均被拒绝；因此 QBDI 的适配与验证只主张进程内嵌 VM 模式，preload/外部 attach 属平台能力边界。"

verification:
  local_native_host: "n/a（QBDI 需在目标机上完成构建期 codegen，见 conan_create）"
  conan_create: "conan create . -o qbdi/*:shared=False -> CONAN_CREATE_RC=0（872 个 ninja 目标全绿）"
  upstream_catch2_suite: "QBDITest -> 185 test cases / 86542 assertions / 0 failures（鸿蒙 PC 真机原生运行）"
  upstream_total: "跨架构源码声明 751；AArch64 可枚举 A=185；执行 E=185；通过 P=185；失败 F=0；执行覆盖率 185/185=100%，已执行通过率 185/185=100%"
  abi_check: "test_package/ohos_abi_check.py -> 15/15 PASS（含 QBDI/Memory.hpp 与 4 个构建期生成头文件；libQBDI.a 内私有 LLVM 符号存在；AArch64 ELF64；无 Mach-O/PE）"
  consumer_test: "test_package/test_qbdi.cpp -> 5/5 PASS（内嵌 VM：getVersion、插桩后 vm.call() 完成、返回值保真、PREINST 回调触发 7 条指令、二次运行正常；不使用 ptrace）"
