software: qalculate-gtk
display: "Qalculate! (GTK UI)"
description: "GTK3 GUI front-end for Qalculate! (multi-purpose desktop calculator)"
category: math
homepage: "https://qalculate.github.io/"
license: GPL-2.0-or-later

ohos_adaptation:
  key_points:
    - "构建系统：autotools（自带 configure，无需 autoreconf）"
    - "GTK3 生态（gtk3/glib/cairo/pango 等）由 cmd-pkgs 预编译包体系提供，libqalculate 计算引擎走 conan requires"
    - "config.guess 需添加 HarmonyOS 检测分支（aarch64-HarmonyOS -> aarch64-unknown-linux-gnu）"
    - "configure 需跳过 intltool XML::Parser 检查（OHOS 无该 perl 模块）；intltool-merge/extract 用 shim 替代"
    - "configure 需移除 umask 077（HMDFS 兼容）"
    - "GNOME Shell search-provider 默认启用但鸿蒙无 GNOME Shell（且 gdbus-codegen 依赖 Python pyexpat 不可用）→ --disable-gnome-search 禁用"
    - "构建期工具（glib-compile-resources 等）需 PATH 前置 ~/usr/local/bin 使用 cmd-pkgs 自带版（RUNPATH 相对路径）"
  common_dependencies:
    - libqalculate
    - gtk3
    - glib

versions:
  "5.8.2-r0":
    status: built
    build_date: "2026-09-03"
