# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qalculate-gtk/5.8.2-r0
homepage: "https://qalculate.github.io/"

# 上游测试命令（make check 仅执行 intltool 工具链检查，
# 上游无真实测试套件：无 check_PROGRAMS/TESTS、无 tests/ 目录）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check（执行一次；上游无测试套件，仅为 intltool 工具链检查）"

# 上游实际运行的测试程序（无 → 空列表）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：qalculate-gtk 依赖链验证——链接 libqalculate 并执行 1+2*6 校验计算引擎可用"
    command: "./test_qalculate_gtk"

# 测试断言总数
assertion_count: 1