# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PATH 注入必须走 AutotoolsToolchain tc.environment()（generate 内），build() 内 os.environ 会被 conanbuild 环境覆盖；profile [buildenv] PATH=+ 会把 /data/service/hnp/bin 前置"
  - "构建期工具（glib-compile-resources/gdbus-codegen）需用 cmd-pkgs 自带版（RUNPATH 相对路径）或禁用对应可选组件"
  - "gdbus-codegen 在 OHOS 有坏 shebang（#!/usr/bin/python3）且依赖 Python pyexpat（conanbuild 不可用）→ GNOME Shell search-provider 用 --disable-gnome-search 禁用"
  - "GTK3 生态（gtk/glib/cairo/pango 等）用 cmd-pkgs 预编译包，libqalculate 走 conan requires"
  - "上游无测试套件（make check 仅为 intltool 工具链检查），test_package 链接 libqalculate 验证依赖链（R34）"

