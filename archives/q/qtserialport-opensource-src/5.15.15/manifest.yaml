knowledge_gained:
  - "Qt5 5.15.15 serialport module builds with qmake against qt5-qtbase/5.15.2.2 (binary-compatible across Qt 5.15.x patch versions)."
  - "qt5-qtbase 制品仓包内 qt.conf/mkspecs .pri 残留构建机 conan 缓存路径，消费方必须按 qt5-qtdeclarative 先例重写后才能用 qmake 构建（'Unknown module(s) in QT: core-private' 根因）。"
  - "上游测试可用 QMAKEMODULES=<模块构建树>/mkspecs/modules 让 qmake 解析刚构建的 serialport 模块后在 tests/auto 下构建运行。"
  - "No udev dependency: qt5-qtbase 编译时 libudev 为 disabled feature；串口枚举走 /sys/class/tty 回退。"
  - "libQt5SerialPort.so is the primary output; CMake config files (Qt5SerialPortConfig.cmake) are relocatable (CMAKE_CURRENT_LIST_DIR based)."

