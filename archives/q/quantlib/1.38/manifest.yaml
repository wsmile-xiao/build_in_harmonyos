software: quantlib
version: "1.38"
status: built
build_date: "2026-09-04"
build_system: cmake

source:
  url: "https://github.com/lballabio/QuantLib/releases/download/v1.38/QuantLib-1.38.tar.gz"
  sha256: "7280ffd0b81901f8a9eb43bb4229e4de78384fc8bb2d9dcfb5aa8cf8b257b439"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DQL_BUILD_EXAMPLES=OFF"
    - "-DQL_BUILD_TEST_SUITE=ON"
    - "-DQL_ENABLE_OPENMP=OFF"
  dependencies:
    - "boost/1.84.0"

patches_applied: []
knowledge_gained:
  - "OHOS Boost.Math can misbehave on long-double promotion paths; set BOOST_MATH_PROMOTE_DOUBLE_POLICY=0 to keep QuantLib test-suite on the double path and avoid evaluation_error in CDO/CEV cases."

verification:
  local:
    - "python -m py_compile conanfile.py test_package/conanfile.py"
  ohos:
    status: passed
    command: "conan create archives/q/quantlib/1.38 --profile=ohos-aarch64 --build=missing"
    result: "EXIT=0"
  upstream_make_check:
    status: passed
    note: "CMake upstream test suite: quantlib-test-suite"
    result: "1137/1137 PASS"
  test_package:
    status: passed
    result: "quantlib curve test passed: 0.951229"
