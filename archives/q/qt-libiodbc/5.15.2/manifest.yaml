version: "5.15.2"
status: built
build_date: "2026-06-12"

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
  tar_format: tar.xz

build:
  system: custom
  configure_options:
    - "Manual compilation: clang++ with Qt5 5.12.12 headers and iODBC libiodbc"
  dependencies:
    - "qt5-qtbase/5.12.12"
    - "libiodbc"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Qt5 iODBC plugin requires Qt5-specific headers; installed headers are mixed Qt5/Qt6"
  - "Mixed Qt5/Qt6 header environment requires explicit Qt5 header paths for plugin compilation"
  - "libqsqliodbc.so uses unique keys QIODBC3/QIODBC (distinct from unixODBC's QODBC3/QODBC)"
  - "iODBC driver links against libiodbc.so.2 and libiodbcinst.so.2"
  - "Driver needs manual deployment to sqldrivers/ directory (auto-install not working)"
  - "Runtime dlopen testing blocked by OHOS ELF signing requirement (platform limitation)"