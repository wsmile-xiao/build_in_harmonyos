software: qt-libiodbc
display: "Qt5 iODBC Driver"
description: "Qt5 iODBC SQL driver plugin (QIODBCDriver)"
category: db
homepage: "https://download.qt.io/archive/qt/5.15/"
license: LGPL-2.1
build_system: custom

ohos_adaptation:
  key_points:
    - "Qt5 iODBC驱动插件需要手动clang++编译，无法使用qmake构建系统（OHOS混合Qt5/Qt6环境）"
    - "需要Qt5 Core/Sql开发库和iODBC libiodbc开发库"
    - "运行时dlopen加载需要ELF签名（平台限制）"
    - "libqsqliodbc.so使用独立的QIODBC3/QIODBC驱动键（与unixODBC的QODBC3/QODBC区分）"
    - "驱动需要部署到sqldrivers/目录才能被Qt应用加载"
  common_dependencies:
    - qt5-qtbase
    - libiodbc

versions:
  "5.15.2":
    status: built
    build_date: "2026-06-12"