# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.11.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.11.1.1"

# 软件名
software: qtsvg

# 编译状态
# published | built | failed | archived
status: pending

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtsvg-everywhere-src-6.11.1.tar.xz"

  # 源码校验和
  sha256: "7f3cf02f4824bf03c2c5859ea6db173bf1482a1daf24e6cdf7bc78cfa26a8a94"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qtbase/6.11.1.3
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "qtbase 使用 cmake_find_mode=none，不产生 CMakeDeps 包装配置；消费者必须在 generate() 显式设置 Qt6_DIR / Qt6Svg_DIR / Qt6SvgWidgets_DIR。"
  - "CMAKE_MODULE_PATH 需指向 qtbase 的 lib/cmake/Qt6/platforms，才能加载 Platform/HarmonyOS.cmake 并生成正确 SONAME，否则插件 DT_NEEDED 是字面相对路径、运行时加载失败。"
  - "test_package 运行需要 OHOS ELF 签名与 QT_PLUGIN_PATH 指向 imageformats 插件，否则 tst_qicon_svg 报 SVG support is not available。"
test_results:
  type: isolated_chain_verification
  upstream: "passed: 5/5 上游 QtSvg 测试（tst_qicon_svg / tst_qsvgcss / tst_qsvggenerator / tst_qsvgplugin / tst_qsvgrenderer）在 qtbase/6.11.1.3 隔离链上全部通过"
  test_package: "passed: test_qtsvg（QSvgRenderer 渲染校验）1/1"
  note: "上述记录来自本修订之前、同一份配方在 qtbase/6.11.1.3 隔离链上的验证；本修订仅改 provider 引用与版本号，最终以 CI 结论为准。"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
