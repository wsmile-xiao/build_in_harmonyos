software: qtsvg
version: 6.11.1
category: graphics
status: built

build_system: cmake
compiler: clang 15.0.4
linker: GNU ld 2.45

dependencies:
  qtbase: 6.11.1

configure_options:
  - CMAKE_INSTALL_PREFIX=$HOME/usr/local
  - CMAKE_BUILD_TYPE=Release

features:
  svg_rendering: true
  svg_widget: true
  shared_libraries: true

build_notes:
  - QtSvg module built as shared library (libQt6Svg.so)
  - QtSvgWidgets module built as shared library (libQt6SvgWidgets.so)
  - CMake build system detected (init-build incorrectly classified as autotools)
  - No source modifications required for HarmonyOS
  - ELF signed for HarmonyOS execution

artifacts:
  - libQt6Svg.so.6.11.1 shared library
  - libQt6SvgWidgets.so.6.11.1 shared library
  - QtSvg/QtSvgWidgets headers
  - CMake config files (Qt6Svg, Qt6SvgWidgets)
  - pkg-config files (Qt6Svg.pc, Qt6SvgWidgets.pc)

source_url: https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtsvg-everywhere-src-6.11.1.tar.xz