version: "1.3.4"
software: "qqwing"
status: "built"
build_date: "2026-09-20"
build_system: "autotools"

source:
  url: "https://qqwing.com/qqwing-1.3.4.tar.gz"
  sha256: "1753736c31feea0085f5cfac33143743204f8a7e66b81ccd17e249ecafba802f"
  tar_format: "tar.gz"

build:
  system: "autotools"
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
  dependencies: []
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "0001-config.sub-ohos.patch"
knowledge_gained:
  - "config.sub (2014) 不识别 linux-ohos，需补丁添加 linux-ohos* 到 kernel-os 验证列表"
  - "LT_INIT([disable-static]) 默认只建共享库，需 --enable-static --disable-shared"
  - "HMDFS 上 configure 无执行权限且 chmod 不生效（E087），需用 CONFIG_SHELL 执行 configure"
  - "libtool 在 PATH 搜不到 ld/ar/ranlib（E266/E012），需命令内 export LD/AR/RANLIB 到 /data/service/hnp/bin"
  - "Environment.save_script 与 AutotoolsToolchain 聚合产生递归 source，导致 printenv Argument list too long，改用命令内 export"
  - "config.status mktemp 目录权限 2700（E112/E011），需把 configure 的 umask 077 改为 022"
  - "test_package 的 cmake 不在 PATH，需 self.conf.define cmake_program"

homepage: "https://qqwing.com/"
license: "GPL-2.0-or-later"

tests:
  upstream:
    command: "make check"
    cases: 0
    passed: 0
    note: "上游 C++ 无单元测试；test/ 目录为 shell 集成测试，依赖 bash/perl，未在真机执行"
  adapted:
    command: "test_package/test_qqwing"
    cases: 13
    passed: 13
    pass_rate: "13/13 (100%)"
  shadow_ci:
    command: "sh run-conan-heavy.sh (qqwing-1.3.4-shadow-20260920)"
    result: "conan create passed (exit 0)"
    levels: "L0/L1/L2/L4/L5 all pass; L1e destructive negative test passed"
