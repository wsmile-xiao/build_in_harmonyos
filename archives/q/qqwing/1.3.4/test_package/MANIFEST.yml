# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
package: qqwing/1.3.4
homepage: "https://qqwing.com/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试（shell 集成测试，依赖 bash/perl 等，本机未执行）
upstream_tests:
  - file: test/app/generate.sh
    source: qqwing-1.3.4/test/app/generate.sh
    description: "上游 shell 集成测试（依赖 bash/perl，未在本机执行）"
    command: "sh test/app/generate.sh"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：验证 getVersion/setPuzzle/solve/isSolved/hasUniqueSolution/countSolutionsLimited/generatePuzzle 核心 API"
    command: "./test_qqwing"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 13
