package: qtlottie/6.11.1
homepage: "https://doc.qt.io/qt-6/qtlottie-index.html"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ctest --test-dir <build_folder> --output-on-failure"

upstream_tests:
  - file: tests/auto
    source: qtlottie-everywhere-src-6.11.1/tests/auto
    case_count: 13
    description: "Qt Lottie auto tests: 13 CTest targets in upstream v6.11.1 (11 shape tests + tst_lottie_qml + tst_vectorimage). All 13 targets are enabled: qtdeclarative now builds and exports QuickVectorImageGeneratorPrivate, so the conditional tst_vectorimage target is included. Enabled with BUILD_TESTING=ON and QT_BUILD_TESTS=ON, then executed by ctest."
    command: "ctest"
  - file: tests/baseline
    source: qtlottie-everywhere-src-6.11.1/tests/baseline
    case_count: 0
    description: "Rendering baseline tests; not enabled in headless CI because they require graphical rendering baselines and visual comparison."
    command: "ctest"
  - file: tests/manual
    source: qtlottie-everywhere-src-6.11.1/tests/manual
    case_count: 2
    description: "featcheck and testApp manual programs; not built/run by headless CI, require a display session."
    command: "manual"
    status: manual
  - file: tests/libfuzzer
    source: qtlottie-everywhere-src-6.11.1/tests/libfuzzer
    case_count: 1
    description: "Upstream fuzzer entry (qml/qlottieanimation/parse); not part of the headless auto gate."
    command: "fuzzer"
    status: unexecuted

test_package_tests:
  - file: test_qtlottie.cpp
    description: "Consumer smoke test that uses a Lottie JSON document embedded in test_qtlottie.cpp (content copied from the upstream fixture tests/auto/lottie/shape/ellipse/data/ellipse_static_100x80.json) through Qt.labs.lottieqt and checks Ready, start/end frames, frame rate, and duration."
    command: "./test_qtlottie"

upstream_total_case_count: 13
upstream_enabled_case_count: 13
upstream_excluded_case_count: 0
upstream_manual_case_count: 2
upstream_pass_rate: "13 upstream CTest targets in v6.11.1 all enabled after qtdeclarative exports QuickVectorImageGeneratorPrivate; current head pending OpenDesk revalidation."
assertion_count: 5
