software: qtlottie
version: "6.11.1"
status: built
build_date: "2026-07-19"

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtlottie-everywhere-src-6.11.1.tar.xz"
  sha256: "e0d0fadbdc33e97c8241c56273b54b6a7b1139e076fdd21281bc4662ee4b2679"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DQT_BUILD_EXAMPLES=OFF"
    - "-DQT_BUILD_TESTS=ON"
    - "-DQT_BUILD_TESTS_BY_DEFAULT=ON"
    - "-DCMAKE_PREFIX_PATH=<qtbase package folder (set by generate())>"
  dependencies:
    - qtbase/6.11.1
    - qtdeclarative/6.11.1
    - qtshadertools/6.11.1
    - qtsvg/6.11.1
  cc: clang
  cxx: clang++

patches_applied:
  - "conanfile.py source(): add QuickShapesPrivate to the QuickVectorImageGeneratorPrivate guard in the top-level CMakeLists.txt"
  - "conanfile.py source(): gate tools/lottietoqml behind QT_BUILD_TOOLS in tools/CMakeLists.txt"
  - "conanfile.py source(): enable src/lottiegenerator when QuickPrivate/QuickShapesPrivate/QuickVectorImageGeneratorPrivate targets are present"

knowledge_gained:
  - "Qt Lottie 6.11.1 is a Qt module and must be built against the existing Qt 6.11.1 installation."
  - "The recipe declares qtbase/6.11.1, qtdeclarative/6.11.1, qtshadertools/6.11.1, and qtsvg/6.11.1 as Conan requirements; generate() sets CMAKE_PREFIX_PATH and explicit Qt6_DIR/Qt6Qml_DIR/Qt6Quick_DIR from the resolved package folders."
  - "Upstream Qt auto tests are enabled with BUILD_TESTING=ON and QT_BUILD_TESTS=ON, then executed with ctest under the OpenDesk OHOS environment."
  - "R40 manual validation marker: manual adaptation-completeness confirmation is still required for baseline/manual rendering coverage. Headless CI covers build, Qt auto tests, linkage, and non-rendering smoke checks; visual frame playback and EGL/GLES rendering remain manual."
  - "qtlottie lottietoqml requires Qt6QuickVectorImageGeneratorPrivate from qtdeclarative; qtdeclarative now depends on qtsvg so the private module is built, and generate() sets the matching Qt6*_DIR variables."
