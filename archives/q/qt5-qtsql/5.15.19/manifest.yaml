# 版本级 manifest
# 文件位置: archives/q/qt5-qtsql/5.15.19/manifest.yaml

version: "5.15.19"
software: "qt5-qtsql"
status: built
build_date: "2026-09-13"
build_system: "qmake"

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.19/submodules/qtbase-everywhere-opensource-src-5.15.19.tar.xz"
  sha256: "51e91c73abacab81e64efd01bf95794e79c0e605ad80947a024769f0dd620a32"
  tar_format: tar.xz

build:
  system: qmake（qtbase configure -sql-sqlite + make -j1）

dependencies:
  runtime:
    - qt5/5.15.19（Qt5Core 运行时，ABI 同源）
    - zlib/1.3.1

tests:
  framework: "test_package（QSQLITE :memory: 建表/插入/读回断言）"
  count: 1
  notes: >-
    运行期需 QT_PLUGIN_PATH 指向 plugins 根目录（Qt 自拼 sqldrivers 子路径），
    QT_PLUGIN_PATH 指向 sqldrivers 子目录则 QFactoryLoader 找不到驱动。

packaging:
  type: shared-library
  artifacts:
    - lib/libQt5Sql.so
    - include/QtSql/
    - lib/cmake/Qt5Sql/
    - plugins/sqldrivers/libqsqlite.so
