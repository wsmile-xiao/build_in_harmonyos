software: qpid-proton
display: "Qpid Proton"
description: "Apache Qpid Proton - lightweight AMQP 1.0 messaging library (C core, messenger, reactor and epoll proactor)"
category: middleware
homepage: "https://qpid.apache.org/proton/"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 4.1 ships no Platform/HarmonyOS module (E092): CMAKE_SYSTEM_NAME is aliased to Linux so the platform sources, the ELF DT_SONAME and the UNIX link branch are used instead of the generic fallback; LIB_SUFFIX is cleared so the package keeps the conan-standard lib/ layout"
    - "CMAKE_PLATFORM_NO_VERSIONED_SONAME keeps an unversioned DT_SONAME and skips .so.N symlink chains (HMDFS does not resolve symlink aliases reliably); without it the exported ProtonTargets.cmake also carries IMPORTED_NO_SONAME, which the CI L5 soname gate rejects"
    - "HarmonyOS epoll ignores EPOLLONESHOT, which livelocks the proactor poller (pn_proactor_get()/pn_proactor_wait() never return) and hangs c-proactor-test; patches/0001 emulates one-shot delivery with EPOLL_CTL_MOD(events=0) right after the descriptor is reported"
    - "OHOS verifies the ELF .codesign section at load time and CMake's install step invalidates it by rewriting the RUNPATH of libraries with in-tree dependencies, so package() re-signs lib/*.so with llvm-objcopy + binary-sign-tool"
    - "Upstream's default -Werror is disabled (ENABLE_WARNING_ERROR=OFF), as upstream itself does for Darwin: proton 0.38.0 has 14 old-style function definitions that clang 15 diagnoses with -Wstrict-prototypes"
    - "TLS is enabled by linking the static openssl/3.5.8.1 package; SASL (SASL_IMPL=none) and libuv are upstream-optional and not required by any test, jsoncpp is only used by the disabled C++ binding"
    - "Packaged shared objects: libqpid-proton.so (messenger+reactor+core+proactor), libqpid-proton-core.so, libqpid-proton-proactor.so, plus include/proton/*.h, lib/cmake/Proton/ProtonConfig.cmake and pkg-config files; no executables are installed"
  common_dependencies:
    - "openssl/3.5.8.1"

versions:
  "0.38.0":
    status: built
    build_date: "2026-09-21"
    conan_ref: "qpid-proton/0.38.0"
