version: "0.38.0"
software: "qpid-proton"
status: "built"
build_date: "2026-09-21"
build_system: "cmake"

source:
  url: "https://github.com/apache/qpid-proton/archive/refs/tags/0.38.0.tar.gz"
  sha256: "b18ed91d15d8d12cbc9fce4de55f102f23a71c9c266e9d04b66e8c516b978d59"
  tar_format: "tar.gz"

build:
  system: "cmake"
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DLIB_SUFFIX="
    - "-DCMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_EXAMPLES=ON"
    - "-DBUILD_CPP=OFF"
    - "-DBUILD_GO=OFF"
    - "-DBUILD_STATIC_LIBS=OFF"
    - "-DBUILD_TLS=OFF"
    - "-DENABLE_FUZZ_TESTING=ON"
    - "-DENABLE_WARNING_ERROR=OFF"
    - "-DSASL_IMPL=none"
    - "-DSSL_IMPL=openssl"
  dependencies:
    - "openssl/3.5.8.1"
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "patches/0001-ohos-emulate-epolloneshot-in-epoll-proactor.patch"

knowledge_gained:
  - "CMake 4.1 has no Platform/HarmonyOS module, so on HarmonyOS the platform file is not loaded at all: no DT_SONAME is emitted, DT_NEEDED records build-tree relative paths and the installed ProtonTargets.cmake carries IMPORTED_NO_SONAME. Forcing CMAKE_SYSTEM_NAME=Linux (E092) fixes all three; LIB_SUFFIX must be cleared at the same time or the Linux branch installs into lib64/."
  - "HarmonyOS epoll ignores EPOLLONESHOT: a descriptor armed with it is reported by every epoll_wait(). qpid-proton's proactor keeps its ready-list eventfd readable forever and relies on one-shot delivery, so the poller spins forever and c-proactor-test hangs (1500s ctest timeout). Emulating one-shot with EPOLL_CTL_MOD(events=0) right after delivery fixes it."
  - "OHOS verifies the ELF .codesign section at load time. CMake's install step rewrites the RPATH of libraries that depend on other in-tree libraries (libqpid-proton-proactor.so -> libqpid-proton-core.so) and drops the build RPATH, which invalidates the signature: the packaged library then fails dlopen/DT_NEEDED with 'Permission denied' (or a bare 'Error loading shared library'). Re-sign the installed shared objects with llvm-objcopy + binary-sign-tool in package()."
  - "Upstream's bundled SSL test certificates (c/tests/ssl-certs/{tserver,tclient}-certificate.pem) expired on 2025-11-24 (notAfter=Nov 24 18:10:39 2025 GMT), so the two SSL ctest entries fail on any host running the suite after that date, independently of OHOS."
  - "BUILD_TESTING=ON with BUILD_EXAMPLES=OFF fails to configure because the fdlimit/example ctest entries reference the `c-broker` example target; BUILD_EXAMPLES must stay ON."

homepage: "https://qpid.apache.org/proton/"
license: "Apache-2.0"

tests:
  upstream:
    command: "ctest -V --timeout 120"
    cases: 91
    passed: 89
    note: "Catch2 用例口径 91（89 通过），ctest 条目口径 11（9 通过）：失败 2 条均为上游内置测试证书 2025-11-24 过期（c-proactor-test 的 proactor_ssl 用例与 c-ssl-proactor-test 套件）。实测见 reports/upstream-tests.md。"
  adapted:
    command: "test_package/test_qpid_proton"
    cases: 13
    passed: 13
    pass_rate: "13/13 (100%)"
