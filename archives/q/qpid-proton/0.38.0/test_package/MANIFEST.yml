# test_package/MANIFEST.yml
# 上游官方测试声明 (CI build_and_test.sh L0e 强制要求存在)
package: qpid-proton/0.38.0
homepage: "https://qpid.apache.org/proton/"

# 上游测试入口 (conanfile.py 的 build() 内执行)
upstream_check_command: "ctest -V --timeout 120"
upstream_test_in_build: true
upstream_test_command: "ctest -V --timeout 120"
upstream_tests_exist: true
upstream_test_framework: "ctest driving Catch2 v2 (c/tests/*.cpp), the Python harnesses c/tests/fdlimit.py and tests/examples/testme, and the libFuzzer standalone regression driver (c/tests/fuzz)"

# 计数口径: ctest 条目 11 (5 Catch2 可执行 + 4 fuzz 回归 + 2 Python 套件);
# 下面两个字段用 Catch2 test case 口径 (实测, 见 reports/upstream-tests.md)。
upstream_test_count: 91
upstream_test_total: 91
upstream_test_count_method: "catch2_test_cases (实测口径: 5 个 Catch2 可执行文件共 91 个 TEST_CASE, 2672 条断言; ctest 条目 11)"

upstream_test_audit: >-
  OHOS PC (aarch64) 真机实测 conan create: ctest 注册 11 条目, 9 通过 2 失败.
  Catch2 口径 91 个 test case 中 89 通过 (2672 断言中 2660 通过).
  两个失败条目全部是上游自带 SSL 测试: c-proactor-test 的 proactor_ssl 用例 8 断言失败、
  c-ssl-proactor-test 整个套件 4 断言失败, 唯一根因 = 上游仓库内置测试证书
  c/tests/ssl-certs/{tserver,tclient}-certificate.pem 已于 2025-11-24 过期
  (openssl x509 -noout -dates: notAfter=Nov 24 18:10:39 2025 GMT), OpenSSL 报
  error:0A000415 "ssl/tls alert certificate expired" / error:0A000086 "certificate verify
  failed". 该失败与平台无关 (任何 2025-11-24 之后跑上游套件的主机同样失败), 未修改
  任何上游测试数据. 逐条证据与复跑命令见 reports/upstream-tests.md.
  patches/0001 (HarmonyOS epoll 不支持 EPOLLONESHOT -> proactor 轮询 livelock) 修复前
  c-proactor-test 会挂死 (ctest 1500s 超时), 修复后 1.9s 跑完 14/15 用例.

upstream_tests:
  - file: c/tests/c-core-test.cpp 集合 (c/tests/*.cpp)
    source: qpid-proton-0.38.0/c/tests/CMakeLists.txt
    description: "Catch2 单元套件: c-core-test 72 用例/1299 断言, c-extra-test 1/254, c-proactor-test 15/234, c-raw-connection-test 2/846, c-ssl-proactor-test 1/39"
    command: "ctest -V --timeout 120"
  - file: c/tests/fdlimit.py
    source: qpid-proton-0.38.0/c/tests/CMakeLists.txt
    description: "Python 驱动的文件描述符上限回归套件 (c-fdlimit-tests)"
    command: "ctest -R c-fdlimit-tests"
  - file: tests/examples/testme
    source: qpid-proton-0.38.0/tests/examples/CMakeLists.txt
    description: "Python 驱动的示例套件, 起真实 c-broker + send/receive 回环 (c-example-tests, 7 子用例全过)"
    command: "ctest -R c-example-tests"
  - file: c/tests/fuzz/*.c
    source: qpid-proton-0.38.0/c/tests/fuzz/CMakeLists.txt
    description: "libFuzzer StandaloneFuzzTargetMain 语料回归: fuzz-connection-driver / fuzz-message-decode / fuzz-url / fuzz-sniff-header"
    command: "ctest -R fuzz-"

test_package_tests:
  - file: test_qpid_proton.c
    description: "13 项消费者/平台探针 (6 项 platform: aarch64 LP64/小端/musl 行为/proactor interrupt|timeout|idle 事件(patches/0001 回归) + 7 项 consumer: 版本宏/AMQP 1.0 线上字节一致性/消息编解码往返/pn_data map 编解码/TLS 可用/messenger 生命周期与订阅)"
    command: "./test_qpid_proton"

assertion_count: 13
