# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qtpositioning/5.15.2
homepage: "https://www.qt.io/"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试
# 上游 tests/auto 为 Qt Test，定位子集可执行测试目标 N=20（另有夹具插件与
# helper 不计入），完整执行需在目标机用 offscreen 环境真跑，实测结果见
# manifest.yaml 的 test_summary 与 notes.md 的实测节。
upstream_tests:
  - file: tests/auto/auto.pro
    source: qtlocation-everywhere-src-5.15.2/tests/auto/auto.pro
    description: "Qt5 upstream auto tests (positioning subset) for Qt Positioning"
    command: "make check"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "Verifies QtPositioning C++ API (QGeoCoordinate geodesics, QGeoPath/QGeoPolygon/QGeoRectangle geometry, QNmeaPositionInfoSource NMEA replay), position plugin load (positionpoll via QPluginLoader + availableSources), and QML import QtPositioning 5.15 (PositionSource/CoordinateAnimation)"
    command: "./test_qtpositioning"

# 测试断言总数
assertion_count: 38
