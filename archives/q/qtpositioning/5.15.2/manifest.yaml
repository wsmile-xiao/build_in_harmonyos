software: qtpositioning
# 版本级 manifest
# 文件位置: archives/q/qtpositioning/5.15.2/manifest.yaml

version: "5.15.2"

status: built

build_date: "2026-10-04"

source:
  # 上游从无独立的 qtpositioning tarball：positioning 与 location 同仓发布，
  # 源码即 qtlocation-everywhere-src；download.qt.io 官方源作为 fallback
  # 列于 conandata.yml。
  url: "https://mirrors.tuna.tsinghua.edu.cn/qt/archive/qt/5.15/5.15.2/submodules/qtlocation-everywhere-src-5.15.2.tar.xz"
  sha256: "984fcb09e108df49a8dac35d5ce6dffc49caafd2acb1c2f8a5173a6a21f392a0"
  tar_format: tar.xz

build:
  system: qmake
  configure_options:
    - "qmake -spec linux-clang src/positioning/positioning.pro"
    - "make QMAKE_STRIP="
  dependencies:
    - qt5-qtbase/5.15.2.2
    - qt5-qtdeclarative/5.15.2
  cc: clang
  cxx: clang++
  mkspec: linux-clang

patches_applied: []

packaging:
  conan_recipe: true
  conanfile: conanfile.py
  conandata: conandata.yml
  test_package: test_package/

knowledge_gained:
  - "上游定位模块与 location 同仓（qtlocation-everywhere-src），positioning 无独立 tarball：根 qtlocation.pro 会连带构建 location，qmake 须逐子项目限定范围（src/3rdparty 三助手库 -> src/positioning -> src/positioningquick -> src/imports/positioning -> src/plugins/position/positionpoll）"
  - "单子项目 qmake 没有顶层 configure 产物，src/plugins/position/position.pro 的 QT_FOR_CONFIG += positioning-private + qtConfig(gypsy) 会报 Could not find feature gypsy：直接构建 positionpoll.pro（该目录本就是范围内唯一可建插件）"
  - "qt5-qtbase/qt5-qtdeclarative 包的 .pri/qml/mkspecs 引用构建期目录（.conan2/p/b/qt5-q*/b），消费方必须在 build() 内重定位（qt.conf 重写 + .pri 合并/改写），与 qt5-qtquickcontrols2 5.15.2 同法"
  - "syncqt 转发头 include/QtPositioning/**（含 5.15.2 版本目录）引用 ../../src 相对路径，打包重定位后失效：build() 末尾用 src/ 真头覆盖（_sync_forward_headers）"
  - "OHOS 禁符号链接（ln EPERM）：qmake 生成的 libFoo.so/.so.5/.so.5.15 别名链在 -j 下竞态失败（Error 1 (ignored)）：统一用文件副本补齐（_materialize_shared_object_links），定位模块两个 .so 各补 3 个别名"
  - "positionpoll 插件的 areaMonitor() 工厂要求 QGeoAreaMonitorPolling::isValid()（= 默认 positionInfoSource 非空）：平台范围内无默认定位源插件时 createSource('positionpoll') 返回空属预期；插件可用性以 QGeoAreaMonitorSource::availableSources() 枚举 + QPluginLoader 直载 + 工厂接口 cast 为准"
  - "QNmeaPositionInfoSource 仿真回放要求完整日期时间语句（GPRMC）且 5.15 解析器强制校验 NMEA XOR 校验和（无 '*' 段一律判无效）；SimulationMode 首条修复立即发出，后续按 NMEA 时间戳差定时回放（实测 1s 间隔准点）"
  - "QML 侧验证：QQmlEngine 导入 QtPositioning 5.15（PositionSource 属性读写 + CoordinateAnimation 实例化）需 QV4_FORCE_INTERPRETER=1 + QML_DISABLE_DISK_CACHE=1（OHOS W^X 拦 JIT）"
  - "几何语义（真机实测 + 源码实证）：QGeoPath::length(indexFrom, indexTo) 默认 indexTo=-1 时 wrap=true 会补末点→首点闭合段（qgeopath.cpp:551-567，实测三顶点路径 length() 48875.9 ≈ 2× 开放长度），开放折线长度须显式 length(0, size()-1)；QGeoPolygon 的包含判定有两套互不等价的 API——QGeoShape::contains() 才是点落多边形内（polygonContains → clip2tri::pointInPolygon，qgeopolygon.cpp:606），containsCoordinate() 仅为周长元素匹配（继承 QGeoPathPrivate::containsCoordinate = m_path.indexOf()，qgeopath.cpp:582）"

