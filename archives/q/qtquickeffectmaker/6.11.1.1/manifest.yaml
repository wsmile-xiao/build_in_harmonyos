software: qtquickeffectmaker
version: "6.11.1.1"
status: built
build_date: "2026-07-20"

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtquickeffectmaker-everywhere-src-6.11.1.tar.xz"
  sha256: "cfe63e70e88bdd126a175762d3eeb38eb336e45beceedcbd027bc5362744136b"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DQT_BUILD_EXAMPLES=OFF"
    - "-DQT_BUILD_TESTS=ON"
    - "-DQT_BUILD_TESTS_BY_DEFAULT=ON"
    - "-DCMAKE_PREFIX_PATH=<qtbase package folder (set by generate())>"
  dependencies:
    - qtbase/6.11.1
    - qtdeclarative/6.11.1
  cc: clang
  cxx: clang++

patches_applied:
  - "conanfile.py source() removes the NOT CMAKE_CROSSCOMPILING guard in tests/auto/CMakeLists.txt so upstream tst_qtquickeffectmaker registers in OHOS cross builds"

knowledge_gained:
  - "Qt Quick Effect Maker 6.11.1 upstream builds the qqem tool and QML node assets, but no libQt6QuickEffectMaker library or Qt6QuickEffectMaker CMake component; the recipe therefore does not link a nonexistent Qt6 module library."
  - "The recipe enables upstream Qt auto tests and runs ctest with the offscreen Qt platform when target binaries can execute; source() removes the upstream NOT CMAKE_CROSSCOMPILING guard so the test registers in OHOS cross builds."
  - "The package test resolves Qt6 Core/Gui/Qml/Quick, links only those targets, and verifies the installed qqem offline tool binary by running qqem --help when target execution is available; shader rendering still requires manual validation on an OpenHarmony display session."
  - "R40 manual validation marker: manual adaptation-completeness confirmation is required. Headless CI covers build/linkage/non-rendering smoke checks only; Qt Quick Effect Maker shader generation and rendered effect output require an OpenHarmony PC display session with Qt Quick scene graph support. Keep status built until manual validation is complete."
