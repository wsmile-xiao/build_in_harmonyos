software: qtquickeffectmaker
display: "qtquickeffectmaker"
description: "Qt Quick Effect Maker (QQEM) for creating custom shader effects"
category: graphics
homepage: "https://code.qt.io/cgit/qt/qtquickeffectmaker.git"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "依赖制品仓已发布包：qtbase/6.11.1（含 Qt6BuildInternals，提供 qt_internal_* 宏）、qtdeclarative/6.11.1、qtshadertools/6.11.1；qtquick3d 为上游可选依赖"
    - "CMake 无 Platform/HarmonyOS.cmake，需 toolchain block 置 CMAKE_SYSTEM_NAME=Linux + CMAKE_CROSSCOMPILING=FALSE（上游 CMakeLists 在交叉编译时跳过构建）"
    - "CMAKE_PREFIX_PATH 指向 qtbase，QT_ADDITIONAL_PACKAGES_PREFIX_PATH 指向 qtdeclarative/qtshadertools"
  common_dependencies: [qtbase/6.11.1, qtdeclarative/6.11.1, qtshadertools/6.11.1]

versions:
  "6.11.1":
    status: built
    build_date: "2026-08-18"
