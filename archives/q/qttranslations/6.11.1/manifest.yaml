knowledge_gained:
- qttranslations 6.11.1 使用 CMake 和 Qt BuildInternals 构建，不是 Autotools 项目
- qttranslations 依赖 qtbase 提供的 Qt6 Core、BuildInternals 和 qttools 提供的 Linguist 工具
- 默认 updateqm 目标使用 lrelease 将 291 个上游 TS 文件生成 304 个 QM 文件
- 构建时额外生成 13 个英语 QM 文件，因此 QM 数量多于上游 TS 数量
- 缺少其他 Qt 仓库源码时会跳过 lupdate 更新目标，但不影响已有 TS 到 QM 的全量转换
- qttranslations 是翻译资源包，不提供需要链接的 qttranslations 共享库或静态库
- 消费者应通过 QT_TRANSLATIONS_PATH 定位 translations 目录
- lconvert 可将安装版 qtbase_zh_CN.qm 成功解析为包含 1785 条消息的 TS 文件
