package: qttranslations/6.11.1
homepage: "https://www.qt.io/"

upstream_check_command: "cmake --build build --target updateqm"
upstream_test_in_build: true
upstream_test_command: "cmake --build build --target updateqm"

upstream_tests:
  - file: translations/CMakeLists.txt
    source: qttranslations-everywhere-src-6.11.1/translations/CMakeLists.txt
    description: "使用 Qt Linguist lrelease 将全部 TS 翻译源转换为 QM"
    command: "cmake --build build --target updateqm"

test_package_tests:
  - file: test.c
    description: "验证翻译资源路径、catalogs.json 及关键中文 QM 文件"
    command: "./test_qttranslations"
  - file: conanfile.py
    description: "使用 lconvert 解析 qtbase_zh_CN.qm 并验证消息数量"
    command: "lconvert -i qtbase_zh_CN.qm -o qtbase_zh_CN.ts"

assertion_count: 7
