software: qtimageformats
version: 6.11.1
category: graphics
status: built

build_system: cmake
compiler: clang 15.0.4
linker: GNU ld 2.45

dependencies:
  qtbase: 6.11.1

configure_options:
  - CMAKE_INSTALL_PREFIX=$HOME/usr/local
  - CMAKE_BUILD_TYPE=Release

features:
  tga_format: true
  wbmp_format: true
  tiff_format: true
  webp_format: true
  icns_format: true
  shared_libraries: true

build_notes:
  - Built as Qt GUI image format plugins (shared libraries)
  - Plugins: libqtga.so, libqwbmp.so, libqtiff.so, libqwebp.so, libqicns.so
  - No source modifications required for HarmonyOS
  - ELF signed for HarmonyOS execution

artifacts:
  - libqtga.so — TGA image format plugin
  - libqwbmp.so — WBMP image format plugin
  - libqtiff.so — TIFF image format plugin
  - libqwebp.so — WebP image format plugin
  - libqicns.so — ICNS image format plugin
  - CMake config files (Qt6QTgaPlugin, Qt6QWbmpPlugin, etc.)
  - FindLibmng.cmake, FindWrapJasper.cmake, FindWrapWebP.cmake
  - qtimageformats-6.11.1.spdx (SBOM)

source_url: https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtimageformats-everywhere-src-6.11.1.tar.xz