# build_date 对应本机本地完整编译日期（2026-10-05），与 reports 日志一致。
build_date: 2026-10-05

# 版本事实：官方 6.13.0 未发布（download.qt.io 无 6.13 目录），
# tarball 实为上游 6.12.0（.cmake.conf 中 QT_REPO_MODULE_VERSION=6.12.0）。
# 版本目录保持 6.13.0，源 URL 指向官方 6.12.0 子模块发布。
version_note: "tarball is upstream 6.12.0; Qt has not published an official 6.13.0"

source:
  url: "https://download.qt.io/official_releases/qt/6.12/6.12.0/submodules/qtimageformats-everywhere-src-6.12.0.tar.xz"
  sha256: "0943132b5db8de6b6a7f1d162682173e8763c7ed94e80fd39113292845f67762"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=ON"
    - "CMAKE_PREFIX_PATH=<qtbase 包前缀>"     # E495：同架构 OHOS aarch64 用 CMAKE_PREFIX_PATH，无需 QT_HOST_PATH
    - "Qt6_DIR=<qtbase 包前缀>/lib/cmake/Qt6" # E438：复用 qtbase 的完整 Qt6Config
    - "QT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "INPUT_jasper=system"
    - "INPUT_mng=system"
    - "INPUT_tiff=system"
    - "INPUT_webp=system"
  dependencies:
    - qtbase/6.11.1.3
    - libtiff/4.7.2.2
    - libwebp/1.6.0.1
    - libmng/2.0.3
    - jasper/4.2.9
    # 依赖图对齐 override（非直接链接）：libmng 声明 libjpeg-turbo/3.0.Z，
    # libtiff 固定 3.2.0 → 强制对齐制品仓已发布的 libjpeg-turbo/3.2.0（P0 修复）
    - libjpeg-turbo/3.2.0 (override)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Qt image formats 子模块：插件为运行时加载 .so，QT_PLUGIN_PATH 注入插件目录（E438/E495）"
  - "上游 6.13.0 未发布时以官方 6.12.0 tarball 适配，manifest/notes 如实记录"

