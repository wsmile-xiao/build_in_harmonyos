# test_package/MANIFEST.yml — qtimageformats 6.13.0
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）
# 测试清点详见 notes.md「上游测试清点（tests/auto，申报表）」：8 套件 / 45 个测试函数。

package: qtimageformats/6.13.0
homepage: "https://doc.qt.io/qt-6/qtimageformats-index.html"

# 上游测试命令：Qt 子模块自动测试由 CMake 注册，经 ctest -N 枚举
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（tests/auto 下的 8 个 tst_* 可执行）
upstream_tests:
  - file: tests/auto/tga/tst_qtga.cpp
    source: "qtimageformats-everywhere-src-6.12.0/tests/auto/tga/tst_qtga.cpp"
    description: "TGA 图像格式插件读写测试（2 个测试函数）"
    command: "./tst_qtga"
  - file: tests/auto/tiff/tst_qtiff.cpp
    source: "qtimageformats-everywhere-src-6.12.0/tests/auto/tiff/tst_qtiff.cpp"
    description: "TIFF 图像格式插件读写/压缩/字节序/BigTIFF 测试（23 个测试函数）"
    command: "./tst_qtiff"
  - file: tests/auto/webp/tst_qwebp.cpp
    source: "qtimageformats-everywhere-src-6.12.0/tests/auto/webp/tst_qwebp.cpp"
    description: "WebP 插件读/动画/写测试（4 个测试函数，含 BLACKLIST）"
    command: "./tst_qwebp"
  - file: tests/auto/mng/tst_qmng.cpp
    source: "qtimageformats-everywhere-src-6.12.0/tests/auto/mng/tst_qmng.cpp"
    description: "MNG 插件读/损坏读测试（3 个测试函数）"
    command: "./tst_qmng"
  - file: tests/auto/jp2/tst_qjp2.cpp
    source: "qtimageformats-everywhere-src-6.12.0/tests/auto/jp2/tst_qjp2.cpp"
    description: "JPEG2000 插件读测试（2 个测试函数）"
    command: "./tst_qjp2"
  - file: tests/auto/icns/tst_qicns.cpp
    source: "qtimageformats-everywhere-src-6.12.0/tests/auto/icns/tst_qicns.cpp"
    description: "ICNS 插件读/写/ossFuzz 测试（4 个测试函数）"
    command: "./tst_qicns"
  - file: tests/auto/heif/tst_qheif.cpp
    source: "qtimageformats-everywhere-src-6.12.0/tests/auto/heif/tst_qheif.cpp"
    description: "HEIF 插件读/属性/写/primaryIndex 测试（5 个测试函数，含 BLACKLIST；依赖 libheif，制品仓未发布本包不启用）"
    command: "./tst_qheif"
  - file: tests/auto/wbmp/tst_qwbmp.cpp
    source: "qtimageformats-everywhere-src-6.12.0/tests/auto/wbmp/tst_qwbmp.cpp"
    description: "WBMP 插件读测试（2 个测试函数）"
    command: "./tst_qwbmp"

# test_package 中自带的测试（消费者视角验证插件可加载 + 真实解码）
# 注意：与历史 6.11.1 归档一致，本构建启用 5 类插件（tga/wbmp/tiff/webp/icns），
# mng/jp2/heif 未启用（libmng/jasper 未发布匹配二进制、libheif 未发布），断言不包含它们。
test_package_tests:
  - file: test_qtimageformats.cpp
    description: "链接 Qt6::Gui，经 QImageReader 断言 5 类插件格式注册，并真实解码 TGA/WBMP 最小图像（非空壳 print，R34/PF3 合规）"
    command: "./test_qtimageformats"

# 测试断言总数（test_qtimageformats.cpp 内 5 处 check()；上游 45 个测试函数见 notes.md）
assertion_count: 5
