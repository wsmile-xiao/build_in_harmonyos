software: qt5-qtx11extras
display: "qt5-qtx11extras"
description: "Qt5 X11Extras 模块，提供 QX11Info 等 X11 集成 API（供 Qt5 x11 应用链接）"
category: graphics
homepage: "https://www.qt.io/"
license: LGPL-3.0
build_system: qmake

ohos_adaptation:
  key_points:
    - "Qt5 官方子模块，qmake 构建，依赖 qt5-qtbase/5.15.2"
    - "制品仓 qt5-qtbase/5.15.2 未启用 xcb 特性（QT_FEATURE_xcb=no），src.pro 的 qtConfig(xcb) 门控会静默跳过 x11extras 子目录，需补丁绕过"
    - "qtbase 无 xcb qmake 模块，x11extras.pro 的 QMAKE_USE_PRIVATE xcb/nolink 报 'Library xcb is not defined'，需补丁改为手动链接 libxcb"
    - "编译依赖 libxcb/1.16（ohpcd 制品仓已发布）；qx11info_x11.cpp 仅用 <xcb/xcb.h>，无需 libx11"
  common_dependencies:
    - qt5-qtbase/5.15.2
    - libxcb/1.16

versions:
  "5.15.2":
    status: built
    build_date: "2026-08-25"
    source_url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtx11extras-everywhere-src-5.15.2.tar.xz"
