# 版本级 manifest
# 文件位置: archives/q/qt5-qtx11extras/5.15.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "5.15.2"
software: qt5-qtx11extras

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"
build_system: qmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39: 仅官方源，镜像 fallback 由 CI 自动添加）
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtx11extras-everywhere-src-5.15.2.tar.xz"

  # 源码校验和
  sha256: "7014702ee9a644a5a93da70848ac47c18851d4f8ed622b29a72eed9282fc6e3e"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: qmake

  # 配置选项列表
  configure_options:
    - "qmake qtx11extras.pro -spec linux-clang"
    - "-after XCB_INC=<libxcb include> XCB_LIB=<libxcb lib>"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qt5-qtbase/5.15.2
    - libxcb/1.16

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-bypass-xcb-gate.patch"
  - "0002-manual-xcb-link.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "qt5-qtx11extras 的 src.pro 用 qtConfig(xcb) 门控 x11extras 子目录；制品仓 qt5-qtbase/5.15.2 未启用 xcb 特性（QT_FEATURE_xcb=no），直接构建会静默跳过子目录产出空包，需补丁绕过门控"
  - "qtbase 未启用 xcb 时 qmake 无 xcb 模块定义，x11extras.pro 的 QMAKE_USE_PRIVATE += xcb/nolink 报 'Library xcb is not defined'，需改为手动 INCLUDEPATH/LIBS 链接 libxcb"
  - "qtx11extras 编译仅依赖 libxcb 头文件（qx11info_x11.cpp 只用 <xcb/xcb.h>，无需 libx11）；libxcb/1.16 不拉 xtrans，避免与 libx11/6.4.0 的 xtrans/1.6.0 冲突"
