# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qtx11extras/5.15.2
homepage: https://www.qt.io/

# 上游测试命令
upstream_check_command: "make check"

# qtx11extras 的 qmake 构建不编译上游自动测试（tests/ 为 Qt 模块级测试，
# 需完整 Qt 构建树，CI 超时内不可行）。
upstream_test_in_build: false
upstream_test_command: ""

upstream_test_changes: []

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "Link Qt5::X11Extras, verify QX11Info version macro and isPlatformX11() static method are callable (returns false on offscreen/OHOS)"
    command: "./test_qt5_qtx11extras"

assertion_count: 3
