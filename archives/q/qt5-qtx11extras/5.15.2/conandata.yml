patches:
  - patch_file: "patches/0001-bypass-xcb-gate.patch"
    patch_description: "src.pro: build x11extras subdir unconditionally — qtbase 5.15.2 in ohpcd was built without the xcb feature (QT_FEATURE_xcb is no), so qtConfig(xcb) would skip the subdir entirely"
    patch_type: "platform"
  - patch_file: "patches/0002-manual-xcb-link.patch"
    patch_description: "x11extras.pro: link libxcb manually via XCB_INC/XCB_LIB instead of QMAKE_USE_PRIVATE xcb/nolink — qtbase lacks the xcb qmake module, QMAKE_USE fails with 'Library xcb is not defined'"
    patch_type: "platform"
