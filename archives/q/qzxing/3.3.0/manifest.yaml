# 版本级 manifest — qzxing 3.3.0
# 文件位置: archives/q/qzxing/3.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-version.yaml

version: "3.3.0"

software: "qzxing"

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-09-29"
build_system: "cmake"

source:
  url: "https://deb.debian.org/debian/pool/main/q/qzxing/qzxing_3.3.0+dfsg.orig.tar.xz"
  sha256: "77a1be8df6b00c14583e04a6409ccdb4c26303f2d0e5b4e4ab2bec9a00cdad72"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DQZXING_USE_ENCODER=ON（上游 QZXing.pro 默认功能集：全部解码器 + QR 编码器）"
    - "-DQZXING_MULTIMEDIA=OFF -DQZXING_USE_QML=OFF（上游 .pro 中同样注释掉的可选块，避免引入 QtMultimedia/QML 依赖）"
    - "-DQt5_DIR=<qt5-qtbase>/lib/cmake/Qt5（消费 qt5-qtbase 包内原生 Qt5 cmake 配置；CMakeDeps 只为组件生成 Qt5Core/Qt5Gui 等单模块 config，不会生成上游 find_package(Qt5) 所需的伞形 Qt5Config）"
    - "-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=<build>/lib（产物集中，便于打包）"
  dependencies:
    - "qt5-qtbase/5.15.2（Qt5Core/Qt5Gui/Qt5Concurrent + qmake/mkspecs；zlib 经 qtbase 传递）"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-ohos-shared-build.patch（cmake_minimum_required 3.3→3.10 修 CMake4 policy 报错 E187；QML find_package 守卫使核心构建不强制 Svg/Quick/QuickControls2；共享库 VERSION 3.3.0/SOVERSION 3 + PRIVATE QZXING_LIBRARY 使 QZXINGSHARED_EXPORT=Q_DECL_EXPORT；NO_ICONV 对齐上游 Android/.pri 路径规避 glibc/musl iconv 原型分叉；移除 PUBLIC DISABLE_LIBRARY_FEATURES 以保留共享库导出宏）"

knowledge_gained:
  - "QZXing 3.3.0 是 Qt5 原生库：CMakeLists 写死 find_package(Qt5 COMPONENTS ...)，无 Qt6 支持（README 声明 Qt6 需 core5compat 且编码功能降级）；OHOS 侧取 Qt5 路线，依赖仅 qt5-qtbase/5.15.2"
  - "qt5-qtbase 包内自带 lib/cmake/Qt5 原生配置，但 CMakeDeps 的组件 cmake_file_name（Qt5Core 等）只生成单模块 config，不生成伞形 Qt5Config.cmake——上游伞形 find_package(Qt5 ...) 的 CMake 工程必须通过 cache 变量 Qt5_DIR 指向 <pkg>/lib/cmake/Qt5 消费（qscintilla2 的 Qt6_DIR 同款范式）"
  - "上游测试入口 QZXingTests.pro 是 qmake 工程且 include(QZXing.pri) 把整个库源码编入测试二进制；本配方用生成式 CMake harness 编译同一批未修改的测试源（define 与 .pri 逐一对齐），规避 qmake mkspec 在 OHOS 设备上的不确定性"
  - "上游测试无统一退出码：main() 无 return（恒 0），断言失败抛 zxing::Exception 被 EncodeValidator 捕获打印 'Exception:'；解码器校验结果全部走 qDebug 的 'Decoder: [...], successful: [...], failed: [...], inconsistencies: [...]' 与 'Total: [...]' 行——验证必须解析 stdout 而非退出码"
  - "解码语料（qzxing-test-resources 子模块）不在发行 tarball 内：1192 PNG 中 1081 张属于 18 个可映射格式被实际执行，falsepositives(47)/partial(60)/unsupported(4) 因文件夹前缀不在 DecodeValidator 映射表被上游 harness 自身跳过；另有 7 个非图片文件（png.error/.bin/generate.py/generation.config）上游校验器同样尝试解码，属上游已知必败项——健康运行的 failed 计数上限为 7，判定口径=失败集合⊆该 7 文件"
  - "上游 EncoderStressTest 为 --encoder-stress opt-in 压力测试，默认流程不执行"
  - "backward.hpp（vendored 栈回溯头）在 Linux 默认 _Unwind_Backtrace（libgcc 自带），musl 无 execinfo 也不受影响，测试二进制无需额外链接"

test_package:
  assertion_count: 8
  pass_rate: "真机验证后回填"
