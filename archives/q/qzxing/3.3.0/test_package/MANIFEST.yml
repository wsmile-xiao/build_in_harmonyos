# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 上游测试入口为 tests/src/QZXingTests/QZXingTests.pro（qmake）
#   3. 把实际运行的测试记录到下方

package: qzxing/3.3.0
homepage: "https://github.com/ftylitak/qzxing"

# 上游测试命令 (QZXingTests.pro 编译并运行；--encoder-stress 为 opt-in 压力测试)
upstream_check_command: "qmake QZXingTests.pro && make && ./QZXingTests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "recipe build() compiles the unmodified upstream tests/src/QZXingTests sources (main/DecodeValidator/EncodeValidator/ValidationStats/TestCase/EncoderStressTest + 7 zxing encoder/common suites) via a generated CMake harness with the same feature defines as upstream QZXing.pri, then executes the binary from a cwd where ../../resources/resources resolves (build_folder/resources -> source_folder/tests/resources when the qzxing-test-resources submodule checkout was placed for the device run), and verifies: decode Total == 1088 attempts (1081 PNG fixtures + 7 known non-image files), failed <= 7 (only the known non-image files), inconsistencies == 0, 18 per-format Decoder: lines, and no encoder 'Exception:' marker (46/46 upstream unit methods pass; upstream assertions throw zxing::Exception which EncodeValidator catches and prints)."

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/src/QZXingTests
    source: qzxing-3.3.0/tests/src/QZXingTests
    description: "Upstream data-driven decode suite over the qzxing-test-resources submodule (48 mapped format folders: 1081 PNG fixtures across 18 decoder formats, plus 7 known non-image files the upstream validator also attempts; falsepositives/partial/unsupported folders are skipped by the upstream harness because their folder prefixes do not map to a decoder format), plus 46 unit-test methods across 7 zxing encoder/common suites (MatrixUtilTests 11, MaskUtilTests 5, QRCodeTests 3, EncoderTests 13, ReedSolomonEncoderTests 1, BitArrayTests 10, BitVectorTests 3). EncoderStressTest is opt-in via --encoder-stress and not run."
    command: "./QZXingTests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: qzxing_probe.cpp
    description: "Consumer CMake probe: decodes an independently generated QR fixture (python-qrcode offline matrix embedded as text rows, no binary fixture in the MR), encodes a payload to a QR image and decodes it back (round-trip), checks the default-argument encoder overload and decoder-format API state; 8 assertions, exits non-zero on any failure."
    command: "./qzxing_probe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
