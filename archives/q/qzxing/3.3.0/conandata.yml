# conandata.yml — qzxing 3.3.0
#
# Canonical upstream: https://github.com/ftylitak/qzxing (git tag 3.3.0)
# https://github.com/ftylitak/qzxing/archive/refs/tags/3.3.0.tar.gz
#
# Archive pinning note (implement-policy: official URL first, documented
# fallback): github.com/codeload.github.com are unreachable or rate-crippled
# from the porting networks (observed 2026-09-29 from the investigation
# network: the github.com tag tarball trickled at ~13 KB/s and timed out;
# ghproxy.net's codeload form returned a 14-byte error page). The pinned
# archive is therefore the Debian pool `orig` tarball: top-level directory
# qzxing-3.3.0, content identical to the upstream git tag 3.3.0 minus the
# Files-Excluded list recorded in the Debian .dsc qzxing_3.3.0+dfsg-1.dsc
# (ci/, examples/QZXingLive, examples/QZXingDragNDropTest/qtc_packaging,
# examples/QMLBarcodeScanner/*.sis, src/zxing/win32). None of the excluded
# paths is part of the library build: ci/ and the examples are not built by
# src/CMakeLists.txt, and zxing/win32 is added by upstream only under
# WIN32. The sha256 below matches the one published in the .dsc
# (Checksums-Sha256), verified by local download on 2026-09-29.

sources:
  url:
    - "https://deb.debian.org/debian/pool/main/q/qzxing/qzxing_3.3.0+dfsg.orig.tar.xz"
    - "https://mirrors.ustc.edu.cn/debian/pool/main/q/qzxing/qzxing_3.3.0+dfsg.orig.tar.xz"
  sha256: "77a1be8df6b00c14583e04a6409ccdb4c26303f2d0e5b4e4ab2bec9a00cdad72"

patches:
  - patch_file: "patches/0001-cmake-ohos-shared-build.patch"
    patch_description: "src/CMakeLists.txt: bump cmake_minimum_required 3.3->3.10 (CMake 4 policy error E187), consume Qt5 via find_package(qt5-qtbase) on the CMakeDeps root config (conan 2 CMakeDeps declares the Qt5::Core/Qt5::Gui/Qt5::Concurrent component targets there and generates no per-module Qt5Core-config.cmake files, and the native Qt5Config.cmake umbrella is not relocatable because Qt5CoreConfig bakes the build machine's mkspecs path), guard the QML-only modules (Qt5Svg/Qt5Quick/Qt5QuickControls2) with if(QZXING_USE_QML) and Qt5Multimedia with if(QZXING_MULTIMEDIA) so a core build does not require them, run moc explicitly on QZXing.h/ImageHandler.h because CMake's AUTOMOC cannot detect Qt5 without QT_VERSION_MAJOR (moc path comes from the QZXING_MOC_PATH cache variable the recipe sets to the qt5-qtbase bin/moc), build a shared library with VERSION 3.3.0/SOVERSION 3 plus a private QZXING_LIBRARY define (QZXINGSHARED_EXPORT becomes Q_DECL_EXPORT), define NO_ICONV (upstream Android/.pri path; avoids iconv prototype divergence between glibc and OHOS musl), and drop the public DISABLE_LIBRARY_FEATURES define that would strip QZXINGSHARED_EXPORT from the shared-library ABI"
    patch_type: "portability"
  - patch_file: "patches/0002-fix-test-encode-fixture.patch"
    patch_description: "tests/src/QZXingTests/zxing/qrcode/encoder/EncoderTests.cpp testEncode(): fix upstream-broken expected literal. QRCode::toString() appends \"\\n>>\" after ByteMatrix::toString() whose rows are each '\\n'-terminated (last row included), so the actual output ends \"...1 1 1\\n\\n>>\"; the literal ends \"...1 1 1\\n>>\\n\" and can never match (verified byte-for-byte on the OHOS device run: 26 dump lines identical, tail differs). Upstream CI never runs the test suite (appveyor.yml test_script is empty) so the defect went unnoticed upstream; the same broken literal is still on upstream master (fetched 2026-09-30). The fix adjusts only the framing characters of the fixture; the 21x21 matrix rows that the test exists to pin are unchanged and were verified identical to the device output before the fix"
    patch_type: "test"
