# 软件级 manifest — qzxing
# 文件位置: archives/q/qzxing/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-software.yaml

software: qzxing

display: "QZXing"

description: "C++/Qt 移植的 ZXing 条码/二维码扫描库（解码 + QR 编码）"

category: library

homepage: "https://github.com/ftylitak/qzxing"

license: "Apache-2.0"

build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建走 Qt5 路线（上游 3.3.0 CMakeLists 为 Qt5-only），Qt5 经 find_package(qt5-qtbase) 消费 CMakeDeps 根 config 的 Qt5::* 组件 target（原生 Qt5Config 不可重定位）"
    - "共享库 + QZXING_LIBRARY 私有导出宏 + 移除 PUBLIC DISABLE_LIBRARY_FEATURES + 显式 moc（AUTOMOC 检测不到 Qt5）"
    - "QZXING_USE_DECODER_* 5 个选项全 ON：MultiFormatReader 解码器注册被 ENABLE_DECODER_* 宏门控且上游 CMake 默认全关（打包库会零解码器），对齐 .pro 无条件全开"
    - "NO_ICONV 与上游 Android/.pri 路径对齐，规避 musl iconv 原型分叉"
    - "上游测试经生成式 CMake harness 编译测试源（0002 修正上游 testEncode 坏夹具），真机解析 stdout 验证"
