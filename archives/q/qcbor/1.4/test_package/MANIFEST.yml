package: qcbor/1.4
homepage: "https://github.com/laurencelundblade/QCBOR"

upstream_tests_exist: true
upstream_test_audit:
  - source: "test/run_tests.c"
    reason: "Test aggregator registers 77 entries: s_tests2[] 8 + s_tests[] 69; 2 entries are TEST_ENTRY_DISABLED (BigComprehensiveInputTest, TooLargeInputTest - upstream default-disabled large-input stress cases, skipped at runtime)."
  - source: "test/CMakeLists.txt"
    reason: "BUILD_QCBOR_TEST=LIB builds the qcbor_test static library; =APP additionally links cmd_line_main.c/example.c/ub-example.c into the qcbortest aggregator binary. No add_test() is registered anywhere, so cmake.test() would execute 0 cases."
  - conclusion: "Upstream suite runs in build() by executing the qcbortest aggregator directly (signed per E077, OHOS exec-gate retry); consumer tests in test_package are additional and never substitute for upstream coverage. 1/77 entries (upstream post-release bug) is backported from upstream PR #313 and passes after the fix."

upstream_check_command: "./qcbortest"
upstream_test_in_build: true
upstream_test_command: "./qcbortest (executed from the CMake build tree inside build())"
upstream_tests:
  - "run_tests.c aggregator: 77 registered test entries (75 enabled by default, 2 TEST_ENTRY_DISABLED skipped by upstream default); device run: 75 tests run, 0 failed"

test_package_tests:
  - file: consumer.c
    description: "Consumer program links qcbor::qcbor, encodes a CBOR map {greeting: \"hello qcbor\", answer: 42}, decodes it back with the spiffy decode API, and asserts string and int64 round-trip equality (nonzero exit on any mismatch)."
    command: "./consumer"

test_scenario_count: 1
assertion_count: 4
assertion_count_basis:
  encode_finish: 1
  string_roundtrip: 2
  int64_roundtrip: 1
