package: qtcore5compat/6.11.1
homepage: "https://doc.qt.io/qt-6/qtcore5compat-index.html"
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure -j1"

upstream_tests:
  - file: tests/auto/core5/codecs/qtextcodec/tst_qtextcodec.cpp
    description: "QTextCodec codec registry and encoding round-trips"
    command: "ctest -R '^tst_qtextcodec$' --output-on-failure"
  - file: tests/auto/core5/codecs/utf8/tst_utf8.cpp
    description: "UTF-8 codec conversion tests"
    command: "ctest -R '^tst_utf8$' --output-on-failure"
  - file: tests/auto/core5/io/qdebug/tst_qdebug.cpp
    description: "Qt5 QDebug compatibility formatting"
    command: "ctest -R '^tst_qdebug$' --output-on-failure"
  - file: tests/auto/core5/sax/qxml/tst_qxml.cpp
    description: "SAX QXml parser tests"
    command: "ctest -R '^tst_qxml$' --output-on-failure"
  - file: tests/auto/core5/sax/qxmlinputsource/tst_qxmlinputsource.cpp
    description: "QXmlInputSource tests"
    command: "ctest -R '^tst_qxmlinputsource$' --output-on-failure"
  - file: tests/auto/core5/sax/qxmlsimplereader/tst_qxmlsimplereader.cpp
    description: "QXmlSimpleReader tests"
    command: "ctest -R '^tst_qxmlsimplereader$' --output-on-failure"
  - file: tests/auto/core5/serialization/json/tst_qtjson.cpp
    description: "Qt5 QJson document and value compatibility"
    command: "ctest -R '^tst_qtjson$' --output-on-failure"
  - file: tests/auto/core5/serialization/qtextstream/tst_qtextstream.cpp
    description: "QTextStream serialization tests"
    command: "ctest -R '^tst_qtextstream$' --output-on-failure"
  - file: tests/auto/core5/text/qregexp/tst_qregexp.cpp
    description: "Qt5 QRegExp regexp engine tests"
    command: "ctest -R '^tst_qregexp$' --output-on-failure"
  - file: tests/auto/core5/text/qstringbuilder/qstringbuilder1/tst_qstringbuilder1.cpp
    description: "QStringBuilder operator+ compatibility"
    command: "ctest -R '^tst_qstringbuilder1$' --output-on-failure"
  - file: tests/auto/core5/text/qstringref/tst_qstringref.cpp
    description: "QStringRef view tests"
    command: "ctest -R '^tst_qstringref$' --output-on-failure"
  - file: tests/auto/core5/tools/qlinkedlist/tst_qlinkedlist.cpp
    description: "QLinkedList container tests"
    command: "ctest -R '^tst_qlinkedlist$' --output-on-failure"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer test exercising QRegExp, QLinkedList, QStringRef and QTextCodec APIs from the installed Qt6Core5Compat package"
    command: "./test_package"

assertion_count: 15
