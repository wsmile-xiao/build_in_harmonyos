# manifest.yaml — qtcore5compat 6.11.1

version: "6.11.1"
software: qtcore5compat
status: published
build_date: "2026-08-12"
build_system: cmake

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/qt/official_releases/qt/6.11/6.11.1/submodules/qt5compat-everywhere-src-6.11.1.tar.xz"
  sha256: "cfcb9fdaa051aad54b0e61b24ac5693b4887a86e07609f665fea67328a6f161b"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "QT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "QT_BUILD_TESTS=ON"
    - "QT_BUILD_TESTS_BY_DEFAULT=ON"
    - "QT_BUILD_EXAMPLES=OFF"
    - "QT_BUILD_BENCHMARKS=OFF"
  dependencies:
    - qtbase/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "qtcore5compat 的 Qt 6.11.1 源码包在 Qt 官方镜像中命名为 qt5compat-everywhere-src-6.11.1.tar.xz（仓库名 qt5compat，CMake 项目名 Qt5Compat，产物 libQt6Core5Compat.so）"
  - "Qt 6.11 子模块复用 qtbase 已发布的 Qt6Config.cmake 与 harmonyos-clang mkspec：CMakeToolchain 设 Qt6_DIR=qtbase 包 lib/cmake/Qt6 + QT_QMAKE_TARGET_MKSPEC=harmonyos-clang 即可交叉编译，无需重复打 mkspec 补丁"
  - "qtcore5compat 仅 REQUIRED Qt6 Core 组件，Network/Xml/Gui/Widgets/Quick 为 OPTIONAL，纯 Core 依赖即可构建 Core5Compat 库"
