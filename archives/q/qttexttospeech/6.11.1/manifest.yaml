# manifest.yaml — qttexttospeech 6.11.1

version: "6.11.1"
software: qttexttospeech
status: published
build_date: "2026-08-12"
build_system: cmake

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/qt/official_releases/qt/6.11/6.11.1/submodules/qtspeech-everywhere-src-6.11.1.tar.xz"
  sha256: "c035c318012025875a653245701a23d3807e8e46b8bf7987877842219c273f14"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "QT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "QT_BUILD_TESTS=ON"
    - "QT_BUILD_TESTS_BY_DEFAULT=ON"
    - "QT_BUILD_EXAMPLES=OFF"
    - "QT_BUILD_BENCHMARKS=OFF"
    - "QT_GENERATE_SBOM=OFF"
  dependencies:
    - qtbase/6.11.1
    - qtmultimedia/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "qtspeech 的 Qt 6.11.1 源码包在 Qt 官方镜像中命名为 qtspeech-everywhere-src-6.11.1.tar.xz（仓库名 qtspeech，模块名 TextToSpeech，产物 libQt6TextToSpeech.so）"
  - "qttexttospeech 复用 qtbase 已发布的 Qt6Config.cmake 与 harmonyos-clang mkspec：CMakeToolchain 设 Qt6_DIR + QT_QMAKE_TARGET_MKSPEC 即可交叉编译，无需重复打 mkspec 补丁"
  - "qttexttospeech 仅 REQUIRED Qt6 Core 组件，Gui/Multimedia/Widgets/Test/QuickTest 均为 OPTIONAL，纯 Core 依赖即可构建 TextToSpeech 库（Media 后端自动跳过）"
