# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qwinff/0.2.1-git20201215
homepage: "https://github.com/QWinFF/QWinFF"

# 上游测试命令 (src/tests/run-tests.sh 逐目录 qmake+make+运行, QtTest 框架)
upstream_check_command: "sh src/tests/run-tests.sh"

# conanfile.py build() 方法中是否已集成上游测试
# (上游测试在 test_package 中重建并运行, 见 test_package/CMakeLists.txt)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_package/testversioncompare/testversioncompare.cpp
    source: qwinff-0.2.1-git20201215/src/tests/testversioncompare/testversioncompare.cpp
    description: "版本号比较/区间解析单元测试 (testVersionEquality/testVersionInequality/testVersionSingleRange)"
    command: "./testversioncompare"
  - file: test_package/testupdateinfoparser/testupdateinfoparser.cpp
    source: qwinff-0.2.1-git20201215/src/tests/testupdateinfoparser/testupdateinfoparser.cpp
    description: "更新信息 XML 解析单元测试 (testParseXml)"
    command: "./testupdateinfoparser"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/testversioncompare/testversioncompare.cpp
    description: "上游 QtTest 单元测试重建 (headless, QT_QPA_PLATFORM=offscreen)"
    command: "./testversioncompare"
  - file: test_package/testupdateinfoparser/testupdateinfoparser.cpp
    description: "上游 QtTest 单元测试重建 (headless, QT_QPA_PLATFORM=offscreen)"
    command: "./testupdateinfoparser"
  - file: test_package/conanfile.py
    description: "R34: 校验包内 bin/qwinff 可执行文件存在"
    command: "test() 中的 os.path.isfile(bin/qwinff) 断言"

# 测试断言总数 (上游 QtTest QCOMPARE/QVERIFY 实际计数)
assertion_count: 17
