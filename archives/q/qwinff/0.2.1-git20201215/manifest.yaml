- "codeload 无扩展名 URL 需在 source() 显式传 filename，否则 get() 误判 zip"
- "qt5-qtbase 无独立 Qt5NetworkConfig 可用时 find_package(Qt5Network) 失败，改用 find_package(Qt5 COMPONENTS Network)"
- "test_package 消费传递依赖 qt5 时 CMakeDeps 聚合配置 include 为空，应直接用包内真实 Qt5Config（Qt5_DIR）"
- "self.run(env=list) 会整体替换环境，QT_QPA_PLATFORM 需内联传"
