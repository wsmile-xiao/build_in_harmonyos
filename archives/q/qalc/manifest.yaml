# 软件级 manifest — qalc
software: qalc
display: "qalc"
description: "Qalculate! 命令行计算器（任意精度/符号计算/单位换算）"
category: math
homepage: "https://qalculate.github.io/"
license: "GPL-2.0-or-later"

build_system: autotools

ohos_adaptation:
  key_points:
    - "qalc CLI 与 libqalculate 同源（上游唯一 release tarball 为 libqalculate-5.11.0.tar.gz，Debian/Ubuntu 的 qalculate 二进制包同样取自该源码包）；本包以 qalc 为名独立交付 bin/qalc + libqalculate.so + share/qalculate 运行时定义数据"
    - "config.guess 增加 aarch64:HarmonyOS → aarch64-unknown-linux-gnu 三元组映射（补丁 0001）"
    - "configure 去掉 umask 077 临时目录守卫（HMDFS 限制，补丁 0002）"
    - "util.cc 的 pthread_cancel 家族用 feature-detection 生成的 HAVE_PTHREAD_* 宏守卫（OHOS musl 缺该 API，补丁 0003，无平台宏，R8/PF5 干净）"
    - "5.11.0 上游已移除 intltool：data/*.xml 改由 msgfmt --xml 生成；msgfmt 在 macOS host 用 Homebrew PATH、CI worker 用 cmd-pkgs gettext 兜底"
    - "不用 AutotoolsDeps/VirtualRunEnv（configure conftest 污染 + lld 被 conan libxml2 劫持），依赖 -I/-L 手动注入；LD_LIBRARY_PATH 在 build() 内显式注入且 SDK llvm/lib 必须排在 conan 依赖之前"
    - "依赖 .la 的 libdir='//lib' 需跨包全局映射修复（mpfr.la→libgmp.la 要解析到 gmp 包真实目录）"
    - "上游测试套件：qalc --test-file 执行 tests/ 17 个 batch 文件 688 个用例；test_package 逐字节拷贝上游测试文件在鸿蒙 worker 全量复跑，另加鸿蒙特有 7 项（A1-A4 ABI + H1-H3 设备端）"
  common_dependencies:
    - gmp
    - mpfr
    - libxml2
    - readline

versions:
  "5.11.0":
    status: built
    build_date: "2026-09-27"
    conan_ref: "qalc/5.11.0"
