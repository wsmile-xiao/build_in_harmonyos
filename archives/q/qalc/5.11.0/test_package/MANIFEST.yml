# ── test_package 执行入口 ─────────────────────────────────────────
test_package_tests:
  - file: conanfile.py
    description: >-
      Layer 1（任意 host）：ohos_abi_check.py 纯 Python 解析 ELF，检查打包
      产物 ABI（A1-A4）；Layer 2（仅 can_run，真实鸿蒙 worker）：test.sh
      以包内 qalc 全量执行上游 688 用例并跑 H1-H3 平台行为检查。交叉构建
      的 macOS host 无法执行 aarch64-linux-ohos ELF，Layer 2 在 CI worker
      实跑（本地跳过不冒充通过）。
    command: "conan create ... && conan test test_package qalc/5.11.0"
    assertion_count: 695

# ── 鸿蒙特有测试（rule12: N >= 1，本包 N = 7）────────────────────
harmonyos_specific_tests:
  - file: ohos_abi_check.py
    description: >-
      A1: qalc 为 ELF64 小端且 e_machine == EM_AARCH64(183)，即 HarmonyOS
      PC arm64 交叉目标生效。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/qalc --lib <pkg>/lib/libqalculate.so*"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      A2: qalc 的 PT_INTERP == /lib/ld-musl-aarch64.so.1，即鸿蒙 musl 动态
      加载器；glibc 产物会是 /lib/ld-linux-aarch64.so.1。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/qalc --lib <pkg>/lib/libqalculate.so*"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      A3: qalc 的 DT_NEEDED 含 libqalculate.so（CLI 与同源库一起打包、自洽）
      且不含 libcurl/libicu（两个未发布的可选依赖确经 --without 关闭）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/qalc --lib <pkg>/lib/libqalculate.so*"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      A4: libqalculate.so 无 pthread_cancel/pthread_setcancelstate/
      pthread_setcanceltype 未定义引用，证明 OHOS musl 缺失该 API 时的
      HAVE_PTHREAD_* 宏守卫补丁确已编入（未打补丁的构建会引用全部三个
      符号导致链接失败/运行崩溃）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/qalc --lib <pkg>/lib/libqalculate.so*"
    assertion_count: 1
  - file: test.sh
    description: >-
      H1: 设备端加载包内 share/qalculate 定义并完成单位换算
      （"5 m to cm" → 500 cm），验证数据文件安装路径与 musl 环境 IO。
    command: "sh test.sh <bindir> <datadir>"
    assertion_count: 1
  - file: test.sh
    description: >-
      H2: 设备端非交互表达式计算的退出码与输出（"1 + 2 * 6" = 13），
      qalc 主路径在鸿蒙上完整可用。
    command: "sh test.sh <bindir> <datadir>"
    assertion_count: 1
  - file: test.sh
    description: >-
      H3: musl libm 三角函数行为（"sin(pi/2)" = 1），覆盖鸿蒙 musl 与
      glibc 在浮点路径上的平台差异。
    command: "sh test.sh <bindir> <datadir>"
    assertion_count: 1

# 测试断言总数（上游 688 + 鸿蒙特有 7）
assertion_count: 695
test_package_test_count: 688
harmonyos_specific_test_count: 7
count_method: "independent_check_items"
