# test_package/MANIFEST.yml — qalc 5.11.0
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。
# 详见 docs/TEST_QUALITY_SPEC.md
#
# 计数口径（唯一口径，贯穿 MANIFEST / notes.md / 测试日志 / PR 两张表）：
#   按「独立检查项数量」计数。上游测试用 qalc 原生执行器（--test-file，
#   即上游 tests/ 目录的 batch 套件）逐 input→expected 断言，共 17 个
#   batch 文件、688 个用例；鸿蒙特有 7 项 = A1-A4（产物/ABI，host 可执行）
#   + H1-H3（设备端平台行为）。适配后合计 688 + 7 = 695 项。
#   test.sh 的 17 个「文件级」运行是上游套件的执行载体（qalc --test-file
#   在文件内首错即停，文件通过 = 该文件全部用例通过），不单独计数，避免
#   与 688 的用例口径双计。

package: qalc/5.11.0
homepage: "https://qalculate.github.io/"

# ── 上游测试套件存在性（经审计官方 release tarball 确认）────────────
upstream_tests_exist: true
upstream_test_total: 688
upstream_test_count_method: "qalc --test-file batch pairs (framework native)"

upstream_test_audit:
  source_tarball: "libqalculate-5.11.0.tar.gz (https://github.com/Qalculate/libqalculate/releases/download/v5.11.0/libqalculate-5.11.0.tar.gz)"
  source_sha256: "6217a634eeb9659ebb4080c265dfab47d8f8dd4c33394b48fd5a1f83ef4538c4"
  build_system: "autotools（src/Makefile.am 声明 TESTS = unittest；unittest.cc 逐文件调用 qalc --test-file 执行 tests/*.batch）"
  test_files: "17 个 .batch 文件 + 2 个 csv 数据文件（stats.batch 引用 tests/vectordata.csv / vectordata2.csv），逐 input→expected 断言共 688 个用例"
  scan_result: "tests/ 目录：arithmetic 类 17 个 batch（bitwise 24, calculus 11, dates 11, explog 10, geometry 30, limits 198, matrixvector 131, numberbase 15, operators 30, parser 27, percentages 29, polynomial 49, solver 36, stats 39, strings 24, units 13, variables 11）合计 688；src/unittest.cc 为上游官方执行器（qalc --test-file）；tests/Makefile.am 仅分发数据，make check 经 src/Makefile.am TESTS=unittest 驱动"
  reason: "上游具备正式测试套件（qalc --test-file batch 断言）；适配后在 test_package 中以同一执行器在真实鸿蒙环境全量复跑 688 用例"

# 上游测试命令（经 test_package 复刻，包内 qalc 为被测二进制）
upstream_check_command: "qalc --test-file tests/<file>.batch (17 files, 688 cases)"

# conanfile.py build() 未集成上游测试（交叉编译产物无法在本机执行，
# 上游套件由 test_package 在鸿蒙 CI worker 实跑）
upstream_test_in_build: false
upstream_test_command: "qalc --test-file tests/<file>.batch"

upstream_tests:
  - file: tests/*.batch
    description: >-
      上游官方 batch 套件：17 个文件、688 个 input→expected 断言用例，
      由 qalc 自带的 --test-file 执行器运行（unittest.cc 与 make check 同
      入口）。test_package 中的 tests/ 目录为 release tarball 内
      tests/*.batch 与 *.csv 的逐字节拷贝，未做任何修改。
    command: "qalc --test-file tests/<file>.batch"
    assertion_count: 688

