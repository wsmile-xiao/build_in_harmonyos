# conandata.yml — qalc 5.11.0
# 上游源码即 libqalculate 5.11.0 release tarball（qalc CLI 与 libqalculate 库
# 同源构建；Debian/Ubuntu 的 qalculate 二进制包同样取自 libqalculate 源码包）。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/Qalculate/libqalculate/releases/download/v5.11.0/libqalculate-5.11.0.tar.gz"
    - "https://github.com/Qalculate/libqalculate/releases/download/v5.11.0/libqalculate-5.11.0.tar.gz"
  sha256: "6217a634eeb9659ebb4080c265dfab47d8f8dd4c33394b48fd5a1f83ef4538c4"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Add HarmonyOS platform detection to config.guess (aarch64:HarmonyOS -> aarch64-unknown-linux-gnu, LIBC=gnu)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "Remove umask 077 guards from configure temp directory creation (HMDFS compatibility)"
    patch_type: "portability"
  - patch_file: "patches/0003-libqalculate-util.cc.patch"
    patch_description: "Guard pthread_cancel/pthread_setcancelstate/pthread_setcanceltype with feature-detected HAVE_PTHREAD_* macros (OHOS musl lacks them)"
    patch_type: "portability"
