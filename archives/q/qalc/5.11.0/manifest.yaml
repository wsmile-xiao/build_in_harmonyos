knowledge_gained:
  - "qalc CLI 与 libqalculate 同源：上游唯一 release tarball 即 libqalculate-5.11.0.tar.gz，Debian/Ubuntu 的 qalculate 二进制包同样取自该源码包；本包按积分赛任务名 qalc 独立打包（package_type=application，bin/qalc + libqalculate.so + share/qalculate 同包交付）"  # knowledge_ref: 无需独立条目（发行版打包先例）
  - "5.8.2→5.11.0 上游移除 intltool：data/*.xml.in 改由 GNU gettext msgfmt --xml 生成，IT_PROG_INTLTOOL/XML::Parser/intltool-merge shim 全部不再需要；msgfmt 在 macOS host 走 Homebrew PATH、CI worker 走 cmd-pkgs gettext 兜底"  # knowledge_ref: 无需独立条目（上游版本差异）
  - "不用 AutotoolsDeps/VirtualRunEnv（cddlib/libqalculate 5.8.2-r0 同坑）：AutotoolsDeps 把 conan 依赖 -l 塞进 LIBS 污染 configure 早期 conftest；VirtualRunEnv 的 LD_LIBRARY_PATH 顺序会让 lld 命中 conan libxml2.so.16 而非 SDK 自带版本（SONAME 相同符号集不同）→ Error relocating lld。依赖 include/lib 用 AutotoolsToolchain 环境手动注入"  # knowledge_ref: archives/l/libqalculate/5.8.2-r0
  - "依赖 .la 的 libdir='//lib'（conan prefix=/ 拼接错误）必须跨包全局映射修复：mpfr.la 的 dependency_libs 引用 libgmp.la 要解析到 gmp 包真实 lib 目录，不能一律替换成当前包自己的 lib 目录"  # knowledge_ref: E236, archives/l/libqalculate/5.8.2-r0
  - "OHOS musl 无 pthread_cancel/pthread_setcancelstate/pthread_setcanceltype：util.cc 用 feature-detection 生成的 pthread_compat.h + HAVE_PTHREAD_* 宏守卫；探测编译必须加 -Werror=implicit-function-declaration，否则 C 的隐式声明仅告警会误判可用"  # knowledge_ref: E013 族, archives/l/libqalculate/5.8.2-r0
  - "configure 的 umask 077 && mktemp/mkdir 在 HMDFS 上失败，去掉 umask 守卫即可（同 5.8.2-r0）"  # knowledge_ref: archives/l/libqalculate/5.8.2-r0
  - "libqalculate 5.8.2→5.11.0 的 Calculator::calculate API 回退为 int calculate(str, MathStructure*)（5.8.2 曾为按值返回 MathStructure）；本包为 CLI 应用包，测试以运行 qalc 为主，不受影响"  # knowledge_ref: archives/l/libqalculate/5.8.2-r0 notes #6
  - "上游测试执行器是 qalc --test-file：tests/ 17 个 batch 文件共 688 个 input→expected 用例（stats.batch 依赖 tests/*.csv 相对路径，需以 tests/ 所在目录为 cwd）；test_package 逐字节拷贝上游测试文件在鸿蒙 worker 全量复跑"  # knowledge_ref: 无需独立条目（上游测试入口）

  - "libtool 2.6 + OHOS clang/lld（with_gnu_ld=no）链接库时缺 -Wl,-soname → libqalculate.so 无 DT_SONAME，qalc 的 DT_NEEDED 被记成 ../libqalculate/.libs/libqalculate.so 相对路径（不可重定位）。修法：make 命令行按 -version-info 计算 major=current-age 后覆盖 libqalculate_la_LDFLAGS 追加 -Wl,-soname,libqalculate.so.23；变量值含冒号必须整体加引号"  # knowledge_ref: E537, archives/c/console-bridge/1.0.2（无 SONAME 传染下游 DT_NEEDED 同族）
  - "conan-verify 双 profile（-pr:h=-pr:b=ohos-local）会让 conan 判定非交叉、AutotoolsToolchain 不生成 --host，configure 试图在本机运行 OHOS conftest → cannot run C compiled programs。修法：configure_args 显式 --build=aarch64-unknown-linux-gnu + --host=aarch64-unknown-linux-ohos（上游 5.11.0 config.sub 原生认 linux-ohos*）"  # knowledge_ref: archives/w/wdiff/1.2.3, archives/z/zeitgeist/1.0.4
