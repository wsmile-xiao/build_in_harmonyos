# test_package/MANIFEST.yml — quickcpplib 0.1.0.0-gh0.20231208
# 上游官方测试声明文件

package: quickcpplib/0.1.0.0-gh0.20231208
homepage: "https://github.com/ned14/quickcpplib"

# 上游测试清点：test/ 下 20 个独立 .cpp（单测 shim 自带 main 的
# BOOST_AUTO_TEST_CASE 形态），在本配方 build() 中以
# tools.build:compiler_executables:cpp 逐个编译并运行；
# 平台受限项按 EXPECTED_PLATFORM_LIMITS 计 test_skipped（见 notes.md 账本）。
upstream_check_command: "ls test/*.cpp | wc -l"
upstream_test_in_build: true
upstream_test_command: "for t in test/*.cpp; do clang++ -std=c++17 -I include $t -o /t && /t; done（配方 build() 实现，见 conanfile.py）"

upstream_tests:
  - file: test/bit_interleave.cpp
    source: quickcpplib-72277c70f925829935a2af846731ab36063ec16f/test/bit_interleave.cpp
    description: "位交织工具测试"
    command: "build()/quickcpplib（配方内逐个编译运行）"
  - file: test/casts.cpp
    source: quickcpplib-72277c70f925829935a2af846731ab36063ec16f/test/casts.cpp
    description: "安全 casts 测试"
    command: "build()/quickcpplib（配方内逐个编译运行）"
  - file: test/uint128.cpp
    source: quickcpplib-72277c70f925829935a2af846731ab36063ec16f/test/uint128.cpp
    description: "uint128 测试"
    command: "build()/quickcpplib（配方内逐个编译运行）"
  # 完整 20 项清单与逐项结果见 notes.md 测试账本与 reports/ 构建日志

test_package_tests:
  - file: test_shim.cpp
    description: "消费者测试：以 boost 兼容单测 shim 编写断言（BOOST_CHECK_EQUAL/BOOST_CHECK/BOOST_CHECK_MESSAGE 共 3 项），经 CMakeDeps+find_package 链接打包头，断言结果决定退出码"
    command: "./test_shim"

assertion_count: 3
