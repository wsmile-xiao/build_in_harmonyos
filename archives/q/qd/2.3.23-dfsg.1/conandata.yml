sources:
  url: "https://deb.debian.org/debian/pool/main/q/qd/qd_2.3.23+dfsg.1.orig.tar.xz"
  sha256: "973a6b5cfdb629d6815daedc5087779a33e53af3c347fcd3b3d225759e285c06"

patches:
  - patch_file: "patches/0001-configure-umask-022.patch"
    patch_description: "Create the autoconf temp directory with umask 022 (umask 077 dirs are unwritable on the setgid HMDFS filesystem)"
    patch_type: "portability"
  - patch_file: "patches/0002-Makefile-in-skip-pdf-doc.patch"
    patch_description: "Do not build/install docs/qd.pdf (BUILT_SOURCES pulls it before 'all', but the out-of-tree build has no docs/ dir and neither the device nor CI has LaTeX)"
    patch_type: "portability"
