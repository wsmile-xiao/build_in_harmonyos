version: "2.3.23-dfsg.1"
software: "qd"
status: built
build_date: "2026-09-21"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/q/qd/qd_2.3.23+dfsg.1.orig.tar.xz"
  sha256: "973a6b5cfdb629d6815daedc5087779a33e53af3c347fcd3b3d225759e285c06"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-fortran"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-umask-022.patch"
  - "0002-Makefile-in-skip-pdf-doc.patch"

knowledge_gained:
  - "autotools BUILT_SOURCES pointing at a generated docs/*.pdf fails make all under out-of-tree/LaTeX-less builds; patch Makefile.in to empty BUILT_SOURCES and drop the PDF from dist_doc_DATA # knowledge_ref: E636"
  - "dfsg-suffixed version with a dead upstream site is sourced from the Debian/Ubuntu pool .orig.tar.xz; keep the branch-form version string, strip_root absorbs the +dfsg top-level dir # knowledge_ref: E637"

upstream_tests:
  command: "make check"
  test_count: 30
  notes: "make check runs tests/qd_test (8 dd_real + 8 qd_real cases), tests/pslq_test (5 dd_real + 6 qd_real cases) and tests/c_test (Salamin-Brent pi case, informational, upstream always exits 0) = 28 cases; running ./pslq_test -all adds the 2 double-precision PSLQ variants for a complete inventory of 30, all executed on the device. quadt_test/huge/qd_timer are EXTRA_PROGRAMS that upstream never registers in TESTS."

test_package:
  assertion_count: 7
  description: "Links libqd and asserts dd_real/qd_real arithmetic roundtrips, the exact eps fingerprints (2^-104 / 2^-209), pi digits, the C interface c_qd_pi components, and qd-config --version."
