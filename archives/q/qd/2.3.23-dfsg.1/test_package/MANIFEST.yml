package: qd/2.3.23-dfsg.1
homepage: "https://www.davidhbailey.com/dhbpapers/qd.html"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: qd_test
    command: "tests/qd_test"
    expected: "8 dd_real cases plus 8 qd_real cases print 'Test passed.' and the program exits 0"
  - name: pslq_test
    command: "tests/pslq_test"
    expected: "5 dd_real plus 6 qd_real PSLQ cases print 'test passed.' and the program exits 0"
  - name: c_test
    command: "tests/c_test"
    expected: "Salamin-Brent pi case prints its converged iterations (informational, upstream always exits 0)"

test_package_tests:
  - file: test_qd.cpp
    description: "Links libqd: dd_real/qd_real (1/3)*3 roundtrip precision, exact dd_real/qd_real eps fingerprints (2^-104 and 2^-209), pi digits, and c_qd_pi components; conanfile.test() additionally asserts qd-config --version == 2.3.23"
    command: "./qd_test_package"

assertion_count: 7
