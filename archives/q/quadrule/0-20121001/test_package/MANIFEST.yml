# quadrule 0-20121001 upstream and consumer test inventory (R51)
package: quadrule/0-20121001
homepage: "https://people.math.sc.edu/Burkardt/c_src/quadrule/quadrule.html"

# Exact snapshot inventory: no tests/ directory, no test sources, and the
# generated Automake files register no TESTS/check_PROGRAMS. The official
# target is still invoked in build() and reports that nothing is registered.
upstream_check_command: "make check -j1"
upstream_test_in_build: true
upstream_test_command: "make check -j1"
upstream_tests: []

test_package_tests:
  - file: test_quadrule.c
    description: "Eight consumer scenarios exercise installed quadrature APIs and HarmonyOS AArch64 ABI"
    command: "ctest --output-on-failure"

assertion_count: 8
