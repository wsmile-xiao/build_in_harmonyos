software: qfits
display: "qfits"
description: "ESO FITS 文件读写库（libqfits）与命令行工具（dfits/qextract/replacekey 等 11 个）"
category: tool
homepage: "https://www.eso.org/sci/software/eclipse/qfits/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "2007 年的老 autotools 工程；随包 `admin/config.sub`（2004）不认 aarch64，且 CI 构建机只有 autoconf 没有 automake/aclocal → `tool_requires(\"automake/1.18\")`+`libtool/2.5.4` 注入 PATH，`autoreconf -fi -I m4macros`（env=conanbuild）重新生成（对齐 abiword-plugin-* 先例）"
    - "autoconf 生成的 configure/config.status 用 `umask 077 && mktemp -d` 建暂存目录，HMDFS 下为不可写的 `drwx--S---` → 去掉 `umask 077`（E114 / DRAFT-6507）"
    - "设备 uname 返回 HarmonyOS，config.guess 猜不出三元组 → configure 显式传 `--build=aarch64-unknown-linux-ohos`；老 configure 会探测 C++ 预处理器（默认 /lib/cpp）→ 一并传 CXX/CPP"
    - "上游 test/test_tfits.c 的 `char filename[512]` 未初始化即 strcat（UB），在 OHOS 上暴露为垃圾路径导致二进制表测试假失败 → 补丁将其初始化为 0（上游测试修改）"
    - "`make install` 只装 qfits.h，但它 include 其余 qfits_*.h → package() 追加安装全部 src/*.h；并移除 libtool .la"
    - "CLI 工具：装 bin/（11 个）+ man1（10 个），并提供软件级 commands.json"

versions:
  "6.2.0":
    status: built
    build_date: "2026-09-20"
    conan_ref: "qfits/6.2.0"
