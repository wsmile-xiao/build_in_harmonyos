# test_package/MANIFEST.yml
# qfits 6.2.0.

package: qfits/6.2.0
homepage: https://www.eso.org/sci/software/eclipse/qfits/

upstream_tests_exist: true
upstream_test_audit: "test/Makefile.am defines TESTS = test_pixio test_qfits test_tfits test_xmem test_xmem_stress (5 self-contained C programs that return 0 on success), driven by `make check`"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: "test_qfits"
    description: "core library test (headers, images, tables)"
  - name: "test_tfits"
    description: "FITS table (ASCII/binary) round-trip"
  - name: "test_pixio"
    description: "pixel I/O"
  - name: "test_xmem"
    description: "memory management"
  - name: "test_xmem_stress"
    description: "memory management stress"

test_package_tests:
  - file: test_qfits.c
    description: "compiles and runs a program that includes <qfits.h> and calls qfits_version()"
    command: "./test_qfits"

test_files:
  - path: "test_package/test_qfits.c"
    test_type: "R34"
    assertion_count: 1

test_package_test_count: 1
consumer_assertion_count: 1
assertion_count: 1
