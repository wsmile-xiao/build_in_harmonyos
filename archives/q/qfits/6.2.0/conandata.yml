sources:
  url: "https://deb.debian.org/debian/pool/main/q/qfits/qfits_6.2.0.orig.tar.gz"
  sha256: "3271469f8c50310ed88d1fd62a07c8bbd5b361e102def1dce3478d1a6b104b54"
  filename: "qfits-6.2.0.tar.gz"

patches:
  - patch_file: "patches/0001-test-tfits-init-filename.patch"
    patch_description: "test/test_tfits.c declares `char filename[512];` uninitialized and then strcat()s srcdir into it for the binary-table test (the buffer is only cleared later for the ASCII test). This is undefined behaviour that happens to work when the stack byte is zero; on OHOS the buffer holds garbage, producing a corrupt path and a spurious 'cannot load infos from the input table' failure. Initialize the buffer to zero."
    patch_type: "portability"
