software: qfits
version: "6.2.0"
status: built
build_date: "2026-09-20"
build_system: autotools (2007 vintage, bootstrap via tool_requires automake + autoreconf)
conan_ref: "qfits/6.2.0"

source:
  url: "https://deb.debian.org/debian/pool/main/q/qfits/qfits_6.2.0.orig.tar.gz"
  sha256: "3271469f8c50310ed88d1fd62a07c8bbd5b361e102def1dce3478d1a6b104b54"
  tar_format: tar.gz

build:
  system: autotools
  build_command: "autoreconf -fi -I m4macros; CC=<clang> CXX=<clang++> CPP='<clang> -E' ./configure --build=aarch64-unknown-linux-ohos --enable-shared --enable-static --prefix=<pkg>; make -j1; make check; make install"
  dependencies: []
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "automake test harness（test/ 下 5 个自包含 C 测试程序）"
  upstream_discovered: 5
  upstream_passed: 5
  upstream_failed: 0
  upstream_note: "`make check`：test_pixio / test_qfits / test_tfits / test_xmem / test_xmem_stress 全部 PASS（5/5）"
  test_package_passed: 1
  test_package_failed: 0
  test_package_assertions: 1
  execution: "conan create rc=0 + 上游 5/5 + 消费者 1/1（qfits_version 返回 6.2.0）"

test_passed: 6
test_failed: 0

patches_applied:
  - "0001-test-tfits-init-filename.patch（test/test_tfits.c 的 filename[512] 未初始化即 strcat，UB → 初始化为 0）"

knowledge_gained:
  - "CI 构建机只有 autoconf 没有 automake/aclocal → 用 tool_requires(\"automake/1.18\")+libtool 注入 PATH 后 `autoreconf -fi -I m4macros` 重新生成 configure/config.sub（abiword-plugin-* 先例）"
  - "复用知识库 E114 / DRAFT-6507：autoconf 生成的 configure/config.status 用 umask 077 && mktemp -d，HMDFS 下不可写 → 去掉 umask 077"
  - "上游 test_tfits.c 存在未初始化缓冲区（filename[512] 直接 strcat）的 UB，仅在部分平台暴露为假失败；补丁初始化后 5/5 通过"
  - "老（2007）configure 会探测 C++ 预处理器（默认 /lib/cpp）→ 需显式传 CXX/CPP 才能过 sanity check"
  - "qfits.h include 其余 qfits_*.h，但 make install 只装 qfits.h → 需补装全部 src/*.h 才能被消费者使用"
