# test_package/MANIFEST.yml
# 上游官方测试声明文件
# qsort 0.1: 单头文件 C 宏库，上游无独立测试框架；
# bench.cc 仅为性能基准程序（make 目标），非断言型测试用例。

package: qsort/0.1
homepage: "https://github.com/svpv/qsort"

# 上游无测试入口（Makefile 仅 bench 目标，无 check/test 目标）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（bench.cc 为基准程序，不计为独立测试用例）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，实际调用 QSORT 宏并断言有序）
test_package_tests:
  - file: test.c
    description: "消费者测试：QSORT 宏排序 10 个整数并断言升序"
    command: "./test_qsort"

# 测试断言总数
assertion_count: 1
