# 版本级 manifest — qmic 1.0
# 遵循 ARCHIVE-SPEC v3.0

version: "1.0"
software: qmic
status: built
build_date: "2026-09-27"
build_system: makefile
conan_ref: "qmic/1.0"

source:
  url: "https://github.com/linux-msm/qmic/archive/refs/tags/v1.0.tar.gz"
  sha256: "e2797c85a2b617b2b35024566105f4d8e998ef576f0f96f7923abf3717d12e86"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make -j1 CC=<tools.build:compiler_executables.c> CFLAGS=-pipe -O2 -Wall"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-parser.c.patch"

knowledge_gained:
  - "qmic parser.c 的 yyerror() 用 glibc 专有 program_invocation_short_name 拼错误前缀；OHOS musl 未声明该符号，头文件里也没有（编译期 'use of undeclared identifier'，而非链接期缺符号）——知识 E203/E493 的又一实例"
  - "可移植替代是 __progname：glibc、musl、OHOS libc 三者都导出（OHOS sysroot libc.so 实测有 __progname 定义），且上游未改动的 qmic.c 本就用 __progname 打印 Usage，因此该替换对非 OHOS 平台是行为等价的"
  - "上游 tests/bad_X.qmi 文件名是历史误称：提交 'parser: properly support hexadecimal numbers' 之后 0X 已是合法十六进制前缀，该文件实为 accept 用例（glibc 与 OHOS musl 实测均 rc=0）；文件内注释 'Previously 0X was not allowed' 即为证据"
  - "上游 tests/ 目录只有 18 个 .qmi 语料，没有测试运行器（Makefile 无 check/test 目标、无 CI 工作流、无脚本），因此按「独立命令行场景数量」口径计 18 项，期望 accept/reject 基线需自行实测确立"
  - "OHOS 只允许执行带有效 .codesign 签名的 ELF：test_package 里把安装好的二进制 cp 成别名再执行会被内核拒绝（Operation not permitted）——副本越过签名边界，与 E077/E452 同源。需要 argv[0] 相关断言时应改用调用名断言，而非复制可执行文件"


