  - patch_file: "patches/0001-parser.c.patch"
    patch_description: "parser.c prefixes parse errors with the glibc-only program_invocation_short_name; switch to __progname, which glibc, musl and OHOS libc all export (the untouched upstream qmic.c already uses it for the same purpose). No platform conditional is introduced, so non-OHOS builds are unaffected."
    patch_type: "portability"
