# test_package/MANIFEST.yml — qmic 1.0
# 上游官方测试声明文件 (L0e)
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 计数口径（全仓统一，见 notes.md「测试计数口径」）：
#   上游测试 = 上游 tests/ 目录中可独立判定成败的 .qmi IDL 输入文件数，共 18 项。
#   上游未提供测试运行器（Makefile 无 check/test 目标、无 CI 工作流、无测试脚本），
#   故采用「独立命令行场景数量」口径：每个 .qmi 用 qmic -a 跑一次，按退出码判定。
#   期望值来源：在上游未修改源码上实测的接受/拒绝基线（7 accept / 11 reject），
#   并在 test_package 里逐项断言（不是只跑一遍不校验）。

package: qmic/1.0
homepage: "https://github.com/linux-msm/qmic"

# 上游测试入口（Makefile 无 test/check 目标；tests/ 为语料）
upstream_check_command: "(upstream Makefile has no check/test target — tests/*.qmi are raw IDL corpora)"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游语料（tests/*.qmi）：每个文件是一次独立的 parse 场景，退出码 0=接受、1=拒绝
upstream_tests:
  - file: tests/fixed.qmi
    source: qmic-1.0/tests/fixed.qmi
    description: "数组类型与 optional/required 组合（应接受）"
    command: "qmic -a < tests/fixed.qmi"
  - file: tests/comments.qmi
    source: qmic-1.0/tests/comments.qmi
    description: "注释解析（应接受）"
    command: "qmic -a < tests/comments.qmi"
  - file: tests/hexdigits.qmi
    source: qmic-1.0/tests/hexdigits.qmi
    description: "十六进制常量（应接受）"
    command: "qmic -a < tests/hexdigits.qmi"
  - file: tests/num_large.qmi
    source: qmic-1.0/tests/num_large.qmi
    description: "超出 32 位的有符号常量（应接受）"
    command: "qmic -a < tests/num_large.qmi"
  - file: tests/single_digit_decimal.qmi
    source: qmic-1.0/tests/single_digit_decimal.qmi
    description: "个位十进制常量 0（应接受）"
    command: "qmic -a < tests/single_digit_decimal.qmi"
  - file: tests/symbolic_values.qmi
    source: qmic-1.0/tests/symbolic_values.qmi
    description: "符号常量参与消息编号（应接受）"
    command: "qmic -a < tests/symbolic_values.qmi"
  - file: tests/bad_X.qmi
    source: qmic-1.0/tests/bad_X.qmi
    description: "大写 0X 十六进制前缀（应拒绝）"
    command: "qmic -a < tests/bad_X.qmi"
  - file: tests/bad_decimal.qmi
    source: qmic-1.0/tests/bad_decimal.qmi
    description: "非法十进制字面量（应拒绝）"
    command: "qmic -a < tests/bad_decimal.qmi"
  - file: tests/bad_hex.qmi
    source: qmic-1.0/tests/bad_hex.qmi
    description: "非法十六进制字面量（应拒绝）"
    command: "qmic -a < tests/bad_hex.qmi"
  - file: tests/bad_octal.qmi
    source: qmic-1.0/tests/bad_octal.qmi
    description: "非法八进制字面量（应拒绝）"
    command: "qmic -a < tests/bad_octal.qmi"
  - file: tests/duplicate_const.qmi
    source: qmic-1.0/tests/duplicate_const.qmi
    description: "重复常量名（应拒绝）"
    command: "qmic -a < tests/duplicate_const.qmi"
  - file: tests/duplicate_message_name.qmi
    source: qmic-1.0/tests/duplicate_message_name.qmi
    description: "重复消息成员名（应拒绝）"
    command: "qmic -a < tests/duplicate_message_name.qmi"
  - file: tests/duplicate_message_val.qmi
    source: qmic-1.0/tests/duplicate_message_val.qmi
    description: "重复消息成员编号（应拒绝）"
    command: "qmic -a < tests/duplicate_message_val.qmi"
  - file: tests/duplicate_struct_name.qmi
    source: qmic-1.0/tests/duplicate_struct_name.qmi
    description: "重复结构体成员名（应拒绝）"
    command: "qmic -a < tests/duplicate_struct_name.qmi"
  - file: tests/no_package.qmi
    source: qmic-1.0/tests/no_package.qmi
    description: "缺少 package 声明（应拒绝）"
    command: "qmic -a < tests/no_package.qmi"
  - file: tests/num_too_big.qmi
    source: qmic-1.0/tests/num_too_big.qmi
    description: "超出 64 位范围的数值（应拒绝）"
    command: "qmic -a < tests/num_too_big.qmi"
  - file: tests/two_packages.qmi
    source: qmic-1.0/tests/two_packages.qmi
    description: "重复 package 声明（应拒绝）"
    command: "qmic -a < tests/two_packages.qmi"
  - file: tests/very_long_token.qmi
    source: qmic-1.0/tests/very_long_token.qmi
    description: "超出 token 缓冲区的超长标识符（应拒绝）"
    command: "qmic -a < tests/very_long_token.qmi"

# test_package 中自带的测试（消费者视角验证，真实执行安装产物）
test_package_tests:
  - file: test_qmic.sh
    description: "消费者测试：对安装的 qmic 跑全部 18 个上游 .qmi 语料 + 生成产物结构/守卫检查（accept/reject 逐项断言）"
    command: "sh test_qmic.sh <bindir> <corpusdir>"

# 鸿蒙特有测试（OHOS aarch64 musl 运行时实跑，命令与日志见 notes.md）
ohos_specific_tests:
  - file: test_package/ohos_qmic_test.sh
    description: "OHOS 专项测试：验证本次 musl 适配点 program_invocation_short_name→__progname（错误前缀必须是真实程序名且非 (null)、二进制无 glibc 符号残留且引用 __progname、适配后仍正常出码）。仅执行已签名的安装产物——OHOS 拒绝执行被复制的 ELF（E077/E452）"
    command: "sh ohos_qmic_test.sh <bindir> <corpusdir>"

# 断言总数（test_package 消费者 22 项 + 鸿蒙专项 9 项，均为实际执行并单独判定的检查项）
assertion_count: 31
