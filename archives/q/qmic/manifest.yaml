# 软件级 manifest — qmic
software: qmic
display: "qmic"
description: "QMI IDL 编译器（.qmi → C accessor/kernel 代码生成器）"
category: build-tool
homepage: "https://github.com/linux-msm/qmic"
license: BSD-3-Clause

build_system: makefile

ohos_adaptation:
  key_points:
    - "无依赖的手写 Makefile 工具（4 个 .c + 2 个头文件）：CC/CFLAGS/LDFLAGS 经 make 命令行注入即可全量接管，构建系统无需补丁"
    - "唯一源码补丁：parser.c 的 yyerror() 用 glibc 专有 program_invocation_short_name 拼错误前缀，OHOS musl 不声明该符号（编译报 undeclared identifier）；改用 __progname——glibc/musl/OHOS libc 都导出，且上游未改动的 qmic.c 本就用它（知识 E203/E493）"
    - "补丁不引入任何平台条件编译（R8），非 OHOS 平台行为不变；已用 glibc gcc 编译同一补丁集验证"
    - "工具从 stdin 读 IDL、按 -a/-k 选择 accessor/kernel 后端，向当前目录写 qmi_<package>.c/.h；上游 tests/*.qmi 为 18 个独立 accept/reject 语料"
    - "上游 Makefile 的 install 目标依赖 install(1) 且把 PREFIX 写死在目标路径里，package() 直接 copy 二进制"
  common_dependencies: []

versions:
  "1.0":
    status: built
    build_date: "2026-09-27"
    conan_ref: "qmic/1.0"
