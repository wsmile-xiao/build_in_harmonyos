# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qcoro/0.13.0
homepage: "https://github.com/qcoro/qcoro"

# 上游测试命令 — QCoro 使用 CTest 驱动（需 -DQCORO_BUILD_TESTING=ON）
upstream_check_command: "cmake --build . && ctest --output-on-failure"

# conanfile.py build() 中未启用上游测试：
# ohpcd qtbase 无 Qt6WebSockets/Qt6Quick/Qt6Qml 配置（三个可选特性关闭），
# 且部分测试需真实 D-Bus 服务/本地 socket，不适合 CI clean 环境。
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游测试实跑记录（探索阶段，QCORO_BUILD_TESTING=ON 手工构建 + LD_LIBRARY_PATH 指向 qtbase 包）
upstream_tests:
  - name: "ctest（18 个用例）"
    status: "run_manually"
    result: "15 passed；test-qcorolocalsocket 超时（沙箱无本地 socket 监听能力）；test-qdbuspendingcall/test-qdbuspendingreply 未构建（未生成可执行文件）"

# test_package 中自带的测试（消费者视角验证）
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test_qcoro_core.cpp
    description: "链接 QCoro6::Core 并调用 QCoro::Task< int > + QCoro::waitFor 公开 API，断言协程返回 42"
    command: "./test_qcoro_core"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
