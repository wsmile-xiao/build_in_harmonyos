# 版本级 manifest — qcoro 0.13.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.13.0"
software: "qcoro"

# 编译状态: published (conan-verify G0-G4 + L2/L4/L5 全部通过；CI upload 在合并 main 后执行)
status: published
build_date: "2026-10-02"
build_system: cmake

source:
  url: "https://github.com/qcoro/qcoro/archive/refs/tags/v0.13.0.tar.gz"
  sha256: "4bff7513c5c8e301b66308df05795043b1792ed16381a484e5c990171b8ff19e"
  tar_format: tar.gz
  git_tag_peeled: "v0.13.0"

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DQCORO_BUILD_EXAMPLES=OFF"
    - "-DQCORO_BUILD_TESTING=OFF"
    - "-DQCORO_WITH_QTDBUS=ON"
    - "-DQCORO_WITH_QTNETWORK=ON"
    - "-DQCORO_WITH_QTTEST=ON"
    - "-DQCORO_WITH_QTWEBSOCKETS=OFF"
    - "-DQCORO_WITH_QTQUICK=OFF"
    - "-DQCORO_WITH_QML=OFF"
  dependencies:
    - qtbase/6.11.1.1
  cc: clang
  cxx: clang++

# 无补丁：上游源码按原样构建（探索期为跑通上游测试补过 tests/testlibs 的
# QTcpSocket 头文件包含，但包本身 QCORO_BUILD_TESTING=OFF，不需要该改动）
patches_applied: []

knowledge_gained:
  - "QCoro 把 QCoro6::Coro / QCoro6::Test 作为 INTERFACE（header-only）组件发布：conanfile 若为其声明 cpp_info libs，CMakeDeps 会去找上游从不安装的 libQCoro6Coro.a / libQCoro6Test.a，find_package(QCoro6) 直接失败"
  - "声明了 components 的配方，根 cpp_info 的 includedirs/cxxstd 不会被子组件目标继承：每个组件都必须自带 includedirs（上游暴露 include、include/qcoro6、include/qcoro6/qcoro、include/qcoro6/QCoro 四个）与 cxxstd=20"
