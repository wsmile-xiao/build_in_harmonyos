# 版本级 manifest
# 文件位置: archives/q/qt5-qtsensors/5.15.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.15.2"

# 软件名
software: "qt5-qtsensors"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-06"
build_system: qmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtsensors-everywhere-src-5.15.2.tar.xz"

  # 源码校验和
  sha256: "3f0011f9e9942cad119146b54d960438f4568a22a274cdad4fae06bb4e0e4839"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: qmake

  # 配置选项列表
  configure_options:
  - "-spec linux-clang"
  - "SENSORS_PLUGINS=generic"
  - "QMAKE_STRIP="

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "qt5-qtbase/5.15.2.2"
  - "qt5-qtdeclarative/5.15.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "qmake 构建 Qt5 模块沿用 qt5-qtmultimedia 模式：私有可写 Qt prefix 镜像 qtbase（symlink + 重写 mkspecs .pri build-dir 引用）+ qmake -spec linux-clang"
- "QtSensors QML imports（src/imports）需 QT += qml quick：按 qt5-qtgraphicaleffects 模式将 qt5-qtdeclarative 的模块 .pri 与 mkspecs/features 合并进私有 Qt prefix"
- "SENSORS_PLUGINS=generic 上游官方 qmake 开关裁剪硬件后端：iio-sensor-proxy 插件 registerSensors() 中 QDBusConnection::systemBus().interface()->isServiceRegistered(...) 在无系统 D-Bus 守护进程的 OHOS 上空指针解引用（SIGSEGV）；linuxsys 后端读 /dev/input（OHOS PC 无传感器设备节点）"
- "make install 必须 STRIP=true（qmake strip --strip-unneeded 破坏动态符号表导致 dlopen 失败）"
- "打包后需重写 .prl/.la/.pc 中残留的 build-dir/source-dir 路径为 package_folder"
- "OHOS 上游测试可本机实测（构建即目标机）：tests/auto 默认套件 113/113 全绿；QT_PLUGIN_PATH 下动态手势插件与测试内 QT_STATICPLUGIN mock 插件重复注册会导致 qsensorgestures 崩溃（需干净环境运行）"
