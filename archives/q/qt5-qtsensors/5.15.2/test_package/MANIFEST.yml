# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qtsensors/5.15.2
homepage: https://www.qt.io/

# 上游测试命令：tests/auto 套件按上游 auto.pro 构建（qmake + make + 运行 tst_*）
upstream_check_command: "cd tests && qmake auto/auto.pro -spec linux-clang && make -f Makefile -j2 && for t in qsensor qsensorgestures qsensorgestureplugins qsensorgestures_gestures sensors2qmlapi qtsensors5; do ./auto/$t/tst_*; done"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件位置
upstream_tests:
  - name: "qsensor"
    source: qtsensors-everywhere-src-5.15.2/tests/auto/qsensor/
    description: "QSensor/QSensorManager 单元测试（自带 mock 后端 TestSensorPlugin，无硬件依赖）——本机实测 38 passed/0 failed"
  - name: "qsensorgestures"
    source: qtsensors-everywhere-src-5.15.2/tests/auto/qsensorgestures/
    description: "QSensorGestureManager 单元测试（自带静态 mock 手势插件）——本机实测 15 passed/0 failed"
  - name: "qsensorgestureplugins"
    source: qtsensors-everywhere-src-5.15.2/tests/auto/qsensorgestureplugins/
    description: "手势插件动态加载测试（加载包内 sensorgestures 插件）——本机实测 13 passed/0 failed"
  - name: "qsensorgestures_gestures"
    source: qtsensors-everywhere-src-5.15.2/tests/auto/qsensorgestures_gestures/
    description: "手势识别器数据驱动测试（mock 传感器数据回放，无硬件依赖）——本机实测 41 passed/0 failed"
  - name: "sensors2qmlapi"
    source: qtsensors-everywhere-src-5.15.2/tests/auto/sensors2qmlapi/
    description: "QML 传感器 API 单元测试——本机实测 4 passed/0 failed"
  - name: "qtsensors5"
    source: qtsensors-everywhere-src-5.15.2/tests/auto/qtsensors5/
    description: "QML 模块加载冒烟测试——本机实测 2 passed/0 failed"
  - name: "legacy_sensors (上游默认禁用)"
    source: qtsensors-everywhere-src-5.15.2/tests/auto/legacy_sensors/
    description: "Qt Mobility 遗留 QML API 测试——上游 auto.pro 中已被注释禁用（#SUBDIRS），非默认套件；且强依赖完整 QtQuick 运行时环境，本机 44 passed/33 failed（环境限制：QML 插件加载路径不完整）"

# test_package 中自带的测试（消费者视角验证：链接 libQt5Sensors 并验证纯逻辑路径）
test_package_tests:
  - file: test.cpp
    description: "15 项消费者侧断言：类型常量（QAccelerometer/QCompass type）、传感器对象状态机（未激活/无读数/dataRate/alwaysOn/skipDuplicates/isConnectedToBackend roundtrip）、软件手势识别插件加载（QSensorGestureManager gestureIds 含 QtSensors.shake）、QML 模块导入创建 QmlAccelerometer（connectedToBackend/dataRate 属性）。硬件传感器读数路径按环境排除定性（OHOS PC 无传感器设备节点 /dev/input 与系统 D-Bus）"
    command: "./test_qt5_qtsensors"

assertion_count: 15
