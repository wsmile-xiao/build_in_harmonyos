# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md 与 references/iron-rules.md R51（上游测试三步法）

package: qoixx/0.1.7
homepage: "https://github.com/wx257osn2/qoixx"

# ── 上游测试入口 ─────────────────────────────────────────────────────────────
# 上游 tarball 自带 Makefile，测试入口是 `make test`：构建 bin/test
# （src/test.cpp + .gitmodules 的 doctest 子模块头）后运行它。
# 上游没有 make check / ctest；上游 CI（.github/workflows/linux.yml）的 test
# 步骤最后一行就是 `bin/test`，与本入口同一对象。
upstream_check_command: "make test"

# conanfile.py build() 中已集成上游测试（docs/TEST_QUALITY_SPEC.md §3.1 层 1 必做）：
# 沙箱 HOME 下 make bin/test → ./bin/test，并做反假绿硬断言（test cases / assertions
# 两行必须命中期望值，`All 0 tests` 命中即判失败）。
upstream_test_in_build: true
upstream_test_command: "make -j1 CXX=<conf:tools.build:compiler_executables:cpp 默认 clang++> CXXFLAGS='-std=c++2a -O2 -Wall -Wextra -pedantic-errors -fexperimental-library' bin/test && ./bin/test"

# 上游实际运行的测试（一个 doctest 可执行 = 2 个 TEST_CASE / 16 个 SUBCASE / 38 条运行期断言）
# 逐项 PASS/断言数见 reports/test-report.md 两表
upstream_tests:
  - file: src/test.cpp
    source: qoixx-0.1.7/src/test.cpp
    description: "上游 doctest 2.4.11 测试单元：2 个 TEST_CASE（3-channel image / 4-channel image），每例 8 个 SUBCASE（encode/decode × vector/pair/指针 × 输出容器类型），运行期 38 条断言全过"
    command: "./bin/test"

# test_package 中自带的测试（消费者视角验证，鸿蒙特有测试行）
test_package_tests:
  - file: test.cpp
    description: "qoixx 消费者测试：从已安装包 include/qoixx.hpp 真实调用 encode/decode —— 3ch/4ch 往返、desc 整体回读、编码确定性、指针重载与容器重载一致、QOI RLE 压缩收益、128x128 大图（aarch64 NEON 快路径在构建面）往返、显式 channels 参数、两条错误路径抛异常；运行期断言 14 条"
    command: "./test_qoixx"

# ── N 的取数命令（R51 候选数法：同单位取最大值，差额逐项归因）──────────────
# 2026-09-29 设备实测，四口径各自单列、不混用（device-facts 附录 §7.3）：
#
#   1) 源码宏数（测试用例数）: grep -c 'TEST_CASE(' <source>/src/test.cpp
#        → 2   （3-channel image / 4-channel image）
#   2) 框架注册数（测试用例数）: ./bin/test 末尾 `test cases:  2 |  2 passed`
#        → 2   （doctest 2.4.11；SUBCASE 不单独注册为 test case）
#   3) SUBCASE 展开数（子用例数）: grep -c 'SUBCASE(' <source>/src/test.cpp
#        → 16  （2 TEST_CASE × 8 SUBCASE；doctest 每个 SUBCASE 单独执行一轮）
#   4) assertion 数（**N 口径·候选最大值**）: ./bin/test 末尾 `assertions: 38 | 38 passed`
#        → 38  （源码断言语句 grep -cE '^\s*(CHECK|REQUIRE)' → 24：22 CHECK + 2 REQUIRE）
#   5) 消费者断言数（鸿蒙特有，分栏不进上游分母）: ./test_qoixx
#        → 14  （末行 QOIXX-CONSUMER checks=14）
#
# N = max(1)2)3)4)) = **38**（口径 4，assertion 单位；1)/2) 是测试用例数、
# 3) 是子用例数 —— 四口径单列不混用，取最大值防少报，消费者口径 5) 属另一张表）。
# N′ = 38，TOTAL = PASS 38 + FAIL 0 + SKIP 0 + NOT_RUN 0 = 38 = N，通过率 38/38（100%）。
#
# 差额归因（严格合计）:
#   24（源码断言语句）→ 38（运行期断言）: +14 = 2 条 REQUIRE 位于 SUBCASE 之前，
#        每个子用例轮都各执行一次 ⇒ 2×8=16 次执行 vs 源码 2 处（+14）；
#        22 条 CHECK 各在自己的 SUBCASE 内执行一次 ⇒ 22 = 22（+0）；16+22=38。
#   2（源码宏）= 2（框架注册）: 0 差（无 TEST_CASE_FIXTURE/参数化展开）。
#   2 → 16: 单位不同（case vs SUBCASE 子用例），单列在口径 3)。
#   审方若按源码宏清点得 2、按 SUBCASE 得 16、按源码断言得 24，均 ≤ 声明 N=38。
#
# 未纳入 N 的上游测试面（如实申报，不压分母）:
#   上游 CI 另有一个依赖外部数据集的集成循环：下载 qoiformat.org 的
#   qoi_test_images.zip 与 qoi_benchmark_suite、用 .dependencies/qoi 子模块编译
#   参考 qoiconv，再逐图 diff —— 该循环不在仓库测试入口 `make test` 内、不产生
#   测试用例计数，本次 NOT_RUN：①参考与被测 qoiconv 在本设备 clang 15 下
#   `overloaded` 推导指引报 no matching constructor（上游 CI 用 clang-17）；
#   ②数据集需外网下载。逐条证据见 notes.md「未运行项」。
upstream_test_count: 38
test_package_test_count: 14

# 测试断言总数（= test_package/test.cpp 消费者断言数，运行期 QOIXX-CONSUMER checks=14）
assertion_count: 14
