# conandata.yml — qoixx 0.1.7
#
# 单一事实来源：上游 tag v0.1.7 归档 + 上游测试框架 doctest 2.4.11 归档。
#
# 三路取证（2026-09-29 设备实测）：
#   1. git ls-remote --tags <上游仓库>：全量 8 个 tag（v0.1.0 … v0.1.7）逐条命中，
#      refs/tags/v0.1.7 = 542881c370dce466dbd6b95329a2217f360c707d（tag 对象）
#   2. 本地下载 sources["0.1.7"] 指向的归档（19770 字节）
#        sha256 = 9da53e0fc035f4b75f872a196a76cd870b63568612254035dadc84e46f47d779
#   3. CCI conan-center-index 的 recipes/qoixx/all/conandata.yml 中 "0.1.7" 同值
#
# 注释里刻意不写任何完整下载地址：CI 的 pre-download / 镜像注入对整份 conandata
# 做字面替换，注释中的地址会被一并改写（itlib 同族教训）。
#
# doctest_sources：上游 src/test.cpp 直接 `#include "doctest.h"`，该头来自上游
# .gitmodules 的 doctest 子模块，tag v0.1.7 树上 pinned 在
# ae7a13539fb71f270b87eb2e874fbac80bc8dda2（= doctest tag v2.4.11；实测两者
# doctest/ 目录逐字节一致）。GitHub 的 tag 归档不含子模块内容（上游 .dependencies/
# 三个子模块目录解包后全空），故按 doctest 官方 tag 单独预下载进
# .dependencies/doctest —— 上游 Makefile 的 `DOCTEST=-I .dependencies/doctest/doctest`
# 路径原样可用，不动上游构建面。
#
# 本包 0 conan 依赖：ci/scripts/preflight_check.sh qoixx/0.1.7 预检通过，配方
# requirements / build_requirements 双零；doctest 只是上游测试框架头文件，
# 不进本包依赖链（test_package 也只消费 qoixx 交付头）。

