# 本轮（R02）修复：声明全部实际应用的 quill 源码补丁（OHOS /tmp 只读 → TMPDIR 适配）。
# 与磁盘 patches/ 及 conan 实际应用集合逐项一致。
patches:
  - patch_file: "patches/0001-include-quill-backend-BackendWorkerLock.h.patch"
    patch_description: "Resolve the backend worker lock file path via $TMPDIR (fallback /tmp) so the flock-based duplicate-backend guard works on OHOS where /tmp is read-only"
    patch_type: "portability"
  - patch_file: "patches/0002-test-misc-DocTestExtensions.cpp.patch"
    patch_description: "Resolve the doctest captured-stream mkstemp template via $TMPDIR (fallback /tmp) so console-capture tests pass on OHOS where /tmp is read-only"
    patch_type: "portability"
  - patch_file: "patches/0003-test-unit_tests-BackendUtilitiesTest.cpp.patch"
    patch_description: "Mirror the library's $TMPDIR-aware lock path in the lock-file cleanup assertion"
    patch_type: "portability"
  - patch_file: "patches/0004-test-unit_tests-BackendWorkerLockTest.cpp.patch"
    patch_description: "Mirror the library's $TMPDIR-aware lock path in the lock-file cleanup assertion"
    patch_type: "portability"
  - patch_file: "patches/0005-test-unit_tests-ConsoleSinkTest.cpp.patch"
    patch_description: "Create the TestConsoleSink temp file via mkstemp under $TMPDIR (fallback /tmp) instead of std::tmpfile; guard POSIX includes so non-POSIX/Windows builds are not broken"
    patch_type: "portability"
