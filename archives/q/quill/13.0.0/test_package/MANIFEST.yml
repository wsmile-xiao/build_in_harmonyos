# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: quill/13.0.0
homepage: "https://github.com/odygrd/quill"

# 上游测试命令 (quill 13.0.0 使用 CMake/CTest, 非 autotools)
upstream_check_command: "ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试 (quill 为 header-only，上游测试在 CI 层单独执行)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (quill 13.0.0 v13.0.0 全量 CTest 419 项，全通过 419/419)
upstream_tests:
  - file: test/unit_tests/ConsoleSinkTest.cpp
    source: quill-13.0.0/test/unit_tests/ConsoleSinkTest.cpp
    description: "doctest 单元测试: ConsoleSink 颜色/格式/捕获 (含 OHOS /tmp 只读适配)"
    command: "./test/TEST_ConsoleSink"
  - file: test/unit_tests/BackendWorkerLockTest.cpp
    source: quill-13.0.0/test/unit_tests/BackendWorkerLockTest.cpp
    description: "doctest 单元测试: BackendWorkerLock flock 互斥与清理 (含 OHOS TMPDIR 适配)"
    command: "./test/TEST_BackendWorkerLock"
  - file: test/integration_tests/ConsoleSinkStderrMultipleFormatsTest.cpp
    source: quill-13.0.0/test/integration_tests/ConsoleSinkStderrMultipleFormatsTest.cpp
    description: "集成测试: stderr 多格式输出 (含 OHOS TMPDIR 捕获流适配)"
    command: "./test/TEST_ConsoleSinkStderrMultipleFormats"
  - file: test/integration_tests/JsonConsoleLoggingTest.cpp
    source: quill-13.0.0/test/integration_tests/JsonConsoleLoggingTest.cpp
    description: "集成测试: JSON 控制台日志"
    command: "./test/TEST_JsonConsoleLogging"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 实质调用 quill::Backend/Frontend/LogMacros 全链路"
    command: "./test_quill"

# 测试断言总数 (上游 419 项 ctest + 消费者 smoke)
assertion_count: 420