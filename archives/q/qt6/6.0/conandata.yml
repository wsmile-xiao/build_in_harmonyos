sources:
  url: "https://codeload.github.com/qt/qtbase/tar.gz/fc9cda5f08ac848e88f63dd4a07c08b2fbc6bf17"
  filename: "qtbase-v6.0.0-fc9cda5f08ac848e88f63dd4a07c08b2fbc6bf17.tar.gz"
  sha256: "19a2d8eb78921624faca6a4e5a3ff31e7ca91b0bb13ab4869f8c218e39300766"

patches:
  - patch_file: "patches/0001-cmake-QtAutoDetect.cmake.patch"
    patch_description: "Skip Android autodetection for the HarmonyOS mkspec"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-QtPlatformSupport.cmake.patch"
    patch_description: "Recognize HarmonyOS as a Linux-compatible POSIX target"
    patch_type: "portability"
  - patch_file: "patches/0003-cmake-platforms-Platform-HarmonyOS.cmake.patch"
    patch_description: "Use CMake Linux platform rules for HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0004-mkspecs-harmonyos-clang-qmake.conf.patch"
    patch_description: "Add the HarmonyOS Clang qmake specification"
    patch_type: "portability"
  - patch_file: "patches/0005-mkspecs-harmonyos-clang-qplatformdefs.h.patch"
    patch_description: "Provide Qt's POSIX platform definitions for HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0006-src-corelib-thread-qthread_unix.cpp.patch"
    patch_description: "Disable unavailable pthread cancellation paths through a capability macro"
    patch_type: "portability"
  - patch_file: "patches/0007-tests-auto-corelib-thread-qthread-tst_qthread.cpp.patch"
    patch_description: "Skip cancellation-only Qt thread tests when the SDK lacks those APIs"
    patch_type: "portability"
  - patch_file: "patches/0008-src-network-socket-qlocalsocket_unix_p.h.patch"
    patch_description: "Build a normalized UID-scoped HarmonyOS abstract local-socket address"
    patch_type: "portability"
  - patch_file: "patches/0009-src-network-socket-qlocalserver_p.h.patch"
    patch_description: "Track managed HarmonyOS abstract listeners for peer credential checks"
    patch_type: "portability"
  - patch_file: "patches/0010-src-network-socket-qlocalserver_unix.cpp.patch"
    patch_description: "Use HarmonyOS abstract local sockets and validate accepted peer UIDs"
    patch_type: "portability"
  - patch_file: "patches/0011-src-network-socket-qlocalsocket_unix.cpp.patch"
    patch_description: "Connect HarmonyOS relative names and canonical fullServerName addresses through the shared helper"
    patch_type: "portability"
  - patch_file: "patches/0012-tests-auto-network-socket-qlocalsocket-tst_qlocalsocket.cpp.patch"
    patch_description: "Run Qt local socket regressions against HarmonyOS abstract-name semantics"
    patch_type: "portability"
  - patch_file: "patches/0013-openssl3-and-harmonyos-dns-tests.patch"
    patch_description: "Resolve OpenSSL 3 symbol aliases and record unavailable HarmonyOS DNS resolver cases"
    patch_type: "portability"
