knowledge_gained:
  - "Qt 6.0 omits tst_qsslkey when CMake cannot find OpenSSL; declare the published OpenSSL 3.5.6.1.2 dependency and pass its package root to CMake instead of treating the missing target as a blacklist."
  - "QtBase 6.0 can use HarmonyOS Clang while CMake platform selection follows Linux/POSIX rules; Conan remains configured for OHOS/armv8."
  - "HarmonyOS device storage aliases case-only build paths, so the optional TUIO touch plugin is disabled to avoid colliding Qt make targets."
  - "Qt 6.0 CMake MODULE plugin exports may say IMPORTED_NO_SONAME even after a plugin receives DT_SONAME; normalize the exported ./plugins path and publish matching IMPORTED_SONAME metadata."
  - "HarmonyOS QLocalServer relative names can use normalized, UID-scoped abstract AF_UNIX addresses while preserving explicit pathname sockets and rejecting unsupported permission options."
  - "A canonical HarmonyOS @qt6:<uid>:<sha256> fullServerName can be passed back to QLocalSocket::connectToServer and resolves to the same endpoint."
  - "Qt-managed HarmonyOS abstract listeners can enforce same-effective-UID access with SO_PEERCRED before handing accepted descriptors to Qt; externally adopted descriptors retain caller-managed policy."
  - "Qt 6.0's OpenSSL dynamic loader must resolve OpenSSL 3 renamed symbols and load configuration; OpenSSL legacy test fixtures require matching library/provider versions, so the legacy provider is enabled only in the CTest environment."
  - "This HarmonyOS SDK reports Resolver functions not found; preserve and run the full QDnsLookup suite and mark only exact affected data rows as QEXPECT_FAIL; QtTest records matched outcomes as passed."
