status_note: "Buildbot #81506 confirmed L0 and the junk-file gate pass, then Conan failed because clean-worker CMake could not find OpenSSL headers or libraries and Qt 6.0 omitted tst_qsslkey. This fix declares openssl/3.5.6.1.2 as a shared runtime dependency and supplies it to Qt CMake and CTest. The earlier 29-suite/84-check pass used a manually provisioned HarmonyBrew OpenSSL and did not prove a clean Conan dependency graph; this change is pending AArch64 CI and Conan validation."

