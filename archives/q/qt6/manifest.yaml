software: qt6
display: "Qt 6"
description: "Qt cross-platform C++ framework; this archive contains the QtBase 6.0 HarmonyOS PC subset."
category: gfx
homepage: "https://www.qt.io/"
license: "BSD-3-Clause AND LGPL-3.0-only AND GPL-3.0-only"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Uses a HarmonyOS Clang qmake mkspec and CMake platform while retaining Qt's POSIX/Linux behavior."
    - "Maps relative QLocalServer names to UID-scoped abstract AF_UNIX addresses and checks SO_PEERCRED for managed listeners."
    - "Supports the device OpenSSL 3 runtime; resolver-dependent DNS cases are expected failures when the SDK resolver API is unavailable."
  common_dependencies: []

versions:
  "6.0":
    status: built
    build_date: "2026-10-10"
    conan_ref: "qt6/6.0"
