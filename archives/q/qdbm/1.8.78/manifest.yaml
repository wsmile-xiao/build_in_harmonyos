software: qdbm
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.8.78/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.78"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-20"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://dbmx.net/qdbm/qdbm-1.8.78.tar.gz"

  # 源码校验和
  sha256: "b466fe730d751e4bfc5900d1f37b0fb955f2826ac456e70012785e012cdcb73e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--prefix=/"
  - "--enable-static"
  - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-configure-umask-fix.patch"
- "0002-vlmgr.c-uninit-fix.patch"
- "0003-vltsv.c-uninit-fix.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "qdbm configure 使用 umask 077 创建临时目录，HMDFS 上导致权限问题，改为 umask 022"
- "vlmgr.c runlist() 函数中 bsiz/tsiz 未初始化导致 vlmgr list 段错误"
- "vltsv.c doexport() 函数中 err 变量未初始化"
- "qdbm 的 configure 不支持 out-of-source 构建，conanfile.py 需用 self.run() 替代 Autotools helper"

# Top-level build system field
build_system: autotools

patch_generation:
  method: refresh-patch-auto
  generated_at: '2026-07-20T15:24:00'
  patches_count: 3

patch_classification:
  - file: 0001-configure-umask-fix.patch
    type: bugfix
    platform_only: true
    guard: 'umask 077 → 022 for HMDFS compatibility'
  - file: 0002-vlmgr.c-uninit-fix.patch
    type: bugfix
    platform_only: false
    guard: 'bsiz=0, tsiz=0 initialization fix for segfault'
  - file: 0003-vltsv.c-uninit-fix.patch
    type: bugfix
    platform_only: false
    guard: 'err=0 initialization fix'
