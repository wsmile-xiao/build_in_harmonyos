# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qdbm/1.8.78
homepage: "https://dbmx.net/qdbm/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: dptest.c
    source: qdbm-1.8.78/dptest.c
    description: "depot (hash database) core API tests: write, read, rcat, combo, wicked"
    command: "./dptest write casket 50000 5000 && ./dptest read casket"
  - file: crtest.c
    source: qdbm-1.8.78/crtest.c
    description: "curia (B+ tree database) core API tests: write, read, rcat, combo, wicked"
    command: "./crtest write casket 50000 500 10"
  - file: vltest.c
    source: qdbm-1.8.78/vltest.c
    description: "villa (villa database) core API tests: write, read, rdup, combo, wicked"
    command: "./vltest write -tune 32 31 32 32 casket 50000"
  - file: cbtest.c
    source: qdbm-1.8.78/cbtest.c
    description: "cabin (utility library) tests: sort, strstr, list, map, heap, wicked, misc"
    command: "./cbtest sort 5000"
  - file: odtest.c
    source: qdbm-1.8.78/odtest.c
    description: "odeum (inverted index) tests: write, read, combo, wicked"
    command: "./odtest write casket 500 50 5000"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "depot API consumer test: dpopen/dpput/dpget/dpout/dpclose round-trip"
    command: "./test_qdbm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
