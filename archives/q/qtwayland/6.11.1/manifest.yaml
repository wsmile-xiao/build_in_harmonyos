# manifest.yaml — qtwayland 6.11.1
name: qtwayland
version: 6.11.1
description: "Qt Wayland platform plugin and compositor for HarmonyOS PC"
homepage: "https://doc.qt.io/qt-6/qtwayland-index.html"
license: "BSD-3-Clause AND LGPL-3.0-only AND GPL-3.0-only"
build_system: cmake
language: cpp
upstream_repo: "https://github.com/qt/qtwayland"
upstream_version: "v6.11.1"
status: built
dependencies:
  - "qtbase/6.11.1.2"
  - "wayland/1.22.0"
  - "libxkbcommon/1.6.0"
  - "wayland-protocols/1.36.1"
patches:
  - "patches/0001-tst-compositor-use-tmpdir-for-shm-buffers.patch"
notes: >
  Qt Wayland module for Qt 6.11.1. Provides Qt6WaylandClient and
  Qt6WaylandCompositor libraries for Wayland display server protocol
  integration. Depends on qtbase 6.11.1.2, wayland 1.22.0,
  libxkbcommon 1.6.0 (XKB::XKB for the upstream tst_compositor
  keyboard cases), and wayland-protocols 1.36.1. The wayland package
  provides wayland-scanner binary (in bin/), libwayland-client/server/cursor
  shared libraries, and pkg-config files. The wayland-protocols
  package provides protocol XML files in share/wayland-protocols/.
  The shipped .pc files have prefix=/ which is fixed at build time
  by generating corrected copies in the Conan generators folder.
