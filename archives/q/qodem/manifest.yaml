# 软件级 manifest — archives/q/qodem/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: qodem
display: "Qodem"
description: "公开领域的终端仿真器与 BBS 客户端（Qmodem 克隆），基于 ncurses + termios + pty"
category: network

homepage: "https://qodem.sourceforge.io/"
license: CC0-1.0

# ============================================================
# 构建信息
# ============================================================

build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "configure/config.status 用 umask 077 建临时目录在 HMDFS 上不可写，需去掉 umask"
    - "getpwuid() 对容器 uid 可能返回 NULL，调用方必须判空"
    - "wide-char ncurses 由 conan ncurses/6.6 提供（只有 include/curses.h 没有 ncursesw/），qcurses.h 会回退到 <curses.h>，需定义 _XOPEN_SOURCE_EXTENDED"
    - "TERMINFO 必须由 ncurses 的 conanrun 环境导出，否则终端路径失败"
    - "运行期需要 pty（/dev/ptmx、forkpty）与 termios ioctl，OHOS 均可用"
  common_dependencies:
    - ncurses

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.1":
    status: built
    build_date: 2026-10-01
