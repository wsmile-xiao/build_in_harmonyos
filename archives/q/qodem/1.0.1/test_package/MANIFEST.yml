# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: qodem/1.0.1
homepage: "https://qodem.sourceforge.io/"

# Upstream ships no test suite at all: the tarball contains exactly one
# Makefile.am with no TESTS / check_PROGRAMS / TEST_EXTENSIONS, and no
# tests/ directory.  `make check` therefore has nothing to run (verified
# with: grep -rn 'check_PROGRAMS\|^TESTS' --include=Makefile.am .  -> 0 hits)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Runs bash test.sh with a writable output dir under the conanrun environment"
    command: "bash test.sh <outdir>"
  - file: test.sh
    description: "qodem --version / --help / --create-config / full terminal session with --capfile assertion"
    command: "qodem --version; qodem --help; qodem --create-config <file>; qodem --exit-on-completion --capfile <file> uname"

# Test assertion count (test.sh prints CHECKS=n FAILURES=n)
assertion_count: 11
