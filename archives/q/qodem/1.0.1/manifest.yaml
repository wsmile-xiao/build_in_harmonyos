# 版本级 manifest — archives/q/qodem/1.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.0.1"
software: "qodem"

# 编译状态（O5：合并 + release upload 确认前一律 built）
status: built

build_date: "2026-10-01"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://downloads.sourceforge.net/project/qodem/qodem/1.0.1/qodem-1.0.1.tar.gz"
  sha256: "dedc73bfa73ced5c6193f1baf1ffe91f7accaad55a749240db326cebb9323359"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--disable-gpm"
    - "--disable-sdl"
    - "--disable-upnp"
    - "--disable-x11"
    - "--disable-ssh"
  dependencies:
    - ncurses/6.6
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-configure-hmdfs-umask.patch"
  - "0002-qodem-help-exit-and-getpwuid-null.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS umask 077: configure/config.status 的临时目录 umask 077 落盘为 0700 共享属主，config.status 写不进去 -> Permission denied；去掉 umask 即可（E678 家族）"
  - "getpwuid(geteuid()) 对无 /etc/passwd 条目的容器 uid（20020085）返回 NULL，qodem 直接解引用 -> SIGSEGV（--help/--version 早退故不崩）；需 NULL 兜底"
  - "上游把 --help/--version 返回 EXIT_HELP=1/EXIT_VERSION=2，违反 POSIX/GNU 约定且让 L2 smoke 探针判 FAIL；信息型选项应 exit 0"
  - "OHOS 伪终端栈可用：/dev/ptmx + grantpt/unlockpt/ptsname + forkpty/openpty + TIOCGWINSZ/TIOCSWINSZ/TIOCSTI/TIOCEXCL/TIOCSCTTY 全部可用（一手 C 探针）"
  - "conan ncurses 通过 runenv_info 导出 TERMINFO/TERMINFO_DIRS；缺 TERMINFO 时 qodem 终端路径以 rc=10 优雅失败（不崩溃）"
