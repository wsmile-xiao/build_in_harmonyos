software: qxlsx
display: "QXlsx"
description: "基于 Qt 框架的 Excel 文件读写库"
category: library
homepage: "https://github.com/QtExcel/QXlsx"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "基于 Qt 框架，需要 Qt5 开发环境 (Core, Gui)"
    - "CMake 构建系统，源码在 QXlsx/ 子目录"
    - "静态链接编译 (BUILD_SHARED_LIBS=OFF)，生成 libQXlsxQt5.a"
    - "需要创建 Qt5 系统 wrapper 包供 Conan 依赖管理"
    - "CMake 不识别 HarmonyOS 平台，但不影响编译（仅警告）"
  common_dependencies:
    - qt

versions:
  "1.4.7":
    status: built
    build_date: "2026-06-25"
    conan_ref: "qxlsx/1.4.7@ohpcd/stable"
