version: "1.4.7"
status: built
build_date: "2026-06-25"

source:
  url: "https://github.com/QtExcel/QXlsx/archive/refs/tags/v1.4.7.tar.gz"
  sha256: "45a344edf7f59487a3d3093133dad62bd35ac18aa88403eb448d718da3bc5b85"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
  dependencies:
    - "qt/5.15.2"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "QXlsx 构建系统是 CMake（非 autotools），源码在 QXlsx/ 子目录"
  - "Conan 2.x 包名必须小写：qxlsx（非 QXlsx）"
  - "需要创建 Qt5 系统 wrapper 包供 Conan 依赖管理，wrapper 需设置 runenv_info 提供运行时 LD_LIBRARY_PATH"
  - "CMake 不识别 HarmonyOS 平台名称，输出警告但不影响编译"
  - "CI profile 中 generator=Make 无效，需在 conanfile.py 中显式指定 generator=Unix Makefiles"
  - "测试程序保存文件需使用 $TMPDIR 而非 /tmp（E002: /tmp 只读）"
  - "GitHub 直接下载超时，可用 git clone --depth 1 --branch v1.4.7 获取源码"
  - "QXlsx 产物名为 QXlsxQt5（非 QXlsx），cpp_info.libs 需设置为 QXlsxQt5"
