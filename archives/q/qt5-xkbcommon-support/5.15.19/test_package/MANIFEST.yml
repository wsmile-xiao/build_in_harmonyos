# test_package/MANIFEST.yml — qt5-xkbcommon-support/5.15.19
# 详见 docs/TEST_QUALITY_SPEC.md
#
# R51 上游测试清点（本包实测证据）：
#   Qt5 的 QtXkbCommonSupport 模块自身**不带测试**。模块源码目录仅 4 个文件：
#     qxkbcommon.cpp  qxkbcommon_3rdparty.cpp  qxkbcommon_p.h  xkbcommon.pro
#   清点命令与结果：
#     tar tf qtbase-everywhere-opensource-src-5.15.19.tar.xz \
#       | grep 'platformsupport/input/xkbcommon/' | wc -l          -> 4 (无 tests/ 目录)
#     grep -cE 'test|check' <module>/xkbcommon.pro                 -> 0 (无 test target)
#   Qt 的 xkbcommon 相关测试位于 qtbase/tests/auto/gui/kernel/qguiapplication
#   等目录，且属于**整棵 Qt 源码树的测试**，不在本模块构建范围内；其运行需要
#   完整 Qt 构建产物与 QPA 环境，不属于本包（模块拆分包）的可执行范围。
#   因此 upstream_tests = 0，本 PR 的实质测试全部落在 test_package（消费者视角）。
package: qt5-xkbcommon-support/5.15.19
homepage: "https://code.qt.io/cgit/qt/qtbase.git/tree/src/platformsupport/input/xkbcommon"

# 上游无测试：无 make check / ctest / qmake check 可执行
upstream_check_command: "n/a (Qt 模块不自带测试；模块目录仅 4 个源文件，无 test target)"
upstream_test_in_build: false
upstream_test_command: "n/a (Qt 模块不自带测试)"

# 上游实际测试程序：0（清点证据见上）
upstream_tests: []

# test_package 中自带的测试（消费者视角，R34 实质依赖被测包）
test_package_tests:
  - file: CMakeLists.txt
    description: >-
      真实消费者工程：find_package(Qt5XkbCommonSupport REQUIRED) 后断言
      Qt5::XkbCommonSupportPrivate 目标存在且其 IMPORTED_LOCATION 指向的静态库
      文件真实存在（FATAL_ERROR 兜底）。
    command: "cmake configure (find_package CONFIG REQUIRED)"
  - file: src/test_xkbsupport.cpp
    description: >-
      链接 Qt5::XkbCommonSupportPrivate 并实际调用两个目标文件中的 API：
      ①qxkbcommon.cpp：QXkbCommon::keysymToQtKey / isKeypad / isLatin1 /
      modifiers(实时 xkb_state)；②qxkbcommon_3rdparty.cpp：
      qxkbcommon_xkb_keysym_to_upper / xkbcommon_XConvertCase /
      lookupStringNoKeysymTransformations。并真实链接 libxkbcommon：
      xkb_context_new + xkb_keymap_new_from_string + xkb_state_key_get_one_sym
      构建 evdev keymap，用模块函数翻译 keycode 38。任一断言失败即非零退出。
    command: "ctest --test-dir <build> --output-on-failure (test_xkbsupport)"
  - file: conanfile.py
    description: >-
      测试驱动：构造 CMAKE_PREFIX_PATH 指向各依赖包（两包均 cmake_find_mode=none），
      组装 LD_LIBRARY_PATH（Qt5 共享库 + libxkbcommon），QT_QPA_PLATFORM=offscreen，
      再执行 ctest。
    command: "conan create (test() 阶段)"

  - file: e2e/xkbcommon_e2e.cpp
    description: >-
      **鸿蒙特有测试 / 完整消费者用例（rule 12）**：一个真正跑通功能流程的端到端用例，
      而非断言清单。模块的职责是把键盘硬件输入翻成 Qt 键事件与文本，本用例就完整跑一遍
      「模拟打字会话」，且**全程走模块自己的翻译路径**（静态归档已链入）：
      ① 用自包含 XKB keymap（无 include，不读 /share/X11/xkb —— 本机无该数据目录）
      编译出活的 xkb_keymap/xkb_state；
      ② 「Ca1」打字会话：Shift+c → 'C'、a → 'a'、1 → '1'，每键都经
      QXkbCommon::lookupString(state, code) 取文本、QXkbCommon::keysymToQtKey(sym, mods, state, code)
      与 QXkbCommon::modifiers(state) 取 Qt 侧键值；
      ③ **产出文本逐字符比对**必须等于字面量 "Ca1"（不是计数，是载荷比对）；
      ④ Shift 层不是硬编码：用例用 QXkbCommon::qxkbcommon_xkb_keysym_to_upper()（第三方 TU）
      由基础层**推导**出 Shift 层并要求相等 —— 该 TU 若被抽空/打桩，用例即失败；
      ⑤ 反向通路亦覆盖：由会话产出的 Qt 键构造 QKeyEvent，
      QXkbCommon::toKeysym() 得到的 keysym 必须映回同一 Qt 键，且
      xkb_keysym_to_utf32() 与会话自身 keysym 表示同一字符。
      实测输出（`conan create` 全流程）：
        ok   - typing session through QXkbCommon produced exactly "Ca1"
        ok   - Shift+c produced Qt::Key_C
        ok   - Shift level equals qxkbcommon_xkb_keysym_to_upper(base level)
        ok   - QXkbCommon::modifiers reports Shift while it is held
        ok   - round trip: the keysym maps back to the same Qt key
        assertions=15 failures=0
        hongmeng_e2e_flow=PASS
      开发中真实踩到 2 个我自己写错的预期（均非模块缺陷，已改正为模块的真实契约）：
      ① 误以为 toKeysym(Qt::Key_A) 会返回会话里的 XKB_KEY_a；实测模块对表外键走
      Unicode 形式回落（0x01000061），故断言改为「映回同一 Qt 键 + 表示同一字符」；
      ② 误用大小写折叠比较两种形式，改用 xkb_keysym_to_utf32() 判字符等价。
      开发记录见 notes.md §12。任一断言失败即以非零码退出（ctest 记为真实失败）。
    command: "ctest --test-dir <build> --output-on-failure (xkbcommon_typing_e2e)"

# 断言总数：上游 0 + test_package 实测 18（test_xkbsupport，设备上直接运行，
# 实测行 `assertions=18 failures=0`，退出码 0）+ 端到端用例实测 15
# （e2e/xkbcommon_e2e.cpp，`assertions=15 failures=0`、`hongmeng_e2e_flow=PASS`）
# = 33。另有 2 条 CMake configure 期断言（见上 CMakeLists.txt 条目），不计入该数——
# 它们在 `find_package` 阶段以 FATAL_ERROR 生效，不产生 assertions= 计数。
assertion_count: 33
assertion_count_status: "executed (18 test_package + 15 end-to-end case, 0 failed, exit 0) + 1 end-to-end consumer case (PASS)"

# 鸿蒙特有测试数 = 1（rule 12）：xkbcommon_typing_e2e 是完整流程用例
# （模拟打字会话、产出文本逐字符比对、Shift 层由第三方 TU 推导、双向往返），
# 不是纯断言。
hongmeng_specific_tests: 1
ctest_cases: 2
e2e_consumer_case:
  name: xkbcommon_typing_e2e
  kind: full-consumer-flow
  transport: "自包含 XKB keymap -> 活 xkb_state -> QXkbCommon 翻译路径（无 socket/无显示依赖）"
  evidence: "hongmeng_e2e_flow=PASS; 打字会话产出 \"Ca1\" 逐字符一致；Shift 层由 qxkbcommon_xkb_keysym_to_upper 推导"
  verified_output: "100% tests passed, 0 tests failed out of 2"
