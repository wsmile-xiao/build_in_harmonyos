# conandata.yml — qt5-xkbcommon-support 5.15.19 (HarmonyOS PC)
#
# This package builds ONLY the Qt5 module QtXkbCommonSupport
# (qtbase/src/platformsupport/input/xkbcommon) out of the official Qt 5.15.19
# source archive, so it is deliberately smaller than the 664 MB
# qt-everywhere bundle: the official qtbase submodule archive is used.
#
# R39: the official Qt release host (download.qt.io) stays in the list; the
# reachable mirrors are listed first because CI mirror-fallback does not cover
# download.qt.io for every worker.
