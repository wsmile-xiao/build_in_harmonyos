software: qt5-xkbcommon-support
description: "Qt5 QtXkbCommonSupport module split out of qtbase - libQt5XkbCommonSupport.a, Qt5::XkbCommonSupportPrivate CMake target and the qmake module pri"
category: qt-core
license: "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
homepage: "https://code.qt.io/cgit/qt/qtbase.git/tree/src/platformsupport/input/xkbcommon"
build_system: custom
versions:
  "5.15.19":
    status: built
    build_date: "2026-09-28"
    note: >
      Module-split package: the published OHOS Qt5 packages were configured with
      -no-xkbcommon, so this builds only that module out of the official
      qtbase 5.15.19 archive and installs it in normal Qt5 module layout.
      Required by kwayland5/5.116.0 (Qt::XkbCommonSupportPrivate) and
      qtwayland 5.15 (qmake QT_FOR_PRIVATE += xkbcommon_support-private).
    test_results:
      upstream: >-
        The QtXkbCommonSupport module ships no tests of its own: its source
        directory holds four files (qxkbcommon.cpp, qxkbcommon_3rdparty.cpp,
        qxkbcommon_p.h, xkbcommon.pro) and xkbcommon.pro declares no test
        target. The xkbcommon-related cases in Qt live in the whole qtbase
        tests/auto tree and need a complete Qt build plus a QPA environment, so
        upstream_tests = 0. Reported as measured, not inflated.
      consumer: >-
        test_package: a real consumer configures with
        find_package(Qt5XkbCommonSupport REQUIRED) (asserting the
        Qt5::XkbCommonSupportPrivate target exists and that the archive its
        IMPORTED_LOCATION points at is a real file -- 2 configure-time
        FATAL_ERROR contracts on this branch) and runs 18 API assertions over
        both translation units against a live xkb_state.
      hongmeng_e2e_flow: >-
        rule-12 Hongmeng-specific test / complete consumer use case (ctest case
        xkbcommon_typing_e2e): the module's job is turning keyboard input into Qt
        key events and text, so the case performs a full simulated typing session
        through the module's own translation path. A self-contained XKB keymap
        (no include directives, so nothing is read from the absent
        /share/X11/xkb data dir) is compiled into a live xkb_keymap/xkb_state;
        the session types "Ca1" via QXkbCommon::lookupString() for the text and
        QXkbCommon::keysymToQtKey(sym, mods, state, code) plus
        QXkbCommon::modifiers() for the Qt key, and the produced text must equal
        the literal character for character. The Shift level is not hard-coded:
        it is derived with QXkbCommon::qxkbcommon_xkb_keysym_to_upper() (the
        third-party translation unit), so a stubbed/empty TU fails the case. The
        reverse path is covered too (QKeyEvent -> toKeysym() -> maps back to the
        same Qt key, and denotes the same character via xkb_keysym_to_utf32).
        Measured: assertions=15 failures=0, hongmeng_e2e_flow=PASS, ctest
        "100% tests passed, 0 tests failed out of 2", conan create exit 0.
      pass_rate: "ctest 2/2 (100%); test_package 18/18 runtime + 2/2 configure-time assertions; 1/1 end-to-end consumer case"
