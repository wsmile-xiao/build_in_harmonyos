software: qt5-qtgraphicaleffects
# 版本级 manifest 模板
# 文件位置: archives/q/qt5-qtgraphicaleffects/5.15.2/manifest.yaml

version: "5.15.2"

# 编译状态
status: built

# 编译日期
build_date: "2026-05-31"

source:
  url: "https://code.qt.io/cgit/qt/qtgraphicaleffects.git"
  sha256: ""
  tar_format: tar.gz

build:
  system: qmake
  configure_options:
    - "qmake qtgraphicaleffects.pro"
  dependencies:
    - qt5-qtbase/5.15.2
    - qt5-qtdeclarative/5.15.2
  cc: clang
  cxx: clang++
  mkspec: harmonyos-clang

patches_applied: []

packaging:
  aarch64: qt5-qtgraphicaleffects-5.15.2-aarch64.tar.gz
  aarch64-debug: qt5-qtgraphicaleffects-5.15.2-aarch64-debug.tar.gz

knowledge_gained:
  - "qt5-qtgraphicaleffects requires qtdeclarative (Qt Quick/QML), not just qtbase"
  - "Qt5 addon QML modules need QT += quick qml in their .pro files"
  - "ELF signing required for Qt5 tools (qlalr, qmlcachegen) on HarmonyOS"
  - "HMDFS symlinks for .so files need rm -f && ln -s workaround"
  - "libc++_shared.so needs to be copied from OHOS SDK and signed for Qt5 tools to work"