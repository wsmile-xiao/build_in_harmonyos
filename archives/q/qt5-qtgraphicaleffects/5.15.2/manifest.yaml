software: qt5-qtgraphicaleffects
# 版本级 manifest 模板
# 文件位置: archives/q/qt5-qtgraphicaleffects/5.15.2/manifest.yaml

version: "5.15.2"

# 编译状态
status: published

# 编译日期
build_date: "2026-08-22"

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtgraphicaleffects-everywhere-src-5.15.2.tar.xz"
  sha256: "ec8d67f64967d5046410490b549c576f9b9e8b47ec68594ae84aa8870173dfe4"
  tar_format: tar.xz

build:
  system: qmake
  configure_options:
    - "qmake -spec linux-clang qtgraphicaleffects.pro"
  dependencies:
    - qt5-qtbase/5.15.2.2
    - qt5-qtdeclarative/5.15.2
  cc: clang
  cxx: clang++
  mkspec: linux-clang

patches_applied: []

packaging:
  conan_recipe: true
  conanfile: conanfile.py
  conandata: conandata.yml
  test_package: test_package/

knowledge_gained:
  - "qt5-qtgraphicaleffects is a QML plugin module built with qmake, producing .so plugin under qml/QtGraphicalEffects/"
  - "qmake requires qt5-qtdeclarative's mkspecs .pri files to be merged into qt5-qtbase's mkspecs/modules/ for module detection"
  - "The .pri files from qt5-qtdeclarative contain hardcoded build-directory paths that must be fixed for relocatability"
  - "QML .qml resource files from src/effects/ must be copied to qml/QtGraphicalEffects/ during packaging"
  - "No source modifications required for HarmonyOS - the module builds cleanly with the right mkspecs setup"
