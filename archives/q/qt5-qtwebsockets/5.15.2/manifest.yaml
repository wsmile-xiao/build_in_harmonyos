# 版本级 manifest
# 文件位置: archives/q/qt5-qtwebsockets/5.15.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.15.2"

# 软件名
software: "qt5-qtwebsockets"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-06"
build_system: qmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方单条，R39）
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtwebsockets-everywhere-src-5.15.2.tar.xz"

  # 源码校验和（清华 tuna / 中科大 ustc / download.qt.io 三源实测一致）
  sha256: "a0b42d85dd34ff6e2d23400e02f83d8b85bcd80e60efd1521d12d9625d4a233f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: qmake

  # 配置选项列表
  configure_options:
  - "-spec linux-clang"
  - "QMAKE_STRIP="

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "qt5-qtbase/5.15.2.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "qmake 构建 Qt5 模块沿用 qt5-qtcharts/qtmultimedia 模式：私有可写 Qt prefix 镜像 qtbase（symlink + 重写 mkspecs 中 .pri 的 build-dir 引用）+ qmake -spec linux-clang"
- "私有 mkspecs 中开启 private_tests 特性后，tests/auto/websockets 的 6 个私有测试目录（websocketprotocol/dataprocessor/websocketframe/handshakerequest/handshakeresponse/qdefaultmaskgenerator）才会被 websockets.pro 纳入 SUBDIRS"
- "上游私有测试链接私有类（QWebSocketFrame/QWebSocketHandshakeRequest 等）要求 reduce_exports 特性挪到 disabled_features（Qt developer-build 等效）——特性只能挪不能删，删除会使 qtConfig() 报 Could not find feature"
- "缓存中 qt5-qtbase 包的 mkspecs 可能被同仓其他 Qt5 模块构建污染（qt_lib_qml*.pri 等外来 pri 指向其他 conan 缓存包），需剪枝保证构建封闭性；原始 CI 下载的 qtbase 包此步为空操作"
- "tst_* 测试可执行文件执行前用 binary-sign-tool -selfSign 1 签名（coinutils 先例）；打包 .so 同样签名（qrencode 先例）"
- "make install 必须 STRIP=true（qmake strip --strip-unneeded 破坏动态符号表导致 dlopen 失败）"
- "打包后需重写 .prl/.la/.pc 中残留的 build-dir/source-dir 路径为 package_folder"
- "tst_QWebSocket::tst_errorString 预期 HostNotFoundError，但构建环境 DNS 对任意域名返回 fake-IP（198.18.0.101），实际得到 RemoteHostClosedError——环境限制，已列入 conanfile 白名单并文档化"
