# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qtwebsockets/5.15.2
homepage: https://www.qt.io/

# 上游测试命令：tests/auto/websockets 共 9 个 QTest 套件（67 个测试函数 /
# 7322 个数据用例），在 conanfile.py 的 build() 内以 qmake 生成、make 构建、
# `make check -k` 在 127.0.0.1 回环上执行（tst_* 先经 binary-sign-tool 签名）。
upstream_check_command: "cd tests/auto/websockets && qmake websockets.pro && make check -k"
upstream_test_in_build: true
upstream_test_command: "cd tests/auto/websockets && qmake -spec linux-clang websockets.pro && make -j4 && make check -k"

upstream_test_changes: []

# 上游测试套件位置
upstream_tests:
  - name: "QtWebSockets auto tests (tests/auto/websockets)"
    source: qtwebsockets-everywhere-src-5.15.2/tests/auto/websockets/
    description: "9 个 QTest 套件：qwebsocketcorsauthenticator/qwebsocket/qwebsocketserver（公开 API）+ websocketprotocol/dataprocessor/websocketframe/handshakerequest/handshakeresponse/qdefaultmaskgenerator（私有 API，private_tests 特性开启后进入）"
    count: 7322

# test_package 中自带的测试（消费者视角验证：链接 libQt5WebSockets 并完成
# 127.0.0.1 回环 RFC 6455 echo 往返）
test_package_tests:
  - file: test.cpp
    description: "QWebSocketCorsAuthenticator API 覆盖（origin/allowed/copy）+ QWebSocketProtocol::Version13 枚举 + QWebSocketServer/QWebSocket 在 127.0.0.1 回环上的真实 echo 往返（connect → sendTextMessage → 收到相同负载 → close）"
    command: "./test_qt5_qtwebsockets"

assertion_count: 7325
