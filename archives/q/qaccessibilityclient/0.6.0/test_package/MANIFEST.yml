# test_package/MANIFEST.yml
# 上游官方测试声明文件 — qaccessibilityclient 0.6.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qaccessibilityclient/0.6.0
homepage: "https://invent.kde.org/libraries/libqaccessibilityclient"

# 上游 0.6.0 唯一自动化测试入口: tests/auto/tst_accessibilityclient.cpp
# (QtTest, 经 tests/auto/CMakeLists.txt add_test 注册，名称
# libkdeaccessibilityclient-tst_accessibilityclient；simplewidgetapp 为
# 其 QProcess 辅助程序，非独立测试)。上游另有 examples/dumper（非测试）。
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error --timeout 90 (QT_QPA_PLATFORM=offscreen)"

# 上游实际运行的测试程序。
# 纯逻辑槽 (tst_registry/tst_accessibleObject/tst_hashable) 无需总线，
# offscreen 下通过；访问活动无障碍树的槽 (tst_application/tst_navigation/
# tst_focus/tst_states/tst_extents/tst_characterExtents) 依赖 AT-SPI2
# a11y session bus —— OHOS 构建机默认无该总线，属运行环境限制，
# 按 karchive/kdbusaddons 先例记录结果、不阻塞包创建。
upstream_tests:
  - name: libkdeaccessibilityclient-tst_accessibilityclient
    description: "上游唯一 QtTest 单测：Registry 订阅状态、AccessibleObject 有效性、哈希、以及经 AT-SPI 总线的应用树浏览/焦点/状态/几何查询（后者需 a11y session bus）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_qaccessibilityclient.cpp
    description: "消费者测试：find_package(QAccessibilityClient6) 并链接导出目标 QAccessibilityClient6（上游 install(EXPORT) 未设 NAMESPACE，为裸目标名，inspector 以同方式消费），复现上游 headless-safe 槽的断言（订阅状态、AccessibleObject 有效性）"
    command: "./test_qaccessibilityclient"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
