package: qdirstat/2.0
homepage: "https://github.com/shundhammer/qdirstat"

# Upstream's test/ directory contains only a data fixture and a file generator;
# there is no automated test target in qdirstat.pro or src/src.pro.
upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: null
upstream_tests: []

test_package_tests:
  - file: test.cpp
    description: "Launch the installed GUI program offscreen, check its help text and documented exit status"
    command: "qdirstat_consumer"

assertion_count: 2
