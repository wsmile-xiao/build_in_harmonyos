# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qrcodegen/1.8.0
homepage: "https://github.com/nayuki/QR-Code-generator"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 C++ 实现 (cpp/ 子目录) 仅提供 Makefile 构建库与 demo 程序，
# 无测试目标、无测试源文件 (C 实现才有 qrcodegen-test.c，C++ 实现没有)。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 cpp/ 目录无任何测试程序 — N=0 (无测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：encodeText/encodeBinary/QrSegment 全 API 真实调用 + QR 码结构断言（版本/尺寸/查找图形/时序线/纠错级别单调性/暗模块计数，共 12 项断言）"
    command: "./test_qrcodegen"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
