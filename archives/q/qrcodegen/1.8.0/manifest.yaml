# 版本级 manifest — qrcodegen 1.8.0 (C++ implementation, Project Nayuki)
# 文件位置: archives/q/qrcodegen/1.8.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.0"

# 软件名
software: "qrcodegen"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub release；CI 自动注入镜像 fallback）
  url: "https://github.com/nayuki/QR-Code-generator/archive/refs/tags/v1.8.0.tar.gz"

  # 源码校验和
  sha256: "2ec0a4d33d6f521c942eeaf473d42d5fe139abcfa57d2beffe10c5cf7d34ae60"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "CMAKE_SYSTEM_NAME=OHOS (由 conan profile 驱动)"
  - "BUILD_SHARED_LIBS=OFF (默认静态)"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "上游 tarball 为多语言实现合集，C++ 库位于 cpp/ 子目录（qrcodegen.cpp/qrcodegen.hpp），source() 需将 cpp/ 提升到根（同 libqrcodegen C 版先例）"
- "上游 cpp/ 仅提供 Makefile（无 CMakeLists、无 configure），source() 内联生成 CMakeLists.txt 以接入 Conan CMake 工作流"
- "上游 C++ 实现无测试套件（C 实现才有 qrcodegen-test.c），N=0，消费者测试补全（test.cpp 12 项断言）"
- "OHOS conan create test 阶段 C++ 探针需 -static-libstdc++ 静态链 libc++，规避 libc++_shared.so 运行时搜索问题（argp-standalone 先例）"
