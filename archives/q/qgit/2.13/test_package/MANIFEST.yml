version: 1
package: qgit/2.13
homepage: https://github.com/tibirna/qgit

tests:
  package:
    status: planned
    command: "qgit --version && qgit --help (QT_QPA_PLATFORM=offscreen)"
    description: >
      Smoke test of the packaged qgit binary. Both options are handled by
      QCommandLineParser before the GUI event loop starts, so they run
      headless. Upstream qgit ships no test suite (no tests/ directory and
      no add_test() in CMakeLists.txt — verified against qgit-2.13).

notes:
  - "Runtime needs git on PATH for normal operation; not required for the --version/--help smoke test."
