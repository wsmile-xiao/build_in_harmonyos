# 版本级 manifest — qgit 2.13
# 文件位置: archives/q/qgit/2.13/manifest.yaml

version: "2.13"
software: qgit
status: published
build_date: "2026-09-28"
build_system: cmake

source:
  url: "https://github.com/tibirna/qgit/archive/refs/tags/qgit-2.13.tar.gz"
  sha256: "9fa64b011963b7b876b8634b140ec5339a81a422317df71b619fcee5740a364a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies:
    - qt5-qtbase/5.15.2.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-qt5-automoc-autouic-autorcc.patch"

knowledge_gained:
  - "CMakeDeps 生成的 Qt5 聚合配置不含 Qt5::uic / Qt5::rcc 可执行目标，qt5_wrap_ui()/qt5_add_resources() 宏会因找不到 uic/rcc 失败；改为开启 CMAKE_AUTOUIC/CMAKE_AUTORCC 并在 generate() 显式注入 CMAKE_AUTOUIC_EXECUTABLE / CMAKE_AUTORCC_EXECUTABLE（指向 qt5-qtbase 包内 bin/uic、bin/rcc），.ui 文件与 .qrc 直接作为 target 源文件传入"
  - "find_package(QT NAMES Qt6 Qt5) 的 NAMES 技巧依赖 Qt5Config.cmake 定义 QT_VERSION_MAJOR，Conan CMakeDeps 生成的 Qt5 配置不提供该变量；消费配方应显式 find_package(Qt5 COMPONENTS ...) 并自行 set(QT_VERSION_MAJOR 5)"

notes: |
  qgit 2.13 是 Qt5 Widgets GUI 应用（git 历史查看器），在鸿蒙PC aarch64 上原生构建。
  - 依赖 qt5-qtbase/5.15.2.2（Core/Gui/Widgets，CMakeDeps 聚合 Qt5Config）
  - 上游无测试套件（无 tests/ 目录，CMakeLists.txt 无 add_test）；
    test_package 以 qgit --version / --help 冒烟测试（QCommandLineParser 在 GUI 事件循环前处理，
    QT_QPA_PLATFORM=offscreen 下无头可跑，实测输出 "QGit 2.13"）
  - 运行时依赖 PATH 中的 git（冒烟测试不需要）
