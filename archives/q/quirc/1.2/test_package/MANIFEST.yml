# test_package/MANIFEST.yml — quirc/1.2 上游测试声明
#
# 上游 quirc 1.2 没有自动化测试套件（清点证据见下与 notes.md）：
# - Makefile 无 check 目标（`make -n check` 无此目标）
# - 无任何测试框架注册宏（TEST_CASE/add_test/ctest/pytest 均无，静态清点 0 条）
# - tests/ 目录是 3 个手动工具：qrtest.c（目录扫描解码器，需 libjpeg/libpng
#   与外部图片素材）、inspect.c（需 SDL + SDL_gfx）、inspect_opencv.cxx（需 OpenCV）
# - 仓库不自带任何测试图片素材

package: quirc/1.2
homepage: "https://github.com/dlbeer/quirc"

# 上游测试命令（make -n check 分析：上游无 check 目标）
upstream_check_command: "none (no check target in upstream Makefile)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（qrtest 为上游自带测试工具，已在设备实测）
upstream_tests:
  - file: tests/qrtest.c
    source: quirc-1.2/tests/qrtest.c
    description: "上游目录扫描测试工具：加载 JPEG/PNG 图片解码 QR 并报告成功率；已在 OHOS 设备用 libjpeg-turbo+libpng 构建并对 3 张生成 QR PNG 实测，3/3 解码成功（qrtest 路径；inspect 系工具需 SDL/OpenCV 交互环境未执行）"
    command: "./qrtest <image-dir>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.c
    description: "消费者测试：把内嵌的已知 QR 矩阵（v1/L/mask0，payload 'quirc-1.2-ohos'）经 quirc_new/quirc_resize/quirc_begin/quirc_end/quirc_count/quirc_extract/quirc_decode 解码，断言 payload 长度/内容、version/ecc_level/mask/data_type 与网格尺寸；含全白图 0 码行为测试；退出码判定"
    command: "./test_quirc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
