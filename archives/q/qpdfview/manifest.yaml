# 软件级 manifest — qpdfview
# 遵循 ARCHIVE-SPEC v2.0

software: qpdfview
# 文件位置: archives/q/qpdfview/manifest.yaml

# ============================================================
# 软件描述
# ============================================================

description: "qpdfview — 基于 Qt5 + poppler 的标签页式文档查看器"

# 软件主页
homepage: https://launchpad.net/qpdfview

# 源码仓库
repository: https://launchpad.net/qpdfview

# 许可证
license: GPL-2.0-or-later

# ============================================================
# 分类信息
# ============================================================

category: office

tags:
  - pdf
  - document-viewer
  - qt5
  - gui

build_system: qmake

# ============================================================
# OHOS 适配要点
# ============================================================

ohos_adaptation:
  key_points:
    - "Qt5 GUI 标签页式文档查看器；顶层 qpdfview.pro 为 TEMPLATE=subdirs，拆成 application.pro + {pdf,ps,djvu,image}-plugin.pro 各自独立链接"
    - "registry 无 poppler 的 Qt5 绑定制品（poppler 25.12.0.2 为 ENABLE_QT5=OFF），且 W0/PF4 禁止在同一 PR 捎带适配依赖 → build() 内**内嵌编译**上游 poppler-25.12.0 自带的 qt5/src/*.cc 为**静态库** libpoppler-qt5.a，直接链入 pdf 插件，不安装进 package"
    - "qt5-qtbase/5.15.2 为 -no-widgets 构建（qpdfview 声明 QT += widgets）→ 改用 5.15.2.2；qt5-qtsvg/5.15.2 声明精确 5.15.2 → override 统一（补丁版本 API 兼容，实测两者预编译包 id 一致）"
    - "qmake 模块发现：_setup_qmake_modules() 复制 qt5-qtsvg 的 mkspecs/modules/*.pri 并正则改写构建期绝对路径（.conan2/p/b/...）为 package 目录，经 QMAKEMODULES 提供（baka 先例同解）"
    - "qmake 编译器探测走裸名字 PATH 查找（E540）→ build_env.prepend_path(PATH, <clang 目录>)；QMAKE_CC/QMAKE_CXX/QMAKE_LINK 由 tools.build:compiler_executables 提供（R33，禁止裸用 ${CC}）"
    - "poppler-form.h 无条件使用 std::optional → qmake 命令行强制 CONFIG+=c++17（上游默认 c++11 不够）"
    - "pkg-config 探测收敛：PKG_CONFIG_LIBDIR 只指向配方生成的 vendor 目录，使 pkg-config --exists synctex 恒为假（否则命中 poppler 自带 synctex.pc、链不到 synctex_scanner_* 符号）；生成的 poppler-qt5.pc 刻意不带 Requires"
    - "内嵌 cmake 子工程与 qpdfview 本体解耦（独立 build 目录 + 独立 config.h 占位），避免 synctex 探测被 Qt5Core 头干扰"
    - "config.h 单行转发 #include <poppler/poppler-config.h>：依据 poppler-config.h 自带说明 + 逐条核查 qt5/src 引用的 config.h.cmake 宏与安装头唯一未公开宏 ENABLE_ZLIB_UNCOMPRESS（上游关闭）"
    - "多前缀 conan Qt 安装 → qmake 命令行 QMAKE_RPATHDIR+= 补 Qt5Svg/libpoppler/freetype/lcms2/fontconfig/expat/zlib 的 lib 目录进 RUNPATH（实测 prepend 生效）"
    - "zlib 不进 LIBRARY_PATH：-lz 必须解析到 OHOS NDK sysroot 的 libz.so（无 SONAME → DT_NEEDED 保持 libz.so，与 libQt5Core.so 一致）；conan zlib/1.3.1.1 仅作依赖图一致性 override"
    - "QMAKE_STRIP= 置空 + package() 最后一步 binary-sign-tool sign -selfSign 1（OHOS 加载器拒绝 stripped ELF 且要求代码签名）"
    - "插件安装到 <pkg>/bin：sources/pluginhandler.cpp 优先查 QApplication::applicationDirPath()，回落到编译期 PLUGIN_INSTALL_PATH"
    - "运行期环境三件套经 package_info() 注入：LD_LIBRARY_PATH（全部依赖 lib）、QT_PLUGIN_PATH（qtsvg 的 iconengines/imageformats）、FONTCONFIG_PATH（conan fontconfig 的 etc/fonts）"
    - "上游 UI 翻译不可用：translations/*.ts 需 lrelease，制品仓 qt5-qttools 缺位、系统无 lrelease → 无可执行 .qm，按上游默认（不存在即不装）"
  common_dependencies:
    - "qt5-qtbase (published 5.15.2.2)"
    - "qt5-qtsvg (published 5.15.2)"
    - "poppler (published 25.12.0.2)"
    - "fontconfig (published 2.18.1.1)"
    - "zlib (published 1.3.1.1, override only)"
    - "expat (published 2.8.2.1)"
  disabled_upstream_components:
    - "ps-plugin — libspectre 不在制品仓 (CONFIG+=without_ps)"
    - "djvu-plugin — djvulibre 不在制品仓 (CONFIG+=without_djvu)"
    - "sql/QSettings — qt5-qtbase/5.15.2.2 未构建 Qt5Sql (CONFIG+=without_sql)"
    - "cups 打印 — 无 Qt5PrintSupport cups 插件 (CONFIG+=without_cups)"
    - "UI 翻译 — 无 lrelease，57 个 .ts 无法编译为 .qm"

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "0.5.0"
    status: built
    build_system: qmake
    note: >-
      HarmonyOS PC aarch64 首次适配。内嵌 poppler-qt5 静态绑定规避
      「registry 无 poppler-qt5 制品 + W0/PF4 禁止捎带适配依赖」的双重约束；
      test_package 20 条断言（包内容完整性 6 + --help 冒烟 1 + 插件端到端 13），
      覆盖 dlopen / loadDocument / 页面尺寸 / 文本抽取 / 检索 / 渲染全链路。
      已知功能性缺失：UI 翻译（无 lrelease）、PS/DjVu 插件、PDF 打印。
