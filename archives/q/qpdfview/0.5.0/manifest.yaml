# 版本级 manifest — qpdfview 0.5.0
# 遵循 ARCHIVE-SPEC v2.0（仓库无该文件，结构以 templates/manifest-version.yaml 为准）

version: "0.5.0"
software: "qpdfview"
status: built
build_date: "2026-09-29"
build_system: qmake

# ============================================================
# 源码信息
# ============================================================

source:
  # Launchpad 官方发布页 tarball（R39 / PF7：非 Debian 的 +ds 重打包）
  url: "https://launchpad.net/qpdfview/trunk/0.5.0/+download/qpdfview-0.5.tar.gz"
  sha256: "44efc440a461cbdd757a9b396f1461ee7a2f4364e81df55bd0221f910219be99"
  tar_format: tar.gz
  # 配方 source() 内额外拉取 poppler 源码包，仅取 qt5/src/*.cc 内嵌编译
  extra_sources:
    poppler:
      url: "https://poppler.freedesktop.org/poppler-25.12.0.tar.xz"
      sha256: "c18b40eb36b1a0c5b86e29ca054bf0770304583da4f2cdd42fe86eca6a20de48"

# ============================================================
# 构建配置
# ============================================================

build:
  system: qmake
  configure_options:
    - "CONFIG+=without_ps"
    - "CONFIG+=without_djvu"
    - "CONFIG+=without_sql"
    - "CONFIG+=without_cups"
    - "CONFIG+=c++17"
    - "QMAKE_STRIP="
  # 制品仓已发布依赖（requirements()）
  dependencies:
    - "qt5-qtbase/5.15.2.2"
    - "qt5-qtsvg/5.15.2"
    - "poppler/25.12.0.2"
    - "fontconfig/2.18.1.1"
    - "zlib/1.3.1.1"
    - "expat/2.8.2.1"
  # 制品仓无配方、在 build() 内内嵌编译的代码（不安装进 package）
  vendored:
    - "poppler-qt5（上游 poppler-25.12.0/qt5/src/*.cc，cmake+Ninja 编成静态库 libpoppler-qt5.a 链入 pdf 插件）"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试（R51 三步法）
# ============================================================

tests:
  upstream:
    present: false
    evidence: >-
      上游源码包内无 tests/ 目录、无 ctest/pytest 配置、无 make check 目标
      （qpdfview.pro 仅 TEMPLATE=subdirs + TRANSLATIONS）。57 个 .ts 为翻译源。
  added:
    location: test_package/
    assertion_count: 20
    coverage: >-
      包内容完整性 6 + qpdfview --help 冒烟 1 + 插件端到端 13
      （dlopen libqpdfview_pdf.so → instance()/IID → qobject_cast →
      loadDocument → numberOfPages/page/text/search/render 非白像素）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "registry 无 poppler-qt5 制品且 W0/PF4 禁止捎带适配依赖时，可在 build() 内嵌编译上游 poppler 自带 qt5/src/*.cc 为静态库直接链入插件，不新建独立包、不安装进 package"
  - "qmake 应用集成 conan Qt：qt5-qtsvg 的 mkspecs/modules/*.pri 记录构建期绝对路径（.conan2/p/b/...），必须复制到 build 目录并正则改写为 package 目录后经 QMAKEMODULES 暴露（qmake 报 Unknown module(s) in QT: ... svg）"
  - "qmake 探测目标编译器用裸名字走 PATH（同类 PATH 缺失：E540）→ 必须 build_env.prepend_path(PATH, clang 目录)；编译器本身走 tools.build:compiler_executables（R33）"
  - "poppler 25.12 头文件无条件使用 std::optional → qmake 需 CONFIG+=c++17；内嵌 poppler-qt5 的 cmake 子工程因 libc++ 需 -fexperimental-library（C++23）"
  - "poppler 源码树自带 synctex.pc，pdf-plugin.pro 的 pkg-config --exists synctex 会误命中并链接失败 → PKG_CONFIG_LIBDIR 收敛到配方生成的 vendor 目录使探测恒为假，走上游捆绑 synctex 源码分支"
  - "poppler 只装 poppler/poppler-config.h，未装 qt5 绑定 include 的 config.h → 生成单行转发 #include <poppler/poppler-config.h> 即可（poppler-config.h 自带说明 + 逐宏核查）"
  - "多前缀 conan Qt 依赖链：qmake 需显式 QMAKE_RPATHDIR+= 各依赖 lib 目录（否则运行期 Error loading shared library libQt5Svg.so.5）"
  - "内核要求 ELF 带有效 .codesign 段才能加载（E077 / E045）且改写 ELF 会使签名失效 → QMAKE_STRIP= 置空 + package() 末尾对 bin/ 下 ELF 执行 binary-sign-tool sign -selfSign 1"
  - "LIBS += -lz 应解析到 OHOS NDK sysroot 的无 SONAME libz.so（DT_NEEDED 保持 libz.so，与 libQt5Core.so 一致）；conan zlib 仅作依赖图 override 不参与链接路径"
  - "改写 .pri 内构建期路径的正则必须锚定到 `/`（r\"/[^\\s]*?conan2/p/b/[^/\\s]+/b\"）：若允许匹配行首任意非空白字符，`include(/…/qt_lib_svg.pri)` 的 `include(` 会被一并吃掉，得 `…/b/…)`，qmake 仍报 Unknown module(s) in QT: svg"
  - "内嵌 poppler-qt5 时，上游只把公开头（poppler-qt5.h/poppler-link.h/poppler-annotation.h/poppler-form.h/poppler-optcontent.h/poppler-page-transition.h/poppler-media.h）装进 include/poppler/qt5；生成的 .pc `Cflags: -I<include_dir>` 指向的目录里必须同步复制这些公开头（含生成头 poppler-export.h/poppler-version.h），否则引用方编译报 poppler-qt5.h file not found"
  - "Conan 2 的 self.dependencies 不可按名字迭代（无 __iter__，_data 的 key 是 Requirement 对象）：遍历必须 self.dependencies.items() 且 key 取 require.ref.name；直接 sorted(self.dependencies) 会报 TypeError（Requirement 不可比 / int not iterable）"
