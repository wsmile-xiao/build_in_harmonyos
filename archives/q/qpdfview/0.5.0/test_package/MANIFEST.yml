package: qpdfview/0.5.0
upstream_test_in_build: false
upstream_tests: []
test_package_tests:
  - file: test.cpp
    description: "插件端到端：dlopen libqpdfview_pdf.so，经 qpdfview::Plugin 接口真实加载 PDF、渲染页面、抽取/检索文本"
    command: "./test_probe <bindir> libqpdfview_pdf.so test.pdf"
  - file: conanfile.py
    description: "包内容完整性（bin/ 可执行文件与插件、desktop/man/icon）+ qpdfview --help 冒烟"
    command: "qpdfview --help"
assertion_count: 20
