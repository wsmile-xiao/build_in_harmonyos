# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "QUIC 特性选型：默认 boring-quic-api（BoringSSL 兼容 API）与原生 quic 栈互斥（Configure L1221 硬闸）；生态（libmsquic/lsquic）消费前者 (ref: DRAFT-14402)"
- "3.3.0 + --with-rand-seed=getrandom 完全排除 DEVRANDOM 块（configdata 0 次出现），3.5.x 的 -D__MUSL__ + FD_SET 有界补丁不需要；直接移植因 ossl_inline 未定义编译失败（3.3.0 sockets.h 未含 macro.h） (ref: DRAFT-14403, DRAFT-14404)"
- "原生 quic 栈 70-test_quic_{tserver,multistream} 有 2 套确定性上游缺陷（quic_tls.c:768 扩展注册 INTERNAL_ERROR，与平台无关） (ref: DRAFT-14402)"
- "3.3.0 与 3.5.x API 签名差异：X509_set_subject_name 2 参 / SSL_get_peer_quic_transport_params 3 参 / EVP_EncryptInit_ex 5 参 (ref: test_package/test_quictls.c 14 项断言实测)"

