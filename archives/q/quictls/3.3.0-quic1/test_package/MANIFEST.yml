# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: quictls/3.3.0-quic1
homepage: "https://github.com/quictls/openssl"

# 上游测试命令 (OpenSSL 系使用 `make test`，内部是 test/run_tests.pl + prove)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (harness 驱动的 Perl 测试套件，312 文件 / 3185 tests)
# 实测 2026-09-29（交付配置 boring-quic-api 模式）：Result: PASS，0 失败，
# 68 文件级 skip（含 70-test_quic_* 14 套按设计 skip：quic 特性禁用时自跳过）
upstream_tests:
  - file: test/run_tests.pl
    source: openssl-3.3.0-quic1/test/run_tests.pl
    description: "OpenSSL 官方测试套件 harness（TLS/加密算法/证书/X509/QUIC 等，312 .t 文件 / 3185 tests）"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_quictls.c
    description: "消费者测试：加密核心 7 项 + QUIC-TLS provider API（boring-quic 系）7 项"
    command: "./test_quictls"

# 测试断言总数 (近似值)
assertion_count: 14

tests:
  - id: T1
    name: version string contains 3.3.0+quic (fork 身份)
  - id: T2
    name: SHA-256('abc') known vector
  - id: T3
    name: AES-256-GCM round trip
  - id: T4
    name: EC P-256 keygen + sign/verify
  - id: T5
    name: RAND_bytes entropy
  - id: T6
    name: TLS 1.3 context
  - id: T7
    name: X.509 self-signed cert + verify
  - id: T8
    name: SSL_set_quic_method (boring-quic API 接入)
  - id: T8b
    name: SSL_is_quic
  - id: T9
    name: SSL_set_quic_transport_params
  - id: T9b
    name: peer transport params absent pre-handshake
  - id: T10
    name: SSL_quic_read_level / SSL_quic_write_level = initial
  - id: T11
    name: SSL_quic_max_handshake_flight_len callable
  - id: T12
    name: SSL_process_quic_post_handshake pre-handshake guard == 0
