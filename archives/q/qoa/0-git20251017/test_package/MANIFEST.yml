# test_package/MANIFEST.yml
# qoa 0-git20251017
# 上游没有可自动化运行的测试套件：Makefile 只有 qoaplay/qoaconv 两个
# 构建目标（无 install、无 test/check）；qoaconv 依赖上游不随源码分发
# 的第三方单头库 dr_mp3.h/dr_flac.h（可用 -D 开关去掉 MP3/FLAC，但
# qoaplay 硬依赖 sokol_audio.h + ALSA，离线不可构建）；fuzz/ 不在该
# 快照内。按赛事规则说明原因并自补消费者测试（与同作者已归档先例
# qoi/0-git20251213 的处理方式一致）。

package: qoa/0-git20251017
homepage: "https://github.com/phoboslab/QOA"

upstream_tests_exist: false
upstream_test_audit: >
  QOA 快照 ae07b57deb98127a5b40916cb57775823d7437d2 的 Makefile 只有
  qoaplay/qoaconv 构建目标，无 test/check 目标；qoaconv 需第三方
  dr_mp3.h/dr_flac.h（上游注明可用宏开关移除），qoaplay 硬依赖
  sokol_audio.h + alsa/pthread，均不随源码分发且制品仓无对应包 →
  CLI 工具不打包（commands.json 不适用，与 qoi 先例一致）。上游测试
  计数为 0 属"上游不存在"，非"未运行"。自补消费者测试真实编译
  qoa.h（QOA_IMPLEMENTATION）并调用 qoa_encode/qoa_decode/
  qoa_write/qoa_read 公开 API。
upstream_test_count: 0
upstream_check_command: "（上游无自动化测试；Makefile 无 test/check 目标）"
upstream_test_in_build: false

# test_package 中自带的测试（消费者视角, R34: 真实调用公开 API）
test_package_tests:
  - file: test_qoa.c
    description: >
      消费者视角: 定义 QOA_IMPLEMENTATION 单编译单元真实编译 qoa.h，
      10 项断言：qoa_encode 缓冲/qoaf 文件魔数/长度下限/压缩有效
      （encoded < raw/2）/qoa_decode 缓冲/通道数/采样率/样本数/
      有损误差界（max abs err <= 2048）/qoa_write+qoa_read stdio 往返
    command: "./test_qoa"

assertion_count: 10
