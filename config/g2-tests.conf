# =============================================
# G2 功能测试配置 — verify-build.sh
# 格式: TEST_NAME=值<TAB>TEST_CMD=值<TAB>TEST_EXPECT=值
#
# 规则:
#   - 字段间用 TAB (\t) 分隔
#   - TEST_CMD 可包含任意 shell 命令（管道、引号、变量等）
#   - 特殊标记放在 TEST_CMD 中: @SKIP, @VERSION_ONLY
#   - TEST_EXPECT 为空则跳过正则匹配，仅检查 rc=0
#
# 特殊标记:
#   @SKIP         — 跳过此软件的功能测试
#   @VERSION_ONLY  — 仅执行 --version 检查
# =============================================

# --- 核心工具 ---
TEST_NAME=sed	TEST_CMD=echo hello world | "$DEFAULT_PREFIX/bin/sed" s/world/harmonyos/	TEST_EXPECT=hello harmonyos
TEST_NAME=coreutils	TEST_CMD=test -x "$DEFAULT_PREFIX/bin/ls" && "$DEFAULT_PREFIX/bin/ls" /tmp >/dev/null 2>&1 && echo OK	TEST_EXPECT=^OK$
TEST_NAME=gawk	TEST_CMD=echo 1 2 3 | "$DEFAULT_PREFIX/bin/gawk" "{print \$1+\$2+\$3}"	TEST_EXPECT=^6$
TEST_NAME=pkg-config	TEST_CMD="$DEFAULT_PREFIX/bin/pkg-config" --version	TEST_EXPECT=.

# --- 开发工具 ---
TEST_NAME=make	TEST_CMD="$DEFAULT_PREFIX/bin/make" --version | head -1	TEST_EXPECT=GNU Make
TEST_NAME=patch	TEST_CMD="$DEFAULT_PREFIX/bin/patch" --version | head -1	TEST_EXPECT=GNU patch

# --- 编程语言 ---
TEST_NAME=python3	TEST_CMD="$DEFAULT_PREFIX/bin/python3" --version 2>&1 | head -1	TEST_EXPECT=Python

# --- 库/框架 ---
TEST_NAME=openssl	TEST_CMD="$DEFAULT_PREFIX/bin/openssl" version | head -1	TEST_EXPECT=OpenSSL
TEST_NAME=curl	TEST_CMD="$DEFAULT_PREFIX/bin/curl" --version 2>&1 | head -1	TEST_EXPECT=curl
