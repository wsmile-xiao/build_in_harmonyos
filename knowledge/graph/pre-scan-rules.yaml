# pre-scan-rules.yaml — 预编译源码风险扫描规则集
# 闭环机制：编译中新发现的问题可通过 graph add 回填到此文件
# 格式：每条规则包含 pattern（grep 正则）+ scope_globs（搜索范围）+ severity
version: 1
last_updated: 2026-04-17

rules:
  # ── HMDFS 文件系统限制 ──
  - id: PSCAN-HMDFS-001
    category: hmdfs
    severity: critical
    pattern: '\bln\s+(-\w*s\w*\s|--symbolic\s)'
    scope_globs: ['Makefile*', 'makefile*', '*.mk']
    description: "Makefile 中的 ln -s 创建符号链接，HMDFS 不支持"
    solution_hint: "sed 's/ln -s/cp -a/g' 或 wrapper 脚本替代"
    kb_ref: "E018,E050,E073,E079,E080"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-HMDFS-002
    category: hmdfs
    severity: medium
    pattern: '\bchmod\b|\bchown\b|\bfchmod\b'
    scope_globs: ['*.c', '*.h']
    description: "源码中调用 chmod/chown，HMDFS 上可能无权限效果"
    solution_hint: "通常非阻塞，测试中可能需忽略"
    kb_ref: "E046"
    auto_generated: false
    hit_count: 0

  # ── 文件系统路径 ──
  - id: PSCAN-FS-001
    category: filesystem
    severity: medium
    pattern: '"/tmp[/"]'
    scope_globs: ['*.c', '*.h', '*.py', '*.sh']
    description: "/tmp 路径硬编码，HMDFS 上 /tmp 为只读 erofs"
    solution_hint: "改用 $TMPDIR 或 /data/local/tmp"
    kb_ref: "E002"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-PATH-001
    category: hardcoded_path
    severity: medium
    pattern: '"/etc/[^"]*"'
    scope_globs: ['*.c', '*.h']
    description: "源码中硬编码 /etc/ 路径，可能不被 --prefix 覆盖"
    solution_hint: "检查是否通过 configure --sysconfdir 或 #define 配置"
    auto_generated: false
    hit_count: 0

  # ── musl 兼容性 ──
  - id: PSCAN-MUSL-001
    category: musl_compat
    severity: critical
    pattern: '\bpthread_cancel\b'
    scope_globs: ['*.c', '*.h', '*.cc', '*.cpp']
    description: "pthread_cancel 在 musl/OHOS 上不可用"
    solution_hint: "#ifdef __OHOS__ 跳过 cancel，改用标志位+pthread_join"
    kb_ref: "E085,E127"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-MUSL-002
    category: musl_compat
    severity: critical
    pattern: '\bmremap\b'
    scope_globs: ['*.c', '*.h', '*.cc', '*.cpp']
    description: "mremap syscall 在 OHOS 上不可用"
    solution_hint: "#ifdef __OHOS__ 用 realloc 替代 mremap"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-MUSL-003
    category: musl_compat
    severity: high
    pattern: '\bppoll\b'
    scope_globs: ['*.c', '*.h', '*.cc', '*.cpp']
    description: "ppoll 在 OHOS 上不可用"
    solution_hint: "#ifdef __OHOS__ 用 poll 替代 ppoll"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-MUSL-004
    category: musl_compat
    severity: medium
    pattern: '\bsecure_getenv\b'
    scope_globs: ['*.c', '*.h']
    description: "secure_getenv 是 glibc 扩展，musl 未实现"
    solution_hint: "#define secure_getenv getenv（OHOS 无 setuid 场景）"
    kb_ref: "E081"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-MUSL-005
    category: musl_compat
    severity: medium
    pattern: '\bLIBINTL\b|\bENABLE_NLS\b|#include\s*<libintl\.h>'
    scope_globs: ['*']
    description: "检测 gettext/NLS 国际化，OHOS 缺少 libintl 开发库"
    solution_hint: "configure 加 --disable-nls 或 Makefile 中 ENABLE_NLS="
    kb_ref: "E015,E027"
    auto_generated: false
    hit_count: 0

  # ── 构建系统 ──
  - id: PSCAN-BUILD-001
    category: build_system
    severity: auto
    pattern: null
    check_type: file_exists
    check_targets: ['config.guess', 'config.sub']
    description: "检测 config.guess/config.sub 存在，autotools 项目需打补丁"
    solution_hint: "patch-autotools-ohos.pl 自动修复"
    kb_ref: "E007,E072"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-BUILD-002
    category: build_system
    severity: medium
    pattern: 'find_library\s*\(\s*\w+\s+m\b'
    scope_globs: ['CMakeLists.txt', '*.cmake']
    description: "CMake find_library 查找 libm，OHOS 无独立 libm"
    solution_hint: "set(LIBM \"\") 或改为 find_library(LIBM m) 不 REQUIRED"
    auto_generated: false
    hit_count: 0

  # ── 文档分析（标记给 AI 判断）──
  - id: PSCAN-DOC-001
    category: docs
    severity: info
    pattern: '(?:require|depends|need).*?(?:Linux|glibc|kernel\s+\d|GNU C)'
    scope_globs: ['README*', 'INSTALL*', 'NEWS*', 'CHANGES*', 'ChangeLog*']
    description: "文档中声明了 Linux/glibc 依赖，可能需要平台适配"
    solution_hint: "AI 读取相关文档判断具体风险"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-DOC-002
    category: docs
    severity: info
    pattern: null
    check_type: dir_exists
    check_targets: ['gnulib', 'lib/gnulib', 'gl']
    description: "检测到 gnulib 模块，可能包含 glibc 假设"
    solution_hint: "关注 E061, E062, E081 相关问题"
    kb_ref: "E061,E062,E081"
    auto_generated: false
    hit_count: 0

  # ── 测试风险 ──
  - id: PSCAN-TEST-001
    category: test_risk
    severity: low
    pattern: '\bsymlink\b|\breadlink\b|\bln\s+-s\b'
    scope_globs: ['test*', 'tests*', 't/*']
    description: "测试中使用符号链接，HMDFS 上可能失败"
    solution_hint: "加入 EXCLUDE_LIST 或跳过"
    kb_ref: "E018,E050"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-TEST-002
    category: test_risk
    severity: low
    pattern: '\bgetuid\b|\bgetgid\b|\bgeteuid\b'
    scope_globs: ['test*', 'tests*', 't/*', '*.test']
    description: "测试中检查 uid/gid，OHOS uid 范围与 Linux 不同"
    solution_hint: "已知平台限制，非功能缺陷"
    auto_generated: false
    hit_count: 0
