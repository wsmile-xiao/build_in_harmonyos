# pre-scan-rules.yaml — 预编译源码风险扫描规则集
# 闭环机制：编译中新发现的问题可通过 graph add 回填到此文件
# 格式：每条规则包含 pattern（grep 正则）+ scope_globs（搜索范围）+ severity
version: 1
last_updated: 2026-08-20

rules:
  # ── HMDFS 文件系统限制 ──
  - id: PSCAN-HMDFS-001
    category: hmdfs
    severity: critical
    pattern: '\bln\s+(-\w*s\w*\s|--symbolic\s)'
    scope_globs: ['Makefile*', 'makefile*', '*.mk']
    description: "Makefile 中的 ln -s 创建符号链接，HMDFS 不支持"
    solution_hint: "sed 's/ln -s/cp -a/g' 或 wrapper 脚本替代"
    kb_ref: "E018,E050,E073,E079,E080"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-HMDFS-002
    category: hmdfs
    severity: medium
    pattern: '\bchmod\b|\bchown\b|\bfchmod\b'
    scope_globs: ['*.c', '*.h']
    description: "源码中调用 chmod/chown，HMDFS 上可能无权限效果"
    solution_hint: "通常非阻塞，测试中可能需忽略"
    kb_ref: "E046"
    auto_generated: false
    hit_count: 0

  # ── 文件系统路径 ──
  - id: PSCAN-FS-001
    category: filesystem
    severity: medium
    pattern: '"/tmp[/"]'
    scope_globs: ['*.c', '*.h', '*.py', '*.sh']
    description: "/tmp 路径硬编码，HMDFS 上 /tmp 为只读 erofs"
    solution_hint: "改用 $TMPDIR 或 /data/local/tmp"
    kb_ref: "E002"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-PATH-001
    category: hardcoded_path
    severity: medium
    pattern: '"/etc/[^"]*"'
    scope_globs: ['*.c', '*.h']
    description: "源码中硬编码 /etc/ 路径，可能不被 --prefix 覆盖"
    solution_hint: "检查是否通过 configure --sysconfdir 或 #define 配置"
    auto_generated: false
    hit_count: 0

  # ── musl 兼容性 ──
  - id: PSCAN-MUSL-001
    category: musl_compat
    severity: critical
    pattern: '\bpthread_cancel\b'
    scope_globs: ['*.c', '*.h', '*.cc', '*.cpp']
    description: "pthread_cancel 在 musl/OHOS 上不可用"
    solution_hint: "#ifdef __OHOS__ 跳过 cancel，改用标志位+pthread_join"
    kb_ref: "E085,E127"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-MUSL-002
    category: musl_compat
    severity: critical
    pattern: '\bmremap\b'
    scope_globs: ['*.c', '*.h', '*.cc', '*.cpp']
    description: "mremap syscall 在 OHOS 上不可用"
    solution_hint: "#ifdef __OHOS__ 用 realloc 替代 mremap"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-MUSL-003
    category: musl_compat
    severity: high
    pattern: '\bppoll\b'
    scope_globs: ['*.c', '*.h', '*.cc', '*.cpp']
    description: "ppoll 在 OHOS 上不可用"
    solution_hint: "#ifdef __OHOS__ 用 poll 替代 ppoll"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-MUSL-004
    category: musl_compat
    severity: medium
    pattern: '\bsecure_getenv\b'
    scope_globs: ['*.c', '*.h']
    description: "secure_getenv 是 glibc 扩展，musl 未实现"
    solution_hint: "#define secure_getenv getenv（OHOS 无 setuid 场景）"
    kb_ref: "E081"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-MUSL-005
    category: musl_compat
    severity: medium
    pattern: '\bLIBINTL\b|\bENABLE_NLS\b|#include\s*<libintl\.h>'
    scope_globs: ['*']
    description: "检测 gettext/NLS 国际化，OHOS 缺少 libintl 开发库"
    solution_hint: "configure 加 --disable-nls 或 Makefile 中 ENABLE_NLS="
    kb_ref: "E015,E027"
    auto_generated: false
    hit_count: 0

  # ── 构建系统 ──
  - id: PSCAN-BUILD-001
    category: build_system
    severity: auto
    pattern: null
    check_type: file_exists
    check_targets: ['config.guess', 'config.sub']
    description: "检测 config.guess/config.sub 存在，autotools 项目需打补丁"
    solution_hint: "patch-autotools-ohos.pl 自动修复"
    kb_ref: "E007,E072"
    auto_generated: false
    hit_count: 1

  - id: PSCAN-BUILD-002
    category: build_system
    severity: medium
    pattern: 'find_library\s*\(\s*\w+\s+m\b'
    scope_globs: ['CMakeLists.txt', '*.cmake']
    description: "CMake find_library 查找 libm，OHOS 无独立 libm"
    solution_hint: "set(LIBM \"\") 或改为 find_library(LIBM m) 不 REQUIRED"
    auto_generated: false
    hit_count: 0

  # ── 文档分析（标记给 AI 判断）──
  - id: PSCAN-DOC-001
    category: docs
    severity: info
    pattern: '(?:require|depends|need).*?(?:Linux|glibc|kernel\s+\d|GNU C)'
    scope_globs: ['README*', 'INSTALL*', 'NEWS*', 'CHANGES*', 'ChangeLog*']
    description: "文档中声明了 Linux/glibc 依赖，可能需要平台适配"
    solution_hint: "AI 读取相关文档判断具体风险"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-DOC-002
    category: docs
    severity: info
    pattern: null
    check_type: dir_exists
    check_targets: ['gnulib', 'lib/gnulib', 'gl']
    description: "检测到 gnulib 模块，可能包含 glibc 假设"
    solution_hint: "关注 E061, E062, E081 相关问题"
    kb_ref: "E061,E062,E081"
    auto_generated: false
    hit_count: 0

  # ── 测试风险 ──
  - id: PSCAN-TEST-001
    category: test_risk
    severity: low
    pattern: '\bsymlink\b|\breadlink\b|\bln\s+-s\b'
    scope_globs: ['test*', 'tests*', 't/*']
    description: "测试中使用符号链接，HMDFS 上可能失败"
    solution_hint: "加入 EXCLUDE_LIST 或跳过"
    kb_ref: "E018,E050"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-TEST-002
    category: test_risk
    severity: low
    pattern: '\bgetuid\b|\bgetgid\b|\bgeteuid\b'
    scope_globs: ['test*', 'tests*', 't/*', '*.test']
    description: "测试中检查 uid/gid，OHOS uid 范围与 Linux 不同"
    solution_hint: "已知平台限制，非功能缺陷"
    auto_generated: false
    hit_count: 0

  # ── v12.5: linking / build-system / shell 域（对齐知识库高频错误域）──
  - id: PSCAN-LINK-001
    category: linking
    severity: high
    pattern: 'dlopen\s*\(\s*"/'
    scope_globs: ['*.c', '*.h', '*.cc', '*.cpp']
    description: "dlopen 硬编码绝对路径加载，OHOS 打包路径/sandbox 下大概率加载失败"
    solution_hint: "改为相对 soname（dlopen('libxxx.so.1')）或 $ORIGIN 相对路径"
    kb_ref: "E019"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-LINK-002
    category: linking
    severity: medium
    pattern: '-Wl,-rpath,\$\(PWD\)|-Wl,-rpath,/home|-Wl,-rpath,/tmp|-Wl,-rpath,/build'
    scope_globs: ['Makefile*', '*.mk', '*.am', 'CMakeLists.txt', '*.cmake']
    description: "rpath 指向构建机绝对路径，发布包在目标机上加载失败"
    solution_hint: "删除或改为 $ORIGIN 相对 rpath（-Wl,-rpath,'$$ORIGIN'）"
    kb_ref: "E019"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-BUILD-101
    category: build_system
    severity: high
    pattern: 'install\s*\(.*DESTINATION\s+/(etc|usr|opt|var)'
    scope_globs: ['CMakeLists.txt', '*.cmake']
    description: "CMake install 使用系统绝对路径 DESTINATION，绕过 --prefix"
    solution_hint: "改为相对路径 DESTINATION (etc/ share/) 由 CMAKE_INSTALL_PREFIX 接管"
    kb_ref: "E019"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-BUILD-102
    category: build_system
    severity: medium
    check_type: file_exists
    check_targets: ['config.guess']
    description: "config.guess 存在，老版本不识别 ohos 目标三元组，configure 直接失败"
    solution_hint: "替换为含 aarch64-unknown-linux-ohos 支持的新版 config.guess"
    kb_ref: "E007"
    auto_generated: false
    hit_count: 1

  - id: PSCAN-BUILD-103
    category: build_system
    severity: medium
    pattern: 'AM_GNU_GETTEXT.*0\.1[0-7]|AM_ICONV\b'
    scope_globs: ['configure.ac']
    description: "老版 gettext/iconv 宏在交叉编译下探测失败率高"
    solution_hint: "升级 gettext 宏或 --disable-nls 绕过"
    kb_ref: "E118"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-SHELL-001
    category: shell
    severity: medium
    pattern: '\[\[\s.*\]\]|\bstat -c\b|\breadlink -f\b'
    scope_globs: ['configure', 'configure.ac', 'Makefile*', '*.mk']
    description: "bash 专用语法/工具出现在可移植构建脚本中，OHOS 默认 sh 会失败"
    solution_hint: "改 POSIX 等价写法（[ ] + test、stat -f 检查、readlink 无 -f 用 realpath）"
    kb_ref: "E037"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-SHELL-002
    category: shell
    severity: high
    pattern: '^#!\s*/bin/bash'
    scope_globs: ['*.sh', 'configure*']
    description: "shebang 硬编码 /bin/bash，OHOS 无 bash 时脚本报 bad interpreter"
    solution_hint: "改 #!/usr/bin/env sh 或 POSIX sh 重写"
    kb_ref: "E037"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-GLIBC-001
    category: libc
    severity: medium
    pattern: '__GLIBC__|gnu/libc-version|__libc_start_main'
    scope_globs: ['*.c', '*.h', '*.cc', '*.cpp']
    description: "glibc 专用宏/头，musl 下未定义导致代码走错分支或链接失败"
    solution_hint: "#ifdef __OHOS__/__MUSL__ 分支处理，或用通用 POSIX 接口"
    kb_ref: "E020"
    auto_generated: false
    hit_count: 0

  - id: PSCAN-PATH-002
    category: filesystem
    severity: medium
    pattern: '\$HOME/\.|~/\.'
    scope_globs: ['configure', 'configure.ac', 'Makefile*', '*.mk']
    description: "构建脚本依赖 $HOME 点文件，HMDFS home 与构建 sandbox 行为不同"
    solution_hint: "改用可配置的 $(prefix)/etc 或环境变量注入"
    kb_ref: "E079"
    auto_generated: false
    hit_count: 0
