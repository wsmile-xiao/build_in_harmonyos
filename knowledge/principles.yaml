# 原则库 — 知识图谱 Layer 4 (Principles)
#
# 定义跨错误模式的通用约束规则。
# match_error_pattern() v3 引擎在生成修复方案后，
# 会用这些原则对候选方案进行过滤/拒绝/降级。
#
# 格式: 每条原则有 id, name, scope(适用模式列表), statement,
#       forbidden_patterns(自动检测+拒绝的正则列表)

principles:
  # ═══════════════════════════════════════════
  # Autotools 原则
  # ═══════════════════════════════════════════

  - id: P-AUTOTOOLS-001
    name: "禁止 --build/--host 绕过系统检测"
    severity: critical
    scope: [E007, E064]
    statement: >
      在鸿蒙上编译 autotools 项目时，严禁使用 --build= 或 --host= 参数
      让 configure 绕过 config.guess/config.sub 的系统类型检测。
      鸿蒙是**原生编译环境**（aarch64 架构，本地执行），不是交叉编译。
      使用这些参数会导致：
        1. configure 误判 cross_compiling=yes
        2. AC_RUN_IFELSE / AC_TRY_RUN 等运行时检测全部跳过
        3. 大量平台能力使用硬编码默认值（通常基于 Linux glibc）
        4. 生成的 config.h 与实际平台不匹配
        5. 后续链接、运行时出现难以排查的级联错误
      正确做法是修改 config.guess/config.sub 添加 HarmonyOS 检测分支。
    forbidden_patterns:
      - pattern: "--build=.*linux-|--host=.*linux-"
        auto_reject: true
        reason: "将鸿蒙伪装为 Linux，导致交叉编译误判"
        suggest: "使用 patch-autotools-ohos.pl 或下载最新 GNU config"
      - pattern: "--build=.*gnu|--host=.*gnu"
        auto_reject: true
        reason: "同上，任何 --build/--host 绕过都是错误的"
        suggest: "同上"

  - id: P-AUTOTOOLS-002
    name: "conftest 必须能正常执行"
    severity: critical
    scope: [E064, E061, E062, E063, E065]
    statement: >
      autotools configure 通过编译并执行 conftest 测试程序来检测平台能力。
      在鸿蒙上 conftest 首次执行可能被安全弹窗拦截。必须确保：
        1. 首次运行前先触发安全弹窗确认（手动执行一次任意二进制）
        2. 或使用 ac_cv_* 缓存变量预填充检测结果
        3. 绝不使用 --host 绕过（见 P-AUTOTOOLS-001）
    forbidden_patterns:
      - pattern: "cross.compiling=yes"
        auto_reject: false
        reason: "警告：configure 可能已进入交叉编译模式"
        suggest: "检查是否触发了安全弹窗超时"

  # ═══════════════════════════════════════════
  # 补丁质量原则
  # ═══════════════════════════════════════════

  - id: P-PATCH-001
    name: "修改生成文件必须保存为 .patch"
    severity: high
    scope: [E058, E059, E007, E008, E063]
    statement: >
      对 configure/Makefile/config.h 等 autotools **生成文件**的 sed 修改：
        - 如果源码有 configure.ac → 应修改 configure.ac 并重新生成（优先级①）
        - 如果只有 configure（上游 tarball）→ 直接修改 configure 并存为 .patch（优先级②）
        - **绝对不允许**只做 sed 不存 patch（下次 distclean 后丢失）
    forbidden_patterns:
      - pattern: "sed -i.*(configure|Makefile|config\\.h)"
        auto_reject: false
        reason: "警告：检测到对生成文件的 sed 操作，请确认已保存为 .patch"
        suggest: "检查 patches/ 目录是否有对应 .patch 文件"

  - id: P-PATCH-002
    name: "__OHOS__ 守卫是平台隔离的标准写法"
    severity: high
    scope: [E008, E011, E051, E060, E004, E020]
    statement: >
      所有鸿蒙适配代码必须使用 `#ifdef __OHOS__` 守卫。
      这是 clang 在鸿蒙平台上自动定义的宏，精确且唯一。
      禁止使用的替代写法：
        ❌ `#ifndef __linux__` — 排除了所有非 Linux 系统（BSD, macOS 等）
        ❌ `#if !defined(__GLIBC__)` — 排除了 musl 的其他使用者
        ❌ 硬编码路径如 `/data/service/hnp/` — 不可移植
    forbidden_patterns:
      - pattern: "#ifndef\\s*__linux__"
        auto_reject: true
        reason: "用 Linux 排除法做平台隔离，影响可上游化"
        suggest: "改为 #ifdef __OHOS__"
      - pattern: "#if.*!defined\\(__GLIBC__\\)"
        auto_reject: false
        reason: "建议改用 __OHOS__ 守卫（但 musl 兼容场景可接受）"
        suggest: "评估是否可以改为 #ifdef __OHOS__"

  - id: P-PATCH-003
    name: "补丁必须可向上游提交"
    severity: medium
    scope: [E058, E059, E060, E008, E039]
    statement: >
      所有源码修改应遵循上游编码风格：
        1. 使用标准 POSIX/C99 特性，避免 GNU 扩展依赖
        2. 注释用英文（HarmonyOS: <reason> 格式）
        3. 不引入鸿蒙特有的 SDK/API 依赖（除非绝对必要）
        4. 守卫条件尽可能精确（__OHOS__ > musl 检测 > Linux 检测）

  # ═══════════════════════════════════════════
  # 编译参数原则
  # ═══════════════════════════════════════════

  - id: P-CFLAGS-001
    name: "CFLAGS hack 必须记录为技术债务"
    severity: medium
    scope: [E005, E011, E032, E033, E063]
    statement: >
      通过 CFLAGS/CPPFLAGS/LDFLAGS 强制添加编译参数来绕过错误时：
        1. 必须在 PROGRESS.md 记录为"技术债务"
        2. 注明期望的上游修复方式（源码级修改）
        3. 下个版本升级时应尝试移除此 hack
      这类 hack 包括但不限于：-fPIC, -D_GNU_SOURCE, -Wno-error=*, -D__OHOS__
    forbidden_patterns: []

  - id: P-CFLAGS-002
    name: "-Werror 禁用应精准到具体 warning 类别"
    severity: low
    scope: [E063]
    statement: >
      禁止全局禁用 -Werror（如 CFLAGS="-Wno-error"）。
      应精准到具体的 warning 类别（如 -Wno-error=int-conversion）。
      全局禁用会掩盖真正的编译错误。

  # ═══════════════════════════════════════════
  # 运行时安全原则
  # ═══════════════════════════════════════════

  - id: P-RUNTIME-001
    name: "未实现 syscall 必须在调用前拦截"
    severity: critical
    scope: [E051]
    statement: >
      鸿蒙内核对未实现的 syscall 发送 SIGSYS（signal 31）。
      关键发现：setreuid/setregid 的 SIGSYS **不可被 signal handler 捕获**，
      进程直接终止（exit code 159）。
      因此**信号处理方案完全不可行**，必须在源码层面用 #ifdef __OHOS__
      在 syscall 调用前直接返回 ENOSYS。
    forbidden_patterns:
      - pattern: "signal\\(SIGSYS"
        auto_reject: true
        reason: "SIGSYS handler 在 setreuid/setregid 上不会触发，进程仍会被杀"
        suggest: "使用 #ifdef __OHOS__ 在调用前 return ENOSYS"

  - id: P-RUNTIME-002
    name: "RPATH 设置必须覆盖所有 NEEDED 库"
    severity: high
    scope: [E042, E019, E052]
    statement: >
      打包可移植包时，RPATH 设置必须覆盖：
        1. 主程序的直接 NEEDED
        2. 共享库的传递性 NEEDED
        3. 扩展模块（lib-dynload/*.so）的 NEEDED（最容易被遗漏）
      遗漏任何一层都会在部署目标机上出现 ImportError。

  # ═══════════════════════════════════════════
  # 工具链原则
  # ═══════════════════════════════════════════

  - id: P-TOOLCHAIN-001
    name: "必须使用 LLVM 工具链"
    severity: high
    scope: [E012, E053]
    statement: >
      鸿蒙 SDK 只提供 LLVM/Clang 工具链，没有 GCC/binutils。
      所有 ar/ranlib/nm/strip/objcopy 必须使用 llvm-* 版本。
      C++ 编译器是 clang++（无 cc1plus）。
    forbidden_patterns:
      - pattern: "\\bar\\b(?!llvm-ar)"
        auto_reject: false
        reason: "警告：检测到 ar 调用，确认使用的是 llvm-ar"
        suggest: "export AR=llvm-ar RANLIB=llvm-ranlib NM=llvm-nm"

---
